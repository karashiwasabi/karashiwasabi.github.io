<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌枕紀行 — 写真あて検討＆確定マップ管理ボード</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-page: #f3f0e8;
      --bg-card: #ffffff;
      --header-bg: #1e242b;
      --border-soft: #dcd5c7;
      --text-main: #1e293b;
      --text-sub: #57606a;
      --warn-amber: #d97706;
      --warn-bg: #fffbeb;
      --ok-green: #15803d;
      --ok-bg: #f0fdf4;
      --blue-main: #1d4ed8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.55;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2500;
      background: var(--header-bg);
      color: #ffffff;
      padding: 12px 20px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
    }
    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #fde68a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-top {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-top:hover { background: #475569; }
    .btn-export {
      background: #f59e0b;
      color: #111827;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .btn-export:hover { background: #fbbf24; }

    .kpi-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }
    .kpi-tab {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kpi-tab:hover { background: rgba(255, 255, 255, 0.15); }
    .kpi-tab.active {
      background: #ffffff;
      color: #0f172a;
      border-color: #fbbf24;
      box-shadow: 0 0 0 2px #fbbf24;
    }
    .kpi-label { font-size: 0.8rem; font-weight: 700; }
    .kpi-sub { font-size: 0.7rem; opacity: 0.8; display: block; margin-top: 2px; }
    .kpi-num { font-size: 1.25rem; font-weight: 800; margin-left: 8px; }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filter-bar select, .filter-bar input[type="search"] {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.83rem;
    }
    .filter-bar input[type="search"] { flex: 1 1 250px; }
    .filter-count {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 700;
      padding: 0 6px;
    }

    .main-wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px 20px 60px;
    }

    .overview-map-box {
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .overview-map-box.hidden { display: none; }
    #overviewMap { width: 100%; height: 320px; background: #e5e0d5; }
    .leaflet-tile-pane { filter: sepia(0.14) contrast(1.04); }
    .map-legend {
      padding: 7px 14px;
      font-size: 0.78rem;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: #475569;
    }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

    .workbench-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .wb-row {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 6px solid var(--warn-amber);
      border-radius: 10px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .wb-row.status-has_photo { border-left-color: var(--ok-green); }
    .wb-row.status-empty_pin { border-left-color: #64748b; }
    .wb-row.status-area_river { border-left-color: #2563eb; }
    .wb-row.decided-row {
      background: #f7fdf9;
      box-shadow: 0 0 0 2px #16a34a;
    }
    @media (max-width: 980px) {
      .wb-row { grid-template-columns: 1fr; }
    }

    /* 左カラム：現在の状態＆チェック連動プレビュー */
    .wb-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .place-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .place-title {
      font-family: "Yu Mincho", "MS PMincho", serif;
      font-size: 1.18rem;
      font-weight: 700;
      color: #0f172a;
    }
    .province-badge {
      font-size: 0.72rem;
      background: #f1f5f9;
      color: #334155;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      white-space: nowrap;
    }
    .modern-addr { font-size: 0.78rem; color: var(--text-sub); }
    .appear-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .appear-tag {
      font-size: 0.72rem;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 4px;
      padding: 1px 7px;
      text-decoration: none;
      font-weight: 700;
    }
    .appear-tag.hyakunin {
      background: #f3e8ff;
      color: #6b21a8;
      border-color: #d8b4fe;
    }

    .current-visual-box {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      padding: 8px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .current-photos-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 6px;
    }
    .cur-photo-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      height: 128px;
      background: #111;
      border: 2px solid #16a34a;
      transition: opacity 0.15s, filter 0.15s;
    }
    .cur-photo-item.layer-off {
      opacity: 0.38;
      filter: grayscale(0.9);
      border-color: #dc2626;
    }
    .cur-photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      display: block;
    }
    .cur-photo-tag {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.75);
    }
    .cur-photo-toggle {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
      background: rgba(21, 128, 61, 0.9);
      border: none;
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
    }
    .cur-photo-item.layer-off .cur-photo-toggle {
      background: rgba(220, 38, 38, 0.92);
    }

    .missing-alert {
      background: var(--warn-bg);
      border: 1px dashed #f59e0b;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 0.78rem;
      color: #92400e;
    }
    .gmap-status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: #334155;
      background: #f1f5f9;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid #e2e8f0;
    }
    .gmap-status-line.layer-off {
      opacity: 0.55;
      text-decoration: line-through;
      background: #fef2f2;
      border-color: #fecaca;
    }
    .gmap-preview-frame {
      width: 100%;
      height: 170px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      margin-top: 4px;
    }

    /* 右カラム：レイヤー別チェックボックス ＆ 候補検索 */
    .wb-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 1px solid #e2e8f0;
      padding-left: 16px;
    }
    @media (max-width: 980px) {
      .wb-right { border-left: none; border-top: 1px solid #e2e8f0; padding-left: 0; padding-top: 12px; }
    }

    .layer-check-panel {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .layer-check-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .layer-chk-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.77rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      user-select: none;
      transition: all 0.12s;
    }
    .layer-chk-label:hover { border-color: #64748b; }
    .layer-chk-label input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #15803d;
      cursor: pointer;
    }
    .layer-chk-label.checked {
      background: #ecfdf5;
      border-color: #16a34a;
      color: #14532d;
    }
    .layer-chk-label.disabled-layer {
      opacity: 0.45;
      cursor: not-allowed;
      background: #f1f5f9;
    }
    .state-pill {
      font-size: 0.66rem;
      padding: 1px 5px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #475569;
      font-weight: 700;
    }
    .layer-chk-label.checked .state-pill {
      background: #bbf7d0;
      color: #14532d;
    }
    .state-pill.off-diff {
      background: #fee2e2;
      color: #b91c1c;
    }

    .confirm-ok-btn {
      margin-left: auto;
      background: #ffffff;
      color: #334155;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .confirm-ok-btn.active {
      background: #15803d;
      color: #ffffff;
      border-color: #15803d;
    }
    .reset-row-btn {
      background: transparent;
      color: #64748b;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .reset-row-btn:hover { background: #e2e8f0; }

    .diff-summary-line {
      font-size: 0.76rem;
      color: #15803d;
      font-weight: 700;
      padding-top: 2px;
    }

    .search-box-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: #f8fafc;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .search-box-row input[type="text"] {
      flex: 1 1 200px;
      padding: 5px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.8rem;
    }
    .btn-live-search {
      background: var(--blue-main);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-live-search:hover { opacity: 0.92; }
    .ext-search-link {
      font-size: 0.74rem;
      color: var(--blue-main);
      text-decoration: none;
      font-weight: 700;
      padding: 4px 6px;
    }
    .ext-search-link:hover { text-decoration: underline; }

    .kw-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      font-size: 0.74rem;
      color: #64748b;
    }
    .kw-chip {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.73rem;
      cursor: pointer;
      font-weight: 600;
    }
    .kw-chip:hover { background: #dbeafe; }

    .cand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 8px;
    }
    .cand-card {
      border: 2px solid #e2e8f0;
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      transition: transform 0.1s, border-color 0.1s;
    }
    .cand-card.picked {
      border-color: #16a34a;
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.3);
    }
    .cand-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      background: #111;
      cursor: zoom-in;
    }
    .cand-meta {
      padding: 5px 6px;
      font-size: 0.7rem;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: space-between;
    }
    .cand-title {
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cand-pick-btn {
      width: 100%;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px;
      font-size: 0.71rem;
      font-weight: 700;
      cursor: pointer;
    }
    .cand-card.picked .cand-pick-btn { background: #16a34a; }

    .memo-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .memo-input-row input {
      flex: 1;
      padding: 5px 9px;
      font-size: 0.78rem;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background: #fff;
    }

    .mini-action-btn {
      background: #475569;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    .mini-action-btn:hover { background: #334155; }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 6000;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal-panel {
      background: #fff;
      border-radius: 10px;
      max-width: 820px;
      width: 100%;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
    }
    .modal-panel textarea {
      width: 100%;
      height: 340px;
      font-family: monospace;
      font-size: 0.82rem;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .lightbox-img {
      max-width: 94vw;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="top-bar">
      <div class="brand-title">
        <span>🛠️ 歌枕紀行 — 写真あて検討＆確定マップ管理ボード</span>
      </div>
      <div class="top-actions">
        <button type="button" class="btn-top" onclick="autoSearchVisibleMissing()">⚡ 表示中の未設定地点を一括ライブ検索</button>
        <button type="button" class="btn-top" onclick="toggleOverviewMap()">🗺️ 全国ピン分布地図 表示/隠す</button>
        <button type="button" class="btn-export" id="exportBtn" onclick="openExportModal()">📋 検討結果・採用リストを出力 (<span id="decidedCount">0</span>件)</button>
        <a class="btn-top" href="index.html" target="_blank">📖 おくのほそ道</a>
        <a class="btn-top" href="hyakunin.html" target="_blank">🍁 小倉百人一首</a>
        <a class="btn-top" href="manyoshu.html" target="_blank">🌿 万葉集</a>
      </div>
    </div>

    <div class="kpi-tabs" id="kpiTabs">
      <button type="button" class="kpi-tab active" data-group="gmap_only" onclick="selectGroupTab('gmap_only')">
        <div>
          <span class="kpi-label">🚨 Googleマップのみ（写真なし）</span>
          <span class="kpi-sub">どうやって画像をあてるか最優先で検討</span>
        </div>
        <span class="kpi-num" id="cnt-gmap_only">0</span>
      </button>
      <button type="button" class="kpi-tab" data-group="empty_pin" onclick="selectGroupTab('empty_pin')">
        <div>
          <span class="kpi-label">⚫ 写真・マップともOFF</span>
          <span class="kpi-sub">引き合い地名など（必要なら追加）</span>
        </div>
        <span class="kpi-num" id="cnt-empty_pin">0</span>
      </button>
      <button type="button" class="kpi-tab" data-group="has_photo" onclick="selectGroupTab('has_photo')">
        <div>
          <span class="kpi-label">✅ 写真・浮世絵 確定済み</span>
          <span class="kpi-sub">名勝・個別Wikiの重複整理や差替もここ</span>
        </div>
        <span class="kpi-num" id="cnt-has_photo">0</span>
      </button>
      <button type="button" class="kpi-tab" data-group="all_pins" onclick="selectGroupTab('all_pins')">
        <div>
          <span class="kpi-label">📍 全地点ピン通し一覧</span>
          <span class="kpi-sub">旅程順・歌番号順で全地点を俯瞰</span>
        </div>
        <span class="kpi-num" id="cnt-all_pins">0</span>
      </button>
    </div>

    <div class="filter-bar">
      <select id="workFilter" onchange="renderBoard()">
        <option value="all">作品：すべて</option>
        <option value="おくのほそ道">作品：おくのほそ道（旅程順）</option>
        <option value="小倉百人一首">作品：小倉百人一首（歌番号順）</option>
        <option value="万葉集">作品：万葉集（歌番号順）</option>
      </select>
      <select id="decisionFilter" onchange="renderBoard()">
        <option value="all">検討状態：すべて</option>
        <option value="undecided">未検討のみ表示</option>
        <option value="decided">変更・確認済みのみ表示</option>
      </select>
      <input type="search" id="searchBox" placeholder="地名・現代住所・神社仏閣名・章段タイトルで絞り込み..." oninput="renderBoard()" />
      <span class="filter-count" id="showingLabel">0件表示中</span>
    </div>
  </div>
</header>

<div class="main-wrap">
  <section class="overview-map-box hidden" id="overviewMapBox">
    <div id="overviewMap"></div>
    <div class="map-legend">
      <span><i class="dot" style="background:#dc2626;"></i>🚨 Googleマップのみ（写真未設定）</span>
      <span><i class="dot" style="background:#475569;"></i>⚫ 写真・マップともOFF</span>
      <span><i class="dot" style="background:#16a34a;"></i>✅ 写真・浮世絵 確定済み</span>
      <span>※ピンをクリックすると該当行へスクロールします</span>
    </div>
  </section>

  <div class="workbench-list" id="workbenchList"></div>
</div>

<!-- 画像拡大ライトボックス -->
<div class="modal-bg" id="lightboxModal" onclick="closeLightbox()">
  <div style="text-align:center;">
    <img id="lightboxImg" class="lightbox-img" src="" alt="" />
    <div id="lightboxCap" style="color:#fff; margin-top:8px; font-size:0.9rem;"></div>
  </div>

// 各アイテムの初期レイヤーON/OFF状態を返す
function getDefaultFlags(it) {
  return {
    fukeichi: Boolean(it.fukeichi_active),
    wiki: Boolean(it.wiki_active),
    ukiyoe: Boolean(it.ukiyoe_active),
    ai: false,
    gmap: Boolean(it.gmap_active)
  };
}

// 旧フォーマットで保存されていたデータがあればチェックボックス形式へ自動マイグレーション
function ensureMigratedRecord(key) {
  const it = ITEM_BY_KEY[key];
  if (!it) return null;
  const def = getDefaultFlags(it);
  let rec = decisions[key];
  if (!rec) return null;

  if (!rec.flags) {
    const flags = Object.assign({}, def);
    let confirmed = Boolean(rec.confirmed);
    if (rec.mode === 'wiki_pick' || rec.fileKey) {
      flags.wiki = true;
    } else if (rec.mode === 'ukiyoe') {
      flags.ukiyoe = true;
    } else if (rec.mode === 'ai_gen') {
      flags.ai = true;
    } else if (rec.mode === 'keep_gmap') {
      confirmed = true;
    } else if (rec.mode === 'none') {
      // 名勝と個別が両方ある地点で「画像不要」を押していた場合は個別WikiのOFFとして引き継ぐ
      if (def.fukeichi && def.wiki) {
        flags.wiki = false;
      } else {
        flags.wiki = false;
        flags.ukiyoe = false;
        confirmed = true;
      }
    }
    rec = {
      flags: flags,
      confirmed: confirmed,
      fileKey: rec.fileKey || '',
      thumbUrl: rec.thumbUrl || '',
      sourceLabel: rec.sourceLabel || '',
      memo: rec.memo || ''
    };
    decisions[key] = rec;
  }
  return rec;
}

Object.keys(decisions).forEach(k => ensureMigratedRecord(k));

function getEffectiveFlags(it) {
  const rec = decisions[it.key];
  if (rec && rec.flags) {
    return Object.assign(getDefaultFlags(it), rec.flags);
  }
  return getDefaultFlags(it);
}

function hasFlagDiff(it, flags) {
  const def = getDefaultFlags(it);
  return (
    Boolean(flags.fukeichi) !== def.fukeichi ||
    Boolean(flags.wiki) !== def.wiki ||
    Boolean(flags.ukiyoe) !== def.ukiyoe ||
    Boolean(flags.ai) !== def.ai ||
    Boolean(flags.gmap) !== def.gmap
  );
}

function isItemDecided(it) {
  const rec = decisions[it.key];
  if (!rec) return false;
  const flags = getEffectiveFlags(it);
  return Boolean(hasFlagDiff(it, flags) || rec.fileKey || rec.memo || rec.confirmed);
}

// 変更内容の人間向け要約文を生成
function describeItemDecision(it) {
  const rec = decisions[it.key];
  if (!rec) return '';
  const def = getDefaultFlags(it);
  const flags = getEffectiveFlags(it);
  const diffs = [];

  if (def.fukeichi !== flags.fukeichi) diffs.push(flags.fukeichi ? '🏞️名勝WikiをON' : '🏞️名勝WikiをOFF');
  if (rec.fileKey && flags.wiki) {
    diffs.push(`${it.wiki_img ? '📷個別Wikiを差替' : '📷個別Wikiに新規採用'} (File:${rec.fileKey})`);
  } else if (def.wiki !== flags.wiki) {
    diffs.push(flags.wiki ? '📷個別WikiをON（要画像選択）' : '📷個別WikiをOFF');
  }
  if (def.ukiyoe !== flags.ukiyoe) diffs.push(flags.ukiyoe ? '🎨浮世絵・古図をON' : '🎨浮世絵をOFF');
  if (flags.ai) diffs.push('🖌️AI情景イメージ生成をON');
  if (def.gmap !== flags.gmap) diffs.push(flags.gmap ? '📍GoogleマップをON' : '📍GoogleマップをOFF');
  if (rec.memo) diffs.push(`📝メモ: ${rec.memo}`);

  const activeNames = [];
  if (flags.fukeichi) activeNames.push('🏞️名勝Wiki');
  if (flags.wiki) activeNames.push('📷個別Wiki');
  if (flags.ukiyoe) activeNames.push('🎨浮世絵');
  if (flags.ai) activeNames.push('🖌️AI情景');
  if (flags.gmap) activeNames.push('📍Googleマップ');
  const finalStr = activeNames.length > 0 ? activeNames.join(' ＋ ') : '解説テキストのみ（画像・GMapともOFF）';

  if (diffs.length === 0 && rec.confirmed) {
    return `✅ 現状維持で確定（表示：${finalStr}）`;
  }
  if (diffs.length > 0) {
    return `✏️ ${diffs.join(' ／ ')}　👉 最終表示：${finalStr}`;
  }
  return '';
}

function escapeHtml(s) {

  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

  const it = ITEM_BY_KEY[key];
  if (!it) return;
  const rec = getOrCreateRecord(key);
  const nextVal = (explicitBool !== undefined) ? Boolean(explicitBool) : !rec.flags[layerName];
  rec.flags[layerName] = nextVal;

  // 個別Wikiのチェックを外したときは、仮選択していた新候補画像も解除できるように維持しつつOFF表示
  cleanupIfDefault(key);
  saveDecisions();
  rerenderSingleRow(it);
}

// 変更なしのまま「この構成でOK」と確認済みにするトグル
function toggleConfirmUnchanged(key, seq) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  const rec = getOrCreateRecord(key);
  rec.confirmed = !rec.confirmed;
  cleanupIfDefault(key);
  saveDecisions();
  rerenderSingleRow(it);
}

function resetRowDecision(key, seq) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  delete decisions[key];
  saveDecisions();
  rerenderSingleRow(it);
}

function setDecisionMemo(key, seq, text) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  const rec = getOrCreateRecord(key);
  rec.memo = text.trim();
  cleanupIfDefault(key);
  saveDecisions();
  rerenderSingleRow(it);
}

function pickCandidateImage(key, seq, fileKey, thumbUrl, sourceLabel) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  const rec = getOrCreateRecord(key);
  if (rec.fileKey === fileKey) {
    rec.fileKey = '';
    rec.thumbUrl = '';
    rec.sourceLabel = '';
    if (!it.wiki_img) {
      rec.flags.wiki = false;
    }
  } else {
    rec.fileKey = fileKey;
    rec.thumbUrl = thumbUrl;
    rec.sourceLabel = sourceLabel;
    rec.flags.wiki = true; // 候補写真を選んだら自動的に「📷 個別Wiki」をONにする
  }
  cleanupIfDefault(key);
  saveDecisions();
  rerenderSingleRow(it);
}

function isExcludedFile(name) {
  if (!name) return true;
  return /([.]svg|[.]pdf|[.]ogg|[.]webm|locator|location_map|map_of|relief_map|flag_of|emblem|symbol|coat_of_arms|commons-logo|disambig|ambox|prefecture|municipality|市章|町章|県章|紋章|位置図)/i.test(name);
}

async function runLiveImageSearch(key, seq, customQuery) {
  const inputEl = document.getElementById('q-input-' + seq);
  const query = (customQuery !== undefined ? customQuery : (inputEl ? inputEl.value : key)).trim();
  if (!query) return;
  if (inputEl) inputEl.value = query;

  const gridEl = document.getElementById('cand-grid-' + seq);
  if (gridEl) {
    gridEl.innerHTML = `<div style="grid-column:1/-1; font-size:0.78rem; color:#1d4ed8; padding:6px;">🔍 「${escapeHtml(query)}」で Wikimedia Commons / Wikipedia の写真を検索中...</div>`;
  }

  const found = [];
  const seen = new Set();

  // 1. 日本語版Wikipediaの記事内画像を検索
  try {
    const wpUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(query)}&prop=pageimages|images&pithumbsize=${COMMONS_THUMB_PX}&imlimit=${WIKI_PAGE_IMAGES_LIMIT}&redirects=1&format=json&origin=*`;
    const wpRes = await fetch(wpUrl);
    if (wpRes.ok) {
      const wpData = await wpRes.json();
      const pages = wpData.query && wpData.query.pages ? Object.values(wpData.query.pages) : [];
      const fileTitles = [];
      pages.forEach(pg => {
        if (pg.pageimage && !isExcludedFile(pg.pageimage)) fileTitles.push('File:' + pg.pageimage);
        if (pg.images) {
          pg.images.forEach(im => {
            if (im.title && !isExcludedFile(im.title) && !fileTitles.includes(im.title)) {
              fileTitles.push(im.title);
            }
          });
        }
      });
      if (fileTitles.length > 0) {
        const iiUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileTitles.slice(0, MAX_CANDIDATE_THUMBS).join('|'))}&prop=imageinfo&iiprop=url&iiurlwidth=${COMMONS_THUMB_PX}&format=json&origin=*`;
        const iiRes = await fetch(iiUrl);
        if (iiRes.ok) {
          const iiData = await iiRes.json();
          const iiPages = iiData.query && iiData.query.pages ? Object.values(iiData.query.pages) : [];
          iiPages.forEach(pg => {
            if (pg.imageinfo && pg.imageinfo[0]) {
              const fk = (pg.title || '').replace(/^(File|ファイル):/i, '').trim();
              const tUrl = pg.imageinfo[0].thumburl || pg.imageinfo[0].url;
              if (fk && tUrl && !isExcludedFile(fk) && !seen.has(fk)) {
                seen.add(fk);
                found.push({ fileKey: fk, thumbUrl: tUrl, fullUrl: pg.imageinfo[0].url || tUrl, source: `Wiki:${query}` });
              }
            }
          });
        }
      }
    }
  } catch (e) {}

  // 2. Wikimedia Commons 全文画像検索（不足分を補完）
  if (found.length < MAX_CANDIDATE_THUMBS) {
    try {
      const remain = MAX_CANDIDATE_THUMBS - found.length;
      const cmUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap ' + query)}&gsrnamespace=6&gsrlimit=${remain + COMMONS_EXTRA_BUFFER}&prop=imageinfo&iiprop=url&iiurlwidth=${COMMONS_THUMB_PX}&format=json&origin=*`;
      const cmRes = await fetch(cmUrl);
      if (cmRes.ok) {
        const cmData = await cmRes.json();
        const cmPages = cmData.query && cmData.query.pages ? Object.values(cmData.query.pages) : [];
        cmPages.forEach(pg => {
          if (found.length >= MAX_CANDIDATE_THUMBS) return;
          if (pg.imageinfo && pg.imageinfo[0]) {
            const fk = (pg.title || '').replace(/^(File|ファイル):/i, '').trim();
            const tUrl = pg.imageinfo[0].thumburl || pg.imageinfo[0].url;
            if (fk && tUrl && !isExcludedFile(fk) && !seen.has(fk)) {
              seen.add(fk);
              found.push({ fileKey: fk, thumbUrl: tUrl, fullUrl: pg.imageinfo[0].url || tUrl, source: `Commons:${query}` });
            }
          }
        });
      }
    } catch (e) {}
  }

  liveCandidatesCache[key] = { query: query, list: found };
  renderCandidateGrid(key, seq);
}

function renderCandidateGrid(key, seq) {
  const gridEl = document.getElementById('cand-grid-' + seq);
  if (!gridEl) return;
  const cached = liveCandidatesCache[key];
  const item = ITEM_BY_KEY[key];
  const rec = decisions[key] || {};

  let list = cached ? cached.list : [];
  if (!cached && item && item.saved_wiki_candidates && item.saved_wiki_candidates.length > 0) {
    list = item.saved_wiki_candidates.slice(0, MAX_CANDIDATE_THUMBS).map(fk => ({
      fileKey: fk,
      thumbUrl: `https://ja.wikipedia.org/wiki/Special:FilePath/${encodeURIComponent(fk)}?width=${COMMONS_THUMB_PX}`,
      fullUrl: `https://ja.wikipedia.org/wiki/Special:FilePath/${encodeURIComponent(fk)}`,
      source: '既存候補'
    }));
  }

  if (!cached && list.length === 0) {
    gridEl.innerHTML = '';
    return;
  }
  if (cached && list.length === 0) {
    gridEl.innerHTML = `<div style="grid-column:1/-1; font-size:0.77rem; color:#b45309; background:#fffbeb; padding:8px 10px; border-radius:6px; border:1px solid #fde68a;">「${escapeHtml(cached.query)}」では風景写真が見つかりませんでした。水色の関連ワードチップを押すか、別の神社名・市町村名で検索してみてください。</div>`;
    return;
  }

  const safeKey = key.replace(/'/g, "\'");
  gridEl.innerHTML = list.map(c => {
    const isPicked = rec.fileKey === c.fileKey;
    const safeFk = c.fileKey.replace(/'/g, "\'");
    const safeThumb = c.thumbUrl.replace(/'/g, "\'");
    const safeFull = (c.fullUrl || c.thumbUrl).replace(/'/g, "\'");
    const safeSrc = (c.source || '').replace(/'/g, "\'");
    const btnText = isPicked ? '✓ 個別Wikiに選択中' : (item && item.wiki_img ? '🔄 個別Wikiをこれに差替' : '📷 個別Wikiに採用');
    return `
      <div class="cand-card ${isPicked ? 'picked' : ''}">
        <img src="${escapeHtml(c.thumbUrl)}" alt="${escapeHtml(c.fileKey)}" loading="lazy" onclick="openLightbox('${safeFull}', 'File:${safeFk}')" title="クリックで拡大確認" />
        <div class="cand-meta">
          <div class="cand-title" title="${escapeHtml(c.fileKey)}">${escapeHtml(c.fileKey)}</div>
          <button type="button" class="cand-pick-btn" onclick="pickCandidateImage('${safeKey}', ${seq}, '${safeFk}', '${safeThumb}', '${safeSrc}')">
            ${btnText}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

async function autoSearchVisibleMissing() {
  const filtered = getFilteredItems().filter(it => !liveCandidatesCache[it.key] && it.status_group !== 'has_photo');
  const targets = filtered.slice(0, AUTO_BATCH_SEARCH_LIMIT);
  for (const it of targets) {
    const firstKw = (it.search_keywords && it.search_keywords[0]) || it.key;
    await runLiveImageSearch(it.key, it.seq, firstKw);
  }
}

function getFilteredItems() {
  const workVal = document.getElementById('workFilter').value;
  const decVal = document.getElementById('decisionFilter').value;
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();

  let list = ITEMS.filter(it => {
    if (currentGroup === 'gmap_only' && it.status_group !== 'gmap_only') return false;
    if (currentGroup === 'empty_pin' && it.status_group !== 'empty_pin') return false;
    if (currentGroup === 'has_photo' && it.status_group !== 'has_photo') return false;
    if (currentGroup === 'all_pins' && !it.is_pin) return false;

    if (workVal !== 'all' && !it.works.includes(workVal)) return false;

    const hasDec = isItemDecided(it);
    if (decVal === 'undecided' && hasDec) return false;
    if (decVal === 'decided' && !hasDec) return false;

    if (q) {
      const hay = [
        it.key,
        it.label,
        it.modern,
        it.province,
        it.wiki_title,
        it.gmap_spot_name,
        ...(it.search_keywords || []),
        ...it.appearances.map(a => a.section_title)
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (workVal === 'おくのほそ道') {
    list.sort((a, b) => a.order_v1 - b.order_v1);
  } else if (workVal === '小倉百人一首') {
    list.sort((a, b) => a.order_v2 - b.order_v2);
  } else if (workVal === '万葉集') {
    list.sort((a, b) => a.order_v3 - b.order_v3);
  } else {
    list.sort((a, b) => a.order_v1 - b.order_v1 || a.order_v2 - b.order_v2 || a.order_v3 - b.order_v3 || a.seq - b.seq);
  }
  return list;
}

function refreshMapPins() {
  pinsLayer.clearLayers();
  const list = getFilteredItems();
  list.forEach(it => {
    if (!it.is_pin || it.lat === null || it.lng === null) return;
    let color = '#16a34a';
    if (it.status_group === 'gmap_only') color = '#dc2626';
    else if (it.status_group === 'empty_pin') color = '#475569';
    const m = L.circleMarker([it.lat, it.lng], {
      radius: PIN_MARKER_RADIUS_PX,
      fillColor: color,
      color: '#ffffff',
      weight: 1.5,
      fillOpacity: 0.92
    }).addTo(pinsLayer);
    m.bindTooltip(`${it.key}（${it.modern}）`);
    m.on('click', () => {
      const row = document.getElementById('row-' + it.seq);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
}

  const wikiPill = rec.fileKey ? '新画像選択' : (it.wiki_img ? (flags.wiki ? '登録済' : 'OFF予定') : (flags.wiki ? '追加予定' : '未登録'));

function rerenderSingleRow(it) {
  const row = document.getElementById('row-' + it.seq);
  if (!row) {
    renderBoard();
    return;
  }
  const decided = isItemDecided(it);
  row.className = `wb-row status-${it.status_group} ${decided ? 'decided-row' : ''}`;
  row.innerHTML = buildRowInnerHtml(it);
  renderCandidateGrid(it.key, it.seq);
}

function renderBoard() {
  updateCounts();
  const list = getFilteredItems();
  document.getElementById('showingLabel').textContent = `${list.length} 件を表示中`;
  if (!document.getElementById('overviewMapBox').classList.contains('hidden')) {
    refreshMapPins();
  }

  const container = document.getElementById('workbenchList');
  container.innerHTML = '';

  list.forEach(it => {
    const decided = isItemDecided(it);
    const row = document.createElement('article');
    row.className = `wb-row status-${it.status_group} ${decided ? 'decided-row' : ''}`;
    row.id = 'row-' + it.seq;
    row.innerHTML = buildRowInnerHtml(it);
    container.appendChild(row);
    renderCandidateGrid(it.key, it.seq);
  });
}

function openExportModal() {
  const lines = ['【歌枕紀行 表示レイヤー＆写真あて検討リスト】'];
  ITEMS.forEach(it => {
    if (!isItemDecided(it)) return;
    const summary = describeItemDecision(it);
    lines.push(`- [${it.key}]（${it.works.join('・') || '共通'}） ｜ ${summary}`);
  });
  if (lines.length === 1) {
    lines.push('（まだ変更・確認された地点がありません。各行のチェックボックス切り替え、「✓ 現状でOK」、または「📷 個別Wikiに採用」を押すとここに集計されます）');
  }
  document.getElementById('exportTextarea').value = lines.join('\n');
  document.getElementById('exportModal').classList.add('open');
}

function closeExportModal() {
  document.getElementById('exportModal').classList.remove('open');
}

function copyExportText() {
  const ta = document.getElementById('exportTextarea');
  navigator.clipboard.writeText(ta.value).then(() => {
    alert('クリップボードにコピーしました！そのままチャットに貼り付けてください。');
  });
}

function clearAllDecisions() {
  if (!confirm('保存したチェック変更・確認記録をすべてリセットしますか？')) return;
  decisions = {};
  saveDecisions();
  closeExportModal();
  renderBoard();
}

renderBoard();
</script>
</body>
</html>
