<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>『地図と一緒によむ歌枕』マスターDB（うたまくら・WIKI・浮世絵・Googleマップ）</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-page: #f4f1ea;
      --bg-card: #ffffff;
      --header-bg: #1f1a16;
      --col-head-bg: #2c241d;
      --border-soft: #dcd4c6;
      --text-main: #1e293b;
      --text-sub: #57606a;
      --accent-gold: #f59e0b;
      --ok-green: #15803d;
      --warn-red: #dc2626;
      --blue-main: #1d4ed8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2500;
      background: var(--header-bg);
      color: #fff;
      padding: 10px 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
    }
    .header-inner {
      max-width: 1620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-family: "Yu Mincho", "MS PMincho", serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: #fde68a;
    }
    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .btn-top {
      background: #3b3129;
      color: #fef3c7;
      border: 1px solid #786452;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-top:hover { background: #524338; color: #fff; }
    .btn-export {
      background: var(--accent-gold);
      color: #111827;
      border: none;
      border-radius: 5px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-export:hover { background: #fbbf24; }

    .kpi-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 7px;
    }
    .kpi-tab {
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
      border-radius: 7px;
      padding: 6px 11px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kpi-tab:hover { background: rgba(255, 255, 255, 0.14); }
    .kpi-tab.active {
      background: #fffbeb;
      color: #111827;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 2px var(--accent-gold);
    }
    .kpi-label { font-size: 0.78rem; font-weight: 700; }
    .kpi-sub { font-size: 0.68rem; opacity: 0.8; display: block; }
    .kpi-num { font-size: 1.15rem; font-weight: 800; margin-left: 6px; }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .filter-bar select, .filter-bar input[type="search"] {
      background: #fff;
      color: #0f172a;
      border: 1px solid #94a3b8;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 0.8rem;
    }
    .filter-bar input[type="search"] { flex: 1 1 230px; }
    .filter-count { font-size: 0.78rem; color: #fde68a; font-weight: 700; padding: 0 4px; }

    .main-wrap {
      max-width: 1620px;
      margin: 0 auto;
      padding: 12px 18px 60px;
    }
    .overview-map-box {
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .overview-map-box.hidden { display: none; }
    #overviewMap { width: 100%; height: 300px; background: #e5e0d5; }
    .leaflet-tile-pane { filter: sepia(0.14) contrast(1.04); }
    .map-legend {
      padding: 6px 12px;
      font-size: 0.75rem;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: #475569;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

    /* 4列マスターDBテーブル見出し＆行グリッド */
    .db-grid-cols {
      display: grid;
      grid-template-columns: 1.25fr 1.15fr 1.05fr 1.1fr;
      gap: 12px;
    }
    .db-table-head {
      background: var(--col-head-bg);
      color: #fde68a;
      border-radius: 8px 8px 0 0;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid #4a3c31;
    }
    .db-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }
    .db-row {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 5px solid var(--ok-green);
      border-radius: 8px;
      padding: 11px 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .db-row.missing-wiki { border-left-color: #d97706; }
    .db-row.modified-row { background: #f0fdf4; box-shadow: 0 0 0 2px #16a34a; }

    .db-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .db-cell + .db-cell {
      border-left: 1px solid #ece7dc;
      padding-left: 12px;
    }
    @media (max-width: 1080px) {
      .db-table-head { display: none; }
      .db-grid-cols { grid-template-columns: 1fr; }
      .db-cell + .db-cell { border-left: none; border-top: 1px solid #ece7dc; padding-left: 0; padding-top: 10px; }
    }

    /* ① うたまくら列 */
    .place-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
    .place-name {
      font-family: "Yu Mincho", "MS PMincho", serif;
      font-size: 1.14rem;
      font-weight: 700;
      color: #0f172a;
    }
    .prov-pill {
      font-size: 0.7rem;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 700;
    }
    .pinpoint-addr { font-size: 0.78rem; font-weight: 700; color: #334155; }
    .place-desc { font-size: 0.73rem; color: var(--text-sub); }
    .appear-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .appear-tag {
      font-size: 0.7rem;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 4px;
      padding: 1px 6px;
      text-decoration: none;
      font-weight: 700;
    }
    .appear-tag.hyakunin { background: #f3e8ff; color: #6b21a8; border-color: #d8b4fe; }
    .appear-tag.manyoshu { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    .manyo-hint-box {
      background: #fefce8;
      border: 1px solid #fde047;
      border-radius: 5px;
      padding: 5px 7px;
      font-size: 0.72rem;
      color: #713f12;
      line-height: 1.45;
    }
    .mini-btn.manyo-btn { background: #0f766e; }

    /* ② WIKI列 ＆ ③ 浮世絵列 のビジュアルカード */
    .media-card {
      position: relative;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      background: #0f172a;
    }
    .media-card.is-off { opacity: 0.35; filter: grayscale(1); }
    .media-card img {
      width: 100%;
      height: 132px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .media-card.ukiyoe-fit img {
      object-fit: contain;
      background: #1c1611;
    }
    .meisho-tag {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(21, 128, 61, 0.92);
      color: #fff;
      font-size: 0.67rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .picked-tag {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(29, 78, 216, 0.94);
      color: #fff;
      font-size: 0.67rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .media-caption {
      font-size: 0.73rem;
      color: #334155;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    .wiki-link { color: var(--blue-main); text-decoration: none; font-weight: 700; font-size: 0.73rem; }
    .wiki-link:hover { text-decoration: underline; }

    .empty-slot {
      border: 1.5px dashed #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      padding: 14px 10px;
      text-align: center;
      color: #64748b;
      font-size: 0.76rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 112px;
    }
    .empty-slot.warn {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #92400e;
    }

    .cell-actions { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .mini-btn {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.71rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .mini-btn:hover { background: #1e293b; }
    .mini-btn.search-wiki { background: var(--blue-main); }
    .mini-btn.search-ukiyoe { background: #7c2d12; }
    .mini-btn.off-btn { background: #64748b; }
    .mini-btn.gmap-ext { background: #d97706; }

    /* ④ Googleマップ列 */
    .gmap-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.76rem;
    }
    .gmap-frame {
      width: 100%;
      height: 155px;
      border: 1px solid #94a3b8;
      border-radius: 5px;
      margin-top: 4px;
    }
    .memo-input {
      width: 100%;
      padding: 4px 7px;
      font-size: 0.74rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #fff;
    }

    /* 行内検索ドロワー（WIKI写真／浮世絵・名所図会 共用） */
    .search-drawer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1.5px dashed #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-drawer.hidden { display: none; }
    .drawer-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .drawer-bar input[type="text"] {
      flex: 1 1 240px;
      padding: 5px 9px;
      font-size: 0.8rem;
      border: 1px solid #94a3b8;
      border-radius: 5px;
    }
    .kw-chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 0.72rem; color: #475569; }
    .kw-chip {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .kw-chip:hover { background: #dbeafe; }

    .cand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }
    .cand-card {
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    .cand-card.picked { border-color: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,0.28); }
    .cand-card img { width: 100%; height: 102px; object-fit: cover; background: #111; cursor: zoom-in; }
    .cand-meta {
      padding: 5px 6px;
      font-size: 0.69rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      justify-content: space-between;
    }
    .cand-title {
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cand-pick-btn {
      width: 100%;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px;
      font-size: 0.71rem;
      font-weight: 700;
      cursor: pointer;
    }
    .cand-card.picked .cand-pick-btn { background: #16a34a; }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 6000;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal-panel {
      background: #fff;
      border-radius: 10px;
      max-width: 860px;
      width: 100%;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 90vh;
    }
    .modal-panel textarea {
      width: 100%;
      height: 350px;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .lightbox-img { max-width: 94vw; max-height: 85vh; border-radius: 6px; }
    @media (min-width: 1081px) {
      .db-grid-cols { grid-template-columns: 1.2fr 1fr 1fr; }
    }
    .db-grid-cols > .db-cell:nth-child(4) { display: none; }
    .nav-group { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 0.76rem; color: #cbd5e1; }
    .kpi-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .kpi-tab { padding: 6px 13px; gap: 6px; }
    .kpi-num { font-size: 1.02rem; margin-left: 2px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="top-bar">
      <div class="brand-title">『地図と一緒によむ歌枕』図版確認一覧</div>
      <div class="top-actions">
        <span class="nav-group">
          <span>公開画面を開く：</span>
          <a class="btn-top" href="glossary.html" target="_blank">索引トップ</a>
          <a class="btn-top" href="okunohosomichi.html" target="_blank">おくのほそ道</a>
          <a class="btn-top" href="hyakunin.html" target="_blank">小倉百人一首</a>
          <a class="btn-top" href="manyoshu.html" target="_blank">万葉集</a>
        </span>
        <button type="button" class="btn-export" onclick="openExportModal()">📋 変更リスト出力 (<span id="modifiedCount">0</span>件)</button>
      </div>
    </div>

    <div class="kpi-tabs" id="kpiTabs">
      <button type="button" class="kpi-tab active" data-tab="all_pins" onclick="selectTab('all_pins')">
        <span class="kpi-label">全うたまくら</span>
        <span><span class="kpi-num" id="cnt-all_pins">0</span>件</span>
      </button>
      <button type="button" class="kpi-tab" data-tab="missing_wiki" onclick="selectTab('missing_wiki')">
        <span class="kpi-label">WIKI写真なし</span>
        <span class="kpi-num" id="cnt-missing_wiki">0</span>
      </button>
      <button type="button" class="kpi-tab" data-tab="has_wiki" onclick="selectTab('has_wiki')">
        <span class="kpi-label">WIKI登録済み</span>
        <span class="kpi-num" id="cnt-has_wiki">0</span>
      </button>
      <button type="button" class="kpi-tab" data-tab="has_ukiyoe" onclick="selectTab('has_ukiyoe')">
        <span class="kpi-label">浮世絵</span>
        <span class="kpi-num" id="cnt-has_ukiyoe">0</span>
      </button>
      <button type="button" class="kpi-tab" data-tab="modified" onclick="selectTab('modified')">
        <span class="kpi-label">今回採用・変更中</span>
        <span class="kpi-num" id="cnt-modified">0</span>
      </button>
    </div>

    <div class="filter-bar">
      <select id="workFilter" onchange="renderBoard()">
        <option value="all">作品：すべて</option>
        <option value="おくのほそ道">おくのほそ道</option>
        <option value="小倉百人一首">小倉百人一首</option>
        <option value="万葉集">万葉集</option>
      </select>
      <select id="provFilter" style="display:none;"><option value="all">all</option></select>
      <select id="comboFilter" style="display:none;">
        <option value="pins_only" selected>pins_only</option>
        <option value="all_entries">all_entries</option>
      </select>
      <input type="search" id="searchBox" placeholder="歌枕名・都道府県・市区町村名で検索..." oninput="renderBoard()" />
      <span class="filter-count" id="showingLabel">0件表示中</span>
    </div>
  </div>
</header>

<div class="main-wrap">
  <section class="overview-map-box hidden" id="overviewMapBox">
    <div id="overviewMap"></div>
  </section>

  <div class="db-table-head db-grid-cols">
    <div>① うたまくら</div>
    <div>② WIKI写真（現地風景）</div>
    <div>③ 浮世絵・名所図会</div>
  </div>

  <div class="db-list" id="dbList"></div>
</div>

<!-- ライトボックス -->
<div class="modal-bg" id="lightboxModal" onclick="closeLightbox()">
  <div style="text-align:center;">
    <img id="lightboxImg" class="lightbox-img" src="" alt="" />
    <div id="lightboxCap" style="color:#fff; margin-top:8px; font-size:0.88rem;"></div>
  </div>
</div>

<!-- 一括保管・反映用エクスポートモーダル -->
<div class="modal-bg" id="exportModal" onclick="if(event.target===this) closeExportModal()">
  <div class="modal-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:1.02rem;">📋 採用したWIKI写真・浮世絵・ピンポイント変更リスト（一括ローカル保管用）</h3>
      <button type="button" class="mini-btn" onclick="closeExportModal()">✕ 閉じる</button>
    </div>
    <p style="font-size:0.8rem; color:#475569;">このテキストをコピーしてチャットに貼るだけで、選んだ写真のローカル保管（<code>images/wiki/</code>・<code>images/ukiyoe/</code>）と全3作品・横断索引への反映を一括実行できます。</p>
    <textarea id="exportTextarea" readonly></textarea>
    <div style="display:flex; justify-content:space-between; gap:10px;">
      <button type="button" class="mini-btn off-btn" onclick="clearAllEdits()">🗑️ 選択・変更記録をすべてリセット</button>
      <button type="button" class="btn-export" onclick="copyExportText()">📋 クリップボードにコピー</button>
    </div>
  </div>

function openManyoHyakkaSearch(placeKey) {
  const cleanKey = placeKey.replace(/の(?:関|里|松|山|浦|江|浜|原)$/, '');
  if (MANYO_META && MANYO_META.form_action && MANYO_META.query_field) {

    f.method = MANYO_META.method || 'POST';
    f.action = MANYO_META.form_action;
    f.target = '_blank';
    const extra = MANYO_META.hidden_fields || {};
    Object.keys(extra).forEach(hk => {
      const hi = document.createElement('input');
      hi.type = 'hidden'; hi.name = hk; hi.value = extra[hk];
      f.appendChild(hi);
    });
    const inp = document.createElement('input');
    inp.type = 'hidden';
    inp.name = MANYO_META.query_field;
    inp.value = placeKey;
    f.appendChild(inp);
    document.body.appendChild(f);
    f.submit();
    document.body.removeChild(f);
    return;
  }
  const gUrl = `https://www.google.com/search?q=${encodeURIComponent('site:manyo-hyakka.pref.nara.jp ' + placeKey + ' OR ' + cleanKey)}`;
  window.open(gUrl, '_blank', 'noopener');
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function getEffectiveState(it) {
  const ed = edits[it.key] || {};
  const wikiOff = Boolean(ed.wikiOff);
  const ukiyoeOff = Boolean(ed.ukiyoeOff);
  const useAltWiki = Boolean(ed.useAltWiki && it.wiki_alt_img);

  const wikiPickedFile = ed.wikiFile || '';
  const wikiUrl = wikiOff
    ? ''
    : (wikiPickedFile ? (ed.wikiThumb || `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(wikiPickedFile)}?width=${COMMONS_THUMB_PX}`) : (useAltWiki ? it.wiki_alt_img : it.wiki_img));

  const ukiyoePickedFile = ed.ukiyoeFile || '';
  const ukiyoeUrl = ukiyoeOff
    ? ''
    : (ukiyoePickedFile ? (ed.ukiyoeThumb || `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(ukiyoePickedFile)}?width=${COMMONS_THUMB_PX}`) : it.ukiyoe_img);

  return {
    wikiOff,
    ukiyoeOff,
    useAltWiki,
    wikiPickedFile,
    wikiUrl,
    ukiyoePickedFile,
    ukiyoeUrl,
    memo: ed.memo || ''
  };
}

function isModified(it) {
  const ed = edits[it.key];
  if (!ed) return false;
  return Boolean(ed.wikiFile || ed.ukiyoeFile || ed.wikiOff || ed.ukiyoeOff || ed.useAltWiki || ed.memo);
}

function saveEdits() {

  updateCounts();
}

function getOrInitEdit(key) {
  if (!edits[key]) edits[key] = {};
  return edits[key];
}

function cleanupEditIfEmpty(key) {
  const it = ITEM_BY_KEY[key];
  if (it && !isModified(it)) delete edits[key];
}

function matchesWorkFilter(it, workVal) {
  if (workVal === 'all') return true;
  if (workVal === '__shared__') return it.works.length >= MIN_SHARED_WORKS_COUNT;
  if (workVal === '__unused__') return it.works.length === 0;
  return it.works.includes(workVal);
}

function getBaseScopeItems() {
  const workVal = document.getElementById('workFilter').value;
  const provVal = document.getElementById('provFilter').value;
  const comboVal = document.getElementById('comboFilter').value;
  return ITEMS.filter(it => {
    if (comboVal !== 'all_entries' && !it.is_pin) return false;
    if (!matchesWorkFilter(it, workVal)) return false;
    if (provVal !== 'all' && it.province !== provVal) return false;
    return true;
  });
}

function updateCounts() {
  const base = getBaseScopeItems();
  document.getElementById('cnt-all_pins').textContent = base.length;
  document.getElementById('cnt-missing_wiki').textContent = base.filter(it => !getEffectiveState(it).wikiUrl).length;
  document.getElementById('cnt-has_wiki').textContent = base.filter(it => Boolean(getEffectiveState(it).wikiUrl)).length;
  document.getElementById('cnt-has_ukiyoe').textContent = base.filter(it => Boolean(getEffectiveState(it).ukiyoeUrl)).length;
  const modAll = ITEMS.filter(it => isModified(it)).length;
  document.getElementById('cnt-modified').textContent = modAll;
  document.getElementById('modifiedCount').textContent = modAll;
}

        it.modern,
        it.province,
        it.wiki_link_label,
        it.ukiyoe_caption,
        it.gmap_spot_name,
        ...(it.wiki_keywords || []),
        ...it.appearances.map(a => a.section_title)
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (workVal === 'おくのほそ道') {
    list.sort((a, b) => a.order_v1 - b.order_v1);
  } else if (workVal === '小倉百人一首') {
    list.sort((a, b) => a.order_v2 - b.order_v2);
  } else if (workVal === '万葉集') {
    list.sort((a, b) => a.order_v3 - b.order_v3);
  } else {
    list.sort((a, b) => a.order_v1 - b.order_v1 || a.order_v2 - b.order_v2 || a.order_v3 - b.order_v3 || a.seq - b.seq);
  }
  return list;
}

function toggleOverviewMap() {
  const box = document.getElementById('overviewMapBox');
  box.classList.toggle('hidden');
  if (!box.classList.contains('hidden')) {
    setTimeout(() => {
      map.invalidateSize();
      refreshMapPins();
    }, MAP_INVALIDATE_DELAY_MS);
  }
}

function refreshMapPins() {
  pinsLayer.clearLayers();
  getFilteredItems().forEach(it => {
    if (!it.is_pin || it.lat === null || it.lng === null) return;
    const st = getEffectiveState(it);
    const color = st.wikiUrl ? '#16a34a' : (st.ukiyoeUrl ? '#7c2d12' : '#d97706');
    const m = L.circleMarker([it.lat, it.lng], {
      radius: PIN_MARKER_RADIUS_PX,
      fillColor: color,
      color: '#fff',
      weight: 1.5,
      fillOpacity: 0.92
    }).addTo(pinsLayer);
    m.bindTooltip(`${it.key}（${it.modern}）`);
    m.on('click', () => {
      const row = document.getElementById('row-' + it.seq);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
}

function focusPlaceOnMap(seq) {
  const it = ITEMS.find(x => x.seq === seq);
  if (!it || it.lat === null || it.lng === null) return;
  const box = document.getElementById('overviewMapBox');
  if (box.classList.contains('hidden')) {
    box.classList.remove('hidden');
    map.invalidateSize();
  }
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  refreshMapPins();
  map.setView([it.lat, it.lng], Math.min(MAP_MAX_ZOOM, it.zoom || MAP_FOCUS_FALLBACK_ZOOM), { animate: true });
}

function toggleInlineGmap(seq) {
  const wrap = document.getElementById('gmap-inline-' + seq);
  const it = ITEMS.find(x => x.seq === seq);
  if (!wrap || !it) return;
  if (wrap.innerHTML) {
    wrap.innerHTML = '';
    return;
  }
  const embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(it.gmap_query || it.key)}&t=m&z=${GMAP_EMBED_ZOOM}&output=embed&hl=ja`;
  wrap.innerHTML = `<iframe class="gmap-frame" src="${embedUrl}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
}

function openLightbox(url, cap) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxCap').textContent = cap || '';
  document.getElementById('lightboxModal').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightboxModal').classList.remove('open');
  document.getElementById('lightboxImg').src = '';
}

function toggleSlotOff(key, slot) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  const ed = getOrInitEdit(key);
  if (slot === 'wiki') ed.wikiOff = !ed.wikiOff;
  if (slot === 'ukiyoe') ed.ukiyoeOff = !ed.ukiyoeOff;
  cleanupEditIfEmpty(key);
  saveEdits();
  rerenderRow(it);
}

function toggleAltWiki(key) {
  const it = ITEM_BY_KEY[key];
  if (!it || !it.wiki_alt_img) return;
  const ed = getOrInitEdit(key);
  ed.useAltWiki = !ed.useAltWiki;
  ed.wikiOff = false;
  cleanupEditIfEmpty(key);
  saveEdits();
  rerenderRow(it);
}

function updateMemo(key, val) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  const ed = getOrInitEdit(key);
  ed.memo = val.trim();
  cleanupEditIfEmpty(key);
  saveEdits();
  rerenderRow(it);
}

function resetRow(key) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  delete edits[key];
  saveEdits();
  rerenderRow(it);
}

function openSearchDrawer(key, seq, slot, autoRun) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  if (openDrawerSlotBySeq[seq] === slot && !autoRun) {
    openDrawerSlotBySeq[seq] = '';
    rerenderRow(it);
    return;
  }
  openDrawerSlotBySeq[seq] = slot;
  rerenderRow(it);
  const kws = slot === 'ukiyoe' ? it.ukiyoe_keywords : it.wiki_keywords;
  const defaultQ = (kws && kws[0]) || it.key;
  if (autoRun || !liveCache[key + ':' + slot]) {
    runLiveSearch(key, seq, slot, defaultQ);
  } else {
    renderCandidateGrid(key, seq, slot);
  }
}

function isExcludedFile(name) {
  if (!name) return true;
  return /([.]svg|[.]pdf|[.]ogg|[.]webm|locator|location_map|map_of|relief_map|flag_of|emblem|symbol|coat_of_arms|commons-logo|disambig|ambox|prefecture|municipality|市章|町章|県章|紋章|位置図)/i.test(name);
}

async function runLiveSearch(key, seq, slot, customQuery) {
  const inputEl = document.getElementById(`q-input-${seq}`);
  const query = (customQuery !== undefined ? customQuery : (inputEl ? inputEl.value : key)).trim();
  if (!query) return;
  if (inputEl) inputEl.value = query;

  const gridEl = document.getElementById(`cand-grid-${seq}`);
  if (gridEl) {
    gridEl.innerHTML = `<div style="grid-column:1/-1; font-size:0.78rem; color:#1d4ed8; padding:6px;">🔍 「${escapeHtml(query)}」で Wikimedia Commons / Wikipedia を検索中...</div>`;
  }

  const found = [];
  const seen = new Set();

  if (slot === 'wiki') {
    try {
      const wpUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(query)}&prop=pageimages|images&pithumbsize=${COMMONS_THUMB_PX}&imlimit=${WIKI_PAGE_IMAGES_LIMIT}&redirects=1&format=json&origin=*`;
      const wpRes = await fetch(wpUrl);
      if (wpRes.ok) {
        const wpData = await wpRes.json();
        const pages = wpData.query && wpData.query.pages ? Object.values(wpData.query.pages) : [];
        const fileTitles = [];
        pages.forEach(pg => {
          if (pg.pageimage && !isExcludedFile(pg.pageimage)) fileTitles.push('File:' + pg.pageimage);
          (pg.images || []).forEach(im => {
            if (im.title && !isExcludedFile(im.title) && !fileTitles.includes(im.title)) fileTitles.push(im.title);
          });
        });
        if (fileTitles.length > 0) {
          const iiUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileTitles.slice(0, MAX_CANDIDATE_THUMBS).join('|'))}&prop=imageinfo&iiprop=url&iiurlwidth=${COMMONS_THUMB_PX}&format=json&origin=*`;
          const iiRes = await fetch(iiUrl);
          if (iiRes.ok) {
            const iiData = await iiRes.json();
            Object.values((iiData.query && iiData.query.pages) || {}).forEach(pg => {
              if (pg.imageinfo && pg.imageinfo[0]) {
                const fk = (pg.title || '').replace(/^(File|ファイル):/i, '').trim();
                const tUrl = pg.imageinfo[0].thumburl || pg.imageinfo[0].url;
                if (fk && tUrl && !isExcludedFile(fk) && !seen.has(fk)) {
                  seen.add(fk);
                  found.push({ fileKey: fk, thumbUrl: tUrl, fullUrl: pg.imageinfo[0].url || tUrl });
                }
              }
            });
          }
        }
      }
    } catch (e) {}
  }

  if (found.length < MAX_CANDIDATE_THUMBS) {
    try {
      const remain = MAX_CANDIDATE_THUMBS - found.length;
      const cmUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap ' + query)}&gsrnamespace=6&gsrlimit=${remain + COMMONS_EXTRA_BUFFER}&prop=imageinfo&iiprop=url&iiurlwidth=${COMMONS_THUMB_PX}&format=json&origin=*`;
      const cmRes = await fetch(cmUrl);
      if (cmRes.ok) {
        const cmData = await cmRes.json();
        Object.values((cmData.query && cmData.query.pages) || {}).forEach(pg => {
          if (found.length >= MAX_CANDIDATE_THUMBS) return;
          if (pg.imageinfo && pg.imageinfo[0]) {
            const fk = (pg.title || '').replace(/^(File|ファイル):/i, '').trim();
            const tUrl = pg.imageinfo[0].thumburl || pg.imageinfo[0].url;
            if (fk && tUrl && !isExcludedFile(fk) && !seen.has(fk)) {
              seen.add(fk);
              found.push({ fileKey: fk, thumbUrl: tUrl, fullUrl: pg.imageinfo[0].url || tUrl });
            }
          }
        });
      }
    } catch (e) {}
  }

  liveCache[key + ':' + slot] = { slot, query, list: found };
  renderCandidateGrid(key, seq, slot);
}

function pickCandidate(key, seq, slot, fileKey, thumbUrl) {
  const it = ITEM_BY_KEY[key];
  if (!it) return;
  const ed = getOrInitEdit(key);
  if (slot === 'wiki') {
    if (ed.wikiFile === fileKey) {
      delete ed.wikiFile;
      delete ed.wikiThumb;
    } else {
      ed.wikiFile = fileKey;
      ed.wikiThumb = thumbUrl;
      ed.wikiOff = false;
    }
  } else {
    if (ed.ukiyoeFile === fileKey) {
      delete ed.ukiyoeFile;
      delete ed.ukiyoeThumb;
    } else {
      ed.ukiyoeFile = fileKey;
      ed.ukiyoeThumb = thumbUrl;
      ed.ukiyoeOff = false;
    }
  }
  cleanupEditIfEmpty(key);
  saveEdits();
  rerenderRow(it);
}

function renderCandidateGrid(key, seq, slot) {
  const gridEl = document.getElementById(`cand-grid-${seq}`);
  if (!gridEl || !slot) return;
  const cached = liveCache[key + ':' + slot];
  const it = ITEM_BY_KEY[key];
  const ed = edits[key] || {};
  let list = cached ? cached.list : [];

  if (!cached && slot === 'wiki' && it && it.saved_wiki_candidates && it.saved_wiki_candidates.length > 0) {
    list = it.saved_wiki_candidates.slice(0, MAX_CANDIDATE_THUMBS).map(fk => ({
      fileKey: fk,
      thumbUrl: `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fk)}?width=${COMMONS_THUMB_PX}`,
      fullUrl: `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(fk)}`
    }));
  }

  if (cached && list.length === 0) {
    gridEl.innerHTML = `<div style="grid-column:1/-1; font-size:0.76rem; color:#92400e; background:#fffbeb; padding:7px 10px; border-radius:5px; border:1px solid #fde68a;">「${escapeHtml(cached.query)}」では該当画像が見つかりませんでした。上の水色チップや別の神社名・山名・名所図会ワードで試してみてください。</div>`;
    return;
  }

  const safeKey = key.replace(/'/g, "\'");
  const pickedFile = slot === 'wiki' ? ed.wikiFile : ed.ukiyoeFile;
  const actionLabel = slot === 'wiki' ? '📷 WIKIに採用' : '🎨 浮世絵枠に採用';

  gridEl.innerHTML = list.map(c => {
    const isPicked = pickedFile === c.fileKey;
    const safeFk = c.fileKey.replace(/'/g, "\'");
    const safeThumb = c.thumbUrl.replace(/'/g, "\'");
    const safeFull = (c.fullUrl || c.thumbUrl).replace(/'/g, "\'");
    return `
      <div class="cand-card ${isPicked ? 'picked' : ''}">
        <img src="${escapeHtml(c.thumbUrl)}" alt="${escapeHtml(c.fileKey)}" loading="lazy" onclick="openLightbox('${safeFull}', 'File:${safeFk}')" />
        <div class="cand-meta">
          <div class="cand-title" title="${escapeHtml(c.fileKey)}">${escapeHtml(c.fileKey)}</div>
          <button type="button" class="cand-pick-btn" onclick="pickCandidate('${safeKey}', ${seq}, '${slot}', '${safeFk}', '${safeThumb}')">
            ${isPicked ? '✓ 採用選択中' : actionLabel}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

async function autoSearchVisibleMissingWiki() {
  const targets = getFilteredItems()
    .filter(it => !getEffectiveState(it).wikiUrl && !liveCache[it.key + ':wiki'])
    .slice(0, AUTO_BATCH_SEARCH_LIMIT);
  for (const it of targets) {
    openDrawerSlotBySeq[it.seq] = 'wiki';
    rerenderRow(it);
    const firstKw = (it.wiki_keywords && it.wiki_keywords[0]) || it.key;
    await runLiveSearch(it.key, it.seq, 'wiki', firstKw);
  }
}

function buildRowHtml(it) {
  const st = getEffectiveState(it);
  const mod = isModified(it);
  const safeKey = it.key.replace(/'/g, "\'");
  const activeSlot = openDrawerSlotBySeq[it.seq] || '';

  // ① うたまくら列
  const appHtml = it.appearances.map(a => {
    const cls = a.work === '小倉百人一首' ? 'hyakunin' : (a.work === '万葉集' ? 'manyoshu' : '');
    const href = a.rec_id
      ? `${a.html}?rec=${encodeURIComponent(a.rec_id)}&place=${encodeURIComponent(it.key)}`
      : `${a.html}?place=${encodeURIComponent(it.key)}`;
    return `<a class="appear-tag ${cls}" href="${href}" target="_blank" title="${escapeHtml(a.work)}の該当歌・ピンを開く">${escapeHtml(a.work)}：${escapeHtml(a.section_title)}</a>`;
  }).join('');

  const col1 = `
    <div class="db-cell">
      <div class="place-head">
        <span class="place-name">${escapeHtml(it.key)}</span>
        <span class="prov-pill">${escapeHtml(it.province)}</span>
        ${!it.is_pin ? `<span class="prov-pill">${escapeHtml(it.place_type)}</span>` : ''}
      </div>
      <div class="pinpoint-addr">📍 ${escapeHtml(it.modern || '所在地未設定')}</div>
      <div class="place-desc">${escapeHtml(it.label)}</div>
      ${it.manyo_hint ? `<div class="manyo-hint-box">📚 <strong>万葉百科【故地説明】</strong>：${escapeHtml(it.manyo_hint)}</div>` : ''}
      <div class="appear-tags">${appHtml || '<span style="font-size:0.71rem; color:#94a3b8;">（本文未登場・予備登録）</span>'}</div>
      <div class="cell-actions"><button type="button" class="mini-btn manyo-btn" onclick="openManyoHyakkaSearch('${safeKey}')" title="奈良県立万葉文化館『万葉百科』でこの歌枕の故地説明・和歌を引く">📚 万葉百科で「${escapeHtml(it.key)}」を引く↗</button></div>
      ${mod ? `<div><button type="button" class="mini-btn off-btn" onclick="resetRow('${safeKey}')">↺ この行の変更を戻す</button></div>` : ''}
    </div>
  `;

  // ② WIKI列（名勝＋個別Wiki統合済）
  const wikiHref = it.wiki_link_page ? `https://ja.wikipedia.org/wiki/${encodeURIComponent(it.wiki_link_page)}` : '';
  let col2Body = '';
  if (st.wikiUrl || it.wiki_img) {
    const dispUrl = st.wikiUrl || it.wiki_img;
    const capStr = st.wikiPickedFile ? `File:${st.wikiPickedFile}` : (it.wiki_link_label || it.key);
    col2Body = `
      <div class="media-card ${st.wikiOff ? 'is-off' : ''}">
        <img src="${escapeHtml(dispUrl)}" alt="${escapeHtml(capStr)}" loading="lazy" onclick="openLightbox('${escapeHtml(dispUrl).replace(/'/g, "\'")}', '${escapeHtml(capStr).replace(/'/g, "\'")}')" />
        ${it.meisho_badge && !st.wikiPickedFile ? `<span class="meisho-tag">${escapeHtml(it.meisho_badge)}</span>` : ''}
        ${st.wikiPickedFile ? `<span class="picked-tag">新規採用予定</span>` : ''}
      </div>
      <div class="media-caption">
        ${wikiHref ? `<a class="wiki-link" href="${wikiHref}" target="_blank" rel="noopener">📖 ${escapeHtml(it.wiki_link_label)} ↗</a>` : '<span style="color:#64748b;">個別Wiki記事なし</span>'}
      </div>
      <div class="cell-actions">
        <button type="button" class="mini-btn search-wiki" onclick="openSearchDrawer('${safeKey}', ${it.seq}, 'wiki', false)">🔍 差替・別写真を検索</button>
        ${it.wiki_alt_img ? `<button type="button" class="mini-btn" onclick="toggleAltWiki('${safeKey}')">🔀 旧候補と切替</button>` : ''}
        <button type="button" class="mini-btn off-btn" onclick="toggleSlotOff('${safeKey}', 'wiki')">${st.wikiOff ? '✓ 表示に戻す' : '🚫 OFF'}</button>
      </div>
    `;
  } else {
    col2Body = `
      <div class="empty-slot warn">
        <div>⚠️ <strong>WIKI現地写真 未登録</strong></div>
        ${wikiHref ? `<a class="wiki-link" href="${wikiHref}" target="_blank" rel="noopener">📖 ${escapeHtml(it.wiki_link_label)} ↗</a>` : ''}
        <button type="button" class="mini-btn search-wiki" onclick="openSearchDrawer('${safeKey}', ${it.seq}, 'wiki', true)">🔍 現地写真を検索して補完</button>
      </div>
    `;
  }
  const col2 = `<div class="db-cell">${col2Body}</div>`;

  // ③ 浮世絵列
  let col3Body = '';
  if (st.ukiyoeUrl || it.ukiyoe_img) {
    const dispUk = st.ukiyoeUrl || it.ukiyoe_img;
    const ukCap = st.ukiyoePickedFile ? `File:${st.ukiyoePickedFile}` : (it.ukiyoe_caption || it.key);
    col3Body = `
      <div class="media-card ukiyoe-fit ${st.ukiyoeOff ? 'is-off' : ''}">
        <img src="${escapeHtml(dispUk)}" alt="${escapeHtml(ukCap)}" loading="lazy" onclick="openLightbox('${escapeHtml(dispUk).replace(/'/g, "\'")}', '${escapeHtml(ukCap).replace(/'/g, "\'")}')" />
        ${st.ukiyoePickedFile ? `<span class="picked-tag">新規採用予定</span>` : ''}
      </div>
      <div class="media-caption"><span>🎨 ${escapeHtml(ukCap)}</span></div>
      <div class="cell-actions">
        <button type="button" class="mini-btn search-ukiyoe" onclick="openSearchDrawer('${safeKey}', ${it.seq}, 'ukiyoe', false)">🎨 差替検索</button>
        <button type="button" class="mini-btn off-btn" onclick="toggleSlotOff('${safeKey}', 'ukiyoe')">${st.ukiyoeOff ? '✓ 表示に戻す' : '🚫 OFF'}</button>
      </div>
    `;
  } else {
    col3Body = `
      <div class="empty-slot">
        <div>— 浮世絵・名所図会 未登録</div>
        <button type="button" class="mini-btn search-ukiyoe" onclick="openSearchDrawer('${safeKey}', ${it.seq}, 'ukiyoe', true)">🎨 浮世絵・名所図会を検索</button>
      </div>
    `;
  }
  const col3 = `<div class="db-cell">${col3Body}</div>`;

  // ④ Googleマップ列
  const col4 = `
    <div class="db-cell">
      <div class="gmap-box">
        <div><strong>📍 ${escapeHtml(it.gmap_spot_name || it.key)}</strong></div>
        <div style="color:#64748b; font-size:0.71rem;">座標: ${it.lat !== null ? it.lat.toFixed(4) : '-'}, ${it.lng !== null ? it.lng.toFixed(4) : '-'}</div>
        <div class="cell-actions">
          <button type="button" class="mini-btn" onclick="toggleInlineGmap(${it.seq})">🗺️ この場で地図確認</button>
          ${it.gmap_open_url ? `<a class="mini-btn gmap-ext" href="${escapeHtml(it.gmap_open_url)}" target="_blank" rel="noopener">GMap↗</a>` : ''}
          ${it.is_pin ? `<button type="button" class="mini-btn off-btn" onclick="focusPlaceOnMap(${it.seq})">全国図</button>` : ''}
        </div>
        <div id="gmap-inline-${it.seq}"></div>
      </div>
      <input type="text" class="memo-input" value="${escapeHtml(st.memo)}" placeholder="ピンポイント比定メモ（神社・歌碑名やURLなど）" onchange="updateMemo('${safeKey}', this.value)" />
    </div>
  `;

  // 展開ドロワー
  let drawerHtml = '';
  if (activeSlot) {
    const kws = activeSlot === 'ukiyoe' ? (it.ukiyoe_keywords || []) : (it.wiki_keywords || []);
    const cached = liveCache[it.key + ':' + activeSlot];
    const curQ = (cached && cached.query) || kws[0] || it.key;
    const modeTitle = activeSlot === 'ukiyoe' ? '🎨 浮世絵・名所図会を検索（Commons保管用）' : '📷 WIKI現地写真を検索（Commons保管用）';
    const commonsExt = `https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(curQ)}&title=Special:MediaSearch&type=image`;
    const chips = kws.map(kw =>
      `<button type="button" class="kw-chip" onclick="runLiveSearch('${safeKey}', ${it.seq}, '${activeSlot}', '${kw.replace(/'/g, "\'")}')">🔍 ${escapeHtml(kw)}</button>`
    ).join('');
    drawerHtml = `
      <div class="search-drawer">
        <div class="drawer-bar">
          <strong style="font-size:0.78rem;">${modeTitle}：</strong>
          <input type="text" id="q-input-${it.seq}" value="${escapeHtml(curQ)}" onkeydown="if(event.key==='Enter') runLiveSearch('${safeKey}', ${it.seq}, '${activeSlot}')" />
          <button type="button" class="mini-btn search-wiki" onclick="runLiveSearch('${safeKey}', ${it.seq}, '${activeSlot}')">🔍 再検索</button>
          <a class="mini-btn off-btn" href="${commonsExt}" target="_blank" rel="noopener">Commons別窓↗</a>
          <button type="button" class="mini-btn manyo-btn" onclick="openManyoHyakkaSearch('${safeKey}')">📚 万葉百科で故地確認↗</button>
          <button type="button" class="mini-btn off-btn" onclick="openSearchDrawer('${safeKey}', ${it.seq}, '${activeSlot}', false)">✕ 閉じる</button>
        </div>
        <div class="kw-chips"><span>ピンポイント候補ワード：</span>${chips}</div>
        <div class="cand-grid" id="cand-grid-${it.seq}"></div>
      </div>
    `;
  }

  return `<div class="db-grid-cols">${col1}${col2}${col3}${col4}</div>${drawerHtml}`;
}

function rerenderRow(it) {
  const row = document.getElementById('row-' + it.seq);
  if (!row) {
    renderBoard();
    return;
  }
  const st = getEffectiveState(it);
  row.className = `db-row ${!st.wikiUrl ? 'missing-wiki' : ''} ${isModified(it) ? 'modified-row' : ''}`;
  row.innerHTML = buildRowHtml(it);
  const slot = openDrawerSlotBySeq[it.seq];
  if (slot) renderCandidateGrid(it.key, it.seq, slot);
}

function renderBoard() {
  updateCounts();
  const list = getFilteredItems();
  document.getElementById('showingLabel').textContent = `${list.length} 件表示中`;
  if (!document.getElementById('overviewMapBox').classList.contains('hidden')) {
    refreshMapPins();
  }
  const container = document.getElementById('dbList');
  container.innerHTML = '';
  list.forEach(it => {
    const st = getEffectiveState(it);
    const row = document.createElement('article');
    row.id = 'row-' + it.seq;
    row.className = `db-row ${!st.wikiUrl ? 'missing-wiki' : ''} ${isModified(it) ? 'modified-row' : ''}`;
    row.innerHTML = buildRowHtml(it);
    container.appendChild(row);
    const slot = openDrawerSlotBySeq[it.seq];
    if (slot) renderCandidateGrid(it.key, it.seq, slot);
  });
}

function openExportModal() {
  const payload = [];
  const lines = ['【歌枕マスターDB 採用・保管反映リスト】'];
  ITEMS.forEach(it => {
    if (!isModified(it)) return;
    const ed = edits[it.key];
    const parts = [];
    if (ed.wikiFile) parts.push(`📷WIKI採用: File:${ed.wikiFile}`);
    if (ed.useAltWiki) parts.push('📷WIKI切替: 旧候補写真を使用');
    if (ed.wikiOff) parts.push('📷WIKIをOFF');
    if (ed.ukiyoeFile) parts.push(`🎨浮世絵採用: File:${ed.ukiyoeFile}`);
    if (ed.ukiyoeOff) parts.push('🎨浮世絵をOFF');
    if (ed.memo) parts.push(`📝比定メモ: ${ed.memo}`);
    lines.push(`- [${it.key}]（${it.works.join('・') || '予備'}） ｜ ${parts.join(' ／ ')}`);
    payload.push({ key: it.key, ...ed });
  });
  if (payload.length === 0) {
    lines.push('（まだ採用・変更された項目がありません。各行の「🔍 現地写真を検索して補完」や「🎨 浮世絵・名所図会を検索」から写真を選ぶとここに自動集計されます）');
  } else {
    lines.push('');
    lines.push('--- JSON ---');
    lines.push(JSON.stringify(payload, null, 2));
  }
  document.getElementById('exportTextarea').value = lines.join('\n');
  document.getElementById('exportModal').classList.add('open');
}

function closeExportModal() {
  document.getElementById('exportModal').classList.remove('open');
}

function copyExportText() {
  const ta = document.getElementById('exportTextarea');
  navigator.clipboard.writeText(ta.value).then(() => {
    alert('コピーしました！チャットに貼り付けていただければ一括でローカル保管＆全作品反映を行います。');
  });
}

function clearAllEdits() {
  if (!confirm('選択・変更記録をすべてリセットしますか？')) return;
  edits = {};
  saveEdits();
  closeExportModal();
  renderBoard();
}

(() => {
  const initQ = new URLSearchParams(window.location.search).get('q');
  if (initQ) {
    const sb = document.getElementById('searchBox');
    if (sb) sb.value = initQ;
    document.getElementById('comboFilter').value = 'all_entries';
  }
  renderBoard();
})();
</script>
</body>
