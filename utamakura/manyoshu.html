  async function loadAndRenderInlineCandidates(placeObj, wikiTitle, dispSurface, forceReload = false) {
    const grid = document.getElementById('inlineCandidatesGrid');
    if (!grid) return;
    const cacheKey = `${placeObj.key}__${wikiTitle}`;

    let list = (!forceReload && inlinePlaceCandidatesCache[cacheKey]) ? inlinePlaceCandidatesCache[cacheKey] : null;
    if (!list) {
      grid.innerHTML = `<div style="grid-column:1/-1; padding:14px; color:#0d47a1; font-size:0.86rem;">⏳ Wikipedia記事「${escapeHtmlSimple(wikiTitle)}」から候補写真を取得中...</div>`;
      list = [];
      const seenKeys = new Set();

      // A. 国指定名勝「おくのほそ道の風景地」の該当写真があれば先頭に追加
      if (wikiTitle === 'おくのほそ道の風景地') {
        const matchedF = await getFukeichiCandidatesForPlace(placeObj);
        const allF = await loadFukeichiWikiData();
        for (const item of [...matchedF, ...allF]) {
          if (!seenKeys.has(item.fileKey)) {
            seenKeys.add(item.fileKey);
            list.push(item);
          }
        }
      } else if (placeObj.fukeichi_title) {
        const matchedF = await getFukeichiCandidatesForPlace(placeObj);
        for (const item of matchedF) {
          if (!seenKeys.has(item.fileKey)) {
            seenKeys.add(item.fileKey);
            list.push(item);
          }
        }
      }

      // B. 指定されたWikipedia記事内の画像を取得（もし曖昧さ回避等で0件かつ placeObj.wiki_title が別にある場合は自動フォールバック）
      const titlesToTry = [wikiTitle];
      if (placeObj.wiki_title && placeObj.wiki_title !== wikiTitle) {
        titlesToTry.push(placeObj.wiki_title);
      }

      for (const targetTitle of titlesToTry) {
        if (!targetTitle || targetTitle === 'おくのほそ道の風景地') continue;
        try {
          const piUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(targetTitle)}&prop=pageimages|images&pithumbsize=500&imlimit=30&format=json&origin=*`;
          const piRes = await fetch(piUrl);
          if (piRes.ok) {
            const piData = await piRes.json();
            const pages = (piData.query && piData.query.pages) ? Object.values(piData.query.pages) : [];
            const imgTitles = [];
            for (const pg of pages) {
              if (pg.pageimage && !isExcludedInlineImage(pg.pageimage)) {
                imgTitles.push('File:' + pg.pageimage);
              }
              if (pg.images) {
                for (const im of pg.images) {
                  if (im.title && !isExcludedInlineImage(im.title) && !imgTitles.includes(im.title)) {
                    imgTitles.push(im.title);
                  }
                }
              }
            }
            if (imgTitles.length > 0) {
              // フォールバック先の記事でヒットした場合は入力欄の表示も同期する
              const inputEl = document.getElementById('inlineWikiInput');
              if (inputEl && targetTitle !== wikiTitle) inputEl.value = targetTitle;
              const sliceStr = imgTitles.slice(0, 14).join('|');
              const iiUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(sliceStr)}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=450&format=json&origin=*`;
              const iiRes = await fetch(iiUrl);
              if (iiRes.ok) {
                const iiData = await iiRes.json();
                const iiPages = (iiData.query && iiData.query.pages) ? Object.values(iiData.query.pages) : [];
                for (const imgPg of iiPages) {
                  if (!imgPg.imageinfo || !imgPg.imageinfo[0]) continue;
                  const info = imgPg.imageinfo[0];
                  const thumbUrl = info.thumburl || info.url;
                  if (!thumbUrl) continue;
                  const cleanFk = (imgPg.title || '').replace(/^(File|ファイル):/i, '').trim();
                  if (isExcludedInlineImage(cleanFk) || seenKeys.has(cleanFk)) continue;

                  let desc = '';
                  if (info.extmetadata && info.extmetadata.ImageDescription && info.extmetadata.ImageDescription.value) {
                    desc = info.extmetadata.ImageDescription.value.replace(/<[^>]+>/g, '').trim();
                  }
                  if (desc && isExcludedInlineImage(desc)) continue;
                  if (!desc || desc.length > 65) {
                    desc = `${targetTitle}（${cleanFk.slice(0, 32)}）`;
                  }
                  seenKeys.add(cleanFk);
                  list.push({
                    fileKey: cleanFk,
                    url: info.url,
                    thumbUrl: thumbUrl,
                    caption: desc,
                    sourceType: 'wiki',
                    articleTitle: targetTitle
                  });
                }
              }
            }
          }
        } catch (e) {}
      }
      inlinePlaceCandidatesCache[cacheKey] = list;
    }

    if (list.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1; padding:14px; background:#fff; border:1px solid #90caf9; border-radius:6px; color:#0d47a1; font-size:0.82rem;">⚠️ Wikipedia記事「${escapeHtmlSimple(wikiTitle)}」内に風景写真が見つかりませんでした。上の入力欄に別のWikipedia記事名を入れて「🔄 この記事から画像を取得」を押すか、上の「🎨 ソース①：浮世絵データベース」からお選びください。</div>`;
      return;
    }

    const ov = getPlaceImageOverride(placeObj.key);
    const activeFk = ov ? (ov.fileKey || '') : (placeObj.fixed_image_file || '');

    grid.innerHTML = '';
    list.forEach((cand, idx) => {
      const isSelected = activeFk && activeFk.replace(/^(File|ファイル):/i, '').trim() === cand.fileKey;
      const ownerOther = getInlineOwnerOfImage(cand.fileKey, placeObj.key);
      const card = document.createElement('div');
      card.style.cssText = `background:#fff; border:2px solid ${isSelected ? '#2e7d32' : '#90caf9'}; border-radius:6px; overflow:hidden; cursor:${ownerOther ? 'not-allowed' : 'pointer'}; opacity:${ownerOther ? '0.38' : '1'}; display:flex; flex-direction:column; box-shadow:0 1px 4px rgba(0,0,0,0.08); transition:transform 0.12s;`;
      card.onclick = () => {
        if (ownerOther) {
          window.alert(`この画像はすでに「${ownerOther}」に紐づけられています（1画像＝1地名専用）。`);
          return;
        }
        selectInlineCandidateFromList(placeObj.key, list[idx], dispSurface);
      };

      card.innerHTML = `
        <div style="width:100%; height:125px; background:#111; position:relative; overflow:hidden;">
          <img src="${cand.thumbUrl}" alt="${escapeHtmlSimple(cand.caption)}" loading="lazy" style="width:100%; height:100%; object-fit:cover;" />
          <span style="position:absolute; top:5px; left:5px; background:#1565c0; color:#fff; font-size:0.68rem; font-weight:bold; padding:2px 6px; border-radius:3px;">📷 Wiki</span>
          ${isSelected ? `<span style="position:absolute; top:5px; right:5px; background:#2e7d32; color:#fff; font-size:0.68rem; font-weight:bold; padding:2px 6px; border-radius:3px;">✓ 選択中</span>` : ''}
          ${ownerOther ? `<span style="position:absolute; bottom:5px; right:5px; background:#c62828; color:#fff; font-size:0.68rem; font-weight:bold; padding:2px 6px; border-radius:3px;">🔒 ${escapeHtmlSimple(ownerOther)}で使用中</span>` : ''}
        </div>
        <div style="padding:7px 8px; font-size:0.76rem; line-height:1.35; color:#3e2723; flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:4px;">
          <div style="word-break:break-word;">${escapeHtmlSimple(cand.caption)}</div>
          <div style="font-size:0.70rem; color:#1565c0; font-weight:bold;">📌 ソース: ${escapeHtmlSimple(cand.articleTitle)}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function selectInlineCandidateFromList(placeKey, cand, dispSurface) {
    if (!cand) return;

    placeImageOverrides[placeKey] = {
      fileKey: cand.fileKey,
      url: cand.url,
      thumbUrl: cand.thumbUrl,
      caption: cand.caption,
      sourceType: cand.sourceType,
      articleTitle: cand.articleTitle
    };
    savePlaceImageOverrides();

    // 右下の指摘リスト（feedbackItems）にも同じ地名の古い画像指定を上書きする形で1行追加
    feedbackItems = feedbackItems.filter(it => !(it.currentTag === `地名(${placeKey})` && it.action.startsWith('🖼️ 画像・ソース指定:')));
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: currentActiveId,
      blockLabel: '画像・ソース設定',
      word: dispSurface || placeKey,
      contextStr: `地名キー: ${placeKey}`,
      currentTag: `地名(${placeKey})`,
      action: `🖼️ 画像・ソース指定: File:${cand.fileKey} （ソース: ${cand.articleTitle} ｜ キャプション: ${cand.caption}）`
    });
    saveFeedbackItems();

    // モーダルを閉じて地図上のプレビューを即座に更新
    closeModal();
    focusPlaceOnMap(placeKey, dispSurface || placeKey);
  }

  function clearInlinePlaceImage(placeKey, dispSurface) {
    placeImageOverrides[placeKey] = {
      fileKey: '',
      url: '',
      thumbUrl: '',
      caption: '',
      sourceType: 'none',
      articleTitle: ''
    };
    savePlaceImageOverrides();
    const placeObj = PLACES.find(p => p.key === placeKey);
    if (placeObj) {
      placeObj.fixed_image_url = '';
      placeObj.fixed_image_file = '';
    }
    delete ukiyoeUrlCache[placeKey];
    const imgEl = document.getElementById('toastUkiyoeImg');
    if (imgEl) imgEl.style.display = 'none';
    renderInlineCurrentSelBox(placeObj, dispSurface);
    const selEl = document.getElementById('inlineUkiyoeSelect');
    if (placeObj && selEl) loadAndRenderInlineUkiyoe(placeObj, selEl.value, dispSurface, false);
    const inputEl = document.getElementById('inlineWikiInput');
    const wikiTitle = inputEl ? inputEl.value.trim() : (placeObj ? placeObj.wiki_title : '');
    if (placeObj) loadAndRenderInlineCandidates(placeObj, wikiTitle, dispSurface, false);
  }

  function startMapCoordPicker(placeKey, surfaceText) {
    mapCoordPickerState = {
      recId: currentActiveId,
      placeKey: placeKey,
      surfaceText: surfaceText
    };
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `<div style="color:#ffd54f; font-weight:bold;">🎯 【位置指定モード】地図上で「${surfaceText}」の正しい位置をクリックしてください（自動で緯度・経度が指摘リストに入ります）</div>`;
    document.getElementById('map').style.cursor = 'crosshair';
  }

  map.on('click', (e) => {
    if (!mapCoordPickerState) return;
    const lat = e.latlng.lat.toFixed(COORD_DECIMAL_DIGITS);
    const lng = e.latlng.lng.toFixed(COORD_DECIMAL_DIGITS);
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: mapCoordPickerState.recId,
      blockLabel: '地図座標指定',
      word: mapCoordPickerState.surfaceText,
      contextStr: `登録キー: ${mapCoordPickerState.placeKey}`,
      currentTag: `地名(${mapCoordPickerState.placeKey})`,
      action: `📍 正しい座標を地図クリックで指定 ➔ 緯度: ${lat}, 経度: ${lng}`
    });
    saveFeedbackItems();

    L.circleMarker([e.latlng.lat, e.latlng.lng], {
      radius: 8,
      color: '#ffeb3b',
      fillColor: '#d50000',
      fillOpacity: 0.9,
      weight: 2.5
    }).addTo(map).bindTooltip(`🎯 指摘座標: ${mapCoordPickerState.surfaceText} (${lat}, ${lng})`, { permanent: true, direction: 'top' });

    document.getElementById('map').style.cursor = '';
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `✅ <strong>「${mapCoordPickerState.surfaceText}」の指定座標 (${lat}, ${lng}) を右下の指摘リストに追加しました！</strong>`;
    mapCoordPickerState = null;
  });

  function toggleFeedbackTray() {
    const tray = document.getElementById('feedbackTray');
    const icon = document.getElementById('feedbackTrayToggleIcon');
    tray.classList.toggle('minimized');
    icon.textContent = tray.classList.contains('minimized') ? '▲ 展開する' : '▼ 折りたたむ';
  }

  function removeFeedbackItem(idx) {
    feedbackItems.splice(idx, 1);
    saveFeedbackItems();
  }

  function clearAllFeedback() {
    if (feedbackItems.length === 0) return;
    feedbackItems = [];
    saveFeedbackItems();
  }

  function renderFeedbackTray() {
    const badge = document.getElementById('feedbackCountBadge');
    const body = document.getElementById('feedbackTrayBody');
    if (!badge || !body) return;

    badge.textContent = `${feedbackItems.length}件`;

    if (feedbackItems.length === 0) {
      body.innerHTML = `
        <div class="feedback-empty">
          本文の気になる文字を<strong>なぞって選択</strong>するか、色付き単語を<strong>右クリック</strong>（🛠️指摘モードON時は左クリック）すると、ワンクリックでここに指摘が溜まります。
        </div>
      `;
      return;
    }

    body.innerHTML = feedbackItems.map((item, idx) => `
      <div class="feedback-item">
        <div>
          <div><strong>[${item.recId}・${item.blockLabel}]</strong> 「<span style="color:#ffd54f; font-weight:bold;">${item.word}</span>」 <span style="color:#b0bec5; font-size:0.74rem;">(${item.currentTag})</span></div>
          <div style="color:#a5d6a7; font-weight:bold; margin-top:2px;">➔ ${item.action}</div>
          <div style="color:#ccc; font-size:0.74rem; margin-top:1px;">文脈: ${item.contextStr}</div>
        </div>
        <button class="feedback-item-del" onclick="removeFeedbackItem(${idx})" title="この指摘を削除">✕</button>
      </div>
    `).join('');
  }

  function copyAllFeedbackToClipboard() {
    if (feedbackItems.length === 0) {
      window.alert('まだ指摘リストが空です。本文の文字をドラッグ選択するか、色付き単語を右クリックして指摘を追加してください。');
      return;
    }

    const lines = ['【万葉集　歌枕名歌選 ピンポイント指摘リスト】'];
    feedbackItems.forEach((item, i) => {
      lines.push(`${i + 1}. [${item.recId} / ${item.blockLabel}] 「${item.word}」（現在: ${item.currentTag}｜文脈: ${item.contextStr}） ➔ ${item.action}`);
    });
    const textToCopy = lines.join('\n');

    navigator.clipboard.writeText(textToCopy).then(() => {
      const btn = document.getElementById('feedbackCopyBtn');
      const origText = btn.textContent;
      btn.textContent = '✅ コピーしました！そのままチャットに貼り付けてください';
      btn.style.background = '#66bb6a';
      setTimeout(() => {
        btn.textContent = origText;
        btn.style.background = '';
      }, 2500);
    }).catch(() => {
      window.prompt('以下のテキストをコピーしてチャットに貼り付けてください：', textToCopy);
    });
  }

  applyEnvironmentModeUI();
  renderFeedbackTray();
  setActiveRecord("v3_p1_1");
</script>
</body>
</html>
