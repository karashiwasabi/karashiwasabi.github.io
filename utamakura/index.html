rsons": "", "places": "富士山,上野,谷中,千住", "era_year": "元禄二年弥生廿七日", "source_book": "", "keywords": "弥生,前途三千里", "raw_tagged": "{{special:弥生|弥生}}も末の七日、明ぼのゝ空朧々として、月は在明にて光おさまれる物から、{{place:富士山|不二の峯}}かすかにみえて、{{place:上野|上野}}・{{place:谷中|谷中}}の花の梢、又いつかはと心ぼそし。むつまじきかぎりは宵よりつどひて、舟に乗て送る。{{place:千住|千じゆ}}と云所にて船をあがれば、{{special:前途三千里|前途三千里}}のおもひ胸にふさがりて、幻のちまたに離別の泪をそゝぐ。", "kakikudashi_tagged": "{{special:弥生|弥生}}も末の七日、あけぼのの空朧々として、月は在明にて光おさまれるものから、{{place:富士山|不二の峯}}かすかに見えて、{{place:上野|上野}}・{{place:谷中|谷中}}の花の梢、またいつかはと心細し。むつまじきかぎりは宵よりつどひて、舟に乗りて送る。{{place:千住|千住}}といふ所にて船をあがれば、{{special:前途三千里|前途三千里}}の思ひ胸にふさがりて、幻のちまたに離別の涙をそそぐ。", "translation_tagged": "{{special:弥生|弥生}}も二十七日、夜明けの空はおぼろにかすみ、有明の月は光を失いかけているものの、{{place:富士山|不二の峯}}がかすかに望まれ、{{place:上野|上野}}や{{place:谷中|谷中}}の桜の梢も、再びいつ見られることかと心細い。親しい門人や友人たちは前の晩から集まって、舟に同乗して見送ってくれた。{{place:千住|千住}}という所で舟を上がると、これから先に待つ{{special:前途三千里|前途三千里}}のはるかな旅路を思う気持ちで胸がいっぱいになり、幻のようなこの世の別れ道で惜別の涙を流した。"}, {"id": "v1_p2_2", "volume": 1, "book": "おくのほそ道", "section_title": "二、旅立ち（千住）", "para_index": 2, "type": "発句・注", "verse": {"genre": "haiku", "l1": "行春や", "l2": "鳥啼魚の", "l3": "目は泪", "author": "松尾芭蕉", "bg_theme": "yukuharu_senju", "bg_path": "shortliterature/bg_yukuharu_senju.jpg", "bg_title": "🌸 行く春・千住の舟出と矢立（第2句専用描き下ろし背景）"}, "raw_text": "行春や鳥啼魚の目は泪。是を矢立の初として、行道なをすゝまず。人々は途中に立ならびて、後かげの見ゆる迄はと、見送なるべし。", "kakikudashi": "行く春や鳥啼き魚の目は泪。これを矢立の初として、行く道なほ進まず。人々は途中に立ち並びて、後ろ影の見ゆるまではと、見送るなるべし。", "translation": "過ぎ行く春を惜しみ、鳥は悲しげに鳴き、魚の目にも涙が浮かんでいることよ。この一句を矢立の初として書き留めたものの、行く手の足取りはなお前に進まない。見送りの人々は道中に立ち並んで、私たちの後ろ姿が見える限りはと、いつまでも見送ってくれているのであろう。", "persons": "", "places": "", "era_year": "元禄二年弥生廿七日", "source_book": "", "keywords": "矢立の初", "raw_tagged": "行春や鳥啼魚の目は泪。是を{{special:矢立の初|矢立の初}}として、行道なをすゝまず。人々は途中に立ならびて、後かげの見ゆる迄はと、見送なるべし。", "kakikudashi_tagged": "行く春や鳥啼き魚の目は泪。これを{{special:矢立の初|矢立の初}}として、行く道なほ進まず。人々は途中に立ち並びて、後ろ影の見ゆるまではと、見送るなるべし。", "translation_tagged": "過ぎ行く春を惜しみ、鳥は悲しげに鳴き、魚の目にも涙が浮かんでいることよ。この一句を{{special:矢立の初|矢立の初}}として書き留めたものの、行く手の足取りはなお前に進まない。見送りの人々は道中に立ち並んで、私たちの後ろ姿が見える限りはと、いつまでも見送ってくれているのであろう。"}, {"id": "v1_p3_1", "volume": 1, "book": "おくのほそ道", "section_title": "三、草加", "para_index": 3, "type": "本文", "verse": null, "raw_text": "ことし元禄二とせにや、奥羽長途の行脚只かりそめに思ひたちて、呉天に白髪の恨を重ねといへ共、耳にふれていまだめに見ぬさかひ、若生て帰らばと、定なき頼の末をかけ、其日漸早加と云宿にたどり着にけり。痩骨の肩にかゝれる物先くるしむ。只身すがらにと出立侍を、紙子一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいはさりがたき餞などしたるは、さすがに打捨がたくて、路次の煩となれるこそわりなき。", "kakikudashi": "ことし元禄二とせにや、奥羽長途の行脚ただかりそめに思ひ立ちて、呉天に白髪の恨みを重ねといへども、耳にふれていまだ目に見ぬ境、もし生きて帰らばと、定めなき頼みの末をかけ、その日やうやく草加といふ宿にたどり着きにけり。痩骨の肩にかかれる物まず苦しむ。ただ身すがらにと出で立ち侍るを、紙子一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいは去りがたき餞などしたるは、さすがに打ち捨てがたくて、路次の煩ひとなれるこそわりなき。", "translation": "今年、元禄二年のことであろうか、奥羽への遠い旅路の行脚をただふと思い立って、呉天に白髪を重ねるような旅の苦労を味わうとはいえ、噂に聞くばかりでまだ目にしたことのない土地を、もし生きて帰れたならと、あてにならない望みに一縷の期待をかけて、その日はようやく草加という宿場にたどり着いた。痩せ細った肩に食い込む荷物が、まず何より我が身を苦しめる。ただ身軽に身一つでと出発したつもりであったのに、紙子一枚は夜の寒さしのぎ、浴衣や雨具、墨や筆の類、あるいは断りきれない餞別として贈られた品々は、さすがに打ち捨てるわけにもいかず、道中の厄介な重荷となってしまったのはどうしようもないことである。", "persons": "", "places": "奥州（白河・松島）圏,草加", "era_year": "元禄二年弥生廿七日", "source_book": "", "keywords": "元禄,呉天に白髪,紙子", "raw_tagged": "ことし{{special:元禄|元禄}}二とせにや、{{place:奥州（白河・松島）圏|奥羽}}長途の行脚只かりそめに思ひたちて、{{special:呉天に白髪|呉天に白髪}}の恨を重ねといへ共、耳にふれていまだめに見ぬさかひ、若生て帰らばと、定なき頼の末をかけ、其日漸{{place:草加|早加}}と云宿にたどり着にけり。痩骨の肩にかゝれる物先くるしむ。只身すがらにと出立侍を、{{special:紙子|紙子}}一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいはさりがたき餞などしたるは、さすがに打捨がたくて、路次の煩となれるこそわりなき。", "kakikudashi_tagged": "ことし{{special:元禄|元禄}}二とせにや、{{place:奥州（白河・松島）圏|奥羽}}長途の行脚ただかりそめに思ひ立ちて、{{special:呉天に白髪|呉天に白髪}}の恨みを重ねといへども、耳にふれていまだ目に見ぬ境、もし生きて帰らばと、定めなき頼みの末をかけ、その日やうやく{{place:草加|草加}}といふ宿にたどり着きにけり。痩骨の肩にかかれる物まず苦しむ。ただ身すがらにと出で立ち侍るを、{{special:紙子|紙子}}一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいは去りがたき餞などしたるは、さすがに打ち捨てがたくて、路次の煩ひとなれるこそわりなき。", "translation_tagged": "今年、{{special:元禄|元禄}}二年のことであろうか、{{place:奥州（白河・松島）圏|奥羽}}への遠い旅路の行脚をただふと思い立って、{{special:呉天に白髪|呉天に白髪}}を重ねるような旅の苦労を味わうとはいえ、噂に聞くばかりでまだ目にしたことのない土地を、もし生きて帰れたならと、あてにならない望みに一縷の期待をかけて、その日はようやく{{place:草加|草加}}という宿場にたどり着いた。痩せ細った肩に食い込む荷物が、まず何より我が身を苦しめる。ただ身軽に身一つでと出発したつもりであったのに、{{special:紙子|紙子}}一枚は夜の寒さしのぎ、浴衣や雨具、墨や筆の類、あるいは断りきれない餞別として贈られた品々は、さすがに打ち捨てるわけにもいかず、道中の厄介な重荷となってしまったのはどうしようもないことである。"}, {"id": "v1_p4_1", "volume": 1, "book": "おくのほそ道", "section_title": "四、室の八島", "para_index": 4, "type": "本文", "verse": null, "raw_text": "室の八島に詣す。同行曾良が曰、「此神は木の花さくや姫の神と申て、富士一躰也。無戸室に入て焼給ふちかひのみ中に、火々出見のみこと生れ給ひしより、室の八島と申。又煙を読習し侍もこの謂也」。将このしろといふ魚を禁ず、縁記の旨世に伝ふ事も侍し。", "kakikudashi": "室の八島に詣す。同行曾良が曰く、「この神は木の花さくや姫の神と申して、富士一体なり。無戸室に入りて焼き給ふ誓ひのみ中に、火々出見のみこと生まれ給ひしより、室の八島と申す。また煙を詠み習はし侍るもこの謂なり」。またこのしろといふ魚を禁ず、縁起の旨世に伝ふ事も侍りし。", "translation": "下野国の歌枕である室の八島に参詣した。同行の曾良が言うには、「この社の祭神は木花開耶姫の神と申し上げて、富士山の浅間神社と同一の神である。姫が無戸室に入って火を放ち身の潔白を証明なさった誓いの炎の中で、火々出見命がお生まれになったことから、ここを室の八島と申し上げる。また和歌でこの地を詠む習わしとして煙を詠み込むのも、この故事によるものである」。さらにこの地ではこのしろという魚を食べることを禁じており、その由来の物語が世間に語り伝えられているということであった。", "persons": "曾良,木花開耶姫,火々出見命", "places": "室の八島,富士山", "era_year": "元禄二年弥生末", "source_book": "", "keywords": "無戸室,このしろ", "raw_tagged": "{{place:室の八島|室の八島}}に詣す。同行{{person:曾良|曾良}}が曰、「此神は{{person:木花開耶姫|木の花さくや姫}}の神と申て、{{place:富士山|富士}}一躰也。{{special:無戸室|無戸室}}に入て焼給ふちかひのみ中に、{{person:火々出見命|火々出見のみこと}}生れ給ひしより、{{place:室の八島|室の八島}}と申。又煙を読習し侍もこの謂也」。将{{special:このしろ|このしろ}}といふ魚を禁ず、縁記の旨世に伝ふ事も侍し。", "kakikudashi_tagged": "{{place:室の八島|室の八島}}に詣す。同行{{person:曾良|曾良}}が曰く、「この神は{{person:木花開耶姫|木の花さくや姫}}の神と申して、{{place:富士山|富士}}一体なり。{{special:無戸室|無戸室}}に入りて焼き給ふ誓ひのみ中に、{{person:火々出見命|火々出見のみこと}}生まれ給ひしより、{{place:室の八島|室の八島}}と申す。また煙を詠み習はし侍るもこの謂なり」。また{{special:このしろ|このしろ}}といふ魚を禁ず、縁起の旨世に伝ふ事も侍りし。", "translation_tagged": "下野国の歌枕である{{place:室の八島|室の八島}}に参詣した。同行の{{person:曾良|曾良}}が言うには、「この社の祭神は{{person:木花開耶姫|木花開耶姫}}の神と申し上げて、{{place:富士山|富士山}}の浅間神社と同一の神である。姫が{{special:無戸室|無戸室}}に入って火を放ち身の潔白を証明なさった誓いの炎の中で、{{person:火々出見命|火々出見命}}がお生まれになったことから、ここを{{place:室の八島|室の八島}}と申し上げる。また和歌でこの地を詠む習わしとして煙を詠み込むのも、この故事によるものである」。さらにこの地では{{special:このしろ|このしろ}}という魚を食べることを禁じており、その由来の物語が世間に語り伝えられているということであった。"}, {"id": "v1_p5_1", "volume": 1, "book": "おくのほそ道", "section_title": "五、日光（仏五左衛門）", "para_index": 5, "type": "本文", "verse": null, "raw_text": "卅日、日光山の麓に泊る。あるじの云けるやう、「我名を仏五左衛門と云。万正直を旨とする故に、人かくは申侍まゝ、一夜の草の枕も打解て休給へ」と云。いかなる仏の濁世塵土に示現して、かゝる桑門の乞食順礼ごときの人をたすけ給ふにやと、あるじのなす事に心をとゞめてみるに、唯無智無分別にして正直偏固の者也。剛毅木訥の仁に近ききたぐひ、気稟の清質尤尊ぶべし。", "kakikudashi": "三十日、日光山の麓に泊まる。あるじの言ひけるやう、「我が名を仏五左衛門と言ふ。よろづ正直を旨とするゆゑに、人かくは申し侍るまま、一夜の草の枕も打ち解けて休み給へ」と言ふ。いかなる仏の濁世塵土に示現して、かかる桑門の乞食巡礼ごときの人を助け給ふにやと、あるじのなす事に心をとどめて見るに、ただ無智無分別にして正直偏固の者なり。剛毅木訥の仁に近きたぐひ、気稟の清質もつとも尊ぶべし。", "translation": "三月三十日、日光山の麓の宿に泊まった。宿の主人が言うには、「私の名前を仏五左衛門と言います。何事にも正直を第一としておりますので、世間の人々がそう呼んでくださるのですが、今夜の旅寝もどうか気兼ねなくくつろいでお休みください」と言う。いったいどのような仏様がこの濁りきった俗世間に姿を現して、私たちのような僧形の乞食巡礼にも等しい旅人を救ってくださるのだろうかと、主人の振る舞いに注意して観察してみると、ただ無欲で損得勘定を知らず、ひたすら正直一途な人物であった。論語にいう剛毅木訥にして仁に近い人物の類であり、その生まれつきの清らかな気質はまことに尊ぶべきものである。", "persons": "仏五左衛門", "places": "日光山", "era_year": "元禄二年弥生晦日", "source_book": "", "keywords": "剛毅木訥", "raw_tagged": "卅日、{{place:日光山|日光山}}の麓に泊る。あるじの云けるやう、「我名を{{person:仏五左衛門|仏五左衛門}}と云。万正直を旨とする故に、人かくは申侍まゝ、一夜の草の枕も打解て休給へ」と云。いかなる仏の濁世塵土に示現して、かゝる桑門の乞食順礼ごときの人をたすけ給ふにやと、あるじのなす事に心をとゞめてみるに、唯無智無分別にして正直偏固の者也。{{special:剛毅木訥|剛毅木訥}}の仁に近ききたぐひ、気稟の清質尤尊ぶべし。", "kakikudashi_tagged": "三十日、{{place:日光山|日光山}}の麓に泊まる。あるじの言ひけるやう、「我が名を{{person:仏五左衛門|仏五左衛門}}と言ふ。よろづ正直を旨とするゆゑに、人かくは申し侍るまま、一夜の草の枕も打ち解けて休み給へ」と言ふ。いかなる仏の濁世塵土に示現して、かかる桑門の乞食巡礼ごときの人を助け給ふにやと、あるじのなす事に心をとどめて見るに、ただ無智無分別にして正直偏固の者なり。{{special:剛毅木訥|剛毅木訥}}の仁に近きたぐひ、気稟の清質もつとも尊ぶべし。", "translation_tagged": "三月三十日、{{place:日光山|日光山}}の麓の宿に泊まった。宿の主人が言うには、「私の名前を{{person:仏五左衛門|仏五左衛門}}と言います。何事にも正直を第一としておりますので、世間の人々がそう呼んでくださるのですが、今夜の旅寝もどうか気兼ねなくくつろいでお休みください」と言う。いったいどのような仏様がこの濁りきった俗世間に姿を現して、私たちのような僧形の乞食巡礼にも等しい旅人を救ってくださるのだろうかと、主人の振る舞いに注意して観察してみると、ただ無欲で損得勘定を知らず、ひたすら正直一途な人物であった。論語にいう{{special:剛毅木訥|剛毅木訥}}にして仁に近い人物の類であり、その生まれつきの清らかな気質はまことに尊ぶべきものである。"}, {"id": "v1_p5_2", "volume": 1, "book": "おくのほそ道", "section_title": "五、日光（青葉若葉）", "para_index": 5, "type": "発句・注", "verse": {"genre": "haiku", "l1": "あらたうと", "l2": "青葉若葉の", "l3": "日の光", "author": "松尾芭蕉", "bg_theme": "nikko_aoba", "bg_path": "shortliterature/bg_nikko_aoba.jpg", "bg_title": "🌿 日光・青葉若葉の日の光（第3句専用描き下ろし背景）"}, "raw_text": "卯月朔日、御山に詣拝す。往昔此御山を二荒山と書しを、空海大師開基の時、日光と改給ふ。千歳未来をさとりの給ふにや、今此御光一天にかゝやきて、恩沢八荒にあふれ、四民安堵の栖穏なり。猶憚多くて筆をさし置ぬ。あらたうと青葉若葉の日の光。", "kakikudashi": "卯月朔日、御山に詣拝す。往昔この御山を二荒山と書きしを、空海大師開基の時、日光と改め給ふ。千歳未来を悟りのたまふにや、今この御光一天にかがやきて、恩沢八荒にあふれ、四民安堵の栖穏やかなり。なほ憚り多くて筆をさし置きぬ。あらたうと青葉若葉の日の光。", "translation": "卯月の一日、日光山のお社に参拝した。大昔にはこのお山を二荒山と書いていたのを、空海大師が開山なさった時に、日光と改められた。千年先の未来まで見通して名付けられたのであろうか、今やこの東照宮の御威光は天下いっぱいに輝き渡り、その恵みは八方の隅々まであふれ、四民が安心して暮らす住まいは実に穏やかである。これ以上詳しく書き記すのは恐れ多いことなので、ここで筆を置くことにした。ああなんと尊いことであろうか、みずみずしい青葉や若葉の上に、神々しい日の光が照り輝いている。", "persons": "空海", "places": "日光山", "era_year": "元禄二年卯月朔日", "source_book": "", "keywords": "卯月,四民", "raw_tagged": "{{special:卯月|卯月}}朔日、御山に詣拝す。往昔此御山を{{place:日光山|二荒山}}と書しを、{{person:空海|空海大師}}開基の時、{{place:日光山|日光}}と改給ふ。千歳未来をさとりの給ふにや、今此御光一天にかゝやきて、恩沢八荒にあふれ、{{special:四民|四民}}安堵の栖穏なり。猶憚多くて筆をさし置ぬ。あらたうと青葉若葉の日の光。", "kakikudashi_tagged": "{{special:卯月|卯月}}朔日、御山に詣拝す。往昔この御山を{{place:日光山|二荒山}}と書きしを、{{person:空海|空海大師}}開基の時、{{place:日光山|日光}}と改め給ふ。千歳未来を悟りのたまふにや、今この御光一天にかがやきて、恩沢八荒にあふれ、{{special:四民|四民}}安堵の栖穏やかなり。なほ憚り多くて筆をさし置きぬ。あらたうと青葉若葉の日の光。", "translation_tagged": "{{special:卯月|卯月}}の一日、日光山のお社に参拝した。大昔にはこのお山を{{place:日光山|二荒山}}と書いていたのを、{{person:空海|空海大師}}が開山なさった時に、{{place:日光山|日光}}と改められた。千年先の未来まで見通して名付けられたのであろうか、今やこの東照宮の御威光は天下いっぱいに輝き渡り、その恵みは八方の隅々まであふれ、{{special:四民|四民}}が安心して暮らす住まいは実に穏やかである。これ以上詳しく書き記すのは恐れ多いことなので、ここで筆を置くことにした。ああなんと尊いことであろうか、みずみずしい青葉や若葉の上に、神々しい日の光が照り輝いている。"}, {"id": "v1_p6_1", "volume": 1, "book": "おくのほそ道", "section_title": "六、黒髪山・裏見の滝", "para_index": 6, "type": "本文", "verse": {"genre": "haiku", "l1": "剃捨て", "l2": "黒髪山に", "l3": "衣更", "author": "河合曾良", "bg_theme": "kurokami_koromogae", "bg_path": "shortliterature/bg_kurokami_koromogae.jpg", "bg_title": "⛰️ 黒髪山・墨染の衣更（第4句専用描き下ろし背景）"}, "raw_text": "黒髪山は、霞かゝりて、雪いまだ白し。剃捨て黒髪山に衣更　曾良。曾良は河合氏にして、惣五郎と云へり。芭蕉の下葉に軒をならべて、予が薪水の労をたすく。このたび松しま・象潟の眺共にせん事を悦び、且は羈旅の難をいたはらんと、旅立暁、髪を剃て墨染にさまをかえ、惣五を改て宗悟とす。仍て黒髪山の句有。「衣更」の二字、力ありてきこゆ。", "kakikudashi": "黒髪山は、霞かかりて、雪いまだ白し。剃り捨てて黒髪山に衣更　曾良。曾良は河合氏にして、惣五郎と言へり。芭蕉の下葉に軒を並べて、予が薪水の労を助く。このたび松島・象潟の眺め共にせん事を悦び、かつは羈旅の難をいたはらんと、旅立つ暁、髪を剃りて墨染にさまをかへ、惣五を改めて宗悟とす。よりて黒髪山の句あり。「衣更」の二字、力ありてきこゆ。", "translation": "日光の奥にそびえる黒髪山は、春霞がたなびきながらも、頂きにはまだ雪が白く残っている。旅立ちにあたり黒髪を剃り捨てて墨染めの衣に改めたこの身で、その名もゆかしい黒髪山を仰ぎ見ながら初夏の衣更えを迎えることよ、と曾良が詠んだ。曾良は姓を河合氏といい、通称を惣五郎といった。深川の芭蕉庵のすぐ近くに軒を並べて住み、私の日々の薪水の労を助けてくれた。このたび松島や象潟の美しい眺めを私と分かち合うことを喜び、また一つには長旅の道中の苦労をいたわり助けようと、旅立ちの夜明けに髪を剃って墨染めの僧衣に姿を改め、惣五の名を改めて法名を宗悟とした。そのような経緯によって、この黒髪山の句が生まれたのである。句中の「衣更」の二字には、出家の決意と初夏のすがすがしさが重なり、ひときわ強い響きが感じられる。", "persons": "曾良", "places": "黒髪山,松島,象潟", "era_year": "元禄二年卯月朔日", "source_book": "", "keywords": "衣更,薪水の労", "raw_tagged": "{{place:黒髪山|黒髪山}}は、霞かゝりて、雪いまだ白し。剃捨て{{place:黒髪山|黒髪山}}に{{special:衣更|衣更}}　{{person:曾良|曾良}}。{{person:曾良|曾良}}は{{person:曾良|河合氏}}にして、{{person:曾良|惣五郎}}と云へり。芭蕉の下葉に軒をならべて、予が{{special:薪水の労|薪水の労}}をたすく。このたび{{place:松島|松しま}}・{{place:象潟|象潟}}の眺共にせん事を悦び、且は羈旅の難をいたはらんと、旅立暁、髪を剃て墨染にさまをかえ、{{person:曾良|惣五}}を改て{{person:曾良|宗悟}}とす。仍て{{place:黒髪山|黒髪山}}の句有。「{{special:衣更|衣更}}」の二字、力ありてきこゆ。", "kakikudashi_tagged": "{{place:黒髪山|黒髪山}}は、霞かかりて、雪いまだ白し。剃り捨てて{{place:黒髪山|黒髪山}}に{{special:衣更|衣更}}　{{person:曾良|曾良}}。{{person:曾良|曾良}}は{{person:曾良|河合氏}}にして、{{person:曾良|惣五郎}}と言へり。芭蕉の下葉に軒を並べて、予が{{special:薪水の労|薪水の労}}を助く。このたび{{place:松島|松島}}・{{place:象潟|象潟}}の眺め共にせん事を悦び、かつは羈旅の難をいたはらんと、旅立つ暁、髪を剃りて墨染にさまをかへ、{{person:曾良|惣五}}を改めて{{person:曾良|宗悟}}とす。よりて{{place:黒髪山|黒髪山}}の句あり。「{{special:衣更|衣更}}」の二字、力ありてきこゆ。", "translation_tagged": "日光の奥にそびえる{{place:黒髪山|黒髪山}}は、春霞がたなびきながらも、頂きにはまだ雪が白く残っている。旅立ちにあたり黒髪を剃り捨てて墨染めの衣に改めたこの身で、その名もゆかしい{{place:黒髪山|黒髪山}}を仰ぎ見ながら初夏の{{special:衣更|衣更え}}を迎えることよ、と{{person:曾良|曾良}}が詠んだ。{{person:曾良|曾良}}は姓を{{person:曾良|河合氏}}といい、通称を{{person:曾良|惣五郎}}といった。深川の芭蕉庵のすぐ近くに軒を並べて住み、私の日々の{{special:薪水の労|薪水の労}}を助けてくれた。このたび{{place:松島|松島}}や{{place:象潟|象潟}}の美しい眺めを私と分かち合うことを喜び、また一つには長旅の道中の苦労をいたわり助けようと、旅立ちの夜明けに髪を剃って墨染めの僧衣に姿を改め、{{person:曾良|惣五}}の名を改めて法名を{{person:曾良|宗悟}}とした。そのような経緯によって、この{{place:黒髪山|黒髪山}}の句が生まれたのである。句中の「{{special:衣更|衣更}}」の二字には、出家の決意と初夏のすがすがしさが重なり、ひときわ強い響きが感じられる。"}, {"id": "v1_p6_2", "volume": 1, "book": "おくのほそ道", "section_title": "六、黒髪山・裏見の滝", "para_index": 6, "type": "発句・注", "verse": {"genre": "haiku", "l1": "しばらくは", "l2": "滝に籠るや", "l3": "夏の初", "author": "松尾芭蕉", "bg_theme": "urami_taki", "bg_path": "shortliterature/bg_urami_taki.jpg", "bg_title": "💧 裏見の滝・千岩の碧潭と夏籠（第5句専用描き下ろし背景）"}, "raw_text": "廿余丁山を登つて滝有。岩洞の頂より飛流して百尺、千岩の碧潭に落たり。岩窟に身をひそめて、滝の裏よりみれば、うらみの滝と申伝え侍る也。しばらくは滝に籠るや夏の初。", "kakikudashi": "二十余町山を登りて滝あり。岩洞の頂より飛流して百尺、千岩の碧潭に落ちたり。岩窟に身をひそめて、滝の裏より見れば、うらみの滝と申し伝へ侍るなり。しばらくは滝に籠るや夏の初。", "translation": "二十町あまり山を登ったところに、一つの滝がある。岩窟の頂上から百尺もの高さを勢いよく飛び流れ、無数の岩石に囲まれた深い碧色の滝壺へと落ちている。岩窟の中に身をかがめて入り、落下する水流の裏側から眺めることができるため、うらみの滝と言い伝えられているのである。初夏の僧の夏籠りのように、私もまずはしばらくこの涼やかな滝の裏の岩窟にこもって、心身を清めることにしよう。", "persons": "", "places": "裏見の滝", "era_year": "元禄二年卯月二日", "source_book": "", "keywords": "滝に籠る", "raw_tagged": "廿余丁山を登つて滝有。岩洞の頂より飛流して百尺、千岩の碧潭に落たり。岩窟に身をひそめて、滝の裏よりみれば、{{place:裏見の滝|うらみの滝}}と申伝え侍る也。しばらくは{{special:滝に籠る|滝に籠る}}や夏の初。", "kakikudashi_tagged": "二十余町山を登りて滝あり。岩洞の頂より飛流して百尺、千岩の碧潭に落ちたり。岩窟に身をひそめて、滝の裏より見れば、{{place:裏見の滝|うらみの滝}}と申し伝へ侍るなり。しばらくは{{special:滝に籠る|滝に籠る}}や夏の初。", "translation_tagged": "二十町あまり山を登ったところに、一つの滝がある。岩窟の頂上から百尺もの高さを勢いよく飛び流れ、無数の岩石に囲まれた深い碧色の滝壺へと落ちている。岩窟の中に身をかがめて入り、落下する水流の裏側から眺めることができるため、{{place:裏見の滝|うらみの滝}}と言い伝えられているのである。初夏の僧の夏籠りのように、私もまずはしばらくこの涼やかな滝の裏の岩窟にこもって、心身を清めることにしよう。"}, {"id": "v1_p7_1", "volume": 1, "book": "おくのほそ道", "section_title": "七、那須野", "para_index": 7, "type": "本文", "verse": null, "raw_text": "那須の黒羽と云所に知人あれば、是より野越にかゝりて、直道をゆかんとす。遥に一村を見かけて行に、雨降日暮る。農夫の家に一夜をかりて、明れば又野中を行。そこに野飼の馬あり。草刈おのこになげきよれば、野夫といへども、さすがに情しらぬには非ず、「いかゞすべきや、されども此野は縦横にわかれて、うゐうゐ敷旅人の道ふみたがえん、あやしう侍れば、此馬のとゞまる所にて馬を返し給へ」と貸し侍りぬ。ちいさき者ふたり、馬の跡したひてはしる。独は小姫にて、名を「かさね」と云。聞なれぬ名のやさしかりければ、", "kakikudashi": "那須の黒羽といふ所に知人あれば、これより野越えにかかりて、直道を行かんとす。遥かに一村を見かけて行くに、雨降り日暮る。農夫の家に一夜を借りて、明くればまた野中を行く。そこに野飼ひの馬あり。草刈る男に嘆き寄れば、野夫といへども、さすがに情け知らぬにはあらず、「いかがすべきや、されどもこの野は縦横に分かれて、うひうひしき旅人の道踏み違へん、あやしう侍れば、この馬のとどまる所にて馬を返し給へ」と貸し侍りぬ。ちひさき者ふたり、馬の跡慕ひて走る。ひとりは小姫にて、名を「かさね」と言ふ。聞きなれぬ名のやさしかりければ、", "translation": "那須の黒羽という所に訪ねるべき知人がいたので、ここからは那須野の原を突っ切って、近道をまっすぐ進もうとした。はるか遠くに一つの村里を見定めて歩いて行くうちに、雨が降り出して日も暮れてしまった。農夫の家に一夜の宿を借りて、夜が明けると再び広い野原の中を歩いて行った。するとそこに、野に放し飼いにされている馬がいた。草を刈っていた男に近づいて道に迷う窮状を訴えると、素朴な農夫とはいってもさすがに人情を知らないわけではなく、「どうしたものかなあ、けれどもこの那須野は道が縦横に枝分かれしていて、不慣れな旅のお方が道を踏み迷われるのも心配でございますから、この馬が立ち止まる所で馬を返してください」と言って馬を貸してくれた。幼い子どもが二人、馬の後ろを慕って駆けてくる。そのうちの一人は小さな女の子で、名前を「かさね」という。このような鄙びた野原では聞き慣れないその名前が、いかにも優美で愛らしかったので、", "persons": "浄法寺高勝,かさね", "places": "那須野,黒羽", "era_year": "元禄二年卯月二日〜三日", "source_book": "", "keywords": "", "raw_tagged": "{{place:那須野|那須}}の{{place:黒羽|黒羽}}と云所に{{person:浄法寺高勝|知人}}あれば、是より野越にかゝりて、直道をゆかんとす。遥に一村を見かけて行に、雨降日暮る。農夫の家に一夜をかりて、明れば又野中を行。そこに野飼の馬あり。草刈おのこになげきよれば、野夫といへども、さすがに情しらぬには非ず、「いかゞすべきや、されども此野は縦横にわかれて、うゐうゐ敷旅人の道ふみたがえん、あやしう侍れば、此馬のとゞまる所にて馬を返し給へ」と貸し侍りぬ。ちいさき者ふたり、馬の跡したひてはしる。独は小姫にて、名を「{{person:かさね|かさね}}」と云。聞なれぬ名のやさしかりければ、", "kakikudashi_tagged": "{{place:那須野|那須}}の{{place:黒羽|黒羽}}といふ所に{{person:浄法寺高勝|知人}}あれば、これより野越えにかかりて、直道を行かんとす。遥かに一村を見かけて行くに、雨降り日暮る。農夫の家に一夜を借りて、明くればまた野中を行く。そこに野飼ひの馬あり。草刈る男に嘆き寄れば、野夫といへども、さすがに情け知らぬにはあらず、「いかがすべきや、されどもこの野は縦横に分かれて、うひうひしき旅人の道踏み違へん、あやしう侍れば、この馬のとどまる所にて馬を返し給へ」と貸し侍りぬ。ちひさき者ふたり、馬の跡慕ひて走る。ひとりは小姫にて、名を「{{person:かさね|かさね}}」と言ふ。聞きなれぬ名のやさしかりければ、", "translation_tagged": "{{place:那須野|那須}}の{{place:黒羽|黒羽}}という所に訪ねるべき{{person:浄法寺高勝|知人}}がいたので、ここからは{{place:那須野|那須野}}の原を突っ切って、近道をまっすぐ進もうとした。はるか遠くに一つの村里を見定めて歩いて行くうちに、雨が降り出して日も暮れてしまった。農夫の家に一夜の宿を借りて、夜が明けると再び広い野原の中を歩いて行った。するとそこに、野に放し飼いにされている馬がいた。草を刈っていた男に近づいて道に迷う窮状を訴えると、素朴な農夫とはいってもさすがに人情を知らないわけではなく、「どうしたものかなあ、けれどもこの那須野は道が縦横に枝分かれしていて、不慣れな旅のお方が道を踏み迷われるのも心配でございますから、この馬が立ち止まる所で馬を返してください」と言って馬を貸してくれた。幼い子どもが二人、馬の後ろを慕って駆けてくる。そのうちの一人は小さな女の子で、名前を「{{person:かさね|かさね}}」という。このような鄙びた野原では聞き慣れないその名前が、いかにも優美で愛らしかったので、"}, {"id": "v1_p7_2", "volume": 1, "book": "おくのほそ道", "section_title": "七、那須野", "para_index": 7, "type": "発句・注", "verse": {"genre": "haiku", "l1": "かさねとは", "l2": "八重撫子の", "l3": "名成べし", "author": "河合曾良", "bg_theme": "kasane_nadeshiko", "bg_path": "shortliterature/bg_kasane_nadeshiko.jpg", "bg_title": "🌸 那須野・かさねと八重撫子（第6句専用描き下ろし背景）"}, "raw_text": "かさねとは八重撫子の名成べし　曾良。頓て人里に至れば、あたひを鞍つぼに結付て馬を返しぬ。", "kakikudashi": "かさねとは八重撫子の名なるべし　曾良。やがて人里に至れば、あたひを鞍つぼに結び付けて馬を返しぬ。", "translation": "かさねという優美な名は、きっと花びらが幾重にも重なって咲く可憐な八重撫子の花の名なのであろう、と曾良が詠んだ。やがて人里にたどり着くと、駄賃を鞍壺に結び付けて、子どもたちとともに馬を元の主のもとへ返した。", "persons": "かさね,曾良", "places": "", "era_year": "元禄二年卯月三日", "source_book": "", "keywords": "八重撫子", "raw_tagged": "{{person:かさね|かさね}}とは{{special:八重撫子|八重撫子}}の名成べし　{{person:曾良|曾良}}。頓て人里に至れば、あたひを鞍つぼに結付て馬を返しぬ。", "kakikudashi_tagged": "{{person:かさね|かさね}}とは{{special:八重撫子|八重撫子}}の名なるべし　{{person:曾良|曾良}}。やがて人里に至れば、あたひを鞍つぼに結び付けて馬を返しぬ。", "translation_tagged": "{{person:かさね|かさね}}という優美な名は、きっと花びらが幾重にも重なって咲く可憐な{{special:八重撫子|八重撫子}}の花の名なのであろう、と{{person:曾良|曾良}}が詠んだ。やがて人里にたどり着くと、駄賃を鞍壺に結び付けて、子どもたちとともに馬を元の主のもとへ返した。"}, {"id": "v1_p8_1", "volume": 1, "book": "おくのほそ道", "section_title": "八、黒羽", "para_index": 8, "type": "本文", "verse": null, "raw_text": "黒羽の館代浄法寺何がしの方に音信る。思ひかけぬあるじの悦び、日夜語つゞけて、其弟桃翠など云が朝夕勤とぶらひ、自の家にも伴ひて、親属の方にも招かれ、日数をふるまゝに、ひとひ郊外に逍遥して、犬追物の跡を一見し、那須の篠原をわけて、玉藻の前の古墳をとふ。それより八幡宮に詣。与市扇の的を射し時、「別しては我国氏神正八まん」とちかひしも、此神社にて侍と聞ば、感応殊しきりに覚えらる。暮れば桃翠が宅に帰る。", "kakikudashi": "黒羽の館代浄法寺何がしの方に音信る。思ひかけぬあるじの悦び、日夜語り続けて、その弟桃翠など言ふが朝夕勤めとぶらひ、自らの家にも伴ひて、親属の方にも招かれ、日数を経るままに、ひとひ郊外に逍遥して、犬追物の跡を一見し、那須の篠原をわけて、玉藻の前の古墳を訪ふ。それより八幡宮に詣づ。与市扇の的を射し時、「別しては我が国氏神正八幡」と誓ひしも、この神社にて侍ると聞けば、感応ことにしきりに覚へらる。暮るれば桃翠が宅に帰る。", "translation": "黒羽の館代を務める浄法寺何がしのもとを訪ねた。思いがけない来訪に主人は大いに喜んで昼も夜も語り続け、その弟の桃翠という人も朝夕まめまめしく訪ねてくれて、自分の家にも案内し、親族の家にも招かれるなどして日数を重ねるうちに、ある日郊外を散策して犬追物の馬場の跡を見物し、那須の篠原を踏み分けて玉藻の前の古墳を訪ねた。そこからさらに八幡宮に参詣した。屋島の戦いで与市が扇の的を射た時、「とりわけ我が故郷の氏神である正八幡」と祈り誓ったのもこの神社であると聞くと、神の霊験と感動がひときわ強く胸に迫ってくる。日が暮れると桃翠の屋敷へと帰った。", "persons": "浄法寺高勝,鹿子畑翠桃,玉藻の前,那須与一", "places": "黒羽,那須の篠原,那須八幡宮", "era_year": "元禄二年卯月四日〜", "source_book": "", "keywords": "館代,犬追物,扇の的", "raw_tagged": "{{place:黒羽|黒羽}}の{{office:館代|館代}}{{person:浄法寺高勝|浄法寺何がし}}の方に音信る。思ひかけぬあるじの悦び、日夜語つゞけて、其弟{{person:鹿子畑翠桃|桃翠}}など云が朝夕勤とぶらひ、自の家にも伴ひて、親属の方にも招かれ、日数をふるまゝに、ひとひ郊外に逍遥して、{{special:犬追物|犬追物}}の跡を一見し、{{place:那須の篠原|那須の篠原}}をわけて、{{person:玉藻の前|玉藻の前}}の古墳をとふ。それより{{place:那須八幡宮|八幡宮}}に詣。{{person:那須与一|与市}}{{special:扇の的|扇の的}}を射し時、「別しては我国氏神{{place:那須八幡宮|正八まん}}」とちかひしも、此神社にて侍と聞ば、感応殊しきりに覚えらる。暮れば{{person:鹿子畑翠桃|桃翠}}が宅に帰る。", "kakikudashi_tagged": "{{place:黒羽|黒羽}}の{{office:館代|館代}}{{person:浄法寺高勝|浄法寺何がし}}の方に音信る。思ひかけぬあるじの悦び、日夜語り続けて、その弟{{person:鹿子畑翠桃|桃翠}}など言ふが朝夕勤めとぶらひ、自らの家にも伴ひて、親属の方にも招かれ、日数を経るままに、ひとひ郊外に逍遥して、{{special:犬追物|犬追物}}の跡を一見し、{{place:那須の篠原|那須の篠原}}をわけて、{{person:玉藻の前|玉藻の前}}の古墳を訪ふ。それより{{place:那須八幡宮|八幡宮}}に詣づ。{{person:那須与一|与市}}{{special:扇の的|扇の的}}を射し時、「別しては我が国氏神{{place:那須八幡宮|正八幡}}」と誓ひしも、この神社にて侍ると聞けば、感応ことにしきりに覚へらる。暮るれば{{person:鹿子畑翠桃|桃翠}}が宅に帰る。", "translation_tagged": "{{place:黒羽|黒羽}}の{{office:館代|館代}}を務める{{person:浄法寺高勝|浄法寺何がし}}のもとを訪ねた。思いがけない来訪に主人は大いに喜んで昼も夜も語り続け、その弟の{{person:鹿子畑翠桃|桃翠}}という人も朝夕まめまめしく訪ねてくれて、自分の家にも案内し、親族の家にも招かれるなどして日数を重ねるうちに、ある日郊外を散策して{{special:犬追物|犬追物}}の馬場の跡を見物し、{{place:那須の篠原|那須の篠原}}を踏み分けて{{person:玉藻の前|玉藻の前}}の古墳を訪ねた。そこからさらに{{place:那須八幡宮|八幡宮}}に参詣した。屋島の戦いで{{person:那須与一|与市}}が{{special:扇の的|扇の的}}を射た時、「とりわけ我が故郷の氏神である{{place:那須八幡宮|正八幡}}」と祈り誓ったのもこの神社であると聞くと、神の霊験と感動がひときわ強く胸に迫ってくる。日が暮れると{{person:鹿子畑翠桃|桃翠}}の屋敷へと帰った。"}, {"id": "v1_p8_2", "volume": 1, "book": "おくのほそ道", "section_title": "八、黒羽", "para_index": 8, "type": "発句・注", "verse": {"genre": "haiku", "l1": "夏山に", "l2": "足駄を拝む", "l3": "首途哉", "author": "松尾芭蕉", "bg_theme": "komyoji_ashida", "bg_path": "shortliterature/bg_komyoji_ashida.jpg", "bg_title": "⛰️ 光明寺・夏山と役行者の足駄（第7句専用描き下ろし背景）"}, "raw_text": "修験光明寺と云有。そこにまねかれて、行者堂を拝す。夏山に足駄を拝む首途哉。", "kakikudashi": "修験光明寺と言ふあり。そこに招かれて、行者堂を拝す。夏山に足駄を拝む首途かな。", "translation": "この地に修験道の光明寺という寺がある。その寺に招かれて、開祖の役行者を祀る行者堂を礼拝した。青々と茂る夏山を前に、健脚の役行者が履く力強い高足駄を拝んで、これから続くみちのくへの旅立ちを祈ることよ。", "persons": "役行者", "places": "光明寺", "era_year": "元禄二年卯月", "source_book": "", "keywords": "", "raw_tagged": "修験{{place:光明寺|光明寺}}と云有。そこにまねかれて、{{person:役行者|行者堂}}を拝す。夏山に足駄を拝む首途哉。", "kakikudashi_tagged": "修験{{place:光明寺|光明寺}}と言ふあり。そこに招かれて、{{person:役行者|行者堂}}を拝す。夏山に足駄を拝む首途かな。", "translation_tagged": "この地に修験道の{{place:光明寺|光明寺}}という寺がある。その寺に招かれて、開祖の{{person:役行者|役行者}}を祀る{{person:役行者|行者堂}}を礼拝した。青々と茂る夏山を前に、健脚の役行者が履く力強い高足駄を拝んで、これから続くみちのくへの旅立ちを祈ることよ。"}, {"id": "v1_p9_1", "volume": 1, "book": "おくのほそ道", "section_title": "九、雲巌寺", "para_index": 9, "type": "本文", "verse": null, "raw_text": "当国雲岸寺のおくに、仏頂和尚山居の跡あり。「竪横の五尺にたらぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書付侍りと、いつぞや聞え給ふ。其跡みんと、雲岸寺に杖を曳ば、人々すゝんで共にいざなひ、若き人おほく道のほど打さはぎて、おぼえず彼麓に到る。山はおくあるけしきにて、谷道遥に、松杉黒く、苔したゞりて、卯月の天今猶寒し。十景尽る所、橋をわたつて山門に入。", "kakikudashi": "当国雲岸寺の奥に、仏頂和尚山居の跡あり。「竪横の五尺に足らぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書き付け侍りと、いつぞや聞こえ給ふ。その跡見んと、雲岸寺に杖を曳けば、人々進みて共にいざなひ、若き人多く道のほど打ち騒ぎて、おぼえずかの麓に到る。山は奥あるけしきにて、谷道遥かに、松杉黒く、苔したたりて、卯月の天今なほ寒し。十景尽くる所、橋を渡りて山門に入る。", "translation": "この下野国の雲岸寺の奥山に、私が参禅した仏頂和尚がかつて山ごもりをなさった庵の跡がある。「縦も横も五尺に満たない小さな草の庵さえ、もし雨が降らないのであれば結ぶのも悔しいことだ」という歌を、松の消し炭で傍らの岩に書き付けられたと、いつか和尚ご自身がお話しくださったことがあった。その山居の跡を一目見ようと雲岸寺へ向けて杖を引いて歩き出すと、黒羽の人々も進んで同行に誘い合い、若い人たちが大勢道すがら賑やかに語り合ううちに、いつの間にかその山の麓にたどり着いた。山はいかにも奥深い趣をたたえ、谷あいの道がはるかに続き、松や杉が黒々と茂り、岩の苔からは水滴がしたたり落ちて、卯月の初夏の空というのに今もなお肌寒い。雲岸寺十景の名所が尽きるところで、朱塗りの橋を渡って山門へと入った。", "persons": "仏頂和尚", "places": "雲巌寺", "era_year": "元禄二年卯月五日", "source_book": "", "keywords": "卯月", "raw_tagged": "当国{{place:雲巌寺|雲岸寺}}のおくに、{{person:仏頂和尚|仏頂和尚}}山居の跡あり。「竪横の五尺にたらぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書付侍りと、いつぞや聞え給ふ。其跡みんと、{{place:雲巌寺|雲岸寺}}に杖を曳ば、人々すゝんで共にいざなひ、若き人おほく道のほど打さはぎて、おぼえず彼麓に到る。山はおくあるけしきにて、谷道遥に、松杉黒く、苔したゞりて、{{special:卯月|卯月}}の天今猶寒し。十景尽る所、橋をわたつて山門に入。", "kakikudashi_tagged": "当国{{place:雲巌寺|雲岸寺}}の奥に、{{person:仏頂和尚|仏頂和尚}}山居の跡あり。「竪横の五尺に足らぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書き付け侍りと、いつぞや聞こえ給ふ。その跡見んと、{{place:雲巌寺|雲岸寺}}に杖を曳けば、人々進みて共にいざなひ、若き人多く道のほど打ち騒ぎて、おぼえずかの麓に到る。山は奥あるけしきにて、谷道遥かに、松杉黒く、苔したたりて、{{special:卯月|卯月}}の天今なほ寒し。十景尽くる所、橋を渡りて山門に入る。", "translation_tagged": "この下野国の{{place:雲巌寺|雲岸寺}}の奥山に、私が参禅した{{person:仏頂和尚|仏頂和尚}}がかつて山ごもりをなさった庵の跡がある。「縦も横も五尺に満たない小さな草の庵さえ、もし雨が降らないのであれば結ぶのも悔しいことだ」という歌を、松の消し炭で傍らの岩に書き付けられたと、いつか和尚ご自身がお話しくださったことがあった。その山居の跡を一目見ようと{{place:雲巌寺|雲岸寺}}へ向けて杖を引いて歩き出すと、黒羽の人々も進んで同行に誘い合い、若い人たちが大勢道すがら賑やかに語り合ううちに、いつの間にかその山の麓にたどり着いた。山はいかにも奥深い趣をたたえ、谷あいの道がはるかに続き、松や杉が黒々と茂り、岩の苔からは水滴がしたたり落ちて、{{special:卯月|卯月}}の初夏の空というのに今もなお肌寒い。雲岸寺十景の名所が尽きるところで、朱塗りの橋を渡って山門へと入った。"}, {"id": "v1_p9_2", "volume": 1, "book": "おくのほそ道", "section_title": "九、雲巌寺", "para_index": 9, "type": "発句・注", "verse": {"genre": "haiku", "l1": "木啄も", "l2": "庵はやぶらず", "l3": "夏木立", "author": "松尾芭蕉", "bg_theme": "unganji_kitsutsuki", "bg_path": "shortliterature/bg_unganji_kitsutsuki.jpg", "bg_title": "🌲 雲巌寺・夏木立と仏頂和尚の石上小庵（第8句専用描き下ろし背景）"}, "raw_text": "さてかの跡はいづくのほどにやと、後の山によぢのぼれば、石上の小庵岩窟にむすびかけたり。妙禅師の死関、法雲法師の石室を見るがごとし。木啄も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残侍し。", "kakikudashi": "さてかの跡はいづくのほどにやと、後の山によぢ登れば、石上の小庵岩窟に結びかけたり。妙禅師の死関、法雲法師の石室を見るがごとし。木啄も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残し侍りし。", "translation": "さて、あの仏頂和尚の旧庵の跡はどのあたりであろうかと、本堂の後ろの山をよじ登ってみると、岩の上の小さな庵が岩窟に掛け渡すようにして結ばれていた。その有様は、あたかも中国の妙禅師が籠もった死関や、法雲法師が修行した石室を目の当たりにするかのようである。木を突く習性のある木啄でさえも、和尚の徳を憚ってこの尊い小庵ばかりは突き破らずに残していることよ、清らかな夏木立のただ中に。と、その場で詠んだ即興の一句を庵の柱に書き残しておいた。", "persons": "妙禅師,法雲法師", "places": "", "era_year": "元禄二年卯月五日", "source_book": "", "keywords": "木啄", "raw_tagged": "さてかの跡はいづくのほどにやと、後の山によぢのぼれば、石上の小庵岩窟にむすびかけたり。{{person:妙禅師|妙禅師}}の死関、{{person:法雲法師|法雲法師}}の石室を見るがごとし。{{special:木啄|木啄}}も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残侍し。", "kakikudashi_tagged": "さてかの跡はいづくのほどにやと、後の山によぢ登れば、石上の小庵岩窟に結びかけたり。{{person:妙禅師|妙禅師}}の死関、{{person:法雲法師|法雲法師}}の石室を見るがごとし。{{special:木啄|木啄}}も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残し侍りし。", "translation_tagged": "さて、あの仏頂和尚の旧庵の跡はどのあたりであろうかと、本堂の後ろの山をよじ登ってみると、岩の上の小さな庵が岩窟に掛け渡すようにして結ばれていた。その有様は、あたかも中国の{{person:妙禅師|妙禅師}}が籠もった死関や、{{person:法雲法師|法雲法師}}が修行した石室を目の当たりにするかのようである。木を突く習性のある{{special:木啄|木啄}}でさえも、和尚の徳を憚ってこの尊い小庵ばかりは突き破らずに残していることよ、清らかな夏木立のただ中に。と、その場で詠んだ即興の一句を庵の柱に書き残しておいた。"}];

  // 1. 地図の初期化（方法A：ズーム13まで鮮明な Esri 陰影白地図単一レイヤー）

    attribution: 'Tiles &copy; Esri',

    maxZoom: MAP_MAX_ZOOM_LEVEL
  });
  shadedReliefLayer.addTo(map);

  // 2. 山脈・大河
  const natureGroup = L.layerGroup().addTo(map);
  RIVER_LINES.forEach(river => {
    const rLine = L.polyline(river.coords, { color: '#1976d2', weight: 2.5, opacity: 0.75 }).addTo(natureGroup);
    rLine.bindTooltip(river.name, { sticky: true });
  });

    const icon = L.divIcon({
      className: feat.type === 'mountain' ? 'nature-label-mountain' : 'nature-label-river',
      html: feat.name,
      iconSize: [140, 20],
      iconAnchor: [70, 10]
    });
    L.marker([feat.lat, feat.lng], { icon: icon, interactive: false }).addTo(natureGroup);
  });

  // 3. エリアおよび地点ピンのレイヤー
  const baseAreaGroup = L.layerGroup().addTo(map);
  const pinMarkerGroup = L.layerGroup().addTo(map);

  function getActivePlaceKeysSet() {
    if (isEditModeActive()) {
      return new Set(PLACES.map(p => p.key));
    }
    const visibleRecs = getVisibleRecords();
    const usedKeys = new Set();
    const tagRegex = /\{\{place:([^|}]+)\|/g;
    visibleRecs.forEach(rec => {
      [rec.raw_tagged, rec.kakikudashi_tagged, rec.translation_tagged].forEach(txt => {
        if (!txt) return;
        let m;
        while ((m = tagRegex.exec(txt)) !== null) {
          usedKeys.add(m[1]);
        }
      });
    });
    PLACES.forEach(p => {
      if (p.is_pin && usedKeys.has(p.key) && p.parent_area) {
        usedKeys.add(p.parent_area);
      }
    });
    return usedKeys;
  }

  function getShortNameWithReading(labelStr) {
    if (!labelStr) return '';
    return labelStr.replace(/：[^）]*）$/, '）');
  }

  function renderMapLayersForCurrentMode() {
    baseAreaGroup.clearLayers();
    pinMarkerGroup.clearLayers();
    const activeKeys = getActivePlaceKeysSet();

    PLACES.filter(p => p.is_area && p.area_polygon && activeKeys.has(p.key)).forEach(area => {
      const isCommandery = area.category.includes('郡') || area.category.includes('旧国');
      const poly = L.polygon(area.area_polygon, {
        color: isCommandery ? '#5d4037' : '#1565c0',
        weight: isCommandery ? 1.5 : 1.2,
        dashArray: isCommandery ? '4, 4' : '8, 6',
        fillColor: isCommandery ? '#8d6e63' : '#42a5f5',
        fillOpacity: isCommandery ? 0.06 : 0.03
      }).addTo(baseAreaGroup);
      poly.bindTooltip(`🗺️ ${getShortNameWithReading(area.label)}`, { sticky: true });
      poly.on('click', () => {
        focusPlaceOnMap(area.key, area.key);
      });
    });

    PLACES.filter(p => p.is_pin && activeKeys.has(p.key)).forEach(place => {
      let fillColor = '#e65100';
      if (place.province === '東山道') fillColor = '#2e7d32';
      else if (place.province === '北陸道') fillColor = '#1565c0';

      const marker = L.circleMarker([place.lat, place.lng], {
        radius: 6.5,
        fillColor: fillColor,
        color: '#fff',
        weight: 1.8,
        fillOpacity: 0.95
      }).addTo(pinMarkerGroup);

      marker.bindTooltip(`<span class="custom-label" id="pin-label-${place.key}">${place.key}</span>`, {
        permanent: true,
        direction: 'top',
        offset: [0, -7],
        className: 'transparent-box'
      });

      marker.on('click', () => {
        focusPlaceOnMap(place.key, place.key);
      });
    });
  }

  window.addEventListener('resize', () => {
    map.invalidateSize();
  });

  // 5. 地名クリック時の移動＆「エリア⊃地点」ハイライト処理
  function focusPlaceOnMap(placeKey, clickedRawSurface = '') {
    closeModal();
    const found = PLACES.find(p => p.key === placeKey);
    document.querySelectorAll('.custom-label').forEach(el => el.classList.remove('selected-pin'));
    activeHighlightLayers.forEach(layer => map.removeLayer(layer));
    activeHighlightLayers = [];

    if (!found) return false;

    map.stop();

    if (found.is_area && found.area_polygon) {
      const areaZoom = Math.round(found.zoom || 9);
      map.fitBounds(found.area_polygon, { padding: [36, 36], maxZoom: areaZoom });

      const areaPoly = L.polygon(found.area_polygon, {
        color: '#d84315',
        weight: 3.5,
        fillColor: '#ffab40',
        fillOpacity: 0.25
      }).addTo(map);

      const bannerIcon = L.divIcon({
        className: '',
        html: `<span class="area-banner-label">🗺️ ${found.key}</span>`,
        iconSize: [140, 28],
        iconAnchor: [70, 14]
      });
      const bannerMarker = L.marker([found.lat, found.lng], { icon: bannerIcon, interactive: false }).addTo(map);
      activeHighlightLayers.push(areaPoly, bannerMarker);
    }
    else if (found.is_river) {
      const riverZoom = Math.round(found.zoom || 11);
      map.setView([found.lat, found.lng], riverZoom, { animate: true, duration: 0.5 });
      RIVER_LINES.filter(r => r.key === found.key).forEach(river => {
        const hl = L.polyline(river.coords, { color: '#ffeb3b', weight: 7, opacity: 0.85 }).addTo(map);
        const fg = L.polyline(river.coords, { color: '#d32f2f', weight: 3.5, opacity: 0.95 }).addTo(map);
        activeHighlightLayers.push(hl, fg);
      });
    }
    else {
      const labelEl = document.getElementById(`pin-label-${found.key}`);
      if (labelEl) labelEl.classList.add('selected-pin');

      const parentArea = PLACES.find(a => a.is_area && a.key === found.parent_area);
      const pointZoom = Math.round(found.zoom || 12);
      if (parentArea && parentArea.area_polygon) {
        const parentPoly = L.polygon(parentArea.area_polygon, {
          color: '#2e7d32',
          weight: 2.5,
          dashArray: '6, 4',
          fillColor: '#66bb6a',
          fillOpacity: 0.10
        }).addTo(map);
        const pLat = parentArea.area_polygon[0][0];
        const pLng = (parentArea.area_polygon[0][1] + parentArea.area_polygon[1][1]) / 2;
        const parentBanner = L.marker([pLat, pLng], {
          icon: L.divIcon({
            className: '',
            html: `<span class="parent-area-banner-label">${parentArea.key}</span>`,
            iconSize: [120, 22],
            iconAnchor: [60, 11]
          }),
          interactive: false
        }).addTo(map);
        activeHighlightLayers.push(parentPoly, parentBanner);
      }

      // 地点ピンそのものが画面の真ん中に来るように移動
      map.setView([found.lat, found.lng], pointZoom, { animate: true, duration: 0.5 });

      const circleRadiusMeters = pointZoom >= 12 ? 350 : (pointZoom >= 11 ? 600 : (pointZoom >= 9 ? 3500 : 8000));
      const ptCircle = L.circle([found.lat, found.lng], {
        radius: circleRadiusMeters,
        color: '#c62828',
        weight: 2.5,
        fillColor: '#ff5252',
        fillOpacity: 0.25
      }).addTo(map);
      activeHighlightLayers.push(ptCircle);
    }

    const toast = document.getElementById('mapToast');
    const safeSurface = (clickedRawSurface || found.key).replace(/'/g, "\'");
    const safeKey = found.key.replace(/'/g, "\'");
    const toastFeedbackHtml = isEditModeActive() ? `
      <div class="toast-feedback-bar">
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '🔄 場所が違う（同名別地・位置修正）')">🔄 場所が違う</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '📐 エリア⇔地点の区分変更')">📐 エリア⇔地点変更</button>
        <button class="toast-fb-btn" onclick="startMapCoordPicker('${safeKey}', '${safeSurface}')">📍 地図クリックで正しい位置を指定</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '❌ 地名タグ解除')">❌ タグ解除</button>
      </div>
    ` : '';
    const shortTitle = getShortNameWithReading(found.label);
    const ukiyoeCaption = found.ukiyoe_caption || '';
    toast.innerHTML = `
      <img id="toastUkiyoeImg" src="" alt="${found.key}" style="width:100%; height:auto; max-height:210px; object-fit:contain; background:#18130e; border-radius:4px; border:1px solid rgba(212,175,55,0.55); margin-bottom:5px; display:none;" />
      <div id="toastUkiyoeCaption" style="font-family:'Yu Mincho','MS PMincho',serif; font-size:0.74rem; color:#ffe082; margin-bottom:5px; line-height:1.35; display:none;">${ukiyoeCaption}</div>
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
        <div style="line-height:1.35;">
          <div style="font-family:'Yu Mincho','MS PMincho',serif; font-size:0.88rem; font-weight:bold; color:#fff;">📍 ${shortTitle}</div>
          <div style="font-size:0.72rem; color:#d7ccc8; margin-top:2px;">現在の${found.modern}</div>
        </div>
        <button onclick="document.getElementById('mapToast').style.display='none'" style="background:transparent; border:none; color:#bbb; cursor:pointer; font-size:0.9rem; line-height:1; padding:0 2px;" title="閉じる">✕</button>
      </div>
      ${toastFeedbackHtml}
    `;
    toast.style.display = 'block';
    loadToastUkiyoePreview(found);
    return true;
  }

  // パブリックドメイン浮世絵・名勝写真（Wikipedia代表画像優先 ／ Wikimedia Commons 定規除外）自動取得キャッシュ
  const ukiyoeUrlCache = {};

  async function fetchWikiLeadImage(wikiTitle) {
    if (!wikiTitle) return null;
    try {
      const wikiRes = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`);
      if (wikiRes.ok) {
        const wData = await wikiRes.json();
        const imgUrl = (wData.originalimage && wData.originalimage.source) || (wData.thumbnail && wData.thumbnail.source);
        // 行政区分図・位置図（map / location / svg）を風景写真から除外
        if (imgUrl && !/(\.svg|map|location|locator|位置)/i.test(imgUrl)) {
          return imgUrl;
        }
      }
    } catch (e) {}
    return null;
  }

  async function fetchCommonsCleanUkiyoe(queryStr) {
    if (!queryStr) return null;
    try {
      const commonsApi = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap -Brooklyn ' + queryStr)}&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`;
      const res = await fetch(commonsApi);
      if (res.ok) {
        const data = await res.json();
        if (data.query && data.query.pages) {
          const pages = Object.values(data.query.pages).filter(p => p && p.title && !/brooklyn/i.test(p.title));
          for (const pg of pages) {
            if (pg.imageinfo && pg.imageinfo[0]) {
              const imgUrl = pg.imageinfo[0].thumburl || pg.imageinfo[0].url;
              if (imgUrl) return imgUrl;
            }
          }
        }
      }
    } catch (e) {}
    return null;
  }

  async function fetchPlaceVisualUrl(placeObj) {
    if (!placeObj) return null;
    const cacheKey = placeObj.key;
    if (ukiyoeUrlCache[cacheKey]) return ukiyoeUrlCache[cacheKey];

    const wikiImgTitle = placeObj.wiki_image_title || '';
    const queryStr = placeObj.ukiyoe_query || '';

    // 案A：名勝写真・浮世絵が明示指定されていない地名（黒羽などの一般城下町・宿場）は無理に画像を出さない
    if (!wikiImgTitle && !queryStr) {
      return null;
    }

    // 名勝・歌枕（草加松原・室の八島・白河関・日光東照宮・松島・象潟・凱風快晴など）は Wikipedia 記事の厳選代表画像を優先取得
    if (placeObj.wiki_image_priority && wikiImgTitle) {
      const wikiUrl = await fetchWikiLeadImage(wikiImgTitle);
      if (wikiUrl) {
        ukiyoeUrlCache[cacheKey] = wikiUrl;
        return wikiUrl;
      }
      if (queryStr) {
        const fallbackCommons = await fetchCommonsCleanUkiyoe(queryStr);
        if (fallbackCommons) {
          ukiyoeUrlCache[cacheKey] = fallbackCommons;
          return fallbackCommons;
        }
      }
      return null;
    }

    // 浮世絵名所（深川・千住・上野・谷中・隅田川・裏見の滝）は定規なし浮世絵を優先
    if (queryStr) {
      const commonsUrl = await fetchCommonsCleanUkiyoe(queryStr);
      if (commonsUrl) {
        ukiyoeUrlCache[cacheKey] = commonsUrl;
        return commonsUrl;
      }
    }
    if (wikiImgTitle) {
      const fallbackWiki = await fetchWikiLeadImage(wikiImgTitle);
      if (fallbackWiki) {
        ukiyoeUrlCache[cacheKey] = fallbackWiki;
        return fallbackWiki;
      }
    }
    return null;
  }

  async function loadToastUkiyoePreview(placeObj) {
    if (!placeObj) return;
    const imgUrl = await fetchPlaceVisualUrl(placeObj);
    const imgEl = document.getElementById('toastUkiyoeImg');
    const capEl = document.getElementById('toastUkiyoeCaption');
    if (imgUrl && imgEl) {
      imgEl.src = imgUrl;
      imgEl.style.display = 'block';
      if (capEl && placeObj.ukiyoe_caption) capEl.style.display = 'block';
    }
  }

  // 6. データベースに埋め込まれた確定タグ（{type:key|surface}）を直接HTMLへ変換
  function getActivePersonsList() {
    return Array.from(new Set(
      getVisibleRecords().flatMap(r => (r.persons || '').split(',').map(s => s.trim()).filter(Boolean))
    ));
  }

  function getPlaceSubTypeLabel(placeKey) {
    const p = PLACES.find(item => item.key === placeKey);
    if (!p) return `地名(${placeKey})`;
    if (p.is_area) return `🗺️地名[エリア](${placeKey})`;
    if (p.is_river) return `🌊地名[河川](${placeKey})`;
    return `📍地名[地点](${placeKey})`;
  }

  function renderEmbeddedTags(taggedText, recId) {
    if (!taggedText) return '';
    const editHint = isEditModeActive() ? ' ／ 右クリックまたはドラッグ選択で指摘' : '';
    return taggedText.replace(/\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g, (m, tagType, key, surface) => {
      const safeKey = key.replace(/'/g, "\'");
      const safeSurface = surface.replace(/'/g, "\'");
      if (tagType === 'place') {
        const subLabel = getPlaceSubTypeLabel(key);
        return `<span class="inline-place" data-tag-type="place" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" title="${subLabel}：クリックで地図移動${editHint}">${surface}</span>`;
      } else if (tagType === 'office') {
        return `<span class="inline-office" data-tag-type="office" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" title="👑官職(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'person') {
        return `<span class="inline-person" data-tag-type="person" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" title="👤人名(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'special') {
        return `<span class="inline-special" data-tag-type="special" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" title="🔖特別キーワード(${key})：クリックで解説${editHint}">${surface}</span>`;
      }
      return surface;
    });
  }

  // 7. 本文・発句リーダー描画
  const recordListEl = document.getElementById('recordList');
  const paraTopNavEl = document.getElementById('paraTopNav');
  let currentParaIndex = 1;

  function getSectionLabelForPara(paraIdx) {
    const rec = RECORDS.find(r => r.para_index === paraIdx);
    const shortSec = rec ? (rec.section_title || `第${paraIdx}段`) : `第${paraIdx}段`;
    if (isEditModeActive()) {
      const pubBadge = paraIdx <= PUBLISHED_MAX_PARA ? '✅ ' : '🔧 ';
      return `${pubBadge}${shortSec}`;
    }
    return shortSec;
  }

  function goToParagraph(paraIdx) {
    const maxVis = getMaxVisibleParagraph();
    const clamped = Math.max(1, Math.min(maxVis, paraIdx));
    currentParaIndex = clamped;
    const showAllEl = document.getElementById('toggleShowAllParas');
    if (showAllEl && showAllEl.checked) {
      showAllEl.checked = false;
    }
    renderReaderList();
    recordListEl.scrollTop = 0;
    const firstRec = getVisibleRecords().find(r => r.para_index === currentParaIndex);
    if (firstRec) {
      setActiveRecord(firstRec.id);
    }
  }

  function changeParagraph(delta) {
    goToParagraph(currentParaIndex + delta);
  }

    { key: 'chinese_sansui', label: '🏔️ 松と山水', bgPath: SVS_REMOTE_ASSET_BASE + 'shortliterature/bg_chinese_sansui.jpg' },
    { key: 'chinese_plum', label: '🏮 紅梅と香炉', bgPath: SVS_REMOTE_ASSET_BASE + 'shortliterature/bg_chinese_plum.jpg' },
    { key: 'classic_alt', label: '📜 別抄和紙', bgPath: SVS_REMOTE_ASSET_BASE + 'shortliterature/短歌（Tanka）.jpg' }
  ];

  const svsBgImages = {};
  function preloadSvsBgImage(url) {
    if (!url) return null;
    if (svsBgImages[url]) return svsBgImages[url];
    const img = new Image();
    img.src = encodeURI(url);
    svsBgImages[url] = img;
    return img;
  }
  SVS_BG_THEMES.forEach(t => { if (t.bgPath) preloadSvsBgImage(t.bgPath); });

  const svsGoldParticles = Array.from({ length: SVS_GOLD_PARTICLE_COUNT }, (_, i) => ({
    x: (i * 197) % SVS_CANVAS_WIDTH_PX,
    y: (i * 313) % SVS_CANVAS_HEIGHT_PX,
    radius: 2.2 + (i % 4),
    speedY: -14 - (i % 16),
    speedX: 6 - (i % 13),
    phase: i * 0.7
  }));

  let svsAnimFrameId = null;
  let svsAnimStartTimeMs = 0;
  let svsCurrentVerseState = null;

  function stopSvsCanvasAnimation() {
    if (svsAnimFrameId) {
      cancelAnimationFrame(svsAnimFrameId);
      svsAnimFrameId = null;
    }
  }

  function drawUtamakuraCustomBackground(ctx, sceneType, elapsedMs) {
    const tSec = elapsedMs / SVS_MS_PER_SECOND;
    ctx.save();

    if (sceneType === 'hina') {
      // 🎎 桃の節句・草庵の雛（深川の草庵から春霞・桃色の彩りへ移り変わる情景）
      const bgGrad = ctx.createLinearGradient(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);
      bgGrad.addColorStop(0, '#3a2328');
      bgGrad.addColorStop(0.45, '#593138');
      bgGrad.addColorStop(1, '#2b1d18');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 上部・右側の春霞と桃の花びらシルエット
      const glowGrad = ctx.createRadialGradient(860, 320, 40, 860, 320, 520);
      glowGrad.addColorStop(0, 'rgba(255, 183, 197, 0.32)');
      glowGrad.addColorStop(1, 'rgba(255, 183, 197, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 雛祭りの菱餅・ぼんぼりを思わせる雅な金砂子と桃色の霞帯
      ctx.strokeStyle = 'rgba(218, 175, 105, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(SVS_PAPER_LEFT_X_PX - 14, SVS_PAPER_TOP_Y_PX - 14, (SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX) + 28, (SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX) + 28);
    } else {
      // 🚣 千住の舟出・行く春の水辺（暁の朧月・隅田川の水面・霞む富士のシルエット）
      const skyGrad = ctx.createLinearGradient(0, 0, 0, SVS_CANVAS_HEIGHT_PX);
      skyGrad.addColorStop(0, '#1c2838');
      skyGrad.addColorStop(0.35, '#3b4d63');
      skyGrad.addColorStop(0.7, '#5c4b51');
      skyGrad.addColorStop(1, '#18222c');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 有明の朧月（右上）
      const moonGrad = ctx.createRadialGradient(880, 250, 15, 880, 250, 170);
      moonGrad.addColorStop(0, 'rgba(255, 243, 200, 0.75)');
      moonGrad.addColorStop(0.4, 'rgba(255, 235, 180, 0.22)');
      moonGrad.addColorStop(1, 'rgba(255, 235, 180, 0)');
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(880, 250, 170, 0, Math.PI * 2);
      ctx.fill();

      // 下部の隅田川の水面さざ波
      ctx.strokeStyle = 'rgba(190, 215, 235, 0.22)';
      ctx.lineWidth = 2.5;
      for (let w = 0; w < 6; w++) {
        const waveY = 1560 + w * 48 + Math.sin(tSec * 1.6 + w) * 6;
        ctx.beginPath();
        ctx.moveTo(80, waveY);
        ctx.quadraticCurveTo(540, waveY - 14, 980, waveY);
        ctx.stroke();
      }
    }

    // 中央の古典和紙短冊領域 (mask_layout.png 準拠: X:108-809, Y:400-1499)
    const paperW = SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX;
    const paperH = SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX;
    const washiGrad = ctx.createLinearGradient(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, SVS_PAPER_RIGHT_X_PX, SVS_PAPER_BOTTOM_Y_PX);
    if (sceneType === 'hina') {
      washiGrad.addColorStop(0, '#fcf7f2');
      washiGrad.addColorStop(0.5, '#f7efe6');
      washiGrad.addColorStop(1, '#f2e3d5');
    } else {
      washiGrad.addColorStop(0, '#f8f5ec');
      washiGrad.addColorStop(0.5, '#f3ede0');
      washiGrad.addColorStop(1, '#e8e0cf');
    }
    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = washiGrad;
    ctx.fillRect(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, paperW, paperH);
    ctx.shadowBlur = 0;

    // 和紙内の淡い金箔・内枠
    ctx.strokeStyle = 'rgba(168, 132, 87, 0.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(SVS_PAPER_LEFT_X_PX + 12, SVS_PAPER_TOP_Y_PX + 12, paperW - 24, paperH - 24);
    ctx.restore();
  }

  async function ensureUkiyoePlaceBgLoaded(placeKey) {
    const found = PLACES.find(p => p.key === placeKey);
    if (!found) return null;
    const imgUrl = await fetchPublicDomainUkiyoeUrl(found.ukiyoe_query, found.wiki_title || found.key);
    if (imgUrl) {
      return preloadSvsBgImage(imgUrl);
    }
    return null;
  }

  function drawUkiyoeWithWashiFrame(ctx, img) {
    // 浮世絵を1080x1920キャンバス全面にアスペクト比維持（cover）で描画し、中央に半透明の古典和紙短冊を重ねる
    const iw = img.naturalWidth || SVS_CANVAS_WIDTH_PX;
    const ih = img.naturalHeight || SVS_CANVAS_HEIGHT_PX;
    const scale = Math.max(SVS_CANVAS_WIDTH_PX / iw, SVS_CANVAS_HEIGHT_PX / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = (SVS_CANVAS_WIDTH_PX - dw) * 0.5;
    const dy = (SVS_CANVAS_HEIGHT_PX - dh) * 0.5;
    ctx.drawImage(img, dx, dy, dw, dh);

    // 周囲を落ち着かせる淡いビネット
    ctx.fillStyle = 'rgba(20, 15, 10, 0.24)';
    ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

    // 中央の和紙短冊領域（浮世絵がほんのり透ける上品な和紙）
    const paperW = SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX;
    const paperH = SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(250, 245, 234, 0.88)';
    ctx.fillRect(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, paperW, paperH);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(168, 132, 87, 0.65)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(SVS_PAPER_LEFT_X_PX + 12, SVS_PAPER_TOP_Y_PX + 12, paperW - 24, paperH - 24);
  }

  function drawSvsBackgroundAndParticles(ctx, themeKey, elapsedMs) {
    const themeObj = SVS_BG_THEMES.find(t => t.key === themeKey) || SVS_BG_THEMES[0];
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const img = themeObj.bgPath ? svsBgImages[themeObj.bgPath] : null;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, 0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);
    } else if (themeObj.customScene) {
      drawUtamakuraCustomBackground(ctx, themeObj.customScene, elapsedMs);
    } else {
      drawUtamakuraCustomBackground(ctx, 'hina', elapsedMs);
    }

    // 金砂子・桜花びらの舞うパーティクル描画
    const tSec = elapsedMs / SVS_MS_PER_SECOND;
    const isPetalTheme = (themeKey === 'hina_peach' || themeKey === 'yukuharu_senju' || themeKey === 'spring_sakura');
    for (const p of svsGoldParticles) {
      const px = (p.x + p.speedX * tSec + SVS_CANVAS_WIDTH_PX) % SVS_CANVAS_WIDTH_PX;
      const py = (p.y + p.speedY * tSec + SVS_CANVAS_HEIGHT_PX) % SVS_CANVAS_HEIGHT_PX;
      const shimmer = 0.22 + 0.16 * Math.sin(tSec * 2.5 + p.phase);
      ctx.beginPath();
      if (isPetalTheme && (p.radius > 3.5)) {
        ctx.ellipse(px, py, p.radius * 1.6, p.radius * 0.9, tSec + p.phase, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 192, 203, ${(shimmer * 1.15).toFixed(3)})`;
      } else {
        ctx.arc(px, py, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(218, 185, 110, ${shimmer.toFixed(3)})`;
      }
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSvsVerticalChar(ctx, ch, x, y, fontSize, alpha, textColor) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const smallKana = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ';
    const puncChars = '、。';
    const longDash = 'ー―‐';

    if (puncChars.includes(ch)) {
      ctx.fillText(ch, x + fontSize * 0.34, y - fontSize * 0.32);
    } else if (smallKana.includes(ch)) {
      ctx.font = `400 ${Math.round(fontSize * 0.82)}px 'Yuji Syuku', 'Yu Mincho', serif`;
      ctx.fillText(ch, x + fontSize * 0.10, y - fontSize * 0.06);
    } else if (longDash.includes(ch)) {
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 2);
      ctx.fillText('―', 0, 0);
    } else {
      ctx.fillText(ch, x, y);
    }
    ctx.restore();
  }

  function renderSvsFrame(ctx, elapsedMs) {
    if (!svsCurrentVerseState) return;
    const { genre, lines, author, bgTheme } = svsCurrentVerseState;
    const isTanka = (genre === 'tanka');

    const lineXCoords = isTanka ? SVS_TANKA_LINE_X_COORDS_PX : SVS_HAIKU_LINE_X_COORDS_PX;
    const lineIndentY = isTanka ? SVS_TANKA_LINE_INDENT_Y_PX : SVS_HAIKU_LINE_INDENT_Y_PX;
    const authorX = isTanka ? SVS_TANKA_AUTHOR_X_PX : SVS_HAIKU_AUTHOR_X_PX;
    const baseFontSize = isTanka ? 64 : 82;
    const baseCharSpacing = isTanka ? 82 : 106;
    const authorFontSize = isTanka ? 44 : 50;
    const authorCharSpacing = isTanka ? 58 : 66;
    const fontFamily = isTanka ? "'Shippori Mincho', 'Yu Mincho', serif" : "'Yuji Syuku', 'Yu Mincho', serif";

    const totalCycleMs = SVS_INTRO_SILENCE_MS + (lines.length * SVS_LINE_APPEAR_INTERVAL_MS) + SVS_AUTHOR_WRITE_SPAN_MS + SVS_OUTRO_HOLD_MS;
    const loopElapsedMs = elapsedMs % totalCycleMs;

    drawSvsBackgroundAndParticles(ctx, bgTheme, elapsedMs);

    ctx.save();
    lines.forEach((lineText, lineIdx) => {
      const chars = Array.from(lineText || '');
      if (chars.length === 0) return;

      const x = lineXCoords[lineIdx] || lineXCoords[lineXCoords.length - 1];
      const startY = SVS_PAPER_SAFE_TOP_Y_PX + (lineIndentY[lineIdx] || 0);
      const maxAvailH = SVS_PAPER_SAFE_BOTTOM_Y_PX - startY;
      const charSpacing = Math.min(baseCharSpacing, Math.floor(maxAvailH / Math.max(1, chars.length)));
      const fontSize = Math.min(baseFontSize, Math.round(charSpacing * 0.84));

      ctx.font = `400 ${fontSize}px ${fontFamily}`;

      const lineStartMs = SVS_INTRO_SILENCE_MS + lineIdx * SVS_LINE_APPEAR_INTERVAL_MS;
      const perCharDelayMs = chars.length > 1 ? (SVS_LINE_WRITE_SPAN_MS / chars.length) : 0;

      chars.forEach((ch, cIdx) => {
        const charTriggerMs = lineStartMs + cIdx * perCharDelayMs;
        const rawProgress = (loopElapsedMs - charTriggerMs) / SVS_CHAR_FADE_DURATION_MS;
        const alpha = Math.max(0, Math.min(1, rawProgress));
        if (alpha > 0) {
          const y = startY + cIdx * charSpacing + fontSize * 0.5;
          drawSvsVerticalChar(ctx, ch, x, y, fontSize, alpha, '#181412');
        }
      });
    });

    // 作者名の縦書き描画（下揃え）
    if (author) {
      const authorChars = Array.from(author);
      const authorStartMs = SVS_INTRO_SILENCE_MS + lines.length * SVS_LINE_APPEAR_INTERVAL_MS;
      const perAuthorCharMs = authorChars.length > 1 ? (SVS_AUTHOR_WRITE_SPAN_MS / authorChars.length) : 0;
      const totalAuthorH = authorChars.length * authorCharSpacing;
      const authorTopY = SVS_PAPER_SAFE_BOTTOM_Y_PX - totalAuthorH;

      ctx.font = `400 ${authorFontSize}px ${fontFamily}`;
      authorChars.forEach((ch, aIdx) => {
        const charTriggerMs = authorStartMs + aIdx * perAuthorCharMs;
        const rawProgress = (loopElapsedMs - charTriggerMs) / SVS_CHAR_FADE_DURATION_MS;
        const alpha = Math.max(0, Math.min(1, rawProgress));
        if (alpha > 0) {
          const y = authorTopY + aIdx * authorCharSpacing + authorFontSize * 0.5;
          drawSvsVerticalChar(ctx, ch, authorX, y, authorFontSize, alpha, '#3a2b22');
        }
      });
    }
    ctx.restore();
  }

  function startSvsModalLoop() {
    stopSvsCanvasAnimation();
    const canvas = document.getElementById('svsModalCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    svsAnimStartTimeMs = performance.now();

    function step(nowMs) {
      const elapsed = nowMs - svsAnimStartTimeMs;
      renderSvsFrame(ctx, elapsed);
      svsAnimFrameId = requestAnimationFrame(step);
    }
    svsAnimFrameId = requestAnimationFrame(step);
  }

  function changeSvsModalBgTheme(newThemeKey) {
    if (!svsCurrentVerseState) return;
    svsCurrentVerseState.bgTheme = newThemeKey;
    const themeObj = SVS_BG_THEMES.find(t => t.key === newThemeKey);
    if (themeObj) {
      if (themeObj.bgPath) preloadSvsBgImage(themeObj.bgPath);
      if (themeObj.ukiyoePlaceKey) ensureUkiyoePlaceBgLoaded(themeObj.ukiyoePlaceKey);
    }
    svsAnimStartTimeMs = performance.now();
  }

  function addVerseBgFeedbackFromModal(actionType) {
    if (!svsCurrentVerseState) return;
    const { recId, lines, bgTheme } = svsCurrentVerseState;
    const themeObj = SVS_BG_THEMES.find(t => t.key === bgTheme);
    const themeLabel = themeObj ? themeObj.label : bgTheme;
    const verseStr = lines.join(' ');
    if (actionType === 'lock') {
      addFeedbackItem({
        recId: recId,
        blockLabel: '🎬動画背景',
        word: verseStr,
        contextSnippet: `背景テーマ指定: ${bgTheme}`,
        action: `🎨 この句の背景を「${themeLabel}」に決定`
      });
    } else {
      const customIdea = window.prompt(`「${verseStr}」向けに新しく作りたい背景のイメージ（例：深川の芭蕉庵と川霧、千住の渡し舟と桜吹雪 など）を入力してください:`, '');
      if (!customIdea || !customIdea.trim()) return;
      addFeedbackItem({
        recId: recId,
        blockLabel: '🎬動画背景',
        word: verseStr,
        contextSnippet: `新規背景リクエスト`,
        action: `🖌️ 新規背景作成リクエスト：「${customIdea.trim()}」`
      });
    }
  }

  function openShortVerseModal(recId, genre, l1, l2, l3, author, defaultBgTheme = 'hina_peach') {
    const initialBg = defaultBgTheme || 'hina_peach';
    const themeObj = SVS_BG_THEMES.find(t => t.key === initialBg) || SVS_BG_THEMES[0];
    if (themeObj && themeObj.bgPath) {
      preloadSvsBgImage(themeObj.bgPath);
    }

    svsCurrentVerseState = {
      recId: recId,
      genre: genre || 'haiku',
      lines: [l1, l2, l3],
      author: author || '松尾芭蕉',
      bgTheme: initialBg
    };

    const overlayEl = document.getElementById('modalOverlay');
    overlayEl.classList.add('video-mode');
    document.getElementById('modalTitle').textContent = `${l1} ${l2} ${l3}`;
    document.getElementById('modalBody').innerHTML = `
      <div style="position:relative; display:flex; justify-content:center; align-items:center;">
        <canvas id="svsModalCanvas" width="1080" height="1920" onclick="svsAnimStartTimeMs = performance.now();" title="クリックで最初から再生" style="height:min(78vh, calc(100vh - 105px)); width:auto; max-width:100%; aspect-ratio:9/16; border-radius:4px; box-shadow:0 4px 18px rgba(0,0,0,0.65); background:#2c221a; cursor:pointer; display:block;"></canvas>
      </div>
    `;
    overlayEl.style.display = 'flex';
    document.getElementById('modalBody').scrollTop = 0;
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => startSvsModalLoop());
    } else {
      startSvsModalLoop();
    }
  }

  function renderReaderList() {
    const showAll = isEditModeActive() && document.getElementById('toggleShowAllParas') && document.getElementById('toggleShowAllParas').checked;
    const maxVis = getMaxVisibleParagraph();
    if (currentParaIndex > maxVis) {
      currentParaIndex = maxVis;
    }

    if (paraTopNavEl) {
      if (!showAll) {
        const prevDisabled = currentParaIndex <= 1 ? 'disabled' : '';
        const nextDisabled = currentParaIndex >= maxVis ? 'disabled' : '';
        let optionsHtml = '';
        for (let p = 1; p <= maxVis; p++) {
          const selectedAttr = p === currentParaIndex ? 'selected' : '';
          optionsHtml += `<option value="${p}" ${selectedAttr}>${getSectionLabelForPara(p)}</option>`;
        }
        paraTopNavEl.innerHTML = `
          <button class="slim-nav-btn" onclick="changeParagraph(-1)" ${prevDisabled}>←</button>
          <select class="para-select" onchange="goToParagraph(parseInt(this.value, 10))">${optionsHtml}</select>
          <button class="slim-nav-btn" onclick="changeParagraph(1)" ${nextDisabled}>→</button>
        `;
      } else {
        paraTopNavEl.innerHTML = `<span class="vol-nav-title">全段落連続表示（第 1 〜 ${maxVis} 段落）</span>`;
      }
    }

    recordListEl.innerHTML = '';

    if (readingHistoryStack.length > 0) {
      const lastId = readingHistoryStack[readingHistoryStack.length - 1];
      const lastRec = RECORDS.find(r => r.id === lastId);

        ? `<span style="font-family:'Yu Mincho','MS PMincho',serif; font-size:0.94rem; color:#4a607a; font-weight:bold; letter-spacing:0.06em;">発句・詞書</span>`
        : `<span style="font-family:'Yu Mincho','MS PMincho',serif; font-size:1.06rem; color:#3d2f1d; font-weight:bold; letter-spacing:0.08em;">${rec.section_title}</span>`;

      const eraHtml = (!isPei && rec.era_year)
        ? `<span style="font-family:'Yu Mincho','MS PMincho',serif; font-size:0.88rem; color:#796a56; letter-spacing:0.06em;">${rec.era_year}</span>`
        : '';

      card.innerHTML = `
        <div class="card-top" style="border-bottom:1px solid #ede6d8; padding-bottom:6px; margin-bottom:12px;">
          <div style="display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;">
            ${headerTitleHtml}
            ${eraHtml}
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            ${verseBtnHtml}
          </div>
        </div>
        <div class="raw-text">${renderEmbeddedTags(rec.raw_tagged, rec.id)}</div>
        <div class="kakikudashi">${renderEmbeddedTags(rec.kakikudashi_tagged, rec.id)}</div>
        <div class="translation">${renderEmbeddedTags(rec.translation_tagged, rec.id)}</div>

      card.addEventListener('click', () => {
        setActiveRecord(rec.id);
      });

      recordListEl.appendChild(card);

    const bottomNav = document.createElement('div');

  async function fetchWikipediaSummary(wikiTitle, containerId, fallbackDesc = '', hasSpecialBox = false) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const encoded = encodeURIComponent(wikiTitle);
    const wikiUrl = `https://ja.wikipedia.org/wiki/${encoded}`;
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encoded}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.type === 'disambiguation') throw new Error('Disambiguation');
      box.innerHTML = `
        <div style="font-weight:bold; color:#0d47a1; margin-bottom:4px;">🌐 【Wikipedia 概略】「${data.title}」</div>
        <div>${data.extract || '（要約テキストなし）'}</div>
        <a class="wiki-link-btn" href="${wikiUrl}" target="_blank" rel="noopener">Wikipediaで「${data.title}」のページを開く ↗</a>
      `;
    } catch (err) {
      if (hasSpecialBox) {
        box.style.display = 'none';
      } else if (fallbackDesc) {
        box.className = 'ai-special-box';
        box.innerHTML = `
          <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">📖 【語句・制度の意味解説】</div>
          <div>${fallbackDesc}</div>
        `;
      } else {
        box.style.display = 'none';
      }
    }
  }

  function getBlockLabelFromElement(el) {
    if (!el) return '本文';
    if (el.closest('.raw-text')) return '原文';
    if (el.closest('.kakikudashi')) return '書き下し';
    if (el.closest('.translation')) return '現代語訳';
    return '本文';
  }

  function getRangeCharOffsetInContainer(containerEl, range) {
    if (!containerEl || !range) return -1;
    try {
      const preRange = range.cloneRange();
      preRange.selectNodeContents(containerEl);
      preRange.setEnd(range.startContainer, range.startOffset);
      return preRange.toString().length;
    } catch (e) {
      return -1;
    }
  }

  function extractSurroundingContext(containerEl, targetWord, exactOffset = -1) {
    if (!containerEl || !targetWord) return targetWord;
    const fullText = containerEl.innerText || containerEl.textContent || '';
    const idx = (exactOffset >= 0 && exactOffset <= fullText.length)
      ? exactOffset
      : fullText.indexOf(targetWord);
    if (idx === -1) return `【${targetWord}】`;
    const start = Math.max(0, idx - CONTEXT_SNIPPET_RADIUS_CHARS);
    const end = Math.min(fullText.length, idx + targetWord.length + CONTEXT_SNIPPET_RADIUS_CHARS);
    const prefix = (start > 0 ? '…' : '') + fullText.slice(start, idx);
    const suffix = fullText.slice(idx + targetWord.length, end) + (end < fullText.length ? '…' : '');
    return `${prefix}【${targetWord}】${suffix}`;
  }

  function openFeedbackBarForTagElement(el, recId, tagType, itemKey, surfaceText) {
    if (!isEditModeActive()) return;
    const blockEl = el.closest('.raw-text, .kakikudashi, .translation');
    const blockLabel = getBlockLabelFromElement(el);
    let exactOffset = -1;
    if (blockEl && el) {
      try {
        const r = document.createRange();
        r.selectNodeContents(el);
        exactOffset = getRangeCharOffsetInContainer(blockEl, r);
      } catch (e) {}
    }
    const contextStr = extractSurroundingContext(blockEl, surfaceText, exactOffset);
    const typeNameMap = {
      'place': getPlaceSubTypeLabel(itemKey),
      'person': `👤人名(${itemKey})`,
      'office': `👑官職(${itemKey})`,
      'special': `🔖特別語(${itemKey})`
    };

    pendingFeedbackContext = {
      recId: recId,
      blockLabel: blockLabel,
      word: surfaceText,
      contextStr: contextStr,
      currentTag: typeNameMap[tagType] || tagType
    };

    const rect = el.getBoundingClientRect();
    showSelectionFeedbackBarAtRect(rect);
  }

    if (bar && bar.contains(event.target)) return;

    setTimeout(() => {
      if (!isEditModeActive()) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;
      const selectedText = sel.toString().trim();
      if (!selectedText || selectedText.length > MAX_SELECTION_CHARS) return;

      const anchorNode = sel.anchorNode;
      if (!anchorNode) return;
      const anchorEl = anchorNode.nodeType === 3 ? anchorNode.parentElement : anchorNode;
      if (!anchorEl) return;

      const cardEl = anchorEl.closest('.record-card');
      if (!cardEl) return;

      const recId = cardEl.dataset.id || currentActiveId;
      const blockEl = anchorEl.closest('.raw-text, .kakikudashi, .translation');
      const blockLabel = getBlockLabelFromElement(anchorEl);
      const range = sel.getRangeAt(0);
      const exactOffset = getRangeCharOffsetInContainer(blockEl, range);
      const contextStr = extractSurroundingContext(blockEl, selectedText, exactOffset);

      const inlineTagEl = anchorEl.closest('.inline-place, .inline-person, .inline-office, .inline-special');
      let currentTag = '未タグ';
      if (inlineTagEl) {
        const fullTagText = inlineTagEl.textContent || '';
        const tType = inlineTagEl.dataset.tagType || '';
        const tKey = inlineTagEl.dataset.tagKey || fullTagText;
        const detailType = tType === 'place' ? getPlaceSubTypeLabel(tKey) :
                           (tType === 'person' ? `👤人名(${tKey})` :
                           (tType === 'office' ? `👑官職(${tKey})` :
                           (tType === 'special' ? `🔖特別語(${tKey})` : `既タグ「${fullTagText}」`)));
        currentTag = fullTagText === selectedText ? detailType : `${detailType}の一部`;
      }

      pendingFeedbackContext = {
        recId: recId,
        blockLabel: blockLabel,
        word: selectedText,
        contextStr: contextStr,
        currentTag: currentTag
      };

      const rect = range.getBoundingClientRect();
      showSelectionFeedbackBarAtRect(rect);
    }, 10);
  });

  function showSelectionFeedbackBarAtRect(rect) {
    if (!pendingFeedbackContext) return;
    const bar = document.getElementById('selectionFeedbackBar');
    document.getElementById('sfbMetaLabel').textContent = `[${pendingFeedbackContext.recId}・${pendingFeedbackContext.blockLabel}]`;
    document.getElementById('sfbTargetWord').textContent = pendingFeedbackContext.word;
    document.getElementById('sfbCurrentTagInfo').textContent = `（現在: ${pendingFeedbackContext.currentTag}）`;

    bar.style.display = 'flex';
    const barRect = bar.getBoundingClientRect();

    let topPx = rect.top - barRect.height - POPUP_OFFSET_Y_PX;
    if (topPx < POPUP_VIEWPORT_MARGIN_PX) {
      topPx = rect.bottom + POPUP_OFFSET_Y_PX;
    }
    let leftPx = rect.left + (rect.width / 2) - (barRect.width / 2);
    leftPx = Math.max(POPUP_VIEWPORT_MARGIN_PX, Math.min(window.innerWidth - barRect.width - POPUP_VIEWPORT_MARGIN_PX, leftPx));

    bar.style.top = `${Math.round(topPx)}px`;
    bar.style.left = `${Math.round(leftPx)}px`;
  }

  function hideSelectionFeedbackBar() {
    const bar = document.getElementById('selectionFeedbackBar');
    if (bar) bar.style.display = 'none';
  }

  function addFeedbackFromBar(actionText) {
    if (!pendingFeedbackContext) return;
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: pendingFeedbackContext.recId,
      blockLabel: pendingFeedbackContext.blockLabel,
      word: pendingFeedbackContext.word,
      contextStr: pendingFeedbackContext.contextStr,
      currentTag: pendingFeedbackContext.currentTag,
      action: actionText
    });
    saveFeedbackItems();
    hideSelectionFeedbackBar();
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
  }

  function promptCustomFeedbackNote() {
    if (!pendingFeedbackContext) return;
    const note = window.prompt(
      `[${pendingFeedbackContext.recId}] 「${pendingFeedbackContext.word}」についての指摘・メモを入力してください（例：〇〇の同名別地、訳文を〇〇に修正など）：`,
      ''
    );
    if (note && note.trim()) {
      addFeedbackFromBar(`✏️ メモ指摘: ${note.trim()}`);
    }
  }

  function addPlaceToastFeedback(placeKey, surfaceText, actionText) {
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: currentActiveId,
      blockLabel: '地図確認',
      word: surfaceText,
      contextStr: `現在位置 ${currentActiveId} で「${surfaceText}」(登録キー: ${placeKey}) を確認中`,
      currentTag: `地名(${placeKey})`,
      action: actionText
    });
    saveFeedbackItems();
  }

  function startMapCoordPicker(placeKey, surfaceText) {
    mapCoordPickerState = {
      recId: currentActiveId,
      placeKey: placeKey,
      surfaceText: surfaceText
    };
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `<div style="color:#ffd54f; font-weight:bold;">🎯 【位置指定モード】地図上で「${surfaceText}」の正しい位置をクリックしてください（自動で緯度・経度が指摘リストに入ります）</div>`;
    document.getElementById('map').style.cursor = 'crosshair';
  }

  map.on('click', (e) => {
    if (!mapCoordPickerState) return;
    const lat = e.latlng.lat.toFixed(COORD_DECIMAL_DIGITS);
    const lng = e.latlng.lng.toFixed(COORD_DECIMAL_DIGITS);
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: mapCoordPickerState.recId,
      blockLabel: '地図座標指定',
      word: mapCoordPickerState.surfaceText,
      contextStr: `登録キー: ${mapCoordPickerState.placeKey}`,
      currentTag: `地名(${mapCoordPickerState.placeKey})`,
      action: `📍 正しい座標を地図クリックで指定 ➔ 緯度: ${lat}, 経度: ${lng}`
    });
    saveFeedbackItems();

    L.circleMarker([e.latlng.lat, e.latlng.lng], {
      radius: 8,
      color: '#ffeb3b',
      fillColor: '#d50000',
      fillOpacity: 0.9,
      weight: 2.5
    }).addTo(map).bindTooltip(`🎯 指摘座標: ${mapCoordPickerState.surfaceText} (${lat}, ${lng})`, { permanent: true, direction: 'top' });

    document.getElementById('map').style.cursor = '';
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `✅ <strong>「${mapCoordPickerState.surfaceText}」の指定座標 (${lat}, ${lng}) を右下の指摘リストに追加しました！</strong>`;
    mapCoordPickerState = null;
  });

  function toggleFeedbackTray() {
    const tray = document.getElementById('feedbackTray');
    const icon = document.getElementById('feedbackTrayToggleIcon');
    tray.classList.toggle('minimized');
    icon.textContent = tray.classList.contains('minimized') ? '▲ 展開する' : '▼ 折りたたむ';
  }

  function removeFeedbackItem(idx) {
    feedbackItems.splice(idx, 1);
    saveFeedbackItems();
  }

  function clearAllFeedback() {
    if (feedbackItems.length === 0) return;
    feedbackItems = [];
    saveFeedbackItems();
  }

  function renderFeedbackTray() {
    const badge = document.getElementById('feedbackCountBadge');
    const body = document.getElementById('feedbackTrayBody');
    if (!badge || !body) return;

    badge.textContent = `${feedbackItems.length}件`;

    if (feedbackItems.length === 0) {
      body.innerHTML = `
        <div class="feedback-empty">
          本文の気になる文字を<strong>なぞって選択</strong>するか、色付き単語を<strong>右クリック</strong>（🛠️指摘モードON時は左クリック）すると、ワンクリックでここに指摘が溜まります。
        </div>
      `;
      return;
    }

    body.innerHTML = feedbackItems.map((item, idx) => `
      <div class="feedback-item">
        <div>
          <div><strong>[${item.recId}・${item.blockLabel}]</strong> 「<span style="color:#ffd54f; font-weight:bold;">${item.word}</span>」 <span style="color:#b0bec5; font-size:0.74rem;">(${item.currentTag})</span></div>
          <div style="color:#a5d6a7; font-weight:bold; margin-top:2px;">➔ ${item.action}</div>
          <div style="color:#ccc; font-size:0.74rem; margin-top:1px;">文脈: ${item.contextStr}</div>
        </div>
        <button class="feedback-item-del" onclick="removeFeedbackItem(${idx})" title="この指摘を削除">✕</button>
      </div>
    `).join('');
  }

  function copyAllFeedbackToClipboard() {
    if (feedbackItems.length === 0) {
      window.alert('まだ指摘リストが空です。本文の文字をドラッグ選択するか、色付き単語を右クリックして指摘を追加してください。');
      return;
    }

    const lines = ['【おくのほそ道 ピンポイント指摘リスト】'];
    feedbackItems.forEach((item, i) => {
      lines.push(`${i + 1}. [${item.recId} / ${item.blockLabel}] 「${item.word}」（現在: ${item.currentTag}｜文脈: ${item.contextStr}） ➔ ${item.action}`);
    });
    const textToCopy = lines.join('\n');

    navigator.clipboard.writeText(textToCopy).then(() => {
      const btn = document.getElementById('feedbackCopyBtn');
      const origText = btn.textContent;
      btn.textContent = '✅ コピーしました！そのままチャットに貼り付けてください';
      btn.style.background = '#66bb6a';
      setTimeout(() => {
        btn.textContent = origText;
        btn.style.background = '';
      }, 2500);
    }).catch(() => {
      window.prompt('以下のテキストをコピーしてチャットに貼り付けてください：', textToCopy);
    });
  }

  applyEnvironmentModeUI();
  renderFeedbackTray();
  setActiveRecord("v1_p1_1");
</script>
</body>
</html>
