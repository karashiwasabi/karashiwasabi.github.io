rsons": "", "places": "富士山,上野,谷中,千住", "era_year": "元禄二年弥生廿七日", "source_book": "", "keywords": "弥生,前途三千里", "raw_tagged": "{{special:弥生|弥生}}も末の七日、明ぼのゝ空朧々として、月は在明にて光おさまれる物から、{{place:富士山|不二の峯}}かすかにみえて、{{place:上野|上野}}・{{place:谷中|谷中}}の花の梢、又いつかはと心ぼそし。むつまじきかぎりは宵よりつどひて、舟に乗て送る。{{place:千住|千じゆ}}と云所にて船をあがれば、{{special:前途三千里|前途三千里}}のおもひ胸にふさがりて、幻のちまたに離別の泪をそゝぐ。", "kakikudashi_tagged": "{{special:弥生|弥生}}も末の七日、あけぼのの空朧々として、月は在明にて光おさまれるものから、{{place:富士山|不二の峯}}かすかに見えて、{{place:上野|上野}}・{{place:谷中|谷中}}の花の梢、またいつかはと心細し。むつまじきかぎりは宵よりつどひて、舟に乗りて送る。{{place:千住|千住}}といふ所にて船をあがれば、{{special:前途三千里|前途三千里}}の思ひ胸にふさがりて、幻のちまたに離別の涙をそそぐ。", "translation_tagged": "{{special:弥生|弥生}}も二十七日、夜明けの空はおぼろにかすみ、有明の月は光を失いかけているものの、{{place:富士山|不二の峯}}がかすかに望まれ、{{place:上野|上野}}や{{place:谷中|谷中}}の桜の梢も、再びいつ見られることかと心細い。親しい門人や友人たちは前の晩から集まって、舟に同乗して見送ってくれた。{{place:千住|千住}}という所で舟を上がると、これから先に待つ{{special:前途三千里|前途三千里}}のはるかな旅路を思う気持ちで胸がいっぱいになり、幻のようなこの世の別れ道で惜別の涙を流した。"}, {"id": "v1_p2_2", "volume": 1, "book": "おくのほそ道", "section_title": "二、旅立ち（千住）", "para_index": 2, "type": "発句・注", "verse": {"genre": "haiku", "l1": "行春や", "l2": "鳥啼魚の", "l3": "目は泪", "author": "松尾芭蕉", "bg_theme": "yukuharu_senju", "bg_path": "shortliterature/bg_yukuharu_senju.jpg", "bg_title": "🌸 行く春・千住の舟出と矢立（第2句専用描き下ろし背景）"}, "raw_text": "行春や鳥啼魚の目は泪。是を矢立の初として、行道なをすゝまず。人々は途中に立ならびて、後かげの見ゆる迄はと、見送なるべし。", "kakikudashi": "行く春や鳥啼き魚の目は泪。これを矢立の初として、行く道なほ進まず。人々は途中に立ち並びて、後ろ影の見ゆるまではと、見送るなるべし。", "translation": "過ぎ行く春を惜しみ、鳥は悲しげに鳴き、魚の目にも涙が浮かんでいることよ。この一句を矢立の初として書き留めたものの、行く手の足取りはなお前に進まない。見送りの人々は道中に立ち並んで、私たちの後ろ姿が見える限りはと、いつまでも見送ってくれているのであろう。", "persons": "", "places": "", "era_year": "元禄二年弥生廿七日", "source_book": "", "keywords": "矢立の初", "raw_tagged": "行春や鳥啼魚の目は泪。是を{{special:矢立の初|矢立の初}}として、行道なをすゝまず。人々は途中に立ならびて、後かげの見ゆる迄はと、見送なるべし。", "kakikudashi_tagged": "行く春や鳥啼き魚の目は泪。これを{{special:矢立の初|矢立の初}}として、行く道なほ進まず。人々は途中に立ち並びて、後ろ影の見ゆるまではと、見送るなるべし。", "translation_tagged": "過ぎ行く春を惜しみ、鳥は悲しげに鳴き、魚の目にも涙が浮かんでいることよ。この一句を{{special:矢立の初|矢立の初}}として書き留めたものの、行く手の足取りはなお前に進まない。見送りの人々は道中に立ち並んで、私たちの後ろ姿が見える限りはと、いつまでも見送ってくれているのであろう。"}, {"id": "v1_p3_1", "volume": 1, "book": "おくのほそ道", "section_title": "三、草加", "para_index": 3, "type": "本文", "verse": null, "raw_text": "ことし元禄二とせにや、奥羽長途の行脚只かりそめに思ひたちて、呉天に白髪の恨を重ねといへ共、耳にふれていまだめに見ぬさかひ、若生て帰らばと、定なき頼の末をかけ、其日漸早加と云宿にたどり着にけり。痩骨の肩にかゝれる物先くるしむ。只身すがらにと出立侍を、紙子一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいはさりがたき餞などしたるは、さすがに打捨がたくて、路次の煩となれるこそわりなき。", "kakikudashi": "ことし元禄二とせにや、奥羽長途の行脚ただかりそめに思ひ立ちて、呉天に白髪の恨みを重ねといへども、耳にふれていまだ目に見ぬ境、もし生きて帰らばと、定めなき頼みの末をかけ、その日やうやく草加といふ宿にたどり着きにけり。痩骨の肩にかかれる物まず苦しむ。ただ身すがらにと出で立ち侍るを、紙子一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいは去りがたき餞などしたるは、さすがに打ち捨てがたくて、路次の煩ひとなれるこそわりなき。", "translation": "今年、元禄二年のことであろうか、奥羽への遠い旅路の行脚をただふと思い立って、呉天に白髪を重ねるような旅の苦労を味わうとはいえ、噂に聞くばかりでまだ目にしたことのない土地を、もし生きて帰れたならと、あてにならない望みに一縷の期待をかけて、その日はようやく草加という宿場にたどり着いた。痩せ細った肩に食い込む荷物が、まず何より我が身を苦しめる。ただ身軽に身一つでと出発したつもりであったのに、紙子一枚は夜の寒さしのぎ、浴衣や雨具、墨や筆の類、あるいは断りきれない餞別として贈られた品々は、さすがに打ち捨てるわけにもいかず、道中の厄介な重荷となってしまったのはどうしようもないことである。", "persons": "", "places": "奥州（白河・松島）圏,草加", "era_year": "元禄二年弥生廿七日", "source_book": "", "keywords": "元禄,呉天に白髪,紙子", "raw_tagged": "ことし{{special:元禄|元禄}}二とせにや、{{place:奥州（白河・松島）圏|奥羽}}長途の行脚只かりそめに思ひたちて、{{special:呉天に白髪|呉天に白髪}}の恨を重ねといへ共、耳にふれていまだめに見ぬさかひ、若生て帰らばと、定なき頼の末をかけ、其日漸{{place:草加|早加}}と云宿にたどり着にけり。痩骨の肩にかゝれる物先くるしむ。只身すがらにと出立侍を、{{special:紙子|紙子}}一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいはさりがたき餞などしたるは、さすがに打捨がたくて、路次の煩となれるこそわりなき。", "kakikudashi_tagged": "ことし{{special:元禄|元禄}}二とせにや、{{place:奥州（白河・松島）圏|奥羽}}長途の行脚ただかりそめに思ひ立ちて、{{special:呉天に白髪|呉天に白髪}}の恨みを重ねといへども、耳にふれていまだ目に見ぬ境、もし生きて帰らばと、定めなき頼みの末をかけ、その日やうやく{{place:草加|草加}}といふ宿にたどり着きにけり。痩骨の肩にかかれる物まず苦しむ。ただ身すがらにと出で立ち侍るを、{{special:紙子|紙子}}一衣は夜の防ぎ、ゆかた・雨具・墨・筆のたぐひ、あるいは去りがたき餞などしたるは、さすがに打ち捨てがたくて、路次の煩ひとなれるこそわりなき。", "translation_tagged": "今年、{{special:元禄|元禄}}二年のことであろうか、{{place:奥州（白河・松島）圏|奥羽}}への遠い旅路の行脚をただふと思い立って、{{special:呉天に白髪|呉天に白髪}}を重ねるような旅の苦労を味わうとはいえ、噂に聞くばかりでまだ目にしたことのない土地を、もし生きて帰れたならと、あてにならない望みに一縷の期待をかけて、その日はようやく{{place:草加|草加}}という宿場にたどり着いた。痩せ細った肩に食い込む荷物が、まず何より我が身を苦しめる。ただ身軽に身一つでと出発したつもりであったのに、{{special:紙子|紙子}}一枚は夜の寒さしのぎ、浴衣や雨具、墨や筆の類、あるいは断りきれない餞別として贈られた品々は、さすがに打ち捨てるわけにもいかず、道中の厄介な重荷となってしまったのはどうしようもないことである。"}, {"id": "v1_p4_1", "volume": 1, "book": "おくのほそ道", "section_title": "四、室の八島", "para_index": 4, "type": "本文", "verse": null, "raw_text": "室の八島に詣す。同行曾良が曰、「此神は木の花さくや姫の神と申て、富士一躰也。無戸室に入て焼給ふちかひのみ中に、火々出見のみこと生れ給ひしより、室の八島と申。又煙を読習し侍もこの謂也」。将このしろといふ魚を禁ず、縁記の旨世に伝ふ事も侍し。", "kakikudashi": "室の八島に詣す。同行曾良が曰く、「この神は木の花さくや姫の神と申して、富士一体なり。無戸室に入りて焼き給ふ誓ひのみ中に、火々出見のみこと生まれ給ひしより、室の八島と申す。また煙を詠み習はし侍るもこの謂なり」。またこのしろといふ魚を禁ず、縁起の旨世に伝ふ事も侍りし。", "translation": "下野国の歌枕である室の八島に参詣した。同行の曾良が言うには、「この社の祭神は木花開耶姫の神と申し上げて、富士山の浅間神社と同一の神である。姫が無戸室に入って火を放ち身の潔白を証明なさった誓いの炎の中で、火々出見命がお生まれになったことから、ここを室の八島と申し上げる。また和歌でこの地を詠む習わしとして煙を詠み込むのも、この故事によるものである」。さらにこの地ではこのしろという魚を食べることを禁じており、その由来の物語が世間に語り伝えられているということであった。", "persons": "曾良,木花開耶姫,火々出見命", "places": "室の八島,富士山", "era_year": "元禄二年弥生末", "source_book": "", "keywords": "無戸室,このしろ", "raw_tagged": "{{place:室の八島|室の八島}}に詣す。同行{{person:曾良|曾良}}が曰、「此神は{{person:木花開耶姫|木の花さくや姫}}の神と申て、{{place:富士山|富士}}一躰也。{{special:無戸室|無戸室}}に入て焼給ふちかひのみ中に、{{person:火々出見命|火々出見のみこと}}生れ給ひしより、{{place:室の八島|室の八島}}と申。又煙を読習し侍もこの謂也」。将{{special:このしろ|このしろ}}といふ魚を禁ず、縁記の旨世に伝ふ事も侍し。", "kakikudashi_tagged": "{{place:室の八島|室の八島}}に詣す。同行{{person:曾良|曾良}}が曰く、「この神は{{person:木花開耶姫|木の花さくや姫}}の神と申して、{{place:富士山|富士}}一体なり。{{special:無戸室|無戸室}}に入りて焼き給ふ誓ひのみ中に、{{person:火々出見命|火々出見のみこと}}生まれ給ひしより、{{place:室の八島|室の八島}}と申す。また煙を詠み習はし侍るもこの謂なり」。また{{special:このしろ|このしろ}}といふ魚を禁ず、縁起の旨世に伝ふ事も侍りし。", "translation_tagged": "下野国の歌枕である{{place:室の八島|室の八島}}に参詣した。同行の{{person:曾良|曾良}}が言うには、「この社の祭神は{{person:木花開耶姫|木花開耶姫}}の神と申し上げて、{{place:富士山|富士山}}の浅間神社と同一の神である。姫が{{special:無戸室|無戸室}}に入って火を放ち身の潔白を証明なさった誓いの炎の中で、{{person:火々出見命|火々出見命}}がお生まれになったことから、ここを{{place:室の八島|室の八島}}と申し上げる。また和歌でこの地を詠む習わしとして煙を詠み込むのも、この故事によるものである」。さらにこの地では{{special:このしろ|このしろ}}という魚を食べることを禁じており、その由来の物語が世間に語り伝えられているということであった。"}, {"id": "v1_p5_1", "volume": 1, "book": "おくのほそ道", "section_title": "五、日光（仏五左衛門）", "para_index": 5, "type": "本文", "verse": null, "raw_text": "卅日、日光山の麓に泊る。あるじの云けるやう、「我名を仏五左衛門と云。万正直を旨とする故に、人かくは申侍まゝ、一夜の草の枕も打解て休給へ」と云。いかなる仏の濁世塵土に示現して、かゝる桑門の乞食順礼ごときの人をたすけ給ふにやと、あるじのなす事に心をとゞめてみるに、唯無智無分別にして正直偏固の者也。剛毅木訥の仁に近ききたぐひ、気稟の清質尤尊ぶべし。", "kakikudashi": "三十日、日光山の麓に泊まる。あるじの言ひけるやう、「我が名を仏五左衛門と言ふ。よろづ正直を旨とするゆゑに、人かくは申し侍るまま、一夜の草の枕も打ち解けて休み給へ」と言ふ。いかなる仏の濁世塵土に示現して、かかる桑門の乞食巡礼ごときの人を助け給ふにやと、あるじのなす事に心をとどめて見るに、ただ無智無分別にして正直偏固の者なり。剛毅木訥の仁に近きたぐひ、気稟の清質もつとも尊ぶべし。", "translation": "三月三十日、日光山の麓の宿に泊まった。宿の主人が言うには、「私の名前を仏五左衛門と言います。何事にも正直を第一としておりますので、世間の人々がそう呼んでくださるのですが、今夜の旅寝もどうか気兼ねなくくつろいでお休みください」と言う。いったいどのような仏様がこの濁りきった俗世間に姿を現して、私たちのような僧形の乞食巡礼にも等しい旅人を救ってくださるのだろうかと、主人の振る舞いに注意して観察してみると、ただ無欲で損得勘定を知らず、ひたすら正直一途な人物であった。論語にいう剛毅木訥にして仁に近い人物の類であり、その生まれつきの清らかな気質はまことに尊ぶべきものである。", "persons": "仏五左衛門", "places": "日光山", "era_year": "元禄二年弥生晦日", "source_book": "", "keywords": "剛毅木訥", "raw_tagged": "卅日、{{place:日光山|日光山}}の麓に泊る。あるじの云けるやう、「我名を{{person:仏五左衛門|仏五左衛門}}と云。万正直を旨とする故に、人かくは申侍まゝ、一夜の草の枕も打解て休給へ」と云。いかなる仏の濁世塵土に示現して、かゝる桑門の乞食順礼ごときの人をたすけ給ふにやと、あるじのなす事に心をとゞめてみるに、唯無智無分別にして正直偏固の者也。{{special:剛毅木訥|剛毅木訥}}の仁に近ききたぐひ、気稟の清質尤尊ぶべし。", "kakikudashi_tagged": "三十日、{{place:日光山|日光山}}の麓に泊まる。あるじの言ひけるやう、「我が名を{{person:仏五左衛門|仏五左衛門}}と言ふ。よろづ正直を旨とするゆゑに、人かくは申し侍るまま、一夜の草の枕も打ち解けて休み給へ」と言ふ。いかなる仏の濁世塵土に示現して、かかる桑門の乞食巡礼ごときの人を助け給ふにやと、あるじのなす事に心をとどめて見るに、ただ無智無分別にして正直偏固の者なり。{{special:剛毅木訥|剛毅木訥}}の仁に近きたぐひ、気稟の清質もつとも尊ぶべし。", "translation_tagged": "三月三十日、{{place:日光山|日光山}}の麓の宿に泊まった。宿の主人が言うには、「私の名前を{{person:仏五左衛門|仏五左衛門}}と言います。何事にも正直を第一としておりますので、世間の人々がそう呼んでくださるのですが、今夜の旅寝もどうか気兼ねなくくつろいでお休みください」と言う。いったいどのような仏様がこの濁りきった俗世間に姿を現して、私たちのような僧形の乞食巡礼にも等しい旅人を救ってくださるのだろうかと、主人の振る舞いに注意して観察してみると、ただ無欲で損得勘定を知らず、ひたすら正直一途な人物であった。論語にいう{{special:剛毅木訥|剛毅木訥}}にして仁に近い人物の類であり、その生まれつきの清らかな気質はまことに尊ぶべきものである。"}, {"id": "v1_p5_2", "volume": 1, "book": "おくのほそ道", "section_title": "五、日光（青葉若葉）", "para_index": 5, "type": "発句・注", "verse": {"genre": "haiku", "l1": "あらたうと", "l2": "青葉若葉の", "l3": "日の光", "author": "松尾芭蕉", "bg_theme": "nikko_aoba", "bg_path": "shortliterature/bg_nikko_aoba.jpg", "bg_title": "🌿 日光・青葉若葉の日の光（第3句専用描き下ろし背景）"}, "raw_text": "卯月朔日、御山に詣拝す。往昔此御山を二荒山と書しを、空海大師開基の時、日光と改給ふ。千歳未来をさとりの給ふにや、今此御光一天にかゝやきて、恩沢八荒にあふれ、四民安堵の栖穏なり。猶憚多くて筆をさし置ぬ。あらたうと青葉若葉の日の光。", "kakikudashi": "卯月朔日、御山に詣拝す。往昔この御山を二荒山と書きしを、空海大師開基の時、日光と改め給ふ。千歳未来を悟りのたまふにや、今この御光一天にかがやきて、恩沢八荒にあふれ、四民安堵の栖穏やかなり。なほ憚り多くて筆をさし置きぬ。あらたうと青葉若葉の日の光。", "translation": "卯月の一日、日光山のお社に参拝した。大昔にはこのお山を二荒山と書いていたのを、空海大師が開山なさった時に、日光と改められた。千年先の未来まで見通して名付けられたのであろうか、今やこの東照宮の御威光は天下いっぱいに輝き渡り、その恵みは八方の隅々まであふれ、四民が安心して暮らす住まいは実に穏やかである。これ以上詳しく書き記すのは恐れ多いことなので、ここで筆を置くことにした。ああなんと尊いことであろうか、みずみずしい青葉や若葉の上に、神々しい日の光が照り輝いている。", "persons": "空海", "places": "日光山", "era_year": "元禄二年卯月朔日", "source_book": "", "keywords": "卯月,四民", "raw_tagged": "{{special:卯月|卯月}}朔日、御山に詣拝す。往昔此御山を{{place:日光山|二荒山}}と書しを、{{person:空海|空海大師}}開基の時、{{place:日光山|日光}}と改給ふ。千歳未来をさとりの給ふにや、今此御光一天にかゝやきて、恩沢八荒にあふれ、{{special:四民|四民}}安堵の栖穏なり。猶憚多くて筆をさし置ぬ。あらたうと青葉若葉の日の光。", "kakikudashi_tagged": "{{special:卯月|卯月}}朔日、御山に詣拝す。往昔この御山を{{place:日光山|二荒山}}と書きしを、{{person:空海|空海大師}}開基の時、{{place:日光山|日光}}と改め給ふ。千歳未来を悟りのたまふにや、今この御光一天にかがやきて、恩沢八荒にあふれ、{{special:四民|四民}}安堵の栖穏やかなり。なほ憚り多くて筆をさし置きぬ。あらたうと青葉若葉の日の光。", "translation_tagged": "{{special:卯月|卯月}}の一日、日光山のお社に参拝した。大昔にはこのお山を{{place:日光山|二荒山}}と書いていたのを、{{person:空海|空海大師}}が開山なさった時に、{{place:日光山|日光}}と改められた。千年先の未来まで見通して名付けられたのであろうか、今やこの東照宮の御威光は天下いっぱいに輝き渡り、その恵みは八方の隅々まであふれ、{{special:四民|四民}}が安心して暮らす住まいは実に穏やかである。これ以上詳しく書き記すのは恐れ多いことなので、ここで筆を置くことにした。ああなんと尊いことであろうか、みずみずしい青葉や若葉の上に、神々しい日の光が照り輝いている。"}, {"id": "v1_p6_1", "volume": 1, "book": "おくのほそ道", "section_title": "六、黒髪山・裏見の滝", "para_index": 6, "type": "本文", "verse": {"genre": "haiku", "l1": "剃捨て", "l2": "黒髪山に", "l3": "衣更", "author": "河合曾良", "bg_theme": "kurokami_koromogae", "bg_path": "shortliterature/bg_kurokami_koromogae.jpg", "bg_title": "⛰️ 黒髪山・墨染の衣更（第4句専用描き下ろし背景）"}, "raw_text": "黒髪山は、霞かゝりて、雪いまだ白し。剃捨て黒髪山に衣更　曾良。曾良は河合氏にして、惣五郎と云へり。芭蕉の下葉に軒をならべて、予が薪水の労をたすく。このたび松しま・象潟の眺共にせん事を悦び、且は羈旅の難をいたはらんと、旅立暁、髪を剃て墨染にさまをかえ、惣五を改て宗悟とす。仍て黒髪山の句有。「衣更」の二字、力ありてきこゆ。", "kakikudashi": "黒髪山は、霞かかりて、雪いまだ白し。剃り捨てて黒髪山に衣更　曾良。曾良は河合氏にして、惣五郎と言へり。芭蕉の下葉に軒を並べて、予が薪水の労を助く。このたび松島・象潟の眺め共にせん事を悦び、かつは羈旅の難をいたはらんと、旅立つ暁、髪を剃りて墨染にさまをかへ、惣五を改めて宗悟とす。よりて黒髪山の句あり。「衣更」の二字、力ありてきこゆ。", "translation": "日光の奥にそびえる黒髪山は、春霞がたなびきながらも、頂きにはまだ雪が白く残っている。旅立ちにあたり黒髪を剃り捨てて墨染めの衣に改めたこの身で、その名もゆかしい黒髪山を仰ぎ見ながら初夏の衣更えを迎えることよ、と曾良が詠んだ。曾良は姓を河合氏といい、通称を惣五郎といった。深川の芭蕉庵のすぐ近くに軒を並べて住み、私の日々の薪水の労を助けてくれた。このたび松島や象潟の美しい眺めを私と分かち合うことを喜び、また一つには長旅の道中の苦労をいたわり助けようと、旅立ちの夜明けに髪を剃って墨染めの僧衣に姿を改め、惣五の名を改めて法名を宗悟とした。そのような経緯によって、この黒髪山の句が生まれたのである。句中の「衣更」の二字には、出家の決意と初夏のすがすがしさが重なり、ひときわ強い響きが感じられる。", "persons": "曾良", "places": "黒髪山,松島,象潟", "era_year": "元禄二年卯月朔日", "source_book": "", "keywords": "衣更,薪水の労", "raw_tagged": "{{place:黒髪山|黒髪山}}は、霞かゝりて、雪いまだ白し。剃捨て{{place:黒髪山|黒髪山}}に{{special:衣更|衣更}}　{{person:曾良|曾良}}。{{person:曾良|曾良}}は{{person:曾良|河合氏}}にして、{{person:曾良|惣五郎}}と云へり。芭蕉の下葉に軒をならべて、予が{{special:薪水の労|薪水の労}}をたすく。このたび{{place:松島|松しま}}・{{place:象潟|象潟}}の眺共にせん事を悦び、且は羈旅の難をいたはらんと、旅立暁、髪を剃て墨染にさまをかえ、{{person:曾良|惣五}}を改て{{person:曾良|宗悟}}とす。仍て{{place:黒髪山|黒髪山}}の句有。「{{special:衣更|衣更}}」の二字、力ありてきこゆ。", "kakikudashi_tagged": "{{place:黒髪山|黒髪山}}は、霞かかりて、雪いまだ白し。剃り捨てて{{place:黒髪山|黒髪山}}に{{special:衣更|衣更}}　{{person:曾良|曾良}}。{{person:曾良|曾良}}は{{person:曾良|河合氏}}にして、{{person:曾良|惣五郎}}と言へり。芭蕉の下葉に軒を並べて、予が{{special:薪水の労|薪水の労}}を助く。このたび{{place:松島|松島}}・{{place:象潟|象潟}}の眺め共にせん事を悦び、かつは羈旅の難をいたはらんと、旅立つ暁、髪を剃りて墨染にさまをかへ、{{person:曾良|惣五}}を改めて{{person:曾良|宗悟}}とす。よりて{{place:黒髪山|黒髪山}}の句あり。「{{special:衣更|衣更}}」の二字、力ありてきこゆ。", "translation_tagged": "日光の奥にそびえる{{place:黒髪山|黒髪山}}は、春霞がたなびきながらも、頂きにはまだ雪が白く残っている。旅立ちにあたり黒髪を剃り捨てて墨染めの衣に改めたこの身で、その名もゆかしい{{place:黒髪山|黒髪山}}を仰ぎ見ながら初夏の{{special:衣更|衣更え}}を迎えることよ、と{{person:曾良|曾良}}が詠んだ。{{person:曾良|曾良}}は姓を{{person:曾良|河合氏}}といい、通称を{{person:曾良|惣五郎}}といった。深川の芭蕉庵のすぐ近くに軒を並べて住み、私の日々の{{special:薪水の労|薪水の労}}を助けてくれた。このたび{{place:松島|松島}}や{{place:象潟|象潟}}の美しい眺めを私と分かち合うことを喜び、また一つには長旅の道中の苦労をいたわり助けようと、旅立ちの夜明けに髪を剃って墨染めの僧衣に姿を改め、{{person:曾良|惣五}}の名を改めて法名を{{person:曾良|宗悟}}とした。そのような経緯によって、この{{place:黒髪山|黒髪山}}の句が生まれたのである。句中の「{{special:衣更|衣更}}」の二字には、出家の決意と初夏のすがすがしさが重なり、ひときわ強い響きが感じられる。"}, {"id": "v1_p6_2", "volume": 1, "book": "おくのほそ道", "section_title": "六、黒髪山・裏見の滝", "para_index": 6, "type": "発句・注", "verse": {"genre": "haiku", "l1": "しばらくは", "l2": "滝に籠るや", "l3": "夏の初", "author": "松尾芭蕉", "bg_theme": "urami_taki", "bg_path": "shortliterature/bg_urami_taki.jpg", "bg_title": "💧 裏見の滝・千岩の碧潭と夏籠（第5句専用描き下ろし背景）"}, "raw_text": "廿余丁山を登つて滝有。岩洞の頂より飛流して百尺、千岩の碧潭に落たり。岩窟に身をひそめて、滝の裏よりみれば、うらみの滝と申伝え侍る也。しばらくは滝に籠るや夏の初。", "kakikudashi": "二十余町山を登りて滝あり。岩洞の頂より飛流して百尺、千岩の碧潭に落ちたり。岩窟に身をひそめて、滝の裏より見れば、うらみの滝と申し伝へ侍るなり。しばらくは滝に籠るや夏の初。", "translation": "二十町あまり山を登ったところに、一つの滝がある。岩窟の頂上から百尺もの高さを勢いよく飛び流れ、無数の岩石に囲まれた深い碧色の滝壺へと落ちている。岩窟の中に身をかがめて入り、落下する水流の裏側から眺めることができるため、うらみの滝と言い伝えられているのである。初夏の僧の夏籠りのように、私もまずはしばらくこの涼やかな滝の裏の岩窟にこもって、心身を清めることにしよう。", "persons": "", "places": "裏見の滝", "era_year": "元禄二年卯月二日", "source_book": "", "keywords": "滝に籠る", "raw_tagged": "廿余丁山を登つて滝有。岩洞の頂より飛流して百尺、千岩の碧潭に落たり。岩窟に身をひそめて、滝の裏よりみれば、{{place:裏見の滝|うらみの滝}}と申伝え侍る也。しばらくは{{special:滝に籠る|滝に籠る}}や夏の初。", "kakikudashi_tagged": "二十余町山を登りて滝あり。岩洞の頂より飛流して百尺、千岩の碧潭に落ちたり。岩窟に身をひそめて、滝の裏より見れば、{{place:裏見の滝|うらみの滝}}と申し伝へ侍るなり。しばらくは{{special:滝に籠る|滝に籠る}}や夏の初。", "translation_tagged": "二十町あまり山を登ったところに、一つの滝がある。岩窟の頂上から百尺もの高さを勢いよく飛び流れ、無数の岩石に囲まれた深い碧色の滝壺へと落ちている。岩窟の中に身をかがめて入り、落下する水流の裏側から眺めることができるため、{{place:裏見の滝|うらみの滝}}と言い伝えられているのである。初夏の僧の夏籠りのように、私もまずはしばらくこの涼やかな滝の裏の岩窟にこもって、心身を清めることにしよう。"}, {"id": "v1_p7_1", "volume": 1, "book": "おくのほそ道", "section_title": "七、那須野", "para_index": 7, "type": "本文", "verse": null, "raw_text": "那須の黒羽と云所に知人あれば、是より野越にかゝりて、直道をゆかんとす。遥に一村を見かけて行に、雨降日暮る。農夫の家に一夜をかりて、明れば又野中を行。そこに野飼の馬あり。草刈おのこになげきよれば、野夫といへども、さすがに情しらぬには非ず、「いかゞすべきや、されども此野は縦横にわかれて、うゐうゐ敷旅人の道ふみたがえん、あやしう侍れば、此馬のとゞまる所にて馬を返し給へ」と貸し侍りぬ。ちいさき者ふたり、馬の跡したひてはしる。独は小姫にて、名を「かさね」と云。聞なれぬ名のやさしかりければ、", "kakikudashi": "那須の黒羽といふ所に知人あれば、これより野越えにかかりて、直道を行かんとす。遥かに一村を見かけて行くに、雨降り日暮る。農夫の家に一夜を借りて、明くればまた野中を行く。そこに野飼ひの馬あり。草刈る男に嘆き寄れば、野夫といへども、さすがに情け知らぬにはあらず、「いかがすべきや、されどもこの野は縦横に分かれて、うひうひしき旅人の道踏み違へん、あやしう侍れば、この馬のとどまる所にて馬を返し給へ」と貸し侍りぬ。ちひさき者ふたり、馬の跡慕ひて走る。ひとりは小姫にて、名を「かさね」と言ふ。聞きなれぬ名のやさしかりければ、", "translation": "那須の黒羽という所に訪ねるべき知人がいたので、ここからは那須野の原を突っ切って、近道をまっすぐ進もうとした。はるか遠くに一つの村里を見定めて歩いて行くうちに、雨が降り出して日も暮れてしまった。農夫の家に一夜の宿を借りて、夜が明けると再び広い野原の中を歩いて行った。するとそこに、野に放し飼いにされている馬がいた。草を刈っていた男に近づいて道に迷う窮状を訴えると、素朴な農夫とはいってもさすがに人情を知らないわけではなく、「どうしたものかなあ、けれどもこの那須野は道が縦横に枝分かれしていて、不慣れな旅のお方が道を踏み迷われるのも心配でございますから、この馬が立ち止まる所で馬を返してください」と言って馬を貸してくれた。幼い子どもが二人、馬の後ろを慕って駆けてくる。そのうちの一人は小さな女の子で、名前を「かさね」という。このような鄙びた野原では聞き慣れないその名前が、いかにも優美で愛らしかったので、", "persons": "かさね", "places": "那須野,黒羽", "era_year": "元禄二年卯月二日〜三日", "source_book": "", "keywords": "", "raw_tagged": "{{place:那須野|那須}}の{{place:黒羽|黒羽}}と云所に知人あれば、是より野越にかゝりて、直道をゆかんとす。遥に一村を見かけて行に、雨降日暮る。農夫の家に一夜をかりて、明れば又野中を行。そこに野飼の馬あり。草刈おのこになげきよれば、野夫といへども、さすがに情しらぬには非ず、「いかゞすべきや、されども此野は縦横にわかれて、うゐうゐ敷旅人の道ふみたがえん、あやしう侍れば、此馬のとゞまる所にて馬を返し給へ」と貸し侍りぬ。ちいさき者ふたり、馬の跡したひてはしる。独は小姫にて、名を「{{person:かさね|かさね}}」と云。聞なれぬ名のやさしかりければ、", "kakikudashi_tagged": "{{place:那須野|那須}}の{{place:黒羽|黒羽}}といふ所に知人あれば、これより野越えにかかりて、直道を行かんとす。遥かに一村を見かけて行くに、雨降り日暮る。農夫の家に一夜を借りて、明くればまた野中を行く。そこに野飼ひの馬あり。草刈る男に嘆き寄れば、野夫といへども、さすがに情け知らぬにはあらず、「いかがすべきや、されどもこの野は縦横に分かれて、うひうひしき旅人の道踏み違へん、あやしう侍れば、この馬のとどまる所にて馬を返し給へ」と貸し侍りぬ。ちひさき者ふたり、馬の跡慕ひて走る。ひとりは小姫にて、名を「{{person:かさね|かさね}}」と言ふ。聞きなれぬ名のやさしかりければ、", "translation_tagged": "{{place:那須野|那須}}の{{place:黒羽|黒羽}}という所に訪ねるべき知人がいたので、ここからは{{place:那須野|那須野}}の原を突っ切って、近道をまっすぐ進もうとした。はるか遠くに一つの村里を見定めて歩いて行くうちに、雨が降り出して日も暮れてしまった。農夫の家に一夜の宿を借りて、夜が明けると再び広い野原の中を歩いて行った。するとそこに、野に放し飼いにされている馬がいた。草を刈っていた男に近づいて道に迷う窮状を訴えると、素朴な農夫とはいってもさすがに人情を知らないわけではなく、「どうしたものかなあ、けれどもこの那須野は道が縦横に枝分かれしていて、不慣れな旅のお方が道を踏み迷われるのも心配でございますから、この馬が立ち止まる所で馬を返してください」と言って馬を貸してくれた。幼い子どもが二人、馬の後ろを慕って駆けてくる。そのうちの一人は小さな女の子で、名前を「{{person:かさね|かさね}}」という。このような鄙びた野原では聞き慣れないその名前が、いかにも優美で愛らしかったので、"}, {"id": "v1_p7_2", "volume": 1, "book": "おくのほそ道", "section_title": "七、那須野", "para_index": 7, "type": "発句・注", "verse": {"genre": "haiku", "l1": "かさねとは", "l2": "八重撫子の", "l3": "名成べし", "author": "河合曾良", "bg_theme": "kasane_nadeshiko", "bg_path": "shortliterature/bg_kasane_nadeshiko.jpg", "bg_title": "🌸 那須野・かさねと八重撫子（第6句専用描き下ろし背景）"}, "raw_text": "かさねとは八重撫子の名成べし　曾良。頓て人里に至れば、あたひを鞍つぼに結付て馬を返しぬ。", "kakikudashi": "かさねとは八重撫子の名なるべし　曾良。やがて人里に至れば、あたひを鞍つぼに結び付けて馬を返しぬ。", "translation": "かさねという優美な名は、きっと花びらが幾重にも重なって咲く可憐な八重撫子の花の名なのであろう、と曾良が詠んだ。やがて人里にたどり着くと、駄賃を鞍壺に結び付けて、子どもたちとともに馬を元の主のもとへ返した。", "persons": "かさね,曾良", "places": "", "era_year": "元禄二年卯月三日", "source_book": "", "keywords": "八重撫子", "raw_tagged": "{{person:かさね|かさね}}とは{{special:八重撫子|八重撫子}}の名成べし　{{person:曾良|曾良}}。頓て人里に至れば、あたひを鞍つぼに結付て馬を返しぬ。", "kakikudashi_tagged": "{{person:かさね|かさね}}とは{{special:八重撫子|八重撫子}}の名なるべし　{{person:曾良|曾良}}。やがて人里に至れば、あたひを鞍つぼに結び付けて馬を返しぬ。", "translation_tagged": "{{person:かさね|かさね}}という優美な名は、きっと花びらが幾重にも重なって咲く可憐な{{special:八重撫子|八重撫子}}の花の名なのであろう、と{{person:曾良|曾良}}が詠んだ。やがて人里にたどり着くと、駄賃を鞍壺に結び付けて、子どもたちとともに馬を元の主のもとへ返した。"}, {"id": "v1_p8_1", "volume": 1, "book": "おくのほそ道", "section_title": "八、黒羽", "para_index": 8, "type": "本文", "verse": null, "raw_text": "黒羽の館代浄法寺何がしの方に音信る。思ひかけぬあるじの悦び、日夜語つゞけて、其弟桃翠など云が朝夕勤とぶらひ、自の家にも伴ひて、親属の方にも招かれ、日数をふるまゝに、ひとひ郊外に逍遥して、犬追物の跡を一見し、那須の篠原をわけて、玉藻の前の古墳をとふ。それより八幡宮に詣。与市扇の的を射し時、「別しては我国氏神正八まん」とちかひしも、此神社にて侍と聞ば、感応殊しきりに覚えらる。暮れば桃翠が宅に帰る。", "kakikudashi": "黒羽の館代浄法寺何がしの方に音信る。思ひかけぬあるじの悦び、日夜語り続けて、その弟桃翠など言ふが朝夕勤めとぶらひ、自らの家にも伴ひて、親属の方にも招かれ、日数を経るままに、ひとひ郊外に逍遥して、犬追物の跡を一見し、那須の篠原をわけて、玉藻の前の古墳を訪ふ。それより八幡宮に詣づ。与市扇の的を射し時、「別しては我が国氏神正八幡」と誓ひしも、この神社にて侍ると聞けば、感応ことにしきりに覚へらる。暮るれば桃翠が宅に帰る。", "translation": "黒羽の館代を務める浄法寺何がしのもとを訪ねた。思いがけない来訪に主人は大いに喜んで昼も夜も語り続け、その弟の桃翠という人も朝夕まめまめしく訪ねてくれて、自分の家にも案内し、親族の家にも招かれるなどして日数を重ねるうちに、ある日郊外を散策して犬追物の馬場の跡を見物し、那須の篠原を踏み分けて玉藻の前の古墳を訪ねた。そこからさらに八幡宮に参詣した。屋島の戦いで与市が扇の的を射た時、「とりわけ我が故郷の氏神である正八幡」と祈り誓ったのもこの神社であると聞くと、神の霊験と感動がひときわ強く胸に迫ってくる。日が暮れると桃翠の屋敷へと帰った。", "persons": "浄法寺高勝,鹿子畑翠桃,玉藻の前,那須与一", "places": "黒羽,那須の篠原,那須八幡宮", "era_year": "元禄二年卯月四日〜", "source_book": "", "keywords": "館代,犬追物,扇の的", "raw_tagged": "{{place:黒羽|黒羽}}の{{office:館代|館代}}{{person:浄法寺高勝|浄法寺何がし}}の方に音信る。思ひかけぬあるじの悦び、日夜語つゞけて、其弟{{person:鹿子畑翠桃|桃翠}}など云が朝夕勤とぶらひ、自の家にも伴ひて、親属の方にも招かれ、日数をふるまゝに、ひとひ郊外に逍遥して、{{special:犬追物|犬追物}}の跡を一見し、{{place:那須の篠原|那須の篠原}}をわけて、{{person:玉藻の前|玉藻の前}}の古墳をとふ。それより{{place:那須八幡宮|八幡宮}}に詣。{{person:那須与一|与市}}{{special:扇の的|扇の的}}を射し時、「別しては我国氏神{{place:那須八幡宮|正八まん}}」とちかひしも、此神社にて侍と聞ば、感応殊しきりに覚えらる。暮れば{{person:鹿子畑翠桃|桃翠}}が宅に帰る。", "kakikudashi_tagged": "{{place:黒羽|黒羽}}の{{office:館代|館代}}{{person:浄法寺高勝|浄法寺何がし}}の方に音信る。思ひかけぬあるじの悦び、日夜語り続けて、その弟{{person:鹿子畑翠桃|桃翠}}など言ふが朝夕勤めとぶらひ、自らの家にも伴ひて、親属の方にも招かれ、日数を経るままに、ひとひ郊外に逍遥して、{{special:犬追物|犬追物}}の跡を一見し、{{place:那須の篠原|那須の篠原}}をわけて、{{person:玉藻の前|玉藻の前}}の古墳を訪ふ。それより{{place:那須八幡宮|八幡宮}}に詣づ。{{person:那須与一|与市}}{{special:扇の的|扇の的}}を射し時、「別しては我が国氏神{{place:那須八幡宮|正八幡}}」と誓ひしも、この神社にて侍ると聞けば、感応ことにしきりに覚へらる。暮るれば{{person:鹿子畑翠桃|桃翠}}が宅に帰る。", "translation_tagged": "{{place:黒羽|黒羽}}の{{office:館代|館代}}を務める{{person:浄法寺高勝|浄法寺何がし}}のもとを訪ねた。思いがけない来訪に主人は大いに喜んで昼も夜も語り続け、その弟の{{person:鹿子畑翠桃|桃翠}}という人も朝夕まめまめしく訪ねてくれて、自分の家にも案内し、親族の家にも招かれるなどして日数を重ねるうちに、ある日郊外を散策して{{special:犬追物|犬追物}}の馬場の跡を見物し、{{place:那須の篠原|那須の篠原}}を踏み分けて{{person:玉藻の前|玉藻の前}}の古墳を訪ねた。そこからさらに{{place:那須八幡宮|八幡宮}}に参詣した。屋島の戦いで{{person:那須与一|与市}}が{{special:扇の的|扇の的}}を射た時、「とりわけ我が故郷の氏神である{{place:那須八幡宮|正八幡}}」と祈り誓ったのもこの神社であると聞くと、神の霊験と感動がひときわ強く胸に迫ってくる。日が暮れると{{person:鹿子畑翠桃|桃翠}}の屋敷へと帰った。"}, {"id": "v1_p8_2", "volume": 1, "book": "おくのほそ道", "section_title": "八、黒羽", "para_index": 8, "type": "発句・注", "verse": {"genre": "haiku", "l1": "夏山に", "l2": "足駄を拝む", "l3": "首途哉", "author": "松尾芭蕉", "bg_theme": "komyoji_ashida", "bg_path": "shortliterature/bg_komyoji_ashida.jpg", "bg_title": "⛰️ 光明寺・夏山と役行者の足駄（第7句専用描き下ろし背景）"}, "raw_text": "修験光明寺と云有。そこにまねかれて、行者堂を拝す。夏山に足駄を拝む首途哉。", "kakikudashi": "修験光明寺と言ふあり。そこに招かれて、行者堂を拝す。夏山に足駄を拝む首途かな。", "translation": "この地に修験道の光明寺という寺がある。その寺に招かれて、開祖の役行者を祀る行者堂を礼拝した。青々と茂る夏山を前に、健脚の役行者が履く力強い高足駄を拝んで、これから続くみちのくへの旅立ちを祈ることよ。", "persons": "役行者", "places": "光明寺", "era_year": "元禄二年卯月", "source_book": "", "keywords": "", "raw_tagged": "修験{{place:光明寺|光明寺}}と云有。そこにまねかれて、{{person:役行者|行者堂}}を拝す。夏山に足駄を拝む首途哉。", "kakikudashi_tagged": "修験{{place:光明寺|光明寺}}と言ふあり。そこに招かれて、{{person:役行者|行者堂}}を拝す。夏山に足駄を拝む首途かな。", "translation_tagged": "この地に修験道の{{place:光明寺|光明寺}}という寺がある。その寺に招かれて、開祖の{{person:役行者|役行者}}を祀る{{person:役行者|行者堂}}を礼拝した。青々と茂る夏山を前に、健脚の役行者が履く力強い高足駄を拝んで、これから続くみちのくへの旅立ちを祈ることよ。"}, {"id": "v1_p9_1", "volume": 1, "book": "おくのほそ道", "section_title": "九、雲巌寺", "para_index": 9, "type": "本文", "verse": null, "raw_text": "当国雲岸寺のおくに、仏頂和尚山居の跡あり。「竪横の五尺にたらぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書付侍りと、いつぞや聞え給ふ。其跡みんと、雲岸寺に杖を曳ば、人々すゝんで共にいざなひ、若き人おほく道のほど打さはぎて、おぼえず彼麓に到る。山はおくあるけしきにて、谷道遥に、松杉黒く、苔したゞりて、卯月の天今猶寒し。十景尽る所、橋をわたつて山門に入。", "kakikudashi": "当国雲岸寺の奥に、仏頂和尚山居の跡あり。「竪横の五尺に足らぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書き付け侍りと、いつぞや聞こえ給ふ。その跡見んと、雲岸寺に杖を曳けば、人々進みて共にいざなひ、若き人多く道のほど打ち騒ぎて、おぼえずかの麓に到る。山は奥あるけしきにて、谷道遥かに、松杉黒く、苔したたりて、卯月の天今なほ寒し。十景尽くる所、橋を渡りて山門に入る。", "translation": "この下野国の雲岸寺の奥山に、私が参禅した仏頂和尚がかつて山ごもりをなさった庵の跡がある。「縦も横も五尺に満たない小さな草の庵さえ、もし雨が降らないのであれば結ぶのも悔しいことだ」という歌を、松の消し炭で傍らの岩に書き付けられたと、いつか和尚ご自身がお話しくださったことがあった。その山居の跡を一目見ようと雲岸寺へ向けて杖を引いて歩き出すと、黒羽の人々も進んで同行に誘い合い、若い人たちが大勢道すがら賑やかに語り合ううちに、いつの間にかその山の麓にたどり着いた。山はいかにも奥深い趣をたたえ、谷あいの道がはるかに続き、松や杉が黒々と茂り、岩の苔からは水滴がしたたり落ちて、卯月の初夏の空というのに今もなお肌寒い。雲岸寺十景の名所が尽きるところで、朱塗りの橋を渡って山門へと入った。", "persons": "仏頂和尚", "places": "雲巌寺", "era_year": "元禄二年卯月五日", "source_book": "", "keywords": "卯月", "raw_tagged": "当国{{place:雲巌寺|雲岸寺}}のおくに、{{person:仏頂和尚|仏頂和尚}}山居の跡あり。「竪横の五尺にたらぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書付侍りと、いつぞや聞え給ふ。其跡みんと、{{place:雲巌寺|雲岸寺}}に杖を曳ば、人々すゝんで共にいざなひ、若き人おほく道のほど打さはぎて、おぼえず彼麓に到る。山はおくあるけしきにて、谷道遥に、松杉黒く、苔したゞりて、{{special:卯月|卯月}}の天今猶寒し。十景尽る所、橋をわたつて山門に入。", "kakikudashi_tagged": "当国{{place:雲巌寺|雲岸寺}}の奥に、{{person:仏頂和尚|仏頂和尚}}山居の跡あり。「竪横の五尺に足らぬ草の庵むすぶもくやし雨なかりせば」と、松の炭して岩に書き付け侍りと、いつぞや聞こえ給ふ。その跡見んと、{{place:雲巌寺|雲岸寺}}に杖を曳けば、人々進みて共にいざなひ、若き人多く道のほど打ち騒ぎて、おぼえずかの麓に到る。山は奥あるけしきにて、谷道遥かに、松杉黒く、苔したたりて、{{special:卯月|卯月}}の天今なほ寒し。十景尽くる所、橋を渡りて山門に入る。", "translation_tagged": "この下野国の{{place:雲巌寺|雲岸寺}}の奥山に、私が参禅した{{person:仏頂和尚|仏頂和尚}}がかつて山ごもりをなさった庵の跡がある。「縦も横も五尺に満たない小さな草の庵さえ、もし雨が降らないのであれば結ぶのも悔しいことだ」という歌を、松の消し炭で傍らの岩に書き付けられたと、いつか和尚ご自身がお話しくださったことがあった。その山居の跡を一目見ようと{{place:雲巌寺|雲岸寺}}へ向けて杖を引いて歩き出すと、黒羽の人々も進んで同行に誘い合い、若い人たちが大勢道すがら賑やかに語り合ううちに、いつの間にかその山の麓にたどり着いた。山はいかにも奥深い趣をたたえ、谷あいの道がはるかに続き、松や杉が黒々と茂り、岩の苔からは水滴がしたたり落ちて、{{special:卯月|卯月}}の初夏の空というのに今もなお肌寒い。雲岸寺十景の名所が尽きるところで、朱塗りの橋を渡って山門へと入った。"}, {"id": "v1_p9_2", "volume": 1, "book": "おくのほそ道", "section_title": "九、雲巌寺", "para_index": 9, "type": "発句・注", "verse": {"genre": "haiku", "l1": "木啄も", "l2": "庵はやぶらず", "l3": "夏木立", "author": "松尾芭蕉", "bg_theme": "unganji_kitsutsuki", "bg_path": "shortliterature/bg_unganji_kitsutsuki.jpg", "bg_title": "🌲 雲巌寺・夏木立と仏頂和尚の石上小庵（第8句専用描き下ろし背景）"}, "raw_text": "さてかの跡はいづくのほどにやと、後の山によぢのぼれば、石上の小庵岩窟にむすびかけたり。妙禅師の死関、法雲法師の石室を見るがごとし。木啄も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残侍し。", "kakikudashi": "さてかの跡はいづくのほどにやと、後の山によぢ登れば、石上の小庵岩窟に結びかけたり。妙禅師の死関、法雲法師の石室を見るがごとし。木啄も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残し侍りし。", "translation": "さて、あの仏頂和尚の旧庵の跡はどのあたりであろうかと、本堂の後ろの山をよじ登ってみると、岩の上の小さな庵が岩窟に掛け渡すようにして結ばれていた。その有様は、あたかも中国の妙禅師が籠もった死関や、法雲法師が修行した石室を目の当たりにするかのようである。木を突く習性のある木啄でさえも、和尚の徳を憚ってこの尊い小庵ばかりは突き破らずに残していることよ、清らかな夏木立のただ中に。と、その場で詠んだ即興の一句を庵の柱に書き残しておいた。", "persons": "妙禅師,法雲法師", "places": "", "era_year": "元禄二年卯月五日", "source_book": "", "keywords": "木啄", "raw_tagged": "さてかの跡はいづくのほどにやと、後の山によぢのぼれば、石上の小庵岩窟にむすびかけたり。{{person:妙禅師|妙禅師}}の死関、{{person:法雲法師|法雲法師}}の石室を見るがごとし。{{special:木啄|木啄}}も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残侍し。", "kakikudashi_tagged": "さてかの跡はいづくのほどにやと、後の山によぢ登れば、石上の小庵岩窟に結びかけたり。{{person:妙禅師|妙禅師}}の死関、{{person:法雲法師|法雲法師}}の石室を見るがごとし。{{special:木啄|木啄}}も庵はやぶらず夏木立。と、とりあへぬ一句を柱に残し侍りし。", "translation_tagged": "さて、あの仏頂和尚の旧庵の跡はどのあたりであろうかと、本堂の後ろの山をよじ登ってみると、岩の上の小さな庵が岩窟に掛け渡すようにして結ばれていた。その有様は、あたかも中国の{{person:妙禅師|妙禅師}}が籠もった死関や、{{person:法雲法師|法雲法師}}が修行した石室を目の当たりにするかのようである。木を突く習性のある{{special:木啄|木啄}}でさえも、和尚の徳を憚ってこの尊い小庵ばかりは突き破らずに残していることよ、清らかな夏木立のただ中に。と、その場で詠んだ即興の一句を庵の柱に書き残しておいた。"}, {"id": "v1_p10_1", "volume": 1, "book": "おくのほそ道", "section_title": "十、殺生石・遊行柳", "para_index": 10, "type": "本文", "verse": {"genre": "haiku", "l1": "野を横に", "l2": "馬牽むけよ", "l3": "ほとゝぎす", "author": "松尾芭蕉", "bg_theme": "nasu_hototogisu", "bg_path": "shortliterature/bg_nasu_hototogisu.jpg", "bg_title": "🐦 那須野・馬とほととぎす（第9句専用描き下ろし背景）"}, "raw_text": "是より殺生石に行。館代より馬にて送らる。此口付のおのこ、短冊得させよと乞。やさしき事を望侍るものかなと、野を横に馬牽むけよほとゝぎす。殺生石は温泉の出る山陰にあり。石の毒気いまだほろびず、蜂・蝶のたぐひ、真砂の色の見えぬほどかさなり死す。", "kakikudashi": "これより殺生石に行く。館代より馬にて送らる。この口付の男、短冊得させよと乞ふ。やさしき事を望み侍るものかなと、野を横に馬牽きむけよほととぎす。殺生石は温泉の出づる山陰にあり。石の毒気いまだほろびず、蜂・蝶のたぐひ、真砂の色の見えぬほど重なり死す。", "translation": "ここから那須湯本の殺生石へと向かった。黒羽の館代である浄法寺桃雪から出された馬で送ってもらった。この馬の口取りの男が、私に一句記した短冊をいただきたいと願い出た。風流で殊勝なことを望むものだなあと感心して、広い那須野を横切るように馬の首をあのほととぎすの鳴き声の方へ引き向けておくれ、と詠んで与えた。殺生石は温泉が湧き出る山の陰にある。石から立ちのぼる毒気は今もなお消え失せておらず、蜂や蝶の類が地面の砂の色も見えないほど幾重にも重なって死んでいる。", "persons": "", "places": "殺生石", "era_year": "元禄二年卯月十六日〜十九日", "source_book": "", "keywords": "館代", "raw_tagged": "是より{{place:殺生石|殺生石}}に行。{{office:館代|館代}}より馬にて送らる。此口付のおのこ、短冊得させよと乞。やさしき事を望侍るものかなと、野を横に馬牽むけよほとゝぎす。{{place:殺生石|殺生石}}は温泉の出る山陰にあり。石の毒気いまだほろびず、蜂・蝶のたぐひ、真砂の色の見えぬほどかさなり死す。", "kakikudashi_tagged": "これより{{place:殺生石|殺生石}}に行く。{{office:館代|館代}}より馬にて送らる。この口付の男、短冊得させよと乞ふ。やさしき事を望み侍るものかなと、野を横に馬牽きむけよほととぎす。{{place:殺生石|殺生石}}は温泉の出づる山陰にあり。石の毒気いまだほろびず、蜂・蝶のたぐひ、真砂の色の見えぬほど重なり死す。", "translation_tagged": "ここから那須湯本の{{place:殺生石|殺生石}}へと向かった。黒羽の{{office:館代|館代}}である浄法寺桃雪から出された馬で送ってもらった。この馬の口取りの男が、私に一句記した短冊をいただきたいと願い出た。風流で殊勝なことを望むものだなあと感心して、広い那須野を横切るように馬の首をあのほととぎすの鳴き声の方へ引き向けておくれ、と詠んで与えた。{{place:殺生石|殺生石}}は温泉が湧き出る山の陰にある。石から立ちのぼる毒気は今もなお消え失せておらず、蜂や蝶の類が地面の砂の色も見えないほど幾重にも重なって死んでいる。"}, {"id": "v1_p10_2", "volume": 1, "book": "おくのほそ道", "section_title": "十、殺生石・遊行柳", "para_index": 10, "type": "発句・注", "verse": {"genre": "haiku", "l1": "田一枚", "l2": "植て立去る", "l3": "柳かな", "author": "松尾芭蕉", "bg_theme": "yugyo_yanagi", "bg_path": "shortliterature/bg_yugyo_yanagi.jpg", "bg_title": "🌿 芦野・遊行柳と早苗の田（第10句専用描き下ろし背景）"}, "raw_text": "又、清水ながるゝの柳は、芦野の里にありて、田の畔に残る。此所の郡守戸部某の、此柳みせばやなど、折々にの給ひ聞え給ふを、いづくのほどにやと思ひしを、今日此柳のかげにこそ立より侍つれ。田一枚植て立去る柳かな。", "kakikudashi": "また、清水流るるの柳は、芦野の里にありて、田の畔に残る。この所の郡守戸部某の、この柳見せばやなど、折々にのたまひ聞こえ給ふを、いづくのほどにやと思ひしを、今日この柳の陰にこそ立ち寄り侍りつれ。田一枚植ゑて立ち去る柳かな。", "translation": "また、西行法師の歌に詠まれた清水流るるの柳は、芦野の里にあって田の畦に残っている。この地の郡守である戸部某が、この柳をぜひ見せたいものだと折にふれておっしゃっていたのを、どのあたりにあるのだろうと思っていたが、今日ついにこの柳の木陰に立ち寄ることができた。早乙女たちが目の前の田を一枚すっかり植え終わるまで古歌の感慨に浸り、ようやくこの柳の木陰を立ち去ることよ。", "persons": "芦野資俊", "places": "芦野", "era_year": "元禄二年卯月廿日", "source_book": "", "keywords": "清水ながるゝの柳,郡守", "raw_tagged": "又、{{special:清水ながるゝの柳|清水ながるゝの柳}}は、{{place:芦野|芦野の里}}にありて、田の畔に残る。此所の{{office:郡守|郡守}}{{person:芦野資俊|戸部某}}の、此柳みせばやなど、折々にの給ひ聞え給ふを、いづくのほどにやと思ひしを、今日此柳のかげにこそ立より侍つれ。田一枚植て立去る柳かな。", "kakikudashi_tagged": "また、{{special:清水ながるゝの柳|清水流るるの柳}}は、{{place:芦野|芦野の里}}にありて、田の畔に残る。この所の{{office:郡守|郡守}}{{person:芦野資俊|戸部某}}の、この柳見せばやなど、折々にのたまひ聞こえ給ふを、いづくのほどにやと思ひしを、今日この柳の陰にこそ立ち寄り侍りつれ。田一枚植ゑて立ち去る柳かな。", "translation_tagged": "また、西行法師の歌に詠まれた{{special:清水ながるゝの柳|清水流るるの柳}}は、{{place:芦野|芦野の里}}にあって田の畦に残っている。この地の{{office:郡守|郡守}}である{{person:芦野資俊|戸部某}}が、この柳をぜひ見せたいものだと折にふれておっしゃっていたのを、どのあたりにあるのだろうと思っていたが、今日ついにこの柳の木陰に立ち寄ることができた。早乙女たちが目の前の田を一枚すっかり植え終わるまで古歌の感慨に浸り、ようやくこの柳の木陰を立ち去ることよ。"}, {"id": "v1_p11_1", "volume": 1, "book": "おくのほそ道", "section_title": "十一、白河の関", "para_index": 11, "type": "本文", "verse": null, "raw_text": "心許なき日かず重るまゝに、白川の関にかゝりて、旅心定りぬ。「いかで都へ」と便求しも断也。中にも此関は三関の一にして、風騒の人心をとゞむ。秋風を耳に残し、紅葉を俤にして、青葉の梢猶あはれ也。卯の花の白妙に、茨の花の咲そひて、雪にもこゆる心地ぞする。古人冠を正し衣装を改し事など、清輔の筆にもとゞめ置れしとぞ。", "kakikudashi": "心許なき日数重なるままに、白川の関にかかりて、旅心定まりぬ。「いかで都へ」と便り求めしもことわりなり。中にもこの関は三関の一にして、風騒の人心をとどむ。秋風を耳に残し、紅葉を俤にして、青葉の梢なほあはれなり。卯の花の白妙に、茨の花の咲きそひて、雪にも越ゆる心地ぞする。古人冠を正し衣装を改めし事など、清輔の筆にもとどめ置かれしとぞ。", "translation": "心細い旅の日数を重ねるうちに、ついに白川の関にさしかかって、ようやく旅人としての心が落ち着いた。古人が「いかで都へ」と詠んで都への便りを求めたのも、まことに無理からぬことである。とりわけこの関は奥羽三関の一つであって、風雅を愛する人々の心を強く引き留めてやまない。能因法師の秋風を耳に残し、源頼政の紅葉を面影に思い浮かべながら眺めると、初夏の青葉の梢がいっそう趣深く感じられる。卯の花の純白に加えて白い茨の花も咲き添い、まるで白い雪の中を関越えしているかのような心地がする。その昔、古人がこの関を越えるにあたって冠を正し衣装を改めたという故事なども、藤原清輔の筆によって書き留められているということである。", "persons": "藤原清輔", "places": "白河関", "era_year": "元禄二年卯月廿日", "source_book": "", "keywords": "いかで都へ,三関,秋風を耳に残し,卯の花", "raw_tagged": "心許なき日かず重るまゝに、{{place:白河関|白川の関}}にかゝりて、旅心定りぬ。「{{special:いかで都へ|いかで都へ}}」と便求しも断也。中にも此関は{{special:三関|三関}}の一にして、風騒の人心をとゞむ。{{special:秋風を耳に残し|秋風を耳に残し}}、{{special:秋風を耳に残し|紅葉を俤にして}}、青葉の梢猶あはれ也。{{special:卯の花|卯の花}}の白妙に、茨の花の咲そひて、雪にもこゆる心地ぞする。古人冠を正し衣装を改し事など、{{person:藤原清輔|清輔}}の筆にもとゞめ置れしとぞ。", "kakikudashi_tagged": "心許なき日数重なるままに、{{place:白河関|白川の関}}にかかりて、旅心定まりぬ。「{{special:いかで都へ|いかで都へ}}」と便り求めしもことわりなり。中にもこの関は{{special:三関|三関}}の一にして、風騒の人心をとどむ。{{special:秋風を耳に残し|秋風を耳に残し}}、{{special:秋風を耳に残し|紅葉を俤にして}}、青葉の梢なほあはれなり。{{special:卯の花|卯の花}}の白妙に、茨の花の咲きそひて、雪にも越ゆる心地ぞする。古人冠を正し衣装を改めし事など、{{person:藤原清輔|清輔}}の筆にもとどめ置かれしとぞ。", "translation_tagged": "心細い旅の日数を重ねるうちに、ついに{{place:白河関|白川の関}}にさしかかって、ようやく旅人としての心が落ち着いた。古人が「{{special:いかで都へ|いかで都へ}}」と詠んで都への便りを求めたのも、まことに無理からぬことである。とりわけこの関は奥羽{{special:三関|三関}}の一つであって、風雅を愛する人々の心を強く引き留めてやまない。能因法師の{{special:秋風を耳に残し|秋風を耳に残し}}、源頼政の紅葉を面影に思い浮かべながら眺めると、初夏の青葉の梢がいっそう趣深く感じられる。{{special:卯の花|卯の花}}の純白に加えて白い茨の花も咲き添い、まるで白い雪の中を関越えしているかのような心地がする。その昔、古人がこの関を越えるにあたって冠を正し衣装を改めたという故事なども、{{person:藤原清輔|藤原清輔}}の筆によって書き留められているということである。"}, {"id": "v1_p11_2", "volume": 1, "book": "おくのほそ道", "section_title": "十一、白河の関", "para_index": 11, "type": "発句・注", "verse": {"genre": "haiku", "l1": "卯の花を", "l2": "かざしに関の", "l3": "晴着かな", "author": "河合曾良", "bg_theme": "shirakawa_unohana", "bg_path": "shortliterature/bg_shirakawa_unohana.jpg", "bg_title": "🤍 白河の関・卯の花の晴着（第11句専用描き下ろし背景）"}, "raw_text": "卯の花をかざしに関の晴着かな　曾良。", "kakikudashi": "卯の花をかざしに関の晴着かな　曾良。", "translation": "冠を正した古人にならい、私たちは真っ白な卯の花を笠のかざしに挿して、白川の関を越える晴れ着とすることよ、と曾良が詠んだ。", "persons": "曾良", "places": "", "era_year": "元禄二年卯月廿日", "source_book": "", "keywords": "卯の花", "raw_tagged": "{{special:卯の花|卯の花}}をかざしに関の晴着かな　{{person:曾良|曾良}}。", "kakikudashi_tagged": "{{special:卯の花|卯の花}}をかざしに関の晴着かな　{{person:曾良|曾良}}。", "translation_tagged": "冠を正した古人にならい、私たちは真っ白な{{special:卯の花|卯の花}}を笠のかざしに挿して、白川の関を越える晴れ着とすることよ、と{{person:曾良|曾良}}が詠んだ。"}, {"id": "v1_p12_1", "volume": 1, "book": "おくのほそ道", "section_title": "十二、須賀川", "para_index": 12, "type": "本文", "verse": {"genre": "haiku", "l1": "風流の", "l2": "初やおくの", "l3": "田植うた", "author": "松尾芭蕉", "bg_theme": "sukagawa_taueuta", "bg_path": "shortliterature/bg_sukagawa_taueuta.jpg", "bg_title": "🌾 須賀川・おくの田植うた（第12句専用描き下ろし背景）"}, "raw_text": "とかくして越行まゝに、あぶくま川を渡る。左に会津根高く、右に岩城・相馬・三春の庄、常陸・下野の地をさかひて、山つらなる。かげ沼と云所を行に、けふは空曇て物影うつらず。すか川の駅に等躬といふものを尋て、四五日とゞめらる。先「白河の関いかにこえつるや」と問。「長途のくるしみ、身心つかれ、且は風景に魂うばゝれ、懐旧に腸を断て、はかばかしう思ひめぐらしもあへず。風流の初やおくの田植うた。無下にこえんもさすがにと語れば、脇・第三とつゞけて、三巻となしぬ。", "kakikudashi": "とかくして越え行くままに、あぶくま川を渡る。左に会津根高く、右に岩城・相馬・三春の庄、常陸・下野の地を境ひて、山連なる。かげ沼といふ所を行くに、けふは空曇りて物影映らず。すか川の駅に等躬といふものを尋ねて、四五日とどめらる。まず「白河の関いかに越えつるや」と問ふ。「長途の苦しみ、身心疲れ、かつは風景に魂奪はれ、懐旧に腸を断ちて、はかばかしう思ひめぐらしもあへず。風流の初やおくの田植うた。無下に越えんもさすがに」と語れば、脇・第三と続けて、三巻となしぬ。", "translation": "あれこれと感慨に浸りながら白河の関を越えて行くうちに、やがてあぶくま川を渡った。左手には会津根が高くそびえ、右手には岩城や相馬、三春の庄が続き、常陸や下野の国境を隔てて山々が連なっている。かげ沼という名所を通ったが、今日はあいにく空が曇っていて水面に物の影も映らない。すか川の宿駅に等躬という俳人を訪ねて、四、五日のあいだ引き留められて滞在した。等躬はまず何より「白河の関をどのように詠んで越えられたか」と尋ねた。「長い旅路の苦しみに心も体も疲れ果て、また一つには素晴らしい風景に魂を奪われ、古人を偲ぶ思いに胸が張り裂けるようで、ろくに句を練り上げる余裕もありませんでした。みちのくに入って最初に触れた風流の初めは、この奥州に響く鄙びた田植うたの調べであることよ。ただ素通りして関を越えるのもさすがに心残りでしたので、このように詠みました」と語ると、等躬が脇句、曾良が第三と詠み継いで、ついに歌仙三巻を巻き上げた。", "persons": "相楽等躬", "places": "阿武隈川,会津根,岩城,相馬,三春,常陸国圏,日光・下野路圏,影沼,須賀川,白河関", "era_year": "元禄二年卯月廿二日〜廿八日", "source_book": "", "keywords": "風流の初", "raw_tagged": "とかくして越行まゝに、{{place:阿武隈川|あぶくま川}}を渡る。左に{{place:会津根|会津根}}高く、右に{{place:岩城|岩城}}・{{place:相馬|相馬}}・{{place:三春|三春の庄}}、{{place:常陸国圏|常陸}}・{{place:日光・下野路圏|下野}}の地をさかひて、山つらなる。{{place:影沼|かげ沼}}と云所を行に、けふは空曇て物影うつらず。{{place:須賀川|すか川の駅}}に{{person:相楽等躬|等躬}}といふものを尋て、四五日とゞめらる。先「{{place:白河関|白河の関}}いかにこえつるや」と問。「長途のくるしみ、身心つかれ、且は風景に魂うばゝれ、懐旧に腸を断て、はかばかしう思ひめぐらしもあへず。{{special:風流の初|風流の初}}やおくの田植うた。無下にこえんもさすがにと語れば、脇・第三とつゞけて、三巻となしぬ。", "kakikudashi_tagged": "とかくして越え行くままに、{{place:阿武隈川|あぶくま川}}を渡る。左に{{place:会津根|会津根}}高く、右に{{place:岩城|岩城}}・{{place:相馬|相馬}}・{{place:三春|三春の庄}}、{{place:常陸国圏|常陸}}・{{place:日光・下野路圏|下野}}の地を境ひて、山連なる。{{place:影沼|かげ沼}}といふ所を行くに、けふは空曇りて物影映らず。{{place:須賀川|すか川の駅}}に{{person:相楽等躬|等躬}}といふものを尋ねて、四五日とどめらる。まず「{{place:白河関|白河の関}}いかに越えつるや」と問ふ。「長途の苦しみ、身心疲れ、かつは風景に魂奪はれ、懐旧に腸を断ちて、はかばかしう思ひめぐらしもあへず。{{special:風流の初|風流の初}}やおくの田植うた。無下に越えんもさすがに」と語れば、脇・第三と続けて、三巻となしぬ。", "translation_tagged": "あれこれと感慨に浸りながら白河の関を越えて行くうちに、やがて{{place:阿武隈川|あぶくま川}}を渡った。左手には{{place:会津根|会津根}}が高くそびえ、右手には{{place:岩城|岩城}}や{{place:相馬|相馬}}、{{place:三春|三春の庄}}が続き、{{place:常陸国圏|常陸}}や{{place:日光・下野路圏|下野}}の国境を隔てて山々が連なっている。{{place:影沼|かげ沼}}という名所を通ったが、今日はあいにく空が曇っていて水面に物の影も映らない。{{place:須賀川|すか川}}の宿駅に{{person:相楽等躬|等躬}}という俳人を訪ねて、四、五日のあいだ引き留められて滞在した。等躬はまず何より「{{place:白河関|白河の関}}をどのように詠んで越えられたか」と尋ねた。「長い旅路の苦しみに心も体も疲れ果て、また一つには素晴らしい風景に魂を奪われ、古人を偲ぶ思いに胸が張り裂けるようで、ろくに句を練り上げる余裕もありませんでした。みちのくに入って最初に触れた{{special:風流の初|風流の初}}めは、この奥州に響く鄙びた田植うたの調べであることよ。ただ素通りして関を越えるのもさすがに心残りでしたので、このように詠みました」と語ると、等躬が脇句、曾良が第三と詠み継いで、ついに歌仙三巻を巻き上げた。"}, {"id": "v1_p12_2", "volume": 1, "book": "おくのほそ道", "section_title": "十二、須賀川", "para_index": 12, "type": "発句・注", "verse": {"genre": "haiku", "l1": "世の人の", "l2": "見付ぬ花や", "l3": "軒の栗", "author": "松尾芭蕉", "bg_theme": "sukagawa_nokinokuri", "bg_path": "shortliterature/bg_sukagawa_nokinokuri.jpg", "bg_title": "🌰 須賀川・可伸庵の軒の栗（第13句専用描き下ろし背景）"}, "raw_text": "此宿の傍に、大きな栗の木陰をたのみて、世をいとふ僧有。橡ひろふ太山もかくやと間 に覚られて、ものに書付侍る。其詞、「栗といふ文字は西の木と書て、西方浄土に便ありと、行基菩薩の一生杖にも柱にも此木を用給ふとかや」。世の人の見付ぬ花や軒の栗。", "kakikudashi": "この宿の傍らに、大きな栗の木陰をたのみて、世をいとふ僧あり。橡ひろふ太山もかくやと閑に覚へられて、ものに書き付け侍る。その詞、「栗といふ文字は西の木と書きて、西方浄土に便りありと、行基菩薩の一生杖にも柱にもこの木を用ゐ給ふとかや」。世の人の見付けぬ花や軒の栗。", "translation": "この須賀川の宿駅の傍らに、大きな栗の木陰を頼りとして、世俗を避けて暮らす世をいとふ僧がいた。西行法師が詠んだ橡ひろふ太山の静けさもこのようであろうかと心静かに感じられて、懐紙に次のように書き付けた。その詞書には、「栗という文字は西の木と書いて、阿弥陀仏の西方浄土に縁があるとされ、行基菩薩も生涯の杖にも建物の柱にもこの木をお使いになったとかいうことである」。世間の人々が気づきもしないほどひっそりと、しかし清らかに咲いている花よ、この隠棲の庵の軒端を覆う栗の花は。", "persons": "可伸,行基菩薩", "places": "", "era_year": "元禄二年卯月", "source_book": "", "keywords": "橡ひろふ太山,西方浄土", "raw_tagged": "此宿の傍に、大きな栗の木陰をたのみて、{{person:可伸|世をいとふ僧}}有。{{special:橡ひろふ太山|橡ひろふ太山}}もかくやと間 に覚られて、ものに書付侍る。其詞、「栗といふ文字は西の木と書て、{{special:西方浄土|西方浄土}}に便ありと、{{person:行基菩薩|行基菩薩}}の一生杖にも柱にも此木を用給ふとかや」。世の人の見付ぬ花や軒の栗。", "kakikudashi_tagged": "この宿の傍らに、大きな栗の木陰をたのみて、{{person:可伸|世をいとふ僧}}あり。{{special:橡ひろふ太山|橡ひろふ太山}}もかくやと閑に覚へられて、ものに書き付け侍る。その詞、「栗といふ文字は西の木と書きて、{{special:西方浄土|西方浄土}}に便りありと、{{person:行基菩薩|行基菩薩}}の一生杖にも柱にもこの木を用ゐ給ふとかや」。世の人の見付けぬ花や軒の栗。", "translation_tagged": "この須賀川の宿駅の傍らに、大きな栗の木陰を頼りとして、世俗を避けて暮らす{{person:可伸|世をいとふ僧}}がいた。西行法師が詠んだ{{special:橡ひろふ太山|橡ひろふ太山}}の静けさもこのようであろうかと心静かに感じられて、懐紙に次のように書き付けた。その詞書には、「栗という文字は西の木と書いて、阿弥陀仏の{{special:西方浄土|西方浄土}}に縁があるとされ、{{person:行基菩薩|行基菩薩}}も生涯の杖にも建物の柱にもこの木をお使いになったとかいうことである」。世間の人々が気づきもしないほどひっそりと、しかし清らかに咲いている花よ、この隠棲の庵の軒端を覆う栗の花は。"}, {"id": "v1_p13_1", "volume": 1, "book": "おくのほそ道", "section_title": "十三、あさか山・しのぶの里", "para_index": 13, "type": "本文", "verse": null, "raw_text": "等躬が宅を出て、五里計、檜皮の宿を離れて、あさか山有。路より近し。此あたり沼多し。かつみ刈比もやゝ近うなれば、「いづれの草を花かつみとは云ぞ」と、人々に尋侍れども、更知人なし。沼を尋、人にとひ、「かつみかつみ」と尋ありきて、日は山の端にかゝりぬ。二本松より右にきれて、黒塚の岩屋一見し、福嶋に宿る。", "kakikudashi": "等躬が宅を出て、五里ばかり、檜皮の宿を離れて、あさか山あり。路より近し。このあたり沼多し。かつみ刈る頃もやや近うなれば、「いづれの草を花かつみとは言ふぞ」と、人々に尋ね侍れども、さらに知る人なし。沼を尋ね、人に問ひ、「かつみかつみ」と尋ね歩きて、日は山の端にかかりぬ。二本松より右にきれて、黒塚の岩屋一見し、福嶋に宿る。", "translation": "須賀川の等躬の屋敷を出て五里ほど進み、檜皮の宿を抜けたところに、歌枕のあさか山がある。街道からすぐ近くの場所である。このあたりには沼が多い。古歌に詠まれたかつみを刈る時節もだんだん近づいていたので、「どの草を花かつみと言うのですか」と土地の人々に尋ねてみたけれども、誰一人として知る人はいない。沼を巡り、道行く人に問いかけ、「かつみ、かつみ」と探し歩いているうちに、いつしか太陽は西の山の端に傾いてしまった。二本松から街道を右へ折れて、安達ヶ原の鬼婆が棲んだという黒塚の岩屋を一見し、その夜は福嶋に宿を取った。", "persons": "相楽等躬", "places": "檜皮の宿,安積山,二本松,黒塚,福島", "era_year": "元禄二年五月朔日", "source_book": "", "keywords": "花かつみ", "raw_tagged": "{{person:相楽等躬|等躬}}が宅を出て、五里計、{{place:檜皮の宿|檜皮の宿}}を離れて、{{place:安積山|あさか山}}有。路より近し。此あたり沼多し。{{special:花かつみ|かつみ}}刈比もやゝ近うなれば、「いづれの草を{{special:花かつみ|花かつみ}}とは云ぞ」と、人々に尋侍れども、更知人なし。沼を尋、人にとひ、「{{special:花かつみ|かつみ}}{{special:花かつみ|かつみ}}」と尋ありきて、日は山の端にかゝりぬ。{{place:二本松|二本松}}より右にきれて、{{place:黒塚|黒塚の岩屋}}一見し、{{place:福島|福嶋}}に宿る。", "kakikudashi_tagged": "{{person:相楽等躬|等躬}}が宅を出て、五里ばかり、{{place:檜皮の宿|檜皮の宿}}を離れて、{{place:安積山|あさか山}}あり。路より近し。このあたり沼多し。{{special:花かつみ|かつみ}}刈る頃もやや近うなれば、「いづれの草を{{special:花かつみ|花かつみ}}とは言ふぞ」と、人々に尋ね侍れども、さらに知る人なし。沼を尋ね、人に問ひ、「{{special:花かつみ|かつみ}}{{special:花かつみ|かつみ}}」と尋ね歩きて、日は山の端にかかりぬ。{{place:二本松|二本松}}より右にきれて、{{place:黒塚|黒塚の岩屋}}一見し、{{place:福島|福嶋}}に宿る。", "translation_tagged": "須賀川の{{person:相楽等躬|等躬}}の屋敷を出て五里ほど進み、{{place:檜皮の宿|檜皮の宿}}を抜けたところに、歌枕の{{place:安積山|あさか山}}がある。街道からすぐ近くの場所である。このあたりには沼が多い。古歌に詠まれた{{special:花かつみ|かつみ}}を刈る時節もだんだん近づいていたので、「どの草を{{special:花かつみ|花かつみ}}と言うのですか」と土地の人々に尋ねてみたけれども、誰一人として知る人はいない。沼を巡り、道行く人に問いかけ、「{{special:花かつみ|かつみ}}、{{special:花かつみ|かつみ}}」と探し歩いているうちに、いつしか太陽は西の山の端に傾いてしまった。{{place:二本松|二本松}}から街道を右へ折れて、安達ヶ原の鬼婆が棲んだという{{place:黒塚|黒塚の岩屋}}を一見し、その夜は{{place:福島|福嶋}}に宿を取った。"}, {"id": "v1_p13_2", "volume": 1, "book": "おくのほそ道", "section_title": "十三、あさか山・しのぶの里", "para_index": 13, "type": "発句・注", "verse": {"genre": "haiku", "l1": "早苗とる", "l2": "手もとや昔", "l3": "しのぶ摺", "author": "松尾芭蕉", "bg_theme": "shinobu_mojizuri", "bg_path": "shortliterature/bg_shinobu_mojizuri.jpg", "bg_title": "🌿 しのぶの里・早苗と文字摺石（第14句専用描き下ろし背景）"}, "raw_text": "あくれば、しのぶもぢ摺の石を尋て、忍ぶのさとに行。遥山陰の小里に、石半土に埋てあり。里の童部の来りて教ける、「昔は此山の上に侍しを、往来の人の麦草をあらして此石を試侍をにくみて、此谷につき落せば、石の面下ざまにふしたり」と云。さもあるべき事にや。早苗とる手もとや昔しのぶ摺。", "kakikudashi": "明くれば、しのぶもぢ摺の石を尋ねて、忍ぶのさとに行く。遥か山陰の小里に、石半ば土に埋もれてあり。里の童部の来たりて教へける、「昔はこの山の上に侍りしを、往来の人の麦草を荒らしてこの石を試み侍るを憎みて、この谷に突き落とせば、石の面下ざまに伏したり」と言ふ。さもあるべき事にや。早苗とる手もとや昔しのぶ摺。", "translation": "翌朝、夜が明けると、名高いしのぶもぢ摺の石を訪ねて忍ぶのさとへと向かった。はるか山陰の小さな村里に、その石は半分ほど土に埋もれた姿で残っていた。村里の子どもがやって来て教えてくれるには、「昔はこの山の上にございましたのを、通りすがりの旅人が畑の麦を踏み荒らしてこの石に草の葉を摺り試すのを村人が憎んで、この谷へ突き落としたため、石の表面が下向きに伏せてしまったのです」と言う。いかにもありそうな話である。早乙女たちが鮮やかな手つきで早苗を取るその手もとを見ていると、いにしえにこの里で美しいしのぶもぢ摺を摺り染めたという昔の人の手つきが懐かしく偲ばれることよ。", "persons": "", "places": "しのぶの里", "era_year": "元禄二年五月二日", "source_book": "", "keywords": "しのぶもぢ摺", "raw_tagged": "あくれば、{{place:しのぶの里|しのぶもぢ摺の石}}を尋て、{{place:しのぶの里|忍ぶのさと}}に行。遥山陰の小里に、石半土に埋てあり。里の童部の来りて教ける、「昔は此山の上に侍しを、往来の人の麦草をあらして此石を試侍をにくみて、此谷につき落せば、石の面下ざまにふしたり」と云。さもあるべき事にや。早苗とる手もとや昔{{special:しのぶもぢ摺|しのぶ摺}}。", "kakikudashi_tagged": "明くれば、{{place:しのぶの里|しのぶもぢ摺の石}}を尋ねて、{{place:しのぶの里|忍ぶのさと}}に行く。遥か山陰の小里に、石半ば土に埋もれてあり。里の童部の来たりて教へける、「昔はこの山の上に侍りしを、往来の人の麦草を荒らしてこの石を試み侍るを憎みて、この谷に突き落とせば、石の面下ざまに伏したり」と言ふ。さもあるべき事にや。早苗とる手もとや昔{{special:しのぶもぢ摺|しのぶ摺}}。", "translation_tagged": "翌朝、夜が明けると、名高い{{place:しのぶの里|しのぶもぢ摺の石}}を訪ねて{{place:しのぶの里|忍ぶのさと}}へと向かった。はるか山陰の小さな村里に、その石は半分ほど土に埋もれた姿で残っていた。村里の子どもがやって来て教えてくれるには、「昔はこの山の上にございましたのを、通りすがりの旅人が畑の麦を踏み荒らしてこの石に草の葉を摺り試すのを村人が憎んで、この谷へ突き落としたため、石の表面が下向きに伏せてしまったのです」と言う。いかにもありそうな話である。早乙女たちが鮮やかな手つきで早苗を取るその手もとを見ていると、いにしえにこの里で美しい{{special:しのぶもぢ摺|しのぶもぢ摺}}を摺り染めたという昔の人の手つきが懐かしく偲ばれることよ。"}, {"id": "v1_p14_1", "volume": 1, "book": "おくのほそ道", "section_title": "十四、佐藤庄司が旧跡・飯坂", "para_index": 14, "type": "本文", "verse": null, "raw_text": "月の輪のわたしを越て、瀬の上と云宿に出づ。佐藤庄司が旧跡は、左の山際一里半計に有。飯塚の里鯖野と聞て、尋々行に、丸山と云に尋あたる。是庄司が旧館也。ふもとに大手の跡など人の教ゆるにまかせて、泪を落し、又かたはらの古寺に一家の石碑を残す。中にも二人の嫁がしるし、先哀也。女なれどもかいがいしき名の世に聞えつる物かなと、袂をぬらしぬ。堕涙の碑も遠きにあらず。寺に入て茶を乞へば、爰に義経の太刀・弁慶が笈をとゞめて什物とす。御霊・御剣、誠に千歳の記念とはなれり。", "kakikudashi": "月の輪の渡しを越えて、瀬の上といふ宿に出づ。佐藤庄司が旧跡は、左の山際一里半ばかりにあり。飯塚の里鯖野と聞いて、尋ね尋ね行くに、丸山といふに尋ねあたる。これ庄司が旧館なり。ふもとに大手の跡など人の教ふるにまかせて、泪を落とし、また傍らの古寺に一家の石碑を残す。中にも二人の嫁がしるし、まず哀れなり。女なれどもかいがいしき名の世に聞こえつるものかなと、袂をぬらしぬ。堕涙の碑も遠きにあらず。寺に入りて茶を乞へば、ここに義経の太刀・弁慶が笈をとどめて什物とす。御霊・御剣、誠に千歳の記念とはなれり。", "translation": "阿武隈川の月の輪の渡しを舟で越えて、瀬の上という宿場に出た。佐藤庄司が旧跡は、そこから左手の山際へ一里半ほど入ったところにある。飯塚の里鯖野にあると聞いて、道行く人に尋ね尋ねて行くうちに、丸山という城跡にたどり着いた。これこそ庄司が旧館の跡である。山のふもとに残る大手門の跡などを土地の人が教えてくれるままに巡って涙を落とし、また傍らの古寺である医王寺には佐藤一家の石碑が残されている。その中でも継信と忠信の二人の嫁の墓碑が、まず何よりあわれで胸を打つ。老母を慰めるため夫の甲冑を身につけて戦死の様を演じた女性ながら、なんと健気で勇ましい評判が世に伝わったものよと、思わず涙で袂を濡らした。見る者すべてが涙したという中国の堕涙の碑も、決して遠い異国の話ではない。寺に入って茶を請うと、ここには義経の太刀や弁慶の笈が寺宝の什物として大切に納められていた。笈の御霊と太刀の御剣は、まことに千年ののちまで残る尊い形見となっている。", "persons": "源義経,武蔵坊弁慶", "places": "月の輪の渡し,瀬の上,丸山,飯塚", "era_year": "元禄二年", "source_book": "", "keywords": "庄司,堕涙の碑", "raw_tagged": "{{place:月の輪の渡し|月の輪のわたし}}を越て、{{place:瀬の上|瀬の上}}と云宿に出づ。{{place:丸山|佐藤庄司が旧跡}}は、左の山際一里半計に有。{{place:飯塚|飯塚の里鯖野}}と聞て、尋々行に、{{place:丸山|丸山}}と云に尋あたる。是{{office:庄司|庄司}}が旧館也。ふもとに大手の跡など人の教ゆるにまかせて、泪を落し、又かたはらの古寺に一家の石碑を残す。中にも二人の嫁がしるし、先哀也。女なれどもかいがいしき名の世に聞えつる物かなと、袂をぬらしぬ。{{special:堕涙の碑|堕涙の碑}}も遠きにあらず。寺に入て茶を乞へば、爰に{{person:源義経|義経}}の太刀・{{person:武蔵坊弁慶|弁慶}}が笈をとゞめて什物とす。御霊・御剣、誠に千歳の記念とはなれり。", "kakikudashi_tagged": "{{place:月の輪の渡し|月の輪の渡し}}を越えて、{{place:瀬の上|瀬の上}}といふ宿に出づ。{{place:丸山|佐藤庄司が旧跡}}は、左の山際一里半ばかりにあり。{{place:飯塚|飯塚の里鯖野}}と聞いて、尋ね尋ね行くに、{{place:丸山|丸山}}といふに尋ねあたる。これ{{office:庄司|庄司}}が旧館なり。ふもとに大手の跡など人の教ふるにまかせて、泪を落とし、また傍らの古寺に一家の石碑を残す。中にも二人の嫁がしるし、まず哀れなり。女なれどもかいがいしき名の世に聞こえつるものかなと、袂をぬらしぬ。{{special:堕涙の碑|堕涙の碑}}も遠きにあらず。寺に入りて茶を乞へば、ここに{{person:源義経|義経}}の太刀・{{person:武蔵坊弁慶|弁慶}}が笈をとどめて什物とす。御霊・御剣、誠に千歳の記念とはなれり。", "translation_tagged": "阿武隈川の{{place:月の輪の渡し|月の輪の渡し}}を舟で越えて、{{place:瀬の上|瀬の上}}という宿場に出た。{{place:丸山|佐藤庄司が旧跡}}は、そこから左手の山際へ一里半ほど入ったところにある。{{place:飯塚|飯塚の里鯖野}}にあると聞いて、道行く人に尋ね尋ねて行くうちに、{{place:丸山|丸山}}という城跡にたどり着いた。これこそ{{office:庄司|庄司}}が旧館の跡である。山のふもとに残る大手門の跡などを土地の人が教えてくれるままに巡って涙を落とし、また傍らの古寺である医王寺には佐藤一家の石碑が残されている。その中でも継信と忠信の二人の嫁の墓碑が、まず何よりあわれで胸を打つ。老母を慰めるため夫の甲冑を身につけて戦死の様を演じた女性ながら、なんと健気で勇ましい評判が世に伝わったものよと、思わず涙で袂を濡らした。見る者すべてが涙したという中国の{{special:堕涙の碑|堕涙の碑}}も、決して遠い異国の話ではない。寺に入って茶を請うと、ここには{{person:源義経|義経}}の太刀や{{person:武蔵坊弁慶|弁慶}}の笈が寺宝の什物として大切に納められていた。笈の御霊と太刀の御剣は、まことに千年ののちまで残る尊い形見となっている。"}, {"id": "v1_p14_2", "volume": 1, "book": "おくのほそ道", "section_title": "十四、佐藤庄司が旧跡・飯坂", "para_index": 14, "type": "発句・注", "verse": {"genre": "haiku", "l1": "笈も太刀も", "l2": "五月にかざれ", "l3": "紙幟", "author": "松尾芭蕉", "bg_theme": "iizaka_kaminobori", "bg_path": "shortliterature/bg_iizaka_kaminobori.jpg", "bg_title": "🎏 医王寺・義経の太刀と弁慶の笈・紙幟（第15句専用描き下ろし背景）"}, "raw_text": "笈も太刀も五月にかざれ紙幟。五月朔日の事なれば也。", "kakikudashi": "笈も太刀も五月にかざれ紙幟。五月朔日の事なればなり。", "translation": "弁慶の笈も義経の太刀も、端午の節句を迎えるこの五月の空に高く掲げて飾ってほしい、勇ましい紙幟とともに。ちょうど五月朔日のことだったので、このように詠んだのである。", "persons": "", "places": "", "era_year": "元禄二年", "source_book": "", "keywords": "紙幟", "raw_tagged": "笈も太刀も五月にかざれ{{special:紙幟|紙幟}}。五月朔日の事なれば也。", "kakikudashi_tagged": "笈も太刀も五月にかざれ{{special:紙幟|紙幟}}。五月朔日の事なればなり。", "translation_tagged": "弁慶の笈も義経の太刀も、端午の節句を迎えるこの五月の空に高く掲げて飾ってほしい、勇ましい{{special:紙幟|紙幟}}とともに。ちょうど五月朔日のことだったので、このように詠んだのである。"}, {"id": "v1_p14_3", "volume": 1, "book": "おくのほそ道", "section_title": "十四、佐藤庄司が旧跡・飯坂", "para_index": 14, "type": "本文", "verse": null, "raw_text": "其夜飯塚にとまる。温泉あれば、湯に入て宿をかるに、土座に筵を敷て、あやしき貧家也。灯もなければ、ゐろりの火かげに寝所をまうけて臥す。夜に入て、雷鳴、雨しきりに降て、臥る上より漏、蚤・蚊にせゝられて眠らず。持病さへおこりて、消入計になん。短夜の空もやうやう明れば、又旅立ぬ。猶夜の余波心すゝまず、馬かりて桑折の駅に出る。遥なる行末をかゝえて、斯る病覚束なしといへど、羈旅辺土の行脚、捨身無常の観念、道路に死なん、是天の命なりと、気力聊とり直し、路縦横に踏で、伊達の大木戸をこす。", "kakikudashi": "その夜飯塚に泊まる。温泉あれば、湯に入りて宿を借るに、土座に筵を敷きて、あやしき貧家なり。灯もなければ、囲炉裏の火影に寝所をまうけて臥す。夜に入りて、雷鳴り、雨しきりに降りて、臥せる上より漏り、蚤・蚊にせせられて眠らず。持病さへ起こりて、消え入るばかりになん。短夜の空もやうやう明くれば、また旅立ちぬ。なほ夜の余波心進まず、馬借りて桑折の駅に出づる。遥かなる行く末を抱へて、かかる病おぼつかなしといへど、羈旅辺土の行脚、捨身無常の観念、道路に死なん、これ天の命なりと、気力いささか取り直し、路縦横に踏んで、伊達の大木戸を越す。", "translation": "その夜は飯塚の里に宿を取った。ここには温泉があったので湯に入ってから宿を借りたところ、土間に直接筵を敷いただけで、粗末な貧しい家であった。灯火もないので、囲炉裏の火の明かりを頼りに寝床をしつらえて横になった。夜になると雷が激しく鳴り、雨がしきりに降ってきて寝ている頭の上から雨漏りがし、さらに蚤や蚊に刺されて一睡もできない。そのうえ持病の腹痛まで起こり、今にも息が絶えそうなほどであった。夏の短夜の空もようやく白み始めたので、再び宿を出て旅立った。それでもなお昨夜の苦しみの余波で気分がすぐれず、馬を借りて桑折の駅へと出た。はるか遠い行く末の旅路を抱えてこのような病に襲われるのは心細い限りであるが、そもそも辺境の地を巡る羈旅辺土の行脚とは捨身無常の観念に立つものであり、もし道半ばで倒れて死ぬとしてもそれこそ天の命であると気力を少し取り直し、道を縦横に力強く踏みしめて伊達の大木戸を越えた。", "persons": "", "places": "飯塚,桑折,伊達の大木戸", "era_year": "元禄二年", "source_book": "", "keywords": "羈旅辺土,捨身無常", "raw_tagged": "其夜{{place:飯塚|飯塚}}にとまる。温泉あれば、湯に入て宿をかるに、土座に筵を敷て、あやしき貧家也。灯もなければ、ゐろりの火かげに寝所をまうけて臥す。夜に入て、雷鳴、雨しきりに降て、臥る上より漏、蚤・蚊にせゝられて眠らず。持病さへおこりて、消入計になん。短夜の空もやうやう明れば、又旅立ぬ。猶夜の余波心すゝまず、馬かりて{{place:桑折|桑折の駅}}に出る。遥なる行末をかゝえて、斯る病覚束なしといへど、{{special:羈旅辺土|羈旅辺土}}の行脚、{{special:捨身無常|捨身無常}}の観念、道路に死なん、是天の命なりと、気力聊とり直し、路縦横に踏で、{{place:伊達の大木戸|伊達の大木戸}}をこす。", "kakikudashi_tagged": "その夜{{place:飯塚|飯塚}}に泊まる。温泉あれば、湯に入りて宿を借るに、土座に筵を敷きて、あやしき貧家なり。灯もなければ、囲炉裏の火影に寝所をまうけて臥す。夜に入りて、雷鳴り、雨しきりに降りて、臥せる上より漏り、蚤・蚊にせせられて眠らず。持病さへ起こりて、消え入るばかりになん。短夜の空もやうやう明くれば、また旅立ちぬ。なほ夜の余波心進まず、馬借りて{{place:桑折|桑折の駅}}に出づる。遥かなる行く末を抱へて、かかる病おぼつかなしといへど、{{special:羈旅辺土|羈旅辺土}}の行脚、{{special:捨身無常|捨身無常}}の観念、道路に死なん、これ天の命なりと、気力いささか取り直し、路縦横に踏んで、{{place:伊達の大木戸|伊達の大木戸}}を越す。", "translation_tagged": "その夜は{{place:飯塚|飯塚}}の里に宿を取った。ここには温泉があったので湯に入ってから宿を借りたところ、土間に直接筵を敷いただけで、粗末な貧しい家であった。灯火もないので、囲炉裏の火の明かりを頼りに寝床をしつらえて横になった。夜になると雷が激しく鳴り、雨がしきりに降ってきて寝ている頭の上から雨漏りがし、さらに蚤や蚊に刺されて一睡もできない。そのうえ持病の腹痛まで起こり、今にも息が絶えそうなほどであった。夏の短夜の空もようやく白み始めたので、再び宿を出て旅立った。それでもなお昨夜の苦しみの余波で気分がすぐれず、馬を借りて{{place:桑折|桑折の駅}}へと出た。はるか遠い行く末の旅路を抱えてこのような病に襲われるのは心細い限りであるが、そもそも辺境の地を巡る{{special:羈旅辺土|羈旅辺土}}の行脚とは{{special:捨身無常|捨身無常}}の観念に立つものであり、もし道半ばで倒れて死ぬとしてもそれこそ天の命であると気力を少し取り直し、道を縦横に力強く踏みしめて{{place:伊達の大木戸|伊達の大木戸}}を越えた。"}, {"id": "v1_p15_1", "volume": 1, "book": "おくのほそ道", "section_title": "十五、笠島・武隈の松", "para_index": 15, "type": "本文", "verse": {"genre": "haiku", "l1": "笠島は", "l2": "いづこさ月の", "l3": "ぬかり道", "author": "松尾芭蕉", "bg_theme": "kasashima_samidare", "bg_path": "shortliterature/bg_kasashima_samidare.jpg", "bg_title": "🌧️ 笠島・五月雨の菅笠とぬかり道（第16句専用描き下ろし背景）"}, "raw_text": "鐙摺・白石の城を過、笠島の郡に入れば、藤中将実方の塚はいづくのほどならんと人にとへば、「是より遥右に見ゆる山際の里を、みのわ・笠島と云、道祖神の社、かた見の薄今にあり」と教ゆ。此比の五月雨に道いとあしく、身つかれ侍れば、よそながら眺やりて過るに、蓑輪・笠嶋も五月雨の折にふれつゝ。笠島はいづこさ月のぬかり道。", "kakikudashi": "鐙摺・白石の城を過ぎ、笠島の郡に入れば、藤中将実方の塚はいづくのほどならんと人に問へば、「これより遥か右に見ゆる山際の里を、みのわ・笠島といひ、道祖神の社、かた見の薄今にあり」と教ふ。この頃の五月雨に道いとあしく、身疲れ侍れば、よそながら眺めやりて過ぐるに、蓑輪・笠嶋も五月雨の折にふれつつ。笠島はいづこさ月のぬかり道。", "translation": "鐙摺の険しい岩場や白石の城を過ぎて笠島の郡に入り、藤中将実方の塚はどのあたりかと道行く人に尋ねると、「ここからはるか右手に見える山際の村里をみのわ・笠島といい、実方が落馬した道祖神の社や西行が詠んだかた見の薄が今も残っています」と教えてくれた。ここ数日の五月雨で道がひどくぬかるみ、体もすっかり疲れ果てていたので、立ち寄らずに遠くから眺めやって通り過ぎたが、蓑輪・笠嶋という雨具ゆかりの地名もこの五月雨の季節にいかにもふさわしく思われた。藤原実方の塚があるという笠島はいったいどのあたりであろうか、五月雨に降り込められたこの泥深いぬかり道をたどりながら遠く思いやることよ。", "persons": "藤原実方", "places": "鐙摺,白石,笠島", "era_year": "元禄二年", "source_book": "", "keywords": "藤中将,道祖神,かた見の薄", "raw_tagged": "{{place:鐙摺|鐙摺}}・{{place:白石|白石の城}}を過、{{place:笠島|笠島の郡}}に入れば、{{office:藤中将|藤中将}}{{person:藤原実方|実方}}の塚はいづくのほどならんと人にとへば、「是より遥右に見ゆる山際の里を、{{place:笠島|みのわ・笠島}}と云、{{special:道祖神|道祖神}}の社、{{special:かた見の薄|かた見の薄}}今にあり」と教ゆ。此比の五月雨に道いとあしく、身つかれ侍れば、よそながら眺やりて過るに、{{place:笠島|蓑輪・笠嶋}}も五月雨の折にふれつゝ。{{place:笠島|笠島}}はいづこさ月のぬかり道。", "kakikudashi_tagged": "{{place:鐙摺|鐙摺}}・{{place:白石|白石の城}}を過ぎ、{{place:笠島|笠島の郡}}に入れば、{{office:藤中将|藤中将}}{{person:藤原実方|実方}}の塚はいづくのほどならんと人に問へば、「これより遥か右に見ゆる山際の里を、{{place:笠島|みのわ・笠島}}といひ、{{special:道祖神|道祖神}}の社、{{special:かた見の薄|かた見の薄}}今にあり」と教ふ。この頃の五月雨に道いとあしく、身疲れ侍れば、よそながら眺めやりて過ぐるに、{{place:笠島|蓑輪・笠嶋}}も五月雨の折にふれつつ。{{place:笠島|笠島}}はいづこさ月のぬかり道。", "translation_tagged": "{{place:鐙摺|鐙摺}}の険しい岩場や{{place:白石|白石の城}}を過ぎて{{place:笠島|笠島の郡}}に入り、{{office:藤中将|藤中将}}{{person:藤原実方|実方}}の塚はどのあたりかと道行く人に尋ねると、「ここからはるか右手に見える山際の村里を{{place:笠島|みのわ・笠島}}といい、{{person:藤原実方|実方}}が落馬した{{special:道祖神|道祖神}}の社や西行が詠んだ{{special:かた見の薄|かた見の薄}}が今も残っています」と教えてくれた。ここ数日の五月雨で道がひどくぬかるみ、体もすっかり疲れ果てていたので、立ち寄らずに遠くから眺めやって通り過ぎたが、{{place:笠島|蓑輪・笠嶋}}という雨具ゆかりの地名もこの五月雨の季節にいかにもふさわしく思われた。藤原実方の塚があるという{{place:笠島|笠島}}はいったいどのあたりであろうか、五月雨に降り込められたこの泥深いぬかり道をたどりながら遠く思いやることよ。"}, {"id": "v1_p15_2", "volume": 1, "book": "おくのほそ道", "section_title": "十五、笠島・武隈の松", "para_index": 15, "type": "発句・注", "verse": {"genre": "haiku", "l1": "桜より", "l2": "松は二木を", "l3": "三月越し", "author": "松尾芭蕉", "bg_theme": "takekuma_futaki", "bg_path": "shortliterature/bg_takekuma_futaki.jpg", "bg_title": "🌲 武隈の松・二木の松と遅桜（第17句専用描き下ろし背景）"}, "raw_text": "岩沼に宿る。武隈の松にこそめ覚る心地はすれ。根は土際より二木にわかれて、昔の姿うしなはずとしらる。先能因法師思ひ出。往昔むつのかみにて下りし人、此木を伐て名取川の橋杭にせられたる事などあればにや、「松は此たび跡もなし」とは詠たり。代々、あるは伐、あるひは植継などせしと聞くに、今将千歳のかたちとゝのほひて、めでたき松のけしきになん侍し。「武隈の松見せ申せ遅桜」と、挙白と云ものゝ餞別したりければ、桜より松は二木を三月越し。", "kakikudashi": "岩沼に宿る。武隈の松にこそ目覚むる心地はすれ。根は土際より二木に分かれて、昔の姿失はずと知らる。まず能因法師思ひ出づ。往昔陸奥の守にて下りし人、この木を伐りて名取川の橋杭にせられたる事などあればにや、「松はこのたび跡もなし」とは詠みたり。代々、あるは伐り、あるひは植ゑ継ぎなどせしと聞くに、今また千歳のかたち整ひて、めでたき松の気色になん侍りし。「武隈の松見せ申せ遅桜」と、挙白といふものの餞別したりければ、桜より松は二木を三月越し。", "translation": "その夜は岩沼に宿を取った。ここにある歌枕の武隈の松を見てこそ、まさに目が覚めるような感動を覚えた。その幹は根元の土際から二木に分かれており、古歌に詠まれた昔の姿を今も失っていないことがよくわかる。まず何より能因法師のことが思い出された。むかし陸奥の守としてこの地に下向した人が、この木を伐って名取川の橋杭にしてしまったことがあったからであろうか、能因法師は二度目に訪れた際に「松はこのたび跡もなし」と嘆いて詠んだのである。その後も代々にわたり、あるいは伐られ、あるいは植え継がれたりしたと聞くが、今また千年を経たかのような見事な枝ぶりが整って、まことにめでたい松の風情であった。江戸を発つ際に「武隈の松見せ申せ遅桜」と門人の挙白という者が餞別の句を贈ってくれたので、桜の季節に江戸を出てから三月越しで、遅桜よりもずっと心待ちにしていたこの二木の松についに対面できたことよと詠んだ。", "persons": "挙白", "places": "岩沼,武隈の松,名取川", "era_year": "元禄二年", "source_book": "", "keywords": "陸奥の守", "raw_tagged": "{{place:岩沼|岩沼}}に宿る。{{place:武隈の松|武隈の松}}にこそめ覚る心地はすれ。根は土際より二木にわかれて、昔の姿うしなはずとしらる。先能因法師思ひ出。往昔{{office:陸奥の守|むつのかみ}}にて下りし人、此木を伐て{{place:名取川|名取川}}の橋杭にせられたる事などあればにや、「松は此たび跡もなし」とは詠たり。代々、あるは伐、あるひは植継などせしと聞くに、今将千歳のかたちとゝのほひて、めでたき松のけしきになん侍し。「{{place:武隈の松|武隈の松}}見せ申せ遅桜」と、{{person:挙白|挙白}}と云ものゝ餞別したりければ、桜より松は二木を三月越し。", "kakikudashi_tagged": "{{place:岩沼|岩沼}}に宿る。{{place:武隈の松|武隈の松}}にこそ目覚むる心地はすれ。根は土際より二木に分かれて、昔の姿失はずと知らる。まず能因法師思ひ出づ。往昔{{office:陸奥の守|陸奥の守}}にて下りし人、この木を伐りて{{place:名取川|名取川}}の橋杭にせられたる事などあればにや、「松はこのたび跡もなし」とは詠みたり。代々、あるは伐り、あるひは植ゑ継ぎなどせしと聞くに、今また千歳のかたち整ひて、めでたき松の気色になん侍りし。「{{place:武隈の松|武隈の松}}見せ申せ遅桜」と、{{person:挙白|挙白}}といふものの餞別したりければ、桜より松は二木を三月越し。", "translation_tagged": "その夜は{{place:岩沼|岩沼}}に宿を取った。ここにある歌枕の{{place:武隈の松|武隈の松}}を見てこそ、まさに目が覚めるような感動を覚えた。その幹は根元の土際から二木に分かれており、古歌に詠まれた昔の姿を今も失っていないことがよくわかる。まず何より能因法師のことが思い出された。むかし{{office:陸奥の守|陸奥の守}}としてこの地に下向した人が、この木を伐って{{place:名取川|名取川}}の橋杭にしてしまったことがあったからであろうか、能因法師は二度目に訪れた際に「松はこのたび跡もなし」と嘆いて詠んだのである。その後も代々にわたり、あるいは伐られ、あるいは植え継がれたりしたと聞くが、今また千年を経たかのような見事な枝ぶりが整って、まことにめでたい松の風情であった。江戸を発つ際に「{{place:武隈の松|武隈の松}}見せ申せ遅桜」と門人の{{person:挙白|挙白}}という者が餞別の句を贈ってくれたので、桜の季節に江戸を出てから三月越しで、遅桜よりもずっと心待ちにしていたこの二木の松についに対面できたことよと詠んだ。"}, {"id": "v1_p16_1", "volume": 1, "book": "おくのほそ道", "section_title": "十六、仙台・宮城野", "para_index": 16, "type": "本文", "verse": null, "raw_text": "名取川を渡て仙台に入。あやめふく日也。旅宿をもとめて、四五日逗留す。爰に画工加右衛門と云ものあり。聊心ある者と聞て、知る人になる。この者、年比さだかならぬ名どころを考置侍ればとて、一日案内す。", "kakikudashi": "名取川を渡りて仙台に入る。あやめふく日なり。旅宿をもとめて、四五日逗留す。ここに画工加右衛門といふものあり。いささか心ある者と聞きて、知る人になる。この者、年頃さだかならぬ名どころを考へ置き侍ればとて、一日案内す。", "translation": "名取川を渡って仙台の城下に入った。ちょうど端午の節句の前日にあたる五月四日の、家々の軒にあやめふく日であった。旅の宿を求めて、ここに四、五日のあいだ逗留した。この町に画工加右衛門という者がいた。いささか風雅の心を備えた人物であると聞いて、知己を結んだ。この者は、長年所在がはっきりしなくなっていた近隣の歌枕の名所を調べ上げておきましたと言って、丸一日案内してくれた。", "persons": "画工加右衛門", "places": "名取川,仙台", "era_year": "元禄二年", "source_book": "", "keywords": "あやめふく日", "raw_tagged": "{{place:名取川|名取川}}を渡て{{place:仙台|仙台}}に入。{{special:あやめふく日|あやめふく日}}也。旅宿をもとめて、四五日逗留す。爰に{{person:画工加右衛門|画工加右衛門}}と云ものあり。聊心ある者と聞て、知る人になる。この者、年比さだかならぬ名どころを考置侍ればとて、一日案内す。", "kakikudashi_tagged": "{{place:名取川|名取川}}を渡りて{{place:仙台|仙台}}に入る。{{special:あやめふく日|あやめふく日}}なり。旅宿をもとめて、四五日逗留す。ここに{{person:画工加右衛門|画工加右衛門}}といふものあり。いささか心ある者と聞きて、知る人になる。この者、年頃さだかならぬ名どころを考へ置き侍ればとて、一日案内す。", "translation_tagged": "{{place:名取川|名取川}}を渡って{{place:仙台|仙台}}の城下に入った。ちょうど端午の節句の前日にあたる五月四日の、家々の軒に{{special:あやめふく日|あやめふく日}}であった。旅の宿を求めて、ここに四、五日のあいだ逗留した。この町に{{person:画工加右衛門|画工加右衛門}}という者がいた。いささか風雅の心を備えた人物であると聞いて、知己を結んだ。この者は、長年所在がはっきりしなくなっていた近隣の歌枕の名所を調べ上げておきましたと言って、丸一日案内してくれた。"}, {"id": "v1_p16_2", "volume": 1, "book": "おくのほそ道", "section_title": "十六、仙台・宮城野", "para_index": 16, "type": "発句・注", "verse": {"genre": "haiku", "l1": "あやめ草", "l2": "足に結ん", "l3": "草鞋の緒", "author": "松尾芭蕉", "bg_theme": "sendai_ayame_waraji", "bg_path": "shortliterature/bg_sendai_ayame_waraji.jpg", "bg_title": "🩴 仙台・あやめ草と紺の染緒の草鞋（第18句専用描き下ろし背景）"}, "raw_text": "みやぎ野の萩茂りあひて、秋の気色思ひやらるゝ。玉田・横野、つゝじが岡はあせび咲ころ也。日影ももらぬ松の林に入て、爰を木の下と云とぞ。昔もかく露ふかければこそ、「みさぶらひみかさ」とはよみたれ。薬師堂・天神の御社など拝て、其日はくれぬ。猶、松嶋・塩がまの所々画に書て贈る。且、紺の染緒つけたる草鞋二足餞す。さればこそ風流のしれもの、爰に至りて其実を顕す。あやめ草足に結ん草鞋の緒。", "kakikudashi": "みやぎ野の萩茂りあひて、秋の気色思ひやらるる。玉田・横野、つつじが岡はあせび咲く頃なり。日影も漏らぬ松の林に入りて、ここを木の下といふとぞ。昔もかく露深ければこそ、「みさぶらひみかさ」とは詠みたれ。薬師堂・天神の御社など拝みて、その日は暮れぬ。なほ、松嶋・塩がまの所々画に書きて贈る。かつ、紺の染緒つけたる草鞋二足餞す。さればこそ風流のしれもの、ここに至りてその実を顕す。あやめ草足に結ばん草鞋の緒。", "translation": "みやぎ野の萩は青々と茂り合っており、花が咲き乱れる秋の風情が今から思いやられる。玉田・横野からつつじが岡に tion": "そこからさらに歌枕の野田の玉川や沖の石を訪ねた。名高い末の松山には寺が建てられていて、山号を末松山という。松の木々の間はすべて墓原となっており、比翼の鳥のように羽を交わし連理の枝のように固く結んだ男女の契りの行く末も、最後はこのように墓の下に帰するのだと悲しさがいっそう募るなかに、塩がまの浦に響く夕暮れの入相の鐘を聞いた。降り続いた五月雨の空も少し晴れ間を見せ、夕月がほのかに光を投げかける向こうに、籬が島もすぐ近くに見える。漁師たちの小舟がうち連なって港へ漕ぎ帰り、獲れた魚を分け合う威勢のよい声々を聞いていると、古今集に「みちのくはいづくはあれど塩竈の浦漕ぐ舟の綱手かなしも」と詠まれた古人の心も深く実感されて、いっそうしみじみと胸を打たれた。その夜、宿では盲目の法師が琵琶をかき鳴らして、奥浄瑠璃という語り物を語っていた。平家琵琶でもなければ幸若舞でもなく、鄙びた調子で声を張り上げるので枕元にやかましく響いたけれども、さすがにみちのくの辺土ならではの古風な伝統を今に失わず伝えていると思うと、かえって殊勝なことに感じられた。", "persons": "", "places": "野田の玉川,沖の石,末の松山,塩竈,籬が島", "era_year": "元禄二年", "source_book": "", "keywords": "奥浄瑠璃", "raw_tagged": "それより{{place:野田の玉川|野田の玉川}}・{{place:沖の石|沖の石}}を尋ぬ。{{place:末の松山|末の松山}}は、寺を造て{{place:末の松山|末松山}}といふ。松のあひあひ皆墓はらにて、はねをかはし枝をつらぬる契の末も、終はかくのごときと、悲しさも増りて、{{place:塩竈|塩がまの浦}}の入相のかねを聞。五月雨の空聊はれて、夕月夜幽に、{{place:籬が島|籬が島}}もほど近し。蜑の小舟こぎつれて、肴わかつ声々に、「つなでかなしも」とよみけん心もしられて、いとゞ哀也。其夜、目盲法師の、琵琶をならして、{{special:奥浄瑠璃|奥浄瑠璃}}と云ものをかたる。平家にもあらず、舞にもあらず、ひなびたる調子うち上て、枕ちかうかしましけれど、さすがに辺土の遺風忘れざるものから、殊勝に覚らる。", "kakikudashi_tagged": "それより{{place:野田の玉川|野田の玉川}}・{{place:沖の石|沖の石}}を尋ぬ。{{place:末の松山|末の松山}}は、寺を造りて{{place:末の松山|末松山}}といふ。松のあひあひ皆墓原にて、羽を交はし枝を連ぬる契りの末も、終はかくのごときと、悲しさも増さりて、{{place:塩竈|塩がまの浦}}の入相の鐘を聞く。五月雨の空いささか晴れて、夕月夜幽かに、{{place:籬が島|籬が島}}もほど近し。蜑の小舟漕ぎ連ねて、魚分かつ声々に、「つなでかなしも」と詠みけん心も知られて、いとど哀れなり。その夜、目盲法師の、琵琶を鳴らして、{{special:奥浄瑠璃|奥浄瑠璃}}といふものを語る。平家にもあらず、舞にもあらず、ひなびたる調子うち上げて、枕近うかしましけれど、さすがに辺土の遺風忘れざるものから、殊勝に覚へらる。", "translation_tagged": "そこからさらに歌枕の{{place:野田の玉川|野田の玉川}}や{{place:沖の石|沖の石}}を訪ねた。名高い{{place:末の松山|末の松山}}には寺が建てられていて、山号を{{place:末の松山|末松山}}という。松の木々の間はすべて墓原となっており、比翼の鳥のように羽を交わし連理の枝のように固く結んだ男女の契りの行く末も、最後はこのように墓の下に帰するのだと悲しさがいっそう募るなかに、{{place:塩竈|塩がまの浦}}に響く夕暮れの入相の鐘を聞いた。降り続いた五月雨の空も少し晴れ間を見せ、夕月がほのかに光を投げかける向こうに、{{place:籬が島|籬が島}}もすぐ近くに見える。漁師たちの小舟がうち連なって港へ漕ぎ帰り、獲れた魚を分け合う威勢のよい声々を聞いていると、古今集に「みちのくはいづくはあれど塩竈の浦漕ぐ舟の綱手かなしも」と詠まれた古人の心も深く実感されて、いっそうしみじみと胸を打たれた。その夜、宿では盲目の法師が琵琶をかき鳴らして、{{special:奥浄瑠璃|奥浄瑠璃}}という語り物を語っていた。平家琵琶でもなければ幸若舞でもなく、鄙びた調子で声を張り上げるので枕元にやかましく響いたけれども、さすがにみちのくの辺土ならではの古風な伝統を今に失わず伝えていると思うと、かえって殊勝なことに感じられた。"}, {"id": "v1_p17_3", "volume": 1, "book": "おくのほそ道", "section_title": "十七、壺の碑・末の松山・塩竈", "para_index": 17, "type": "本文", "verse": null, "raw_text": "早朝、塩竈の明神に詣。国守再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重り、朝日あけの玉がきをかゝやかす。かゝる道の果、塵土の境まで、神霊あらたにましますこそ、吾国の風俗なれと、いと貴けれ。神前に古き宝燈有。かねの戸びらの面に、「文治三年和泉三郎寄進」と有。五百年来の俤、今目の前にうかびて、そゞろに珍し。渠は勇義忠孝の士也。佳命今に至りて、したはずといふ事なし。誠人能道を勤、義を守るべし。「名もまた是にしたがふ」と云り。", "kakikudashi": "早朝、塩竈の明神に詣づ。国守再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重なり、朝日朱の玉垣を輝かす。かかる道の果て、塵土の境まで、神霊あらたにましますこそ、わが国の風俗なれと、いと貴けれ。神前に古き宝燈あり。鉄の扉の面に、「文治三年和泉三郎寄進」とあり。五百年来の俤、今目の前に浮かびて、そぞろに珍し。かれは勇義忠孝の士なり。佳命今に至りて、慕はずといふ事なし。誠に人よく道を勤め、義を守るべし。「名もまたこれにしたがふ」といへり。", "translation": "翌日の早朝、塩竈の明神に参詣した。仙台藩の国守によって社殿が立派に再興されており、宮柱は太くたくましく、極彩色の垂木はきらびやかで、高い石段が幾重にも重なり、昇る朝日が朱塗りの玉垣をまばゆく輝かせている。このようなみちのくの道の果て、都から遠く離れた辺境の地にまで、神の霊威がこれほどあらたかに鎮座しておられることこそ、わが日本の尊い国風であると、まことにありがたく仰がれた。神前には古びた鉄の宝燈が立っていた。その鉄の扉の表面には、「文治三年和泉三郎寄進」と刻まれている。五百年前の奥州藤原氏の面影が今ありありと目の前に浮かび上がってきて、なんとも感慨深く珍しいものに思われた。かの和泉三郎忠衡は、父・秀衡の遺言を守り抜いて源義経に殉じた、武勇と正義と忠孝を兼ね備えたますらおである。その誉れ高い名声は今に至るまで続き、誰一人として彼を慕わない者はない。まことに人はよく人の道を努め励み、正義を守り抜くべきである。古人も「名誉というものは、おのずからその道と義の後に従ってくるものだ」と言っている。", "persons": "和泉三郎", "places": "塩竈", "era_year": "元禄二年", "source_book": "", "keywords": "国守,文治", "raw_tagged": "早朝、{{place:塩竈|塩竈の明神}}に詣。{{office:国守|国守}}再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重り、朝日あけの玉がきをかゝやかす。かゝる道の果、塵土の境まで、神霊あらたにましますこそ、吾国の風俗なれと、いと貴けれ。神前に古き宝燈有。かねの戸びらの面に、「{{special:文治|文治}}三年{{person:和泉三郎|和泉三郎}}寄進」と有。五百年来の俤、今目の前にうかびて、そゞろに珍し。渠は勇義忠孝の士也。佳命今に至りて、したはずといふ事なし。誠人能道を勤、義を守るべし。「名もまた是にしたがふ」と云り。", "kakikudashi_tagged": "早朝、{{place:塩竈|塩竈の明神}}に詣づ。{{office:国守|国守}}再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重なり、朝日朱の玉垣を輝かす。かかる道の果て、塵土の境まで、神霊あらたにましますこそ、わが国の風俗なれと、いと貴けれ。神前に古き宝燈あり。鉄の扉の面に、「{{special:文治|文治}}三年{{person:和泉三郎|和泉三郎}}寄進」とあり。五百年来の俤、今目の前に浮かびて、そぞろに珍し。かれは勇義忠孝の士なり。佳命今に至りて、慕はずといふ事なし。誠に人よく道を勤め、義を守るべし。「名もまたこれにしたがふ」といへり。", "translation_tagged": "翌日の早朝、{{place:塩竈|塩竈の明神}}に参詣した。仙台藩の{{office:国守|国守}}によって社殿が立派に再興されており、宮柱は太くたくましく、極彩色の垂木はきらびやかで、高い石段が幾重にも重なり、昇る朝日が朱塗りの玉垣をまばゆく輝かせている。このようなみちのくの道の果て、都から遠く離れた辺境の地にまで、神の霊威がこれほどあらたかに鎮座しておられることこそ、わが日本の尊い国風であると、まことにありがたく仰がれた。神前には古びた鉄の宝燈が立っていた。その     PLACES.filter(p => p.is_area && p.area_polygon && activeKeys.has(p.key)).forEach(area => {

        fillColor: isCommandery ? '#8d6e63' : '#42a5f5',
        fillOpacity: isCommandery ? 0.06 : 0.03
      }).addTo(baseAreaGroup);
      poly.bindTooltip(`🗺️ ${getShortNameWithReading(area.label)}`, { sticky: true });
      poly.on('click', () => {
        focusPlaceOnMap(area.key, area.key);
      });
    });

    PLACES.filter(p => p.is_pin && activeKeys.has(p.key)).forEach(place => {

      if (place.province === '東山道') fillColor = '#2e7d32';
      else if (place.province === '北陸道') fillColor = '#1565c0';

      const marker = L.circleMarker([place.lat, place.lng], {
        radius: 6.5,
        fillColor: fillColor,
        color: '#fff',
        weight: 1.8,
        fillOpacity: 0.95
      }).addTo(pinMarkerGroup);

        permanent: true,
        direction: 'top',
        offset: [0, -7],
        className: 'transparent-box'

      });
    });

  // 5. 地名クリック時の移動＆「エリア⊃地点」ハイライト処理
  function focusPlaceOnMap(placeKey, clickedRawSurface = '') {
    closeModal();
    const found = PLACES.find(p => p.key === placeKey);
    document.querySelectorAll('.custom-label').forEach(el => el.classList.remove('selected-pin'));
    activeHighlightLayers.forEach(layer => map.removeLayer(layer));
    activeHighlightLayers = [];

    if (!found) return false;

    map.stop();

    if (found.is_area && found.area_polygon) {
      const areaZoom = Math.round(found.zoom || 9);
      const mapSize = map.getSize();
      const leftPadPx = Math.round(mapSize.x * MAP_LEFT_PANEL_WIDTH_RATIO) + 16;
      map.fitBounds(found.area_polygon, {
        paddingTopLeft: [leftPadPx, 24],
        paddingBottomRight: [24, 24],
        maxZoom: areaZoom
      });

      const areaPoly = L.polygon(found.area_polygon, {
        color: '#d84315',
        weight: 3.5,
        fillColor: '#ffab40',
        fillOpacity: 0.25
      }).addTo(map);

      const bannerIcon = L.divIcon({
        className: '',
        html: `<span class="area-banner-label">🗺️ ${found.key}</span>`,
        iconSize: [140, 28],
        iconAnchor: [70, 14]
      });
      const bannerMarker = L.marker([found.lat, found.lng], { icon: bannerIcon, interactive: false }).addTo(map);
      activeHighlightLayers.push(areaPoly, bannerMarker);
    }
    else if (found.is_river) {
      const riverZoom = Math.round(found.zoom || 11);
      setMapViewInRightHalf(found.lat, found.lng, riverZoom);

        const hl = L.polyline(river.coords, { color: '#ffeb3b', weight: 7, opacity: 0.85 }).addTo(map);

        activeHighlightLayers.push(hl, fg);
      });
    }
    else {
      const labelEl = document.getElementById(`pin-label-${found.key}`);
      if (labelEl) labelEl.classList.add('selected-pin');

      const parentArea = PLACES.find(a => a.is_area && a.key === found.parent_area);
      const pointZoom = Math.round(found.zoom || 12);
      if (parentArea && parentArea.area_polygon) {
        const parentPoly = L.polygon(parentArea.area_polygon, {
          color: '#2e7d32',

  // パブリックドメイン浮世絵・名勝写真（Wikipedia代表画像優先 ／ Wikimedia Commons 定規除外）自動取得キャッシュ
  const ukiyoeUrlCache = {};

  async function fetchWikiLeadImage(wikiTitle) {
    if (!wikiTitle) return null;
    try {
      const wikiRes = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`);
      if (wikiRes.ok) {
        const wData = await wikiRes.json();
        const imgUrl = (wData.originalimage && wData.originalimage.source) || (wData.thumbnail && wData.thumbnail.source);
        // 行政区分図・位置図（map / location / svg）を風景写真から除外
        if (imgUrl && !/(\.svg|map|location|locator|位置)/i.test(imgUrl)) {
          return imgUrl;
        }
      }
    } catch (e) {}
    return null;
  }

  async function fetchCommonsCleanUkiyoe(queryStr) {
    if (!queryStr) return null;
    try {
      const commonsApi = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap -Brooklyn ' + queryStr)}&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`;
      const res = await fetch(commonsApi);
      if (res.ok) {
        const data = await res.json();
        if (data.query && data.query.pages) {
          const pages = Object.values(data.query.pages).filter(p => p && p.title && !/brooklyn/i.test(p.title));
          for (const pg of pages) {
            if (pg.imageinfo && pg.imageinfo[0]) {
              const imgUrl = pg.imageinfo[0].thumburl || pg.imageinfo[0].url;
              if (imgUrl) return imgUrl;
            }
          }
        }
      }
    } catch (e) {}
    return null;
  }

  async function fetchPlaceVisualUrl(placeObj) {
    if (!placeObj) return null;
    const cacheKey = placeObj.key;
    if (ukiyoeUrlCache[cacheKey]) return ukiyoeUrlCache[cacheKey];

    const queryStr = placeObj.ukiyoe_query || '';

    // 浮世絵（パブリックドメイン）が明示指定されている地名のみ画像を表示し、現代の風景写真は一切使用しない
    if (!queryStr) {
      return null;
    }

    const commonsUrl = await fetchCommonsCleanUkiyoe(queryStr);
    if (commonsUrl) {
      ukiyoeUrlCache[cacheKey] = commonsUrl;
      return commonsUrl;
    }
    return null;
  }

  async function loadToastUkiyoePreview(placeObj) {
    if (!placeObj) return;
    const imgUrl = await fetchPlaceVisualUrl(placeObj);
    const imgEl = document.getElementById('toastUkiyoeImg');
    const capEl = document.getElementById('toastUkiyoeCaption');
    if (imgUrl && imgEl) {
      imgEl.src = imgUrl;
      imgEl.style.display = 'block';
      if (capEl && placeObj.ukiyoe_caption) capEl.style.display = 'block';
    }
  }

  function renderEmbeddedTags(taggedText, recId) {
    if (!taggedText) return '';
    const editHint = isEditModeActive() ? ' ／ 右クリックまたはドラッグ選択で指摘' : '';
    return taggedText.replace(/\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g, (m, tagType, key, surface) => {
      const safeKey = key.replace(/'/g, "\'");
      const safeSurface = surface.replace(/'/g, "\'");
      if (tagType === 'place') {
        const subLabel = getPlaceSubTypeLabel(key);
        return `<span class="inline-place" data-tag-type="place" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" title="${subLabel}：クリックで地図移動${editHint}">${surface}</span>`;
      } else if (tagType === 'office') {
        return `<span class="inline-office" data-tag-type="office" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" title="👑官職(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'person') {
        return `<span class="inline-person" data-tag-type="person" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" title="👤人名(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'special') {
        return `<span class="inline-special" data-tag-type="special" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" title="🔖特別キーワード(${key})：クリックで解説${editHint}">${surface}</span>`;

  const svsGoldParticles = Array.from({ length: SVS_GOLD_PARTICLE_COUNT }, (_, i) => ({
    x: (i * 197) % SVS_CANVAS_WIDTH_PX,
    y: (i * 313) % SVS_CANVAS_HEIGHT_PX,
    radius: 2.2 + (i % 4),
    speedY: -14 - (i % 16),
    speedX: 6 - (i % 13),
    phase: i * 0.7
  }));

  let svsAnimFrameId = null;
  let svsAnimStartTimeMs = 0;
  let svsCurrentVerseState = null;

  function stopSvsCanvasAnimation() {
    if (svsAnimFrameId) {
      cancelAnimationFrame(svsAnimFrameId);
      svsAnimFrameId = null;
    }
  }

  function drawUtamakuraCustomBackground(ctx, sceneType, elapsedMs) {
    const tSec = elapsedMs / SVS_MS_PER_SECOND;
    ctx.save();

    if (sceneType === 'hina') {
      // 🎎 桃の節句・草庵の雛（深川の草庵から春霞・桃色の彩りへ移り変わる情景）
      const bgGrad = ctx.createLinearGradient(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);
      bgGrad.addColorStop(0, '#3a2328');
      bgGrad.addColorStop(0.45, '#593138');
      bgGrad.addColorStop(1, '#2b1d18');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 上部・右側の春霞と桃の花びらシルエット
      const glowGrad = ctx.createRadialGradient(860, 320, 40, 860, 320, 520);
      glowGrad.addColorStop(0, 'rgba(255, 183, 197, 0.32)');
      glowGrad.addColorStop(1, 'rgba(255, 183, 197, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 雛祭りの菱餅・ぼんぼりを思わせる雅な金砂子と桃色の霞帯
      ctx.strokeStyle = 'rgba(218, 175, 105, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(SVS_PAPER_LEFT_X_PX - 14, SVS_PAPER_TOP_Y_PX - 14, (SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX) + 28, (SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX) + 28);
    } else {
      // 🚣 千住の舟出・行く春の水辺（暁の朧月・隅田川の水面・霞む富士のシルエット）
      const skyGrad = ctx.createLinearGradient(0, 0, 0, SVS_CANVAS_HEIGHT_PX);
      skyGrad.addColorStop(0, '#1c2838');
      skyGrad.addColorStop(0.35, '#3b4d63');
      skyGrad.addColorStop(0.7, '#5c4b51');
      skyGrad.addColorStop(1, '#18222c');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 有明の朧月（右上）
      const moonGrad = ctx.createRadialGradient(880, 250, 15, 880, 250, 170);
      moonGrad.addColorStop(0, 'rgba(255, 243, 200, 0.75)');
      moonGrad.addColorStop(0.4, 'rgba(255, 235, 180, 0.22)');
      moonGrad.addColorStop(1, 'rgba(255, 235, 180, 0)');
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(880, 250, 170, 0, Math.PI * 2);
      ctx.fill();

      // 下部の隅田川の水面さざ波
      ctx.strokeStyle = 'rgba(190, 215, 235, 0.22)';
      ctx.lineWidth = 2.5;
      for (let w = 0; w < 6; w++) {
        const waveY = 1560 + w * 48 + Math.sin(tSec * 1.6 + w) * 6;
        ctx.beginPath();
        ctx.moveTo(80, waveY);
        ctx.quadraticCurveTo(540, waveY - 14, 980, waveY);
        ctx.stroke();
      }
    }

    // 中央の古典和紙短冊領域 (mask_layout.png 準拠: X:108-809, Y:400-1499)
    const paperW = SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX;
    const paperH = SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX;
    const washiGrad = ctx.createLinearGradient(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, SVS_PAPER_RIGHT_X_PX, SVS_PAPER_BOTTOM_Y_PX);
    if (sceneType === 'hina') {
      washiGrad.addColorStop(0, '#fcf7f2');
      washiGrad.addColorStop(0.5, '#f7efe6');
      washiGrad.addColorStop(1, '#f2e3d5');
    } else {
      washiGrad.addColorStop(0, '#f8f5ec');
      washiGrad.addColorStop(0.5, '#f3ede0');
      washiGrad.addColorStop(1, '#e8e0cf');
    }
    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = washiGrad;
    ctx.fillRect(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, paperW, paperH);
    ctx.shadowBlur = 0;

    // 和紙内の淡い金箔・内枠
    ctx.strokeStyle = 'rgba(168, 132, 87, 0.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(SVS_PAPER_LEFT_X_PX + 12, SVS_PAPER_TOP_Y_PX + 12, paperW - 24, paperH - 24);
    ctx.restore();
  }

  async function ensureUkiyoePlaceBgLoaded(placeKey) {
    const found = PLACES.find(p => p.key === placeKey);
    if (!found) return null;
    const imgUrl = await fetchPublicDomainUkiyoeUrl(found.ukiyoe_query, found.wiki_title || found.key);
    if (imgUrl) {
      return preloadSvsBgImage(imgUrl);
    }
    return null;
  }

  function drawUkiyoeWithWashiFrame(ctx, img) {
    // 浮世絵を1080x1920キャンバス全面にアスペクト比維持（cover）で描画し、中央に半透明の古典和紙短冊を重ねる
    const iw = img.naturalWidth || SVS_CANVAS_WIDTH_PX;
    const ih = img.naturalHeight || SVS_CANVAS_HEIGHT_PX;
    const scale = Math.max(SVS_CANVAS_WIDTH_PX / iw, SVS_CANVAS_HEIGHT_PX / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = (SVS_CANVAS_WIDTH_PX - dw) * 0.5;
    const dy = (SVS_CANVAS_HEIGHT_PX - dh) * 0.5;
    ctx.drawImage(img, dx, dy, dw, dh);

    // 周囲を落ち着かせる淡いビネット
    ctx.fillStyle = 'rgba(20, 15, 10, 0.24)';
    ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

    // 中央の和紙短冊領域（浮世絵がほんのり透ける上品な和紙）
    const paperW = SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX;
    const paperH = SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(250, 245, 234, 0.88)';
    ctx.fillRect(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, paperW, paperH);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(168, 132, 87, 0.65)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(SVS_PAPER_LEFT_X_PX + 12, SVS_PAPER_TOP_Y_PX + 12, paperW - 24, paperH - 24);
  }

  function drawSvsBackgroundAndParticles(ctx, themeKey, elapsedMs) {
    const themeObj = SVS_BG_THEMES.find(t => t.key === themeKey) || SVS_BG_THEMES[0];
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const img = themeObj.bgPath ? svsBgImages[themeObj.bgPath] : null;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, 0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);
    } else if (themeObj.customScene) {
      drawUtamakuraCustomBackground(ctx, themeObj.customScene, elapsedMs);
    } else {
      drawUtamakuraCustomBackground(ctx, 'hina', elapsedMs);
    }

    // 金砂子・桜花びらの舞うパーティクル描画
    const tSec = elapsedMs / SVS_MS_PER_SECOND;
    const isPetalTheme = (themeKey === 'hina_peach' || themeKey === 'yukuharu_senju' || themeKey === 'spring_sakura');
    for (const p of svsGoldParticles) {
      const px = (p.x + p.speedX * tSec + SVS_CANVAS_WIDTH_PX) % SVS_CANVAS_WIDTH_PX;
      const py = (p.y + p.speedY * tSec + SVS_CANVAS_HEIGHT_PX) % SVS_CANVAS_HEIGHT_PX;
      const shimmer = 0.22 + 0.16 * Math.sin(tSec * 2.5 + p.phase);
      ctx.beginPath();
      if (isPetalTheme && (p.radius > 3.5)) {
        ctx.ellipse(px, py, p.radius * 1.6, p.radius * 0.9, tSec + p.phase, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 192, 203, ${(shimmer * 1.15).toFixed(3)})`;
      } else {
        ctx.arc(px, py, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(218, 185, 110, ${shimmer.toFixed(3)})`;
      }
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSvsVerticalChar(ctx, ch, x, y, fontSize, alpha, textColor) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const smallKana = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ';
    const puncChars = '、。';
    const longDash = 'ー―‐';

    if (puncChars.includes(ch)) {
      ctx.fillText(ch, x + fontSize * 0.34, y - fontSize * 0.32);
    } else if (smallKana.includes(ch)) {
      ctx.font = `400 ${Math.round(fontSize * 0.82)}px 'Yuji Syuku', 'Yu Mincho', serif`;
      ctx.fillText(ch, x + fontSize * 0.10, y - fontSize * 0.06);
    } else if (longDash.includes(ch)) {
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 2);
      ctx.fillText('―', 0, 0);
    } else {
      ctx.fillText(ch, x, y);
    }
    ctx.restore();
  }

  function renderSvsFrame(ctx, elapsedMs) {
    if (!svsCurrentVerseState) return;
    const { genre, lines, author, bgTheme } = svsCurrentVerseState;
    const isTanka = (genre === 'tanka');

    const lineXCoords = isTanka ? SVS_TANKA_LINE_X_COORDS_PX : SVS_HAIKU_LINE_X_COORDS_PX;
    const lineIndentY = isTanka ? SVS_TANKA_LINE_INDENT_Y_PX : SVS_HAIKU_LINE_INDENT_Y_PX;
    const authorX = isTanka ? SVS_TANKA_AUTHOR_X_PX : SVS_HAIKU_AUTHOR_X_PX;
    const baseFontSize = isTanka ? 64 : 82;
    const baseCharSpacing = isTanka ? 82 : 106;
    const authorFontSize = isTanka ? 44 : 50;
    const authorCharSpacing = isTanka ? 58 : 66;
    const fontFamily = isTanka ? "'Shippori Mincho', 'Yu Mincho', serif" : "'Yuji Syuku', 'Yu Mincho', serif";

    const totalCycleMs = SVS_INTRO_SILENCE_MS + (lines.length * SVS_LINE_APPEAR_INTERVAL_MS) + SVS_AUTHOR_WRITE_SPAN_MS + SVS_OUTRO_HOLD_MS;
    const loopElapsedMs = elapsedMs % totalCycleMs;

    drawSvsBackgroundAndParticles(ctx, bgTheme, elapsedMs);

    ctx.save();
    lines.forEach((lineText, lineIdx) => {
      const chars = Array.from(lineText || '');
      if (chars.length === 0) return;

      const x = lineXCoords[lineIdx] || lineXCoords[lineXCoords.length - 1];
      const startY = SVS_PAPER_SAFE_TOP_Y_PX + (lineIndentY[lineIdx] || 0);
      const maxAvailH = SVS_PAPER_SAFE_BOTTOM_Y_PX - startY;
      const charSpacing = Math.min(baseCharSpacing, Math.floor(maxAvailH / Math.max(1, chars.length)));
      const fontSize = Math.min(baseFontSize, Math.round(charSpacing * 0.84));

      ctx.font = `400 ${fontSize}px ${fontFamily}`;

      const lineStartMs = SVS_INTRO_SILENCE_MS + lineIdx * SVS_LINE_APPEAR_INTERVAL_MS;
      const perCharDelayMs = chars.length > 1 ? (SVS_LINE_WRITE_SPAN_MS / chars.length) : 0;

      chars.forEach((ch, cIdx) => {
        const charTriggerMs = lineStartMs + cIdx * perCharDelayMs;
        const rawProgress = (loopElapsedMs - charTriggerMs) / SVS_CHAR_FADE_DURATION_MS;
        const alpha = Math.max(0, Math.min(1, rawProgress));
        if (alpha > 0) {
          const y = startY + cIdx * charSpacing + fontSize * 0.5;
          drawSvsVerticalChar(ctx, ch, x, y, fontSize, alpha, '#181412');
        }
      });
    });

    // 作者名の縦書き描画（下揃え）
    if (author) {
      const authorChars = Array.from(author);
      const authorStartMs = SVS_INTRO_SILENCE_MS + lines.length * SVS_LINE_APPEAR_INTERVAL_MS;
      const perAuthorCharMs = authorChars.length > 1 ? (SVS_AUTHOR_WRITE_SPAN_MS / authorChars.length) : 0;
      const totalAuthorH = authorChars.length * authorCharSpacing;
      const authorTopY = SVS_PAPER_SAFE_BOTTOM_Y_PX - totalAuthorH;

      ctx.font = `400 ${authorFontSize}px ${fontFamily}`;
      authorChars.forEach((ch, aIdx) => {
        const charTriggerMs = authorStartMs + aIdx * perAuthorCharMs;
        const rawProgress = (loopElapsedMs - charTriggerMs) / SVS_CHAR_FADE_DURATION_MS;
        const alpha = Math.max(0, Math.min(1, rawProgress));
        if (alpha > 0) {
          const y = authorTopY + aIdx * authorCharSpacing + authorFontSize * 0.5;
          drawSvsVerticalChar(ctx, ch, authorX, y, authorFontSize, alpha, '#3a2b22');
        }
      });
    }
    ctx.restore();
  }

  function startSvsModalLoop() {
    stopSvsCanvasAnimation();
    const canvas = document.getElementById('svsModalCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    svsAnimStartTimeMs = performance.now();

    function step(nowMs) {
      const elapsed = nowMs - svsAnimStartTimeMs;
      renderSvsFrame(ctx, elapsed);
      svsAnimFrameId = requestAnimationFrame(step);
    }
    svsAnimFrameId = requestAnimationFrame(step);
  }

  function changeSvsModalBgTheme(newThemeKey) {
    if (!svsCurrentVerseState) return;
    svsCurrentVerseState.bgTheme = newThemeKey;
    const themeObj = SVS_BG_THEMES.find(t => t.key === newThemeKey);
    if (themeObj) {
      if (themeObj.bgPath) preloadSvsBgImage(themeObj.bgPath);
      if (themeObj.ukiyoePlaceKey) ensureUkiyoePlaceBgLoaded(themeObj.ukiyoePlaceKey);
    }
    svsAnimStartTimeMs = performance.now();
  }

    if (!svsCurrentVerseState) return;
    const { recId, lines, bgTheme } = svsCurrentVerseState;
    const themeObj = SVS_BG_THEMES.find(t => t.key === bgTheme);
    const themeLabel = themeObj ? themeObj.label : bgTheme;
    const verseStr = lines.join(' ');
    if (actionType === 'lock') {
      addFeedbackItem({
        recId: recId,
        blockLabel: '🎬動画背景',
        word: verseStr,
        contextSnippet: `背景テーマ指定: ${bgTheme}`,
        action: `🎨 この句の背景を「${themeLabel}」に決定`
      });
    } else {
      const customIdea = window.prompt(`「${verseStr}」向けに新しく作りたい背景のイメージ（例：深川の芭蕉庵と川霧、千住の渡し舟と桜吹雪 など）を入力してください:`, '');
      if (!customIdea || !customIdea.trim()) return;
      addFeedbackItem({
        recId: recId,
        blockLabel: '🎬動画背景',
        word: verseStr,
        contextSnippet: `新規背景リクエスト`,
        action: `🖌️ 新規背景作成リクエスト：「${customIdea.trim()}」`

  async function fetchWikipediaSummary(wikiTitle, containerId, fallbackDesc = '', hasSpecialBox = false) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const encoded = encodeURIComponent(wikiTitle);
    const wikiUrl = `https://ja.wikipedia.org/wiki/${encoded}`;
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encoded}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.type === 'disambiguation') throw new Error('Disambiguation');
      box.innerHTML = `
        <div style="font-weight:bold; color:#0d47a1; margin-bottom:4px;">🌐 【Wikipedia 概略】「${data.title}」</div>
        <div>${data.extract || '（要約テキストなし）'}</div>
        <a class="wiki-link-btn" href="${wikiUrl}" target="_blank" rel="noopener">Wikipediaで「${data.title}」のページを開く ↗</a>
      `;
    } catch (err) {
      if (hasSpecialBox) {
        box.style.display = 'none';
      } else if (fallbackDesc) {
        box.className = 'ai-special-box';
        box.innerHTML = `
          <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">📖 【語句・制度の意味解説】</div>
          <div>${fallbackDesc}</div>
        `;
      } else {
        box.style.display = 'none';
      }
    }
  }
