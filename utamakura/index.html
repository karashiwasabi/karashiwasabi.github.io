 the Tōkai and Tōsandō Circuits}}, and Commander-in-Chief. The first day of the twelfth moon.\" The first year of Jinki corresponds to the reign of {{person:聖武皇帝|Emperor Shōmu}}. Though many famous poetic places sung of since antiquity have been handed down in story, mountains crumble, rivers change their course, roads are remade, stones are buried and hidden in the earth, and ancient trees grow old and give way to saplings—so that as time passes and ages change, almost nothing remains certain of their true traces; yet coming before this unmistakable memorial of a thousand years ago and gazing directly into the hearts of the ancients, I felt that this alone was the true blessing of a pilgrim's journey and the joy of having lived this long, forgetting all the weariness of travel until tears were ready to fall."}, {"id": "v1_p17_2", "volume": 1, "book": "おくのほそ道", "section_title": "十七、壺の碑・末の松山・塩竈", "para_index": 17, "type": "本文", "verse": null, "raw_text": "それより野田の玉川・沖の石を尋ぬ。末の松山は、寺を造て末松山といふ。松のあひあひ皆墓はらにて、はねをかはし枝をつらぬる契の末も、終はかくのごときと、悲しさも増りて、塩がまの浦の入相のかねを聞。五月雨の空聊はれて、夕月夜幽に、籬が島もほど近し。蜑の小舟こぎつれて、肴わかつ声々に、「つなでかなしも」とよみけん心もしられて、いとゞ哀也。其夜、目盲法師の、琵琶をならして、奥浄瑠璃と云ものをかたる。平家にもあらず、舞にもあらず、ひなびたる調子うち上て、枕ちかうかしましけれど、さすがに辺土の遺風忘れざるものから、殊勝に覚らる。", "kakikudashi": "それより野田の玉川・沖の石を尋ぬ。末の松山は、寺を造りて末松山といふ。松のあひあひ皆墓原にて、羽を交はし枝を連ぬる契りの末も、終はかくのごときと、悲しさも増さりて、塩がまの浦の入相の鐘を聞く。五月雨の空いささか晴れて、夕月夜幽かに、籬が島もほど近し。蜑の小舟漕ぎ連ねて、魚分かつ声々に、「つなでかなしも」と詠みけん心も知られて、いとど哀れなり。その夜、目盲法師の、琵琶を鳴らして、奥浄瑠璃といふものを語る。平家にもあらず、舞にもあらず、ひなびたる調子うち上げて、枕近うかしましけれど、さすがに辺土の遺風忘れざるものから、殊勝に覚へらる。", "translation": "そこからさらに歌枕の野田の玉川や沖の石を訪ねた。名高い末の松山には寺が建てられていて、山号を末松山という。松の木々の間はすべて墓原となっており、比翼の鳥のように羽を交わし連理の枝のように固く結んだ男女の契りの行く末も、最後はこのように墓の下に帰するのだと悲しさがいっそう募るなかに、塩がまの浦に響く夕暮れの入相の鐘を聞いた。降り続いた五月雨の空も少し晴れ間を見せ、夕月がほのかに光を投げかける向こうに、籬が島もすぐ近くに見える。漁師たちの小舟がうち連なって港へ漕ぎ帰り、獲れた魚を分け合う威勢のよい声々を聞いていると、古今集に「みちのくはいづくはあれど塩竈の浦漕ぐ舟の綱手かなしも」と詠まれた古人の心も深く実感されて、いっそうしみじみと胸を打たれた。その夜、宿では盲目の法師が琵琶をかき鳴らして、奥浄瑠璃という語り物を語っていた。平家琵琶でもなければ幸若舞でもなく、鄙びた調子で声を張り上げるので枕元にやかましく響いたけれども、さすがにみちのくの辺土ならではの古風な伝統を今に失わず伝えていると思うと、かえって殊勝なことに感じられた。", "persons": "", "places": "野田の玉川,沖の石,末の松山,塩竈,籬が島", "era_year": "元禄二年五月八日", "source_book": "", "keywords": "奥浄瑠璃", "raw_tagged": "それより{{place:野田の玉川|野田の玉川}}・{{place:沖の石|沖の石}}を尋ぬ。{{place:末の松山|末の松山}}は、寺を造て{{place:末の松山|末松山}}といふ。松のあひあひ皆墓はらにて、はねをかはし枝をつらぬる契の末も、終はかくのごときと、悲しさも増りて、{{place:塩竈|塩がまの浦}}の入相のかねを聞。五月雨の空聊はれて、夕月夜幽に、{{place:籬が島|籬が島}}もほど近し。蜑の小舟こぎつれて、肴わかつ声々に、「つなでかなしも」とよみけん心もしられて、いとゞ哀也。其夜、目盲法師の、琵琶をならして、{{special:奥浄瑠璃|奥浄瑠璃}}と云ものをかたる。平家にもあらず、舞にもあらず、ひなびたる調子うち上て、枕ちかうかしましけれど、さすがに辺土の遺風忘れざるものから、殊勝に覚らる。", "kakikudashi_tagged": "それより{{place:野田の玉川|野田の玉川}}・{{place:沖の石|沖の石}}を尋ぬ。{{place:末の松山|末の松山}}は、寺を造りて{{place:末の松山|末松山}}といふ。松のあひあひ皆墓原にて、羽を交はし枝を連ぬる契りの末も、終はかくのごときと、悲しさも増さりて、{{place:塩竈|塩がまの浦}}の入相の鐘を聞く。五月雨の空いささか晴れて、夕月夜幽かに、{{place:籬が島|籬が島}}もほど近し。蜑の小舟漕ぎ連ねて、魚分かつ声々に、「つなでかなしも」と詠みけん心も知られて、いとど哀れなり。その夜、目盲法師の、琵琶を鳴らして、{{special:奥浄瑠璃|奥浄瑠璃}}といふものを語る。平家にもあらず、舞にもあらず、ひなびたる調子うち上げて、枕近うかしましけれど、さすがに辺土の遺風忘れざるものから、殊勝に覚へらる。", "translation_tagged": "そこからさらに歌枕の{{place:野田の玉川|野田の玉川}}や{{place:沖の石|沖の石}}を訪ねた。名高い{{place:末の松山|末の松山}}には寺が建てられていて、山号を{{place:末の松山|末松山}}という。松の木々の間はすべて墓原となっており、比翼の鳥のように羽を交わし連理の枝のように固く結んだ男女の契りの行く末も、最後はこのように墓の下に帰するのだと悲しさがいっそう募るなかに、{{place:塩竈|塩がまの浦}}に響く夕暮れの入相の鐘を聞いた。降り続いた五月雨の空も少し晴れ間を見せ、夕月がほのかに光を投げかける向こうに、{{place:籬が島|籬が島}}もすぐ近くに見える。漁師たちの小舟がうち連なって港へ漕ぎ帰り、獲れた魚を分け合う威勢のよい声々を聞いていると、古今集に「みちのくはいづくはあれど塩竈の浦漕ぐ舟の綱手かなしも」と詠まれた古人の心も深く実感されて、いっそうしみじみと胸を打たれた。その夜、宿では盲目の法師が琵琶をかき鳴らして、{{special:奥浄瑠璃|奥浄瑠璃}}という語り物を語っていた。平家琵琶でもなければ幸若舞でもなく、鄙びた調子で声を張り上げるので枕元にやかましく響いたけれども、さすがにみちのくの辺土ならではの古風な伝統を今に失わず伝えていると思うと、かえって殊勝なことに感じられた。", "english_tagged": "From there we visited the poetic sites of {{place:野田の玉川|Noda no Tamagawa}} and {{place:沖の石|Oki no Ishi}}—the Offing Stone. At {{place:末の松山|Sue no Matsuyama}}, a temple has been built that bears the mountain name {{place:末の松山|Suematsusan}}. All the spaces between the pine trees are filled with graves, making one feel all the more poignantly how even vows of love sworn like birds flying wing-to-wing or branches intertwined must end at last beneath the turf like this—and in that deepened sorrow we heard the evening bell of {{place:塩竈|Shiogama Bay}}. The sky of the fifth-moon rains cleared a little, a faint crescent moon shone in the twilight, and {{place:籬が島|Magaki Island}} lay close at hand. Hearing the lively voices of the fishermen dividing their catch as they rowed their small boats side by side into shore, I felt I truly understood the heart of the ancient poet who sang of 'how touching the tow-ropes of the boats rowing in Shiogama Bay,' and I was moved all the more deeply. That night at our inn, a blind lute-priest strummed his biwa and chanted a local ballad called {{special:奥浄瑠璃|Oku-jōruri}}. Neither a Tale of the Heike chant nor a Kōwaka ballad-drama, his rustic melody raised at the top of his voice rang noisily right beside our pillows, yet realizing that he was faithfully preserving the ancient customs of this remote frontier land, I found it admirable nonetheless."}, {"id": "v1_p17_3", "volume": 1, "book": "おくのほそ道", "section_title": "十七、壺の碑・末の松山・塩竈", "para_index": 17, "type": "本文", "verse": null, "raw_text": "早朝、塩竈の明神に詣。国守再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重り、朝日あけの玉がきをかゝやかす。かゝる道の果、塵土の境まで、神霊あらたにましますこそ、吾国の風俗なれと、いと貴けれ。神前に古き宝燈有。かねの戸びらの面に、「文治三年和泉三郎寄進」と有。五百年来の俤、今目の前にうかびて、そゞろに珍し。渠は勇義忠孝の士也。佳命今に至りて、したはずといふ事なし。誠人能道を勤、義を守るべし。「名もまた是にしたがふ」と云り。", "kakikudashi": "早朝、塩竈の明神に詣づ。国守再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重なり、朝日朱の玉垣を輝かす。かかる道の果て、塵土の境まで、神霊あらたにましますこそ、わが国の風俗なれと、いと貴けれ。神前に古き宝燈あり。鉄の扉の面に、「文治三年和泉三郎寄進」とあり。五百年来の俤、今目の前に浮かびて、そぞろに珍し。かれは勇義忠孝の士なり。佳命今に至りて、慕はずといふ事なし。誠に人よく道を勤め、義を守るべし。「名もまたこれにしたがふ」といへり。", "translation": "翌日の早朝、塩竈の明神に参詣した。仙台藩の国守によって社殿が立派に再興されており、宮柱は太くたくましく、極彩色の垂木はきらびやかで、高い石段が幾重にも重なり、昇る朝日が朱塗りの玉垣をまばゆく輝かせている。このようなみちのくの道の果て、都から遠く離れた辺境の地にまで、神の霊威がこれほどあらたかに鎮座しておられることこそ、わが日本の尊い国風であると、まことにありがたく仰がれた。神前には古びた鉄の宝燈が立っていた。その鉄の扉の表面には、「文治三年和泉三郎寄進」と刻まれている。五百年前の奥州藤原氏の面影が今ありありと目の前に浮かび上がってきて、なんとも感慨深く珍しいものに思われた。かの和泉三郎忠衡は、父・秀衡の遺言を守り抜いて源義経に殉じた、武勇と正義と忠孝を兼ね備えたますらおである。その誉れ高い名声は今に至るまで続き、誰一人として彼を慕わない者はない。まことに人はよく人の道を努め励み、正義を守り抜くべきである。古人も「名誉というものは、おのずからその道と義の後に従ってくるものだ」と言っている。", "persons": "和泉三郎", "places": "塩竈", "era_year": "元禄二年五月九日", "source_book": "", "keywords": "国守,文治", "raw_tagged": "早朝、{{place:塩竈|塩竈の明神}}に詣。{{office:国守|国守}}再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重り、朝日あけの玉がきをかゝやかす。かゝる道の果、塵土の境まで、神霊あらたにましますこそ、吾国の風俗なれと、いと貴けれ。神前に古き宝燈有。かねの戸びらの面に、「{{special:文治|文治}}三年{{person:和泉三郎|和泉三郎}}寄進」と有。五百年来の俤、今目の前にうかびて、そゞろに珍し。渠は勇義忠孝の士也。佳命今に至りて、したはずといふ事なし。誠人能道を勤、義を守るべし。「名もまた是にしたがふ」と云り。", "kakikudashi_tagged": "早朝、{{place:塩竈|塩竈の明神}}に詣づ。{{office:国守|国守}}再興せられて、宮柱ふとしく、彩椽きらびやかに、石の階九仭に重なり、朝日朱の玉垣を輝かす。かかる道の果て、塵土の境まで、神霊あらたにましますこそ、わが国の風俗なれと、いと貴けれ。神前に古き宝燈あり。鉄の扉の面に、「{{special:文治|文治}}三年{{person:和泉三郎|和泉三郎}}寄進」とあり。五百年来の俤、今目の前に浮かびて、そぞろに珍し。かれは勇義忠孝の士なり。佳命今に至りて、慕はずといふ事なし。誠に人よく道を勤め、義を守るべし。「名もまたこれにしたがふ」といへり。", "translation_tagged": "翌日の早朝、{{place:塩竈|塩竈の明神}}に参詣した。仙台藩の{{office:国守|国守}}によって社殿が立派に再興されており、宮柱は太くたくましく、極彩色の垂木はきらびやかで、高い石段が幾重にも重なり、昇る朝日が朱塗りの玉垣をまばゆく輝かせている。このようなみちのくの道の果て、都から遠く離れた辺境の地にまで、神の霊威がこれほどあらたかに鎮座しておられることこそ、わが日本の尊い国風であると、まことにありがたく仰がれた。神前には古びた鉄の宝燈が立っていた。その鉄の扉の表面には、「{{special:文治|文治}}三年{{person:和泉三郎|和泉三郎}}寄進」と刻まれている。五百年前の奥州藤原氏の面影が今ありありと目の前に浮かび上がってきて、なんとも感慨深く珍しいものに思われた。かの和泉三郎忠衡は、父・秀衡の遺言を守り抜いて源義経に殉じた、武勇と正義と忠孝を兼ね備えたますらおである。その誉れ高い名声は今に至るまで続き、誰一人として彼を慕わない者はない。まことに人はよく人の道を努め励み、正義を守り抜くべきである。古人も「名誉というものは、おのずからその道と義の後に従ってくるものだ」と言っている。", "english_tagged": "Early the next morning, we worshiped at the {{place:塩竈|Sacred Shrine of Shiogama}}. Rebuilt in splendor by the {{office:国守|provincial lord}} of Sendai, its sanctuary pillars stand thick and grand, its painted rafters gleam with brilliant color, its stone steps rise tier upon tier to a lofty height, and the morning sun sets its vermilion-lacquered fences ablaze with light. That the divine spirit should dwell in such manifest majesty even here at the farthest end of the road, on the very frontier of this world of dust, made me revere all the more deeply the noble tradition of our land. Before the sanctuary stood an ancient iron votive lantern. On the face of its iron door was inscribed: \"Donated by {{person:和泉三郎|Izumi Saburō}} in the third year of {{special:文治|Bunji}}.\" Visions of five hundred years ago rose vividly before my eyes, awakening a strange and stirring emotion. He was a warrior of courage, righteousness, loyalty, and filial devotion. Down to the present day his noble fame endures, and there is no one who does not honor his memory. Truly, a man should strive earnestly along the Way and uphold righteousness. As the ancient saying goes, \"Fame follows naturally in their wake.\""}, {"id": "v1_p18_1", "volume": 1, "book": "おくのほそ道", "section_title": "十八、松島", "para_index": 18, "type": "本文", "verse": null, "raw_text": "抑ことふりにたれど、松嶋は扶桑第一の好風にして、凡洞庭・西湖を恥ず。東南より海を入れて、江の中三里、浙江の潮をたゝふ。島々の数を尽して、欹ものは天を指、ふすものは波に匍匐。あるは二重にかさなり、三重に畳みて、左にわかれ右につらなる。負るあり抱るあり、児孫愛すがごとし。松の緑こまやかに、枝葉汐風に吹たわめて、屈曲をのづからためたるがごとし。其気色窅然として、美人の顔を粧ふ。ちはや振神のむかし、大山ずみのなせるわざにや。造化の天工、いづれの人か筆をふるひ、詞を尽さむ。", "kakikudashi": "そもそも事古りにたれど、松嶋は扶桑第一の好風にして、およそ洞庭・西湖を恥ぢず。東南より海を入れて、江の中三里、浙江の潮をたたふ。島々の数を尽くして、そばだつものは天を指さし、伏すものは波に匍匐す。あるいは二重に重なり、三重に畳みて、左に分かれ右に連なる。負へるあり抱けるあり、児孫愛するがごとし。松の緑こまやかに、枝葉汐風に吹きたわめて、屈曲おのづから矯めたるがごとし。その気色窅然として、美人の顔を粧ふ。ちはやぶる神のむかし、大山ずみのなせるわざにや。造化の天工、いづれの人か筆をふるひ、詞を尽くさむ。", "translation": "そもそも今さら言うのも言い古されたことではあるが、松嶋は日本第一の絶景であって、中国の名勝である洞庭湖や西湖に比べてもまったくひけをとらない。東南の方角から外海を引き入れて、入江の広さは三里四方に及び、中国の銭塘江さながらの豊かな潮を満々と湛えている。湾内には無数の島々がことごとく集まり、高くそびえ立つ島は天を指さし、低く伏す島は波の上に腹ばいになっている。ある島は二重に重なり合い、ある島は三重に折り重なって、左へ分かれたかと思えば右へと連なっていく。小さな島を背負うような島もあれば胸に抱きかかえるような島もあり、ちょうど親や祖父母が可愛い子や孫を慈しんでいるかのようである。島々の松の緑は濃くつややかで、枝葉は絶え間ない潮風に吹きしならされて、その曲がりくねった枝ぶりはまるで自然が自ら手で整えたかのようである。その風情は奥深くうっとりとするほど優美で、絶世の美女が美しく化粧を凝らしたおもむきがある。ちはやぶる神代の昔に、山海を司る大山祇の神が造り上げた神業なのであろうか。この大自然の創造主による神業の造形を前にして、いったいどこの誰が絵筆をふるい、言葉を尽くして言い表すことができようか。", "persons": "大山祇", "places": "松島", "era_year": "元禄二年五月九日", "source_book": "", "keywords": "扶桑,洞庭・西湖,三里,浙江の潮,造化の天工", "raw_tagged": "抑ことふりにたれど、{{place:松島|松嶋}}は{{special:扶桑|扶桑}}第一の好風にして、凡{{special:洞庭・西湖|洞庭・西湖}}を恥ず。東南より海を入れて、江の中{{special:三里|三里}}、{{special:浙江の潮|浙江の潮}}をたゝふ。島々の数を尽して、欹ものは天を指、ふすものは波に匍匐。あるは二重にかさなり、三重に畳みて、左にわかれ右につらなる。負るあり抱るあり、児孫愛すがごとし。松の緑こまやかに、枝葉汐風に吹たわめて、屈曲をのづからためたるがごとし。其気色窅然として、美人の顔を粧ふ。ちはや振神のむかし、{{person:大山祇|大山ずみ}}のなせるわざにや。{{special:造化の天工|造化の天工}}、いづれの人か筆をふるひ、詞を尽さむ。", "kakikudashi_tagged": "そもそも事古りにたれど、{{place:松島|松嶋}}は{{special:扶桑|扶桑}}第一の好風にして、およそ{{special:洞庭・西湖|洞庭・西湖}}を恥ぢず。東南より海を入れて、江の中{{special:三里|三里}}、{{special:浙江の潮|浙江の潮}}をたたふ。島々の数を尽くして、そばだつものは天を指さし、伏すものは波に匍匐す。あるいは二重に重なり、三重に畳みて、左に分かれ右に連なる。負へるあり抱けるあり、児孫愛するがごとし。松の緑こまやかに、枝葉汐風に吹きたわめて、屈曲おのづから矯めたるがごとし。その気色窅然として、美人の顔を粧ふ。ちはやぶる神のむかし、{{person:大山祇|大山ずみ}}のなせるわざにや。{{special:造化の天工|造化の天工}}、いづれの人か筆をふるひ、詞を尽くさむ。", "translation_tagged": "そもそも今さら言うのも言い古されたことではあるが、{{place:松島|松嶋}}は日本第一の絶景であって、中国の名勝である{{special:洞庭・西湖|洞庭}}湖や{{special:洞庭・西湖|西湖}}に比べてもまったくひけをとらない。東南の方角から外海を引き入れて、入江の広さは{{special:三里|三里}}四方に及び、中国の銭塘江さながらの豊かな潮を満々と湛えている。湾内には無数の島々がことごとく集まり、高くそびえ立つ島は天を指さし、低く伏す島は波の上に腹ばいになっている。ある島は二重に重なり合い、ある島は三重に折り重なって、左へ分かれたかと思えば右へと連なっていく。小さな島を背負うような島もあれば胸に抱きかかえるような島もあり、ちょうど親や祖父母が可愛い子や孫を慈しんでいるかのようである。島々の松の緑は濃くつややかで、枝葉は絶え間ない潮風に吹きしならされて、その曲がりくねった枝ぶりはまるで自然が自ら手で整えたかのようである。その風情は奥深くうっとりとするほど優美で、絶世の美女が美しく化粧を凝らしたおもむきがある。ちはやぶる神代の昔に、山海を司る{{person:大山祇|大山祇}}の神が造り上げた神業なのであろうか。この大自然の創造主による神業の造形を前にして、いったいどこの誰が絵筆をふるい、言葉を尽くして言い表すことができようか。", "english_tagged": "Though it is a truism repeated countless times before, {{place:松島|Matsushima}} is the foremost scenic wonder of {{special:扶桑|Japan}}, in no way inferior to {{special:洞庭・西湖|Lake Dongting or West Lake}} in China. Letting in the sea from the southeast, the bay measures {{special:三里|three leagues}} across, brimming with tides like those of China's {{special:浙江の潮|Qiantang River}}. Islands beyond number gather here: the tall ones point toward heaven, while the low ones crouch prostrate over the waves. Some lie stacked two deep, others folded three layers high, parting to the left and linking together to the right. Some seem to carry smaller islands on their backs, others to cradle them in their arms, as though cherishing their children and grandchildren. The green of the pines is rich and lustrous, their branches and needles bent by the constant sea breeze until their twisted shapes look as if trained by an artist's hand. The whole scene is of a deep, enchanting grace, like a peerless beauty adorning her face. Was this wrought in the ancient Age of the Gods by {{person:大山祇|Ōyamatsumi}}, the Great Mountain Deity? Before such {{special:造化の天工|heavenly workmanship of the Creator}}, what mortal could ever wield a brush or exhaust the power of words to describe it?"}, {"id": "v1_p18_2", "volume": 1, "book": "おくのほそ道", "section_title": "十八、松島", "para_index": 18, "type": "本文", "verse": null, "raw_text": "雄島が磯は地つゞきて海に出たる島也。雲居禅師の別室の跡、坐禅石など有。将、松の木陰に世をいとふ人も稀々見え侍りて、落穂・松笠など打けぶりたる草の菴、閑に住なし、いかなる人とはしられずながら、先なつかしく立寄ほどに、月海にうつりて、昼のながめ又あらたむ。", "kakikudashi": "雄島が磯は地つづきて海に出でたる島なり。雲居禅師の別室の跡、坐禅石などあり。また、松の木陰に世をいとふ人もまれまれ見え侍りて、落穂・松笠などうちけぶりたる草の庵、閑かに住みなし、いかなる人とは知られずながら、まづなつかしく立ち寄るほどに、月海に移りて、昼のながめまたあらたむ。", "translation": "雄島が磯は、陸地から橋で続いて海へと突き出た島である。ここには瑞巌寺を中興した雲居禅師の別室の跡や、坐禅石などが残っている。また、松の木陰には俗世を離れた隠遁者の姿もちらほらと見受けられ、松の落葉や松ぼっくりなどを焚く煙が静かに立ちのぼる草庵に心静かに暮らしており、どのような人とも知れないながらも心惹かれて立ち寄っているうちに、やがて月が昇って海面に光を映し出し、昼間とはまたすっかり趣の変わった絶景となった。", "persons": "雲居禅師", "places": "雄島", "era_year": "元禄二年五月九日", "source_book": "", "keywords": "", "raw_tagged": "{{place:雄島|雄島が磯}}は地つゞきて海に出たる島也。{{person:雲居禅師|雲居禅師}}の別室の跡、坐禅石など有。将、松の木陰に世をいとふ人も稀々見え侍りて、落穂・松笠など打けぶりたる草の菴、閑に住なし、いかなる人とはしられずながら、先なつかしく立寄ほどに、月海にうつりて、昼のながめ又あらたむ。", "kakikudashi_tagged": "{{place:雄島|雄島が磯}}は地つづきて海に出でたる島なり。{{person:雲居禅師|雲居禅師}}の別室の跡、坐禅石などあり。また、松の木陰に世をいとふ人もまれまれ見え侍りて、落穂・松笠などうちけぶりたる草の庵、閑かに住みなし、いかなる人とは知られずながら、まづなつかしく立ち寄るほどに、月海に移りて、昼のながめまたあらたむ。", "translation_tagged": "{{place:雄島|雄島が磯}}は、陸地から橋で続いて海へと突き出た島である。ここには瑞巌寺を中興した{{person:雲居禅師|雲居禅師}}の別室の跡や、坐禅石などが残っている。また、松の木陰には俗世を離れた隠遁者の姿もちらほらと見受けられ、松の落葉や松ぼっくりなどを焚く煙が静かに立ちのぼる草庵に心静かに暮らしており、どのような人とも知れないながらも心惹かれて立ち寄っているうちに、やがて月が昇って海面に光を映し出し、昼間とはまたすっかり趣の変わった絶景となった。", "english_tagged": "The shore of {{place:雄島|Ojima Island}} is a promontory jutting out into the sea and linked to the mainland. Here remain the site of Zen Master {{person:雲居禅師|Ungo}}'s retreat and his meditation rock. Moreover, beneath the shade of the pines one catches occasional glimpses of hermits who have turned their backs upon the world, living quietly in thatched huts where smoke rises gently from burning pine needles and pinecones; though I knew not who they were, I was drawn by a warm affinity to stop by, and as I lingered, the moon rose and cast its reflection upon the sea, transforming the daytime view into a wholly new splendor."}, {"id": "v1_p18_3", "volume": 1, "book": "おくのほそ道", "section_title": "十八、松島", "para_index": 18, "type": "発句・注", "verse": {"genre": "haiku", "l1": "松島や", "l2": "鶴に身をかれ", "l3": "ほとゝぎす", "author": "河合曾良", "bg_theme": "matsushima_tsuru", "bg_path": "shortliterature/bg_matsushima_tsuru.jpg", "bg_title": "🦢 松島・月夜の松島湾と白鶴・時鳥（第19句専用描き下ろし背景）"}, "raw_text": "江上に帰りて宿をもとむれば、窓をひらき二階を作て、風雲の中に旅寝するこそ、あやしきまで妙なる心地はせられけれ。松島や鶴に身をかれほとゝぎす 曾良。予は口をとぢて、眠らんとしていねられず。旧庵をわかるゝ時、素堂松島の詩あり。原安適が松がうらしほの和歌を贈らる。袋を解て、こよひの友とす。且、杉風・濁子が発句あり。", "kakikudashi": "江上に帰りて宿をもとむれば、窓をひらき二階を作りて、風雲の中に旅寝するこそ、あやしきまで妙なる心地はせられけれ。松島や鶴に身をかれほととぎす 曾良。予は口をとぢて、眠らんとしていねられず。旧庵を別るる時、素堂松島の詩あり。原安適が松がうらしほの和歌を贈らる。袋を解きて、こよひの友とす。かつ、杉風・濁子が発句あり。", "translation": "雄島から松島湾のほとりに戻って宿をとると、海に向かって窓を開いた二階造りの部屋であって、吹き渡る風と浮かぶ雲のただ中に旅寝するのは、不思議なほどえも言われぬ素晴らしい心地がした。松島や鶴に身をかれほととぎす――松島の神々しい絶景にふさわしく、ほととぎすよ、松に似合う白鶴の気高い姿を借りて鳴き渡れ、と曾良が詠んだ。私はあまりの絶景に句も出ないまま口を閉ざし、眠ろうとしても胸が高鳴ってとても眠ることができなかった。思えば江戸の旧庵を旅立つ時、山口素堂から松島の漢詩を贈られた。また原安適からは松がうらしほを詠んだ和歌を贈られていた。頭陀袋を解いてそれらを取り出し、今宵の月見の友とした。さらにその袋の中には、杉風や濁子から贈られた餞別の発句も収められていた。", "persons": "曾良,山口素堂,原安適,杉風,中川濁子", "places": "松島", "era_year": "元禄二年五月九日", "source_book": "", "keywords": "鶴に身をかれ", "raw_tagged": "江上に帰りて宿をもとむれば、窓をひらき二階を作て、風雲の中に旅寝するこそ、あやしきまで妙なる心地はせられけれ。{{place:松島|松島}}や{{special:鶴に身をかれ|鶴に身をかれ}}ほとゝぎす {{person:曾良|曾良}}。予は口をとぢて、眠らんとしていねられず。旧庵をわかるゝ時、{{person:山口素堂|素堂}}{{place:松島|松島}}の詩あり。{{person:原安適|原安適}}が松がうらしほの和歌を贈らる。袋を解て、こよひの友とす。且、{{person:杉風|杉風}}・{{person:中川濁子|濁子}}が発句あり。", "kakikudashi_tagged": "江上に帰りて宿をもとむれば、窓をひらき二階を作りて、風雲の中に旅寝するこそ、あやしきまで妙なる心地はせられけれ。{{place:松島|松島}}や{{special:鶴に身をかれ|鶴に身をかれ}}ほととぎす {{person:曾良|曾良}}。予は口をとぢて、眠らんとしていねられず。旧庵を別るる時、{{person:山口素堂|素堂}}{{place:松島|松島}}の詩あり。{{person:原安適|原安適}}が松がうらしほの和歌を贈らる。袋を解きて、こよひの友とす。かつ、{{person:杉風|杉風}}・{{person:中川濁子|濁子}}が発句あり。", "translation_tagged": "雄島から松島湾のほとりに戻って宿をとると、海に向かって窓を開いた二階造りの部屋であって、吹き渡る風と浮かぶ雲のただ中に旅寝するのは、不思議なほどえも言われぬ素晴らしい心地がした。{{place:松島|松島}}や{{special:鶴に身をかれ|鶴に身をかれ}}ほととぎす――{{place:松島|松島}}の神々しい絶景にふさわしく、ほととぎすよ、松に似合う白鶴の気高い姿を借りて鳴き渡れ、と{{person:曾良|曾良}}が詠んだ。私はあまりの絶景に句も出ないまま口を閉ざし、眠ろうとしても胸が高鳴ってとても眠ることができなかった。思えば江戸の旧庵を旅立つ時、{{person:山口素堂|山口素堂}}から{{place:松島|松島}}の漢詩を贈られた。また{{person:原安適|原安適}}からは松がうらしほを詠んだ和歌を贈られていた。頭陀袋を解いてそれらを取り出し、今宵の月見の友とした。さらにその袋の中には、{{person:杉風|杉風}}や{{person:中川濁子|濁子}}から贈られた餞別の発句も収められていた。", "english_tagged": "Returning to the shoreline of the bay to seek lodging, we took an upper-story room with windows opening out over the water, and sleeping there amidst the wind and clouds gave us a feeling of almost uncanny wonder. \"O {{place:松島|Matsushima}}! / {{special:鶴に身をかれ|Borrow the body of a crane}}, / little cuckoo!\" — {{person:曾良|Sora}}. I myself kept my lips closed in silence, and though I tried to sleep, I could not close my eyes. When I parted from my old hut in Edo, {{person:山口素堂|Sodō}} had composed a Chinese poem on {{place:松島|Matsushima}} for me, and {{person:原安適|Hara Anteki}} had presented me with a waka on Matsugaura Bay. Untying my traveling bag, I made those poems my companions for the night. In the bag were also parting haiku by {{person:杉風|Sanpū}} and {{person:中川濁子|Jokushi}}."}, {"id": "v1_p19_1", "volume": 1, "book": "おくのほそ道", "section_title": "十九、瑞巌寺・石巻", "para_index": 19, "type": "本文", "verse": null, "raw_text": "十一日、瑞岩寺に詣。当寺三十二世の昔、真壁の平四郎出家して、入唐帰朝の後開山す。其後に雲居禅師の徳化に依て、七堂甍改りて、金壁荘厳光を輝、仏土成就の大伽藍とはなれりける。彼見仏聖の寺はいづくにやとしたはる。", "kakikudashi": "十一日、瑞岩寺に詣づ。当寺三十二世の昔、真壁の平四郎出家して、入唐帰朝の後開山す。その後に雲居禅師の徳化によりて、七堂甍改まりて、金壁荘厳光を輝かし、仏土成就の大伽藍とはなれりける。かの見仏聖の寺はいづくにやと慕はる。", "translation": "五月十一日、瑞巌寺に参詣した。この寺は今から三十二代前の昔、真壁の平四郎という武士が出家して法身と号し、中国へ渡って禅を学び帰朝した後に開山した寺である。その後に雲居禅師の高い徳と教化によって、七堂伽藍の屋根瓦もすっかり新しく改まり、金碧に彩られた壁や荘厳な飾り付けがまばゆい光を放って、まるで地上に極楽浄土が現出したかのような大伽藍となったのである。それにつけても、かつて雄島で十二年間法華経を誦し続けたというあの見仏聖の草庵の跡はどこであろうかと、しきりに慕わしく思われた。", "persons": "真壁平四郎,雲居禅師,見仏聖", "places": "瑞巌寺", "era_year": "元禄二年五月十一日", "source_book": "", "keywords": "", "raw_tagged": "十一日、{{place:瑞巌寺|瑞岩寺}}に詣。当寺三十二世の昔、{{person:真壁平四郎|真壁の平四郎}}出家して、入唐帰朝の後開山す。其後に{{person:雲居禅師|雲居禅師}}の徳化に依て、七堂甍改りて、金壁荘厳光を輝、仏土成就の大伽藍とはなれりける。彼{{person:見仏聖|見仏聖}}の寺はいづくにやとしたはる。", "kakikudashi_tagged": "十一日、{{place:瑞巌寺|瑞岩寺}}に詣づ。当寺三十二世の昔、{{person:真壁平四郎|真壁の平四郎}}出家して、入唐帰朝の後開山す。その後に{{person:雲居禅師|雲居禅師}}の徳化によりて、七堂甍改まりて、金壁荘厳光を輝かし、仏土成就の大伽藍とはなれりける。かの{{person:見仏聖|見仏聖}}の寺はいづくにやと慕はる。", "translation_tagged": "五月十一日、{{place:瑞巌寺|瑞巌寺}}に参詣した。この寺は今から三十二代前の昔、{{person:真壁平四郎|真壁の平四郎}}という武士が出家して法身と号し、中国へ渡って禅を学び帰朝した後に開山した寺である。その後に{{person:雲居禅師|雲居禅師}}の高い徳と教化によって、七堂伽藍の屋根瓦もすっかり新しく改まり、金碧に彩られた壁や荘厳な飾り付けがまばゆい光を放って、まるで地上に極楽浄土が現出したかのような大伽藍となったのである。それにつけても、かつて雄島で十二年間法華経を誦し続けたというあの{{person:見仏聖|見仏聖}}の草庵の跡はどこであろうかと、しきりに慕わしく思われた。", "english_tagged": "On the eleventh day, we worshiped at {{place:瑞巌寺|Zuiganji Temple}}. Thirty-two generations ago, {{person:真壁平四郎|Makabe no Heishirō}} took monastic vows, traveled to Tang China, and upon his return founded this temple. Later, through the virtuous influence of Zen Master {{person:雲居禅師|Ungo}}, the tiled roofs of the seven main halls were newly rebuilt, their golden walls and solemn ornaments gleaming with radiance to create a grand monastery that is a veritable Buddha-land on earth. I wondered with longing where the ancient temple of that holy monk {{person:見仏聖|Kenbutsu}} might have stood."}, {"id": "v1_p19_2", "volume": 1, "book": "おくのほそ道", "section_title": "十九、瑞巌寺・石巻", "para_index": 19, "type": "本文", "verse": null, "raw_text": "十二日、平和泉と心ざし、あねはの松・緒だえの橋など聞伝て、人跡稀に、雉兎蕘蕘の往かふ道そこともわかず、終に路ふみたがえて、石の巻といふ湊に出。「こがね花咲」とよみて奉たる金花山、海上に見わたし、数百の廻船入江につどひ、人家地をあらそひて、竈の煙立つゞけたり。思ひかけず斯る所にも来れる哉と、宿からんとすれど、更に宿かす人なし。漸まづしき小家に一夜をあかして、明ればまたしらぬ道まよひ行。袖のわたり・尾ぶちの牧・まのゝ萱はらなどよそめにみて、遥なる堤を行。心細き長沼にそふて、戸伊麻と云所に一宿して、平泉に到る。其間廿余里ほどゝおぼゆ。", "kakikudashi": "十二日、平和泉と心ざし、あねはの松・緒だえの橋など聞き伝へて、人跡稀に、雉兎蕘蕘の行きかふ道そこともわかず、終に路ふみたがへて、石の巻といふ湊に出づ。「こがね花咲く」と詠みて奉りたる金花山、海上に見わたし、数百の廻船入江に集ひ、人家地を争ひて、竈の煙立ちつづけたり。思ひかけずかかる所にも来れるかなと、宿からんとすれど、さらに宿貸す人なし。やうやく貧しき小家に一夜をあかして、明くればまた知らぬ道まよひ行く。袖のわたり・尾ぶちの牧・まのの萱はらなどよそめに見て、遥かなる堤を行く。心細き長沼にそふて、戸伊麻といふ所に一宿して、平泉に到る。その間二十余里ほどとおぼゆ。", "translation": "五月十二日、平泉を目指そうと心に決め、名高いあねはの松や緒だえの橋などの噂を聞き伝えてたどって行ったが、人の足跡もまれで、猟師や柴刈りだけが行き交う細い山道はどちらへ行くのかもわからず、ついに道を踏み違えて、石の巻という港町に出てしまった。その昔、大伴家持が「すめろきの御代栄えむと東なる陸奥山にこがね花咲く」と詠んで朝廷に賀歌を奉った金花山を海のかなたに見渡し、入江には何百艘もの廻船が集まり、人家が土地を争うようにひしめき合って、炊事のかまどの煙が絶え間なく立ち続けている。思いがけずこのような賑やかな湊町に出てきたものよと驚きながら、宿を借りようとしたけれども、まったく宿を貸してくれる人がいない。ようやく貧しい小さな家に頼み込んで一夜を明かし、夜が明けると再び見知らぬ道を迷いながら進んで行った。歌枕の袖のわたり、尾ぶちの牧、まのの萱はらなどを遠目に見やりながら、はるかに続く北上川の長い堤を歩いて行く。見るからに心細くなるような細長い沼に沿って進み、戸伊麻という宿場に一泊して、ようやく平泉に到着した。松島から平泉までの道のりは、およそ二十余里ほどであったと思われる。", "persons": "", "places": "平泉,姉歯の松,緒絶の橋,石巻,金華山,袖の渡り,尾駁の牧,登米", "era_year": "元禄二年五月十二日〜十三日", "source_book": "", "keywords": "雉兎蕘蕘,こがね花咲", "raw_tagged": "十二日、{{place:平泉|平和泉}}と心ざし、{{place:姉歯の松|あねはの松}}・{{place:緒絶の橋|緒だえの橋}}など聞伝て、人跡稀に、{{special:雉兎蕘蕘|雉兎蕘蕘}}の往かふ道そこともわかず、終に路ふみたがえて、{{place:石巻|石の巻}}といふ湊に出。「{{special:こがね花咲|こがね花咲}}」とよみて奉たる{{place:金華山|金花山}}、海上に見わたし、数百の廻船入江につどひ、人家地をあらそひて、竈の煙立つゞけたり。思ひかけず斯る所にも来れる哉と、宿からんとすれど、更に宿かす人なし。漸まづしき小家に一夜をあかして、明ればまたしらぬ道まよひ行。{{place:袖の渡り|袖のわたり}}・{{place:尾駁の牧|尾ぶちの牧}}・まのゝ萱はらなどよそめにみて、遥なる堤を行。心細き長沼にそふて、{{place:登米|戸伊麻}}と云所に一宿して、{{place:平泉|平泉}}に到る。其間廿余里ほどゝおぼゆ。", "kakikudashi_tagged": "十二日、{{place:平泉|平和泉}}と心ざし、{{place:姉歯の松|あねはの松}}・{{place:緒絶の橋|緒だえの橋}}など聞き伝へて、人跡稀に、{{special:雉兎蕘蕘|雉兎蕘蕘}}の行きかふ道そこともわかず、終に路ふみたがへて、{{place:石巻|石の巻}}といふ湊に出づ。「{{special:こがね花咲|こがね花咲}}く」と詠みて奉りたる{{place:金華山|金花山}}、海上に見わたし、数百の廻船入江に集ひ、人家地を争ひて、竈の煙立ちつづけたり。思ひかけずかかる所にも来れるかなと、宿からんとすれど、さらに宿貸す人なし。やうやく貧しき小家に一夜をあかして、明くればまた知らぬ道まよひ行く。{{place:袖の渡り|袖のわたり}}・{{place:尾駁の牧|尾ぶちの牧}}・まのの萱はらなどよそめに見て、遥かなる堤を行く。心細き長沼にそふて、{{place:登米|戸伊麻}}といふ所に一宿して、{{place:平泉|平泉}}に到る。その間二十余里ほどとおぼゆ。", "translation_tagged": "五月十二日、{{place:平泉|平泉}}を目指そうと心に決め、名高い{{place:姉歯の松|あねはの松}}や{{place:緒絶の橋|緒だえの橋}}などの噂を聞き伝えてたどって行ったが、人の足跡もまれで、猟師や柴刈りだけが行き交う細い山道はどちらへ行くのかもわからず、ついに道を踏み違えて、{{place:石巻|石の巻}}という港町に出てしまった。その昔、大伴家持が「すめろきの御代栄えむと東なる陸奥山に{{special:こがね花咲|こがね花咲}}く」と詠んで朝廷に賀歌を奉った{{place:金華山|金花山}}を海のかなたに見渡し、入江には何百艘もの廻船が集まり、人家が土地を争うようにひしめき合って、炊事のかまどの煙が絶え間なく立ち続けている。思いがけずこのような賑やかな湊町に出てきたものよと驚きながら、宿を借りようとしたけれども、まったく宿を貸してくれる人がいない。ようやく貧しい小さな家に頼み込んで一夜を明かし、夜が明けると再び見知らぬ道を迷いながら進んで行った。歌枕の{{place:袖の渡り|袖のわたり}}、{{place:尾駁の牧|尾ぶちの牧}}、まのの萱はらなどを遠目に見やりながら、はるかに続く北上川の長い堤を歩いて行く。見るからに心細くなるような細長い沼に沿って進み、{{place:登米|戸伊麻}}という宿場に一泊して、ようやく{{place:平泉|平泉}}に到着した。松島から平泉までの道のりは、およそ二十余里ほどであったと思われる。", "english_tagged": "On the twelfth day, setting our hearts on {{place:平泉|Hiraizumi}} and asking after famous places we had heard of such as the {{place:姉歯の松|Pine of Aneha}} and the {{place:緒絶の橋|Bridge of Odae}}, we followed a track where human footprints were few and only {{special:雉兎蕘蕘|pheasant-hunters and woodcutters}} passed back and forth; unable to tell which way to turn, we finally lost our road altogether and came out at a port town called {{place:石巻|Ishinomaki}}. Across the sea we gazed out toward {{place:金華山|Mount Kinkasan}}, celebrated in Yakamochi's ancient verse presented to the throne on how '{{special:こがね花咲|flowers of gold have bloomed}} in the hills of Michinoku,' while hundreds of merchant ships gathered in the bay and houses crowded every inch of ground, sending up a continuous haze of kitchen smoke. Marveling that we had unexpectedly come to such a bustling place, we tried to rent a room, yet not a single person would give us lodging. At last we managed to pass the night in a poor little cottage, and at daybreak we set out again, wandering along unfamiliar roads. Glancing from afar at the poetic sites of {{place:袖の渡り|Sode no Watari}}, {{place:尾駁の牧|Obuchi Pastures}}, and the reed plains of Mano, we walked along an endlessly stretching embankment. Following the edge of a dreary, narrow marsh, we spent a night at a post town called {{place:登米|Toima}} and finally reached {{place:平泉|Hiraizumi}}. The distance between them seemed a little over twenty leagues."}, {"id": "v1_p20_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十、平泉", "para_index": 20, "type": "本文", "verse": {"genre": "haiku", "l1": "夏草や", "l2": "兵どもが", "l3": "夢の跡", "author": "松尾芭蕉", "bg_theme": "hiraizumi_natsukusa", "bg_path": "shortliterature/bg_hiraizumi_natsukusa.jpg", "bg_title": "🌿 平泉・高館の夏草と北上川（第20句専用描き下ろし背景）"}, "raw_text": "三代の栄耀一睡の中にして、大門の跡は一里こなたに有。秀衡が跡は田野に成て、金鶏山のみ形を残す。先高館にのぼれば、北上川、南部より流るゝ大河也。衣川は、和泉が城をめぐりて、高館の下にて大河に落入。康衡等が旧跡は、衣が関を隔て、南部口をさし堅め、夷をふせぐとみえたり。偖も義臣すぐつて此城にこもり、功名一時の叢となる。「国破れて山河あり、城春にして草青みたり」と、笠打敷て、時のうつるまで泪を落し侍りぬ。夏草や兵どもが夢の跡。", "kakikudashi": "三代の栄耀一睡の中にして、大門の跡は一里こなたにあり。秀衡が跡は田野になりて、金鶏山のみ形を残す。まづ高館にのぼれば、北上川、南部より流るる大河なり。衣川は、和泉が城をめぐりて、高館の下にて大河に落ち入る。康衡らが旧跡は、衣が関を隔てて、南部口をさし堅め、夷をふせぐと見えたり。さても義臣すぐりてこの城にこもり、功名一時の叢となる。「国破れて山河あり、城春にして草青みたり」と、笠うち敷きて、時のうつるまで泪を落とし侍りぬ。夏草や兵どもが夢の跡。", "translation": "奥州藤原氏三代百年の栄華もほんのひと眠りの夢のうちに消え去り、かつての総門であった大門の跡は現在地よりも一里ほど手前に残っている。三代秀衡の栄えた居館の跡はすっかり田や野原と化してしまい、ただ人工の築山である金鶏山だけが往時の姿をとどめている。まず源義経が最期を遂げた高館に登って見渡すと、眼下の北上川ははるか北の南部領から流れてくる大河である。また衣川は、忠臣・和泉三郎忠衡の居城であった和泉が城のまわりを巡り流れて、この高館のすぐ下で北上川の大河に流れ込んでいる。康衡らの館の旧跡は、衣が関を間に挟んで北の南部口を厳重に固め、北方の蝦夷を防ぐ構えであったと見える。それにしても、義経をお守りした忠義の臣下たちがえりすぐってこの高館に立てこもり、死力を尽くして戦った武勲や功名も、今ではただ一時の草むらと化してしまった。杜甫の詩に「国破れて山河あり、城春にして草青みたり」と詠まれたそのままの情景に、私は旅笠を地面に敷いて腰を下ろし、時の移るのも忘れて涙を流し続けた。夏草や兵どもが夢の跡――今ここに生い茂る夏草よ、かつて命を賭して戦った武将たちの栄華と悲壮な夢の跡なのだ。", "persons": "藤原秀衡,藤原泰衡", "places": "金鶏山,高館,北上川,南部,衣川,和泉が城,衣が関", "era_year": "元禄二年五月十三日", "source_book": "", "keywords": "三代の栄耀,国破れて山河あり", "raw_tagged": "{{special:三代の栄耀|三代の栄耀}}一睡の中にして、大門の跡は一里こなたに有。{{person:藤原秀衡|秀衡}}が跡は田野に成て、{{place:金鶏山|金鶏山}}のみ形を残す。先{{place:高館|高館}}にのぼれば、{{place:北上川|北上川}}、{{place:南部|南部}}より流るゝ大河也。{{place:衣川|衣川}}は、{{place:和泉が城|和泉が城}}をめぐりて、{{place:高館|高館}}の下にて大河に落入。{{person:藤原泰衡|康衡}}等が旧跡は、{{place:衣が関|衣が関}}を隔て、{{place:南部|南部口}}をさし堅め、夷をふせぐとみえたり。偖も義臣すぐつて此城にこもり、功名一時の叢となる。「{{special:国破れて山河あり|国破れて山河あり}}、城春にして草青みたり」と、笠打敷て、時のうつるまで泪を落し侍りぬ。夏草や兵どもが夢の跡。", "kakikudashi_tagged": "{{special:三代の栄耀|三代の栄耀}}一睡の中にして、大門の跡は一里こなたにあり。{{person:藤原秀衡|秀衡}}が跡は田野になりて、{{place:金鶏山|金鶏山}}のみ形を残す。まづ{{place:高館|高館}}にのぼれば、{{place:北上川|北上川}}、{{place:南部|南部}}より流るる大河なり。{{place:衣川|衣川}}は、{{place:和泉が城|和泉が城}}をめぐりて、{{place:高館|高館}}の下にて大河に落ち入る。{{person:藤原泰衡|康衡}}らが旧跡は、{{place:衣が関|衣が関}}を隔てて、{{place:南部|南部口}}をさし堅め、夷をふせぐと見えたり。さても義臣すぐりてこの城にこもり、功名一時の叢となる。「{{special:国破れて山河あり|国破れて山河あり}}、城春にして草青みたり」と、笠うち敷きて、時のうつるまで泪を落とし侍りぬ。夏草や兵どもが夢の跡。", "translation_tagged": "奥州藤原氏三代百年の栄華もほんのひと眠りの夢のうちに消え去り、かつての総門であった大門の跡は現在地よりも一里ほど手前に残っている。三代{{person:藤原秀衡|秀衡}}の栄えた居館の跡はすっかり田や野原と化してしまい、ただ人工の築山である{{place:金鶏山|金鶏山}}だけが往時の姿をとどめている。まず源義経が最期を遂げた{{place:高館|高館}}に登って見渡すと、眼下の{{place:北上川|北上川}}ははるか北の{{place:南部|南部}}領から流れてくる大河である。また{{place:衣川|衣川}}は、忠臣・和泉三郎忠衡の居城であった{{place:和泉が城|和泉が城}}のまわりを巡り流れて、この{{place:高館|高館}}のすぐ下で北上川の大河に流れ込んでいる。{{person:藤原泰衡|康衡}}らの館の旧跡は、{{place:衣が関|衣が関}}を間に挟んで北の{{place:南部|南部口}}を厳重に固め、北方の蝦夷を防ぐ構えであったと見える。それにしても、義経をお守りした忠義の臣下たちがえりすぐってこの高館に立てこもり、死力を尽くして戦った武勲や功名も、今ではただ一時の草むらと化してしまった。杜甫の詩に「{{special:国破れて山河あり|国破れて山河あり}}、城春にして草青みたり」と詠まれたそのままの情景に、私は旅笠を地面に敷いて腰を下ろし、時の移るのも忘れて涙を流し続けた。夏草や兵どもが夢の跡――今ここに生い茂る夏草よ、かつて命を賭して戦った武将たちの栄華と悲壮な夢の跡なのだ。", "english_tagged": "The {{special:三代の栄耀|glory of three generations}} of the Fujiwara clan passed like a single snatch of sleep, and the ruins of the Great Outer Gate lie one league before the town. Where {{person:藤原秀衡|Hidehira}}'s mansion once stood has turned into rice paddies and open fields, leaving only the artificial hill of {{place:金鶏山|Mount Kinkei}} to preserve its ancient shape. Climbing first to {{place:高館|Takadachi}}—the High Pavilion where Yoshitsune met his end—we saw that the {{place:北上川|Kitakami River}} is a mighty river flowing down from the {{place:南部|Nanbu}} region in the north. The {{place:衣川|Koromo River}} winds around {{place:和泉が城|Izumi Castle}} and empties into the great river just below {{place:高館|Takadachi}}. The former stronghold of {{person:藤原泰衡|Yasuhira}} and his kin stood beyond the {{place:衣が関|Koromo Barrier}}, guarding the {{place:南部|Nanbu entrance}} to ward off the northern Ezo tribes. And here a chosen band of loyal retainers shut themselves up inside this castle, only for their valor and renown to turn in an instant into a tangle of wild grass. Recalling Tu Fu's lines—'{{special:国破れて山河あり|The state is shattered, yet mountains and rivers remain}}; spring comes to the castle, and the grass grows green'—I spread my sedge hat upon the ground and sat weeping, oblivious to the passing of time. \"Summer grasses— / all that remains of the dreams / of ancient warriors.\""}, {"id": "v1_p20_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十、平泉", "para_index": 20, "type": "発句・注", "verse": {"genre": "haiku", "l1": "卯の花に", "l2": "兼房みゆる", "l3": "白毛かな", "author": "河合曾良", "bg_theme": "hiraizumi_kanefusa", "bg_path": "shortliterature/bg_hiraizumi_kanefusa.jpg", "bg_title": "🤍 平泉・高館の卯の花と老武者兼房の白髪（第21句専用描き下ろし背景）"}, "raw_text": "卯の花に兼房みゆる白毛かな　曾良。", "kakikudashi": "卯の花に兼房みゆる白毛かな 曾良。", "translation": "高館に真っ白く咲き乱れる卯の花を見ていると、白髪を振り乱して義経のために奮戦し壮烈な討死を遂げた老武者・兼房の姿が目に浮かぶようであることよ、と曾良が詠んだ。", "persons": "兼房,曾良", "places": "", "era_year": "元禄二年五月十三日", "source_book": "", "keywords": "卯の花", "raw_tagged": "{{special:卯の花|卯の花}}に{{person:兼房|兼房}}みゆる白毛かな　{{person:曾良|曾良}}。", "kakikudashi_tagged": "{{special:卯の花|卯の花}}に{{person:兼房|兼房}}みゆる白毛かな {{person:曾良|曾良}}。", "translation_tagged": "高館に真っ白く咲き乱れる{{special:卯の花|卯の花}}を見ていると、白髪を振り乱して義経のために奮戦し壮烈な討死を遂げた老武者・{{person:兼房|兼房}}の姿が目に浮かぶようであることよ、と{{person:曾良|曾良}}が詠んだ。", "english_tagged": "\"In the white {{special:卯の花|deutzia}}, / old {{person:兼房|Kanefusa}} seems to stand— / locks of snowy hair!\" — {{person:曾良|Sora}}."}, {"id": "v1_p20_3", "volume": 1, "book": "おくのほそ道", "section_title": "二十、平泉", "para_index": 20, "type": "発句・注", "verse": {"genre": "haiku", "l1": "五月雨の", "l2": "降のこしてや", "l3": "光堂", "author": "松尾芭蕉", "bg_theme": "hiraizumi_hikarido", "bg_path": "shortliterature/bg_hiraizumi_hikarido.jpg", "bg_title": "✨ 平泉・五月雨の中尊寺金色堂（第22句専用描き下ろし背景）"}, "raw_text": "かねて耳驚したる二堂開帳す。経堂は三将の像を残し、光堂は三代の棺を納め、三尊の仏を安置す。七宝散うせて、珠の扉風にやぶれ、金の柱霜雪に朽て、既頽廃空虚の叢と成べきを、四面新に囲て、甍を覆て風雨を凌。暫時千歳の記念とはなれり。五月雨の降のこしてや光堂。", "kakikudashi": "かねて耳驚かしたる二堂開帳す。経堂は三将の像を残し、光堂は三代の棺を納め、三尊の仏を安置す。七宝散りうせて、珠の扉風にやぶれ、金の柱霜雪に朽ちて、すでに頽廃空虚の叢となるべきを、四面新たに囲みて、甍を覆ひて風雨を凌ぐ。暫時千歳の記念とはなれり。五月雨の降りのこしてや光堂。", "translation": "続いて中尊寺に参詣すると、かねてよりその噂を聞いて耳を驚かせていた二つの御堂がちょうど開帳されていた。経堂には清衡・基衡・秀衡の三将の像が残り、光堂には藤原三代の棺を須弥壇の中に納め、阿弥陀三尊の仏像を安置している。堂を飾っていた七宝の宝玉は散り失せ、螺鈿の扉は風に破れ、金箔の柱も幾星霜の霜や雪に朽ち果てて、すんでのところで崩れ果てて何もない草むらとなってしまうところであったが、先年その四方を新たに覆堂で囲み、屋根を覆って風雨をしのぐように守られた。こうしてしばらくの間、千年前の尊い形見として後の世まで姿をとどめることとなったのである。五月雨の降りのこしてや光堂――幾百年の五月雨がすべてを朽ち果てさせるなかで、この光堂だけは尊さに遠慮して降り残したのであろうか、今もなお金色に輝いている。", "persons": "", "places": "光堂", "era_year": "元禄二年五月十三日", "source_book": "", "keywords": "三尊の仏", "raw_tagged": "かねて耳驚したる二堂開帳す。{{place:光堂|経堂}}は三将の像を残し、{{place:光堂|光堂}}は三代の棺を納め、{{special:三尊の仏|三尊の仏}}を安置す。七宝散うせて、珠の扉風にやぶれ、金の柱霜雪に朽て、既頽廃空虚の叢と成べきを、四面新に囲て、甍を覆て風雨を凌。暫時千歳の記念とはなれり。五月雨の降のこしてや{{place:光堂|光堂}}。", "kakikudashi_tagged": "かねて耳驚かしたる二堂開帳す。{{place:光堂|経堂}}は三将の像を残し、{{place:光堂|光堂}}は三代の棺を納め、{{special:三尊の仏|三尊の仏}}を安置す。七宝散りうせて、珠の扉風にやぶれ、金の柱霜雪に朽ちて、すでに頽廃空虚の叢となるべきを、四面新たに囲みて、甍を覆ひて風雨を凌ぐ。暫時千歳の記念とはなれり。五月雨の降りのこしてや{{place:光堂|光堂}}。", "translation_tagged": "続いて中尊寺に参詣すると、かねてよりその噂を聞いて耳を驚かせていた二つの御堂がちょうど開帳されていた。{{place:光堂|経堂}}には清衡・基衡・秀衡の三将の像が残り、{{place:光堂|光堂}}には藤原三代の棺を須弥壇の中に納め、阿弥陀{{special:三尊の仏|三尊の仏}}像を安置している。堂を飾っていた七宝の宝玉は散り失せ、螺鈿の扉は風に破れ、金箔の柱も幾星霜の霜や雪に朽ち果てて、すんでのところで崩れ果てて何もない草むらとなってしまうところであったが、先年その四方を新たに覆堂で囲み、屋根を覆って風雨をしのぐように守られた。こうしてしばらくの間、千年前の尊い形見として後の世まで姿をとどめることとなったのである。五月雨の降りのこしてや{{place:光堂|光堂}}――幾百年の五月雨がすべてを朽ち果てさせるなかで、この{{place:光堂|光堂}}だけは尊さに遠慮して降り残したのであろうか、今もなお金色に輝いている。", "english_tagged": "The two temple halls whose fame had long amazed our ears were open for viewing. The {{place:光堂|Sutra Hall}} preserves the statues of the three Fujiwara generals, while the {{place:光堂|Hall of Light}} enshrines the coffins of the three generations and houses the {{special:三尊の仏|Amida Triad}}. Their seven treasures had scattered and vanished, their mother-of-pearl doors were battered by the wind, and their gilded pillars were rotting from frost and snow; just as the hall was about to crumble into an empty thicket of ruins, all four sides were newly enclosed within an outer shelter and roofed over to keep out the wind and rain. Thus for a time to come it has been preserved as a memorial of a thousand years. \"Have the fifth-moon rains / spared you alone untouched— / {{place:光堂|Shining Hall of Gold}}?\""}, {"id": "v1_p21_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十一、岩手の里・尿前の関", "para_index": 21, "type": "発句・注", "verse": {"genre": "haiku", "l1": "蚤虱", "l2": "馬の尿する", "l3": "枕もと", "author": "松尾芭蕉", "bg_theme": "shitomae_nomishirami", "bg_path": "shortliterature/bg_shitomae_nomishirami.jpg", "bg_title": "🌧️ 尿前の関・風雨の山中封人の家（第23句専用描き下ろし背景）"}, "raw_text": "南部道遥にみやりて、岩手の里に宿る。小黒崎・みつの小島を過て、なるごの湯より尿前の関にかゝりて、出羽の国に越んとす。此路、旅人稀なる処なれば、関守にあやしめられて、漸として関をこす。大山をのぼるに、日既暮ければ、封人の家を見かけて舎をもとむ。三日風雨あれて、よしなき山中に逗留す。蚤虱馬の尿する枕もと。", "kakikudashi": "南部道遥かに見やりて、岩手の里に宿る。小黒崎・みつの小島を過ぎて、なるごの湯より尿前の関にかかりて、出羽の国に越えんとす。この路、旅人稀なる処なれば、関守にあやしめられて、やうやくとして関を越す。大山をのぼるに、日すでに暮れければ、封人の家を見かけて舎をもとむ。三日風雨あれて、よしなき山中に逗留す。蚤虱馬の尿する枕もと。", "translation": "平泉から北へ続く南部道をはるか遠くに見やりながら引き返し、岩手の里に宿をとった。そこから歌枕の小黒崎やみつの小島を通り過ぎ、鳴子の湯を経て尿前の関にさしかかり、山を越えて出羽の国へ入ろうとした。この街道は旅人の通行がめったにない山道であったため、関所の番人に怪しまれて厳しい取り調べを受け、ようやくのことで関所を通ることができた。そこから大きな山を登って行くうちに、すでに日が暮れてしまったので、国境を守る封人の家を見つけて一夜の宿を請うた。ところが三日間にわたって激しい風雨が吹き荒れたため、思いがけずこの山深い一軒家に足止めされて滞在することとなった。蚤虱馬の尿する枕もと――蚤や虱に攻められるばかりか、すぐ枕元の土間では飼われている馬が音を立てて尿をするという、なんともすさまじい山家の旅寝であることよ。", "persons": "", "places": "南部,岩手の里,小黒崎,みつの小島,鳴子の湯,尿前の関,出羽（象潟・出羽三山）圏,山中温泉", "era_year": "元禄二年五月十四日〜十六日", "source_book": "", "keywords": "封人", "raw_tagged": "{{place:南部|南部道}}遥にみやりて、{{place:岩手の里|岩手の里}}に宿る。{{place:小黒崎|小黒崎}}・{{place:みつの小島|みつの小島}}を過て、{{place:鳴子の湯|なるごの湯}}より{{place:尿前の関|尿前の関}}にかゝりて、{{place:出羽（象潟・出羽三山）圏|出羽}}の国に越んとす。此路、旅人稀なる処なれば、関守にあやしめられて、漸として関をこす。大山をのぼるに、日既暮ければ、{{office:封人|封人}}の家を見かけて舎をもとむ。三日風雨あれて、よしなき{{place:山中温泉|山中}}に逗留す。蚤虱馬の尿する枕もと。", "kakikudashi_tagged": "{{place:南部|南部道}}遥かに見やりて、{{place:岩手の里|岩手の里}}に宿る。{{place:小黒崎|小黒崎}}・{{place:みつの小島|みつの小島}}を過ぎて、{{place:鳴子の湯|なるごの湯}}より{{place:尿前の関|尿前の関}}にかかりて、{{place:出羽（象潟・出羽三山）圏|出羽}}の国に越えんとす。この路、旅人稀なる処なれば、関守にあやしめられて、やうやくとして関を越す。大山をのぼるに、日すでに暮れければ、{{office:封人|封人}}の家を見かけて舎をもとむ。三日風雨あれて、よしなき{{place:山中温泉|山中}}に逗留す。蚤虱馬の尿する枕もと。", "translation_tagged": "平泉から北へ続く{{place:南部|南部道}}をはるか遠くに見やりながら引き返し、{{place:岩手の里|岩手の里}}に宿をとった。そこから歌枕の{{place:小黒崎|小黒崎}}や{{place:みつの小島|みつの小島}}を通り過ぎ、{{place:鳴子の湯|鳴子の湯}}を経て{{place:尿前の関|尿前の関}}にさしかかり、山を越えて{{place:出羽（象潟・出羽三山）圏|出羽}}の国へ入ろうとした。この街道は旅人の通行がめったにない山道であったため、関所の番人に怪しまれて厳しい取り調べを受け、ようやくのことで関所を通ることができた。そこから大きな山を登って行くうちに、すでに日が暮れてしまったので、国境を守る{{office:封人|封人}}の家を見つけて一夜の宿を請うた。ところが三日間にわたって激しい風雨が吹き荒れたため、思いがけずこの山深い一軒家に足止めされて滞在することとなった。蚤虱馬の尿する枕もと――蚤や虱に攻められるばかりか、すぐ枕元の土間では飼われている馬が音を立てて尿をするという、なんともすさまじい山家の旅寝であることよ。", "english_tagged": "Gazing far off down the {{place:南部|Nanbu road}}, we turned back and lodged at the village of {{place:岩手の里|Iwate}}. Passing {{place:小黒崎|Ogurosaki}} and {{place:みつの小島|Mitsu no Kojima}}, from the hot springs of {{place:鳴子の湯|Narugo}} we approached the {{place:尿前の関|Barrier of Shitomae}}, intending to cross over into the province of {{place:出羽（象潟・出羽三山）圏|Dewa}}. Because travelers are rare along this mountain road, we were eyed with suspicion by the barrier guards and only with difficulty managed to pass through the gate. As we climbed the great mountain, the sun had already set, so spying the house of a {{office:封人|border guard}} we begged for shelter for the night. For three days a fierce storm of wind and rain raged outside, forcing us to stay on in those dreary {{place:山中温泉|mountains}}. \"Fleas and lice biting— / and a horse staling loudly / right beside my pillow.\""}, {"id": "v1_p21_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十一、岩手の里・尿前の関", "para_index": 21, "type": "本文", "verse": null, "raw_text": "あるじの云、是より出羽の国に、大山を隔て、道さだかならず。道しるべの人を頼て越べきよしを申。さらばと云て、人を頼侍れば、究竟の若者、反脇指をよこたへ、樫の杖を携て、我々が先に立て行。けふこそ必あやうきめにもあふべき日なれと、辛き思ひをなして、後について行。あるじの云にたがはず、高山森々として、一鳥声きかず、木の下闇茂りあひて、夜る行がごとし。雲端につちふる心地して、篠の中ふみ分ふみ分、水をわたり、岩に蹶て、肌につめたき汗を流して、最上の庄に出づ。かの案内せしおのこの云やう、「此みち必不用の事有。恙なうをくりまいらせて、仕合したり」と、よろこびてわかれぬ。跡に聞てさへ、胸とゞろくのみ也。", "kakikudashi": "あるじの云ふ、これより出羽の国に、大山を隔てて、道さだかならず。道しるべの人を頼みて越ゆべきよしを申す。さらばと云ひて、人を頼み侍れば、究竟の若者、反脇指をよこたへ、樫の杖を携へて、我々が先に立ちて行く。けふこそ必ずあやうきめにもあふべき日なれと、辛き思ひをなして、後について行く。あるじの云ふにたがはず、高山森々として、一鳥声きかず、木の下闇茂りあひて、夜行くがごとし。雲端につちふる心地して、篠の中踏み分け踏み分け、水をわたり、岩に蹶きて、肌につめたき汗を流して、最上の庄に出づ。かの案内せしおのこの云ふやう、「この道必ず不用の事あり。つつがなう送りまいらせて、仕合せしたり」と、よろこびて別れぬ。跡に聞きてさへ、胸とどろくのみなり。", "translation": "宿の主人が言うには、ここから出羽の国へ出るには大きな山が立ちはだかっていて、道もはっきりしない。道案内の人を雇って峠を越えるのがよいと勧めてくれた。それならばというわけで案内人を頼んだところ、見るからに屈強な若者が、反りの強い脇差を腰に差し、太い樫の杖を携えて、私たちの先頭に立って歩き出した。今日こそきっと山賊にでも襲われて命の危険に遭う日なのであろうかと、生きた心地もしない不安な思いで若者の後ろについて行った。主人が言った通り、高い山は深々と木々がうっそうと茂り、一羽の鳥の鳴き声すら聞こえず、梢が重なり合う木の下闇はまるで真夜中に歩いているかのようである。杜甫の詩にある「雲端に土降る」とはこのようなことかと思われる薄気味悪い山中を、背丈ほどの篠竹の藪をひたすら踏み分け踏み分け、渓流を渡り、岩角につまずいて、肌に冷たい脂汗を流しながら、ようやく出羽の国の最上の庄へと抜け出た。すると案内してくれたあの若者が、「この山道では必ずと言ってよいほど追剥などの物騒な出来事があるのです。今日は何事もなく無事にお送り申し上げることができて、本当に幸いでした」と喜んで別れて行った。すべてが終わった後になってその言葉を聞いてさえ、心臓が激しく波打つばかりであった。", "persons": "", "places": "出羽（象潟・出羽三山）圏,最上の庄", "era_year": "元禄二年五月十七日", "source_book": "", "keywords": "", "raw_tagged": "あるじの云、是より{{place:出羽（象潟・出羽三山）圏|出羽}}の国に、大山を隔て、道さだかならず。道しるべの人を頼て越べきよしを申。さらばと云て、人を頼侍れば、究竟の若者、反脇指をよこたへ、樫の杖を携て、我々が先に立て行。けふこそ必あやうきめにもあふべき日なれと、辛き思ひをなして、後について行。あるじの云にたがはず、高山森々として、一鳥声きかず、木の下闇茂りあひて、夜る行がごとし。雲端につちふる心地して、篠の中ふみ分ふみ分、水をわたり、岩に蹶て、肌につめたき汗を流して、{{place:最上の庄|最上の庄}}に出づ。かの案内せしおのこの云やう、「此みち必不用の事有。恙なうをくりまいらせて、仕合したり」と、よろこびてわかれぬ。跡に聞てさへ、胸とゞろくのみ也。", "kakikudashi_tagged": "あるじの云ふ、これより{{place:出羽（象潟・出羽三山）圏|出羽}}の国に、大山を隔てて、道さだかならず。道しるべの人を頼みて越ゆべきよしを申す。さらばと云ひて、人を頼み侍れば、究竟の若者、反脇指をよこたへ、樫の杖を携へて、我々が先に立ちて行く。けふこそ必ずあやうきめにもあふべき日なれと、辛き思ひをなして、後について行く。あるじの云ふにたがはず、高山森々として、一鳥声きかず、木の下闇茂りあひて、夜行くがごとし。雲端につちふる心地して、篠の中踏み分け踏み分け、水をわたり、岩に蹶きて、肌につめたき汗を流して、{{place:最上の庄|最上の庄}}に出づ。かの案内せしおのこの云ふやう、「この道必ず不用の事あり。つつがなう送りまいらせて、仕合せしたり」と、よろこびて別れぬ。跡に聞きてさへ、胸とどろくのみなり。", "translation_tagged": "宿の主人が言うには、ここから{{place:出羽（象潟・出羽三山）圏|出羽}}の国へ出るには大きな山が立ちはだかっていて、道もはっきりしない。道案内の人を雇って峠を越えるのがよいと勧めてくれた。それならばというわけで案内人を頼んだところ、見るからに屈強な若者が、反りの強い脇差を腰に差し、太い樫の杖を携えて、私たちの先頭に立って歩き出した。今日こそきっと山賊にでも襲われて命の危険に遭う日なのであろうかと、生きた心地もしない不安な思いで若者の後ろについて行った。主人が言った通り、高い山は深々と木々がうっそうと茂り、一羽の鳥の鳴き声すら聞こえず、梢が重なり合う木の下闇はまるで真夜中に歩いているかのようである。杜甫の詩にある「雲端に土降る」とはこのようなことかと思われる薄気味悪い山中を、背丈ほどの篠竹の藪をひたすら踏み分け踏み分け、渓流を渡り、岩角につまずいて、肌に冷たい脂汗を流しながら、ようやく出羽の国の{{place:最上の庄|最上の庄}}へと抜け出た。すると案内してくれたあの若者が、「この山道では必ずと言ってよいほど追剥などの物騒な出来事があるのです。今日は何事もなく無事にお送り申し上げることができて、本当に幸いでした」と喜んで別れて行った。すべてが終わった後になってその言葉を聞いてさえ、心臓が激しく波打つばかりであった。", "english_tagged": "Our host told us, \"From here into the province of {{place:出羽（象潟・出羽三山）圏|Dewa}}, a great mountain range stands in the way and the trail is indistinct, so you should hire a guide to lead you across.\" Agreeing at once, we hired a guide, who turned out to be a strapping young stalwart with a curved short-sword thrust in his sash and an oak staff in his hand; stepping out ahead of us, he led the way. Feeling certain that today would be the very day we met with some terrible peril, we followed behind him with heavy, anxious hearts. Just as our host had warned, the lofty mountains were dark and primeval, not a single bird's cry was to be heard, and the darkness beneath the interlocking boughs was as black as walking at dead of night. Feeling as though dust were raining down from the fringes of the clouds, we pushed our way again and again through thickets of dwarf bamboo, waded mountain streams, and stumbled over rocks, streaming with cold sweat until at last we emerged into the {{place:最上の庄|district of Mogami}}. The man who had guided us said, \"Along this trail something untoward happens almost without fail. I count myself lucky to have escorted you through safe and sound!\"—and with those joyful words he parted from us. Even hearing of the danger after it was over set our hearts pounding wildly in our chests."}, {"id": "v1_p22_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十二、尾花沢", "para_index": 22, "type": "発句・注", "verse": {"genre": "haiku", "l1": "涼しさを", "l2": "我宿にして", "l3": "ねまる也", "author": "松尾芭蕉", "bg_theme": "obanazawa_suzushisa", "bg_path": "shortliterature/bg_obanazawa_suzushisa.jpg", "bg_title": "🎐 尾花沢・清風邸の涼風と寛ぎの座敷（第24句専用描き下ろし背景）"}, "raw_text": "尾花沢にて清風と云者を尋ぬ。かれは富るものなれども、志いやしからず。都にも折々かよひて、さすがに旅の情をも知たれば、日比とゞめて、長途のいたはり、さまざまにもてなし侍る。涼しさを我宿にしてねまる也。", "kakikudashi": "尾花沢にて清風といふ者を尋ぬ。かれは富めるものなれども、志いやしからず。都にも折々通ひて、さすがに旅の情をも知りたれば、日頃とどめて、長途のいたはり、さまざまにもてなし侍る。涼しさを我宿にしてねまる也。", "translation": "尾花沢の宿場に着いて、鈴木清風という人物を訪ねた。彼は紅花商いで財を成した裕福な商人であるけれども、その志は少しも卑しくない風雅の人である。商用のため都へも折々に往復していて、さすがに旅のわびしさや旅人の心情をもよく理解していたので、私たちを何日も引き留めて、長い旅路の疲れをねぎらい、何かと心を尽くしてもてなしてくれた。涼しさを我宿にしてねまる也――この清風邸の心地よい涼しさをまるで自分の家のようにして、手足を伸ばしてくつろいで座っていることよ。", "persons": "鈴木清風", "places": "尾花沢,都", "era_year": "元禄二年五月十七日〜廿六日", "source_book": "", "keywords": "ねまる", "raw_tagged": "{{place:尾花沢|尾花沢}}にて{{person:鈴木清風|清風}}と云者を尋ぬ。かれは富るものなれども、志いやしからず。{{place:都|都}}にも折々かよひて、さすがに旅の情をも知たれば、日比とゞめて、長途のいたはり、さまざまにもてなし侍る。涼しさを我宿にして{{special:ねまる|ねまる也}}。", "kakikudashi_tagged": "{{place:尾花沢|尾花沢}}にて{{person:鈴木清風|清風}}といふ者を尋ぬ。かれは富めるものなれども、志いやしからず。{{place:都|都}}にも折々通ひて、さすがに旅の情をも知りたれば、日頃とどめて、長途のいたはり、さまざまにもてなし侍る。涼しさを我宿にして{{special:ねまる|ねまる也}}。", "translation_tagged": "{{place:尾花沢|尾花沢}}の宿場に着いて、{{person:鈴木清風|鈴木清風}}という人物を訪ねた。彼は紅花商いで財を成した裕福な商人であるけれども、その志は少しも卑しくない風雅の人である。商用のため{{place:都|都}}へも折々に往復していて、さすがに旅のわびしさや旅人の心情をもよく理解していたので、私たちを何日も引き留めて、長い旅路の疲れをねぎらい、何かと心を尽くしてもてなしてくれた。涼しさを我宿にして{{special:ねまる|ねまる也}}――この清風邸の心地よい涼しさをまるで自分の家のようにして、手足を伸ばしてくつろいで座っていることよ。", "english_tagged": "At {{place:尾花沢|Obanazawa}} we called upon a man named {{person:鈴木清風|Seifū}}. Though a man of wealth, his aspirations were far from vulgar. Traveling from time to time to the {{place:都|Capital}}, he well understood the loneliness of the road, and so he kept us as his guests for many days, soothing the weariness of our long journey and entertaining us with every kindness. \"Making the cool breeze / my very own home, here I / {{special:ねまる|sit and lounge at ease}}.\""}, {"id": "v1_p22_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十二、尾花沢", "para_index": 22, "type": "発句・注", "verse": {"genre": "haiku", "l1": "這出よ", "l2": "かひやが下の", "l3": "ひきの声", "author": "松尾芭蕉", "bg_theme": "obanazawa_hikigaeru", "bg_path": "shortliterature/bg_obanazawa_hikigaeru.jpg", "bg_title": "🐸 尾花沢・飼屋の煙と縁の下の蟾蜍（第25句専用描き下ろし背景）"}, "raw_text": "這出よかひやが下のひきの声。", "kakikudashi": "這ひ出でよかひやが下のひきの声。", "translation": "這ひ出でよかひやが下のひきの声――蚕を飼うかひやの縁の下でくぐもった声で鳴いているひきがえるよ、そんなに隠れていないでここへ這い出てこいよ。", "persons": "", "places": "", "era_year": "元禄二年五月", "source_book": "", "keywords": "かひや", "raw_tagged": "這出よ{{special:かひや|かひや}}が下のひきの声。", "kakikudashi_tagged": "這ひ出でよ{{special:かひや|かひや}}が下のひきの声。", "translation_tagged": "這ひ出でよ{{special:かひや|かひや}}が下のひきの声――蚕を飼う{{special:かひや|かひや}}の縁の下でくぐもった声で鳴いているひきがえるよ、そんなに隠れていないでここへ這い出てこいよ。", "english_tagged": "\"Crawl out and show yourself— / from beneath the {{special:かひや|silkworm shed}}, / voice of a great toad!\""}, {"id": "v1_p22_3", "volume": 1, "book": "おくのほそ道", "section_title": "二十二、尾花沢", "para_index": 22, "type": "発句・注", "verse": {"genre": "haiku", "l1": "まゆはきを", "l2": "俤にして", "l3": "紅粉の花", "author": "松尾芭蕉", "bg_theme": "obanazawa_benibana", "bg_path": "shortliterature/bg_obanazawa_benibana.jpg", "bg_title": "🌺 尾花沢・眉掃きの面影と最上紅花（第26句専用描き下ろし背景）"}, "raw_text": "まゆはきを俤にして紅粉の花。", "kakikudashi": "まゆはきを俤にして紅粉の花。", "translation": "まゆはきを俤にして紅粉の花――女性の化粧道具であるまゆはきの優しい面影をそのまま花姿に宿して、出羽の畑に美しく咲いている紅粉の花よ。", "persons": "", "places": "", "era_year": "元禄二年五月", "source_book": "", "keywords": "まゆはき,紅粉の花", "raw_tagged": "{{special:まゆはき|まゆはき}}を俤にして{{special:紅粉の花|紅粉の花}}。", "kakikudashi_tagged": "{{special:まゆはき|まゆはき}}を俤にして{{special:紅粉の花|紅粉の花}}。", "translation_tagged": "{{special:まゆはき|まゆはき}}を俤にして{{special:紅粉の花|紅粉の花}}――女性の化粧道具である{{special:まゆはき|まゆはき}}の優しい面影をそのまま花姿に宿して、出羽の畑に美しく咲いている{{special:紅粉の花|紅粉の花}}よ。", "english_tagged": "\"Calling to mind the / image of an {{special:まゆはき|eyebrow brush}}— / {{special:紅粉の花|safflower in bloom}}!\""}, {"id": "v1_p22_4", "volume": 1, "book": "おくのほそ道", "section_title": "二十二、尾花沢", "para_index": 22, "type": "発句・注", "verse": {"genre": "haiku", "l1": "蚕飼する", "l2": "人は古代の", "l3": "すがた哉", "author": "河合曾良", "bg_theme": "obanazawa_kogai", "bg_path": "shortliterature/bg_obanazawa_kogai.jpg", "bg_title": "🧺 尾花沢・蚕飼する人と古代の面影（第27句専用描き下ろし背景）"}, "raw_text": "蚕飼する人は古代のすがた哉　曾良。", "kakikudashi": "蚕飼する人は古代のすがた哉 曾良。", "translation": "蚕飼する人は古代のすがた哉――ここで蚕を飼って立ち働く人々の素朴な装いを見ていると、遠い神代や万葉のいにしえの人の姿がそのまま残っているようで奥ゆかしいことよ、と曾良が詠んだ。", "persons": "曾良", "places": "", "era_year": "元禄二年五月", "source_book": "", "keywords": "", "raw_tagged": "蚕飼する人は古代のすがた哉　{{person:曾良|曾良}}。", "kakikudashi_tagged": "蚕飼する人は古代のすがた哉 {{person:曾良|曾良}}。", "translation_tagged": "蚕飼する人は古代のすがた哉――ここで蚕を飼って立ち働く人々の素朴な装いを見ていると、遠い神代や万葉のいにしえの人の姿がそのまま残っているようで奥ゆかしいことよ、と{{person:曾良|曾良}}が詠んだ。", "english_tagged": "\"Those who tend silkworms / wear the very figure of / Japan's ancient age!\" — {{person:曾良|Sora}}."}, {"id": "v1_p23_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十三、立石寺", "para_index": 23, "type": "発句・注", "verse": {"genre": "haiku", "l1": "閑さや", "l2": "岩にしみ入", "l3": "蝉の声", "author": "松尾芭蕉", "bg_theme": "risshakuji_semi", "bg_path": "shortliterature/bg_risshakuji_semi.jpg", "bg_title": "⛰️ 立石寺（山寺）・奇岩の霊場と岩にしみ入る蝉の声（第28句専用描き下ろし背景）"}, "raw_text": "山形領に立石寺と云山寺あり。慈覚大師の開基にして、殊清閑の地也。一見すべきよし、人々のすゝむるに依て、尾花沢よりとつて返し、其間七里ばかり也。日いまだ暮ず。麓の坊に宿かり置て、山上の堂にのぼる。岩に巌を重て山とし、松柏年旧、土石老て苔滑に、岩上の院々扉を閉て、物の音きこえず。岸をめぐり、岩を這て、仏閣を拝し、佳景寂寞として心すみ行のみおぼゆ。閑さや岩にしみ入蝉の声。", "kakikudashi": "山形領に立石寺といふ山寺あり。慈覚大師の開基にして、殊に清閑の地なり。一見すべきよし、人々のすすむるに依りて、尾花沢よりとって返し、その間七里ばかりなり。日いまだ暮れず。麓の坊に宿かり置きて、山上の堂にのぼる。岩に巌を重ねて山とし、松柏年旧り、土石老いて苔滑らかに、岩上の院々扉を閉ぢて、物の音きこえず。岸をめぐり、岩を這ひて、仏閣を拝し、佳景寂寞として心すみ行くのみおぼゆ。閑さや岩にしみ入る蝉の声。", "translation": "山形領に立石寺という山寺がある。慈覚大師円仁が開山した古刹であって、とりわけ清らかで静寂な霊地である。ぜひ一目見ておくべきだと尾花沢の人々がしきりに勧めるので、尾花沢から南へ引き返して向かうことにしたが、その間の道のりは七里ほどである。到着した時には、日はまだ暮れていなかった。山の麓の宿坊に今宵の宿を借りて荷物を置いてから、山上の御堂へと登って行った。この山は巨岩の上にさらに大岩を積み重ねて山を成しており、松や檜は幾星霜を経て古び、土や石も老いさびて苔が滑らかにむし、岩の上の諸院はいずれも固く扉を閉ざして、何の物音も聞こえない。断崖の縁をめぐり、岩場を這うようにして数々の仏閣を拝んで回ると、素晴らしい風光がひっそりと静まり返っていて、ただ自分の心がどこまでも澄み渡っていくのを感じるばかりであった。閑さや岩にしみ入る蝉の声――あたりを領するこの深い静けさよ、鳴きしきる蝉の声が山寺の岩々に吸い込まれるように染み入っていく。", "persons": "慈覚大師", "places": "山形,立石寺,尾花沢", "era_year": "元禄二年五月廿七日", "source_book": "", "keywords": "", "raw_tagged": "{{place:山形|山形領}}に{{place:立石寺|立石寺}}と云{{place:立石寺|山寺}}あり。{{person:慈覚大師|慈覚大師}}の開基にして、殊清閑の地也。一見すべきよし、人々のすゝむるに依て、{{place:尾花沢|尾花沢}}よりとつて返し、其間七里ばかり也。日いまだ暮ず。麓の坊に宿かり置て、山上の堂にのぼる。岩に巌を重て山とし、松柏年旧、土石老て苔滑に、岩上の院々扉を閉て、物の音きこえず。岸をめぐり、岩を這て、仏閣を拝し、佳景寂寞として心すみ行のみおぼゆ。閑さや岩にしみ入蝉の声。", "kakikudashi_tagged": "{{place:山形|山形領}}に{{place:立石寺|立石寺}}といふ{{place:立石寺|山寺}}あり。{{person:慈覚大師|慈覚大師}}の開基にして、殊に清閑の地なり。一見すべきよし、人々のすすむるに依りて、{{place:尾花沢|尾花沢}}よりとって返し、その間七里ばかりなり。日いまだ暮れず。麓の坊に宿かり置きて、山上の堂にのぼる。岩に巌を重ねて山とし、松柏年旧り、土石老いて苔滑らかに、岩上の院々扉を閉ぢて、物の音きこえず。岸をめぐり、岩を這ひて、仏閣を拝し、佳景寂寞として心すみ行くのみおぼゆ。閑さや岩にしみ入る蝉の声。", "translation_tagged": "{{place:山形|山形領}}に{{place:立石寺|立石寺}}という{{place:立石寺|山寺}}がある。{{person:慈覚大師|慈覚大師円仁}}が開山した古刹であって、とりわけ清らかで静寂な霊地である。ぜひ一目見ておくべきだと{{place:尾花沢|尾花沢}}の人々がしきりに勧めるので、{{place:尾花沢|尾花沢}}から南へ引き返して向かうことにしたが、その間の道のりは七里ほどである。到着した時には、日はまだ暮れていなかった。山の麓の宿坊に今宵の宿を借りて荷物を置いてから、山上の御堂へと登って行った。この山は巨岩の上にさらに大岩を積み重ねて山を成しており、松や檜は幾星霜を経て古び、土や石も老いさびて苔が滑らかにむし、岩の上の諸院はいずれも固く扉を閉ざして、何の物音も聞こえない。断崖の縁をめぐり、岩場を這うようにして数々の仏閣を拝んで回ると、素晴らしい風光がひっそりと静まり返っていて、ただ自分の心がどこまでも澄み渡っていくのを感じるばかりであった。閑さや岩にしみ入る蝉の声――あたりを領するこの深い静けさよ、鳴きしきる蝉の声が山寺の岩々に吸い込まれるように染み入っていく。", "english_tagged": "In the {{place:山形|domain of Yamagata}} stands a {{place:立石寺|mountain temple}} called {{place:立石寺|Risshakuji}}. Founded by the Great Master {{person:慈覚大師|Jikaku}}, it is a place of singularly pure and tranquil stillness. Urged by everyone that we must not fail to see it, we turned back southward from {{place:尾花沢|Obanazawa}}, a distance of some seven leagues. The sun had not yet set when we arrived. After arranging lodging at a monastery at the foot of the mountain, we climbed to the halls on the summit. Boulders piled upon crags form the mountain itself; the pines and cypresses are ancient with years, the earth and stones are old and velvet with moss, and the temple halls atop the rocks keep their doors tightly shut, without a single sound to be heard. Winding along the cliff ledges and creeping over the boulders, we worshiped at the sacred halls; the magnificent scenery was hushed in such utter silence that I felt only my own heart growing ever clearer and more serene. \"Such utter stillness— / sinking deep into the rocks, / cries of cicadas.\""}, {"id": "v1_p24_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十四、最上川", "para_index": 24, "type": "本文", "verse": null, "raw_text": "最上川のらんとて、大石田と云所に日和を待。爰に古き俳諧の種こぼれて、忘れぬ花のむかしをしたひ、芦角一声の心をやはらげ、此道にさぐりあしゝて、新古ふた道にふみまよふといへども、みちしるべする人しなければと、わりなき一巻残しぬ。このたびの風流、爰に至れり。", "kakikudashi": "最上川乗らんとて、大石田といふ所に日和を待つ。ここに古き俳諧の種こぼれて、忘れぬ花のむかしを慕ひ、芦角一声の心をやはらげ、この道にさぐり足して、新古ふた道に踏み迷ふといへども、道しるべする人しなければと、わりなき一巻残しぬ。このたびの風流、ここに至れり。", "translation": "最上川を舟で下ろうとして、大石田という河岸の宿場で天候の回復を待った。この土地には古くから俳諧の種がこぼれ落ちて根づいており、人々は忘れがたい昔の花やかな風雅を慕い、辺境に響く芦角一声の調べのように日々の心を和らげ、手探りしながらこの俳諧の道を歩んでいるものの、新しい蕉風と古い談林風の二つの道のあいだで踏み迷っているけれども、正しく導いてくれる指導者がいないからと熱心に請われるままに、断りきれず歌仙一巻を巻き残した。このたびのみちのくの旅における風流の極みは、まさにこの地に窮まったと言えよう。", "persons": "", "places": "最上川,大石田", "era_year": "元禄二年五月廿八日〜六月朔日", "source_book": "", "keywords": "芦角一声", "raw_tagged": "{{place:最上川|最上川}}のらんとて、{{place:大石田|大石田}}と云所に日和を待。爰に古き俳諧の種こぼれて、忘れぬ花のむかしをしたひ、{{special:芦角一声|芦角一声}}の心をやはらげ、此道にさぐりあしゝて、新古ふた道にふみまよふといへども、みちしるべする人しなければと、わりなき一巻残しぬ。このたびの風流、爰に至れり。", "kakikudashi_tagged": "{{place:最上川|最上川}}乗らんとて、{{place:大石田|大石田}}といふ所に日和を待つ。ここに古き俳諧の種こぼれて、忘れぬ花のむかしを慕ひ、{{special:芦角一声|芦角一声}}の心をやはらげ、この道にさぐり足して、新古ふた道に踏み迷ふといへども、道しるべする人しなければと、わりなき一巻残しぬ。このたびの風流、ここに至れり。", "translation_tagged": "{{place:最上川|最上川}}を舟で下ろうとして、{{place:大石田|大石田}}という河岸の宿場で天候の回復を待った。この土地には古くから俳諧の種がこぼれ落ちて根づいており、人々は忘れがたい昔の花やかな風雅を慕い、辺境に響く{{special:芦角一声|芦角一声}}の調べのように日々の心を和らげ、手探りしながらこの俳諧の道を歩んでいるものの、新しい蕉風と古い談林風の二つの道のあいだで踏み迷っているけれども、正しく導いてくれる指導者がいないからと熱心に請われるままに、断りきれず歌仙一巻を巻き残した。このたびのみちのくの旅における風流の極みは、まさにこの地に窮まったと言えよう。", "english_tagged": "Intending to ride a boat down the {{place:最上川|Mogami River}}, we waited for fair weather at a river port called {{place:大石田|Ōishida}}. Here the seeds of old haikai poetry had fallen and taken root, and the locals longed for the unforgettable blossoms of the past, softening their hearts as if at the {{special:芦角一声|single note of a reed pipe}} in the frontier; though they groped their way along this poetic path, wavering between the new style and the old, they had no guide to show them the way, so at their earnest entreaty I left behind a scroll of linked verse. The poetic spirit of our present journey reached its fullness here."}, {"id": "v1_p24_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十四、最上川", "para_index": 24, "type": "発句・注", "verse": {"genre": "haiku", "l1": "五月雨を", "l2": "あつめて早し", "l3": "最上川", "author": "松尾芭蕉", "bg_theme": "mogamigawa_samidare", "bg_path": "shortliterature/bg_mogamigawa_samidare.jpg", "bg_title": "🌊 最上川・五月雨の急流と白糸の滝・仙人堂（第29句専用描き下ろし背景）"}, "raw_text": "最上川は、みちのくより出て、山形を水上とす。ごてん・はやぶさなど云おそろしき難所有。板敷山の北を流て、果は酒田の海に入。左右山覆ひ、茂みの中に船を下す。是に稲つみたるをや、いな船といふならし。白糸の滝は青葉の隙々に落ちて、仙人堂、岸に臨で立。水みなぎつて舟あやうし。五月雨をあつめて早し最上川。", "kakikudashi": "最上川は、みちのくより出でて、山形を水上とす。ごてん・はやぶさなどいふおそろしき難所あり。板敷山の北を流れて、果ては酒田の海に入る。左右山覆ひ、茂みの中に船を下す。これに稲積みたるをや、いな船といふならし。白糸の滝は青葉の隙々に落ちて、仙人堂、岸に臨みて立つ。水みなぎりて舟あやうし。五月雨をあつめて早し最上川。", "translation": "最上川は、みちのくとの国境の山々から流れ出て、山形領を上流のみなもととしている。その途中には、ごてんやはやぶさなどと呼ばれる恐ろしい急流の難所がある。やがて板敷山の北側を流れ抜けて、最後は酒田の海へと注ぎ込んでいる。左右から険しい山々が覆いかぶさるように迫り、うっそうと茂る木々の間を縫うようにして舟を下していく。この川舟に刈り取った稲束を積み込んだものを、古歌に詠まれた名高い「いな船」と呼ぶのであろう。白糸の滝は瑞々しい青葉の隙間から白い糸を引くように流れ落ち、源義経ゆかりの仙人堂が川岸に臨んでひっそりと立っている。降り続いた雨で川の水が満々とみなぎりあふれ、激流に揺れる舟は今にも転覆しそうなほど危うい。五月雨をあつめて早し最上川――出羽一国の五月雨をすべて一筋にかき集めて、なんとすさまじい速さで流れ下る最上川であることよ。", "persons": "", "places": "最上川,奥州（白河・松島）圏,山形,碁点,隼,板敷山,酒田,白糸の滝,仙人堂", "era_year": "元禄二年六月二日", "source_book": "", "keywords": "いな船", "raw_tagged": "{{place:最上川|最上川}}は、{{place:奥州（白河・松島）圏|みちのく}}より出て、{{place:山形|山形}}を水上とす。{{place:碁点|ごてん}}・{{place:隼|はやぶさ}}など云おそろしき難所有。{{place:板敷山|板敷山}}の北を流て、果は{{place:酒田|酒田の海}}に入。左右山覆ひ、茂みの中に船を下す。是に稲つみたるをや、{{special:いな船|いな船}}といふならし。{{place:白糸の滝|白糸の滝}}は青葉の隙々に落ちて、{{place:仙人堂|仙人堂}}、岸に臨で立。水みなぎつて舟あやうし。五月雨をあつめて早し{{place:最上川|最上川}}。", "kakikudashi_tagged": "{{place:最上川|最上川}}は、{{place:奥州（白河・松島）圏|みちのく}}より出でて、{{place:山形|山形}}を水上とす。{{place:碁点|ごてん}}・{{place:隼|はやぶさ}}などいふおそろしき難所あり。{{place:板敷山|板敷山}}の北を流れて、果ては{{place:酒田|酒田の海}}に入る。左右山覆ひ、茂みの中に船を下す。これに稲積みたるをや、{{special:いな船|いな船}}といふならし。{{place:白糸の滝|白糸の滝}}は青葉の隙々に落ちて、{{place:仙人堂|仙人堂}}、岸に臨みて立つ。水みなぎりて舟あやうし。五月雨をあつめて早し{{place:最上川|最上川}}。", "translation_tagged": "{{place:最上川|最上川}}は、{{place:奥州（白河・松島）圏|みちのく}}との国境の山々から流れ出て、{{place:山形|山形領}}を上流のみなもととしている。その途中には、{{place:碁点|ごてん}}や{{place:隼|はやぶさ}}などと呼ばれる恐ろしい急流の難所がある。やがて{{place:板敷山|板敷山}}の北側を流れ抜けて、最後は{{place:酒田|酒田の海}}へと注ぎ込んでいる。左右から険しい山々が覆いかぶさるように迫り、うっそうと茂る木々の間を縫うようにして舟を下していく。この川舟に刈り取った稲束を積み込んだものを、古歌に詠まれた名高い「{{special:いな船|いな船}}」と呼ぶのであろう。{{place:白糸の滝|白糸の滝}}は瑞々しい青葉の隙間から白い糸を引くように流れ落ち、源義経ゆかりの{{place:仙人堂|仙人堂}}が川岸に臨んでひっそりと立っている。降り続いた雨で川の水が満々とみなぎりあふれ、激流に揺れる舟は今にも転覆しそうなほど危うい。五月雨をあつめて早し{{place:最上川|最上川}}――出羽一国の五月雨をすべて一筋にかき集めて、なんとすさまじい速さで流れ下る{{place:最上川|最上川}}であることよ。", "english_tagged": "The {{place:最上川|Mogami River}} rises in {{place:奥州（白河・松島）圏|Michinoku}} and has its upper reaches in {{place:山形|Yamagata}}. Along its course lie terrifying rapids called {{place:碁点|Goten}} and {{place:隼|Hayabusa}}. Flowing north of {{place:板敷山|Mount Itajiki}}, it empties at last into the {{place:酒田|sea at Sakata}}. Mountains press in from left and right, and the boats shoot down through the thick foliage. It is doubtless these river craft laden with rice sheaves that the old poems call '{{special:いな船|rice-boats}}.' The {{place:白糸の滝|Shiraito Waterfall}}—Waterfall of White Threads—plunges through gaps in the green leaves, and the {{place:仙人堂|Hermit's Hall}} stands poised at the water's edge. The river was swollen to the brim, and our boat was in perilous danger. \"Gathering all the / rains of the fifth moon, how swift— / the {{place:最上川|Mogami River}}!\""}, {"id": "v1_p25_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十五、出羽三山", "para_index": 25, "type": "発句・注", "verse": {"genre": "haiku", "l1": "有難や", "l2": "雪をかほらす", "l3": "南谷", "author": "松尾芭蕉", "bg_theme": "haguro_minamidani", "bg_path": "shortliterature/bg_haguro_minamidani.jpg", "bg_title": "🌲 羽黒山・南谷別院と残雪薫る杉木立（第30句専用描き下ろし背景）"}, "raw_text": "六月三日、羽黒山に登る。図司左吉と云者を尋て、別当代会覚阿闍梨に謁す。南谷の別院に舎して、憐愍の情こまやかにあるじせらる。四日、本坊にをゐて俳諧興行。有難や雪をかほらす南谷。", "kakikudashi": "六月三日、羽黒山に登る。図司左吉といふ者を尋ねて、別当代会覚阿闍梨に謁す。南谷の別院に舎して、憐愍の情こまやかにあるじせらる。四日、本坊において俳諧興行。有難や雪をかほらす南谷。", "translation": "六月三日、出羽三山の一つである羽黒山に登った。麓の手向村に図司左吉という門人を訪ね、その案内で一山を統括する別当代の会覚阿闍梨にお目にかかった。山中の南谷にある別院に宿を与えられ、旅人をいたわる細やかな心配りで手厚くもてなしていただいた。翌四日、羽黒山の本坊において俳諧の歌仙を興行した。有難や雪をかほらす南谷――なんと尊くありがたいことであろうか、谷間の残雪を吹き渡る涼風が清らかな香りを漂わせるこの聖地・南谷は。", "persons": "図司左吉,会覚阿闍梨", "places": "羽黒山,南谷", "era_year": "元禄二年六月三日〜四日", "source_book": "", "keywords": "", "raw_tagged": "六月三日、{{place:羽黒山|羽黒山}}に登る。{{person:図司左吉|図司左吉}}と云者を尋て、{{person:会覚阿闍梨|別当代会覚阿闍梨}}に謁す。{{place:南谷|南谷}}の別院に舎して、憐愍の情こまやかにあるじせらる。四日、本坊にをゐて俳諧興行。有難や雪をかほらす{{place:南谷|南谷}}。", "kakikudashi_tagged": "六月三日、{{place:羽黒山|羽黒山}}に登る。{{person:図司左吉|図司左吉}}といふ者を尋ねて、{{person:会覚阿闍梨|別当代会覚阿闍梨}}に謁す。{{place:南谷|南谷}}の別院に舎して、憐愍の情こまやかにあるじせらる。四日、本坊において俳諧興行。有難や雪をかほらす{{place:南谷|南谷}}。", "translation_tagged": "六月三日、出羽三山の一つである{{place:羽黒山|羽黒山}}に登った。麓の手向村に{{person:図司左吉|図司左吉}}という門人を訪ね、その案内で一山を統括する別当代の{{person:会覚阿闍梨|会覚阿闍梨}}にお目にかかった。山中の{{place:南谷|南谷}}にある別院に宿を与えられ、旅人をいたわる細やかな心配りで手厚くもてなしていただいた。翌四日、羽黒山の本坊において俳諧の歌仙を興行した。有難や雪をかほらす{{place:南谷|南谷}}――なんと尊くありがたいことであろうか、谷間の残雪を吹き渡る涼風が清らかな香りを漂わせるこの聖地・{{place:南谷|南谷}}は。", "english_tagged": "On the third day of the sixth moon, we climbed {{place:羽黒山|Mount Haguro}}. Calling upon a disciple named {{person:図司左吉|Zushi Sakichi}}, we were granted an audience with the {{person:会覚阿闍梨|Acting Abbot, Master Egaku}}. Lodged at a sub-temple in {{place:南谷|Minamidani}}—South Valley—we were hosted with warm and tender hospitality. On the fourth, we held a linked-verse session at the main monastery. \"Ah, how blessed it is— / making the lingering snows fragrant, / breeze of {{place:南谷|South Valley}}!\""}, {"id": "v1_p25_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十五、出羽三山", "para_index": 25, "type": "本文", "verse": null, "raw_text": "五日、権現に詣。当山開闢能除太子はいづれの代の人と云事をしらず。延喜式に「羽州里山の神社」と有。書写、黒の字を里山となせるにや。羽州黒山を中略して羽黒山と云にや。出羽といへるは、「鳥の毛羽を此国の貢に献る」と風土記に侍とやらん。月山・湯殿を合て三山とす。当寺武江東叡に属して、天台止観の月明らかに、円頓融通の法の灯かゝげそひて、僧坊棟をならべ、修験行法を励し、霊山霊地の験効、人貴且恐る。繁栄長にして、めで度御山と謂つべし。", "kakikudashi": "五日、権現に詣づ。当山開闢能除太子はいづれの代の人といふ事を知らず。延喜式に「羽州里山の神社」とあり。書写、黒の字を里山となせるにや。羽州黒山を中略して羽黒山といふにや。出羽といへるは、「鳥の毛羽をこの国の貢に献る」と風土記に侍るとやらん。月山・湯殿を合はせて三山とす。当寺武江東叡に属して、天台止観の月明らかに、円頓融通の法の灯かかげそひて、僧坊棟をならべ、修験行法を励まし、霊山霊地の験効、人貴びかつ恐る。繁栄長へにして、めでたき御山と謂ひつべし。", "translation": "六月五日、羽黒山の本社である羽黒権現に参詣した。この霊山を開山された能除太子は、いつの時代の御方であるのか確かなことはわからない。平安時代の延喜式には「羽州里山の神社」と記されている。書き写す際に、「黒」という一字を誤って「里」と「山」の二字に分けてしまったのであろうか。そして「羽州黒山」の「州」の字を中略して「羽黒山」と呼ぶようになったのであろうか。また「出羽」という国名は、「鳥の羽毛をこの国の特産の貢物として朝廷に献上した」ことに由来すると風土記に記されているとかいうことである。この羽黒山に月山と湯殿山を合わせて、出羽三山と称している。この寺は江戸の武江東叡の末寺に属しており、天台止観の教えは満月のように明らかに輝き、円頓融通の仏法の灯火は絶えることなく掲げ継がれて、数多くの僧坊が甍を並べ、山伏たちが厳しい修験の行法に励み、霊山霊地としての霊験のあらたかさを人々は深く尊びかつ畏れ敬っている。その繁栄はとこしえに揺るぎなく、まことにめでたい御山と言うべきである。", "persons": "能除太子", "places": "羽黒山,出羽（象潟・出羽三山）圏,月山,湯殿山,東叡山", "era_year": "元禄二年六月五日", "source_book": "", "keywords": "延喜式,風土記,天台止観,円頓融通", "raw_tagged": "五日、権現に詣。当山開闢{{person:能除太子|能除太子}}はいづれの代の人と云事をしらず。{{special:延喜式|延喜式}}に「{{place:羽黒山|羽州里山}}の神社」と有。書写、黒の字を里山となせるにや。{{place:羽黒山|羽州黒山}}を中略して{{place:羽黒山|羽黒山}}と云にや。{{place:出羽（象潟・出羽三山）圏|出羽}}といへるは、「鳥の毛羽を此国の貢に献る」と{{special:風土記|風土記}}に侍とやらん。{{place:月山|月山}}・{{place:湯殿山|湯殿}}を合て三山とす。当寺{{place:東叡山|武江東叡}}に属して、{{special:天台止観|天台止観}}の月明らかに、{{special:円頓融通|円頓融通}}の法の灯かゝげそひて、僧坊棟をならべ、修験行法を励し、霊山霊地の験効、人貴且恐る。繁栄長にして、めで度御山と謂つべし。", "kakikudashi_tagged": "五日、権現に詣づ。当山開闢{{person:能除太子|能除太子}}はいづれの代の人といふ事を知らず。{{special:延喜式|延喜式}}に「{{place:羽黒山|羽州里山}}の神社」とあり。書写、黒の字を里山となせるにや。{{place:羽黒山|羽州黒山}}を中略して{{place:羽黒山|羽黒山}}といふにや。{{place:出羽（象潟・出羽三山）圏|出羽}}といへるは、「鳥の毛羽をこの国の貢に献る」と{{special:風土記|風土記}}に侍るとやらん。{{place:月山|月山}}・{{place:湯殿山|湯殿}}を合はせて三山とす。当寺{{place:東叡山|武江東叡}}に属して、{{special:天台止観|天台止観}}の月明らかに、{{special:円頓融通|円頓融通}}の法の灯かかげそひて、僧坊棟をならべ、修験行法を励まし、霊山霊地の験効、人貴びかつ恐る。繁栄長へにして、めでたき御山と謂ひつべし。", "translation_tagged": "六月五日、羽黒山の本社である羽黒権現に参詣した。この霊山を開山された{{person:能除太子|能除太子}}は、いつの時代の御方であるのか確かなことはわからない。平安時代の{{special:延喜式|延喜式}}には「{{place:羽黒山|羽州里山}}の神社」と記されている。書き写す際に、「黒」という一字を誤って「里」と「山」の二字に分けてしまったのであろうか。そして「{{place:羽黒山|羽州黒山}}」の「州」の字を中略して「{{place:羽黒山|羽黒山}}」と呼ぶようになったのであろうか。また「{{place:出羽（象潟・出羽三山）圏|出羽}}」という国名は、「鳥の羽毛をこの国の特産の貢物として朝
