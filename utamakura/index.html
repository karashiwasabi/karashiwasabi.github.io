astle}}, heard the first wild geese crying over {{place:かへるやま|Mount Kaeruyama}}, and at dusk on the fourteenth day sought lodging at the port of {{place:敦賀|Tsuruga}}. That night, the moon shone with extraordinary clarity. When I asked, \"Will tomorrow night be as clear as this?\" my host replied, \"As is the way along the {{place:越前・美濃・伊勢圏|Koshiji road}}, it is hard to foretell whether tomorrow night will be cloudy or clear,\" and after he pressed sake upon me, I paid a night visit to the shrine of {{place:気比の明神|Kehi Myōjin}}. It is the sacred mausoleum of {{person:仲哀天皇|Emperor Chūai}}. The shrine precincts were filled with ancient majesty, and as the moonlight filtered through the pine boughs, the white sand before the sanctuary looked as though it were carpeted with frost. \"Long ago, the {{person:遊行二世の上人|Second Yugyō Shōnin}} conceived a great vow, cut the grass with his own hands, carried earth and stones, and dried up the mire so that pilgrims might come and go without trouble. That ancient custom continues unbroken to this day, and each successive holy man carries pure sand before the deity. This is called the {{special:遊行の砂持|Sand-Carrying of Yugyō}},\" my host related to me. \"How pure the moonlight— / shining upon the white sand / Yugyō carried here.\""}, {"id": "v1_p38_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十八、敦賀・気比の明神", "para_index": 38, "type": "発句・注", "verse": {"genre": "haiku", "l1": "名月や", "l2": "北国日和", "l3": "定なき", "author": "松尾芭蕉", "bg_theme": "tsuruga_meigetsu", "bg_path": "shortliterature/bg_echigo_amanogawa.jpg", "bg_title": "🌧️ 敦賀の湊・雨に煙る十五夜と北国日和（第59句背景）"}, "raw_text": "十五日、亭主の詞にたがはず、雨降。名月や北国日和定なき。", "kakikudashi": "十五日、亭主の詞にたがはず、雨降る。名月や北国日和定めなき。", "translation": "八月十五日の仲秋の名月の日、宿の主人の言葉に違わず雨が降り出した。せっかくの十五夜の名月の夜だというのに、北国の空模様というものはまことに移ろいやすく定まらないものだなあ。", "persons": "", "places": "", "era_year": "元禄二年八月十五日", "source_book": "", "keywords": "", "raw_tagged": "十五日、亭主の詞にたがはず、雨降。名月や北国日和定なき。", "kakikudashi_tagged": "十五日、亭主の詞にたがはず、雨降る。名月や北国日和定めなき。", "translation_tagged": "八月十五日の仲秋の名月の日、宿の主人の言葉に違わず雨が降り出した。せっかくの十五夜の名月の夜だというのに、北国の空模様というものはまことに移ろいやすく定まらないものだなあ。", "english_tagged": "On the fifteenth day, just as the innkeeper had foretold, it rained. \"The harvest moon tonight— / how changeable and uncertain / this northern weather.\""}, {"id": "v1_p39_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十九、種の浜", "para_index": 39, "type": "発句・注", "verse": {"genre": "haiku", "l1": "寂しさや", "l2": "須磨にかちたる", "l3": "浜の秋", "author": "松尾芭蕉", "bg_theme": "ironohama_suma", "bg_path": "shortliterature/bg_shiogoshi_matsu.jpg", "bg_title": "🌊 種の浜・須磨に勝る入江の秋夕暮（第60句背景）"}, "raw_text": "十六日、空霽たれば、ますほの小貝ひろはんと、種の浜に舟を走す。海上七里あり。天屋何某と云もの、破籠・小竹筒などこまやかにしたゝめさせ、僕あまた舟にとりのせて、追風時のまに吹着ぬ。浜はわづかなる海士の小家にて、侘しき法華寺あり。爰に茶を飲、酒をあたゝめて、夕ぐれのさびしさ感に堪たり。寂しさや須磨にかちたる浜の秋。", "kakikudashi": "十六日、空晴れたれば、ますほの小貝拾はんと、種の浜に舟を走らす。海上七里あり。天屋何某といふもの、破籠・小竹筒などこまやかにしたためさせ、僕あまた舟に取り乗せて、追風時の間に吹き着きぬ。浜はわづかなる海士の小家にて、侘しき法華寺あり。ここに茶を飲み、酒をあたためて、夕暮れのさびしさ感に堪へたり。寂しさや須磨にかちたる浜の秋。", "translation": "八月十六日、空が晴れ上がったので、西行法師の歌に詠まれたますほの小貝を拾おうと、種の浜へ向けて舟を走らせた。海上の道のりは七里ある。敦賀の天屋某という人が、弁当の破籠や竹筒の酒器などを細やかに心づかいして用意させ、下僕を大勢舟に乗り込ませてくれたので、追い風に乗ってほんのわずかな間に種の浜へ吹き着いた。浜辺にはわずかな数の漁師の小家が並ぶばかりで、わびしい風情の法華宗の寺がある。この寺で茶を飲み、酒を温めて酌み交わすうちに、夕暮れの浜辺の寂しさが胸に迫り、深い感動に堪えないほどであった。この心に染み入るような寂しさはどうであろう、古来わびしさで名高い須磨の浦の秋にもまさる、この種の浜の秋の夕暮れよ。", "persons": "天屋何某", "places": "種の浜,須磨", "era_year": "元禄二年八月十六日", "source_book": "", "keywords": "ますほの小貝,破籠・小竹筒", "raw_tagged": "十六日、空霽たれば、{{special:ますほの小貝|ますほの小貝}}ひろはんと、{{place:種の浜|種の浜}}に舟を走す。海上七里あり。{{person:天屋何某|天屋何某}}と云もの、{{special:破籠・小竹筒|破籠・小竹筒}}などこまやかにしたゝめさせ、僕あまた舟にとりのせて、追風時のまに吹着ぬ。浜はわづかなる海士の小家にて、侘しき法華寺あり。爰に茶を飲、酒をあたゝめて、夕ぐれのさびしさ感に堪たり。寂しさや{{place:須磨|須磨}}にかちたる浜の秋。", "kakikudashi_tagged": "十六日、空晴れたれば、{{special:ますほの小貝|ますほの小貝}}拾はんと、{{place:種の浜|種の浜}}に舟を走らす。海上七里あり。{{person:天屋何某|天屋何某}}といふもの、{{special:破籠・小竹筒|破籠・小竹筒}}などこまやかにしたためさせ、僕あまた舟に取り乗せて、追風時の間に吹き着きぬ。浜はわづかなる海士の小家にて、侘しき法華寺あり。ここに茶を飲み、酒をあたためて、夕暮れのさびしさ感に堪へたり。寂しさや{{place:須磨|須磨}}にかちたる浜の秋。", "translation_tagged": "八月十六日、空が晴れ上がったので、西行法師の歌に詠まれた{{special:ますほの小貝|ますほの小貝}}を拾おうと、{{place:種の浜|種の浜}}へ向けて舟を走らせた。海上の道のりは七里ある。敦賀の{{person:天屋何某|天屋}}某という人が、弁当の{{special:破籠・小竹筒|破籠}}や竹筒の酒器などを細やかに心づかいして用意させ、下僕を大勢舟に乗り込ませてくれたので、追い風に乗ってほんのわずかな間に種の浜へ吹き着いた。浜辺にはわずかな数の漁師の小家が並ぶばかりで、わびしい風情の法華宗の寺がある。この寺で茶を飲み、酒を温めて酌み交わすうちに、夕暮れの浜辺の寂しさが胸に迫り、深い感動に堪えないほどであった。この心に染み入るような寂しさはどうであろう、古来わびしさで名高い{{place:須磨|須磨}}の浦の秋にもまさる、この種の浜の秋の夕暮れよ。", "english_tagged": "On the sixteenth day, since the sky had cleared, we sped a boat toward {{place:種の浜|Iro-no-hama Beach}} to gather the {{special:ますほの小貝|crimson masuho shells}}. It was seven leagues by sea. A man named {{person:天屋何某|Ten'ya Somebody}} had {{special:破籠・小竹筒|wooden lunch boxes and bamboo sake flasks}} prepared with thoughtful care, placed many servants aboard the boat, and with a tailwind we were blown to shore in no time at all. Along the beach stood only a few humble fishermen's huts and a forlorn Hokke temple. Here we drank tea and warmed our sake, deeply moved by the loneliness of the autumn dusk. \"Loneliness profound— / surpassing even {{place:須磨|Suma}}, / autumn on this beach.\""}, {"id": "v1_p39_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十九、種の浜", "para_index": 39, "type": "発句・注", "verse": {"genre": "haiku", "l1": "浪の間や", "l2": "小貝にまじる", "l3": "萩の塵", "author": "松尾芭蕉", "bg_theme": "ironohama_kogai", "bg_path": "shortliterature/bg_komatsu_hagisusuki.jpg", "bg_title": "🐚 種の浜・白波の間のますほの小貝と萩の塵（第61句背景）"}, "raw_text": "浪の間や小貝にまじる萩の塵。其日のあらまし、等栽に筆をとらせて寺に残す。", "kakikudashi": "浪の間や小貝にまじる萩の塵。その日のあらまし、等栽に筆をとらせて寺に残す。", "translation": "寄せては返す白波の合間に、赤いますほの小貝に交じって、浜辺の萩のこぼれ花が塵のように打ち寄せられていることよ。その日の遊覧のあらましを、同行した等栽に筆を執らせて書き記し、記念としてこの寺に残し置いた。", "persons": "等栽", "places": "", "era_year": "元禄二年八月十六日", "source_book": "", "keywords": "", "raw_tagged": "浪の間や小貝にまじる萩の塵。其日のあらまし、{{person:等栽|等栽}}に筆をとらせて寺に残す。", "kakikudashi_tagged": "浪の間や小貝にまじる萩の塵。その日のあらまし、{{person:等栽|等栽}}に筆をとらせて寺に残す。", "translation_tagged": "寄せては返す白波の合間に、赤いますほの小貝に交じって、浜辺の萩のこぼれ花が塵のように打ち寄せられていることよ。その日の遊覧のあらましを、同行した{{person:等栽|等栽}}に筆を執らせて書き記し、記念としてこの寺に残し置いた。", "english_tagged": "\"Between the white waves— / mingling with the tiny shells, / dust of bush clover.\" Having {{person:等栽|Tōsai}} take up his brush to record an account of the day, we left it behind at the temple."}, {"id": "v1_p40_1", "volume": 1, "book": "おくのほそ道", "section_title": "四十、大垣", "para_index": 40, "type": "発句・注", "verse": {"genre": "haiku", "l1": "蛤の", "l2": "ふたみにわかれ", "l3": "行秋ぞ", "author": "松尾芭蕉", "bg_theme": "ogaki_hamaguri", "bg_path": "shortliterature/bg_etchu_arisonoumi.jpg", "bg_title": "⛵ 大垣水門川・伊勢二見浦へ舟出する行く秋の別れ（第62句・巻軸背景）"}, "raw_text": "露通も此みなとまで出むかひて、みのゝ国へと伴ふ。駒にたすけられて大垣の庄に入ば、曾良も伊勢より来り合、越人も馬をとばせて、如行が家に入集る。前川子・荊口父子、其外したしき人々、日夜とぶらひて、蘇生のものにあふがごとく、且悦び、且いたはる。旅の物うさもいまだやまざるに、長月六日になれば、伊勢の遷宮おがみんと、又舟にのりて、蛤のふたみにわかれ行秋ぞ。", "kakikudashi": "路通もこの港まで出迎ひて、美濃の国へと伴ふ。駒に助けられて大垣の庄に入れば、曾良も伊勢より来たり合ひ、越人も馬を飛ばせて、如行が家に入り集まる。前川子・荊口父子、そのほか親しき人々、日夜訪らひて、蘇生のものに会ふがごとく、かつ悦び、かついたはる。旅のもの憂さもいまだやまざるに、長月六日になれば、伊勢の遷宮拝まんと、また舟に乗りて、蛤のふたみにわかれ行く秋ぞ。", "translation": "門人の路通もこの敦賀の港まで私を出迎えに来て、一緒に美濃の国へと連れ立って向かった。馬の背に助けられながら美濃の大垣の庄に入ると、山中温泉で別れた曾良も伊勢の長島から駆けつけて合流し、越人も名古屋から馬を飛ばしてやって来て、如行の家に皆が集まった。前川子や荊口父子をはじめ、そのほか親しい門人たちが昼も夜も訪ねて来てくれて、まるで死んだ者が蘇って帰ってきたのに会うかのように、ともに無事を喜び、また長旅の労苦を心からいたわってくれた。長旅の疲れもまだ癒えきらないというのに、九月六日になると、伊勢神宮の式年遷宮を拝もうと、再び川舟に乗り込んで、蛤の蓋と身が分かれるように親しい人々と別れ、ゆく秋とともに伊勢の二見浦へと旅立ってゆくことであるよ。", "persons": "路通,曾良,越人,如行,前川子,荊口", "places": "越前・美濃・伊勢圏,大垣,二見", "era_year": "元禄二年八月廿一日〜九月六日", "source_book": "", "keywords": "長月,伊勢の遷宮,行秋", "raw_tagged": "{{person:路通|露通}}も此みなとまで出むかひて、{{place:越前・美濃・伊勢圏|みのゝ国}}へと伴ふ。駒にたすけられて{{place:大垣|大垣の庄}}に入ば、{{person:曾良|曾良}}も{{place:越前・美濃・伊勢圏|伊勢}}より来り合、{{person:越人|越人}}も馬をとばせて、{{person:如行|如行}}が家に入集る。{{person:前川子|前川子}}・{{person:荊口|荊口父子}}、其外したしき人々、日夜とぶらひて、蘇生のものにあふがごとく、且悦び、且いたはる。旅の物うさもいまだやまざるに、{{special:長月|長月}}六日になれば、{{special:伊勢の遷宮|伊勢の遷宮}}おがみんと、又舟にのりて、蛤の{{place:二見|ふたみ}}にわかれ{{special:行秋|行秋}}ぞ。", "kakikudashi_tagged": "{{person:路通|路通}}もこの港まで出迎ひて、{{place:越前・美濃・伊勢圏|美濃の国}}へと伴ふ。駒に助けられて{{place:大垣|大垣の庄}}に入れば、{{person:曾良|曾良}}も{{place:越前・美濃・伊勢圏|伊勢}}より来たり合ひ、{{person:越人|越人}}も馬を飛ばせて、{{person:如行|如行}}が家に入り集まる。{{person:前川子|前川子}}・{{person:荊口|荊口父子}}、そのほか親しき人々、日夜訪らひて、蘇生のものに会ふがごとく、かつ悦び、かついたはる。旅のもの憂さもいまだやまざるに、{{special:長月|長月}}六日になれば、{{special:伊勢の遷宮|伊勢の遷宮}}拝まんと、また舟に乗りて、蛤の{{place:二見|ふたみ}}にわかれ{{special:行秋|行く秋}}ぞ。", "translation_tagged": "門人の{{person:路通|路通}}もこの敦賀の港まで私を出迎えに来て、一緒に{{place:越前・美濃・伊勢圏|美濃の国}}へと連れ立って向かった。馬の背に助けられながら美濃の{{place:大垣|大垣の庄}}に入ると、山中温泉で別れた{{person:曾良|曾良}}も{{place:越前・美濃・伊勢圏|伊勢}}の長島から駆けつけて合流し、{{person:越人|越人}}も名古屋から馬を飛ばしてやって来て、{{person:如行|如行}}の家に皆が集まった。{{person:前川子|前川子}}や{{person:荊口|荊口父子}}をはじめ、そのほか親しい門人たちが昼も夜も訪ねて来てくれて、まるで死んだ者が蘇って帰ってきたのに会うかのように、ともに無事を喜び、また長旅の労苦を心からいたわってくれた。長旅の疲れもまだ癒えきらないというのに、九月六日になると、伊勢神宮の式年遷宮を拝もうと、再び川舟に乗り込んで、蛤の蓋と身が分かれるように親しい人々と別れ、ゆく秋とともに伊勢の{{place:二見|二見浦}}へと旅立ってゆくことであるよ。", "english_tagged": "{{person:路通|Rotsū}} also came out to this port to meet me and accompanied me toward the {{place:越前・美濃・伊勢圏|province of Mino}}. Helped along on horseback, I entered the manor of {{place:大垣|Ōgaki}}, where {{person:曾良|Sora}} too came to join me from {{place:越前・美濃・伊勢圏|Ise}}, and {{person:越人|Etsujin}} came galloping on horseback, all gathering together at {{person:如行|Jokyō}}'s house. {{person:前川子|Zensenshi}}, {{person:荊口|Keikō and his sons}}, and other dear friends called upon me day and night, both rejoicing and comforting me as though greeting one who had returned from the dead. Before the weariness of the journey had yet faded, when the sixth day of the {{special:長月|ninth moon}} arrived, wishing to bow before the {{special:伊勢の遷宮|Shrine Transfer at Ise}}, I boarded a boat once more: \"As shell parts from clam, / parting toward {{place:二見|Futami}} now— / {{special:行秋|autumn on its way}}.\""}];

        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '🔄 場所が違う（同名別地・位置修正）')">🔄 場所が違う</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '📐 エリア⇔地点の区分変更')">📐 エリア⇔地点変更</button>

    ` : '';
    toast.innerHTML = `

        <button onclick="document.getElementById('mapToast').style.display='none'" style="background:transparent; border:none; color:#bbb; cursor:pointer; font-size:0.9rem; line-height:1; padding:0 2px; flex-shrink:0;" title="閉じる">✕</button>
      </div>
      <div id="toastSrcTabs" style="display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; flex-shrink:0;"></div>
      <img id="toastUkiyoeImg" class="toast-img-el" src="" alt="${found.key}" />
      <div id="toastGmapWrap" style="display:none; width:100%; margin-top:5px; flex-shrink:0;"></div>
      <div id="toastSrcNote" style="font-size:0.68rem; color:#d7ccc8; margin-top:4px; line-height:1.35; flex-shrink:0; display:none;"></div>

    toast.style.display = 'flex';
    loadToastUkiyoePreview(found);
    return true;
  }

  // パブリックドメイン浮世絵・名勝写真（確定画像優先 ／ Wikimedia Commons NDL測定バー完全除外）自動取得キャッシュ
  const ukiyoeUrlCache = {};
  const ukiyoeResolvedMetaCache = {};
  const resolvedUkiyoeByIdCache = {};
  const PLACE_IMG_OVERRIDE_STORAGE_KEY = 'utamakura_inline_place_images_v5';
  let placeImageOverrides = {};
  try {
    const rawOv = localStorage.getItem(PLACE_IMG_OVERRIDE_STORAGE_KEY);
    if (rawOv) placeImageOverrides = JSON.parse(rawOv);
  } catch (e) {
    placeImageOverrides = {};
  }

  function savePlaceImageOverrides() {
    try {
      localStorage.setItem(PLACE_IMG_OVERRIDE_STORAGE_KEY, JSON.stringify(placeImageOverrides));
    } catch (e) {}
  }

  function getPlaceImageOverride(placeKey) {
    return placeImageOverrides[placeKey] || null;
  }

  // source_matrix.html（別タブ）で1クリック切替された際に即座に同期反映する
  window.addEventListener('storage', (e) => {
    if (e.key === SOURCE_CFG_STORAGE_KEY) {
      try {
        sourceCfg = e.newValue ? JSON.parse(e.newValue) : {};
      } catch (err) {
        sourceCfg = {};
      }
      if (currentToastPlaceKey) {
        const pObjCfg = PLACES.find(p => p.key === currentToastPlaceKey);
        if (pObjCfg) loadToastUkiyoePreview(pObjCfg);
      }
    }
    if (e.key === PLACE_IMG_OVERRIDE_STORAGE_KEY) {
      try {
        placeImageOverrides = e.newValue ? JSON.parse(e.newValue) : {};
      } catch (err) {
        placeImageOverrides = {};
      }
      Object.keys(ukiyoeUrlCache).forEach(k => delete ukiyoeUrlCache[k]);
      if (currentToastPlaceKey) {
        const pObj = PLACES.find(p => p.key === currentToastPlaceKey);
        if (pObj) loadToastUkiyoePreview(pObj);
      }
    }
  });

  function escapeHtmlSimple(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // source_matrix.html（1対4ソース対照表）と完全に同一の除外パターン・画像取得定数
  const MATRIX_RESOLVED_CACHE_KEY = 'utamakura_matrix_resolved_cache_v3';
  const WIKI_API_THUMB_WIDTH_PX = 400;
  const WIKI_ARTICLE_IMG_LIMIT = 15;
  const WIKI_ARTICLE_SLICE_COUNT = 6;
  const COMMONS_SEARCH_LIMIT = 5;
  const FUKEICHI_BATCH_SIZE = 20;

  const MATRIX_EXCLUDE_PATTERNS = [
    /map/i, /locator/i, /location/i, /relief/i, /flag/i, /emblem/i, /symbol/i,
    /seal/i, /logo/i, /icon/i, /coat_of_arms/i, /diagram/i, /chart/i, /graph/i,
    /signature/i, /kaō/i, /kao/i, /stamp/i, /red_dot/i, /blank/i, /increase/i,
    /decrease/i, /commons-logo/i, /wikidata/i, /wikibooks/i, /wikinews/i,
    /wikiquote/i, /wikisource/i, /wikiversity/i, /wikivoyage/i, /wiktionary/i,
    /disambig/i, /question_book/i, /padlock/i, /ambox/i, /edit-clear/i,
    /prefecture/i, /municipality/i, /railway/i, /station_map/i, /route_map/i,
    /町章/, /市章/, /村章/, /県章/, /区章/, /家紋/, /紋章/, /位置/,
    /kamon/i, /monsho/i, /crest/i,
    /[.]svg$/i, /[.]pdf$/i, /[.]djvu$/i, /[.]ogv$/i, /[.]webm$/i, /[.]ogg$/i
  ];

  function isMatrixExcludedImage(str) {
    if (!str) return true;
    return MATRIX_EXCLUDE_PATTERNS.some(pat => pat.test(str));
  }

  // source_matrix.html の fetchWikiArticleThumb と完全同一の個別Wiki画像取得
  async function fetchWikiLeadImage(wikiTitle) {
    if (!wikiTitle) return null;
    try {
      const wikiRes = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`);
      if (wikiRes.ok) {
        const wData = await wikiRes.json();
        const thumb = (wData.thumbnail && wData.thumbnail.source) || (wData.originalimage && wData.originalimage.source);
        if (thumb && !isMatrixExcludedImage(thumb)) {
          return thumb;
        }
      }
    } catch (e) {}

    try {
      const piUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(wikiTitle)}&prop=pageimages|images&pithumbsize=${WIKI_API_THUMB_WIDTH_PX}&imlimit=${WIKI_ARTICLE_IMG_LIMIT}&format=json&origin=*`;
      const piRes = await fetch(piUrl);
      if (piRes.ok) {
        const piData = await piRes.json();
        const pages = (piData.query && piData.query.pages) ? Object.values(piData.query.pages) : [];
        const imgTitles = [];
        for (const pg of pages) {
          if (pg.pageimage && !isMatrixExcludedImage(pg.pageimage)) {
            imgTitles.push('File:' + pg.pageimage);
          }
          if (pg.images) {
            for (const im of pg.images) {
              if (im.title && !isMatrixExcludedImage(im.title) && !imgTitles.includes(im.title)) {
                imgTitles.push(im.title);
              }
            }
          }
        }
        if (imgTitles.length > 0) {
          const sliceStr = imgTitles.slice(0, WIKI_ARTICLE_SLICE_COUNT).join('|');
          const iiUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(sliceStr)}&prop=imageinfo&iiprop=url&iiurlwidth=${WIKI_API_THUMB_WIDTH_PX}&format=json&origin=*`;
          const iiRes = await fetch(iiUrl);
          if (iiRes.ok) {
            const iiData = await iiRes.json();
            const iiPages = (iiData.query && iiData.query.pages) ? Object.values(iiData.query.pages) : [];
            for (const imgPg of iiPages) {
              if (imgPg.imageinfo && imgPg.imageinfo[0]) {
                const info = imgPg.imageinfo[0];
                const cleanFk = (imgPg.title || '').replace(/^(File|ファイル):/i, '').trim();
                if (!isMatrixExcludedImage(cleanFk) && (info.thumburl || info.url)) {
                  return info.thumburl || info.url;
                }
              }
            }
          }
        }
      }
    } catch (e) {}
    return null;
  }

  // source_matrix.html の resolveUkiyoeThumb と完全同一の浮世絵画像取得
  async function resolveUkiyoeEntry(entry, placeKeyFallback) {
    if (!entry) return null;
    if (resolvedUkiyoeByIdCache[entry.id] !== undefined) {
      return resolvedUkiyoeByIdCache[entry.id];
    }

    if (entry.file_key && (entry.thumb_url || entry.image_url) && !/\bNDL/i.test(entry.file_key)) {
      const preResolved = {
        fileKey: entry.file_key.replace(/^(File|ファイル):/i, '').trim(),
        url: entry.image_url || entry.thumb_url,
        thumbUrl: entry.thumb_url || entry.image_url,
        caption: entry.caption,
        sourceType: 'ukiyoe',
        articleTitle: `浮世絵DB（${entry.series}）`
      };
      resolvedUkiyoeByIdCache[entry.id] = preResolved;
      return preResolved;
    }

    if (entry.file_key && !/\bNDL/i.test(entry.file_key)) {
      try {
        const fileCheckUrl = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent('File:' + entry.file_key)}&prop=imageinfo&iiprop=url&iiurlwidth=${WIKI_API_THUMB_WIDTH_PX}&format=json&origin=*`;
        const fcRes = await fetch(fileCheckUrl);
        if (fcRes.ok) {
          const fcData = await fcRes.json();
          const pages = (fcData.query && fcData.query.pages) ? Object.values(fcData.query.pages) : [];
          for (const pg of pages) {
            if (pg && !pg.missing && pg.imageinfo && pg.imageinfo[0]) {
              const info = pg.imageinfo[0];
              if (info.thumburl || info.url) {
                const resolved = {
                  fileKey: (pg.title || entry.file_key).replace(/^(File|ファイル):/i, '').trim(),
                  url: info.url || info.thumburl,
                  thumbUrl: info.thumburl || info.url,
                  caption: entry.caption,
                  sourceType: 'ukiyoe',
                  articleTitle: `浮世絵DB（${entry.series}）`
                };
                resolvedUkiyoeByIdCache[entry.id] = resolved;
                return resolved;
              }
            }
          }
        }
      } catch (e) {}
    }

    const fallbackPlace = placeKeyFallback || (entry.places && entry.places[0]) || '';
    const qStr = entry.commons_query || `${entry.series} ${fallbackPlace}`;
    try {
      const sUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap -Brooklyn -NDL ' + qStr)}&gsrnamespace=6&gsrlimit=${COMMONS_SEARCH_LIMIT}&prop=imageinfo&iiprop=url&iiurlwidth=${WIKI_API_THUMB_WIDTH_PX}&format=json&origin=*`;
      const sRes = await fetch(sUrl);
      if (sRes.ok) {
        const sData = await sRes.json();
        const pages = (sData.query && sData.query.pages) ? Object.values(sData.query.pages) : [];
        for (const pg of pages) {
          if (pg.imageinfo && pg.imageinfo[0]) {
            const info = pg.imageinfo[0];
            if (info.thumburl || info.url) {
              const resolved = {
                fileKey: (pg.title || '').replace(/^(File|ファイル):/i, '').trim(),
                url: info.url || info.thumburl,
                thumbUrl: info.thumburl || info.url,
                caption: entry.caption,
                sourceType: 'ukiyoe',
                articleTitle: `浮世絵DB（${entry.series}）`
              };
              resolvedUkiyoeByIdCache[entry.id] = resolved;
              return resolved;
            }
          }
        }
      }
    } catch (e) {}

    resolvedUkiyoeByIdCache[entry.id] = null;
    return null;
  }

  async function fetchCommonsCleanUkiyoe(queryStr) {
    if (!queryStr) return null;
    const dummyEntry = { id: 'q_' + queryStr, file_key: '', commons_query: queryStr, caption: '', series: '' };
    const r = await resolveUkiyoeEntry(dummyEntry);
    return r ? r.thumbUrl : null;
  }

  // Wikipedia「おくのほそ道の風景地」（国指定名勝26か所一覧テーブル）から画像と各指定地の対応を解析・キャッシュ（source_matrix.html と同一）
  let fukeichiWikiParsedPromise = null;
  async function loadFukeichiWikiData() {
    if (fukeichiWikiParsedPromise) return fukeichiWikiParsedPromise;
    fukeichiWikiParsedPromise = (async () => {
      const result = [];
      try {
        const parseUrl = `https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent('おくのほそ道の風景地')}&prop=wikitext|images&format=json&origin=*`;
        const pRes = await fetch(parseUrl);
        if (!pRes.ok) return result;
        const pData = await pRes.json();
        if (!pData.parse) return result;

        const wikitext = (pData.parse.wikitext && pData.parse.wikitext['*']) ? pData.parse.wikitext['*'] : '';
        const rawImages = Array.isArray(pData.parse.images) ? pData.parse.images : [];
        const validFiles = rawImages.filter(fn => fn && !isMatrixExcludedImage(fn));
        if (validFiles.length === 0) return result;

        const rowContextByFile = {};
        const normWikitext = wikitext.replace(/_/g, ' ');
        for (const fn of validFiles) {
          const cleanFn = fn.replace(/^(File|ファイル|画像):/i, '').trim().replace(/_/g, ' ');
          const idx = normWikitext.toLowerCase().indexOf(cleanFn.toLowerCase());
          if (idx !== -1) {
            const rowStart = normWikitext.lastIndexOf('|-', idx);
            let rawSlice = '';
            if (rowStart !== -1 && idx - rowStart < 500) {
              let rowEnd = normWikitext.indexOf('|-', idx + cleanFn.length);
              if (rowEnd === -1 || rowEnd - rowStart > 800) rowEnd = Math.min(normWikitext.length, idx + 350);
              rawSlice = normWikitext.slice(rowStart, rowEnd);
            } else {
              rawSlice = normWikitext.slice(Math.max(0, idx - 160), Math.min(normWikitext.length, idx + 200));
            }
            rowContextByFile[cleanFn] = rawSlice;
          }
        }

        for (let i = 0; i < validFiles.length; i += FUKEICHI_BATCH_SIZE) {
          const chunk = validFiles.slice(i, i + FUKEICHI_BATCH_SIZE).map(f => 'File:' + f).join('|');
          const iiUrl = `https://ja.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(chunk)}&prop=imageinfo&iiprop=url&iiurlwidth=${WIKI_API_THUMB_WIDTH_PX}&format=json&origin=*`;
          const iiRes = await fetch(iiUrl);
          if (!iiRes.ok) continue;
          const iiData = await iiRes.json();
          const pages = (iiData.query && iiData.query.pages) ? Object.values(iiData.query.pages) : [];
          for (const pg of pages) {
            if (!pg.imageinfo || !pg.imageinfo[0]) continue;
            const info = pg.imageinfo[0];
            const thumbUrl = info.thumburl || info.url;
            if (!thumbUrl) continue;
            const cleanFk = (pg.title || '').replace(/^(File|ファイル):/i, '').trim();
            if (isMatrixExcludedImage(cleanFk)) continue;
            result.push({
              fileKey: cleanFk,
              url: info.url || thumbUrl,
              thumbUrl: thumbUrl,
              caption: `おくのほそ道の風景地（${cleanFk.slice(0, 36)}）`,
              rowText: (rowContextByFile[cleanFk] || '') + ' ' + cleanFk,
              sourceType: 'wiki',
              articleTitle: 'おくのほそ道の風景地'
            });
          }
        }
      } catch (e) {}
      return result;
    })();
    return fukeichiWikiParsedPromise;
  }

  async function getFukeichiCandidatesForPlace(placeObj) {
    if (!placeObj) return [];
    const allFukeichi = await loadFukeichiWikiData();
    if (!allFukeichi || allFukeichi.length === 0) return [];
    const kws = Array.isArray(placeObj.fukeichi_keywords) && placeObj.fukeichi_keywords.length > 0
      ? placeObj.fukeichi_keywords
      : [placeObj.key];
    return allFukeichi.filter(item => {
      const target = (item.rowText || '').toLowerCase();
      return kws.some(kw => kw && target.includes(String(kw).toLowerCase()));
    }).map(item => ({
      ...item,
      caption: placeObj.fukeichi_title
        ? `名勝「おくのほそ道の風景地」${placeObj.fukeichi_title}`
        : item.caption,
      articleTitle: placeObj.fukeichi_title
        ? `おくのほそ道の風景地（${placeObj.fukeichi_title}）`
        : 'おくのほそ道の風景地'
    }));
  }

  async function fetchPlaceVisualUrl(placeObj) {
    if (!placeObj) return null;
    const cacheKey = placeObj.key;
    const defaultWiki = placeObj.wiki_title || '';

    // 1. 画面上または1対4ソース対照表（source_matrix.html）でユーザーが選択したオーバーライド
    const ov = getPlaceImageOverride(cacheKey);
    if (ov) {
      if (ov.sourceType === 'none' || ov.sourceType === 'gmap') return null;
      if (ov.thumbUrl || ov.url) return ov.thumbUrl || ov.url;
      if (ov.sourceType === 'fukeichi' && placeObj.fukeichi_title) {
        const fMatches = await getFukeichiCandidatesForPlace(placeObj);
        if (fMatches.length > 0) {
          const bestF = fMatches[0];
          ukiyoeUrlCache[cacheKey] = bestF.thumbUrl;
          ukiyoeResolvedMetaCache[cacheKey] = { sourceLabel: bestF.articleTitle, caption: bestF.caption };
          return bestF.thumbUrl;
        }
      }
      if (ov.sourceType === 'wiki') {
        const targetWiki = ov.wikiTitle || ov.articleTitle || defaultWiki;
        const wImg = await fetchWikiLeadImage(targetWiki);
        if (wImg) {
          ukiyoeUrlCache[cacheKey] = wImg;
          ukiyoeResolvedMetaCache[cacheKey] = { sourceLabel: targetWiki, caption: ov.caption || targetWiki };
          return wImg;
        }
      }
      if (ov.sourceType === 'ukiyoe') {
        const mArt = UKIYOE_DB.find(u => Array.isArray(u.places) && u.places.includes(placeObj.key))
          || (placeObj.ukiyoe_query ? UKIYOE_DB.find(u => u.commons_query === placeObj.ukiyoe_query || u.file_key === placeObj.ukiyoe_query) : null);
        if (mArt) {
          const rArt = await resolveUkiyoeEntry(mArt);
          if (rArt && rArt.thumbUrl) {
            ukiyoeUrlCache[cacheKey] = rArt.thumbUrl;
            ukiyoeResolvedMetaCache[cacheKey] = { sourceLabel: rArt.articleTitle, caption: rArt.caption || placeObj.ukiyoe_caption || placeObj.key };
            return rArt.thumbUrl;
          }
        }
      }
    }

    if (placeObj.default_source_type === 'gmap') return null;
    if (ukiyoeUrlCache[cacheKey]) return ukiyoeUrlCache[cacheKey];

    // 2. CONFIRMED_PLACE_IMAGES の実在確認済み確定画像（placeObj.fixed_image_url）
    if (placeObj.fixed_image_url) {
      ukiyoeUrlCache[cacheKey] = placeObj.fixed_image_url;
      ukiyoeResolvedMetaCache[cacheKey] = {
        sourceLabel: defaultWiki || (placeObj.fukeichi_title ? `おくのほそ道の風景地（${placeObj.fukeichi_title}）` : placeObj.key),
        caption: placeObj.ukiyoe_caption || placeObj.key
      };
      return placeObj.fixed_image_url;
    }

    // 3. 【第1優先】国指定名勝「おくのほそ道の風景地」の指定地：
    //    ① Wiki「おくのほそ道の風景地」内の該当写真 ➔ ② その指定地の専用Wiki記事の実景写真 を浮世絵より優先
    if (placeObj.fukeichi_title) {
      const fukeichiMatches = await getFukeichiCandidatesForPlace(placeObj);
      if (fukeichiMatches.length > 0) {
        const bestF = fukeichiMatches[0];
        ukiyoeUrlCache[cacheKey] = bestF.thumbUrl;
        ukiyoeResolvedMetaCache[cacheKey] = {
          sourceLabel: bestF.articleTitle,
          caption: bestF.caption
        };
        return bestF.thumbUrl;
      }
      if (defaultWiki && defaultWiki !== 'おくのほそ道の風景地') {
        const spotWikiImg = await fetchWikiLeadImage(defaultWiki);
        if (spotWikiImg) {
          ukiyoeUrlCache[cacheKey] = spotWikiImg;
          ukiyoeResolvedMetaCache[cacheKey] = {
            sourceLabel: `おくのほそ道の風景地（${placeObj.fukeichi_title} ／ Wiki:${defaultWiki}）`,
            caption: `名勝「おくのほそ道の風景地」${placeObj.fukeichi_title}`
          };
          return spotWikiImg;
        }
      }
    }

    // 4. placeObj.wiki_image_priority === true の場合は Wikipedia 記事（placeObj.wiki_title）の代表風景写真
    if (placeObj.wiki_image_priority === true && defaultWiki) {
      const wikiImg = await fetchWikiLeadImage(defaultWiki);
      if (wikiImg) {
        ukiyoeUrlCache[cacheKey] = wikiImg;
        ukiyoeResolvedMetaCache[cacheKey] = {
          sourceLabel: defaultWiki,
          caption: defaultWiki
        };
        return wikiImg;
      }
    }

    // 5. 【第2優先】浮世絵DB（UKIYOE_DB）に該当作品がある場合は、Wikimedia Commons APIで実在確認した画像（測定バーなし版）
    const matchedUkiyoe = UKIYOE_DB.find(u => Array.isArray(u.places) && u.places.includes(placeObj.key))
      || (placeObj.ukiyoe_query ? UKIYOE_DB.find(u => u.commons_query === placeObj.ukiyoe_query || u.file_key === placeObj.ukiyoe_query) : null);
    if (matchedUkiyoe) {
      const resolvedArt = await resolveUkiyoeEntry(matchedUkiyoe);
      if (resolvedArt && resolvedArt.thumbUrl) {
        ukiyoeUrlCache[cacheKey] = resolvedArt.thumbUrl;
        ukiyoeResolvedMetaCache[cacheKey] = {
          sourceLabel: resolvedArt.articleTitle,
          caption: resolvedArt.caption || placeObj.ukiyoe_caption || placeObj.key
        };
        return resolvedArt.thumbUrl;
      }
    }

    // 6. 【第3優先】上記がいずれもない場合は 個別Wikipedia記事の代表風景写真
    if (defaultWiki) {
      const fallbackWikiImg = await fetchWikiLeadImage(defaultWiki);
      if (fallbackWikiImg) {
        ukiyoeUrlCache[cacheKey] = fallbackWikiImg;
        ukiyoeResolvedMetaCache[cacheKey] = {
          sourceLabel: defaultWiki,
          caption: defaultWiki
        };
        return fallbackWikiImg;
      }
    }

    return null;
  }

  function getActivePlaceVisualMeta(placeObj, resolvedUrl) {
    if (!placeObj) return { isSet: false, sourceLabel: '未設定', caption: '' };
    const ov = getPlaceImageOverride(placeObj.key);
    const defaultWiki = placeObj.wiki_title || placeObj.key;

    // 1. 画面上でユーザーが変更したオーバーライド
    if (ov) {
      if (ov.sourceType === 'none' || !(ov.thumbUrl || ov.url || resolvedUrl)) {
        return { isSet: false, sourceLabel: `未設定（候補: 浮世絵DB ／ Wiki「${defaultWiki}」）`, caption: '' };
      }
      return {
        isSet: true,
        sourceLabel: ov.articleTitle || (ov.sourceType === 'ukiyoe' ? '浮世絵DB' : defaultWiki),
        caption: ov.caption || placeObj.key
      };
    }

    if (ukiyoeResolvedMetaCache[placeObj.key] && resolvedUrl) {
      return {
        isSet: true,
        sourceLabel: ukiyoeResolvedMetaCache[placeObj.key].sourceLabel,
        caption: ukiyoeResolvedMetaCache[placeObj.key].caption
      };
    }

    if (placeObj.fixed_image_url) {
      return {
        isSet: true,
        sourceLabel: defaultWiki,
        caption: placeObj.ukiyoe_caption || placeObj.key
      };
    }

    if (resolvedUrl) {
      return {
        isSet: true,
        sourceLabel: defaultWiki,
        caption: defaultWiki
      };
    }

    return {
      isSet: false,
      sourceLabel: `未設定（候補: 浮世絵DB ／ Wiki「${defaultWiki}」）`,
      caption: ''
    };
  }

  function getActiveGmapInfo(placeObj) {
    if (!placeObj) return null;
    const ov = getPlaceImageOverride(placeObj.key);
    if (ov) {
      if (ov.sourceType === 'gmap') {
        const sName = ov.gmapSpotName || placeObj.gmap_spot_name || placeObj.key;
        const pCode = ov.gmapPlusCode || placeObj.gmap_plus_code || '';
        return {
          spotName: sName,
          plusCode: pCode,
          query: [sName, pCode].filter(Boolean).join(' ')
        };
      }
      return null;
    }
    if (placeObj.default_source_type === 'gmap' && (placeObj.gmap_spot_name || placeObj.gmap_plus_code)) {
      return {
        spotName: placeObj.gmap_spot_name || placeObj.key,
        plusCode: placeObj.gmap_plus_code || '',
        query: [placeObj.gmap_spot_name, placeObj.gmap_plus_code].filter(Boolean).join(' ')
      };

    return null;
  }

  function renderToastGmapCard(placeObj, gmapInfo) {
    const imgEl = document.getElementById('toastUkiyoeImg');
    const gmapWrapEl = document.getElementById('toastGmapWrap');
    const capEl = document.getElementById('toastUkiyoeCaption');

  // =========================================================================
  // 地名モーダル（マップトースト）の複数ソースタブ表示
  // source_matrix.html で「✅ 採用（ON）」にした列（最大4種類）だけをタブとして出し、読者が1クリックで切り替える。
  // ON/OFF は列ごとに独立（択一ではない）。未操作の初期値は「データがあれば ON」。
  // =========================================================================
  const SOURCE_CFG_STORAGE_KEY = 'utamakura_source_config_v1';
  const SOURCE_TAB_DEFS = [
    { col: 'fukeichi', label: '🏞️ 名勝Wiki' },
    { col: 'wiki', label: '📷 個別Wiki' },
    { col: 'ukiyoe', label: '🎨 浮世絵' },
    { col: 'gmap', label: '📍 Googleマップ' }
  ];
  // 名勝一覧Wikiの該当行から試す写真の最大件数
  const TOAST_FUKEICHI_MATCH_LIMIT = 3;
  // 個別Wiki解説文の最大文字数
  const TOAST_WIKI_EXTRACT_MAX_CHARS = 140;
  // 画像の読み込み可否確認のタイムアウト（ミリ秒）
  const TOAST_IMG_PROBE_TIMEOUT_MS = 12000;
  // 現地マップ埋め込みの拡大率（スポット単位で見える縮尺）
  const TOAST_GMAP_ZOOM = 16;

  let sourceCfg = {};
  try {
    const rawCfg = localStorage.getItem(SOURCE_CFG_STORAGE_KEY);
    if (rawCfg) sourceCfg = JSON.parse(rawCfg);
  } catch (e) {
    sourceCfg = {};
  }
  const toastSourcePromiseCache = {};
  const toastActiveColByPlace = {};

  // 列④：GoogleマップURL（https://www.google.com/maps/place/...）またはスポット名＋プラスコードから表示情報を組み立てる
  function resolveToastGmapTarget(spot, plusOrUrl) {
    const s = (spot || '').trim();
    const p = (plusOrUrl || '').trim();
    if (!s && !p) return null;
    if (/^https?:\/\//i.test(p)) {
      let embedQ = s;
      const placeMatch = p.match(/\/maps\/place\/([^/@?]+)/);
      const coordMatch = p.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      const placeName = placeMatch ? decodeURIComponent(placeMatch[1].replace(/\+/g, ' ')) : s;
      if (placeName && coordMatch) {
        embedQ = `${placeName} (${coordMatch[1]}, ${coordMatch[2]})`;
      } else if (placeName) {
        embedQ = placeName;
      }
      return {
        spot: s || placeName,
        plus: '',
        query: embedQ || s,
        openUrl: p
      };
    }
    const q = (s + ' ' + p).trim();
    return {
      spot: s,
      plus: p,
      query: q,
      openUrl: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`
    };
  }

  function getSourceGmap(placeObj) {
    const c = sourceCfg[placeObj.key] && sourceCfg[placeObj.key].gmap;
    if (c && (c.spot || c.plus)) {
      return resolveToastGmapTarget(c.spot || placeObj.gmap_spot_name || '', c.plus || '');
    }
    return resolveToastGmapTarget(placeObj.gmap_spot_name || '', placeObj.gmap_plus_code || '');
  }

  function isSourceOn(placeObj, col, hasData) {
    if (!hasData) return false;
    const cfg = sourceCfg[placeObj.key];
    if (cfg && cfg.on && typeof cfg.on[col] === 'boolean') return cfg.on[col];
    if (placeObj.default_source_on && typeof placeObj.default_source_on[col] === 'boolean') return placeObj.default_source_on[col];
    return true;
  }

  function probeToastImage(url) {
    return new Promise(resolve => {
      if (!url) { resolve(false); return; }
      const im = new Image();
      const timer = setTimeout(() => { im.onload = im.onerror = null; resolve(false); }, TOAST_IMG_PROBE_TIMEOUT_MS);
      im.onload = () => { clearTimeout(timer); resolve(true); };
      im.onerror = () => { clearTimeout(timer); resolve(false); };
      im.src = url;
    });
  }

  // 候補URLを順に読み込み確認し、実際に表示できた最初の画像を返す（リンク切れを出さない）
  async function pickLoadableToastImage(urls) {
    for (const u of urls) {
      if (u && await probeToastImage(u)) return u;
    }
    return null;
  }

  async function fetchWikiExtract(wikiTitle) {
    if (!wikiTitle) return '';
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`);
      if (!res.ok) return '';
      const d = await res.json();
      const txt = d.extract || '';
      return txt.length > TOAST_WIKI_EXTRACT_MAX_CHARS ? txt.slice(0, TOAST_WIKI_EXTRACT_MAX_CHARS) + '…' : txt;
    } catch (e) {
      return '';
    }
  }

  // ①名勝写真・②個別Wiki写真と記事・③浮世絵 を解決する（source_matrix.html と完全同一ロジック。④は常に利用可能）
  function resolvePlaceSources(placeObj) {
    if (toastSourcePromiseCache[placeObj.key]) return toastSourcePromiseCache[placeObj.key];
    const p = (async () => {
      const out = { fukeichi: null, wiki: null, ukiyoe: null };
      let matrixCache = null;
      try {
        const rawMc = localStorage.getItem(MATRIX_RESOLVED_CACHE_KEY);
        if (rawMc) matrixCache = JSON.parse(rawMc);
      } catch (e) {}

      if (placeObj.fukeichi_title) {
        const urls = [];
        if (matrixCache && matrixCache.fukeichi && matrixCache.fukeichi[placeObj.key] && matrixCache.fukeichi[placeObj.key].thumbUrl) {
          urls.push(matrixCache.fukeichi[placeObj.key].thumbUrl);
        }
        try {
          const fm = await getFukeichiCandidatesForPlace(placeObj);
          fm.slice(0, TOAST_FUKEICHI_MATCH_LIMIT).forEach(f => urls.push(f.thumbUrl));
        } catch (e) {}
        if (placeObj.fixed_image_url) urls.push(placeObj.fixed_image_url);
        let url = await pickLoadableToastImage(urls);
        let wikiUsed = 'おくのほそ道の風景地';
        if (!url) {
          for (const t of (placeObj.fukeichi_wiki_candidates || [])) {
            const w = await fetchWikiLeadImage(t);
            url = await pickLoadableToastImage([w]);
            if (url) { wikiUsed = t; break; }
          }
        }
        if (url) {
          out.fukeichi = {
            url: url,
            note: '',
            linkUrl: `https://ja.wikipedia.org/wiki/${encodeURIComponent(wikiUsed)}`,
            linkText: `📖 ${placeObj.fukeichi_title || wikiUsed} ↗`
          };
        }
      }

      if (placeObj.wiki_title) {
        const urls = [];
        if (matrixCache && matrixCache.wiki && matrixCache.wiki[placeObj.key] && matrixCache.wiki[placeObj.key].thumbUrl) {
          urls.push(matrixCache.wiki[placeObj.key].thumbUrl);
        }
        if (placeObj.fixed_image_url && placeObj.default_source_type === 'wiki') urls.push(placeObj.fixed_image_url);
        urls.push(await fetchWikiLeadImage(placeObj.wiki_title));
        const url = await pickLoadableToastImage(urls);
        if (url) {
          out.wiki = {
            url: url,
            note: '',
            linkUrl: `https://ja.wikipedia.org/wiki/${encodeURIComponent(placeObj.wiki_title)}`,
            linkText: `📖 ${placeObj.wiki_title} ↗`
          };
        }
      }

      const entry = UKIYOE_DB.find(u => Array.isArray(u.places) && u.places.includes(placeObj.key))
        || (placeObj.ukiyoe_query ? UKIYOE_DB.find(u => u.commons_query === placeObj.ukiyoe_query || u.file_key === placeObj.ukiyoe_query) : null);
      if (entry) {
        const uUrls = [];
        if (matrixCache && matrixCache.ukiyoe && matrixCache.ukiyoe[placeObj.key] && matrixCache.ukiyoe[placeObj.key].thumbUrl) {
          uUrls.push(matrixCache.ukiyoe[placeObj.key].thumbUrl);
        }
        const r = await resolveUkiyoeEntry(entry, placeObj.key);
        if (r && r.thumbUrl) uUrls.push(r.thumbUrl);
        const url = await pickLoadableToastImage(uUrls);
        if (url) {
          out.ukiyoe = {
            url: url,
            note: entry.caption || `${entry.artist}『${entry.series} ${entry.title}』`,
            linkUrl: '',
            linkText: ''
          };
        }
      }
      return out;
    })();
    toastSourcePromiseCache[placeObj.key] = p;
    return p;
  }

  function selectToastSourceTab(placeKey, col) {
    const placeObj = PLACES.find(p => p.key === placeKey);
    if (!placeObj) return;
    toastActiveColByPlace[placeKey] = col;
    resolvePlaceSources(placeObj).then(s => renderToastSources(placeObj, s));
  }

  // ON になっているソースだけをタブにし、選択中のソースの内容を表示する
  function renderToastSources(placeObj, sources) {
    const tabsEl = document.getElementById('toastSrcTabs');
    if (!tabsEl || tabsEl.dataset.place !== placeObj.key) return;
    const imgEl = document.getElementById('toastUkiyoeImg');
    const gmapWrapEl = document.getElementById('toastGmapWrap');
    const noteEl = document.getElementById('toastSrcNote');

    const avail = SOURCE_TAB_DEFS.filter(d => d.col === 'gmap'
      ? isSourceOn(placeObj, 'gmap', getSourceGmap(placeObj) !== null)
      : isSourceOn(placeObj, d.col, Boolean(sources[d.col])));

    if (avail.length === 0) {
      tabsEl.innerHTML = '';
      if (imgEl) imgEl.style.display = 'none';
      if (gmapWrapEl) gmapWrapEl.style.display = 'none';
      if (noteEl) {
        noteEl.textContent = '';
        noteEl.style.display = 'none';
      }
      return;
    }

    let active = toastActiveColByPlace[placeObj.key];
    if (!avail.some(d => d.col === active)) active = avail[0].col;
    toastActiveColByPlace[placeObj.key] = active;

    const safeKey = placeObj.key.replace(/'/g, "\'");
    tabsEl.innerHTML = avail.length > 1 ? avail.map(d => {
      const isActive = d.col === active;
      const style = isActive
        ? 'background:#ffb300; color:#1a130e; border:1px solid #ffe082;'
        : 'background:#3e2f26; color:#ffe082; border:1px solid #795548;';
      return `<button type="button" style="${style} font-size:0.68rem; font-weight:bold; padding:2px 7px; border-radius:3px; cursor:pointer;" onclick="selectToastSourceTab('${safeKey}', '${d.col}')">${d.label}</button>`;
    }).join('') : '';

    if (active === 'gmap') {
      const g = getSourceGmap(placeObj);
      const coordQuery = g.query;
      const embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(coordQuery)}&t=m&z=${TOAST_GMAP_ZOOM}&output=embed&hl=ja`;
      if (imgEl) imgEl.style.display = 'none';
      if (noteEl) {
        noteEl.textContent = '';
        noteEl.style.display = 'none';
      }
      if (gmapWrapEl) {
        gmapWrapEl.innerHTML = `
          <iframe src="${embedUrl}" style="width:100%; height:160px; border:1px solid #81c784; border-radius:4px; background:#111;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
        gmapWrapEl.style.display = 'block';
      }
      return;
    }

    const src = sources[active];
    if (gmapWrapEl) gmapWrapEl.style.display = 'none';
    if (noteEl) {
      const htmlStr = (src.note ? escapeHtmlSimple(src.note) : '') + (src.linkUrl
        ? `<a href="${src.linkUrl}" target="_blank" rel="noopener" style="color:#90caf9; text-decoration:none;">${escapeHtmlSimple(src.linkText)}</a>`
        : '');
      noteEl.innerHTML = htmlStr;
      noteEl.style.display = htmlStr ? 'block' : 'none';
    }
    if (imgEl) {
      imgEl.onerror = () => {
        // 表示直前に読み込めなくなった画像のタブは出さず、次のソースへ切り替える
        imgEl.onerror = null;
        sources[active] = null;
        renderToastSources(placeObj, sources);
      };
      imgEl.src = src.url;
      imgEl.style.display = 'block';
    }
  }

  async function loadToastUkiyoePreview(placeObj) {
    if (!placeObj) return;
    const tabsEl = document.getElementById('toastSrcTabs');
    const noteEl = document.getElementById('toastSrcNote');
    const imgEl = document.getElementById('toastUkiyoeImg');
    const gmapWrapEl = document.getElementById('toastGmapWrap');
    if (!tabsEl) return;
    tabsEl.dataset.place = placeObj.key;
    tabsEl.innerHTML = '';
    if (imgEl) imgEl.style.display = 'none';
    if (gmapWrapEl) gmapWrapEl.style.display = 'none';
    if (noteEl) {
      noteEl.textContent = '';
      noteEl.style.display = 'none';
    }
    const sources = await resolvePlaceSources(placeObj);
    renderToastSources(placeObj, sources);
  }

  // 6. データベースに埋め込まれた確定タグ（{type:key|surface}）を直接HTMLへ変換
  function getActivePersonsList() {
    return Array.from(new Set(
      getVisibleRecords().flatMap(r => (r.persons || '').split(',').map(s => s.trim()).filter(Boolean))
    ));
  }

  function getPlaceSubTypeLabel(placeKey) {
    const p = PLACES.find(item => item.key === placeKey);
    if (!p) return `地名(${placeKey})`;
    if (p.is_area) return `🗺️地名[エリア](${placeKey})`;
    if (p.is_river) return `🌊地名[河川](${placeKey})`;
    return `📍地名[地点](${placeKey})`;
  }

  function renderEmbeddedTags(taggedText, recId) {
    if (!taggedText) return '';
    const editHint = isEditModeActive() ? ' ／ 右クリックまたはドラッグ選択で指摘' : '';
    return taggedText.replace(/\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g, (m, tagType, key, surface) => {
      const safeKey = key.replace(/'/g, "\'");
      const safeSurface = surface.replace(/'/g, "\'");
      if (tagType === 'place') {
        const subLabel = getPlaceSubTypeLabel(key);
        return `<span class="inline-place" data-tag-type="place" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" title="${subLabel}：クリックで地図移動${editHint}">${surface}</span>`;
      } else if (tagType === 'office') {
        return `<span class="inline-office" data-tag-type="office" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" title="👑官職(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'person') {
        return `<span class="inline-person" data-tag-type="person" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" title="👤人名(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'special') {
        return `<span class="inline-special" data-tag-type="special" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" title="🔖特別キーワード(${key})：クリックで解説${editHint}">${surface}</span>`;
      }
      return surface;
    });
  }

  // 7. 本文・発句リーダー描画
  const recordListEl = document.getElementById('recordList');
  const paraTopNavEl = document.getElementById('paraTopNav');
  let currentParaIndex = 1;

  function getSectionLabelForPara(paraIdx) {
    const rec = RECORDS.find(r => r.para_index === paraIdx);
    const shortSec = rec ? (rec.section_title || `第${paraIdx}段`) : `第${paraIdx}段`;
    if (isEditModeActive()) {
      const pubBadge = paraIdx <= PUBLISHED_MAX_PARA ? '✅ ' : '🔧 ';
      return `${pubBadge}${shortSec}`;
    }
    return shortSec;
  }

  function goToParagraph(paraIdx) {
    const maxVis = getMaxVisibleParagraph();
    const clamped = Math.max(1, Math.min(maxVis, paraIdx));
    currentParaIndex = clamped;
    const showAllEl = document.getElementById('toggleShowAllParas');
    if (showAllEl && showAllEl.checked) {
      showAllEl.checked = false;
    }
    activeHighlightLayers.forEach(layer => map.removeLayer(layer));
    activeHighlightLayers = [];
    const toastEl = document.getElementById('mapToast');
    if (toastEl) toastEl.style.display = 'none';
    renderMapLayersForCurrentMode();
    renderReaderList();
    recordListEl.scrollTop = 0;
    const firstRec = getVisibleRecords().find(r => r.para_index === currentParaIndex);
    if (firstRec) {
      setActiveRecord(firstRec.id);
    }
  }

  function changeParagraph(delta) {
    goToParagraph(currentParaIndex + delta);

  const SVS_BG_ASSET_VERSION = 'v3';
  const svsBgImages = {};
  function getVersionedBgUrl(url) {
    if (!url) return '';
    if (url.startsWith('http') || url.includes('?')) return url;
    return `${url}?v=${SVS_BG_ASSET_VERSION}`;
  }
  function preloadSvsBgImage(url) {
    if (!url) return null;
    const vUrl = getVersionedBgUrl(url);
    if (svsBgImages[url]) return svsBgImages[url];
    const img = new Image();
    img.src = encodeURI(vUrl);
    svsBgImages[url] = img;
    return img;
  }
  // RECORDS内の全句のbg_theme/bg_pathを自動同期し、未登録による第1句へのフォールバックを完全に防止する
  RECORDS.forEach(rec => {
    if (rec.verse && rec.verse.bg_theme && rec.verse.bg_path) {
      const exists = SVS_BG_THEMES.some(t => t.key === rec.verse.bg_theme);
      if (!exists) {
        SVS_BG_THEMES.unshift({
          key: rec.verse.bg_theme,
          label: rec.verse.bg_title || rec.verse.bg_theme,
          bgPath: rec.verse.bg_path,
          customScene: 'yukuharu'
        });
      }
    }
  });
  SVS_BG_THEMES.forEach(t => { if (t.bgPath) preloadSvsBgImage(t.bgPath); });

  const svsGoldParticles = Array.from({ length: SVS_GOLD_PARTICLE_COUNT }, (_, i) => ({
    x: (i * 197) % SVS_CANVAS_WIDTH_PX,
    y: (i * 313) % SVS_CANVAS_HEIGHT_PX,
    radius: 2.2 + (i % 4),
    speedY: -14 - (i % 16),
    speedX: 6 - (i % 13),
    phase: i * 0.7
  }));

  let svsAnimFrameId = null;
  let svsAnimStartTimeMs = 0;
  let svsCurrentVerseState = null;

  function stopSvsCanvasAnimation() {
    if (svsAnimFrameId) {
      cancelAnimationFrame(svsAnimFrameId);
      svsAnimFrameId = null;
    }
  }

  function drawUtamakuraCustomBackground(ctx, sceneType, elapsedMs) {
    const tSec = elapsedMs / SVS_MS_PER_SECOND;
    ctx.save();

    if (sceneType === 'hina') {
      // 🎎 桃の節句・草庵の雛（深川の草庵から春霞・桃色の彩りへ移り変わる情景）
      const bgGrad = ctx.createLinearGradient(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);
      bgGrad.addColorStop(0, '#3a2328');
      bgGrad.addColorStop(0.45, '#593138');
      bgGrad.addColorStop(1, '#2b1d18');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 上部・右側の春霞と桃の花びらシルエット
      const glowGrad = ctx.createRadialGradient(860, 320, 40, 860, 320, 520);
      glowGrad.addColorStop(0, 'rgba(255, 183, 197, 0.32)');
      glowGrad.addColorStop(1, 'rgba(255, 183, 197, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 雛祭りの菱餅・ぼんぼりを思わせる雅な金砂子と桃色の霞帯
      ctx.strokeStyle = 'rgba(218, 175, 105, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(SVS_PAPER_LEFT_X_PX - 14, SVS_PAPER_TOP_Y_PX - 14, (SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX) + 28, (SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX) + 28);
    } else {
      // 🚣 千住の舟出・行く春の水辺（暁の朧月・隅田川の水面・霞む富士のシルエット）
      const skyGrad = ctx.createLinearGradient(0, 0, 0, SVS_CANVAS_HEIGHT_PX);
      skyGrad.addColorStop(0, '#1c2838');
      skyGrad.addColorStop(0.35, '#3b4d63');
      skyGrad.addColorStop(0.7, '#5c4b51');
      skyGrad.addColorStop(1, '#18222c');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

      // 有明の朧月（右上）
      const moonGrad = ctx.createRadialGradient(880, 250, 15, 880, 250, 170);
      moonGrad.addColorStop(0, 'rgba(255, 243, 200, 0.75)');
      moonGrad.addColorStop(0.4, 'rgba(255, 235, 180, 0.22)');
      moonGrad.addColorStop(1, 'rgba(255, 235, 180, 0)');
      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(880, 250, 170, 0, Math.PI * 2);
      ctx.fill();

      // 下部の隅田川の水面さざ波
      ctx.strokeStyle = 'rgba(190, 215, 235, 0.22)';
      ctx.lineWidth = 2.5;
      for (let w = 0; w < 6; w++) {
        const waveY = 1560 + w * 48 + Math.sin(tSec * 1.6 + w) * 6;
        ctx.beginPath();
        ctx.moveTo(80, waveY);
        ctx.quadraticCurveTo(540, waveY - 14, 980, waveY);
        ctx.stroke();
      }
    }

    // 中央の古典和紙短冊領域 (mask_layout.png 準拠: X:108-809, Y:400-1499)
    const paperW = SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX;
    const paperH = SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX;
    const washiGrad = ctx.createLinearGradient(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, SVS_PAPER_RIGHT_X_PX, SVS_PAPER_BOTTOM_Y_PX);
    if (sceneType === 'hina') {
      washiGrad.addColorStop(0, '#fcf7f2');
      washiGrad.addColorStop(0.5, '#f7efe6');
      washiGrad.addColorStop(1, '#f2e3d5');
    } else {
      washiGrad.addColorStop(0, '#f8f5ec');
      washiGrad.addColorStop(0.5, '#f3ede0');
      washiGrad.addColorStop(1, '#e8e0cf');
    }
    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = washiGrad;
    ctx.fillRect(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, paperW, paperH);
    ctx.shadowBlur = 0;

    // 和紙内の淡い金箔・内枠
    ctx.strokeStyle = 'rgba(168, 132, 87, 0.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(SVS_PAPER_LEFT_X_PX + 12, SVS_PAPER_TOP_Y_PX + 12, paperW - 24, paperH - 24);
    ctx.restore();
  }

  async function ensureUkiyoePlaceBgLoaded(placeKey) {
    const found = PLACES.find(p => p.key === placeKey);
    if (!found) return null;
    const imgUrl = await fetchPublicDomainUkiyoeUrl(found.ukiyoe_query, found.wiki_title || found.key);
    if (imgUrl) {
      return preloadSvsBgImage(imgUrl);
    }
    return null;
  }

  function drawUkiyoeWithWashiFrame(ctx, img) {
    // 浮世絵を1080x1920キャンバス全面にアスペクト比維持（cover）で描画し、中央に半透明の古典和紙短冊を重ねる
    const iw = img.naturalWidth || SVS_CANVAS_WIDTH_PX;
    const ih = img.naturalHeight || SVS_CANVAS_HEIGHT_PX;
    const scale = Math.max(SVS_CANVAS_WIDTH_PX / iw, SVS_CANVAS_HEIGHT_PX / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = (SVS_CANVAS_WIDTH_PX - dw) * 0.5;
    const dy = (SVS_CANVAS_HEIGHT_PX - dh) * 0.5;
    ctx.drawImage(img, dx, dy, dw, dh);

    // 周囲を落ち着かせる淡いビネット
    ctx.fillStyle = 'rgba(20, 15, 10, 0.24)';
    ctx.fillRect(0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);

    // 中央の和紙短冊領域（浮世絵がほんのり透ける上品な和紙）
    const paperW = SVS_PAPER_RIGHT_X_PX - SVS_PAPER_LEFT_X_PX;
    const paperH = SVS_PAPER_BOTTOM_Y_PX - SVS_PAPER_TOP_Y_PX;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(250, 245, 234, 0.88)';
    ctx.fillRect(SVS_PAPER_LEFT_X_PX, SVS_PAPER_TOP_Y_PX, paperW, paperH);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(168, 132, 87, 0.65)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(SVS_PAPER_LEFT_X_PX + 12, SVS_PAPER_TOP_Y_PX + 12, paperW - 24, paperH - 24);
  }

  function drawSvsBackgroundAndParticles(ctx, themeKey, elapsedMs) {
    const themeObj = SVS_BG_THEMES.find(t => t.key === themeKey) || SVS_BG_THEMES[0];
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const img = themeObj.bgPath ? svsBgImages[themeObj.bgPath] : null;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, 0, 0, SVS_CANVAS_WIDTH_PX, SVS_CANVAS_HEIGHT_PX);
    } else if (themeObj.customScene) {
      drawUtamakuraCustomBackground(ctx, themeObj.customScene, elapsedMs);
    } else {
      drawUtamakuraCustomBackground(ctx, 'hina', elapsedMs);
    }

    // 金砂子・桜花びらの舞うパーティクル描画
    const tSec = elapsedMs / SVS_MS_PER_SECOND;
    const isPetalTheme = (themeKey === 'hina_peach' || themeKey === 'yukuharu_senju' || themeKey === 'spring_sakura');
    for (const p of svsGoldParticles) {
      const px = (p.x + p.speedX * tSec + SVS_CANVAS_WIDTH_PX) % SVS_CANVAS_WIDTH_PX;
      const py = (p.y + p.speedY * tSec + SVS_CANVAS_HEIGHT_PX) % SVS_CANVAS_HEIGHT_PX;
      const shimmer = 0.22 + 0.16 * Math.sin(tSec * 2.5 + p.phase);
      ctx.beginPath();
      if (isPetalTheme && (p.radius > 3.5)) {
        ctx.ellipse(px, py, p.radius * 1.6, p.radius * 0.9, tSec + p.phase, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 192, 203, ${(shimmer * 1.15).toFixed(3)})`;
      } else {
        ctx.arc(px, py, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(218, 185, 110, ${shimmer.toFixed(3)})`;
      }
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSvsVerticalChar(ctx, ch, x, y, fontSize, alpha, textColor) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const smallKana = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ';
    const puncChars = '、。';
    const longDash = 'ー―‐';

    if (puncChars.includes(ch)) {
      ctx.fillText(ch, x + fontSize * 0.34, y - fontSize * 0.32);
    } else if (smallKana.includes(ch)) {
      ctx.font = `400 ${Math.round(fontSize * 0.82)}px 'Yuji Syuku', 'Yu Mincho', serif`;
      ctx.fillText(ch, x + fontSize * 0.10, y - fontSize * 0.06);
    } else if (longDash.includes(ch)) {
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 2);
      ctx.fillText('―', 0, 0);
    } else {
      ctx.fillText(ch, x, y);
    }
    ctx.restore();
  }

  function renderSvsFrame(ctx, elapsedMs) {
    if (!svsCurrentVerseState) return;
    const { genre, lines, author, bgTheme } = svsCurrentVerseState;
    const isTanka = (genre === 'tanka');

    const lineXCoords = isTanka ? SVS_TANKA_LINE_X_COORDS_PX : SVS_HAIKU_LINE_X_COORDS_PX;
    const lineIndentY = isTanka ? SVS_TANKA_LINE_INDENT_Y_PX : SVS_HAIKU_LINE_INDENT_Y_PX;
    const authorX = isTanka ? SVS_TANKA_AUTHOR_X_PX : SVS_HAIKU_AUTHOR_X_PX;
    const baseFontSize = isTanka ? 64 : 82;
    const baseCharSpacing = isTanka ? 82 : 106;
    const authorFontSize = isTanka ? 44 : 50;
    const authorCharSpacing = isTanka ? 58 : 66;
    const fontFamily = isTanka ? "'Shippori Mincho', 'Yu Mincho', serif" : "'Yuji Syuku', 'Yu Mincho', serif";

    const totalCycleMs = SVS_INTRO_SILENCE_MS + (lines.length * SVS_LINE_APPEAR_INTERVAL_MS) + SVS_AUTHOR_WRITE_SPAN_MS + SVS_OUTRO_HOLD_MS;
    const loopElapsedMs = elapsedMs % totalCycleMs;

    drawSvsBackgroundAndParticles(ctx, bgTheme, elapsedMs);

    ctx.save();
    lines.forEach((lineText, lineIdx) => {
      const chars = Array.from(lineText || '');
      if (chars.length === 0) return;

      const x = lineXCoords[lineIdx] || lineXCoords[lineXCoords.length - 1];
      const startY = SVS_PAPER_SAFE_TOP_Y_PX + (lineIndentY[lineIdx] || 0);
      const maxAvailH = SVS_PAPER_SAFE_BOTTOM_Y_PX - startY;
      const charSpacing = Math.min(baseCharSpacing, Math.floor(maxAvailH / Math.max(1, chars.length)));
      const fontSize = Math.min(baseFontSize, Math.round(charSpacing * 0.84));

      ctx.font = `400 ${fontSize}px ${fontFamily}`;

      const lineStartMs = SVS_INTRO_SILENCE_MS + lineIdx * SVS_LINE_APPEAR_INTERVAL_MS;
      const perCharDelayMs = chars.length > 1 ? (SVS_LINE_WRITE_SPAN_MS / chars.length) : 0;

      chars.forEach((ch, cIdx) => {
        const charTriggerMs = lineStartMs + cIdx * perCharDelayMs;
        const rawProgress = (loopElapsedMs - charTriggerMs) / SVS_CHAR_FADE_DURATION_MS;
        const alpha = Math.max(0, Math.min(1, rawProgress));
        if (alpha > 0) {
          const y = startY + cIdx * charSpacing + fontSize * 0.5;
          drawSvsVerticalChar(ctx, ch, x, y, fontSize, alpha, '#181412');
        }
      });
    });

    // 作者名の縦書き描画（下揃え）
    if (author) {
      const authorChars = Array.from(author);
      const authorStartMs = SVS_INTRO_SILENCE_MS + lines.length * SVS_LINE_APPEAR_INTERVAL_MS;
      const perAuthorCharMs = authorChars.length > 1 ? (SVS_AUTHOR_WRITE_SPAN_MS / authorChars.length) : 0;
      const totalAuthorH = authorChars.length * authorCharSpacing;
      const authorTopY = SVS_PAPER_SAFE_BOTTOM_Y_PX - totalAuthorH;

      ctx.font = `400 ${authorFontSize}px ${fontFamily}`;
      authorChars.forEach((ch, aIdx) => {
        const charTriggerMs = authorStartMs + aIdx * perAuthorCharMs;
        const rawProgress = (loopElapsedMs - charTriggerMs) / SVS_CHAR_FADE_DURATION_MS;
        const alpha = Math.max(0, Math.min(1, rawProgress));
        if (alpha > 0) {
          const y = authorTopY + aIdx * authorCharSpacing + authorFontSize * 0.5;
          drawSvsVerticalChar(ctx, ch, authorX, y, authorFontSize, alpha, '#3a2b22');
        }
      });
    }
    ctx.restore();
  }

  function startSvsModalLoop() {
    stopSvsCanvasAnimation();
    const canvas = document.getElementById('svsModalCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    svsAnimStartTimeMs = performance.now();

    function step(nowMs) {
      const elapsed = nowMs - svsAnimStartTimeMs;
      renderSvsFrame(ctx, elapsed);
      svsAnimFrameId = requestAnimationFrame(step);
    }
    svsAnimFrameId = requestAnimationFrame(step);
  }

  function openUnifiedModal(categoryType, itemKey, clickedSurface = '') {
    let headerTitle = '';

    let searchTerms = [];

    if (categoryType === 'person') {
      headerTitle = `👤 【人物】${itemKey}`;
      const pInfo = PERSONS_INFO[itemKey];
      if (pInfo) {

      const info = OFFICES[itemKey];

      headerTitle = `👑 【官職】${info.title}`;

        specialGlossaryDesc = info.ai_desc || '';

      searchTerms = info.match_terms || [itemKey];

  async function fetchWikipediaSummary(wikiTitle, containerId, fallbackDesc = '', hasSpecialBox = false) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const encoded = encodeURIComponent(wikiTitle);
    const wikiUrl = `https://ja.wikipedia.org/wiki/${encoded}`;
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encoded}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.type === 'disambiguation') throw new Error('Disambiguation');
      box.innerHTML = `
        <div style="font-weight:bold; color:#0d47a1; margin-bottom:4px;">🌐 【Wikipedia 概略】「${data.title}」</div>
        <div>${data.extract || '（要約テキストなし）'}</div>
        <a class="wiki-link-btn" href="${wikiUrl}" target="_blank" rel="noopener">Wikipediaで「${data.title}」のページを開く ↗</a>
      `;
    } catch (err) {
      if (hasSpecialBox) {
        box.style.display = 'none';
      } else if (fallbackDesc) {
        box.className = 'ai-special-box';
        box.innerHTML = `
          <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">📖 【語句・制度の意味解説】</div>
          <div>${fallbackDesc}</div>
        `;
      } else {
        box.style.display = 'none';
      }
    }
  }

  function appendOccurrencesToModal(container, records, highlightTerms) {
    records.forEach(rec => {

  function getBlockLabelFromElement(el) {
    if (!el) return '本文';
    if (el.closest('.raw-text')) return '原文';
    if (el.closest('.kakikudashi')) return '書き下し';
    if (el.closest('.translation')) return '現代語訳';
    return '本文';
  }

  function getRangeCharOffsetInContainer(containerEl, range) {
    if (!containerEl || !range) return -1;
    try {
      const preRange = range.cloneRange();
      preRange.selectNodeContents(containerEl);
      preRange.setEnd(range.startContainer, range.startOffset);
      return preRange.toString().length;
    } catch (e) {
      return -1;
    }
  }

  function extractSurroundingContext(containerEl, targetWord, exactOffset = -1) {
    if (!containerEl || !targetWord) return targetWord;
    const fullText = containerEl.innerText || containerEl.textContent || '';
    const idx = (exactOffset >= 0 && exactOffset <= fullText.length)
      ? exactOffset
      : fullText.indexOf(targetWord);
    if (idx === -1) return `【${targetWord}】`;
    const start = Math.max(0, idx - CONTEXT_SNIPPET_RADIUS_CHARS);
    const end = Math.min(fullText.length, idx + targetWord.length + CONTEXT_SNIPPET_RADIUS_CHARS);
    const prefix = (start > 0 ? '…' : '') + fullText.slice(start, idx);
    const suffix = fullText.slice(idx + targetWord.length, end) + (end < fullText.length ? '…' : '');
    return `${prefix}【${targetWord}】${suffix}`;
  }

  function openFeedbackBarForTagElement(el, recId, tagType, itemKey, surfaceText) {
    if (!isEditModeActive()) return;
    const blockEl = el.closest('.raw-text, .kakikudashi, .translation');
    const blockLabel = getBlockLabelFromElement(el);
    let exactOffset = -1;
    if (blockEl && el) {
      try {
        const r = document.createRange();
        r.selectNodeContents(el);
        exactOffset = getRangeCharOffsetInContainer(blockEl, r);
      } catch (e) {}
    }
    const contextStr = extractSurroundingContext(blockEl, surfaceText, exactOffset);
    const typeNameMap = {
      'place': getPlaceSubTypeLabel(itemKey),
      'person': `👤人名(${itemKey})`,
      'office': `👑官職(${itemKey})`,
      'special': `🔖特別語(${itemKey})`
    };

    pendingFeedbackContext = {
      recId: recId,
      blockLabel: blockLabel,
      word: surfaceText,
      contextStr: contextStr,
      currentTag: typeNameMap[tagType] || tagType,
      tagType: tagType,
      itemKey: itemKey
    };

    const rect = el.getBoundingClientRect();
    showSelectionFeedbackBarAtRect(rect);
  }

                           (tType === 'person' ? `👤人名(${tKey})` :

                           (tType === 'special' ? `🔖特別語(${tKey})` : `既タグ「${fullTagText}」`)));
        currentTag = fullTagText === selectedText ? detailType : `${detailType}の一部`;
      }

      pendingFeedbackContext = {
        recId: recId,
        blockLabel: blockLabel,
        word: selectedText,
        contextStr: contextStr,
        currentTag: currentTag,
        tagType: foundTagType,
        itemKey: foundTagKey
      };

      const rect = range.getBoundingClientRect();
      showSelectionFeedbackBarAtRect(rect);
    }, 10);

  function showSelectionFeedbackBarAtRect(rect) {
    if (!pendingFeedbackContext) return;
    const bar = document.getElementById('selectionFeedbackBar');
    document.getElementById('sfbMetaLabel').textContent = `[${pendingFeedbackContext.recId}・${pendingFeedbackContext.blockLabel}]`;
    document.getElementById('sfbTargetWord').textContent = pendingFeedbackContext.word;
    document.getElementById('sfbCurrentTagInfo').textContent = `（現在: ${pendingFeedbackContext.currentTag}）`;

    const imgBtn = document.getElementById('sfbPlaceImgBtn');
    if (imgBtn) {
      const matchedPlace = PLACES.find(p => p.key === pendingFeedbackContext.itemKey || p.key === pendingFeedbackContext.word);
      imgBtn.style.display = (pendingFeedbackContext.tagType === 'place' || matchedPlace) ? 'inline-flex' : 'none';
    }

    bar.style.display = 'flex';
    const barRect = bar.getBoundingClientRect();

    let topPx = rect.top - barRect.height - POPUP_OFFSET_Y_PX;
    if (topPx < POPUP_VIEWPORT_MARGIN_PX) {
      topPx = rect.bottom + POPUP_OFFSET_Y_PX;
    }
    let leftPx = rect.left + (rect.width / 2) - (barRect.width / 2);
    leftPx = Math.max(POPUP_VIEWPORT_MARGIN_PX, Math.min(window.innerWidth - barRect.width - POPUP_VIEWPORT_MARGIN_PX, leftPx));

    bar.style.top = `${Math.round(topPx)}px`;
    bar.style.left = `${Math.round(leftPx)}px`;
  }

    if (!str) return true;

  function getInlineOwnerOfImage(fileKey, selfPlaceKey) {
    if (!fileKey) return null;
    const norm = fileKey.replace(/^(File|ファイル):/i, '').trim();
    for (const p of PLACES) {
      if (p.key === selfPlaceKey) continue;
      const ov = getPlaceImageOverride(p.key);
      const usedKey = ov ? (ov.fileKey || '') : (p.fixed_image_file || '');
      if (usedKey && usedKey.replace(/^(File|ファイル):/i, '').trim() === norm) {
        return p.key;
      }
    }
    return null;
