八日、月山にのぼる。木綿しめ身に引かけ、宝冠に頭を包、強力と云ものに道びかれて、雲霧山気の中に、氷雪を踏でのぼる事八里、更に日月行道の雲関に入かとあやしまれ、息絶身こごえて、頂上に臻れば、日没て月顕る。笹を舗、篠を枕として、臥て明を待。日出て雲消れば、湯殿に下る。谷の傍に鍛冶小屋と云有。此国の鍛冶、霊水を選びて、爰に潔斎して剣を打、終月山と銘を切て世に賞せらる。彼龍泉に剣を淬とかや。干将・莫耶のむかしをしたふ。道に堪能の執あさからぬ事しられたり。岩に腰かけてしばしやすらふほど、三尺ばかりなる桜の、つぼみ半ばひらけるあり。ふり積雪の下に埋て、春を忘れぬ遅ざくらの花の心わりなし。炎天の梅花爰にかほるがごとし。行尊僧正の歌の哀も爰に思ひ出て、猶まさりて覚ゆ。惣而此山中の微細、行者の法式として他言する事を禁ず。仍て筆をとゞめて記さず。坊に帰れば、阿闍梨の需に依て、三山順礼の句々短冊に書。", "kakikudashi": "八日、月山にのぼる。木綿しめ身に引きかけ、宝冠に頭を包み、強力といふものに導かれて、雲霧山気の中に、氷雪を踏んでのぼる事八里、さらに日月行道の雲関に入るかとあやしまれ、息絶え身こごえて、頂上に臻れば、日没して月顕る。笹を敷き、篠を枕として、臥して明くるを待つ。日出でて雲消ゆれば、湯殿に下る。谷の傍らに鍛冶小屋といふあり。この国の鍛冶、霊水を選びて、ここに潔斎して剣を打ち、終に月山と銘を切りて世に賞せらる。かの龍泉に剣を淬ぐとかや。干将・莫耶のむかしを慕ふ。道に堪能の執あさからぬ事知られたり。岩に腰かけてしばしやすらふほど、三尺ばかりなる桜の、つぼみ半ばひらけるあり。降り積む雪の下に埋もれて、春を忘れぬ遅ざくらの花の心わりなし。炎天の梅花ここにかほるがごとし。行尊僧正の歌の哀れもここに思ひ出でて、なほまさりて覚ゆ。総じてこの山中の微細、行者の法式として他言する事を禁ず。よりて筆をとどめて記さず。坊に帰れば、阿闍梨の需めによりて、三山順礼の句々短冊に書く。", "translation": "六月八日、いよいよ主峰の月山に登った。白い木綿の注連を身に掛け、白布の宝冠で頭を包み、強力という山案内人に導かれて、立ちこめる雲霧と冷たい山気のただ中を、万年雪の氷雪を踏みしめて登ること八里、さらには太陽や月が運行する天上の日月行道の雲関に踏み入ったかと怪しまれるほどで、息も絶え絶えになり体も凍えきってようやく頂上にたどり着くと、太陽が沈んで澄んだ月が姿を現した。頂上の小屋で熊笹を敷き、篠竹を枕として横になり、夜の明けるのを待った。翌朝、日が昇って雲海が消え去ると、奥の院である湯殿へと下って行った。谷の傍らに鍛冶小屋と呼ばれる史跡がある。かつてこの出羽国の刀鍛冶が、清らかな霊水を選び、この場所に籠もって精進潔斎して刀剣を鍛え上げ、最後に「月山」と銘を切って世に高く賞賛されたのである。それはあたかも古代中国で名水・龍泉の水に刀剣を浸して焼き入れを行ったという故事さながらである。かの名工である干将・莫耶の昔が深く偲ばれる。芸道に秀でた名匠たちの並々ならぬ執念の深さがしみじみと思い知られた。岩に腰を下ろしてしばらく休息していると、高さ三尺ほどの小さな山桜が、つぼみを半分ほど開いているのが目にとまった。深く降り積もった雪の下に埋もれながらも、春を忘れずに健気に咲き出た遅ざくらの花のいじらしさは、なんとも胸に迫るものがある。禅語にいう「炎天の梅花」が、今まさにこの雪渓のほとりに清らかに薫り立っているかのようである。その昔、大峰山中で山桜を詠んだ行尊僧正の和歌のあわれさもこの場で思い出されて、古歌にもましてひとしお深い感動を覚えた。総じてこの湯殿山中の神秘の委細については、修験行者の厳重な掟として他言することが固く禁じられている。それゆえ、ここで筆をとどめてこれ以上は記さない。羽黒山の宿坊へ帰ると、会覚阿闍梨の求めに応じて、出羽三山巡礼の発句の数々を短冊に書き記した。", "persons": "行尊僧正", "places": "月山,湯殿山,山中温泉", "era_year": "元禄二年六月八日〜九日", "source_book": "", "keywords": "強力,雲関,干将・莫耶,阿闍梨", "raw_tagged": "八日、{{place:月山|月山}}にのぼる。木綿しめ身に引かけ、宝冠に頭を包、{{special:強力|強力}}と云ものに道びかれて、雲霧山気の中に、氷雪を踏でのぼる事八里、更に{{special:雲関|日月行道の雲関}}に入かとあやしまれ、息絶身こごえて、頂上に臻れば、日没て月顕る。笹を舗、篠を枕として、臥て明を待。日出て雲消れば、{{place:湯殿山|湯殿}}に下る。谷の傍に鍛冶小屋と云有。此国の鍛冶、霊水を選びて、爰に潔斎して剣を打、終{{place:月山|月山}}と銘を切て世に賞せらる。彼龍泉に剣を淬とかや。{{special:干将・莫耶|干将・莫耶}}のむかしをしたふ。道に堪能の執あさからぬ事しられたり。岩に腰かけてしばしやすらふほど、三尺ばかりなる桜の、つぼみ半ばひらけるあり。ふり積雪の下に埋て、春を忘れぬ遅ざくらの花の心わりなし。炎天の梅花爰にかほるがごとし。{{person:行尊僧正|行尊僧正}}の歌の哀も爰に思ひ出て、猶まさりて覚ゆ。惣而此{{place:山中温泉|山中}}の微細、行者の法式として他言する事を禁ず。仍て筆をとゞめて記さず。坊に帰れば、{{office:阿闍梨|阿闍梨}}の需に依て、三山順礼の句々短冊に書。", "kakikudashi_tagged": "八日、{{place:月山|月山}}にのぼる。木綿しめ身に引きかけ、宝冠に頭を包み、{{special:強力|強力}}といふものに導かれて、雲霧山気の中に、氷雪を踏んでのぼる事八里、さらに{{special:雲関|日月行道の雲関}}に入るかとあやしまれ、息絶え身こごえて、頂上に臻れば、日没して月顕る。笹を敷き、篠を枕として、臥して明くるを待つ。日出でて雲消ゆれば、{{place:湯殿山|湯殿}}に下る。谷の傍らに鍛冶小屋といふあり。この国の鍛冶、霊水を選びて、ここに潔斎して剣を打ち、終に{{place:月山|月山}}と銘を切りて世に賞せらる。かの龍泉に剣を淬ぐとかや。{{special:干将・莫耶|干将・莫耶}}のむかしを慕ふ。道に堪能の執あさからぬ事知られたり。岩に腰かけてしばしやすらふほど、三尺ばかりなる桜の、つぼみ半ばひらけるあり。降り積む雪の下に埋もれて、春を忘れぬ遅ざくらの花の心わりなし。炎天の梅花ここにかほるがごとし。{{person:行尊僧正|行尊僧正}}の歌の哀れもここに思ひ出でて、なほまさりて覚ゆ。総じてこの{{place:山中温泉|山中}}の微細、行者の法式として他言する事を禁ず。よりて筆をとどめて記さず。坊に帰れば、{{office:阿闍梨|阿闍梨}}の需めによりて、三山順礼の句々短冊に書く。", "translation_tagged": "六月八日、いよいよ主峰の{{place:月山|月山}}に登った。白い木綿の注連を身に掛け、白布の宝冠で頭を包み、{{special:強力|強力}}という山案内人に導かれて、立ちこめる雲霧と冷たい山気のただ中を、万年雪の氷雪を踏みしめて登ること八里、さらには太陽や月が運行する天上の{{special:雲関|日月行道の雲関}}に踏み入ったかと怪しまれるほどで、息も絶え絶えになり体も凍えきってようやく頂上にたどり着くと、太陽が沈んで澄んだ月が姿を現した。頂上の小屋で熊笹を敷き、篠竹を枕として横になり、夜の明けるのを待った。翌朝、日が昇って雲海が消え去ると、奥の院である{{place:湯殿山|湯殿}}へと下って行った。谷の傍らに鍛冶小屋と呼ばれる史跡がある。かつてこの出羽国の刀鍛冶が、清らかな霊水を選び、この場所に籠もって精進潔斎して刀剣を鍛え上げ、最後に「{{place:月山|月山}}」と銘を切って世に高く賞賛されたのである。それはあたかも古代中国で名水・龍泉の水に刀剣を浸して焼き入れを行ったという故事さながらである。かの名工である{{special:干将・莫耶|干将・莫耶}}の昔が深く偲ばれる。芸道に秀でた名匠たちの並々ならぬ執念の深さがしみじみと思い知られた。岩に腰を下ろしてしばらく休息していると、高さ三尺ほどの小さな山桜が、つぼみを半分ほど開いているのが目にとまった。深く降り積もった雪の下に埋もれながらも、春を忘れずに健気に咲き出た遅ざくらの花のいじらしさは、なんとも胸に迫るものがある。禅語にいう「炎天の梅花」が、今まさにこの雪渓のほとりに清らかに薫り立っているかのようである。その昔、大峰山中で山桜を詠んだ{{person:行尊僧正|行尊僧正}}の和歌のあわれさもこの場で思い出されて、古歌にもましてひとしお深い感動を覚えた。総じてこの湯殿{{place:山中温泉|山中}}の神秘の委細については、修験行者の厳重な掟として他言することが固く禁じられている。それゆえ、ここで筆をとどめてこれ以上は記さない。羽黒山の宿坊へ帰ると、会覚{{office:阿闍梨|阿闍梨}}の求めに応じて、出羽三山巡礼の発句の数々を短冊に書き記した。", "english_tagged": "On the eighth, we climbed {{place:月山|Mount Gassan}}. Draping white cotton sacred cords across our shoulders and wrapping our heads in white cloth crowns, we were led by mountain guides called {{special:強力|gōriki}} up eight leagues through swirling cloud-mist and frigid mountain vapors, treading over ice and snow until it seemed we were entering the {{special:雲関|Cloud Gate where the sun and moon themselves travel}}; gasping for breath and numb with cold, we reached the summit just as the sun sank and the moon appeared. Spreading bamboo grass for our bed and making a pillow of dwarf bamboo stems, we lay down and waited for dawn. When the sun rose and the clouds dispersed, we descended toward {{place:湯殿山|Yudono}}. Beside the valley stands a place called the Swordsmiths' Hut. Swordsmiths of this province chose the sacred waters here, purified themselves in strict abstinence to forge their blades, and finally carved the signature '{{place:月山|Gassan}}' upon the tang, winning high renown throughout the world. It recalls how ancient Chinese smiths tempered their swords in the waters of Longquan, awakening fond memories of {{special:干将・莫耶|Gan Jiang and Mo Ye}} of old. One could feel how deep was their devotion to mastering their craft. Sitting upon a rock to rest for a while, I noticed a dwarf cherry tree scarcely three feet tall with its buds half open. Buried beneath deep drifts of snow, how touching was the heart of those late cherry blossoms that had not forgotten the spring! It was as if the Zen master's 'plum blossoms beneath a blazing summer sky' were shedding their fragrance right here. Recalling the poignant verse of Archbishop {{person:行尊僧正|Gyōson}} on the mountain cherry, I found the sight even more deeply moving. In general, the strict rule of the mountain ascetics forbids speaking to outsiders of what one witnesses within these sacred {{place:山中温泉|mountains}} of Yudono. Therefore I stay my brush and write no more of it. Returning to our monastery lodging, at the request of the {{office:阿闍梨|Abbot}} Egaku I inscribed our verses from the pilgrimage of the Three Mountains upon poem-strips:"}, {"id": "v1_p25_4", "volume": 1, "book": "おくのほそ道", "section_title": "二十五、出羽三山", "para_index": 25, "type": "発句・注", "verse": {"genre": "haiku", "l1": "涼しさや", "l2": "ほの三日月の", "l3": "羽黒山", "author": "松尾芭蕉", "bg_theme": "haguro_mikazuki", "bg_path": "shortliterature/bg_haguro_mikazuki.jpg", "bg_title": "🌙 羽黒山・杉木立の五重塔とほの三日月（第31句専用描き下ろし背景）"}, "raw_text": "涼しさやほの三日月の羽黒山。", "kakikudashi": "涼しさやほの三日月の羽黒山。", "translation": "涼しさやほの三日月の羽黒山――山内を吹き渡る夕べの涼しさよ、杉木立の空にほのかに淡い三日月が浮かぶ霊山・羽黒山に。", "persons": "", "places": "羽黒山", "era_year": "元禄二年六月", "source_book": "", "keywords": "", "raw_tagged": "涼しさやほの三日月の{{place:羽黒山|羽黒山}}。", "kakikudashi_tagged": "涼しさやほの三日月の{{place:羽黒山|羽黒山}}。", "translation_tagged": "涼しさやほの三日月の{{place:羽黒山|羽黒山}}――山内を吹き渡る夕べの涼しさよ、杉木立の空にほのかに淡い三日月が浮かぶ霊山・{{place:羽黒山|羽黒山}}に。", "english_tagged": "\"Ah, the evening cool— / a faint crescent moon above / sacred {{place:羽黒山|Mount Haguro}}.\""}, {"id": "v1_p25_5", "volume": 1, "book": "おくのほそ道", "section_title": "二十五、出羽三山", "para_index": 25, "type": "発句・注", "verse": {"genre": "haiku", "l1": "雲の峰", "l2": "幾つ崩て", "l3": "月の山", "author": "松尾芭蕉", "bg_theme": "gassan_kumonomine", "bg_path": "shortliterature/bg_gassan_kumonomine.jpg", "bg_title": "⛰️ 月山・崩れゆく雲の峰と月の山（第32句専用描き下ろし背景）"}, "raw_text": "雲の峰幾つ崩て月の山。", "kakikudashi": "雲の峰幾つ崩れて月の山。", "translation": "雲の峰幾つ崩れて月の山――白く湧き立った夏の入道雲の峰がいくつ立ち昇っては崩れ去り、その向こうに清らかな月光を浴びた月の山・月山の霊峰が姿を現したことであろうか。", "persons": "", "places": "月山", "era_year": "元禄二年六月八日", "source_book": "", "keywords": "", "raw_tagged": "雲の峰幾つ崩て{{place:月山|月の山}}。", "kakikudashi_tagged": "雲の峰幾つ崩れて{{place:月山|月の山}}。", "translation_tagged": "雲の峰幾つ崩れて{{place:月山|月の山}}――白く湧き立った夏の入道雲の峰がいくつ立ち昇っては崩れ去り、その向こうに清らかな月光を浴びた{{place:月山|月の山}}・{{place:月山|月山}}の霊峰が姿を現したことであろうか。", "english_tagged": "\"How many peaks of / summer clouds have crumbled down— / {{place:月山|Mountain of the Moon}}!\""}, {"id": "v1_p25_6", "volume": 1, "book": "おくのほそ道", "section_title": "二十五、出羽三山", "para_index": 25, "type": "発句・注", "verse": {"genre": "haiku", "l1": "語られぬ", "l2": "湯殿にぬらす", "l3": "袂かな", "author": "松尾芭蕉", "bg_theme": "yudono_tamoto", "bg_path": "shortliterature/bg_yudono_tamoto.jpg", "bg_title": "♨️ 湯殿山・神秘の霊峡と遅桜（第33句専用描き下ろし背景）"}, "raw_text": "語られぬ湯殿にぬらす袂かな。", "kakikudashi": "語られぬ湯殿にぬらす袂かな。", "translation": "語られぬ湯殿にぬらす袂かな――掟により誰にも語ることのできない湯殿の神秘の御前では、ただ畏れと感動の涙で衣の袂を濡らすばかりであることよ。", "persons": "", "places": "湯殿山", "era_year": "元禄二年六月九日", "source_book": "", "keywords": "", "raw_tagged": "語られぬ{{place:湯殿山|湯殿}}にぬらす袂かな。", "kakikudashi_tagged": "語られぬ{{place:湯殿山|湯殿}}にぬらす袂かな。", "translation_tagged": "語られぬ{{place:湯殿山|湯殿}}にぬらす袂かな――掟により誰にも語ることのできない{{place:湯殿山|湯殿}}の神秘の御前では、ただ畏れと感動の涙で衣の袂を濡らすばかりであることよ。", "english_tagged": "\"Of {{place:湯殿山|sacred Yudono}} / I may not speak, yet tears drench / the sleeves of my robe.\""}, {"id": "v1_p25_7", "volume": 1, "book": "おくのほそ道", "section_title": "二十五、出羽三山", "para_index": 25, "type": "発句・注", "verse": {"genre": "haiku", "l1": "湯殿山", "l2": "銭ふむ道の", "l3": "泪かな", "author": "河合曾良", "bg_theme": "yudono_zeni", "bg_path": "shortliterature/bg_yudono_zeni.jpg", "bg_title": "🪙 湯殿山・御幣と散り敷く賽銭の参道（第34句専用描き下ろし背景）"}, "raw_text": "湯殿山銭ふむ道の泪かな　曾良。", "kakikudashi": "湯殿山銭ふむ道の泪かな 曾良。", "translation": "湯殿山銭ふむ道の泪かな――霊山・湯殿山の参道に夥しく散り敷かれた賽銭を足の裏に踏みしめながら歩いていると、人々の深い信仰心に打たれて思わず涙がこぼれ落ちることよ、と曾良が詠んだ。", "persons": "曾良", "places": "湯殿山", "era_year": "元禄二年六月九日", "source_book": "", "keywords": "", "raw_tagged": "{{place:湯殿山|湯殿山}}銭ふむ道の泪かな　{{person:曾良|曾良}}。", "kakikudashi_tagged": "{{place:湯殿山|湯殿山}}銭ふむ道の泪かな {{person:曾良|曾良}}。", "translation_tagged": "{{place:湯殿山|湯殿山}}銭ふむ道の泪かな――霊山・{{place:湯殿山|湯殿山}}の参道に夥しく散り敷かれた賽銭を足の裏に踏みしめながら歩いていると、人々の深い信仰心に打たれて思わず涙がこぼれ落ちることよ、と{{person:曾良|曾良}}が詠んだ。", "english_tagged": "\"On {{place:湯殿山|Mount Yudono}}, / treading coins strewn on the path— / tears fall from my eyes.\" — {{person:曾良|Sora}}."}, {"id": "v1_p26_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十六、鶴岡・酒田", "para_index": 26, "type": "発句・注", "verse": {"genre": "haiku", "l1": "あつみ山や", "l2": "吹浦かけて", "l3": "夕すゞみ", "author": "松尾芭蕉", "bg_theme": "sakata_fukiura", "bg_path": "shortliterature/bg_sakata_fukiura.jpg", "bg_title": "🌊 酒田・温海岳から吹浦を望む日本海の夕涼み（第35句専用描き下ろし背景）"}, "raw_text": "羽黒を立て、鶴が岡の城下、長山氏重行と云物のふの家にむかへられて、俳諧一巻有。左吉も共に送りぬ。川舟に乗て、酒田の湊に下る。淵庵不玉と云医師の許を宿とす。あつみ山や吹浦かけて夕すゞみ。", "kakikudashi": "羽黒を立ちて、鶴が岡の城下、長山氏重行といふもののふの家に迎へられて、俳諧一巻あり。左吉も共に送りぬ。川舟に乗りて、酒田の湊に下る。淵庵不玉といふ医師の許を宿とす。あつみ山や吹浦かけて夕すずみ。", "translation": "羽黒山を出立して、鶴が岡の城下に入り、長山氏重行という武士の屋敷に迎えられて、歌仙一巻を興行した。手向村の左吉もここまで一緒に見送ってくれた。そこから川舟に乗って最上川を下り、酒田の湊へと出た。この湊では、淵庵不玉という医師の屋敷を宿とした。あつみ山や吹浦かけて夕すずみ――南のあつみ山から北の吹浦の浦々まで日本海の大パノラマをはるかに見渡しながら、広々とした海風に吹かれて夕涼みをすることよ。", "persons": "長山重行,図司左吉,淵庵不玉", "places": "鶴岡,酒田,温海山,吹浦", "era_year": "元禄二年六月十日〜十四日", "source_book": "", "keywords": "", "raw_tagged": "羽黒を立て、{{place:鶴岡|鶴が岡}}の城下、{{person:長山重行|長山氏重行}}と云物のふの家にむかへられて、俳諧一巻有。{{person:図司左吉|左吉}}も共に送りぬ。川舟に乗て、{{place:酒田|酒田}}の湊に下る。{{person:淵庵不玉|淵庵不玉}}と云医師の許を宿とす。{{place:温海山|あつみ山}}や{{place:吹浦|吹浦}}かけて夕すゞみ。", "kakikudashi_tagged": "羽黒を立ちて、{{place:鶴岡|鶴が岡}}の城下、{{person:長山重行|長山氏重行}}といふもののふの家に迎へられて、俳諧一巻あり。{{person:図司左吉|左吉}}も共に送りぬ。川舟に乗りて、{{place:酒田|酒田}}の湊に下る。{{person:淵庵不玉|淵庵不玉}}といふ医師の許を宿とす。{{place:温海山|あつみ山}}や{{place:吹浦|吹浦}}かけて夕すずみ。", "translation_tagged": "羽黒山を出立して、{{place:鶴岡|鶴が岡}}の城下に入り、{{person:長山重行|長山氏重行}}という武士の屋敷に迎えられて、歌仙一巻を興行した。手向村の{{person:図司左吉|左吉}}もここまで一緒に見送ってくれた。そこから川舟に乗って最上川を下り、{{place:酒田|酒田}}の湊へと出た。この湊では、{{person:淵庵不玉|淵庵不玉}}という医師の屋敷を宿とした。{{place:温海山|あつみ山}}や{{place:吹浦|吹浦}}かけて夕すずみ――南の{{place:温海山|あつみ山}}から北の{{place:吹浦|吹浦}}の浦々まで日本海の大パノラマをはるかに見渡しながら、広々とした海風に吹かれて夕涼みをすることよ。", "english_tagged": "Leaving Haguro, at the castle town of {{place:鶴岡|Tsuruoka}} we were welcomed into the home of a samurai named {{person:長山重行|Nagayama Shigeyuki}} and composed a scroll of linked verse. {{person:図司左吉|Sakichi}} also accompanied us this far to see us off. Boarding a riverboat, we went down to the port of {{place:酒田|Sakata}}. There we lodged at the home of a physician named {{person:淵庵不玉|En'an Fugyoku}}. \"From {{place:温海山|Mount Atsumi}} / sweeping across to {{place:吹浦|Fukiura}}— / cooling at evening.\""}, {"id": "v1_p26_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十六、鶴岡・酒田", "para_index": 26, "type": "発句・注", "verse": {"genre": "haiku", "l1": "暑き日を", "l2": "海にいれたり", "l3": "最上川", "author": "松尾芭蕉", "bg_theme": "sakata_atsukihi", "bg_path": "shortliterature/bg_sakata_atsukihi.jpg", "bg_title": "🌅 酒田・最上川河口に沈む灼熱の夕日（第36句専用描き下ろし背景）"}, "raw_text": "暑き日を海にいれたり最上川。", "kakikudashi": "暑き日を海に入れたり最上川。", "translation": "暑き日を海に入れたり最上川――一日じゅう地上を照りつけた灼熱の太陽を、大河・最上川が滔々たる流れに乗せてそのまま日本海の大海原へと流し込んだことよ。", "persons": "", "places": "最上川", "era_year": "元禄二年六月十四日", "source_book": "", "keywords": "", "raw_tagged": "暑き日を海にいれたり{{place:最上川|最上川}}。", "kakikudashi_tagged": "暑き日を海に入れたり{{place:最上川|最上川}}。", "translation_tagged": "暑き日を海に入れたり{{place:最上川|最上川}}――一日じゅう地上を照りつけた灼熱の太陽を、大河・{{place:最上川|最上川}}が滔々たる流れに乗せてそのまま日本海の大海原へと流し込んだことよ。", "english_tagged": "\"The burning summer sun / it has swept into the sea— / the {{place:最上川|Mogami River}}!\""}, {"id": "v1_p27_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十七、象潟", "para_index": 27, "type": "本文", "verse": null, "raw_text": "江山水陸の風光数を尽して、今象潟に方寸を責。酒田の湊より東北の方、山を越、磯を伝ひ、いさごをふみて、其際十里、日影やゝかたぶく比、汐風真砂を吹上、雨朦朧として鳥海の山かくる。闇中に莫作して、「雨も又奇也」とせば、雨後の晴色又頼母敷と、蜑の苫屋に膝をいれて、雨の晴を待。", "kakikudashi": "江山水陸の風光数を尽くして、今象潟に方寸を責む。酒田の湊より東北の方、山を越え、磯を伝ひ、いさごを踏みて、その際十里、日影やや傾く頃、汐風真砂を吹き上げ、雨朦朧として鳥海の山隠る。闇中に模索して、「雨もまた奇なり」とせば、雨後の晴色また頼もしきと、蜑の苫屋に膝を入れて、雨の晴るるを待つ。", "translation": "これまで川や山、水辺や陸地の名所の数々を見尽くしてきたが、今はいよいよ憧れの象潟を一目見ようと胸がしきりに高鳴っている。酒田の湊から東北の方角へ、山を越え、荒磯を伝い、浜の砂を踏みしめて行くこと十里ばかり、日差しがようやく西に傾く頃になると、強い潮風が浜の真砂を吹き上げ、雨がけぶるように降り出して霊峰・鳥海の山も雲霧に隠れてしまった。暗がりの中を手探りするようにたどり着き、蘇軾の詩のように「雨もまた奇なり」と雨の風情を愛でるならば、雨が上がった後の晴れ渡った景色はまたいっそう期待できるだろうと、漁師の粗末な苫屋に身を寄せ合って雨が晴れるのを待った。", "persons": "", "places": "象潟,酒田,鳥海山", "era_year": "元禄二年六月十五日", "source_book": "", "keywords": "雨も又奇也", "raw_tagged": "江山水陸の風光数を尽して、今{{place:象潟|象潟}}に方寸を責。{{place:酒田|酒田}}の湊より東北の方、山を越、磯を伝ひ、いさごをふみて、其際十里、日影やゝかたぶく比、汐風真砂を吹上、雨朦朧として{{place:鳥海山|鳥海の山}}かくる。闇中に莫作して、「{{special:雨も又奇也|雨も又奇也}}」とせば、雨後の晴色又頼母敷と、蜑の苫屋に膝をいれて、雨の晴を待。", "kakikudashi_tagged": "江山水陸の風光数を尽くして、今{{place:象潟|象潟}}に方寸を責む。{{place:酒田|酒田}}の湊より東北の方、山を越え、磯を伝ひ、いさごを踏みて、その際十里、日影やや傾く頃、汐風真砂を吹き上げ、雨朦朧として{{place:鳥海山|鳥海の山}}隠る。闇中に模索して、「{{special:雨も又奇也|雨もまた奇なり}}」とせば、雨後の晴色また頼もしきと、蜑の苫屋に膝を入れて、雨の晴るるを待つ。", "translation_tagged": "これまで川や山、水辺や陸地の名所の数々を見尽くしてきたが、今はいよいよ憧れの{{place:象潟|象潟}}を一目見ようと胸がしきりに高鳴っている。{{place:酒田|酒田}}の湊から東北の方角へ、山を越え、荒磯を伝い、浜の砂を踏みしめて行くこと十里ばかり、日差しがようやく西に傾く頃になると、強い潮風が浜の真砂を吹き上げ、雨がけぶるように降り出して霊峰・{{place:鳥海山|鳥海の山}}も雲霧に隠れてしまった。暗がりの中を手探りするようにたどり着き、蘇軾の詩のように「{{special:雨も又奇也|雨もまた奇なり}}」と雨の風情を愛でるならば、雨が上がった後の晴れ渡った景色はまたいっそう期待できるだろうと、漁師の粗末な苫屋に身を寄せ合って雨が晴れるのを待った。", "english_tagged": "Having gazed upon countless scenes of rivers and mountains, waters and land, our hearts now beat with impatience for {{place:象潟|Kisakata}}. Heading northeast from the port of {{place:酒田|Sakata}}, we crossed hills, followed rocky shores, and trudged through deep sand for some ten leagues; as the sun began to slant toward the west, the sea wind whipped up the fine sand and a misty rain hid {{place:鳥海山|Mount Chōkai}} from view. Groping our way through the gathering dusk, we told ourselves that if, as Su Dongpo wrote, '{{special:雨も又奇也|the view in the rain is marvelous too}},' then the clear sky after the rain would be all the more promising—and so we squeezed our knees into a fisherman's rush-thatched hut and waited for the rain to clear."}, {"id": "v1_p27_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十七、象潟", "para_index": 27, "type": "本文", "verse": null, "raw_text": "其朝、天能晴て、朝日花やかにさし出る程に、象潟に舟をうかぶ。先能因島に舟をよせて、三年幽居の跡をとぶらひ、むかふの岸に舟をあがれば、「花の上こぐ」とよまれし桜の老木、西行法師の記念をのこす。江上に御陵あり、神功后宮の御墓と云。寺を干満珠寺と云。此処に行幸ありし事いまだ聞ず。いかなる事にや。此寺の方丈に座して簾を捲ば、風景一眼の中に尽て、南に鳥海、天をさゝえ、其陰うつりて江にあり。西はむやむやの関、路をかぎり、東に堤を築て、秋田にかよふ道遥に、海北にかまえて、浪打入る所を汐ごしと云。江の縦横一里ばかり、俤松島にかよひて、又異なり。松島は笑ふが如く、象潟はうらむがごとし。寂しさに悲しみをくはえて、地勢魂をなやますに似たり。", "kakikudashi": "その朝、天よく晴れて、朝日花やかにさし出づるほどに、象潟に舟をうかぶ。まづ能因島に舟をよせて、三年幽居の跡をとぶらひ、むかふの岸に舟をあがれば、「花の上こぐ」と詠まれし桜の老木、西行法師の記念を残す。江上に御陵あり、神功后宮の御墓といふ。寺を干満珠寺といふ。この処に行幸ありし事いまだ聞かず。いかなる事にや。この寺の方丈に座して簾を捲けば、風景一眼の中に尽きて、南に鳥海、天をささへ、その陰うつりて江にあり。西はむやむやの関、路をかぎり、東に堤を築きて、秋田にかよふ道遥かに、海北にかまへて、浪打ち入る所を汐ごしといふ。江の縦横一里ばかり、俤松島にかよひて、また異なり。松島は笑ふがごとく、象潟はうらむがごとし。寂しさに悲しみをくはへて、地勢魂をなやますに似たり。", "translation": "その翌朝、空はすっかり晴れ渡り、朝日が華やかに差し昇る頃に、象潟の入江に舟を浮かべた。まず能因島に舟を寄せて、能因法師が三年間草庵を結んで隠棲したという旧跡を訪ね、さらに向こう岸に舟を着けて上がると、「きさかたの桜は波に埋もれて花の上こぐあまの釣舟」と詠まれた桜の老木が、今も西行法師の形見をとどめている。入江のほとりには御陵があり、神功后宮の御墓であるという。その別当寺を干満珠寺という。しかし神功后宮がこの地に行幸なさったという話は、これまで一度も聞いたことがない。いったいどのような由緒によるものであろうか。この寺の方丈の座敷に座って御簾を巻き上げると、象潟の風景がひと目のうちにことごとく見渡され、南には秀麗な鳥海山が天を支えるようにそびえ立ち、その山影が入江の水面に美しく映っている。西はむやむやの関が街道の行く手を遮り、東には堤防が築かれて秋田へと通じる街道がはるかに続き、北には日本海が控えていて、外海の荒波が入江に打ち寄せる浅瀬を汐ごしという。入江の広さは縦も横も一里ほどで、島々が浮かぶ面影は松島によく似ているけれども、また趣が異なっている。松島が明るくほほえみかけるようであるのに対して、象潟はどこか物憂げに恨み嘆いているかのようである。静かな寂しさの上にさらに深い悲しみを添えて、この土地のたたずまいそのものが旅人の魂を悩ませ揺さぶるかのようである。", "persons": "神功皇后", "places": "象潟,能因島,干満珠寺,鳥海山,むやむやの関,秋田,汐越,松島", "era_year": "元禄二年六月十六日", "source_book": "", "keywords": "花の上こぐ", "raw_tagged": "其朝、天能晴て、朝日花やかにさし出る程に、{{place:象潟|象潟}}に舟をうかぶ。先{{place:能因島|能因島}}に舟をよせて、三年幽居の跡をとぶらひ、むかふの岸に舟をあがれば、「{{special:花の上こぐ|花の上こぐ}}」とよまれし桜の老木、西行法師の記念をのこす。江上に御陵あり、{{person:神功皇后|神功后宮}}の御墓と云。寺を{{place:干満珠寺|干満珠寺}}と云。此処に行幸ありし事いまだ聞ず。いかなる事にや。此寺の方丈に座して簾を捲ば、風景一眼の中に尽て、南に{{place:鳥海山|鳥海}}、天をさゝえ、其陰うつりて江にあり。西は{{place:むやむやの関|むやむやの関}}、路をかぎり、東に堤を築て、{{place:秋田|秋田}}にかよふ道遥に、海北にかまえて、浪打入る所を{{place:汐越|汐ごし}}と云。江の縦横一里ばかり、俤{{place:松島|松島}}にかよひて、又異なり。{{place:松島|松島}}は笑ふが如く、{{place:象潟|象潟}}はうらむがごとし。寂しさに悲しみをくはえて、地勢魂をなやますに似たり。", "kakikudashi_tagged": "その朝、天よく晴れて、朝日花やかにさし出づるほどに、{{place:象潟|象潟}}に舟をうかぶ。まづ{{place:能因島|能因島}}に舟をよせて、三年幽居の跡をとぶらひ、むかふの岸に舟をあがれば、「{{special:花の上こぐ|花の上こぐ}}」と詠まれし桜の老木、西行法師の記念を残す。江上に御陵あり、{{person:神功皇后|神功后宮}}の御墓といふ。寺を{{place:干満珠寺|干満珠寺}}といふ。この処に行幸ありし事いまだ聞かず。いかなる事にや。この寺の方丈に座して簾を捲けば、風景一眼の中に尽きて、南に{{place:鳥海山|鳥海}}、天をささへ、その陰うつりて江にあり。西は{{place:むやむやの関|むやむやの関}}、路をかぎり、東に堤を築きて、{{place:秋田|秋田}}にかよふ道遥かに、海北にかまへて、浪打ち入る所を{{place:汐越|汐ごし}}といふ。江の縦横一里ばかり、俤{{place:松島|松島}}にかよひて、また異なり。{{place:松島|松島}}は笑ふがごとく、{{place:象潟|象潟}}はうらむがごとし。寂しさに悲しみをくはへて、地勢魂をなやますに似たり。", "translation_tagged": "その翌朝、空はすっかり晴れ渡り、朝日が華やかに差し昇る頃に、{{place:象潟|象潟}}の入江に舟を浮かべた。まず{{place:能因島|能因島}}に舟を寄せて、能因法師が三年間草庵を結んで隠棲したという旧跡を訪ね、さらに向こう岸に舟を着けて上がると、「きさかたの桜は波に埋もれて{{special:花の上こぐ|花の上こぐ}}あまの釣舟」と詠まれた桜の老木が、今も西行法師の形見をとどめている。入江のほとりには御陵があり、{{person:神功皇后|神功后宮}}の御墓であるという。その別当寺を{{place:干満珠寺|干満珠寺}}という。しかし神功后宮がこの地に行幸なさったという話は、これまで一度も聞いたことがない。いったいどのような由緒によるものであろうか。この寺の方丈の座敷に座って御簾を巻き上げると、象潟の風景がひと目のうちにことごとく見渡され、南には秀麗な{{place:鳥海山|鳥海山}}が天を支えるようにそびえ立ち、その山影が入江の水面に美しく映っている。西は{{place:むやむやの関|むやむやの関}}が街道の行く手を遮り、東には堤防が築かれて{{place:秋田|秋田}}へと通じる街道がはるかに続き、北には日本海が控えていて、外海の荒波が入江に打ち寄せる浅瀬を{{place:汐越|汐ごし}}という。入江の広さは縦も横も一里ほどで、島々が浮かぶ面影は{{place:松島|松島}}によく似ているけれども、また趣が異なっている。{{place:松島|松島}}が明るくほほえみかけるようであるのに対して、{{place:象潟|象潟}}はどこか物憂げに恨み嘆いているかのようである。静かな寂しさの上にさらに深い悲しみを添えて、この土地のたたずまいそのものが旅人の魂を悩ませ揺さぶるかのようである。", "english_tagged": "The next morning the sky cleared wondrously, and as the morning sun rose in brilliant splendor, we rowed a boat out upon the lagoon of {{place:象潟|Kisakata}}. First we steered our boat to {{place:能因島|Nōin Island}} to visit the site where Priest Nōin lived for three years in secluded retirement, and when we rowed across to the opposite shore and stepped ashore, we saw the ancient cherry tree that preserves the memory of Priest Saigyō's verse on '{{special:花の上こぐ|rowing over the cherry blossoms}}.' By the water's edge stands an imperial burial mound, said to be the tomb of {{person:神功皇后|Empress Jingū}}. The temple there is called {{place:干満珠寺|Kanmanjuji}}. I had never heard that the Empress ever visited this place; how could this have come to be? Sitting in the abbot's chamber of this temple and rolling up the bamboo blinds, one takes in the entire landscape at a single glance: to the south, {{place:鳥海山|Mount Chōkai}} props up the very heavens, its reflection cast deep upon the waters of the lagoon. To the west, the {{place:むやむやの関|Barrier of Muyamuya}} blocks the coastal road, while to the east an embankment has been built along which the highway to {{place:秋田|Akita}} stretches far into the distance; to the north lies the open sea, and the shallow mouth where the ocean waves roll in is called {{place:汐越|Shiogoshi}}—Tide-Crossing. The lagoon measures about a league each way; its appearance resembles {{place:松島|Matsushima}}, yet with a difference. {{place:松島|Matsushima}} seems to smile, whereas {{place:象潟|Kisakata}} seems to grieve in silent resentment. Adding sorrow to loneliness, the very lay of the land seems to trouble the traveler's soul."}, {"id": "v1_p27_3", "volume": 1, "book": "おくのほそ道", "section_title": "二十七、象潟", "para_index": 27, "type": "発句・注", "verse": {"genre": "haiku", "l1": "象潟や", "l2": "雨に西施が", "l3": "ねぶの花", "author": "松尾芭蕉", "bg_theme": "kisakata_nebunohana", "bg_path": "shortliterature/bg_kisakata_nebunohana.jpg", "bg_title": "🌸 象潟・雨にけぶる九十九島と西施がねぶの花（第37句専用描き下ろし背景）"}, "raw_text": "象潟や雨に西施がねぶの花。", "kakikudashi": "象潟や雨に西施がねぶの花。", "translation": "象潟や雨に西施がねぶの花――雨にけぶる象潟の入江に、雨露に濡れて物憂げに咲く淡紅色のねぶの花は、あたかも憂いに目を伏せる越の美女・西施の艶やかな面影そのものであることよ。", "persons": "西施", "places": "象潟", "era_year": "元禄二年六月十六日", "source_book": "", "keywords": "ねぶの花", "raw_tagged": "{{place:象潟|象潟}}や雨に{{person:西施|西施}}が{{special:ねぶの花|ねぶの花}}。", "kakikudashi_tagged": "{{place:象潟|象潟}}や雨に{{person:西施|西施}}が{{special:ねぶの花|ねぶの花}}。", "translation_tagged": "{{place:象潟|象潟}}や雨に{{person:西施|西施}}が{{special:ねぶの花|ねぶの花}}――雨にけぶる{{place:象潟|象潟}}の入江に、雨露に濡れて物憂げに咲く淡紅色の{{special:ねぶの花|ねぶの花}}は、あたかも憂いに目を伏せる越の美女・{{person:西施|西施}}の艶やかな面影そのものであることよ。", "english_tagged": "\"{{place:象潟|Kisakata}} lagoon— / in the rain, Lady {{person:西施|Xi Shi}}'s / {{special:ねぶの花|sleeping silk-tree flowers}}.\""}, {"id": "v1_p27_4", "volume": 1, "book": "おくのほそ道", "section_title": "二十七、象潟", "para_index": 27, "type": "発句・注", "verse": {"genre": "haiku", "l1": "汐越や", "l2": "鶴はぎぬれて", "l3": "海涼し", "author": "松尾芭蕉", "bg_theme": "kisakata_shiogoshi", "bg_path": "shortliterature/bg_kisakata_shiogoshi.jpg", "bg_title": "🦢 象潟・汐越の浅瀬に佇む白鶴（第38句専用描き下ろし背景）"}, "raw_text": "汐越や鶴はぎぬれて海涼し。", "kakikudashi": "汐越や鶴はぎぬれて海涼し。", "translation": "汐越や鶴はぎぬれて海涼し――外海の波が打ち寄せる汐越の浅瀬に、白鶴がすらりと長い脛を波に濡らして佇んでおり、いかにも涼やかな海辺の風情であることよ。", "persons": "", "places": "汐越", "era_year": "元禄二年六月十六日", "source_book": "", "keywords": "", "raw_tagged": "{{place:汐越|汐越}}や鶴はぎぬれて海涼し。", "kakikudashi_tagged": "{{place:汐越|汐越}}や鶴はぎぬれて海涼し。", "translation_tagged": "{{place:汐越|汐越}}や鶴はぎぬれて海涼し――外海の波が打ち寄せる{{place:汐越|汐越}}の浅瀬に、白鶴がすらりと長い脛を波に濡らして佇んでおり、いかにも涼やかな海辺の風情であることよ。", "english_tagged": "\"At {{place:汐越|Shiogoshi}} / the crane's long shins are splashed wet— / cool is the sea!\""}, {"id": "v1_p27_5", "volume": 1, "book": "おくのほそ道", "section_title": "二十七、象潟", "para_index": 27, "type": "発句・注", "verse": {"genre": "haiku", "l1": "象潟や", "l2": "料理何くふ", "l3": "神祭", "author": "河合曾良", "bg_theme": "kisakata_kamimatsuri", "bg_path": "shortliterature/bg_kisakata_kamimatsuri.jpg", "bg_title": "🏮 象潟・熊野権現の神祭と精進膳（第39句専用描き下ろし背景）"}, "raw_text": "祭礼：象潟や料理何くふ神祭　曾良。", "kakikudashi": "祭礼：象潟や料理何くふ神祭 曾良。", "translation": "熊野権現の祭礼にあたって、象潟や料理何くふ神祭――魚鳥を断つ習わしがあるこの海辺の象潟では、今日の神祭に人々はいったいどのようなご馳走を食べて祝うのであろうか、と曾良が詠んだ。", "persons": "曾良", "places": "象潟", "era_year": "元禄二年六月十六日", "source_book": "", "keywords": "", "raw_tagged": "祭礼：{{place:象潟|象潟}}や料理何くふ神祭　{{person:曾良|曾良}}。", "kakikudashi_tagged": "祭礼：{{place:象潟|象潟}}や料理何くふ神祭 {{person:曾良|曾良}}。", "translation_tagged": "熊野権現の祭礼にあたって、{{place:象潟|象潟}}や料理何くふ神祭――魚鳥を断つ習わしがあるこの海辺の{{place:象潟|象潟}}では、今日の神祭に人々はいったいどのようなご馳走を食べて祝うのであろうか、と{{person:曾良|曾良}}が詠んだ。", "english_tagged": "At the local shrine festival: \"At {{place:象潟|Kisakata}}, / what dishes do they feast on— / festival of the gods?\" — {{person:曾良|Sora}}."}, {"id": "v1_p27_6", "volume": 1, "book": "おくのほそ道", "section_title": "二十七、象潟", "para_index": 27, "type": "発句・注", "verse": {"genre": "haiku", "l1": "蜑の家や", "l2": "戸板を敷て", "l3": "夕涼", "author": "低耳", "bg_theme": "kisakata_toita", "bg_path": "shortliterature/bg_kisakata_toita.jpg", "bg_title": "🏖️ 象潟・蜑の苫屋と戸板の夕涼み（第40句専用描き下ろし背景）"}, "raw_text": "みのゝ国の商人低耳が句：蜑の家や戸板を敷て夕涼。", "kakikudashi": "みのの国の商人低耳が句：蜑の家や戸板を敷きて夕涼。", "translation": "同行したみのの国の商人低耳の句に、蜑の家や戸板を敷きて夕涼――漁師の家の庭先に外した戸板をそのまま敷いて、海風に吹かれながら素朴な夕涼みをすることよ、と詠んだ。", "persons": "低耳", "places": "", "era_year": "元禄二年六月十六日", "source_book": "", "keywords": "", "raw_tagged": "{{person:低耳|みのゝ国の商人低耳}}が句：蜑の家や戸板を敷て夕涼。", "kakikudashi_tagged": "{{person:低耳|みのの国の商人低耳}}が句：蜑の家や戸板を敷きて夕涼。", "translation_tagged": "同行した{{person:低耳|みのの国の商人低耳}}の句に、蜑の家や戸板を敷きて夕涼――漁師の家の庭先に外した戸板をそのまま敷いて、海風に吹かれながら素朴な夕涼みをすることよ、と詠んだ。", "english_tagged": "A verse by {{person:低耳|Teiji, a merchant of Mino Province}}: \"At the fishers' huts, / laying wooden shutters down— / cooling in the dusk.\""}, {"id": "v1_p27_7", "volume": 1, "book": "おくのほそ道", "section_title": "二十七、象潟", "para_index": 27, "type": "発句・注", "verse": {"genre": "haiku", "l1": "波こえぬ", "l2": "契ありてや", "l3": "みさごの巣", "author": "河合曾良", "bg_theme": "kisakata_misago", "bg_path": "shortliterature/bg_kisakata_misago.jpg", "bg_title": "🦅 象潟・波間の奇岩と雎鳩（みさご）の巣（第41句専用描き下ろし背景）"}, "raw_text": "岩上に雎鳩の巣をみる：波こえぬ契ありてやみさごの巣　曾良。", "kakikudashi": "岩上に雎鳩の巣を見る：波こえぬ契りありてやみさごの巣 曾良。", "translation": "岩の上に雎鳩の巣を見て、波こえぬ契りありてやみさごの巣――末の松山の歌に詠まれたように、決して波が越えないという固い契りを波と結んでいるからであろうか、荒波の中の岩の上に安心して営まれているみさごの巣よ、と曾良が詠んだ。", "persons": "曾良", "places": "", "era_year": "元禄二年六月十七日", "source_book": "", "keywords": "みさご", "raw_tagged": "岩上に{{special:みさご|雎鳩}}の巣をみる：波こえぬ契ありてや{{special:みさご|みさご}}の巣　{{person:曾良|曾良}}。", "kakikudashi_tagged": "岩上に{{special:みさご|雎鳩}}の巣を見る：波こえぬ契りありてや{{special:みさご|みさご}}の巣 {{person:曾良|曾良}}。", "translation_tagged": "岩の上に{{special:みさご|雎鳩}}の巣を見て、波こえぬ契りありてや{{special:みさご|みさご}}の巣――末の松山の歌に詠まれたように、決して波が越えないという固い契りを波と結んでいるからであろうか、荒波の中の岩の上に安心して営まれている{{special:みさご|みさご}}の巣よ、と{{person:曾良|曾良}}が詠んだ。", "english_tagged": "Seeing an {{special:みさご|osprey}}'s nest atop a crag: \"Have they sworn a vow / that the waves shall never cross— / the {{special:みさご|osprey}}'s rock-nest?\" — {{person:曾良|Sora}}."}, {"id": "v1_p28_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十八、越後路", "para_index": 28, "type": "発句・注", "verse": {"genre": "haiku", "l1": "文月や", "l2": "六日も常の", "l3": "夜には似ず", "author": "松尾芭蕉", "bg_theme": "echigo_fumizuki", "bg_path": "shortliterature/bg_echigo_fumizuki.jpg", "bg_title": "🎋 越後路・文月六日の七夕前夜と日本海の星空（第42句専用描き下ろし背景）"}, "raw_text": "酒田の余波日を重て、北陸道の雲に望。遥々のおもひ胸をいたましめて、加賀の府まで百卅里と聞。鼠の関をこゆれば、越後の地に歩行を改て、越中の国一ぶりの関に到る。此間九日、暑湿の労に神をなやまし、病おこりて事をしるさず。文月や六日も常の夜には似ず。", "kakikudashi": "酒田の余波日を重ねて、北陸道の雲に望む。遥々のおもひ胸をいたましめて、加賀の府まで百三十里と聞く。鼠の関を越ゆれば、越後の地に歩行を改めて、越中の国一ぶりの関に到る。この間九日、暑湿の労に神をなやまし、病おこりて事を記さず。文月や六日も常の夜には似ず。", "translation": "酒田の人々との名残を惜しんで幾日も滞在を重ねたのち、いよいよはるかな北陸道の空に浮かぶ雲を望んで旅立った。果てしなく遠い前途を思うと胸が痛むほどで、目指す加賀の府である金沢までは百三十里もの道のりであると聞く。出羽と越後の国境である鼠の関を越えると、越後の地へと歩みを改め、やがて越中の国との境にある一ぶりの関へとたどり着いた。この間九日ばかり、蒸し暑さと長雨の疲れに心身をすり減らし、持病まで起こったため道中の出来事は書き記さなかった。文月や六日も常の夜には似ず――初秋の文月に入り、七夕前夜にあたる六日の夜は、星空を仰ぐ情趣も普段の夜とはまるで違って格別なときめきがあることよ。", "persons": "", "places": "酒田,北陸（越中・加賀）圏,金沢,鼠の関,越後国圏,市振の関", "era_year": "元禄二年六月廿五日〜七月六日", "source_book": "", "keywords": "文月", "raw_tagged": "{{place:酒田|酒田}}の余波日を重て、{{place:北陸（越中・加賀）圏|北陸道}}の雲に望。遥々のおもひ胸をいたましめて、{{place:金沢|加賀の府}}まで百卅里と聞。{{place:鼠の関|鼠の関}}をこゆれば、{{place:越後国圏|越後の地}}に歩行を改て、{{place:北陸（越中・加賀）圏|越中の国}}{{place:市振の関|一ぶりの関}}に到る。此間九日、暑湿の労に神をなやまし、病おこりて事をしるさず。{{special:文月|文月}}や六日も常の夜には似ず。", "kakikudashi_tagged": "{{place:酒田|酒田}}の余波日を重ねて、{{place:北陸（越中・加賀）圏|北陸道}}の雲に望む。遥々のおもひ胸をいたましめて、{{place:金沢|加賀の府}}まで百三十里と聞く。{{place:鼠の関|鼠の関}}を越ゆれば、{{place:越後国圏|越後の地}}に歩行を改めて、{{place:北陸（越中・加賀）圏|越中の国}}{{place:市振の関|一ぶりの関}}に到る。この間九日、暑湿の労に神をなやまし、病おこりて事を記さず。{{special:文月|文月}}や六日も常の夜には似ず。", "translation_tagged": "{{place:酒田|酒田}}の人々との名残を惜しんで幾日も滞在を重ねたのち、いよいよはるかな{{place:北陸（越中・加賀）圏|北陸道}}の空に浮かぶ雲を望んで旅立った。果てしなく遠い前途を思うと胸が痛むほどで、目指す{{place:金沢|加賀の府}}である{{place:金沢|金沢}}までは百三十里もの道のりであると聞く。出羽と{{place:越後国圏|越後の国}}境である{{place:鼠の関|鼠の関}}を越えると、{{place:越後国圏|越後の地}}へと歩みを改め、やがて{{place:北陸（越中・加賀）圏|越中の国}}との境にある{{place:市振の関|一ぶりの関}}へとたどり着いた。この間九日ばかり、蒸し暑さと長雨の疲れに心身をすり減らし、持病まで起こったため道中の出来事は書き記さなかった。{{special:文月|文月}}や六日も常の夜には似ず――初秋の{{special:文月|文月}}に入り、七夕前夜にあたる六日の夜は、星空を仰ぐ情趣も普段の夜とはまるで違って格別なときめきがあることよ。", "english_tagged": "Lingering day after day in reluctant farewells at {{place:酒田|Sakata}}, we finally set our eyes upon the distant clouds of the {{place:北陸（越中・加賀）圏|Hokurikudō highway}}. The thought of the long road ahead made our hearts ache, hearing that it was a hundred and thirty leagues to {{place:金沢|Kanazawa, the capital of Kaga}}. Once we crossed the {{place:鼠の関|Barrier of Nezu}}, we stepped into the {{place:越後国圏|land of Echigo}}, walking on until we reached the {{place:市振の関|Barrier of Ichiburi}} in {{place:北陸（越中・加賀）圏|Etchū Province}}. During the nine days it took to cover this stretch, our spirits were worn down by the heat and muggy rains, and because my illness returned, I did not record the events along the way. \"The {{special:文月|Seventh Moon}} has come— / even the sixth night is unlike / any ordinary night.\""}, {"id": "v1_p28_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十八、越後路", "para_index": 28, "type": "発句・注", "verse": {"genre": "haiku", "l1": "荒海や", "l2": "佐渡に横たふ", "l3": "天河", "author": "松尾芭蕉", "bg_theme": "izumozaki_amanogawa", "bg_path": "shortliterature/bg_izumozaki_amanogawa.jpg", "bg_title": "🌌 越後出雲崎・荒海と佐渡に横たふ天河（第43句専用描き下ろし背景）"}, "raw_text": "荒海や佐渡に横たふ天河。", "kakikudashi": "荒海や佐渡に横たふ天河。", "translation": "荒海や佐渡に横たふ天河――黒々と逆巻く日本海の荒海の彼方に佐渡の島影が浮かび、その島の上へと満天の星を連ねた壮大な天河が白く横たわっていることよ。", "persons": "", "places": "佐渡", "era_year": "元禄二年七月四日〜七日", "source_book": "", "keywords": "天河", "raw_tagged": "荒海や{{place:佐渡|佐渡}}に横たふ{{special:天河|天河}}。", "kakikudashi_tagged": "荒海や{{place:佐渡|佐渡}}に横たふ{{special:天河|天河}}。", "translation_tagged": "荒海や{{place:佐渡|佐渡}}に横たふ{{special:天河|天河}}――黒々と逆巻く日本海の荒海の彼方に{{place:佐渡|佐渡}}の島影が浮かび、その島の上へと満天の星を連ねた壮大な{{special:天河|天河}}が白く横たわっていることよ。", "english_tagged": "\"Over the rough sea, / stretching out across {{place:佐渡|Sado}}— / the {{special:天河|River of Heaven}}!\""}, {"id": "v1_p29_1", "volume": 1, "book": "おくのほそ道", "section_title": "二十九、市振", "para_index": 29, "type": "本文", "verse": null, "raw_text": "今日は親しらず・子しらず・犬もどり・駒返しなど云北国一の難所を越てつかれ侍れば、枕引よせて寝たるに、一間隔て面の方に、若き女の声二人計ときこゆ。年老たるおのこの声も交て物語するをきけば、越後の国新潟と云所の遊女成し。伊勢参宮するとて、此関までおのこの送りて、あすは古郷にかへす文したゝめて、はかなき言伝などしやる也。「白浪のよする汀に身をはふらかし、あまのこの世をあさましう下りて、定めなき契、日々の業因、いかにつたなし」と、物云をきくきく寝入て、あした旅立に、我々にむかひて、「行衛しらぬ旅路のうさ、あまりおぼつかなう悲しく侍れば、見えがくれにも御跡をしたひ侍ん。衣の上の御情に、大慈のめぐみをたれて、結縁せさせ給へ」と、泪を落す。", "kakikudashi": "今日は親しらず・子しらず・犬もどり・駒返しなどいふ北国一の難所を越えて疲れ侍れば、枕引きよせて寝たるに、一間隔てて面の方に、若き女の声二人ばかりと聞こゆ。年老いたるおのこの声も交じりて物語するを聞けば、越後の国新潟といふ所の遊女なりし。伊勢参宮するとて、この関までおのこの送りて、あすは古郷にかへす文したためて、はかなき言伝などしやるなり。「白浪のよする汀に身をはふらかし、あまのこの世をあさましう下りて、定めなき契り、日々の業因、いかにつたなし」と、物言ふを聞く聞く寝入りて、あした旅立つに、我々にむかひて、「行方知らぬ旅路のうさ、あまりおぼつかなう悲しく侍れば、見えがくれにも御跡を慕ひ侍らん。衣の上の御情けに、大慈のめぐみを垂れて、結縁せさせ給へ」と、泪を落とす。", "translation": "今日は親しらず・子しらず・犬もどり・駒返しなどと呼ばれる北国随一の険しい難所を越えてすっかり疲れ果てたので、枕を引き寄せて横になっていると、ひと間を隔てた表側の部屋に、若い女の声が二人ほど聞こえてきた。年老いた男の声も交じって話し込んでいるのを聞いていると、越後の国新潟という湊町の遊女たちであった。これから伊勢参宮に向かうとのことで、この市振の関まで見送ってきた男に、明日故郷へ持ち帰らせる手紙を書きしたため、細々とした伝言などを託しているのである。「白浪のよする汀に身を落としてさすらい、漁師の子のようにあさましく零落して、一夜限りの定めない契りを結ぶ日々の罪深さは、なんとつたない宿命であろうか」と、嘆き語る声を聞きながら眠りについたところ、翌朝の旅立ちの際に女たちが私たちに向かって、「行く先も知らぬ遠い旅路の心細さ、あまりに頼りなく悲しゅうございますので、見え隠れにでもお二人の後ろを慕ってついて行かせてくださいませ。墨染めの法衣をまとわれたお慈悲にすがり、大いなる仏の恵みを垂れて、どうか仏縁を結ばせてくださいませ」と言って涙をこぼした。", "persons": "", "places": "親不知,越後国圏,新潟", "era_year": "元禄二年七月十二日〜十三日", "source_book": "", "keywords": "伊勢参宮,白浪", "raw_tagged": "今日は{{place:親不知|親しらず・子しらず・犬もどり・駒返し}}など云北国一の難所を越てつかれ侍れば、枕引よせて寝たるに、一間隔て面の方に、若き女の声二人計ときこゆ。年老たるおのこの声も交て物語するをきけば、{{place:越後国圏|越後の国}}{{place:新潟|新潟}}と云所の遊女成し。{{special:伊勢参宮|伊勢参宮}}するとて、此関までおのこの送りて、あすは古郷にかへす文したゝめて、はかなき言伝などしやる也。「{{special:白浪|白浪のよする汀}}に身をはふらかし、あまのこの世をあさましう下りて、定めなき契、日々の業因、いかにつたなし」と、物云をきくきく寝入て、あした旅立に、我々にむかひて、「行衛しらぬ旅路のうさ、あまりおぼつかなう悲しく侍れば、見えがくれにも御跡をしたひ侍ん。衣の上の御情に、大慈のめぐみをたれて、結縁せさせ給へ」と、泪を落す。", "kakikudashi_tagged": "今日は{{place:親不知|親しらず・子しらず・犬もどり・駒返し}}などいふ北国一の難所を越えて疲れ侍れば、枕引きよせて寝たるに、一間隔てて面の方に、若き女の声二人ばかりと聞こゆ。年老いたるおのこの声も交じりて物語するを聞けば、{{place:越後国圏|越後の国}}{{place:新潟|新潟}}といふ所の遊女なりし。{{special:伊勢参宮|伊勢参宮}}するとて、この関までおのこの送りて、あすは古郷にかへす文したためて、はかなき言伝などしやるなり。「{{special:白浪|白浪のよする汀}}に身をはふらかし、あまのこの世をあさましう下りて、定めなき契り、日々の業因、いかにつたなし」と、物言ふを聞く聞く寝入りて、あした旅立つに、我々にむかひて、「行方知らぬ旅路のうさ、あまりおぼつかなう悲しく侍れば、見えがくれにも御跡を慕ひ侍らん。衣の上の御情けに、大慈のめぐみを垂れて、結縁せさせ給へ」と、泪を落とす。", "translation_tagged": "今日は{{place:親不知|親しらず・子しらず・犬もどり・駒返し}}などと呼ばれる北国随一の険しい難所を越えてすっかり疲れ果てたので、枕を引き寄せて横になっていると、ひと間を隔てた表側の部屋に、若い女の声が二人ほど聞こえてきた。年老いた男の声も交じって話し込んでいるのを聞いていると、{{place:越後国圏|越後の国}}{{place:新潟|新潟}}という湊町の遊女たちであった。これから{{special:伊勢参宮|伊勢参宮}}に向かうとのことで、この市振の関まで見送ってきた男に、明日故郷へ持ち帰らせる手紙を書きしたため、細々とした伝言などを託しているのである。「{{special:白浪|白浪のよする汀}}に身を落としてさすらい、漁師の子のようにあさましく零落して、一夜限りの定めない契りを結ぶ日々の罪深さは、なんとつたない宿命であろうか」と、嘆き語る声を聞きながら眠りについたところ、翌朝の旅立ちの際に女たちが私たちに向かって、「行く先も知らぬ遠い旅路の心細さ、あまりに頼りなく悲しゅうございますので、見え隠れにでもお二人の後ろを慕ってついて行かせてくださいませ。墨染めの法衣をまとわれたお慈悲にすがり、大いなる仏の恵みを垂れて、どうか仏縁を結ばせてくださいませ」と言って涙をこぼした。", "english_tagged": "Exhausted today after crossing the most perilous precipices in all the North Country—{{place:親不知|Oyashirazu, Koshirazu, Inumodori, and Komagaeshi, where parents forget children and even dogs and horses turn back}}—I drew my pillow close and lay down to sleep, when from the front room just one partition away I heard the voices of two young women. Listening as an elderly man's voice mingled with theirs in conversation, I gathered that they were courtesans from the port of {{place:新潟|Niigata}} in {{place:越後国圏|Echigo Province}}. Bound on a {{special:伊勢参宮|pilgrimage to the Grand Shrines of Ise}}, they had been escorted as far as this barrier by the old man, and were writing letters and entrusting him with humble messages to take back to their hometown the next day. Hearing them lament, \"Cast adrift upon a {{special:白浪|shore where white waves break}}, fallen low in this wretched world like fisherfolk's daughters, how cruel is our daily karma of forging fleeting vows with passing strangers!\" I drifted off to sleep; the next morning, as we were setting out, the women turned to us in tears and pleaded, \"The sorrow of a journey where we do not even know the way fills us with such helpless grief and dread—pray let us follow after you, even if only keeping you in sight from afar! By the compassion of your black-dyed monk's robes, grant us the great mercy of the Buddha and form a karmic bond to save us!\""}, {"id": "v1_p29_2", "volume": 1, "book": "おくのほそ道", "section_title": "二十九、市振", "para_index": 29, "type": "発句・注", "verse": {"genre": "haiku", "l1": "一家に", "l2": "遊女もねたり", "l3": "萩と月", "author": "松尾芭蕉", "bg_theme": "ichiburi_hagitsuki", "bg_path": "shortliterature/bg_ichiburi_hagitsuki.jpg", "bg_title": "🌕 市振の宿・萩と月に照らされる旅籠の夜（第44句専用描き下ろし背景）"}, "raw_text": "「不便の事には侍れども、我々は所々にてとゞまる方おほし。只人の行にまかせて行べし。神明の加護かならず恙なかるべし」と云捨て出つゝ、哀さしばらくやまざりけらし。一家に遊女もねたり萩と月。曾良にかたれば、書とゞめ侍る。", "kakikudashi": "「不便の事には侍れども、我々は所々にてとどまる方おほし。ただ人の行くにまかせて行くべし。神明の加護かならず恙なかるべし」と言ひ捨てて出でつつ、哀れさしばらくやまざりけらし。一家に遊女もねたり萩と月。曾良に語れば、書きとどめ侍る。", "translation": "「まことに不憫なことではございますが、私たちは道中のあちこちで逗留する所が多い身の上です。ただ同じ方向へ行く旅人たちの後ろについてお行きなさい。伊勢の神明の御加護によって、きっと何事もなく無事に旅を続けられることでしょう」と言い残して宿を出たものの、女たちを哀れむ思いはしばらく胸から消えることがなかった。一家に遊女もねたり萩と月――同じ一つ家の宿に身の上つたない遊女たちもともに旅寝していることよ、庭の白萩に清らかな月光が降り注ぐこの秋の夜に。この句を曾良に語って聞かせると、曾良は旅日記に書きとどめた。", "persons": "曾良", "places": "", "era_year": "元禄二年七月十三日", "source_book": "", "keywords": "", "raw_tagged": "「不便の事には侍れども、我々は所々にてとゞまる方おほし。只人の行にまかせて行べし。神明の加護かならず恙なかるべし」と云捨て出つゝ、哀さしばらくやまざりけらし。一家に遊女もねたり萩と月。{{person:曾良|曾良}}にかたれば、書とゞめ侍る。", "kakikudashi_tagged": "「不便の事には侍れども、我々は所々にてとどまる方おほし。ただ人の行くにまかせて行くべし。神明の加護かならず恙なかるべし」と言ひ捨てて出でつつ、哀れさしばらくやまざりけらし。一家に遊女もねたり萩と月。{{person:曾良|曾良}}に語れば、書きとどめ侍る。", "translation_tagged": "「まことに不憫なことではございますが、私たちは道中のあちこちで逗留する所が多い身の上です。ただ同じ方向へ行く旅人たちの後ろについてお行きなさい。伊勢の神明の御加護によって、きっと何事もなく無事に旅を続けられることでしょう」と言い残して宿を出たものの、女たちを哀れむ思いはしばらく胸から消えることがなかった。一家に遊女もねたり萩と月――同じ一つ家の宿に身の上つたない遊女たちもともに旅寝していることよ、庭の白萩に清らかな月光が降り注ぐこの秋の夜に。この句を{{person:曾良|曾良}}に語って聞かせると、{{person:曾良|曾良}}は旅日記に書きとどめた。", "english_tagged": "\"Deeply as we pity your plight, we must stop at many places along the way. Simply follow behind other travelers going in your direction. The divine protection of the Gods of Ise will surely keep you safe from harm,\" we said as we left the inn, yet for a long while the pity in our hearts refused to subside. \"Under the same roof / courtesans too slept tonight— / bush clover and moon.\" When I recited this to {{person:曾良|Sora}}, he wrote it down in his journal."}, {"id": "v1_p30_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十、越中路", "para_index": 30, "type": "発句・注", "verse": {"genre": "haiku", "l1": "わせの香や", "l2": "分入右は", "l3": "有磯海", "author": "松尾芭蕉", "bg_theme": "etchu_arisonoumi", "bg_path": "shortliterature/bg_etchu_arisonoumi.jpg", "bg_title": "🌾 越中路・早稲の香りと右手に広がる有磯海（第45句専用描き下ろし背景）"}, "raw_text": "くろべ四十八か瀬とかや、数しらぬ川をわたりて、那古と云浦に出。担籠の藤浪は、春ならずとも、初秋の哀とふべきものをと、人に尋れば、「これより五里いそ伝ひして、むかふの山陰にいり、蜑の苦ぶきかすかなれば、蘆の一夜の宿かすものあるまじ」といひをどされて、かゞの国に入。わせの香や分入右は有磯海。", "kakikudashi": "くろべ四十八か瀬とかや、数知らぬ川を渡りて、那古といふ浦に出づ。担籠の藤浪は、春ならずとも、初秋の哀れ訪ふべきものをと、人に尋ぬれば、「これより五里磯伝ひして、むかふの山陰に入り、蜑の苫ぶきかすかなれば、蘆の一夜の宿貸すものあるまじ」と言ひおどされて、かゞの国に入る。わせの香や分け入る右は有磯海。", "translation": "くろべ四十八か瀬とか呼ばれる、数え切れないほど幾筋にも分かれた急流を渡って、歌枕の那古という浦に出た。万葉の古歌に詠まれた担籠の藤浪は、たとえ藤の花が咲く春ではなくとも、初秋の風情だけでもぜひ訪ねてみたいものだと土地の人に道を尋ねたところ、「ここから五里も荒磯伝いに歩いて向こうの山陰へ入らねばならず、漁師の粗末な苫葺きの家がわずかに点在するばかりですから、一夜の宿を貸してくれる家さえありますまい」と言い脅かされて断念し、そのままかゞの国へと入った。わせの香や分け入る右は有磯海――芳しく実った早稲の穂波の香りに包まれながらあぜ道を分け入って行くと、右手には歌枕の有磯海が青々と広がっていることよ。", "persons": "", "places": "黒部川,那古,担籠,北陸（越中・加賀）圏,有磯海", "era_year": "元禄二年七月十三日〜十四日", "source_book": "", "keywords": "藤浪", "raw_tagged": "{{place:黒部川|くろべ四十八か瀬}}とかや、数しらぬ川をわたりて、{{place:那古|那古}}と云浦に出。{{place:担籠|担籠}}の{{special:藤浪|藤浪}}は、春ならずとも、初秋の哀とふべきものをと、人に尋れば、「これより五里いそ伝ひして、むかふの山陰にいり、蜑の苦ぶきかすかなれば、蘆の一夜の宿かすものあるまじ」といひをどされて、{{place:北陸（越中・加賀）圏|かゞの国}}に入。わせの香や分入右は{{place:有磯海|有磯海}}。", "kakikudashi_tagged": "{{place:黒部川|くろべ四十八か瀬}}とかや、数知らぬ川を渡りて、{{place:那古|那古}}といふ浦に出づ。{{place:担籠|担籠}}の{{special:藤浪|藤浪}}は、春ならずとも、初秋の哀れ訪ふべきものをと、人に尋ぬれば、「これより五里磯伝ひして、むかふの山陰に入り、蜑の苫ぶきかすかなれば、蘆の一夜の宿貸すものあるまじ」と言ひおどされて、{{place:北陸（越中・加賀）圏|かゞの国}}に入る。わせの香や分け入る右は{{place:有磯海|有磯海}}。", "translation_tagged": "{{place:黒部川|くろべ四十八か瀬}}とか呼ばれる、数え切れないほど幾筋にも分かれた急流を渡って、歌枕の{{place:那古|那古}}という浦に出た。万葉の古歌に詠まれた{{place:担籠|担籠}}の{{special:藤浪|藤浪}}は、たとえ藤の花が咲く春ではなくとも、初秋の風情だけでもぜひ訪ねてみたいものだと土地の人に道を尋ねたところ、「ここから五里も荒磯伝いに歩いて向こうの山陰へ入らねばならず、漁師の粗末な苫葺きの家がわずかに点在するばかりですから、一夜の宿を貸してくれる家さえありますまい」と言い脅かされて断念し、そのまま{{place:北陸（越中・加賀）圏|かゞの国}}へと入った。わせの香や分け入る右は{{place:有磯海|有磯海}}――芳しく実った早稲の穂波の香りに包まれながらあぜ道を分け入って行くと、右手には歌枕の{{place:有磯海|有磯海}}が青々と広がっていることよ。", "english_tagged": "Crossing countless rivers, including the Forty-Eight Rapids of the {{place:黒部川|Kurobe River}}, we came out at a bay called {{place:那古|Nago}}. Thinking that even though it was not spring, we ought at least to visit the famous {{special:藤浪|wisteria waves}} of {{place:担籠|Tako}} in their early-autumn charm, we asked a local the way, only to be frightened off with the warning: \"From here you must walk five leagues along the rocky coast and enter the shadow of the hills yonder; there are only a few miserable fishermen's reed-thatched huts, and not a soul will lend you even a single night's lodging among the rushes\"—and so we passed straight into the {{place:北陸（越中・加賀）圏|Province of Kaga}}. \"Fragrance of early rice— / parting the stalks, to our right / lies the {{place:有磯海|Ariso Sea}}.\""}, {"id": "v1_p31_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十一、金沢", "para_index": 31, "type": "本文", "verse": null, "raw_text": "卯の花山・くりからが谷をこえて、金沢は七月中の五日也。爰に大坂よりかよふ商人何処と云者有。それが旅宿をともにす。", "kakikudashi": "卯の花山・くりからが谷を越えて、金沢は七月中の五日なり。ここに大坂より通ふ商人何処といふ者あり。それが旅宿をともにす。", "translation": "歌枕の卯の花山や源平古戦場のくりからが谷を越えて、金沢の城下に到着したのは七月十五日のことであった。この町に、大坂から商用で通っている商人何処という風流人がいた。その何処と同じ旅宿に身を寄せて逗留することとなった。", "persons": "何処", "places": "卯の花山,倶利伽羅が谷,金沢,大坂", "era_year": "元禄二年七月十五日", "source_book": "", "keywords": "", "raw_tagged": "{{place:卯の花山|卯の花山}}・{{place:倶利伽羅が谷|くりからが谷}}をこえて、{{place:金沢|金沢}}は七月中の五日也。爰に{{place:大坂|大坂}}よりかよふ{{person:何処|商人何処}}と云者有。それが旅宿をともにす。", "kakikudashi_tagged": "{{place:卯の花山|卯の花山}}・{{place:倶利伽羅が谷|くりからが谷}}を越えて、{{place:金沢|金沢}}は七月中の五日なり。ここに{{place:大坂|大坂}}より通ふ{{person:何処|商人何処}}といふ者あり。それが旅宿をともにす。", "translation_tagged": "歌枕の{{place:卯の花山|卯の花山}}や源平古戦場の{{place:倶利伽羅が谷|くりからが谷}}を越えて、{{place:金沢|金沢}}の城下に到着したのは七月十五日のことであった。この町に、{{place:大坂|大坂}}から商用で通っている{{person:何処|商人何処}}という風流人がいた。その何処と同じ旅宿に身を寄せて逗留することとなった。", "english_tagged": "Crossing {{place:卯の花山|Mount Unohana}} and the {{place:倶利伽羅が谷|Valley of Kurikara}}, we arrived in {{place:金沢|Kanazawa}} on the fifteenth day of the seventh moon. Staying here was {{person:何処|a merchant named Kasho}}, who traveled regularly on business from {{place:大坂|Ōsaka}}. We shared the same inn with him."}, {"id": "v1_p31_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十一、金沢", "para_index": 31, "type": "発句・注", "verse": {"genre": "haiku", "l1": "塚も動け", "l2": "我泣声は", "l3": "秋の風", "author": "松尾芭蕉", "bg_theme": "kanazawa_tsuka", "bg_path": "shortliterature/bg_kanazawa_tsuka.jpg", "bg_title": "🍂 金沢・小杉一笑の墓塚と吹きすさぶ秋の風（第46句専用描き下ろし背景）"}, "raw_text": "一笑と云ものは、此道にすける名のほのぼの聞えて、世に知人も侍しに、去年の冬早世したりとて、其兄追善を催すに、塚も動け我泣声は秋の風。", "kakikudashi": "一笑といふものは、この道にすける名のほのぼの聞こえて、世に知る人も侍りしに、去年の冬早世したりとて、その兄追善を催すに、塚も動け我泣声は秋の風。", "translation": "この金沢の一笑という俳人は、俳諧の道に深く心を傾けているという評判がほのかに私の耳にも届いており、世間にもその名を知る人が少なくなかったのに、去年の冬に若くして亡くなってしまったとのことで、その兄が追善の句会を催した際に、塚も動け我泣声は秋の風――この墓塚も揺れ動いて応えてくれよ、早世した君を悼んで泣き叫ぶ私の悲痛な声は、まさに今吹きすさぶこの秋の風なのだ、と手向けた。", "persons": "一笑", "places": "", "era_year": "元禄二年七月廿二日", "source_book": "", "keywords": "", "raw_tagged": "{{person:一笑|一笑}}と云ものは、此道にすける名のほのぼの聞えて、世に知人も侍しに、去年の冬早世したりとて、其兄追善を催すに、塚も動け我泣声は秋の風。", "kakikudashi_tagged": "{{person:一笑|一笑}}といふものは、この道にすける名のほのぼの聞こえて、世に知る人も侍りしに、去年の冬早世したりとて、その兄追善を催すに、塚も動け我泣声は秋の風。", "translation_tagged": "この金沢の{{person:一笑|一笑}}という俳人は、俳諧の道に深く心を傾けているという評判がほのかに私の耳にも届いており、世間にもその名を知る人が少なくなかったのに、去年の冬に若くして亡くなってしまったとのことで、その兄が追善の句会を催した際に、塚も動け我泣声は秋の風――この墓塚も揺れ動いて応えてくれよ、早世した君を悼んで泣き叫ぶ私の悲痛な声は、まさに今吹きすさぶこの秋の風なのだ、と手向けた。", "english_tagged": "A young poet of this town named {{person:一笑|Isshō}}, whose devotion to our poetic art had faintly reached my ears and was known to many in the world, had passed away prematurely the previous winter; when his elder brother held a memorial service for him, I offered this verse: \"Shake, O burial mound! / My weeping voice is nothing / but the autumn wind.\""}, {"id": "v1_p31_3", "volume": 1, "book": "おくのほそ道", "section_title": "三十一、金沢", "para_index": 31, "type": "発句・注", "verse": {"genre": "haiku", "l1": "秋涼し", "l2": "手毎にむけや", "l3": "瓜茄子", "author": "松尾芭蕉", "bg_theme": "kanazawa_urinasubi", "bg_path": "shortliterature/bg_kanazawa_urinasubi.jpg", "bg_title": "🍆 金沢・草庵の秋涼と手毎にむく瓜茄子（第47句専用描き下ろし背景）"}, "raw_text": "ある草庵にいざなはれて：秋涼し手毎にむけや瓜茄子。", "kakikudashi": "ある草庵にいざなはれて：秋涼し手毎にむけや瓜茄子。", "translation": "郊外のある風雅な草庵に招かれて、秋涼し手毎にむけや瓜茄子――秋の風が心地よく涼しいこの庵では、堅苦しい作法など抜きにして、さあ銘々の手で採れたての瓜や茄子をむいて味わおうではないか、と詠んだ。", "persons": "", "places": "", "era_year": "元禄二年七月廿日", "source_book": "", "keywords": "", "raw_tagged": "ある草庵にいざなはれて：秋涼し手毎にむけや瓜茄子。", "kakikudashi_tagged": "ある草庵にいざなはれて：秋涼し手毎にむけや瓜茄子。", "translation_tagged": "郊外のある風雅な草庵に招かれて、秋涼し手毎にむけや瓜茄子――秋の風が心地よく涼しいこの庵では、堅苦しい作法など抜きにして、さあ銘々の手で採れたての瓜や茄子をむいて味わおうではないか、と詠んだ。", "english_tagged": "Invited to a quiet thatched hermitage: \"Cool is the autumn— / let each hand peel for itself / melons and eggplants!\""}, {"id": "v1_p31_4", "volume": 1, "book": "おくのほそ道", "section_title": "三十一、金沢", "para_index": 31, "type": "発句・注", "verse": {"genre": "haiku", "l1": "あかあかと", "l2": "日は難面も", "l3": "あきの風", "author": "松尾芭蕉", "bg_theme": "kanazawa_akaaka", "bg_path": "shortliterature/bg_kanazawa_akaaka.jpg", "bg_title": "🌇 金沢途上・あかあかと照る夕日と秋の風（第48句専用描き下ろし背景）"}, "raw_text": "途中吟：あかあかと日は難面もあきの風。", "kakikudashi": "途中吟：あかあかと日はつれなくもあきの風。", "translation": "道中の吟として、あかあかと日はつれなくもあきの風――西に傾く太陽はなおもあかあかと容赦なく照りつけているけれども、吹き渡る風にはすでにまぎれもない秋の涼気が感じられることよ、と詠んだ。", "persons": "", "places": "", "era_year": "元禄二年七月廿四日", "source_book": "", "keywords": "", "raw_tagged": "途中吟：あかあかと日は難面もあきの風。", "kakikudashi_tagged": "途中吟：あかあかと日はつれなくもあきの風。", "translation_tagged": "道中の吟として、あかあかと日はつれなくもあきの風――西に傾く太陽はなおもあかあかと容赦なく照りつけているけれども、吹き渡る風にはすでにまぎれもない秋の涼気が感じられることよ、と詠んだ。", "english_tagged": "Composed along the road: \"Blazing red and bright, / the sun shines pitilessly—yet / the wind is autumn's.\""}, {"id": "v1_p32_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十二、小松", "para_index": 32, "type": "発句・注", "verse": {"genre": "haiku", "l1": "しほらしき", "l2": "名や小松吹", "l3": "萩薄", "author": "松尾芭蕉", "bg_theme": "komatsu_hagisusuki", "bg_path": "shortliterature/bg_komatsu_hagisusuki.jpg", "bg_title": "🌾 小松・若松を吹き抜ける秋風と萩・薄（第49句専用描き下ろし背景）"}, "raw_text": "小松と云所にて：しほらしき名や小松吹萩薄。", "kakikudashi": "小松といふ所にて：しほらしき名や小松吹く萩薄。", "translation": "小松という宿場町にて、しほらしき名や小松吹く萩薄――小松とはなんと可憐で奥ゆかしい地名であろうか、その名のとおり小さな松の枝を秋風が吹き抜け、足元の萩や薄を優しく揺らしていることよ、と詠んだ。", "persons": "", "places": "小松", "era_year": "元禄二年七月廿四日〜廿七日", "source_book": "", "keywords": "", "raw_tagged": "{{place:小松|小松}}と云所にて：しほらしき名や{{place:小松|小松}}吹萩薄。", "kakikudashi_tagged": "{{place:小松|小松}}といふ所にて：しほらしき名や{{place:小松|小松}}吹く萩薄。", "translation_tagged": "{{place:小松|小松}}という宿場町にて、しほらしき名や{{place:小松|小松}}吹く萩薄――{{place:小松|小松}}とはなんと可憐で奥ゆかしい地名であろうか、その名のとおり小さな松の枝を秋風が吹き抜け、足元の萩や薄を優しく揺らしていることよ、と詠んだ。", "english_tagged": "At the post town called {{place:小松|Komatsu}}—Young Pines: \"What a winsome name— / blowing through the {{place:小松|young pine trees}}, / bush clover and plumes.\""}, {"id": "v1_p32_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十二、小松", "para_index": 32, "type": "発句・注", "verse": {"genre": "haiku", "l1": "むざんやな", "l2": "甲の下の", "l3": "きりぎりす", "author": "松尾芭蕉", "bg_theme": "komatsu_kabuto", "bg_path": "shortliterature/bg_komatsu_kabuto.jpg", "bg_title": "🪖 小松・太田神社の実盛が甲と鳴くきりぎりす（第50句専用描き下ろし背景）"}, "raw_text": "此所太田の神社に詣。真盛が甲、錦の切あり。往昔、源氏に属せし時、義朝公より給はらせ給とかや。げにも平士のものにあらず。目庇より吹返しまで、菊から草のほりもの金をちりばめ、竜頭に鍬形打たり。真盛討死の後、木曾義仲願状にそへて此社にこめられ侍よし、樋口の次郎が使せし事共、まのあたり縁紀にみえたり。むざんやな甲の下のきりぎりす。", "kakikudashi": "この所太田の神社に詣づ。実盛が甲、錦の切れあり。往昔、源氏に属せし時、義朝公より賜はらせ給ふとかや。げにも平士のものにあらず。目庇より吹返しまで、菊唐草の彫り物金をちりばめ、竜頭に鍬形打ちたり。実盛討死の後、木曾義仲願状にそへてこの社にこめられ侍るよし、樋口の次郎が使ひせし事ども、まのあたり縁起に見えたり。むざんやな甲の下のきりぎりす。", "translation": "この小松の町にある太田の神社に参詣した。社宝として斎藤実盛の甲と、赤地の錦の直垂の切れ端が伝えられている。その昔、実盛がまだ源氏に仕えていた頃、主君の源義朝公から拝領したものだとかいうことである。なるほど普通の平武者が身につけるような品ではない。正面の目庇から左右の吹返しに至るまで、精巧な菊唐草の透かし彫りに黄金をちりばめ、前立ての竜頭には立派な鍬形が打ちつけられている。実盛が篠原の合戦で討死を遂げた後、木曾義仲が祈願状に添えてこの神社に奉納されたとのことで、家臣の樋口の次郎がその使者を務めた経緯などが、目の前の社伝縁起にありありと記されていた。むざんやな甲の下のきりぎりす――ああ痛ましいことよ、白髪を黒く染めて散った老武者実盛の遺品の甲の下で、今はただ秋のきりぎりすが哀れに鳴き続けているとは。", "persons": "斎藤実盛,源義朝,木曾義仲", "places": "太田の神社", "era_year": "元禄二年七月廿七日", "source_book": "", "keywords": "", "raw_tagged": "此所{{place:太田の神社|太田の神社}}に詣。真盛が甲、錦の切あり。往昔、源氏に属せし時、{{person:源義朝|義朝}}公より給はらせ給とかや。げにも平士のものにあらず。目庇より吹返しまで、菊から草のほりもの金をちりばめ、竜頭に鍬形打たり。真盛討死の後、{{person:木曾義仲|木曾義仲}}願状にそへて此社にこめられ侍よし、樋口の次郎が使せし事共、まのあたり縁紀にみえたり。むざんやな甲の下のきりぎりす。", "kakikudashi_tagged": "この所{{place:太田の神社|太田の神社}}に詣づ。{{person:斎藤実盛|実盛}}が甲、錦の切れあり。往昔、源氏に属せし時、{{person:源義朝|義朝}}公より賜はらせ給ふとかや。げにも平士のものにあらず。目庇より吹返しまで、菊唐草の彫り物金をちりばめ、竜頭に鍬形打ちたり。{{person:斎藤実盛|実盛}}討死の後、{{person:木曾義仲|木曾義仲}}願状にそへてこの社にこめられ侍るよし、樋口の次郎が使ひせし事ども、まのあたり縁起に見えたり。むざんやな甲の下のきりぎりす。", "translation_tagged": "この小松の町にある{{place:太田の神社|太田の神社}}に参詣した。社宝として{{person:斎藤実盛|斎藤実盛}}の甲と、赤地の錦の直垂の切れ端が伝えられている。その昔、実盛がまだ源氏に仕えていた頃、主君の{{person:源義朝|源義朝}}公から拝領したものだとかいうことである。なるほど普通の平武者が身につけるような品ではない。正面の目庇から左右の吹返しに至るまで、精巧な菊唐草の透かし彫りに黄金をちりばめ、前立ての竜頭には立派な鍬形が打ちつけられている。{{person:斎藤実盛|実盛}}が篠原の合戦で討死を遂げた後、{{person:木曾義仲|木曾義仲}}が祈願状に添えてこの神社に奉納されたとのことで、家臣の樋口の次郎がその使者を務めた経緯などが、目の前の社伝縁起にありありと記されていた。むざんやな甲の下のきりぎりす――ああ痛ましいことよ、白髪を黒く染めて散った老武者実盛の遺品の甲の下で、今はただ秋のきりぎりすが哀れに鳴き続けているとは。", "english_tagged": "At this town we worshiped at {{place:太田の神社|Ōta Shrine}}. Preserved here are {{person:斎藤実盛|Saitō Sanemori}}'s helmet and a fragment of his brocade battle-robe. They say that in olden days, when he served the Minamoto clan, he received this helmet as a gift from Lord {{person:源義朝|Minamoto no Yoshitomo}}. Truly, it is no ordinary soldier's gear. From the visor to the turn-backs on either side, it is richly inlaid with gold in a carved chrysanthemum-scroll pattern, and its dragon-head crest is fitted with bold gilt horns. After {{person:斎藤実盛|Sanemori}} fell in battle, {{person:木曾義仲|Kiso Yoshinaka}} dedicated the helmet to this shrine along with a written prayer, and how Higuchi no Jirō served as his envoy can be seen firsthand in the shrine chronicle. \"Ah, how pitiful— / chirping beneath the helmet, / an autumn cricket!\""}, {"id": "v1_p33_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十三、那谷寺", "para_index": 33, "type": "発句・注", "verse": {"genre": "haiku", "l1": "石山の", "l2": "石より白し", "l3": "秋の風", "author": "松尾芭蕉", "bg_theme": "natadera_ishiyama", "bg_path": "shortliterature/bg_natadera_ishiyama.jpg", "bg_title": "⛰️ 那谷寺・奇石の岩山と白く吹き渡る秋の風（第51句専用描き下ろし背景）"}, "raw_text": "山中の温泉に行ほど、白根が嶽跡にみなしてあゆむ。左の山際に観音堂あり。花山法皇、三十三所の巡礼とげさせ給ひて後、大慈大悲の像を安置し給ひて、那谷と名付給ふとや。那智・谷組の二字をわかち侍しとぞ。奇石さまさまに、古松植ならべて、萱ぶきの小堂、岩の上に造りかけて、殊勝の土地也。石山の石より白し秋の風。", "kakikudashi": "山中の温泉に行くほど、白根が嶽跡にみなして歩む。左の山際に観音堂あり。花山法皇、三十三所の巡礼とげさせ給ひて後、大慈大悲の像を安置し給ひて、那谷と名付け給ふとや。那智・谷組の二字をわかち侍りしとぞ。奇石さまさまに、古松植えならべて、萱ぶきの小堂、岩の上に造りかけて、殊勝の土地なり。石山の石より白し秋の風。", "translation": "山中の温泉へ向かう道すがら、霊峰の白根が嶽を背後に見やりながら歩いて行った。左手の山際に那谷寺の観音堂がある。その昔、花山法皇が西国三十三所の観音巡礼を成し遂げられた後、この霊窟に大慈大悲の観音像を安置なされて、寺の名を那谷と名付けられたとかいうことである。第一番札所の那智と第三十三番満願の谷組から一字ずつを分かち取って名付けられたのだと伝えられている。奇妙な形の巨石や岩山が幾重にも連なるなかに老松が植え並べられ、萱葺きの小さな観音堂が切り立った岩の上に懸造りで建てられており、まことに心洗われる霊地である。石山の石より白し秋の風――この白い奇岩がそびえる石山の岩肌よりも、さらにいっそう白く澄みきって秋の風が吹き渡っていることよ。", "persons": "花山法皇", "places": "山中温泉,白根が嶽,那谷寺,那智,谷組,石山", "era_year": "元禄二年七月廿七日", "source_book": "", "keywords": "三十三所", "raw_tagged": "{{place:山中温泉|山中の温泉}}に行ほど、{{place:白根が嶽|白根が嶽}}跡にみなしてあゆむ。左の山際に観音堂あり。{{person:花山法皇|花山法皇}}、{{special:三十三所|三十三所}}の巡礼とげさせ給ひて後、大慈大悲の像を安置し給ひて、{{place:那谷寺|那谷}}と名付給ふとや。{{place:那智|那智}}・{{place:谷組|谷組}}の二字をわかち侍しとぞ。奇石さまさまに、古松植ならべて、萱ぶきの小堂、岩の上に造りかけて、殊勝の土地也。{{place:石山|石山の石}}より白し秋の風。", "kakikudashi_tagged": "{{place:山中温泉|山中の温泉}}に行くほど、{{place:白根が嶽|白根が嶽}}跡にみなして歩む。左の山際に観音堂あり。{{person:花山法皇|花山法皇}}、{{special:三十三所|三十三所}}の巡礼とげさせ給ひて後、大慈大悲の像を安置し給ひて、{{place:那谷寺|那谷}}と名付け給ふとや。{{place:那智|那智}}・{{place:谷組|谷組}}の二字をわかち侍りしとぞ。奇石さまさまに、古松植えならべて、萱ぶきの小堂、岩の上に造りかけて、殊勝の土地なり。{{place:石山|石山の石}}より白し秋の風。", "translation_tagged": "{{place:山中温泉|山中の温泉}}へ向かう道すがら、霊峰の{{place:白根が嶽|白根が嶽}}を背後に見やりながら歩いて行った。左手の山際に那谷寺の観音堂がある。その昔、{{person:花山法皇|花山法皇}}が西国{{special:三十三所|三十三所の観音}}巡礼を成し遂げられた後、この霊窟に大慈大悲の観音像を安置なされて、寺の名を{{place:那谷寺|那谷}}と名付けられたとかいうことである。第一番札所の{{place:那智|那智}}と第三十三番満願の{{place:谷組|谷組}}から一字ずつを分かち取って名付けられたのだと伝えられている。奇妙な形の巨石や岩山が幾重にも連なるなかに老松が植え並べられ、萱葺きの小さな観音堂が切り立った岩の上に懸造りで建てられており、まことに心洗われる霊地である。{{place:石山|石山の石}}より白し秋の風――この白い奇岩がそびえる{{place:石山|石山}}の岩肌よりも、さらにいっそう白く澄みきって秋の風が吹き渡っていることよ。", "english_tagged": "On our way to the hot springs of {{place:山中温泉|Yamanaka}}, we walked on with {{place:白根が嶽|Mount Shirane}} gradually receding behind us. At the foot of the hills to our left stood a Kannon Hall. After the Cloistered Emperor {{person:花山法皇|Kazan}} completed his pilgrimage to the {{special:三十三所|Thirty-Three Sacred Kannon Temples}} of the western provinces, he enshrined a statue of Kannon of Great Mercy and Compassion here and named the temple {{place:那谷寺|Nata}}, taking one character each from the first temple, {{place:那智|Nachi}}, and the thirty-third, {{place:谷組|Tanigumi}}. Fantastic rocks of every shape rise in tiers, ancient pines stand planted among them, and a small thatch-roofed hall is built right out over a crag—a place of truly sublime beauty. \"Whiter even than / the white rocks of {{place:石山|Stone Mountain}}— / the wind of autumn!\""}, {"id": "v1_p34_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十四、山中温泉", "para_index": 34, "type": "発句・注", "verse": {"genre": "haiku", "l1": "山中や", "l2": "菊はたおらぬ", "l3": "湯の匂", "author": "松尾芭蕉", "bg_theme": "yamanaka_yunonioi", "bg_path": "shortliterature/bg_yamanaka_yunonioi.jpg", "bg_title": "♨️ 山中温泉・渓谷の湯けむりと白菊の香り（第52句専用描き下ろし背景）"}, "raw_text": "温泉に浴す。其功有明に次と云。山中や菊はたおらぬ湯の匂。", "kakikudashi": "温泉に浴す。その功有明に次ぐといふ。山中や菊はたおらぬ湯の匂。", "translation": "山中温泉の湯に身を浸して旅の疲れを癒やした。その薬効の素晴らしさは摂津国の有明の湯に次ぐ名湯であるという。山中や菊はたおらぬ湯の匂――ここ山中温泉では、不老長寿の菊慈童のようにわざわざ谷間の菊を手折って露を飲むまでもない、この芳しい湯の匂いに包まれるだけで命が延びる心地がすることよ。", "persons": "", "places": "有明,山中温泉", "era_year": "元禄二年七月廿七日〜八月四日", "source_book": "", "keywords": "菊はたおらぬ", "raw_tagged": "温泉に浴す。其功{{place:有明|有明}}に次と云。{{place:山中温泉|山中}}や{{special:菊はたおらぬ|菊はたおらぬ}}湯の匂。", "kakikudashi_tagged": "温泉に浴す。その功{{place:有明|有明}}に次ぐといふ。{{place:山中温泉|山中}}や{{special:菊はたおらぬ|菊はたおらぬ}}湯の匂。", "translation_tagged": "山中温泉の湯に身を浸して旅の疲れを癒やした。その薬効の素晴らしさは摂津国の{{place:有明|有明}}の湯に次ぐ名湯であるという。{{place:山中温泉|山中}}や{{special:菊はたおらぬ|菊はたおらぬ}}湯の匂――ここ{{place:山中温泉|山中温泉}}では、不老長寿の菊慈童のようにわざわざ谷間の菊を手折って露を飲むまでもない、この芳しい湯の匂いに包まれるだけで命が延びる心地がすることよ。", "english_tagged": "We bathed in the hot springs. Their healing virtue is said to be second only to {{place:有明|Ariake in Settsu}}. \"Here at {{place:山中温泉|Yamanaka}}, / {{special:菊はたおらぬ|no need to pluck chrysanthemums}}— / fragrance of the springs!\""}, {"id": "v1_p34_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十四、山中温泉", "para_index": 34, "type": "本文", "verse": null, "raw_text": "あるじとする物は、久米之助とていまだ小童也。かれが父俳諧を好み、洛の貞室若輩のむかし爰に来りし比、風雅に辱しめられて、洛に帰て貞徳の門人となつて世にしらる。功名の後、此一村判詞の料を請ずと云。今更むかし語とはなりぬ。", "kakikudashi": "あるじとする者は、久米之助とていまだ小童なり。かれが父俳諧を好み、洛の貞室若輩のむかしここに来たりし比、風雅に辱しめられて、洛に帰りて貞徳の門人となつて世に知らる。功名の後、この一村判詞の料を請けずといふ。今更むかし語とはなりぬ。", "translation": "私たちが泊まった湯宿の主人を務める者は、久米之助といってまだ幼い少年である。この少年の亡き父は深く俳諧をたしなみ、京都の安原貞室がまだ若かった昔にこの温泉を訪れた際、主人から俳諧の未熟さをたしなめられて発奮し、都へ帰って松永貞徳の門人となってついに天下に名を知られる宗匠となった。貞室は名声を成した後も、その旧恩を忘れずこの山中温泉の一村の人々からは決して句の評点料を受け取らなかったという。それも今ではすっかり懐かしい昔語りとなってしまった。", "persons": "久米之助,安原貞室,松永貞徳", "places": "", "era_year": "元禄二年七月廿七日〜八月四日", "source_book": "", "keywords": "", "raw_tagged": "あるじとする物は、{{person:久米之助|久米之助}}とていまだ小童也。かれが父俳諧を好み、洛の{{person:安原貞室|貞室}}若輩のむかし爰に来りし比、風雅に辱しめられて、洛に帰て{{person:松永貞徳|貞徳}}の門人となつて世にしらる。功名の後、此一村判詞の料を請ずと云。今更むかし語とはなりぬ。", "kakikudashi_tagged": "あるじとする者は、{{person:久米之助|久米之助}}とていまだ小童なり。かれが父俳諧を好み、洛の{{person:安原貞室|貞室}}若輩のむかしここに来たりし比、風雅に辱しめられて、洛に帰りて{{person:松永貞徳|貞徳}}の門人となつて世に知らる。功名の後、この一村判詞の料を請けずといふ。今更むかし語とはなりぬ。", "translation_tagged": "私たちが泊まった湯宿の主人を務める者は、{{person:久米之助|久米之助}}といってまだ幼い少年である。この少年の亡き父は深く俳諧をたしなみ、京都の{{person:安原貞室|安原貞室}}がまだ若かった昔にこの温泉を訪れた際、主人から俳諧の未熟さをたしなめられて発奮し、都へ帰って{{person:松永貞徳|松永貞徳}}の門人となってついに天下に名を知られる宗匠となった。貞室は名声を成した後も、その旧恩を忘れずこの山中温泉の一村の人々からは決して句の評点料を受け取らなかったという。それも今ではすっかり懐かしい昔語りとなってしまった。", "english_tagged": "The host of our inn was still a young boy named {{person:久米之助|Kumenosuke}}. His late father had been fond of haikai poetry; long ago, when {{person:安原貞室|Teishitsu}} of Kyoto visited this place as a young man and was put to shame in poetic skill by the innkeeper, he returned to Kyoto, became a disciple of {{person:松永貞徳|Matsunaga Teitoku}}, and won fame throughout the world. After achieving renown, they say, he never accepted a fee for judging poems from anyone in this village. Now that too has become an old tale of long ago."}, {"id": "v1_p34_3", "volume": 1, "book": "おくのほそ道", "section_title": "三十四、山中温泉", "para_index": 34, "type": "発句・注", "verse": {"genre": "haiku", "l1": "行くて", "l2": "たふれ伏とも", "l3": "萩の原", "author": "河合曾良", "bg_theme": "yamanaka_haginohara", "bg_path": "shortliterature/bg_yamanaka_haginohara.jpg", "bg_title": "🌸 山中温泉・病をおして一人旅立つ曾良と萩の原（第53句専用描き下ろし背景）"}, "raw_text": "曾良は腹を病て、伊勢の国長島と云所にゆかりあれば、先立て行に、行くてたふれ伏とも萩の原　曾良。", "kakikudashi": "曾良は腹を病みて、伊勢の国長島といふ所にゆかりあれば、先立ちて行くに、行く行くてたふれ伏すとも萩の原　曾良。", "translation": "同行の曾良は以前からの腹の病が重くなり、伊勢の国長島という所に縁者がいるので一足先に旅立つことになり、行く行くてたふれ伏すとも萩の原――たとえこの先一人で行き悩み、旅の途中で力尽きて倒れ伏すことになろうとも、せめて咲き乱れる秋萩の原のなかで倒れたいものだ、と曾良は詠んだ。", "persons": "曾良", "places": "越前・美濃・伊勢圏,長島", "era_year": "元禄二年八月五日", "source_book": "", "keywords": "", "raw_tagged": "{{person:曾良|曾良}}は腹を病て、{{place:越前・美濃・伊勢圏|伊勢の国}}{{place:長島|長島}}と云所にゆかりあれば、先立て行に、行くてたふれ伏とも萩の原　{{person:曾良|曾良}}。", "kakikudashi_tagged": "{{person:曾良|曾良}}は腹を病みて、{{place:越前・美濃・伊勢圏|伊勢の国}}{{place:長島|長島}}といふ所にゆかりあれば、先立ちて行くに、行く行くてたふれ伏すとも萩の原　{{person:曾良|曾良}}。", "translation_tagged": "同行の{{person:曾良|曾良}}は以前からの腹の病が重くなり、{{place:越前・美濃・伊勢圏|伊勢の国}}{{place:長島|長島}}という所に縁者がいるので一足先に旅立つことになり、行く行くてたふれ伏すとも萩の原――たとえこの先一人で行き悩み、旅の途中で力尽きて倒れ伏すことになろうとも、せめて咲き乱れる秋萩の原のなかで倒れたいものだ、と{{person:曾良|曾良}}は詠んだ。", "english_tagged": "Suffering from a stomach ailment, {{person:曾良|Sora}} decided to set out ahead of me toward {{place:長島|Nagashima}} in {{place:越前・美濃・伊勢圏|Ise Province}}, where he had relatives, and left behind this verse: \"Though I walk and walk / until I fall down dead—let it / be on bush-clover moors.\" — {{person:曾良|Sora}}."}, {"id": "v1_p34_4", "volume": 1, "book": "おくのほそ道", "section_title": "三十四、山中温泉", "para_index": 34, "type": "発句・注", "verse": {"genre": "haiku", "l1": "今日よりや", "l2": "書付消さん", "l3": "笠の露", "author": "松尾芭蕉", "bg_theme": "yamanaka_kasanotsuyu", "bg_path": "shortliterature/bg_yamanaka_kasanotsuyu.jpg", "bg_title": "💧 山中温泉・同行二人の書付を濡らす菅笠の秋露（第54句専用描き下ろし背景）"}, "raw_text": "と書置たり。行ものゝ悲しみ、残ものゝうらみ、隻鳧のわかれに似たり。予も又、今日よりや書付消さん笠の露。", "kakikudashi": "と書き置きたり。行くものの悲しみ、残るもののうらみ、隻鳧のわかれに似たり。予もまた、今日よりや書付消さん笠の露。", "translation": "そのように書き残して旅立って行った。病をおして先に行く者の悲しみ、独りあとに残される者の辛さは、まさにつがいの水鳥が一羽ずつに引き裂かれる隻鳧のわかれにも似ている。私もまた、今日よりや書付消さん笠の露――これまで二人で歩んできた旅も今日から独りぼっちになってしまったからには、菅笠に書き付けた同行二人の文字を、この秋露と別れの涙とで消し去ってしまおう、と詠んだ。", "persons": "", "places": "", "era_year": "元禄二年八月五日", "source_book": "", "keywords": "隻鳧,書付消さん", "raw_tagged": "と書置たり。行ものゝ悲しみ、残ものゝうらみ、{{special:隻鳧|隻鳧のわかれ}}に似たり。予も又、今日よりや{{special:書付消さん|書付消さん}}笠の露。", "kakikudashi_tagged": "と書き置きたり。行くものの悲しみ、残るもののうらみ、{{special:隻鳧|隻鳧のわかれ}}に似たり。予もまた、今日よりや{{special:書付消さん|書付消さん}}笠の露。", "translation_tagged": "そのように書き残して旅立って行った。病をおして先に行く者の悲しみ、独りあとに残される者の辛さは、まさにつがいの水鳥が一羽ずつに引き裂かれる{{special:隻鳧|隻鳧のわかれ}}にも似ている。私もまた、今日よりや{{special:書付消さん|書付消さん}}笠の露――これまで二人で歩んできた旅も今日から独りぼっちになってしまったからには、菅笠に書き付けた同行二人の文字を、この秋露と別れの涙とで消し去ってしまおう、と詠んだ。", "english_tagged": "So he wrote before departing. The sorrow of the one who goes ahead and the grief of the one left behind were like the {{special:隻鳧|parting of a pair of wild ducks}}. I too composed: \"From today onward / {{special:書付消さん|let the dewdrops on my hat / erase the writing}}.\""}, {"id": "v1_p35_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十五、全昌寺・汐越の松", "para_index": 35, "type": "発句・注", "verse": {"genre": "haiku", "l1": "終宵", "l2": "秋風聞や", "l3": "うらの山", "author": "河合曾良", "bg_theme": "zenshoji_akikaze", "bg_path": "shortliterature/bg_zenshoji_akikaze.jpg", "bg_title": "🍃 大聖寺全昌寺・裏山の松林に鳴る夜すがらの秋風（第55句専用描き下ろし背景）"}, "raw_text": "大聖持の城外、全昌寺といふ寺にとまる。猶加賀の地也。曾良も前の夜此寺に泊て、終宵秋風聞やうらの山。", "kakikudashi": "大聖持の城外、全昌寺といふ寺にとまる。なほ加賀の地なり。曾良も前の夜この寺に泊まりて、終宵秋風聞くやうらの山。", "translation": "大聖持の城下町の外れにある、全昌寺という禅寺に一夜の宿を借りた。ここはまだ加賀の国の領内である。先立った曾良も昨夜この同じ寺に泊まっており、終宵秋風聞くやうらの山――師と別れて独り寝るこの寺で、一晩中眠れぬまま裏山の梢を吹き渡る秋風の音を寂しく聞いていることよ、と詠んでいた。", "persons": "曾良", "places": "大聖寺,全昌寺,北陸（越中・加賀）圏", "era_year": "元禄二年八月四日〜五日", "source_book": "", "keywords": "", "raw_tagged": "{{place:大聖寺|大聖持}}の城外、{{place:全昌寺|全昌寺}}といふ寺にとまる。猶{{place:北陸（越中・加賀）圏|加賀の地}}也。{{person:曾良|曾良}}も前の夜此寺に泊て、終宵秋風聞やうらの山。", "kakikudashi_tagged": "{{place:大聖寺|大聖持}}の城外、{{place:全昌寺|全昌寺}}といふ寺にとまる。なほ{{place:北陸（越中・加賀）圏|加賀の地}}なり。{{person:曾良|曾良}}も前の夜この寺に泊まりて、終宵秋風聞くやうらの山。", "translation_tagged": "{{place:大聖寺|大聖持}}の城下町の外れにある、{{place:全昌寺|全昌寺}}という禅寺に一夜の宿を借りた。ここはまだ{{place:北陸（越中・加賀）圏|加賀の国}}の領内である。先立った{{person:曾良|曾良}}も昨夜この同じ寺に泊まっており、終宵秋風聞くやうらの山――師と別れて独り寝るこの寺で、一晩中眠れぬまま裏山の梢を吹き渡る秋風の音を寂しく聞いていることよ、と詠んでいた。", "english_tagged": "Outside the castle town of {{place:大聖寺|Daishōji}}, I lodged at a Zen temple called {{place:全昌寺|Zenshōji}}. It is still within the {{place:北陸（越中・加賀）圏|territory of Kaga}}. {{person:曾良|Sora}} too had stayed at this very temple the night before, and left behind the verse: \"All the whole night through, / listening to the autumn wind / on the hill behind.\""}, {"id": "v1_p35_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十五、全昌寺・汐越の松", "para_index": 35, "type": "発句・注", "verse": {"genre": "haiku", "l1": "庭掃て", "l2": "出ばや寺に", "l3": "散柳", "author": "松尾芭蕉", "bg_theme": "zenshoji_chiriyanagi", "bg_path": "shortliterature/bg_zenshoji_chiriyanagi.jpg", "bg_title": "🌿 大聖寺全昌寺・白砂の禅庭に散る柳と竹箒（第56句専用描き下ろし背景）"}, "raw_text": "と残す。一夜の隔千里に同じ。吾も秋風を聞て衆寮に臥ば、明ぼのゝ空ちかく読経声すむまゝに、鐘板鳴て食堂に入。けふは越前の国へと、心早卒にして堂下に下るを、若き僧ども紙硯をかゝえ、階のもとまで追来りて、折節の庭中の柳ちるに、庭掃て出ばや寺に散柳。とりあへぬさまして草鞋ながら書捨ツ。", "kakikudashi": "と残す。一夜の隔て千里に同じ。吾も秋風を聞きて衆寮に臥せば、明ぼのの空近く読経声澄むままに、鐘板鳴りて食堂に入る。けふは越前の国へと、心早卒にして堂下に下るを、若き僧ども紙硯をかかえ、階のもとまで追ひ来たりて、折節の庭中の柳散るに、庭掃きて出でばや寺に散柳。とりあへぬさまして草鞋ながら書き捨つ。", "translation": "その一句が書き残されていた。わずか一夜の隔たりにすぎないのに、まるで千里の彼方へ離れたかのように胸が痛む。私もまた同じ裏山の秋風を聞きながら修行僧の寝起きする衆寮に横たわっていると、やがて曙の空が白みかける頃に読経の声が澄み渡り、食事を知らせる鐘板が鳴り響いて食堂へと入った。今日はいよいよ越前の国へ入るのだと、気ぜわしい思いで堂の下へ降りて行ったところ、若い雲水たちが紙と硯を抱えて階段の下まで追いかけて来て揮毫を請うたので、ちょうどその折に境内の柳の葉がはらはらと散り敷くのを見て、庭掃きて出でばや寺に散柳――一夜の宿の御礼にせめてこの庭を掃き清めてから旅立ちたいものだ、秋の禅寺の白砂にしきりと散り落ちる柳の葉よ、と詠んだ。旅立ちの間際の即興の句として、草鞋を履いたまま筆を走らせて書き残した。", "persons": "", "places": "越前・美濃・伊勢圏", "era_year": "元禄二年八月五日", "source_book": "", "keywords": "", "raw_tagged": "と残す。一夜の隔千里に同じ。吾も秋風を聞て衆寮に臥ば、明ぼのゝ空ちかく読経声すむまゝに、鐘板鳴て食堂に入。けふは{{place:越前・美濃・伊勢圏|越前の国}}へと、心早卒にして堂下に下るを、若き僧ども紙硯をかゝえ、階のもとまで追来りて、折節の庭中の柳ちるに、庭掃て出ばや寺に散柳。とりあへぬさまして草鞋ながら書捨ツ。", "kakikudashi_tagged": "と残す。一夜の隔て千里に同じ。吾も秋風を聞きて衆寮に臥せば、明ぼのの空近く読経声澄むままに、鐘板鳴りて食堂に入る。けふは{{place:越前・美濃・伊勢圏|越前の国}}へと、心早卒にして堂下に下るを、若き僧ども紙硯をかかえ、階のもとまで追ひ来たりて、折節の庭中の柳散るに、庭掃きて出でばや寺に散柳。とりあへぬさまして草鞋ながら書き捨つ。", "translation_tagged": "その一句が書き残されていた。わずか一夜の隔たりにすぎないのに、まるで千里の彼方へ離れたかのように胸が痛む。私もまた同じ裏山の秋風を聞きながら修行僧の寝起きする衆寮に横たわっていると、やがて曙の空が白みかける頃に読経の声が澄み渡り、食事を知らせる鐘板が鳴り響いて食堂へと入った。今日はいよいよ{{place:越前・美濃・伊勢圏|越前の国}}へ入るのだと、気ぜわしい思いで堂の下へ降りて行ったところ、若い雲水たちが紙と硯を抱えて階段の下まで追いかけて来て揮毫を請うたので、ちょうどその折に境内の柳の葉がはらはらと散り敷くのを見て、庭掃きて出でばや寺に散柳――一夜の宿の御礼にせめてこの庭を掃き清めてから旅立ちたいものだ、秋の禅寺の白砂にしきりと散り落ちる柳の葉よ、と詠んだ。旅立ちの間際の即興の句として、草鞋を履いたまま筆を走らせて書き残した。", "english_tagged": "A single night's separation felt the same as a thousand leagues. I too lay down in the monks' hall listening to the autumn wind, and as dawn drew near and the voices chanting sutras rang clear, the wooden gong sounded and we entered the refectory. Anxious to cross into {{place:越前・美濃・伊勢圏|Echizen Province}} today, I hurried down from the hall, when young monks came running after me to the bottom of the steps carrying paper and an inkstone; just at that moment the willow leaves in the courtyard were scattering in the breeze: \"Let me sweep the yard / before I take my leave—willow / scattering at the temple.\" With my straw sandals already tied on, I dashed this off in haste."}, {"id": "v1_p35_3", "volume": 1, "book": "おくのほそ道", "section_title": "三十五、全昌寺・汐越の松", "para_index": 35, "type": "本文", "verse": null, "raw_text": "越前の境、吉崎の入江を舟に棹して、汐越の松を尋ぬ。終宵嵐に波をはこばせて月をたれたる汐越の松　西行。此一首にて数景尽たり。もし一弁を加るものは、無用の指を立るがごとし。", "kakikudashi": "越前の境、吉崎の入江を舟に棹して、汐越の松を尋ぬ。終宵嵐に波をはこばせて月をたれたる汐越の松　西行。この一首にて数景尽きたり。もし一弁を加ふるものは、無用の指を立つるがごとし。", "translation": "加賀と越前の国境にある吉崎の入江を舟に棹さして渡り、名高い汐越の松を訪ねた。終宵嵐に波をはこばせて月をたれたる汐越の松――一晩中吹き荒れる嵐に日本海の荒波を根元まで運ばせながら、梢には清らかな月光を滴るように懸けている汐越の松よ、と西行法師の古歌に詠まれている。この一首の和歌によって、汐越の松のあらゆる素晴らしい景観はすでに余すところなく詠み尽くされている。もしこの上さらに何か一言でも句を付け加えようとするならば、それは五本の指の上に無用の指を一本付け足すような愚かなことであろう。", "persons": "", "places": "越前・美濃・伊勢圏,吉崎,汐越の松", "era_year": "元禄二年八月五日", "source_book": "", "keywords": "無用の指", "raw_tagged": "{{place:越前・美濃・伊勢圏|越前の境}}、{{place:吉崎|吉崎の入江}}を舟に棹して、{{place:汐越の松|汐越の松}}を尋ぬ。終宵嵐に波をはこばせて月をたれたる{{place:汐越の松|汐越の松}}　西行。此一首にて数景尽たり。もし一弁を加るものは、{{special:無用の指|無用の指}}を立るがごとし。", "kakikudashi_tagged": "{{place:越前・美濃・伊勢圏|越前の境}}、{{place:吉崎|吉崎の入江}}を舟に棹して、{{place:汐越の松|汐越の松}}を尋ぬ。終宵嵐に波をはこばせて月をたれたる{{place:汐越の松|汐越の松}}　西行。この一首にて数景尽きたり。もし一弁を加ふるものは、{{special:無用の指|無用の指}}を立つるがごとし。", "translation_tagged": "加賀と{{place:越前・美濃・伊勢圏|越前の国}}境にある{{place:吉崎|吉崎の入江}}を舟に棹さして渡り、名高い{{place:汐越の松|汐越の松}}を訪ねた。終宵嵐に波をはこばせて月をたれたる{{place:汐越の松|汐越の松}}――一晩中吹き荒れる嵐に日本海の荒波を根元まで運ばせながら、梢には清らかな月光を滴るように懸けている{{place:汐越の松|汐越の松}}よ、と西行法師の古歌に詠まれている。この一首の和歌によって、汐越の松のあらゆる素晴らしい景観はすでに余すところなく詠み尽くされている。もしこの上さらに何か一言でも句を付け加えようとするならば、それは五本の指の上に{{special:無用の指|無用の指}}を一本付け足すような愚かなことであろう。", "english_tagged": "At the {{place:越前・美濃・伊勢圏|border of Echizen}}, I poled a boat across the {{place:吉崎|inlet of Yoshizaki}} to visit the {{place:汐越の松|Pine of Shiogoshi}}. \"All the whole night through, / making the storm-wind carry waves / to wash its roots, while / dripping moonlight from its boughs— / the {{place:汐越の松|Pine of Shiogoshi}}.\" — Saigyō. This single waka says everything there is to say about the scene. To add even a single word more would be like {{special:無用の指|growing a useless sixth finger}}."}, {"id": "v1_p36_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十六、天龍寺・永平寺", "para_index": 36, "type": "発句・注", "verse": {"genre": "haiku", "l1": "物書て", "l2": "扇引きさく", "l3": "余波哉", "author": "松尾芭蕉", "bg_theme": "maruoka_ogi", "bg_path": "shortliterature/bg_kanazawa_tsuka.jpg", "bg_title": "🪭 丸岡天龍寺・北枝との別れと引き裂く白扇（第57句背景）"}, "raw_text": "丸岡天龍寺の長老、古き因あれば尋ぬ。又金沢の北枝といふもの、かりそめに見送りて、此処までしたひ来れる。所々の風景過さず思ひつゞけて、折節あはれなる作意など聞ゆ。今既別に望みて、物書て扇引きさく余波哉。", "kakikudashi": "丸岡天龍寺の長老、古き因みあれば尋ぬ。また金沢の北枝といふもの、かりそめに見送りて、この処まで慕ひ来れる。所々の風景過ごさず思ひ続けて、折節あはれなる作意など聞こゆ。今すでに別れに臨みて、物書きて扇引き裂く余波かな。", "translation": "丸岡の天龍寺の長老には、昔からの古い縁があったので訪ねた。また金沢の北枝という門人が、ほんの少し見送るつもりでついてきて、とうとうこの地まで私を慕ってやって来た。道中のあちこちの風景を決して見過ごさずに句を案じ続けて、折にふれてしみじみと情趣深い句作などを聞かせてくれた。今いよいよ別れに臨んで、形見の句を書きつけては夏扇を惜しみつつ引き裂くかのような、尽きせぬ別れの名残惜しさであることよ。", "persons": "北枝", "places": "丸岡,天龍寺,金沢", "era_year": "元禄二年八月五日〜十日", "source_book": "", "keywords": "", "raw_tagged": "{{place:丸岡|丸岡}}{{place:天龍寺|天龍寺}}の長老、古き因あれば尋ぬ。又{{place:金沢|金沢}}の{{person:北枝|北枝}}といふもの、かりそめに見送りて、此処までしたひ来れる。所々の風景過さず思ひつゞけて、折節あはれなる作意など聞ゆ。今既別に望みて、物書て扇引きさく余波哉。", "kakikudashi_tagged": "{{place:丸岡|丸岡}}{{place:天龍寺|天龍寺}}の長老、古き因みあれば尋ぬ。また{{place:金沢|金沢}}の{{person:北枝|北枝}}といふもの、かりそめに見送りて、この処まで慕ひ来れる。所々の風景過ごさず思ひ続けて、折節あはれなる作意など聞こゆ。今すでに別れに臨みて、物書きて扇引き裂く余波かな。", "translation_tagged": "{{place:丸岡|丸岡}}の{{place:天龍寺|天龍寺}}の長老には、昔からの古い縁があったので訪ねた。また{{place:金沢|金沢}}の{{person:北枝|北枝}}という門人が、ほんの少し見送るつもりでついてきて、とうとうこの地まで私を慕ってやって来た。道中のあちこちの風景を決して見過ごさずに句を案じ続けて、折にふれてしみじみと情趣深い句作などを聞かせてくれた。今いよいよ別れに臨んで、形見の句を書きつけては夏扇を惜しみつつ引き裂くかのような、尽きせぬ別れの名残惜しさであることよ。", "english_tagged": "Because I had an old bond of acquaintance with the elder of {{place:天龍寺|Tenryū-ji Temple}} in {{place:丸岡|Maruoka}}, I called upon him. Moreover, a man named {{person:北枝|Hokushi}} from {{place:金沢|Kanazawa}}, who had set out merely to see me off for a short way, had followed affectionately after me all the way to this place. Never letting the sights of each place pass unnoticed as he pondered his verses, from time to time he shared deeply moving poetic conceits. Now at last facing our parting: \"Writing down a verse, / tearing the white fan apart— / lingering regret.\""}, {"id": "v1_p36_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十六、天龍寺・永平寺", "para_index": 36, "type": "本文", "verse": null, "raw_text": "五十丁山に入て永平寺を礼ス。道元禅師の御寺也。邦機千里を避て、かゝる山陰に跡をのこし給ふも、貴きゆへ有とかや。", "kakikudashi": "五十丁山に入りて永平寺を礼す。道元禅師の御寺なり。邦畿千里を避けて、かかる山陰に跡を残し給ふも、貴きゆゑありとかや。", "translation": "街道から五十丁ほど深い山に分け入って永平寺を参拝した。ここは道元禅師が開かれた御寺である。王都から千里四方の畿内近国を避けて、このような北国の深い山陰に仏法の霊跡を残されたのにも、まことに尊い深いわけがあるのだという。", "persons": "道元禅師", "places": "永平寺", "era_year": "元禄二年八月十日", "source_book": "", "keywords": "邦機千里", "raw_tagged": "五十丁山に入て{{place:永平寺|永平寺}}を礼ス。{{person:道元禅師|道元禅師}}の御寺也。{{special:邦機千里|邦機千里}}を避て、かゝる山陰に跡をのこし給ふも、貴きゆへ有とかや。", "kakikudashi_tagged": "五十丁山に入りて{{place:永平寺|永平寺}}を礼す。{{person:道元禅師|道元禅師}}の御寺なり。{{special:邦機千里|邦畿千里}}を避けて、かかる山陰に跡を残し給ふも、貴きゆゑありとかや。", "translation_tagged": "街道から五十丁ほど深い山に分け入って{{place:永平寺|永平寺}}を参拝した。ここは{{person:道元禅師|道元禅師}}が開かれた御寺である。王都から千里四方の畿内近国を避けて、このような北国の深い山陰に仏法の霊跡を残されたのにも、まことに尊い深いわけがあるのだという。", "english_tagged": "Going fifty chō deep into the mountains, I bowed in reverence at {{place:永平寺|Eihei-ji Temple}}. It is the sacred temple of {{person:道元禅師|Zen Master Dōgen}}. That he avoided the {{special:邦機千里|thousand leagues around the capital}} and left his footsteps in such a remote mountain shadow was, I heard, for a most noble reason."}, {"id": "v1_p37_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十七、福井・等栽", "para_index": 37, "type": "本文", "verse": null, "raw_text": "福井は三里計なれば、夕飯したゝめて出るに、たそがれの路たどたどし。爰に等栽と云古き隠士有。いづれの年にか、江戸に来りて予を尋。遥十とせ余り也。いかに老さらぼひて有にや、将死けるにやと人に尋侍れば、いまだ存命してそこそこにと教ゆ。市中ひそかに引入て、あやしの小家に夕顔・へちまのはえかゝりて、鶏頭・はゝ木々に戸ぼそをかくす。さては此うちにこそと、門を扣ば、侘しげなる女の出て、「いづくよりわたり給ふ道心の御坊にや。あるじは此あたり何がしと云ものゝ方に行ぬ。もし用あらば尋給へ」といふ。", "kakikudashi": "福井は三里ばかりなれば、夕飯したためて出るに、たそがれの路たどたどし。ここに等栽といふ古き隠士あり。いづれの年にか、江戸に来たりて予を尋ぬ。はるか十とせあまりなり。いかに老いさらぼひてあるにや、はた死にけるにやと人に尋ね侍れば、いまだ存命してそこそこにと教ふ。市中ひそかに引き入りて、あやしの小家に夕顔・へちまの生えかかりて、鶏頭・帚木に戸ぼそを隠す。さてはこのうちにこそと、門を叩けば、侘しげなる女の出て、「いづくよりわたり給ふ道心の御坊にや。あるじはこのあたり何がしといふものの方に行きぬ。もし用あらば尋ね給へ」といふ。", "translation": "福井までは三里ほどの道のりなので、夕食を済ませてから出立したところ、夕暮れの道は暗くなり足もともおぼつかない。この福井には等栽という昔からの古い隠士が住んでいる。いつの年のことであったか、江戸にやって来て私を訪ねてくれたことがあった。それもはるか十年あまり昔のことである。その後どのように老い衰えて暮らしているのか、あるいはもう亡くなってしまったのではないかと土地の人に尋ねてみたところ、今もなお健在でどこそこに住んでいると教えてくれた。町中からひっそりと奥へ引っ込んだ所で、粗末な小さな家に夕顔や糸瓜の蔓が生い茂って絡みつき、鶏頭や帚木が入り口の戸を隠すほどに茂っている。さてはこの家の中に違いないと門の戸を叩くと、わびしげな風情の婦人が出てきて、「どちらからお越しになった修行のお坊様でしょうか。主人はこの近くの誰それという人の家へ出かけております。もしご用がおありでしたら、そちらをお尋ねになってください」と言う。", "persons": "等栽", "places": "福井,江戸・隅田川圏", "era_year": "元禄二年八月十日〜十一日", "source_book": "", "keywords": "三里", "raw_tagged": "{{place:福井|福井}}は{{special:三里|三里}}計なれば、夕飯したゝめて出るに、たそがれの路たどたどし。爰に{{person:等栽|等栽}}と云古き隠士有。いづれの年にか、{{place:江戸・隅田川圏|江戸}}に来りて予を尋。遥十とせ余り也。いかに老さらぼひて有にや、将死けるにやと人に尋侍れば、いまだ存命してそこそこにと教ゆ。市中ひそかに引入て、あやしの小家に夕顔・へちまのはえかゝりて、鶏頭・はゝ木々に戸ぼそをかくす。さては此うちにこそと、門を扣ば、侘しげなる女の出て、「いづくよりわたり給ふ道心の御坊にや。あるじは此あたり何がしと云ものゝ方に行ぬ。もし用あらば尋給へ」といふ。", "kakikudashi_tagged": "{{place:福井|福井}}は{{special:三里|三里}}ばかりなれば、夕飯したためて出るに、たそがれの路たどたどし。ここに{{person:等栽|等栽}}といふ古き隠士あり。いづれの年にか、{{place:江戸・隅田川圏|江戸}}に来たりて予を尋ぬ。はるか十とせあまりなり。いかに老いさらぼひてあるにや、はた死にけるにやと人に尋ね侍れば、いまだ存命してそこそこにと教ふ。市中ひそかに引き入りて、あやしの小家に夕顔・へちまの生えかかりて、鶏頭・帚木に戸ぼそを隠す。さてはこのうちにこそと、門を叩けば、侘しげなる女の出て、「いづくよりわたり給ふ道心の御坊にや。あるじはこのあたり何がしといふものの方に行きぬ。もし用あらば尋ね給へ」といふ。", "translation_tagged": "{{place:福井|福井}}までは{{special:三里|三里}}ほどの道のりなので、夕食を済ませてから出立したところ、夕暮れの道は暗くなり足もともおぼつかない。この福井には{{person:等栽|等栽}}という昔からの古い隠士が住んでいる。いつの年のことであったか、{{place:江戸・隅田川圏|江戸}}にやって来て私を訪ねてくれたことがあった。それもはるか十年あまり昔のことである。その後どのように老い衰えて暮らしているのか、あるいはもう亡くなってしまったのではないかと土地の人に尋ねてみたところ、今もなお健在でどこそこに住んでいると教えてくれた。町中からひっそりと奥へ引っ込んだ所で、粗末な小さな家に夕顔や糸瓜の蔓が生い茂って絡みつき、鶏頭や帚木が入り口の戸を隠すほどに茂っている。さてはこの家の中に違いないと門の戸を叩くと、わびしげな風情の婦人が出てきて、「どちらからお越しになった修行のお坊様でしょうか。主人はこの近くの誰それという人の家へ出かけております。もしご用がおありでしたら、そちらをお尋ねになってください」と言う。", "english_tagged": "Since {{place:福井|Fukui}} was only about {{special:三里|three leagues}} away, I set out after finishing supper, and my steps along the twilight road were unsteady. Here lived an old recluse by the name of {{person:等栽|Tōsai}}. In some year or other, he had come to {{place:江戸・隅田川圏|Edo}} and called upon me. That was already more than ten long years ago. When I inquired of people whether he had grown frail and decrepit with age or whether he had passed away, they told me that he was still alive and dwelling at such-and-such a place. Withdrawn quietly inside the town, moonflowers and sponge gourds climbed over a humble cottage, while cockscombs and broom cypresses hid the doorway from view. Thinking this must surely be the place, I knocked at the gate, whereupon a forlorn-looking woman came out and asked, \"From where have you come, venerable monk of the Way? The master of the house has gone to visit someone or other nearby. If you have business with him, please inquire for him there.\""}, {"id": "v1_p37_2", "volume": 1, "book": "おくのほそ道", "section_title": "三十七、福井・等栽", "para_index": 37, "type": "本文", "verse": null, "raw_text": "かれが妻なるべしとしらる。むかし物ガたりにこそかゝる風情は侍れと、やがて尋あひて、其家に二夜とまりて、名月はつるがのみなとにとたび立。等栽も共に送らんと、裾おかしうからげて、路の枝折とうかれ立。", "kakikudashi": "かれが妻なるべしと知らる。昔物語にこそかかる風情は侍れと、やがて尋ねあひて、その家に二夜泊まりて、名月は敦賀の港にと旅立つ。等栽も共に送らんと、裾をかしうからげて、路の枝折と浮かれ立つ。", "translation": "その婦人が等栽の妻なのであろうと察せられた。昔の物語『源氏物語』夕顔の巻などにこそ、まさにこのような風情が描かれていたものよと感興を催し、やがて等栽を探し当てて対面し、その家に二晩泊まってから、十五夜の名月は敦賀の港で見ようと旅立った。等栽も一緒に見送ろうと、着物の裾をおかしげにたくし上げて、道案内役になろうと浮き立つように連れ立った。", "persons": "等栽", "places": "敦賀", "era_year": "元禄二年八月十一日〜十三日", "source_book": "", "keywords": "", "raw_tagged": "かれが妻なるべしとしらる。むかし物ガたりにこそかゝる風情は侍れと、やがて尋あひて、其家に二夜とまりて、名月は{{place:敦賀|つるがのみなと}}にとたび立。{{person:等栽|等栽}}も共に送らんと、裾おかしうからげて、路の枝折とうかれ立。", "kakikudashi_tagged": "かれが妻なるべしと知らる。昔物語にこそかかる風情は侍れと、やがて尋ねあひて、その家に二夜泊まりて、名月は{{place:敦賀|敦賀の港}}にと旅立つ。{{person:等栽|等栽}}も共に送らんと、裾をかしうからげて、路の枝折と浮かれ立つ。", "translation_tagged": "その婦人が等栽の妻なのであろうと察せられた。昔の物語『源氏物語』夕顔の巻などにこそ、まさにこのような風情が描かれていたものよと感興を催し、やがて等栽を探し当てて対面し、その家に二晩泊まってから、十五夜の名月は{{place:敦賀|敦賀の港}}で見ようと旅立った。{{person:等栽|等栽}}も一緒に見送ろうと、着物の裾をおかしげにたくし上げて、道案内役になろうと浮き立つように連れ立った。", "english_tagged": "I realized that she must be his wife. Moved that such a scene belonged truly to an old romance like the Tale of Genji, I soon sought him out and met him, stayed two nights at his house, and then set forth to view the harvest moon at the port of {{place:敦賀|Tsuruga}}. {{person:等栽|Tōsai}} too, wishing to see me on my way, tucked up the hem of his robe in an amusing manner and set out in high spirits as my guide along the road."}, {"id": "v1_p38_1", "volume": 1, "book": "おくのほそ道", "section_title": "三十八、敦賀・気比の明神", "para_index": 38, "type": "発句・注", "verse": {"genre": "haiku", "l1": "月清し", "l2": "遊行のもてる", "l3": "砂の上", "author": "松尾芭蕉", "bg_theme": "tsuruga_yugyo_suna", "bg_path": "shortliterature/bg_ichiburi_hagitsuki.jpg", "bg_title": "🌕 敦賀・氣比神宮の松林と月光に輝く遊行の白砂（第58句背景）"}, "raw_text": "漸白根が嶽かくれて、比那が嵩あらはる。あさむづの橋をわたりて、玉江の蘆は穂に出にけり。鶯の関を過て、湯尾峠を越れば、燧が城、かへるやまに初雁を聞て、十四日の夕ぐれ、つるがの津に宿をもとむ。その夜、月殊晴たり。「あすの夜もかくあるべきにや」といへば、「越路の習ひ、猶明夜の陰晴はかりがたし」と、あるじに酒すゝめられて、気比の明神に夜参す。仲哀天皇の御廟也。社頭神さびて、松の木の間に月のもり入たる、おまへの白砂、霜を敷るがごとし。「往昔、遊行二世の上人、大願発起の事ありて、みづから草を刈、土石を荷ひ、泥渟をかわかせて、参詣往来の煩なし。古例今にたえず、神前に真砂を荷ひ給ふ。これを遊行の砂持と申侍る」と、亭主のかたりける。月清し遊行のもてる砂の上。", "kakikudashi": "やうやく白根が嶽隠れて、比那が嵩あらはる。あさむづの橋を渡りて、玉江の蘆は穂に出でにけり。鶯の関を過ぎて、湯尾峠を越ゆれば、燧が城、かへるやまに初雁を聞きて、十四日の夕暮れ、敦賀の津に宿をもとむ。その夜、月ことに晴れたり。「あすの夜もかくあるべきにや」といへば、「越路の習ひ、なほ明夜の陰晴はかりがたし」と、あるじに酒すすめられて、気比の明神に夜参す。仲哀天皇の御廟なり。社頭神さびて、松の木の間に月の漏り入りたる、御前の白砂、霜を敷けるがごとし。「往昔、遊行二世の上人、大願発起の事ありて、みづから草を刈り、土石を荷ひ、泥渟を乾かせて、参詣往来の煩ひなし。古例今に絶えず、神前に真砂を荷ひ給ふ。これを遊行の砂持と申し侍る」と、亭主の語りける。月清し遊行の持てる砂の上。", "translation": "しだいに加賀の白根が嶽が背後に隠れて見えなくなり、代わって越前の比那が嵩が姿を現す。歌枕のあさむづの橋を渡って行くと、玉江の蘆はすっかり秋の穂を出していた。鶯の関を通り過ぎて湯尾峠を越えると、木曾義仲ゆかりの燧が城が見え、かへるやまに今年初めての雁の声を聞いて、八月十四日の夕暮れに敦賀の港町で宿をとった。その夜は、月がとりわけ美しく晴れわたっていた。「明日の十五夜もこのように晴れるでしょうか」と尋ねると、「北陸路の天候の習わしとして、明日の夜が晴れるか曇るかはとても予測できません」と宿の主人に言われて酒を勧められ、その夜のうちに気比の明神へ夜参りに出かけた。ここは仲哀天皇をお祀りする御廟である。社殿のあたりは神々しく古びて荘厳な空気に満ち、松の木の間から月の光が漏れ差し込んで、神前の白い砂はまるで真っ白な霜を敷き詰めたかのようである。「その昔、時宗の遊行二世の上人が大いなる誓願を起こされて、上人ご自身の手で草を刈り、土や石を担いで運んで参道の泥沼を乾かし、参拝に行き交う人々の難儀をなくされました。その古い習わしは今に至るまで絶えることなく受け継がれ、歴代の遊行上人は神前に清らかな白砂を担いで運ばれます。これを遊行の砂持と申し上げるのです」と、案内してくれた宿の主人が語ってくれた。月がなんと清らかに澄みわたっていることよ、遊行上人が自ら運んで敷き詰められたこの神前の白砂の上に。", "persons": "仲哀天皇,遊行二世の上人", "places": "白根が嶽,比那が嵩,あさむづの橋,玉江,鶯の関,湯尾峠,燧が城,かへるやま,敦賀,越前・美濃・伊勢圏,気比の明神", "era_year": "元禄二年八月十三日〜十四日", "source_book": "", "keywords": "遊行の砂持", "raw_tagged": "漸{{place:白根が嶽|白根が嶽}}かくれて、{{place:比那が嵩|比那が嵩}}あらはる。{{place:あさむづの橋|あさむづの橋}}をわたりて、{{place:玉江|玉江}}の蘆は穂に出にけり。{{place:鶯の関|鶯の関}}を過て、{{place:湯尾峠|湯尾峠}}を越れば、{{place:燧が城|燧が城}}、{{place:かへるやま|かへるやま}}に初雁を聞て、十四日の夕ぐれ、{{place:敦賀|つるがの津}}に宿をもとむ。その夜、月殊晴たり。「あすの夜もかくあるべきにや」といへば、「{{place:越前・美濃・伊勢圏|越路}}の習ひ、猶明夜の陰晴はかりがたし」と、あるじに酒すゝ
