"id": "masterpiece_buson_okunohosomichi", "category": "日本古典名画（俳画・重要文化財絵巻）", "artist": "与謝蕪村", "series": "奥の細道図巻・屏風", "title": "奥の細道図屏風", "caption": "与謝蕪村『奥の細道図』（重要文化財・パブリックドメイン）", "province": "下野国・陸奥国", "commons_query": "Buson Oku no Hosomichi", "places": ["白河関", "那須野", "黒羽", "須賀川", "しのぶの里"], "works": ["おくのほそ道"]}, {"id": "masterpiece_sesshu_amanohashidate", "category": "日本古典名画（水墨画・国宝）", "artist": "雪舟等楊", "series": "国宝水墨画", "title": "天橋立図", "caption": "雪舟『天橋立図』（国宝・パブリックドメイン）", "province": "丹後国", "commons_query": "Ama-no-Hashidate Sesshu", "places": ["天橋立"], "works": ["小倉百人一首"]}];
  let currentFilter = 'ALL';

  const CONCURRENT_FETCH_BATCH_SIZE = 4;
  const FETCH_RETRY_DELAY_MS = 350;
  const urlCache = {};

  async function fetchCommonsThumb(queryStr, retryCount = 0) {
    if (urlCache[queryStr]) return urlCache[queryStr];
    try {
      const api = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap -Brooklyn ' + queryStr)}&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=640&format=json&origin=*`;
      const res = await fetch(api);
      if (res.status === 429 && retryCount < 3) {
        await new Promise(r => setTimeout(r, FETCH_RETRY_DELAY_MS * (retryCount + 1)));
        return fetchCommonsThumb(queryStr, retryCount + 1);
      }
      if (res.ok) {
        const data = await res.json();
        if (data.query && data.query.pages) {
          for (const pg of Object.values(data.query.pages)) {
            if (pg && pg.imageinfo && pg.imageinfo[0]) {
              const url = pg.imageinfo[0].thumburl || pg.imageinfo[0].url;
              if (url && !/(\.svg|\.pdf|brooklyn)/i.test(url)) {
                urlCache[queryStr] = url;
                return url;
              }
            }
          }
        }
      }
    } catch (e) {
      if (retryCount < 2) {
        await new Promise(r => setTimeout(r, FETCH_RETRY_DELAY_MS * (retryCount + 1)));
        return fetchCommonsThumb(queryStr, retryCount + 1);
      }
    }
    return '';
  }

  async function loadThumbnailsBatched(items) {
    for (let i = 0; i < items.length; i += CONCURRENT_FETCH_BATCH_SIZE) {
      const batch = items.slice(i, i + CONCURRENT_FETCH_BATCH_SIZE);
      await Promise.all(batch.map(async (e) => {
        const url = await fetchCommonsThumb(e.commons_query);
        const imgEl = document.getElementById(`img-${e.id}`);
        if (imgEl && url) imgEl.src = url;
      }));
    }
  }

  function renderGallery() {
    const cats = ['ALL', ...Array.from(new Set(ENTRIES.map(e => e.category)))];
    const bar = document.getElementById('filterBar');
    bar.innerHTML = cats.map(c =>
      `<button class="filter-btn ${c === currentFilter ? 'active' : ''}" onclick="currentFilter='${c}'; renderGallery();">${c === 'ALL' ? 'すべて表示 (' + ENTRIES.length + ')' : c}</button>`
    ).join('');

    const grid = document.getElementById('galleryGrid');
    const filtered = currentFilter === 'ALL' ? ENTRIES : ENTRIES.filter(e => e.category === currentFilter);
    grid.innerHTML = filtered.map(e => `
      <div class="card">
        <div>
          <div class="img-box"><img id="img-${e.id}" alt="${e.title}" loading="lazy" /></div>
          <span class="badge">${e.category} ／ ${e.province}</span>
          <div class="title">${e.caption}</div>
        </div>
        <div class="meta">
          <div>絵師：${e.artist}</div>
          <div style="margin-top:4px;">紐付け歌枕：${(e.places || []).map(p => `<span class="places-tag">📍 ${p}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');

    loadThumbnailsBatched(filtered);
  }

  renderGallery();
