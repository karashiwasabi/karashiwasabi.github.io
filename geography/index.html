<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>地図で読む だいたい18歳の地理</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<script src="assets/leaflet/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: #f8fafc; color: #1e293b; overflow: hidden; }
  header { background: #1f2937; color: #fff; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
  header h1 { font-size: 1.05rem; letter-spacing: .02em; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn { background: #374151; color: #fff; border: 1px solid #6b7280; padding: 4px 10px; border-radius: 4px; font-size: .78rem; cursor: pointer; }
  .btn.active { background: #e5e7eb; color: #111827; }
  .lv { font-size: .78rem; color: #d1d5db; display: flex; align-items: center; gap: 3px; }
  #app { display: flex; flex: 1; min-height: 0; }
  #map-col { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; background: #e5e7eb; }
  #panel { width: 460px; max-width: 46%; display: flex; flex-direction: column; background: #f1f5f9; border-left: 1px solid #cbd5e1; }
  #tabs { display: flex; gap: 4px; padding: 8px; background: #e2e8f0; }
  .tab { flex: 1; padding: 6px; border: 1px solid #94a3b8; background: #fff; border-radius: 4px; font-size: .8rem; cursor: pointer; }
  .tab.active { background: #1f2937; color: #fff; }
  #cards { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; }
  .card.active { border-color: #2563eb; box-shadow: 0 0 0 2px #93c5fd; }
  .card h2 { font-size: .98rem; margin-bottom: 4px; cursor: pointer; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { font-size: .7rem; font-weight: 700; color: #fff; padding: 1px 7px; border-radius: 10px; }
  .lvtag { font-size: .7rem; color: #475569; background: #e2e8f0; padding: 1px 7px; border-radius: 10px; }
  .txt { font-size: .86rem; line-height: 1.65; color: #334155; margin-top: 6px; }
  .note { font-size: .78rem; color: #64748b; padding: 4px 2px; }
  .sub { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 5px solid #334155; border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .subhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .subhead .chips { margin-bottom: 0; }
  .subname { font-size: .8rem; font-weight: 700; color: #334155; }
  .pin { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 10px; line-height: 1; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.6); white-space: nowrap; }
  .pin.P { border-radius: 50%; }
  .pin.A { border-radius: 4px; }
  .pin.K { border-radius: 2px; border-color: #facc15; }
  .pin.sel { outline: 3px solid #f59e0b; z-index: 9999 !important; }
  @media (max-width: 768px) { #app { flex-direction: column; } #panel { width: 100%; max-width: 100%; height: 50%; border-left: none; border-top: 1px solid #cbd5e1; } }
</style>
</head>
<body>
<header>
  <h1>地図で読む だいたい18歳の地理</h1>
  <div class="bar" id="areas"></div>
  <div class="bar">
    <label class="lv"><input type="checkbox" id="lvP" checked>地点</label>
    <label class="lv"><input type="checkbox" id="lvA" checked>地域</label>
    <label class="lv"><input type="checkbox" id="lvK" checked>国</label>
  </div>
</header>
<div id="app">
  <div id="map-col"><div id="map"></div>
    <div id="legend">
      <style>
        #legend { position: absolute; left: 10px; bottom: 10px; z-index: 1000; background: rgba(255,255,255,.93); border: 1px solid #94a3b8; border-radius: 6px; padding: 8px 10px; font-size: .74rem; line-height: 1.5; color: #1e293b; max-width: 270px; }
        #legend h3 { font-size: .78rem; margin-bottom: 3px; }
        #legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        #legend .pin { width: 16px; height: 16px; font-size: 9px; flex-shrink: 0; }
        #legend .sep { border-top: 1px solid #cbd5e1; margin: 5px 0; }
        #legend .small { color: #475569; font-size: .7rem; }
      </style>
      <h3>凡例</h3>
      <div class="row"><div class="pin P" style="background:#64748b"></div>地点（都市・山・湖・施設など）</div>
      <div class="row"><div class="pin A" style="background:#64748b"></div>地域（国内の地方・流域・盆地・海域）</div>
      <div class="row"><div class="pin K" style="background:#64748b"></div>国（国の代表点）</div>
      <div class="sep"></div>
      <div class="row"><div class="pin P" style="background:#dc2626">日</div>日本 <div class="pin P" style="background:#0891b2">台</div>台湾 <div class="pin P" style="background:#2563eb">韓</div>韓国</div>
      <div class="row"><div class="pin P" style="background:#7c3aed">米</div>アメリカ <div class="pin P" style="background:#16a34a">英</div>イギリス</div>
      <div class="row"><div class="pin P" style="background:#334155">2</div>複数の国の出典（数字＝国の数）</div>
      <div class="sep"></div>
      <div class="small">色と文字は、内容の出典となった国（国旗ではありません）。ピンの位置は概略です。広域・概念は右のタブへ。</div>
    </div>
  </div>
  <div id="panel">
    <div id="tabs">
      <button class="tab active" data-tab="map">地図のピン</button>
      <button class="tab" data-tab="wide">広域・地域</button>
      <button class="tab" data-tab="index">用語・概念</button>
    </div>
    <div id="cards"></div>
  </div>
</div>
<script>
const DATA = {"records": [{"n": "テクトニック災害（地震）", "t": "地震は、プレートの動きに伴って地殻が揺れ動くことで起こるテクトニック災害（地殻変動による災害）である。干ばつ・洪水・ハリケーンは、気象や水の動きに由来する災害であり、テクトニック災害には含まれない。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリス", "t": "イギリスでは1976年から2022年にかけて熱波が繰り返し起こり、記録された最高気温は1976年が35.9℃、1990年が37.1℃、1995年が35.2℃、2013年が34.1℃、2018年が35.3℃、2019年が38.7℃、2021年が32.2℃、2022年が40.3℃であった。この8回の熱波の最高気温の平均は36.1℃である。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "イギリス", "t": "イギリスで記録された主な熱波を年で見ると、2010年以降に5回（2013年、2018年、2019年、2021年、2022年）が起きている。最高気温は1976年の35.9℃から年ごとに上下しており、単調に上がり続けたり下がり続けたりしてはいない。2022年の40.3℃がこの期間で最も高い。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "イングランド南東部", "t": "2022年の夏、イギリスは1916年以降で最も乾燥した9か月間を経験し、イングランド南東部では11月から7月の降水量が長期平均のわずか74%にとどまった。全国で散水禁止令が出され、猛暑に対する健康警報が発せられ、作物の収量は平年を大きく下回った。", "b": "英", "y": "2025", "p": "地図", "k": "イングランド南東部", "e": "ヨーロッパ"}, {"n": "コリフォード貯水池", "t": "イングランド南西部コーンウォールのコリフォード貯水池では、2022年夏の干ばつで水位が大きく下がった。貯水池の水位低下は水道水の供給を脅かし、人々の暮らし（社会面）に影響する。", "b": "英", "y": "2025", "p": "地図", "k": "コリフォード貯水池", "e": "ヨーロッパ"}, {"n": "熱波と干ばつの社会的影響", "t": "熱波や干ばつが起きると、貯水池の水位が下がって水供給が脅かされ、水不足や散水禁止令が出て、庭の水やり、洗車、プールへの注水などが制限される。高齢者など弱い立場の人は熱中症や脱水のリスクが高まるため、健康警報が出される。冷房・冷蔵・揚水のための電力需要が増え、山火事が交通を妨げ農地を焼くこともある。一方で、人々が海岸に出かけて地域の交流や屋外活動が増え、日光で体内のビタミンDが増えて気分や健康にプラスに働く面もある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "熱波と干ばつの経済的影響", "t": "熱波や干ばつでは、作物の収量が減って食料価格が上がり、農業者の生計や食料の安定供給に負担がかかる。鉄道のレールの変形（座屈）や道路の舗装の溶解で運行が遅れ、通勤時間が延びるなどの経済的損失が生じる。一方で、海岸リゾートの観光、ホテル、飲食店、アイスクリームや冷たい飲み物の販売は好調になり、その分、交通機関などの公共サービスには負荷がかかる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリスの極端気象（寒波・嵐・洪水）の影響", "t": "イギリスの極端気象には、暴風雨、洪水、雷雨・ひょう、強風・竜巻、干ばつ、猛暑、ブリザードなどの寒波がある。極端な寒さは交通を乱して商店への物資輸送を滞らせ（経済面）、学校の閉鎖、事故の増加、人命への危険（社会面）をもたらし、鉄道・フェリー・航空の欠航や遅れ、作物の被害と家畜の損失、建設業など一部の産業の停止、送電線の損傷による停電も起こす。繰り返される洪水のストレスは、不安や抑うつなどのメンタルヘルス上の問題につながる。代表的な事例として、2009年のカンブリア洪水、2013年のセント・ジュード嵐、2014年のサマセット・レベルズ洪水、2020年のストーム・デニス、2010年と2018年3月の雪と氷などがある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリス", "t": "イギリスの温室効果ガス排出量は、1990年の約800 MtCO2e（二酸化炭素換算の百万トン）から2020年の約400 MtCO2eへと、約400 MtCO2e、ほぼ半分に減った。2005年ごろまでの減り方は緩やかで、2005年から2020年にかけて減少が速まった。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "イギリス", "t": "イギリスの2020年の温室効果ガス排出量の内訳は、二酸化炭素が79%、メタンが13%、一酸化二窒素が5%、フッ素化ガスが3%であり、二酸化炭素が約6倍の割合でメタンを上回って大半を占めた。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "温室効果ガスと気候変動", "t": "温室効果ガスは、地表から出る熱を大気中にとどめる（吸収して閉じ込める）はたらきをもつ。そのため温室効果ガスが増えると大気中にとどまる熱が増え、地球温暖化と気候変動が進む。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "炭素回収・貯留", "t": "炭素回収は、発電所・化学工場・バイオマス発電所などの排ガスから二酸化炭素を取り除き、大気に出る前に捕らえて、古い石油・ガス田や炭鉱の跡など地下に貯留する技術である。方法によっては大気中の二酸化炭素を直接取り出すこともできる。大気中に放出される二酸化炭素の量が減ることで温室効果ガスの濃度が下がり、地球温暖化の進行を遅らせる。植林・マングローブ・泥炭地・湿地による炭素の固定も、炭素回収・貯留の一形態として扱われる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "メキシコ湾東部", "t": "2022年9月のハリケーン・イアンは、キューバを通過したあと、メキシコ湾に入って勢力を強め、フロリダ半島の南西沖の海上で風速最大241 km/hのカテゴリー4に達した。", "b": "英", "y": "2025", "p": "地図", "k": "メキシコ湾東部", "e": "海洋"}, {"n": "キューバ", "t": "ハリケーン・イアンは、2022年9月27日（火）に勢力を強めながらキューバを襲い、高潮などで沿岸の集落が浸水し、数千人が停電に見舞われた。", "b": "英", "y": "2025", "p": "地図", "k": "キューバ", "e": "北アメリカ"}, {"n": "フォートマイヤーズ", "t": "2022年9月、ハリケーン・イアンはアメリカ・フロリダ州のフォートマイヤーズ付近に上陸した。メキシコ湾を横切る間に起きた高潮は沿岸の集落を浸水させ、数千人が停電した。人々は住まいを失って避難を強いられ、負傷者や死者も出うる。仕事を失う人も出うる。", "b": "英", "y": "2025", "p": "地図", "k": "フォートマイヤーズ", "e": "北アメリカ"}, {"n": "熱帯低気圧の監視・予測", "t": "熱帯低気圧は、レーダー・衛星・航空機で監視され、そのデータをコンピューターモデルに入れて進路が予測される。これにより、発生・接近の時期と場所が分かり、人々は避難や家屋・事業所の防護をする時間を得られる。アメリカでは、大西洋と東部太平洋の熱帯低気圧の動きがフロリダ州にある国立ハリケーンセンターで追跡され、ハリケーン級の風が観測されるとハリケーン注意報が出される。スーパーコンピューターにより、5日前に、より正確な位置の警報が出せることも多い。ただし、強さと進路は急に変わることがあり、予報円（不確実性の円錐）は大きい。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "熱帯低気圧への防護と備え", "t": "熱帯低気圧の被害は、強風に耐える建物と備えの教育で減らせる。鉄筋コンクリートで建物を造り、高床式にして洪水から守り、沿岸の住宅には風に強い屋根瓦や耐暴風窓を使う。低所得の国には、暴風シェルターで村全体の命を守っている例がある。河川には堤防、海岸には防潮堤などの治水・防災施設を築く。学校では危険と対処法を教え、政府はポスター・リーフレット・メディア向け情報を作り、人々は防災キットを備えるよう促される。これらにより倒壊する建物が減り、死傷者・住宅を失う人・失業する人が減る。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "バングラデシュ", "t": "バングラデシュでは、熱帯低気圧（サイクロン）がバングラデシュ気象局によって追跡され、警報がラジオ・テレビ・ソーシャルメディアで複数の言語で出される。農村部ではもっとも遠い集落にまで警報が届くようになっている。", "b": "英", "y": "2025", "p": "地図", "k": "バングラデシュ", "e": "アジア"}, {"n": "豊かさの違いによるテクトニック災害の影響・対応の違い", "t": "テクトニック災害は豊かさで被害を区別しないが、予測・防護・備えの能力は経済力と結びつくことが多く、影響の大きさが異なる。影響には、死傷、遺族の悲しみ、家屋・交通・通信・インフラの破壊、企業の被害と失業、略奪などの犯罪、製造業や観光の混乱、取引の減少、長期の健康被害、保険請求、作物と家畜の損失、水道管の破裂と水の汚染、疫病のリスクがある。環境面では、地すべり、沿岸の洪水、生態系の乱れ、下水漏れ、水質汚染が起こる。発生後数時間〜数日の緊急対応は、捜索と救助、がれきに埋まった人の救出、医療、仮設住宅、食料と飲料水の提供であり、死者数を減らすうえで重要である。数週間〜数か月後の長期対応は、ガス・電気・水道の復旧、建物と交通網の再建、そして将来の被害を減らすための監視・予測・防護・計画である。裕福な国ほど回復が早い傾向がある。一方、被害の大きさは豊かさよりも地震の規模に左右される場合もある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ラクイラ", "t": "2009年にイタリア中部で起きたマグニチュード6.3のラクイラ地震では、約300人が亡くなり、6万人以上が家を失った。歴史的建造物、学校、病院が壊れ、食料・水・電気の供給が減った。余震は地すべりや落石を引き起こし、ポンペイ近くのパガーニでは、水道管の破裂による泥流が起きた。地震直後に非常事態が宣言され、国際的な支援が提供された。", "b": "英", "y": "2025", "p": "地図", "k": "ラクイラ", "e": "ヨーロッパ"}, {"n": "ネパール", "t": "2015年のネパール・ゴルカ地震（マグニチュード7.8）では、推定8000人超が亡くなり、100万人以上が家を失った。歴史的建造物、学校、病院が壊れ、食料・水・電気の供給が減った。余震は地すべりと落石を引き起こし、エベレスト・ベースキャンプでは雪崩が観光客とシェルパ19人の命を奪った。地震直後に非常事態が宣言され、国際的な支援が提供された。", "b": "英", "y": "2025", "p": "地図", "k": "ネパール", "e": "アジア"}, {"n": "世界の熱帯雨林の地域別面積（2020年）", "t": "2020年の世界の熱帯雨林の総面積は9億6800万ヘクタールである。地域別では、アマゾン（南アメリカ）が5億2600万ヘクタール、コンゴ（中央アフリカ）が1億6800万ヘクタール、オーストラレーシア（オーストラリアとニューギニア）が6400万ヘクタール、スンダランド（東南アジア）が5100万ヘクタール、インド・ビルマ（東南アジア）が4000万ヘクタール、メソアメリカ（メキシコと中央アメリカ）が1600万ヘクタール、ウォーレシア（インドネシア）が1500万ヘクタール、西アフリカが1000万ヘクタール、大西洋岸森林（南アメリカ）が900万ヘクタール、チョコ（南アメリカ）が800万ヘクタール、その他の熱帯林（世界）が6100万ヘクタールである。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "コンゴ盆地", "t": "中央アフリカのコンゴの熱帯雨林は、2020年に1億6800万ヘクタールの面積をもち、アマゾンに次いで世界で2番目に広い熱帯雨林である。", "b": "英", "y": "2025", "p": "地図", "k": "コンゴ盆地", "e": "アフリカ"}, {"n": "アマゾン", "t": "南アメリカのアマゾンの熱帯雨林は、2020年に5億2600万ヘクタールの面積をもち、総面積9億6800万ヘクタールの世界の熱帯雨林のうち、54.3%を占める。", "b": "英", "y": "2025", "p": "地図", "k": "アマゾン", "e": "南アメリカ"}, {"n": "熱帯雨林の植物の環境への適応", "t": "熱帯雨林の樹木は、日光を求めて高く伸び、大きく幅広い葉で光合成を最大化する。薄い土壌の養分を吸収するため根は浅く広がり、板根（バットレス）や長く太い地表根で巨木を支えて安定させる。葉の先は水滴を落とす「ドリップチップ」の形で、大量の雨水を流し、カビの繁殖を防ぐ。多くの植物は厚いろう質のクチクラをもち、水を弾く。樹皮は水分を保つ必要がないため薄くて滑らかである。ツル植物（リアナ）は幹に巻きついて林冠まで登り、着生植物は大木の上に生えて、土ではなく空気中から水分を得て光を受ける。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "熱帯雨林の植生が支える動物の多様性", "t": "熱帯雨林では多様な植物種が、多様な動物・鳥・昆虫を支えている。森は層ごとに異なる生息地を提供し、林冠には果実・種子・葉・花蜜が豊富で、食物・隠れ場所・住処となる。密な植生は捕食者から身を隠す（カモフラージュ）効果もある。被食者の種類が多いため、ジャガー・ヘビ・猛禽類などの捕食者も繁栄する。樹木は水分を放出して湿度と水の利用を維持し、両生類や昆虫を支える。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "熱帯雨林の気候が土壌に与える影響", "t": "熱帯雨林では、豊富な雨が土壌の養分を洗い流す（溶脱）ため土壌はやせている。高温と湿気により、落ち葉などの有機物（リター）は細菌によって速く分解される。太陽の熱でラテライトの硬い層（硬盤）が形成されることがある。雨が多く土壌は常に湿っているか水で飽和している。赤道付近の森では岩石の化学的風化が速く、深い土壌ができる。植生がはがれた土壌には雨による土壌侵食が起こる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "熱帯雨林の環境への価値", "t": "熱帯雨林は光合成で二酸化炭素を吸収して酸素を放出し、大気の組成を調節する。炭素を放出量の約2倍吸収する炭素の貯蔵庫（炭素吸収源）であるが、この働きは脅かされている。樹木の根は地下への浸透を高め、帯水層を発達させ、根が土壌を固定し、密な林冠が大雨から土壌を守って侵食を最小限に抑える。降雨を遮り、蒸発散により水を大気に戻し、再び降水となる水循環を通じて、アマゾンなどに絶え間ない水の供給をもたらす。熱帯林は地球の陸地面積の約6%にすぎないが、陸上の動植物種の約50%が生息し、生物多様性が非常に高い。森林が水を循環させ続けなければ干ばつが増え、飢饉や疫病にもつながりかねない。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "熱帯雨林の人間への価値", "t": "熱帯雨林は多くの財とサービスを提供する。アマゾンでは、木の実が地元の人々の食事の一部となり、商品作物も生産される。パーム油は化粧品・菓子・洗剤などの原料になる。ニチニチソウ（ロージー・ペリウィンクル）は小児白血病の治療に役立つなど、医薬品の探索に使われてきた。エコツーリズムは、少人数のグループで保護された自然を訪ねることで、地元の雇用を生み環境を守ることを目指す。ガーデン家具用の堅木（ハードウッド）などの木材も伐採されて輸出される。熱帯雨林は多くの先住民族（アマゾンではアメリンディアン）の住処でもあるが、森林伐採や持ち込まれた病気で多くの人が住まいや命を失った。人間にとっての価値は、多くの場合、環境の保護と一致する。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "アクラヴィック", "t": "カナダ北西部の北緯68度に位置するアクラヴィックでは、月降水量が最も多いのは8月で、約41mmである。降水は年間を通じて見られる。", "b": "英", "y": "2025", "p": "地図", "k": "アクラヴィック", "e": "北アメリカ"}, {"n": "アクラヴィック", "t": "北緯68度の北極圏に近い寒冷環境に位置するカナダのアクラヴィックは、太陽光の入射角が小さく雪氷による反射も大きいため低温となり、月平均気温は1月の約−27℃から最暖月である7月の約16℃まで大きく変化する。降水量は8月（約41mm）をピークとして年間を通じて見られる。", "b": "英", "y": "2025", "p": "地図", "k": "アクラヴィック", "e": "北アメリカ"}, {"n": "カイロ", "t": "北緯30度の高温砂漠環境に位置するエジプトのカイロは、低緯度で太陽光が集中して降り注ぐため年間を通じて温暖であり、月平均気温は1月の約15.5℃から最暖月である7・8月の約33.5℃の間で推移する。降水は10月から4月にかけてごくわずかに見られるのみで（最多の1月でも約6mm）、5月から9月にかけては月降水量が0mmとなる極端な乾燥気候である。", "b": "英", "y": "2025", "p": "地図", "k": "カイロ", "e": "アフリカ"}, {"n": "緯度と気温（カイロとアクラヴィック）", "t": "低緯度では太陽光が地表に集中して降り注ぐため気温が高く、極地に近い高緯度では太陽光が広い面積に分散し、雪氷が太陽光を反射して地表が温まりにくく、冬には日照がほとんどなく、極地からの冷たい風も吹くため気温が低い。北緯30度のエジプトのカイロは年間を通じて温暖であり、北緯68度のカナダのアクラヴィックは寒冷である。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "サハラ砂漠南縁（サヘル）", "t": "サハラ砂漠は過去100年間に250km以上南へ広がったとされる。サハラ南縁の国々では長い内戦で作物や家畜が失われて飢饉が起き、数百万人が武力紛争で砂漠縁辺部に移り、難民になる人もいる。移り住んだ都市や難民キャンプの周りでは資源への圧力が強まる。「グレート・グリーン・ウォール」のような植林による対策も試みられている。", "b": "英", "y": "2025", "p": "地図", "k": "サハラ砂漠南縁", "e": "アフリカ"}, {"n": "ケニア", "t": "ケニアでは、遊牧のマサイ族の人々が限界地へ追いやられ、従来の移動経路が妨げられて、家畜を飼える土地が狭まった。その結果、過放牧が起こり、風と水による土壌侵食が進む砂漠化の例となっている。", "b": "英", "y": "2025", "p": "地図", "k": "ケニア", "e": "アフリカ"}, {"n": "砂漠化と人間活動", "t": "砂漠化は、肥沃な土地が、森林伐採・干ばつ・不適切な農業などによって砂漠のようになる過程で、世界の人口の約20%が、60か国以上でその脅威に直面している。人間活動に由来する原因には、人口増加による土地への圧力、干ばつと砂漠化で移住した人々による圧力の移転、休ませずに耕す過耕作による土壌の疲弊、燃料や建材のための伐採で根を失った土壌が風雨で削られるガリー侵食、戦争、人為的な温室効果による干ばつと高温のリスク、植生を取り除く鉱山開発、化石燃料の採掘、ターのような脆弱な地域での観光などがある。家畜（ヤギ・ヒツジ・ウシ）の過放牧は植生を壊し、土が砂ぼこりになって不毛になる。一方、降水量の減少、気温上昇による蒸発の増加、降雨の不規則化といった自然要因もあり、気候変動は自然の周期の一部でもある。緑化など、人間の管理が砂漠化を抑える場合もある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "タール砂漠", "t": "インドとパキスタンにまたがるタール砂漠の縁辺部は脆弱な地域であり、環境への負荷が大きい観光が行われると、砂漠化が進む原因となりうる。", "b": "英", "y": "2025", "p": "地図", "k": "タール砂漠", "e": "アジア"}, {"n": "寒冷環境の開発の困難", "t": "寒冷環境の開発には、極端な低温、少ない降水、日照時間の変動、永久凍土とその上の活動層、脆弱な生態系、地形の障壁、費用の高さと遠隔性、先住民との対立などの課題がある。建設は永久凍土を融かして不安定な地盤を作る。凍った地面での道路・鉄道・水道・電力のパイプ敷設は難しく、融解する凍土が建物を沈下させ、道路を割り、木々を倒す。極端な寒さは人を傷つけ命を奪い、医療機関は何マイルも離れていることがある。低い人口密度のためサービスが乏しく、遠隔地の雇用は限られる。気候変動は、適応が難しい急激な変化をもたらすおそれがある。道路は砂利で造り、家は高床にして沈下に備える。石油のように価値ある資源は大規模掘削の収益が見込めるため、この課題を克服して開発が進められる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "アラスカ", "t": "アメリカのアラスカでは、トランス・アラスカ石油パイプラインの一部が高床式に持ち上げられており、パイプの熱で永久凍土が融けて地盤が不安定にならないように設計されている。", "b": "英", "y": "2025", "p": "地図", "k": "アラスカ", "e": "北アメリカ"}, {"n": "水圧作用（海食の過程）", "t": "波が崖に激しく打ちつけて、岩の割れ目に水と空気を押し込み、圧力で岩を砕く海食の過程を水圧作用（ハイドローリック・パワー）という。摩耗（アブレーション）は波が運ぶ砂礫で岩を削る作用、摩滅（アトリション）は運ばれる砂礫どうしがぶつかって小さくなる作用、溶食（ソリューション）は岩が水に溶ける作用であり、波が崖にぶつかる力そのものを指す名称ではない。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "海岸砂丘の土壌pHの分布", "t": "イギリスの海岸砂丘で、海から30m〜210mの7地点で土壌のpHを測った調査では、30mが8.5、60mが8.4、90mが8.2、120mが7.2、150mが7.0、180mが7.5、210mが6.5で、中央値は7.5であった。海に近い砂丘ほどアルカリ性に近く、内陸の古い砂丘ほど中性から弱酸性に近づく。砂丘は、海側から順に、胚胎砂丘（エンブリオ・デューン）、前砂丘、黄色砂丘、灰色砂丘、砂丘間の湿地（デューンスラック）、成熟砂丘が並ぶ。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "海岸砂丘の植生の変化", "t": "海岸砂丘では、海に近い胚胎砂丘（エンブリオ・デューン）から内陸の成熟した砂丘に向かって、植生の被覆率と植物の種数が増える。胚胎砂丘は植被率が約25%で種数2種にすぎないが、成熟砂丘は植被率100%で種数22種に達する。植生は、胚胎砂丘のイネ科草本から、灰色砂丘の低木を経て、成熟砂丘の森林へと高く変化する。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "砂丘の植被率と植物種数", "t": "海岸砂丘では、植被率が80%の地点に6種の植物が見られる例がある。一般に、植被率が高い地点ほど植物種数が多くなる傾向がある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ストック（海食柱）の形成", "t": "海に突き出た岬では、波が岩の垂直な弱線（断層・割れ目）を攻撃し、水圧作用と摩耗で割れ目を広げて洞窟をつくる。洞窟はやがてアーチ（海食門）になって海が両側から通り抜け、凍結融解・塩類風化・炭酸化などの風化が周囲の岩を弱めて崩れやすくする。アーチの上部が崩れ落ちると、垂直の岩の柱であるストックが残り、さらに侵食を受けるとストックも崩れて低いスタンプ（切り株状の岩）になる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "海岸の硬い構造物（ハード・エンジニアリング）", "t": "海岸の人工構造物による管理は、波のエネルギーを弱めたり、陸と海の間に壁をつくったりして、高波が崖に届かないようにする。突堤（グロイン）は海岸に直角に延び、沿岸漂砂を止めて砂や礫を堆積させ、広い浜が観光に役立ち、費用は比較的低く適切に維持すれば約40年もつが、最後の突堤の先では浜が失われ崖の侵食が進む。護岸壁（シーウォール）は崖・土地・建物を侵食と一部の高潮から守り、人々に安心感を与えるが建設費が高く、曲面で波を反射して波の力を保つため、底が洗掘され維持費がかさむ。ふとん籠（ガビオン）は石を詰めた金網で、安価で設計の自由度が高く20〜25年もつが、錆びて見苦しくなる。捨石（リップラップ・ロックアーマー）は巨大な岩を崖の足元に積んで波のエネルギーを分散させ、護岸壁より安いが、他地域から運ぶ岩は輸送費が高く現地の地質と異なる。消波堤、人工礁などもある。一か所で構造物を設けると、海岸沿いの別の場所に悪影響が出ることがある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "跳躍（サルテーション）", "t": "河川の運搬作用のうち、小石が川床の上を跳ねながら移動することを跳躍（サルテーション）という。細かい物質が水に混ざって運ばれるのは浮流（サスペンション）、大きな礫が川床を転がるのは掃流（トラクション）、溶けた物質が運ばれるのは溶流（ソリューション）である。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ハイドログラフ（森林河川の流量）", "t": "ハイドログラフは、降雨後の河川の流量（単位はm³/秒＝キューメック）の時間変化を示すグラフである。森林域を流れる河川では、暴風雨のあとの流量の変化がゆるやかで、ある事例では20時に20キューメックまで下がり、通常の流量に戻っていく。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "遅れ時間（ラグタイム）", "t": "ハイドログラフで、降雨のピークから河川の流量のピークまでの時間差を遅れ時間（ラグタイム）という。都市を流れる河川では、舗装面が多く雨水が速く河道に流れ込むため遅れ時間が短く、ある事例ではピーク降雨からピーク流量まで2時間であった。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "都市河川（森林河川との流量の違い）", "t": "同じ規模の暴風雨のあと、都市を流れる河川は、森林域を流れる河川に比べて最大流量が約2倍に近くなることがある。都市河川は降雨のピークから流量ピークまでの遅れ時間が短く、流量の上昇も下降も急である。一方、森林河川は変化がゆるやかで、一時的に横ばいになってから再び上がり、通常の流量に戻るまでに時間がかかる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "滝の形成", "t": "河川が硬い岩（キャップロック）の層と、その下のやわらかい岩の層の上を流れる所では、やわらかい岩が水圧作用と摩耗によって速く削られて滝ができる。落ちた水は滝つぼ（プランジプール）という深い穴を掘り、下のやわらかい岩がえぐられて、上の硬い岩が下から削られて張り出し、ひびが入って崩れ落ちる。これが繰り返されて滝は上流に後退し、急な谷壁をもつ峡谷（ゴージ）を残す。氷河地形の懸垂谷や、海面変動でできる遷急点（ニックポイント）にも滝ができる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "洪水対策のソフト・エンジニアリング", "t": "ソフト・エンジニアリングは、人工構造物を造らず、河川の自然の過程を生かして洪水の影響を減らし、水が河道に流れ込む速さを遅くする工法である。植林は、流域で遮断（インターセプション）と貯留を高め、地表流出を減らし、遅れ時間を延ばして流量を減らす。動物の生息地を増やし、雨水から汚染物質を取り除いて水質を改善する。長期的には比較的安価だが、樹木が育つまで数年かかり、土地の他の用途が制限される。洪水警報は、「洪水注意」「洪水警報」「重大洪水警報」の3段階で、人々に避難の時間を与えて死者や家財の損害、保険請求、精神的苦痛を減らす。比較的安価だが、洪水の発生そのものは防げず、全員に間に合って伝わるとは限らない。氾濫原のゾーニングは、川に近い土地を放牧地とし、遠い土地を住宅や産業にする。安価で自然の流れを妨げないが、既存の土地利用の変更は難しい。河川の復元は、人工的に改変した川を本来の流路に戻して下流の洪水リスクを減らすが、費用がかかる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ブルドージング（氷河による押し出し）", "t": "氷河が前進するとき、前方の物質を押し出していく作用をブルドージングという。摩耗（アブレーション）は氷河が運ぶ岩屑による削り、抜き取り（プラッキング）は岩を凍りつかせて引きはがす作用、回転滑動（ローテーショナル・スリップ）はカールの氷が弧を描いて動く運動である。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ドラムリン（長さ）", "t": "氷河が堆積させた地形であるドラムリンは、長さが約820m（790〜850mの範囲）で、高さは30m前後に達するものがある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ドラムリンの形状", "t": "ドラムリンは、卵形（楕円形）の細長い小丘で、氷河が来た側（ストス側）が急で、氷河が去る側（リー側）がゆるやかな非対称の形をもつ。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "氷河谷での観光客と農家の対立", "t": "ドラムリンのある氷河谷では、観光客と農家との間に対立が生じうる。観光客が石垣を壊して農家が修理を迫られる、歩行者が地面を踏み荒らして家畜の牧草地や作物を傷める、ゴミを捨てて家畜が食べる、犬のふんが家畜の病気をもたらす、門を開けたままにして家畜が逃げ、けがをしたり迷子になったりして農家の収入が減る、などである。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "カール（圏谷）の形成", "t": "イギリスでは、日光があまり当たらない北または北東向きの小さなくぼ地に雪が積もり、氷に変わって小さな氷河がくぼ地を満たす。雪食（凍結融解、融雪水、スランプ）がくぼ地を広げ、氷河が回転滑動で下り始めると、凍結融解と抜き取りが背壁の岩を壊して急な背壁を作る。氷河の底に引きずられた岩屑による摩耗がくぼ地を深くして岩盤の窪みをつくる。縁では侵食が弱く岩の出っ張り（リップ）ができ、堆積物が積み増すことも多い。氷が融けるとリップが自然のダムになり、丸い湖（タルン、コリー湖）ができることがある。氷が消えた後には、肘掛け椅子の形のくぼ地が残る。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "レイク・ディストリクト", "t": "イングランド北西部の氷河地形が広がるレイク・ディストリクトには、年間約1500万人の観光客が山歩きに訪れ、歩道の侵食が深刻になっている。「フィックス・ザ・フェルズ」事業が歩道を修復・維持して土壌侵食を防ぐが、費用は非常に高い。交通渋滞に対しては、車の代わりに船で観光客を運ぶ「パーク・アンド・セイル」計画があり、道路の車を減らせるが、航路は湖に限られる。「ゴー・レイクス・トラベル」計画は、公共交通を改善して渋滞を減らす取り組みで、従量制のレンタカーと自転車、安全な歩行・自転車の道、共通乗車券の網を整える。観光を人気の観光地に集める「アクティブ・ゾーニング」や、セカンドハウスの所有に関する法制度も、管理策として挙げられる。", "b": "英", "y": "2025", "p": "地図", "k": "レイク・ディストリクト", "e": "ヨーロッパ"}, {"n": "都市化", "t": "都市化とは、総人口に占める都市に住む人の割合が高まっていくことである。都市の数や規模、人口の絶対数の増加そのものを指すのではない。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "2050年までに新たにメガシティ（人口1000万人以上の都市）となる都市", "t": "2050年までに新たにメガシティ（人口1000万人以上の都市）になると見込まれる都市は、アジアに最も多い。アジアではバグダッド、テヘラン、アーメダバード、スーラト、プネー、ホーチミン、成都、南京の8都市、アフリカではダルエスサラーム、ナイロビ、ルアンダ、ハルツームの4都市、ヨーロッパではロンドン、北アメリカではシカゴがそれにあたる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ナイロビ", "t": "ケニアのナイロビの人口は2022年の約520万人から2050年には約1040万人（予測）へと、100%増え、2倍になると見込まれ、メガシティになる都市の一つとされている。", "b": "英", "y": "2025", "p": "地図", "k": "ナイロビ", "e": "アフリカ"}, {"n": "ダルエスサラーム", "t": "東アフリカの新興経済国タンザニアのダルエスサラームの人口は、2022年の約750万人から2050年には約1640万人（予測）へと増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "ダルエスサラーム", "e": "アフリカ"}, {"n": "ルアンダ", "t": "アンゴラのルアンダの人口は、2022年の約900万人から2050年には約1460万人（予測）へと増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "ルアンダ", "e": "アフリカ"}, {"n": "ハルツーム", "t": "スーダンのハルツームの人口は、2022年の約620万人から2050年には約1120万人（予測）へ増える見込みで、市の人口は1週間に2885人増え、住民の年齢の中央値は20歳と若い。若い人口が多いため出生による自然増加が大きく、地方などからの移住者の流入も加わって、急速な都市の成長が続く。", "b": "英", "y": "2025", "p": "地図", "k": "ハルツーム", "e": "アフリカ"}, {"n": "バグダッド", "t": "イラクのバグダッドの人口は、2022年の約760万人から2050年には約1300万人（予測）へ増える見込みで、市の人口は1週間に3850人増え、住民の年齢の中央値は21歳と若い。若い人口が多いため出生による自然増加が大きく、移住者の流入も加わって、急速な都市の成長が続く。", "b": "英", "y": "2025", "p": "地図", "k": "バグダッド", "e": "アジア"}, {"n": "ホーチミン", "t": "ベトナムのホーチミン市の人口は、2022年の約910万人から2050年には約1300万人（予測）へ増える見込みで、市の人口は1週間に3270人増え、住民の年齢の中央値は30歳である。", "b": "英", "y": "2025", "p": "地図", "k": "ホーチミン", "e": "アジア"}, {"n": "テヘラン", "t": "イランのテヘランの人口は、2022年の約940万人から2050年には約1060万人（予測）へ増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "テヘラン", "e": "アジア"}, {"n": "アーメダバード", "t": "インドのアーメダバードの人口は、2022年の約850万人から2050年には約1300万人（予測）へ増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "アーメダバード", "e": "アジア"}, {"n": "スーラト", "t": "インドのスーラトの人口は、2022年の約790万人から2050年には約1200万人（予測）へ増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "スーラト", "e": "アジア"}, {"n": "プネー", "t": "インドのプネーの人口は、2022年の約700万人から2050年には約1080万人（予測）へ増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "プネー", "e": "アジア"}, {"n": "成都", "t": "中国の成都の人口は、2022年の約950万人から2050年には約1060万人（予測）へ増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "成都", "e": "アジア"}, {"n": "南京", "t": "中国の南京の人口は、2022年の約950万人から2050年には約1040万人（予測）へ増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "南京", "e": "アジア"}, {"n": "イギリス・ロンドン", "t": "イギリスのロンドンの人口は、2022年の約960万人から2050年には約1080万人（予測）へ増え、メガシティになると見込まれている。ロンドンはイギリスの首都である。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス・ロンドン", "e": "ヨーロッパ"}, {"n": "シカゴ", "t": "アメリカのシカゴの人口は、2022年の約890万人から2050年には約1080万人（予測）へ増え、メガシティになると見込まれている。", "b": "英", "y": "2025", "p": "地図", "k": "シカゴ", "e": "北アメリカ"}, {"n": "低・中所得国の都市の成長（自然増加と移住）", "t": "急速に都市化する低所得国・新興国の都市では、年齢の中央値が低く、出産年齢の若者が多いため、子どもが増えて人口が増加する（自然増加）。農村から都市へ移住する人も多く、1週間に数千人規模で人口が増える。若い人口は工場などの労働力になる一方、急速な人口増加は資源と住宅の不足を招き、都市の無秩序な拡大（スプロール）やインフォーマルな居住地（不法占拠地区）の成長につながる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "リーズ", "t": "イングランド北部のウェスト・ヨークシャーにあるリーズの人口は、2022年に81万2000人であった。", "b": "英", "y": "2025", "p": "地図", "k": "リーズ", "e": "ヨーロッパ"}, {"n": "レスター", "t": "イングランド中部のイースト・ミッドランズにあるレスターの人口は、2022年に36万9000人であった。", "b": "英", "y": "2025", "p": "地図", "k": "レスター", "e": "ヨーロッパ"}, {"n": "バーミンガム", "t": "イギリス中部のバーミンガムには5つの大学があり、交通の要所でもある。", "b": "英", "y": "2025", "p": "地図", "k": "バーミンガム", "e": "ヨーロッパ"}, {"n": "ブリストル", "t": "イギリス南西部のブリストルには大規模な産業が多く、シリコンチップ（半導体）製造の集積はカリフォルニアに次いで世界第2とされる。", "b": "英", "y": "2025", "p": "地図", "k": "ブリストル", "e": "ヨーロッパ"}, {"n": "リバプール", "t": "リバプールはイングランド北西部の重要な都市であり、この地域の輸出入で最大の港をもつ。", "b": "英", "y": "2025", "p": "地図", "k": "リバプール", "e": "ヨーロッパ"}, {"n": "バーミンガム", "t": "バーミンガムは、ロンドンを離れる人々にとってイギリスで最も人気のある移住先であり、その結果、住宅価格が高くなっている。", "b": "英", "y": "2025", "p": "地図", "k": "バーミンガム", "e": "ヨーロッパ"}, {"n": "ブリストル", "t": "国内移住によってブリストルの人口は大きく増え、とくに教育水準の高い人々が移り住んで、熟練した労働力を生んでいる。", "b": "英", "y": "2025", "p": "地図", "k": "ブリストル", "e": "ヨーロッパ"}, {"n": "マンチェスター", "t": "多くの学生がマンチェスターに移り住んでおり、地元の人々が市の一部の地域から締め出されたと感じることがある。", "b": "英", "y": "2025", "p": "地図", "k": "マンチェスター", "e": "ヨーロッパ"}, {"n": "サクスルビー", "t": "リンカーンから約7km離れたリンカンシャー州の村サクスルビーは、鉄道駅をもち、村の面積はおよそ1.5km²（1.2〜1.8km²の範囲）である。", "b": "英", "y": "2025", "p": "地図", "k": "サクスルビー", "e": "ヨーロッパ"}, {"n": "通勤圏の集落（コミューター・セツルメント）の成長が農村・都市の境界域に与える影響", "t": "通勤圏の集落が成長すると、村の周囲に残る農地・緑地が宅地になり、農地や生息地が失われ、地域固有の農村らしい景観と個性が損なわれる。袋小路の街路をもつ住宅団地が広がり、同じような住宅が並び、自動車が増えて大気汚染や渋滞が悪化し、支線の鉄道は混雑する。舗装面の増加は排水に影響し、そのため排水用の窪地（スウェール）が設けられる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ダルエスサラーム", "t": "東アフリカの新興経済国タンザニアのダルエスサラームでは、急速な都市成長により都市部に雇用や教育・医療の機会が集まっている。", "b": "英", "y": "2025", "p": "地図", "k": "ダルエスサラーム", "e": "アフリカ"}, {"n": "ムンバイ", "t": "インドのムンバイでは、新興の中間層が都市に集まり、財やサービスの需要を高めており、ボリウッド映画産業がその例である。ムンバイの巨大なスラム地区ダラヴィでは、住民の約85%が就業しており、仕事の多くがインフォーマル部門（正式な契約や登録のない仕事）であっても、都市には働き口がある。インドの衛生施設の普及率は都市部で約50%、農村部で約30%である。", "b": "英", "y": "2025", "p": "地図", "k": "ムンバイ", "e": "アジア"}, {"n": "ラゴス", "t": "ナイジェリアのラゴスでは、都市の急成長が建設の雇用を生み、エコ・アトランティック（海岸の埋立開発）がその例である。ラゴスでは子どもの約90%が小学校に通うが、ナイジェリアの農村部では約60%である。", "b": "英", "y": "2025", "p": "地図", "k": "ラゴス", "e": "アフリカ"}, {"n": "リオデジャネイロ", "t": "ブラジルのリオデジャネイロでは、工業化が銀行や官庁など金融などの支援業務の雇用を生み、リオの所得はブラジルの平均を大きく上回る。", "b": "英", "y": "2025", "p": "地図", "k": "リオデジャネイロ", "e": "南アメリカ"}, {"n": "低・中所得国の都市成長がもたらす社会的・経済的機会", "t": "低所得国・新興国では、工業化や経済の変化が農村より都市に集中するため、都市への人口集中によって機会が生まれる。急速な成長は建設の雇用を生み、新興の中間層は財やサービスの需要を高め、工業化は金融や行政などの支援業務を求めて雇用と高い所得を生む。仕事の多くがインフォーマル部門でも働き口はあり、インフラは農村より都市で整っているため教育や衛生が改善し、医療に近づきやすいことで平均寿命も延びる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "水へのアクセス（低所得国、2020年）", "t": "2020年、低所得国で、安全な水・基本的な水の利用が、限られたもの（リミテッド）17%、改善されていないもの（アンインプルーブド）18%、水へのアクセスがまったくない人が6%であった。残りの59%が安全な水または基本的な水を利用できる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "所得階層による安全な水の普及率", "t": "2020年の安全な水の普及率には所得階層による差があり、高所得国と下位中所得国の間には40ポイントの開きがある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "社会的な開発指標の限界", "t": "開発の社会的な指標にはそれぞれ限界がある。安全な水を使える人の割合は、水供給の全体像を示さず、水くみに時間がかかったり、くんだ水が安全に保管されなかったりすることがある。死亡率は、先進国では高齢化により高まることがあるため、信頼できない指標となる。人口当たりの医師数は、国内で医師が多い地域と少ない地域があるため、生活の質を示す指標として不十分なことがある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "不均等な発展（国家間の経済格差）の原因", "t": "国家間の発展の格差には、いくつかの原因がある。内陸国は港をもたず、貿易で物を運ぶのが難しく、輸送費が高い。自然災害はインフラを壊し、産業と貿易を妨げ、復旧に資金がかかって新たな発展が遅れる。熱帯のマラリアなど気候に関連する病気や害虫は生産性を下げ、不規則な降雨は定住農業に不可欠な水供給を制限する。貿易は高所得国（ヨーロッパやアメリカなど）が主導し、世界貿易機関（WTO）の運営も含めて有利に進める。高所得国や多国籍企業は原料をできるだけ安く買い、低所得国は世界市場の変動に弱い。多くの低所得国は単一の一次産品に頼っており、例えばザンビアはGDPの約60%を銅に頼る。原料の加工は高所得国で行われ、付加価値をつけられない（例：コートジボワールのカカオと高所得国のチョコレート業者）。植民地支配の遺産、独立の過程での内戦、紛争や腐敗した政府による開発以外への支出も原因となる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリスの農村地域の年齢別人口変化（2011〜2021年）", "t": "イギリスのある農村地域では、2011年から2021年にかけて、人口の年齢構成が大きく変わった。0〜4歳が16%、10〜14歳が7%、15〜19歳が24%、20〜24歳が16%減り、とくに40〜44歳は33%、45〜49歳は29%と大きく減った。30〜34歳は5%増、35〜39歳は9%減で、55〜59歳は20%増えた。65歳以上では、65〜69歳が5%、70〜74歳が28%、75〜79歳が14%、80〜84歳が17%、85〜89歳が18%、90歳以上が26%増えた。最も増えたのは70〜74歳、最も減ったのは40〜44歳である。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリスの農村の人口減少がもたらす変化", "t": "イギリスの農村では、若い世代が機会を求めて地域を離れ、高齢者の割合が高まる。その結果、学校が閉鎖され（「本土に移った唯一の生徒のため、国内最小の学校が閉鎖」といった報道がある）、地域社会の活気や多様性が失われ、高齢化に伴う社会・保健医療の問題も生じる。人口が少ないと規模の経済が働かず、地方・国の行政がサービスを提供する費用が増え、人口の減少と多様性の低下で事業が成り立ちにくくなり、地域経済に悪影響が出る。孤立した農村では、地元の店が「生命線」となり、バスなどの公共交通の維持が課題となる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "アウター・ヘブリディーズ", "t": "スコットランド北西沖のアウター・ヘブリディーズは、ルイス島・ハリス島を含む島々で、若い世代の流出による人口減少と高齢化が進み、社会的・経済的な変化が生じている農村の例である。", "b": "英", "y": "2025", "p": "地図", "k": "アウター・ヘブリディーズ", "e": "ヨーロッパ"}, {"n": "ペルー", "t": "南アメリカの新興経済国ペルーでは、2019年4月に大統領が、国民の生活の質の向上に努め、特に必要とする人々のための事業に資金を使うと述べた。衛生施設の改善が国の前進に不可欠で、最も貧しい地域ではすでに多くの取り組みを行い、清浄な水を利用できる範囲を広げる新規事業に資金を保証するとした。経済発展は賃金と税収を増やし、その税収が衛生施設を改善して病気を減らし、人々が健康で生産的に働けるようになり、乳児・妊産婦の死亡の減少を通じて出生率の低下にもつながる。", "b": "英", "y": "2025", "p": "地図", "k": "ペルー", "e": "南アメリカ"}, {"n": "ナイジェリア", "t": "ナイジェリアでは、多国籍企業シェルが直接6万5000人、間接に25万人を雇用し、契約の91%がナイジェリア企業に発注され、国の税収を増やしてきた。より新しい数字では、直接雇用が約2700人、契約業者が約9000人で、その97%がナイジェリア人とされる。一方、ボド地域などの原油流出は紛争と反感を呼んで漁民の生計を損ない、ガス燃焼（フレアリング）は温室効果ガスと大気汚染を増やし、石油の富は武装紛争と「ニジェール・デルタ・アヴェンジャーズ」のような新たなテロ組織を生んだ。", "b": "英", "y": "2025", "p": "地図", "k": "ナイジェリア", "e": "アフリカ"}, {"n": "ボド（ニジェール・デルタ）", "t": "ナイジェリアのニジェール・デルタ地域のボドでは、石油会社による原油流出が起き、紛争と反感を呼んで漁民の生計を損なった。", "b": "英", "y": "2025", "p": "地図", "k": "ボド", "e": "アフリカ"}, {"n": "ウェルビーイングの国別スコア（2022年）", "t": "社会面と経済面の指標を合わせた2022年のウェルビーイングのスコアで、最も高い10か国のうちの9か国は、フィンランド7.82、デンマーク7.64、アイスランド7.56、スイス7.51、オランダ7.41、ルクセンブルク7.40、スウェーデン7.38、ノルウェー7.36、ニュージーランド7.20で、最も低い10か国のうちの9か国は、アフガニスタン2.40、ジンバブエ2.99、ルワンダ3.27、ボツワナ3.47、レソト3.51、シエラレオネ3.57、タンザニア3.70、マラウイ3.75、ザンビア3.76である。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "フィンランド", "t": "フィンランドは、社会面と経済面の指標を合わせたウェルビーイングのスコアが2022年に7.82で、スコアが最も高い10か国の一つである。高所得国であり、生活水準が高く、気候が温帯で自然災害が少なく、民主主義が安定
