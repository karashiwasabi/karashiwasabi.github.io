スコアが最も低い10か国の一つである。", "b": "英", "y": "2025", "p": "地図", "k": "レソト", "e": "アフリカ"}, {"n": "シエラレオネ", "t": "シエラレオネは、社会面と経済面の指標を合わせたウェルビーイングのスコアが2022年に3.57で、スコアが最も低い10か国の一つである。", "b": "英", "y": "2025", "p": "地図", "k": "シエラレオネ", "e": "アフリカ"}, {"n": "タンザニア", "t": "タンザニアは、社会面と経済面の指標を合わせたウェルビーイングのスコアが2022年に3.70で、スコアが最も低い10か国の一つである。", "b": "英", "y": "2025", "p": "地図", "k": "タンザニア", "e": "アフリカ"}, {"n": "マラウイ", "t": "マラウイは、社会面と経済面の指標を合わせたウェルビーイングのスコアが2022年に3.75で、スコアが最も低い10か国の一つである。", "b": "英", "y": "2025", "p": "地図", "k": "マラウイ", "e": "アフリカ"}, {"n": "ザンビア", "t": "ザンビアは、社会面と経済面の指標を合わせたウェルビーイングのスコアが2022年に3.76で、スコアが最も低い10か国の一つである。", "b": "英", "y": "2025", "p": "地図", "k": "ザンビア", "e": "アフリカ"}, {"n": "イギリスの有機農業と需要の変化", "t": "イギリスでは、人々が食べ物が健康に与える影響を気にして有機食品を健康によいと考えるため、有機食品の需要が高まり、それに応じて有機農業に転換する農家が増えた。一方、人々が有機食品を買えなくなると、有機食品の販売額とイギリスの有機農家の数が減る。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリスの水質管理と水質汚染", "t": "2022年1月の英国政府の報告書は、「イングランドにきれいな川は一つもない」と議員が述べたと伝えている。農業と水道会社が、未処理の下水・マイクロプラスチック・農場の廃棄物をイングランドのすべての川に流し込み、自動車のタイヤ粒子・油・ウェットティッシュも見つかり、川を利用する人々が危険にさらされている。農場からの流出による富栄養化、飲料水の汚染、パンデミック後に人気が高まった野外水泳の危険、水道会社による下水放流への罰金の増加、増えるマイクロプラスチック、暑い夏の水量と河川流量の減少による汚染の濃縮も課題である。一方、法規制は汚染を防ぐよう厳しく、水質基準は厳格で健康に害を及ぼすことはなく、意識の高まりが汚染事故を減らしているという見方もある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "パキスタン", "t": "2020年、パキスタンでは、健康的な食事を買う余裕のない世帯の割合が80%以上であった。", "b": "英", "y": "2025", "p": "地図", "k": "パキスタン", "e": "アジア"}, {"n": "モンゴル", "t": "2020年、モンゴルでは、健康的な食事を買う余裕のない世帯の割合が40〜59.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "モンゴル", "e": "アジア"}, {"n": "バングラデシュ", "t": "2020年、バングラデシュでは、健康的な食事を買う余裕のない世帯の割合が60〜79.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "バングラデシュ", "e": "アジア"}, {"n": "インド", "t": "2020年、インドでは、健康的な食事を買う余裕のない世帯の割合が60〜79.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "インド", "e": "アジア"}, {"n": "インドネシア", "t": "2020年、インドネシアでは、健康的な食事を買う余裕のない世帯の割合が60〜79.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "インドネシア", "e": "アジア"}, {"n": "ラオス", "t": "2020年、ラオスでは、健康的な食事を買う余裕のない世帯の割合が60〜79.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "ラオス", "e": "アジア"}, {"n": "ミャンマー", "t": "2020年、ミャンマーでは、健康的な食事を買う余裕のない世帯の割合が60〜79.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "ミャンマー", "e": "アジア"}, {"n": "フィリピン", "t": "2020年、フィリピンでは、健康的な食事を買う余裕のない世帯の割合が60〜79.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "フィリピン", "e": "アジア"}, {"n": "アジアの健康的な食事を買えない世帯の国別分布（2020年）", "t": "2020年、アジアの多くの国では、健康的な食事を買う余裕のない世帯が20%以上を占め、20%未満にとどまる国は限られていた。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "自然要因が食料供給に与える影響", "t": "洪水は作物を破壊し、やせた土壌は作物の生育を妨げ、少ない降水は作物の不作や家畜の死につながり食料供給が減る。気候変動による高温は砂漠化を進めて食料供給を減らし、害虫（ケニアのバッタの大群など）は収量を下げる。一方、火山灰は肥沃な土壌をつくって収量を増やす。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "季節の食材の消費と食品ロスの削減", "t": "英国には、年間を通じて同じ食品が求められるため、数千マイル離れた国から運ばれたり、別の国で加工されたりして届く食品が多い。季節の食材を食べるようにすれば、食料を地元で栽培でき、フード・マイルズが減り、暖房付き温室の必要も減る。農産物直売所は地元の新鮮な産物の購入を促し、地元産は保存料や包装も少なくて済む。食品ロスの削減には、必要な分だけ買う、生産・輸送・加工段階でのロスを減らす、保存方法を改善する、一部の食品の「賞味期限」表示を重視する、余った食品を交換・寄付するコミュニティ・フードハブ、「規格外」野菜の店の増加などがある。これらは輸送で出る二酸化炭素と温室の暖房に使う化石燃料を減らし、地元の農家と農村経済を支え、雇用を増やし、地域の絆を深め、廃棄物の処理を減らす。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ポルトガル", "t": "2019年、ポルトガルの水ストレスは「高い」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "ポルトガル", "e": "ヨーロッパ"}, {"n": "アイルランド", "t": "2019年、アイルランドの水ストレスは「低い」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "アイルランド", "e": "ヨーロッパ"}, {"n": "ブルガリア", "t": "2019年、ブルガリアの水ストレスは「中〜高」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "ブルガリア", "e": "ヨーロッパ"}, {"n": "デンマーク", "t": "2019年、デンマークの水ストレスは「中〜高」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "デンマーク", "e": "ヨーロッパ"}, {"n": "エストニア", "t": "2019年、エストニアの水ストレスは「中〜高」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "エストニア", "e": "ヨーロッパ"}, {"n": "フランス", "t": "2019年、フランスの水ストレスは「中〜高」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "フランス", "e": "ヨーロッパ"}, {"n": "ドイツ", "t": "2019年、ドイツの水ストレスは「中〜高」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "ドイツ", "e": "ヨーロッパ"}, {"n": "北マケドニア", "t": "2019年、北マケドニアの水ストレスは「中〜高」に分類された。", "b": "英", "y": "2025", "p": "地図", "k": "北マケドニア", "e": "ヨーロッパ"}, {"n": "ヨーロッパの水ストレスの国別分布（2019年）", "t": "2019年、ヨーロッパでは、水ストレスが「低〜中」にとどまる国は少数であった。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "自然要因が水の利用可能性に与える影響", "t": "降水の不足は水不足を招き、降水が多すぎると水源を汚染することがある。気候変動により一部の地域では雪や氷が融ける。高温は蒸発を増やし、水が大気中に失われて供給を制限する。透水性のある岩石は水を浸透させ、帯水層に水を貯える。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "中水利用と節水", "t": "家庭排水の約80%を占める中水（入浴後の水や雨水など）を庭の散水や商業施設のトイレ洗浄、砂層やヨシ原を通したろ過処理などに再利用し、あわせて水道メーターの設置や節水型トイレ・家電の導入、漏水配管の修理といった節水策を行うことで、河川や地下水からの取水量および浄水処理にかかるコストとエネルギー消費を抑え、将来世代の需要を損なわずに水供給を持続させることができる。点滴灌漑は蒸発による損失を減らし、ろ過された中水は池や湿地を生んで生物多様性を高める。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ブルガリア", "t": "2021年、ブルガリアでは、暖房費を払えない世帯の割合が20%以上であった。", "b": "英", "y": "2025", "p": "地図", "k": "ブルガリア", "e": "ヨーロッパ"}, {"n": "ポーランド", "t": "2021年、ポーランドでは、暖房費を払えない世帯の割合が2〜4.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "ポーランド", "e": "ヨーロッパ"}, {"n": "フランス", "t": "2021年、フランスでは、暖房費を払えない世帯の割合が5〜9.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "フランス", "e": "ヨーロッパ"}, {"n": "ハンガリー", "t": "2021年、ハンガリーでは、暖房費を払えない世帯の割合が5〜9.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "ハンガリー", "e": "ヨーロッパ"}, {"n": "イタリア", "t": "2021年、イタリアでは、暖房費を払えない世帯の割合が5〜9.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "イタリア", "e": "ヨーロッパ"}, {"n": "セルビア", "t": "2021年、セルビアでは、暖房費を払えない世帯の割合が5〜9.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "セルビア", "e": "ヨーロッパ"}, {"n": "スロバキア", "t": "2021年、スロバキア共和国では、暖房費を払えない世帯の割合が5〜9.9%であった。", "b": "英", "y": "2025", "p": "地図", "k": "スロバキア", "e": "ヨーロッパ"}, {"n": "ヨーロッパの暖房費を払えない世帯の国別分布（2021年）", "t": "2021年、ヨーロッパでは、暖房費を払えない世帯の割合が10〜19.9%に達する国は少数であった。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "自然要因がエネルギー供給に与える影響", "t": "日照の多い国は太陽光発電を容易に行える。化石燃料に乏しい国は燃料供給が限られる。高地では風が十分に吹くため風力タービンで発電できる。地熱発電は、アイスランドのようにテクトニックな活動のある地域で可能で、豊富な電力を得られる。水力発電は、急で流れの速い川がダムを築きやすい地域で最も適する。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "アイスランド", "t": "アイスランドは、プレートの活動が活発なテクトニックな地域にあり、地熱エネルギーを生産できるため、豊富なエネルギー供給が得られる。", "b": "英", "y": "2025", "p": "地図", "k": "アイスランド", "e": "ヨーロッパ"}, {"n": "家庭・職場と交通の省エネルギー", "t": "家庭や職場では、壁・屋根裏の断熱や二重窓で熱の出入りを抑え、冷暖房の必要を減らし、サーモスタットやスマートメーター、省エネ家電、待機電力の削減、窓を大きくした自然採光、LED照明や人感センサーで電力を節約する。交通では、燃費のよい車、軽量で空力に優れた炭素繊維の車、電気自動車やハイブリッド車の普及、環境負荷の低い車を優遇する自動車税、水素バスや電気トラムなど公共交通への投資、パーク・アンド・ライド、都市への流入に課金するクリーンエア・ゾーンがある。これらにより、化石燃料の消費ペースが遅くなり、発電所からの温室効果ガスが減り、石油採掘による環境破壊や輸送中の漏出が減り、大気汚染が減って健康が改善し、渋滞の緩和による経済的利益や、徒歩・自転車の健康効果も生まれる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリス", "t": "イギリスの最終エネルギー消費量の合計は、1990年から2000〜2001年ごろにかけて増え、2000年から2005年ごろは比較的安定し、2005年ごろから2020年にかけては増減をくり返しながら全体として減少し、2020〜2021年に最低水準となった。2020年から2021年にかけては増加した。1990年から2021年の全期間では減少している。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "交通部門のエネルギー消費量が将来減る理由", "t": "将来、交通部門のエネルギー消費が減る理由として、電気自動車やハイブリッド車の増加（化石燃料の需要を減らす）、車の燃費の向上、車の費用の上昇、公共交通の利用の増加、自転車の利用と自転車道の整備、徒歩通勤の奨励、在宅勤務、燃料費の上昇、道路課金や自動車税、私有車を制限する政府の政策、二酸化炭素排出量（カーボンフットプリント）への意識の高まりや海外旅行の減少、カーシェアリングの普及などが挙げられる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリス", "t": "イギリスのエネルギー輸出量が最も大きかったのは1998年である。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "エネルギー安全保障", "t": "エネルギー安全保障とは、エネルギーが確実に（信頼性）、手ごろな価格で（経済性）、持続的に供給されることである。主な要素は、入手可能性（availability）、アクセスしやすさ（accessibility）、手ごろな価格（affordability）、受け入れられること（acceptability）の四つである。エネルギーは、家庭・産業・交通・サービスの各部門で使われ、雇用と産業による所得、通勤と余暇の交通、観光・娯楽、エネルギー・水・通信などのインフラ、医療や教育などの社会サービスを支える。エネルギーが不安定になったり価格が上がったりすると、食料供給や経済発展、生活水準に大きな影響が出る。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリス", "t": "イギリスの電力の電源構成（2020年）は、ガスが40%、再生可能エネルギーが39%、原子力が約15%で、石油と石炭を合わせて約6%を占める。石油・ガス・石炭の化石燃料は合計で46%である。", "b": "英", "y": "2025", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "ヨーロッパの風力・太陽光発電の割合が5〜9.9%の国（2021年）", "t": "2021年、ノルウェー、フランス、スロベニア、セルビア、ブルガリア、ボスニア・ヘルツェゴビナ、スロバキア、チェコ、ラトビアでは、風力と太陽光が電力に占める割合は5〜9.9%であった。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "再生可能エネルギーが自然環境に与える影響", "t": "再生可能エネルギーの発電は、種類ごとに自然環境に影響を与える。バイオマスは燃焼で大気汚染を起こす。水力発電は地域を水没させたり河川の仕組みを変えたりする。風力タービンは場所を取り、騒音や景観の問題がある。地熱は大規模な建物が場所を取り、周囲に目立つ。波力・潮力は海中・海底の構造物が海洋環境に影響する。太陽光パネルは土地を取り、景観を損なう。影響は生息地の喪失や変化、鳥（風力タービン）への影響、騒音、景観・大気の汚染、においなどで、再生可能エネルギーの製造・廃棄にも環境負荷がある。一方、気候変動の緩和という好影響もある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "モアカム湾", "t": "イングランド北西部のモアカム湾とダドン河口の「潮力ゲートウェイ」計画は、エネルギー発電と交通インフラ（輸送路）を兼ねる多目的計画である。移動時間が短縮されて渋滞が緩和され、地元の事業や地域経済が活性化し、レクリエーションや観光の利用が増え、新産業の発展や漁業の機会にもつながる可能性がある。", "b": "英", "y": "2025", "p": "地図", "k": "モアカム湾", "e": "ヨーロッパ"}, {"n": "バロー・イン・ファーネス", "t": "モアカム湾・ダドン河口の潮力ゲートウェイ計画は、費用が80億ポンド超と見込まれる大規模な事業で、再生可能エネルギーによってイギリスのエネルギー安全保障を高め、高度な技術の訓練や雇用を生み、貧しい地域であるバロー・イン・ファーネス周辺の再生に役立つ可能性がある。一方、人々が他地域へ移れば負の乗数効果、新規事業が増えれば正の乗数効果がある。夏の渋滞を緩和し、海面上昇から守る効果もあるが、観光客が増えて渋滞や住民への影響を生むおそれもある。環境面では、貴重な塩性湿地と干潟があり、自然保護区が多く、堰の背後で潮の流れが変わり、堆積物の動きが変化して海洋生物と渡り鳥に影響しうる。「国全体の利益だが地元の負担」という見方もあり、工事期間の混乱や長い工期も課題である。", "b": "英", "y": "2025", "p": "地図", "k": "バロー・イン・ファーネス", "e": "ヨーロッパ"}, {"n": "河川の幅と最大水深の調査", "t": "河川の野外調査で、川に沿った6地点で川幅と最大水深を測定した例では、川幅の平均は280cm、最大水深の範囲（最大値と最小値の差）は22cmであった。川幅と最大水深の関係は、散布図（スキャッターグラフ）で示すのが適している。川幅と水深は一般に正の関係があり、川幅が広い地点ほど水深も大きくなる傾向があり、側方・下方の侵食が起こっていることを示す。ただし傾向から外れる地点もあり、データ数が限られると結論を出しにくい。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "河川調査でより有用なデータを得る方法", "t": "河川調査でより有用なデータを得るには、測定地点を増やす（間隔を小さくまたは大きくする）、系統抽出など別の標本抽出法を使う、川の調査区間を長くする、時期・季節・日を変える、各地点で繰り返し測る、異なる天候で測る、より正確な機器を使う、写真や野外スケッチなど別の方法を加える、堆積物の採取や流速・流量の測定をする、蛇行部だけでなくまっすぐな区間でもデータを取るなどの方法がある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "国立公園内の小さな町への訪問者調査", "t": "国立公園内の小さな町を訪れる訪問者には、交通手段（車・バス・オートバイ・自転車）と出発地を尋ねる調査が行われる。ある調査では、20人の訪問者のうち、車が14人、バスが3人、オートバイが2人、自転車が1人であった。出発地は、人1人を1本の線で表す「流線図（デザイア・ライン・マップ）」に、町から見た方角と距離で示す。調査を補う質問として、所要時間、費用、同乗人数、駐車、滞在時間、訪問頻度、訪問の目的などが挙げられる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "ショッピングセンターの質の調査の信頼性", "t": "ショッピングセンターの質を、店の質・店の種類・サービス・座席や景観・駐車場などの項目について、少人数の回答者に3段階（1＝悪い、2＝良い、3＝優れている）で評価してもらう調査では、標本数が小さいこと、個人の意見に基づく主観的なものであること、回答者が地元の人とは限らないこと、評価尺度が狭く標準値が2になりやすいこと、基準の範囲が限られることから、信頼できる結論は出しにくい。ある1人の意見に結果が左右されることもある。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "野外調査における二次データの有用性", "t": "野外調査では、他者が収集・検証した二次データを使うことで、調査を補う追加のデータが得られ、結果や結論が改善され、データの偏りが減り、収集時期が異なるデータにより時間変化を調べられる。調査地の位置の背景を示す情報や、比較にも役立つ。たとえば、環境庁（Environment Agency）の河川流量データが河川調査で役立つ。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "標本抽出（ランダム・層化・系統抽出）", "t": "野外調査で一次データを集める標本抽出（サンプリング）には、ランダム抽出、層化抽出、系統抽出がある。ランダム抽出は規則性なく標本を取り、すべての小石や建物が等しい確率で選ばれ、偏りが減る。層化抽出は各区分から同数の標本を取り、全範囲を取り込む（小石の大きさ、性別、年齢層など）。系統抽出は、10分ごと、10cmごと、10人目ごとのように決まった一定間隔で標本を取り、データの正確さと比較しやすさが高まる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "人文地理の野外調査のデータ収集方法", "t": "人文地理の野外調査で用いる主なデータ収集方法には、環境の質の調査、土地利用の地図化、交通量・歩行者の調査、アンケート、ショッピング調査がある。方法を選ぶ根拠は、調査の目的や問いに関係するデータを集められること、正確さ・標本の大きさ・対照群・信頼性が確保されること、どの地点でも同じ方法で比較できること、多くの情報を短時間で集められること、ごみや騒音など様々な課題を扱えること、器具がほとんど不要なこと、結果を集めて精度を高められること、観察による定性的な判断を比較できること、結論を出す前に結果を議論できることなどである。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "野外調査の有効性の評価と改善", "t": "野外調査の有効性は、調査の目的・仮説・問いの質とその達成度、調査地の選び方や位置の妥当性とリスク評価、データ収集方法の実施のしやすさと信頼性、データの正確さと結論の妥当性、データが結論を支える程度、標本抽出やデータ表現方法の有用性、収集されなかった有用なデータの有無などから評価される。改善策には、仮説・目的・問い、調査地、リスク評価、データ収集方法と機器、データ表現方法、結果と結論の見直しなどがあり、改善によって調査が安全で実施しやすくなり、方法・結果・結論の質が高まる。", "b": "英", "y": "2025", "p": "用語・概念", "k": "", "e": ""}, {"n": "人口分布に影響を与える要因", "t": "人間の人口分布を左右する要因は大きく4つに分けられる。気候・地形・植生・水域・自然災害などの自然的要因、宗教的聖地や歴史的な移住・集落形態などの文化的・社会的要因、雇用機会・産業発展・交易路などの経済的要因、そして政治的安定・政府の政策・紛争などの政治的要因が作用して居住の偏りを生み出している。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "人口減少をもたらす人口学的要因", "t": "一国の人口減少を引き起こす人口学的要因には、出生率や合計特殊出生率の低下（人口置換水準である2.1を下回る状態などによる自然増加率の低下）、死亡率の上昇、国外への人口流出（純移動のマイナス）、および高齢人口の割合が高く出産可能年齢人口の割合が低い人口高齢化の進行がある。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "人口密度が環境に与える影響", "t": "人口密度は地域の環境収容力（キャリング・キャパシティ）に関わる。高い人口密度は水・鉱物・化石燃料・森林などの資源需要やエコロジカル・フットプリントを増大させ、環境汚染・森林減少・生息地や生物多様性の喪失・都市のヒートアイランド現象・廃棄物処理問題などの環境悪化を招きやすい一方、空間を効率的に利用することで周辺地域への人間活動の影響を抑える側面も持つ。反対に低い人口密度は資源需要を抑え、環境悪化を限定的にとどめやすい。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "人口移動のプッシュ要因", "t": "人口移動におけるプッシュ要因とは、現在の居住地から人々を押し出す要因であり、低賃金、雇用機会の不足、生活の質や公共サービスの低さ、自然災害、政治的不安定、武力紛争などが該当する。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "人口移動のプル要因", "t": "人口移動におけるプル要因とは、移動先の地域へ人々を引き寄せる要因であり、豊富な雇用機会や離れて暮らす家族との再統合（家族呼び寄せ）などが該当する。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "出生促進政策（プロナタリスト政策）", "t": "出生促進政策（プロナタリスト政策）は、経済的インセンティブや育児支援などを通じて人々により多くの子どもを持つよう奨励し、国の人口規模を増加させることを図る政策である。ただし、社会・経済状況などの外部要因が上回る場合や広く浸透しない場合には、人口規模に十分な影響を与えないこともある。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "出生抑制政策（アンチナタリスト政策）", "t": "出生抑制政策（アンチナタリスト政策）は、法的な制限や不利益措置、家族計画の普及などを通じて子どもの数を抑え、国の人口増加を抑制または人口規模を減少させる政策である。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "移民政策と人口規模", "t": "国の人口規模は政府の移民政策によっても左右される。移民の受け入れを促す開放的な移民政策は国外からの流入者数を増やして人口規模を拡大させる一方、入国者数を管理・制限する厳格な移民政策は人口規模の増加を抑える働きを持つ。ただし、非人口学的な目的を主眼とする場合や執行力が不足する場合には人口規模への影響が限定的となることもある。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "技術変化と国家主権", "t": "インターネットやスマートフォンなどの情報通信技術の発達は、地方への権限移譲（デボリューション）や超国家機関への意思決定権の移行（超国家主義）を促したり、分離独立運動や政治集団による組織化・情報発信・支持動員を容易にしたりすることで国家主権への挑戦となることがある。また暗号化技術・ネットワークセキュリティ・ロボット工学などの進歩は政府が国境内の活動を監視・規制・統制する能力を制限し、交通・産業・軍事技術の発達も対立勢力に利用されて国家の安定や主権を揺るがす場合がある。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "遠心力（国家統合を弱める力）", "t": "国内の人口構成の変化などは、国民の連帯を弱めて国内の分断を深める「遠心力」として働くことがある。遠心力が強まると、地域間の不均等発展や経済格差の拡大、紛争・イデオロギー対立・統治上の対立を通じた政治的不安定化や政府の正統性への挑戦が生じ、国家統合の弱体化や破綻国家（機能不全国家）に至る場合がある。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "チュニジア", "t": "2021年に、北アフリカのチュニジアはパラグアイから1,500万ドルの大豆を輸入しており、自国の大豆総輸入の5%をパラグアイ産が占めている。", "b": "米", "y": "2026", "p": "地図", "k": "チュニジア", "e": "アフリカ"}, {"n": "アルゼンチン", "t": "2021年に、南アメリカのアルゼンチンは隣国パラグアイから23.4億ドルの大豆を輸入しており、自国の大豆総輸入の95%という高い割合をパラグアイからの輸入に依存している。", "b": "米", "y": "2026", "p": "地図", "k": "アルゼンチン", "e": "南アメリカ"}, {"n": "ブラジル", "t": "2021年に、南アメリカのブラジルは隣国パラグアイから3億6,100万ドルの大豆を輸入しており、自国の大豆総輸入の92%という高い割合をパラグアイからの輸入に依存している。", "b": "米", "y": "2026", "p": "地図", "k": "ブラジル", "e": "南アメリカ"}, {"n": "農業慣行と経済的要因", "t": "農業の経営形態や栽培慣行は多様な経済的要因に左右される。土地・労働力・輸送のコストは農家が集約的な手法をとるか粗放的な手法をとるかを決定づけ、種子・肥料・農薬・機械技術などの投入財コストは単位面積当たり収量や機械化・化学物質使用の水準に影響する。また消費者需要や国際市場価格の変動は栽培作物の種類や生産量の調整を促し、政府の補助金・融資・関税・輸出規制などの政策は特定作物の収益性や新技術への投資・生産拡大・専門化を左右する。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "一次産品依存（コモディティ依存）", "t": "一次産品依存（コモディティ依存）とは、ある国が国際貿易および輸出において、農産物・鉱物資源・化石燃料といった単一またはごく少数の一次産品に過度に依存し、輸出構造が少数の品目に集中している状態を指す。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "パラグアイ", "t": "パラグアイは2021年時点で世界第3位の原料大豆輸出国として世界の大豆輸出の4%を担い、比較優位を活かしてアルゼンチン（23.4億ドル、同国大豆輸入の95%）、ロシア（4億400万ドル、同41%）、ブラジル（3億6,100万ドル、同92%）、ペルー（3,600万ドル、同24%）、チュニジア（1,500万ドル、同5%）など南アメリカ・ヨーロッパ・北アフリカの複数地域へ上位5か国だけで計約31.6億ドルの大豆を輸出し、多額の輸出収入を得ている。大豆は人間の食用に加え、家畜飼料の主原料やプラスチック・インク・バイオディーゼルなどの非食品工業製品にも加工されるため、グローバル・サプライチェーンを通じて生産国パラグアイと輸入国の産業・消費者とが緊密に結びつき、世界経済の相互依存を形成している。", "b": "米", "y": "2026", "p": "地図", "k": "パラグアイ", "e": "南アメリカ"}, {"n": "大規模商業的農業の環境影響", "t": "大規模な商業的農業は、農地拡大に伴う森林伐採や湿地の排水、機械化耕起、大規模灌漑、単一栽培（モノカルチャー）への置き換えなどを通じて、景観や土地被覆の改変、水質・土壌汚染、砂漠化、土壌の塩類化、資源の枯渇、生息地や生物多様性の喪失を引き起こす場合がある。一方で、単位面積当たりの高い収量によって土地を効率的に利用し農地拡大圧力を抑える側面や、点滴灌漑・GPS誘導機械・精密農業などの技術革新によって水・肥料・農薬の投入を最適化し、農場周辺や下流・風下地域の生態系への環境負荷を抑制できる側面もある。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "持続可能な開発政策の目的", "t": "各国政府が持続可能な開発政策を実施する主な理由には、天然資源の枯渇や環境汚染によって生じる諸問題への対処、将来世代の利用を見据えた資源管理による長期的な経済の持続可能性の促進、環境への悪影響を管理しながら継続的な経済発展を支えること、および国連の持続可能な開発目標（SDGs）などの国際協定や国際的イニシアティブと国内政策を整合させることがある。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "カナダ・ケベック州", "t": "フランス語と英語を公用語とするカナダで、ケベック州はフランス語・英語のバイリンガル人口が約390万人と、州・準州のなかでも特に多い。", "b": "米", "y": "2026", "p": "地図", "k": "カナダ・ケベック州", "e": "北アメリカ"}, {"n": "等質地域（形式的地域）", "t": "等質地域（形式的地域）とは、明確な政治的境界や共通の特性、共有された活動パターンによって画定される地域区分であり、カナダのオンタリオ州とケベック州のように州境で明確に分けられた行政領域などがこれにあたる。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "機能地域（結節地域）", "t": "機能地域（結節地域）とは、中心となる核（ノード）の周囲に経済的・社会的な結びつきや相互作用によって組織される地域区分であり、モントリオールやオタワの中心都市を核として広がる大都市圏などがこれにあたる。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "漸移的・重複的境界を持つ地域", "t": "地理的な地域境界には明確な線では区切れない漸移的・重複的な境界を持つものがあり、カナダのオンタリオ州・ケベック州の州境周辺や大都市圏内のように、英語コミュニティとフランス語コミュニティの生活圏・学校網が重なり合って共存する空間がこれにあたる。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "カナダ", "t": "カナダでは各州・準州で少数派となる側の公用語（ケベック州における英語、オンタリオ州におけるフランス語など）で教育を行うマイノリティ言語学校が設置されている。その空間分布はバイリンガル話者数と対応しており、バイリンガル人口が約390万人のケベック州南部や、100万〜200万人規模のオンタリオ州南部・東部、およびニューブランズウィック州などに高密度に集中して分布する。一方、バイリンガル人口が1万〜10万人規模のサスカチュワン州、ノバスコシア州、ニューファンドランド・ラブラドール州では散在的で数が少なく、プリンスエドワードアイランド州に複数の学校が立地しているのを除き、北部のユーコン準州・ノースウエスト準州・ヌナブト準州には立地していない。", "b": "米", "y": "2026", "p": "地図", "k": "カナダ", "e": "北アメリカ"}, {"n": "文化的景観の構成要素", "t": "文化的景観には、看板などの言語表記以外にも人間集団の文化を映し出す多様な特徴が刻まれている。具体的には、モスク・教会・寺院・シナゴーグ・神社・墓地などの宗教施設や宗教的意味を持つ山・河川などの聖地、時代ごとに居住した文化集団の痕跡が重なる居住の累積（建築様式や地名の重層性）、衣服・芸術・音楽・建築・食文化や博物館・劇場・図書館・祭礼行事などの文化表現、農業・工業・都市開発などの土地利用形態や市場・店舗などの経済活動、さらに道路・鉄道・港湾・空港などの交通網や公園・広場・記念碑・壁画などの公共空間やパブリックアートが挙げられる。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "歴史的過程と言語パターンの変化", "t": "世界の言語分布や使用パターンは歴史的な諸過程によって大きく変化してきた。植民地主義は宗主国の言語を新たな地域へ拡散させるとともに、異なる言語の接触によるクレオール化や交易・行政のための共通語（リンガ・フランカ）の発達を促した。また情報通信などの技術変化はメディアやインターネットを通じて優勢な言語の拡散を加速させ、国際的な人口移動（移民）は受け入れ地域の言語的多様性を高めて多言語社会を形成し、グローバル化は国際ビジネスや国際コミュニケーションにおける英語などのグローバル言語の広範な普及をもたらしている。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "都市とグローバル化", "t": "都市は多様な経路を通じてグローバル化のプロセスに関与し、世界の経済・政治・文化に影響を与えている。具体的には、貿易・交通・情報通信のグローバルなネットワークや都市間連結性を構築すること、外国直接投資や多国籍企業を誘致して世界経済システムに組み込まれること、メディア・娯楽・食文化・消費文化などの世界的な文化財や文化要素を創出・発信すること、さらに国際サミット・国際祭典・国際スポーツ大会などの世界的行事を開催して国際的な知名度と結びつきを高めることなどが挙げられる。", "b": "米", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "カナダ・モントリオール", "t": "カナダ有数の大都市であるケベック州のモントリオール都市圏では、州内の多数派言語であるフランス語で授業を行う学校と、州内では少数派公用語にあたる英語で授業を行う学校（マイノリティ言語学校）の双方が都市中心部から郊外にかけて高密度に重なり合って分布しており、複数の言語・文化コミュニティが教育インフラを維持しながら同じ大都市圏内で共存する多文化主義の姿が表れている。", "b": "米", "y": "2026", "p": "地図", "k": "カナダ・モントリオール", "e": "北アメリカ"}, {"n": "カナダ・オタワ", "t": "オンタリオ州とケベック州の州境にまたがって広がるカナダのオタワ都市圏では、英語で授業を行う学校とフランス語で授業を行う学校の双方が州境の両側および都市圏中心部に数多く混在して立地しており、英語圏とフランス語圏の住民コミュニティが互いの言語環境を保ちつつ空間を共有して共存する多文化主義の特徴が、都市インフラの配置に表れている。", "b": "米", "y": "2026", "p": "地図", "k": "カナダ・オタワ", "e": "北アメリカ"}, {"n": "ノルウェー・ニーオルスン（スバールバル諸島）", "t": "ノルウェーのスバールバル諸島にあるニーオルスンは、北緯78.9度、東経11.9度の高緯度に位置し、2022年に台湾が恒久的な極地研究拠点を設立して世界各国とともに極地の温暖化と環境変遷の研究を進めている。この海域は暖流である北大西洋海流の影響を受けるため海水が結氷しにくく、高緯度の北極圏にありながら冬季の気温が温暖に保たれている。", "b": "台", "y": "2026", "p": "地図", "k": "ノルウェー・ニーオルスン", "e": "ヨーロッパ"}, {"n": "電子フェンス（ジオフェンシング）", "t": "ドローンが空港などの飛行禁止区域に誤って進入して民間航空機の安全を脅かす事例を防ぐため、政府は飛行禁止区域の範囲データをドローンの情報システムに保存し、電子フェンス（ジオフェンシング）を形成している。ドローンは機上のセンサーで現在位置を常時検出し、位置座標と飛行禁止区域の範囲データをオーバーレイ（重ね合わせ）分析で判定することで、電子フェンスの境界に達した際にシステムが自動的に前進飛行を制限する。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "地理メディア", "t": "地理メディアとは、空間情報とインターネット上の情報伝達を組み合わせて地理的な情報を共有・拡散する仕組みをいう。たとえば災害発生時に、被災者が支援ニーズを入力できるウェブサイトを構築し、救援が必要な地点を電子地図上に表示してURLの共有・拡散を通じて広くボランティアを募ることで、人力や支援資源を効果的に配分できる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "世界の中度・重度の食料不安", "t": "国連食糧農業機関（FAO）は、「世界のすべての人が1年を通じて安全で栄養のある十分な食料を得られる」という目標に向けた進捗を追跡するため、世界および各地域の食料不安状況を調査している。2019〜2024年の調査において、世界全体で中度または重度の食料不安に陥った人口の比率は、2019年の約25%（うち重度が約9%）から2020〜2024年には約28〜29%（うち重度が約10〜11%）で推移している。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "アフリカ", "t": "国連食糧農業機関（FAO）の2019〜2024年の調査によると、アフリカにおいて中度または重度の食料不安に陥った人口の比率は、2019年の約51%（うち重度が約19%）から年々上昇し、2024年には約59%（うち重度が約22%）に達しており、人口の半数以上が食料不安に直面している。", "b": "台", "y": "2026", "p": "広域・地域", "k": "アフリカ", "e": "アフリカ"}, {"n": "アジア", "t": "国連食糧農業機関（FAO）の2019〜2024年の調査によると、アジアにおいて中度または重度の食料不安に陥った人口の比率は、2019年の約21%から2020年に約26%へ上昇した後、2024年には約23%（うち重度が約8〜10%）で推移している。", "b": "台", "y": "2026", "p": "広域・地域", "k": "アジア", "e": "アジア"}, {"n": "ラテンアメリカ", "t": "国連食糧農業機関（FAO）の2019〜2024年の調査によると、ラテンアメリカにおいて中度または重度の食料不安に陥った人口の比率は、2019年の約28%から2020〜2021年に約33〜34%（うち重度が約11%）へ上昇した後、2024年には約25%（うち重度が約8%）へと低下している。", "b": "台", "y": "2026", "p": "広域・地域", "k": "ラテンアメリカ", "e": "南アメリカ"}, {"n": "北アメリカ・ヨーロッパの食料不安人口比率", "t": "国連食糧農業機関（FAO）の2019〜2024年の調査によると、北アメリカおよびヨーロッパにおいて中度または重度の食料不安に陥った人口の比率は、期間を通じて約7〜9%（うち重度は約1〜2%）の低い水準で推移している。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "デジタル植民地主義と世界システム", "t": "人工知能（AI）企業が画像認識などの基盤モデルを開発する際には、大量のラベル付け（アノテーション）データを用いた訓練が必要となる。データへのラベル付け作業は多大な時間と人手を要する労働集約型業務であり、アメリカ合衆国のAI企業がこの作業をベネズエラ、マダガスカル、インド、フィリピンなどの企業の労働力へ外注する構造は「デジタル植民地主義」とも呼ばれ、中核と周辺・半周辺の国際分業を捉える世界システム論の概念で説明される。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "中国", "t": "急速な都市化が進む中国では、一部の大都市が農村の農業人口による都市への戸籍移転を厳しく制限している一方、都市戸籍を持たない農村出身者の都市流入が続いている。このため都市化率の統計には乖離が生じており、2016年から2023年にかけて、実際に都市に居住する都市常住人口の比率は約57%から約66%へ上昇した一方、都市戸籍人口の比率は約41%から約48%への上昇にとどまっている。", "b": "台", "y": "2026", "p": "地図", "k": "中国", "e": "アジア"}, {"n": "旧植民地における単一栽培（モノカルチャー）と土地劣化", "t": "アフリカの旧植民地諸国の中には、独立後も植民地時代の農業経済構造を引き継ぎ、花卉やコーヒーなどの輸出向け商品作物の生産を中心としている国がある。その歴史的展開は、まず列強の侵入によって植民地支配が始まり、次に特定商品作物への単一化（モノカルチャー）が進められ、それに伴う過度な土地利用が土壌・土地の劣化を招き、結果として環境災害への脆弱性や災害リスクが増大したという因果関係で捉えられる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "人口ピラミッドと出生抑制政策", "t": "2025年時点で0〜4歳人口が男女とも総人口の約7.5%を占め、高年齢層になるほど比率が一貫して縮小する底辺の広い富士山型（ピラミッド型）の人口構成を持つ国では、若年人口の割合がきわめて高く急速な人口増加が続くため、人口政策としては家族計画や産児制限（出生抑制策）の推進が課題となる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "日本近海", "t": "地球温暖化の進行に伴う海水温の上昇などにより海洋環境が変化しており、日本近海では温帯性の魚種の生息域が北上したことで漁獲される魚種が変化し、日本の寿司ネタの食材構成が大きく入れ替わる現象が生じている。", "b": "台", "y": "2026", "p": "広域・地域", "k": "日本近海", "e": "日本"}, {"n": "市民科学（シチズン・サイエンス）", "t": "市民科学（シチズン・サイエンス）とは、一般の人々が観察・記録を通じて科学研究や政策形成に参加・貢献する取り組みをいう。たとえば春の訪れの指標とされるライラックの開花日を、多数の一般市民が各地で長期間にわたり観察・記録して投稿し、行政や研究機関がそのデータを用いて各地の春の到来時期のシミュレーションや時空間変化の分析を行い、観光政策などに役立てている。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "自発的地理情報（ボランタリー地理情報、VGI）", "t": "自発的地理情報（ボランタリー地理情報、VGI）とは、一般市民が自発的に提供・発信する位置付き情報、またはそれを活用する仕組みをいう。たとえば台湾政府は2020年に外来種エジプトトキの駆除計画を開始し、一般市民がインターネット上のプラットフォームで共有した目撃地点・日時・個体数などの情報をもとに現地で駆除作業を行った。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "台湾", "t": "エジプトトキはくちばしが長く鎌のように湾曲した強力な外来侵入種の鳥類であり、台湾で大量に繁殖して地域の環境収容力を超え、食性の似た在来のサギ科鳥類の生息空間を圧迫した。2020年に台湾政府が駆除計画を開始した結果、エジプトトキの個体数は時間とともに減少して環境収容力を下回る水準へと抑えられ、台湾における外来種駆除の成功事例の一つとなった。", "b": "台", "y": "2026", "p": "地図", "k": "台湾", "e": "アジア"}, {"n": "クラウドキッチンと商閾（最小要求範囲）", "t": "店舗での対面接客を行う伝統的な飲食業は人通りの多い目立つ場所に立地するため高い賃料コストを抱えるのに対し、デジタルプラットフォームで注文を受けて配送に特化するクラウドキッチン（ゴーストキッチン）は、オフィス街・学校周辺・住宅密集地などの高需要エリアへ車で20分以内に配達できる範囲にあればよく、賃料の安い路地裏や通りに面さない空間に立地できる。固定費を抑えることで、店舗経営の維持に必要な最小限の需要規模（商閾）を縮小できる点に立地上の特徴がある。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "情報革命による飲食業の空間分布の変化", "t": "デジタルプラットフォームを通じたオンライン注文と配送網に依拠するクラウドキッチンの普及は、飲食業の立地を人流の多い表通りから賃料の低い路地裏や非臨街空間へと広げ、都市内の飲食業の空間分布を変化させた。この変化は情報通信技術の普及が産業立地や社会構造を変容させる「情報革命」の現れとして説明される。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ネットワーク分析（路網分析）", "t": "クラウドキッチンから車で20分以内に料理を配達できる到達圏を把握するには、単なる直線距離ではなく実際の道路網の接続関係や走行時間に基づいて到達可能な範囲を算出する、地理情報システム（GIS）のネットワーク分析（路網分析）が用いられる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "西アフリカ", "t": "西アフリカは世界のカカオ原料の約70%を供給する最大のカカオ栽培地域であり、現地で初期加工されたカカオ原料はヨーロッパなどへ輸送されて精製・チョコレート製品化され、世界市場へ販売されている。このように栽培・初期加工・精製が異なる国・地域に分かれて行われる背景には、海上輸送などの交通・運輸の利便性が高まり、国際的な産業の垂直分業が容易になったことがある。", "b": "台", "y": "2026", "p": "広域・地域", "k": "西アフリカ", "e": "アフリカ"}, {"n": "スイス（アルプス山脈）", "t": "スイスの著名なチョコレートブランドは、氷河が山頂の周囲の複数の斜面を削り取って形成した鋭くとがった山頂地形である角峰（ホルン）の景観を長年商標の図案に用いてきた。", "b": "台", "y": "2026", "p": "地図", "k": "スイス", "e": "ヨーロッパ"}, {"n": "地理的表示保護", "t": "地理的表示保護は、商品が特定の地理的領域と直接結びつき、その地域内で生産・加工・製造されることを求める制度であり、消費者が商品の原産地を正確に識別できるようにするとともに地名の商業的濫用を防ぐ目的を持つ。ヨーロッパでは早くから導入されており、スイスのあるチョコレートブランドが工場の一部を国外へ移転した際には、「製品に80%以上のスイス製成分が含まれない」という基準によりスイスの象徴的な山岳図案を商標に使う権利が認められなくなった。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリス", "t": "イギリスのウイスキー蒸留所の中には、地元の水と大麦のみを原料に用いて製造を行うところがあり、地理的表示保護の趣旨に沿って原産地と結びついた伝統的品質と国際的なブランド価値を維持する取り組みとなっている。", "b": "台", "y": "2026", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "台湾・高雄市", "t": "砂州などによって外海から隔てられて形成される潟湖（ラグーン）および州潟海岸の景観は、台湾南西部の高雄市などの沿岸でよくみられる。", "b": "台", "y": "2026", "p": "地図", "k": "台湾・高雄市", "e": "アジア"}, {"n": "ベネズエラ", "t": "南アメリカ北部の北緯0度から12度の間に位置するベネズエラの国名「Venezuela」は、イタリア語で「小さなヴェネツィア」を意味する。ヨーロッパ人の探検家が同国北西岸に上陸した際、沿岸に広がる潟湖（マラカイボ湖周辺の水上集落など）の景観から故郷近くの水の都ヴェネツィアを連想して命名したことに由来する。", "b": "台", "y": "2026", "p": "地図", "k": "ベネズエラ", "e": "南アメリカ"}, {"n": "ベネズエラ北西岸", "t": "北緯10度前後に位置するベネズエラ北西岸の周辺地域には、丈の高い草原の中に背の低い樹木がまばらに点在し、乾季になると草の色が黄金色から焦げ茶色へと変化する熱帯サバナ（サバナ気候）の自然景観がみられる。", "b": "台", "y": "2026", "p": "地図", "k": "ベネズエラ北西岸", "e": "南アメリカ"}, {"n": "炭素国境調整メカニズム（CBAM）", "t": "欧州連合（EU）が温室効果ガス排出の実質ゼロ（ネットゼロ）目標のもとで国際的に公平な競争環境をつくるために導入を進める炭素国境調整メカニズム（CBAM）は、製造時の炭素排出が多い輸入製品に高い関税（炭素価格）を課すとともにクリーン技術への投資を促すグリーン貿易政策であり、気候変動の抑制をめざすパリ協定の目標と精神を一にするものである。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "台湾", "t": "EUの炭素国境調整メカニズム（CBAM）などの脱炭素貿易の潮流を受け、台湾ではエネルギー政策の転換が進められている。台湾の総発電量は2016年の2,641億kWh（億度）から2024年の2,892億kWh（億度）へと増加し、発電構成比は2016年の石炭45.9%、天然ガス31.5%、原子力12.0%、再生可能エネルギー4.8%、その他5.8%から、2024年には天然ガス42.4%、石炭39.2%、再生可能エネルギー11.7%、原子力4.2%、その他2.5%へと変化した。炭素排出の多い石炭火力の比率低下と再生可能エネルギーの比率上昇が、輸出製品の製造過程における炭素排出削減に寄与している。", "b": "台", "y": "2026", "p": "地図", "k": "台湾", "e": "アジア"}, {"n": "北海", "t": "ヨーロッパの北海は年中強い風が吹く偏西風帯に位置するため、豊富な風力エネルギーが得られ、大規模な洋上風力発電に適している。2023年に北海沿岸諸国が開催した北海サミットでは、地域のエネルギー安全保障を高めるため、2050年までに北海の洋上風力発電の設備容量を300ギガワットに引き上げるクリーンエネルギー目標が共同署名された。", "b": "台", "y": "2026", "p": "地図", "k": "北海", "e": "ヨーロッパ"}, {"n": "北海サミット（北海沿岸諸国の洋上風力発電協力）", "t": "2023年の北海サミットにおいて2050年までに北海の洋上風力発電設備容量を300ギガワットとする目標の策定・署名に参加した国には、北海に面するフランス、ドイツ、オランダなどの沿岸諸国が含まれる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "台湾北東部の海岸（岬湾海岸）", "t": "台湾の海岸は地質構造や侵食・沈水作用の違いにより多様な地形を示しており、山地や丘陵が海に迫る地域では、海に突き出た岬と内陸に入り込んだ湾が交互に連なる岬湾海岸（リアス海岸など）が形成されている。", "b": "台", "y": "2026", "p": "地図", "k": "台湾北東部の海岸", "e": "アジア"}, {"n": "台湾の海岸地名「澳」", "t": "台湾において、岬と湾が入り組んだ岬湾海岸のように船舶の停泊に適した小さな湾や入り江をもつ沿岸地域には、入り江を意味する「澳」の字を含む地名（蘇澳、南方澳、深澳など）が多く分布している。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "アメリカ合衆国・サンディエゴ（カリフォルニア州）", "t": "アメリカ合衆国カリフォルニア州南端のサンディエゴは、サンベルト（陽光地帯）に位置して高齢者向けサービスも充実しているため多くの退職者が移住する一方、単身用アパートでも家賃が非常に高くなる住宅費の高騰から若年層の転出も生じている。気候は温暖な地中海性気候で、月平均気温は冬季（12〜1月）の約13℃から夏季（8月）の約21℃まで穏やかに推移し、月降水量は冬季（12〜2月）に約50〜60mm（3月は約50mm）である一方、夏季（6〜8月）はほぼ0mmとなる。", "b": "台", "y": "2026", "p": "地図", "k": "アメリカ合衆国・サンディエゴ", "e": "北アメリカ"}, {"n": "メキシコ・ティファナ", "t": "アメリカ合衆国との国境に接するメキシコ北部のティファナでは、サンディエゴに比べて家賃が大幅に安く、良質なアパートを借りられる。このため国境の北側のサンディエゴで最低賃金水準で働くアメリカの若者が生活費を抑えるために移住し、毎日国境を越えてサンディエゴへ通勤する越境生活圏が形成されている。治安面での懸念（高い殺人率）があるにもかかわらず、住宅費の格差を背景とした移住が続いている。", "b": "台", "y": "2026", "p": "地図", "k": "メキシコ・ティファナ", "e": "北アメリカ"}, {"n": "人口移動の推拉理論と中間障害要因", "t": "人口移動の推拉（プッシュ・プル）理論では、移動元の押し出す力と移動先の引き寄せる力の間に、移動を妨げる「中間障害要因」が作用すると考える。中間障害要因には、距離、費用、国境や制度上の制約、移動にかかる時間などがある。たとえばアメリカ・サンディエゴで働きながらメキシコ・ティファナへ移住する若者の場合、毎日サンディエゴとティファナの間の米墨国境を通過するのに長い時間がかかることが障壁となり、越境通勤の時間的負担がさらなる移住を抑える働きをしている。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "台湾・雲林県斗六市", "t": "台湾鉄道（台鉄）の駅を有する雲林県斗六市は、県内で人口が最も多く平均住宅価格も高い中心都市である。2022年の戸建て新築住宅（透天新成屋）の取引実績は24件、1坪当たり平均単価は24.5万台湾ドルであり、駅の市区中心から同心円状に区分した距離帯別の1坪当たり平均価格は、中心に最も近い第1層が26.7万元、第2層が18.3万元、外側の第3層が17.4万元と、中心から離れるにつれて低下している。", "b": "台", "y": "2026", "p": "地図", "k": "台湾・雲林県斗六市", "e": "アジア"}, {"n": "台湾・雲林県虎尾鎮", "t": "雲林県虎尾鎮では、2015年に台湾高速鉄道（高鉄）の駅が開業して交通利便性が向上したことで移住需要が高まり、新築住宅の供給が増加している。2022年の戸建て新築住宅（透天新成屋）の取引実績は49件、1坪当たり平均単価は18.9万台湾ドルであり、市区中心から同心円状に区分した距離帯別の1坪当たり平均価格は、中心の第1層が20.6万元、第2層が18.2万元であるのに対し、北西部に高速鉄道駅が立地する外側の第3層では19.8万元と高くなっており、高速鉄道駅の設置が駅周辺の住宅価格を押し上げている。", "b": "台", "y": "2026", "p": "地図", "k": "台湾・雲林県虎尾鎮", "e": "アジア"}, {"n": "交通革新と都市階層・住宅価格の空間変化", "t": "高速鉄道の新駅開業のような交通革新は、在来線駅を中心としてきた既存の中心都市と新駅が設置された近隣都市との間で、住宅供給量や距離帯別の住宅価格分布を変化させ、地域内の都市階層や居住地選択に影響を与える。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "バッファー分析（環域分析）", "t": "バッファー分析（環域分析）は、特定の地点・線・面データから一定の距離範囲にある領域（ポリゴン・面データ）を生成する地理情報システム（GIS）の空間分析機能であり、都市の中心点（点データ）から距離に応じた第1層〜第3層の同心円ゾーン（面データ）を作成する処理などに用いられる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "オーバーレイ分析（重ね合わせ分析）", "t": "オーバーレイ分析（重ね合わせ分析）は、複数の異なる主題レイヤーを重ね合わせて空間的な包含関係や重なりを抽出する地理情報システム（GIS）の分析機能であり、ジオコーディングで取得した不動産取引地点（点データ）と同心円の距離帯ゾーン（面データ）を重ねて各物件がどの距離層に属するかを判定し、層別の平均価格を集計する処理などに用いられる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "イラン", "t": "イランではイスラーム法学者による最高指導者のもとで宗教的権威が政治の最高位に位置づけられる神権政治体制がとられており、その宗教文化を象徴する建築景観として、ドーム型の屋根と細長い尖塔（ミナレット）を備えたモスク（イスラーム礼拝所）がみられる。", "b": "台", "y": "2026", "p": "地図", "k": "イラン", "e": "アジア"}, {"n": "ペルシア湾岸地域（カタール・アラブ首長国連邦周辺）", "t": "ペルシア湾岸のカタールやアラブ首長国連邦などの国々にはアメリカ合衆国軍の基地が置かれており、2026年2月28日のアメリカ・イスラエルによるイラン空爆の際には、イランによるミサイル報復の対象となるなど中東の地政学的緊張の最前線となっている。", "b": "台", "y": "2026", "p": "広域・地域", "k": "ペルシア湾岸地域", "e": "アジア"}, {"n": "ホルムズ海峡", "t": "ペルシア湾とオマーン湾を結ぶホルムズ海峡は、南のアラビア半島東端（オマーン半島・ムサンダム半島）と北のイラン海岸線の間に位置し、最狭部の幅が約33kmの国際的なエネルギー輸送の要衝（チョークポイント）である。2026年の軍事衝突の際には、イランが機雷やドローン、地対艦ミサイルを用いて海峡封鎖を図り、世界の産業・エネルギー供給に深刻な影響を与えた。", "b": "台", "y": "2026", "p": "地図", "k": "ホルムズ海峡", "e": "アジア"}, {"n": "気候変動に対する集落の水資源適応力（調適力）", "t": "気候変動に伴い年降水量の変動率が大きくなり河川流量が不安定化した地域では、既存の取水地点だけでは渇水時に十分な生活用水を確保できなくなるリスクが生じる。野外調査に基づいて適切な標高に新たな取水地点を増設し集落の貯水槽へ導水する対策は、水不足リスクを低減して集落の水資源利用の適応力（レジリエンス・調適力）を高める取り組みにあたる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "気候変動と年降水量の変動幅拡大", "t": "気候変動の影響で降水量の年々変動が増大した地域の雨量観測記録の一例では、1986年から2000年代初頭までは年降水量が約1,600〜1,950mm前後で安定して推移していたのに対し、2000年代半ば以降は少ない年の約800mmから多い年の約3,500mmまで年ごとの降水量の差が大きく拡大し、渇水と豪雨の双方のリスクが高まっている。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "自然流下を利用した省エネルギー取水地点の選定", "t": "河川から集落の貯水槽へ生活用水を引き込む際、集落の貯水槽（例：標高50〜60m）よりも標高が高い上流側の河道（例：標高60〜70m）に取水地点を選定すれば、重力による高低差を利用して水を自然流下させることができ、ポンプ揚水などの外部エネルギーを消費せずに送水できるため、省エネルギーで持続可能な水供給が可能となる。", "b": "台", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ニュージーランド", "t": "ニュージーランドには1350年ごろに南太平洋の島々から先住民族のマオリが移住しており、言語学・人類学などの研究から、マオリを含むポリネシア系住民は台湾の先住民族と同じ起源（オーストロネシア語族の拡散）をもつと推論されている。", "b": "台", "y": "2026", "p": "地図", "k": "ニュージーランド", "e": "オセアニア"}, {"n": "ニュージーランド・オークランド", "t": "ニュージーランド北島に位置するオークランドは、沈水作用によって形成された広く水深の深い湾に面した良港をもつ。この自然地形上の「地点（サイト）」の優位性を活かして、ヨーロッパ人の入植以降に海港都市として急速に発展し、初期の木材・金・農産物の輸出拠点となって多くの移民と商業施設を引き寄せた。", "b": "台", "y": "2026", "p": "地図", "k": "ニュージーランド・オークランド", "e": "オセアニア"}, {"n": "ニュージーランド・オークランド", "t": "ニュージーランドのオークランドは、対外貿易を担う海港機能を備えるとともに、3本の主要な高速道路が交差し、北島南端の首都ウェリントンとも鉄道で結ばれている。このように港湾機能と道路・鉄道の陸上交通網を連結する結節点にあることが、交通面における「位置（シチュエーション）」の優位性となっている。", "b": "台", "y": "2026", "p": "地図", "k": "ニュージーランド・オークランド", "e": "オセアニア"}, {"n": "台湾・花蓮県馬太鞍（花東縦谷）", "t": "台湾東部の花東縦谷に位置する花蓮県の「馬太鞍」（マタアン）は、先住民族アミ族の言葉で「キマメ（樹豆）」を意味する地名であり、平坦な地形と肥沃な土壌に恵まれ、かつてキマメが広く自生・栽培されていたことに由来する。この地を流れる馬太鞍渓が光復郷と鳳林鎮の境界をなしており、周辺は主にアミ族が居住する地域となっている。", "b": "台", "y": "2026", "p": "地図", "k": "台湾・花蓮県馬太鞍", "e": "アジア"}, {"n": "台湾・花蓮県光復市街", "t": "台湾・花蓮県光復郷の中心部である光復市街は、中央山脈側から流下する馬太鞍渓が花東縦谷の平地へ出る谷口付近に形成された扇状地（沖積扇）の上に主に立地している。", "b": "台", "y": "2026", "p": "地図", "k": "台湾・花蓮県光復市街", "e": "アジア"}, {"n": "台湾・馬太鞍渓下流（光復郷）", "t": "2025年9月、台風ラガサ（樺加沙）に伴う豪雨によって花蓮県・馬太鞍渓上流の堰止湖（せきとめ湖）が決壊し、下流域に深刻な水害をもたらした。馬太鞍渓下流部では、左岸・河床付近の標高が約118〜120mであるのに対し、右岸（南岸）側の農地や光復市街北東縁は約114〜116mと低い。河床が右岸の市街地側より高い位置にあるため、破堤・溢水した洪水が低所である光復市街や周辺の農地・集落へ一気に流入して被害を拡大させた。", "b": "台", "y": "2026", "p": "地図", "k": "台湾・馬太鞍渓下流", "e": "アジア"}, {"n": "モロッコ内陸部", "t": "北アフリカのモロッコ内陸部では、日干しレンガ（アドベ）が建物の素材として主に用いられている。日干しレンガは粘土に水とわらを混ぜて型抜きし天日干しにした伝統的な建材である。建物の窓は小さく、砂やほこりの侵入を防ぐ目的のほか、直射日光や熱風を避けた遮熱、建物構造の強度の維持、イスラームの教義に関連した家族のプライバシー保護などの役割がある。ナツメヤシは伝統的にオアシスで栽培され、フォガラと呼ばれる地下水路による灌漑でオアシス農業が行われている。実のデーツは糖分が多く栄養価が高く、乾燥させて保存食にもなる重要な自給的作物であり、一部は輸出されるものの、大部分は食用として消費される。", "b": "日", "y": "2026", "p": "地図", "k": "モロッコ内陸部", "e": "アフリカ"}, {"n": "ティグリス川・ユーフラテス川流域", "t": "乾燥・半乾燥地域では生活用水の確保が重要な課題であり、ティグリス川とユーフラテス川の流域では、上流の湿潤地域を水源とする外来河川から、ダムや水路によって得た水を主に利用している。外来河川とは、湿潤地域を水源として砂漠を貫流する河川をいう。", "b": "日", "y": "2026", "p": "地図", "k": "ティグリス川・ユーフラテス川流域", "e": "アジア"}, {"n": "サウジアラビア沿岸部（ペルシア湾岸）", "t": "西アジア有数の産油国であるサウジアラビアのペルシア湾岸では、エネルギー資源が豊富に得られることを背景に、施設内で海水を淡水化した水を生活用水に主に利用している。原油の輸出による潤沢な資金で、海水の淡水化プラントや室内農場などの建設も進められている。", "b": "日", "y": "2026", "p": "地図", "k": "サウジアラビア沿岸部", "e": "アジア"}, {"n": "タリム盆地", "t": "タリム盆地では、高山の雪や氷河が季節による気温変化によって融け出すことで流量が大きくなる内陸河川の水を、生活用水に主に利用している。テンシャン山脈などから河川が流れ込み、標高の高い高山には氷河が存在し、降雪もみられる。テンシャン山脈は古期造山帯に属するが、インド半島がユーラシア大陸に衝突した際のエネルギーで再隆起した復活山脈である。タリム川のように、海に流れ込まずに大陸の内部で消滅するか、内陸湖に注ぎ込む河川を内陸河川という。", "b": "日", "y": "2026", "p": "地図", "k": "タリム盆地", "e": "アジア"}, {"n": "ボリビア・ラパス付近（アルティプラノ）", "t": "ボリビアの首都ラパス付近は、アンデス山脈中のアルティプラノと呼ばれる高原上にあり、標高は3,600mを超える。低緯度に位置するため気温の年較差は小さく、月平均気温は最寒月の7月が約5℃、最暖月の11〜12月が約9〜10℃と年間を通じて低温であり、ケッペンの気候区分ではツンドラ気候（ET）または高山気候（H）にあたる。山脈に囲まれた内陸盆地で水蒸気が届きにくく、月降水量は南半球の夏にあたる1月の約130mmを最大に12〜2月に100mmを超える一方、冬の6〜8月は10mm前後に減少する。アンデスの標高3,500〜4,000mは「スニ」と呼ばれ、原産地のジャガイモの栽培・消費が盛んである。先住民は夜間に凍らせたジャガイモを昼間に足で踏んで脱水し、保存食チューニョをつくる。農耕が困難な標高4,000m以上の「プナ」では、毛の利用や物資の運搬などを目的としてアルパカやリャマが飼育されており、その毛織物から貫頭衣のポンチョもつくられる。", "b": "日", "y": "2026", "p": "地図", "k": "ボリビア・ラパス付近", "e": "南アメリカ"}, {"n": "モンゴル", "t": "モンゴルでは近年、ヤギの飼育頭数の増加が顕著である。その要因の一つは、高級衣料の原料繊維であるカシミアの需要の高まりである。ヤギは草の根まで食べるため、飼育頭数の増加は草地の過剰な利用を招き、砂漠化を促す要因となる。", "b": "日", "y": "2026", "p": "地図", "k": "モンゴル", "e": "アジア"}, {"n": "羊の飼育分布", "t": "羊は乾燥への耐性が高い家畜であり、西アジア、中央アジア、モンゴル、中国内陸（新疆ウイグル自治区・内モンゴル自治区）などの乾燥・半乾燥地域に広く分布している。2020年時点では、これらの地域に1km²あたり50頭以上の羊が飼育される場所がみられる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "インド", "t": "インドは牛（水牛を含む）の飼育がきわめてさかんな国で、2020年時点で国土の広い範囲に1km²あたり50頭以上の牛が飼育されている。ヒンドゥー教において牛は神聖な動物として愛護されており、牛の屠殺はタブーとなっている。特に水牛は、耕作や荷役に使われる役畜として重要である。", "b": "日", "y": "2026", "p": "地図", "k": "インド", "e": "アジア"}, {"n": "青森県五所川原市", "t": "2022年時点で、青森県五所川原市の農業産出額に占める割合は、米が48.6%、果実が39.4%、野菜が7.4%であった。岩木川の下流域に位置し、かつては農作業時に腰まで沈むほどの低湿地帯であり、水田における米作りが農業の中心となっている。", "b": "日", "y": "2026", "p": "地図", "k": "青森県五所川原市", "e": "日本"}, {"n": "青森県つがる市", "t": "2022年時点で、青森県つがる市の農業産出額に占める割合は、米が37.4%、野菜が34.9%、果実が12.8%であった。津軽平野の海岸付近に広がる砂丘では、1970年代に大規模な農地造成が行われ、野菜の生産がさかんである。", "b": "日", "y": "2026", "p": "地図", "k": "青森県つがる市", "e": "日本"}, {"n": "青森県弘前市", "t": "2022年時点で、青森県弘前市の農業産出額に占める割合は、果実が89.0%、米が5.8%、野菜が3.4%であった。岩木山や白神山地に近い山麓の傾斜地では、この地域の特産品であるリンゴが大規模に生産されている。", "b": "日", "y": "2026", "p": "地図", "k": "青森県弘前市", "e": "日本"}, {"n": "津軽平野（青森県）", "t": "津軽平野では、灌漑用水の確保のため、近代以前から多くのため池が造られてきた。谷口を堰き止めて造られた形態のため池（谷池）は、現在も灌漑に利用されている。大雨や地震による決壊のリスクがあり、明治時代に決壊したものもあるため、決壊時の浸水深や浸水までの時間を想定したハザードマップが作成されている。決壊時には、ため池の堰堤に近い場所ほど短時間で浸水が及ぶ。", "b": "日", "y": "2026", "p": "地図", "k": "津軽平野", "e": "日本"}, {"n": "十三湖（青森県）", "t": "青森県の十三湖は、岩木川の河口付近にある潟湖（ラグーン）で、汽水湖であり、淡水と海水が混ざり合っている。日本で有数のシジミ産地であり、ヤマトシジミ漁では、ジョレンと呼ばれる網状のかご型の漁具を使い、網の目を規定の幅以上にすることで、小さな個体の漁獲を抑制している。「十三湖産大和しじみ」として地理的表示保護制度に登録され、ブランド価値の維持・差別化が図られている。十三湖の南東部では、終戦直後の食糧増産政策に伴う大規模な干拓事業によって、1948年から1955年の間に半円形の堤防に囲まれた区域が陸地化し、土地造成がなされた。", "b": "日", "y": "2026", "p": "地図", "k": "十三湖", "e": "日本"}, {"n": "地理的表示保護（GI）制度", "t": "地理的表示保護（GI）制度は、その土地ならではの気候・風土・歴史が育んだ品質や評価を持つ産品を、地域の知的財産として登録・保護する制度であり、発祥の地はヨーロッパである。行政が模倣品を不正競争として取り締まることで、生産者を価格競争から守り、ブランド価値を維持・向上させる。ヨーロッパでは、GI制度の一つである原産地呼称保護（PDO）によって高級な飲食物の名称が保護され、日本でも2014年に法整備が行われた。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "シャンパーニュ地方（フランス）", "t": "フランスのシャンパーニュ地方でつくられる発泡性ワインのシャンパーニュは、GI制度の一つである原産地呼称保護（PDO）によって、その名称が保護されている高級な飲食物である。", "b": "日", "y": "2026", "p": "地図", "k": "シャンパーニュ地方", "e": "ヨーロッパ"}, {"n": "パルマ周辺（イタリア北部）", "t": "イタリア北部でつくられるチーズのパルミジャーノ・レッジャーノは、GI制度の一つである原産地呼称保護（PDO）によって、その名称が保護されている高級な飲食物である。", "b": "日", "y": "2026", "p": "地図", "k": "パルマ周辺", "e": "ヨーロッパ"}, {"n": "北海道夕張市", "t": "北海道夕張市の特産品である夕張メロンは、日本でGI制度の法整備が行われた2014年以降に、地理的表示保護の対象として登録された産品の一つである。その土地ならではの気候・風土・歴史が育んだ品質や評価を持つ産品として、地域の知的財産として保護されている。", "b": "日", "y": "2026", "p": "地図", "k": "北海道夕張市", "e": "日本"}, {"n": "三重県松阪市", "t": "三重県松阪市で知られる特産松阪牛は、日本でGI制度の法整備が行われた2014年以降に、地理的表示保護の対象として登録された産品の一つである。", "b": "日", "y": "2026", "p": "地図", "k": "三重県松阪市", "e": "日本"}, {"n": "福井県（越前海岸）", "t": "福井県の越前で水揚げされる越前がには、日本でGI制度の法整備が行われた2014年以降に、地理的表示保護の対象として登録された産品の一つである。", "b": "日", "y": "2026", "p": "地図", "k": "福井県", "e": "日本"}, {"n": "日本（リンゴの輸出）", "t": "青森県のリンゴは全国の主要な卸売市場に出荷されており、日本から輸出されるリンゴの約9割が青森県産と推定される。2018〜2020年の日本のリンゴ輸出量は、2008〜2010年の約1.4倍に増えた。輸出先の割合は、2008〜2010年の平均値で台湾が91.1%、香港が4.5%、中国が1.4%、タイが1.4%、インドネシアが0.4%であったが、2018〜2020年の平均値では台湾が68.9%、香港が25.4%、タイが3.0%、ベトナムが1.0%、シンガポールが0.8%となった。東南アジア諸国への輸出の割合は、タイとインドネシアを合わせて1.8%（2008〜2010年）から、タイ・ベトナム・シンガポールを合わせて4.8%（2018〜2020年）へと高まっており、東南アジア諸国への輸出量は増加した。", "b": "日", "y": "2026", "p": "地図", "k": "日本", "e": "日本"}, {"n": "台湾（リンゴの輸入）", "t": "2018〜2020年の平均で、台湾のリンゴ輸入量は生産国の収穫時期に応じて月ごとに大きく変動する。北半球のアメリカ合衆国産は11月の約12.5千トンを最大に11月から1月にかけて多く輸入され、同じく北半球の日本産も収穫の盛期となる秋冬にあわせて1月の約6千トンを最大に10月から2月ごろにかけて輸入される。一方、南半球のチリ産は5月に約14千トンと最大になり、4月から9月にかけて輸入されている。", "b": "日", "y": "2026", "p": "地図", "k": "台湾", "e": "アジア"}, {"n": "伊豆・小笠原海溝（日本列島の太平洋側）", "t": "日本列島の太平洋側の海域では、太平洋プレートがフィリピン海プレートの下に沈み込んでいる。この狭まる境界の沈み込み帯に沿って、深い凹地形である伊豆・小笠原海溝が形成されている。", "b": "日", "y": "2026", "p": "地図", "k": "伊豆・小笠原海溝", "e": "日本"}, {"n": "ハワイ諸島北西海域", "t": "ハワイ諸島の北西の海域には、海山列が形成されている。ホットスポット（境界から離れたプレート中央部でマグマを供給する局所的な熱源）の上にあるハワイ島付近で誕生した火山島が、太平洋プレートの移動に伴って北西へ運ばれ、沈降や浸食によって高度を下げ、海面下に没したものである。", "b": "日", "y": "2026", "p": "地図", "k": "ハワイ諸島北西海域", "e": "海洋"}, {"n": "大西洋中央海嶺", "t": "大西洋の中央部には、プレートの広がる境界である大西洋中央海嶺が南北に伸びている。海底火山が連なる海嶺のほか、海嶺の軸を細かく寸断するように直交するトランスフォーム断層が明瞭に観察できる。", "b": "日", "y": "2026", "p": "地図", "k": "大西洋中央海嶺", "e": "海洋"}, {"n": "ニュージーランド", "t": "2016年1月から2020年1月にかけて、ニュージーランドの大気中の二酸化炭素濃度は、約398〜399ppmから約409ppmまで増加傾向を示した。季節による1年周期の変動では、南半球の夏にあたる毎年1〜3月ごろに陸域の植物の光合成が盛んになって濃度がやや低下する谷がみられるが、南半球は陸地面積の割合が小さく光合成を行う植物量が少ないうえ、広大な海洋による二酸化炭素の吸収・放出が季節変動を緩和するため、1年周期の変動幅は約1〜2ppm程度と小さい。", "b": "日", "y": "2026", "p": "地図", "k": "ニュージーランド", "e": "オセアニア"}, {"n": "アラスカ", "t": "2016年1月から2020年1月にかけて、北半球高緯度に位置するアラスカの大気中の二酸化炭素濃度は、2016年1月の約408ppmから2020年1月の約418.5ppmへと全体として増加傾向を示した。期間中は最低約398.5ppm（2017年夏）から最高約421ppm（2019年春）の間で推移しており、北半球の夏に陸域の植物の光合成が盛んになって濃度が大きく低下するため、1年周期の季節変動幅が約15〜16ppmと大きい。", "b": "日", "y": "2026", "p": "地図", "k": "アラスカ", "e": "北アメリカ"}, {"n": "黒ボク土", "t": "黒ボク土は、風化した火山灰を母材とし、厚い腐植層をもつ間帯土壌で、日本やニュージーランドなどに特有の土壌である。腐植（植物の遺骸などの有機物）を含まない下層には、関東ローム層などの火山灰層がある。酸性が強くリン酸供給力が低いが、多量の施肥によって畑作地として利用されている。母材の火山灰は偏西風の影響で火山の東方に堆積するため、分布もこれに従う。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "関東平野", "t": "関東平野には、富士山、箱根、浅間山の火山灰が偏西風によって火山の東方に堆積し、風化して黒ボク土が分布している。", "b": "日", "y": "2026", "p": "地図", "k": "関東平野", "e": "日本"}, {"n": "北海道南東部", "t": "北海道南東部には、支笏湖周辺や十勝岳の火山灰が偏西風によって火山の東方に堆積し、風化して黒ボク土が分布している。", "b": "日", "y": "2026", "p": "地図", "k": "北海道南東部", "e": "日本"}, {"n": "東北北部", "t": "東北北部は、過去に火山活動がさかんだった地域で、火山灰を母材とする黒ボク土が分布している。", "b": "日", "y": "2026", "p": "地図", "k": "東北北部", "e": "日本"}, {"n": "九州南東部", "t": "九州南東部は、過去に火山活動がさかんだった地域で、火山灰を母材とする黒ボク土が分布している。", "b": "日", "y": "2026", "p": "地図", "k": "九州南東部", "e": "日本"}, {"n": "沖積土", "t": "沖積土は、河川によって運搬され、洪水などで低地に堆積した土砂に腐植が混ざった肥沃な土壌である。河川下流の氾濫原や三角州などの低湿地に分布し、日本では水田として利用されている。主要河川の流域に分布が多く、山地には少ない。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "褐色森林土", "t": "褐色森林土は、温帯気候に対応する成帯土壌で、落ち葉などの腐植が豊富な落葉広葉樹林地帯に分布する。日本では山地や丘陵地にみられ、農地としての利用は畑が多い。特に西日本では、山地・山脈の位置と分布が重なっている。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "北アメリカ中北部（カナダ南部・アメリカ合衆国中北部）", "t": "カナダ南部からアメリカ合衆国中北部にかけての地域は、約1万年前まで続いた最終氷期に大陸氷床（ローレンタイド氷床）に広く覆われており、氷床が地表を削ったこと（氷食作用）によって形成された数多くの湖沼や湿地が分布している。", "b": "日", "y": "2026", "p": "広域・地域", "k": "北アメリカ中北部", "e": "北アメリカ"}, {"n": "北アメリカ北部（アラスカ北部）", "t": "アラスカ北部などの北アメリカ大陸北極海沿岸には湿地・湖沼が広く分布し、夏季には草やコケ類が繁茂するツンドラとなってトナカイやカラフトライチョウなどの生息地となっている。", "b": "日", "y": "2026", "p": "広域・地域", "k": "北アメリカ北部", "e": "北アメリカ"}, {"n": "ミシシッピ川河口部", "t": "メキシコ湾に注ぐミシシッピ川の河口部では、河川が上流から運搬した大量の土砂が堆積し、鳥の足指のように分流が海へ突き出した大規模な鳥趾状三角州と湿地が形成されている。", "b": "日", "y": "2026", "p": "地図", "k": "ミシシッピ川河口部", "e": "北アメリカ"}, {"n": "フロリダ半島南端", "t": "フロリダ半島の南端は熱帯気候に属する広大な湿地帯で、マングローブ（熱帯・亜熱帯の潮間帯の汽水域に発達する森林）や草地が分布し、アメリカワニやフラミンゴなどの生息地となっている。", "b": "日", "y": "2026", "p": "地図", "k": "フロリダ半島南端", "e": "北アメリカ"}, {"n": "南アメリカ", "t": "2020年時点で、南アメリカの水資源量（河川水など持続的な利用が可能な水資源）は年間約18千km³、1人当たり水資源量は年間約42千m³/人であった。赤道直下の多雨地域を流れるアマゾン川のほか、ラプラタ川、オリノコ川など湿潤地域を流れる大河川が多く、総水資源量・1人当たり水資源量ともに大きい。", "b": "日", "y": "2026", "p": "広域・地域", "k": "南アメリカ", "e": "南アメリカ"}, {"n": "ヨーロッパ", "t": "2020年時点で、ロシアを除くヨーロッパの水資源量は年間約3.2千km³、1人当たり水資源量は年間約5.5千m³/人であった。地域面積が比較的小さい一方で人口が多く居住しているため、1人当たりの水資源量は大きくない。", "b": "日", "y": "2026", "p": "広域・地域", "k": "ヨーロッパ", "e": "ヨーロッパ"}, {"n": "オセアニア", "t": "2020年時点で、オセアニアの水資源量は年間約1.8千km³、1人当たり水資源量は年間約39千m³/人であった。陸地の大部分を占めるオーストラリア大陸の内陸部に乾燥帯が広がり降水量が少ないため総水資源量は小さいが、地域の人口規模が小さいため、1人当たりの水資源量は大きい。", "b": "日", "y": "2026", "p": "広域・地域", "k": "オセアニア", "e": "オセアニア"}, {"n": "アジア", "t": "2020年時点で、ロシアを含むアジアの水資源量は年間約19千km³、1人当たり水資源量は年間約4千m³/人であった。広大な陸地とモンスーンアジアの多雨地域を抱え総水資源量は大きいが、巨大な人口を抱えるため1人当たりの水資源量は小さい。", "b": "日", "y": "2026", "p": "広域・地域", "k": "アジア", "e": "アジア"}, {"n": "浅間山（群馬県・長野県）", "t": "本州に位置する浅間山（群馬県・長野県）は活火山で、噴火の際には火砕サージ（空気とわずかな火山灰が混合して高温で流れ下るもの）や火砕流が想定火口を中心に流れ下る。融雪型火山泥流は、噴火などの熱に伴い積雪が融けて生じる泥流で、積雪期に起こり、冬の北西季節風による積雪量の多い北側斜面を中心に広く生じる。土石流は、降り積もった火山灰と降雨により生じる土砂と水の混ざった流れで、無雪期の大雨などをきっかけに急傾斜で深い谷が発達した南側斜面などで起こり、谷口から土砂が扇状に広がる。また上空を西から東に吹く偏西風の影響で、本州における火山の大規模噴火では火山灰は火口から東側に降ることが多く、降灰範囲が火口から数百kmに及ぶこともある。", "b": "日", "y": "2026", "p": "地図", "k": "浅間山", "e": "日本"}, {"n": "綿花の栽培条件", "t": "綿花の栽培は、温帯から熱帯にかけての、生育期には十分な雨があり、収穫期には乾燥して晴天が続く地域に適している。ステップ気候などの乾燥地域では灌漑が必要となる。主要生産国では、プランテーションでの生産や、灌漑施設を用いた栽培がみられる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "インド・デカン高原", "t": "インドのデカン高原は、綿花の代表的な産地の一つである。", "b": "日", "y": "2026", "p": "地図", "k": "インド・デカン高原", "e": "アジア"}, {"n": "中国の華中〜華北", "t": "中国の華中から華北にかけては、綿花の代表的な産地の一つである。", "b": "日", "y": "2026", "p": "地図", "k": "中国の華中〜華北", "e": "アジア"}, {"n": "アメリカ合衆国南部（コットンベルト）", "t": "アメリカ合衆国南部のコットンベルトは、綿花の代表的な産地の一つである。", "b": "日", "y": "2026", "p": "広域・地域", "k": "アメリカ合衆国南部", "e": "北アメリカ"}, {"n": "中央アジア", "t": "中央アジアは、綿花の代表的な産地の一つで、乾燥地域のため灌漑を用いた栽培がみられる。", "b": "日", "y": "2026", "p": "広域・地域", "k": "中央アジア", "e": "アジア"}, {"n": "地中海沿岸", "t": "地中海沿岸は、綿花の代表的な産地の一つである。", "b": "日", "y": "2026", "p": "広域・地域", "k": "地中海沿岸", "e": "ヨーロッパ"}, {"n": "ベンガル地方（インド東部〜バングラデシュ）", "t": "麻袋やロープなどの原料となるジュートの栽培は、ガンジス・ブラマプトラデルタの広がるインド東部からバングラデシュのベンガル地方に集中している。主要生産国では河川沿いの肥沃な低湿地で主に栽培され、収穫したジュートは河川水に浸して繊維を分離しやすくして加工する。", "b": "日", "y": "2026", "p": "地図", "k": "ベンガル地方", "e": "アジア"}, {"n": "フランス・ノルマンディー地方", "t": "亜麻の主要生産地であるヨーロッパでは、地力の低下を防ぐため、小麦やエン麦と組み合わせた混合農業による輪作が盛んである。特にフランスのノルマンディー地方を中心に、亜麻の栽培が輪作に組み込まれている。亜麻の繊維は、衣服、寝具、テーブルクロスなどの布製品（リネン）に加工され、種子からは食用のアマニ（亜麻仁）油を絞る。", "b": "日", "y": "2026", "p": "地図", "k": "フランス・ノルマンディー地方", "e": "ヨーロッパ"}, {"n": "日本の繊維工業の変遷", "t": "綿紡績業が盛んであった日本では、高度経済成長期以降、石油化学コンビナートの整備などが進み、化学繊維製造業が発展した。1967年から2021年にかけて、化学繊維製造業の事業所数は102事業所から127事業所へ増加（2021年は愛知・福井・滋賀・石川・京都・愛媛などが上位）した一方、綿紡績業は491事業所から29事業所へ大きく減少した。オイルショックや新興国の成長などもあり、繊維工業の国際競争力は低下し、現在は炭素繊維などの新素材の開発が進められている。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "岡山県・山口県・兵庫県（瀬戸内海沿岸）", "t": "岡山県、山口県、兵庫県などの石油化学コンビナート所在地では、高度経済成長期以降、石油化学コンビナートの整備が進み、化学繊維製造業が発展した。1967年の化学繊維製造業の事業所数は日本全体で102事業所で、岡山県、愛媛県、愛知県、山口県、兵庫県はそれぞれ全国の5%以上を占めていた。", "b": "日", "y": "2026", "p": "地図", "k": "岡山県・山口県・兵庫県", "e": "日本"}, {"n": "愛知県", "t": "愛知県（旧三河・尾張国）では、江戸時代から濃尾平野などを中心に温暖で水はけの良い気候・地形を活かした綿花栽培が盛んであり、1967年・2021年ともに綿紡績業および化学繊維製造業の双方で全国の主要集積県となっている。", "b": "日", "y": "2026", "p": "地図", "k": "愛知県", "e": "日本"}, {"n": "大阪府", "t": "大阪府は、明治期の産業革命において大規模な機械紡績業の集積地として発展し、「東洋のマンチェスター」とも呼ばれた。綿紡績業の事業所数は、1967年（全国491事業所）、2021年（全国29事業所）のいずれの年も全国の都道府県で最大の割合を占めている。", "b": "日", "y": "2026", "p": "地図", "k": "大阪府", "e": "日本"}, {"n": "バングラデシュ", "t": "日本のバングラデシュからの衣料品輸入額は、2013年（329億円）を100とした指数で、2003年が5、2023年が255と20年間で50倍以上に急増した。2000年代後半、主要な衣料品輸入先であった中国での人件費高騰や労働力不足などを背景に、日本企業が生産拠点を東南アジアや南アジアへ分散させる動きが強まり、欧米企業の進出が先行していたバングラデシュに日本の大手アパレル企業も大規模な生産拠点を構築した。", "b": "日", "y": "2026", "p": "地図", "k": "バングラデシュ", "e": "アジア"}, {"n": "ベトナム", "t": "日本のベトナムからの衣料品輸入額は、2013年（1,280億円）を100とした指数で、2003年が30、2023年が206と大きく拡大した。生産拠点の分散を図る日本企業のベトナム進出が2000年代以降に進み、縫製品質の高さや政治的安定性、地理的な近さなどから主要な衣料品生産拠点となっている。", "b": "日", "y": "2026", "p": "地図", "k": "ベトナム", "e": "アジア"}, {"n": "中国", "t": "日本の中国からの衣料品輸入額は、2013年（1兆92億円）を100とした指数で、2003年が89、2023年が66へと低下した。2000年代に「世界の工場」として工業製品の輸出が拡大した中国は、日本の衣料品輸入の大部分を占める最大の供給国となったが、近年は人件費の高騰などを背景に日本側の輸入指数は減少傾向にある。", "b": "日", "y": "2026", "p": "地図", "k": "中国", "e": "アジア"}, {"n": "韓国", "t": "日本の韓国からの衣料品輸入額は、2013年（30億円）を100とした指数で、2003年が129、2023年が43へと減少した。1990年代までに重化学工業化・ハイテク産業化が進展した韓国からは、労働集約的な衣料品の輸入額は小さい水準にとどまっている。", "b": "日", "y": "2026", "p": "地図", "k": "韓国", "e": "アジア"}, {"n": "衣料品・身回品小売業と飲食料品小売業の店舗立地", "t": "2021年時点で、日本の商業集積地区（ショッピングセンターやテナントビルなどが立地する地区を含む）における店舗数の立地構成は、靴やカバンなどを含む衣料品・身回品小売業では都市中心部（駅周辺と市街地の商業集積地区）が約64%、ロードサイドが約16%、住宅地周辺が約18%、その他が約2%である。商品を比較検討して購入する買回り品を扱うため、人流が多く複数店舗が集まる駅周辺や市街地の商業集積地区への立地割合が高い。日常的に購入する最寄り品を扱う飲食料品小売業では、都市中心部が約58%、住宅地周辺が約30%、ロードサイドが約9%、その他が約3%である。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "自動車小売業の店舗立地", "t": "2021年時点で、日本の商業集積地区における自動車小売業の店舗数の立地構成は、都市中心部（駅周辺と市街地の商業集積地区）が約29%、ロードサイドが約30%、住宅地周辺が約38%、その他が約3%となっている。自動車の販売店舗には展示や駐車のための広い敷地面積が必要であり、広域から自動車で来店する客が多いため、幹線道路沿い（ロードサイド）や郊外の住宅地周辺に立地する割合が高い。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ファストファッションと衣料品の再資源化", "t": "世界で使われなくなった衣料品のうち、再利用・再資源化されるものは全体の20%程度であり、再資源化にはコストや技術面の課題がある。ファストファッションとは、低価格の衣類を途上国の生産拠点で大量生産し、短いサイクルで先進国の市場に供給するアパレル産業のビジネスモデルであり、安価な製品の大量販売が頻繁な購入と大量廃棄を招く一因となっている。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ヨーロッパ連合（EU）", "t": "EU諸国などの先進国には国際的なアパレル企業の本社が多く立地しており、廃棄衣料の削減や衣料品の再資源化の技術開発・制度化に関する取り組みが進められている。また2022年時点で、欧米諸国や日本、中国、韓国などは世界の中古衣料品類（衣料アクセサリー・ブランケットなどを含む）の主要な輸出国となっている。", "b": "日", "y": "2026", "p": "広域・地域", "k": "ヨーロッパ連合", "e": "ヨーロッパ"}, {"n": "中古衣料品類の輸入地域分布", "t": "2022年時点で、世界の中古衣料品類（衣料アクセサリー・ブランケットなどを含む）は、先進国などから輸出され、サハラ以南のアフリカ諸国、パキスタン・インドなどの南アジア、東南アジア、中南米などの発展途上国に多く輸入されて再利用されている。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ヨーロッパ（旧ソ連諸国を含まない）", "t": "旧ソ連諸国を含まないヨーロッパの人口密度は、1970年に97.4人/km²、2020年に114.3人/km²で、約17%の上昇にとどまった。1人当たり穀物生産量は1970年の0.40トンから2020年の0.57トンに増えた。平坦な地形と湿潤気候に恵まれた人口稠密地域であり、少産少死型の先進国が多く人口増加率は低い。", "b": "日", "y": "2026", "p": "広域・地域", "k": "ヨーロッパ", "e": "ヨーロッパ"}, {"n": "アフリカ", "t": "アフリカの人口密度は、1970年に12.4人/km²、2020年に46.7人/km²と約3.8倍に上昇し、急激な人口増加が続いている。多産多死型から多産少死型に移行する国が多い一方、1人当たり穀物生産量は1970年の0.17トンから2020年の0.16トンへと低下しており、資金不足や政情不安などから農業生産の拡大が人口増加に追いついていない。", "b": "日", "y": "2026", "p": "広域・地域", "k": "アフリカ", "e": "アフリカ"}, {"n": "北アメリカ（アメリカ合衆国とカナダ）", "t": "アメリカ合衆国とカナダからなる北アメリカの人口密度は、1970年に12.6人/km²、2020年に20.7人/km²であった。寒冷な針葉樹林帯や西部の乾燥帯を広く抱えるため人口密度は低いが、大規模で機械化された輸出向けの企業的穀物農業が展開されており、1人当たり穀物生産量は1970年の0.94トンから2020年の1.32トンへと大きく増加し、1人当たり1トンを超える高い水準にある。", "b": "日", "y": "2026", "p": "広域・地域", "k": "北アメリカ", "e": "北アメリカ"}, {"n": "南アメリカ", "t": "南アメリカの人口密度は、1970年に10.9人/km²、2020年に24.2人/km²と2倍以上に増加した。1人当たり穀物生産量も1970年の0.28トンから2020年の0.58トンへと2倍以上に伸びており、ブラジルやアルゼンチンなどで大型機械や遺伝子組み換え作物を導入した企業的穀物農業が拡大している。", "b": "日", "y": "2026", "p": "広域・地域", "k": "南アメリカ", "e": "南アメリカ"}, {"n": "アラブ首長国連邦", "t": "2020年時点で、ペルシア湾に面する産油国のアラブ首長国連邦における外国人居住者は約870万人にのぼる一方、同国出身の国外居住者は約20万人とごく少ない。石油収入を背景にドバイなどで都市建設やインフラ整備、産業の多角化が進められており、少ない自国民労働力を補うため南アジアなどから多数の外国人労働者を受け入れている。", "b": "日", "y": "2026", "p": "地図", "k": "アラブ首長国連邦", "e": "アジア"}, {"n": "インドネシア", "t": "2020年時点で、東南アジアの人口大国であるインドネシア出身の国外居住者は約460万人と多い一方、インドネシア国内における外国人居住者は約35万人と少ない。より高い賃金や雇用機会を求めて、マレーシアやサウジアラビア、東アジア諸国・地域などへ多くの労働移民を送り出している。", "b": "日", "y": "2026", "p": "地図", "k": "インドネシア", "e": "アジア"}, {"n": "フランス", "t": "2020年時点で、フランス国内における外国人居住者は約850万人と多く、同時にフランス出身の国外居住者も約230万人存在する。旧植民地のアルジェリアやモロッコなどの北アフリカやヨーロッパ域内から多くの移民を受け入れる一方、移動の自由が保障されたシェンゲン圏内の近隣諸国や北アメリカなどへ高度専門職や管理職として移動・居住するフランス国民も多い。", "b": "日", "y": "2026", "p": "地図", "k": "フランス", "e": "ヨーロッパ"}, {"n": "メキシコ", "t": "メキシコの人口の自然増加率は、1950年の約28‰から1960年代後半に約35‰のピークを迎えた後、出生率の低下に伴って下降し、1990年に約23‰、2020年には約8‰まで低下した。人口ピラミッドは1960年・1990年の裾野の広い富士山型から、2020年には年少人口の割合が縮小して生産年齢人口の割合が厚い釣り鐘型（人口ボーナス期）へと変化している。", "b": "日", "y": "2026", "p": "地図", "k": "メキシコ", "e": "北アメリカ"}, {"n": "フィンランド", "t": "フィンランドの人口の自然増加率は、1950年の約14‰から低下し、1970年代以降は0〜5‰前後の低水準で推移した後、2020年には約−2‰の自然減少となった。早い時期から少産少死へ移行した北欧の先進国であり、1960年から2020年にかけて人口ピラミッドは釣り鐘型から少子高齢化の進んだつぼ型へと変化している。", "b": "日", "y": "2026", "p": "地図", "k": "フィンランド", "e": "ヨーロッパ"}, {"n": "マリ", "t": "アフリカのサヘル地帯に位置するマリの人口の自然増加率は、1950年の約15〜16‰から死亡率の低下に伴って上昇を続け、2010年ごろに約34‰に達し、2020年も約31‰と高い水準にある。高い出生率を背景に、1960年・1990年・2020年のいずれの時点でも年少人口の割合がきわめて高い富士山型の人口ピラミッドを示している。", "b": "日", "y": "2026", "p": "地図", "k": "マリ", "e": "アフリカ"}, {"n": "ニューヨーク都市圏", "t": "2019年時点で、ニューヨーク都市圏の住民の職業別就業者割合は、中心都市では管理的・専門的職業が約43%、サービス職が約23%、営業・販売・事務職が約19%、生産・輸送職が約9%、農林漁業・建設・採掘従事者が約6%であり、周辺地域では管理的・専門的職業が約45%、サービス職が約16%、営業・販売・事務職が約21%、生産・輸送職が約10%、農林漁業・建設・採掘従事者が約8%と、中心都市と周辺地域で大きな差がみられない。知識集約型産業や金融・ビジネス機能が集積し、再開発やジェントリフィケーション、公共交通網の発達によって都心部にも高所得の専門職・管理職層が多く居住している。", "b": "日", "y": "2026", "p": "地図", "k": "ニューヨーク都市圏", "e": "北アメリカ"}, {"n": "デトロイト都市圏", "t": "2019年時点で、デトロイト都市圏の住民の職業別就業者割合は、中心都市では管理的・専門的職業が約25%にとどまる一方、生産・輸送職が約26%、サービス職が約24%、営業・販売・事務職が約19%を占めるのに対し、周辺地域では管理的・専門的職業が約43%と高く、生産・輸送職は約15%、サービス職は約16%、営業・販売・事務職は約19%となっており、中心都市と周辺地域の差が大きい。自動車産業の衰退や工場の郊外移転、中産・富裕層の郊外転出に伴い中心都市でインナーシティ問題が進行したことが背景にある。", "b": "日", "y": "2026", "p": "地図", "k": "デトロイト都市圏", "e": "北アメリカ"}, {"n": "関東・近畿・中京の大都市圏", "t": "商工業・サービス業が発達した関東、近畿、中京の大都市圏では、2020年時点で第一次産業就業者割合および持ち家住宅割合が低く、中心部の地価が高いことから郊外に住宅地が広がり、2021年時点で平均通勤・通学時間が長い傾向がみられる。", "b": "日", "y": "2026", "p": "広域・地域", "k": "関東・近畿・中京の大都市圏", "e": "日本"}, {"n": "北陸・東北の日本海側", "t": "2020年時点で、北陸および東北の日本海側の諸県では持ち家住宅割合が高い。宅地価格が比較的安価であることや、多世代同居の世帯が多いこと、豪雪地帯で積雪に耐えうる住宅を保有する意識が強いことなどが背景にある。", "b": "日", "y": "2026", "p": "広域・地域", "k": "北陸・東北の日本海側", "e": "日本"}, {"n": "山形県庄内地方の城下町都市", "t": "城下町を起源とする日本の地方都市の一例では、1980年の時点では城跡の近くや駅付近に商業の中心地が形成され、駅の南側などに大型店舗（店舗面積1,500m²以上の小売店舗）が立地していた。その後、モータリゼーションの進展や高速道路・バイパスの整備に伴い市街地が外縁へ拡大し、人口集中地区（DID：人口密度が高く実質的な都市地域とみなせる地域）の人口は1980年の52,920人から2020年の57,328人へと約8%増加した一方、DIDの面積は大きく拡大したためDID内の人口密度は低下した。2020年には人口集中地区の外側の主要道路沿いにも多くの大型店舗が立地し、都市中心部では商店街の衰退が進んでいる。", "b": "日", "y": "2026", "p": "地図", "k": "山形県庄内地方の城下町都市", "e": "日本"}, {"n": "コンパクトシティ", "t": "人口減少時代を迎えた日本の多くの地方都市では、市街地の拡散と中心市街地の空洞化への対策として、持続可能な社会の実現に向けたコンパクトシティ政策が注目されている。都市中心部に医療・福祉・商業・行政などの様々な施設を集中させるとともに、公共交通機関の利用を促す取り組みであり、歴史的建造物などを活用した集客施設の整備により地域の活性化を図る事例もみられる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ドナウ川（ヨーロッパ中南部）", "t": "ドナウ川は、流域がヨーロッパ中南部に位置し、河道沿いの気候はすべて温帯（上・中流の西岸海洋性気候や温暖湿潤気候など）に属している。", "b": "日", "y": "2026", "p": "地図", "k": "ドナウ川", "e": "ヨーロッパ"}, {"n": "ナイル川", "t": "ナイル川は典型的な外来河川で、赤道付近のヴィクトリア湖周辺などの熱帯（サバナ気候）やエチオピア高原の湿潤地域に源流を持ち、中流・下流では広大な乾燥帯（ステップ気候・砂漠気候）を貫流して地中海に注ぐ。", "b": "日", "y": "2026", "p": "地図", "k": "ナイル川", "e": "アフリカ"}, {"n": "メコン川（チベット高原からインドシナ半島）", "t": "メコン川は、標高4,000mを超えてケッペンの気候区分で寒帯（ツンドラ気候・高山気候）に分類されるチベット高原に源流を持ち、中流の温帯（温暖冬季少雨気候）を経て、下流のインドシナ半島では熱帯（サバナ気候・熱帯モンスーン気候）を流れる国際河川である。", "b": "日", "y": "2026", "p": "地図", "k": "メコン川", "e": "アジア"}, {"n": "カンボジア・プノンペン", "t": "メコン川流域に位置するカンボジアの首都プノンペンは、かつて長期にわたる内戦で多くの建築物が破壊されたが、その後徐々に都市が再建され、経済特区などに外国企業の進出がみられる。カンボジアを含むインドシナ半島には仏教が広く信仰されており、市内には仏教寺院や、バイクの後ろに客席荷台を連結した三輪タクシー（トゥクトゥク）がみられる。", "b": "日", "y": "2026", "p": "地図", "k": "カンボジア・プノンペン", "e": "アジア"}, {"n": "スーダン・ハルツーム", "t": "青ナイルと白ナイルの合流点に位置するスーダンの首都ハルツームは、古くから交易や文化の拠点として栄えた。近年は石油資源などをもとにインフラ整備や都市開発を進めたが、度重なる政情不安がその障害となっている。北部の首都周辺にはイスラームを信仰するアラブ系住民が多く、市内にはドーム型屋根と尖塔（ミナレット）をもつモスクがみられる。なお、南部の非アラブ系住民との長期にわたる内戦を経て、2011年に南スーダンが分離・独立した。", "b": "日", "y": "2026", "p": "地図", "k": "スーダン・ハルツーム", "e": "アフリカ"}, {"n": "オーストリアのドナウ川上流側（ドイツとの国境）", "t": "2023年に、オーストリアのドナウ川周辺の国境を通過する貨物量は、上流側のドイツとの間で4,200万トンであり、輸送手段別の割合は、自動車が72%、鉄道が26%、船舶が3%であった。工業国のドイツとの間では自動車部品・機械類・化学製品などの工業製品がサプライチェーンを通じて緊密に取引されており、機動性の高い自動車や鉄道による輸送が中心となっている。", "b": "日", "y": "2026", "p": "地図", "k": "オーストリアのドナウ川上流側", "e": "ヨーロッパ"}, {"n": "オーストリアのドナウ川下流側（スロバキア・ハンガリー側国境）", "t": "2023年に、オーストリアのドナウ川周辺の国境を通過する貨物量は、下流側のスロバキア・ハンガリー側との間で2,300万トンであり、輸送手段別の割合は、自動車が64%、鉄道が21%、船舶が16%であった。下流側の東欧諸国からは鉄鉱石・石炭・穀物などの重くてかさばる一次産品・原材料が多く運ばれるため、大量のばら積み貨物を安価に輸送できる河川船舶の利用割合が16%を占めている。", "b": "日", "y": "2026", "p": "地図", "k": "オーストリアのドナウ川下流側", "e": "ヨーロッパ"}, {"n": "水資源の国外依存度", "t": "水資源の国外依存度とは、自国で得られる水資源のうち国外から流入する水資源に依存する割合をいう。国際河川では、上流国・下流国の位置や国土と流域の重なり方によって依存度が大きく異なり、2021年時点で、ドナウ川流域のハンガリー、ナイル川流域のエジプト、メコン川流域のカンボジアなどの下流国では、依存度が70%以上と高い。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ドナウ川河口（ドナウデルタ）", "t": "ドナウ川では、流域の途中に設置された水力発電所やダムによって土砂の流下や水量が変化し、河口に広がる湿地（ドナウデルタ）の生態系への影響が危惧されている。", "b": "日", "y": "2026", "p": "地図", "k": "ドナウ川河口", "e": "ヨーロッパ"}, {"n": "中国・雲南省（メコン川上流）", "t": "メコン川では、上流での灌漑や水力発電における用水需要やダム建設が進んでおり、下流諸国の水量変動や農業・漁業に制約が生じている。上流の中国・雲南省では多くの水力発電ダムが建設されている。", "b": "日", "y": "2026", "p": "地図", "k": "中国・雲南省", "e": "アジア"}, {"n": "エチオピア・大エチオピア・ルネサンスダム（青ナイル）", "t": "ナイル川上流のエチオピア（青ナイル）に建設された大エチオピア・ルネサンスダム（GERD）による大規模な貯水・水資源開発は、河川水に強く依存する下流のエジプトやスーダンにおける水供給量の減少につながる懸念があり、流域国家間の対立要因となっている。", "b": "日", "y": "2026", "p": "地図", "k": "エチオピア・大エチオピア・ルネサンスダム", "e": "アフリカ"}, {"n": "ドナウ川流域（17か国）", "t": "ドナウ川流域17か国の1人当たりGDPの平均値は、1995年の10,371ドルから2023年の27,729ドルへと増加し、西・中央ヨーロッパの先進国を含むため高い経済水準にある。また流域国間の1人当たりGDPの変動係数は1995年の1.38から2023年の0.87へと低下しており、EU拡大などを通じて流域国間の経済格差が縮小した。", "b": "日", "y": "2026", "p": "地図", "k": "ドナウ川流域", "e": "ヨーロッパ"}, {"n": "メコン川流域（6か国）", "t": "中国・ミャンマー・ラオス・タイ・カンボジア・ベトナムからなるメコン川流域6か国の1人当たりGDPの平均値は、1995年の756ドルから2023年の4,878ドルへと約6.5倍に急成長した。流域国間の変動係数も1995年の1.37から2023年の0.90へと低下し、新興国・途上国の工業化や地域経済連携の進展に伴って経済格差が縮小した。", "b": "日", "y": "2026", "p": "地図", "k": "メコン川流域", "e": "アジア"}, {"n": "ナイル川流域（10か国）", "t": "ナイル川流域10か国の1人当たりGDPの平均値は、1995年の330ドルから2023年の1,355ドルへと約4.1倍に増加したが、後発開発途上国を多く含むため低水準にとどまっている。また流域国間の変動係数は1995年が0.73、2023年も0.73と変化しておらず、格差の縮小はみられない。", "b": "日", "y": "2026", "p": "地図", "k": "ナイル川流域", "e": "アフリカ"}, {"n": "域内での国際分業と経済協力の枠組み", "t": "国際河川流域の国々では、自由貿易や地域経済協力の枠組みを通じた域内での国際分業の進展が、国々の間の経済格差を縮める背景の一つとなっている。ヨーロッパではEUの単一市場のもとでドイツと中・東欧諸国の間にサプライチェーンが築かれ、東南アジアでもASEAN経済共同体（AEC）やASEAN中国自由貿易協定（ACFTA）による関税撤廃・引き下げを通じて製造業の国際分業が進んでいる。なお、単一通貨（ユーロ）の導入はEUに限られており、メコン川流域では導入されていない。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "日本の夏季の風速の地域分布", "t": "日本の夏季（6〜8月）には、太平洋からの季節風や熱帯低気圧（台風）の影響を受けやすく、海上や沿岸の開けた地点を中心に強風が観測される。1991〜2020年平均の夏季の風速が大きい地点は、南西諸島（那覇を含む）や南鳥島、伊豆諸島などの島嶼部のほか、九州・四国・紀伊半島・関東・北海道などの沿岸部や岬に分散している。山脈を越えて吹き下ろす風の影響を受ける地点もみられる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "日本の冬季の風速の地域分布", "t": "日本の冬季（12〜2月）には、シベリア気団からの北西季節風が吹く。1991〜2020年平均の冬季の風速が大きい地点は、北西季節風が直接吹きつける北海道・東北・北陸の日本海側沿岸をはじめ、太平洋側の岬や伊豆諸島、南鳥島、先島諸島などに分散している。山脈で雪や雨を落とした後の季節風が吹き抜ける風下側や沿岸部でも風速が大きくなる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "日本の夏季の降水量の地域分布", "t": "日本の夏季（6〜8月）には、小笠原気団から吹き出す高温多湿な南東季節風が海上を渡り、日本列島の脊梁山脈にぶつかって上昇気流を生じることで、多量の地形性降雨をもたらす。1991〜2020年平均の夏季の降水量が多い地点は、九州、四国太平洋側、紀伊半島南部、東海地方、屋久島・奄美周辺など、西日本から東日本にかけての太平洋側に集中している。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "日本の冬季の降水量の地域分布", "t": "日本の冬季（12〜2月）には、シベリア気団から吹き出す北西季節風が日本海を渡る際に水蒸気を補給し、列島の脊梁山脈にぶつかって上昇気流となることで、日本海側に多量の降雪・降雨をもたらす。1991〜2020年平均の冬季の降水量が多い地点は、東北南部から北陸、山陰にかけての本州日本海側に集中しているほか、先島諸島や伊豆諸島の一部にも分布している。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "急勾配河川の縦断面と侵食作用", "t": "急峻な山岳地域を源流とし、河口からの距離が約63kmと短い区間で標高約1,530mから海面まで一気に流下する日本の急流河川では、河口付近の約12kmを除き区間全体にわたって勾配が大きく流速が速いため、侵食作用が卓越する区間の割合が大きい。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "中・下流に平野が広がる河川の縦断面と堆積作用", "t": "河口からの距離が約308km、源流付近の標高が約1,360mの大河川では、源流から河口から約200km付近（標高約100m）の上流・山間部までは急勾配で侵食作用が卓越するが、中流域から河口にかけての約150〜200kmにわたる区間では勾配がきわめて緩やかな平野部が続き、流速が低下して堆積作用が卓越する。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "盆地と山間部を通る河川の縦断面", "t": "河口からの距離が約348km、源流付近の標高が約1,480mの大河川では、上流の山間部で急勾配となって侵食作用が卓越した後、河口から約260〜165km付近の中流域（標高約300〜400m）で勾配の緩やかな盆地に流出して堆積作用が卓越する区間となり、その後（河口から約165〜80km付近）再び山間部の急勾配区間に入って侵食作用が強まり、下流の平野へ至る縦断面を示す。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "カール（圏谷）", "t": "標高2,550〜2,855m級の高山地域には、最終氷期に山岳氷河に覆われていた際、氷河の流動によって山地の侵食が進んで形成された、スプーンや椀でえぐられたような半円形の谷であるカール（圏谷）などの氷食地形がみられる。地形図上では急峻な崖（変形地・岩崖）に囲まれた凹状の斜面として表される。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "カルスト地形（ドリーネ）", "t": "石灰岩が分布する台地（三角点標高299.9m付近など）では、二酸化炭素が溶け込んで弱酸性となった雨水が地下に浸透し、石灰岩を溶食して形成されたすり鉢状の凹地であるドリーネや、ドリーネが連結したウバーレなどのカルスト地形が発達する。地形図上では、周囲から窪んだ凹地を示す内向きケバ付きの閉曲線や小凹地の記号が多数分布する。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "V字谷", "t": "山地（標高619〜900m付近など）を流れる河川の上・中流域では、河川による山地の下方侵食や両岸の斜面崩壊が進むことで、断面がV字状の急峻な谷（V字谷）が形成される。地形図上では河川の両側に等高線が密に迫る急斜面として表される。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "湿地が発達した緩斜面", "t": "山地や高原の緩斜面（三角点標高2,145.2m〜標高2,068m付近など）では、等高線の間隔が広いなだらかな地形の上に排水の悪い場所が生じ、小さな池沼（水面）や湿地、荒地、針葉樹林などが点在する高層湿原・湿地帯が発達することがある。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "洪水の浸水想定区域", "t": "集中豪雨や長雨などにより増水した河川が氾濫して生じる洪水では、海岸付近に限らず、内陸部まで河川沿いの低地（氾濫原や谷底低地など）を中心に浸水想定区域が広がる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "高潮の浸水想定区域", "t": "台風の接近時などに気圧低下による海面の吸い上げや強風による吹き寄せによって海面が異常上昇して生じる高潮では、海岸線や河口付近から続く標高の低い沿岸低地を中心に浸水想定区域が広がり、標高の高い丘陵地や内陸の谷奥までは及びにくい。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "GISによる避難施設の立地分析", "t": "自然災害時の避難施設の安全性を検討する際には、地理情報システム（GIS）を用いて地形条件や複数の災害（洪水や高潮など）の浸水想定区域を重ね合わせて分析する手法が有効である。河川沿いに立地する施設は高潮の浸水想定区域外であっても洪水で浸水する可能性があり、海岸近くの低地に立地する施設は洪水の浸水想定区域外であっても高潮で浸水する可能性があるため、双方の浸水想定区域外にあたる高台（丘陵地など）の施設を抽出することで複数災害に対応可能な避難場所を把握できる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "アメリカ合衆国", "t": "アメリカ合衆国では、旺盛な経済活動と自動車中心の生活様式を背景に1人当たりのエネルギー消費と二酸化炭素排出が大きいが、1991年から2021年にかけて1人当たりエネルギー供給量（石油換算）は約8.2キロリットルから約7.0キロリットルへ、1人当たり二酸化炭素排出量は約18.8トンから約13.7トンへとそれぞれ減少した。この背景には、産業構造の中心が製造業からサービス業・金融業・情報関連産業へ移行したことや、エネルギー利用効率の向上などがある。", "b": "日", "y": "2026", "p": "地図", "k": "アメリカ合衆国", "e": "北アメリカ"}, {"n": "韓国", "t": "韓国では、1991年から2021年にかけて1人当たりエネルギー供給量（石油換算）が約2.5キロリットルから約6.1キロリットルへ、1人当たり二酸化炭素排出量が約5.9トンから約10.7トンへと大きく増加した。この期間の急速な経済成長に加え、鉄鋼・造船・石油化学・半導体などのエネルギー多消費型産業が基幹産業として発展したことが背景にある。", "b": "日", "y": "2026", "p": "地図", "k": "韓国", "e": "アジア"}, {"n": "フランス", "t": "フランスでは、1991年から2021年にかけて1人当たりエネルギー供給量（石油換算）が約4.4キロリットルから約3.8キロリットルへ、1人当たり二酸化炭素排出量が約6.3トンから約4.3トンへと減少した。脱工業化が進み観光・金融などのサービス業が経済の中心となっていることや、原子力発電や再生可能エネルギーの利用により化石燃料への依存が抑えられていることが背景にある。", "b": "日", "y": "2026", "p": "地図", "k": "フランス", "e": "ヨーロッパ"}, {"n": "アメリカ合衆国本土", "t": "アメリカ合衆国本土における1991〜2020年の平均降水量を1901〜2000年の平均降水量を100とした指数でみると、西経100度線付近より西側に広がる乾燥・半乾燥地域では指数が95未満や95〜100の減少傾向を示す地域が広く分布する一方、中西部から東部・メキシコ湾岸にかけての湿潤地域では指数が100〜105や105以上の増加傾向を示す地域が広く分布している。農業の持続性を確保する上で、こうした気候・水環境の変化に合わせた適切な水利用が求められている。", "b": "日", "y": "2026", "p": "広域・地域", "k": "アメリカ合衆国本土", "e": "北アメリカ"}, {"n": "カリフォルニア州内陸部（セントラルヴァレー付近）", "t": "アメリカ合衆国西部のカリフォルニア州内陸部（セントラルヴァレー北・中部付近）では、1901〜2000年平均を100とした1991〜2020年の平均降水量指数が100以上と増加傾向にある地域がみられ、山地の河川水や地下水を用いた灌漑用水によって柑橘類などの果樹や野菜が盛んに栽培されている。", "b": "日", "y": "2026", "p": "地図", "k": "カリフォルニア州内陸部", "e": "北アメリカ"}, {"n": "アメリカ合衆国中西部（コーンベルト）", "t": "アメリカ合衆国中西部のコーンベルト（アイオワ州・イリノイ州周辺）では、1901〜2000年平均を100とした1991〜2020年の平均降水量指数が105以上と増加している地域が広く分布しており、大豆やトウモロコシなどの栽培が盛んで、これらの飼料作物と豚などの家畜の飼育を組み合わせた混合農業が行われている。", "b": "日", "y": "2026", "p": "地図", "k": "アメリカ合衆国中西部", "e": "北アメリカ"}, {"n": "アメリカ合衆国メキシコ湾岸（テキサス州沿岸付近）", "t": "アメリカ合衆国南部のメキシコ湾に面するテキサス州南東部沿岸付近では、1901〜2000年平均を100とした1991〜2020年の平均降水量指数が105以上と増加しており、メキシコ湾に襲来する熱帯低気圧（ハリケーン）の数の増加傾向がその一因となっている。", "b": "日", "y": "2026", "p": "地図", "k": "アメリカ合衆国メキシコ湾岸", "e": "北アメリカ"}, {"n": "インドネシア・ジャカルタ", "t": "インドネシアのジャカルタでは、急激な都市人口の集中に伴い、河川沿いなど洪水の発生する可能性が高い居住条件の不利な場所にスラムが形成されている。スラムでは上下水道などのインフラ整備が不十分なため、住民にとって衛生的な水へのアクセスが大きな課題となっており、地下水の過剰な汲み上げによる地盤沈下や洪水の慢性化も衛生環境の悪化を招いている。", "b": "日", "y": "2026", "p": "地図", "k": "インドネシア・ジャカルタ", "e": "アジア"}, {"n": "インドネシア・ジャカルタ", "t": "インドネシアのジャカルタでは、都市中心部で発生する深刻な交通渋滞が円滑な輸送を妨げ、自動車の排ガスによる大気汚染の問題を生じさせている。その対策として、バスの定時性や速達性の確保をめざし、道路上に物理的に区分されたバス専用レーン（バス高速輸送システム：BRT）が導入された。", "b": "日", "y": "2026", "p": "地図", "k": "インドネシア・ジャカルタ", "e": "アジア"}, {"n": "海外における日系企業の拠点分布", "t": "2022年時点の海外における日系企業の拠点は、中国に最も多く、アメリカ合衆国、インド、タイ・ベトナム・インドネシア・マレーシア・シンガポール・フィリピンなどの東南アジア諸国、韓国、台湾、メキシコ、ドイツ・イギリス・フランスなどの西ヨーロッパ諸国、カナダ、オーストラリアにも多く分布している。貿易摩擦への対応や為替リスクの回避、安価な労働力の確保、現地市場の開拓などを目的に企業進出が進められてきた。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "海外における日本のNGO団体数の分布", "t": "2021年時点で、日本のNGO団体が国際協力を実施している国・地域は、フィリピン、カンボジア、ミャンマー、バングラデシュ、ネパール、インドなどの東南アジア・南アジア諸国や、ケニア、ウガンダ、コンゴ民主共和国周辺、西アフリカ諸国などのサハラ以南アフリカ、中東（シリア・パレスチナ周辺）、中米・カリブ海地域など、貧困削減や医療・保健・教育・環境保全といった人道・開発支援のニーズが大きい開発途上国に広く分布するほか、アメリカ合衆国や西ヨーロッパの一部にもみられる。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "日本のODA供与額の地域分布", "t": "2017〜2021年平均の日本の政府開発援助（ODA）は、インドやバングラデシュなどの南アジア、ミャンマー・ベトナム・フィリピン・インドネシア・タイ・カンボジアなどの東南アジアに多く供与されているほか、パキスタン、ウズベキスタン、モンゴル、イラク・ヨルダン・トルコなどの西アジア、エジプトや東アフリカの一部（モザンビーク周辺）などにも供与されており、経済的・外交的な結びつきの強いアジア地域を中心にインフラ整備などの開発協力が行われている。", "b": "日", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "坤輿万国全図", "t": "坤輿万国全図は、世界を表現した古地図で、経緯線が描かれ、アフリカ大陸も表現されている。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "アル・イドリーシーの世界地図", "t": "アル・イドリーシーの世界地図は、円形の古地図で、地図の上方が南にあたり、経緯線は描かれていない。アフリカ大陸も表現されている。12世紀に製作された。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "混一疆理歴代国都之図", "t": "混一疆理歴代国都之図は、朝鮮で15世紀初頭に製作された世界地図で、経緯線は描かれていないが、アフリカ大陸も表現されている。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ロンドン条約（1972年）", "t": "1972年のロンドン条約は、廃棄物の海洋投棄による海洋汚染を防ぐことを目的とした国際協定である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "長距離越境大気汚染に関する協定（1979年）", "t": "1979年の協定は、酸性雨の問題を解決するため、国境を越えて移動する大気汚染物質を統制することを目的とした国際協定である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "モントリオール議定書（1987年）", "t": "1987年のモントリオール議定書は、オゾン層を破壊する物質（フロンやハロンなど）の生産と使用を規制する国際協定である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "パリ協定（2015年）", "t": "2015年のパリ協定は、先進国と開発途上国のすべてが、温室効果ガスの削減義務の履行を含む包括的な対応に参加するよう定めた国際協定である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "イギリス・ロンドン", "t": "世界で産業革命が最初に始まった国は、イギリスで、その首都はロンドンである。", "b": "韓", "y": "2026", "p": "地図", "k": "イギリス・ロンドン", "e": "ヨーロッパ"}, {"n": "カナダ・オタワ", "t": "カナダは、アメリカ合衆国、メキシコとともに、北米自由貿易協定（NAFTA）を結んだ国で、首都はオタワである。", "b": "韓", "y": "2026", "p": "地図", "k": "カナダ・オタワ", "e": "北アメリカ"}, {"n": "フランス・パリ", "t": "フランスは、大西洋と地中海の両方に面した国で、首都はパリである。", "b": "韓", "y": "2026", "p": "地図", "k": "フランス・パリ", "e": "ヨーロッパ"}, {"n": "ベトナム・ハロン湾", "t": "北半球のベトナム北部にあるハロン湾は、海から塔のようにそびえ立つ峰々があり、その一部には、鍾乳石などがある洞窟が発達している。塔のような峰は、基盤岩が差別的な侵食と溶食を受けて形成された。「ハロン」は「龍が降りた場所」という意味で、空から龍が降りて宝石を吐き出して島になったという伝説がある。", "b": "韓", "y": "2026", "p": "地図", "k": "ベトナム・ハロン湾", "e": "アジア"}, {"n": "マダガスカル・グラン・チンギ", "t": "南半球のマダガスカルにあるグラン・チンギは、とがった石の柱が森のように広がる景観で、この地域の基盤岩が溶食を経て、硬い部分だけが残って形成された。基盤岩の主成分は炭酸カルシウムで、カレン（溶食による地形）を見ることができる。「チンギ」は「素足で歩けない場所」という意味である。", "b": "韓", "y": "2026", "p": "地図", "k": "マダガスカル・グラン・チンギ", "e": "アフリカ"}, {"n": "トルコ・パムッカレ", "t": "北半球のトルコにあるパムッカレは、階段状の地形と水色の温泉水が織りなす景観で有名である。階段状の地形は、溶岩の噴出ではなく、温泉水に溶けた炭酸カルシウムが沈殿して形成された。「パムッカレ」は「綿の城」という意味で、層をなして積み重なった白い地形にふさわしい地名である。", "b": "韓", "y": "2026", "p": "地図", "k": "トルコ・パムッカレ", "e": "アジア"}, {"n": "オーストラリア南西岸", "t": "オーストラリア南西岸は、夏の1月に乾燥し、冬の7月に降水が多い地中海性の気候を示す。", "b": "韓", "y": "2026", "p": "地図", "k": "オーストラリア南西岸", "e": "オセアニア"}, {"n": "南アメリカ南東岸", "t": "南アメリカ南東岸は、温暖湿潤気候を示し、南半球の夏にあたる1月に降水が多く、冬の7月にも降水がある。", "b": "韓", "y": "2026", "p": "広域・地域", "k": "南アメリカ南東岸", "e": "南アメリカ"}, {"n": "北アメリカ北西部", "t": "北アメリカ北西部は、高緯度の冷涼な内陸の気候で、冬の1月も夏の7月も降水量が少ない。", "b": "韓", "y": "2026", "p": "広域・地域", "k": "北アメリカ北西部", "e": "北アメリカ"}, {"n": "世界の再生可能エネルギーの構成", "t": "2023年の世界の再生可能エネルギーの発電量の構成は、水力が約51%で最も多く、風力が約28%、太陽光・太陽熱が約20%、地熱が約1%である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "オセアニアの再生可能エネルギーの構成", "t": "2023年のオセアニアの再生可能エネルギーの発電量の構成は、水力が約34%、風力が約26%、太陽光・太陽熱が約33%、地熱が約7%である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ヨーロッパの再生可能エネルギーの構成", "t": "2023年のヨーロッパの再生可能エネルギーの発電量の構成は、水力が約47%、風力が約35%、太陽光・太陽熱が約17%、地熱が約1%である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "中国", "t": "中国は、水力発電の発電量が世界有数の国である。", "b": "韓", "y": "2026", "p": "地図", "k": "中国", "e": "アジア"}, {"n": "ノルウェー", "t": "ノルウェーの再生可能エネルギーは、風力発電よりも水力発電の発電量のほうが多い。", "b": "韓", "y": "2026", "p": "地図", "k": "ノルウェー", "e": "ヨーロッパ"}, {"n": "ドイツ", "t": "ドイツは、風力発電の発電量が多い国の一つである。", "b": "韓", "y": "2026", "p": "地図", "k": "ドイツ", "e": "ヨーロッパ"}, {"n": "地熱発電", "t": "地熱発電の発電量が世界で最も多い国は、北アメリカにあるアメリカ合衆国である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ミャンマー・ヤンゴン", "t": "ミャンマーにはイラワジ川が流れる。イラワジ川下流のヤンゴンは、過去から長い間首都で、首都がネピドーに移った現在も、人口が最も多い都市で、経済と文化の中心地である。ミャンマーでは、ロヒンギャ族への差別と抑圧が行わ 韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "ブラジル", "t": "2022年に、ブラジルの鉄鉱石の生産量は世界全体の約17%を占めた。南アメリカ大陸にある。", "b": "韓", "y": "2026", "p": "地図", "k": "ブラジル", "e": "南アメリカ"}, {"n": "南アフリカ共和国", "t": "2022年に、南アフリカ共和国の鉄鉱石の生産量は世界全体の約2.5%（第2位）、宝石用ダイヤモンドの生産量は世界全体の約5%（第3位）である。この国では、かつて人種差別政策のアパルトヘイトが施行されていた。", "b": "韓", "y": "2026", "p": "地図", "k": "南アフリカ共和国", "e": "アフリカ"}, {"n": "チリ（チュキカマタ鉱山）", "t": "2022年に、チリの銅の生産量は世界全体の約24%を占めた。チリには、チュキカマタ鉱山がある。南アメリカ大陸にある。", "b": "韓", "y": "2026", "p": "地図", "k": "チリ", "e": "南アメリカ"}, {"n": "アフリカのダイヤモンド産出国（ボツワナ・アンゴラ）", "t": "2022年に、宝石用ダイヤモンドの生産量は、ボツワナが世界全体の約29%で第1位、アンゴラが約12%で第2位である。", "b": "韓", "y": "2026", "p": "広域・地域", "k": "アフリカのダイヤモンド産出国", "e": "アフリカ"}, {"n": "パキスタン", "t": "パキスタンの村落人口は、1970年の約4,000万人から2020年の約1.3億人へと、3倍以上に増えた。人口密度は、1970年の約80人/km²から2020年の約300人/km²へと、大きく上がった。", "b": "韓", "y": "2026", "p": "地図", "k": "パキスタン", "e": "アジア"}, {"n": "ブラジル", "t": "ブラジルの村落人口は、1970年の約4,200万人から2020年の約2,700万人へと減った。人口密度は、1970年の約11人/km²から2020年の約25人/km²へと、緩やかに上がった。この間に、都市化が急速に進んだ。", "b": "韓", "y": "2026", "p": "地図", "k": "ブラジル", "e": "南アメリカ"}, {"n": "ドイツ", "t": "ドイツの村落人口は、1970年の約2,200万人から2020年の約1,900万人へと、ほぼ横ばいで推移した。人口密度は、1970年の約220人/km²から2020年の約240人/km²へと、ほぼ横ばいで推移した。少子高齢化が進んでいる。", "b": "韓", "y": "2026", "p": "地図", "k": "ドイツ", "e": "ヨーロッパ"}, {"n": "チャド", "t": "チャドの村落人口は、1970年の約300万人から2020年の約1,100万人へと増えた。人口密度は、1970年の約3人/km²から2020年の約13人/km²へと、4倍以上に増えた。", "b": "韓", "y": "2026", "p": "地図", "k": "チャド", "e": "アフリカ"}, {"n": "中央アジア", "t": "中央アジアの乾燥・半乾燥地域では、遊牧が行われ、移動式の伝統家屋であるユルト（ゲル）がみられる。", "b": "韓", "y": "2026", "p": "広域・地域", "k": "中央アジア", "e": "アジア"}, {"n": "チベット高原", "t": "中国南西部のチベット高原は、標高が非常に高いため低温で、低・中緯度にありながら、永久凍土層が分布する。", "b": "韓", "y": "2026", "p": "地図", "k": "チベット高原", "e": "アジア"}, {"n": "北アメリカ北部（カナダ）", "t": "北アメリカ北部のカナダの内陸部には、針葉樹林が広大に連なるタイガ地帯がある。", "b": "韓", "y": "2026", "p": "広域・地域", "k": "北アメリカ北部", "e": "北アメリカ"}, {"n": "ブラジル東部（南緯約10度の沿岸）", "t": "南アメリカ大陸の東岸、ブラジル東部の沿岸（南緯約10度付近）は、熱帯に属する地域である。", "b": "韓", "y": "2026", "p": "地図", "k": "ブラジル東部", "e": "南アメリカ"}, {"n": "カナート（伝統的な地下灌漑水路）", "t": "カナートは、乾燥地域で、山麓の地下水を、蒸発による水の損失を抑えながら農地や集落に導く、伝統的な地下灌漑水路である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "大陸別の穀物の生産と国際移動", "t": "2023年の大陸（地域）別の穀物の生産量は、アジアが最も多く、次いでアメリカ（南北アメリカ）、ヨーロッパの順である。アジアは、穀物の輸入量が輸出量より多い純輸入地域で、アメリカとヨーロッパは、輸出量が輸入量より多い純輸出地域である。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "インド", "t": "インドは、2023年に、アジアの代表的な穀物の純輸出国である。小麦の生産量が多い。ヒンドゥー教徒が多く、牛の飼育頭数が多い。", "b": "韓", "y": "2026", "p": "地図", "k": "インド", "e": "アジア"}, {"n": "中国", "t": "中国は、2023年に、アジアの代表的な穀物の純輸入国である。", "b": "韓", "y": "2026", "p": "地図", "k": "中国", "e": "アジア"}, {"n": "フランス", "t": "フランスは、2023年に、ヨーロッパの代表的な穀物の純輸出国である。小麦の輸出量が多い。", "b": "韓", "y": "2026", "p": "地図", "k": "フランス", "e": "ヨーロッパ"}, {"n": "スペイン", "t": "スペインは、2023年に、ヨーロッパの代表的な穀物の純輸入国である。", "b": "韓", "y": "2026", "p": "地図", "k": "スペイン", "e": "ヨーロッパ"}, {"n": "インド", "t": "インドでは、信者数が第1位の宗教はヒンドゥー教、第2位はイスラームである。", "b": "韓", "y": "2026", "p": "地図", "k": "インド", "e": "アジア"}, {"n": "バングラデシュ", "t": "バングラデシュでは、信者数が第1位の宗教はイスラーム、第2位はヒンドゥー教である。", "b": "韓", "y": "2026", "p": "地図", "k": "バングラデシュ", "e": "アジア"}, {"n": "スリランカ", "t": "スリランカでは、多数派のシンハラ族が主に信仰する仏教が、信者数が第1位の宗教で、第2位はヒンドゥー教である。", "b": "韓", "y": "2026", "p": "地図", "k": "スリランカ", "e": "アジア"}, {"n": "ナイジェリア北部", "t": "ナイジェリア北部の住民が主に信じる宗教は、イスラームである。", "b": "韓", "y": "2026", "p": "地図", "k": "ナイジェリア北部", "e": "アフリカ"}, {"n": "トルコ南東部", "t": "2023年2月6日に、トルコ南東部で規模7.8の地震が発生した。この地域は、アルプス・ヒマラヤ造山帯の付近に位置する。", "b": "韓", "y": "2026", "p": "地図", "k": "トルコ南東部", "e": "アジア"}, {"n": "日本列島中部（能登半島周辺）", "t": "2024年1月1日に、能登半島で能登半島地震が発生した。規模は米国地質調査所で7.5（気象庁で7.6）、最大震度は7である。", "b": "韓", "y": "2026", "p": "地図", "k": "日本列島中部", "e": "日本"}, {"n": "フィリピン南部（ミンダナオ島周辺）", "t": "2023年12月2日に、フィリピン南部のミンダナオ島沖で規模7.6の地震が発生した。この地域は、太平洋を取り巻く環太平洋造山帯（「火の環」）に属する。", "b": "韓", "y": "2026", "p": "地図", "k": "フィリピン南部", "e": "アジア"}, {"n": "アラスカ半島沖", "t": "2021年7月29日に、アラスカ半島沖で規模8.2の地震が発生した。", "b": "韓", "y": "2026", "p": "地図", "k": "アラスカ半島沖", "e": "海洋"}, {"n": "チリ中部沖", "t": "2015年9月16日に、チリ中部沖で規模8.3の地震が発生した。この地域は、海洋プレートが大陸プレートの下に沈み込む収束境界に位置する。", "b": "韓", "y": "2026", "p": "地図", "k": "チリ中部沖", "e": "海洋"}, {"n": "アメリカ・カリフォルニア州（サンアンドレアス断層）", "t": "サンアンドレアス断層は、北アメリカ西部のカリフォルニア州を通る断層で、北アメリカプレートと太平洋プレートがすれ違う境界にあたる。", "b": "韓", "y": "2026", "p": "地図", "k": "アメリカ・カリフォルニア州", "e": "北アメリカ"}, {"n": "アトラス山脈（北西アフリカ）", "t": "アトラス山脈は、アフリカ北西部にある山脈で、アルプス・ヒマラヤ造山帯の西部にあたる。", "b": "韓", "y": "2026", "p": "地図", "k": "アトラス山脈", "e": "アフリカ"}, {"n": "アメリカ合衆国・サンフランシスコ", "t": "アメリカ合衆国のサンフランシスコは、ロサンゼルスまで559km、ヒューストンまで2,648km、シカゴまで2,992km、ニューヨークまで4,139km、ボストンまで4,344kmの距離にある。", "b": "韓", "y": "2026", "p": "地図", "k": "アメリカ合衆国・サンフランシスコ", "e": "北アメリカ"}, {"n": "アメリカ合衆国・ロサンゼルス", "t": "アメリカ合衆国のロサンゼルスには、世界の映画産業の中心地であるハリウッドがある。サンフランシスコまで559km、ヒューストンまで2,210km、シカゴまで2,809km、ニューヨークまで3,944km、ボストンまで4,179kmの距離にある。", "b": "韓", "y": "2026", "p": "地図", "k": "アメリカ合衆国・ロサンゼルス", "e": "北アメリカ"}, {"n": "アメリカ合衆国・ヒューストン", "t": "アメリカ合衆国のヒューストンは、サンベルト地域の都市で、石油化学工業が発達している。シカゴまで1,514km、ロサンゼルスまで2,210km、ニューヨークまで2,284km、ボストンまで2,584km、サンフランシスコまで2,648kmの距離にある。", "b": "韓", "y": "2026", "p": "地図", "k": "アメリカ合衆国・ヒューストン", "e": "北アメリカ"}, {"n": "アメリカ合衆国・シカゴ", "t": "アメリカ合衆国のシカゴは、五大湖沿岸の都市で、内陸交通の中心地である。ニューヨークまで1,147km、ボストンまで1,369km、ヒューストンまで1,514km、ロサンゼルスまで2,809km、サンフランシスコまで2,992kmの距離にある。ニューヨークとボストンの間は307kmである。", "b": "韓", "y": "2026", "p": "地図", "k": "アメリカ合衆国・シカゴ", "e": "北アメリカ"}, {"n": "エジプト", "t": "エジプトは、アフリカ北東部にあり、紅海と地中海に面する。国土をナイル川が南北に貫き、地中海と紅海を結ぶスエズ運河がある。", "b": "韓", "y": "2026", "p": "地図", "k": "エジプト", "e": "アフリカ"}, {"n": "カザフスタン", "t": "カザフスタンは、中央アジアの国で、海に面しない世界最大の内陸国である。", "b": "韓", "y": "2026", "p": "地図", "k": "カザフスタン", "e": "アジア"}, {"n": "サウジアラビア", "t": "サウジアラビアは、アラビア半島にあり、紅海とペルシア湾に面する。世界有数の化石エネルギー資源の産出国である。", "b": "韓", "y": "2026", "p": "地図", "k": "サウジアラビア", "e": "アジア"}, {"n": "コロンビア（ボゴタ）", "t": "南アメリカ北部のコロンビアは、海に面した国である。首都で人口が最大の首位都市ボゴタは、赤道に近い北緯約5度にあり、アンデス山脈中の高地（標高約2,640m）に位置する。", "b": "韓", "y": "2026", "p": "地図", "k": "コロンビア", "e": "南アメリカ"}, {"n": "ボリビア（ラパス）", "t": "南アメリカ中部のボリビアは、海に面しない内陸国である。首都（ラパス）は、南緯約16度付近にある。", "b": "韓", "y": "2026", "p": "地図", "k": "ボリビア", "e": "南アメリカ"}, {"n": "ブラジル（サンパウロ）", "t": "ブラジルは、南アメリカで国土面積が最も広い国で、旧ポルトガル植民地であった歴史から、主にポルトガル語が使われている。人口が最大の首位都市は、サンパウロである。", "b": "韓", "y": "2026", "p": "地図", "k": "ブラジル", "e": "南アメリカ"}, {"n": "アルゼンチン", "t": "アルゼンチンは、南アメリカ南部の国で、国土面積は南アメリカで2番目に広い。トウモロコシの輸出量が輸入量より多い。", "b": "韓", "y": "2026", "p": "地図", "k": "アルゼンチン", "e": "南アメリカ"}, {"n": "トルコ・イスタンブール", "t": "地中海と黒海に面したトルコは、アジアとヨーロッパをつなぐ地理的な利点から、早くから交易と文化交流の要衝として発展した。経済・文化の中心地で人口が最大の都市イスタンブールは、ボスポラス海峡の両岸にある。", "b": "韓", "y": "2026", "p": "地図", "k": "トルコ・イスタンブール", "e": "アジア"}, {"n": "イラン・テヘラン", "t": "カスピ海とペルシア湾の両方に面したイランは、早くから古代文明が発達した。人口が最大の都市テヘランは、自動車や電子産業が発達し、エルブルズ山脈の南麓にある。イランとアラビア半島の間にあるホルムズ海峡は、エネルギー資源の主要な輸送路として利用される。イスラームでは、シーア派がスンナ派より多い。", "b": "韓", "y": "2026", "p": "地図", "k": "イラン・テヘラン", "e": "アジア"}, {"n": "カタール・ドーハ", "t": "カタールは、化石エネルギー資源の発見によって急速に成長した、ペルシア湾に突き出た半島国で、陸では南のサウジアラビア、海では西のバーレーンと接している。人口が最大の都市ドーハは、金融と物流の中心地で、国際会議やスポーツの行事を開く。", "b": "韓", "y": "2026", "p": "地図", "k": "カタール・ドーハ", "e": "アジア"}, {"n": "ブラジル北東部", "t": "ブラジル北東部は、7月よりも1月に、赤道（熱帯）収束帯の影響を多く受ける。", "b": "韓", "y": "2026", "p": "地図", "k": "ブラジル北東部", "e": "南アメリカ"}, {"n": "アメリカ西海岸（カリフォルニア）", "t": "アメリカ西海岸のカリフォルニアは、北半球の夏（6〜8月）の降水量が少なく、特に7月は乾燥する。", "b": "韓", "y": "2026", "p": "広域・地域", "k": "アメリカ西海岸", "e": "北アメリカ"}, {"n": "南極", "t": "南極は、1月に昼が長く、気温の年較差が大きい。", "b": "韓", "y": "2026", "p": "広域・地域", "k": "南極", "e": "南極"}, {"n": "オーストラリア南東部", "t": "オーストラリア南東部は、南半球の夏（12〜2月）にも降水がある。", "b": "韓", "y": "2026", "p": "地図", "k": "オーストラリア南東部", "e": "オセアニア"}, {"n": "バングラデシュ周辺", "t": "バングラデシュ周辺（ベンガル湾北部）は、北半球の夏の降水量が多く、年降水量も多い。", "b": "韓", "y": "2026", "p": "地図", "k": "バングラデシュ周辺", "e": "アジア"}, {"n": "イギリス", "t": "イギリスは、1月の昼の長さが短く、7月にも降水がある。", "b": "韓", "y": "2026", "p": "地図", "k": "イギリス", "e": "ヨーロッパ"}, {"n": "イギリス・シリコン・グレン（グラスゴー・エディンバラ一帯）", "t": "イギリスのスコットランドのグラスゴーとエディンバラの一帯にある先端産業クラスターは、「電子産業に必要な原料物質（シリコン）」と「渓谷（グレン）」の意味を合わせて、「シリコン・グレン」と呼ばれる。この地域は、産業化の初期には、造船と製鉄が発達していたが、電子と半導体の企業が入って、この名称を得た。", "b": "韓", "y": "2026", "p": "地図", "k": "イギリス・シリコン・グレン", "e": "ヨーロッパ"}, {"n": "フランス・ソフィア・アンティポリス（カンヌ・ニース近郊）", "t": "フランス南東部の地中海沿岸のカンヌやニースに近いソフィア・アンティポリスは、大学や多様な研究機関があり、優秀な専門人材を確保しやすい。産・学・研が調和する先端産業クラスターに発展し、多国籍企業を誘致している。", "b": "韓", "y": "2026", "p": "地図", "k": "フランス・ソフィア・アンティポリス", "e": "ヨーロッパ"}, {"n": "直線基線と通常基線（領海の基線）", "t": "韓国の領海は、多島海である黄海と南海、および東海の一部の湾では、最外郭の島などの基点を結ぶ直線基線から測り、直線基線の内側は内水となる。東海岸の大部分と、済州島・鬱陵島・独島では、干潮時の海岸線を基準とする通常基線を適用する。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "日の出時刻と経度", "t": "同じ日の日の出の時刻は、経度が東の地点ほど早く、西の地点ほど遅い。韓国の領域は東経127度30分から東経131度52分22秒までの範囲を含み、この範囲の中では東側の地点ほど早く日の出を迎える。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "馬羅島（済州特別自治道西帰浦市）", "t": "済州島の南にある馬羅島は、韓国の領土の最南端で、北緯33度06分付近に位置する。", "b": "韓", "y": "2026", "p": "地図", "k": "馬羅島", "e": "アジア"}, {"n": "独島（東海）", "t": "東海にある独島は、韓国の領土の最東端で、東経131度52分22秒に位置する。", "b": "韓", "y": "2026", "p": "地図", "k": "独島", "e": "アジア"}, {"n": "虎尾串（慶尚北道浦項市）", "t": "慶尚北道の東海岸にある虎尾串は、朝鮮半島の東南端に突き出た岬で、韓国の領海を測る直線基線の基点が置かれている。", "b": "韓", "y": "2026", "p": "地図", "k": "虎尾串", "e": "アジア"}, {"n": "韓国東海岸・楓湖（江原特別自治道江陵市）", "t": "韓国の東海岸にあった石湖（潟湖）の一つ、楓湖は、火力発電所の廃棄物の埋め立てとゴルフ場の建設によって消滅した。石湖は、後氷期の海面上昇の際に湾の入り口が砂州で塞がれて形成された潟湖である。", "b": "韓", "y": "2026", "p": "地図", "k": "韓国東海岸・楓湖", "e": "アジア"}, {"n": "防波堤による砂の移動の変化と砂浜の侵食", "t": "近年に建設された防波堤によって、沿岸の砂の移動の均衡が崩れ、一部の区間で砂浜（砂の海岸）の侵食が起こっている。2017年と2024年の航空写真を比べると、この間に海岸線が後退していることが確認できる。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "海岸砂丘", "t": "海岸砂丘は、砂浜の砂が風で運ばれて堆積してできる地形である。地表面の堆積物は風選を受けるため、砂浜の砂よりも平均粒径が小さい。海岸砂丘も、近年は侵食が起こっている。内部には、海水よりも塩分濃度がはるかに低い淡水の地下水がある。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "突堤（グロイン）", "t": "突堤（グロイン）は、海岸に直角に突き出して設置され、沿岸流による砂の移動と流出を抑えて、侵食を緩和するための施設である。ただし、設置後も侵食が続いている事例がある。", "b": "韓", "y": "2026", "p": "用語・概念", "k": "", "e": ""}, {"n": "2024年の韓国の記録的高温", "t": "韓国気象庁の観測によると、2024年の韓国の年平均気温は14.5℃で、平年より2.0℃高く、従来の最高だった2023年の13.7℃を0.8℃上回って、観測を始めてから113年で最も暑い年となった。すべての月で月平均気温が平年を上回り、2月、4月、6月、8月、9月の5か月で歴代1位となった。周辺の海面水温も18.6℃で、最近10年の function badgeKinds(pin) { return Object.keys(pin.バッジ).map(s => s.charAt(0)); }
function uniq(a) { return Array.from(new Set(a)); }
function makeIcon(pin) {
  const kinds = uniq(badgeKinds(pin));
  const multi = kinds.length > 1;
  const size = multi ? PIN_SIZE_MULTI : PIN_SIZE;
  const color = multi ? MULTI_COLOR : (BADGE_COLOR[kinds[0]] || MULTI_COLOR);
  const label = multi ? String(kinds.length) : kinds[0];
  return L.divIcon({ className: '', iconSize: [size, size],
    html: '<div class="pin ' + pin.粒度 + '" style="width:' + size + 'px;height:' + size + 'px;background:' + color + '">' + label + '</div>' });
}
DATA.pins.forEach(pin => {
  const m = L.marker([pin.緯度, pin.経度], { icon: makeIcon(pin) });
  m.bindTooltip(pin.地名, { direction: 'top', offset: [0, -8] });
  m.on('click', () => selectPin(pin.地名, false));
  markers[pin.地名] = m;
});

function chipsFor(map_) {
  const wrap = document.createElement('div'); wrap.className = 'chips';
  Object.keys(map_).forEach(b => {
    const c = document.createElement('span'); c.className = 'chip';
    c.style.background = BADGE_COLOR[b.charAt(0)] || MULTI_COLOR;
    c.textContent = b.charAt(0) + ' ' + b.slice(1) + (map_[b] > 1 ? ' ×' + map_[b] : '');
    wrap.appendChild(c);
  });
  return wrap;
}
function recBadges(recs) { const o = {}; recs.forEach(r => { const k = r.b + r.y; o[k] = (o[k] || 0) + 1; }); return o; }
function textBlock(r) { const d = document.createElement('div'); d.className = 'txt'; d.textContent = r.t; return d; }

}
function renderMarkers() {
  DATA.pins.forEach(pin => {

    if (pinVisible(pin)) { if (!map.hasLayer(m)) m.addTo(map); } else if (map.hasLayer(m)) map.removeLayer(m);
  });
}
function renderCards() {
  cardsEl.innerHTML = '';
  if (state.tab === 'map') {
    const pins = DATA.pins.filter(pinVisible);
    const n = document.createElement('div'); n.className = 'note';
    n.textContent = pins.length + ' 地点を表示中（バッジ＝出典の国と年）';
    cardsEl.appendChild(n);
    pins.forEach(pin => {
      const card = document.createElement('div'); card.className = 'card'; card.id = 'card-' + pin.地名;

      const tag = document.createElement('span'); tag.className = 'lvtag'; tag.textContent = LEVEL_LABEL[pin.粒度];

      card.appendChild(chips);

        const head = document.createElement('div'); head.className = 'subhead';
        head.appendChild(chipsFor(recBadges([r])));
        const nm = document.createElement('span'); nm.className = 'subname'; nm.textContent = r.n;

        sub.appendChild(head); sub.appendChild(textBlock(r)); card.appendChild(sub);

      card.appendChild(chipsFor(recBadges([r]))); card.appendChild(textBlock(r));
      cardsEl.appendChild(card);
    });
  }
}
function selectPin(name, fly) {
  state.sel = name;
  document.querySelectorAll('.pin.sel').forEach(e => e.classList.remove('sel'));
  const m = markers[name];
  if (m && m.getElement()) { const p = m.getElement().querySelector('.pin'); if (p) p.classList.add('sel'); }
  if (state.tab !== 'map') { setTab('map'); }
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.id === 'card-' + name));
  const el = document.getElementById('card-' + name);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (fly && m) map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 4), { duration: 0.9 });
}

  state.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  renderCards();
}
function setArea(a) {
  state.area = a;

  map.fitBounds(AREA_BOUNDS[a]);
}
const areasEl = document.getElementById('areas');
