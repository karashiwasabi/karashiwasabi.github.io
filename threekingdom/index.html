者はみな圧倒されて逃げ散り、ようやく陣営を脱出することができた；このとき反乱に加わらなかった者は五百余人であった」。", "persons": "曹操", "places": "", "era_year": "初平元年（190年）", "source_book": "魏書", "keywords": "龍亢の兵変", "raw_tagged": "{{special:引用史料|《魏書》}}曰：兵謀叛，夜燒{{person:曹操|太祖}}帳，{{person:曹操|太祖}}手劔殺數十人，餘皆披靡，乃得出營；其不叛者五百餘人。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「兵は叛を謀り、夜に{{person:曹操|太祖}}の帳を焼くに、{{person:曹操|太祖}}は手剣して数十人を殺し、余は皆披靡し、乃ち営を出づるを得たり；其の叛かざる者は五百余人なり」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「兵士たちが反乱を企て、夜中に{{person:曹操|太祖}}の幕舎に火を放ったが、{{person:曹操|太祖}}は自ら剣を振るって数十人を斬り殺したため、残りの者はみな圧倒されて逃げ散り、ようやく陣営を脱出することができた；このとき反乱に加わらなかった者は五百余人であった」。"}, {"id": "v1_p9_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 9, "type": "本文", "raw_text": "至銍、建平，復收兵得千餘人，進屯河內。", "kakikudashi": "銍・建平に至り、復た兵を収めて千余人を得、進みて河内に屯す。", "translation": "銍・建平に至って、再び兵を集めて千余人を得ると、進んで河内に駐屯した。", "persons": "曹操", "places": "銍,建平,河内", "era_year": "初平元年（190年）", "source_book": "", "keywords": "", "raw_tagged": "至{{place:銍|銍}}、{{place:建平|建平}}，復收兵得千餘人，進屯{{place:河内|河內}}。", "kakikudashi_tagged": "{{place:銍|銍}}・{{place:建平|建平}}に至り、復た兵を収めて千余人を得、進みて{{place:河内|河内}}に屯す。", "translation_tagged": "{{place:銍|銍}}・{{place:建平|建平}}に至って、再び兵を集めて千余人を得ると、進んで{{place:河内|河内}}に駐屯した。"}, {"id": "v1_p10_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 10, "type": "本文", "raw_text": "劉岱與橋瑁相惡，岱殺瑁，以王肱領東郡太守。", "kakikudashi": "劉岱と橋瑁と相悪み、岱は瑁を殺し、王肱を以て東郡太守を領せしむ。", "translation": "劉岱と橋瑁は互いに憎み合い、劉岱は橋瑁を殺害して、王肱に東郡太守を兼領させた。", "persons": "劉岱,橋瑁,王肱", "places": "東郡", "era_year": "初平元年（190年）", "source_book": "", "keywords": "東郡太守", "raw_tagged": "{{person:劉岱|劉岱}}與{{person:橋瑁|橋瑁}}相惡，{{person:劉岱|岱}}殺{{person:橋瑁|瑁}}，以{{person:王肱|王肱}}領{{place:東郡|東郡}}{{office:太守|太守}}。", "kakikudashi_tagged": "{{person:劉岱|劉岱}}と{{person:橋瑁|橋瑁}}と相悪み、{{person:劉岱|岱}}は{{person:橋瑁|瑁}}を殺し、{{person:王肱|王肱}}を以て{{place:東郡|東郡}}{{office:太守|太守}}を領せしむ。", "translation_tagged": "{{person:劉岱|劉岱}}と{{person:橋瑁|橋瑁}}は互いに憎み合い、{{person:劉岱|劉岱}}は{{person:橋瑁|橋瑁}}を殺害して、{{person:王肱|王肱}}に{{place:東郡|東郡}}{{office:太守|太守}}を兼領させた。"}, {"id": "v1_p11_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 11, "type": "本文", "raw_text": "袁紹與韓馥謀立幽州牧劉虞爲帝，太祖拒之。", "kakikudashi": "袁紹は韓馥と幽州牧の劉虞を立てて帝と為さんと謀るも、太祖は之を拒む。", "translation": "袁紹は韓馥とともに幽州牧の劉虞を擁立して皇帝に立てようと謀ったが、太祖はこれを拒絶した。", "persons": "袁紹,韓馥,劉虞,曹操", "places": "幽州", "era_year": "初平2年（191年）春", "source_book": "", "keywords": "幽州牧", "raw_tagged": "{{person:袁紹|袁紹}}與{{person:韓馥|韓馥}}謀立{{place:幽州|幽州}}{{office:牧|牧}}{{person:劉虞|劉虞}}爲帝，{{person:曹操|太祖}}拒之。", "kakikudashi_tagged": "{{person:袁紹|袁紹}}は{{person:韓馥|韓馥}}と{{place:幽州|幽州}}{{office:牧|牧}}の{{person:劉虞|劉虞}}を立てて帝と為さんと謀るも、{{person:曹操|太祖}}は之を拒む。", "translation_tagged": "{{person:袁紹|袁紹}}は{{person:韓馥|韓馥}}とともに{{place:幽州|幽州}}{{office:牧|牧}}の{{person:劉虞|劉虞}}を擁立して皇帝に立てようと謀ったが、{{person:曹操|太祖}}はこれを拒絶した。"}, {"id": "v1_p11_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 11, "type": "裴注", "raw_text": "《魏書》載太祖荅紹曰：「董卓之罪，暴於四海，吾等合大衆興義兵，遠近莫不響應，此以義動故也。今幼主微弱，制於姦臣，未有昌邑亡國之釁，而一旦改易，天下其孰安之？諸君北面，我自西向。」", "kakikudashi": "『魏書』に太祖が紹に答うるを載せて曰く、「董卓の罪は、四海に暴され、吾等は大衆を合わせて義兵を興し、遠近は響応せざる莫きは、此れ義を以て動くが故なり。今、幼主は微弱にして、姦臣に制せらるるも、未だ昌邑の亡国の釁有らざるに、一旦にして改易せば、天下は其れ孰か之に安んぜん？諸君は北面せよ、我は自ら西向せん」と。", "translation": "『魏書』には太祖が袁紹に答えた言葉を載せていう、「董卓の罪悪は天下に知れ渡っており、我らが大軍を結集して義兵を興すと遠近こぞって呼応したのは、大義によって動いたからである。いま幼主は微弱で姦臣に抑え込まれているとはいえ、いまだ昌邑王のような国を滅ぼすほどの過失はないのに、一朝にして君主をすげ替えれば、天下の誰がこれに納得しようか？諸君は北面して仕えるがよい、私はひとり西に向かおう」。", "persons": "曹操,袁紹,董卓,献帝,劉賀", "places": "", "era_year": "初平2年（191年）春", "source_book": "魏書", "keywords": "昌邑,諸君北面", "raw_tagged": "{{special:引用史料|《魏書》}}載{{person:曹操|太祖}}荅{{person:袁紹|紹}}曰：「{{person:董卓|董卓}}之罪，暴於四海，吾等合大衆興義兵，遠近莫不響應，此以義動故也。今{{person:献帝|幼主}}微弱，制於姦臣，未有{{person:劉賀|昌邑}}亡國之釁，而一旦改易，天下其孰安之？{{special:諸君北面|諸君北面，我自西向}}。」", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に{{person:曹操|太祖}}が{{person:袁紹|紹}}に答うるを載せて曰く、「{{person:董卓|董卓}}の罪は、四海に暴され、吾等は大衆を合わせて義兵を興し、遠近は響応せざる莫きは、此れ義を以て動くが故なり。今、{{person:献帝|幼主}}は微弱にして、姦臣に制せらるるも、未だ{{person:劉賀|昌邑}}の亡国の釁有らざるに、一旦にして改易せば、天下は其れ孰か之に安んぜん？{{special:諸君北面|諸君は北面せよ、我は自ら西向せん}}」と。", "translation_tagged": "{{special:引用史料|『魏書』}}には{{person:曹操|太祖}}が{{person:袁紹|袁紹}}に答えた言葉を載せていう、「{{person:董卓|董卓}}の罪悪は天下に知れ渡っており、我らが大軍を結集して義兵を興すと遠近こぞって呼応したのは、大義によって動いたからである。いま{{person:献帝|幼主}}は微弱で姦臣に抑え込まれているとはいえ、いまだ{{person:劉賀|昌邑王}}のような国を滅ぼすほどの過失はないのに、一朝にして君主をすげ替えれば、天下の誰がこれに納得しようか？{{special:諸君北面|諸君は北面して仕えるがよい、私はひとり西に向かおう}}」。"}, {"id": "v1_p11_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 11, "type": "本文", "raw_text": "紹又甞得一玉印，於太祖坐中舉向其肘，太祖由是笑而惡焉。", "kakikudashi": "紹は又た嘗て一玉印を得、太祖の坐中に於いて挙げて其の肘に向かわせ、太祖は是に由りて笑いて焉を悪む。", "translation": "袁紹はまたかつて一つの玉印を手に入れ、太祖と同席した際にそれを掲げて自分の肘の方へ向けたため、太祖はこれによって表面では笑いつつも内心では彼を憎んだ。", "persons": "袁紹,曹操", "places": "", "era_year": "初平2年（191年）頃", "source_book": "", "keywords": "玉印", "raw_tagged": "{{person:袁紹|紹}}又甞得一玉印，於{{person:曹操|太祖}}坐中舉向其肘，{{person:曹操|太祖}}由是笑而惡焉。", "kakikudashi_tagged": "{{person:袁紹|紹}}は又た嘗て一玉印を得、{{person:曹操|太祖}}の坐中に於いて挙げて其の肘に向かわせ、{{person:曹操|太祖}}は是に由りて笑いて焉を悪む。", "translation_tagged": "{{person:袁紹|袁紹}}はまたかつて一つの玉印を手に入れ、{{person:曹操|太祖}}と同席した際にそれを掲げて自分の肘の方へ向けたため、{{person:曹操|太祖}}はこれによって表面では笑いつつも内心では彼を憎んだ。"}, {"id": "v1_p11_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 11, "type": "裴注", "raw_text": "《魏書》曰：太祖大笑曰：「吾不聽汝也。」紹復使人說太祖曰：「今袁公勢盛兵彊，二子已長，天下羣英，孰踰於此？」太祖不應。由是益不直紹，圖誅滅之。", "kakikudashi": "『魏書』に曰く、「太祖は大いに笑いて曰く、『吾は汝に聴かざるなり』と。紹は復た人をして太祖に説かしめて曰く、『今、袁公は勢い盛んにして兵は強く、二子は已に長ぜり、天下の群英、孰か此に踰えん？』と。太祖は応えず。是に由りて益々紹を直とせず、之を誅滅せんと図る」と。", "translation": "『魏書』にいう。「太祖は大笑いして『私はお前の言うことなど聴かぬぞ』と言った。袁紹はまた人を遣わして太祖に説かせて言った、『いま袁公は勢いが盛んで兵も強く、二人の息子もすでに成長しています、天下の群雄の中で誰がこれを超えられましょうか？』と。太祖は取り合わなかった。これによってますます袁紹を正道ではないと見なし、彼を討ち滅ぼそうと図るようになった」。", "persons": "曹操,袁紹", "places": "", "era_year": "初平2年（191年）頃", "source_book": "魏書", "keywords": "袁公", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:曹操|太祖}}大笑曰：「吾不聽汝也。」{{person:袁紹|紹}}復使人說{{person:曹操|太祖}}曰：「今{{person:袁紹|袁公}}勢盛兵彊，二子已長，天下羣英，孰踰於此？」{{person:曹操|太祖}}不應。由是益不直{{person:袁紹|紹}}，圖誅滅之。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{person:曹操|太祖}}は大いに笑いて曰く、『吾は汝に聴かざるなり』と。{{person:袁紹|紹}}は復た人をして{{person:曹操|太祖}}に説かしめて曰く、『今、{{person:袁紹|袁公}}は勢い盛んにして兵は強く、二子は已に長ぜり、天下の群英、孰か此に踰えん？』と。{{person:曹操|太祖}}は応えず。是に由りて益々{{person:袁紹|紹}}を直とせず、之を誅滅せんと図る」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「{{person:曹操|太祖}}は大笑いして『私はお前の言うことなど聴かぬぞ』と言った。{{person:袁紹|袁紹}}はまた人を遣わして{{person:曹操|太祖}}に説かせて言った、『いま{{person:袁紹|袁公}}は勢いが盛んで兵も強く、二人の息子もすでに成長しています、天下の群雄の中で誰がこれを超えられましょうか？』と。{{person:曹操|太祖}}は取り合わなかった。これによってますます{{person:袁紹|袁紹}}を正道ではないと見なし、彼を討ち滅ぼそうと図るようになった」。"}, {"id": "v1_p12_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 12, "type": "本文", "raw_text": "二年春，紹、馥遂立虞爲帝，虞終不敢當。", "kakikudashi": "二年春、紹・馥は遂に虞を立てて帝と為さんとするも、虞は終に敢えて当たらず。", "translation": "初平二年（一九一年）春、袁紹と韓馥はついに劉虞を擁立して皇帝に立てようとしたが、劉虞は最後まで決して引き受けようとしなかった。", "persons": "袁紹,韓馥,劉虞", "places": "", "era_year": "初平2年（191年）春", "source_book": "", "keywords": "", "raw_tagged": "二年春，{{person:袁紹|紹}}、{{person:韓馥|馥}}遂立{{person:劉虞|虞}}爲帝，{{person:劉虞|虞}}終不敢當。", "kakikudashi_tagged": "二年春、{{person:袁紹|紹}}・{{person:韓馥|馥}}は遂に{{person:劉虞|虞}}を立てて帝と為さんとするも、{{person:劉虞|虞}}は終に敢えて当たらず。", "translation_tagged": "{{special:初平|初平}}二年（一九一年）春、{{person:袁紹|袁紹}}と{{person:韓馥|韓馥}}はついに{{person:劉虞|劉虞}}を擁立して皇帝に立てようとしたが、{{person:劉虞|劉虞}}は最後まで決して引き受けようとしなかった。"}, {"id": "v1_p13_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 13, "type": "本文", "raw_text": "夏四月，卓還長安。", "kakikudashi": "夏四月、卓は長安に還る。", "translation": "夏四月、董卓は長安へ帰還した。", "persons": "董卓", "places": "長安", "era_year": "初平2年（191年）4月", "source_book": "", "keywords": "", "raw_tagged": "夏四月，{{person:董卓|卓}}還{{place:長安|長安}}。", "kakikudashi_tagged": "夏四月、{{person:董卓|卓}}は{{place:長安|長安}}に還る。", "translation_tagged": "夏四月、{{person:董卓|董卓}}は{{place:長安|長安}}へ帰還した。"}, {"id": "v1_p14_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 14, "type": "本文", "raw_text": "秋七月，袁紹脅韓馥，取冀州。", "kakikudashi": "秋七月、袁紹は韓馥を脅し、冀州を取る。", "translation": "秋七月、袁紹は韓馥を脅迫して、冀州を奪い取った。", "persons": "袁紹,韓馥", "places": "冀州", "era_year": "初平2年（191年）7月", "source_book": "", "keywords": "", "raw_tagged": "秋七月，{{person:袁紹|袁紹}}脅{{person:韓馥|韓馥}}，取{{place:冀州|冀州}}。", "kakikudashi_tagged": "秋七月、{{person:袁紹|袁紹}}は{{person:韓馥|韓馥}}を脅し、{{place:冀州|冀州}}を取る。", "translation_tagged": "秋七月、{{person:袁紹|袁紹}}は{{person:韓馥|韓馥}}を脅迫して、{{place:冀州|冀州}}を奪い取った。"}, {"id": "v1_p15_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 15, "type": "本文", "raw_text": "黑山賊于毒、白繞、眭固等", "kakikudashi": "黒山賊の于毒・白繞・眭固等、", "translation": "黒山賊の于毒・白繞・眭固らが、", "persons": "于毒,白繞,眭固", "places": "", "era_year": "初平2年（191年）秋", "source_book": "", "keywords": "黒山賊", "raw_tagged": "{{special:黒山賊|黑山賊}}{{person:于毒|于毒}}、{{person:白繞|白繞}}、{{person:眭固|眭固}}等", "kakikudashi_tagged": "{{special:黒山賊|黒山賊}}の{{person:于毒|于毒}}・{{person:白繞|白繞}}・{{person:眭固|眭固}}等、", "translation_tagged": "{{special:黒山賊|黒山賊}}の{{person:于毒|于毒}}・{{person:白繞|白繞}}・{{person:眭固|眭固}}らが、"}, {"id": "v1_p15_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 15, "type": "裴注", "raw_text": "眭，申隨反。", "kakikudashi": "眭は、申随の反なり。", "translation": "「眭」の発音は「申」と「随」の反切（スイ）である。", "persons": "眭固", "places": "", "era_year": "", "source_book": "", "keywords": "", "raw_tagged": "{{person:眭固|眭}}，申隨反。", "kakikudashi_tagged": "{{person:眭固|眭}}は、申随の反なり。", "translation_tagged": "「{{person:眭固|眭}}」の発音は「申」と「随」の反切（スイ）である。"}, {"id": "v1_p15_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 15, "type": "本文", "raw_text": "十餘萬衆略魏郡、東郡，王肱不能禦，太祖引兵入東郡，擊白繞於濮陽，破之。袁紹因表太祖爲東郡太守，治東武陽。", "kakikudashi": "十余万の衆もて魏郡・東郡を略するに、王肱は禦ぐ能わず、太祖は兵を引きて東郡に入り、白繞を濮陽に撃ちて、之を破る。袁紹は因りて太祖を表して東郡太守と為し、東武陽に治せしむ。", "translation": "十余万の軍勢で魏郡・東郡を略奪し、王肱はこれを防ぐことができなかったため、太祖は兵を率いて東郡へ入り、白繞を濮陽に撃ってこれを打ち破った。そこで袁紹は太祖を上表して東郡太守とし、東武陽を治所とさせた。", "persons": "王肱,曹操,白繞,袁紹", "places": "魏郡,東郡,濮陽,東武陽", "era_year": "初平2年（191年）秋〜冬", "source_book": "", "keywords": "東郡太守", "raw_tagged": "十餘萬衆略{{place:魏郡|魏郡}}、{{place:東郡|東郡}}，{{person:王肱|王肱}}不能禦，{{person:曹操|太祖}}引兵入{{place:東郡|東郡}}，擊{{person:白繞|白繞}}於{{place:濮陽|濮陽}}，破之。{{person:袁紹|袁紹}}因表{{person:曹操|太祖}}爲{{place:東郡|東郡}}{{office:太守|太守}}，治{{place:東武陽|東武陽}}。", "kakikudashi_tagged": "十余万の衆もて{{place:魏郡|魏郡}}・{{place:東郡|東郡}}を略するに、{{person:王肱|王肱}}は禦ぐ能わず、{{person:曹操|太祖}}は兵を引きて{{place:東郡|東郡}}に入り、{{person:白繞|白繞}}を{{place:濮陽|濮陽}}に撃ちて、之を破る。{{person:袁紹|袁紹}}は因りて{{person:曹操|太祖}}を表して{{place:東郡|東郡}}{{office:太守|太守}}と為し、{{place:東武陽|東武陽}}に治せしむ。", "translation_tagged": "十余万の軍勢で{{place:魏郡|魏郡}}・{{place:東郡|東郡}}を略奪し、{{person:王肱|王肱}}はこれを防ぐことができなかったため、{{person:曹操|太祖}}は兵を率いて{{place:東郡|東郡}}へ入り、{{person:白繞|白繞}}を{{place:濮陽|濮陽}}に撃ってこれを打ち破った。そこで{{person:袁紹|袁紹}}は{{person:曹操|太祖}}を上表して{{place:東郡|東郡}}{{office:太守|太守}}とし、{{place:東武陽|東武陽}}を治所とさせた。"}, {"id": "v1_p16_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 16, "type": "本文", "raw_text": "三年春，太祖軍頓丘，毒等攻東武陽。太祖乃引兵西入山，攻毒等本屯。", "kakikudashi": "三年春、太祖は頓丘に軍し、毒等は東武陽を攻む。太祖は乃ち兵を引きて西のかた山に入り、毒等の本屯を攻む。", "translation": "初平三年（一九二年）春、太祖が頓丘に布陣していたとき、于毒らが東武陽を攻撃した。太祖はそこで兵を率いて西の山中へ分け入り、于毒らの本営を攻撃した。", "persons": "曹操,于毒", "places": "頓丘,東武陽", "era_year": "初平3年（192年）春", "source_book": "", "keywords": "", "raw_tagged": "三年春，{{person:曹操|太祖}}軍{{place:頓丘|頓丘}}，{{person:于毒|毒}}等攻{{place:東武陽|東武陽}}。{{person:曹操|太祖}}乃引兵西入山，攻{{person:于毒|毒}}等本屯。", "kakikudashi_tagged": "三年春、{{person:曹操|太祖}}は{{place:頓丘|頓丘}}に軍し、{{person:于毒|毒}}等は{{place:東武陽|東武陽}}を攻む。{{person:曹操|太祖}}は乃ち兵を引きて西のかた山に入り、{{person:于毒|毒}}等の本屯を攻む。", "translation_tagged": "{{special:初平|初平}}三年（一九二年）春、{{person:曹操|太祖}}が{{place:頓丘|頓丘}}に布陣していたとき、{{person:于毒|于毒}}らが{{place:東武陽|東武陽}}を攻撃した。{{person:曹操|太祖}}はそこで兵を率いて西の山中へ分け入り、{{person:于毒|于毒}}らの本営を攻撃した。"}, {"id": "v1_p16_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 16, "type": "裴注", "raw_text": "《魏書》曰：諸將皆以爲當還自救。太祖曰：「孫臏救趙而攻魏，耿弇欲走西安攻臨菑。使賊聞我西而還，武陽自解也；不還，我能敗其本屯，虜不能拔武陽必矣。」遂乃行。", "kakikudashi": "『魏書』に曰く、「諸将は皆、当に還りて自ら救うべしと以為う。太祖曰く、『孫臏は趙を救うに魏を攻め、耿弇は西安に走らんと欲して臨菑を攻む。賊をして我が西するを聞きて還らしめば、武陽は自ずから解けん；還らずんば、我は能く其の本屯を敗り、虜が武陽を抜く能わざるや必せり』と。遂に乃ち行く」と。", "translation": "『魏書』にいう。「諸将はみな、引き返して東武陽を救援すべきであると考えた。しかし太祖は言った、『かつて孫臏は趙を救うにあたって魏を攻め、耿弇は西安へ向かうと見せかけて臨菑を攻め落とした。もし賊が我らの西進を聞いて引き返せば、武陽の包囲は自然に解けるであろう；もし引き返さなければ、我らはその本営を打ち破ることができ、賊が武陽を陥落させられないことは必定である』と。こうしてついに進軍した」。", "persons": "曹操,孫臏,耿弇", "places": "西安,臨菑,東武陽", "era_year": "初平3年（192年）春", "source_book": "魏書", "keywords": "囲魏救趙", "raw_tagged": "{{special:引用史料|《魏書》}}曰：諸將皆以爲當還自救。{{person:曹操|太祖}}曰：「{{person:孫臏|孫臏}}救趙而攻魏，{{person:耿弇|耿弇}}欲走{{place:西安|西安}}攻{{place:臨菑|臨菑}}。使賊聞我西而還，{{place:東武陽|武陽}}自解也；不還，我能敗其本屯，虜不能拔{{place:東武陽|武陽}}必矣。」遂乃行。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「諸将は皆、当に還りて自ら救うべしと以為う。{{person:曹操|太祖}}曰く、『{{person:孫臏|孫臏}}は趙を救うに魏を攻め、{{person:耿弇|耿弇}}は{{place:西安|西安}}に走らんと欲して{{place:臨菑|臨菑}}を攻む。賊をして我が西するを聞きて還らしめば、{{place:東武陽|武陽}}は自ずから解けん；還らずんば、我は能く其の本屯を敗り、虜が{{place:東武陽|武陽}}を抜く能わざるや必せり』と。遂に乃ち行く」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「諸将はみな、引き返して{{place:東武陽|東武陽}}を救援すべきであると考えた。しかし{{person:曹操|太祖}}は言った、『かつて{{person:孫臏|孫臏}}は趙を救うにあたって魏を攻め、{{person:耿弇|耿弇}}は{{place:西安|西安}}へ向かうと見せかけて{{place:臨菑|臨菑}}を攻め落とした。もし賊が我らの西進を聞いて引き返せば、{{place:東武陽|武陽}}の包囲は自然に解けるであろう；もし引き返さなければ、我らはその本営を打ち破ることができ、賊が{{place:東武陽|武陽}}を陥落させられないことは必定である』と。こうしてついに進軍した」。"}, {"id": "v1_p16_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 16, "type": "本文", "raw_text": "毒聞之，棄武陽還。太祖要擊眭固，又擊匈奴於夫羅於內黃，皆大破之。", "kakikudashi": "毒は之を聞き、武陽を棄てて還る。太祖は眭固を要撃し、又た匈奴の於夫羅を内黄に撃ち、皆大いに之を破る。", "translation": "于毒はこれを聞くと、武陽を放棄して引き返した。太祖はさらに眭固を待ち伏せて撃ち、また匈奴の於夫羅を内黄に撃って、いずれもこれを大いに打ち破った。", "persons": "于毒,曹操,眭固,於夫羅", "places": "東武陽,内黄", "era_year": "初平3年（192年）春", "source_book": "", "keywords": "匈奴", "raw_tagged": "{{person:于毒|毒}}聞之，棄{{place:東武陽|武陽}}還。{{person:曹操|太祖}}要擊{{person:眭固|眭固}}，又擊{{special:匈奴|匈奴}}{{person:於夫羅|於夫羅}}於{{place:内黄|內黃}}，皆大破之。", "kakikudashi_tagged": "{{person:于毒|毒}}は之を聞き、{{place:東武陽|武陽}}を棄てて還る。{{person:曹操|太祖}}は{{person:眭固|眭固}}を要撃し、又た{{special:匈奴|匈奴}}の{{person:於夫羅|於夫羅}}を{{place:内黄|内黄}}に撃ち、皆大いに之を破る。", "translation_tagged": "{{person:于毒|于毒}}はこれを聞くと、{{place:東武陽|武陽}}を放棄して引き返した。{{person:曹操|太祖}}はさらに{{person:眭固|眭固}}を待ち伏せて撃ち、また{{special:匈奴|匈奴}}の{{person:於夫羅|於夫羅}}を{{place:内黄|内黄}}に撃って、いずれもこれを大いに打ち破った。"}, {"id": "v1_p16_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 16, "type": "裴注", "raw_text": "《魏書》曰：於夫羅者，南單于子也。中平中，發匈奴兵，於夫羅率以助漢。會本國反，殺南單于，於夫羅遂將其衆留中國。因天下撓亂，與西河白波賊合，破太原、河內，抄略諸郡爲寇。", "kakikudashi": "『魏書』に曰く、「於夫羅なる者は、南単于の子なり。中平中、匈奴の兵を発するや、於夫羅は率いて以て漢を助く。会々本国が反し、南単于を殺すや、於夫羅は遂に其の衆を将いて中国に留まる。天下の撓乱するに因りて、西河の白波賊と合し、太原・河内を破り、諸郡を抄略して寇を為す」と。", "translation": "『魏書』にいう。「於夫羅という者は、南単于の子である。中平年間に匈奴の兵が徴発されると、於夫羅はこれを率いて漢を救援した。たまたま本国で反乱が起きて父の南単于が殺害されたため、於夫羅はそのまま部衆を率いて中国に留まった。その後、天下が乱れたのに乗じて西河の白波賊と合流し、太原・河内を撃ち破り、諸郡を略奪して寇賊となっていた」。", "persons": "於夫羅,羌渠", "places": "西河,太原,河内", "era_year": "中平5年（188年）〜初平3年（192年）", "source_book": "魏書", "keywords": "南単于,中平,匈奴,白波賊", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:於夫羅|於夫羅}}者，{{person:羌渠|南單于}}子也。{{special:中平|中平}}中，發{{special:匈奴|匈奴}}兵，{{person:於夫羅|於夫羅}}率以助漢。會本國反，殺{{person:羌渠|南單于}}，{{person:於夫羅|於夫羅}}遂將其衆留中國。因天下撓亂，與{{place:西河|西河}}{{special:白波賊|白波賊}}合，破{{place:太原|太原}}、{{place:河内|河內}}，抄略諸郡爲寇。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{person:於夫羅|於夫羅}}なる者は、{{person:羌渠|南単于}}の子なり。{{special:中平|中平}}中、{{special:匈奴|匈奴}}の兵を発するや、{{person:於夫羅|於夫羅}}は率いて以て漢を助く。会々本国が反し、{{person:羌渠|南単于}}を殺すや、{{person:於夫羅|於夫羅}}は遂に其の衆を将いて中国に留まる。天下の撓乱するに因りて、{{place:西河|西河}}の{{special:白波賊|白波賊}}と合し、{{place:太原|太原}}・{{place:河内|河内}}を破り、諸郡を抄略して寇を為す」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「{{person:於夫羅|於夫羅}}という者は、{{person:羌渠|南単于}}の子である。{{special:中平|中平}}年間に{{special:匈奴|匈奴}}の兵が徴発されると、{{person:於夫羅|於夫羅}}はこれを率いて漢を救援した。たまたま本国で反乱が起きて父の{{person:羌渠|南単于}}が殺害されたため、{{person:於夫羅|於夫羅}}はそのまま部衆を率いて中国に留まった。その後、天下が乱れたのに乗じて{{place:西河|西河}}の{{special:白波賊|白波賊}}と合流し、{{place:太原|太原}}・{{place:河内|河内}}を撃ち破り、諸郡を略奪して寇賊となっていた」。"}, {"id": "v1_p17_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 17, "type": "本文", "raw_text": "夏四月，司徒王允與呂布共殺卓。卓將李傕、郭汜等殺允攻布，布敗，東出武關。傕等擅朝政。", "kakikudashi": "夏四月、司徒の王允、呂布と共に卓を殺す。卓の将なる李傕・郭汜等、允を殺して布を攻め、布は敗れて、東のかた武関を出づ。傕等は朝政を擅にす。", "translation": "夏四月、司徒の王允が呂布と共謀して董卓を殺害した。すると董卓の部将である李傕・郭汜らが王允を殺害して呂布を攻め、呂布は敗れて東の武関から脱出した。こうして李傕らが朝政をほしいままにした。", "persons": "王允,呂布,董卓,李傕,郭汜", "places": "武関", "era_year": "初平3年（192年）4月〜6月", "source_book": "", "keywords": "司徒", "raw_tagged": "夏四月，{{office:司徒|司徒}}{{person:王允|王允}}與{{person:呂布|呂布}}共殺{{person:董卓|卓}}。{{person:董卓|卓}}將{{person:李傕|李傕}}、{{person:郭汜|郭汜}}等殺{{person:王允|允}}攻{{person:呂布|布}}，{{person:呂布|布}}敗，東出{{place:武関|武關}}。{{person:李傕|傕}}等擅朝政。", "kakikudashi_tagged": "夏四月、{{office:司徒|司徒}}の{{person:王允|王允}}、{{person:呂布|呂布}}と共に{{person:董卓|卓}}を殺す。{{person:董卓|卓}}の将なる{{person:李傕|李傕}}・{{person:郭汜|郭汜}}等、{{person:王允|允}}を殺して{{person:呂布|布}}を攻め、{{person:呂布|布}}は敗れて、東のかた{{place:武関|武関}}を出づ。{{person:李傕|傕}}等は朝政を擅にす。", "translation_tagged": "夏四月、{{office:司徒|司徒}}の{{person:王允|王允}}が{{person:呂布|呂布}}と共謀して{{person:董卓|董卓}}を殺害した。すると{{person:董卓|董卓}}の部将である{{person:李傕|李傕}}・{{person:郭汜|郭汜}}らが{{person:王允|王允}}を殺害して{{person:呂布|呂布}}を攻め、{{person:呂布|呂布}}は敗れて東の{{place:武関|武関}}から脱出した。こうして{{person:李傕|李傕}}らが朝政をほしいままにした。"}, {"id": "v1_p18_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 18, "type": "本文", "raw_text": "青州黃巾衆百萬入兖州，殺任城相鄭遂，轉入東平。劉岱欲擊之，鮑信諫曰：「今賊衆百萬，百姓皆震恐，士卒無鬬志，不可敵也。觀賊衆羣輩相隨，軍無輜重，唯以鈔略爲資，今不若畜士衆之力，先爲固守。彼欲戰不得，攻又不能，其勢必離散，後選精銳，據其要害，擊之可破也。」岱不從，遂與戰，果爲所殺。", "kakikudashi": "青州の黄巾の衆百万、兗州に入り、任城相の鄭遂を殺し、転じて東平に入る。劉岱は之を撃たんと欲するも、鮑信は諫めて曰く、「今、賊衆は百万、百姓は皆震恐し、士卒に闘志無ければ、敵すべからざるなり。賊衆を観るに群輩相随い、軍に輜重無く、唯だ鈔略を以て資と為すのみ、今は士衆の力を畜え、先ず固守を為すに若かず。彼は戦わんと欲するも得ず、攻むるも又た能わざれば、其の勢いは必ず離散せん、後に精鋭を選び、其の要害に拠りて、之を撃たば破るべきなり」と。岱は従わず、遂に与に戦い、果たして殺す所と為る。", "translation": "青州の黄巾賊の軍勢百万が兗州に侵入し、任城相の鄭遂を殺害して、さらに東平へと転進した。兗州刺史の劉岱はこれを迎撃しようとしたが、鮑信が諫めて言った、「いま賊の軍勢は百万にのぼり、民衆はみな震え上がり、兵士たちにも戦意がありませんので、真っ向から敵対すべきではありません。賊の集団を見ますと、家族や群衆がぞろぞろと付き従っているだけで、軍に輜重（補給物資）はなく、ただ略奪だけを頼みとしておりますから、今は味方の将兵の力を蓄え、まずは堅く守りを固めるにしくはありません。彼らが戦おうとしても戦えず、攻め落とすこともできなければ、その勢力は必ず離散するでしょうから、その後に精鋭を選抜して要害の地に拠り、これを攻撃すれば打ち破ることができます」と。しかし劉岱は聞き入れず、ついに黄巾賊と戦って、はたして討ち取られてしまった。", "persons": "鄭遂,劉岱,鮑信", "places": "青州,兗州,任城,東平", "era_year": "初平3年（192年）4月", "source_book": "", "keywords": "黄巾,相", "raw_tagged": "{{place:青州|青州}}{{special:黄巾|黃巾}}衆百萬入{{place:兗州|兖州}}，殺{{place:任城|任城}}{{office:相|相}}{{person:鄭遂|鄭遂}}，轉入{{place:東平|東平}}。{{person:劉岱|劉岱}}欲擊之，{{person:鮑信|鮑信}}諫曰：「今賊衆百萬，百姓皆震恐，士卒無鬬志，不可敵也。觀賊衆羣輩相隨，軍無輜重，唯以鈔略爲資，今不若畜士衆之力，先爲固守。彼欲戰不得，攻又不能，其勢必離散，後選精銳，據其要害，擊之可破也。」{{person:劉岱|岱}}不從，遂與戰，果爲所殺。", "kakikudashi_tagged": "{{place:青州|青州}}の{{special:黄巾|黄巾}}の衆百万、{{place:兗州|兗州}}に入り、{{place:任城|任城}}{{office:相|相}}の{{person:鄭遂|鄭遂}}を殺し、転じて{{place:東平|東平}}に入る。{{person:劉岱|劉岱}}は之を撃たんと欲するも、{{person:鮑信|鮑信}}は諫めて曰く、「今、賊衆は百万、百姓は皆震恐し、士卒に闘志無ければ、敵すべからざるなり。賊衆を観るに群輩相随い、軍に輜重無く、唯だ鈔略を以て資と為すのみ、今は士衆の力を畜え、先ず固守を為すに若かず。彼は戦わんと欲するも得ず、攻むるも又た能わざれば、其の勢いは必ず離散せん、後に精鋭を選び、其の要害に拠りて、之を撃たば破るべきなり」と。{{person:劉岱|岱}}は従わず、遂に与に戦い、果たして殺す所と為る。", "translation_tagged": "{{place:青州|青州}}の{{special:黄巾|黄巾}}賊の軍勢百万が{{place:兗州|兗州}}に侵入し、{{place:任城|任城}}{{office:相|相}}の{{person:鄭遂|鄭遂}}を殺害して、さらに{{place:東平|東平}}へと転進した。{{place:兗州|兗州}}{{office:刺史|刺史}}の{{person:劉岱|劉岱}}はこれを迎撃しようとしたが、{{person:鮑信|鮑信}}が諫めて言った、「いま賊の軍勢は百万にのぼり、民衆はみな震え上がり、兵士たちにも戦意がありませんので、真っ向から敵対すべきではありません。賊の集団を見ますと、家族や群衆がぞろぞろと付き従っているだけで、軍に輜重（補給物資）はなく、ただ略奪だけを頼みとしておりますから、今は味方の将兵の力を蓄え、まずは堅く守りを固めるにしくはありません。彼らが戦おうとしても戦えず、攻め落とすこともできなければ、その勢力は必ず離散するでしょうから、その後に精鋭を選抜して要害の地に拠り、これを攻撃すれば打ち破ることができます」と。しかし{{person:劉岱|劉岱}}は聞き入れず、ついに{{special:黄巾|黄巾}}賊と戦って、はたして討ち取られてしまった。"}, {"id": "v1_p18_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 18, "type": "裴注", "raw_text": "《世語》曰：岱旣死，陳宮謂太祖曰：「州今無主，而王命斷絕，宮請說州中，明府尋往牧之，資之以收天下，此霸王之業也。」宮說別駕、治中曰：「今天下分裂而州無主；曹東郡，命世之才也，若迎以牧州，必寧生民。」鮑信等亦謂之然。", "kakikudashi": "『世語』に曰く、「岱が既に死するや、陳宮は太祖に謂いて曰く、『州に今、主無く、而して王命は断絶す、宮、請うらくは州中に説かん、明府は尋いで往きて之を牧し、之に資りて以て天下を収めよ、此れ覇王の業なり』と。宮は別駕・治中に説きて曰く、『今、天下は分裂して州に主無し；曹東郡は、命世の才なり、若し迎えて以て州を牧せしめば、必ずや生民を寧んぜん』と。鮑信等も亦た之を然りと謂う」と。", "translation": "『世語』にいう。「劉岱が戦死すると、陳宮は太祖に語って言った、『兗州にはいま主君がおらず、しかも朝廷からの王命も途絶えております。私（陳宮）が州の幹部たちを説得いたしますので、明府（太祖）はすぐさま赴いてこの州を統治なさり、ここを足場として天下をお収めください。これこそ覇王の業であります』と。陳宮はさらに州の別駕や治中を説得して言った、『いま天下は分裂し、この州には主君がいない；曹東郡は、世にまれなる不世出の英才である。もし彼を迎え入れて州を統治してもらえば、必ずや民草を安んずることであろう』と。鮑信らもまたその通りであると賛同した」。", "persons": "劉岱,陳宮,曹操,鮑信", "places": "兗州,東郡", "era_year": "初平3年（192年）4月", "source_book": "世語", "keywords": "別駕,従事", "raw_tagged": "{{special:引用史料|《世語》}}曰：{{person:劉岱|岱}}旣死，{{person:陳宮|陳宮}}謂{{person:曹操|太祖}}曰：「州今無主，而王命斷絕，{{person:陳宮|宮}}請說州中，{{person:曹操|明府}}尋往牧之，資之以收天下，此霸王之業也。」{{person:陳宮|宮}}說{{office:別駕|別駕}}、{{office:従事|治中}}曰：「今天下分裂而州無主；{{person:曹操|曹}}{{place:東郡|東郡}}，命世之才也，若迎以牧州，必寧生民。」{{person:鮑信|鮑信}}等亦謂之然。", "kakikudashi_tagged": "{{special:引用史料|『世語』}}に曰く、「{{person:劉岱|岱}}が既に死するや、{{person:陳宮|陳宮}}は{{person:曹操|太祖}}に謂いて曰く、『州に今、主無く、而して王命は断絶す、{{person:陳宮|宮}}、請うらくは州中に説かん、{{person:曹操|明府}}は尋いで往きて之を牧し、之に資りて以て天下を収めよ、此れ覇王の業なり』と。{{person:陳宮|宮}}は{{office:別駕|別駕}}・{{office:従事|治中}}に説きて曰く、『今、天下は分裂して州に主無し；{{person:曹操|曹}}{{place:東郡|東郡}}は、命世の才なり、若し迎えて以て州を牧せしめば、必ずや生民を寧んぜん』と。{{person:鮑信|鮑信}}等も亦た之を然りと謂う」と。", "translation_tagged": "{{special:引用史料|『世語』}}にいう。「{{person:劉岱|劉岱}}が戦死すると、{{person:陳宮|陳宮}}は{{person:曹操|太祖}}に語って言った、『{{place:兗州|兗州}}にはいま主君がおらず、しかも朝廷からの王命も途絶えております。私（{{person:陳宮|陳宮}}）が州の幹部たちを説得いたしますので、{{person:曹操|明府}}（{{person:曹操|太祖}}）はすぐさま赴いてこの州を統治なさり、ここを足場として天下をお収めください。これこそ覇王の業であります』と。{{person:陳宮|陳宮}}はさらに州の{{office:別駕|別駕}}や{{office:従事|治中}}を説得して言った、『いま天下は分裂し、この州には主君がいない；{{person:曹操|曹}}{{place:東郡|東郡}}は、世にまれなる不世出の英才である。もし彼を迎え入れて州を統治してもらえば、必ずや民草を安んずることであろう』と。{{person:鮑信|鮑信}}らもまたその通りであると賛同した」。"}, {"id": "v1_p18_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 18, "type": "本文", "raw_text": "信乃與州吏萬潛等至東郡迎太祖領兖州牧。遂進兵擊黃巾於壽張東。信力戰鬬死，僅而破之。", "kakikudashi": "信は乃ち州吏の万潜等と東郡に至り、太祖を迎えて兗州牧を領せしむ。遂に兵を進めて黄巾を寿張の東に撃つ。信は力戦して闘死し、僅かにして之を破る。", "translation": "そこで鮑信は州の役人である万潜らとともに東郡へ赴き、太祖を迎え入れて兗州牧を兼領させた。太祖はそのまま兵を進めて黄巾賊を寿張の東に攻撃した。鮑信は奮戦して戦死し、太祖は辛うじてこれを打ち破った。", "persons": "鮑信,万潜,曹操", "places": "東郡,兗州,寿張", "era_year": "初平3年（192年）", "source_book": "", "keywords": "牧,黄巾", "raw_tagged": "{{person:鮑信|信}}乃與州吏{{person:万潜|萬潛}}等至{{place:東郡|東郡}}迎{{person:曹操|太祖}}領{{place:兗州|兖州}}{{office:牧|牧}}。遂進兵擊{{special:黄巾|黃巾}}於{{place:寿張|壽張}}東。{{person:鮑信|信}}力戰鬬死，僅而破之。", "kakikudashi_tagged": "{{person:鮑信|信}}は乃ち州吏の{{person:万潜|万潜}}等と{{place:東郡|東郡}}に至り、{{person:曹操|太祖}}を迎えて{{place:兗州|兗州}}{{office:牧|牧}}を領せしむ。遂に兵を進めて{{special:黄巾|黄巾}}を{{place:寿張|寿張}}の東に撃つ。{{person:鮑信|信}}は力戦して闘死し、僅かにして之を破る。", "translation_tagged": "そこで{{person:鮑信|鮑信}}は州の役人である{{person:万潜|万潜}}らとともに{{place:東郡|東郡}}へ赴き、{{person:曹操|太祖}}を迎え入れて{{place:兗州|兗州}}{{office:牧|牧}}を兼領させた。{{person:曹操|太祖}}はそのまま兵を進めて{{special:黄巾|黄巾}}賊を{{place:寿張|寿張}}の東に攻撃した。{{person:鮑信|鮑信}}は奮戦して戦死し、{{person:曹操|太祖}}は辛うじてこれを打ち破った。"}, {"id": "v1_p18_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 18, "type": "裴注", "raw_text": "《魏書》曰：太祖將步騎千餘人，行視戰地，卒抵賊營，戰不利，死者數百人，引還。賊尋前進。黃巾爲賊久，數乘勝，兵皆精悍。太祖舊兵少，新兵不習練，舉軍皆懼。太祖被甲嬰冑，親巡將士，明勸賞罰，衆乃復奮，承間討擊，賊稍折退。賊乃移書太祖曰：「昔在濟南，毀壞神壇，其道乃與中黃太一同，似若知道，今更迷惑。漢行已盡，黃家當立。天之大運，非君才力所能存也。」太祖見檄書，呵之罪，數開示降路；遂設奇伏，晝夜會戰，戰輙禽獲，賊乃退走。", "kakikudashi": "『魏書』に曰く、「太祖は歩騎千余人を将い、戦地を行視するに、卒かに賊営に抵り、戦うも利あらず、死する者は数百人、引きて還る。賊は尋いで前進す。黄巾は賊為ること久しく、数々勝ちに乗じ、兵は皆精悍なり。太祖は旧兵少なく、新兵は習練せず、挙軍皆懼る。太祖は甲を被り冑を嬰け、親ら将士を巡り、賞罰を明勧すれば、衆は乃ち復た奮い、間を承けて討撃し、賊は稍く折退す。賊は乃ち書を太祖に移して曰く、『昔、済南に在りしとき、神壇を毀壊し、其の道は乃ち中黄太一と同じく、道を知るが若きに似たりしに、今は更に迷惑す。漢行は已に尽き、黄家が当に立つべし。天の大運は、君の才力が能く存する所に非ざるなり』と。太祖は檄書を見、之が罪を呵し、数々降路を開示す；遂に奇伏を設け、昼夜会戦し、戦えば輒ち禽獲し、賊は乃ち退走す」と。", "translation": "『魏書』にいう。「太祖が歩兵・騎兵千余人を率いて戦場を視察していたところ、にわかに賊の陣営に遭遇し、交戦したものの不利に陥り、戦死者数百人を出して退却した。賊はすぐさま前進してきた。黄巾賊は長年にわたって賊徒として戦い続け、たびたび勝利に乗じていたため、兵はみな精強で獰猛であった。一方、太祖の軍は古参の兵が少なく、新募の兵は訓練が行き届いていなかったため、全軍がすっかり怯えきっていた。そこで太祖は自ら鎧を着込み兜の緒を締め、親しく将兵の間を見回って賞罰を明確に示し激励すると、将兵は再び奮い立ち、隙を突いて討ちかかったので、賊は次第に挫けて退いた。すると賊は太祖に檄文を送りつけて言った、『かつて君が済南にいたとき、淫祀の神壇を打ち壊したが、そのやり方は我らの中黄太一の道と一致しており、真理をわきまえているかに見えたのに、今になってかえって迷い惑っている。漢王朝の五行の徳運はすでに尽き、黄家がまさに立つべき時なのだ。天の大いなる運数は、君の才力ごときでどうにかできるものではない』と。太祖はこの檄文を見ると、彼らの罪を厳しく叱責しつつ、たびたび降伏への道を開いて示した；そうして奇兵・伏兵を設け、昼夜を問わず会戦を挑み、戦うたびに捕虜としたので、賊はついに敗走した」。", "persons": "曹操", "places": "済南", "era_year": "初平3年（192年）", "source_book": "魏書", "keywords": "黄巾,中黄太一,漢行已尽", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:曹操|太祖}}將步騎千餘人，行視戰地，卒抵賊營，戰不利，死者數百人，引還。賊尋前進。{{special:黄巾|黃巾}}爲賊久，數乘勝，兵皆精悍。{{person:曹操|太祖}}舊兵少，新兵不習練，舉軍皆懼。{{person:曹操|太祖}}被甲嬰冑，親巡將士，明勸賞罰，衆乃復奮，承間討擊，賊稍折退。賊乃移書{{person:曹操|太祖}}曰：「昔在{{place:済南|濟南}}，毀壞神壇，其道乃與{{special:中黄太一|中黃太一}}同，似若知道，今更迷惑。{{special:漢行已尽|漢行已盡，黃家當立}}。天之大運，非君才力所能存也。」{{person:曹操|太祖}}見檄書，呵之罪，數開示降路；遂設奇伏，晝夜會戰，戰輙禽獲，賊乃退走。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{person:曹操|太祖}}は歩騎千余人を将い、戦地を行視するに、卒かに賊営に抵り、戦うも利あらず、死する者は数百人、引きて還る。賊は尋いで前進す。{{special:黄巾|黄巾}}は賊為ること久しく、数々勝ちに乗じ、兵は皆精悍なり。{{person:曹操|太祖}}は旧兵少なく、新兵は習練せず、挙軍皆懼る。{{person:曹操|太祖}}は甲を被り冑を嬰け、親ら将士を巡り、賞罰を明勧すれば、衆は乃ち復た奮い、間を承けて討撃し、賊は稍く折退す。賊は乃ち書を{{person:曹操|太祖}}に移して曰く、『昔、{{place:済南|済南}}に在りしとき、神壇を毀壊し、其の道は乃ち{{special:中黄太一|中黄太一}}と同じく、道を知るが若きに似たりしに、今は更に迷惑す。{{special:漢行已尽|漢行は已に尽き、黄家が当に立つべし}}。天の大運は、君の才力が能く存する所に非ざるなり』と。{{person:曹操|太祖}}は檄書を見、之が罪を呵し、数々降路を開示す；遂に奇伏を設け、昼夜会戦し、戦えば輒ち禽獲し、賊は乃ち退走す」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「{{person:曹操|太祖}}が歩兵・騎兵千余人を率いて戦場を視察していたところ、にわかに賊の陣営に遭遇し、交戦したものの不利に陥り、戦死者数百人を出して退却した。賊はすぐさま前進してきた。{{special:黄巾|黄巾}}賊は長年にわたって賊徒として戦い続け、たびたび勝利に乗じていたため、兵はみな精強で獰猛であった。一方、{{person:曹操|太祖}}の軍は古参の兵が少なく、新募の兵は訓練が行き届いていなかったため、全軍がすっかり怯えきっていた。そこで{{person:曹操|太祖}}は自ら鎧を着込み兜の緒を締め、親しく将兵の間を見回って賞罰を明確に示し激励すると、将兵は再び奮い立ち、隙を突いて討ちかかったので、賊は次第に挫けて退いた。すると賊は{{person:曹操|太祖}}に檄文を送りつけて言った、『かつて君が{{place:済南|済南}}にいたとき、{{special:淫祀|淫祀}}の神壇を打ち壊したが、そのやり方は我らの{{special:中黄太一|中黄太一}}の道と一致しており、真理をわきまえているかに見えたのに、今になってかえって迷い惑っている。{{special:漢行已尽|漢王朝の五行の徳運はすでに尽き、黄家がまさに立つべき時なのだ}}。天の大いなる運数は、君の才力ごときでどうにかできるものではない』と。{{person:曹操|太祖}}はこの檄文を見ると、彼らの罪を厳しく叱責しつつ、たびたび降伏への道を開いて示した；そうして奇兵・伏兵を設け、昼夜を問わず会戦を挑み、戦うたびに捕虜としたので、賊はついに敗走した」。"}, {"id": "v1_p18_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 18, "type": "本文", "raw_text": "購求信喪不得，衆乃刻木如信形狀，祭而哭焉。追黃巾至濟北。乞降。冬，受降卒三十餘萬，男女百餘萬口，收其精銳者，號爲青州兵。", "kakikudashi": "信の喪を購求するも得ず、衆は乃ち木を刻みて信の形状の如くし、祭りて哭す。黄巾を追いて済北に至る。降を乞う。冬、降卒三十余万、男女百余万口を受け、其の精鋭なる者を収め、号して青州兵と為す。", "translation": "懸賞をかけて鮑信の遺体を捜索させたが見つからなかったため、人々は木を彫って鮑信の生前の姿をかたどり、これを祭って号哭した。その後、黄巾賊を追撃して済北に至った。すると賊は降伏を願い出た。冬、降伏した兵卒三十余万人、男女百余万人を受け入れ、そのうちの精鋭を選抜して編成し、名づけて『青州兵』とした。", "persons": "鮑信,曹操", "places": "済北", "era_year": "初平3年（192年）冬", "source_book": "", "keywords": "黄巾,青州兵", "raw_tagged": "購求{{person:鮑信|信}}喪不得，衆乃刻木如{{person:鮑信|信}}形狀，祭而哭焉。追{{special:黄巾|黃巾}}至{{place:済北|濟北}}。乞降。冬，受降卒三十餘萬，男女百餘萬口，收其精銳者，號爲{{special:青州兵|青州兵}}。", "kakikudashi_tagged": "{{person:鮑信|信}}の喪を購求するも得ず、衆は乃ち木を刻みて{{person:鮑信|信}}の形状の如くし、祭りて哭す。{{special:黄巾|黄巾}}を追いて{{place:済北|済北}}に至る。降を乞う。冬、降卒三十余万、男女百余万口を受け、其の精鋭なる者を収め、号して{{special:青州兵|青州兵}}と為す。", "translation_tagged": "懸賞をかけて{{person:鮑信|鮑信}}の遺体を捜索させたが見つからなかったため、人々は木を彫って{{person:鮑信|鮑信}}の生前の姿をかたどり、これを祭って号哭した。その後、{{special:黄巾|黄巾}}賊を追撃して{{place:済北|済北}}に至った。すると賊は降伏を願い出た。冬、降伏した兵卒三十余万人、男女百余万人を受け入れ、そのうちの精鋭を選抜して編成し、名づけて『{{special:青州兵|青州兵}}』とした。"}, {"id": "v1_p19_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 19, "type": "本文", "raw_text": "袁術與紹有隙，術求援於公孫瓚，瓚使劉備屯高唐，單經屯平原，陶謙屯發干，以逼紹。太祖與紹會擊，皆破之。", "kakikudashi": "袁術は紹と隙有り、術は援を公孫瓚に求め、瓚は劉備をして高唐に屯し、単経をして平原に屯し、陶謙をして発干に屯せしめ、以て紹に逼る。太祖は紹と会撃し、皆之を破る。", "translation": "袁術は袁紹と不和になり、袁術が公孫瓚に救援を求めると、公孫瓚は劉備を高唐に駐屯させ、単経を平原に駐屯させ、陶謙を発干に駐屯させて、袁紹に圧力をかけた。太祖は袁紹と連合して攻撃し、これらをすべて打ち破った。", "persons": "袁術,袁紹,公孫瓚,劉備,単経,陶謙,曹操", "places": "高唐,平原,発干", "era_year": "初平3年（192年）冬〜初平4年（193年）初", "source_book": "", "keywords": "", "raw_tagged": "{{person:袁術|袁術}}與{{person:袁紹|紹}}有隙，{{person:袁術|術}}求援於{{person:公孫瓚|公孫瓚}}，{{person:公孫瓚|瓚}}使{{person:劉備|劉備}}屯{{place:高唐|高唐}}，{{person:単経|單經}}屯{{place:平原|平原}}，{{person:陶謙|陶謙}}屯{{place:発干|發干}}，以逼{{person:袁紹|紹}}。{{person:曹操|太祖}}與{{person:袁紹|紹}}會擊，皆破之。", "kakikudashi_tagged": "{{person:袁術|袁術}}は{{person:袁紹|紹}}と隙有り、{{person:袁術|術}}は援を{{person:公孫瓚|公孫瓚}}に求め、{{person:公孫瓚|瓚}}は{{person:劉備|劉備}}をして{{place:高唐|高唐}}に屯し、{{person:単経|単経}}をして{{place:平原|平原}}に屯し、{{person:陶謙|陶謙}}をして{{place:発干|発干}}に屯せしめ、以て{{person:袁紹|紹}}に逼る。{{person:曹操|太祖}}は{{person:袁紹|紹}}と会撃し、皆之を破る。", "translation_tagged": "{{person:袁術|袁術}}は{{person:袁紹|袁紹}}と不和になり、{{person:袁術|袁術}}が{{person:公孫瓚|公孫瓚}}に救援を求めると、{{person:公孫瓚|公孫瓚}}は{{person:劉備|劉備}}を{{place:高唐|高唐}}に駐屯させ、{{person:単経|単経}}を{{place:平原|平原}}に駐屯させ、{{person:陶謙|陶謙}}を{{place:発干|発干}}に駐屯させて、{{person:袁紹|袁紹}}に圧力をかけた。{{person:曹操|太祖}}は{{person:袁紹|袁紹}}と連合して攻撃し、これらをすべて打ち破った。"}, {"id": "v1_p20_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 20, "type": "本文", "raw_text": "四年春，軍鄄城。荊州牧劉表斷術糧道，術引軍入陳留，屯封丘，黑山餘賊及於夫羅等佐之。術使將劉詳屯匡亭。太祖擊詳，術救之，與戰，大破之。術退保封丘，遂圍之，未合，術走襄邑，追到太壽，決渠水灌城。走寧陵，又追之，走九江。夏，太祖還軍定陶。", "kakikudashi": "四年春、鄄城に軍す。荊州牧の劉表は術の糧道を断ち、術は軍を引きて陳留に入り、封丘に屯し、黒山の余賊及び於夫羅等が之を佐く。術は将の劉詳をして匡亭に屯せしむ。太祖は詳を撃ち、術は之を救い、与に戦いて、大いに之を破る。術は退きて封丘を保ち、遂に之を囲むも、未だ合せざるに、術は襄邑に走り、追いて太寿に到り、渠水を決して城に灌ぐ。寧陵に走り、又た之を追えば、九江に走る。夏、太祖は軍を定陶に還す。", "translation": "初平四年（一九三年）春、太祖は鄄城に布陣した。荊州牧の劉表が袁術の糧道を断ったため、袁術は軍を率いて陳留へ入り、封丘に駐屯し、黒山の余賊および於夫羅らがこれを助けた。袁術は部将の劉詳を匡亭に駐屯させた。太祖が劉詳を攻撃すると、袁術が救援に駆けつけ、これと交戦して大いに打ち破った。袁術が退却して封丘に立てこもったため、そのままこれを包囲したが、包囲が完成しないうちに袁術は襄邑へ逃れ、太祖は追撃して太寿に至り、渠水を決壊させて城に水攻めを行った。袁術は寧陵へ逃れ、さらにこれを追撃すると、九江へ逃走した。夏、太祖は軍を定陶へ還した。", "persons": "曹操,劉表,袁術,於夫羅,劉詳", "places": "鄄城,荊州,陳留,封丘,匡亭,襄邑,太寿,汴水,寧陵,九江,定陶", "era_year": "初平4年（193年）春〜夏", "source_book": "", "keywords": "荊州牧,黒山賊", "raw_tagged": "四年春，軍{{place:鄄城|鄄城}}。{{place:荊州|荊州}}{{office:牧|牧}}{{person:劉表|劉表}}斷{{person:袁術|術}}糧道，{{person:袁術|術}}引軍入{{place:陳留|陳留}}，屯{{place:封丘|封丘}}，{{special:黒山賊|黑山餘賊}}及{{person:於夫羅|於夫羅}}等佐之。{{person:袁術|術}}使將{{person:劉詳|劉詳}}屯{{place:匡亭|匡亭}}。{{person:曹操|太祖}}擊{{person:劉詳|詳}}，{{person:袁術|術}}救之，與戰，大破之。{{person:袁術|術}}退保{{place:封丘|封丘}}，遂圍之，未合，{{person:袁術|術}}走{{place:襄邑|襄邑}}，追到{{place:太寿|太壽}}，決{{place:汴水|渠水}}灌城。走{{place:寧陵|寧陵}}，又追之，走{{place:九江|九江}}。夏，{{person:曹操|太祖}}還軍{{place:定陶|定陶}}。", "kakikudashi_tagged": "四年春、{{place:鄄城|鄄城}}に軍す。{{place:荊州|荊州}}{{office:牧|牧}}の{{person:劉表|劉表}}は{{person:袁術|術}}の糧道を断ち、{{person:袁術|術}}は軍を引きて{{place:陳留|陳留}}に入り、{{place:封丘|封丘}}に屯し、{{special:黒山賊|黒山の余賊}}及び{{person:於夫羅|於夫羅}}等が之を佐く。{{person:袁術|術}}は将の{{person:劉詳|劉詳}}をして{{place:匡亭|匡亭}}に屯せしむ。{{person:曹操|太祖}}は{{person:劉詳|詳}}を撃ち、{{person:袁術|術}}は之を救い、与に戦いて、大いに之を破る。{{person:袁術|術}}は退きて{{place:封丘|封丘}}を保ち、遂に之を囲むも、未だ合せざるに、{{person:袁術|術}}は{{place:襄邑|襄邑}}に走り、追いて{{place:太寿|太寿}}に到り、{{place:汴水|渠水}}を決して城に灌ぐ。{{place:寧陵|寧陵}}に走り、又た之を追えば、{{place:九江|九江}}に走る。夏、{{person:曹操|太祖}}は軍を{{place:定陶|定陶}}に還す。", "translation_tagged": "{{special:初平|初平}}四年（一九三年）春、{{person:曹操|太祖}}は{{place:鄄城|鄄城}}に布陣した。{{place:荊州|荊州}}{{office:牧|牧}}の{{person:劉表|劉表}}が{{person:袁術|袁術}}の糧道を断ったため、{{person:袁術|袁術}}は軍を率いて{{place:陳留|陳留}}へ入り、{{place:封丘|封丘}}に駐屯し、{{special:黒山賊|黒山の余賊}}および{{person:於夫羅|於夫羅}}らがこれを助けた。{{person:袁術|袁術}}は部将の{{person:劉詳|劉詳}}を{{place:匡亭|匡亭}}に駐屯させた。{{person:曹操|太祖}}が{{person:劉詳|劉詳}}を攻撃すると、{{person:袁術|袁術}}が救援に駆けつけ、これと交戦して大いに打ち破った。{{person:袁術|袁術}}が退却して{{place:封丘|封丘}}に立てこもったため、そのままこれを包囲したが、包囲が完成しないうちに{{person:袁術|袁術}}は{{place:襄邑|襄邑}}へ逃れ、{{person:曹操|太祖}}は追撃して{{place:太寿|太寿}}に至り、{{place:汴水|渠水}}を決壊させて城に水攻めを行った。{{person:袁術|袁術}}は{{place:寧陵|寧陵}}へ逃れ、さらにこれを追撃すると、{{place:九江|九江}}へ逃走した。夏、{{person:曹操|太祖}}は軍を{{place:定陶|定陶}}へ還した。"}, {"id": "v1_p21_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 21, "type": "本文", "raw_text": "下邳闕宣聚衆數千人，自稱天子；徐州牧陶謙與共舉兵，取泰山華、費，略任城。秋，太祖征陶謙，下十餘城，謙守城不敢出。", "kakikudashi": "下邳の闕宣、衆数千人を聚め、自ら天子と称す；徐州牧の陶謙は与に共に兵を挙げ、泰山の華・費を取り、任城を略す。秋、太祖は陶謙を征し、十余城を下すも、謙は城を守りて敢えて出でず。", "translation": "下邳の闕宣が数千人の群衆を集め、自ら天子を称した；徐州牧の陶謙はこれと共同して兵を挙げ、泰山の華・費を奪い取り、任城を攻略した。秋、太祖は陶謙を征討して十余城を陥落させたが、陶謙は城を固守してあえて打って出ようとしなかった。", "persons": "闕宣,陶謙,曹操", "places": "下邳,徐州,泰山,華,費,任城", "era_year": "初平4年（193年）秋", "source_book": "", "keywords": "徐州牧", "raw_tagged": "{{place:下邳|下邳}}{{person:闕宣|闕宣}}聚衆數千人，自稱天子；{{place:徐州|徐州}}{{office:牧|牧}}{{person:陶謙|陶謙}}與共舉兵，取{{place:泰山|泰山}}{{place:華|華}}、{{place:費|費}}，略{{place:任城|任城}}。秋，{{person:曹操|太祖}}征{{person:陶謙|陶謙}}，下十餘城，{{person:陶謙|謙}}守城不敢出。", "kakikudashi_tagged": "{{place:下邳|下邳}}の{{person:闕宣|闕宣}}、衆数千人を聚め、自ら天子と称す；{{place:徐州|徐州}}{{office:牧|牧}}の{{person:陶謙|陶謙}}は与に共に兵を挙げ、{{place:泰山|泰山}}の{{place:華|華}}・{{place:費|費}}を取り、{{place:任城|任城}}を略す。秋、{{person:曹操|太祖}}は{{person:陶謙|陶謙}}を征し、十余城を下すも、{{person:陶謙|謙}}は城を守りて敢えて出でず。", "translation_tagged": "{{place:下邳|下邳}}の{{person:闕宣|闕宣}}が数千人の群衆を集め、自ら天子を称した；{{place:徐州|徐州}}{{office:牧|牧}}の{{person:陶謙|陶謙}}はこれと共同して兵を挙げ、{{place:泰山|泰山}}の{{place:華|華}}・{{place:費|費}}を奪い取り、{{place:任城|任城}}を攻略した。秋、{{person:曹操|太祖}}は{{person:陶謙|陶謙}}を征討して十余城を陥落させたが、{{person:陶謙|陶謙}}は城を固守してあえて打って出ようとしなかった。"}, {"id": "v1_p22_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 22, "type": "本文", "raw_text": "是歲，孫策受袁術使渡江，數年閒遂有江東。", "kakikudashi": "是の歳、孫策は袁術の使を受けて江を渡り、数年の間に遂に江東を有す。", "translation": "この年、孫策は袁術の命を受けて長江を渡り、数年のうちに遂に江東を領有した。", "persons": "孫策,袁術", "places": "長江,江東", "era_year": "初平4年（193年）〜", "source_book": "", "keywords": "", "raw_tagged": "是歲，{{person:孫策|孫策}}受{{person:袁術|袁術}}使渡{{place:長江|江}}，數年閒遂有{{place:江東|江東}}。", "kakikudashi_tagged": "是の歳、{{person:孫策|孫策}}は{{person:袁術|袁術}}の使を受けて{{place:長江|江}}を渡り、数年の間に遂に{{place:江東|江東}}を有す。", "translation_tagged": "この年、{{person:孫策|孫策}}は{{person:袁術|袁術}}の命を受けて{{place:長江|長江}}を渡り、数年のうちに遂に{{place:江東|江東}}を領有した。"}, {"id": "v1_p23_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 23, "type": "本文", "raw_text": "興平元年春，太祖自徐州還，初，太祖父嵩去官後還譙，董卓之亂，避難琅邪，爲陶謙所害，故太祖志在復讎東伐。", "kakikudashi": "興平元年春、太祖は徐州より還る、初め、太祖の父の嵩は官を去りて後に譙に還り、董卓の乱に、難を琅邪に避くるも、陶謙の害する所と為る、故に太祖は志、復讎して東伐するに在り。", "translation": "興平元年（一九四年）春、太祖は徐州から帰還した。これより以前、太祖の父・曹嵩は太尉の官を退いた後に故郷の譙へ帰っていたが、董卓の乱が起きると琅邪へ難を避けたところ、陶謙によって殺害されたため、太祖は父の仇を討つべく再び東方へ征伐する決意を固めていた。", "persons": "曹操,曹嵩,董卓,陶謙", "places": "徐州,譙,琅邪", "era_year": "興平元年（194年）春", "source_book": "", "keywords": "興平", "raw_tagged": "{{special:興平|興平元年}}春，{{person:曹操|太祖}}自{{place:徐州|徐州}}還，初，{{person:曹操|太祖}}父{{person:曹嵩|嵩}}去官後還{{place:譙|譙}}，{{person:董卓|董卓}}之亂，避難{{place:琅邪|琅邪}}，爲{{person:陶謙|陶謙}}所害，故{{person:曹操|太祖}}志在復讎東伐。", "kakikudashi_tagged": "{{special:興平|興平元年}}春、{{person:曹操|太祖}}は{{place:徐州|徐州}}より還る、初め、{{person:曹操|太祖}}の父の{{person:曹嵩|嵩}}は官を去りて後に{{place:譙|譙}}に還り、{{person:董卓|董卓}}の乱に、難を{{place:琅邪|琅邪}}に避くるも、{{person:陶謙|陶謙}}の害する所と為る、故に{{person:曹操|太祖}}は志、復讎して東伐するに在り。", "translation_tagged": "{{special:興平|興平元年}}（一九四年）春、{{person:曹操|太祖}}は{{place:徐州|徐州}}から帰還した。これより以前、{{person:曹操|太祖}}の父・{{person:曹嵩|曹嵩}}は{{office:太尉|太尉}}の官を退いた後に故郷の{{place:譙|譙}}へ帰っていたが、{{person:董卓|董卓}}の乱が起きると{{place:琅邪|琅邪}}へ難を避けたところ、{{person:陶謙|陶謙}}によって殺害されたため、{{person:曹操|太祖}}は父の仇を討つべく再び東方へ征伐する決意を固めていた。"}, {"id": "v1_p23_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 23, "type": "裴注", "raw_text": "《世語》曰：嵩在泰山華縣。太祖令泰山太守應劭送家詣兖州，劭兵未至，陶謙密遣數千騎掩捕。嵩家以爲劭迎，不設備。謙兵至，殺太祖弟德於門中。嵩懼，穿後垣，先出其妾，妾肥，不時得出；嵩逃于厠，與妾俱被害，闔門皆死。劭懼，棄官赴袁紹。後太祖定冀州，劭時已死。韋曜《吳書》曰：太祖迎嵩，輜重百餘兩。陶謙遣都尉張闓將騎二百衞送，闓於泰山華、費間殺嵩，取財物，因奔淮南。太祖歸咎於陶謙，故伐之。", "kakikudashi": "『世語』に曰く、「嵩は泰山の華県に在り。太祖は泰山太守の応劭をして家を送りて兗州に詣らしめんとするに、劭の兵が未だ至らざるに、陶謙は密かに数千騎を遣わして掩捕せしむ。嵩の家は劭の迎えと以為い、備えを設けず。謙の兵至り、太祖の弟の徳を門中に殺す。嵩は懼れ、後垣を穿ちて、先ず其の妾を出ださんとするに、妾は肥え、時を以て出づるを得ず；嵩は厠に逃れ、妾と俱に害せられ、闔門皆死す。劭は懼れ、官を棄てて袁紹に赴く。後に太祖が冀州を定むるや、劭は時に已に死せり」と。韋曜の『呉書』に曰く、「太祖は嵩を迎うるに、輜重は百余両あり。陶謙は都尉の張闓を遣わして騎二百を将いて衛送せしむるに、闓は泰山の華・費の間に於て嵩を殺し、財物を取り、因りて淮南に奔る。太祖は咎を陶謙に帰し、故に之を伐つ」と。", "translation": "『世語』にいう。「曹嵩は泰山郡の華県に滞在していた。太祖は泰山太守の応劭に命じて父の一家を兗州へ護送させようとしたが、応劭の兵がまだ到着しないうちに、陶謙は密かに数千騎を派遣して奇襲・捕縛させた。曹嵩の一家は応劭の迎えが来たものと思い込み、防備をしていなかった。陶謙の兵は到着すると、太祖の弟の曹徳を門の中で殺害した。曹嵩は恐れて裏の垣根に穴を掘り、まず自分の愛妾を外へ逃がそうとしたが、その妾が太っていたため、すぐには抜け出すことができなかった；曹嵩は厠（かわや）に隠れたものの、妾ともども殺害され、一族郎党ことごとく命を落とした。応劭は太祖の怒りを恐れ、官職を棄てて袁紹のもとへ逃亡した。のちに太祖が冀州を平定したとき、応劭はすでに死去していた」。韋曜の『呉書』にいう。「太祖が父の曹嵩を迎え入れた際、その輜重（荷物車）は百余両にのぼった。陶謙は都尉の張闓を派遣し、騎兵二百を率いて護衛・見送りさせたが、張闓は泰山郡の華県と費県の間において曹嵩を殺害し、財物を奪い取って、そのまま淮南へ逃亡した。太祖はその罪を陶謙になすりつけ、それゆえに陶謙を討伐したのである」。", "persons": "曹嵩,曹操,応劭,陶謙,曹徳,袁紹,韋昭,張闓", "places": "泰山,華,兗州,冀州,費,九江", "era_year": "初平4年（193年）〜興平元年（194年）", "source_book": "世語・呉書", "keywords": "泰山太守,都尉", "raw_tagged": "{{special:引用史料|《世語》}}曰：{{person:曹嵩|嵩}}在{{place:泰山|泰山}}{{place:華|華縣}}。{{person:曹操|太祖}}令{{place:泰山|泰山}}{{office:太守|太守}}{{person:応劭|應劭}}送家詣{{place:兗州|兖州}}，{{person:応劭|劭}}兵未至，{{person:陶謙|陶謙}}密遣數千騎掩捕。{{person:曹嵩|嵩}}家以爲{{person:応劭|劭}}迎，不設備。{{person:陶謙|謙}}兵至，殺{{person:曹操|太祖}}弟{{person:曹徳|德}}於門中。{{person:曹嵩|嵩}}懼，穿後垣，先出其妾，妾肥，不時得出；{{person:曹嵩|嵩}}逃于厠，與妾俱被害，闔門皆死。{{person:応劭|劭}}懼，棄官赴{{person:袁紹|袁紹}}。後{{person:曹操|太祖}}定{{place:冀州|冀州}}，{{person:応劭|劭}}時已死。{{person:韋昭|韋曜}}{{special:引用史料|《吳書》}}曰：{{person:曹操|太祖}}迎{{person:曹嵩|嵩}}，輜重百餘兩。{{person:陶謙|陶謙}}遣{{office:都尉|都尉}}{{person:張闓|張闓}}將騎二百衞送，{{person:張闓|闓}}於{{place:泰山|泰山}}{{place:華|華}}、{{place:費|費}}間殺{{person:曹嵩|嵩}}，取財物，因奔{{place:九江|淮南}}。{{person:曹操|太祖}}歸咎於{{person:陶謙|陶謙}}，故伐之。", "kakikudashi_tagged": "{{special:引用史料|『世語』}}に曰く、「{{person:曹嵩|嵩}}は{{place:泰山|泰山}}の{{place:華|華県}}に在り。{{person:曹操|太祖}}は{{place:泰山|泰山}}{{office:太守|太守}}の{{person:応劭|応劭}}をして家を送りて{{place:兗州|兗州}}に詣らしめんとするに、{{person:応劭|劭}}の兵が未だ至らざるに、{{person:陶謙|陶謙}}は密かに数千騎を遣わして掩捕せしむ。{{person:曹嵩|嵩}}の家は{{person:応劭|劭}}の迎えと以為い、備えを設けず。{{person:陶謙|謙}}の兵至り、{{person:曹操|太祖}}の弟の{{person:曹徳|徳}}を門中に殺す。{{person:曹嵩|嵩}}は懼れ、後垣を穿ちて、先ず其の妾を出ださんとするに、妾は肥え、時を以て出づるを得ず；{{person:曹嵩|嵩}}は厠に逃れ、妾と俱に害せられ、闔門皆死す。{{person:応劭|劭}}は懼れ、官を棄てて{{person:袁紹|袁紹}}に赴く。後に{{person:曹操|太祖}}が{{place:冀州|冀州}}を定むるや、{{person:応劭|劭}}は時に已に死せり」と。{{person:韋昭|韋曜}}の{{special:引用史料|『呉書』}}に曰く、「{{person:曹操|太祖}}は{{person:曹嵩|嵩}}を迎うるに、輜重は百余両あり。{{person:陶謙|陶謙}}は{{office:都尉|都尉}}の{{person:張闓|張闓}}を遣わして騎二百を将いて衛送せしむるに、{{person:張闓|闓}}は{{place:泰山|泰山}}の{{place:華|華}}・{{place:費|費}}の間に於て{{person:曹嵩|嵩}}を殺し、財物を取り、因りて{{place:九江|淮南}}に奔る。{{person:曹操|太祖}}は咎を{{person:陶謙|陶謙}}に帰し、故に之を伐つ」と。", "translation_tagged": "{{special:引用史料|『世語』}}にいう。「{{person:曹嵩|曹嵩}}は{{place:泰山|泰山郡}}の{{place:華|華県}}に滞在していた。{{person:曹操|太祖}}は{{place:泰山|泰山}}{{office:太守|太守}}の{{person:応劭|応劭}}に命じて父の一家を{{place:兗州|兗州}}へ護送させようとしたが、{{person:応劭|応劭}}の兵がまだ到着しないうちに、{{person:陶謙|陶謙}}は密かに数千騎を派遣して奇襲・捕縛させた。{{person:曹嵩|曹嵩}}の一家は{{person:応劭|応劭}}の迎えが来たものと思い込み、防備をしていなかった。{{person:陶謙|陶謙}}の兵は到着すると、{{person:曹操|太祖}}の弟の{{person:曹徳|曹徳}}を門の中で殺害した。{{person:曹嵩|曹嵩}}は恐れて裏の垣根に穴を掘り、まず自分の愛妾を外へ逃がそうとしたが、その妾が太っていたため、すぐには抜け出すことができなかった；{{person:曹嵩|曹嵩}}は厠（かわや）に隠れたものの、妾ともども殺害され、一族郎党ことごとく命を落とした。{{person:応劭|応劭}}は{{person:曹操|太祖}}の怒りを恐れ、官職を棄てて{{person:袁紹|袁紹}}のもとへ逃亡した。のちに{{person:曹操|太祖}}が{{place:冀州|冀州}}を平定したとき、{{person:応劭|応劭}}はすでに死去していた」。{{person:韋昭|韋曜}}の{{special:引用史料|『呉書』}}にいう。「{{person:曹操|太祖}}が父の{{person:曹嵩|曹嵩}}を迎え入れた際、その輜重（荷物車）は百余両にのぼった。{{person:陶謙|陶謙}}は{{office:都尉|都尉}}の{{person:張闓|張闓}}を派遣し、騎兵二百を率いて護衛・見送りさせたが、{{person:張闓|張闓}}は{{place:泰山|泰山郡}}の{{place:華|華県}}と{{place:費|費県}}の間において{{person:曹嵩|曹嵩}}を殺害し、財物を奪い取って、そのまま{{place:九江|淮南}}へ逃亡した。{{person:曹操|太祖}}はその罪を{{person:陶謙|陶謙}}になすりつけ、それゆえに{{person:陶謙|陶謙}}を討伐したのである」。"}, {"id": "v1_p23_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 23, "type": "本文", "raw_text": "夏，使荀彧、程昱守鄄城，復征陶謙，拔五城，遂略地至東海。還過郯，謙將曹豹與劉備屯郯東，要太祖。太祖擊破之，遂攻拔襄賁，所過多所殘戮。", "kakikudashi": "夏、荀彧・程昱をして鄄城を守らしめ、復た陶謙を征し、五城を抜き、遂に地を略して東海に至る。還りて郯を過ぐるに、謙の将の曹豹と劉備が郯の東に屯し、太祖を要す。太祖は撃ちて之を破り、遂に攻めて襄賁を抜き、過ぐる所は残戮する所多し。", "translation": "夏、荀彧と程昱に鄄城を守らせ、再び陶謙を征討して五つの城を攻略し、そのまま領地を席巻して東海郡にまで至った。帰還の途上で郯県を通りかかると、陶謙の部将・曹豹と劉備が郯の東に布陣して太祖を待ち伏せした。太祖はこれを撃ち破り、さらに攻めて襄賁を陥落させ、通過した地域では多くの民衆を残虐に殺戮した。", "persons": "曹操,荀彧,程昱,陶謙,曹豹,劉備", "places": "鄄城,東海,郯,襄賁", "era_year": "興平元年（194年）夏", "source_book": "", "keywords": "", "raw_tagged": "夏，使{{person:荀彧|荀彧}}、{{person:程昱|程昱}}守{{place:鄄城|鄄城}}，復征{{person:陶謙|陶謙}}，拔五城，遂略地至{{place:東海|東海}}。還過{{place:郯|郯}}，{{person:陶謙|謙}}將{{person:曹豹|曹豹}}與{{person:劉備|劉備}}屯{{place:郯|郯}}東，要{{person:曹操|太祖}}。{{person:曹操|太祖}}擊破之，遂攻拔{{place:襄賁|襄賁}}，所過多所殘戮。", "kakikudashi_tagged": "夏、{{person:荀彧|荀彧}}・{{person:程昱|程昱}}をして{{place:鄄城|鄄城}}を守らしめ、復た{{person:陶謙|陶謙}}を征し、五城を抜き、遂に地を略して{{place:東海|東海}}に至る。還りて{{place:郯|郯}}を過ぐるに、{{person:陶謙|謙}}の将の{{person:曹豹|曹豹}}と{{person:劉備|劉備}}が{{place:郯|郯}}の東に屯し、{{person:曹操|太祖}}を要す。{{person:曹操|太祖}}は撃ちて之を破り、遂に攻めて{{place:襄賁|襄賁}}を抜き、過ぐる所は残戮する所多し。", "translation_tagged": "夏、{{person:荀彧|荀彧}}と{{person:程昱|程昱}}に{{place:鄄城|鄄城}}を守らせ、再び{{person:陶謙|陶謙}}を征討して五つの城を攻略し、そのまま領地を席巻して{{place:東海|東海郡}}にまで至った。帰還の途上で{{place:郯|郯県}}を通りかかると、{{person:陶謙|陶謙}}の部将・{{person:曹豹|曹豹}}と{{person:劉備|劉備}}が{{place:郯|郯}}の東に布陣して{{person:曹操|太祖}}を待ち伏せした。{{person:曹操|太祖}}はこれを撃ち破り、さらに攻めて{{place:襄賁|襄賁}}を陥落させ、通過した地域では多くの民衆を残虐に殺戮した。"}, {"id": "v1_p23_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 23, "type": "裴注", "raw_text": "孫盛曰：夫伐罪弔民，古之令軌；罪謙之由，而殘其屬部，過矣。", "kakikudashi": "孫盛曰く、「夫れ罪を伐ち民を弔うは、古の令軌なり；罪は謙に之れ由るに、其の属部を残うは、過てり」と。", "translation": "孫盛は評していう。「そもそも罪ある君主を討ち、苦しむ民衆を慰撫するのが、古今の善き規範である；罪の原因は陶謙にあるというのに、その支配下の民衆まで残虐に手にかけたのは、甚だしい過ちである」。", "persons": "孫盛,陶謙", "places": "", "era_year": "興平元年（194年）", "source_book": "孫盛評", "keywords": "", "raw_tagged": "{{person:孫盛|孫盛}}曰：夫伐罪弔民，古之令軌；罪{{person:陶謙|謙}}之由，而殘其屬部，過矣。", "kakikudashi_tagged": "{{person:孫盛|孫盛}}曰く、「夫れ罪を伐ち民を弔うは、古の令軌なり；罪は{{person:陶謙|謙}}に之れ由るに、其の属部を残うは、過てり」と。", "translation_tagged": "{{person:孫盛|孫盛}}は評していう。「そもそも罪ある君主を討ち、苦しむ民衆を慰撫するのが、古今の善き規範である；罪の原因は{{person:陶謙|陶謙}}にあるというのに、その支配下の民衆まで残虐に手にかけたのは、甚だしい過ちである」。"}, {"id": "v1_p24_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 24, "type": "本文", "raw_text": "會張邈與陳宮叛迎呂布，郡縣皆應。荀彧、程昱保鄄城，范、東阿二縣固守，太祖乃引軍還。布到，攻鄄城不能下，西屯濮陽。太祖曰：「布一旦得一州，不能據東平，斷亢父、泰山之道，乘險要我，而乃屯濮陽，吾知其無能爲也。」遂進軍攻之。布出兵戰，先以騎犯青州兵。青州兵奔，太祖陣亂，馳突火出，墜馬，燒左手掌。司馬樓異扶太祖上馬，遂引去。", "kakikudashi": "会々張邈が陳宮と叛きて呂布を迎え、郡県は皆応ず。荀彧・程昱は鄄城を保ち、范・東阿の二県は固守し、太祖は乃ち軍を引きて還る。布は到り、鄄城を攻むるも下す能わず、西のかた濮陽に屯す。太祖曰く、「布は一旦にして一州を得るも、東平に拠りて、亢父・泰山の道を断ち、険に乗じて我を要する能わず、而して乃ち濮陽に屯す、吾は其の能く為す無きを知るなり」と。遂に軍を進めて之を攻む。布は兵を出だして戦い、先ず騎を以て青州兵を犯す。青州兵は奔り、太祖の陣は乱れ、馳せて火を突きて出で、馬より墜ち、左の手掌を焼く。司馬の楼異が太祖を扶けて馬に上せ、遂に引きて去る。", "translation": "折しも張邈が陳宮とともに反旗を翻して呂布を迎え入れ、兗州の諸郡県はみなこれに呼応した。ただ荀彧と程昱が鄄城を保ち、さらに范・東阿の二県が堅く守りを固めたため、太祖は軍を引き返して帰還した。呂布は到着すると鄄城を攻撃したが陥落させられず、西の濮陽に駐屯した。太祖は言った、「呂布は一日にして一州を手に入れながら、東平に拠って亢父・泰山の街道を遮断し、要害に乗じて我らを待ち伏せすることができず、かえって濮陽に駐屯している。私には彼が大したことを成し得ないと分かったぞ」と。こうして軍を進めてこれを攻撃した。呂布は兵を出して交戦し、まず騎兵をもって青州兵に突撃させた。青州兵が潰走したため太祖の陣形は乱れ、太祖は馬を走らせて炎の中を突破して脱出した際、落馬して左の掌に火傷を負った。司馬の楼異が太祖を抱きかかえて馬に乗せ、ついに軍を引いて退却した。", "persons": "張邈,陳宮,呂布,荀彧,程昱,曹操,楼異", "places": "兗州,鄄城,范,東阿,濮陽,東平,亢父,泰山", "era_year": "興平元年（194年）夏", "source_book": "", "keywords": "青州兵,司馬", "raw_tagged": "會{{person:張邈|張邈}}與{{person:陳宮|陳宮}}叛迎{{person:呂布|呂布}}，郡縣皆應。{{person:荀彧|荀彧}}、{{person:程昱|程昱}}保{{place:鄄城|鄄城}}，{{place:范|范}}、{{place:東阿|東阿}}二縣固守，{{person:曹操|太祖}}乃引軍還。{{person:呂布|布}}到，攻{{place:鄄城|鄄城}}不能下，西屯{{place:濮陽|濮陽}}。{{person:曹操|太祖}}曰：「{{person:呂布|布}}一旦得一州，不能據{{place:東平|東平}}，斷{{place:亢父|亢父}}、{{place:泰山|泰山}}之道，乘險要我，而乃屯{{place:濮陽|濮陽}}，吾知其無能爲也。」遂進軍攻之。{{person:呂布|布}}出兵戰，先以騎犯{{special:青州兵|青州兵}}。{{special:青州兵|青州兵}}奔，{{person:曹操|太祖}}陣亂，馳突火出，墜馬，燒左手掌。{{office:司馬|司馬}}{{person:楼異|樓異}}扶{{person:曹操|太祖}}上馬，遂引去。", "kakikudashi_tagged": "会々{{person:張邈|張邈}}が{{person:陳宮|陳宮}}と叛きて{{person:呂布|呂布}}を迎え、郡県は皆応ず。{{person:荀彧|荀彧}}・{{person:程昱|程昱}}は{{place:鄄城|鄄城}}を保ち、{{place:范|范}}・{{place:東阿|東阿}}の二県は固守し、{{person:曹操|太祖}}は乃ち軍を引きて還る。{{person:呂布|布}}は到り、{{place:鄄城|鄄城}}を攻むるも下す能わず、西のかた{{place:濮陽|濮陽}}に屯す。{{person:曹操|太祖}}曰く、「{{person:呂布|布}}は一旦にして一州を得るも、{{place:東平|東平}}に拠りて、{{place:亢 示無反意。及戰，軍敗。{{person:呂布|布}}騎得{{person:曹操|太祖}}而不知是，問曰：「{{person:曹操|曹操}}何在？」{{person:曹操|太祖}}曰：「乘黃馬走者是也。」{{person:呂布|布}}騎乃釋{{person:曹操|太祖}}而追黃馬者。門火猶盛，{{person:曹操|太祖}}突火而出。", "kakikudashi_tagged": "{{person:袁暐|袁暐}}の{{special:引用史料|『献帝春秋』}}に曰く、「{{person:曹操|太祖}}が{{place:濮陽|濮陽}}を囲むや、{{place:濮陽|濮陽}}の大姓の田氏が反間を為し、{{person:曹操|太祖}}は城に入るを得たり。其の東門を焼き、反意無きを示す。戦うに及びて、軍敗る。{{person:呂布|布}}の騎が{{person:曹操|太祖}}を得るも是れなるを知らず、問いて曰く、『{{person:曹操|曹操}}は何くにか在る？』と。{{person:曹操|太祖}}曰く、『黄馬に乗りて走る者が是れなり』と。{{person:呂布|布}}の騎は乃ち{{person:曹操|太祖}}を釈して黄馬の者を追う。門火は猶お盛んなるも、{{person:曹操|太祖}}は火を突きて出づ」と。", "translation_tagged": "{{person:袁暐|袁暐}}の{{special:引用史料|『献帝春秋』}}にいう。「{{person:曹操|太祖}}が{{place:濮陽|濮陽}}を包囲した際、{{place:濮陽|濮陽}}の豪族である田氏が内応して手引きをしたため、{{person:曹操|太祖}}は城内へ入ることができた。{{person:曹操|太祖}}はその東門を焼き払い、退却する意思がないことを示した。しかし交戦に及んで、軍は敗れた。{{person:呂布|呂布}}の騎兵が{{person:曹操|太祖}}を捕らえたが、それが本人だとは気づかず、『{{person:曹操|曹操}}はどこにいるか？』と尋ねた。{{person:曹操|太祖}}は『黄色い馬に乗って逃げていく者がそうだ』と答えた。{{person:呂布|呂布}}の騎兵はそこで{{person:曹操|太祖}}を解放し、黄色い馬の者を追いかけていった。城門の炎はなおも激しく燃え盛っていたが、{{person:曹操|太祖}}はその炎を突破して脱出した」。"}, {"id": "v1_p24_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 24, "type": "本文", "raw_text": "未至營止，諸將未與太祖相見，皆怖。太祖乃自力勞軍，令軍中促爲攻具，進復攻之，與布相守百餘日。蝗蟲起，百姓大餓，布糧食亦盡，各引去。", "kakikudashi": "未だ営に至らずして止まり、諸将は未だ太祖と相見ざれば、皆怖る。太祖は乃ち自ら力めて軍を労い、軍中に令して促して攻具を為らしめ、進みて復た之を攻め、布と相守ること百余日なり。蝗虫起こり、百姓は大いに餓え、布の糧食も亦た尽き、各々引きて去る。", "translation": "まだ本営に着かないうちに足を止めたため、諸将はまだ太祖の姿を見ることができず、みな恐怖に駆られた。そこで太祖は気力を振り絞って自ら将兵をねぎらい、軍中に命じて急ぎ攻城兵器を作らせ、進軍して再び呂布を攻撃し、呂布と百余日にわたって対峙した。やがてイナゴの害（蝗害）が発生して民衆は大飢饉に陥り、呂布の兵糧もまた尽きたため、双方はそれぞれ軍を引いて去った。", "persons": "曹操,呂布", "places": "", "era_year": "興平元年（194年）夏〜秋", "source_book": "", "keywords": "", "raw_tagged": "未至營止，諸將未與{{person:曹操|太祖}}相見，皆怖。{{person:曹操|太祖}}乃自力勞軍，令軍中促爲攻具，進復攻之，與{{person:呂布|布}}相守百餘日。蝗蟲起，百姓大餓，{{person:呂布|布}}糧食亦盡，各引去。", "kakikudashi_tagged": "未だ営に至らずして止まり、諸将は未だ{{person:曹操|太祖}}と相見ざれば、皆怖る。{{person:曹操|太祖}}は乃ち自ら力めて軍を労い、軍中に令して促して攻具を為らしめ、進みて復た之を攻め、{{person:呂布|布}}と相守ること百余日なり。蝗虫起こり、百姓は大いに餓え、{{person:呂布|布}}の糧食も亦た尽き、各々引きて去る。", "translation_tagged": "まだ本営に着かないうちに足を止めたため、諸将はまだ{{person:曹操|太祖}}の姿を見ることができず、みな恐怖に駆られた。そこで{{person:曹操|太祖}}は気力を振り絞って自ら将兵をねぎらい、軍中に命じて急ぎ攻城兵器を作らせ、進軍して再び{{person:呂布|呂布}}を攻撃し、{{person:呂布|呂布}}と百余日にわたって対峙した。やがてイナゴの害（蝗害）が発生して民衆は大飢饉に陥り、{{person:呂布|呂布}}の兵糧もまた尽きたため、双方はそれぞれ軍を引いて去った。"}, {"id": "v1_p25_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 25, "type": "本文", "raw_text": "秋九月，太祖還鄄城。布到乘氏，爲其縣人李進所破，東屯山陽。於是紹使人說太祖，欲連和。太祖新失兖州，軍食盡，將許之。程昱止太祖，太祖從之。冬十月，太祖至東阿。", "kakikudashi": "秋九月、太祖は鄄城に還る。布は乗氏に到り、其の県人の李進の破る所と為り、東のかた山陽に屯す。是に於て紹は人をして太祖に説かしめ、連和せんと欲す。太祖は新たに兗州を失い、軍食も尽き、将に之を許さんとす。程昱が太祖を止め、太祖は之に従う。冬十月、太祖は東阿に至る。", "translation": "秋九月、太祖は鄄城へ帰還した。呂布は乗氏県へ至ったが、その県の豪族である李進によって撃破され、東の山陽郡に駐屯した。このとき袁紹が使者を送って太祖を説得し、講和・同盟を結ぼうと持ちかけた。太祖は兗州を失ったばかりで軍の兵糧も尽きていたため、これを受け入れようとした。しかし程昱が太祖を諫めて思いとどまらせたので、太祖はこれに従った。冬十月、太祖は東阿へ至った。", "persons": "曹操,呂布,李進,袁紹,程昱", "places": "鄄城,乗氏,山陽,兗州,東阿", "era_year": "興平元年（194年）9月〜10月", "source_book": "", "keywords": "", "raw_tagged": "秋九月，{{person:曹操|太祖}}還{{place:鄄城|鄄城}}。{{person:呂布|布}}到{{place:乗氏|乘氏}}，爲其縣人{{person:李進|李進}}所破，東屯{{place:山陽|山陽}}。於是{{person:袁紹|紹}}使人說{{person:曹操|太祖}}，欲連和。{{person:曹操|太祖}}新失{{place:兗州|兖州}}，軍食盡，將許之。{{person:程昱|程昱}}止{{person:曹操|太祖}}，{{person:曹操|太祖}}從之。冬十月，{{person:曹操|太祖}}至{{place:東阿|東阿}}。", "kakikudashi_tagged": "秋九月、{{person:曹操|太祖}}は{{place:鄄城|鄄城}}に還る。{{person:呂布|布}}は{{place:乗氏|乗氏}}に到り、其の県人の{{person:李進|李進}}の破る所と為り、東のかた{{place:山陽|山陽}}に屯す。是に於て{{person:袁紹|紹}}は人をして{{person:曹操|太祖}}に説かしめ、連和せんと欲す。{{person:曹操|太祖}}は新たに{{place:兗州|兗州}}を失い、軍食も尽き、将に之を許さんとす。{{person:程昱|程昱}}が{{person:曹操|太祖}}を止め、{{person:曹操|太祖}}は之に従う。冬十月、{{person:曹操|太祖}}は{{place:東阿|東阿}}に至る。", "translation_tagged": "秋九月、{{person:曹操|太祖}}は{{place:鄄城|鄄城}}へ帰還した。{{person:呂布|呂布}}は{{place:乗氏|乗氏県}}へ至ったが、その県の豪族である{{person:李進|李進}}によって撃破され、東の{{place:山陽|山陽郡}}に駐屯した。このとき{{person:袁紹|袁紹}}が使者を送って{{person:曹操|太祖}}を説得し、講和・同盟を結ぼうと持ちかけた。{{person:曹操|太祖}}は{{place:兗州|兗州}}を失ったばかりで軍の兵糧も尽きていたため、これを受け入れようとした。しかし{{person:程昱|程昱}}が{{person:曹操|太祖}}を諫めて思いとどまらせたので、{{person:曹操|太祖}}はこれに従った。冬十月、{{person:曹操|太祖}}は{{place:東阿|東阿}}へ至った。"}, {"id": "v1_p26_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 26, "type": "本文", "raw_text": "是歲穀一斛五十餘萬錢，人相食，乃罷吏兵新募者。陶謙死，劉備代之。", "kakikudashi": "是の歳、穀は一斛ごとに五十余万銭、人相食み、乃ち吏兵の新募なる者を罷む。陶謙死し、劉備が之に代わる。", "translation": "この年、穀物は一斛あたり五十余万銭にまで暴騰し、人が人を食い合う惨状となったため、新たに募集した官吏や兵士たちを解雇して帰郷させた。また陶謙が死去し、劉備がこれに代わって徐州を領した。", "persons": "曹操,陶謙,劉備", "places": "徐州", "era_year": "興平元年（194年）冬", "source_book": "", "keywords": "", "raw_tagged": "是歲穀一斛五十餘萬錢，人相食，乃罷吏兵新募者。{{person:陶謙|陶謙}}死，{{person:劉備|劉備}}代之。", "kakikudashi_tagged": "是の歳、穀は一斛ごとに五十余万銭、人相食み、乃ち吏兵の新募なる者を罷む。{{person:陶謙|陶謙}}死し、{{person:劉備|劉備}}が之に代わる。", "translation_tagged": "この年、穀物は一斛あたり五十余万銭にまで暴騰し、人が人を食い合う惨状となったため、新たに募集した官吏や兵士たちを解雇して帰郷させた。また{{person:陶謙|陶謙}}が死去し、{{person:劉備|劉備}}がこれに代わって{{place:徐州|徐州}}を領した。"}, {"id": "v1_p27_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 27, "type": "本文", "raw_text": "二年春，襲定陶。濟陰太守吳資保南城，未拔。會呂布至，又擊破之。夏，布將薛蘭、李封屯鉅野，太祖攻之，布救蘭，蘭敗，布走，遂斬蘭等。布復從東緍與陳宮將萬餘人來戰，時太祖兵少，設伏，縱奇兵擊，大破之。", "kakikudashi": "二年春、定陶を襲う。済陰太守の呉資が南城を保ち、未だ抜かず。会々呂布至り、又た撃ちて之を破る。夏、布の将の薛蘭・李封が鉅野に屯し、太祖は之を攻むるに、布は蘭を救うも、蘭は敗れ、布は走り、遂に蘭等を斬る。布は復た東緍より陳宮と万余人を将いて来たり戦うに、時に太祖は兵少なく、伏を設け、奇兵を縦ちて撃ち、大いに之を破る。", "translation": "興平二年（一九五年）春、太祖は定陶を奇襲した。済陰太守の呉資が南城を保って防戦したため、まだ陥落させられずにいた。そこへ呂布が救援に到来したが、太祖はまたこれを撃ち破った。夏、呂布の部将である薛蘭と李封が鉅野に駐屯していたため、太祖がこれを攻撃すると、呂布は薛蘭を救援しようとしたが、薛蘭は敗れて呂布は逃走し、太祖はついに薛蘭らを斬り捨てた。呂布は再び東緍から陳宮とともに一万余人を率いて戦いを挑んできたが、このとき太祖は手元の兵が少なかったものの、伏兵を設け、奇兵を放って攻撃し、大いにこれを打ち破った。", "persons": "曹操,呉資,呂布,薛蘭,李封,陳宮", "places": "定陶,済陰,鉅野,東緍", "era_year": "興平2年（195年）春〜夏", "source_book": "", "keywords": "済陰太守", "raw_tagged": "二年春，襲{{place:定陶|定陶}}。{{place:済陰|濟陰}}{{office:太守|太守}}{{person:呉資|吳資}}保南城，未拔。會{{person:呂布|呂布}}至，又擊破之。夏，{{person:呂布|布}}將{{person:薛蘭|薛蘭}}、{{person:李封|李封}}屯{{place:鉅野|鉅野}}，{{person:曹操|太祖}}攻之，{{person:呂布|布}}救{{person:薛蘭|蘭}}，{{person:薛蘭|蘭}}敗，{{person:呂布|布}}走，遂斬{{person:薛蘭|蘭}}等。{{person:呂布|布}}復從{{place:東緍|東緍}}與{{person:陳宮|陳宮}}將萬餘人來戰，時{{person:曹操|太祖}}兵少，設伏，縱奇兵擊，大破之。", "kakikudashi_tagged": "二年春、{{place:定陶|定陶}}を襲う。{{place:済陰|済陰}}{{office:太守|太守}}の{{person:呉資|呉資}}が南城を保ち、未だ抜かず。会々{{person:呂布|呂布}}至り、又た撃ちて之を破る。夏、{{person:呂布|布}}の将の{{person:薛蘭|薛蘭}}・{{person:李封|李封}}が{{place:鉅野|鉅野}}に屯し、{{person:曹操|太祖}}は之を攻むるに、{{person:呂布|布}}は{{person:薛蘭|蘭}}を救うも、{{person:薛蘭|蘭}}は敗れ、{{person:呂布|布}}は走り、遂に{{person:薛蘭|蘭}}等を斬る。{{person:呂布|布}}は復た{{place:東緍|東緍}}より{{person:陳宮|陳宮}}と万余人を将いて来たり戦うに、時に{{person:曹操|太祖}}は兵少なく、伏を設け、奇兵を縦ちて撃ち、大いに之を破る。", "translation_tagged": "{{special:興平|興平}}二年（一九五年）春、{{person:曹操|太祖}}は{{place:定陶|定陶}}を奇襲した。{{place:済陰|済陰}}{{office:太守|太守}}の{{person:呉資|呉資}}が南城を保って防戦したため、まだ陥落させられずにいた。そこへ{{person:呂布|呂布}}が救援に到来したが、{{person:曹操|太祖}}はまたこれを撃ち破った。夏、{{person:呂布|呂布}}の部将である{{person:薛蘭|薛蘭}}と{{person:李封|李封}}が{{place:鉅野|鉅野}}に駐屯していたため、{{person:曹操|太祖}}がこれを攻撃すると、{{person:呂布|呂布}}は{{person:薛蘭|薛蘭}}を救援しようとしたが、{{person:薛蘭|薛蘭}}は敗れて{{person:呂布|呂布}}は逃走し、{{person:曹操|太祖}}はついに{{person:薛蘭|薛蘭}}らを斬り捨てた。{{person:呂布|呂布}}は再び{{place:東緍|東緍}}から{{person:陳宮|陳宮}}とともに一万余人を率いて戦いを挑んできたが、このとき{{person:曹操|太祖}}は手元の兵が少なかったものの、伏兵を設け、奇兵を放って攻撃し、大いにこれを打ち破った。"}, {"id": "v1_p27_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 27, "type": "裴注", "raw_text": "《魏書》曰：於是兵皆出取麥，在者不能千人，屯營不固。太祖乃令婦人守陴，悉兵拒之。屯西有大隄，其南樹木幽深。布疑有伏，乃相謂曰：「曹操多譎，勿入伏中。」引軍屯南十餘里。明日復來，太祖隱兵隄裏，出半兵隄外。布益進，乃令輕兵挑戰，旣合，伏兵乃悉乘隄，步騎並進，大破之，獲其龍車，追至其營而還。", "kakikudashi": "『魏書』に曰く、「是に於て兵は皆出でて麦を取り、在る者は千人なる能わず、屯営は固からず。太祖は乃ち婦人をして陴を守らしめ、兵を悉して之を拒ぐ。屯の西に大隄有り、其の南は樹木が幽深なり。布は伏有るかと疑い、乃ち相謂いて曰く、『曹操は譎多し、伏中に入る勿かれ』と。軍を引きて南十余里に屯す。明日復た来たるや、太祖は兵を隄裏に隠し、半兵を隄外に出だす。布が益々進むや、乃ち軽兵をして戦いを挑ましめ、既に合するや、伏兵は乃ち悉く隄に乗り、歩騎並び進み、大いに之を破り、其の龍車を獲て、追いて其の営に至りて還る」と。", "translation": "『魏書』にいう。「このとき太祖の兵はみな麦刈りに出ており、陣営に残っていた者は千人にも満たず、陣営の守りも堅固ではなかった。そこで太祖は女たちに城壁の胸墻を守らせて兵力を多く見せかけ、残る全兵力を挙げて呂布を迎え撃った。陣営の西には大きな堤防があり、その南側には樹木が深く生い茂っていた。呂布は伏兵がいるのではないかと疑い、味方に語って言った、『曹操は計略が多い男だ、伏兵の中へ踏み込んではならぬ』と。そうして軍を引いて南へ十余里の地点に駐屯した。翌日、呂布が再び攻め寄せてくると、太祖は兵の半分を堤防の裏側に隠し、残り半分の兵を堤防の外へ出した。呂布がさらに前進してくると、軽装の兵に命じて挑発させ、両軍が交戦に入った瞬間、伏兵が一斉に堤防へ駆け上がり、歩兵と騎兵が並んで突撃して大いにこれを打ち破り、呂布の龍車（鼓車）を鹵獲し、その本営まで追撃して帰還した」。", "persons": "曹操,呂布", "places": "", "era_year": "興平2年（195年）夏", "source_book": "魏書", "keywords": "", "raw_tagged": "{{special:引用史料|《魏書》}}曰：於是兵皆出取麥，在者不能千人，屯營不固。{{person:曹操|太祖}}乃令婦人守陴，悉兵拒之。屯西有大隄，其南樹木幽深。{{person:呂布|布}}疑有伏，乃相謂曰：「{{person:曹操|曹操}}多譎，勿入伏中。」引軍屯南十餘里。明日復來，{{person:曹操|太祖}}隱兵隄裏，出半兵隄外。{{person:呂布|布}}益進，乃令輕兵挑戰，旣合，伏兵乃悉乘隄，步騎並進，大破之，獲其龍車，追至其營而還。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「是に於て兵は皆出でて麦を取り、在る者は千人なる能わず、屯営は固からず。{{person:曹操|太祖}}は乃ち婦人をして陴を守らしめ、兵を悉して之を拒ぐ。屯の西に大隄有り、其の南は樹木が幽深なり。{{person:呂布|布}}は伏有るかと疑い、乃ち相謂いて曰く、『{{person:曹操|曹操}}は譎多し、伏中に入る勿かれ』と。軍を引きて南十余里に屯す。明日復た来たるや、{{person:曹操|太祖}}は兵を隄裏に隠し、半兵を隄外に出だす。{{person:呂布|布}}が益々進むや、乃ち軽兵をして戦いを挑ましめ、既に合するや、伏兵は乃ち悉く隄に乗り、歩騎並び進み、大いに之を破り、其の龍車を獲て、追いて其の営に至りて還る」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「このとき{{person:曹操|太祖}}の兵はみな麦刈りに出ており、陣営に残っていた者は千人にも満たず、陣営の守りも堅固ではなかった。そこで{{person:曹操|太祖}}は女たちに城壁の胸墻を守らせて兵力を多く見せかけ、残る全兵力を挙げて{{person:呂布|呂布}}を迎え撃った。陣営の西には大きな堤防があり、その南側には樹木が深く生い茂っていた。{{person:呂布|呂布}}は伏兵がいるのではないかと疑い、味方に語って言った、『{{person:曹操|曹操}}は計略が多い男だ、伏兵の中へ踏み込んではならぬ』と。そうして軍を引いて南へ十余里の地点に駐屯した。翌日、{{person:呂布|呂布}}が再び攻め寄せてくると、{{person:曹操|太祖}}は兵の半分を堤防の裏側に隠し、残り半分の兵を堤防の外へ出した。{{person:呂布|呂布}}がさらに前進してくると、軽装の兵に命じて挑発させ、両軍が交戦に入った瞬間、伏兵が一斉に堤防へ駆け上がり、歩兵と騎兵が並んで突撃して大いにこれを打ち破り、{{person:呂布|呂布}}の龍車（鼓車）を鹵獲し、その本営まで追撃して帰還した」。"}, {"id": "v1_p27_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 27, "type": "本文", "raw_text": "布夜走，太祖復攻，拔定陶，分兵平諸縣。布東奔劉備，張邈從布，使其弟超將家屬保雍丘。秋八月，圍雍丘。冬十月，天子拜太祖兖州牧。十二月，雍丘潰，超自殺。夷邈三族。邈詣袁術請救，爲其衆所殺，兖州平，遂東略陳地。", "kakikudashi": "布は夜に走り、太祖は復た攻め、定陶を抜き、兵を分ちて諸県を平らぐ。布は東のかた劉備に奔り、張邈は布に従い、其の弟の超をして家属を将いて雍丘を保たしむ。秋八月、雍丘を囲む。冬十月、天子は太祖を拝して兗州牧と為す。十二月、雍丘は潰え、超は自殺す。邈の三族を夷ぐ。邈は袁術に詣りて救いを請わんとし、其の衆の殺す所と為り、兗州は平らぎ、遂に東のかた陳地を略す。", "translation": "呂布が夜陰に乗じて逃走すると、太祖は再び定陶を攻めてこれを陥落させ、兵を分けて周辺の諸県を平定した。呂布は東の劉備のもとへ逃奔し、張邈も呂布に従い、弟の張超に一族郎党を率いて雍丘を守らせた。秋八月、太祖は雍丘を包囲した。冬十月、天子（献帝）は太祖を正式に兗州牧に拝した。十二月、雍丘が陥落し、張超は自害した。太祖は張邈の三族を皆殺しにした。張邈は袁術のもとへ赴いて救援を請おうとしたが、道中で自らの部下たちに殺害され、こうして兗州は平定され、太祖はそのまま東へ進んで陳地（陳国）を攻略した。", "persons": "呂布,曹操,劉備,張邈,張超,献帝,袁術", "places": "定陶,雍丘,兗州,陳国", "era_year": "興平2年（195年）夏〜冬12月", "source_book": "", "keywords": "兗州牧", "
