り、{{place:費亭|費亭}}{{office:列侯|侯}}に封じられた。"}, {"id": "v1_p1_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 1, "type": "裴注", "raw_text": "司馬彪《續漢書》曰：騰父節，字元偉，素以仁厚稱。鄰人有亡豕者，與節豕相類，詣門認之，節不與爭；後所亡豕自還其家，豕主人大慙，送所認豕，并辭謝節，節笑而受之。由是鄉黨貴歎焉。長子伯興，次子仲興，次子叔興。騰字季興，少除黃門從官。永寧元年，鄧太后詔黃門令選中黃門從官年少溫謹者，配皇太子書，騰應其選。太子特親愛騰，飲食賞賜與衆有異。順帝即位，爲小黃門，遷至中常侍大長秋。在省闥三十餘年，歷事四帝，未甞有過。好進達賢能，終無所毀傷。其所稱薦，若陳留虞放、邊韶、南陽延固、張溫、弘農張奐、潁川堂谿典等，皆致位公卿，而不伐其善。蜀郡太守因計吏修敬於騰，益州刺史种暠於函谷關搜得其牋，上太守，并奏騰內臣外交，所不當爲，請免官治罪。帝曰：「牋自外來，騰書不出，非其罪也。」乃寑暠奏。騰不以介意，常稱歎暠，以爲暠得事上之節。暠後爲司徒，語人曰：「今日爲公，乃曹常侍恩也。」騰之行事，皆此類也。桓帝即位，以騰先帝舊臣，忠孝彰著，封費亭侯，加位特進。太和三年，追尊騰曰高皇帝。", "kakikudashi": "司馬彪の『続漢書』に曰く、「騰の父の節、字は元偉、素より仁厚を以て称せらる。隣人に豕を亡う者有り、節の豕と相類す、門に詣りて之を認むるに、節は与に争わず；後に亡う所の豕自ら其の家に還り、豕の主人大いに慙じ、認むる所の豕を送り、并せて節に辞謝するに、節は笑いて之を受く。是に由りて郷党は貴びて焉を歎ず。長子は伯興、次子は仲興、次子は叔興。騰は字は季興、少くして黄門従官に除せらる。永寧元年、鄧太后は黄門令に詔して中黄門従官の年少くして温謹なる者を選び、皇太子の書に配せしむるに、騰は其の選に応ず。太子は特に騰を親愛し、飲食・賞賜は衆と異なる有り。順帝即位するや、小黄門と為り、遷りて中常侍・大長秋に至る。省闥に在ること三十余年、四帝に歴事し、未だ嘗て過ち有らず。好みて賢能を進達し、終に毀傷する所無し。其の称薦する所、陳留の虞放・辺韶、南陽の延固・張温、弘農の張奐、潁川の堂谿典等の若きは、皆位を公卿に致すも、其の善に伐らず。蜀郡太守、計吏に因りて敬を騰に修むるに、益州刺史の种暠、函谷関に於いて其の牋を捜し得、太守を上奏し、并せて騰は内臣にして外交し、まさに為すべき所に非ざれば、官を免じて罪を治めんことを請う。帝曰く、『牋は外より来たり、騰の書は出でざれば、其の罪に非ざるなり』と。乃ち暠の奏を寝む。騰は以て意に介せず、常に暠を称歎し、暠は上に事うるの節義を得たりと為す。暠は後に司徒と為り、人に語りて曰く、『今日公と為るは、乃ち曹常侍の恩なり』と。騰の行事は、皆此の類なり。桓帝即位するや、騰が先帝の旧臣にして、忠孝の彰著なるを以て、費亭侯に封じ、位に特進を加う。太和三年、騰を追尊して高皇帝と曰う」と。", "translation": "司馬彪の『続漢書』にいう。「曹騰の父の曹節は、字を元偉といい、日頃から情け深く温厚な人柄で知られていた。あるとき隣人で豚を逃がした者がおり、その豚が曹節の豚とよく似ていたため、曹節の家の門を訪れて自分の豚だと主張したが、曹節はこれと争わなかった；のちに見失っていた豚が自ら隣人の家に帰り着いたため、豚の飼い主は大いに恥じ入り、譲り受けていた豚を送り返し、あわせて曹節に深く謝罪したところ、曹節は笑ってこれを受け入れた。これによって郷里の人々は曹節を尊び感嘆した。長男は伯興、次男は仲興、三男は叔興といった。末子の曹騰は字を季興といい、若くして黄門従官に任じられた。永寧元年（120年）、鄧太后が黄門令に詔を下し、中黄門従官のうち年若く温厚で慎み深い者を選んで皇太子の学友に配属させた際、曹騰がその選抜にかなった。皇太子はとりわけ曹騰を親愛し、飲食や恩賞の賜与も他の者とは別格であった。順帝が即位すると、曹騰は小黄門となり、昇進して中常侍・大長秋に至った。宮中に奉職すること三十余年、四代の皇帝に歴仕して、ただの一度も過失がなかった。好んで賢者や有能な人材を推挙・抜擢し、最後まで人を中傷し陥れることがなかった。曹騰が称揚・推薦した人物には、陳留の虞放・辺韶、南陽の延固・張温、弘農の張奐、潁川の堂谿典らがおり、いずれも公卿の高位にまで昇ったが、曹騰はその善行を誇ることがなかった。あるとき蜀郡太守が上計吏を通じて曹騰に挨拶と贈り物の書状を送ったところ、益州刺史の种暠が函谷関でその書状を検閲して発見し、蜀郡太守を弾劾するとともに、曹騰もまた宮中の内 erson:曹嵩|曹嵩}}は字を{{person:曹嵩|巨高}}といった。生まれつき篤実で慎み深く、どの任地にあっても忠孝を尽くした。{{office:司隷校尉|司隷校尉}}となり、{{person:霊帝|霊帝}}に抜擢されて{{office:大司農|大司農}}・{{office:大鴻臚|大鴻臚}}に任じられ、{{person:崔烈|崔烈}}に代わって{{office:太尉|太尉}}となった。魏の{{special:黄初|黄初元年}}（220年）、{{person:曹嵩|曹嵩}}に{{person:曹嵩|太皇帝}}の号を追尊した」。呉の人が著した{{special:引用史料|『曹瞞伝』}}および{{person:郭頒|郭頒}}の{{special:引用史料|『世語』}}はともに、「{{person:曹嵩|曹嵩}}は夏侯氏の子で、{{person:夏侯惇|夏侯惇}}の叔父にあたる。{{person:曹操|太祖}}は{{person:夏侯惇|夏侯惇}}とは従兄弟の関係にあたる」と記す。"}, {"id": "v1_p1_7", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 1, "type": "本文", "raw_text": "嵩生太祖。", "kakikudashi": "嵩、太祖を生む。", "translation": "この曹嵩が太祖を生んだのである。", "persons": "曹嵩,曹操", "places": "", "era_year": "永寿元年（155年）", "source_book": "", "keywords": "曹操誕生", "raw_tagged": "{{person:曹嵩|嵩}}生{{person:曹操|太祖}}。", "kakikudashi_tagged": "{{person:曹嵩|嵩}}、{{person:曹操|太祖}}を生む。", "translation_tagged": "この{{person:曹嵩|曹嵩}}が{{person:曹操|太祖}}を生んだのである。"}, {"id": "v1_p2_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "本文", "raw_text": "太祖少機警，有權數，而任俠放蕩，不治行業，故世人未之奇也；", "kakikudashi": "太祖は少くして機警、権数有りて、任侠放蕩、行業を治めず、故に世人は未だ之を奇とせざるなり；", "translation": "太祖は若い頃から機敏で才略に富んでいたが、任侠を好んで奔放に振る舞い、品行や生業を修めなかったため、世間の人々はまだ彼を非凡な人物だとは気づいていなかった；", "persons": "曹操", "places": "", "era_year": "", "source_book": "", "keywords": "機警,権数,任侠", "raw_tagged": "{{person:曹操|太祖}}少機警，有權數，而任俠放蕩，不治行業，故世人未之奇也；", "kakikudashi_tagged": "{{person:曹操|太祖}}は少くして機警、権数有りて、任侠放蕩、行業を治めず、故に世人は未だ之を奇とせざるなり；", "translation_tagged": "{{person:曹操|太祖}}は若い頃から機敏で才略に富んでいたが、任侠を好んで奔放に振る舞い、品行や生業を修めなかったため、世間の人々はまだ彼を非凡な人物だとは気づいていなかった；"}, {"id": "v1_p2_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "裴注", "raw_text": "《曹瞞傳》云：太祖少好飛鷹走狗，游蕩無度，其叔父數言之於嵩。太祖患之，後逢叔父於路，乃陽敗面喎口；叔父怪而問其故，太祖曰：「卒中惡風。」叔父以告嵩。嵩驚愕，呼太祖，太祖口貌如故。嵩問曰：「叔父言汝中風，已差乎？」太祖曰：「初不中風，但失愛於叔父，故見罔耳。」嵩乃疑焉。自後叔父有所告，嵩終不復信，太祖於是益得肆意矣。", "kakikudashi": "『曹瞞伝』に云う、「太祖は少くして飛鷹走狗を好み、游蕩して度無く、其の叔父はしばしば之を嵩に言う。太祖は之を患え、後に叔父に路に逢うや、乃ち陽りて面を敗り口を喎む；叔父は怪しみて其の故を問うに、太祖曰く、『卒かに悪風に中たる』と。叔父は以て嵩に告ぐ。嵩は驚愕し、太祖を呼ぶに、太祖の口貌は故の如し。嵩問いて曰く、『叔父は汝が中風せりと言うも、已に差えたるか？』と。太祖曰く、『初めより中風せず、但だ愛を叔父に失う、故に罔いらるるのみ』と。嵩は乃ち焉を疑う。自後、叔父に告ぐる所有るも、嵩は終に復た信ぜず、太祖は是に於いて益々意を肆にするを得たり」と。", "translation": "『曹瞞伝』にいう。「太祖は若い頃、鷹狩りや犬を使った狩りを好み、遊び呆けて節度がなかったため、その叔父がたびたび父の曹嵩にこれを取り締まるよう言いつけた。太祖はこれを疎ましく思い、のちに道で叔父に出くわした際、わざと顔をゆがめて口をひきつらせた；叔父が訝しんでその理由を尋ねると、太祖は『急に中風にかかってしまいました』と答えた。叔父はそのことを曹嵩に告げた。曹嵩は驚愕して太祖を呼び寄せたが、太祖の口元や顔つきは普段通りであった。曹嵩が『叔父上が、お前が中風にかかったと言っておられたが、もう治ったのか？』と尋ねた。太祖は『最初から中風など患っておりません、ただ叔父上に嫌われておりますので、無実の讒言をされただけです』と答えた。曹嵩はそこで叔父の言葉を疑うようになった。これ以降、叔父が何か言いつけても曹嵩は二度と信じなくなり、太祖はこうして思うままに振る舞えるようになった」。", "persons": "曹操,曹嵩", "places": "", "era_year": "", "source_book": "曹瞞伝", "keywords": "飛鷹走狗,中風", "raw_tagged": "{{special:引用史料|《曹瞞傳》}}云：{{person:曹操|太祖}}少好飛鷹走狗，游蕩無度，其叔父數言之於{{person:曹嵩|嵩}}。{{person:曹操|太祖}}患之，後逢叔父於路，乃陽敗面喎口；叔父怪而問其故，{{person:曹操|太祖}}曰：「卒{{special:中風|中惡風}}。」叔父以告{{person:曹嵩|嵩}}。{{person:曹嵩|嵩}}驚愕，呼{{person:曹操|太祖}}，{{person:曹操|太祖}}口貌如故。{{person:曹嵩|嵩}}問曰：「叔父言汝{{special:中風|中風}}，已差乎？」{{person:曹操|太祖}}曰：「初不{{special:中風|中風}}，但失愛於叔父，故見罔耳。」{{person:曹嵩|嵩}}乃疑焉。自後叔父有所告，{{person:曹嵩|嵩}}終不復信，{{person:曹操|太祖}}於是益得肆意矣。", "kakikudashi_tagged": "{{special:引用史料|『曹瞞伝』}}に云う、「{{person:曹操|太祖}}は少くして飛鷹走狗を好み、游蕩して度無く、其の叔父はしばしば之を{{person:曹嵩|嵩}}に言う。{{person:曹操|太祖}}は之を患え、後に叔父に路に逢うや、乃ち陽りて面を敗り口を喎む；叔父は怪しみて其の故を問うに、{{person:曹操|太祖}}曰く、『卒かに{{special:中風|悪風に中たる}}』と。叔父は以て{{person:曹嵩|嵩}}に告ぐ。{{person:曹嵩|嵩}}は驚愕し、{{person:曹操|太祖}}を呼ぶに、{{person:曹操|太祖}}の口貌は故の如し。{{person:曹嵩|嵩}}問いて曰く、『叔父は汝が{{special:中風|中風}}せりと言うも、已に差えたるか？』と。{{person:曹操|太祖}}曰く、『初めより{{special:中風|中風}}せず、但だ愛を叔父に失う、故に罔いらるるのみ』と。{{person:曹嵩|嵩}}は乃ち焉を疑う。自後、叔父に告ぐる所有るも、{{person:曹嵩|嵩}}は終に復た信ぜず、{{person:曹操|太祖}}は是に於いて益々意を肆にするを得たり」と。", "translation_tagged": "{{special:引用史料|『曹瞞伝』}}にいう。「{{person:曹操|太祖}}は若い頃、鷹狩りや犬を使った狩りを好み、遊び呆けて節度がなかったため、その叔父がたびたび父の{{person:曹嵩|曹嵩}}にこれを取り締まるよう言いつけた。{{person:曹操|太祖}}はこれを疎ましく思い、のちに道で叔父に出くわした際、わざと顔をゆがめて口をひきつらせた；叔父が訝しんでその理由を尋ねると、{{person:曹操|太祖}}は『急に{{special:中風|中風}}にかかってしまいました』と答えた。叔父はそのことを{{person:曹嵩|曹嵩}}に告げた。{{person:曹嵩|曹嵩}}は驚愕して{{person:曹操|太祖}}を呼び寄せたが、{{person:曹操|太祖}}の口元や顔つきは普段通りであった。{{person:曹嵩|曹嵩}}が『叔父上が、お前が{{special:中風|中風}}にかかったと言っておられたが、もう治ったのか？』と尋ねた。{{person:曹操|太祖}}は『最初から{{special:中風|中風}}など患っておりません、ただ叔父上に嫌われておりますので、無実の讒言をされただけです』と答えた。{{person:曹嵩|曹嵩}}はそこで叔父の言葉を疑うようになった。これ以降、叔父が何か言いつけても{{person:曹嵩|曹嵩}}は二度と信じなくなり、{{person:曹操|太祖}}はこうして思うままに振る舞えるようになった」。"}, {"id": "v1_p2_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "本文", "raw_text": "惟梁國橋玄、南陽何顒異焉。玄謂太祖曰：「天下將亂，非命世之才不能濟也，能安之者，其在君乎！」", "kakikudashi": "惟だ梁国の橋玄、南陽の何顒のみ焉を異とす。玄は太祖に謂いて曰く、「天下は将に乱れんとす、命世の才に非ざれば済う能わざるなり、能く之を安んずる者は、其れ君に在るか！」と。", "translation": "ただ梁国の橋玄と南陽の何顒だけは、太祖の非凡さを見抜いていた。橋玄は太祖に語って、「天下はまさに乱れようとしており、一世に抜きん出た希代の才能の持ち主でなければ救うことはできないが、天下を安んずることができるのは、まさに君であろうか！」と言った。", "persons": "橋玄,何顒,曹操", "places": "梁国,南陽", "era_year": "", "source_book": "", "keywords": "命世之才", "raw_tagged": "惟{{place:梁国|梁國}}{{person:橋玄|橋玄}}、{{place:南陽|南陽}}{{person:何顒|何顒}}異焉。{{person:橋玄|玄}}謂{{person:曹操|太祖}}曰：「天下將亂，非命世之才不能濟也，能安之者，其在君乎！」", "kakikudashi_tagged": "惟だ{{place:梁国|梁国}}の{{person:橋玄|橋玄}}、{{place:南陽|南陽}}の{{person:何顒|何顒}}のみ焉を異とす。{{person:橋玄|玄}}は{{person:曹操|太祖}}に謂いて曰く、「天下は将に乱れんとす、命世の才に非ざれば済う能わざるなり、能く之を安んずる者は、其れ君に在るか！」と。", "translation_tagged": "ただ{{place:梁国|梁国}}の{{person:橋玄|橋玄}}と{{place:南陽|南陽}}の{{person:何顒|何顒}}だけは、{{person:曹操|太祖}}の非凡さを見抜いていた。{{person:橋玄|橋玄}}は{{person:曹操|太祖}}に語って、「天下はまさに乱れようとしており、一世に抜きん出た希代の才能の持ち主でなければ救うことはできないが、天下を安んずることができるのは、まさに君であろうか！」と言った。"}, {"id": "v1_p2_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "裴注", "raw_text": "《魏書》曰：太尉橋玄，世名知人，覩太祖而異之，曰：「吾見天下名士多矣，未有若君者也！君善自持。吾老矣！願以妻子爲託。」由是聲名益重。《續漢書》曰：玄字公祖，嚴明有才略，長於人物。張璠《漢紀》曰：玄歷位中外，以剛斷稱，謙儉下士，不以王爵私親。光和中爲太尉，以久病策罷，拜太中大夫，卒，家貧乏產業，柩無所殯。當世以此稱爲名臣。《世語》曰：玄謂太祖曰：「君未有名，可交許子將。」太祖乃造子將，子將納焉，由是知名。孫盛異同雜語云：太祖甞私入中常侍張讓室，讓覺之；乃舞手戟於庭，踰垣而出。才武絕人，莫之能害。博覽群書，特好兵法，抄集諸家兵法，名曰接要，又注孫武十三篇，皆傳於世。甞問許子將：「我何如人？」子將不荅。固問之，子將曰：「子治世之能臣，亂世之姦雄。」太祖大笑。", "kakikudashi": "『魏書』に曰く、「太尉の橋玄は、世に人を知ると名あり、太祖を覩て之を異とし、曰く、『吾、天下の名士を見るや多きも、未だ君の若き者は有らざるなり！君、善く自ら持せよ。吾は老いたり！願わくは妻子を以て託と為さん』と。是に由りて声名は益々重し」と。『続漢書』に曰く、「玄は字は公祖、厳明にして才略有り、人物に長ず」と。張璠の『漢紀』に曰く、「玄は位を中外に歴し、剛断を以て称せられ、謙倹にして士に下り、王爵を以て親に私せず。光和中に太尉と為り、久病を以て策罷せられ、太中大夫に拝せられ、卒するに、家は貧しくして産業に乏しく、柩は殯する所無し。当世、此を以て称して名臣と為す」と。『世語』に曰く、「玄は太祖に謂いて曰く、『君は未だ名有らず、許子将に交わるべし』と。太祖は乃ち子将に造り、子将は焉を納れ、是に由りて名を知らる」と。孫盛の『異同雑語』に云う、「太祖は嘗て私かに中常侍の張譲の室に入るに、譲は之を覚る；乃ち手戟を庭に舞わし、垣を踰えて出ず。才武は人に絶し、之を能く害する莫し。群書を博覧し、特に兵法を好み、諸家の兵法を抄集して、名づけて『接要』と曰い、又『孫武十三篇』に注し、皆世に伝わる。嘗て許子将に問う、『我は何如なる人ぞ？』と。子将は荅えず。固く之を問うに、子将曰く、『子は治世の能臣、乱世の姦雄なり』と。太祖は大いに笑う」と。", "translation": "『魏書』にいう。「太尉の橋玄は、世に人物鑑識の名手として知られていたが、太祖を一目見てその非凡さに驚き、『私は天下の名士を数多く見てきたが、まだ君のような人物には出会ったことがない！君よ、どうか自重して身を持してほしい。私はもう年老いた！願わくは私の妻子を君に託したい』と言った。これによって太祖の名声はますます重きをなした」。『続漢書』にいう。「橋玄は字を公祖といい、厳正明察で才略があり、人物を見抜く眼力に優れていた」。張璠の『漢紀』にいう。「橋玄は中央や地方の要職を歴任し、剛直果断をもって称えられ、謙虚で倹約を旨として士人にへりくだり、高官の爵位を笠に着て親族を私的に優遇することがなかった。光和年間に太尉となり、長患いのため職を免じられて太中大夫に任じられ、亡くなったときには家が貧しくて資産に乏しく、棺を安置する場所さえなかった。当時の人々はこれをもって彼を名臣と称えた」。『世語』にいう。「橋玄は太祖に『君はまだ世に名を知られていないから、許子将と交際するとよい』と言った。そこで太祖が許子将のもとを訪ねると、許子将は彼を受け入れ、これによって世に名を知られるようになった」。孫盛の『異同雑語』にいう。「太祖はかつて密かに中常侍の張譲の屋敷に忍び込んだことがあったが、張譲がこれに気づいた；すると太祖は手戟を庭で振るって舞い、垣根を飛び越えて脱出した。才気と武芸は人並み外れており、誰も彼を害することはできなかった。また多くの書物を博覧し、とりわけ兵法を好んで、諸家の兵法書を抜粋・集成して『接要』と名づけ、さらに『孫武十三篇』に注釈を施し、いずれも世に伝わっている。かつて許子将に『私はどのような人物か？』と尋ねた。許子将は答えなかった。しきりに問い詰めると、許子将は『君は治世の能臣、乱世の姦雄である』と言った。太祖は大いに笑った」。", "persons": "橋玄,曹操,張璠,許劭,孫盛,張譲,孫武", "places": "", "era_year": "光和年間（178年〜184年）頃", "source_book": "魏書・続漢書・漢紀・世語・異同雑語", "keywords": "太尉,太中大夫,中常侍,接要,孫武十三篇,治世の能臣・乱世の姦雄", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{office:太尉|太尉}}{{person:橋玄|橋玄}}，世名知人，覩{{person:曹操|太祖}}而異之，曰：「吾見天下名士多矣，未有若君者也！君善自持。吾老矣！願以妻子爲託。」由是聲名益重。{{special:引用史料|《續漢書》}}曰：{{person:橋玄|玄}}字{{person:橋玄|公祖}}，嚴明有才略，長於人物。{{person:張璠|張璠}}{{special:引用史料|《漢紀》}}曰：{{person:橋玄|玄}}歷位中外，以剛斷稱，謙儉下士，不以王爵私親。{{special:光和|光和中}}爲{{office:太尉|太尉}}，以久病策罷，拜{{office:太中大夫|太中大夫}}，卒，家貧乏產業，柩無所殯。當世以此稱爲名臣。{{special:引用史料|《世語》}}曰：{{person:橋玄|玄}}謂{{person:曹操|太祖}}曰：「君未有名，可交{{person:許劭|許子將}}。」{{person:曹操|太祖}}乃造{{person:許劭|子將}}，{{person:許劭|子將}}納焉，由是知名。{{person:孫盛|孫盛}}{{special:引用史料|異同雜語}}云：{{person:曹操|太祖}}甞私入{{office:中常侍|中常侍}}{{person:張譲|張讓}}室，{{person:張譲|讓}}覺之；乃舞手戟於庭，踰垣而出。才武絕人 い』と言った。そこで{{person:曹操|太祖}}が{{person:許劭|許子将}}のもとを訪ねると、{{person:許劭|許子将}}は彼を受け入れ、これによって世に名を知られるようになった」。{{person:孫盛|孫盛}}の{{special:引用史料|『異同雑語』}}にいう。「{{person:曹操|太祖}}はかつて密かに{{office:中常侍|中常侍}}の{{person:張譲|張譲}}の屋敷に忍び込んだことがあったが、{{person:張譲|張譲}}がこれに気づいた；すると{{person:曹操|太祖}}は手戟を庭で振るって舞い、垣根を飛び越えて脱出した。才気と武芸は人並み外れており、誰も彼を害することはできなかった。また多くの書物を博覧し、とりわけ兵法を好んで、諸家の兵法書を抜粋・集成して{{special:兵法書|『接要』}}と名づけ、さらに{{special:兵法書|『孫武十三篇』}}に注釈を施し、いずれも世に伝わっている。かつて{{person:許劭|許子将}}に『私はどのような人物か？』と尋ねた。{{person:許劭|許子将}}は答えなかった。しきりに問い詰めると、{{person:許劭|許子将}}は『君は{{special:姦雄|治世の能臣、乱世の姦雄}}である』と言った。{{person:曹操|太祖}}は大いに笑った」。"}, {"id": "v1_p2_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "本文", "raw_text": "年二十，舉孝廉爲郎，除洛陽北部尉，遷頓丘令，", "kakikudashi": "年二十にして、孝廉に挙げられて郎と為り、洛陽北部尉に除せられ、頓丘令に遷り、", "translation": "二十歳のとき、孝廉に推挙されて郎となり、洛陽北部尉に任じられ、ついで頓丘令に昇進し、", "persons": "曹操", "places": "洛陽,頓丘", "era_year": "熹平3年（174年）〜", "source_book": "", "keywords": "孝廉,郎,北部尉,頓丘令", "raw_tagged": "年二十，舉{{office:孝廉|孝廉}}爲{{office:郎|郎}}，除{{place:洛陽|洛陽}}{{office:北部尉|北部尉}}，遷{{place:頓丘|頓丘}}{{office:県令|令}}，", "kakikudashi_tagged": "年二十にして、{{office:孝廉|孝廉}}に挙げられて{{office:郎|郎}}と為り、{{place:洛陽|洛陽}}{{office:北部尉|北部尉}}に除せられ、{{place:頓丘|頓丘}}{{office:県令|令}}に遷り、", "translation_tagged": "二十歳のとき、{{office:孝廉|孝廉}}に推挙されて{{office:郎|郎}}となり、{{place:洛陽|洛陽}}{{office:北部尉|北部尉}}に任じられ、ついで{{place:頓丘|頓丘}}{{office:県令|令}}に昇進し、"}, {"id": "v1_p2_6", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "裴注", "raw_text": "《曹瞞傳》曰：太祖初入尉廨，繕治四門。造五色棒，縣門左右各十餘枚，有犯禁者，不避豪彊，皆棒殺之。後數月，靈帝愛幸小黃門蹇碩叔父夜行，即殺之。京師斂迹，莫敢犯者。近習寵臣咸疾之，然不能傷，於是共稱薦之，故遷爲頓丘令。", "kakikudashi": "『曹瞞伝』に曰く、「太祖は初めて尉廨に入るや、四門を繕治す。五色棒を造り、門の左右に各々十余枚を懸け、禁を犯す者有れば、豪彊を避けず、皆之を棒殺す。後数月、霊帝の愛幸する小黄門の蹇碩の叔父、夜行するに、即ち之を殺す。京師は迹を斂め、敢えて犯す者莫し。近習の寵臣は咸く之を疾むも、然れども傷う能わず、是に於いて共に之を称薦す、故に遷りて頓丘令と為る」と。", "translation": "『曹瞞伝』にいう。「太祖は初めて北部尉の官舎に入ると、四方の門を修繕した。そして五色棒を作って門の左右にそれぞれ十数本ずつ懸けさせ、禁令を犯す者があれば権門豪族であろうと容赦せず、すべてこの棒で打ち殺した。数か月後、霊帝が寵愛する小黄門の蹇碩の叔父が夜間通行の禁を犯して出歩いたため、ただちにこれを処刑した。これにより京師では誰もが身を慎み、あえて法を犯す者はいなくなった。側近の寵臣たちはみな太祖を憎んだが、非の打ちどころがなくて中傷することもできなかったため、こぞって彼を称揚・推薦し、こうして頓丘令へと転出させたのである」。", "persons": "曹操,霊帝,蹇碩", "places": "洛陽,頓丘", "era_year": "熹平年間（174年〜177年）頃", "source_book": "曹瞞伝", "keywords": "五色棒,小黄門,頓丘令", "raw_tagged": "{{special:引用史料|《曹瞞傳》}}曰：{{person:曹操|太祖}}初入尉廨，繕治四門。造{{special:五色棒|五色棒}}，縣門左右各十餘枚，有犯禁者，不避豪彊，皆棒殺之。後數月，{{person:霊帝|靈帝}}愛幸{{office:小黄門|小黃門}}{{person:蹇碩|蹇碩}}叔父夜行，即殺之。{{place:洛陽|京師}}斂迹，莫敢犯者。近習寵臣咸疾之，然不能傷，於是共稱薦之，故遷爲{{place:頓丘|頓丘}}{{office:県令|令}}。", "kakikudashi_tagged": "{{special:引用史料|『曹瞞伝』}}に曰く、「{{person:曹操|太祖}}は初めて尉廨に入るや、四門を繕治す。{{special:五色棒|五色棒}}を造り、門の左右に各々十余枚を懸け、禁を犯す者有れば、豪彊を避けず、皆之を棒殺す。後数月、{{person:霊帝|霊帝}}の愛幸する{{office:小黄門|小黄門}}の{{person:蹇碩|蹇碩}}の叔父、夜行するに、即ち之を殺す。{{place:洛陽|京師}}は迹を斂め、敢えて犯す者莫し。近習の寵臣は咸く之を疾むも、然れども傷う能わず、是に於いて共に之を称薦す、故に遷りて{{place:頓丘|頓丘}}{{office:県令|令}}と為る」と。", "translation_tagged": "{{special:引用史料|『曹瞞伝』}}にいう。「{{person:曹操|太祖}}は初めて{{office:北部尉|北部尉}}の官舎に入ると、四方の門を修繕した。そして{{special:五色棒|五色棒}}を作って門の左右にそれぞれ十数本ずつ懸けさせ、禁令を犯す者があれば権門豪族であろうと容赦せず、すべてこの棒で打ち殺した。数か月後、{{person:霊帝|霊帝}}が寵愛する{{office:小黄門|小黄門}}の{{person:蹇碩|蹇碩}}の叔父が夜間通行の禁を犯して出歩いたため、ただちにこれを処刑した。これにより{{place:洛陽|京師}}では誰もが身を慎み、あえて法を犯す者はいなくなった。側近の寵臣たちはみな{{person:曹操|太祖}}を憎んだが、非の打ちどころがなくて中傷することもできなかったため、こぞって彼を称揚・推薦し、こうして{{place:頓丘|頓丘}}{{office:県令|令}}へと転出させたのである」。"}, {"id": "v1_p2_7", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "本文", "raw_text": "徵拜議郎。", "kakikudashi": "徴されて議郎に拝せらる。", "translation": "のち中央に召し出されて議郎に任じられた。", "persons": "曹操", "places": "", "era_year": "光和年間（178年〜184年）", "source_book": "", "keywords": "議郎", "raw_tagged": "徵拜{{office:議郎|議郎}}。", "kakikudashi_tagged": "徴されて{{office:議郎|議郎}}に拝せらる。", "translation_tagged": "のち中央に召し出されて{{office:議郎|議郎}}に任じられた。"}, {"id": "v1_p2_8", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 2, "type": "裴注", "raw_text": "《魏書》曰：太祖從妹夫㶏彊侯宋奇被誅，從坐免官。後以能明古學，復徵拜議郎。先是大將軍竇武、太傅陳蕃謀誅閹官，反爲所害。太祖上書陳武等正直而見陷害，姦邪盈朝，善人壅塞，其言甚切；靈帝不能用。是後詔書勑三府：舉奏州縣政理無效，民爲作謠言者免罷之。三公傾邪，皆希世見用，貨賂並行，彊者爲怨，不見舉奏，弱者守道，多被陷毀。太祖疾之。是歲以災異博問得失，因此復上書切諫，說三公所舉奏專回避貴戚之意。奏上，天子感寤，以示三府責讓之，諸以謠言徵者皆拜議郎。是後政教日亂，豪猾益熾，多所摧毀；太祖知不可匡正，遂不復獻言。", "kakikudashi": "『魏書』に曰く、「太祖の従妹の夫なる㶏彊侯の宋奇、誅せらるるや、従坐して官を免ぜらる。後に能く古学を明らかにするを以て、復た徴されて議郎に拝せらる。是より先、大将軍の竇武・太傅の陳蕃、閹官を誅せんと謀り、反りて害する所と為る。太祖は上書して武等が正直にして陥害せられ、姦邪は朝に盈ち、善人は壅塞せらるるを陳べ、其の言は甚だ切なり；霊帝は用うる能わず。是の後、詔書して三府に勑し、州県の政理に効無く、民が為に謡言を作る者を挙奏して之を免罷せしむ。三公は傾邪にして、皆世に希いて用いられ、貨賂並び行われ、彊き者は怨みを為すも挙奏せられず、弱き者は道を守るも、多く陥毀を被る。太祖は之を疾む。是の歳、災異を以て博く得失を問う、此に因りて復た上書して切諫し、三公の挙奏する所は専ら貴戚を回避するの意を説く。奏上するや、天子は感寤し、以て三府に示して之を責譲し、諸々の謡言を以て徴さるる者は皆議郎に拝せらる。是の後、政教は日々に乱れ、豪猾は益々熾んにして、摧毀する所多し；太祖は匡正すべからざるを知り、遂に復た言を献ぜず」と。", "translation": "『魏書』にいう。「太祖の従妹の夫である㶏彊侯の宋奇が処刑された際、太祖も連座して官を免じられた。のちに古典の学問に精通していることから、再び召し出されて議郎に任じられた。これより以前、大将軍の竇武と太傅の陳蕃が宦官を誅滅しようと図り、かえって殺害される事件があった。太祖は上書して、竇武らが剛直でありながら陥れられて殺害され、邪悪な者たちが朝廷に満ち溢れて善人が道を塞がれている実情を述べ、その言葉は極めて切実であった；しかし霊帝はこれを採用することができなかった。その後、詔書によって三府に勅命が下り、州や県の統治に実績がなく、民衆から風刺の謡言を作られている地方官を弾劾・奏上させて免職させることとなった。ところが三公は邪曲で、みな時流に迎合して登用された者ばかりであったため、賄賂が横行し、権勢ある者は恨みを買うのを恐れて弾劾せず、道義を守る立場の弱い者ばかりが数多く陥れられた。太祖はこれを憎んだ。この年、天変地異が起きたため広く政治の得失について意見が求められ、太祖はこれを機に再び上書して厳しく諫め、三公が弾劾する対象はもっぱら権門貴戚を避けて弱い者ばかりを狙っていると論じた。上奏がなされると、天子は感じて目を覚まし、その上奏文を三府に突きつけて叱責し、民間の風評によって召し出された者たちはみな議郎に任じられた。しかしこれ以後、政治と教化は日に日に乱れ、地方の豪族や悪党がますます勢いを増して、多くの善人が挫かれ傷つけられた；太祖はもはや立て直すことができないと悟り、ついに二度と諫言を奉らなくなった」。", "persons": "曹操,宋奇,竇武,陳蕃,霊帝", "places": "㶏強", "era_year": "光和元年（178年）〜光和年間", "source_book": "魏書", "keywords": "㶏彊侯,議郎,大将軍,太傅,三府,三公", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:曹操|太祖}}從妹夫{{place:㶏強|㶏彊}}{{office:列侯|侯}}{{person:宋奇|宋奇}}被誅，從坐免官。後以能明古學，復徵拜{{office:議郎|議郎}}。先是{{office:大将軍|大將軍}}{{person:竇武|竇武}}、{{office:太傅|太傅}}{{person:陳蕃|陳蕃}}謀誅{{special:閹官|閹官}}，反爲所害。{{person:曹操|太祖}}上書陳{{person:竇武|武}}等正直而見陷害，姦邪盈朝，善人壅塞，其言甚切；{{person:霊帝|靈帝}}不能用。是後詔書勑{{office:三公|三府}}：舉奏州縣政理無效，民爲作謠言者免罷之。{{office:三公|三公}}傾邪，皆希世見用，貨賂並行，彊者爲怨，不見舉奏，弱者守道，多被陷毀。{{person:曹操|太祖}}疾之。是歲以災異博問得失，因此復上書切諫，說{{office:三公|三公}}所舉奏專回避貴戚之意。奏上，{{person:霊帝|天子}}感寤，以示{{office:三公|三府}}責讓之，諸以謠言徵者皆拜{{office:議郎|議郎}}。是後政教日亂，豪猾益熾，多所摧毀；{{person:曹操|太祖}}知不可匡正，遂不復獻言。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{person:曹操|太祖}}の従妹の夫なる{{place:㶏強|㶏彊}}{{office:列侯|侯}}の{{person:宋奇|宋奇}}、誅せらるるや、従坐して官を免ぜらる。後に能く古学を明らかにするを以て、復た徴されて{{office:議郎|議郎}}に拝せらる。是より先、{{office:大将軍|大将軍}}の{{person:竇武|竇武}}・{{office:太傅|太傅}}の{{person:陳蕃|陳蕃}}、{{special:閹官|閹官}}を誅せんと謀り、反りて害する所と為る。{{person:曹操|太祖}}は上書して{{person:竇武|武}}等が正直にして陥害せられ、姦邪は朝に盈ち、善人は壅塞せらるるを陳べ、其の言は甚だ切なり；{{person:霊帝|霊帝}}は用うる能わず。是の後、詔書して{{office:三公|三府}}に勑し、州県の政理に効無く、民が為に謡言を作る者を挙奏して之を免罷せしむ。{{office:三公|三公}}は傾邪にして、皆世に希いて用いられ、貨賂並び行われ、彊き者は怨みを為すも挙奏せられず、弱き者は道を守るも、多く陥毀を被る。{{person:曹操|太祖}}は之を疾む。是の歳、災異を以て博く得失を問う、此に因りて復た上書して切諫し、{{office:三公|三公}}の挙奏する所は専ら貴戚を回避するの意を説く。奏上するや、{{person:霊帝|天子}}は感寤し、以て{{office:三公|三府}}に示して之を責譲し、諸々の謡言を以て徴さるる者は皆{{office:議郎|議郎}}に拝せらる。是の後、政教は日々に乱れ、豪猾は益々熾んにして、摧毀する所多し；{{person:曹操|太祖}}は匡正すべからざるを知り、遂に復た言を献ぜず」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「{{person:曹操|太祖}}の従妹の夫である{{place:㶏強|㶏彊}}{{office:列侯|侯}}の{{person:宋奇|宋奇}}が処刑された際、{{person:曹操|太祖}}も連座して官を免じられた。のちに古典の学問に精通していることから、再び召し出されて{{office:議郎|議郎}}に任じられた。これより以前、{{office:大将軍|大将軍}}の{{person:竇武|竇武}}と{{office:太傅|太傅}}の{{person:陳蕃|陳蕃}}が{{special:閹官|宦官}}を誅滅しようと図り、かえって殺害される事件があった。{{person:曹操|太祖}}は上書して、{{person:竇武|竇武}}らが剛直でありながら陥れられて殺害され、邪悪な者たちが朝廷に満ち溢れて善人が道を塞がれている実情を述べ、その言葉は極めて切実であった；しかし{{person:霊帝|霊帝}}はこれを採用することができなかった。その後、詔書によって{{office:三公|三府}}に勅命が下り、州や県の統治に実績がなく、民衆から風刺の謡言を作られている地方官を弾劾・奏上させて免職させることとなった。ところが{{office:三公|三公}}は邪曲で、みな時流に迎合して登用された者ばかりであったため、賄賂が横行し、権勢ある者は恨みを買うのを恐れて弾劾せず、道義を守る立場の弱い者ばかりが数多く陥れられた。{{person:曹操|太祖}}はこれを憎んだ。この年、天変地異が起きたため広く政治の得失について意見が求められ、{{person:曹操|太祖}}はこれを機に再び上書して厳しく諫め、{{office:三公|三公}}が弾劾する対象はもっぱら権門貴戚を避けて弱い者ばかりを狙っていると論じた。上奏がなされると、{{person:霊帝|天子}}は感じて目を覚まし、その上奏文を{{office:三公|三府}}に突きつけて叱責し、民間の風評によって召し出された者たちはみな{{office:議郎|議郎}}に任じられた。しかしこれ以後、政治と教化は日に日に乱れ、地方の豪族や悪党がますます勢いを増して、多くの善人が挫かれ傷つけられた；{{person:曹操|太祖}}はもはや立て直すことができないと悟り、ついに二度と諫言を奉らなくなった」。"}, {"id": "v1_p3_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 3, "type": "本文", "raw_text": "光和末，黃巾起。拜騎都尉，討潁川賊。遷爲濟南相，國有十餘縣，長吏多阿附貴戚，贓污狼藉，於是奏免其八；禁斷淫祀，姦宄逃竄，郡界肅然。", "kakikudashi": "光和の末、黄巾起こる。騎都尉に拝せられ、潁川の賊を討つ。遷りて済南相と為るに、国に十余県有り、長吏は多く貴戚に阿附し、贓汚は狼藉たり、是に於いて奏して其の八を免ず；淫祀を禁断し、姦宄は逃竄し、郡界は粛然たり。", "translation": "光和年間の末、黄巾の乱が起こった。太祖は騎都尉に任じられ、潁川の賊を討伐した。ついで済南相に昇進したが、済南国には十余りの県があり、県の長吏たちの多くは権門貴戚に媚びへつらって不正蓄財が甚だしかったため、太祖は上奏してそのうちの八人を罷免した；さらに淫祀を厳しく禁絶したため、悪党や奸賊は逃げ隠れ、国内は粛然と引き締まった。", "persons": "曹操", "places": "潁川,済南", "era_year": "光和7年／中平元年（184年）", "source_book": "", "keywords": "黄巾,騎都尉,済南相,長吏,淫祀", "raw_tagged": "{{special:光和|光和末}}，{{special:黄巾|黃巾}}起。拜{{office:騎都尉|騎都尉}}，討{{place:潁川|潁川}}賊。遷爲{{place:済南|濟南}}{{office:相|相}}，國有十餘縣，{{office:長吏|長吏}}多阿附貴戚，贓污狼藉，於是奏免其八；禁斷{{special:淫祀|淫祀}}，姦宄逃竄，郡界肅然。", "kakikudashi_tagged": "{{special:光和|光和の末}}、{{special:黄巾|黄巾}}起こる。{{office:騎都尉|騎都尉}}に拝せられ、{{place:潁川|潁川}}の賊を討つ。遷りて{{place:済南|済南}}{{office:相|相}}と為るに、国に十余県有り、{{office:長吏|長吏}}は多く貴戚に阿附し、贓汚は狼藉たり、是に於いて奏して其の八を免ず；{{special:淫祀|淫祀}}を禁断し、姦宄は逃竄し、郡界は粛然たり。", "translation_tagged": "{{special:光和|光和年間}}の末、{{special:黄巾|黄巾の乱}}が起こった。{{person:曹操|太祖}}は{{office:騎都尉|騎都尉}}に任じられ、{{place:潁川|潁川}}の賊を討伐した。ついで{{place:済南|済南}}{{office:相|相}}に昇進したが、{{place:済南|済南国}}には十余りの県があり、県の{{office:長吏|長吏}}たちの多くは権門貴戚に媚びへつらって不正蓄財が甚だしかったため、{{person:曹操|太祖}}は上奏してそのうちの八人を罷免した；さらに{{special:淫祀|淫祀}}を厳しく禁絶したため、悪党や奸賊は逃げ隠れ、国内は粛然と引き締まった。"}, {"id": "v1_p3_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 3, "type": "裴注", "raw_text": "《魏書》曰：長吏受取貪饕，依倚貴勢，歷前相不見舉；聞太祖至，咸皆舉免，小大震怖，姦宄遁逃，竄入他郡。政教大行，一郡清平。初，城陽景王劉章以有功於漢，故其國爲立祠，青州諸郡轉相倣效，濟南尤盛，至六百餘祠。賈人或假二千石輿服導從作倡樂，奢侈日甚，民坐貧窮，歷世長吏無敢禁絕者。太祖到，皆毀壞祠屋，止絕官吏民不得祠祀。及至秉政，遂除姦邪鬼神之事，世之淫祀由此遂絕。", "kakikudashi": "『魏書』に曰く、「長吏は受取して貪饕、貴勢に依倚し、前相を歴るも挙げられず；太祖の至るを聞き、咸く皆挙げて免ぜらるるや、小大は震怖し、姦宄は遁逃して、他郡に竄入す。政教は大いに行われ、一郡は清平なり。初め、城陽景王の劉章は漢に功有るを以て、故に其の国は為に祠を立て、青州の諸郡は転た相倣効し、済南は尤も盛んにして、六百余祠に至る。賈人は或いは二千石の輿服・導従を仮りて倡楽を作し、奢侈は日々に甚だしく、民は坐して貧窮するも、歴世の長吏は敢えて禁絶する者無し。太祖の到るや、皆祠屋を毀壊し、官吏・民の祠祀するを得ざるを止絶す。政を秉るに及びて、遂に姦邪・鬼神の事を除き、世の淫祀は此に由りて遂に絶ゆ」と。", "translation": "『魏書』にいう。「県令などの長吏たちは賄賂を受け取って飽くなき貪欲をほしいままにし、権勢ある貴戚を後ろ盾としていたため、歴代の国相も弾劾できずにいた；しかし太祖が着任してことごとく摘発・罷免したと聞くと、大物から小者まで震え上がり、悪党たちは他郡へと逃げ込んだ。こうして政治と教化は大いに行き渡り、郡内は清らかに治まった。かつて城陽景王の劉章は漢王朝に功績があったことから、その封国で彼のために祠が建てられたが、青州の諸郡が次々とこれを模倣し、済南ではとりわけ盛んになって六百余りの社祠が乱立するに至った。商人の中には二千石の車馬や衣装・先払いの従者を僭称して歌舞音曲を催す者まで現れ、贅沢は日に日に甚だしくなり、民衆はそのために貧窮に陥っていたが、歴代の地方長吏で誰一人としてこれを禁絶できる者はいなかった。太祖は着任するや、すべての社祠の建物を打ち壊し、官吏や民衆が祭祀を行うことを厳しく差し止めた。のちに太祖が国政を執るようになると、ついに邪悪な鬼神の祭祀を一掃し、世間の淫祀はこれによって根絶された」。", "persons": "曹操,劉章", "places": "城陽,青州,済南", "era_year": "中平元年（184年）頃", "source_book": "魏書", "keywords": "長吏,国相,城陽景王,二千石,淫祀", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{office:長吏|長吏}}受取貪饕，依倚貴勢，歷{{office:相|前相}}不見舉；聞{{person:曹操|太祖}}至，咸皆舉免，小大震怖，姦宄遁逃，竄入他郡。政教大行，一郡清平。初，{{place:城陽|城陽}}{{person:劉章|景王}}{{person:劉章|劉章}}以有功於漢，故其國爲立祠，{{place:青州|青州}}諸郡轉相倣效，{{place:済南|濟南}}尤盛，至六百餘祠。賈人或假{{office:太守|二千石}}輿服導從作倡樂，奢侈日甚，民坐貧窮，歷世{{office:長吏|長吏}}無敢禁絕者。{{person:曹操|太祖}}到，皆毀壞祠屋，止絕官吏民不得祠祀。及至秉政，遂除姦邪鬼神之事，世之{{special:淫祀|淫祀}}由此遂絕。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{office:長吏|長吏}}は受取して貪饕、貴勢に依倚し、{{office:相|前相}}を歴るも挙げられず；{{person:曹操|太祖}}の至るを聞き、咸く皆挙げて免ぜらるるや、小大は震怖し、姦宄は遁逃して、他郡に竄入す。政教は大いに行われ、一郡は清平なり。初め、{{place:城陽|城陽}}{{person:劉章|景王}}の{{person:劉章|劉章}}は漢に功有るを以て、故に其の国は為に祠を立て、{{place:青州|青州}}の諸郡は転た相倣効し、{{place:済南|済南}}は尤も盛んにして、六百余祠に至る。賈人は或いは{{office:太守|二千石}}の輿服・導従を仮りて倡楽を作し、奢侈は日々に甚だしく、民は坐して貧窮するも、歴世の{{office:長吏|長吏}}は敢えて禁絶する者無し。{{person:曹操|太祖}}の到るや、皆祠屋を毀壊し、官吏・民の祠祀するを得ざるを止絶す。政を秉るに及びて、遂に姦邪・鬼神の事を除き、世の{{special:淫祀|淫祀}}は此に由りて遂に絶ゆ」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「{{office:県令|県令}}などの{{office:長吏|長吏}}たちは賄賂を受け取って飽くなき貪欲をほしいままにし、権勢ある貴戚を後ろ盾としていたため、歴代の{{office:相|国相}}も弾劾できずにいた；しかし{{person:曹操|太祖}}が着任してことごとく摘発・罷免したと聞くと、大物から小者まで震え上がり、悪党たちは他郡へと逃げ込んだ。こうして政治と教化は大いに行き渡り、郡内は清らかに治まった。かつて{{place:城陽|城陽}}{{person:劉章|景王}}の{{person:劉章|劉章}}は漢王朝に功績があったことから、その封国で彼のために祠が建てられたが、{{place:青州|青州}}の諸郡が次々とこれを模倣し、{{place:済南|済南}}ではとりわけ盛んになって六百余りの社祠が乱立するに至った。商人の中には{{office:太守|二千石}}の車馬や衣装・先払いの従者を僭称して歌舞音曲を催す者まで現れ、贅沢は日に日に甚だしくなり、民衆はそのために貧窮に陥っていたが、歴代の地方{{office:長吏|長吏}}で誰一人としてこれを禁絶できる者はいなかった。{{person:曹操|太祖}}は着任するや、すべての社祠の建物を打ち壊し、官吏や民衆が祭祀を行うことを厳しく差し止めた。のちに{{person:曹操|太祖}}が国政を執るようになると、ついに邪悪な鬼神の祭祀を一掃し、世間の{{special:淫祀|淫祀}}はこれによって根絶された」。"}, {"id": "v1_p3_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 3, "type": "本文", "raw_text": "久之，徵還爲東郡太守；不就，稱疾歸鄉里。", "kakikudashi": "之を久しうして、徴し還されて東郡太守と為る；就かず、疾と称して郷里に帰る。", "translation": "しばらくして、中央に召し還されて東郡太守に任じられた；しかし着任せず、病と称して郷里に帰った。", "persons": "曹操", "places": "東郡", "era_year": "中平年間（185年〜187年頃）", "source_book": "", "keywords": "東郡太守", "raw_tagged": "久之，徵還爲{{place:東郡|東郡}}{{office:太守|太守}}；不就，稱疾歸鄉里。", "kakikudashi_tagged": "之を久しうして、徴し還されて{{place:東郡|東郡}}{{office:太守|太守}}と為る；就かず、疾と称して郷里に帰る。", "translation_tagged": "しばらくして、中央に召し還されて{{place:東郡|東郡}}{{office:太守|太守}}に任じられた；しかし着任せず、病と称して郷里に帰った。"}, {"id": "v1_p3_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 3, "type": "裴注", "raw_text": "《魏書》曰：於是權臣專朝，貴戚橫恣。太祖不能違道取容。數數干忤，恐爲家禍，遂乞留宿衞。拜議郎，常託疾病，輙告歸鄉里；築室城外，春夏習讀書傳，秋冬弋獵，以自娛樂。", "kakikudashi": "『魏書』に曰く、「是に於いて権臣は朝を専らにし、貴戚は横恣なり。太祖は道に違いて容れらるるを取る能わず。数々干忤し、家禍と為らんことを恐れ、遂に留まりて宿衛せんことを乞う。議郎に拝せらるるも、常に疾病に託し、輒ち告を請うて郷里に帰る；室を城外に築き、春夏は書伝を習読し、秋冬は弋猟し、以て自ら娯楽す」と。", "translation": "『魏書』にいう。「この当時、権臣が朝政を専断し、外戚や貴顕が横暴を極めていた。太祖は道義に背いてまで彼らに迎合することができなかった。たびたび権門に逆らったため、一族に禍が及ぶことを恐れ、ついに中央に留まって宿衛の任に就くことを願い出た。こうして議郎に任じられたが、常に病気を口実にしては休暇を請うて郷里に帰った；城外に屋敷を築き、春と夏は古典の書物を学び読み、秋と冬は狩猟に出かけて、自ら楽しんだ」。", "persons": "曹操", "places": "", "era_year": "中平年間（185年〜187年頃）", "source_book": "魏書", "keywords": "議郎,宿衛", "raw_tagged": "{{special:引用史料|《魏書》}}曰：於是權臣專朝，貴戚橫恣。{{person:曹操|太祖}}不能違道取容。數數干忤，恐爲家禍，遂乞留宿衞。拜{{office:議郎|議郎}}，常託疾病，輙告歸鄉里；築室城外，春夏習讀書傳，秋冬弋獵，以自娛樂。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「是に於いて権臣は朝を専らにし、貴戚は横恣なり。{{person:曹操|太祖}}は道に違いて容れらるるを取る能わず。数々干忤し、家禍と為らんことを恐れ、遂に留まりて宿衛せんことを乞う。{{office:議郎|議郎}}に拝せらるるも、常に疾病に託し、輒ち告を請うて郷里に帰る；室を城外に築き、春夏は書伝を習読し、秋冬は弋猟し、以て自ら娯楽す」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「この当時、権臣が朝政を専断し、外戚や貴顕が横暴を極めていた。{{person:曹操|太祖}}は道義に背いてまで彼らに迎合することができなかった。たびたび権門に逆らったため、一族に禍が及ぶことを恐れ、ついに中央に留まって宿衛の任に就くことを願い出た。こうして{{office:議郎|議郎}}に任じられたが、常に病気を口実にしては休暇を請うて郷里に帰った；城外に屋敷を築き、春と夏は古典の書物を学び読み、秋と冬は狩猟に出かけて、自ら楽しんだ」。"}, {"id": "v1_p4_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 4, "type": "本文", "raw_text": "頃之，冀州刺史王芬、南陽許攸、沛國周旌等連結豪傑，謀廢靈帝，立合肥侯，以告太祖，太祖拒之。芬等遂敗。", "kakikudashi": "之を頃くして、冀州刺史の王芬、南陽の許攸、沛国の周旌等、豪傑を連結し、霊帝を廃して合肥侯を立てんと謀り、以て太祖に告ぐるも、太祖は之を拒む。芬等は遂に敗る。", "translation": "しばらくして、冀州刺史の王芬、南陽の許攸、沛国の周旌らが各地の豪傑と結託し、霊帝を廃位して合肥侯を擁立しようと企て、この計画を太祖に打ち明けたが、太祖はこれを拒絶した。王芬らははたして失敗し滅亡した。", "persons": "王芬,許攸,周旌,霊帝,曹操", "places": "冀州,南陽,沛国,合肥", "era_year": "中平4年〜5年（187年〜188年）頃", "source_book": "", "keywords": "冀州刺史,合肥侯", "raw_tagged": "頃之，{{place:冀州|冀州}}{{office:刺史|刺史}}{{person:王芬|王芬}}、{{place:南陽|南陽}}{{person:許攸|許攸}}、{{place:沛国|沛國}}{{person:周旌|周旌}}等連結豪傑，謀廢{{person:霊帝|靈帝}}，立{{place:合肥|合肥}}{{office:列侯|侯}}，以告{{person:曹操|太祖}}，{{person:曹操|太祖}}拒之。{{person:王芬|芬}}等遂敗。", "kakikudashi_tagged": "之を頃くして、{{place:冀州|冀州}}{{office:刺史|刺史}}の{{person:王芬|王芬}}、{{place:南陽|南陽}}の{{person:許攸|許攸}}、{{place:沛国|沛国}}の{{person:周旌|周旌}}等、豪傑を連結し、{{person:霊帝|霊帝}}を廃して{{place:合肥|合肥}}{{office:列侯|侯}}を立てんと謀り、以て{{person:曹操|太祖}}に告ぐるも、{{person:曹操|太祖}}は之を拒む。{{person:王芬|芬}}等は遂に敗る。", "translation_tagged": "しばらくして、{{place:冀州|冀州}}{{office:刺史|刺史}}の{{person:王芬|王芬}}、{{place:南陽|南陽}}の{{person:許攸|許攸}}、{{place:沛国|沛国}}の{{person:周旌|周旌}}らが各地の豪傑と結託し、{{person:霊帝|霊帝}}を廃位して{{place:合肥|合肥}}{{office:列侯|侯}}を擁立しようと企て、この計画を{{person:曹操|太祖}}に打ち明けたが、{{person:曹操|太祖}}はこれを拒絶した。{{person:王芬|王芬}}らははたして失敗し滅亡した。"}, {"id": "v1_p4_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 4, "type": "裴注", "raw_text": "司馬彪《九州春秋》曰：於是陳蕃子逸與術士平原襄楷會於芬坐，楷曰：「天文不利宦者，黃門、常侍貴族滅矣。」逸喜。芬曰：「若然者，芬願驅除。」於是與攸等結謀。靈帝欲北巡河間舊宅，芬等謀因此作難，上書言黑山賊攻劫郡縣，求得起兵。會北方有赤氣，東西竟天，太史上言「當有陰謀，不宜北行」，帝乃止。勑芬罷兵，俄而徵之。芬懼，自殺。《魏書》載太祖拒芬辭曰：「夫廢立之事，天下之至不祥也。古人有權成敗計輕重而行之者，伊尹、霍光是也。伊尹懷至忠之誠，據宰臣之勢，處官司之上，故進退廢置，計從事立。及至霍光受託國之任，藉宗臣之位，內因太后秉政之重，外有羣卿同欲之勢，昌邑即位日淺，未有貴寵，朝乏讜臣，議出密近，故計行如轉圜，事成如摧朽。今諸君徒見曩者之易，未覩當今之難。諸君自度，結衆連黨，何若七國？合肥之貴，孰若吳、楚？而造作非常，欲望必克，不亦危乎！」", "kakikudashi": "司馬彪の『九州春秋』に曰く、「是に於いて陳蕃の子の逸、術士なる平原の襄楷と芬の坐に会し、楷曰く、『天文は宦者に利あらず、黄門・常侍の貴族は滅びん』と。逸は喜ぶ。芬曰く、『若し然らば、芬、願わくは駆除せん』と。是に於いて攸等と謀を結ぶ。霊帝、河間の旧宅に北巡せんと欲し、芬等は此に因りて難を作さんと謀り、上書して黒山賊が郡県を攻劫すと言い、兵を起こすを得んことを求む。会々北方に赤気有り、東西に天を竟り、太史が『当に陰謀有るべし、北行するは宜しからず』と上言するや、帝は乃ち止む。芬に勑して兵を罷めしめ、俄かにして之を徴す。芬は懼れ、自殺す」と。『魏書』に太祖が芬を拒むの辞を載せて曰く、「夫れ廃立の事は、天下の至りて不祥なるなり。古人にして成敗を権り軽重を計りて之を行える者有り、伊尹・霍光、是れなり。伊尹は至忠の誠を懐き、宰臣の勢に拠り、官司の上に処る、故に進退・廃置するに、計は従われ事は立つ。霍光が託国の任を受け、宗臣の位に藉るに至るに及びては、内には太后が政を秉るの重きに因り、外には群卿が欲を同じくするの勢有り、昌邑は即位して日浅く、未だ貴寵有らず、朝に讜臣乏しく、議は密近より出ず、故に計の行わるるは圜を転ずるが如く、事の成るは朽を摧くが如し。今、諸君は徒だ曩者の易きを見るのみにて、未だ当今の難きを覩ざるなり。諸君、自ら度るに、衆を結び党を連ぬること、七国に何若ぞ？合肥の貴きこと、呉・楚に孰若ぞ？而るに非常を造作し、必ず克たんことを欲望するは、亦た危うからずや！」と。", "translation": "司馬彪の『九州春秋』にいう。「このとき陳蕃の子の陳逸が、方術士の平原の襄楷と王芬の席上で会合し、襄楷が『天文の兆しは宦者に不利であり、黄門や常侍の一族は滅びるであろう』と言った。陳逸は喜んだ。すると王芬は『もしそうなら、この私が彼らを駆除したい』と言った。こうして許攸らと謀議を結んだのである。たまたま霊帝が河間の旧宅へ北巡しようとしたため、王芬らはこの機会に乗じて挙兵しようと企て、黒山賊が郡県を襲撃・略奪していると上書して、出兵の許可を求めた。ところが折しも北方の空に赤い妖気が立ちこめて東西の空いっぱいに広がり、太史が『きっと陰謀があるに違いありません、北巡なさるべきではありません』と進言したため、霊帝はそこで北巡を取りやめた。そして王芬に勅命を下して兵を解散させ、まもなく中央へ召喚した。王芬は恐れて自殺した」。『魏書』に、太祖が王芬を拒絶した際の言葉を載せていう。「そもそも天子の廃立というものは、天下において最も不吉な大事である。古の人で成敗を見極め軽重を推し量ってこれを断行した者には、伊尹と霍光がいる。伊尹は至高の忠誠心を抱き、宰相としての権勢に拠り、百官の頂点に立っていたからこそ、君主を進退・廃立するにあたっても計画通りに事が成就したのである。また霍光が国政を託される重任を受け、一門の重臣たる地位に拠った際には、内には皇太后が政権を執る重みがあり、外には群臣たちが志を同じくする勢いがあり、しかも昌邑王は即位してから日が浅く、まだ寵愛を受ける側近もおらず、朝廷には直言する忠臣も乏しく、廃立の評議がごく親密な中枢から発せられたため、計画の実行は丸い玉を転がすように進み、事の成就は朽木を砕くように容易であった。いま諸君はただ昔の成功の容易さばかりを見て、現在の困難さを見ていない。諸君が自ら顧みて、衆を集め徒党を連ねた勢力は、かつての七国と比べてどうであろうか？擁立しようとする合肥侯の尊貴さは、かつての呉・楚と比べてどうであろうか？それなのに非常の変事を企てて、必ず勝利できると望むのは、なんと危ういことではないか！」。", "persons": "司馬彪,陳蕃,陳逸,襄楷,王芬,許攸,霊帝,曹操,伊尹,霍光,上官太后,劉賀", "places": "平原,河間,合肥", "era_year": "中平4年〜5年（187年〜188年）頃", "source_book": "九州春秋・魏書", "keywords": "黒山賊,太史,伊尹,霍光,昌邑王,呉楚七国", "raw_tagged": "{{person:司馬彪|司馬彪}}{{special:引用史料|《九州春秋》}}曰：於是{{person:陳蕃|陳蕃}}子{{person:陳逸|逸}}與術士{{place:平原|平原}}{{person:襄楷|襄楷}}會於{{person:王芬|芬}}坐，{{person:襄楷|楷}}曰：「天文不利{{special:閹官|宦者}}，{{office:小黄門|黃門}}、{{office:中常侍|常侍}}貴族滅矣。」{{person:陳逸|逸}}喜。{{person:王芬|芬}}曰：「若然者，{{person:王芬|芬}}願驅除。」於是與{{person:許攸|攸}}等結謀。{{person:霊帝|靈帝}}欲北巡{{place:河間|河間}}舊宅，{{person:王芬|芬}}等謀因此作難，上書言{{special:黒山賊|黑山賊}}攻劫郡縣，求得起兵。會北方有赤氣，東西竟天，{{office:太史|太史}}上言「當有陰謀，不宜北行」，{{person:霊帝|帝}}乃止。勑{{person:王芬|芬}}罷兵，俄而徵之。{{person:王芬|芬}}懼，自殺。{{special:引用史料|《魏書》}}載{{person:曹操|太祖}}拒{{person:王芬|芬}}辭曰：「夫廢立之事，天下之至不祥也。古人有權成 ecial:閹官|閹豎}}の官というものは古今を通じて存在すべきものであるが、ただ君主たる者が彼らに権力と寵愛を貸し与えて、このような事態に立ち至らせてはならなかっただけである。いまその罪を処断するにあたり、首謀の元凶を誅殺するのであれば、一人の獄吏がいれば十分であるのに、どうしてわざわざ騒ぎ立てて外方の将軍を呼び寄せる必要があろうか？彼らをことごとく皆殺しにしようとすれば、計画は必ず事前に漏れることになり、私には彼らが失敗するのが目に見えるようだ』と言った」。"}, {"id": "v1_p5_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 5, "type": "本文", "raw_text": "卓未至而進見殺。卓到，廢帝爲弘農王而立獻帝，京都大亂。卓表太祖爲驍騎校尉，欲與計事。太祖乃變易姓名，間行東歸。", "kakikudashi": "卓が未だ至らざるに進は殺さる。卓の到るや、帝を廃して弘農王と為し、献帝を立て、京都は大いに乱る。卓は太祖を表して驍騎校尉と為し、与に事を計らんと欲す。太祖は乃ち姓名を変易し、間行して東に帰る。", "translation": "董卓がまだ到着しないうちに、何進は殺害された。董卓は到着すると、少帝を廃位して弘農王とし、代わって献帝を擁立したため、京都は大混乱に陥った。董卓は太祖を上表して驍騎校尉に任じ、ともに国事を謀ろうとした。しかし太祖は姓名を変え、裏道を通って密かに東へ帰還した。", "persons": "董卓,何進,劉弁,献帝,曹操", "places": "弘農,洛陽", "era_year": "中平6年（189年）9月", "source_book": "", "keywords": "弘農王,驍騎校尉", "raw_tagged": "{{person:董卓|卓}}未至而{{person:何進|進}}見殺。{{person:董卓|卓}}到，廢{{person:劉弁|帝}}爲{{place:弘農|弘農}}{{person:劉弁|王}}而立{{person:献帝|獻帝}}，{{place:洛陽|京都}}大亂。{{person:董卓|卓}}表{{person:曹操|太祖}}爲{{office:驍騎校尉|驍騎校尉}}，欲與計事。{{person:曹操|太祖}}乃變易姓名，間行東歸。", "kakikudashi_tagged": "{{person:董卓|卓}}が未だ至らざるに{{person:何進|進}}は殺さる。{{person:董卓|卓}}の到るや、{{person:劉弁|帝}}を廃して{{place:弘農|弘農}}{{person:劉弁|王}}と為し、{{person:献帝|献帝}}を立て、{{place:洛陽|京都}}は大いに乱る。{{person:董卓|卓}}は{{person:曹操|太祖}}を表して{{office:驍騎校尉|驍騎校尉}}と為し、与に事を計らんと欲す。{{person:曹操|太祖}}は乃ち姓名を変易し、間行して東に帰る。", "translation_tagged": "{{person:董卓|董卓}}がまだ到着しないうちに、{{person:何進|何進}}は殺害された。{{person:董卓|董卓}}は到着すると、{{person:劉弁|少帝}}を廃位して{{place:弘農|弘農}}{{person:劉弁|王}}とし、代わって{{person:献帝|献帝}}を擁立したため、{{place:洛陽|京都}}は大混乱に陥った。{{person:董卓|董卓}}は{{person:曹操|太祖}}を上表して{{office:驍騎校尉|驍騎校尉}}に任じ、ともに国事を謀ろうとした。しかし{{person:曹操|太祖}}は姓名を変え、裏道を通って密かに東へ帰還した。"}, {"id": "v1_p5_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 5, "type": "裴注", "raw_text": "《魏書》曰：太祖以卓終必覆敗，遂不就拜，逃歸鄉里。從數騎過故人成臯呂伯奢；伯奢不在，其子與賔客共劫太祖，取馬及物，太祖手刃擊殺數人。《世語》曰：太祖過伯奢。伯奢出行，五子皆在，備賔主禮。太祖自以背卓命，疑其圖己，手劔夜殺八人而去。孫盛雜記曰：太祖聞其食器聲，以爲圖己，遂夜殺之。旣而悽愴曰：「寧我負人，毋人負我！」遂行。", "kakikudashi": "『魏書』に曰く、「太祖は卓が終に必ず覆敗するを以て、遂に拝に就かず、逃れて郷里に帰る。数騎を従えて故人なる成皋の呂伯奢に過る；伯奢は在らず、其の子と賓客と共に太祖を劫かし、馬及び物を取るに、太祖は手刃して数人を撃殺す」と。『世語』に曰く、「太祖は伯奢に過る。伯奢は出行し、五子は皆在り、賓主の礼を備う。太祖は自ら卓の命に背くを以て、其の己を図らんかと疑い、手剣して夜に八人を殺して去る」と。孫盛の『雑記』に曰く、「太祖は其の食器の声を聞き、己を図ると以為い、遂に夜に之を殺す。既にして悽愴として曰く、『寧ろ我、人に負くとも、人をして我に負かしむる毋かれ！』と。遂に行く」と。", "translation": "『魏書』にいう。「太祖は董卓が最後には必ず転覆・敗亡すると見抜き、ついに官職に就かず、逃れて郷里へ帰った。その途上、数騎の従者を連れて旧友である成皋の呂伯奢のもとに立ち寄った；呂伯奢は不在で、その息子が食客たちと共謀して太祖を襲い、馬や所持品を奪おうとしたため、太祖は自ら刀を振るって数人を斬り殺した」。『世語』にいう。「太祖は呂伯奢のもとを訪ねた。呂伯奢は外出しており、五人の息子がみな在宅していて、主客の礼を尽くして太祖をもてなした。しかし太祖は、自らが董卓の命に背いて逃亡していることから、彼らが自分を害そうとしているのではないかと疑い、夜中に自ら剣を振るって八人を殺害し立ち去った」。孫盛の『雑記』にいう。「太祖は彼らが食器を用意する物音を聞き、自分を殺そうとしているのだと誤解し、ついに夜中に彼らを殺害した。その後、痛ましげに『たとえ私が人に背くことになろうとも、他人に私を裏切らせはしない！』と言った。そしてそのまま立ち去った」。", "persons": "曹操,董卓,呂伯奢,孫盛", "places": "成皋", "era_year": "中平6年（189年）秋", "source_book": "魏書・世語・雑記", "keywords": "寧我負人", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:曹操|太祖}}以{{person:董卓|卓}}終必覆敗，遂不就拜，逃歸鄉里。從數騎過故人{{place:成皋|成臯}}{{person:呂伯奢|呂伯奢}}；{{person:呂伯奢|伯奢}}不在，其子與賔客共劫{{person:曹操|太祖}}，取馬及物，{{person:曹操|太祖}}手刃擊殺數人。{{special:引用史料|《世語》}}曰：{{person:曹操|太祖}}過{{person:呂伯奢|伯奢}}。{{person:呂伯奢|伯奢}}出行，五子皆在，備賔主禮。{{person:曹操|太祖}}自以背{{person:董卓|卓}}命，疑其圖己，手劔夜殺八人而去。{{person:孫盛|孫盛}}{{special:引用史料|雜記}}曰：{{person:曹操|太祖}}聞其食器聲，以爲圖己，遂夜殺之。旣而悽愴曰：「{{special:寧我負人|寧我負人，毋人負我}}！」遂行。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{person:曹操|太祖}}は{{person:董卓|卓}}が終に必ず覆敗するを以て、遂に拝に就かず、逃れて郷里に帰る。数騎を従えて故人なる{{place:成皋|成皋}}の{{person:呂伯奢|呂伯奢}}に過る；{{person:呂伯奢|伯奢}}は在らず、其の子と賓客と共に{{person:曹操|太祖}}を劫かし、馬及び物を取るに、{{person:曹操|太祖}}は手刃して数人を撃殺す」と。{{special:引用史料|『世語』}}に曰く、「{{person:曹操|太祖}}は{{person:呂伯奢|伯奢}}に過る。{{person:呂伯奢|伯奢}}は出行し、五子は皆在り、賓主の礼を備う。{{person:曹操|太祖}}は自ら{{person:董卓|卓}}の命に背くを以て、其の己を図らんかと疑い、手剣して夜に八人を殺して去る」と。{{person:孫盛|孫盛}}の{{special:引用史料|『雑記』}}に曰く、「{{person:曹操|太祖}}は其の食器の声を聞き、己を図ると以為い、遂に夜に之を殺す。既にして悽愴として曰く、『{{special:寧我負人|寧ろ我、人に負くとも、人をして我に負かしむる毋かれ}}！』と。遂に行く」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「{{person:曹操|太祖}}は{{person:董卓|董卓}}が最後には必ず転覆・敗亡すると見抜き、ついに官職に就かず、逃れて郷里へ帰った。その途上、数騎の従者を連れて旧友である{{place:成皋|成皋}}の{{person:呂伯奢|呂伯奢}}のもとに立ち寄った；{{person:呂伯奢|呂伯奢}}は不在で、その息子が食客たちと共謀して{{person:曹操|太祖}}を襲い、馬や所持品を奪おうとしたため、{{person:曹操|太祖}}は自ら刀を振るって数人を斬り殺した」。{{special:引用史料|『世語』}}にいう。「{{person:曹操|太祖}}は{{person:呂伯奢|呂伯奢}}のもとを訪ねた。{{person:呂伯奢|呂伯奢}}は外出しており、五人の息子がみな在宅していて、主客の礼を尽くして{{person:曹操|太祖}}をもてなした。しかし{{person:曹操|太祖}}は、自らが{{person:董卓|董卓}}の命に背いて逃亡していることから、彼らが自分を害そうとしているのではないかと疑い、夜中に自ら剣を振るって八人を殺害し立ち去った」。{{person:孫盛|孫盛}}の{{special:引用史料|『雑記』}}にいう。「{{person:曹操|太祖}}は彼らが食器を用意する物音を聞き、自分を殺そうとしているのだと誤解し、ついに夜中に彼らを殺害した。その後、痛ましげに『{{special:寧我負人|たとえ私が人に背くことになろうとも、他人に私を裏切らせはしない}}！』と言った。そしてそのまま立ち去った」。"}, {"id": "v1_p5_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 5, "type": "本文", "raw_text": "出關，過中牟，爲亭長所疑，執詣縣，邑中或竊識之，爲請得解。", "kakikudashi": "関を出でて中牟を過ぐるに、亭長の疑う所と為り、執えられて県に詣るも、邑中に或いは窃かに之を識る者有り、為に請うて解かるるを得たり。", "translation": "関所を出て中牟を通りかかった際、亭長に怪しまれて捕らえられ県へと連行されたが、町の中に密かに太祖の顔を知っている者がおり、太祖のためにとりなしてくれたおかげで釈放された。", "persons": "曹操", "places": "中牟", "era_year": "中平6年（189年）秋〜冬", "source_book": "", "keywords": "亭長", "raw_tagged": "出關，過{{place:中牟|中牟}}，爲{{office:亭長|亭長}}所疑，執詣縣，邑中或竊識之，爲請得解。", "kakikudashi_tagged": "関を出でて{{place:中牟|中牟}}を過ぐるに、{{office:亭長|亭長}}の疑う所と為り、執えられて県に詣るも、邑中に或いは窃かに之を識る者有り、為に請うて解かるるを得たり。", "translation_tagged": "関所を出て{{place:中牟|中牟}}を通りかかった際、{{office:亭長|亭長}}に怪しまれて捕らえられ県へと連行されたが、町の中に密かに{{person:曹操|太祖}}の顔を知っている者がおり、{{person:曹操|太祖}}のためにとりなしてくれたおかげで釈放された。"}, {"id": "v1_p5_6", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 5, "type": "裴注", "raw_text": "《世語》曰：中牟疑是亡人，見拘於縣。時掾亦已被卓書；唯功曹心知是太祖，以世方亂，不宜拘天下雄儁，因白令釋之。", "kakikudashi": "『世語』に曰く、「中牟にて是れ亡人かと疑われ、県に拘せらる。時に掾も亦た已に卓の書を被る；惟だ功曹のみ心に是れ太祖なるを知り、世の将に乱れんとするを以て、宜しく天下の雄儁を拘すべからずとし、因りて令に白して之を釈さしむ」と。", "translation": "『世語』にいう。「中牟において逃亡者ではないかと疑われ、県に拘留された。当時、県の属吏たちもすでに董卓からの手配書を受け取っていた；ただ功曹だけは内心これが太祖であると気づき、世がまさに乱れようとしているとき、天下の英雄・俊傑を捕らえるべきではないと考え、そこで県令に申し上げて太祖を釈放させた」。", "persons": "曹操,董卓", "places": "中牟", "era_year": "中平6年（189年）秋〜冬", "source_book": "世語", "keywords": "功曹,県令", "raw_tagged": "{{special:引用史料|《世語》}}曰：{{place:中牟|中牟}}疑是亡人，見拘於縣。時掾亦已被{{person:董卓|卓}}書；唯{{office:功曹|功曹}}心知是{{person:曹操|太祖}}，以世方亂，不宜拘天下雄儁，因白令釋之。", "kakikudashi_tagged": "{{special:引用史料|『世語』}}に曰く、「{{place:中牟|中牟}}にて是れ亡人かと疑われ、県に拘せらる。時に掾も亦た已に{{person:董卓|卓}}の書を被る；惟だ{{office:功曹|功曹}}のみ心に是れ{{person:曹操|太祖}}なるを知り、世の将に乱れんとするを以て、宜しく天下の雄儁を拘すべからずとし、因りて令に白して之を釈さしむ」と。", "translation_tagged": "{{special:引用史料|『世語』}}にいう。「{{place:中牟|中牟}}において逃亡者ではないかと疑われ、県に拘留された。当時、県の属吏たちもすでに{{person:董卓|董卓}}からの手配書を受け取っていた；ただ{{office:功曹|功曹}}だけは内心これが{{person:曹操|太祖}}であると気づき、世がまさに乱れようとしているとき、天下の英雄・俊傑を捕らえるべきではないと考え、そこで{{office:県令|県令}}に申し上げて{{person:曹操|太祖}}を釈放させた」。"}, {"id": "v1_p5_7", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 5, "type": "本文", "raw_text": "卓遂殺太后及弘農王。太祖至陳留，散家財，合義兵，將以誅卓。冬十二月，始起兵於己吾，", "kakikudashi": "卓は遂に太后及び弘農王を殺す。太祖は陳留に至り、家財を散じて義兵を合わせ、将に以て卓を誅せんとす。冬十二月、始めて兵を己吾に起こす、", "translation": "董卓はついに何太后および弘農王を殺害した。太祖は陳留に至ると、家財をなげうって義兵を募り、董卓を討伐しようとした。冬十二月、初めて己吾にて挙兵した、", "persons": "董卓,何太后,劉弁,曹操", "places": "弘農,陳留,己吾", "era_year": "中平6年（189年）9月〜12月", "source_book": "", "keywords": "弘農王,義兵", "raw_tagged": "{{person:董卓|卓}}遂殺{{person:何太后|太后}}及{{place:弘農|弘農}}{{person:劉弁|王}}。{{person:曹操|太祖}}至{{place:陳留|陳留}}，散家財，合義兵，將以誅{{person:董卓|卓}}。冬十二月，始起兵於{{place:己吾|己吾}}，", "kakikudashi_tagged": "{{person:董卓|卓}}は遂に{{person:何太后|太后}}及び{{place:弘農|弘農}}{{person:劉弁|王}}を殺す。{{person:曹操|太祖}}は{{place:陳留|陳留}}に至り、家財を散じて義兵を合わせ、将に以て{{person:董卓|卓}}を誅せんとす。冬十二月、始めて兵を{{place:己吾|己吾}}に起こす、", "translation_tagged": "{{person:董卓|董卓}}はついに{{person:何太后|何太后}}および{{place:弘農|弘農}}{{person:劉弁|王}}を殺害した。{{person:曹操|太祖}}は{{place:陳留|陳留}}に至ると、家財をなげうって義兵を募り、{{person:董卓|董卓}}を討伐しようとした。冬十二月、初めて{{place:己吾|己吾}}にて挙兵した、"}, {"id": "v1_p5_8", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 5, "type": "裴注", "raw_text": "《世語》曰：陳留孝廉衞茲以家財資太祖，使起兵，衆有五千人。", "kakikudashi": "『世語』に曰く、「陳留の孝廉なる衛茲、家財を以て太祖に資し、兵を起こさしむ、衆は五千人有り」と。", "translation": "『世語』にいう。「陳留の孝廉である衛茲が、家財を提供して太祖を援助し、挙兵させたもので、兵数は五千人であった」。", "persons": "衛茲,曹操", "places": "陳留", "era_year": "中平6年（189年）12月", "source_book": "世語", "keywords": "孝廉", "raw_tagged": "{{special:引用史料|《世語》}}曰：{{place:陳留|陳留}}{{office:孝廉|孝廉}}{{person:衛茲|衞茲}}以家財資{{person:曹操|太祖}}，使起兵，衆有五千人。", "kakikudashi_tagged": "{{special:引用史料|『世語』}}に曰く、「{{place:陳留|陳留}}の{{office:孝廉|孝廉}}なる{{person:衛茲|衛茲}}、家財を以て{{person:曹操|太祖}}に資し、兵を起こさしむ、衆は五千人有り」と。", "translation_tagged": "{{special:引用史料|『世語』}}にいう。「{{place:陳留|陳留}}の{{office:孝廉|孝廉}}である{{person:衛茲|衛茲}}が、家財を提供して{{person:曹操|太祖}}を援助し、挙兵させたもので、兵数は五千人であった」。"}, {"id": "v1_p5_9", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 5, "type": "本文", "raw_text": "是歲中平六年也。", "kakikudashi": "是の歳、中平六年なり。", "translation": "この年は中平六年（一八九年）であった。", "persons": "曹操", "places": "", "era_year": "中平6年（189年）", "source_book": "", "keywords": "中平六年", "raw_tagged": "是歲{{special:中平|中平六年}}也。", "kakikudashi_tagged": "是の歳、{{special:中平|中平六年}}なり。", "translation_tagged": "この年は{{special:中平|中平六年}}（一八九年）であった。"}, {"id": "v1_p6_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 6, "type": "本文", "raw_text": "初平元年春正月，後將軍袁術、冀州牧韓馥、", "kakikudashi": "初平元年春正月、後将軍の袁術、冀州牧の韓馥、", "translation": "初平元年（一九〇年）春正月、後将軍の袁術、冀州牧の韓馥、", "persons": "袁術,韓馥", "places": "冀州", "era_year": "初平元年（190年）春正月", "source_book": "", "keywords": "初平元年,後将軍,冀州牧", "raw_tagged": "{{special:初平|初平元年}}春正月，{{office:後将軍|後將軍}}{{person:袁術|袁術}}、{{place:冀州|冀州}}{{office:牧|牧}}{{person:韓馥|韓馥}}、", "kakikudashi_tagged": "{{special:初平|初平元年}}春正月、{{office:後将軍|後将軍}}の{{person:袁術|袁術}}、{{place:冀州|冀州}}{{office:牧|牧}}の{{person:韓馥|韓馥}}、", "translation_tagged": "{{special:初平|初平元年}}（一九〇年）春正月、{{office:後将軍|後将軍}}の{{person:袁術|袁術}}、{{place:冀州|冀州}}{{office:牧|牧}}の{{person:韓馥|韓馥}}、"}, {"id": "v1_p6_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 6, "type": "裴注", "raw_text": "《英雄記》曰：馥字文節，潁川人。爲御史中丞。董卓舉爲冀州牧。于時冀州民人殷盛，兵糧優足。袁紹之在勃海，馥恐其興兵，遣數部從事守之，不得動搖。東郡太守橋瑁詐作京師三公移書與州郡，陳卓罪惡，云「見逼迫，無以自救，企望義兵，解國患難。」馥得移，請諸從事問曰：「今當助袁氏邪，助董卓邪？」治中從事劉子惠曰：「今興兵爲國，何謂袁、董！」馥自知言短而有慙色。子惠復言：「兵者凶事，不可爲首；今宜往視他州，有發動者，然後和之。冀州於他州不爲弱也，他人功未有在冀州之右者也。」馥然之。馥乃作書與紹，道卓之惡，聽其舉兵。", "kakikudashi": "『英雄記』に曰く、「馥は字は文節、潁川の人なり。御史中丞と為る。董卓、挙げて冀州牧と為す。時に于いて冀州は民人殷盛にして、兵糧は優足せり。袁紹の勃海に在るや、馥は其の兵を興さんことを恐れ、数人の部従事を遣わして之を守らしめ、動揺するを得ざらしむ。東郡太守の橋瑁、詐りて京師の三公の移書を作りて州郡に与え、卓の罪悪を陳べ、云う、『逼迫せられ、以て自ら救う無く、義兵を企望し、国の患難を解かんとす』と。馥は移を得て、諸従事を請じて問いて曰く、『今、当に袁氏を助くべきか、董卓を助くべきか？』と。治中従事の劉子恵曰く、『今、兵を興すは国の為なり、何ぞ袁・董と謂わん！』と。馥は自ら言の短なるを知りて慙色有り。子恵、復た言う、『兵とは凶事なり、首と為るべからず；今、宜しく往きて他州を視、発動する者有らば、然る後に之に和すべし。冀州は他州に於いて弱と為さざるなり、他人の功にして未だ冀州の右に在る者は有らざるなり』と。馥は之を然りとす。馥は乃ち書を作りて紹に与え、卓の悪を道い、其の兵を挙ぐるを聴す」と。", "translation": "『英雄記』にいう。「韓馥は字を文節といい、潁川の人である。御史中丞となった。董卓は彼を推挙して冀州牧に任じた。当時、冀州は人口が多く栄えており、武器や兵糧も豊かに満ち足りていた。袁紹が勃海にいたとき、韓馥は彼が挙兵するのを恐れ、数名の部従事を派遣して彼を監視させ、身動きできないようにしていた。すると東郡太守の橋瑁が、京師の三公からの回状を偽作して各州郡に送り、董卓の罪悪を並べ立てて、『我々は董卓に脅迫されて自ら救う手立てもなく、義兵が立ち上がって国の患難を救ってくれることを切望している』と訴えた。韓馥はこの回状を受け取ると、諸従事を招集して『いま我々は袁氏を助けるべきか、それとも董卓を助けるべきか？』と尋ねた。治中従事の劉子恵は『いま兵を興すのは国家のためであります、どうして袁・董のためなどと言われるのですか！』と言った。韓馥は自らの失言を悟って恥じ入る様子を見せた。劉子恵はさらに言った、『いくさというものは凶事であり、真っ先に首唱者となってはなりません；いまはまず他州の動向を見極め、立ち上がる者が現れてからこれに呼応すべきです。冀州は他州に比べて弱小ではなく、他人の手柄が冀州の上に出ることは決してありません』。韓馥はもっともであると考えた。そこで韓馥は書状をしたためて袁紹に送り、董卓の悪逆を述べて、袁紹が挙兵することを容認した」。", "persons": "韓馥,董卓,袁紹,橋瑁,劉子恵", "places": "潁川,冀州,勃海,東郡,洛陽", "era_year": "初平元年（190年）春正月", "source_book": "英雄記", "keywords": "御史中丞,冀州牧,東郡太守,三公,治中従事", "raw_tagged": "{{special:引用史料|《英雄記》}}曰：{{person:韓馥|馥}}字{{person:韓馥|文節}}，{{place:潁川|潁川}}人。爲{{office:御史中丞|御史中丞}}。{{person:董卓|董卓}}舉爲{{place:冀州|冀州}}{{office:牧|牧}}。于時{{place:冀州|冀州}}民人殷盛，兵糧優足。{{person:袁紹|袁紹}}之在{{place:勃海|勃海}}，{{person:韓馥|馥}}恐其興兵，遣數部{{office:従事|從事}}守之，不得動搖。{{place:東郡|東郡}}{{office:太守|太守}}{{person:橋瑁|橋瑁}}詐作{{place:洛陽|京師}}{{office:三公|三公}}移書與州郡，陳{{person:董卓|卓}}罪惡，云「見逼迫，無以自救，企望義兵，解國患難。」{{person:韓馥|馥}}得移，請諸{{office:従事|從事}}問曰：「今當助{{person:袁紹|袁氏}}邪，助{{person:董卓|董卓}}邪？」{{office:従事|治中從事}}{{person:劉子恵|劉子惠}}曰：「今興兵爲國，何謂{{person:袁紹|袁}}、{{person:董卓|董}}！」{{person:韓馥|馥}}自知言短而有慙色。{{person:劉子恵|子惠}}復言：「兵者凶事，不可爲首；今宜往視他州，有發動者，然後和之。{{place:冀州|冀州}}於他州不爲弱也，他人功未有在{{place:冀州|冀州}}之右者也。」{{person:韓馥|馥}}然之。{{person:韓馥|馥}}乃作書與{{person:袁紹|紹}}，道{{person:董卓|卓}}之惡，聽其舉兵。", "kakikudashi_tagged": "{{special:引用史料|『英雄記』}}に曰く、「{{person:韓馥|馥}}は字は{{person:韓馥|文節}}、{{place:潁川|潁川}}の人なり。{{office 猛な兵をかき集めて数千人を得て、張邈と合流しようとした。王匡はこれより先に執金吾の胡母班を殺害していた。そのため胡母班の親族たちは激しい憤りを抑えきれず、太祖と勢力を合わせて、ともに王匡を殺害した」。", "persons": "王匡,何進,謝承,蔡邕,董卓,張邈,胡母班,曹操", "places": "泰山,徐州,洛陽,河内", "era_year": "中平6年（189年）〜初平元年（190年）", "source_book": "英雄記・謝承後漢書", "keywords": "大将軍,進符使,河内太守,執金吾", "raw_tagged": "{{special:引用史料|《英雄記》}}曰：{{person:王匡|匡}}字{{person:王匡|公節}}，{{place:泰山|泰山}}人。輕財好施，以任俠聞。辟{{office:大将軍|大將軍}}{{person:何進|何進}}府{{office:進符使|進符使}}，{{person:王匡|匡}}於{{place:徐州|徐州}}發彊弩五百西詣{{place:洛陽|京師}}。會{{person:何進|進}}敗，{{person:王匡|匡}}還鄉里。起家，拜{{place:河内|河內}}{{office:太守|太守}}。{{person:謝承|謝承}}{{special:引用史料|《後漢書》}}曰：{{person:王匡|匡}}少與{{person:蔡邕|蔡邕}}善。其年爲{{person:董卓|卓}}軍所敗，走還{{place:泰山|泰山}}，收集勁勇得數千人，欲與{{person:張邈|張邈}}合。{{person:王匡|匡}}先殺{{office:執金吾|執金吾}}{{person:胡母班|胡母班}}。{{person:胡母班|班}}親屬不勝憤怒，與{{person:曹操|太祖}}并勢，共殺{{person:王匡|匡}}。", "kakikudashi_tagged": "{{special:引用史料|『英雄記』}}に曰く、「{{person:王匡|匡}}は字は{{person:王匡|公節}}、{{place:泰山|泰山}}の人なり。財を軽んじ施しを好み、任侠を以て聞こゆ。{{office:大将軍|大将軍}}の{{person:何進|何進}}の府に辟されて{{office:進符使|進符使}}と為り、{{person:王匡|匡}}は{{place:徐州|徐州}}に於いて強弩五百を発し、西のかた{{place:洛陽|京師}}に詣る。会々{{person:何進|進}}が敗れ、{{person:王匡|匡}}は郷里に還る。家より起こり、{{place:河内|河内}}{{office:太守|太守}}に拝せらる」と。{{person:謝承|謝承}}の{{special:引用史料|『後漢書』}}に曰く、「{{person:王匡|匡}}は少くして{{person:蔡邕|蔡邕}}と善し。其の年、{{person:董卓|卓}}の軍の敗る所と為り、走りて{{place:泰山|泰山}}に還り、勁勇を収集して数千人を得、{{person:張邈|張邈}}と合体せんと欲す。{{person:王匡|匡}}は先に{{office:執金吾|執金吾}}の{{person:胡母班|胡母班}}を殺す。{{person:胡母班|班}}の親属は憤怒に勝えず、{{person:曹操|太祖}}と勢いを并せ、共に{{person:王匡|匡}}を殺す」と。", "translation_tagged": "{{special:引用史料|『英雄記』}}にいう。「{{person:王匡|王匡}}は字を{{person:王匡|公節}}といい、{{place:泰山|泰山}}の人である。財貨を惜しまず人に施しを与え、任侠の気風をもって知られた。{{office:大将軍|大将軍}}の{{person:何進|何進}}の幕府に召されて{{office:進符使|進符使}}となり、{{person:王匡|王匡}}は{{place:徐州|徐州}}において強弩の兵五百人を徴発し、西の{{place:洛陽|京師}}へ向かった。たまたま{{person:何進|何進}}が敗死したため、{{person:王匡|王匡}}は郷里へ帰った。その後、在野から起用されて{{place:河内|河内}}{{office:太守|太守}}に任じられた」。{{person:謝承|謝承}}の{{special:引用史料|『後漢書』}}にいう。「{{person:王匡|王匡}}は若い頃、{{person:蔡邕|蔡邕}}と親交があった。この年、{{person:董卓|董卓}}の軍に打ち破られると、逃れて{{place:泰山|泰山}}へ帰り、屈強で勇猛な兵をかき集めて数千人を得て、 "raw_text": "山陽太守袁遺、", "kakikudashi": "山陽太守の袁遺、", "translation": "山陽太守の袁遺、", "persons": "袁遺", "places": "山陽", "era_year": "初平元年（190年）春正月", "source_book": "", "keywords": "山陽太守", "raw_tagged": "{{place:山陽|山陽}}{{office:太守|太守}}{{person:袁遺|袁遺}}、", "kakikudashi_tagged": "{{place:山陽|山陽}}{{office:太守|太守}}の{{person:袁遺|袁遺}}、", "translation_tagged": "{{place:山陽|山陽}}{{office:太守|太守}}の{{person:袁遺|袁遺}}、"}, {"id": "v1_p6_12", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 6, "type": "裴注", "raw_text": "遺字伯業，紹從兄。爲長安令。河間張超甞薦遺于太尉朱儁，稱遺「有冠世之懿，幹時之量。其忠允亮直，固天所縱；若乃包羅載籍，管綜百氏，登高能賦，覩物知名，求之今日，邈焉靡儔。」事在超集。《英雄記》曰：紹後用遺爲揚州刺史，爲袁術所敗。太祖稱「長大而能勤學者，惟吾與袁伯業耳。」語在文帝《典論》。", "kakikudashi": "遺は字は伯業、紹の従兄なり。長安令と為る。河間の張超、嘗て遺を太尉の朱儁に薦め、遺を称して「世に冠たるの懿、時を幹するの量有り。其の忠允亮直なるは、固より天の縦す所なり；若し乃ち載籍を包羅し、百氏を管綜し、高きに登りて能く賦し、物を覩て名を知るは、之を今日に求むるも、邈焉として儔無し」と。事は超の集に在り。『英雄記』に曰く、「紹は後に遺を用いて揚州刺史と為すも、袁術の敗る所と為る」と。太祖は「長大にして能く学に勤むる者は、惟だ吾と袁伯業とのみ」と称す。語は文帝の『典論』に在り。", "translation": "袁遺は字を伯業といい、袁紹の従兄である。長安令となった。河間の張超は、かつて袁遺を太尉の朱儁に推薦し、袁遺を称賛して「世に冠たる美徳と、時代を背負って立つ器量を備えています。その忠誠で公明正大な人柄は、もとより天が授けたものであります；ましてあらゆる典籍を網羅し、諸子百家を統べ括り、高きに登っては詩を賦し、物を見てはその名を言い当てるほどの博識ぶりは、今の世に求めても、はるかに並ぶ者がおりません」と述べた。このことは張超の文集に載っている。『英雄記』にいう。「袁紹はのちに袁遺を起用して揚州刺史としたが、袁術に打ち破られた」。太祖は「大人になってからも学問に励むことができた者は、ただ私と袁伯業だけである」と称賛した。この言葉は文帝の『典論』に載っている。", "persons": "袁遺,袁紹,張超,朱儁,袁術,曹操,曹丕", "places": "長安,河間,揚州", "era_year": "初平元年（190年）春正月", "source_book": "張超集・英雄記・典論", "keywords": "長安令,太尉,揚州刺史,典論", "raw_tagged": "{{person:袁遺|遺}}字{{person:袁遺|伯業}}，{{person:袁紹|紹}}從兄。爲{{place:長安|長安}}{{office:県令|令}}。{{place:河間|河間}}{{person:張超|張超}}甞薦{{person:袁遺|遺}}于{{office:太尉|太尉}}{{person:朱儁|朱儁}}，稱{{person:袁遺|遺}}「有冠世之懿，幹時之量。其忠允亮直，固天所縱；若乃包羅載籍，管綜百氏，登高能賦，覩物知名，求之今日，邈焉靡儔。」事在{{person:張超|超}}集。{{special:引用史料|《英雄記》}}曰：{{person:袁紹|紹}}後用{{person:袁遺|遺}}爲{{place:揚州|揚州}}{{office:刺史|刺史}}，爲{{person:袁術|袁術}}所敗。{{person:曹操|太祖}}稱「長大而能勤學者，惟吾與{{person:袁遺|袁伯業}}耳。」語在{{person:曹丕|文帝}}{{special:典論|《典論》}}。", "kakikudashi_tagged": "{{person:袁遺|遺}}は字は{{person:袁遺|伯業}}、{{person:袁紹|紹}}の従兄なり。{{place:長安|長安}}{{office:県令|令}}と為る。{{place:河間|河間}}の{{person:張超|張超}}、嘗て{{person:袁遺|遺}}を{{office:太尉|太尉}}の{{person:朱儁|朱儁}}に薦め、{{person:袁遺|遺}}を称して「世に冠たるの懿、時を幹するの量有り。其の忠允亮直なるは、固より天の縦す所なり；若し乃ち載籍を包羅し、百氏を管綜し、高きに登りて能く賦し、物を覩て名を知るは、之を今日に求むるも、邈焉として儔無し」と。事は{{person:張超|超}}の集に在り。{{special:引用史料|『英雄記』}}に曰く、「{{person:袁紹|紹}}は後に{{person:袁遺|遺}}を用いて{{place:揚州|揚州}}{{office:刺史|刺史}}と為すも、{{person:袁術|袁術}}の敗る所と為る」と。{{person:曹操|太祖}}は「長大にして能く学に勤むる者は、惟だ吾と{{person:袁遺|袁伯業}}とのみ」と称す。語は{{person:曹丕|文帝}}の{{special:典論|『典論』}}に在り。", "translation_tagged": "{{person:袁遺|袁遺}}は字を{{person:袁遺|伯業}}といい、{{person:袁紹|袁紹}}の従兄である。{{place:長安|長安}}{{office:県令|令}}となった。{{place:河間|河間}}の{{person:張超|張超}}は、かつて{{person:袁遺|袁遺}}を{{office:太尉|太尉}}の{{person:朱儁|朱儁}}に推薦し、{{person:袁遺|袁遺}}を称賛して「世に冠たる美徳と、時代を背負って立つ器量を備えています。その忠誠で公明正大な人柄は、もとより天が授けたものであります；ましてあらゆる典籍を網羅し、諸子百家を統べ括り、高きに登っては詩を賦し、物を見てはその名を言い当てるほどの博識ぶりは、今の世に求めても、はるかに並ぶ者がおりません」と述べた。このことは{{person:張超|張超}}の文集に載っている。{{special:引用史料|『英雄記』}}にいう。「{{person:袁紹|袁紹}}はのちに{{person:袁遺|袁遺}}を起用して{{place:揚州|揚州}}{{office:刺史|刺史}}としたが、{{person:袁術|袁術}}に打ち破られた」。{{person:曹操|太祖}}は「大人になってからも学問に励むことができた者は、ただ私と{{person:袁遺|袁伯業}}だけである」と称賛した。この言葉は{{person:曹丕|文帝}}の{{special:典論|『典論』}}に載っている。"}, {"id": "v1_p6_13", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 6, "type": "本文", "raw_text": "濟北相鮑信", "kakikudashi": "済北相の鮑信、", "translation": "済北相の鮑信らが、", "persons": "鮑信", "places": "済北", "era_year": "初平元年（190年）春正月", "source_book": "", "keywords": "済北相", "raw_tagged": "{{place:済北|濟北}}{{office:相|相}}{{person:鮑信|鮑信}}", "kakikudashi_tagged": "{{place:済北|済北}}{{office:相|相}}の{{person:鮑信|鮑信}}、", "translation_tagged": "{{place:済北|済北}}{{office:相|相}}の{{person:鮑信|鮑信}}らが、"}, {"id": "v1_p6_14", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 6, "type": "裴注", "raw_text": "信事見子《勳傳》。", "kakikudashi": "信の事は子の『勲伝』に見ゆ。", "translation": "鮑信の事績は、その子の鮑勲の伝（『勲伝』）に見える。", "persons": "鮑信,鮑勲", "places": "", "era_year": "初平元年（190年）春正月", "source_book": "鮑勲伝", "keywords": "鮑勲伝", "raw_tagged": "{{person:鮑信|信}}事見子{{person:鮑勲|《勳傳》}}。", "kakikudashi_tagged": "{{person:鮑信|信}}の事は子の{{person:鮑勲|『勲伝』}}に見ゆ。", "translation_tagged": "{{person:鮑信|鮑信}}の事績は、その子の{{person:鮑勲|鮑勲}}の伝（{{person:鮑勲|『勲伝』}}）に見える。"}, {"id": "v1_p6_15", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 6, "type": "本文", "raw_text": "同時俱起兵，衆各數萬，推紹爲盟主。太祖行奮武將軍。", "kakikudashi": "同時に倶に兵を起こし、衆は各々数万、紹を推して盟主と為す。太祖は奮武将軍を行す。", "translation": "同時にこぞって兵を挙げ、兵数はそれぞれ数万にのぼり、袁紹を推戴して盟主とした。太祖は仮に奮武将軍の職務を執った。", "persons": "袁紹,曹操", "places": "", "era_year": "初平元年（190年）春正月", "source_book": "", "keywords": "盟主,奮武将軍", "raw_tagged": "同時俱起兵，衆各數萬，推{{person:袁紹|紹}}爲盟主。{{person:曹操|太祖}}行{{office:奮武将軍|奮武將軍}}。", "kakikudashi_tagged": "同時に倶に兵を起こし、衆は各々数万、{{person:袁紹|紹}}を推して盟主と為す。{{person:曹操|太祖}}は{{office:奮武将軍|奮武将軍}}を行す。", "translation_tagged": "同時にこぞって兵を挙げ、兵数はそれぞれ数万にのぼり、{{person:袁紹|袁紹}}を推戴して盟主とした。{{person:曹操|太祖}}は仮に{{office:奮武将軍|奮武将軍}}の職務を執った。"}, {"id": "v1_p7_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 7, "type": "本文", "raw_text": "二月，卓聞兵起，乃徙天子都長安。卓留屯洛陽，遂焚宮室。是時紹屯河內，邈、岱、瑁、遺屯酸棗，術屯南陽，伷屯潁川，馥在鄴。卓兵彊，紹等莫敢先進。太祖曰：「舉義兵以誅暴亂，大衆已合，諸君何疑？向使董卓聞山東兵起，倚王室之重，據二周之險，東向以臨天下；雖以無道行之，猶足爲患。今焚燒宮室，劫遷天子，海內震動，不知所歸，此天亡之時也。一戰而天下定矣，不可失也。」遂引兵西，將據成臯。邈遣將衞茲分兵隨太祖。到熒陽汴水，遇卓將徐榮，與戰不利，士卒死傷甚多。太祖爲流矢所中，所乘馬被創，從弟洪以馬與太祖，得夜遁去。榮見太祖所將兵少，力戰盡日，謂酸棗未易攻也，亦引兵還。", "kakikudashi": "二月、卓は兵の起こるを聞き、乃ち天子を徙して長安に都せしむ。卓は留まりて洛陽に屯し、遂に宮室を焚く。是の時、紹は河内に屯し、邈・岱・瑁・遺は酸棗に屯し、術は南陽に屯し、伷は潁川に屯し、馥は鄴に在り。卓の兵は強く、紹等は敢えて先んじて進む者莫し。太祖曰く、「義兵を挙げて以て暴乱を誅せんとし、大衆は已に合せり、諸君は何ぞ疑わん？向に若し董卓をして山東に兵の起こるを聞き、王室の重きに倚り、二周の険に拠り、東向して以て天下に臨ましめば；無道を以て之を行うと雖も、猶お患い為るに足れり。今、宮室を焚焼し、天子を劫遷し、海内は震動して、帰する所を知らず、此れ天が之を亡ぼすの時なり。一戦して天下は定まらん、失うべからざるなり」と。遂に兵を引きて西し、将に成皋に拠らんとす。邈は将の衛茲を遣わし、兵を分かちて太祖に随わしむ。滎陽の汴水に到り、卓の将なる徐栄に遇い、与に戦うも利あらず、士卒の死傷は甚だ多し。太祖は流矢の中たる所と為り、乗る所の馬も創を被るも、従弟の洪が馬を以て太祖に与え、夜に遁れ去るを得たり。栄は太祖の将いる所の兵は少なきも、力戦して日を尽くすを見、酸棗は未だ攻め易からざるなりと謂い、亦た兵を引きて還る。", "translation": "二月、董卓は関東で兵が起こったと聞き、天子を移して長安に遷都させた。董卓自身は留まって洛陽に駐屯し、ついに宮殿を焼き払った。この時、袁紹は河内に駐屯し、張邈・劉岱・橋瑁・袁遺は酸棗に駐屯し、袁術は南陽に駐屯し、孔伷は潁川に駐屯し、韓馥は鄴にいた。董卓の兵は強大であったため、袁紹らは誰一人としてあえて先んじて進軍しようとする者がなかった。太祖は言った、「義兵を挙げて暴乱の賊を誅滅しようとし、すでに大軍は結集したというのに、諸君はどうしてためらうのか？もし仮に董卓が山東で兵が起こったと聞いた際、王室の権威を後ろ盾とし、二周の険要に拠って、東に向かって天下に臨んでいたならば；たとえ非道なやり方であったとしても、なお我々にとって脅威となり得たであろう。しかし今や董卓は宮殿を焼き払い、天子を脅迫して連れ去ったため、天下は激しく動揺して帰趨するところを知らずにおり、これこそ天が彼を滅ぼす時である。一戦にして天下は定まるであろう、この好機を逃してはならない」。こうしてついに兵を率いて西へ進み、成皋を占拠しようとした。張邈は部将の衛茲を派遣し、兵を分けて太祖に従軍させた。滎陽の汴水に至ったところで、董卓の部将である徐栄と遭遇し、交戦したが利あらず、兵士の死傷者が極めて多かった。太祖は流れ矢に当たり、乗っていた馬も傷を負ったが、従弟の曹洪が自分の馬を太祖に差し出したため、夜陰に乗じて逃れ去ることができた。徐栄は、太祖の率いる兵が少数でありながら終日力戦したのを見て、酸棗を攻め落とすのは容易ではないと考え、彼もまた兵を率いて引き揚げた。", "persons": "董卓,献帝,袁紹,張邈,劉岱,橋瑁,袁遺,袁術,孔伷,韓馥,曹操,衛茲,徐栄,曹洪", "places": "長安,洛陽,河内,酸棗,南陽,潁川,鄴,成皋,滎陽,汴水", "era_year": "初平元年（190年）2月", "source_book": "", "keywords": "長安遷都,二周の険,山東,滎陽汴水の戦い", "raw_tagged": "二月，{{person:董卓|卓}}聞兵起，乃徙{{person:献帝|天子}}都{{place:長安|長安}}。{{person:董卓|卓}}留屯{{place:洛陽|洛陽}}，遂焚宮室。是時{{person:袁紹|紹}}屯{{place:河内|河內}}，{{person:張邈|邈}}、{{person:劉岱|岱}}、{{person:橋瑁|瑁}}、{{person:袁遺|遺}}屯{{place:酸棗|酸棗}}，{{person:袁術|術}}屯{{place:南陽|南陽}}，{{person:孔伷|伷}}屯{{place:潁川|潁川}}，{{person:韓馥|馥}}在{{place:鄴|鄴}}。{{person:董卓|卓}}兵彊，{{person:袁紹|紹}}等莫敢先進。{{person:曹操|太祖}}曰：「舉義兵以誅暴亂，大衆已合，諸君何疑？向使{{person:董卓|董卓}}聞山東兵起，倚王室之重，據{{special:二周|二周之險}}，東向以臨天下；雖以無道行之，猶足爲患。今焚燒宮室，劫遷{{person:献帝|天子}}，海內震動，不知所歸，此天亡之時也。一戰而天下定矣，不可失也。」遂引兵西，將據{{place:成皋|成臯}}。{{person:張邈|邈}}遣將{{person:衛茲|衞茲}}分兵隨{{person:曹操|太祖}}。到{{place:滎陽|熒陽}}{{place:汴水|汴水}}，遇{{person:董卓|卓}}將{{person:徐栄|徐榮}}，與戰不利，士卒死傷甚多。{{person:曹操|太祖}}爲流矢所中，所乘馬被創，從弟{{person:曹洪|洪}}以馬與{{person:曹操|太祖}}，得夜遁去。{{person:徐栄|榮}}見{{person:曹操|太祖}}所將兵少，力戰盡日，謂{{place:酸棗|酸棗}}未易攻也，亦引兵還。", "kakikudashi_tagged": "二月、{{person:董卓|卓}}は兵の起こるを聞き、乃ち{{person:献帝|天子}}を徙して{{place:長安|長安}}に都せしむ。{{person:董卓|卓}}は留まりて{{place:洛陽|洛陽}}に屯し、遂に宮室を焚く。是の時、{{person:袁紹|紹}}は{{place:河内|河内}}に屯し、{{person:張邈|邈}}・{{person:劉岱|岱}}・{{person:橋瑁|瑁}}・{{person:袁遺|遺}}は{{place:酸棗|酸棗}}に屯し、{{person:袁術|術}}は{{place:南陽|南陽}}に屯し、{{person:孔伷|伷}}は{{place:潁川|潁川}}に屯し、{{person:韓馥|馥}}は{{place:鄴|鄴}}に在り。{{person:董卓|卓}}の兵は強く、{{person:袁紹|紹}}等は敢えて先んじて進む者莫し。{{person:曹操|太祖}}曰く、「義兵を挙げて以て暴乱を誅せんとし、大衆は已に合せり、諸君は何ぞ疑わん？向に若し{{person:董卓|董卓}}をして山東に兵の起こるを聞き、王室の重きに倚り、{{special:二周|二周の険}}に拠り、東向して以て天下に臨ましめば；無道を以 不能用。", "kakikudashi": "太祖は酸棗に到るに、諸軍の兵は十余万、日々に置酒高会し、進取を図らず。太祖は之を責譲し、因りて為に謀りて曰く、「諸君、吾が計を聴き、勃海をして河内の衆を引きて孟津に臨ましめ、酸棗の諸将は成皋を守り、敖倉に拠り、轘轅・太谷を塞ぎて、全く其の険を制せよ；袁将軍をして南陽の軍を率いて丹・析に軍し、武関に入り、以て三輔を震わさしめよ：皆、塁を高くし壁を深くし、与に戦う勿かれ、益々疑兵を為し、天下に形勢を示し、順を以て逆を誅さば、立ちどころに定むべきなり。今、兵は義を以て動くに、持疑して進まず、天下の望みを失う、窃かに諸君の為に之を恥じるなり！」と。邈等は用うる能わず。", "translation": "太祖が酸棗に帰還すると、諸軍の兵は十余万にのぼりながら、毎日酒宴を開いて歓談するばかりで、進撃を図ろうとしなかった。太祖は彼らを厳しく叱責し、そこで彼らのために策を立てて言った、「諸君が私の計略を聴き入れるならば、勃海（袁紹）に河内の軍勢を率いて孟津に臨ませ、酸棗の諸将は成皋を守り、敖倉を占拠し、轘轅・太谷を封鎖して、その険要を完全に制圧せよ；さらに袁将軍（袁術）に南陽の軍を率いて丹・析に布陣させ、武関へ攻め入って三輔を震撼させよ：そしてどの軍もみな塁壁を高く堀を深くして、敵と直接交戦せず、ますます疑兵を増やして天下に威勢を示し、順道を以て逆賊を討つならば、たちどころに平定できるであろう。いま大義によって兵を動かしたにもかかわらず、疑いためらって進まず、天下の期待を裏切っているのは、ひそかに諸君のために恥ずかしく思う！」と。しかし張邈らはこの策を採用することができなかった。", "persons": "曹操,袁紹,袁術,張邈", "places": "酸棗,河内,孟津,成皋,敖倉,轘轅,太谷,南陽,丹水,析,武関,三輔", "era_year": "初平元年（190年）春", "source_book": "", "keywords": "置酒高会,敖倉,轘轅,太谷,武関,三輔", "raw_tagged": "{{person:曹操|太祖}}到{{place:酸棗|酸棗}}，諸軍兵十餘萬，日置酒高會，不圖進取。{{person:曹操|太祖}}責讓之，因爲謀曰：「諸君聽吾計，使{{person:袁紹|勃海}}引{{place:河内|河內}}之衆臨{{place:孟津|孟津}}，{{place:酸棗|酸棗}}諸將守{{place:成皋|成臯}}，據{{place:敖倉|敖倉}}，塞{{place:轘轅|轘轅}}、{{place:太谷|太谷}}，全制其險；使{{person:袁術|袁將軍}}率{{place:南陽|南陽}}之軍軍{{place:丹水|丹}}、{{place:析|析}}，入{{place:武関|武關}}，以震{{place:三輔|三輔}}：皆高壘深壁，勿與戰，益爲疑兵，示天下形勢，以順誅逆，可立定也。今兵以義動，持疑而不進，失天下之望，竊爲諸君耻之！」{{person:張邈|邈}}等不能用。", "kakikudashi_tagged": "{{person:曹操|太祖}}は{{place:酸棗|酸棗}}に到るに、諸軍の兵は十余万、日々に置酒高会し、進取を図らず。{{person:曹操|太祖}}は之を責譲し、因りて為に謀りて曰く、「諸君、吾が計を聴き、{{person:袁紹|勃海}}をして{{place:河内|河内}}の衆を引きて{{place:孟津|孟津}}に臨ましめ、{{place:酸棗|酸棗}}の諸将は{{place:成皋|成皋}}を守り、{{place:敖倉|敖倉}}に拠り、{{place:轘轅|轘轅}}・{{place:太谷|太谷}}を塞ぎて、全く其の険を制せよ；{{person:袁術|袁将軍}}をして{{place:南陽|南陽}}の軍を率いて{{place:丹水|丹}}・{{place:析|析}}に軍し、{{place:武関|武関}}に入り、以て{{place:三輔|三輔}}を震わさしめよ：皆、塁を高くし壁を深くし、与に戦う勿かれ、益々疑兵を為し、天下に形勢を示し、順を以て逆を誅さば、立ちどころに定むべきなり。今、兵は義を以て動くに、持疑して進まず、天下の望みを失う、窃かに諸君の為に之を恥じるなり！」と。{{person:張邈|邈}}等は用うる能わず。", "translation_tagged": "{{person:曹操|太祖}}が{{place:酸棗|酸棗}}に帰還すると、諸軍の兵は十余万にのぼりながら、毎日酒宴を開いて歓談するばかりで、進撃を図ろうとしなかった。{{person:曹操|太祖}}は彼らを厳しく叱責し、そこで彼らのために策を立てて言った、「諸君が私
