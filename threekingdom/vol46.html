  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

    .modal-overlay {
      position: absolute;

    .wiki-standard-box {
      background: #f3f6f9;
      border-left: 4px solid #1565c0;
      padding: 10px 12px;
      border-radius: 4px;

    }
    .ai-special-box {
      background: #f8f4fc;
      border-left: 4px solid #6a1b9a;

      border-radius: 4px;

    }
    .occurrence-details {
      border: 1px solid #d4cbb8;
      border-radius: 6px;
      background: #f7f3eb;
      overflow: hidden;
      flex-shrink: 0;
    }
    .occurrence-summary {
      padding: 7px 12px;
      font-size: 0.86rem;
      font-weight: bold;
      color: #3d2f1d;
      cursor: pointer;
      user-select: none;

      display: flex;
      align-items: center;
      gap: 6px;
    }

      content: '▶';
      font-size: 0.72rem;
      color: #8c6d46;
      transition: transform 0.15s;
    }
    .occurrence-details[open] .occurrence-summary::before {
      transform: rotate(90deg);
    }
    .occurrence-details[open] .occurrence-summary {
      border-bottom: 1px solid #d4cbb8;
      background: #efe9dc;
    }
    .occurrence-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fffdf9;
    }
    .wiki-link-btn {
      display: inline-block;
      margin-top: 6px;
      background: #1565c0;

    }
    .jump-btn {

      padding: 0 2px;

    }
    .map-toast {

    .toast-special-badge {

    .toast-fb-btn {

    /* ワンクリック指摘フローティングバー（文字選択・タグクリック時） */
    .selection-feedback-bar {
      position: fixed;

      display: flex;

      max-height: 45vh;

    /* スマホ・縦長タブレット対応（上40%：地図 ／ 下60%：本文スクロール＋末尾広告） */

      .main-container {

      }

{{place:匏里|匏里}}上掠取賈人財物，方於岸上分之，行旅皆住，船不敢進。{{person:孫堅|堅}}謂父曰：「此賊可擊，請討之。」父曰：「非爾所圖也。」{{person:孫堅|堅}}行操刀上岸，以手東西指麾，若分部人兵以羅遮賊狀。賊望見，以爲官兵捕之，卽委財物散走。{{person:孫堅|堅}}追，斬得一級以還。父大驚。由是顯聞，府召署{{office:仮尉|假尉}}。{{place:会稽|會稽}}妖賊{{person:許昌|許昌}}起於{{place:句章|句章}}，自稱{{special:陽明皇帝|陽明皇帝}}，", "kakikudashi_tagged": "少くして{{office:県吏|県吏}}と為る。年十七にして、父と共に船に載りて{{place:銭唐|銭唐}}に至るに、会たま海賊の{{person:胡玉|胡玉}}等、{{place:匏里|匏里}}より上りて賈人の財物を掠取し、方に岸上に於て之を分ち、行旅皆住まり、船敢へて進まず。{{person:孫堅|堅}}、父に謂ひて曰く、「此の賊、撃つべし、請ふ之を討たん」と。父曰く、「爾の図る所に非ざるなり」と。{{person:孫堅|堅}}、行きて刀を操りて岸に上り、手を以て東西に指麾し、人兵を分部して以て賊を羅遮するが若きの状をなす。賊、望見し、以て官兵の之を捕ふると為し、即ち財物を委てて散走す。{{person:孫堅|堅}}、追ひて、一級を斬り得て以て還る。父、大いに驚く。是に由りて顕聞し、府、召して{{office:仮尉|仮尉}}に署す。{{place:会稽|会稽}}の妖賊{{person:許昌|許昌}}、{{place:句章|句章}}に起り、自ら{{special:陽明皇帝|陽明皇帝}}と称し、", "translation_tagged": "若い頃に県の役人（{{office:県吏|県吏}}）となった。十七歳のとき、父（{{person:孫鍾|孫鍾}}）とともに船に乗って{{place:銭唐|銭唐}}県へ赴いたところ、ちょうど海賊の{{person:胡玉|胡玉}}らが{{place:匏里|匏里}}から上がってきて商人の財物を略奪し、まさに岸辺で分け前を分配していたため、旅人はみな足止めされ、船も恐れて進むことができなかった。{{person:孫堅|孫堅}}は父に言った。「この賊は討ち取れます、どうか私に討たせてください」。父は「お前が企ててよいことではない」と止めた。しかし{{person:孫堅|孫堅}}は進み出て刀を手に岸へ駆け上がり、手で東や西を指図して、あたかも兵士たちを手分けして賊を包囲・遮断しているかのような身振りをしてみせた。賊はこれを遠くから見て、官軍が捕らえに来たのだと錯覚し、ただちに財物を投げ捨てて散り散りに逃走した。{{person:孫堅|孫堅}}は追撃し、賊一人の首級を斬り取って戻ってきた。父は大いに驚いた。この出来事によって{{person:孫堅|孫堅}}の名が知れ渡り、呉郡の郡府は彼を召し出して{{office:仮尉|仮尉}}（臨時の県尉）に任じた。その後、{{place:会稽|会稽}}郡の妖賊である{{person:許昌|許昌}}が{{place:句章|句章}}県で蜂起し、自ら{{special:陽明皇帝|陽明皇帝}}と称し、"}, {"id": "v46_p2_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 2, "type": "裴注", "raw_text": "《靈帝紀》曰：「昌以其父爲越王也。」", "kakikudashi": "『霊帝紀』に曰く、「昌、其の父を以て越王と為すなり」と。", "translation": "『漢霊帝紀』にいう。「許昌はその父（許生）を立てて越王としたのである」。", "persons": "許昌", "places": "", "era_year": "熹平元年（172年）", "source_book": "漢霊帝紀", "keywords": "越王", "raw_tagged": "《{{special:引用史料|靈帝紀}}》曰：「{{person:許昌|昌}}以其父爲{{special:陽明皇帝|越王}}也。」", "kakikudashi_tagged": "『{{special:引用史料|霊帝紀}}』に曰く、「{{person:許昌|昌}}、其の父を以て{{special:陽明皇帝|越王}}と為すなり」と。", "translation_tagged": "『{{special:引用史料|漢霊帝紀}}』にいう。「{{person:許昌|許昌}}はその父（許生）を立てて{{special:陽明皇帝|越王}}としたのである」。"}, {"id": "v46_p2_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 2, "type": "本文", "raw_text": "與其子韶扇動諸縣，衆以萬數。堅以郡司馬募召精勇，得千餘人，與州郡合討破之。是歲，熹平元年也。刺史臧旻列上功狀，詔書除堅鹽瀆丞，數歲徙盱眙丞，又徙下邳丞。", "kakikudashi": "其の子の韶と諸県を扇動し、衆、万を以て数ふ。堅、郡司馬を以て精勇を募召し、千余人を得、州郡と合して討ちて之を破る。是の歳、熹平元年なり。刺史臧旻、功状を列上し、詔書して堅を塩瀆丞に除し、数歳にして盱眙丞に徙り、又下邳丞に徙る。", "translation": "その子の許韶とともに諸県を扇動し、軍勢は数万人に膨れ上がった。孫堅は呉郡の郡司馬として精鋭の勇士を募り、千余人を集めると、揚州や会稽郡の軍と協力して許昌らを討伐し撃破した。この年は熹平元年（172年）であった。揚州刺史の臧旻がその功績を上奏したため、詔書によって孫堅は塩瀆県丞に任じられ、数年後に盱眙県丞へ転任し、さらに下邳県丞へと転任した。", "persons": "許韶,許昌,孫堅,臧旻", "places": "塩瀆,盱眙,下邳", "era_year": "熹平元年（172年）以降", "source_book": "", "keywords": "郡司馬,熹平,刺史,県丞", "raw_tagged": "與其子{{person:許韶|韶}}扇動諸縣，衆以萬數。{{person:孫堅|堅}}以{{office:司馬|郡司馬}}募召精勇，得千餘人，與州郡合討破之。是歲，{{special:熹平|熹平元年}}也。{{office:刺史|刺史}}{{person:臧旻|臧旻}}列上功狀，詔書除{{person:孫堅|堅}}{{place:塩瀆|鹽瀆}}{{office:県丞|丞}}，數歲徙{{place:盱眙|盱眙}}{{office:県丞|丞}}，又徙{{place:下邳|下邳}}{{office:県丞|丞}}。", "kakikudashi_tagged": "其の子の{{person:許韶|韶}}と諸県を扇動し、衆、万を以て数ふ。{{person:孫堅|堅}}、{{office:司馬|郡司馬}}を以て精勇を募召し、千余人を得、州郡と合して討ちて之を破る。是の歳、{{special:熹平|熹平元年}}なり。{{office:刺史|刺史}}{{person:臧旻|臧旻}}、功状を列上し、詔書して{{person:孫堅|堅}}を{{place:塩瀆|塩瀆}}{{office:県丞|丞}}に除し、数歳にして{{place:盱眙|盱眙}}{{office:県丞|丞}}に徙り、又{{place:下邳|下邳}}{{office:県丞|丞}}に徙る。", "translation_tagged": "その子の{{person:許韶|許韶}}とともに諸県を扇動し、軍勢は数万人に膨れ上がった。{{person:孫堅|孫堅}}は呉郡の{{office:司馬|郡司馬}}として精鋭の勇士を募り、千余人を集めると、揚州や会稽郡の軍と協力して{{person:許昌|許昌}}らを討伐し撃破した。この年は{{special:熹平|熹平元年}}（172年）であった。{{place:揚州|揚州}}{{office:刺史|刺史}}の{{person:臧旻|臧旻}}がその功績を上奏したため、詔書によって{{person:孫堅|孫堅}}は{{place:塩瀆|塩瀆}}{{office:県丞|県丞}}に任じられ、数年後に{{place:盱眙|盱眙}}{{office:県丞|県丞}}へ転任し、さらに{{place:下邳|下邳}}{{office:県丞|県丞}}へと転任した。"}, {"id": "v46_p2_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 2, "type": "裴注", "raw_text": "《江表傳》曰：「堅歷佐三縣，所在有稱，吏民親附。鄕里知舊，好事少年，往來者常數百人，堅接撫待養，有若子弟焉。」", "kakikudashi": "『江表伝』に曰く、「堅、三県を歴佐し、在る所に称有り、吏民親附す。郷里の知旧、好事の少年、往来する者常に数百人、堅、接撫待養し、子弟の若き有り」と。", "translation": "『江表伝』にいう。「孫堅は三つの県の県丞を歴任して補佐し、赴任した先々で名声を博し、官吏や民衆は彼に親しみ付き従った。故郷の旧知の者や侠気を好む若者たちで、孫堅のもとに出入りする者は常に数百人に上ったが、孫堅は彼らを温かく迎え入れて養い、まるで自分の子弟のように扱った」。", "persons": "孫堅", "places": "", "era_year": "", "source_book": "江表伝", "keywords": "", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫堅|堅}}歷佐三縣，所在有稱，吏民親附。鄕里知舊，好事少年，往來者常數百人，{{person:孫堅|堅}}接撫待養，有若子弟焉。」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に曰く、「{{person:孫堅|堅}}、三県を歴佐し、在る所に称有り、吏民親附す。郷里の知旧、好事の少年、往来する者常に数百人、{{person:孫堅|堅}}、接撫待養し、子弟の若き有り」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「{{person:孫堅|孫堅}}は三つの県の{{office:県丞|県丞}}を歴任して補佐し、赴任した先々で名声を博し、官吏や民衆は彼に親しみ付き従った。故郷の旧知の者や侠気を好む若者たちで、{{person:孫堅|孫堅}}のもとに出入りする者は常に数百人に上ったが、{{person:孫堅|孫堅}}は彼らを温かく迎え入れて養い、まるで自分の子弟のように扱った」。"}, {"id": "v46_p3_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 3, "type": "本文", "raw_text": "中平元年，黃巾賊師張角起於魏郡。託有神靈，遣八使以善道教化天下，而潛相連結，自稱黃天泰平。三月甲子，三十六（萬）一旦俱發，天下響應，燔燒郡縣，殺害長吏。", "kakikudashi": "中平元年、黄巾の賊師張角、魏郡に起る。神霊有るに託し、八使を遣はして善道を以て天下を教化せしめ、潜かに相ひ連結し、自ら黄天泰平と称す。三月甲子、三十六（万）一旦にして倶に発し、天下響応し、郡県を燔焼し、長吏を殺害す。", "translation": "中平元年（184年）、黄巾の賊の首領である張角が魏郡で蜂起した。張角は神霊が宿っていると称し、八人の使者を派遣して善道（太平道）によって天下を教化させつつ、ひそかに各地の信徒を結びつけ、自ら「黄天泰平」と称した。三月甲子の日、三十六方（三十六万）の信徒が一斉に決起すると、天下はこれに呼応して立ち上がり、郡県の役所を焼き払い、地方長官（長吏）を殺害した。", "persons": "張角", "places": "魏郡", "era_year": "中平元年（184年）", "source_book": "", "keywords": "中平,黄巾,善道,黄天泰平,甲子,三十六方,長吏", "raw_tagged": "{{special:中平|中平元年}}，{{special:黄巾|黃巾}}賊師{{person:張角|張角}}起於{{place:魏郡|魏郡}}。託有神靈，遣八使以{{special:善道|善道}}教化天下，而潛相連結，自稱{{special:黄巾|黃天泰平}}。{{special:甲子|三月甲子}}，{{special:黄巾|三十六（萬）}}一旦俱發，天下響應，燔燒郡縣，殺害{{office:県長|長吏}}。", "kakikudashi_tagged": "{{special:中平|中平元年}}、{{special:黄巾|黄巾}}の賊師{{person:張角|張角}}、{{place:魏郡|魏郡}}に起る。神霊有るに託し、八使を遣はして{{special:善道|善道}}を以て天下を教化せしめ、潜かに相ひ連結し、自ら{{special:黄巾|黄天泰平}}と称す。{{special:甲子|三月甲子}}、{{special:黄巾|三十六（万）}}一旦にして倶に発し、天下響応し、郡県を燔焼し、{{office:県長|長吏}}を殺害す。", "translation_tagged": "{{special:中平|中平元年}}（184年）、{{special:黄巾|黄巾}}の賊の首領である{{person:張角|張角}}が{{place:魏郡|魏郡}}で蜂起した。{{person:張角|張角}}は神霊が宿っていると称し、八人の使者を派遣して{{special:善道|善道（太平道）}}によって天下を教化させつつ、ひそかに各地の信徒を結びつけ、自ら「{{special:黄巾|黄天泰平}}」と称した。{{special:甲子|三月甲子の日}}、{{special:黄巾|三十六方}}（三十六万）の信徒が一斉に決起すると、天下はこれに呼応して立ち上がり、郡県の役所を焼き払い、地方長官（{{office:県長|長吏}}）を殺害した。"}, {"id": "v46_p3_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 3, "type": "裴注", "raw_text": "《獻帝春秋》曰：「角稱天公將軍，角弟寶稱地公將軍，寶弟梁稱人公將軍。」", "kakikudashi": "『献帝春秋』に曰く、「角は天公将軍と称し、角の弟の宝は地公将軍と称し、宝の弟の梁は人公将軍と称す」と。", "translation": "『献帝春秋』にいう。「張角は天公将軍と称し、張角の弟の張宝は地公将軍と称し、張宝の弟の張梁は人公将軍と称した」。", "persons": "張角,張宝,張梁", "places": "", "era_year": "中平元年（184年）", "source_book": "献帝春秋", "keywords": "天公将軍", "raw_tagged": "《{{special:引用史料|獻帝春秋}}》曰：「{{person:張角|角}}稱{{office:雑号将軍|天公將軍}}，{{person:張角|角}}弟{{person:張宝|寶}}稱{{office:雑号将軍|地公將軍}}，{{person:張宝|寶}}弟{{person:張梁|梁}}稱{{office:雑号将軍|人公將軍}}。」", "kakikudashi_tagged": "『{{special:引用史料|献帝春秋}}』に曰く、「{{person:張角|角}}は{{office:雑号将軍|天公将軍}}と称し、{{person:張角|角}}の弟の{{person:張宝|宝}}は{{office:雑号将軍|地公将軍}}と称し、{{person:張宝|宝}}の弟の{{person:張梁|梁}}は{{office:雑号将軍|人公将軍}}と称す」と。", "translation_tagged": "『{{special:引用史料|献帝春秋}}』にいう。「{{person:張角|張角}}は{{office:雑号将軍|天公将軍}}と称し、{{person:張角|張角}}の弟の{{person:張宝|張宝}}は{{office:雑号将軍|地公将軍}}と称し、{{person:張宝|張宝}}の弟の{{person:張梁|張梁}}は{{office:雑号将軍|人公将軍}}と称した」。"}, {"id": "v46_p3_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 3, "type": "本文", "raw_text": "漢朝遣車騎將軍皇甫崧、中郎將朱儁將兵討擊之。儁表請堅爲佐軍司馬，鄕里少年隨在下邳者皆願從。堅又募諸商旅及淮泗精兵，合千許人，與儁並力奮擊，所向無前。", "kakikudashi": "漢朝、車騎将軍皇甫嵩・中郎将朱儁を遣はし、兵を将ゐて之を討撃せしむ。儁、表して堅を請ひて佐軍司馬と為すに、郷里の少年の随ひて下邳に在る者、皆従はんことを願ふ。堅、又諸の商旅及び淮・泗の精兵を募り、合せて千許人、儁と力を並せて奮撃し、向ふ所前無し。", "translation": "漢の朝廷は車騎将軍の皇甫嵩と中郎将の朱儁を派遣し、軍勢を率いて黄巾を討伐させた。朱儁が上表して孫堅を佐軍司馬に迎え入れると、下邳に付き従っていた故郷の若者たちはみな従軍を願い出た。孫堅はさらに隊商の者たちや淮水・泗水流域の精鋭兵を募り、合わせて千人ばかりを得ると、朱儁と力を合わせて奮戦し、向かうところ敵なしであった。", "persons": "皇甫嵩,朱儁,孫堅", "places": "下邳,淮水,泗水", "era_year": "中平元年（184年）", "source_book": "", "keywords": "漢,車騎将軍,中郎将,佐軍司馬", "raw_tagged": "漢朝遣{{office:車騎将軍|車騎將軍}}{{person:皇甫嵩|皇甫崧}}、{{office:中郎将|中郎將}}{{person:朱儁|朱儁}}將兵討擊之。{{person:朱儁|儁}}表請{{person:孫堅|堅}}爲{{office:司馬|佐軍司馬}}，鄕里少年隨在{{place:下邳|下邳}}者皆願從。{{person:孫堅|堅}}又募諸商旅及{{place:淮水|淮}}{{place:泗水|泗}}精兵，合千許人，與{{person:朱儁|儁}}並力奮擊，所向無前。", "kakikudashi_tagged": "漢朝、{{office:車騎将軍|車騎将軍}}{{person:皇甫嵩|皇甫嵩}}・{{office:中郎将|中郎将}}{{person:朱儁|朱儁}}を遣はし、兵を将ゐて之を討撃せしむ。{{person:朱儁|儁}}、表して{{person:孫堅|堅}}を請ひて{{office:司馬|佐軍司馬}}と為すに、郷里の少年の随ひて{{place:下邳|下邳}}に在る者、皆従はんことを願ふ。{{person:孫堅|堅}}、又諸の商旅及び{{place:淮水|淮}}・{{place:泗水|泗}}の精兵を募り、合せて千許人、{{person:朱儁|儁}}と力を並せて奮撃し、向ふ所前無し。", "translation_tagged": "漢の朝廷は{{office:車騎将軍|車騎将軍}}の{{person:皇甫嵩|皇甫嵩}}と{{office:中郎将|中郎将}}の{{person:朱儁|朱儁}}を派遣し、軍勢を率いて{{special:黄巾|黄巾}}を討伐させた。{{person:朱儁|朱儁}}が上表して{{person:孫堅|孫堅}}を{{office:司馬|佐軍司馬}}に迎え入れると、{{place:下邳|下邳}}に付き従っていた故郷の若者たちはみな従軍を願い出た。{{person:孫堅|孫堅}}はさらに隊商の者たちや{{place:淮水|淮水}}・{{place:泗水|泗水}}流域の精鋭兵を募り、合わせて千人ばかりを得ると、{{person:朱儁|朱儁}}と力を合わせて奮戦し、向かうところ敵なしであった。"}, {"id": "v46_p3_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 3, "type": "裴注", "raw_text": "《吳書》曰：「堅乘勝深入，於西華失利。堅被創墮馬，臥草中。軍衆分散，不知堅所在。堅所騎驄馬馳還營，踣地呼鳴，將士隨馬於草中得堅。堅還營十數日，創少愈，乃復出戰。」", "kakikudashi": "『呉書』に曰く、「堅、勝に乗じて深く入り、西華に於て利を失ふ。堅、創を被りて馬より堕ち、草中に臥す。軍衆分散し、堅の在る所を知らず。堅の騎る所の驄馬、馳せて営に還り、地を踣みて呼鳴すれば、将士、馬に随ひて草中に於て堅を得たり。堅、営に還ること十数日、創少しく愈ゆれば、乃ち復た出でて戦ふ」と。", "translation": "『呉書』にいう。「孫堅は勝ちに乗じて敵地深く攻め込んだが、西華県において敗北を喫した。孫堅は傷を負って落馬し、草むらの中に倒れ伏した。兵士たちは散り散りになり、孫堅の行方が分からなくなった。すると孫堅が乗っていた驄馬（青白い毛並みの馬）が陣営へ駆け戻り、地面を踏み鳴らして嘶いたため、将兵たちが馬の後について行き、草むらの中で孫堅を発見して救い出した。孫堅は陣営に戻って十数日ほど過ごし、傷がいくらか癒えると、再び出撃して戦った」。", "persons": "孫堅", "places": "西華", "era_year": "中平元年（184年）", "source_book": "呉書", "keywords": "驄馬", "raw_tagged": "《{{special:引用史料|吳書}}》曰：「{{person:孫堅|堅}}乘勝深入，於{{place:西華|西華}}失利。{{person:孫堅|堅}}被創墮馬，臥草中。軍衆分散，不知{{person:孫堅|堅}}所在。{{person:孫堅|堅}}所騎{{special:驄馬|驄馬}}馳還營，踣地呼鳴，將士隨馬於草中得{{person:孫堅|堅}}。{{person:孫堅|堅}}還營十數日，創少愈，乃復出戰。」", "kakikudashi_tagged": "『{{special:引用史料|呉書}}』に曰く、「{{person:孫堅|堅}}、勝に乗じて深く入り、{{place:西華|西華}}に於て利を失ふ。{{person:孫堅|堅}}、創を被りて馬より堕ち、草中に臥す。軍衆分散し、{{person:孫堅|堅}}の在る所を知らず。{{person:孫堅|堅}}の騎る所の{{special:驄馬|驄馬}}、馳せて営に還り、地を踣みて呼鳴すれば、将士、馬に随ひて草中に於て{{person:孫堅|堅}}を得たり。{{person:孫堅|堅}}、営に還ること十数日、創少しく愈ゆれば、乃ち復た出でて戦ふ」と。", "translation_tagged": "『{{special:引用史料|呉書}}』にいう。「{{person:孫堅|孫堅}}は勝ちに乗じて敵地深く攻め込んだが、{{place:西華|西華}}県において敗北を喫した。{{person:孫堅|孫堅}}は傷を負って落馬し、草むらの中に倒れ伏した。兵士たちは散り散りになり、{{person:孫堅|孫堅}}の行方が分からなくなった。すると{{person:孫堅|孫堅}}が乗っていた{{special:驄馬|驄馬}}（青白い毛並みの馬）が陣営へ駆け戻り、地面を踏み鳴らして嘶いたため、将兵たちが馬の後について行き、草むらの中で{{person:孫堅|孫堅}}を発見して救い出した。{{person:孫堅|孫堅}}は陣営に戻って十数日ほど過ごし、傷がいくらか癒えると、再び出撃して戦った」。"}, {"id": "v46_p3_5", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 3, "type": "本文", "raw_text": "汝潁賊困迫，走保宛城。堅身當一面，登城先入，衆乃蟻附，遂大破之。儁具以狀聞上，拜堅別部司馬。", "kakikudashi": "汝・潁の賊、困迫し、走りて宛城を保つ。堅、身ら一面に当り、城に登りて先づ入れば、衆、乃ち蟻附し、遂に大いに之を破る。儁、具さに状を以て上に聞し、堅を別部司馬に拝す。", "translation": "汝南・潁川の黄巾賊は追い詰められ、逃走して宛城に立てこもった。孫堅は自ら城の一面を担当し、城壁をよじ登って一番乗りを果たすと、全軍が蟻の群がるように続いて城内へ突入し、ついに賊軍を大いに撃破した。朱儁がその活躍ぶりを詳細に皇帝へ上奏したため、孫堅は別部司馬に任じられた。", "persons": "孫堅,朱儁", "places": "汝南,潁川,宛", "era_year": "中平元年（184年）", "source_book": "", "keywords": "蟻附,別部司馬", "raw_tagged": "{{place:汝南|汝}}{{place:潁川|潁}}賊困迫，走保{{place:宛|宛城}}。{{person:孫堅|堅}}身當一面，登城先入，衆乃{{special:蟻附|蟻附}}，遂大破之。{{person:朱儁|儁}}具以狀聞上，拜{{person:孫堅|堅}}{{office:司馬|別部司馬}}。", "kakikudashi_tagged": "{{place:汝南|汝}}・{{place:潁川|潁}}の賊、困迫し、走りて{{place:宛|宛城}}を保つ。{{person:孫堅|堅}}、身ら一面に当り、城に登りて先づ入れば、衆、乃ち{{special:蟻附|蟻附}}し、遂に大いに之を破る。{{person:朱儁|儁}}、具さに状を以て上に聞し、{{person:孫堅|堅}}を{{office:司馬|別部司馬}}に拝す。", "translation_tagged": "{{place:汝南|汝南}}・{{place:潁川|潁川}}の{{special:黄巾|黄巾}}賊は追い詰められ、逃走して{{place:宛|宛城}}に立てこもった。{{person:孫堅|孫堅}}は自ら城の一面を担当し、城壁をよじ登って一番乗りを果たすと、全軍が蟻の群がるように続いて城内へ突入し、ついに賊軍を大いに撃破した。{{person:朱儁|朱儁}}がその活躍ぶりを詳細に皇帝へ上奏したため、{{person:孫堅|孫堅}}は{{office:司馬|別部司馬}}に任じられた。"}, {"id": "v46_p3_6", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 3, "type": "裴注", "raw_text": "《續漢書》曰：「儁字公偉，會稽人，少好學，爲郡功曹，察孝廉，舉進士。漢朝以討黃巾功拜車騎將軍，累遷河南尹。董卓見儁，外甚親納，而心忌之，儁亦陰備焉。關東兵起，卓議移都，儁輒止卓。卓雖憚儁，然貪其名重，乃表拜太僕以自副。儁被召不肯受拜，因進曰：「國不宜遷，必孤天下望，成山東之結，臣不見其可也。」有司詰曰：「召君受拜而君拒之，不問徙事而君陳之，何也？」儁曰：「副相國，非臣所堪也。遷都非計，臣之所急也。辭所不堪，進臣所急，臣之所宜也。」有司曰：「遷都之事，初無此計也，就有，未露，何所受聞？」儁曰：「相國董卓爲臣説之，臣聞之於相國。」有司不能屈，朝廷稱服焉。後爲太尉。李傕、郭汜相攻，劫質天子公卿，儁性剛，卽發病而卒。", "kakikudashi": "『続漢書』に曰く、「儁、字は公偉、会稽の人、少くして学を好み、郡の功曹と為り、孝廉に察せられ、進士に挙げらる。漢朝、黄巾を討つの功を以て車騎将軍に拝し、累遷して河南尹と為る。董卓、儁を見、外は甚だ親納するも、心に之を忌み、儁も亦た陰かに焉に備ふ。関東に兵起るや、卓、都を移さんと議するに、儁、輒ち卓を止む。卓、儁を憚ると雖も、然れども其の名重きを貪り、乃ち表して太僕に拝して以て自らの副とす。儁、召さるるも拝を受くるを肯んぜず、因りて進みて曰く、『国は宜しく遷すべからず、必ず天下の望みを孤き、山東の結びを成さん、臣、其の可なるを見ざるなり』と。有司、詰りて曰く、『君を召して拝を受けしむるに君之を拒み、徙事を問はざるに君之を陳ぶるは、何ぞや？』と。儁曰く、『相国に副たるは、臣の堪ふる所に非ざるなり。遷都は計に非ず、臣の急とする所なり。堪へざる所を辞し、臣の急とする所を進むるは、臣の宜しき所なり』と。有司曰く、『遷都の事は、初めより此の計無きなり、就ひ有るも、未だ露はれざるに、何の受聞する所ぞ？』と。儁曰く、『相国董卓、臣の為に之を説く、臣、之を相国に聞けり』と。有司、屈する能はず、朝廷、称服す。後に太尉と為る。李傕・郭汜、相ひ攻め、天子・公卿を劫質するや、儁、性剛なれば、即ち病を発して卒す」と。", "translation": "『続漢書』にいう。「朱儁、字は公偉は、会稽郡の人である。若い頃から学問を好み、郡の功曹となり、孝廉に推挙され、進士に挙げられた。漢の朝廷は黄巾討伐の功績によって車騎将軍に任じ、累進して河南尹となった。董卓は朱儁に会うと、表面上は大いに親しみ迎え入れたが、内心では彼を忌み憚り、朱儁もまたひそかに董卓を警戒した。関東で反董卓の義兵が起こると、董卓は長安への遷都を議論したが、朱儁はそのたびに董卓を押しとどめた。董卓は朱儁を煙たがっていたものの、その名声の重さを利用しようと考え、上表して朱儁を太僕に任じ、自らの副官（相国の副）にしようとした。朱儁は召し出されたが拝命を拒み、そこで進言して言った。『都を遷すべきではございません。遷都すれば必ず天下の信望を裏切り、山東の諸侯の結束を固めさせることになり、私にはそれが良い策とは思えません』。担当の役人（有司）が詰問して言った。『あなたを召し出して太僕の拝命を受けさせようとしているのにそれを拒み、遷都のことは尋ねていないのに意見を述べるとはどういうわけか？』。朱儁は言った。『相国の副官となることは、私の器量で堪えられるところではありません。一方、遷都が無謀な策であることは、私が国家の急務と考えるところです。堪えられない職を辞退し、急務と考えることを進言するのは、臣下として当然の務めでございます』。役人が『遷都の件は、そもそもそのような計画などないし、仮にあったとしてもまだ公表されていないのに、いったいどこから聞いたのか？』と問うと、朱儁は『相国の董卓殿が私に直接語られたのであり、私は相国ご自身から聞いたのです』と答えた。役人は言い負かすことができず、朝廷の人々はその毅然たる態度に感服した。のちに太尉となった。李傕と郭汜が互いに攻め合い、天子や公卿を人質に取って脅迫すると、気性が剛直であった朱儁は憤激のあまり病を発して死去した」。", "persons": "朱儁,董卓,李傕,郭汜", "places": "会稽,河南,関東", "era_year": "中平元年〜興平2年（184年〜195年）", "source_book": "続漢書", "keywords": "功曹,孝廉,進士,車騎将軍,河南尹,太僕,副,相国,太尉", "raw_tagged": "《{{special:引用史料|續漢書}}》曰：「{{person:朱儁|儁}}字{{person:朱儁|公偉}}，{{place:会稽|會稽}}人，少好學，爲郡{{office:功曹|功曹}}，察{{special:孝廉|孝廉}}，舉{{special:進士|進士}}。漢朝以討{{special:黄巾|黃巾}}功拜{{office:車騎将軍|車騎將軍}}，累遷{{place:河南|河南}}{{office:河南尹|尹}}。{{person:董卓|董卓}}見{{person:朱儁|儁}}，外甚親納，而心忌之，{{person:朱儁|儁}}亦陰備焉。{{place:関東|關東}}兵起，{{person:董卓|卓}}議移都，{{person:朱儁|儁}}輒止{{person:董卓|卓}}。{{person:董卓|卓}}雖憚{{person:朱儁|儁}}，然貪其名重，乃表拜{{office:太僕|太僕}}以自{{special:副|副}}。{{ {{person:朱儁|朱儁}}を煙たがっていたものの、その名声の重さを利用しようと考え、上表して{{person:朱儁|朱儁}}を{{office:太僕|太僕}}に任じ、自らの{{special:副|副官}}（{{office:相国|相国}}の{{special:副|副}}）にしようとした。{{person:朱儁|朱儁}}は召し出されたが拝命を拒み、そこで進言して言った。『都を遷すべきではございません。遷都すれば必ず天下の信望を裏切り、{{place:関東|山東}}の諸侯の結束を固めさせることになり、私にはそれが良い策とは思えません』。担当の役人（有司）が詰問して言った。『あなたを召し出して{{office:太僕|太僕}}の拝命を受けさせようとしているのにそれを拒み、遷都のことは尋ねていないのに意見を述べるとはどういうわけか？』。{{person:朱儁|朱儁}}は言った。『{{office:相国|相国}}の{{special:副|副官}}となることは、私の器量で堪えられるところではありません。一方、遷都が無謀な策であることは、私が国家の急務と考えるところです。堪えられない職を辞退し、急務と考えることを進言するのは、臣下として当然の務めでございます』。役人が『遷都の件は、そもそもそのような計画などないし、仮にあったとしてもまだ公表されていないのに、いったいどこから聞いたのか？』と問うと、{{person:朱儁|朱儁}}は『{{office:相国|相国}}の{{person:董卓|董卓}}殿が私に直接語られたのであり、私は{{office:相国|相国}}ご自身から聞いたのです』と答えた。役人は言い負かすことができず、朝廷の人々はその毅然たる態度に感服した。のちに{{office:太尉|太尉}}となった。{{person:李傕|李傕}}と{{person:郭汜|郭汜}}が互いに攻め合い、天子や公卿を人質に取って脅迫すると、気性が剛直であった{{person:朱儁|朱儁}}は憤激のあまり病を発して死去した」。"}, {"id": "v46_p4_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 4, "type": "本文", "raw_text": "邊章、韓遂作亂涼州，中郎將董卓拒討無功。中平三年，遣司空張溫行車騎將軍，西討章等。溫表請堅與參軍事，屯長安。溫以詔書召卓，卓良久乃詣溫。溫責讓卓，卓應對不順。堅時在坐，前耳語謂溫曰：「卓不怖罪而鴟張大語，宜以召不時至，陳軍法斬之。」溫曰：「卓素著威名於隴蜀之間，今日殺之，西行無依。」堅曰：「明公親率王兵，威震天下，何賴於卓？觀卓所言，不假明公，輕上無禮，一罪也。章遂跋扈經年，當以時進討，而卓云未可，沮軍疑衆，二罪也。卓受任無功，應召稽留，而軒昂自高，三罪也。古之名將，仗鉞臨衆，未有不斷斬以示威者也。是以穰苴斬莊賈，魏絳戮楊干。今明公垂意於卓，不卽加誅，虧損威刑。於是在矣。」溫不忍發舉，乃曰：「君且還，卓將疑人。」堅因起出。章遂聞大兵向至，黨衆離散，皆乞降。軍還，議者以軍未臨敵，不斷功賞。然聞堅數卓三罪，勸溫斬之，無不歎息。拜堅議郎。時長沙賊區星自稱將軍，衆萬餘人攻圍城邑，乃以堅爲長沙太守。到郡親率將士，施設方略，旬月之間，克破星等。", "kakikudashi": "辺章・韓遂、乱を涼州に作し、中郎将董卓、拒討するも功無し。中平三年、司空張温を遣はして車騎将軍を行し、西のかた章等を討たしむ。温、表して堅を請ひて与に軍事に参ぜしめ、長安に屯す。温、詔書を以て卓を召すに、卓、良や久しくして乃ち温に詣る。温、卓を責譲するに、卓、応対順ならず。堅、時に坐に在り、前みて耳語して温に謂ひて曰く、「卓、罪を怖れずして鴟張大語す、宜しく召すに時に至らざるを以て、軍法を陳べて之を斬るべし」と。温曰く、「卓、素より威名を隴・蜀の間に著す、今日之を殺さば、西行するに依る無からん」と。堅曰く、「明公、親ら王兵を率ゐ、威は天下に震ふ、何ぞ卓に頼らんや？卓の言ふ所を観るに、明公を仮さず、上を軽んじて礼無し、一罪なり。章・遂、跋扈して年を経れば、当に時を以て進討すべきに、卓は未だ可ならずと云ひ、軍を沮み衆を疑はしむ、二罪なり。卓、任を受けて功無く、召しに応じて稽留し、而も軒昂として自ら高ぶる、三罪なり。古の名将は、鉞を仗りて衆に臨むや、未だ断斬して以て威を示さざる者は有らざるなり。是を以て穰苴は荘賈を斬り、魏絳は楊干を戮す。今、明公、意を卓に垂れ、即ちに誅を加へざれば、威刑を虧損すること、是に於て在り」と。温、発挙するに忍びず、乃ち曰く、「君且く還れ、卓、将に人を疑はんとす」と。堅、因りて起ちて出づ。章・遂、大兵の向ひ至るを聞き、党衆離散し、皆降を乞ふ。軍還るに、議者、軍の未だ敵に臨まざるを以て、功賞を断ぜず。然れども堅が卓の三罪を数へ、温に之を斬るを勧めしを聞くや、歎息せざるは無し。堅を議郎に拝す。時に長沙の賊区星、自ら将軍と称し、衆万余人、城邑を攻囲すれば、乃ち堅を以て長沙太守と為す。郡に到るや親ら将士を率ゐ、方略を施設し、旬月の間に、星等を克破す。", "translation": "辺章と韓遂が涼州で反乱を起こし、中郎将の董卓が討伐にあたったが戦果を挙げられなかった。中平三年（186年）、朝廷は司空の張温を車騎将軍の職務代行（行車騎将軍）として派遣し、西方の辺章らを討伐させた。張温は上表して孫堅を招き、参軍事（軍事顧問）として長安に駐屯した。張温が詔書をもって董卓を召喚したところ、董卓はかなり日数が経ってからようやく張温のもとへ出頭した。張温が董卓を詰問すると、董卓の受け答えは不遜であった。その場に同席していた孫堅は、進み出て張温に耳打ちして言った。「董卓は罪を恐れもせず、ふくろうが羽を広げるように傲慢に大言壮語しております。召喚に対して期日通りに参上しなかった罪により、軍法に照らして斬首されるべきです」。張温は言った。「董卓は日頃から隴西・蜀の方面で威名を知られている。いま彼を殺してしまえば、西方へ進軍するにあたって頼りにする者がいなくなってしまう」。孫堅は言った。「明公（張温）は自ら官軍（王兵）を率いられ、その威勢は天下に轟いておりますのに、どうして董卓などを頼りにされましょうか？董卓の言動を見ますと、明公に対して敬意を払わず、上官を軽んじて無礼を働いており、これが第一の罪です。辺章と韓遂が何年にもわたって跋扈している以上、ただちに討伐を進めるべきでありますのに、董卓は『まだ進撃すべきではない』と唱えて軍の士気をくじき兵衆を動揺させており、これが第二の罪です。董卓は討伐の任を受けながら何の戦功も挙げず、召喚に対してもぐずぐずと遅参したあげく、尊大にふんぞり返っており、これが第三の罪です。古の名将が斧鉞を執って全軍に臨むにあたり、軍律違反者を処断して威厳を示さなかった者はおりません。それゆえ司馬穰苴は遅参した荘賈を斬り、魏絳は軍列を乱した楊干を処罰したのです。いま明公が董卓に遠慮してただちに処刑なさらなければ、軍の威厳と刑罰を損なうこと、これ以上のものはありません」。しかし張温はどうしても処断に踏み切れず、「君はひとまず席に戻りなさい、董卓が怪しむといけないから」と言ったため、孫堅は席を立って退出した。その後、辺章と韓遂は大軍が迫っていると聞くと仲間割れを起こし、みな降伏を願い出た。遠征軍が帰還した際、朝廷の評議では直接敵と交戦しなかったという理由で論功行賞は行われなかった。しかし人々は、孫堅が董卓の三つの罪を数え上げて張温に斬首を勧めた話を聞くと、感嘆しない者はなかった。孫堅は議郎に任じられた。ちょうどその頃、長沙の賊である区星が自ら将軍と称し、一万余人の軍勢で城邑を包囲攻撃していたため、朝廷は孫堅を長沙太守に任じた。孫堅は長沙郡に着任すると自ら将兵を率い、巧みな方略をめぐらして、わずか一か月足らずのうちに区星らを撃破した。", "persons": "辺章,韓遂,董卓,張温,孫堅,司馬穰苴,荘賈,魏絳,楊干,区星", "places": "涼州,長安,益州,長沙", "era_year": "中平3年〜4年（186年〜187年）", "source_book": "", "keywords": "中郎将,中平,司空,車騎将軍,参軍事,鴟張,議郎,太守", "raw_tagged": "{{person:辺章|邊章}}、{{person:韓遂|韓遂}}作亂{{place:涼州|涼州}}，{{office:中郎将|中郎將}}{{person:董卓|董卓}}拒討無功。{{special:中平|中平三年}}，遣{{office:司空|司空}}{{person:張温|張溫}}行{{office:車騎将軍|車騎將軍}}，西討章等。{{person:張温|溫}}表請{{person:孫堅|堅}}與{{office:参軍事|參軍事}}，屯{{place:長安|長安}}。{{person:張温|溫}}以詔書召{{person:董卓|卓}}，{{person:董卓|卓}}良久乃詣{{person:張温|溫}}。{{person:張温|溫}}責讓{{person:董卓|卓}}，{{person:董卓|卓}}應對不順。{{person:孫堅|堅}}時在坐，前耳語謂{{person:張温|溫}}曰：「{{person:董卓|卓}}不怖罪而{{special:鴟張|鴟張大語}}，宜以召不時至，陳軍法斬之。」{{person:張温|溫}}曰：「{ 郭石|郭石}}も亦た徒衆を帥ゐて{{place:零陵|零}}・{{place:桂陽|桂}}に起り、{{person:区星|星}}と相ひ応ず。遂に境を越えて尋討し、三郡粛然たり。漢朝、前後の功を録し、{{person:孫堅|堅}}を封じて{{place:烏程|烏程}}{{office:列侯|侯}}と為す。", "translation_tagged": "また{{person:周朝|周朝}}と{{person:郭石|郭石}}も徒党を率いて{{place:零陵|零陵}}郡・{{place:桂陽|桂陽}}郡で蜂起し、{{person:区星|区星}}に呼応していた。そこで{{person:孫堅|孫堅}}は長沙郡の境を越えて彼らを追討し、長沙・{{place:零陵|零陵}}・{{place:桂陽|桂陽}}の三郡はすっかり平穏を取り戻した。漢の朝廷はこれまでの前後の功績を評価し、{{person:孫堅|孫堅}}を{{place:烏程|烏程}}{{office:列侯|侯}}に封じた。"}, {"id": "v46_p4_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 4, "type": "裴注", "raw_text": "《吳錄》曰：「是時廬江太守陸康從子作宜春長，爲賊所攻，遣使求救於堅。堅整嚴救之。主簿進諫，堅答曰：『太守無文德，以征伐爲功，越界攻討，以全異國。以此獲罪，何愧海內乎？』」乃進兵往救，賊聞而走。」", "kakikudashi": "『呉録』に曰く、「是の時、廬江太守陸康の従子、宜春長と作り、賊の攻むる所と為り、使ひを遣はして救ひを堅に求む。堅、整厳して之を救はんとす。主簿、進み諫むるに、堅、答へて曰く、『太守に文徳無く、征伐を以て功と為す、界を越えて攻討し、以て異国を全うす。此を以て罪を獲るも、何ぞ海内に愧ぢんや？』と。乃ち兵を進めて往きて救へば、賊、聞きて走る」と。", "translation": "『呉録』にいう。「この時、廬江太守の陸康の甥（従子）が豫章郡の宜春県長を務めていたが、賊軍に攻められ、使者を遣わして孫堅に救援を求めてきた。孫堅は軍備を整えて救援に向かおうとした。主簿が進み出て（管轄の郡境を越えることは法に触れると）諫めたが、孫堅は答えて言った。『太守である私には文徳がなく、征伐によって功を立てるほかない。管轄の境を越えて賊を討ち、隣の郡県（異国）を救い全うするのだ。これによって罪を得ることになろうとも、天下（海内）に対して何ら恥じることがあろうか？』。かくて軍を進めて救援に赴くと、賊はそれを聞いただけで逃走した」。", "persons": "陸康,孫堅", "places": "廬江,宜春", "era_year": "中平4年（187年）", "source_book": "呉録", "keywords": "太守,県長,主簿,海内", "raw_tagged": "《{{special:引用史料|吳錄}}》曰：「是時{{place:廬江|廬江}}{{office:太守|太守}}{{person:陸康|陸康}}從子作{{place:宜春|宜春}}{{office:県長|長}}，爲賊所攻，遣使求救於{{person:孫堅|堅}}。{{person:孫堅|堅}}整嚴救之。{{office:主簿|主簿}}進諫，{{person:孫堅|堅}}答曰：『{{office:太守|太守}}無文德，以征伐爲功，越界攻討，以全異國。以此獲罪，何愧海內乎？』」乃進兵往救，賊聞而走。」", "kakikudashi_tagged": "『{{special:引用史料|呉録}}』に曰く、「是の時、{{place:廬江|廬江}}{{office:太守|太守}}{{person:陸康|陸康}}の従子、{{place:宜春|宜春}}{{office:県長|長}}と作り、賊の攻むる所と為り、使ひを遣はして救ひを{{person:孫堅|堅}}に求む。{{person:孫堅|堅}}、整厳して之を救はんとす。{{office:主簿|主簿}}、進み諫むるに、{{person:孫堅|堅}}、答へて曰く、『{{office:太守|太守}}に文徳無く、征伐を以て功と為す、界を越えて攻討し、以て異国を全うす。此を以て罪を獲るも、何ぞ海内に愧ぢんや？』と。乃ち兵を進めて往きて救へば、賊、聞きて走る」と。", "translation_tagged": "『{{special:引用史料|呉録}}』にいう。「この時、{{place:廬江|廬江}}{{office:太守|太守}}の{{person:陸康|陸康}}の甥（従子）が豫章郡の{{place:宜春|宜春}}{{office:県長|県長}}を務めていたが、賊軍に攻められ、使者を遣わして{{person:孫堅|孫堅}}に救援を求めてきた。{{person:孫堅|孫堅}}は軍備を整えて救援に向かおうとした。{{office:主簿|主簿}}が進み出て（管轄の郡境を越えることは法に触れると）諫めたが、{{person:孫堅|孫堅}}は答えて言った。『{{office:太守|太守}}である私には文徳がなく、征伐によって功を立てるほかない。管轄の境を越えて賊を討ち、隣の郡県（異国）を救い全うするのだ。これによって罪を得ることになろうとも、天下（海内）に対して何ら恥じることがあろうか？』。かくて軍を進めて救援に赴くと、賊はそれを聞いただけで逃走した」。"}, {"id": "v46_p5_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 5, "type": "本文", "raw_text": "靈帝崩，卓擅朝政，橫恣京城。諸州郡並興義兵，欲以討卓。", "kakikudashi": "霊帝崩じ、卓、朝政を擅にし、京城に横恣す。諸州郡、並びに義兵を興し、以て卓を討たんと欲す。", "translation": "霊帝が崩御すると、董卓が朝政をほしいままにし、帝都（洛陽）で横暴を極めた。そこで各地の州郡はこぞって義兵を起こし、董卓を討伐しようとした。", "persons": "霊帝,董卓", "places": "洛陽", "era_year": "中平6年〜初平元年（189年〜190年）", "source_book": "", "keywords": "義兵", "raw_tagged": "{{person:霊帝|靈帝}}崩，{{person:董卓|卓}}擅朝政，橫恣{{place:洛陽|京城}}。諸州郡並興{{special:義兵|義兵}}，欲以討{{person:董卓|卓}}。", "kakikudashi_tagged": "{{person:霊帝|霊帝}}崩じ、{{person:董卓|卓}}、朝政を擅にし、{{place:洛陽|京城}}に横恣す。諸州郡、並びに{{special:義兵|義兵}}を興し、以て{{person:董卓|卓}}を討たんと欲す。", "translation_tagged": "{{person:霊帝|霊帝}}が崩御すると、{{person:董卓|董卓}}が朝政をほしいままにし、帝都（{{place:洛陽|洛陽}}）で横暴を極めた。そこで各地の州郡はこぞって{{special:義兵|義兵}}を起こし、{{person:董卓|董卓}}を討伐しようとした。"}, {"id": "v46_p5_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 5, "type": "裴注", "raw_text": "《江表傳》曰：「堅聞之，拊膺嘆曰：『張公昔從吾言，朝廷今無此難也。』」", "kakikudashi": "『江表伝』に曰く、「堅、之を聞き、膺を拊ちて嘆じて曰く、『張公、昔、吾が言に従はば、朝廷に今此の難無きなり』と」と。", "translation": "『江表伝』にいう。「孫堅はこれを聞くと、胸を叩いて嘆息して言った。『張公（張温）があの時、私の進言に従っておられたなら、朝廷がいまこのような災難に遭うことはなかったのだ』」。", "persons": "孫堅,張温", "places": "", "era_year": "初平元年（190年）", "source_book": "江表伝", "keywords": "", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫堅|堅}}聞之，拊膺嘆曰：『{{person:張温|張公}}昔從吾言，朝廷今無此難也。』」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に曰く、「{{person:孫堅|堅}}、之を聞き、膺を拊ちて嘆じて曰く、『{{person:張温|張公}}、昔、吾が言に従はば、朝廷に今此の難無きなり』と」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「{{person:孫堅|孫堅}}はこれを聞くと、胸を叩いて嘆息して言った。『{{person:張温|張公}}（{{person:張温|張温}}）があの時、私の進言に従っておられたなら、朝廷がいまこのような災難に遭うことはなかったのだ』」。"}, {"id": "v46_p5_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 5, "type": "本文", "raw_text": "堅亦舉兵。荊州刺史王叡素遇堅無禮，堅過殺之。", "kakikudashi": "堅も亦た兵を挙ぐ。荊州刺史王叡、素より堅を遇すること礼無く、堅、過ぎて之を殺す。", "translation": "孫堅もまた挙兵した。荊州刺史の王叡は日頃から孫堅に対する扱いが無礼であったため、孫堅は立ち寄って王叡を殺害した。", "persons": "孫堅,王叡", "places": "荊州", "era_year": "初平元年（190年）", "source_book": "", "keywords": "刺史", "raw_tagged": "{{person:孫堅|堅}}亦舉兵。{{place:荊州|荊州}}{{office:刺史|刺史}}{{person:王叡|王叡}}素遇{{person:孫堅|堅}}無禮，{{person:孫堅|堅}}過殺之。", "kakikudashi_tagged": "{{person:孫堅|堅}}も亦た兵を挙ぐ。{{place:荊州|荊州}}{{office:刺史|刺史}}{{person:王叡|王叡}}、素より{{person:孫堅|堅}}を遇すること礼無く、{{person:孫堅|堅}}、過ぎて之を殺す。", "translation_tagged": "{{person:孫堅|孫堅}}もまた挙兵した。{{place:荊州|荊州}}{{office:刺史|刺史}}の{{person:王叡|王叡}}は日頃から{{person:孫堅|孫堅}}に対する扱いが無礼であったため、{{person:孫堅|孫堅}}は立ち寄って{{person:王叡|王叡}}を殺害した。"}, {"id": "v46_p5_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 5, "type": "裴注", "raw_text": "案《王氏譜》，叡字通耀，晉太保祥伯父也。《吳錄》曰：「叡先與堅共擊零桂賊，以堅武官，言頗輕之。及叡舉兵欲討卓，素與武陵太守曹寅不相能，楊言當先殺寅。寅懼，詐作案行使者光祿大夫温毅檄，移堅，説叡罪過，令收行刑訖，以狀上。堅卽承檄勒兵襲叡。叡聞兵至，登樓望之，遣問欲何爲，堅前部答曰：『兵久戰勞苦，所得賞，不足以爲衣服，詣使君更乞資直耳。』叡曰：『刺史豈有所吝？』便開庫藏，使自入視之，知有所遺不。兵進及樓下，叡見堅，驚曰：『兵自求賞，孫府君何以在其中？』堅曰：『被使者檄誅君。』叡曰：『我何罪？』堅曰：『坐無所知。』叡窮迫，刮金飲之而死。」", "kakikudashi": "『王氏譜』を案ずるに、叡、字は通耀、晋の太保祥の伯父なり。『呉録』に曰く、「叡、先に堅と共に零・桂の賊を撃ちしとき、堅が武官たるを以て、言、頗る之を軽んず。叡が兵を挙げて卓を討たんと欲するに及び、素より武陵太守曹寅と相ひ能からず、当に先づ寅を殺すべしと揚言す。寅、懼れ、詐りて案行使者光禄大夫温毅の檄を作り、堅に移し、叡の罪過を説き、収めて刑を行ひ訖らば、状を以て上らしむ。堅、即ち檄を承けて兵を勒して叡を襲ふ。叡、兵の至るを聞き、楼に登りて之を望み、遣はして何をか為さんと欲するかを問はしむるに、堅の前部答へて曰く、『兵、久しく戦ひて労苦するも、得る所の賞、以て衣服を為るに足らず、使君に詣りて更に資直を乞ふのみ』と。叡曰く、『刺史、豈に吝しむ所有らんや？』と。便ち庫蔵を開き、自ら入りて之を視て、遺す所有るや不やを知らしむ。兵進みて楼下に及ぶや、叡、堅を見、驚きて曰く、『兵自ら賞を求むるに、孫府君、何を以てか其の中に在る？』と。堅曰く、『使者の檄を被りて君を誅す』と。叡曰く、『我に何の罪かある？』と。堅曰く、『知る所無きに坐す』と。叡、窮迫し、金を刮りて之を飲みて死す」と。", "translation": "『王氏譜』を調べてみると、王叡、字は通耀は、西晋の太保・王祥の伯父である。『呉録』にいう。「王叡は以前、孫堅とともに零陵・桂陽の賊を討伐した際、孫堅が武官出身の成り上がりであることから、言葉の端々で彼をひどく見下していた。やがて王叡が董卓討伐のために挙兵しようとしたとき、日頃から武陵太守の曹寅と仲が悪かったため、『まず曹寅を殺してやる』と公言した。曹寅は恐れ、朝廷の案行使者・光禄大夫の温毅の名を騙った偽の檄文を作成して孫堅へ送り、王叡の罪状を並べ立て、王叡を捕らえて処刑したうえで顛末を上奏するよう命じた。孫堅はただちにその檄文を奉じて軍勢を整え、王叡を急襲した。王叡は兵がやって来たと聞くと、物見櫓に登って眺め、使者を出して何の用かと尋ねさせた。孫堅の先鋒部隊は答えて言った。『兵士たちは長らく戦って労苦しておりますのに、与えられた恩賞では衣服を調えるにも足りません。そこで使君（王叡）のもとに参上し、さらなる軍資を請い願うだけでございます』。王叡は『刺史である私がどうして物を惜しんだりしようか？』と言い、ただちに倉庫を開けさせ、兵士たちが自分で中に入って見て、残っている物があるかどうか確かめさせた。そのまま兵が進んで櫓の下まで迫ったとき、王叡は軍中に孫堅がいるのを見つけて驚き、『兵士たちが恩賞を求めているだけなのに、なぜ孫府君（孫堅太守）がその中におられるのか？』と尋ねた。孫堅は『朝廷の使者の檄文を奉じて貴殿を誅殺するのだ』と言った。王叡が『私に何の罪があるというのか？』と問うと、孫堅は『罪は『何も分かっていないこと（坐無所知）』にある！』と突き放した。王叡は追い詰められ、金を削った粉を飲んで自殺した」。", "persons": "王叡,王祥,孫堅,曹寅,温毅", "places": "零陵,桂陽,武陵", "era_year": "初平元年（190年）", "source_book": "王氏譜,呉録", "keywords": "太保,太守,光禄大夫,使君,刺史,府君,坐無所知", "raw_tagged": "案《{{special:引用史料|王氏譜}}》，{{person:王叡|叡}}字{{person:王叡|通耀}}，晉{{office:太保|太保}}{{person:王祥|祥}}伯父也。《{{special:引用史料|吳錄}}》曰：「{{person:王叡|叡}}先與{{person:孫堅|堅}}共擊{{place:零陵|零}}{{place:桂陽|桂}}賊，以{{person:孫堅|堅}}武官，言頗輕之。及{{person:王叡|叡}}舉兵欲討卓，素與{{place:武陵|武陵}}{{office:太守|太守}}{{person:曹寅|曹寅}}不相能，楊言當先殺{{person:曹寅|寅}}。{{person:曹寅|寅}}懼，詐作案行使者光祿大夫{{person:温毅|温毅}}檄，移{{person:孫堅|堅}}，説{{person:王叡|叡}}罪過，令收行刑訖，以狀上。{{person:孫堅|堅}}卽承檄勒兵襲{{person:王叡|叡}}。{{person:王叡|叡}}聞兵至，登樓望之，遣問欲何爲，{{person:孫堅|堅}}前部答曰：『兵久戰勞苦，所得賞，不足以爲衣服，詣{{special:使君|使君}}更乞資直耳。』{{person:王叡|叡}}曰：『{{office:刺史|刺史}}豈有所吝？』便開庫藏，使自入視之，知有所遺不。兵進及樓下，{{person:王叡|叡}}見{{person:孫堅|堅}}，驚曰：『兵自求賞，{{person:孫堅|孫府君}}何以在其中？』{{person:孫堅|堅}}曰：『被使者檄誅君。』{{person:王叡|叡}}曰：『我何罪？』{{person:孫堅|堅}}曰：『{{special:坐無所知|坐無所知}}。』{{person:王叡|叡}}窮迫，刮金飲之而死。」", "kakikudashi_tagged": "『{{special:引用史料|王氏譜}}』を案ずるに、{{person:王叡|叡}}、字は{{person:王叡|通耀}}、晋の{{office:太保|太保}}{{person:王祥|祥}}の伯父なり。『{{special:引用史料|呉録}}』に曰く、「{{person:王叡|叡}}、先に{{person:孫堅|堅}}と共に{{place:零陵|零}}・{{place:桂陽|桂}}の賊を撃ちしとき、{{person:孫堅|堅}}が武官たるを以て、言、頗る之を軽んず。{{person:王叡|叡}}が兵を挙げて卓を討たんと欲するに及び、素より{{place:武陵|武陵}}{{office:太守|太守}}{{person:曹寅|曹寅}}と相ひ能からず、当に先づ{{person:曹寅|寅}}を殺すべしと揚言す。{{person:曹寅|寅}}、懼れ、詐りて案行使者{{office:光禄大夫|光禄大夫}}{{person:温毅|温毅}}の檄を作り、{{person:孫堅|堅}}に移し、{{person:王叡|叡}}の罪過を説き、収めて刑を行ひ訖らば、状を以て上らしむ。{{person:孫堅|堅}}、即ち檄を承けて兵を勒して{{person:王叡|叡}}を襲ふ。{{person:王叡|叡}}、兵の至るを聞き、楼に登りて之を望み、遣はして何をか為 守の張咨は、孫堅の軍が到着したと聞いても、泰然自若として何の動きも見せなかった。", "persons": "孫堅,張咨", "places": "南陽", "era_year": "初平元年（190年）", "source_book": "", "keywords": "太守", "raw_tagged": "比至{{place:南陽|南陽}}，衆數萬人。{{place:南陽|南陽}}{{office:太守|太守}}{{person:張咨|張咨}}聞軍至，晏然自若。", "kakikudashi_tagged": "{{place:南陽|南陽}}に至る比ひ、衆数万人なり。{{place:南陽|南陽}}{{office:太守|太守}}{{person:張咨|張咨}}、軍の至るを聞くも、晏然として自若たり。", "translation_tagged": "{{place:南陽|南陽}}郡に到着する頃には、{{person:孫堅|孫堅}}の軍勢は数万人に達していた。しかし{{place:南陽|南陽}}{{office:太守|太守}}の{{person:張咨|張咨}}は、{{person:孫堅|孫堅}}の軍が到着したと聞いても、泰然自若として何の動きも見せなかった。"}, {"id": "v46_p5_6", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 5, "type": "裴注", "raw_text": "《英雄記》曰：「咨字子議，潁川人，亦知名。」《獻帝春秋》曰：「袁術表堅假中郎將。堅到南陽，移檄太守請軍糧。咨以問綱紀，綱紀曰：「堅鄰郡二千石，不應調發。」咨遂不與。」", "kakikudashi": "『英雄記』に曰く、「咨、字は子議、潁川の人、亦た名を知らる」と。『献帝春秋』に曰く、「袁術、堅を表して仮中郎将とす。堅、南陽に到り、檄を太守に移して軍糧を請ふ。咨、以て綱紀に問ふに、綱紀曰く、『堅は隣郡の二千石なれば、調発に応ずべからず』と。咨、遂に与へず」と。", "translation": "『英雄記』にいう。「張咨、字は子議は、潁川郡の人であり、彼もまた名の知られた人物であった」。『献帝春秋』にいう。「袁術は上表して孫堅を仮中郎将とした。孫堅は南陽に到着すると、太守の張咨に檄文を送って兵糧の提供を要請した。張咨が郡の幹部幕僚（綱紀）に相談したところ、幕僚は『孫堅は隣の郡（長沙郡）の太守（二千石）にすぎませんから、徴発に応じる必要はありません』と答えたため、張咨はついに兵糧を与えなかった」。", "persons": "張咨,袁術,孫堅", "places": "潁川,南陽", "era_year": "初平元年（190年）", "source_book": "英雄記,献帝春秋", "keywords": "中郎将,太守,綱紀,二千石", "raw_tagged": "《{{special:引用史料|英雄記}}》曰：「{{person:張咨|咨}}字{{person:張咨|子議}}，{{place:潁川|潁川}}人，亦知名。」《{{special:引用史料|獻帝春秋}}》曰：「{{person:袁術|袁術}}表{{person:孫堅|堅}}{{office:中郎将|假中郎將}}。{{person:孫堅|堅}}到{{place:南陽|南陽}}，移檄{{office:太守|太守}}請軍糧。{{person:張咨|咨}}以問{{special:綱紀|綱紀}}，{{special:綱紀|綱紀}}曰：「{{person:孫堅|堅}}鄰郡{{office:太守|二千石}}，不應調發。」{{person:張咨|咨}}遂不與。」", "kakikudashi_tagged": "『{{special:引用史料|英雄記}}』に曰く、「{{person:張咨|咨}}、字は{{person:張咨|子議}}、{{place:潁川|潁川}}の人、亦た名を知らる」と。『{{special:引用史料|献帝春秋}}』に曰く、「{{person:袁術|袁術}}、{{person:孫堅|堅}}を表して{{office:中郎将|仮中郎将}}とす。{{person:孫堅|堅}}、{{place:南陽|南陽}}に到り、檄を{{office:太守|太守}}に移して軍糧を請ふ。{{person:張咨|咨}}、以て{{special:綱紀|綱紀}}に問ふに、{{special:綱紀|綱紀}}曰く、『{{person:孫堅|堅}}は隣郡の{{office:太守|二千石}}なれば、調発に応ずべからず』と。{{person:張咨|咨}}、遂に与へず」と。", "translation_tagged": "『{{special:引用史料|英雄記}}』にいう。「{{person:張咨|張咨}}、字は{{person:張咨|子議}}は、{{place:潁川|潁川}}郡の人であり、彼もまた名の知られた人物であった」。『{{special:引用史料|献帝春秋}}』にいう。「{{person:袁術|袁術}}は上表して{{person:孫堅|孫堅}}を{{office:中郎将|仮中郎将}}とした。{{person:孫堅|孫堅}}は{{place:南陽|南陽}}に到着すると、{{office:太守|太守}}の{{person:張咨|張咨}}に檄文を送って兵糧の提供を要請した。{{person:張咨|張咨}}が郡の幹部幕僚（{{special:綱紀|綱紀}}）に相談したところ、幕僚は『{{person:孫堅|孫堅}}は隣の郡（長沙郡）の{{office:太守|太守}}（{{office:太守|二千石}}）にすぎませんから、徴発に応じる必要はありません』と答えたため、{{person:張咨|張咨}}はついに兵糧を与えなかった」。"}, {"id": "v46_p5_7", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 5, "type": "本文", "raw_text": "堅以牛酒禮咨，咨明日亦答詣堅。酒酣，長沙主簿入白堅：「前移南陽，而道路不治，軍資不具，請收主簿推問意故。」咨大懼欲去，兵陳四周不得出。有頃，主簿復入白堅：「南陽太守稽停義兵，使賊不時討，請收出案軍法從事。」便牽咨於軍門斬之。郡中震慄，無求不獲。", "kakikudashi": "堅、牛酒を以て咨を礼すれば、咨、明日亦た答へて堅に詣る。酒酣なるや、長沙の主簿、入りて堅に白すらく、「前に南陽に移するに、道路治まらず、軍資具はらず、請ふ主簿を収めて意故を推問せん」と。咨、大いに懼れて去らんと欲するも、兵、四周に陳して出づるを得ず。頃く有りて、主簿、復た入りて堅に白すらく、「南陽太守、義兵を稽停し、賊をして時に討たれざらしむ、請ふ収め出だして軍法を案じて事に従はん」と。便ち咨を軍門に牽きて之を斬る。郡中震慄し、求むるとして獲ざるは無し。", "translation": "そこで孫堅が牛肉と酒を贈って張咨を手厚く礼遇したところ、翌日、張咨も答礼として孫堅の陣営を訪れた。酒宴がたけなわとなったとき、長沙郡の主簿が入ってきて孫堅に申し上げた。「先だって南陽郡へ通達を出しましたのに、道路は整備されず、軍需物資も準備されておりません。どうか南陽の主簿を捕らえてその理由を取り調べさせてください」。張咨は大いに恐れて立ち去ろうとしたが、すでに兵士が四方をぐるりと取り囲んでいて出ることができなかった。しばらくして、主簿が再び入ってきて孫堅に申し上げた。「南陽太守は義兵の進軍を滞らせ、逆賊（董卓）を速やかに討伐できないようにしております。どうか引き出して軍法に照らして処断させてください」。こうしてただちに張咨を軍門へ引き出して斬首した。南陽郡の人々は恐怖に震え上がり、孫堅が求める物資で手に入らないものはなくなった。", "persons": "孫堅,張咨", "places": "長沙,南陽", "era_year": "初平元年（190年）", "source_book": "", "keywords": "主簿,太守,義兵", "raw_tagged": "{{person:孫堅|堅}}以牛酒禮{{person:張咨|咨}}，{{person:張咨|咨}}明日亦答詣{{person:孫堅|堅}}。酒酣，{{place:長沙|長沙}}{{office:主簿|主簿}}入白{{person:孫堅|堅}}：「前移{{place:南陽|南陽}}，而道路不治，軍資不具，請收{{office:主簿|主簿}}推問意故。」{{person:張咨|咨}}大懼欲去，兵陳四周不得出。有頃，{{office:主簿|主簿}}復入白{{person:孫堅|堅}}：「{{place:南陽|南陽}}{{office:太守|太守}}稽停{{special:義兵|義兵}}，使賊不時討，請收出案軍法從事。」便牽{{person:張咨|咨}}於軍門斬之。郡中震慄，無求不獲。", "kakikudashi_tagged": "{{person:孫堅|堅}}、牛酒を以て{{person:張咨|咨}}を礼すれば、{{person:張咨|咨}}、明日亦た答へて{{person:孫堅|堅}}に詣る。酒酣なるや、{{place:長沙|長沙}}の{{office:主簿|主簿}}、入りて{{person:孫堅|堅}}に白すらく、「前に{{place:南陽|南陽}}に移するに、道路治まらず、軍資具はらず、請ふ{{office:主簿|主簿}}を収めて意故を推問せん」と。{{person:張咨|咨}}、大いに懼れて去らんと欲するも、兵、四周に陳して出づるを得ず。頃く有りて、{{office:主簿|主簿}}、復た入りて{{person:孫堅|堅}}に白すらく、「{{place:南陽|南陽}}{{office:太守|太守}}、{{special:義兵|義兵}}を稽停し、賊をして時に討たれざらしむ、請ふ収め出だして軍法を案じて事に従はん」と。便ち{{person:張咨|咨}}を軍門に牽きて之を斬る。郡中震慄し、求むるとして獲ざるは無し。", "translation_tagged": "そこで{{person:孫堅|孫堅}}が牛肉と酒を贈って{{person:張咨|張咨}}を手厚く礼遇したところ、翌日、{{person:張咨|張咨}}も答礼として{{person:孫堅|孫堅}}の陣営を訪れた。酒宴がたけなわとなったとき、{{place:長沙|長沙}}郡の{{office:主簿|主簿}}が入ってきて{{person:孫堅|孫堅}}に申し上げた。「先だって{{place:南陽|南陽}}郡へ通達を出しましたのに、道路は整備されず、軍需物資も準備されておりません。どうか{{place:南陽|南陽}}の{{office:主簿|主簿}}を捕らえてその理由を取り調べさせてください」。{{person:張咨|張咨}}は大いに恐れて立ち去ろうとしたが、すでに兵士が四方をぐるりと取り囲んでいて出ることができなかった。しばらくして、{{office:主簿|主簿}}が再び入ってきて{{person:孫堅|孫堅}}に申し上げた。「{{place:南陽|南陽}}{{office:太守|太守}}は{{special:義兵|義兵}}の進軍を滞らせ、逆賊（董卓）を速やかに討伐できないようにしております。どうか引き出して軍法に照らして処断させてください」。こうしてただちに{{person:張咨|張咨}}を軍門へ引き出して斬首した。{{place:南陽|南陽}}郡の人々は恐怖に震え上がり、{{person:孫堅|孫堅}}が求める物資で手に入らないものはなくなった。"}, {"id": "v46_p5_8", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 5, "type": "裴注", "raw_text": "《吳歷》曰：「初堅至南陽，咨旣不給軍糧，又不肯見堅。堅欲進兵，恐有後患，乃詐得急疾，舉軍震惶，迎呼巫醫，禱祀山川。遣所親人説咨，言病困，欲以兵付咨。咨聞之，心利其兵，卽將步騎五六百人詣營省堅。堅臥與相見。無何，卒然而起，按劍駡咨，遂執斬之。」此語與本傳不同。", "kakikudashi": "『呉歴』に曰く、「初め堅の南陽に至るや、咨、既に軍糧を給せず、又堅に見ゆるを肯んぜず。堅、兵を進めんと欲するも、後患有るを恐れ、乃ち詐りて急疾を得、挙軍震惶し、巫医を迎へ呼び、山川に禱祀す。親しむ所の人を遣はして咨に説かしめ、病困しめば、兵を以て咨に付さんと欲すと言ふ。咨、之を聞き、心に其の兵を利とし、即ち歩騎五六百人を将ゐて営に詣りて堅を省みる。堅、臥して与に相ひ見ゆ。何くも無く、卒然として起ち、剣を按じて咨を罵り、遂に執へて之を斬る」と。此の語、本伝と同じからず。", "translation": "『呉歴』にいう。「当初、孫堅が南陽に到着したとき、張咨は兵糧を支給しなかったばかりか、孫堅との面会すら拒んだ。孫堅は進軍しようとしたが、背後に憂いが残ることを恐れ、そこで急病にかかったふりをし、全軍が慌てふためいて巫女や医師を呼び迎え、山川に平癒の祈禱を行った。そして腹心の者を張咨のもとへ遣わし、『重病で危篤となったため、自分の軍勢を張咨殿に託したい』と伝えさせた。張咨はこれを聞くと、その兵力を手に入れられることに目がくらみ、ただちに歩兵・騎兵五、六百人を率いて陣営へ赴き、孫堅を見舞った。孫堅は寝台に横たわったまま張咨と対面したが、まもなくガバと跳ね起き、剣に手をかけて張咨を罵倒し、そのまま捕らえて斬首した」。この記述は本伝の内容と異なっている。", "persons": "孫堅,張咨", "places": "南陽", "era_year": "初平元年（190年）", "source_book": "呉歴", "keywords": "", "raw_tagged": "《{{special:引用史料|吳歷}}》曰：「初{{person:孫堅|堅}}至{{place:南陽|南陽}}，{{person:張咨|咨}}旣不給軍糧，又不肯見{{person:孫堅|堅}}。{{person:孫堅|堅}}欲進兵，恐有後患，乃詐得急疾，舉軍震惶，迎呼巫醫，禱祀山川。遣所親人説{{person:張咨|咨}}，言病困，欲以兵付{{person:張咨|咨}}。{{person:張咨|咨}}聞之，心利其兵，卽將步騎五六百人詣營省{{person:孫堅|堅}}。{{person:孫堅|堅}}臥與相見。無何，卒然而起，按劍駡{{person:張咨|咨}}，遂執斬之。」此語與本傳不同。", "kakikudashi_tagged": "『{{special:引用史料|呉歴}}』に曰く、「初め{{person:孫堅|堅}}の{{place:南陽|南陽}}に至るや、{{person:張咨|咨}}、既に軍糧を給せず、又{{person:孫堅|堅}}に見ゆるを肯んぜず。{{person:孫堅|堅}}、兵を進めんと欲するも、後患有るを恐れ、乃ち詐りて急疾を得、挙軍震惶し、巫医を迎へ呼び、山川に禱祀す。親しむ所の人を遣はして{{person:張咨|咨}}に説かしめ、病困しめば、兵を以て{{person:張咨|咨}}に付さんと欲すと言ふ。{{person:張咨|咨}}、之を聞き、心に其の兵を利とし、即ち歩騎五六百人を将ゐて営に詣りて{{person:孫堅|堅}}を省みる。{{person:孫堅|堅}}、臥して与に相ひ見ゆ。何くも無く、卒然として起ち、剣を按じて{{person:張咨|咨}}を罵り、遂に執へて之を斬る」と。此の語、本伝と同じからず。", "translation_tagged": "『{{special:引用史料|呉歴}}』にいう。「当初、{{person:孫堅|孫堅}}が{{place:南陽|南陽}}に到着したとき、{{person:張咨|張咨}}は兵糧を支給しなかったばかりか、{{person:孫堅|孫堅}}との面会すら拒んだ。{{person:孫堅|孫堅}}は進軍しようとしたが、背後に憂いが残ることを恐れ、そこで急病にかかったふりをし、全軍が慌てふためいて巫女や医師を呼び迎え、山川に平癒の祈禱を行った。そして腹心の者を{{person:張咨|張咨}}のもとへ遣わし、『重病で危篤となったため、自分の軍勢を{{person:張咨|張咨}}殿に託したい』と伝えさせた。{{person:張咨|張咨}}はこれを聞くと、その兵力を手に入れられることに目がくらみ、ただちに歩兵・騎兵五、六百人を率いて陣営へ赴き、{{person:孫堅|孫堅}}を見舞った。{{person:孫堅|孫堅}}は寝台に横たわったまま{{person:張咨|張咨}}と対面したが、まもなくガバと跳ね起き、剣に手をかけて{{person:張咨|張咨}}を罵倒し、そのまま捕らえて斬首した」。この記述は本伝の内容と異なっている。"}, {"id": "v46_p6_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "本文", "raw_text": "前到魯陽，與袁術相見。術表堅行破虜將軍，領豫州刺史。遂治兵於魯陽城。當進軍討卓，遣長史公仇稱將兵從事還州督促軍糧。施帳幔於城東門外，祖道送稱，官屬並會。卓遣步騎數萬人逆堅，輕騎數十先到。堅方行酒談笑，敕部曲整頓行陳，無得妄動。後騎漸益，堅徐罷坐，導引入城。乃謂左右曰：「向堅所以不卽起者，恐兵相蹈藉，諸君不得入耳。」卓兵見堅士衆甚整，不敢攻城，乃引還。", "kakikudashi": "前みて魯陽に到り、袁術と相ひ見ゆ。術、堅を表して破虜将軍を行し、豫州刺史を領せしむ。遂に兵を魯陽城に治む。当に軍を進めて卓を討たんとし、長史公仇称を遣はし兵を将ゐて事に従ひ州に還りて軍糧を督促せしむ。帳幔を城の東門の外に施し、祖道して称を送り、官属並びに会す。卓、歩騎数万人を遣はして堅を逆へしめ、軽騎数十、先づ到る。堅、方に酒を行らして談笑し、部曲に敕して行陳を整頓せしめ、妄りに動くを得る無からしむ。後騎漸く益すや、堅、徐ろに坐を罷め、導引して城に入る。乃ち左右に謂ひて曰く、「向に堅が即ちには起たざりし所以の者は、兵の相ひ蹈藉して、諸君の入るを得ざらんことを恐れしのみ」と。卓の兵、堅の士衆の甚だ整へるを見、敢へて城を攻めず、乃ち引き還る。", "translation": "孫堅は進んで魯陽へ到着し、袁術と会見した。袁術は上表して孫堅を破虜将軍の職務代行（行破虜将軍）とし、豫州刺史を兼領させた。こうして孫堅は魯陽城で軍備を整えた。いよいよ軍を進めて董卓を討伐することになり、長史の公仇称に兵を率いて豫州へ戻らせ、兵糧の輸送を督 を督促させることとなった。{{place:魯陽|魯陽城}}の東門の外に幕舎を設けて{{person:公仇称|公仇称}}の壮行の宴（{{special:祖道|祖道}}）を開き、幕僚や属官たちが一堂に会した。ちょうどその時、{{person:董卓|董卓}}が派遣した歩兵・騎兵数万の迎撃軍のうち、先行する軽騎兵数十騎が突如として姿を現した。しかし{{person:孫堅|孫堅}}はまさに杯を巡らせて談笑したまま、{{special:部曲|部曲}}の兵士たちに命じて陣列を整えさせ、決して軽々しく動いてはならぬと厳命した。敵の後続の騎兵がしだいに増えてくると、{{person:孫堅|孫堅}}はおもむろに宴席を閉じ、整然と指揮して城内へと引き揚げた。そして側近たちに言った。「先ほど私がすぐには立ち上がらなかったのは、兵士たちがパニックになって押し合い踏みつけ合い（蹈藉）、諸君が城内に入れなくなるのを恐れたからにすぎない」。{{person:董卓|董卓}}の軍は{{person:孫堅|孫堅}}の軍勢がきわめて整然としているのを見て、あえて{{place:魯陽|魯陽城}}を攻めようとはせず、そのまま引き返した。"}, {"id": "v46_p6_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "裴注", "raw_text": "《英雄記》曰：「初堅討董卓，到梁縣之陽人。卓亦遣兵步騎五千迎之，陳郡太守胡軫爲大督護，呂布爲騎督，其餘步騎將校都督者甚衆。軫字文才，性急，預宣言曰：『今此行也，要當斬一靑綬，乃整齊耳。』諸將聞而惡之。軍到廣成，去陽人城數十里。日暮，士馬疲極，當止宿，又本受卓節度宿廣成，秣馬飲食，以夜進兵，投曉攻城。諸將惡憚軫，欲賊敗其事，布等宣言『陽人城中賊已走，當追尋之；不然失之矣』，便夜進軍。城中守備甚設，不可掩襲。於是吏士飢渴，人馬甚疲，且夜至，又無塹壘。釋甲休息，而布又宣言相驚，云「城中賊出來」。軍衆擾亂奔走，皆棄甲，失鞍馬。行十餘里，定無賊，會天明，便還，拾取兵器，欲進攻城。城守已固，穿塹已深，軫等不能攻而還。」", "kakikudashi": "『英雄記』に曰く、「初め堅の董卓を討つや、梁県の陽人に到る。卓も亦た兵歩騎五千を遣はして之を迎へしめ、陳郡太守胡軫を大督護と為し、呂布を騎督と為し、其の余の歩騎の将校・都督たる者甚だ衆し。軫、字は文才、性急にして、預め宣言して曰く、『今此の行や、要ず当に一青綬を斬るべし、乃ち整斉せんのみ』と。諸将、聞きて之を悪む。軍、広成に到る、陽人城を去ること数十里なり。日暮れ、士馬疲れ極まり、当に止宿すべし、又本より卓の節度を受け、広成に宿し、馬に秣かひ飲食し、夜を以て兵を進め、暁に投じて城を攻むることとす。諸将、軫を悪み憚り、其の事を賊敗せんと欲し、布等、宣言すらく『陽人城中の賊、已に走れば、当に之を追尋すべし、然らずんば之を失はん』と、便ち夜に軍を進む。城中、守備甚だ設けられ、掩襲すべからず。是に於て吏士飢渇し、人馬甚だ疲れ、且つ夜に至り、又塹塁無し。甲を釈きて休息するに、布、又宣言して相ひ驚かし、『城中の賊、出で来る』と云ふ。軍衆、擾乱して奔走し、皆甲を棄て、鞍馬を失ふ。行くこと十余里にして、定めて賊無く、会たま天明くれば、便ち還り、兵器を拾取し、進みて城を攻めんと欲す。城守已に固く、塹を穿つこと已に深ければ、軫等、攻むる能はずして還る」と。", "translation": "『英雄記』にいう。「当初、孫堅が董卓を討つため、梁県の陽人に進出した。董卓もまた歩兵・騎兵五千を派遣してこれを迎撃させ、陳郡太守の胡軫を大督護とし、呂布を騎督とし、その他にも歩兵・騎兵の将校や都督が数多く従軍していた。胡軫、字は文才は気性が短気で、出陣前にあらかじめ『今回の遠征では、かならず青綬（二千石の高官）の首を一つ斬り落としてやる。そうすれば軍規も引き締まるだろう』と公言した。呂布ら諸将はこれを聞いて胡軫を憎んだ。軍勢は陽人城から数十里離れた広成に到着した。日は暮れ、兵士も馬も疲れ果てており、ここで野営するはずであったし、もともと董卓からの作戦指令（節度）でも、広成で宿営して馬に飼い葉を与え兵士に食事をとらせ、夜間に進軍して夜明けとともに城を攻める手筈になっていた。ところが諸将は胡軫を嫌ってその作戦を台無しにしようと企み、呂布らが『陽人城内の敵（孫堅）はすでに逃走したぞ、ただちに追撃すべきだ。さもなければ取り逃がしてしまう！』と触れ回ったため、すぐさま夜間に強行軍を進めた。しかし陽人城内の守備は厳重に固められており、奇襲することはできなかった。このとき将兵は飢えと渇きに苦しみ、人も馬も疲労困憊していたうえ、夜間に到着したため塹壕や土塁も築けなかった。やむなく鎧を脱いで休息していたところ、呂布がまたしてもデマを流して味方を脅かし、『城内の敵が打って出てきたぞ！』と叫んだ。そのため全軍は大混乱に陥って潰走し、みな鎧を投げ捨て、鞍や馬を失った。十余里ほど逃げたところで、実際には敵の追撃などないことが分かり、ちょうど夜が明けたため、引き返して捨てた武器を拾い集め、進んで陽人城を攻めようとした。しかし城の守りはすでに固められ、堀も深く掘られていたため、胡軫らは攻め落とすことができずに退却した」。", "persons": "孫堅,董卓,胡軫,呂布", "places": "梁県,陽人,陳郡,広成", "era_year": "初平元年〜2年（190年〜191年）", "source_book": "英雄記", "keywords": "太守,大督護,騎督,都督,青綬", "raw_tagged": "《{{special:引用史料|英雄記}}》曰：「初{{person:孫堅|堅}}討{{person:董卓|董卓}}，到{{place:梁県|梁縣}}之{{place:陽人|陽人}}。{{person:董卓|卓}}亦遣兵步騎五千迎之，{{place:陳郡|陳郡}}{{office:太守|太守}}{{person:胡軫|胡軫}}爲{{office:都督|大督護}}，{{person:呂布|呂布}}爲{{office:都督|騎督}}，其餘步騎將校{{office:都督|都督}}者甚衆。{{person:胡軫|軫}}字{{person:胡軫|文才}}，性急，預宣言曰：『今此行也，要當斬一{{special:青綬|靑綬}}，乃整齊耳。』諸將聞而惡之。軍到{{place:広成|廣成}}，去{{place:陽人|陽人城}}數十里。日暮，士馬疲極，當止宿，又本受{{person:董卓|卓}}節度宿{{place:広成|廣成}}，秣馬飲食，以夜進兵，投曉攻城。諸將惡憚{{person:胡軫|軫}}，欲賊敗其事，{{person:呂布|布}}等宣言『{{place:陽人|陽人城}}中賊已走，當追尋之；不然失之矣』，便夜進軍。城中守備甚設，不可掩襲。於是吏士飢渴，人馬甚疲，且夜至，又無塹壘。釋甲休息，而{{person:呂布|布}}又宣言相驚，云「城中賊出來」。軍衆擾亂奔走，皆棄甲，失鞍馬。行十餘里，定無賊，會天明，便還，拾取兵器，欲進攻城。城守已固，穿塹已深，{{person:胡軫|軫}}等不能攻而還。」", "kakikudashi_tagged": "『{{special:引用史料|英雄記}}』に曰く、「初め{{person:孫堅|堅}}の{{person:董卓|董卓}}を討つや、{{place:梁県|梁県}}の{{place:陽人|陽人}}に到る。{{person:董卓|卓}}も亦た兵歩騎五千を遣はして之を迎へしめ、{{place:陳郡|陳郡}}{{office:太守|太守}}{{person:胡軫|胡軫}}を{{office:都督|大督護}}と為し、{{person:呂布|呂布}}を{{office:都督|騎督}}と為し、其の余の歩騎の将校・{{office:都督|都督}}たる者甚だ衆し。{{person:胡軫|軫}}、字は{{person:胡軫|文才}}、性急にして、預め宣言して曰く、『今此の行や、要ず当に一{{special:青綬|青綬}}を斬るべし、乃ち整斉せんのみ』と。諸将、聞きて之を悪む。軍、{{place:広成|広成}}に到る、{{place:陽人|陽人城}}を去ること数十里なり。日暮れ、士馬疲れ極まり、当に止宿すべし、又本より{{person:董卓|卓}}の節度を受け、{{place:広成|広成}}に宿し、馬に秣かひ飲食し、夜を以て兵を進め、暁に投じて城を攻むることとす。諸将、{{person:胡軫|軫}}を悪み憚り、其の事を賊敗せんと欲し、{{person:呂布|布}}等、宣言すらく『{{place:陽人|陽人城}}中の賊、已に走れば、当に之を追尋すべし、然らずんば之を失はん』と、便ち夜に軍を進む。城中、守備甚だ設けられ、掩襲すべからず。是に於て吏士飢渇し、人馬甚だ疲れ、且つ夜に至り、又塹塁無し。甲を釈きて休息するに、{{person:呂布|布}}、又宣言して相ひ驚かし、『城中の賊、出で来る』と云ふ。軍衆、擾乱して奔走し、皆甲を棄て、鞍馬を失ふ。行くこと十余里にして、定めて賊無く、会たま天明くれば、便ち還り、兵器を拾取し、進みて城を攻めんと欲す。城守已に固く、塹を穿つこと已に深ければ、{{person:胡軫|軫}}等、攻むる能はずして還る」と。", "translation_tagged": "『{{special:引用史料|英雄記}}』にいう。「当初、{{person:孫堅|孫堅}}が{{person:董卓|董卓}}を討つため、{{place:梁県|梁県}}の{{place:陽人|陽人}}に進出した。{{person:董卓|董卓}}もまた歩兵・騎兵五千を派遣してこれを迎撃させ、{{place:陳郡|陳郡}}{{office:太守|太守}}の{{person:胡軫|胡軫}}を{{office:都督|大督護}}とし、{{person:呂布|呂布}}を{{office:都督|騎督}}とし、その他にも歩兵・騎兵の将校や{{office:都督|都督}}が数多く従軍していた。{{person:胡軫|胡軫}}、字は{{person:胡軫|文才}}は気性が短気で、出陣前にあらかじめ『今回の遠征では、かならず{{special:青綬|青綬}}（{{office:太守|二千石}}の高官）の首を一つ斬り落としてやる。そうすれば軍規も引き締まるだろう』と公言した。{{person:呂布|呂布}}ら諸将はこれを聞いて{{person:胡軫|胡軫}}を憎んだ。軍勢は{{place:陽人|陽人城}}から数十里離れた{{place:広成|広成}}に到着した。日は暮れ、兵士も馬も疲れ果てており、ここで野営するはずであったし、もともと{{person:董卓|董卓}}からの作戦指令（節度）でも、{{place:広成|広成}}で宿営して馬に飼い葉を与え兵士に食事をとらせ、夜間に進軍して夜明けとともに城を攻める手筈になっていた。ところが諸将は{{person:胡軫|胡軫}}を嫌ってその作戦を台無しにしようと企み、{{person:呂布|呂布}}らが『{{place:陽人|陽人城}}内の敵（{{person:孫堅|孫堅}}）はすでに逃走したぞ、ただちに追撃すべきだ。さもなければ取り逃がしてしまう！』と触れ回ったため、すぐさま夜間に強行軍を進めた。しかし{{place:陽人|陽人城}}内の守備は厳重に固められており、奇襲することはできなかった。このとき将兵は飢えと渇きに苦しみ、人も馬も疲労困憊していたうえ、夜間に到着したため塹壕や土塁も築けなかった。やむなく鎧を脱いで休息していたところ、{{person:呂布|呂布}}がまたしてもデマを流して味方を脅かし、『城内の敵が打って出てきたぞ！』と叫んだ。そのため全軍は大混乱に陥って潰走し、みな鎧を投げ捨て、鞍や馬を失った。十余里ほど逃げたところで、実際には敵の追撃などないことが分かり、ちょうど夜が明けたため、引き返して捨てた武器を拾い集め、進んで{{place:陽人|陽人城}}を攻めようとした。しかし城の守りはすでに固められ、堀も深く掘られていたため、{{person:胡軫|胡軫}}らは攻め落とすことができずに退却した」。"}, {"id": "v46_p6_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "本文", "raw_text": "堅移屯梁東，大爲卓軍所攻，堅與數十騎潰圍而出。堅常著赤罽幘，乃脫幘令親近將祖茂著之。卓騎爭逐茂，故堅從間道得免。茂困迫，下馬，以幘冠塚閒燒柱，因伏草中。卓騎望見，圍繞數重，定近覺是柱，乃去。堅復相收兵，合戰於陽人，大破卓軍，梟其都督華雄等。是時，或間堅於術，術懷疑，不運軍糧。", "kakikudashi": "堅、移りて梁東に屯し、大いに卓の軍の攻むる所と為り、堅、数十騎と囲みを潰して出づ。堅、常に赤罽幘を著くるに、乃ち幘を脱ぎて親近の将祖茂をして之を著けしむ。卓の騎、争ひて茂を逐ふ、故に堅は間道より免るるを得たり。茂、困迫し、馬を下り、幘を以て塚間の焼柱に冠せしめ、因りて草中に伏す。卓の騎、望見し、囲繞すること数重なるも、定めて近づけば是れ柱なるを覚り、乃ち去る。堅、復た相ひ兵を収め、陽人に合戦し、大いに卓の軍を破り、其の都督華雄等を梟す。是の時、或るひと堅を術に間すれば、術、疑ひを懐き、軍糧を運ばず。", "translation": "これより前、孫堅が陣を移して梁県の東に駐屯していたとき、董卓軍の猛攻を受けて大敗し、孫堅はわずか数十騎とともに包囲を突破して脱出した。孫堅は日頃から赤い毛織物の頭巾（赤罽幘）を身につけていたが、この時は頭巾を脱いで側近の部将である祖茂にかぶらせた。董卓の騎兵たちが先を争って祖茂を追いかけたため、孫堅は間道を通って危機を逃れることができた。祖茂は追い詰められると馬から下り、赤い頭巾を墓場の間に立っていた焼け焦げた柱にかぶせ、自分は草むらの中に身を伏せた。董卓の騎兵たちは遠くからその頭巾を見つけ、幾重にも取り囲んだが、近づいてよく見るとただの柱であることに気づき、そのまま立ち去った。その後、孫堅は再び散り散りになった兵を収容し、陽人において決戦を挑み、董卓の軍を大いに撃破して、その都督である華雄らの首を斬って晒し首（梟首）にした。この時、ある者が袁術に孫堅のことを中傷したため、袁術は疑念を抱き、兵糧の輸送を止めてしまった。", "persons": "孫堅,董卓,祖茂,華雄,袁術", "places": "梁県,陽人", "era_year": "初平2年（191年）", "source_book": "", "keywords": "赤罽幘,都督", "raw_tagged": "{{person:孫堅|堅}}移屯{{place:梁県|梁東}}，大爲{{person:董卓|卓}}軍所攻，{{person:孫堅|堅}}與數十騎潰圍而出。{{person:孫堅|堅}}常著{{special:赤罽幘|赤罽幘}}，乃脫幘令親近將{{person:祖茂|祖茂}}著之。{{person:董卓|卓}}騎爭逐{{person:祖茂|茂}}，故{{person:孫堅|堅}}從間道得免。{{person:祖茂|茂}}困迫，下馬，以幘冠塚閒燒柱，因伏草中。{{person:董卓|卓}}騎望見，圍繞數重，定近覺是柱，乃去。{{person:孫堅|堅}}復相收兵，合戰於{{place:陽人|陽人}}，大破{{person:董卓|卓}}軍，梟其{{office:都督|都督}}{{person:華雄|華雄}}等。是時，或間{{person:孫堅|堅}}於{{person:袁術|術}}，{{person:袁術|術}}懷疑，不運軍糧。", "kakikudashi_tagged": "{{person:孫堅|堅}}、移りて{{place:梁県|梁東}}に屯し、大いに{{person:董卓|卓}}の軍の攻むる所と為り、{{person:孫堅|堅}}、数十騎と囲みを潰して出づ。{{person:孫堅|堅}}、常に{{special:赤罽幘|赤罽幘}}を著くるに、乃ち幘を脱ぎて親近の将{{person:祖茂|祖茂}}をして之を著けしむ。{{person:董卓|卓}}の騎、争ひて{{person:祖茂|茂}}を逐ふ、故に{{person:孫堅|堅}}は間道より免るるを得たり。{{person:祖茂|茂}}、困迫し、馬を下り、幘を以て塚間の焼柱に冠せしめ、因りて草中に伏す。{{person:董卓|卓}}の騎、望見し、囲繞すること数重なるも、定めて近づけば是れ柱なるを覚り、乃ち去る。{{person:孫堅|堅}}、復た相ひ兵を収め、{{place:陽人|陽人}}に合戦し、大いに{{person:董卓|卓}}の軍を破り、其の{{office:都督|都督}}{{person:華雄|華雄}}等を梟す。是の時、或るひと{{person:孫堅|堅}}を{{person:袁術|術}}に間すれば、{{person:袁術|術}}、疑ひを懐き、軍糧を運ばず。", "translation_tagged": "これより前、{{person:孫堅|孫堅}}が陣を移して{{place:梁県|梁県}}の東に駐屯していたとき、{{person:董卓|董卓}}軍の猛攻を受けて大敗し、{{person:孫堅|孫堅}}はわずか数十騎とともに包囲を突破して脱出した。{{person:孫堅|孫堅}}は日頃から赤い毛織物の頭巾（{{special:赤罽幘|赤罽幘}}）を身につけていたが、この時は頭巾を脱いで側近の部将である{{person:祖茂|祖茂}}にかぶらせた。{{person:董卓|董卓}}の騎兵たちが先を争って{{person:祖茂|祖茂}}を追いかけたため、{{person:孫堅|孫堅}}は間道を通って危機を逃れることができた。{{person:祖茂|祖茂}}は追い詰められると馬から下り、赤い頭巾を墓場の間に立っていた焼け焦げた柱にかぶせ、自分は草むらの中に身を伏せた。{{person:董卓|董卓}}の騎兵たちは遠くからその頭巾を見つけ、幾重にも取り囲んだが、近づいてよく見るとただの柱であることに気づき、そのまま立ち去った。その後、{{person:孫堅|孫堅}}は再び散り散りになった兵を収容し、{{place:陽人|陽人}}において決戦を挑み、{{person:董卓|董卓}}の軍を大いに撃破して、その{{office:都督|都督}}である{{person:華雄|華雄}}らの首を斬って晒し首（梟首）にした。この時、ある者が{{person:袁術|袁術}}に{{person:孫堅|孫堅}}のことを中傷したため、{{person:袁術|袁術}}は疑念を抱き、兵糧の輸送を止めてしまった。"}, {"id": "v46_p6_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "裴注", "raw_text": "《江表傳》曰：「或謂術曰：『堅若得洛，不可復制，此爲除狼而得虎也』，故術疑之。」", "kakikudashi": "『江表伝』に曰く、「或るひと術に謂ひて曰く、『堅、若し洛を得ば、復た制すべからず、此れ狼を除きて虎を得る為るなり』と、故に術、之を疑ふ」と。", "translation": "『江表伝』にいう。「ある者が袁術に『もし孫堅が洛陽を手に入れたならば、もはや抑えつけることはできなくなります。これは狼（董卓）を追い払って新たに虎（孫堅）を招き入れるようなものです』と吹き込んだため、袁術は孫堅を疑ったのである」。", "persons": "袁術,孫堅", "places": "洛陽", "era_year": "初平2年（191年）", "source_book": "江表伝", "keywords": "除狼得虎", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「或謂{{person:袁術|術}}曰：『{{person:孫堅|堅}}若得{{place:洛陽|洛}}，不可復制，{{special:除狼得虎|此爲除狼而得虎也}}』，故{{person:袁術|術}}疑之。」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に曰く、「或るひと{{person:袁術|術}}に謂ひて曰く、『{{person:孫堅|堅}}、若し{{place:洛陽|洛}}を得ば、復た制すべからず、{{special:除狼得虎|此れ狼を除きて虎を得る為るなり}}』と、故に{{person:袁術|術}}、之を疑ふ」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「ある者が{{person:袁術|袁術}}に『もし{{person:孫堅|孫堅}}が{{place:洛陽|洛陽}}を手に入れたならば、もはや抑えつけることはできなくなります。これは{{special:除狼得虎|狼（董卓）を追い払って新たに虎（孫堅）を招き入れる}}ようなものです』と吹き込んだため、{{person:袁術|袁術}}は{{person:孫堅|孫堅}}を疑ったのである」。"}, {"id": "v46_p6_5", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "本文", "raw_text": "陽人去魯陽百餘里，堅夜馳見術，畫地計校，曰：「所以出身不顧，上爲國家討賊，下慰將軍家門之私仇。堅與卓非有骨肉之怨也，而將軍受譖潤之言，還相嫌疑！」", "kakikudashi": "陽人は魯陽を去ること百余里なり、堅、夜に馳せて術に見え、地に画きて計校し、曰く、「身を出身して顧みざる所以は、上は国家の為に賊を討ち、下は将軍家門の私仇を慰めんとなり。堅と卓とは骨肉の怨み有るに非ざるなり、而るに将軍は譖潤の言を受け、還りて相ひ嫌疑するか！」と。", "translation": "陽人は魯陽から百余里離れていたが、孫堅は夜通し馬を走らせて魯陽の袁術のもとへ駆けつけ、地面に図を描いて情勢と作戦を説明し、こう訴えた。「私が我が身を顧みずに戦っておりますのは、上は国家のために逆賊（董卓）を討ち、下は将軍（袁術）の一門の私的な仇（董卓に殺された袁隗・袁基ら一族の恨み）を晴らさんがためでございます。この孫堅個人と董卓との間に肉親を殺された恨みがあるわけではないのです。それなのに将軍は中傷・讒言（譖潤の言）を鵜呑みにされ、かえって私を疑われるのですか！」。", "persons": "孫堅,袁術,董卓", "places": "陽人,魯陽", "era_year": "初平2年（191年）", "source_book": "", "keywords": "譖潤", "raw_tagged": "{{place:陽人|陽人}}去{{place:魯陽|魯陽}}百餘里，{{person:孫堅|堅}}夜馳見{{person:袁術|術}}，畫地計校，曰：「所以出身不顧，上爲國家討賊，下慰將軍家門之私仇。{{person:孫堅|堅}}與{{person:董卓|卓}}非有骨肉之怨也，而將軍受{{special:譖潤|譖潤}}之言，還相嫌疑！」", "kakikudashi_tagged": "{{place:陽人|陽人}}は{{place:魯陽|魯陽}}を去ること百余里なり、{{person:孫堅|堅}}、夜に馳せて{{person:袁術|術}}に見え、地に画きて計校し、曰く、「身を出身して顧みざる所以は、上は国家の為に賊を討ち、下は将軍家門の私仇を慰めんとなり。{{person:孫堅|堅}}と{{person:董卓|卓}}とは骨肉の怨み有るに非ざるなり、而るに将軍は{{special:譖潤|譖潤}}の言を受け、還りて相ひ嫌疑するか！」と。", "translation_tagged": "{{place:陽人|陽人}}は{{place:魯陽|魯陽}}から百余里離れていたが、{{person:孫堅|孫堅}}は夜通し馬を走らせて{{place:魯陽|魯陽}}の{{person:袁術|袁術}}のもとへ駆けつけ、地面に図を描いて情勢と作戦を説明し、こう訴えた。「私が我が身を顧みずに戦っておりますのは、上は国家のために逆賊（{{person:董卓|董卓}}）を討ち、下は将軍（{{person:袁術|袁術}}）の一門の私的な仇（{{person:董卓|董卓}}に殺された袁隗・袁基ら一族の恨み）を晴らさんがためでございます。この{{person:孫堅|孫堅}}個人と{{person:董卓|董卓}}との間に肉親を殺された恨みがあるわけではないのです。それなのに将軍は中傷・讒言（{{special:譖潤|譖潤}}の言）を鵜呑みにされ、かえって私を疑われるのですか！」。"}, {"id": "v46_p6_6", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "裴注", "raw_text": "《江表傳》載堅語曰：「大勳垂捷而軍糧不繼，此吳起所以嘆泣於西河，樂毅所以遺恨於垂成也。願將軍深思之。」", "kakikudashi": "『江表伝』に堅の語を載せて曰く、「大勲、捷つに垂んとして軍糧継がず、此れ呉起が西河に於て嘆泣せし所以、楽毅が垂成に於て恨みを遺せし所以なり。願はくは将軍、深く之を思へ」と。", "translation": "『江表伝』には孫堅の言葉を載せてこう記している。「大いなる戦功が目前に迫りながら兵糧が続かないというのは、まさにかつて呉起が西河において涙を流して嘆いた理由であり、楽毅が斉の平定を目前にしながら無念を残した理由でございます。どうか将軍よ、深くこのことをお考えください」。", "persons": "孫堅,呉起,楽毅", "places": "", "era_year": "初平2年（191年）", "source_book": "江表伝", "keywords": "", "raw_tagged": "《{{special:引用史料|江表傳}}》載{{person:孫堅|堅}}語曰：「大勳垂捷而軍糧不繼，此{{person:呉起|吳起}}所以嘆泣於西河，{{person:楽毅|樂毅}}所以遺恨於垂成也。願將軍深思之。」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に{{person:孫堅|堅}}の語を載せて曰く、「大勲、捷つに垂んとして軍糧継がず、此れ{{person:呉起|呉起}}が西河に於て嘆泣せし所以、{{person:楽毅|楽毅}}が垂成に於て恨みを遺せし所以なり。願はくは将軍、深く之を思へ」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』には{{person:孫堅|孫堅}}の言葉を載せてこう記している。「大いなる戦功が目前に迫りながら兵糧が続かないというのは、まさにかつて{{person:呉起|呉起}}が西河において涙を流して嘆いた理由であり、{{person:楽毅|楽毅}}が斉の平定を目前にしながら無念を残した理由でございます。どうか将軍よ、深くこのことをお考えください」。"}, {"id": "v46_p6_7", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "本文", "raw_text": "術踧踖，卽調發軍糧。堅還屯。卓憚堅猛壯，乃遣將軍李傕等來求和親。令堅列疏子弟任刺史、郡守者，許表用之。堅曰：「卓逆天無道，蕩覆王室。今不夷汝三族，懸示四海，則吾死不瞑目。豈將與乃和親邪？」復進軍大谷。拒雒九十里。", "kakikudashi": "術、踧踖し、即ち軍糧を調発す。堅、屯に還る。卓、堅の猛壮なるを憚り、乃ち将軍李傕等を遣はし来りて和親を求めしむ。堅をして子弟の刺史・郡守に任ずる者を列疏せしめ、表して之を用ふるを許す。堅曰く、「卓は天に逆らひて無道、王室を蕩覆す。今、汝の三族を夷げ、四海に懸示せずんば、則ち吾死すとも目を瞑せず。豈に将に乃と和親せんや？」と。復た軍を大谷に進む。雒を拒ること九十里なり。", "translation": "袁術は恐れ入って恥じ入り（踧踖）、ただちに兵糧を徴発して送った。孫堅は陽人の陣営へ戻った。董卓は孫堅の猛勇ぶりを恐れ憚り、将軍の李傕らを使者として派遣し、和睦と縁組（和親）を申し入れてきた。そして孫堅の一族子弟のうち刺史や郡太守に任官させたい者をリストアップさせ、必ず上表して任命すると約束した。しかし孫堅は言い放った。「董卓は天に逆らって無道を働き、漢の王室を覆した逆賊である。いま貴様の三族を皆殺しにし、その首を天下（四海）に晒しものにしなければ、私は死んでも死にきれぬ。どうして貴様らと和親など結ぶものか！」。こうしてさらに軍を大谷へと進めた。洛陽から九十里の地点であった。", "persons": "袁術,孫堅,董卓,李傕", "places": "大谷,洛陽", "era_year": "初平2年（191年）", "source_book": "", "keywords": "刺史,太守,三族", "raw_tagged": "{{person:袁術|術}}踧踖，卽調發軍糧。{{person:孫堅|堅}}還屯。{{person:董卓|卓}}憚{{person:孫堅|堅}}猛壯，乃遣將軍{{person:李傕|李傕}}等來求和親。令{{person:孫堅|堅}}列疏子弟任{{office:刺史|刺史}}、{{office:太守|郡守}}者，許表用之。{{person:孫堅|堅}}曰：「{{person:董卓|卓}}逆天無道，蕩覆王室。今不夷汝{{special:三族|三族}}，懸示四海，則吾死不瞑目。豈將與乃和親邪？」復進軍{{place:大谷|大谷}}。拒{{place:洛陽|雒}}九十里。", "kakikudashi_tagged": "{{person:袁術|術}}、踧踖し、即ち軍糧を調発す。{{person:孫堅|堅}}、屯に還る。{{person:董卓|卓}}、{{person:孫堅|堅}}の猛壮なるを憚り、乃ち将軍{{person:李傕|李傕}}等を遣はし来りて和親を求めしむ。{{person:孫堅|堅}}をして子弟の{{office:刺史|刺史}}・{{office:太守|郡守}}に任ずる者を列疏せしめ、表して之を用ふるを許す。{{person:孫堅|堅}}曰く、「{{person:董卓|卓}}は天に逆らひて無道、王室を蕩覆す。今、汝の{{special:三族|三族}}を夷げ、四海に懸示せずんば、則ち吾死すとも目を瞑せず。豈に将に乃と和親せんや？」と。復た軍を{{place:大谷|大谷}}に進む。{{place:洛陽|雒}}を拒ること九十里なり。", "translation_tagged": "{{person:袁術|袁術}}は恐れ入って恥じ入り（踧踖）、ただちに兵糧を徴発して送った。{{person:孫堅|孫堅}}は陽人の陣営へ戻った。{{person:董卓|董卓}}は{{person:孫堅|孫堅}}の猛勇ぶりを恐れ憚り、将軍の{{person:李傕|李傕}}らを使者として派遣し、和睦と縁組（和親）を申し入れてきた。そして{{person:孫堅|孫堅}}の一族子弟のうち{{office:刺史|刺史}}や郡{{office:太守|太守}}に任官させたい者をリストアップさせ、必ず上表して任命すると約束した。しかし{{person:孫堅|孫堅}}は言い放った。「{{person:董卓|董卓}}は天に逆らって無道を働き、漢の王室を覆した逆賊である。いま貴様の{{special:三族|三族}}を皆殺しにし、その首を天下（四海）に晒しものにしなければ、私は死んでも死にきれぬ。どうして貴様らと和親など結ぶものか！」。こうしてさらに軍を{{place:大谷|大谷}}へと進めた。{{place:洛陽|洛陽}}から九十里の地点であった。"}, {"id": "v46_p6_8", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "裴注", "raw_text": "《山陽公載記》曰：「卓謂長史劉艾曰：『關東軍敗數矣，皆畏孤，無能爲也。惟孫堅小戇，頗能用人，當語諸將，使知忌之。孤昔與周愼西征，愼圍邊韓於金城。孤語張温，求引所將兵爲愼作後駐。温不聽。孤時上言其形勢，知愼必不克。臺今有本末。事未報，温又使孤討先零叛羌，以爲西方可一時蕩定。孤皆知其不然而不得止，遂行，留別部司馬劉靖將步騎四千屯安定，以爲聲勢。叛羌便還，欲截歸道，孤小擊輒開，畏安定有兵故也。虜謂安定當數萬人，不知但靖也。時又上章言狀，而孫堅隨周愼行，謂愼求將萬兵造金城，使愼以二萬作後駐，邊韓城中無宿穀，當於外運，畏愼大兵，不敢輕與堅戰，而堅兵足以斷其運道，兒曹用必還羌谷中，涼州或能定也。温旣不能用孤，愼又不用堅，自攻金城，壞其外垣，馳使語温，自以克在旦夕，温時亦自以計中也。而渡遼兒果斷（蔡園）〔葵園〕，愼棄輜重走，果如孤策。臺以此封孤都鄕侯。堅以佐軍司馬，所見與人同，自爲可耳。』艾曰：『堅雖時見計，故自不如李傕、郭汜。聞在美陽亭北，將千騎步與虜合，殆死，亡失印綬，此不爲能也。』卓曰：『堅時烏合義從，兵不如虜精，且戰有利鈍。但當論山東大勢，終無所至耳。』艾曰：『山東兒驅略百姓，以作寇逆，其鋒不如人，堅甲利兵強弩之用又不如人，亦安得久？』卓曰：『然，但殺二袁、劉表、孫堅，天下自服從孤耳。』」", "kakikudashi": "『山陽公載記』に曰く、「卓、長史劉艾に謂ひて曰く、『関東の軍、敗るることしばしばなり、皆孤を畏れ、能く為す無きなり。惟だ孫堅のみ少しく戇にして、頗る能く人を用ふれば、当に諸将に語り、之を忌むを知らしむべし。孤、昔、周慎と西征し、慎、辺・韓を金城に囲む。孤、張温に語り、将ゐる所の兵を引きて慎の為に後駐を作さんと求むるも、温、聴かず。孤、時に其の形勢を上言し、慎の必ず克たざるを知る。臺に今本末有り。事未だ報ぜられざるに、温、又孤をして先零の叛羌を討たしめ、以為へらく西方一時にして蕩定すべし、と。孤、皆其の然らざるを知るも止むを得ず、遂に行き、別部司馬劉靖を留めて歩騎四千を将ゐて安定に屯せしめ、以て声勢を為す。叛羌、便ち還り、帰道を截たんと欲するも、孤、少しく撃てば輒ち開くは、安定に兵有るを畏るるが故なり。虜、安定に当に数万人あるべしと謂ひ、但だ靖のみなるを知らざるなり。時に又章を上りて状を言ひ、而して孫堅、周慎に随ひて行き、慎に謂ひて万兵を将ゐて金城に造り、慎をして二万を以て後駐を作さしめんことを求め、辺・韓は城中に宿穀無く、当に外より運ぶべければ、慎の大兵を畏れ、敢へて軽々しく堅と戦はず、而して堅の兵、以て其の運道を断つに足れば、児曹、用て必ず羌の谷中に還り、涼州或いは能く定まらん、と。温、既に孤を用ふる能はず、慎、又堅を用ひず、自ら金城を攻め、其の外垣を壊ち、使ひを馳せて温に語り、自ら克つこと旦夕に在りと以為ひ、温、時に亦た自ら計中れりと以為ふなり。而して渡遼の児、果して（蔡園）〔葵園〕を断てば、慎、輜重を棄てて走り、果して孤の策の如し。臺、此を以て孤を都郷侯に封ず。堅、佐軍司馬を以て、見る所人と同じきは、自ら可と為すのみ』と。艾曰く、『堅、時に計を見る有りと雖も、故より自ら李傕・郭汜に如かず。聞く、美陽亭の北に在りて、千騎歩を将ゐて虜と合し、殆ど死せんとし、印綬を亡失す、此れ能と為さざるなり』と。卓曰く、『堅、時に烏合の義従にして、兵は虜の精なるに如かず、且つ戦ひに利鈍有り。但だ当に山東の大勢を論ずべきに、終に至る所無きのみ』と。艾曰く、『山東の児、百姓を駆略し、以て寇逆を作すも、其の鋒は人に如かず、堅甲・利兵・強弩の用、又人に如かず、亦た安んぞ久しきを得んや？』と。卓曰く、『然り、但だ二袁・劉表・孫堅を殺さば、天下自ら孤に服従せんのみ』と」と。", "translation": "『山陽公載記』にいう。「董卓は長史の劉艾に語って言った。『関東の連合軍はたびたび敗北しており、みなわしを恐れていて、何もできはしない。ただ孫堅だけは少々向こう見ず（小戇）なところがあるうえ、なかなか部下を使うのが巧みであるから、諸将によく言い聞かせて警戒させねばならん。昔、わしが周慎とともに西方へ征討に赴いたとき、周慎は辺章と韓遂を金城郡に包囲した。わしは総大将の張温に申し出て、自分の手勢を率いて周慎の後詰（後駐）に回りたいと求めたが、張温は聞き入れなかった。わしはその時、現地の戦況を上奏し、周慎では必ず勝てないことを見抜いていた。尚書台（臺）には今もその上奏文の一部始終が保管されているはずだ。その返答がまだ届かないうちに、張温はまたわしに先零の反乱羌族を討つよう命じ、西方など一挙に平定できると思い込んでいた。わしはそれが無理だとすっかり分かっていたが、命令なのでやむを得ず出陣し、別部司馬の劉靖に残して歩兵・騎兵四千を率いて安定郡に駐屯させ、牽制の威勢を張らせた。案の定、反乱羌族が引き返してわしの退路を断とうとしたが、わしが少し攻撃を加えるだけですぐに道を開けたのは、背後の安定郡に軍勢がいるのを恐れたからである。羌族どもは安定郡に数万の大軍がいると思い込み、ただ劉靖の四千がいるだけだとは気づかなかったのだ。その時も上奏文を奉って状況を報告したが、一方、周慎に従って従軍していた孫堅は、周慎に対してこう進言していた。「私に一万の兵を預けて金城へ進撃させ、周慎将軍は二万の兵をもって後詰（後駐）となってください。辺章・韓遂らは金城の城内に蓄えの兵糧（宿穀）がなく、外部から運び込まねばなりませんから、周慎将軍の大軍を恐れて軽々しく私（孫堅）と決戦しようとはしないでしょう。その間に私の兵で敵の兵糧輸送路を遮断すれば、連中はたまらず羌族の渓谷へ逃げ帰り、涼州を平定できるでしょう」と。ところが張温がわしの策を採用しなかったばかりか、周慎もまた孫堅の策を採用せず、自ら金城を直接攻撃して外郭の城壁を壊すと、早馬を走らせて張温に戦果を報告し、今にも落城させられると思い込み、張温もまた作戦が図に当たったと喜んでいた。しかし果たして辺章・韓遂ら（渡遼の児）は葵園狭の補給路を遮断し、周慎は輜重を投げ捨てて敗走し、まったくわしの予測した通りとなった。朝廷（尚書台）はこの功績によってわしを都郷侯に封じたのである。孫堅は一介の佐軍司馬の身でありながら、わしとまったく同じ戦略眼を持っていたのだから、大したものだと言える』。すると劉艾が言った。『孫堅は時に優れた計略を見せることがあるとはいえ、もとより李傕や郭汜には及びません。聞くところによれば、以前、美陽亭の北において千人ほどの騎兵・歩兵を率いて反乱軍と交戦した際、あやうく戦死しかけて印綬まで紛失したとのことで、とても有能とは言えません』。董卓は言った。『あの時の孫堅の兵は寄せ集めの義勇兵（烏合の義従）で、兵の質が反乱軍の精鋭に及ばなかったのだし、それに戦には時の運・不運（利鈍）があるものだ。ただ山東の連合軍全体の大勢について言えば、結局のところ何も成し遂げられはしないがな』。劉艾が『山東の連中は民衆を駆り集めて反乱を起こしておりますが、その鋒先は我らに及ばず、堅固な鎧・鋭利な武器・強弩の扱いも我らに及びませんから、どうして長続きしましょうか？』と言うと、董卓は『いかにも。ただ二人の袁氏（袁紹・袁術）と劉表、そして孫堅さえ殺してしまえば、天下はおのずとわしに服従するであろう』と語った」。", "persons": "董卓,劉艾,孫堅,周慎,辺章,韓遂,張温,劉靖,李傕,郭汜,袁紹,袁術,劉表", "places": "関東,金城,安定,涼州,葵園,美陽亭", "era_year": "中平3年〜初平2年（186年〜191年）", "source_book": "山陽公載記", "keywords": "長史,先零,別部司馬,都郷侯,佐軍司馬,印綬", "raw_tagged": "《{{special:引用史料|山陽公載記}}》曰：「{{person:董卓|卓}}謂{{office:長史|長史}}{{person:劉艾|劉艾}}曰：『{{place:関東|關東}}軍敗數矣，皆畏孤，無能爲也。惟{{person:孫堅|孫堅}}小戇，頗能用人，當語諸將，使知忌之。孤昔與{{person:周慎|周愼}}西征，{{person:周慎|愼}}圍{{person:辺章|邊}}{{person:韓遂|韓}}於{{place:金城|金城}}。孤語{{person:張温|張温}}，求引所將兵爲{{person:周慎|愼}}作後駐。{{person:張温|温}}不聽。孤時上言其形勢，知{{person:周慎|愼}}必不克。{{special:尚書台|臺}}今有本末。事未報，{{person:張温|温}}又使孤討{{special:先零|先零叛羌}}，以爲西方可一時蕩定。孤皆知其不然而不得止，遂行，留{{office:司馬|別部司馬}}{{person:劉靖|劉靖}}將步騎四千屯{{place:安定|安定}}，以爲聲勢。{{special:先零|叛羌}}便還，欲截歸道，孤小擊輒開，畏{{place:安定|安定}}有兵故也。虜謂{{place:安定|安定}}當數萬人，不知但{{person:劉靖|靖}}也。時又上章言狀，而{{person:孫堅|孫堅}}隨{{person:周慎|周愼}}行，謂{{person:周慎|愼}}求將萬兵造{{place:金城|金城}}，使{{person:周慎|愼}}以二萬作後駐，{{person:辺章|邊}}{{person:韓遂|韓}}城中無宿穀，當於外運，畏{{person:周慎|愼}}大兵，不敢輕與{{person:孫堅|堅}}戰，而{{person:孫堅|堅}}兵足以斷其運道，兒曹用必還羌谷中，{{place:涼州|涼州}}或能定也。{{person:張温|温}}旣不能用孤，{{person:周慎|愼}}又不用{{person:孫堅|堅}}，自攻{{place:金城|金城}}，壞其外垣，馳使語{{person:張温|温} :孫堅|堅}}、時に計を見る有りと雖も、故より自ら{{person:李傕|李傕}}・{{person:郭汜|郭汜}}に如かず。聞く、{{place:美陽亭|美陽亭}}の北に在りて、千騎歩を将ゐて虜と合し、殆ど死せんとし、印綬を亡失す、此れ能と為さざるなり』と。{{person:董卓|卓}}曰く、『{{person:孫堅|堅}}、時に烏合の義従にして、兵は虜の精なるに如かず、且つ戦ひに利鈍有り。但だ当に{{place:関東|山東}}の大勢を論ずべきに、終に至る所無きのみ』と。{{person:劉艾|艾}}曰く、『{{place:関東|山東}}の児、百姓を駆略し、以て寇逆を作すも、其の鋒は人に如かず、堅甲・利兵・強弩の用、又人に如かず、亦た安んぞ久しきを得んや？』と。{{person:董卓|卓}}曰く、『然り、但だ{{special:二袁|二袁}}・{{person:劉表|劉表}}・{{person:孫堅|孫堅}}を殺さば、天下自ら孤に服従せんのみ』と」と。", "translation_tagged": "『{{special:引用史料|山陽公載記}}』にいう。「{{person:董卓|董卓}}は{{office:長史|長史}}の{{person:劉艾|劉艾}}に語って言った。『{{place:関東|関東}}の連合軍はたびたび敗北しており、みなわしを恐れていて、何もできはしない。ただ{{person:孫堅|孫堅}}だけは少々向こう見ず（小戇）なところがあるうえ、なかなか部下を使うのが巧みであるから、諸将によく言い聞かせて警戒させねばならん。昔、わしが{{person:周慎|周慎}}とともに西方へ征討に赴いたとき、{{person:周慎|周慎}}は{{person:辺章|辺章}}と{{person:韓遂|韓遂}}を{{place:金城|金城}}郡に包囲した。わしは総大将の{{person:張温|張温}}に申し出て、自分の手勢を率いて{{person:周慎|周慎}}の後詰（後駐）に回りたいと求めたが、{{person:張温|張温}}は聞き入れなかった。わしはその時、現地の戦況を上奏し、{{person:周慎|周慎}}では必ず勝てないことを見抜いていた。{{special:尚書台|尚書台（臺）}}には今もその上奏文の一部始終が保管されているはずだ。その返答がまだ届かないうちに、{{person:張温|張温}}はまたわしに{{special:先零|先零}}の反乱羌族を討つよう命じ、西方など一挙に平定できると思い込んでいた。わしはそれが無理だとすっかり分かっていたが、命令なのでやむを得ず出陣し、{{office:司馬|別部司馬}}の{{person:劉靖|劉靖}}に残して歩兵・騎兵四千を率いて{{place:安定|安定}}郡に駐屯させ、牽制の威勢を張らせた。案の定、反乱羌族が引き返してわしの退路を断とうとしたが、わしが少し攻撃を加えるだけですぐに道を開けたのは、背後の{{place:安定|安定}}郡に軍勢がいるのを恐れたからである。羌族どもは{{place:安定|安定}}郡に数万の大軍がいると思い込み、ただ{{person:劉靖|劉靖}}の四千がいるだけだとは気づかなかったのだ。その時も上奏文を奉って状況を報告したが、一方、{{person:周慎|周慎}}に従って従軍していた{{person:孫堅|孫堅}}は、{{person:周慎|周慎}}に対してこう進言していた。「私に一万の兵を預けて{{place:金城|金城}}へ進撃させ、{{person:周慎|周慎}}将軍は二万の兵をもって後詰（後駐）となってください。{{person:辺章|辺章}}・{{person:韓遂|韓遂}}らは{{place:金城|金城}}の城内に蓄えの兵糧（宿穀）がなく、外部から運び込まねばなりませんから、{{person:周慎|周慎}}将軍の大軍を恐れて軽々しく私（{{person:孫堅|孫堅}}）と決戦しようとはしないでしょう。その間に私の兵で敵の兵糧輸送路を遮断すれば、連中はたまらず羌族の渓谷へ逃げ帰り、{{place:涼州|涼州}}を平定できるでしょう」と。ところが{{person:張温|張温}}がわしの策を採用しなかったばかりか、{{person:周慎|周慎}}もまた{{person:孫堅|孫堅}}の策を採用せず、自ら{{place:金城|金城}}を直接攻撃して外郭の城壁を壊すと、早馬を走らせて{{person:張温|張温}}に戦果を報告し、今にも落城させられると思い込み、{{person:張温|張温}}もまた作戦が図に当たったと喜んでいた。しかし果たして{{person:辺章|辺章}}・{{person:韓遂|韓遂}}ら（渡遼の児）は{{place:葵園|葵園}}狭の補給路を遮断し、{{person:周慎|周慎}}は輜重を投げ捨てて敗走し、まったくわしの予測した通りとなった。朝廷（尚書{{special:尚書台|台}}）はこの功績によってわしを{{office:列侯|都郷侯}}に封じたのである。{{person:孫堅|孫堅}}は一介の{{office:司馬|佐軍司馬}}の身でありながら、わしとまったく同じ戦略眼を持っていたのだから、大したものだと言える』。すると{{person:劉艾|劉艾}}が言った。『{{person:孫堅|孫堅}}は時に優れた計略を見せることがあるとはいえ、もとより{{person:李傕|李傕}}や{{person:郭汜|郭汜}}には及びません。聞くところによれば、以前、{{place:美陽亭|美陽亭}}の北において千人ほどの騎兵・歩兵を率いて反乱軍と交戦した際、あやうく戦死しかけて印綬まで紛失したとのことで、とても有能とは言えません』。{{person:董卓|董卓}}は言った。『あの時の{{person:孫堅|孫堅}}の兵は寄せ集めの義勇兵（烏合の義従）で、兵の質が反乱軍の精鋭に及ばなかったのだし、それに戦には時の運・不運（利鈍）があるものだ。ただ{{place:関東|山東}}の連合軍全体の大勢について言えば、結局のところ何も成し遂げられはしないがな』。{{person:劉艾|劉艾}}が『{{place:関東|山東}}の連中は民衆を駆り集めて反乱を起こしておりますが、その鋒先は我らに及ばず、堅固な鎧・鋭利な武器・強弩の扱いも我らに及びませんから、どうして長続きしましょうか？』と言うと、{{person:董卓|董卓}}は『いかにも。ただ二人の袁氏（{{person:袁紹|袁紹}}・{{person:袁術|袁術}}）と{{person:劉表|劉表}}、そして{{person:孫堅|孫堅}}さえ殺してしまえば、天下はおのずとわしに服従するであろう』と語った」。"}, {"id": "v46_p6_9", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 6, "type": "本文", "raw_text": "卓尋徙都西入關，焚燒雒邑。", "kakikudashi": "卓、尋いで都を徙して西のかた関に入り、雒邑を焚焼す。", "translation": "まもなく董卓は都を長安へ遷して西方の関中へ入り、洛陽の街と宮殿を焼き払った。", "persons": "董卓", "places": "関中,洛陽", "era_year": "初平元年〜2年（190年〜191年）", "source_book": "", "keywords": "", "raw_tagged": "{{person:董卓|卓}}尋徙都西{{place:関中|入關}}，焚燒{{place:洛陽|雒邑}}。", "kakikudashi_tagged": "{{person:董卓|卓}}、尋いで都を徙して西のかた{{place:関中|関}}に入り、{{place:洛陽|雒邑}}を焚焼す。", "translation_tagged": "まもなく{{person:董卓|董卓}}は都を長安へ遷して西方の{{place:関中|関中}}へ入り、{{place:洛陽|洛陽}}の街と宮殿を焼き払った。"}, {"id": "v46_p7_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 7, "type": "本文", "raw_text": "堅乃前入至雒，修諸陵，平塞卓所發掘。", "kakikudashi": "堅、乃ち前み入りて雒に至り、諸陵を修め、卓の発掘せし所を平塞す。", "translation": "こうして孫堅は進軍して洛陽へ入り、後漢歴代皇帝の陵墓を修復し、董卓によって盗掘された箇所を埋め戻して整えた。", "persons": "孫堅,董卓", "places": "洛陽", "era_year": "初平2年（191年）", "source_book": "", "keywords": "", "raw_tagged": "{{person:孫堅|堅}}乃前入至{{place:洛陽|雒}}，修諸陵，平塞{{person:董卓|卓}}所發掘。", "kakikudashi_tagged": "{{person:孫堅|堅}}、乃ち前み入りて{{place:洛陽|雒}}に至り、諸陵を修め、{{person:董卓|卓}}の発掘せし所を平塞す。", "translation_tagged": "こうして{{person:孫堅|孫堅}}は進軍して{{place:洛陽|洛陽}}へ入り、後漢歴代皇帝の陵墓を修復し、{{person:董卓|董卓}}によって盗掘された箇所を埋め戻して整えた。"}, {"id": "v46_p7_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 7, "type": "裴注", "raw_text": "《江表傳》曰：「舊京空虛，數百里中無煙火。堅前入城，惆悵流涕。」《吳書》曰：「堅入洛，掃除漢宗廟，祠以太牢。堅軍城南甄官井上，旦有五色氣，舉軍驚怪，莫有敢汲。堅令人入井，探得漢傳國璽，文曰『受命於天，旣壽永昌』，方圜四寸，上紐交五龍，上一角缺。初，黃門張讓等作亂，劫天子出奔，左右分散，掌璽者以投井中。」《山陽公載記》曰：「袁術將僭號，聞堅得傳國璽，乃拘堅夫人而奪之。」《江表傳》曰：「案《漢獻帝起居》注云『天子從河上還，得六璽於閣上』，又太康之初孫皓送金璽六枚，無有玉，明其僞也。」虞喜《志林》曰：「天子六璽者，文曰『皇帝之璽』、『皇帝行璽』、『皇帝信璽』、『天子之璽』、『天子行璽』、『天子信璽』。此六璽所封事異，故文字不同。《獻帝起注》云『從河上還，得六玉璽於閣上』，此之謂也。傳國璽者，乃漢高祖所佩秦皇帝璽，世世傳受，號曰傳國璽。案傳國璽不在六璽之數，安得總其説乎？應氏《漢官》、皇甫《世紀》，其論六璽，文義皆符。漢宮傳國璽，文曰『受命於天，旣壽且康』。『且康』『永昌』，二字爲錯，未知兩家何者爲得。金玉之精，率有光氣，加以神器祕寶，輝耀益彰，蓋一代之奇觀，將來之異聞，而以不解之故，強謂之僞，不亦誣乎！陳壽爲破虜傳亦除此説，俱惑《起居注》，不知六璽殊名，與傳國爲七者也。吳時無能刻玉，故天子以金爲璽。璽雖以金，於文不異。吳降而送璽者送天子六璽，曩所得玉璽，乃古人遺印，不可施用。天子之璽，今以無有爲難，不通其義者耳。」臣松之以爲孫堅於興義之中最有忠烈之稱，若得漢神器而潛匿不言，此爲陰懷異志，豈所謂忠臣者乎？吳史欲以爲國華，而不知損堅之令德。如其果然，以傳子孫，縱非六璽之數，要非常人所畜，孫皓之降，亦不得但送六璽，而寶藏傳國也。受命於天，奚取於歸命之堂，若如喜言，則此璽今尙在孫門。匹夫懷璧，猶曰有罪，而況斯物哉！", "kakikudashi": "『江表伝』に曰く、「旧京空虚にして、数百里の中に煙火無し。堅、前みて城に入り、惆悵して流涕す」と。『呉書』に曰く、「堅、洛に入り、漢の宗廟を掃除し、祠るに太牢を以てす。堅、城南の甄官井の上に軍するに、旦に五色の気有り、挙軍驚怪し、敢へて汲む者莫し。堅、人をして井に入らしめ、漢の伝国璽を探り得たり、文に曰く『命を天に受け、既に寿にして永く昌なり』と、方圜四寸、上に五龍を紐交し、上の一角缺く。初め、黄門張譲等、乱を作し、天子を劫して出奔するや、左右分散し、璽を掌る者、以て井中に投ぜしなり」と。『山陽公載記』に曰く、「袁術、将に号を僭せんとするとき、堅が伝国璽を得たりと聞き、乃ち堅の夫人を拘へて之を奪ふ」と。『江表伝』に曰く、「『漢献帝起居注』を案ずるに、『天子、河上より還り、六璽を閣上に得たり』と云ひ、又太康の初めに孫皓は金璽六枚を送り、玉有る無ければ、其の偽なるを明かすなり」と。虞喜の『志林』に曰く、「天子の六璽なる者は、文に『皇帝之璽』『皇帝行璽』『皇帝信璽』『天子之璽』『天子行璽』『天子信璽』と曰ふ。此の六璽は封ずる所の事異なるが故に、文字同じからず。『献帝起居注』に『河上より還り、六玉璽を閣上に得たり』と云ふは、此れの謂ひなり。伝国璽なる者は、乃ち漢の高祖の佩びし所の秦皇帝の璽にして、世世伝受し、号して伝国璽と曰ふ。案ずるに伝国璽は六璽の数に在らざれば、安んぞ其の説を総ぶるを得んや？応氏の『漢官』・皇甫の『世紀』、其の六璽を論ずるに、文義皆符す。漢宮の伝国璽は、文に『命を天に受け、既に寿にして且つ康なり』と曰ふ。『且康』と『永昌』と、二字錯りと為し、両家の何れか得たりと為すかを知らず。金玉の精は、率ね光気有り、加ふるに神器秘宝を以てすれば、輝耀益ます彰るは、蓋し一代の奇観、将来の異聞なるに、解せざるの故を以て、強ひて之を偽と謂ふは、亦た誣ならずや！陳寿、破虜伝を為るに亦た此の説を除きしは、倶に『起居注』に惑ひ、六璽の名を殊にし、伝国と与に七と為るを知らざればなり。呉の時、能く玉を刻む者無し、故に天子、金を以て璽と為す。璽、金を以てすと雖も、文に於て異ならず。呉降りて璽を送る者は天子の六璽を送り、曩に得る所の玉璽は、乃ち古人の遺印にして、施用すべからず。天子の璽、今有る無きを以て難と為すは、其の義に通ぜざる者のみ」と。臣松之以為へらく、孫堅は興義の中に於て最も忠烈の称有り、若し漢の神器を得て潜匿して言はずんば、此れ陰かに異志を懐く為り、豈に所謂忠臣なる者ならんや？呉の史、以て国華と為さんと欲し、堅の令徳を損なふを知らざるなり。如し其れ果して然りて、以て子孫に伝へば、縦ひ六璽の数に非ずとも、要は常人の畜ふる所に非ず、孫皓の降るや、亦た但だ六璽のみを送りて、伝国を宝蔵するを得ざるなり。命を天に受くとは、奚ぞ帰命の堂に取らんや、若し喜の言の如くんば、則ち此の璽は今尚ほ孫門に在らん。匹夫も璧を懐けば、猶ほ罪有りと言ふ、而るを況んや斯の物をや！", "translation": "『江表伝』にいう。「旧都・洛陽は廃墟と化し、数百里にわたって人家の炊煙一つ見えなかった。孫堅は進んで城内へ入ると、悲しみ痛んで涙を流した」。『呉書』にいう。「孫堅は洛陽に入ると、漢の宗廟を掃き清め、太牢（牛・羊・豚を揃えた最高の供物）を捧げて祭祀を行った。孫堅の軍が洛陽城の南にある甄官井のほとりに宿営していたとき、朝方に井戸の上から五色の雲気が立ち上ったため、全軍が驚き怪しみ、誰一人として水を汲もうとする者がいなかった。そこで孫堅が人を井戸の中へ入れて探らせたところ、漢の『伝国の玉璽』を発見した。その印文には『命を天に受け、既に寿にして永く昌なり（受命於天、既寿永昌）』と刻まれ、大きさは四寸四方、上部のつまみ（紐）には五頭の龍が絡み合う彫刻が施され、片方の角が一つ欠けていた。これより前、十常侍（黄門）の張譲らが乱を起こして天子（少帝・献帝）を連れ去り逃走した際、側近たちが散り散りになり、玉璽を管理していた官吏が井戸の中に投げ込んでいたのである」。『山陽公載記』にいう。「のちに袁術が帝号を僭称しようとしたとき、孫堅が伝国の玉璽を手に入れていたと聞き、孫堅の未亡人（呉夫人）を拘束してこれを奪い取った」。『江表伝』にいう。「『漢献帝起居注』を調べてみると、『天子が黄河のほとりから洛陽へ帰還した際、六璽を宮中の閣上で回収した』と記されており、また西晋の太康年間の初めに呉の末帝・孫皓が降伏して送ってきたのは金の印璽六個だけで玉製の璽はなかったから、孫堅が玉璽を得たという話が偽りであることは明らかである」。東晋の虞喜の『志林』にいう。「『天子の六璽』とは、印文に『皇帝之璽』『皇帝行璽』『皇帝信璽』『天子之璽』『天子行璽』『天子信璽』と刻まれた六つの印璽のことである。この六璽は封印する公文書の用途が異なるため、刻まれた文字も異なっている。『献帝起居注』に『黄河のほとりから帰還して六つの玉璽を閣上で得た』とあるのは、この六璽のことを指している。一方、『伝国の璽』とは、漢の高祖（劉邦）が身につけた秦の始皇帝の玉璽のことであり、代々受け継がれて『伝国璽』と呼ばれたものである。考えてみるに、伝国璽はそもそも六璽の数には含まれない別格の璽であるのに、どうして六璽の話と混同して論じられようか？応劭の『漢官儀』や皇甫謐の『帝王世紀』が六璽について論じている内容も、みなこれと一致している。ただ漢室の伝国璽の印文は『受命於天、既寿且康』とされており、『且康』と『永昌』の二字が食い違っていて、どちらの記録が正しいかは分からない。そもそも金や玉の精粋には自然と光の気が宿るものであり、まして天下の神器・秘宝となれば輝きがいっそう顕著に現れるのは当然であって、これこそ一時代の奇観、後世に伝えるべき異聞であるのに、制度を理解していないからといって強引に偽りだと決めつけるのは、あまりに不当ではないか！陳寿が『三國志』孫破虜伝を著した際にこの玉璽発見の逸話を削除したのも、ともに『献帝起居注』の記述に惑わされ、六璽と伝国璽が別名であり合わせて七璽となることを知らなかったためである。呉の時代には玉を彫る職人がいなかったため、呉の皇帝は黄金で天子の六璽を作った。材質は金であっても印文は同じである。呉が西晋に降伏した際に送ったのはこの現用の『天子六璽（金璽）』であり、かつて孫堅が井戸から得た伝国の玉璽は古人の遺した印として実用には供されなかったのである。いま晋に送られた中に玉製の天子璽がなかったことを根拠に玉璽発見説を否定するのは、印璽の制度に通じていない者の議論にすぎない」。臣裴松之が考えるに、孫堅は反董卓の義軍を起こした諸将の中で最も忠烈との誉れ高い人物であるのに、もし漢王朝の神器（伝国璽）を発見しながら朝廷に返上せず密かに隠し持っていたとすれば、それは胸中に謀反の野心を抱いていたことになり、どうして忠臣などと言えようか？呉の史官（『呉書』の撰者）は玉璽発見を呉国の栄華として誇ろうとするあまり、かえって孫堅の美徳を傷つけていることに気づいていないのである。また、もし本当に孫堅が玉璽を得て子孫に伝えていたのなら、たとえ六璽の数に入らない別格の品であ 、若し漢の{{special:伝国璽|神器}}を得て潜匿して言はずんば、此れ陰かに異志を懐く為り、豈に所謂忠臣なる者ならんや？呉の史、以て国華と為さんと欲し、{{person:孫堅|堅}}の令徳を損なふを知らざるなり。如し其れ果して然りて、以て子孫に伝へば、縦ひ{{special:伝国璽|六璽}}の数に非ずとも、要は常人の畜ふる所に非ず、{{person:孫皓|孫皓}}の降るや、亦た但だ{{special:伝国璽|六璽}}のみを送りて、伝国を宝蔵するを得ざるなり。命を天に受くとは、奚ぞ帰命の堂に取らんや、若し{{person:虞喜|喜}}の言の如くんば、則ち此の璽は今尚ほ孫門に在らん。{{special:匹夫懐璧|匹夫も璧を懐けば、猶ほ罪有りと言ふ}}、而るを況んや斯の物をや！", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「旧都・{{place:洛陽|洛陽}}は廃墟と化し、数百里にわたって人家の炊煙一つ見えなかった。{{person:孫堅|孫堅}}は進んで城内へ入ると、悲しみ痛んで涙を流した」。『{{special:引用史料|呉書}}』にいう。「{{person:孫堅|孫堅}}は{{place:洛陽|洛陽}}に入ると、漢の{{special:太牢|宗廟}}を掃き清め、{{special:太牢|太牢}}（牛・羊・豚を揃えた最高の供物）を捧げて祭祀を行った。{{person:孫堅|孫堅}}の軍が{{place:洛陽|洛陽}}城の南にある{{special:甄官井|甄官井}}のほとりに宿営していたとき、朝方に井戸の上から{{special:五色気|五色の雲気}}が立ち上ったため、全軍が驚き怪しみ、誰一人として水を汲もうとする者がいなかった。そこで{{person:孫堅|孫堅}}が人を井戸の中へ入れて探らせたところ、漢の『{{special:伝国璽|伝国の玉璽}}』を発見した。その印文には『命を天に受け、既に寿にして永く昌なり（受命於天、既寿永昌）』と刻まれ、大きさは四寸四方、上部のつまみ（紐）には五頭の龍が絡み合う彫刻が施され、片方の角が一つ欠けていた。これより前、十常侍（{{special:黄門|黄門}}）の{{person:張譲|張譲}}らが乱を起こして天子（少帝・献帝）を連れ去り逃走した際、側近たちが散り散りになり、玉璽を管理していた官吏が井戸の中に投げ込んでいたのである」。『{{special:引用史料|山陽公載記}}』にいう。「のちに{{person:袁術|袁術}}が帝号を僭称しようとしたとき、{{person:孫堅|孫堅}}が{{special:伝国璽|伝国の玉璽}}を手に入れていたと聞き、{{person:孫堅|孫堅}}の未亡人（{{person:呉夫人|呉夫人}}）を拘束してこれを奪い取った」。『{{special:引用史料|江表伝}}』にいう。「『{{special:引用史料|漢献帝起居注}}』を調べてみると、『天子が{{place:黄河|黄河}}のほとりから{{place:洛陽|洛陽}}へ帰還した際、{{special:伝国璽|六璽}}を宮中の閣上で回収した』と記されており、また西晋の{{special:太康|太康}}年間の初めに呉の末帝・{{person:孫皓|孫皓}}が降伏して送ってきたのは金の印璽六個だけで玉製の璽はなかったから、{{person:孫堅|孫堅}}が玉璽を得たという話が偽りであることは明らかである」。東晋の{{person:虞喜|虞喜}}の『{{special:引用史料|志林}}』にいう。「『天子の{{special:伝国璽|六璽}}』とは、印文に『皇帝之璽』『皇帝行璽』『皇帝信璽』『天子之璽』『天子行璽』『天子信璽』と刻まれた六つの印璽のことである。この{{special:伝国璽|六璽}}は封印する公文書の用途が異なるため、刻まれた文字も異なっている。『{{special:引用史料|献帝起居注}}』に『{{place:黄河|黄河}}のほとりから帰還して六つの玉璽を閣上で得た』とあるのは、この{{special:伝国璽|六璽}}のことを指している。一方、『{{special:伝国璽|伝国の璽}}』とは、{{person:劉邦|漢の高祖}}（{{person:劉邦|劉邦}}）が身につけた{{person:始皇帝|秦の始皇帝}}の玉璽のことであり、代々受け継がれて『{{special:伝国璽|伝国璽}}』と呼ばれたものである。考えてみるに、{{special:伝国璽|伝国璽}}はそもそも{{special:伝国璽|六璽}}の数には含まれない別格の璽であるのに、どうして{{special:伝国璽|六璽}}の話と混同して論じられようか？{{person:応劭|応劭}}の『{{special:引用史料|漢官儀}}』や{{person:皇甫謐|皇甫謐}}の『{{special:引用史料|帝王世紀}}』が{{special:伝国璽|六璽}}について論じている内容も、みなこれと一致している。ただ漢室の{{special:伝国璽|伝国璽}}の印文は『受命於天、既寿且康』とされており、『且康』と『永昌』の二字が食い違っていて、どちらの記録が正しいかは分からない。そもそも金や玉の精粋には自然と光の気が宿るものであり、まして天下の{{special:伝国璽|神器}}・秘宝となれば輝きがいっそう顕著に現れるのは当然であって、これこそ一時代の奇観、後世に伝えるべき異聞であるのに、制度を理解していないからといって強引に偽りだと決めつけるのは、あまりに不当ではないか！{{person:陳寿|陳寿}}が『{{special:引用史料|三國志}}』孫{{person:孫堅|破虜}}伝を著した際にこの玉璽発見の逸話を削除したのも、ともに『{{special:引用史料|献帝起居注}}』の記述に惑わされ、{{special:伝国璽|六璽}}と{{special:伝国璽|伝国璽}}が別名であり合わせて七璽となることを知らなかったためである。呉の時代には玉を彫る職人がいなかったため、呉の皇帝は黄金で天子の{{special:伝国璽|六璽}}を作った。材質は金であっても印文は同じである。呉が西晋に降伏した際に送ったのはこの現用の『天子{{special:伝国璽|六璽}}（金璽）』であり、かつて{{person:孫堅|孫堅}}が井戸から得た{{special:伝国璽|伝国の玉璽}}は古人の遺した印として実用には供されなかったのである。いま晋に送られた中に玉製の天子璽がなかったことを根拠に玉璽発見説を否定するのは、印璽の制度に通じていない者の議論にすぎない」。臣{{person:裴松之|裴松之}}が考えるに、{{person:孫堅|孫堅}}は反董卓の義軍を起こした諸将の中で最も忠烈との誉れ高い人物であるのに、もし漢王朝の{{special:伝国璽|神器}}（{{special:伝国璽|伝国璽}}）を発見しながら朝廷に返上せず密かに隠し持っていたとすれば、それは胸中に謀反の野心を抱いていたことになり、どうして忠臣などと言えようか？呉の史官（『{{special:引用史料|呉書}}』の撰者）は玉璽発見を呉国の栄華として誇ろうとするあまり、かえって{{person:孫堅|孫堅}}の美徳を傷つけていることに気づいていないのである。また、もし本当に{{person:孫堅|孫堅}}が玉璽を得て子孫に伝えていたのなら、たとえ{{special:伝国璽|六璽}}の数に入らない別格の品であったとしても、断じて一般人が私蔵してよい物ではないから、{{person:孫皓|孫皓}}が降伏した際にも、{{special:伝国璽|六璽}}だけを送って{{special:伝国璽|伝国璽}}を隠し持つことなどできなかったはずである。『命を天に受く（受命於天）』という印璽を、亡国の『帰命侯（{{person:孫皓|孫皓}}が降伏後に封じられた爵位）』の館に隠し持って何になろうか。もし{{person:虞喜|虞喜}}の言う通りなら、この{{special:伝国璽|伝国璽}}はいまなお孫氏の一門に眠っていることになってしまう。『{{special:匹夫懐璧|罪なき庶民でも宝玉（璧）を隠し持っていればそれだけで罪になる}}（匹夫懐璧、猶曰有罪：『春秋左氏伝』桓公十年）』というのに、ましてや天下の{{special:伝国璽|神器}}である{{special:伝国璽|伝国璽}}ならばなおさらではないか！"}, {"id": "v46_p7_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 7, "type": "本文", "raw_text": "訖，引軍還，住魯陽。", "kakikudashi": "訖りて、軍を引きて還り、魯陽に住まる。", "translation": "陵墓の修復を終えると、孫堅は軍を引き揚げて魯陽に駐屯した。", "persons": "孫堅", "places": "魯陽", "era_year": "初平2年（191年）", "source_book": "", "keywords": "", "raw_tagged": "訖，引軍還，住{{place:魯陽|魯陽}}。", "kakikudashi_tagged": "訖りて、軍を引きて還り、{{place:魯陽|魯陽}}に住まる。", "translation_tagged": "陵墓の修復を終えると、{{person:孫堅|孫堅}}は軍を引き揚げて{{place:魯陽|魯陽}}に駐屯した。"}, {"id": "v46_p7_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 7, "type": "裴注", "raw_text": "《吳錄》曰：「是時關東州郡，務相兼併以自強大。袁紹遣會稽周㬂爲豫州刺史，來襲取州。堅慨然嘆曰：『同舉義兵，將救社稷。逆賊垂破而各若此，吾當誰與戮力乎！』言發涕下。㬂字仁明，周昕之弟也。」《會稽典錄》曰：「初曹公興義兵，遣人要㬂，㬂卽收合兵衆，得二千人，從公征伐，以爲軍師。後與堅爭豫州，屢戰失利。會次兄九江太守昂爲袁術所攻，㬂往助之。軍敗，還鄕里，爲許貢所害。」", "kakikudashi": "『呉録』に曰く、「是の時、関東の州郡、務めて相ひ兼併して以て自ら強大にす。袁紹、会稽の周㬂を遣はして豫州刺史と為し、来りて州を襲ひ取らしむ。堅、慨然として嘆じて曰く、『同じく義兵を挙げ、将に社稷を救はんとしき。逆賊、破るるに垂んとして各おの此くの若し、吾、当に誰と与にか力を戮すべきや！』と。言発して涕下る。㬂、字は仁明、周昕の弟なり」と。『会稽典録』に曰く、「初め曹公の義兵を興すや、人を遣はして㬂を要めしむ、㬂、即ち兵衆を収合して、二千人を得、公に従ひて征伐し、以て軍師と為す。後に堅と豫州を争ひ、しばしば戦ひて利を失ふ。会たま次兄の九江太守昂、袁術の攻むる所と為り、㬂、往きて之を助く。軍敗れ、郷里に還り、許貢の害する所と為る」と。", "translation": "『呉録』にいう。「この時、関東の諸州郡は、しきりに互いの領土を併呑し合って自らの勢力を拡大しようとしていた。袁紹は会稽出身の周㬂を派遣して豫州刺史に任じ、孫堅が領する豫州を奇襲して奪い取らせようとした。孫堅は憤慨して嘆いて言った。『みな同じ志で義兵を挙げ、国家（社稷）を救おうとしたはずだ。それなのに逆賊（董卓）の打倒が目前に迫った今になって、めいめいがこのような有様とは、私はいったい誰と力を合わせればよいというのか！』。そう言うなり涙がこぼれ落ちた。周㬂、字は仁明は、周昕の末弟である」。『会稽典録』にいう。「かつて曹公（曹操）が義兵を起こした際、使者を遣わして周㬂を招いたところ、周㬂はただちに兵士を糾合して二千人を集め、曹公に従って各地を転戦し、軍師に任じられた。のちに孫堅と豫州の支配を巡って争ったが、連戦連敗した。ちょうどその頃、次兄である九江太守の周昂が袁術に攻められたため、周㬂は救援に赴いた。しかし戦いに敗れて故郷（会稽）へ帰還し、のち許貢によって殺害された」。", "persons": "袁紹,周㬂,孫堅,周昕,曹操,周昂,袁術,許貢", "places": "関東,会稽,豫州,九江", "era_year": "初平2年（191年）", "source_book": "呉録,会稽典録", "keywords": "刺史,義兵,社稷,太守", "raw_tagged": "《{{special:引用史料|吳錄}}》曰：「是時{{place:関東|關東}}州郡，務相兼併以自強大。{{person:袁紹|袁紹}}遣{{place:会稽|會稽}}{{person:周㬂|周㬂}}爲{{place:豫州|豫州}}{{office:刺史|刺史}}，來襲取州。{{person:孫堅|堅}}慨然嘆曰：『同舉{{special:義兵|義兵}}，將救{{special:社稷|社稷}}。逆賊垂破而各若此，吾當誰與戮力乎！』言發涕下。{{person:周㬂|㬂}}字{{person:周㬂|仁明}}，{{person:周昕|周昕}}之弟也。」《{{special:引用史料|會稽典錄}}》曰：「初{{person:曹操|曹公}}興{{special:義兵|義兵}}，遣人要{{person:周㬂|㬂}}，{{person:周㬂|㬂}}卽收合兵衆，得二千人，從{{person:曹操|公}}征伐，以爲軍師。後與{{person:孫堅|堅}}爭{{place:豫州|豫州}}，屢戰失利。會次兄{{place:九江|九江}}{{office:太守|太守}}{{person:周昂|昂}}爲{{person:袁術|袁術}}所攻，{{person:周㬂|㬂}}往助之。軍敗，還鄕里，爲{{person:許貢|許貢}}所害。」", "kakikudashi_tagged": "『{{special:引用史料|呉録}}』に曰く、「是の時、{{place:関東|関東}}の州郡、務めて相ひ兼併して以て自ら強大にす。{{person:袁紹|袁紹}} ces": "荊州,樊,鄧,漢水,襄陽,峴山", "era_year": "初平3年（192年）", "source_book": "", "keywords": "初平", "raw_tagged": "{{special:初平|初平三年}}，{{person:袁術|術}}使{{person:孫堅|堅}}征{{place:荊州|荊州}}，擊{{person:劉表|劉表}}。{{person:劉表|表}}遣{{person:黄祖|黃祖}}逆於{{place:樊|樊}}{{place:鄧|鄧}}之間。{{person:孫堅|堅}}擊破之，追渡{{place:漢水|漢水}}，遂圍{{place:襄陽|襄陽}}，單馬行{{place:峴山|峴山}}，爲{{person:黄祖|祖}}軍士所射殺。", "kakikudashi_tagged": "{{special:初平|初平三年}}、{{person:袁術|術}}、{{person:孫堅|堅}}をして{{place:荊州|荊州}}を征し、{{person:劉表|劉表}}を撃たしむ。{{person:劉表|表}}、{{person:黄祖|黄祖}}を遣はして{{place:樊|樊}}・{{place:鄧|鄧}}の間に逆へしむ。{{person:孫堅|堅}}、撃ちて之を破り、追ひて{{place:漢水|漢水}}を渡り、遂に{{place:襄陽|襄陽}}を囲み、単馬にて{{place:峴山|峴山}}を行くに、{{person:黄祖|祖}}の軍士の射殺する所と為る。", "translation_tagged": "{{special:初平|初平三年}}（192年）、{{person:袁術|袁術}}は{{person:孫堅|孫堅}}を派遣して{{place:荊州|荊州}}を征討させ、{{person:劉表|劉表}}を攻撃させた。{{person:劉表|劉表}}は部将の{{person:黄祖|黄祖}}を派遣して{{place:樊|樊城}}と{{place:鄧|鄧}}県の間で迎え撃たせた。{{person:孫堅|孫堅}}は{{person:黄祖|黄祖}}を撃破し、追撃して{{place:漢水|漢水}}を渡り、ついに{{person:劉表|劉表}}の本拠・{{place:襄陽|襄陽}}を包囲したが、単騎で{{place:峴山|峴山}}を巡行していた際、{{person:黄祖|黄祖}}の兵士に射殺された。"}, {"id": "v46_p8_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 8, "type": "裴注", "raw_text": "《典略》曰：「堅悉其衆攻表，表閉門，夜遣將黃祖潛出發兵。祖將兵欲還，堅逆與戰。祖敗走，竄峴山中。堅乘勝夜追祖，祖部兵從竹木間暗射堅，殺之。」《吳錄》曰：「堅時年三十七。」《英雄記》曰：「堅以初平四年正月七日死。」又云：「劉表將呂公將兵緣山向堅，堅輕騎尋山討公。公兵下石。中堅頭，應時腦出物故。其不同如此也。」", "kakikudashi": "『典略』に曰く、「堅、其の衆を悉して表を攻むるに、表、門を閉ぢ、夜に将の黄祖を遣はし潜かに出でて兵を発せしむ。祖、兵を将ゐて還らんと欲するに、堅、逆へて与に戦ふ。祖、敗走し、峴山の中に竄る。堅、勝に乗じて夜に祖を追ふに、祖の部兵、竹木の間より堅を暗射し、之を殺す」と。『呉録』に曰く、「堅、時に年三十七」と。『英雄記』に曰く、「堅は初平四年正月七日を以て死す」と。又云ふ、「劉表の将呂公、兵を将ゐて山に縁りて堅に向ひ、堅、軽騎もて山を尋ねて公を討つ。公の兵、石を下し、堅の頭に中り、時に応じて脳出でて物故す。其の同じからざること此くの如きなり」と。", "translation": "『典略』にいう。「孫堅が全軍を挙げて劉表を攻めると、劉表は襄陽の城門を閉ざし、夜間に部将の黄祖をひそかに城外へ出して周辺の兵を徴発させた。黄祖が兵を率いて城へ戻ろうとしたところ、孫堅が迎え撃って交戦した。黄祖は敗走し、峴山の中に逃げ隠れた。孫堅が勝ちに乗じて夜間に黄祖を追撃したところ、黄祖の兵士が竹林の物陰から孫堅を狙撃し、殺害した」。『呉録』にいう。「孫堅はこの時、三十七歳であった」。『英雄記』にいう。「孫堅は初平四年正月七日に死去した」。また同書にいう。「劉表の部将である呂公が兵を率いて山沿いに孫堅へ向かってくると、孫堅は軽騎兵を率いて山中へ分け入り呂公を討とうとした。すると呂公の兵が頭上から大石を落とし、それが孫堅の頭部に直撃して、即座に脳髄が飛び出して死去（物故）した。諸書の記録の食い違いはこの通りである」。", "persons"
