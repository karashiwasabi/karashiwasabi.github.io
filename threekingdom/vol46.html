兵が頭上から大石を落とし、それが{{person:孫堅|孫堅}}の頭部に直撃して、即座に脳髄が飛び出して死去（{{special:物故|物故}}）した。諸書の記録の食い違いはこの通りである」。"}, {"id": "v46_p8_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 8, "type": "本文", "raw_text": "兄子賁，帥將士衆就術。術復表賁爲豫州刺史。", "kakikudashi": "兄の子の賁、将士衆を帥ゐて術に就く。術、復た賁を表して豫州刺史と為す。", "translation": "孫堅の甥（兄・孫羌の子）である孫賁が、残された将兵を率いて袁術のもとへ身を寄せた。袁術は再び上表して孫賁を豫州刺史とした。", "persons": "孫賁,袁術", "places": "豫州", "era_year": "初平3年（192年）", "source_book": "", "keywords": "刺史", "raw_tagged": "兄子{{person:孫賁|賁}}，帥將士衆就{{person:袁術|術}}。{{person:袁術|術}}復表{{person:孫賁|賁}}爲{{place:豫州|豫州}}{{office:刺史|刺史}}。", "kakikudashi_tagged": "兄の子の{{person:孫賁|賁}}、将士衆を帥ゐて{{person:袁術|術}}に就く。{{person:袁術|術}}、復た{{person:孫賁|賁}}を表して{{place:豫州|豫州}}{{office:刺史|刺史}}と為す。", "translation_tagged": "孫堅の甥（兄・孫羌の子）である{{person:孫賁|孫賁}}が、残された将兵を率いて{{person:袁術|袁術}}のもとへ身を寄せた。{{person:袁術|袁術}}は再び上表して{{person:孫賁|孫賁}}を{{place:豫州|豫州}}{{office:刺史|刺史}}とした。"}, {"id": "v46_p9_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 9, "type": "本文", "raw_text": "堅四子：策、權、翊、匡。權旣稱尊號，諡堅曰武烈皇帝。", "kakikudashi": "堅に四子有り、策・権・翊・匡なり。権、既に尊号を称するや、堅に諡して武烈皇帝と曰ふ。", "translation": "孫堅には四人の子があり、孫策・孫権・孫翊・孫匡といった。のちに孫権が帝号を称すると、父の孫堅に「武烈皇帝」と追諡した。", "persons": "孫堅,孫策,孫権,孫翊,孫匡", "places": "", "era_year": "黄龍元年（229年）", "source_book": "", "keywords": "武烈皇帝", "raw_tagged": "{{person:孫堅|堅}}四子：{{person:孫策|策}}、{{person:孫権|權}}、{{person:孫翊|翊}}、{{person:孫匡|匡}}。{{person:孫権|權}}旣稱尊號，諡{{person:孫堅|堅}}曰{{person:孫堅|武烈皇帝}}。", "kakikudashi_tagged": "{{person:孫堅|堅}}に四子有り、{{person:孫策|策}}・{{person:孫権|権}}・{{person:孫翊|翊}}・{{person:孫匡|匡}}なり。{{person:孫権|権}}、既に尊号を称するや、{{person:孫堅|堅}}に諡して{{person:孫堅|武烈皇帝}}と曰ふ。", "translation_tagged": "{{person:孫堅|孫堅}}には四人の子があり、{{person:孫策|孫策}}・{{person:孫権|孫権}}・{{person:孫翊|孫翊}}・{{person:孫匡|孫匡}}といった。のちに{{person:孫権|孫権}}が帝号を称すると、父の{{person:孫堅|孫堅}}に「{{person:孫堅|武烈皇帝}}」と追諡した。"}, {"id": "v46_p9_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫堅）", "para_index": 9, "type": "裴注", "raw_text": "《吳錄》曰：「尊堅廟曰始祖，墓曰高陵。」《志林》曰：「堅有五子：策、權、翊、匡，吳氏所生；少子朗，庶生也，一名仁。」", "kakikudashi": "『呉録』に曰く、「堅の廟を尊びて始祖と曰ひ、墓を高陵と曰ふ」と。『志林』に曰く、「堅に五子有り、策・権・翊・匡は、呉氏の生む所、少子の朗は、庶生なり、一名は仁」と。", "translation": "『呉録』にいう。「孫堅の宗廟を尊んで『始祖』といい、陵墓を『高陵』といった」。『志林』にいう。「孫堅には五人の子があり、孫策・孫権・孫翊・孫匡の四人は正室の呉夫人が生んだ子であり、末子の孫朗は側室が生んだ庶子で、別名を孫仁といった」。", "persons": "孫堅,孫策,孫権,孫翊,孫匡,呉夫人,孫朗", "places": "曲阿", "era_year": "", "source_book": "呉録,志林", "keywords": "高陵", "raw_tagged": "《{{special:引用史料|吳錄}}》曰：「尊{{person:孫堅|堅}}廟曰{{special:高陵|始祖}}，墓曰{{special:高陵|高陵}}。」《{{special:引用史料|志林}}》曰：「{{person:孫堅|堅}}有五子：{{person:孫策|策}}、{{person:孫権|權}}、{{person:孫翊|翊}}、{{person:孫匡|匡}}，{{person:呉夫人|吳氏}}所生；少子{{person:孫朗|朗}}，庶生也，一名仁。」", "kakikudashi_tagged": "『{{special:引用史料|呉録}}』に曰く、「{{person:孫堅|堅}}の廟を尊びて{{special:高陵|始祖}}と曰ひ、墓を{{special:高陵|高陵}}と曰ふ」と。『{{special:引用史料|志林}}』に曰く、「{{person:孫堅|堅}}に五子有り、{{person:孫策|策}}・{{person:孫権|権}}・{{person:孫翊|翊}}・{{person:孫匡|匡}}は、{{person:呉夫人|呉氏}}の生む所、少子の{{person:孫朗|朗}}は、庶生なり、一名は仁」と。", "translation_tagged": "『{{special:引用史料|呉録}}』にいう。「{{person:孫堅|孫堅}}の宗廟を尊んで『{{special:高陵|始祖}}』といい、陵墓を『{{special:高陵|高陵}}』といった」。『{{special:引用史料|志林}}』にいう。「{{person:孫堅|孫堅}}には五人の子があり、{{person:孫策|孫策}}・{{person:孫権|孫権}}・{{person:孫翊|孫翊}}・{{person:孫匡|孫匡}}の四人は正室の{{person:呉夫人|呉夫人}}が生んだ子であり、末子の{{person:孫朗|孫朗}}は側室が生んだ庶子で、別名を{{person:孫朗|孫仁}}といった」。"}, {"id": "v46_p10_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 10, "type": "本文", "raw_text": "策字伯符。堅初興義兵，策將母徙居舒。與周瑜相友，收合士大夫，江淮間人咸向之。", "kakikudashi": "策、字は伯符。堅、初め義兵を興すや、策、母を将ゐて徙りて舒に居る。周瑜と相ひ友とし、士大夫を収合し、江・淮の間の人、咸な之に向ふ。", "translation": "孫策、字は伯符。父の孫堅が初めて義兵を挙げたとき、孫策は母（呉夫人）を連れて廬江郡の舒県に移り住んだ。同年の周瑜と親しく友情を結び、広く士大夫たちを招き集めたため、長江・淮水流域の人々はみな孫策に心を寄せた。", "persons": "孫策,孫堅,呉夫人,周瑜", "places": "廬江,舒,長江,淮水", "era_year": "初平元年（190年）", "source_book": "", "keywords": "義兵", "raw_tagged": "{{person:孫策|策}}字{{person:孫策|伯符}}。{{person:孫堅|堅}}初興{{special:義兵|義兵}}，{{person:孫策|策}}將母徙居{{place:舒|舒}}。與{{person:周瑜|周瑜}}相友，收合士大夫，{{place:長江|江}}{{place:淮水|淮}}間人咸向之。", "kakikudashi_tagged": "{{person:孫策|策}}、字は{{person:孫策|伯符}}。{{person:孫堅|堅}}、初め{{special:義兵|義兵}}を興すや、{{person:孫策|策}}、母を将ゐて徙りて{{place:舒|舒}}に居る。{{person:周瑜|周瑜}}と相ひ友とし、士大夫を収合し、{{place:長江|江}}・{{place:淮水|淮}}の間の人、咸な之に向ふ。", "translation_tagged": "{{person:孫策|孫策}}、字は{{person:孫策|伯符}}。父の{{person:孫堅|孫堅}}が初めて{{special:義兵|義兵}}を挙げたとき、{{person:孫策|孫策}}は母（{{person:呉夫人|呉夫人}}）を連れて{{place:廬江|廬江}}郡の{{place:舒|舒県}}に移り住んだ。同年の{{person:周瑜|周瑜}}と親しく友情を結び、広く士大夫たちを招き集めたため、{{place:長江|長江}}・{{place:淮水|淮水}}流域の人々はみな{{person:孫策|孫策}}に心を寄せた。"}, {"id": "v46_p10_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 10, "type": "裴注", "raw_text": "《江表傳》曰：「堅爲朱儁所表，爲佐軍，留家著壽春。策年十餘歲，已交結知名，聲譽發聞。有周瑜者，與策同年，亦英達夙成，聞策聲聞，自舒來造焉。便推結分好，義同斷金，勸策徙居舒，策從之。」", "kakikudashi": "『江表伝』に曰く、「堅、朱儁の表する所と為り、佐軍と為るや、家を留めて寿春に著く。策、年十余歳にして、已に知名に交結し、声誉発聞す。周瑜なる者有り、策と同年にして、亦た英達夙成なり、策の声聞を聞き、舒より来りて造る。便ち分好を推結し、義は断金に同じく、策に勧めて徙りて舒に居らしむれば、策、之に従ふ」と。", "translation": "『江表伝』にいう。「孫堅は朱儁に上表されて佐軍司馬となった際、家族を寿春に留め置いた。孫策は十余歳の少年でありながら、すでに名士たちと交友を結び、その名声は広く知れ渡っていた。そのころ周瑜という者がおり、孫策と同い年で、彼もまた抜きん出て聡明で早熟であったが、孫策の評判を聞いて舒県から寿春へ訪ねてきた。二人はたちまち深い親交を結び、金属をも断ち切るほど固い友情（断金の交わり）を誓い合った。そして周瑜が自分の故郷である舒県へ移り住むよう勧めると、孫策はこれに従ったのである」。", "persons": "孫堅,朱儁,孫策,周瑜", "places": "寿春,舒", "era_year": "中平元年〜初平元年（184年〜190年）", "source_book": "江表伝", "keywords": "佐軍司馬,断金", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫堅|堅}}爲{{person:朱儁|朱儁}}所表，爲{{office:司馬|佐軍}}，留家著{{place:寿春|壽春}}。{{person:孫策|策}}年十餘歲，已交結知名，聲譽發聞。有{{person:周瑜|周瑜}}者，與{{person:孫策|策}}同年，亦英達夙成，聞{{person:孫策|策}}聲聞，自{{place:舒|舒}}來造焉。便推結分好，{{special:断金|義同斷金}}，勸{{person:孫策|策}}徙居{{place:舒|舒}}，{{person:孫策|策}}從之。」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に曰く、「{{person:孫堅|堅}}、{{person:朱儁|朱儁}}の表する所と為り、{{office:司馬|佐軍}}と為るや、家を留めて{{place:寿春|寿春}}に著く。{{person:孫策|策}}、年十余歳にして、已に知名に交結し、声誉発聞す。{{person:周瑜|周瑜}}なる者有り、{{person:孫策|策}}と同年にして、亦た英達夙成なり、{{person:孫策|策}}の声聞を聞き、{{place:舒|舒}}より来りて造る。便ち分好を推結し、{{special:断金|義は断金に同じ}}く、{{person:孫策|策}}に勧めて徙りて{{place:舒|舒}}に居らしむれば、{{person:孫策|策}}、之に従ふ」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「{{person:孫堅|孫堅}}は{{person:朱儁|朱儁}}に上表されて{{office:司馬|佐軍司馬}}となった際、家族を{{place:寿春|寿春}}に留め置いた。{{person:孫策|孫策}}は十余歳の少年でありながら、すでに名士たちと交友を結び、その名声は広く知れ渡っていた。そのころ{{person:周瑜|周瑜}}という者がおり、{{person:孫策|孫策}}と同い年で、彼もまた抜きん出て聡明で早熟であったが、{{person:孫策|孫策}}の評判を聞いて{{place:舒|舒県}}から{{place:寿春|寿春}}へ訪ねてきた。二人はたちまち深い親交を結び、金属をも断ち切るほど固い友情（{{special:断金|断金の交わり}}）を誓い合った。そして{{person:周瑜|周瑜}}が自分の故郷である{{place:舒|舒県}}へ移り住むよう勧めると、{{person:孫策|孫策}}はこれに従ったのである」。"}, {"id": "v46_p10_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 10, "type": "本文", "raw_text": "堅薨，還葬曲阿。已乃渡江居江都。", "kakikudashi": "堅薨じ、還りて曲阿に葬る。已にして乃ち江を渡りて江都に居る。", "translation": "父の孫堅が戦死すると、亡骸を曲阿に持ち帰って葬った。その後、長江を渡って広陵郡の江都に移り住んだ。", "persons": "孫堅,孫策", "places": "曲阿,長江,江都", "era_year": "初平3年〜4年（192年〜193年）", "source_book": "", "keywords": "", "raw_tagged": "{{person:孫堅|堅}}薨，還葬{{place:曲阿|曲阿}}。已乃{{place:長江|渡江}}居{{place:江都|江都}}。", "kakikudashi_tagged": "{{person:孫堅|堅}}薨じ、還りて{{place:曲阿|曲阿}}に葬る。已にして乃ち{{place:長江|江を渡り}}て{{place:江都|江都}}に居る。", "translation_tagged": "父の{{person:孫堅|孫堅}}が戦死すると、亡骸を{{place:曲阿|曲阿}}に持ち帰って葬った。その後、{{place:長江|長江}}を渡って広陵郡の{{place:江都|江都}}に移り住んだ。"}, {"id": "v46_p10_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 10, "type": "裴注", "raw_text": "《魏書》曰：「策當嗣侯，讓與弟匡。」", "kakikudashi": "『魏書』に曰く、「策、当に侯を嗣ぐべきも、弟の匡に譲り与ふ」と。", "translation": "『魏書』にいう。「孫策は父の爵位（烏程侯）を継ぐはずであったが、末弟の孫匡にこれを譲り与えた」。", "persons": "孫策,孫匡", "places": "", "era_year": "初平3年（192年）", "source_book": "魏書", "keywords": "列侯", "raw_tagged": "《{{special:引用史料|魏書}}》曰：「{{person:孫策|策}}當嗣侯，讓與弟{{person:孫匡|匡}}。」", "kakikudashi_tagged": "『{{special:引用史料|魏書}}』に曰く、「{{person:孫策|策}}、当に侯を嗣ぐべきも、弟の{{person:孫匡|匡}}に譲り与ふ」と。", "translation_tagged": "『{{special:引用史料|魏書}}』にいう。「{{person:孫策|孫策}}は父の爵位（{{place:烏程|烏程}}{{office:列侯|侯}}）を継ぐはずであったが、末弟の{{person:孫匡|孫匡}}にこれを譲り与えた」。"}, {"id": "v46_p11_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 11, "type": "本文", "raw_text": "徐州牧陶謙深忌策。策舅吳景，時爲丹楊太守，策乃載母徙曲阿，與呂範，孫河俱就景。因緣召募得數百人。興平元年，從袁術。術甚奇之，以堅部曲還策。", "kakikudashi": "徐州牧陶謙、深く策を忌む。策の舅の呉景、時に丹楊太守為り、策、乃ち母を載せて曲阿に徙し、呂範・孫河と倶に景に就く。因縁して召募し数百人を得たり。興平元年、袁術に従ふ。術、甚だ之を奇とし、堅の部曲を以て策に還す。", "translation": "徐州牧の陶謙は深く孫策を忌み嫌っていた。当時、孫策の母方の叔父（舅）である呉景が丹陽太守を務めていたため、孫策は母を船に乗せて曲阿へ移し、呂範・孫河とともに呉景のもとへ身を寄せた。そして現地の縁故を頼りに兵を募り、数百人を集めた。興平元年（194年）、孫策は袁術のもとに赴いて従った。袁術は孫策の器量を大いに奇特とし、かつて孫堅が率いていた旧部曲を孫策に返還した。", "persons": "陶謙,孫策,呉景,呉夫人,呂範,孫河,袁術,孫堅", "places": "徐州,丹陽,曲阿", "era_year": "興平元年（194年）", "source_book": "", "keywords": "牧,太守,興平,部曲", "raw_tagged": "{{place:徐州|徐州}}{{office:牧|牧}}{{person:陶謙|陶謙}}深忌{{person:孫策|策}}。{{person:孫策|策}}舅{{person:呉景|吳景}}，時爲{{place:丹陽|丹楊}}{{office:太守|太守}}，{{person:孫策|策}}乃載母徙{{place:曲阿|曲阿}}，與{{person:呂範|呂範}}，{{person:孫河|孫河}}俱就{{person:呉景|景}}。因緣召募得數百人。{{special:興平|興平元年}}，從{{person:袁術|袁術}}。{{person:袁術|術}}甚奇之，以{{person:孫堅|堅}}{{special:部曲|部曲}}還{{person:孫策|策}}。", "kakikudashi_tagged": "{{place:徐州|徐州}}{{office:牧|牧}}{{person:陶謙|陶謙}}、深く{{person:孫策|策}}を忌む。{{person:孫策|策}}の舅の{{person:呉景|呉景}}、時に{{place:丹陽|丹楊}}{{office:太守|太守}}為り、{{person:孫策|策}}、乃ち母を載せて{{place:曲阿|曲阿}}に徙し、{{person:呂範|呂範}}・{{person:孫河|孫河}}と倶に{{person:呉景|景}}に就く。因縁して召募し数百人を得たり。{{special:興平|興平元年}}、{{person:袁術|袁術}}に従ふ。{{person:袁術|術}}、甚だ之を奇とし、{{person:孫堅|堅}}の{{special:部曲|部曲}}を以て{{person:孫策|策}}に還す。", "translation_tagged": "{{place:徐州|徐州}}{{office:牧|牧}}の{{person:陶謙|陶謙}}は深く{{person:孫策|孫策}}を忌み嫌っていた。当時、孫{{person:呉夫人|策の母}}方の叔父（舅）である{{person:呉景|呉景}}が{{place:丹陽|丹陽}}{{office:太守|太守}}を務めていたため、{{person:孫策|孫策}}は母を船に乗せて{{place:曲阿|曲阿}}へ移し、{{person:呂範|呂範}}・{{person:孫河|孫河}}とともに{{person:呉景|呉景}}のもとへ身を寄せた。そして現地の縁故を頼りに兵を募り、数百人を集めた。{{special:興平|興平元年}}（194年）、{{person:孫策|孫策}}は{{person:袁術|袁術}}のもとに赴いて従った。{{person:袁術|袁術}}は{{person:孫策|孫策}}の器量を大いに奇特とし、かつて{{person:孫堅|孫堅}}が率いていた旧{{special:部曲|部曲}}を{{person:孫策|孫策}}に返還した。"}, {"id": "v46_p11_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 11, "type": "裴注", "raw_text": "《吳曆》曰：「初策在江都時，張紘有母喪。策數詣紘，咨以世務，曰：『方今漢祚中微，天下擾攘，英雄俊傑各擁衆營私，未有能扶危濟亂者也。先君與袁氏共破董卓，功業未遂，卒爲黃祖所害。策雖暗稚，竊有微志，欲從袁揚州求先君餘兵，就舅氏於丹楊，收合流散，東據吳會，報讎雪恥，爲朝廷外籓。君以爲何如？』紘答曰：『旣素空劣，方居衰絰之中，無以奉贊盛略。』策曰：『君高名播越，遠近懷歸。今日事計，決之於君，何得不紆慮啓告，副其高山之望？若微志得展，血讎得報，此乃君之勳力，策心所望也。』因涕泣橫流，顔色不變。紘見策忠壯內發，辭令慷慨，感其志言，乃答曰：『昔周道陵遲，齊晉並興；王室已寧，諸侯貢職。今君紹先侯之軌，有驍武之名，若投丹楊，收兵吳會，則荆揚可一，讎敵可報。據長江，奮威德，誅除群穢，匡輔漢室，功業侔於桓文，豈徒外籓而已哉？方今世亂多難，若功成事立，當與同好俱南濟也。』策曰：『一與君同符合契，（同）有永固之分，今便行矣，以老母弱弟委付於君，策無復回顧之憂。』」《江表傳》曰：「策徑到壽春見袁術，涕泣而言曰：『亡父昔從長沙入討董卓，與明使君會於南陽，同盟結好；不幸遇難，勳業不終。策感惟先人舊恩，欲自憑結，願明使君垂察其誠。』術甚貴異之，然未肯還其父兵。術謂策曰：『孤始用貴舅爲丹楊太守，賢從伯陽爲都尉，彼精兵之地，可還依召募。』策遂詣丹楊依舅，得數百人，而爲涇縣大帥祖郎所襲，幾至危殆。於是復往見術，術以堅餘兵千餘人還策。」", "kakikudashi": "『呉歴』に曰く、「初め策の江都に在りし時、張紘に母の喪有り。策、しばしば紘に詣り、咨るに世務を以てして、曰く、『方今、漢祚中ごろ微にして、天下擾攘し、英雄俊傑、各おの衆を擁して私を営み、未だ能く危きを扶け乱を済ふ者有らざるなり。先君、袁氏と共に董卓を破りしも、功業未だ遂げずして、卒に黄祖の害する所と為る。策、暗稚なりと雖も、窃かに微志有り、袁揚州より先君の余兵を求め、舅氏に丹楊に就き、流散を収合し、東のかた呉・会に拠り、讎を報い恥を雪ぎ、朝廷の外藩と為らんと欲す。君、以て何如と為すか？』と。紘、答へて曰く、『既に素より空劣にして、方に衰絰の中に居れば、以て盛略に奉賛する無し』と。策曰く、『君は高名播越し、遠近懐帰す。今日の事計は、之を君に決せんに、何ぞ慮を紆げて啓告し、其の高山の望みに副はざるを得んや？若し微志展ぶるを得、血讎報ゆるを得ば、此れ乃ち君の勲力にして、策が心に望む所なり』と。因りて涕泣横流し、顔色変ぜず。紘、策が忠壮内に発し、辞令慷慨なるを見、其の志言に感じ、乃ち答へて曰く、『昔、周道陵遅するや、斉・晋並び興り、王室已に寧んじ、諸侯職を貢す。今、君は先侯の軌を紹ぎ、驍武の名有り、若し丹楊に投じ、兵を呉・会に収めば、則ち荊・揚は一にすべく、讎敵は報ゆべし。長江に拠りて、威徳を奮ひ、群穢を誅除し、漢室を匡輔せば、功業は桓・文に侔しからん、豈に徒だ外藩のみならんや？方今、世乱れて難多し、若し功成り事立たば、当に同好と倶に南済すべきなり』と。策曰く、『一たび君と同符合契せば、永固の分有り、今便ち行かん、老母・弱弟を以て君に委付すれば、策に復た回顧の憂ひ無し』と」と。『江表伝』に曰く、「策、径ちに寿春に到りて袁術に見え、涕泣して言ひて曰く、『亡父、昔、長沙より入りて董卓を討ち、明使君と南陽に会し、同盟して好みを結ぶも、不幸にして難に遇ひ、勲業終へず。策、先人の旧恩を感惟し、自ら憑結せんと欲す、願はくは明使君、其の誠を垂察せよ』と。術、甚だ之を貴異とするも、然れども未だ其の父の兵を還すを肯んぜず。術、策に謂ひて曰く、『孤、始め貴舅を用ひて丹楊太守と為し、賢従の伯陽を都尉と為す、彼処は精兵の地なれば、還りて依りて召募すべし』と。策、遂に丹楊に詣りて舅に依り、数百人を得たるも、涇県の大帥祖郎の襲ふ所と為り、幾ど危殆に至る。是に於て復た往きて術に見ゆれば、術、堅の余兵千余人を以て策に還す」と。", "translation": "『呉歴』にいう。「これより前、孫策が江都にいたとき、張紘は母の喪に服していた。孫策はたびたび張紘のもとを訪ねて天下の情勢と経綸を相談し、こう語った。『いま漢王朝の命脈は衰微して天下は乱れに乱れ、英雄・豪傑たちはそれぞれ兵力を擁して私利を図るばかりで、国家の危機を救い乱を平定できる者はまだ現れておりません。亡き父（先君・孫堅）は袁氏（袁術）とともに董卓を打ち破りましたが、大業を成し遂げぬうちに、ついには黄祖に殺害されてしまいました。私（孫策）は愚かで若輩者ではありますが、ひそかにささやかな志を抱いており、揚州の袁術殿（袁揚州）のもとへ行って亡父の残した兵を請い受け、丹陽にいる母方の叔父（呉景）を頼って離散した人々をまとめ上げ、東方の呉郡・会稽郡を拠点として、父の仇を討ち恥を雪ぎ、朝廷を守る外藩の臣となりたいと考えております。貴公はどう思われますか？』。張紘は答えて言った。『私はもともと才に乏しいうえ、今は母の喪（衰絰）に服している最中ですので、貴公の遠大なご計略をお助けすることはできかねます』。孫策は言った。『貴公の高い名声は広く知れ渡り、遠近の人々が心を寄せております。今日の計略は貴公のお言葉によって決断したいのです。どうかお考えを巡らせて教えを授け、高山を仰ぎ見るような私の期待に応えてください。もし私の志を遂げ、血の涙を流す父の仇に報いること }}より入りて{{person:董卓|董卓}}を討ち、{{special:使君|明使君}}と{{place:南陽|南陽}}に会し、同盟して好みを結ぶも、不幸にして難に遇ひ、勲業終へず。{{person:孫策|策}}、{{person:孫堅|先人}}の旧恩を感惟し、自ら憑結せんと欲す、願はくは{{special:使君|明使君}}、其の誠を垂察せよ』と。{{person:袁術|術}}、甚だ之を貴異とするも、然れども未だ其の父の兵を還すを肯んぜず。{{person:袁術|術}}、{{person:孫策|策}}に謂ひて曰く、『孤、始め貴舅を用ひて{{place:丹陽|丹楊}}{{office:太守|太守}}と為し、賢従の{{person:孫賁|伯陽}}を{{office:都尉|都尉}}と為す、彼処は精兵の地なれば、還りて依りて召募すべし』と。{{person:孫策|策}}、遂に{{place:丹陽|丹楊}}に詣りて舅に依り、数百人を得たるも、{{place:涇県|涇県}}の{{special:大帥|大帥}}{{person:祖郎|祖郎}}の襲ふ所と為り、幾ど危殆に至る。是に於て復た往きて{{person:袁術|術}}に見ゆれば、{{person:袁術|術}}、{{person:孫堅|堅}}の余兵千余人を以て{{person:孫策|策}}に還す」と。", "translation_tagged": "『{{special:引用史料|呉歴}}』にいう。「これより前、{{person:孫策|孫策}}が{{place:江都|江都}}にいたとき、{{person:張紘|張紘}}は母の喪に服していた。{{person:孫策|孫策}}はたびたび{{person:張紘|張紘}}のもとを訪ねて天下の情勢と経綸を相談し、こう語った。『いま漢王朝の命脈は衰微して天下は乱れに乱れ、英雄・豪傑たちはそれぞれ兵力を擁して私利を図るばかりで、国家の危機を救い乱を平定できる者はまだ現れておりません。亡き父（{{person:孫堅|先君}}・{{person:孫堅|孫堅}}）は袁氏（{{person:袁術|袁術}}）とともに{{person:董卓|董卓}}を打ち破りましたが、大業を成し遂げぬうちに、ついには{{person:黄祖|黄祖}}に殺害されてしまいました。私（{{person:孫策|孫策}}）は愚かで若輩者ではありますが、ひそかにささやかな志を抱いており、{{place:揚州|揚州}}の{{person:袁術|袁術}}殿（{{person:袁術|袁}}{{place:揚州|揚州}}）のもとへ行って{{person:孫堅|亡父}}の残した兵を請い受け、{{place:丹陽|丹陽}}にいる母方の叔父（{{person:呉景|呉景}}）を頼って離散した人々をまとめ上げ、東方の{{place:呉郡|呉郡}}・{{place:会稽|会稽}}郡を拠点として、父の仇を討ち恥を雪ぎ、朝廷を守る外藩の臣となりたいと考えております。貴公はどう思われますか？』。{{person:張紘|張紘}}は答えて言った。『私はもともと才に乏しいうえ、今は母の喪（{{special:衰絰|衰絰}}）に服している最中ですので、貴公の遠大なご計略をお助けすることはできかねます』。{{person:孫策|孫策}}は言った。『貴公の高い名声は広く知れ渡り、遠近の人々が心を寄せております。今日の計略は貴公のお言葉によって決断したいのです。どうかお考えを巡らせて教えを授け、高山を仰ぎ見るような私の期待に応えてください。もし私の志を遂げ、血の涙を流す父の仇に報いることができましたなら、それは偏に貴公のご功績であり、私が心から願うところでございます』。そう語る{{person:孫策|孫策}}の頬には涙が止めどなく流れていたが、その表情は少しも揺るがなかった。{{person:張紘|張紘}}は{{person:孫策|孫策}}の忠義と勇壮の気が心の底から溢れ出、その言葉が誠実で気概に満ちているのを見て深く感銘を受け、ついに答えて言った。『むかし周王朝の道が衰えたとき、{{special:桓文|斉（桓公）と晋（文公）}}が並び興り、王室は安泰を取り戻して諸侯は朝貢の務めを果たしました。いま貴公は亡き父君（{{person:孫堅|先侯}}・{{person:孫堅|孫堅}}）の足跡を受け継ぎ、武勇の誉れ高いお方です。もし{{place:丹陽|丹陽}}に身を投じて{{place:呉郡|呉郡}}・{{place:会稽|会稽}}郡で兵を集められたならば、{{place:荊州|荊州}}・{{place:揚州|揚州}}を統一することができ、仇敵（{{person:黄祖|黄祖}}・{{person:劉表|劉表}}）にも報復できましょう。{{place:長江|長江}}を拠点として威厳と恩徳を振るい、群がる逆賊どもを誅滅して漢王室を輔佐なされば、その功業は{{special:桓文|斉の桓公・晋の文公（桓文）}}にも匹敵するでしょう。どうして単なる朝廷の外藩にとどまりましょうか？いま世は乱れて苦難が多い時代ですが、もし貴公の功業が成り基盤が固まりましたなら、私も同志の友人たちとともに{{place:長江|長江}}を渡って南へ参りましょう』。{{person:孫策|孫策}}は言った。『ひとたび貴公と割符を合わせたように心が一致したからには、永遠に変わらぬ絆が結ばれました。私はこれより直ちに出発いたします。老いた母と幼い弟たちのことを貴公にお預けいたしますので、もはや私には後ろを振り返る憂いはありません』」。『{{special:引用史料|江表伝}}』にいう。「{{person:孫策|孫策}}はただちに{{place:寿春|寿春}}へ赴いて{{person:袁術|袁術}}に面会し、涙を流して言った。『亡き父はかつて{{place:長沙|長沙}}から北上して{{person:董卓|董卓}}を討ち、{{special:使君|明使君}}（{{person:袁術|袁術}}）と{{place:南陽|南陽}}で会見して同盟と友好を結びましたが、不幸にして凶刃に倒れ、勲業を全うできませんでした。私は{{person:孫堅|亡父}}が受けた旧恩を思い、自ら{{special:使君|明使君}}のお力にすがって結びつきたいと願っております。どうか私の至誠をお汲み取りください』。{{person:袁術|袁術}}は{{person:孫策|孫策}}を大いに高く評価して特別に扱ったが、まだ{{person:孫堅|亡父}}・{{person:孫堅|孫堅}}の旧兵を返還しようとはしなかった。{{person:袁術|袁術}}は{{person:孫策|孫策}}に言った。『わしはさきごろ貴殿の叔父（{{person:呉景|呉景}}）を{{place:丹陽|丹陽}}{{office:太守|太守}}に任じ、貴殿の従兄の{{person:孫賁|伯陽}}（{{person:孫賁|孫賁}}）を{{place:丹陽|丹陽}}{{office:都尉|都尉}}に任じた。あの{{place:丹陽|丹陽}}は精鋭の兵が揃う土地であるから、あちらへ戻って叔父らを頼り、兵を募るとよい』。そこで{{person:孫策|孫策}}は{{place:丹陽|丹陽}}へ赴いて叔父の{{person:呉景|呉景}}を頼り、数百人の兵を集めたが、{{place:涇県|涇県}}の{{special:大帥|大帥（山越の首領）}}である{{person:祖郎|祖郎}}の急襲を受け、あやうく命を落としかける苦境に陥った。そこで再び{{place:寿春|寿春}}へ行って{{person:袁術|袁術}}に面会すると、{{person:袁術|袁術}}はついに{{person:孫堅|孫堅}}の残した兵千余人を{{person:孫策|孫策}}に返還した」。"}, {"id": "v46_p11_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 11, "type": "本文", "raw_text": "太傅馬日磾杖節安集關東，在壽春以禮辟策，表拜懷義校尉，術大將喬蕤、張勳皆傾心敬焉。術常歎曰：「使術有子如孫郎，死復何恨！」策騎士有罪，逃入術營，隱於內廄。策指使人就斬之，訖，詣術謝。術曰：「兵人好叛，當共疾之，何爲謝也？」由是軍中益畏憚之。術初許策爲九江太守，已而更用丹楊陳紀。後術欲攻徐州，從廬江太守陸康求米三萬斛。康不與，術大怒。策昔曾詣康，康不見，使主簿接之。策常銜恨。術遣策攻康，謂曰：「前錯用陳紀，每恨本意不遂。今若得康，廬江眞卿有也。」策攻康，拔之。術復用其故吏劉勳爲太守，策益失望。", "kakikudashi": "太傅馬日磾、節を杖つきて関東を安集し、寿春に在りて礼を以て策を辟し、表して懐義校尉に拝し、術の大将喬蕤・張勲、皆心を傾けて焉を敬す。術、常に歎じて曰く、「術をして孫郎の如き子有らしめば、死すとも復た何をか恨みん！」と。策の騎士に罪有り、逃れて術の営に入り、内廄に隠る。策、人を指使して就きて之を斬らしめ、訖りて、術に詣りて謝す。術曰く、「兵人は叛を好めば、当に共に之を疾むべし、何ぞ謝するを為さんや？」と。是に由りて軍中益ます之を畏憚す。術、初め策を九江太守と為すを許すも、已にして更めて丹楊の陳紀を用ふ。後に術、徐州を攻めんと欲し、廬江太守陸康より米三万斛を求む。康与へざれば、術、大いに怒る。策、昔曾て康に詣りしに、康見えず、主簿をして 呉景|呉景}}を{{office:中郎将|督軍中郎将}}とし、{{person:孫賁|孫賁}}とともに兵を率いて{{person:張英|張英}}らを攻撃させたが、何年経っても攻略できなかった。そこで{{person:孫策|孫策}}は{{person:袁術|袁術}}を説得し、{{person:呉景|呉景}}らを救援して{{place:江東|江東}}を平定させてほしいと願い出た。"}, {"id": "v46_p12_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 12, "type": "裴注", "raw_text": "《江表傳》曰：「策説術云：『家有舊恩在東，願助舅討橫江；橫江拔，因投本土召募，可得三萬兵，以佐明使君匡濟漢室。』術知其恨，而以劉繇據曲阿，王朗在會稽，謂策未必能定，故許之。」", "kakikudashi": "『江表伝』に曰く、「策、術に説きて云ふ、『家に旧恩有りて東に在り、願はくは舅を助けて横江を討たん。横江抜けば、因りて本土に投じて召募し、三万の兵を得べく、以て明使君を佐けて漢室を匡済せん』と。術、其の恨みを知り、而して劉繇の曲阿に拠り、王朗の会稽に在るを以て、策、未だ必ずしも能く定めずと謂ひ、故に之を許す」と。", "translation": "『江表伝』にいう。「孫策は袁術に説いて言った。『我が孫家には、かつて東方の地（江東）に施した旧恩がございます。どうか叔父（呉景）を助けて横江津を討たせてください。横江津を攻め落としましたなら、そのまま故郷の地に入って兵を募り、三万の兵を集めることができますので、それをもって明使君（袁術）を輔佐し、漢王室をお救いいたします』。袁術は孫策が先の約束破りを恨んでいることを知っていたが、曲阿には劉繇が割拠し、会稽には王朗が控えていることから、孫策ごときに平定できるはずがないと考え、その出陣を許可した」。", "persons": "孫策,袁術,呉景,劉繇,王朗", "places": "江東,横江津,曲阿,会稽", "era_year": "興平2年（195年）", "source_book": "江表伝", "keywords": "使君", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫策|策}}説{{person:袁術|術}}云：『家有舊恩在{{place:江東|東}}，願助舅討{{place:横江津|橫江}}；{{place:横江津|橫江}}拔，因投本土召募，可得三萬兵，以佐{{special:使君|明使君}}匡濟漢室。』{{person:袁術|術}}知其恨，而以{{person:劉繇|劉繇}}據{{place:曲阿|曲阿}}，{{person:王朗|王朗}}在{{place:会稽|會稽}}，謂{{person:孫策|策}}未必能定，故許之。」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に曰く、「{{person:孫策|策}}、{{person:袁術|術}}に説きて云ふ、『家に旧恩有りて{{place:江東|東}}に在り、願はくは舅を助けて{{place:横江津|横江}}を討たん。{{place:横江津|横江}}抜けば、因りて本土に投じて召募し、三万の兵を得べく、以て{{special:使君|明使君}}を佐けて漢室を匡済せん』と。{{person:袁術|術}}、其の恨みを知り、而して{{person:劉繇|劉繇}}の{{place:曲阿|曲阿}}に拠り、{{person:王朗|王朗}}の{{place:会稽|会稽}}に在るを以て、{{person:孫策|策}}、未だ必ずしも能く定めずと謂ひ、故に之を許す」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「{{person:孫策|孫策}}は{{person:袁術|袁術}}に説いて言った。『我が孫家には、かつて東方の地（{{place:江東|江東}}）に施した旧恩がございます。どうか叔父（{{person:呉景|呉景}}）を助けて{{place:横江津|横江津}}を討たせてください。{{place:横江津|横江津}}を攻め落としましたなら、そのまま故郷の地に入って兵を募り、三万の兵を集めることができますので、それをもって{{special:使君|明使君}}（{{person:袁術|袁術}}）を輔佐し、漢王室をお救いいたします』。{{person:袁術|袁術}}は{{person:孫策|孫策}}が先の約束破りを恨んでいることを知っていたが、{{place:曲阿|曲阿}}には{{person:劉繇|劉繇}}が割拠し、{{place:会稽|会稽}}には{{person:王朗|王朗}}が控えていることから、{{person:孫策|孫策}}ごときに平定できるはずがないと考え、その出陣を許可した」。"}, {"id": "v46_p12_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 12, "type": "本文", "raw_text": "術表策爲折衝校尉，行殄寇將軍，兵財千餘，騎數十匹，賓客願從者數百人。比至歷陽，衆五六千。策母先自曲阿徙於歷陽，策又徙母阜陵，渡江轉鬥，所向皆破。莫敢當其鋒，而軍令整肅，百姓懷之。", "kakikudashi": "術、策を表して折衝校尉・行殄寇将軍と為すに、兵は財かに千余、騎は数十匹、賓客の従はんことを願ふ者は数百人なり。歴陽に至る比ひには、衆五、六千となる。策の母、先に曲阿より歴陽に徙りしが、策、又た母を阜陵に徙し、江を渡りて転闘し、向ふ所皆破る。敢て其の鋒に当る者莫く、而して軍令整粛なれば、百姓、之に懐く。", "translation": "袁術は上表して孫策を折衝校尉・行殄寇将軍としたが、出発時の兵はわずか千余人、軍馬は数十頭、同行を志願した賓客は数百人にすぎなかった。しかし歴陽に到着するころには、軍勢は五、六千人にまで膨れ上がった。孫策の母（呉夫人）はこれより前に曲阿から歴陽へ移っていたが、孫策はさらに母を安全な阜陵へと移し、自ら長江を渡って各地を転戦し、向かうところの敵をことごとく撃破した。その鋭い鋒先にまともに立ち向かえる者は一人もおらず、しかも孫策の軍規は整然と厳粛に保たれていたため、現地の民衆はみな孫策に心を寄せた。", "persons": "袁術,孫策,呉夫人", "places": "歴陽,曲阿,阜陵,長江", "era_year": "興平2年（195年）", "source_book": "", "keywords": "校尉,雑号将軍", "raw_tagged": "{{person:袁術|術}}表{{person:孫策|策}}爲{{office:校尉|折衝校尉}}，{{office:雑号将軍|行殄寇將軍}}，兵財千餘，騎數十匹，賓客願從者數百人。比至{{place:歴陽|歷陽}}，衆五六千。{{person:呉夫人|策母}}先自{{place:曲阿|曲阿}}徙於{{place:歴陽|歷陽}}，{{person:孫策|策}}又徙母{{place:阜陵|阜陵}}，{{place:長江|渡江}}轉鬥，所向皆破。莫敢當其鋒，而軍令整肅，百姓懷之。", "kakikudashi_tagged": "{{person:袁術|術}}、{{person:孫策|策}}を表して{{office:校尉|折衝校尉}}・{{office:雑号将軍|行殄寇将軍}}と為すに、兵は財かに千余、騎は数十匹、賓客の従はんことを願ふ者は数百人なり。{{place:歴陽|歴陽}}に至る比ひには、衆五、六千となる。{{person:呉夫人|策の母}}、先に{{place:曲阿|曲阿}}より{{place:歴陽|歴陽}}に徙りしが、{{person:孫策|策}}、又た母を{{place:阜陵|阜陵}}に徙し、{{place:長江|江を渡り}}て転闘し、向ふ所皆破る。敢て其の鋒に当る者莫く、而して軍令整粛なれば、百姓、之に懐く。", "translation_tagged": "{{person:袁術|袁術}}は上表して{{person:孫策|孫策}}を{{office:校尉|折衝校尉}}・{{office:雑号将軍|行殄寇将軍}}としたが、出発時の兵はわずか千余人、軍馬は数十頭、同行を志願した賓客は数百人にすぎなかった。しかし{{place:歴陽|歴陽}}に到着するころには、軍勢は五、六千人にまで膨れ上がった。孫{{person:呉夫人|策の母}}（{{person:呉夫人|呉夫人}}）はこれより前に{{place:曲阿|曲阿}}から{{place:歴陽|歴陽}}へ移っていたが、{{person:孫策|孫策}}はさらに母を安全な{{place:阜陵|阜陵}}へと移し、自ら{{place:長江|長江}}を渡って各地を転戦し、向かうところの敵をことごとく撃破した。その鋭い鋒先にまともに立ち向かえる者は一人もおらず、しかも{{person:孫策|孫策}}の軍規は整然と厳粛に保たれていたため、現地の民衆はみな{{person:孫策|孫策}}に心を寄せた。"}, {"id": "v46_p12_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 12, "type": "裴注", "raw_text": "《江表傳》曰：「策渡江攻繇牛渚營，盡得邸閣糧穀、戰具，是歲興平二年也。時彭城相薛禮、下邳相笮融依繇爲盟主，禮據秣陵城，融屯縣南。策先攻融，融出兵交戰，斬首五百餘級，融卽閉門不敢動。因渡江攻禮，禮突走，而樊能、于麋等復合衆襲奪牛渚屯。策聞之，還攻破能等，獲男女萬餘人。復下攻融，爲流矢所中，傷股，不能乘馬，因自輿還牛渚營。或叛告融曰：『孫郎被箭已死。』融大喜，卽遣將于茲鄕策。策遣步騎數百挑戰，設伏於後，賊出擊之，鋒刃未接而僞走，賊追入伏中，乃大破之，斬首千餘級。策因往到融營下，令左右大呼曰：『孫郎竟云何！』賊於是驚怖夜遁。融聞策尙在，更深溝高壘，繕治守備。策以融所屯地勢險固，乃捨去，攻破繇別將於海陵，轉攻湖孰、江乘，皆下之。」", "kakikudashi": "『江表伝』に曰く、「策、江を渡りて繇の牛渚営を攻め、尽とく邸閣の糧穀・戦具を得たり、是の歳、興平二年なり。時に彭城相薛礼・下邳相笮融、繇に依りて盟主と為し、礼は秣陵城に拠り、融は県の南に屯す。策、先づ融を攻むるに、融、兵を出して交戦し、斬首五百余級、融、即ち門を閉ぢて敢て動かず。因りて江を渡りて礼を攻むれば、礼、突走し、而して樊能・于麋等、復た衆を合はせて牛渚屯を襲奪す。策、之を聞き、還りて能等を攻め破り、男女万余人を獲たり。復た下りて融を攻むるに、流矢の中る所と為り、股を傷つけ、馬に乗る能はず、因りて自ら輿して牛渚営に還る。或ひと叛きて融に告げて曰く、『孫郎、箭を被りて已に死せり』と。融、大いに喜び、即ち将の于茲を遣はして策に向はしむ。策、歩騎数百を遣はして戦ひを挑ましめ、伏を後に設くるに、賊、出でて之を撃ち、鋒刃未だ接せざるに偽り走り、賊、追ひて伏中に入れば、乃ち大いに之を破り、斬首千余級。策、因りて往きて融の営下に到り、左右をして大呼せしめて曰く、『孫郎は竟に云何ぞ！』と。賊、是に於て驚怖して夜に遁る。融、策の尚ほ在るを聞き、更に溝を深くし塁を高くし、守備を繕治す。策、融の屯する所の地勢険固なるを以て、乃ち捨て去り、繇の別将を海陵に攻め破り、転じて湖孰・江乗を攻め、皆之を下す」と。", "translation": "『江表伝』にいう。「孫策は長江を渡って劉繇の拠点である牛渚の陣営を攻め、兵糧庫（邸閣）の穀物や武器・軍需品をすべて奪取した。この年は興平2年（195年）であった。当時、彭城相の薛礼と下邳相の笮融が劉繇を頼って盟主に仰いでおり、薛礼は秣陵城に拠り、笮融は秣陵県の南に駐屯していた。孫策がまず笮融を攻めると、笮融は兵を出して交戦したが、孫策軍は五百余りの首級を挙げ、笮融はすぐさま営門を閉ざして出てこなくなった。そこで孫策は水路を渡って秣陵城の薛礼を攻めると、薛礼は包囲を突破して逃走した。ところがその隙に、劉繇の部将・樊能や于麋らが再び兵を集めて牛渚の陣営を奇襲し奪い返した。孫策はこれを聞くと、ただちに引き返して樊能らを攻め破り、男女一万余人を捕らえた。そして再び長江を下って笮融を攻めたが、孫策は流れ矢に当たって太ももを負傷し、馬に乗ることができなくなったため、輿に乗って牛渚の陣営へ帰還した。このとき、ある者が裏切って笮融に『孫郎（孫策）は矢を受けてすでに死んだ』と告げた。笮融は大いに喜び、ただちに部将の于茲を派遣して孫策軍へ向かわせた。孫策は歩兵・騎兵数百人を前に出して挑発させ、後方に伏兵を配置した。敵軍が討って出ると、孫策の先遣隊は刃を交える前に偽って退却し、敵軍が勝ちに乗って伏兵の網の中へ追い込んできたところを一斉に強襲して大破し、千余りの首級を挙げた。孫策はそのまま笮融の陣営のすぐ下まで押し寄せ、側近の兵たちに大声でこう叫ばせた。『孫郎はいったいどうなったというのか！（こうして健在だぞ！）』。敵兵はこれに恐れおののき、夜陰に紛れて逃走した。笮融は孫策がまだ生きていると知ると、さらに堀を深くし塁壁を高くして防備を固めた。孫策は笮融が布陣している場所の地勢が険阻で堅固であるのを見て、これを放置して去り、劉繇の別動隊の将を海陵で攻め破り、転戦して湖孰・江乗を攻め、これらをすべて陥落させた」。", "persons": "孫策,劉繇,薛礼,笮融,樊能,于麋,于茲", "places": "長江,牛渚,彭城,下邳,秣陵,海陵,湖孰,江乗", "era_year": "興平2年（195年）", "source_book": "江表伝", "keywords": "邸閣,興平,相,孫郎", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫策|策}}{{plac son:孫策|策}}の尚ほ在るを聞き、更に溝を深くし塁を高くし、守備を繕治す。{{person:孫策|策}}、{{person:笮融|融}}の屯する所の地勢険固なるを以て、乃ち捨て去り、{{person:劉繇|繇}}の別将を{{place:海陵|海陵}}に攻め破り、転じて{{place:湖孰|湖孰}}・{{place:江乗|江乗}}を攻め、皆之を下す」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「{{person:孫策|孫策}}は{{place:長江|長江}}を渡って{{person:劉繇|劉繇}}の拠点である{{place:牛渚|牛渚}}の陣営を攻め、{{special:邸閣|兵糧庫（邸閣）}}の穀物や武器・軍需品をすべて奪取した。この年は{{special:興平|興平}}2年（195年）であった。当時、{{place:彭城|彭城}}{{office:相|相}}の{{person:薛礼|薛礼}}と{{place:下邳|下邳}}{{office:相|相}}の{{person:笮融|笮融}}が{{person:劉繇|劉繇}}を頼って盟主に仰いでおり、{{person:薛礼|薛礼}}は{{place:秣陵|秣陵城}}に拠り、{{person:笮融|笮融}}は{{place:秣陵|秣陵}}県の南に駐屯していた。{{person:孫策|孫策}}がまず{{person:笮融|笮融}}を攻めると、{{person:笮融|笮融}}は兵を出して交戦したが、{{person:孫策|孫策}}軍は五百余りの首級を挙げ、{{person:笮融|笮融}}はすぐさま営門を閉ざして出てこなくなった。そこで{{person:孫策|孫策}}は水路を渡って{{place:秣陵|秣陵城}}の{{person:薛礼|薛礼}}を攻めると、{{person:薛礼|薛礼}}は包囲を突破して逃走した。ところがその隙に、{{person:劉繇|劉繇}}の部将・{{person:樊能|樊能}}や{{person:于麋|于麋}}らが再び兵を集めて{{place:牛渚|牛渚}}の陣営を奇襲し奪い返した。{{person:孫策|孫策}}はこれを聞くと、ただちに引き返して{{person:樊能|樊能}}らを攻め破り、男女一万余人を捕らえた。そして再び{{place:長江|長江}}を下って{{person:笮融|笮融}}を攻めたが、{{person:孫策|孫策}}は流れ矢に当たって太ももを負傷し、馬に乗ることができなくなったため、輿に乗って{{place:牛渚|牛渚}}の陣営へ帰還した。このとき、ある者が裏切って{{person:笮融|笮融}}に『{{special:孫郎|孫郎}}（{{person:孫策|孫策}}）は矢を受けてすでに死んだ』と告げた。{{person:笮融|笮融}}は大いに喜び、ただちに部将の{{person:于茲|于茲}}を派遣して{{person:孫策|孫策}}軍へ向かわせた。{{person:孫策|孫策}}は歩兵・騎兵数百人を前に出して挑発させ、後方に伏兵を配置した。敵軍が討って出ると、{{person:孫策|孫策}}の先遣隊は刃を交える前に偽って退却し、敵軍が勝ちに乗って伏兵の網の中へ追い込んできたところを一斉に強襲して大破し、千余りの首級を挙げた。{{person:孫策|孫策}}はそのまま{{person:笮融|笮融}}の陣営のすぐ下まで押し寄せ、側近の兵たちに大声でこう叫ばせた。『{{special:孫郎|孫郎}}はいったいどうなったというのか！（こうして健在だぞ！）』。敵兵はこれに恐れおののき、夜陰に紛れて逃走した。{{person:笮融|笮融}}は{{person:孫策|孫策}}がまだ生きていると知ると、さらに堀を深くし塁壁を高くして防備を固めた。{{person:孫策|孫策}}は{{person:笮融|笮融}}が布陣している場所の地勢が険阻で堅固であるのを見て、これを放置して去り、{{person:劉繇|劉繇}}の別動隊の将を{{place:海陵|海陵}}で攻め破り、転戦して{{place:湖孰|湖孰}}・{{place:江乗|江乗}}を攻め、これらをすべて陥落させた」。"}, {"id": "v46_p13_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 13, "type": "本文", "raw_text": "策爲人，美姿顔，好笑語，性闊達聽受，善於用人。是以士民見者，莫不盡心，樂爲致死。劉繇棄軍遁逃，諸郡守皆捐城郭奔走。", "kakikudashi": "策の人と為り、姿顔美しく、笑語を好み、性は闊達にして聴受し、善く人を用ふ。是を以て士民の見る者、心を尽さざるは莫く、楽しみて為に死を致す。劉繇、軍を棄てて遁逃し、諸郡守、皆城郭を捐てて奔走す。", "translation": "孫策の人となりは、容姿端麗で明るく談笑することを好み、気性は度量が大きく快活で人の意見をよく聞き入れ、人材の登用に長けていた。そのため、孫策に接した知識人や民衆で心を尽くさぬ者はなく、みな喜んで孫策のために命を投げ出そうとした。劉繇はついに曲阿の軍営を棄てて逃亡し、周辺の諸郡の太守たちもみな城を棄てて逃げ去った。", "persons": "孫策,劉繇", "places": "", "era_year": "興平2年（195年）", "source_book": "", "keywords": "太守", "raw_tagged": "{{person:孫策|策}}爲人，美姿顔，好笑語，性闊達聽受，善於用人。是以士民見者，莫不盡心，樂爲致死。{{person:劉繇|劉繇}}棄軍遁逃，諸{{office:太守|郡守}}皆捐城郭奔走。", "kakikudashi_tagged": "{{person:孫策|策}}の人と為り、姿顔美しく、笑語を好み、性は闊達にして聴受し、善く人を用ふ。是を以て士民の見る者、心を尽さざるは莫く、楽しみて為に死を致す。{{person:劉繇|劉繇}}、軍を棄てて遁逃し、諸{{office:太守|郡守}}、皆城郭を捐てて奔走す。", "translation_tagged": "{{person:孫策|孫策}}の人となりは、容姿端麗で明るく談笑することを好み、気性は度量が大きく快活で人の意見をよく聞き入れ、人材の登用に長けていた。そのため、{{person:孫策|孫策}}に接した知識人や民衆で心を尽くさぬ者はなく、みな喜んで{{person:孫策|孫策}}のために命を投げ出そうとした。{{person:劉繇|劉繇}}はついに曲阿の軍営を棄てて逃亡し、周辺の諸郡の{{office:太守|太守}}たちもみな城を棄てて逃げ去った。"}, {"id": "v46_p13_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 13, "type": "裴注", "raw_text": "《江表傳》曰：「策時年少，雖有位號，而士民皆呼爲孫郎。百姓聞孫郎至，皆失魂魄；長吏委城郭，竄伏山草。及至，軍士奉令，不敢虜略，鷄犬菜茹，一無所犯，民乃大悅，競以牛酒詣軍。劉繇旣走，策入曲阿勞賜將士，遣將陳寶詣阜陵迎母及弟。發恩布令，告諸縣：『其劉繇、笮融等故鄕部曲來降首者，一無所問；樂從軍者，一身行，復除門戸；不樂者，勿強也。』旬日之間，四面雲集，得見兵二萬餘人，馬千餘匹，威震江東，形勢轉盛。」", "kakikudashi": "『江表伝』に曰く、「策、時に年少く、位号有りと雖も、而れども士民は皆呼びて孫郎と為す。百姓、孫郎の至るを聞き、皆魂魄を失ひ、長吏は城郭を委て、山草に竄伏す。至るに及びて、軍士は令を奉じ、敢て虜略せず、鶏犬・菜茹も、一として犯す所無ければ、民は乃ち大いに悦び、競ひて牛酒を以て軍に詣る。劉繇既に走るや、策、曲阿に入りて将士を労賜し、将の陳宝を遣はし阜陵に詣りて母及び弟を迎へしむ。恩を発し令を布き、諸県に告ぐ、『其れ劉繇・笮融等の故郷の部曲の来りて降首する者は、一に問ふ所無し。従軍を楽しむ者は、一身行けば、門戸を復除せん。楽しまざる者は、強ひる勿きなり』と。旬日の間に、四面より雲集し、見兵二万余人、馬千余匹を得、威は江東に震ひ、形勢転た盛んなり」と。", "translation": "『江表伝』にいう。「当時、孫策はまだ若年であったため、官位や将軍号を持っていたものの、知識人や民衆はみな彼を『孫郎』と呼んでいた。民衆は『孫郎がやって来る』と聞くと、みな生きた心地もせず恐れおののき、地方の長官（長吏）たちは城を投げ出して山野の草むらに逃げ隠れた。ところが実際に孫策の軍が到着してみると、兵士たちは軍令を厳守して略奪を一切行わず、鶏や犬一匹、畑の野菜一つに至るまで何ひとつ荒らさなかったため、民衆は大いに喜び、競い合って牛や酒を携えて軍営へねぎらいに訪れた。劉繇が逃走すると、孫策は曲阿に入城して将兵をねぎらい恩賞を与え、部将の陳宝を阜陵へ派遣して母（呉夫人）と弟たちを迎えさせた。そして恩徳を施し布告を出して、各県にこう通達した。『劉繇や笮融らの旧領の部曲で、自ら投降してくる者は、一切その罪を問わない。従軍を希望する者は、一家から一人出征すれば、その一族の租税・労役を免除（復除）する。従軍を望まない者は、無理に強制してはならない』。するとわずか十日あまりのうちに四方から人々が雲のように集まり、現有兵力二万余人、軍馬千余頭を得て、その威勢は江東一帯に轟き、勢力はますます盛んとなった」。", "persons": "孫策,劉繇,陳宝,呉夫人,笮融", "places": "曲阿,阜陵,江東", "era_year": "興平2年（195年）", "source_book": "江表伝", "keywords": "孫郎,県長,部曲,復除", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫策|策}}時年少，雖有位號，而士民皆呼爲{{special:孫郎|孫郎}}。百姓聞{{special:孫郎|孫郎}}至，皆失魂魄；{{office:県長|長吏}}委城郭，竄伏山草。及至，軍士奉令，不敢虜略，鷄犬菜茹，一無所犯，民乃大悅，競以牛酒詣軍。{{person:劉繇|劉繇}}旣走，{{person:孫策|策}}入{{place:曲阿|曲阿}}勞賜將士，遣將{{person:陳宝|陳寶}}詣{{place:阜陵|阜陵}}迎母及弟。發恩布令，告諸縣：『其{{person:劉繇|劉繇}}、{{person:笮融|笮融}}等故鄕{{special:部曲|部曲}}來降首者，一無所問；樂從軍者，一身行，{{special:復除|復除門戸}}；不樂者，勿強也。』旬日之間，四面雲集，得見兵二萬餘人，馬千餘匹，威震{{place:江東|江東}}，形勢轉盛。」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に曰く、「{{person:孫策|策}}、時に年少く、位号有りと雖も、而れども士民は皆呼びて{{special:孫郎|孫郎}}と為す。百姓、{{special:孫郎|孫郎}}の至るを聞き、皆魂魄を失ひ、{{office:県長|長吏}}は城郭を委て、山草に竄伏す。至るに及びて、軍士は令を奉じ、敢て虜略せず、鶏犬・菜茹も、一として犯す所無ければ、民は乃ち大いに悦び、競ひて牛酒を以て軍に詣る。{{person:劉繇|劉繇}}既に走るや、{{person:孫策|策}}、{{place:曲阿|曲阿}}に入りて将士を労賜し、将の{{person:陳宝|陳宝}}を遣はし{{place:阜陵|阜陵}}に詣りて母及び弟を迎へしむ。恩を発し令を布き、諸県に告ぐ、『其れ{{person:劉繇|劉繇}}・{{person:笮融|笮融}}等の故郷の{{special:部曲|部曲}}の来りて降首する者は、一に問ふ所無し。従軍を楽しむ者は、一身行けば、{{special:復除|門戸を復除}}せん。楽しまざる者は、強ひる勿きなり』と。旬日の間に、四面より雲集し、見兵二万余人、馬千余匹を得、威は{{place:江東|江東}}に震ひ、形勢転た盛んなり」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「当時、{{person:孫策|孫策}}はまだ若年であったため、官位や将軍号を持っていたものの、知識人や民衆はみな彼を『{{special:孫郎|孫郎}}』と呼んでいた。民衆は『{{special:孫郎|孫郎}}がやって来る』と聞くと、みな生きた心地もせず恐れおののき、地方の長官（{{office:県長|長吏}}）たちは城を投げ出して山野の草むらに逃げ隠れた。ところが実際に{{person:孫策|孫策}}の軍が到着してみると、兵士たちは軍令を厳守して略奪を一切行わず、鶏や犬一匹、畑の野菜一つに至るまで何ひとつ荒らさなかったため、民衆は大いに喜び、競い合って牛や酒を携えて軍営へねぎらいに訪れた。{{person:劉繇|劉繇}}が逃走すると、{{person:孫策|孫策}}は{{place:曲阿|曲阿}}に入城して将兵をねぎらい恩賞を与え、部将の{{person:陳宝|陳宝}}を{{place:阜陵|阜陵}}へ派遣して母（{{person:呉夫人|呉夫人}}）と弟たちを迎えさせた。そして恩徳を施し布告を出して、各県にこう通達した。『{{person:劉繇|劉繇}}や{{person:笮融|笮融}}らの旧領の{{special:部曲|部曲}}で、自ら投降してくる者は、一切その罪を問わない。従軍を希望する者は、一家から一人出征すれば、その一族の租税・労役を免除（{{special:復除|復除}}）する。従軍を望まない者は、無理に強制してはならない』。するとわずか十日あまりのうちに四方から人々が雲のように集まり、現有兵力二万余人、軍馬千余頭を得て、その威勢は{{place:江東|江東}}一帯に轟き、勢力はますます盛んとなった」。"}, {"id": "v46_p13_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 13, "type": "本文", "raw_text": "吳人嚴白虎等衆各萬餘人，處處屯聚。吳景等欲先擊破虎等，乃至會稽。策曰：「虎等群盜，非有大志，此成禽耳。」遂引兵渡浙江，據會稽，屠東冶，乃攻破虎等。", "kakikudashi": "呉の人厳白虎等、衆各おの万余人、処処に屯聚す。呉景等、先づ虎等を撃ち破り、乃ち会稽に至らんと欲す。策曰く、「虎等は群盗にして、大志有るに非ず、此れ成禽のみ」と。遂に兵を引きて浙江を渡り、会稽に拠り、東冶を屠り、乃ち虎等を攻め破る。", "translation": "呉郡の豪族である厳白虎らは、それぞれ一万余りの手勢を擁して各地に割拠していた。呉景らは、まず厳白虎らを撃破してから会稽郡へ進撃しようと主張した。しかし孫策は「厳白虎らはただの群盗にすぎず、天下への大志など持っていない。あいつらはいつでも生け捕りにできる（成禽）」と言い、そのまま軍を率いて浙江（銭塘江）を渡り、会稽郡を占領し、南端の東冶まで攻略してから、転じて厳白虎らを攻め破った。", "persons": "厳白虎,呉景,孫策", "places": "呉郡,会稽,浙江,東冶", "era_year": "興平2年〜建安元年（195年〜196年）", "source_book": "", "keywords": "", "raw_tagged": "{{place:呉郡|吳}}人{{person:厳白虎|嚴白虎}}等衆各萬餘人，處處屯聚。{{person:呉景|吳景}}等欲先擊破{{person:厳白虎|虎}}等，乃至{{place:会稽|會稽}}。{{person:孫策|策}}曰：「{{person:厳白虎|虎}}等群盜，非有大志，此成禽耳。」遂引兵渡{{place:浙江|浙江}}，據{{place:会稽|會稽}}，屠{{place:東冶|東冶}}，乃攻破{{person:厳白虎|虎}}等。", "kakikudashi_tagged": "{{place:呉郡|呉}}の人{{person:厳白虎|厳白虎}}等、衆各おの万余人、処処に屯聚す。{{person:呉景|呉景}}等、先づ{{person:厳白虎|虎}}等を撃ち破り、乃ち{{place:会稽|会稽}}に至らんと欲す。{{person:孫策|策}}曰く、「{{person:厳白虎|虎}}等は群盗にして、大志有るに非ず、此れ成禽のみ」と。遂に兵を引きて{{place:浙江|浙江}}を渡り、{{place:会稽|会稽}}に拠り、{{place:東冶|東冶}}を屠り、乃ち{{person:厳白虎|虎}}等を攻め破る。", "translation_tagged": "{{place:呉郡|呉郡}}の豪族である{{person:厳白虎|厳白虎}}らは、それぞれ一万余りの手勢を擁して各地に割拠していた。{{person:呉景|呉景}}らは、まず{{person:厳白虎|厳白虎}}らを撃破してから{{place:会稽|会稽}}郡へ進撃しようと主張した。しかし{{person:孫策|孫策}}は「{{person:厳白虎|厳白虎}}らはただの群盗にすぎず、天下への大志など持っていない。あいつらはいつでも生け捕りにできる（成禽）」と言い、そのまま軍を率いて{{place:浙江|浙江}}（銭塘江）を渡り、{{place:会稽|会稽}}郡を占領し、南端の{{place:東冶|東冶}}まで攻略してから、転じて{{person:厳白虎|厳白虎}}らを攻め破った。"}, {"id": "v46_p13_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 13, "type": "裴注", "raw_text": "《吳錄》曰：「時有烏程鄒他、錢銅及前合浦太守嘉興王晟等，各聚衆萬餘或數千。引兵撲討，皆攻破之。策母吳氏曰：『晟與汝父有昇堂見妻之分，今其諸子兄弟皆已梟夷，獨餘一老翁，何足復憚乎？』乃捨之，餘咸族誅。策自討虎，虎高壘堅守，使其弟輿請和。許之。輿請獨與策會面約。旣會，策引白刃斫席，輿體動，策笑曰：『聞卿能坐躍，勦捷不常，聊戲卿耳！』輿曰：『我見刃乃然。』策知其無能也，乃以手戟投之，立死。輿有勇力，虎衆以其死也，甚懼。進攻破之。虎奔餘杭，投許昭於虜中。程普請擊昭，策曰：『許昭有義於舊君，有誠於故友，此丈夫之志也。』乃捨之。」臣松之案：許昭有義於舊君，謂濟盛憲也，事見後注。有誠於故友，則受嚴白虎也。", "kakikudashi": "『呉録』に曰く、「時に烏程の鄒他・銭銅及び前の合浦太守・嘉興の王晟等有り、各おの衆万余或いは数千を聚む。兵を引きて撲討し、皆之を攻め破る。策の母呉氏曰く、『晟は汝の父と堂に昇り妻に見ゆるの分有り、今、其の諸子・兄弟は皆已に梟夷せられ、独り一老翁を余すのみ、何ぞ復た憚るに足らんや？』と。乃ち之を捨て、余は咸な族誅す。策、自ら虎を討つに、虎、塁を高くして堅守し、其の弟の輿をして和を請はしむ。之を許す。輿、独り策と会面して約せんと請ふ。既に会するや、策、白刃を引きて席を斫れば、輿の体動く。策、笑ひて曰く、『卿は能く坐躍し、勦捷なること常ならずと聞き、聊か卿に戯るるのみ！』と。輿曰く、『我は刃を見れば乃ち然り』と。策、其の無能なるを知るや、乃ち手戟を以て之に投ずれば、立ちどころに死す。輿に勇力有り、虎の衆、其の死するを以てや、甚だ懼る。進みて之を攻め破る。虎、餘杭に奔り、許昭に虜中に投ず。程普、昭を撃たんと請ふも、策曰く、『許昭は旧君に義有り、故友に誠有り、此れ丈夫の志なり』と。乃ち之を捨つ」と。臣松之案ずるに、許昭の旧君に義有りとは、盛憲を済ふを謂ふなり、事は後の注に見ゆ。故友に誠有りとは、則ち厳白虎を受くるなり。", "translation": "『呉録』にいう。「このとき、烏程の鄒他・銭銅および前合浦太守で嘉興の王晟らが、それぞれ一万余りあるいは数千の兵を集めて割拠していた。孫策は軍を率いて討伐に向かい、彼らをことごとく攻め破った。このとき、孫策の母の呉夫人が孫策に言った。『王晟は、お前の亡き父（孫堅）と互いの母堂に拝礼し妻を引き合わせるほど家族同然の親交（昇堂見妻の分）があった人です。いま彼の息子や兄弟たちはみなすでに処刑され、ただ老人が一人残っているだけなのに、これ以上何を警戒することがありましょうか？』。そこで孫策は王晟の命を赦し、残りの鄒他・銭銅らの一族はすべて処刑（族誅）した。続いて孫策が自ら厳白虎を討伐すると、厳白虎は塁壁を高く築いて堅守し、弟の厳輿を使いに立てて和睦を請うた。孫策はこれを許した。厳輿は孫策と二人きりで会見して盟約を結びたいと申し出た。会見の席に着くと、孫策はいきなり白刃を抜いて敷物（席）に斬りつけた。厳輿の身体が思わずびくりと動くと、孫策は笑って言った。『君は座ったまま跳躍でき、並外れて身軽だと聞いていたので、ちょっとからかってみただけだ！』。厳輿は『私は刃物を見ると、ついこうなってしまうのだ』と答えた。孫策は厳輿がたいした器量ではないと見抜くと、手にしていた手戟（短い戟）を投げつけ、厳輿はその場で即死した。厳輿は厳白虎軍の中で勇力をもって知られていたため、厳白虎の部下たちは彼が死んだと知ると大いに恐慌をきたした。孫策は進撃して厳白虎を撃破した。厳白虎は餘杭へ逃走し、自立勢力（虜中）の許昭のもとへ身を寄せた。程普が許昭を攻撃しようと進言したが、孫策は『許昭はかつての主君（旧君）に対して義節を貫き、旧友に対しても誠実さを尽くしている。これこそ立派な男子（丈夫）の志というものだ』と述べ、許昭への攻撃を取りやめた」。臣裴松之が思うに、許昭が「旧君に対して義節がある」というのは、かつての呉郡太守・盛憲を救い匿ったことを指しており、その顛末は後の注に見える。「旧友に対して誠実である」というのは、逃げてきた厳白虎を受け入れたことを指すのである。", "persons": "鄒他,銭銅,王晟,孫策,呉夫人,孫堅,厳白虎,厳輿,許昭,程普,裴松之,盛憲", "places": "烏程,合浦,嘉興,餘杭", "era_year": "建安元年（196年）", "source_book": "呉録", "keywords": "太守,昇堂見妻,三族", "raw_tagged": "《{{special:引用史料|吳錄}}》曰：「時有{{place:烏程|烏程}}{{person:鄒他|鄒他}}、{{person:銭銅|錢銅}}及前{{place:合浦|合浦}}{{office:太守|太守}}{{place:嘉興|嘉興}}{{person:王晟|王晟}}等，各聚衆萬餘或數千。引兵撲討，皆攻破之。{{person:呉夫人|策母}}{{person:呉夫人|吳氏}}曰：『{{person:王晟|晟}}與汝父有{{special:昇堂見妻|昇堂見妻}}之分，今其諸子兄弟皆已梟夷，獨餘一老翁，何足復憚乎？』乃捨之，餘咸{{special:三族|族誅}}。{{person:孫策|策}}自討{{person:厳白虎|虎}}，{{person:厳白虎|虎}}高壘堅守，使其弟{{person:厳輿|輿}}請和。許之。{{person:厳輿|輿}}請獨與{{person:孫策|策}}會面約。旣會，{{person:孫策|策} person:鄒他|鄒他}}・{{person:銭銅|銭銅}}らの一族はすべて処刑（{{special:三族|族誅}}）した。続いて{{person:孫策|孫策}}が自ら{{person:厳白虎|厳白虎}}を討伐すると、{{person:厳白虎|厳白虎}}は塁壁を高く築いて堅守し、弟の{{person:厳輿|厳輿}}を使いに立てて和睦を請うた。{{person:孫策|孫策}}はこれを許した。{{person:厳輿|厳輿}}は{{person:孫策|孫策}}と二人きりで会見して盟約を結びたいと申し出た。会見の席に着くと、{{person:孫策|孫策}}はいきなり白刃を抜いて敷物（席）に斬りつけた。{{person:厳輿|厳輿}}の身体が思わずびくりと動くと、{{person:孫策|孫策}}は笑って言った。『君は座ったまま跳躍でき、並外れて身軽だと聞いていたので、ちょっとからかってみただけだ！』。{{person:厳輿|厳輿}}は『私は刃物を見ると、ついこうなってしまうのだ』と答えた。{{person:孫策|孫策}}は{{person:厳輿|厳輿}}がたいした器量ではないと見抜くと、手にしていた手戟（短い戟）を投げつけ、{{person:厳輿|厳輿}}はその場で即死した。{{person:厳輿|厳輿}}は{{person:厳白虎|厳白虎}}軍の中で勇力をもって知られていたため、{{person:厳白虎|厳白虎}}の部下たちは彼が死んだと知ると大いに恐慌をきたした。{{person:孫策|孫策}}は進撃して{{person:厳白虎|厳白虎}}を撃破した。{{person:厳白虎|厳白虎}}は{{place:餘杭|餘杭}}へ逃走し、自立勢力（虜中）の{{person:許昭|許昭}}のもとへ身を寄せた。{{person:程普|程普}}が{{person:許昭|許昭}}を攻撃しようと進言したが、{{person:孫策|孫策}}は『{{person:許昭|許昭}}はかつての主君（旧君）に対して義節を貫き、旧友に対しても誠実さを尽くしている。これこそ立派な男子（丈夫）の志というものだ』と述べ、{{person:許昭|許昭}}への攻撃を取りやめた」。臣{{person:裴松之|裴松之}}が思うに、{{person:許昭|許昭}}が「旧君に対して義節がある」というのは、かつての{{place:呉郡|呉郡}}{{office:太守|太守}}・{{person:盛憲|盛憲}}を救い匿ったことを指しており、その顛末は後の注に見える。「旧友に対して誠実である」というのは、逃げてきた{{person:厳白虎|厳白虎}}を受け入れたことを指すのである。"}, {"id": "v46_p13_5", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 13, "type": "本文", "raw_text": "盡更置長吏，策自領會稽太守，復以吳景爲丹楊太守，以孫賁爲豫章太守，分豫章爲廬陵郡，以賁弟輔爲廬陵太守，丹揚朱治爲吳郡太守。彭城張昭、廣陵張紘、秦松、陳端等，爲謀主。", "kakikudashi": "尽とく長吏を更置し、策、自ら会稽太守を領し、復た呉景を以て丹楊太守と為し、孫賁を以て豫章太守と為し、豫章を分ちて廬陵郡と為し、賁の弟の輔を以て廬陵太守と為し、丹揚の朱治を呉郡太守と為す。彭城の張昭・広陵の張紘・秦松・陳端等、謀主と為る。", "translation": "孫策は現地の県令・県長ら（長吏）をことごとく入れ替え、自ら会稽太守を兼任（領）し、再び呉景を丹陽太守とし、従兄の孫賁を豫章太守とし、豫章郡を分割して新たに廬陵郡を設置して孫賁の弟の孫輔を廬陵太守とし、丹陽出身の朱治を呉郡太守とした。そして彭城の張昭、広陵の張紘・秦松・陳端らを参謀の中心（謀主）に据えた。", "persons": "孫策,呉景,孫賁,孫輔,朱治,張昭,張紘,秦松,陳端", "places": "会稽,丹陽,豫章,廬陵,呉郡,彭城,広陵", "era_year": "建安元年〜2年（196年〜197年）", "source_book": "", "keywords": "県長,太守", "raw_tagged": "盡更置{{office:県長|長吏}}，{{person:孫策|策}}自領{{place:会稽|會稽}}{{office:太守|太守}}，復以{{person:呉景|吳景}}爲{{place:丹陽|丹楊}}{{office:太守|太守}}，以{{person:孫賁|孫賁}}爲{{place:豫章|豫章}}{{office:太守|太守}}，分{{place:豫章|豫章}}爲{{place:廬陵|廬陵}}郡，以{{person:孫賁|賁}}弟{{person:孫輔|輔}}爲{{place:廬陵|廬陵}}{{office:太守|太守}}，{{place:丹陽|丹揚}}{{person:朱治|朱治}}爲{{place:呉郡|吳郡}}{{office:太守|太守}}。{{place:彭城|彭城}}{{person:張昭|張昭}}、{{place:広陵|廣陵}}{{person:張紘|張紘}}、{{person:秦松|秦松}}、{{person:陳端|陳端}}等，爲謀主。", "kakikudashi_tagged": "尽とく{{office:県長|長吏}}を更置し、{{person:孫策|策}}、自ら{{place:会稽|会稽}}{{office:太守|太守}}を領し、復た{{person:呉景|呉景}}を以て{{place:丹陽|丹楊}}{{office:太守|太守}}と為し、{{person:孫賁|孫賁}}を以て{{place:豫章|豫章}}{{office:太守|太守}}と為し、{{place:豫章|豫章}}を分ちて{{place:廬陵|廬陵}}郡と為し、{{person:孫賁|賁}}の弟の{{person:孫輔|輔}}を以て{{place:廬陵|廬陵}}{{office:太守|太守}}と為し、{{place:丹陽|丹揚}}の{{person:朱治|朱治}}を{{place:呉郡|呉郡}}{{office:太守|太守}}と為す。{{place:彭城|彭城}}の{{person:張昭|張昭}}・{{place:広陵|広陵}}の{{person:張紘|張紘}}・{{person:秦松|秦松}}・{{person:陳端|陳端}}等、謀主と為る。", "translation_tagged": "{{person:孫策|孫策}}は現地の県令・{{office:県長|県長}}ら（{{office:県長|長吏}}）をことごとく入れ替え、自ら{{place:会稽|会稽}}{{office:太守|太守}}を兼任（領）し、再び{{person:呉景|呉景}}を{{place:丹陽|丹陽}}{{office:太守|太守}}とし、従兄の{{person:孫賁|孫賁}}を{{place:豫章|豫章}}{{office:太守|太守}}とし、{{place:豫章|豫章}}郡を分割して新たに{{place:廬陵|廬陵}}郡を設置して{{person:孫賁|孫賁}}の弟の{{person:孫輔|孫輔}}を{{place:廬陵|廬陵}}{{office:太守|太守}}とし、{{place:丹陽|丹陽}}出身の{{person:朱治|朱治}}を{{place:呉郡|呉郡}}{{office:太守|太守}}とした。そして{{place:彭城|彭城}}の{{person:張昭|張昭}}、{{place:広陵|広陵}}の{{person:張紘|張紘}}・{{person:秦松|秦松}}・{{person:陳端|陳端}}らを参謀の中心（謀主）に据えた。"}, {"id": "v46_p13_6", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 13, "type": "裴注", "raw_text": "《江表傳》曰：「策遣奉正都尉劉由、五官掾高承奉章詣許，拜獻方物。」", "kakikudashi": "『江表伝』に曰く、「策、奉正都尉劉由・五官掾高承を遣はし章を奉じて許に詣り、方物を拝献せしむ」と。", "translation": "『江表伝』にいう。「孫策は奉正都尉の劉由と五官掾の高承を使者として派遣し、上奏文（章）を奉じて帝都の許へ参内させ、江南の特産物（方物）を献上させた」。", "persons": "孫策,劉由,高承", "places": "許", "era_year": "建安元年〜2年（196年〜197年）", "source_book": "江表伝", "keywords": "都尉,五官掾", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫策|策}}遣{{office:都尉|奉正都尉}}{{person:劉由|劉由}}、{{office:五官掾|五官掾}}{{person:高承|高承}}奉章詣{{place:許|許}}，拜獻方物。」", "kakikudashi_tagged": "『{{special:引用史料|江表伝}}』に曰く、「{{person:孫策|策}}、{{office:都尉|奉正都尉}}{{person:劉由|劉由}}・{{office:五官掾|五官掾}}{{person:高承|高承}}を遣はし章を奉じて{{place:許|許}}に詣り、方物を拝献せしむ」と。", "translation_tagged": "『{{special:引用史料|江表伝}}』にいう。「{{person:孫策|孫策}}は{{office:都尉|奉正都尉}}の{{person:劉由|劉由}}と{{office:五官掾|五官掾}}の{{person:高承|高承}}を使者として派遣し、上奏文（章）を奉じて帝都の{{place:許|許}}へ参内させ、江南の特産物（方物）を献上させた」。"}, {"id": "v46_p14_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 14, "type": "本文", "raw_text": "時袁術僭號，策以書責而絶之。", "kakikudashi": "時に袁術、号を僭すれば、策、書を以て責めて之を絶つ。", "translation": "このころ、袁術が天子の号を僭称したため、孫策は書状を送ってその不義を責め、袁術と絶縁した。", "persons": "袁術,孫策", "places": "", "era_year": "建安2年（197年）", "source_book": "", "keywords": "", "raw_tagged": "時{{person:袁術|袁術}}僭號，{{person:孫策|策}}以書責而絶之。", "kakikudashi_tagged": "時に{{person:袁術|袁術}}、号を僭すれば、{{person:孫策|策}}、書を以て責めて之を絶つ。", "translation_tagged": "このころ、{{person:袁術|袁術}}が天子の号を僭称したため、{{person:孫策|孫策}}は書状を送ってその不義を責め、{{person:袁術|袁術}}と絶縁した。"}, {"id": "v46_p14_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 14, "type": "裴注", "raw_text": "《吳錄》載策使張紘爲書曰：「蓋上天垂司過之星，聖王建敢諫之鼓，設非謬之備，急箴闕之言，何哉？凡有所長，必有所短也。去冬傳有大計，無不悚懼；旋知供備貢獻，萬夫解惑。頃聞建議，復欲追遵前圖，卽事之期，便有定月。益使憮然，想是流妄；設其必爾，民何望乎？曩日之舉義兵也，天下之士所以響應者，董卓擅廢置，害太后、弘農王，略烝宮人，發掘園陵，暴逆至此，故諸州郡雄豪聞聲慕義。神武外振，卓遂內殲。元惡旣斃，幼主東顧，俾保傅宣命，欲令諸軍振旅，（於）河北通謀黑山，曹操放毒東徐，劉表稱亂南荆，公孫瓚炰烋北幽，劉繇決力江滸，劉備爭盟淮隅，是以未獲承命櫜弓戢戈也。今備繇旣破，操等飢餒，謂當與天下合謀，以誅醜類。舍而不圖，有自取之志，非海內所望，一也。昔成湯伐桀，稱有夏多罪；武王伐紂，曰殷有罪罰重哉。此二王者，雖有聖德，宜當君世；如使不遭其時，亦無繇興矣。幼主非有惡於天下，徒以春秋尙少，脅於強臣，若無過而奪之，懼未合於湯武之事，二也。卓雖狂狡，至廢主自與，亦猶未也，而天下聞其桀虐，攘臂同心而疾之，以中土希戰之兵，當邊地勁悍之虜，所以斯須遊魂也。今四方之人，皆玩敵而便戰鬬矣，可得而勝者，以彼亂而我治，彼逆而我順也。見當世之紛若，欲大舉以臨之，適足趣禍，三也。天下神器，不可虛干，必須天贊與人力也。殷湯有白鳩之祥，周武有赤烏之瑞，漢高有星聚之符，世祖有神光之徵，皆因民困悴於桀紂之政，毒苦於秦莽之役，故能芟去無道，致成其志。今天下非患於幼主，未見受命之應驗，而欲一旦卒然登卽尊號，未之或有，四也。天子之貴，四海之富，誰不欲焉？義不可，勢不得耳。陳勝、項籍、王莽、公孫述之徒，皆南面稱孤，莫之能濟。帝王之位，不可橫冀，五也。幼主岐嶷，若除其偪，去其鯁，必成中興之業。夫致主於周成之盛，自受旦奭之美，此誠所望於尊明也。縱使幼主有他改異，猶望推宗室之譜屬，論近親之賢良，以紹劉統，以固漢宗。皆所以書功金石，圖形丹靑，流慶無窮，垂聲管紘。舍而不爲，爲其難者，想明明之素，必所不忍，六也。五世爲相，權之重，勢之盛，天下莫得而比焉。忠貞者必曰宜夙夜思惟，所以扶國家之躓頓，念社稷之危殆，以奉祖考之志，以報漢室之恩。其忽履道之節而強進取之欲者，將曰天下之人非家吏則門生也，孰不從我？四方之敵非吾匹則吾役也，誰能違我？盍乘累世之勢，起而取之哉？二者殊數，不可不詳察，七也。所貴於聖哲者，以其審於機宜，愼於舉措。若難圖之事，難保之勢，以激群敵之氣，以生衆人之心，公義故不可，私計又不利，明哲不處，八也。世人多惑於圖緯而牽非類，比合文字以悅所事，苟以阿上惑衆，終有後悔者，自往迄今，未嘗無之，不可不深擇而熟思，九也。九者，尊明所見之餘耳，庶備起予，補所遺忘。忠言逆耳，幸留神聽！」《典略》云張昭之辭。臣松之以爲張昭雖名重，然不如紘之文也，此書必紘所作。", "kakikudashi": "『呉録』に策が張紘をして書を為らしむるを載せて曰く、「蓋し上天は過ちを司るの星を垂れ、聖王は敢諫の鼓を建て、非謬の備へを設け、箴闕の言を急にするは、何ぞや？凡そ長ずる所有れば、必ず短なる所有ればなり。去冬、大計有りと伝へられ、悚懼せざるは無く、旋りて供備して貢献するを知り、万夫、惑ひを解く。頃ごろ聞くならく、議を建て、復た前図を追遵せんと欲し、即事の期、便ち定月有りと。益ます憮然たらしむも、想ふに是れ流妄ならん。設し其れ必ず爾らば、民は何をか望まんや？曩日の義兵を挙ぐるや、天下の士の響応する所以の者は、董卓が廃置を擅にし、太后・弘農王を害し、宮人を略烝し、園陵を発掘し、暴逆此に至る、故に諸州郡の雄豪、声を聞きて義を慕へばなり。神武外に振ひ、卓は遂に内に殲く。元悪既に斃れ、幼主東顧し、保傅をして命を宣べしめ、諸軍をして旅を振めしめんと欲するも、河北は謀を黒山に通じ、曹操は毒を東徐に放ち、劉表は乱を南荊に称へ、公孫瓚は北幽に炰烋し、劉繇は力を江滸に決し、劉備は盟を淮隅に争ひ、是を以て未だ命を承けて弓を櫜め戈を戢むるを得ざるなり。今、備・繇は既に破れ、操等は飢餒すれば、謂へらく当に天下と謀を合はせ、以て醜類を誅すべしと。舎てて図らず、自ら取るの志有るは、海内の望む所に非ざる、一なり。昔、成湯の桀を伐つや、有夏に罪多しと称し、武王の紂を伐つや、殷に罪有りて罰重きかなと曰ふ。此の二王なる者は、聖徳有りと雖も、宜しく当に世に君たるべきも、如し其の時に遭はざらしめば、亦た興るに繇無きなり。幼主は天下に悪有るに非ず、徒だ春秋尚ほ少きを以て、強臣に脅かさるるのみ、若し過ち無きに之を奪はば、懼らくは未だ湯・武の事に合はざらん、二なり。卓は狂狡なりと雖も、主を廃して自ら与するに至りては、亦た猶ほ未だしきなり、而るに天下は其の桀虐を聞き、臂を攘ひ心を同じくして之を疾み、中土の希に戦ふの兵を以て、辺地の勁悍の虜に当る、斯須にして遊魂となる所以なり。今、四方の人、皆敵に玩れて戦闘に便なり、得て勝つべき者は、彼の乱れて我が治まり、彼の逆にして我が順なるを以てなり。当世の紛若たるを見、大挙して以て之に臨まんと欲するは、適ま禍ひに趣くに足る、三なり。天下は神器なり、虚しく干すべからず、必ず天の賛と人の力とを須つなり。殷湯に白鳩の祥有り、周武に赤烏の瑞有り、漢高に星聚の符有り、世祖に神光の徴有り、皆民の桀・紂の政に困悴し、秦・莽の役に毒苦するに因る、故に能く無道を芟り去り、其の志を致し成せり。今、天下は幼主に患苦するに非ず、未だ受命の応験を見ず、而るに一旦卒然として尊号に登即せんと欲するは、未だ之れ有らざる、四なり。天子の貴き、四海の富める、誰か焉を欲せざらん？義として不可、勢として得ざるのみ。陳勝・項籍・王莽・公孫述の徒、皆南面して孤と称するも、之れ能く済す莫し。帝王の位は、横しまに冀ふべからざる、五なり。幼主は岐嶷なれば、若し其の偪を除き、其の鯁を去らば、必ず中興の業を成さん。夫れ主を周成の盛んなるに致し、自ら旦・奭の美を受くるは、此れ誠に尊明に望む所なり。縦使ひ幼主に他の改異有りとも、猶ほ望むらくは宗室の譜属を推して、近親の賢良を論じ、以て劉統を紹がしめ、以て漢宗を固めんことを。皆功を金石に書し、形を丹青に図し、慶びを無窮に流し、声を管紘に垂るる所以なり。舎てて為さず、其の難き者を為すは、想ふに明明の素、必ず忍びざる所ならん、六なり。五世相と為り、権の重き、勢の盛んなる、天下に得て比する莫し。忠貞なる者は必ず曰はん、宜しく夙夜に思惟し、国家の躓頓を扶くる所以、社稷の危殆を念ひ、以て祖考の志を奉じ、以て漢室の恩に報ゆべしと。其の履道の節を忽せにして進取の欲を強ふる者は、将に曰はんとす、天下の人は家吏に非ざれば則ち門生なり、孰か我に従はざらん？四方の敵は吾が匹に非ざれば則ち吾が役なり、誰か能く我に違はん？盍ぞ累世の勢に乗じ、起ちて之を取らざるやと。二者は数を殊にす、詳察せざるべからざる、七なり。聖哲に貴ぶ所の者は、其の機宜に審らかにし、挙措に慎むを以てなり。若し図り難きの事、保ち難きの勢を以て、群敵の気を激し、衆人の心を生ぜしむるは、公義も故より不可、私計も又た利あらず、明哲は処らざる、八なり。世人多く図緯に惑ひて非類を牽き、文字を比合して以て事ふる所を悦ばしめ、苟くも上におもねり衆を惑はすを以て、終に後悔有る者は、往より今に迄るまで、未だ嘗て之れ無くばあらず、深く択びて熟思せざるべからざる、九なり。九つの者は、尊明の見る所の余のみ、庶はくは起予に備へ、遺忘する所を補はんことを。忠言は耳に逆らふも、幸はくは神聴を留めよ！」と。『典略』に張昭の辞と云ふ。臣松之おもへらく、張昭は名重しと雖も、然れども紘の文に如かざるなり、此の書は必ず紘の作る所ならん。", "translation": "『呉録』に、孫策が張紘に起草させた袁術への絶縁状を載せていう。「そもそも上天が過失を監視する星（妖星・客星）を垂れ示し、いにしえの聖王が誰でも諫言できる太鼓（敢諫の鼓）を宮門に据え置いて、過ちに対する備えを設け、欠点を戒める言葉を急ぎ求めたのは、なぜでしょうか？およそ長所がある者には、必ず短所もあるからでございます。去年の冬、明公（袁術）に『重大なご計画（帝号僭称）』があるとの噂が伝わった際、恐れおののかぬ者はおりませんでしたが、まもなく朝廷への貢物を準備しておられると知り、万人は疑念を解きました。ところが最近聞くところでは、再び建議をなされ、先の計画を推し進めようとされており、即位の期日についてもすでに具体的な月まで決まっているとのことです。これを聞いてますます暗然たる思いに駆られておりますが、おそらくは根も葉もない流言飛語の類でありましょう。万が一にもそれが事実であるならば、天下の民衆はいったい何に希望を託せばよいのでしょうか？先年、私どもが義兵を挙げましたとき、天下の士がこぞって呼応いたしましたのは、董卓がほしいままに天子の廃立を行い、何太后と弘農王（少帝・劉弁）を弑害し、宮女を略奪して凌辱し、歴代皇帝の陵墓（園陵）を暴いて盗掘するなど、その暴逆が極みに達していたからこそ、諸州郡の英雄・豪傑たちが掛け声を聞いて正義を慕い集まったのでございます。かくて神武の威が外に振るわれ、董卓はついに朝廷の内で滅び去りました。大悪の首魁（董卓）がすでに斃れ、若き天子（献帝）が東方の諸将を頼りに振り返り、太傅（馬日磾）らを遣わして勅命を宣べ伝え、諸軍を収めて凱旋させようとなさいましたが、河北（冀州）では袁紹らが黒山賊と通謀して争い、曹操は東方の徐州で虐殺の毒を撒き散らし、劉表は南方の荊州で反乱を構え、公孫瓚は北方の幽州で猛り狂い、劉繇は長江のほとり（江滸）で死力を尽くして抗戦し、劉備は淮水のほとり（淮隅）で盟主の座を争っていたため、いまだ勅命を奉じて弓を袋に収め矛を伏せることができないでいるのです。いま劉備と劉繇はすでに撃破され、曹操らも飢饉に苦しんでおりますから、今こそ天下の諸侯と力を合わせ、残る逆賊どもを誅滅すべき時でございます。しかるにそれを放置して顧みず、自ら帝位を簒奪しようとする志を抱かれるのは、天下万民が望むところではございません。これが第一の理由です。むかし殷の湯王（成湯）が夏の桀王を討った際には『夏王に多くの罪がある』と宣言し、周の武王が殷の紂王を討った際には『殷王の罪は重く罰せねばならぬ』と宣言いたしました。この二人の王（湯王・武王）は聖徳を備え、当然ながら天下の君主となるべき器でしたが、もし暴君の時代という好機に巡り合わなければ、やはり王業を興す由（よし）はなかったのです。いま若き天子（献帝）は天下に対して何ら悪事を働いておられず、ただご年齢がまだお若いために強臣どもに脅かされているにすぎません。もし天子に何の過失もないのにその帝位を奪うならば、湯王・武王の義挙とは合致しないのではないかと危惧いたします。これが第二の理由です。かの董卓はいかに狂暴で狡猾であったとはいえ、天子を廃して自ら帝位に即くことまでは、さすがに敢行いたしませんでした。それでもなお天下の人々は董卓の桀王にも等しい暴虐を聞いて、腕をまくって心を一つにしてこれを憎み、戦いに不慣れな中原の兵をもって辺境の精強獰猛な敵に立ち向かったのであり、それゆえ董卓はたちまちのうちに滅びてさまよう亡霊（遊魂）となったのです。いま四方の人々はみな戦いに習熟し、実戦に長けております。その中にあって我々が勝利を収め得るのは、敵が乱れていて我々が治まっており、敵が逆賊で我々が順当（大義の側）にあるからです。当世の混乱ぶりを見て、大軍を動かして無理やり帝位に臨もうとされるのは、かえって自ら災禍へ突き進むようなものでございます。これが第三の理由です。天下というものは神聖な器（神器）であり、根拠もなくみだりに犯し求められるものではなく、必ず天の助けと人の力との両方を待たねばなりません。殷の湯王には白い鳩の吉兆があり、周の武王には赤い烏の瑞祥があり、漢の高祖（劉邦）には五星が集まる符瑞があり、後漢の世祖（光武帝）には神秘的な光の徴候がございましたが、それらはいずれも民衆が桀王・紂王の暴政に苦しみ果て、秦（始皇帝）や王莽の苛酷な労役に塗炭 書必{{person:張紘|紘}}所作。", "kakikudashi_tagged": "『{{special:引用史料|呉録}}』に{{person:孫策|策}}が{{person:張紘|張紘}}をして書を為らしむるを載せて曰く、「蓋し上天は過ちを司るの星を垂れ、聖王は敢諫の鼓を建て、非謬の備へを設け、箴闕の言を急にするは、何ぞや？凡そ長ずる所有れば、必ず短なる所有ればなり。去冬、大計有りと伝へられ、悚懼せざるは無く、旋りて供備して貢献するを知り、万夫、惑ひを解く。頃ごろ聞くならく、議を建て、復た前図を追遵せんと欲し、即事の期、便ち定月有りと。益ます憮然たらしむも、想ふに是れ流妄ならん。設し其れ必ず爾らば、民は何をか望まんや？曩日の{{special:義兵|義兵}}を挙ぐるや、天下の士の響応する所以の者は、{{person:董卓|董卓}}が廃置を擅にし、{{person:何太后|太后}}・{{person:劉弁|弘農王}}を害し、宮人を略烝し、{{special:園陵|園陵}}を発掘し、暴逆此に至る、故に諸州郡の雄豪、声を聞きて義を慕へばなり。神武外に振ひ、{{person:董卓|卓}}は遂に内に殲く。元悪既に斃れ、{{person:献帝|幼主}}東顧し、保傅をして命を宣べしめ、諸軍をして旅を振めしめんと欲するも、{{place:冀州|河北}}は謀を{{special:黒山|黒山}}に通じ、{{person:曹操|曹操}}は毒を{{place:徐州|東徐}}に放ち、{{person:劉表|劉表}}は乱を{{place:荊州|南荊}}に称へ、{{person:公孫瓚|公孫瓚}}は{{place:幽州|北幽}}に炰烋し、{{person:劉繇|劉繇}}は力を{{special:江滸|江滸}}に決し、{{person:劉備|劉備}}は盟を{{special:淮隅|淮隅}}に争ひ、是を以て未だ命を承けて弓を櫜め戈を戢むるを得ざるなり。今、{{person:劉備|備}}・{{person:劉繇|繇}}は既に破れ、{{person:曹操|操}}等は飢餒すれば、謂へらく当に天下と謀を合はせ、以て醜類を誅すべしと。舎てて図らず、自ら取るの志有るは、海内の望む所に非ざる、一なり。昔、{{person:湯王|成湯}}の{{person:桀|桀}}を伐つや、有夏に罪多しと称し、{{person:武王|武王}}の{{person:紂|紂}}を伐つや、殷に罪有りて罰重きかなと曰ふ。此の二王なる者は、聖徳有りと雖も、宜しく当に世に君たるべきも、如し其の時に遭はざらしめば、亦た興るに繇無きなり。{{person:献帝|幼主}}は天下に悪有るに非ず、徒だ春秋尚ほ少きを以て、強臣に脅かさるるのみ、若し過ち無きに之を奪はば、懼らくは未だ{{person:湯王|湯}}・{{person:武王|武}}の事に合はざらん、二なり。{{person:董卓|卓}}は狂狡なりと雖も、主を廃して自ら与するに至りては、亦た猶ほ未だしきなり、而るに天下は其の桀虐を聞き、臂を攘ひ心を同じくして之を疾み、中土の希に戦ふの兵を以て、辺地の勁悍の虜に当る、斯須にして遊魂となる所以なり。今、四方の人、皆敵に玩れて戦闘に便なり、得て勝つべき者は、彼の乱れて我が治まり、彼の逆にして我が順なるを以てなり。当世の紛若たるを見、大挙して以て之に臨まんと欲するは、適ま禍ひに趣くに足る、三なり。天下は神器なり、虚しく干すべからず、必ず天の賛と人の力とを須つなり。{{person:湯王|殷湯}}に{{special:白鳩之祥|白鳩の祥}}有り、{{person:武王|周武}}に{{special:赤烏之瑞|赤烏の瑞}}有り、{{person:劉邦|漢高}}に{{special:星聚之符|星聚の符}}有り、{{person:光武帝|世祖}}に{{special:神光之徴|神光の徴}}有り、皆民の{{person:桀|桀}}・{{person:紂|紂}}の政に困悴し、{{person:始皇帝|秦}}・{{person:王莽|莽}}の役に毒苦するに因る、故に能く無道を芟り去り、其の志を致し成せり。今、天下は{{person:献帝|幼主}}に患苦するに非ず、未だ受命の応験を見ず、而るに一旦卒然として尊号に登即せんと欲するは、未だ之れ有らざる、四なり。天子の貴き、四海の富める、誰か焉を欲せざらん？義として不可、勢として得ざるのみ。{{person:陳勝|陳勝}}・{{person:項羽|項籍}}・{{person:王莽|王莽}}・{{person:公孫述|公孫述}}の徒、皆南面して孤と称するも、之れ能く済す莫し。帝王の位は、横しまに冀ふべからざる、五なり。{{person:献帝|幼主}}は岐嶷なれば、若し其の偪を除き、其の鯁を去らば、必ず中興の業を成さん。夫れ主を{{person:成王|周成}}の盛んなるに致し、自ら{{person:周公旦|旦}}・{{person:召公奭|奭}}の美を受くるは、此れ誠に尊明に望む所なり。縦使ひ{{person:献帝|幼主}}に他の改異有りとも、猶ほ望むらくは宗室の譜属を推して、近親の賢良を論じ、以て劉統を紹がしめ、以て漢宗を固めんことを。皆功を金石に書し、形を丹青に図し、慶びを無窮に流し、声を管紘に垂るる所以なり。舎てて為さず、其の難き者を為すは、想ふに明明の素、必ず忍びざる所ならん、六なり。五世相と為り、権の重き、勢の盛んなる、天下に得て比する莫し。忠貞なる者は必ず曰はん、宜しく夙夜に思惟し、国家の躓頓を扶くる所以、{{special:社稷|社稷}}の危殆を念ひ、以て祖考の志を奉じ、以て漢室の恩に報ゆべしと。其の履道の節を忽せにして進取の欲を強ふる者は、将に曰はんとす、天下の人は家吏に非ざれば則ち門生なり、孰か我に従はざらん？四方の敵は吾が匹に非ざれば則ち吾が役なり、誰か能く我に違はん？盍ぞ累世の勢に乗じ、起ちて之を取らざるやと。二者は数を殊にす、詳察せざるべからざる、七なり。聖哲に貴ぶ所の者は、其の機宜に審らかにし、挙措に慎むを以てなり。若し図り難きの事、保ち難きの勢を以て、群敵の気を激し、衆人の心を生ぜしむるは、公義も故より不可、私計も又た利あらず、明哲は処らざる、八なり。世人多く{{special:図緯|図緯}}に惑ひて非類を牽き、文字を比合して以て事ふる所を悦ばしめ、苟くも上におもねり衆を惑はすを以て、終に後悔有る者は、往より今に迄るまで、未だ嘗て之れ無くばあらず、深く択びて熟思せざるべからざる、九なり。九つの者は、尊明の見る所の余のみ、庶はくは起予に備へ、遺忘する所を補はんことを。{{special:忠言逆耳|忠言は耳に逆らふ}}も、幸はくは神聴を留めよ！」と。『{{special:引用史料|典略}}』に{{person:張昭|張昭}}の辞と云ふ。{{person:裴松之|臣松之}}おもへらく、{{person:張昭|張昭}}は名重しと雖も、然れども{{person:張紘|紘}}の文に如かざるなり、此の書は必ず{{person:張紘|紘}}の作る所ならん。", "translation_tagged": "『{{special:引用史料|呉録}}』に、{{person:孫策|孫策}}が{{person:張紘|張紘}}に起草させた{{person:袁術|袁術}}への絶縁状を載せていう。「そもそも上天が過失を監視する星（妖星・客星）を垂れ示し、いにしえの聖王が誰でも諫言できる太鼓（敢諫の鼓）を宮門に据え置いて、過ちに対する備えを設け、欠点を戒める言葉を急ぎ求めたのは、なぜでしょうか？およそ長所がある者には、必ず短所もあるからでございます。去年の冬、明公（{{person:袁術|袁術}}）に『重大なご計画（帝号僭称）』があるとの噂が伝わった際、恐れおののかぬ者はおりませんでしたが、まもなく朝廷への貢物を準備しておられると知り、万人は疑念を解きました。ところが最近聞くところでは、再び建議をなされ、先の計画を推し進めようとされており、即位の期日についてもすでに具体的な月まで決まっているとのことです。これを聞いてますます暗然たる思いに駆られておりますが、おそらくは根も葉もない流言飛語の類でありましょう。万が一にもそれが事実であるならば、天下の民衆はいったい何に希望を託せばよいのでしょうか？先年、私どもが{{special:義兵|義兵}}を挙げましたとき、天下の士がこぞって呼応いたしましたのは、{{person:董卓|董卓}}がほしいままに天子の廃立を行い、{{person:何太后|何太后}}と{{person:劉弁|弘農王}}（少帝・{{person:劉弁|劉弁}}）を弑害し、宮女を略奪して凌辱し、歴代皇帝の陵墓（{{special:園陵|園陵}}）を暴いて盗掘するなど、その暴逆が極みに達していたからこそ、諸州郡の英雄・豪傑たちが掛け声を聞いて正義を慕い集まったのでございます。かくて神武の威が外に振るわれ、{{person:董卓|董卓}}はついに朝廷の内で滅び去りました。大悪の首魁（{{person:董卓|董卓}}）がすでに斃れ、若き天子（{{person:献帝|献帝}}）が東方の諸将を頼りに振り返り、{{office:太傅|太傅}}（{{person:馬日磾|馬日磾}}）らを遣わして勅命を宣べ伝え、諸軍を収めて凱旋させようとなさいましたが、{{place:冀州|河北}}（{{place:冀州|冀州}}）では{{person:袁紹|袁紹}}らが{{special:黒山|黒山賊}}と通謀して争い、{{person:曹操|曹操}}は東方の{{place:徐州|徐州}}で虐殺の毒を撒き散らし、{{person:劉表|劉表}}は南方の{{place:荊州|荊州}}で反乱を構え、{{person:公孫瓚|公孫瓚}}は北方の{{place:幽州|幽州}}で猛り狂い、{{person:劉繇|劉繇}}は{{place:長江|長江}}のほとり（{{special:江滸|江滸}}）で死力を尽くして抗戦し、{{person:劉備|劉備}}は{{place:淮水|淮水}}のほとり（{{special:淮隅|淮隅}}）で盟主の座を争っていたため、いまだ勅命を奉じて弓を袋に収め矛を伏せることができないでいるのです。いま{{person:劉備|劉備}}と{{person:劉繇|劉繇}}はすでに撃破され、{{person:曹操|曹操}}らも飢饉に苦しんでおりますから、今こそ天下の諸侯と力を合わせ、残る逆賊どもを誅滅すべき時でございます。しかるにそれを放置して顧みず、自ら帝位を簒奪しようとする志を抱かれるのは、天下万民が望むところではございません。これが第一の理由です。むかし{{person:湯王|殷の湯王}}（{{person:湯王|成湯}}）が夏の{{person:桀|桀王}}を討った際には『夏王に多くの罪がある』と宣言し、{{person:武王|周の武王}}が殷の{{person:紂|紂王}}を討った際には『殷王の罪は重く罰せねばならぬ』と宣言いたしました。この二人の王（{{person:湯王|湯王}}・{{person:武王|武王}}）は聖徳を備え、当然ながら天下の君主となるべき器でしたが、もし暴君の時代という好機に巡り合わなければ、やはり王業を興す由（よし）はなかったのです。いま若き天子（{{person:献帝|献帝}}）は天下に対して何ら悪事を働いておられず、ただご年齢がまだお若いために強臣どもに脅かされているにすぎません。もし天子に何の過失もないのにその帝位を奪うならば、{{person:湯王|湯王}}・{{person:武王|武王}}の義挙とは合致しないのではないかと危惧いたします。これが第二の理由です。かの{{person:董卓|董卓}}はいかに狂暴で狡猾であったとはいえ、天子を廃して自ら帝位に即くことまでは、さすがに敢行いたしませんでした。それでもなお天下の人々は{{person:董卓|董卓}}の{{person:桀|桀王}}にも等しい暴虐を聞いて、腕をまくって心を一つにしてこれを憎み、戦いに不慣れな中原の兵をもって辺境の精強獰猛な敵に立ち向かったのであり、それゆえ{{person:董卓|董卓}}はたちまちのうちに滅びてさまよう亡霊（遊魂）となったのです。いま四方の人々はみな戦いに習熟し、実戦に長けております。その中にあって我々が勝利を収め得るのは、敵が乱れていて我々が治まっており、敵が逆賊で我々が順当（大義の側）にあるからです。当世の混乱ぶりを見て、大軍を動かして無理やり帝位に臨もうとされるのは、かえって自ら災禍へ突き進むようなものでございます。これが第三の理由です。天下というものは神聖な器（神器）であり、根拠もなくみだりに犯し求められるものではなく、必ず天の助けと人の力との両方を待たねばなりません。{{person:湯王|殷の湯王}}には{{special:白鳩之祥|白い鳩の吉兆}}があり、{{person:武王|周の武王}}には{{special:赤烏之瑞|赤い烏の瑞祥}}があり、{{person:劉邦|漢の高祖}}（{{person:劉邦|劉邦}}）には{{special:星聚之符|五星が集まる符瑞}}があり、後漢の{{person:光武帝|世祖}}（{{person:光武帝|光武帝}}）には{{special:神光之徴|神秘的な光の徴候}}がございましたが、それらはいずれも民衆が{{person:桀|桀王}}・{{person:紂|紂王}}の暴政に苦しみ果て、秦（{{person:始皇帝|始皇帝}}）や{{person:王莽|王莽}}の苛酷な労役に塗炭の苦しみを味わっていたからこそ、無道の支配者を刈り除いて帝業を成し遂げることができたのです。いま天下の民は若き天子に苦しめられているわけではなく、明公に天命が下ったという確かな徴候も見られないのに、ある日突然に天子の尊号に即こうとされるのは、前代未聞のことでございます。これが第四の理由です。天子の尊貴な地位、四海の富を、誰が欲しないでしょうか？ただ道義において許されず、情勢において不可能だから手を出さないだけなのです。{{person:陳勝|陳勝}}・{{person:項羽|項籍}}（{{person:項羽|項羽}}）・{{person:王莽|王莽}}・{{person:公孫述|公孫述}}の輩は、みな南面して王侯・天子を称しましたが、誰一人として大業を成し遂げることはできませんでした。帝王の地位は、よこしまに望んではならないものです。これが第五の理由です。若き天子は幼くして聡明（岐嶷）であられますから、もしその周囲で脅威となっている奸臣どもを取り除き、喉に刺さった骨のような障害を取り去ったならば、必ずや漢王朝中興の大業を成し遂げられるでしょう。主君を{{person:成王|周の成王}}のような隆盛へと導き、ご自身は{{person:周公旦|周公旦}}・{{person:召公奭|召公奭}}のような美名をお受けになること、これこそ誠に明公（尊明）に待ち望まれていることでございます。たとえ万が一、若き天子に不測の変事があったとしても、やはり漢の宗室の系譜を推し尋ねて、近親の中から賢良な人物を選んで劉氏の血統を継がせ、漢王朝の宗廟を固めるべきでございます。そうしてこそ、功績を金属や石碑に刻み、姿を宮殿の壁画（丹青）に描かれ、慶福を永遠に流し伝え、名声を音楽（管紘）に乗せて後世まで響かせることができるのです。この容易で輝かしい道を捨てて顧みず、あえて困難で危うい簒奪の道を為そうとされるのは、明公の平素の聡明さからして、必ずや忍びないところであろうと存じます。これが第六の理由です。明公のご一族は五代にわたり宰相（三公）を輩出され、その権威の重さ、勢力の盛んなることは、天下に肩を並べる者がおりません。忠貞の士であれば必ずこう申すでしょう。『朝早くから夜遅くまで思いを巡らし、国家のつまずきを助け起こし、{{special:社稷|社稷}}の危機を憂慮して、ご先祖（祖考）の志を受け継ぎ、漢王室の恩義に報いるべきである』と。一方で、正しい道義の節操を軽んじて無理な野心を煽る者は、きっとこう申すでしょう。『天下の人々は袁家の旧臣（家吏）でなければ門下生（門生）なのだから、誰が我々に従わないだろうか？四方の敵は我々の好敵手でなければ我々の下僕なのだから、誰が我々に逆らえようか？どうして累代の威勢に乗じて、立ち上がって天下を奪い取らないのか』と。この二つの意見は全く結末を異にするものであり、詳しく見極めないわけにはまいりません。これが第七の理由です。聖人・哲人が尊ばれるゆえんは、時機のよしあしを的確に見極め、行動（挙措）を慎むところにあります。もし実現困難な事業、維持しがたい体勢をもって、群がる敵の戦意を刺激し、多くの人々の離反の心を生じさせるならば、公の大義において許されないばかりか、個人の損得（私計）から見ても不利益であり、聡明な哲人は決してそのような立場には身を置きません。これが第八の理由です。世の人々はとかく予言書（{{special:図緯|図緯}}）の言葉に惑わされて無関係な事柄をこじつけ、文字を無理やり組み合わせて主君を喜ばせようとしますが、目先のへつらいで主君に阿り衆人を惑わせた結果、最後に取り返しのつかない後悔に終わった者は、古来より今日に至るまで枚挙にいとまがなく、深く選び取って熟慮しないわけにはまいりません。これが第九の理由です。以上九つの条々は、明公がすでにご承知の事柄の補足にすぎませんが、どうか明公のお考えを触発する一助（起予）となり、見落とされている点を補うことができればと願っております。{{special:忠言逆耳|忠言は耳に逆らう}}ものでございますが、どうかお心に留めてお聞き届けください！」。『{{special:引用史料|典略}}』には、この書状は{{person:張昭|張昭}}が起草した文章であると記す。しかし臣{{person:裴松之|裴松之}}が考えるに、{{person:張昭|張昭}}は名声こそ重かったものの、文章の才においては{{person:張紘|張紘}}に及ばなかったから、この書状は間違いなく{{person:張紘|張紘}}が作ったものである。"}, {"id": "v46_p15_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 15, "type": "本文", "raw_text": "曹公表策爲討逆將軍，封爲吳侯。", "kakikudashi": "曹公、策を表して討逆将軍と為し、封じて呉侯と為す。", "translation": "曹公（曹操）は上表して孫策を討逆将軍とし、呉侯に封じた。", "persons": "曹操,孫策", "places": "呉郡", "era_year": "建安2年〜3年（197年〜198年）", "source_book": "", "keywords": "雑号将軍,列侯", "raw_tagged": "{{person:曹操|曹公}}表{{person:孫策|策}}爲{{office:雑号将軍|討逆將軍}}，封爲{{place:呉郡|吳}}{{office:列侯|侯}}。", "kakikudashi_tagged": "{{person:曹操|曹公}}、{{person:孫策|策}}を表して{{office:雑号将軍|討逆将軍}}と為し、封じて{{place:呉郡|呉}}{{office:列侯|侯}}と為す。", "translation_tagged": "{{person:曹操|曹公}}（{{person:曹操|曹操}}）は上表して{{person:孫策|孫策}}を{{office:雑号将軍|討逆将軍}}とし、{{place:呉郡|呉}}{{office:列侯|侯}}に封じた。"}, {"id": "v46_p15_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 15, "type": "裴注", "raw_text": "《江表傳》曰：「建安二年夏，漢朝遣議郎王誧奉戊辰詔書曰：『董卓逆亂，凶國害民。先將軍堅念在平討，雅意未遂，厥美著聞。策遵善道，求福不回。今以策爲騎都尉，襲爵烏程侯，領會稽太守。』又詔敕曰：『故左將軍袁術不顧朝恩，坐創凶逆，造合虛僞，欲因兵亂，詭詐百姓，聞其言以爲不然。定得使持節、平東將軍、領徐州牧、温侯布上術所造惑衆妖妄，知術鴟梟之性，遂其無道，修治王宮，署置公卿，郊天祀地，殘民害物，爲禍深酷。布前後上策乃心本朝，欲還討術，爲國效節，乞加顯異。夫縣賞俟功，惟勤是與，故便寵授，承襲前邑，重以大郡，榮耀兼至，是策輸力竭命之秋也。其亟與布及行吳郡太守、安東將軍陳瑀戮力一心，同時赴討。』策自以統領兵馬，但以騎都尉領郡爲輕，欲得將軍號，（及）使人諷誧，誧便承制假策明漢將軍。是時，陳瑀屯海西，策奉詔治嚴，當與布瑀參同形勢。行到錢塘，瑀陰圖襲策，遣都尉萬演等密渡江，使持印傳三十餘紐與賊丹楊、宣城、涇、陵陽、始安、黟、歙諸險縣大帥祖郎、焦已及吳郡烏程嚴白虎等，使爲內應，伺策軍發，欲攻取諸郡。策覺之，遣呂範、徐逸攻瑀於海西，大破瑀，獲其吏士妻子四千人。《山陽公載記》曰：『瑀單騎走冀州，自歸袁紹，紹以爲故安都尉。』《吳錄》載策上表謝曰：『臣以固陋，孤持邊陲。陛下廣播高澤，不遺細節，以臣襲爵，兼典名郡。仰榮顧寵，所不克堪。興平二年十二月二十日，於吳郡曲阿得袁術所呈表，以臣行殄寇將軍；至被詔書，乃知詐擅。雖輒捐廢，猶用悚悸。臣年十七，喪失所怙，懼有不任堂構之鄙，以忝析薪之戒，誠無去病十八建功，世祖列將弱冠佐命。臣初領兵，年未弱冠，雖駑懦不武，然思竭微命。惟術狂惑，爲惡深重。臣憑威靈，奉辭罰罪，庶必獻捷，以報所授。』臣松之案：本傳云孫堅以初平三年卒，策以建安五年卒，策死時年二十六，計堅之亡，策應十八，而此表云十七，則爲不符。張璠《漢紀》及《吳歷》並以堅初平二年死，此爲是而本傳誤也。《江表傳》曰：『建安三年，策又遣使貢方物，倍於元年所獻。其年，制書轉拜討逆將軍，改封吳侯。』", "kakikudashi": "『江表伝』に曰く、「建安二年夏、漢朝、議郎王誧を遣はし戊辰の詔書を奉ぜしめて曰く、『董卓逆乱し、国を凶し民を害す。先将軍堅、念ひは平討に在るも、雅意未だ遂げず、厥の美は著聞す。策は善道に遵ひ、福を求めて回らず。今、策を以て騎都尉と為し、爵烏程侯を襲ぎ、会稽太守を領せしむ』と。又た詔勅して曰く、『故の左将軍袁術、朝恩を顧みず、坐して凶逆を創め、虚偽を造合し、兵乱に因りて、百姓を詭詐せんと欲するも、其の言を聞きて以て然らずと為せり。定めて使持節・平東将軍・領徐州牧・温侯布が、術の造る所の衆を惑はすの妖妄を上るを得て、術が鴟梟の性にして、其の無道を遂げ、王宮を修治し、公卿を署置し、天を郊し地を祀り、民を残なひ物を害し、禍ひを為すこと深酷なるを知る。布、前後に策が本朝に乃心し、還りて術を討ち、国の為に節を効さんと欲するを上り、顕異を加へんと乞ふ。夫れ賞を懸けて功を俟ち、惟だ勤に是れ与す、故に便ち寵授し、前邑を承襲し、重ぬるに大郡を以てし、栄耀兼ね至る、是れ策が力を輸し命を竭すの秋なり。其れ亟かに布及び行呉郡太守・安東将軍陳瑀と力を戮せ心を一つにし、同時に赴き討て』と。策、自ら兵馬を統領するに、但だ騎都尉もて郡を領するを以て軽しと為し、将軍号を得んと欲し、人をして誧に諷せしむれば、誧、便ち制を承けて策に明漢将軍を仮す。是の時、陳瑀は海西に屯し、策、詔を奉じて治厳し、当に布・瑀と形勢を参同すべし。行きて銭塘に到るや、瑀、陰かに策を襲はんと図り、都尉万演等を遣はして密かに江を渡らしめ、印伝三十余紐を持ちて賊の丹楊・宣城・涇・陵陽・始安・黟・歙の諸険県の大帥祖郎・焦已及び呉郡烏程の厳白虎等に与へ、内応を為さしめ、策の軍の発するを伺ひ、諸郡を攻め取らんと欲す。策、之を覚り、呂範・徐逸を遣はして瑀を海西に攻めしめ、大いに瑀を破り、其の吏士・妻子四千人を獲たり」と。『山陽公載記』に曰く、「瑀、単騎にて冀州に走り、自ら袁紹に帰すれば、紹、以て故安都尉と為す」と。『呉録』に策が上表して謝するを載せて曰く、「臣、固陋を以て、孤り辺陲を持す。陛下、広く高沢を播き、細節を遺れず、臣を以て爵を襲ぎ、兼ねて名郡を典らしむ。栄を仰ぎ寵を顧みるに、克く堪ふる所に非ず。興平二年十二月二十日、呉郡曲阿に於て袁術が呈する所の表を得たるに、臣を以て行殄寇将軍と為すも、詔書を被るに至り、乃ち詐擅を知る。輒ち捐廃すと雖も、猶ほ用て悚悸す。臣、年十七にして、怙む所を喪失し、堂構に任へざるの鄙有り、以て析薪の戒めを忝めんことを懼れ、誠に去病が十八にして功を建て、世祖の列将が弱冠にして命を佐くる無し。臣、初めて兵を領するや、年未だ弱冠ならず、駑懦にして武ならずと雖も、然れども微命を竭さんことを思ふ。惟ふに術は狂惑にして、悪を為すこと深重なり。臣、威霊に憑り、辞を奉じて罪を罰し、庶はくは必ず捷を献じ、以て授くる所に報いん」と。臣松之案ずるに、本伝に孫堅は初平三年を以て卒し、策は建安五年を以て卒し、策の死する時は年二十六と云へば、堅の亡するを計るに、策は応に十八なるべく、而るに此の表に十七と云ふは、則ち不符と為す。張璠の『漢紀』及び『呉歴』は並びに堅は初平二年に死すとす、此れ是と為し而して本伝の誤りなり。『江表伝』に曰く、「建安三年、策、又た使ひを遣はして方物を貢せしむること、元年に献ずる所に倍す。其の年、制書もて討逆将軍に転拝し、改めて呉侯に封ず」と。", "translation": "『江表伝』にいう。「建安2年（197年）夏、後漢朝廷は議郎の王誧を派遣して戊辰の詔書を奉じさせ、こう宣べ伝えた。『董卓が逆乱を起こし、国を傾け民を害した。亡き将軍の孫堅は常にその平定を念願とし、尊い志を果たせぬままに終わったが、その美徳と勲功は天下に著しく聞こえている。子の孫策は善き道に従い、邪心を抱かず真摯に務めている。いま孫策を騎都尉に任じ、父の爵位である烏程侯を継がせ、会稽太守を兼任させる』。また別の詔勅にいう。『先の左将軍・袁術は朝廷の恩義を顧みず、居ながらにして凶悪な反逆を企て、虚偽の符瑞を捏造し、戦乱に乗じて民衆を欺こうとしているが、当初その噂を聞いたときはまさか事実ではあるまいと思っていた。しかるに今、使持節・平東将軍・領徐州牧・温侯の呂布から、袁術が民衆を惑わすために作った妖妄な品々（印章や符命）が証拠として上呈されるに及び、袁術がフクロウ（鴟梟）のように恩知らずで残忍な本性を剥き出しにして無道を押し通し、王宮を造営し、公卿百官を勝手に任命し、天地の祭祀（郊祀）を行い、民を損ない万物を害して、深刻極まりない災禍をもたらしていることを知った。呂布は前後して、孫策が朝廷に忠誠を寄せ、軍を返して袁術を討ち、国のために忠節を尽くそうと願っていると上奏し、孫策に特別な恩典を加えるよう請うた。そもそも恩賞を懸けて功績を待ち、勤勉な者にこそ報いるのが道理である。それゆえ今回の寵命を授け、亡父の封邑（烏程侯）を継がせ、さらに大郡（会稽郡）を重ねて委ねたのであり、栄誉が一時に集まった今こそ、孫策が力を尽くし命を捧げるべき時（秋）である。すみやかに呂布および行呉郡太守・安東将軍の陳瑀と力を合わせ心を一つにし、同時に出陣して袁術を討伐せよ』。孫策は、自分が大軍を統率しているにもかかわらず、単なる騎都尉・領会稽太守の肩書きでは重みが足りないと考え、将軍号を得たいと望み、人をやって勅使の王誧にそれとなく意向を伝えさせた。すると王誧はただちに天子の制命を奉じる形で（承制）、孫策に明漢将軍の号を仮授した。このとき、陳瑀は海西に駐屯しており、孫策は詔を奉じて出陣の準備を整え、呂布・陳瑀と連携して袁術を挟撃しようとした。ところが孫策が軍を進めて銭塘まで至ったとき、陳瑀はひそかに孫策の背後を襲おうと企み、配下の都尉・万演らを派遣して密かに長江を渡らせ、三十余りの印綬と伝信符を持たせて、丹陽郡の宣城・涇・陵陽・始安・黟・歙といった険阻な山間諸県の大帥（山越の首領）である祖郎・焦已や、呉郡烏程の厳白虎らに授けて内応させ、孫策軍が出征した隙を突いて諸郡を攻め取ろうとした。孫策はこの陰謀を察知すると、呂範・徐逸を派遣して海西の陳瑀を攻撃させ、陳瑀を大破してその将兵・役人および妻子四千人を捕らえた」。『山陽公載記』にいう。「陳瑀は単騎で冀州へ逃走し、袁紹のもとに身を寄せると、袁紹は彼を故安都尉に任じた」。『呉録』に、孫策が朝廷に奉った感謝の上表文（謝表）を載せてい て{{person:袁術|袁術}}を討伐せよ』。{{person:孫策|孫策}}は、自分が大軍を統率しているにもかかわらず、単なる{{office:都尉|騎都尉}}・領{{place:会稽|会稽}}{{office:太守|太守}}の肩書きでは重みが足りないと考え、将軍号を得たいと望み、人をやって勅使の{{person:王誧|王誧}}にそれとなく意向を伝えさせた。すると{{person:王誧|王誧}}はただちに天子の制命を奉じる形で（{{special:承制|承制}}）、{{person:孫策|孫策}}に{{office:雑号将軍|明漢将軍}}の号を仮授した。このとき、{{person:陳瑀|陳瑀}}は{{place:海西|海西}}に駐屯しており、{{person:孫策|孫策}}は詔を奉じて出陣の準備を整え、{{person:呂布|呂布}}・{{person:陳瑀|陳瑀}}と連携して{{person:袁術|袁術}}を挟撃しようとした。ところが{{person:孫策|孫策}}が軍を進めて{{place:銭唐|銭塘}}まで至ったとき、{{person:陳瑀|陳瑀}}はひそかに{{person:孫策|孫策}}の背後を襲おうと企み、配下の{{office:都尉|都尉}}・{{person:万演|万演}}らを派遣して密かに{{place:長江|長江}}を渡らせ、三十余りの印綬と伝信符を持たせて、{{place:丹陽|丹陽}}郡の{{place:宣城|宣城}}・{{place:涇県|涇}}・{{place:陵陽|陵陽}}・{{place:始安|始安}}・{{place:黟|黟}}・{{place:歙|歙}}といった険阻な山間諸県の{{special:大帥|大帥（山越の首領）}}である{{person:祖郎|祖郎}}・{{person:焦已|焦已}}や、{{place:呉郡|呉郡}}{{place:烏程|烏程}}の{{person:厳白虎|厳白虎}}らに授けて内応させ、{{person:孫策|孫策}}軍が出征した隙を突いて諸郡を攻め取ろうとした。{{person:孫策|孫策}}はこの陰謀を察知すると、{{person:呂範|呂範}}・{{person:徐逸|徐逸}}を派遣して{{place:海西|海西}}の{{person:陳瑀|陳瑀}}を攻撃させ、{{person:陳瑀|陳瑀}}を大破してその将兵・役人および妻子四千人を捕らえた」。『{{special:引用史料|山陽公載記}}』にいう。「{{person:陳瑀|陳瑀}}は単騎で{{place:冀州|冀州}}へ逃走し、{{person:袁紹|袁紹}}のもとに身を寄せると、{{person:袁紹|袁紹}}は彼を{{place:故安|故安}}{{office:都尉|都尉}}に任じた」。『{{special:引用史料|呉録}}』に、{{person:孫策|孫策}}が朝廷に奉った感謝の上表文（謝表）を載せていう。「臣（{{person:孫策|孫策}}）は{{special:固陋|固陋}}の身でありながら、ひとり辺境の地を守っております。陛下には広く高い恩沢を及ぼされ、ささやかな節義をもお見捨てにならず、臣に{{person:孫堅|亡父}}の爵位を継がせ、あわせて名高い大郡（{{place:会稽|会稽}}郡）を管轄させてくださいました。この栄誉を仰ぎ恩寵を顧みますと、とても私ごときが堪え得るところではございません。かつて{{special:興平|興平}}2年（195年）12月20日、{{place:呉郡|呉郡}}の{{place:曲阿|曲阿}}におきまして{{person:袁術|袁術}}から送られてきた上表文を受け取り、そこには臣を{{office:雑号将軍|行殄寇将軍}}とする旨が記されておりましたが、このたび陛下の詔書を拝受するに至り、初めてそれが{{person:袁術|袁術}}の偽りであり独断の詐称であったことを知りました。ただちにその将軍号を破棄いたしましたものの、今なお恐れおののいております。臣は十七歳のときに頼みとする父（{{person:孫堅|孫堅}}）を失い、父の築いた基業を受け継ぐ（{{special:堂構|堂構・析薪}}）ことができないのではないかと恐れ、いにしえの{{person:霍去病|霍去病}}が十八歳で武功を立て、{{person:光武帝|光武帝}}（{{person:光武帝|世祖}}）の諸将が二十歳（{{special:弱冠|弱冠}}）で天命を輔佐したような働きには到底及びません。臣が初めて兵を率いましたとき、年齢はまだ二十歳（{{special:弱冠|弱冠}}）にも満たず、愚かで気弱く武勇にも乏しい身ではございましたが、それでもこの微力を尽くして命を捧げたいと願ってまいりました。思いますに、{{person:袁術|袁術}}は狂い惑い、その罪悪は極めて深重でございます。臣は陛下のご威光（威霊）にすがり、勅命を奉じて罪人を討伐し、必ずや戦勝の知らせ（捷報）を献上して、賜りましたご恩寵に報いたいと存じます」。臣{{person:裴松之|裴松之}}が検証するに、本伝では「{{person:孫堅|孫堅}}は{{special:初平|初平}}3年（192年）に没し、{{person:孫策|孫策}}は{{special:建安|建安}}5年（200年）に没し、{{person:孫策|孫策}}が死去した時の年齢は二十六歳であった」と記されている。これに基づいて{{person:孫堅|孫堅}}が亡くなった時の{{person:孫策|孫策}}の年齢を計算すると十八歳になるはずであり、この上表文で{{person:孫策|孫策}}自身が「年十七で父を失った」と述べているのと食い違う。{{person:張璠|張璠}}の『{{special:引用史料|後漢紀（漢紀）}}』および『{{special:引用史料|呉歴}}』はいずれも「{{person:孫堅|孫堅}}は{{special:初平|初平}}2年（191年）に戦死した」としており、こちらが正しく、本伝（{{special:初平|初平}}3年説）の誤りである。『{{special:引用史料|江表伝}}』にいう。「{{special:建安|建安}}3年（198年）、{{person:孫策|孫策}}は再び使者を朝廷へ派遣して特産物（方物）を献上させ、その量は{{special:建安|建安}}元年に献上したものの二倍にのぼった。その年、朝廷の制書によって{{office:雑号将軍|討逆将軍}}に転任し、改めて{{place:呉郡|呉}}{{office:列侯|侯}}に封じられた」。"}, {"id": "v46_p16_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 16, "type": "本文", "raw_text": "後術死，長史楊弘、大將張勳等將其衆欲就策，廬江太守劉勳要擊，悉虜之，收其珍寶以歸。策聞之，僞與勳好盟。勳新得術衆，時豫章上繚宗民萬餘家在江東。策勸勳攻取之。勳旣行，策輕軍晨夜襲拔廬江，勳衆盡降，勳獨與麾下數百人自歸曹公。", "kakikudashi": "後に術死し、長史楊弘・大将張勲等、其の衆を将ゐて策に就かんと欲するも、廬江太守劉勲、要撃して悉く之を虜にし、其の珍宝を収めて以て帰る。策、之を聞き、偽りて勲と好盟す。勲、新たに術の衆を得たるも、時に豫章上繚の宗民万余家、江東に在り。策、勲に勧めて之を攻め取らしむ。勲既に往くや、策、軽軍もて晨夜に廬江を襲ひ抜き、勲の衆は尽く降り、勲は独り麾下数百人と自ら曹公に帰す。", "translation": "その後、袁術が死去すると、長史の楊弘や大将の張勲らは袁術の遺衆を率いて孫策のもとへ身を寄せようとしたが、廬江太守の劉勲が道中で待ち伏せしてことごとく彼らを捕らえ、その珍宝を接収して持ち帰った。孫策はこれを聞くと、偽って劉勲と友好の同盟を結んだ。劉勲は新たに袁術の旧部曲を手に入れたばかりで兵糧に窮していたが、当時、豫章郡上繚の宗民（豪族・武装共同体）一万余家が江東方面にいた。孫策は劉勲に勧めて上繚を攻め取らせようとした。劉勲が出征してしまうと、孫策は軽装の精鋭を率いて昼夜兼行で廬江を奇襲して陥落させ、劉勲の軍勢はことごとく降伏し、劉勲はただ一人、麾下の数百人とともに曹公（曹操）のもとへ逃れて帰順した。", "persons": "袁術,楊弘,張勲,孫策,劉勲,曹操", "places": "廬江,豫章,上繚,江東", "era_year": "建安4年（199年）", "source_book": "", "keywords": "長史,太守", "raw_tagged": "後{{person:袁術|術}}死，{{office:長史|長史}}{{person:楊弘|楊弘}}、大將{{person:張勲|張勳}}等將其衆欲就{{person:孫策|策}}，{{place:廬江|廬江}}{{office:太守|太守}}{{person:劉勲|劉勳}}要擊，悉虜之，收其珍寶以歸。{{person:孫策|策}}聞之，僞與{{person:劉勲|勳}}好盟。{{person:劉勲|勳}}新得{{person:袁術|術}}衆，時{{place:豫章|豫章}}{{place:上繚|上繚}}宗民萬餘家在{{place:江東|江東}}。{{person:孫策|策}}勸{{person:劉勲|勳}}攻取之。{{person:劉勲|勳}}旣行，{{person:孫策|策}}輕軍晨夜襲拔{{place:廬江|廬江}}，{{person:劉勲|勳}}衆盡降，{{person:劉勲|勳}}獨與麾下數百人自歸{{person:曹操|曹公}}。", "kakikudashi_tagged": "後に{{person:袁術|術}}死し、{{office:長史|長史}}{{person:楊弘|楊弘}}・大将{{person:張勲|張勲}}等、其の衆を将ゐて{{person:孫策|策}}に就かんと欲するも、{{place:廬江|廬江}}{{office:太守|太守}}{{person:劉勲|劉勲}}、要撃して悉く之を虜にし、其の珍宝を収めて以て帰る。{{person:孫策|策}}、之を聞き、偽りて{{person:劉勲|勲}}と好盟す。{{person:劉勲|勲}}、新たに{{person:袁術|術}}の衆を得たるも、時に{{place:豫章|豫章}}{{place:上繚|上繚}}の宗民万余家、{{place:江東|江東}}に在り。{{person:孫策|策}}、{{person:劉勲|勲}}に勧めて之を攻め取らしむ。{{person:劉勲|勲}}既に往くや、{{person:孫策|策}}、軽軍もて晨夜に{{place:廬江|廬江}}を襲ひ抜き、{{person:劉勲|勲}}の衆は尽く降り、{{person:劉勲|勲}}は独り麾下数百人と自ら{{person:曹操|曹公}}に帰す。", "translation_tagged": "その後、{{person:袁術|袁術}}が死去すると、{{office:長史|長史}}の{{person:楊弘|楊弘}}や大将の{{person:張勲|張勲}}らは{{person:袁術|袁術}}の遺衆を率いて{{person:孫策|孫策}}のもとへ身を寄せようとしたが、{{place:廬江|廬江}}{{office:太守|太守}}の{{person:劉勲|劉勲}}が道中で待ち伏せしてことごとく彼らを捕らえ、その珍宝を接収して持ち帰った。{{person:孫策|孫策}}はこれを聞くと、偽って{{person:劉勲|劉勲}}と友好の同盟を結んだ。{{person:劉勲|劉勲}}は新たに{{person:袁術|袁術}}の旧{{special:部曲|部曲}}を手に入れたばかりで兵糧に窮していたが、当時、{{place:豫章|豫章}}郡{{place:上繚|上繚}}の宗民（豪族・武装共同体）一万余家が{{place:江東|江東}}方面にいた。{{person:孫策|孫策}}は{{person:劉勲|劉勲}}に勧めて{{place:上繚|上繚}}を攻め取らせようとした。{{person:劉勲|劉勲}}が出征してしまうと、{{person:孫策|孫策}}は軽装の精鋭を率いて昼夜兼行で{{place:廬江|廬江}}を奇襲して陥落させ、{{person:劉勲|劉勲}}の軍勢はことごとく降伏し、{{person:劉勲|劉勲}}はただ一人、麾下の数百人とともに{{person:曹操|曹公}}（{{person:曹操|曹操}}）のもとへ逃れて帰順した。"}, {"id": "v46_p16_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 16, "type": "裴注", "raw_text": "《江表傳》曰：「策被詔敕，與司空曹公、衞將軍董承、益州牧劉璋等並力討袁術、劉表。軍嚴當進，會術死，術從弟胤、女婿黃猗等畏懼曹公，不敢守壽春，乃共舁術棺柩，扶其妻子及部曲男女，就劉勳於皖城。勳糧食少，無以相振，乃遣從弟偕告糴於豫章太守華歆。歆郡素少穀，遣吏將偕就海昏上繚，使諸宗帥共出三萬斛米以與偕。偕往歷月，纔得數千斛。偕乃報勳，具説形狀，使勳來襲取之。勳得偕書，使潛軍到海昏邑下。宗帥知之，空壁逃匿，勳了無所得。時策西討黃祖，行及石城，聞勳輕身詣海昏，便分遣從兄賁、輔率八千人於彭澤待勳，自與周瑜率二萬人步襲皖城，卽克之，得術百工及鼓吹部曲三萬餘人，並術勳妻子。表用汝南李術爲廬江太守，給兵三千人以守皖，皆徙所得人東詣吳。賁、輔又於彭澤破勳。勳走入楚江，從尋陽步上到置馬亭，聞策等已克皖，乃投西塞。至沂，築壘自守，告急於劉表，求救於黃祖。祖遣太子射船軍五千人助勳。策復就攻，大破勳。勳與偕北歸曹公，射亦遁走。策收得勳兵二千餘人，船千艘，遂前進夏口攻黃祖。時劉表遣從子虎、南陽韓晞將長矛五千，來爲黃祖前鋒。策與戰，大破之。」《吳錄》載策表曰：「臣討黃祖，以十二月八日到祖所屯沙羨縣。劉表遣將助祖，並來趣臣。臣以十一日平旦部所領江夏太守、行建威中郎將周瑜、領桂陽太守、行征虜中郎將呂範、領零陵太守、行蕩寇中郎將程普、行奉業校尉孫權、行先登校尉韓當、行武鋒校尉黃蓋等同時俱進。身跨馬櫟陳，手擊急鼓，以齊戰勢。吏士奮激，踊躍百倍，心精意果，各競用命。越渡重塹，迅疾若飛。火放上風，兵激烟下，弓弩並發，流矢雨集，日加辰時，祖乃潰爛。鋒刃所截，猋火所焚，前無生寇，惟祖逬走。獲其妻息男女七人，斬虎、（狼）韓晞已下二萬餘級，其赴水溺者一萬餘口，船六千餘艘，財物山積。雖表未禽，祖宿狡猾，爲表腹心，出作爪牙，表之鴟張，以祖氣息，而祖家屬部曲，掃地無餘，表孤特之虜，成鬼行屍。誠皆聖朝神武遠振，臣討有罪，得效微勤。」", "kakikudashi": "『江表伝』に曰く、「策、詔勅を被り、司空曹公・衛将軍董承・益州牧劉璋等と力を並せて袁術・劉表を討たんとす。軍厳して当に進むべきに、会ま術死し、術の従弟胤・女婿黄猗等、曹公を畏懼し、敢て寿春を守らず、乃ち共に術の棺柩を舁き、其の妻子及び部曲の男女を扶け、劉勲に皖城に就く。勲、糧食少く、以て相ひ振ふ無ければ、乃ち従弟の偕を遣はして糴を豫章太守華歆に告げしむ。歆の郡、素より穀少ければ、吏を遣はして偕を将ゐて海昏の上繚に就かしめ、諸宗帥をして共に三万斛の米を出して以て偕に与へしむ。偕、往きて月を歴るも、纔かに数千斛を得たるのみ。偕、乃ち勲に報じ、具さに形状を説き、勲をして来りて之を襲ひ取らしむ。勲、偕の書を得て、潜軍をして海昏の邑下に到らしむ。宗帥、之を知り、壁を空しくして逃匿し、勲、了に得る所無し。時に策、西のかた黄祖を討たんとし、行きて石城に及ぶや、勲が軽身にて海昏に詣るを聞き、便ち従兄の賁・輔を分ち遣はして八千人を率ゐて彭沢に於て勲を待たしめ、自ら周瑜と二万人を率ゐて歩して皖城を襲ひ、即ち之に克ち、術の百工及び鼓吹・部曲三万余人、並びに術・勲の妻子を得たり。汝南の李術を表用して廬江太守と為し、兵三千人を給して以て皖を守らしめ、皆得る所の人を徙して東のかた呉に詣らしむ。賁・輔、又た彭沢に於て勲を破る。勲、走りて楚江に入り、尋陽より歩して上りて置馬亭に到るも、策等が已に皖に克つを聞き、乃ち西塞に投ず。沂に至り、塁を築きて自ら守り、急を劉表に告げ、救ひを黄祖に求む。祖、太子の射を遣はして船軍五千人にて勲を助けしむ。策、復た就きて攻め、大いに勲を破る。勲、偕と北のかた曹公に帰し、射も亦た遁走す。策、勲の兵二千余人・船千艘を収得し、遂に前進して夏口に黄祖を攻む。時に劉表、従子の虎・南陽の韓晞を遣はして長矛五千を将ゐ、来りて黄祖の前鋒と為さしむ。策、与に戦ひ、大いに之を破る」と。『呉録』に策の表を載せて曰く、「臣、黄祖を討ち、十二月八日を以て祖が屯する所の沙羨県に到る。劉表、将を遣はして祖を助けしめ、並び来りて臣に趣く。臣、十一日平旦を以て部する所の領江夏太守・行建威中郎将周瑜、領桂陽太守・行征虜中郎将呂範、領零陵太守・行蕩寇中郎将程普、行奉業校尉孫権、行先登校尉韓当、行武鋒校尉黄蓋等と同時に倶に進む。身ら馬に跨りて陳を櫟ち、手づから急鼓を撃ち、以て戦勢を斉ふ。吏士奮激し、踊躍すること百倍し、心精しく意果にして、各おの競ひて命を用ふ。重塹を越渡すること、迅疾なること飛ぶが若し。火を上風に放ち、兵は烟下に激し、弓弩並び発し、流矢雨のごとく集まり、日、辰時に加はるや、祖は乃ち潰爛す。鋒刃の截る所、猋火の焚く所、前に生寇無く、惟だ祖のみ逬走す。其の妻息男女七人を獲、虎・韓晞已下二万余級を斬り、其の水に赴きて溺るる者は一万余口、船六千余艘、財物山積す。表は未だ禽にせずと雖も、祖は宿より狡猾にして、表の腹心と為り、出でては爪牙と作り、表の鴟張するは、祖を以て気息とすれば、而ち祖の家属・部曲、地を掃ひて余す無く、表は孤特の虜となり、成鬼・行屍となれり。誠に皆聖朝の神武遠く振ひ、臣、有罪を討ち、微勤を効すを得たり」と。", "translation": "『江表伝』にいう。「孫策は朝廷の詔勅を拝受し、司空の曹公（曹操）・衛将軍の董承・益州牧の劉璋らと力を合わせて袁術・劉表を討伐することとなった。軍備を整えてまさに出陣しようとしていた矢先、たまたま袁術が病死し、袁術の従弟の袁胤や女婿の黄猗らは曹公を恐れて寿春を守り切れず、ともに袁術の棺を担ぎ、袁術の妻子および部曲の男女を引き連れて、皖城の劉勲のもとへ身を寄せた。しかし劉勲は兵糧が乏しく、彼らを養う手立てがなかったため、従弟の劉偕を派遣して豫章太守の華歆に兵糧の買い入れ（告糴）を要請させた。華歆の治める豫章郡も普段から穀物が少なかったため、華歆は役人を遣わして劉偕を海昏県の上繚へ案内させ、上繚の諸宗帥（豪族の首領たち）に命じて合計三万斛の米を供出させて劉偕に与えようとした。ところが劉偕が行って一か月あまり経っても、わずか数千斛しか集まらなかった。そこで劉偕は劉勲に連絡し、上繚の裕福な実情を詳しく説明して、劉勲自身に軍を率いて上繚を襲撃・略奪させるよう促した。劉勲は劉偕の書状を受け取ると、密かに軍を動かして海昏の県邑のほとりまで進軍した。しかし上繚の宗帥たちはこれを察知し、砦を空にして逃げ隠れたため、劉勲は全く何の収穫も得られなかった。ちょうどこのとき、孫策は西方の黄祖を討伐しようとして石城まで進軍していたが、劉勲が身軽な軍装で海昏へ出向いたと聞き、ただちに従兄の孫賁・孫輔を分遣して八千人を率いて彭沢で劉勲を待ち伏せさせ、自身は周瑜とともに二万人を率いて陸路から皖城を奇襲し、即座にこれを陥落させて、袁術が抱えていた百工（職人団）および鼓吹（軍楽隊）・部曲三万余人、ならびに袁術と劉勲の妻子を手に入れた。そして汝南出身の李術を上表して廬江太守に任じ、兵三千人を与えて皖城を守らせ、獲得した人々をみな東方の呉郡へ移住させた。孫賁・孫輔もまた彭沢において帰途の劉勲を撃破した。劉勲は逃走して楚江（長江）に入り、尋陽から陸路を上って置馬亭に至ったが、孫策らがすでに皖城を攻略したと聞き、長江南岸の西塞へ逃げ込んだ。劉勲は沂に至ると、砦を築いて防戦を固め、劉表に急を告げて黄祖に救援を求めた。黄祖は長男（太子）の黄射に水軍五千人を率いさせて劉勲を救援させた。孫策は再びそこへ進撃して攻め立て、劉勲を大破した。劉勲は劉偕とともに北方へ逃れて曹公に帰順し、黄射もまた逃走した。孫策は劉勲の兵二千余人と船千艘を接収し、そのまま前進して夏口で黄祖を攻めた。このとき劉表は従子の劉虎と南陽の韓晞を派遣し、長矛隊五千人を率いて黄祖の先鋒とさせていた。孫策はこれと交戦し、大いに撃破した」。『呉録』に、孫策が朝廷に奉った戦勝の上表文（捷表）を載せていう。「臣（孫策）は黄祖を討伐するため、十二月八日に黄祖が駐屯する沙羨県に到達いたしました。劉表は部将を派遣して黄祖を救援させ、力を合わせて臣に向かってまいりました。臣は十一日夜明け（平旦）、統率する領江夏太守・行建威中郎将の周瑜、領桂陽太守・行征虜中郎将の呂範、領零陵太守・行蕩寇中郎将の程普、行奉業校尉の孫権、行先登校尉の韓当、行武鋒校尉の黄蓋らを指揮して一斉に進撃いたしました。臣自ら馬に跨って陣頭を駆け巡り、手ずから早鐘の陣太鼓（急鼓）を打ち鳴らして全軍の戦意を揃えました。将兵は奮い立って百倍も勇み立ち、精神を集中し果敢に決断して、おのおの競い合って命を懸けました。幾重もの堀（重塹）を飛び越えるさまは、飛ぶがごとく迅速でありました。風上から火を放ち、兵士は黒煙の下で激しく突撃し、弓と弩を一斉に射かけ、矢が雨のように降り注ぐなか、時刻が辰時（午前八時ごろ）に差しかかるころ、黄祖の軍はついに総崩れとなりました。刃が斬り伏せるところ、烈火が焼き尽くすところ、前方には生き残った敵兵とてなく、ただ黄祖一人が命からがら逃げ去りました。黄祖の妻子男女七人を捕らえ、劉虎・韓晞以下二万余級の首を斬り、長江に飛び込んで溺死した者は一万余人、鹵獲した船は六千余艘にのぼり、戦利品の財物は山のように積み上がりました。いまだ劉表自身は捕らえていないとはいえ、黄祖はかねてより狡猾で劉表の腹心となり、外に出ては爪牙となって働いてきた者であり、劉表がフクロウのように威張り散らして（鴟張）いられたのも黄祖を呼吸の頼みとしていたからでございます。しかるに今や黄祖の家族と部曲は根こそぎ一掃されて余すところなく、劉表は孤立無援の賊となり、生ける屍（成鬼・行屍）と化しました。まことにこれすべて聖朝の神武が遠くまで振るわれたおかげであり、臣は罪ある逆賊を討って、ささやかな勤労を果たすことができました」。", "persons": "孫策,曹操,董承,劉璋,袁術,劉表,袁胤,黄猗,劉勲,劉偕,華歆,黄祖,孫賁,孫輔,周瑜,李術,黄射,劉虎,韓晞,呂範,程普,孫権,韓当,黄蓋", "places": "益州,寿春,皖,豫章,海昏,上繚,石城,彭沢,汝南,廬江,呉郡,長江,尋陽,置馬亭,西塞,夏口,南陽,沙羨,江夏,桂陽,零陵", "era_year": "建安4年（199年）", "source_book": "江表伝,呉録", "keywords": "司空,衛将軍,牧,部曲,太守,大帥,鼓吹,中郎将,校尉,辰時,鴟張", "raw_tagged": "《{{special:引用史料|江表傳}}》曰：「{{person:孫策|策}}被詔敕，與{{office:司空|司空}}{{person:曹操|曹公}}、{{office:衛将軍|衞將軍}}{{person:董承|董承}}、{{place:益州|益州}}{{office:牧|牧}}{{person:劉璋|劉璋}}等並力討{{person:袁術|袁術}}、{{pe 矢先、たまたま{{person:袁術|袁術}}が病死し、{{person:袁術|袁術}}の従弟の{{person:袁胤|袁胤}}や女婿の{{person:黄猗|黄猗}}らは{{person:曹操|曹公}}を恐れて{{place:寿春|寿春}}を守り切れず、ともに{{person:袁術|袁術}}の棺を担ぎ、{{person:袁術|袁術}}の妻子および{{special:部曲|部曲}}の男女を引き連れて、{{place:皖|皖城}}の{{person:劉勲|劉勲}}のもとへ身を寄せた。しかし{{person:劉勲|劉勲}}は兵糧が乏しく、彼らを養う手立てがなかったため、従弟の{{person:劉偕|劉偕}}を派遣して{{place:豫章|豫章}}{{office:太守|太守}}の{{person:華歆|華歆}}に兵糧の買い入れ（告糴）を要請させた。{{person:華歆|華歆}}の治める{{place:豫章|豫章}}郡も普段から穀物が少なかったため、{{person:華歆|華歆}}は役人を遣わして{{person:劉偕|劉偕}}を{{place:海昏|海昏}}県の{{place:上繚|上繚}}へ案内させ、{{place:上繚|上繚}}の諸{{special:大帥|宗帥}}（豪族の首領たち）に命じて合計三万斛の米を供出させて{{person:劉偕|劉偕}}に与えようとした。ところが{{person:劉偕|劉偕}}が行って一か月あまり経っても、わずか数千斛しか集まらなかった。そこで{{person:劉偕|劉偕}}は{{person:劉勲|劉勲}}に連絡し、{{place:上繚|上繚}}の裕福な実情を詳しく説明して、{{person:劉勲|劉勲}}自身に軍を率いて{{place:上繚|上繚}}を襲撃・略奪させるよう促した。{{person:劉勲|劉勲}}は{{person:劉偕|劉偕}}の書状を受け取ると、密かに軍を動かして{{place:海昏|海昏}}の県邑のほとりまで進軍した。しかし{{place:上繚|上繚}}の{{special:大帥|宗帥}}たちはこれを察知し、砦を空にして逃げ隠れたため、{{person:劉勲|劉勲}}は全く何の収穫も得られなかった。ちょうどこのとき、{{person:孫策|孫策}}は西方の{{person:黄祖|黄祖}}を討伐しようとして{{place:石城|石城}}まで進軍していたが、{{person:劉勲|劉勲}}が身軽な軍装で{{place:海昏|海昏}}へ出向いたと聞き、ただちに従兄の{{person:孫賁|孫賁}}・{{person:孫輔|孫輔}}を分遣して八千人を率いて{{place:彭沢|彭沢}}で{{person:劉勲|劉勲}}を待ち伏せさせ、自身は{{person:周瑜|周瑜}}とともに二万人を率いて陸路から{{place:皖|皖城}}を奇襲し、即座にこれを陥落させて、{{person:袁術|袁術}}が抱えていた百工（職人団）および{{special:鼓吹|鼓吹（軍楽隊）}}・{{special:部曲|部曲}}三万余人、ならびに{{person:袁術|袁術}}と{{person:劉勲|劉勲}}の妻子を手に入れた。そして{{place:汝南|汝南}}出身の{{person:李術|李術}}を上表して{{place:廬江|廬江}}{{office:太守|太守}}に任じ、兵三千人を与えて{{place:皖|皖城}}を守らせ、獲得した人々をみな東方の{{place:呉郡|呉郡}}へ移住させた。{{person:孫賁|孫賁}}・{{person:孫輔|孫輔}}もまた{{place:彭沢|彭沢}}において帰途の{{person:劉勲|劉勲}}を撃破した。{{person:劉勲|劉勲}}は逃走して{{place:長江|楚江}}（{{place:長江|長江}}）に入り、{{place:尋陽|尋陽}}から陸路を上って{{place:置馬亭|置馬亭}}に至ったが、{{person:孫策|孫策}}らがすでに{{place:皖|皖城}}を攻略したと聞き、{{place:長江|長江}}南岸の{{place:西塞|西塞}}へ逃げ込んだ。{{person:劉勲|劉勲}}は{{place:西塞|沂}}に至ると、砦を築いて防戦を固め、{{person:劉表|劉表}}に急を告げて{{person:黄祖|黄祖}}に救援を求めた。{{person:黄祖|黄祖}}は長男（太子）の{{person:黄射|黄射}}に水軍五千人を率いさせて{{person:劉勲|劉勲}}を救援させた。{{person:孫策|孫策}}は再びそこへ進撃して攻め立て、{{person:劉勲|劉勲}}を大破した。{{person:劉勲|劉勲}}は{{person:劉偕|劉偕}}とともに北方へ逃れて{{person:曹操|曹公}}に帰順し、{{person:黄射|黄射}}もまた逃走した。{{person:孫策|孫策}}は{{person:劉勲|劉勲}}の兵二千余人と船千艘を接収し、そのまま前進して{{place:夏口|夏口}}で{{person:黄祖|黄祖}}を攻めた。このとき{{person:劉表|劉表}}は従子の{{person:劉虎|劉虎}}と{{place:南陽|南陽}}の{{person:韓晞|韓晞}}を派遣し、長矛隊五千人を率いて{{person:黄祖|黄祖}}の先鋒とさせていた。{{person:孫策|孫策}}はこれと交戦し、大いに撃破した」。『{{special:引用史料|呉録}}』に、{{person:孫策|孫策}}が朝廷に奉った戦勝の上表文（捷表）を載せていう。「臣（{{person:孫策|孫策}}）は{{person:黄祖|黄祖}}を討伐するため、十二月八日に{{person:黄祖|黄祖}}が駐屯する{{place:沙羨|沙羨県}}に到達いたしました。{{person:劉表|劉表}}は部将を派遣して{{person:黄祖|黄祖}}を救援させ、力を合わせて臣に向かってまいりました。臣は十一日夜明け（平旦）、統率する領{{place:江夏|江夏}}{{office:太守|太守}}・{{office:中郎将|行建威中郎将}}の{{person:周瑜|周瑜}}、領{{place:桂陽|桂陽}}{{office:太守|太守}}・{{office:中郎将|行征虜中郎将}}の{{person:呂範|呂範}}、領{{place:零陵|零陵}}{{office:太守|太守}}・{{office:中郎将|行蕩寇中郎将}}の{{person:程普|程普}}、{{office:校尉|行奉業校尉}}の{{person:孫権|孫権}}、{{office:校尉|行先登校尉}}の{{person:韓当|韓当}}、{{office:校尉|行武鋒校尉}}の{{person:黄蓋|黄蓋}}らを指揮して一斉に進撃いたしました。臣自ら馬に跨って陣頭を駆け巡り、手ずから早鐘の陣太鼓（急鼓）を打ち鳴らして全軍の戦意を揃えました。将兵は奮い立って百倍も勇み立ち、精神を集中し果敢に決断して、おのおの競い合って命を懸けました。幾重もの堀（重塹）を飛び越えるさまは、飛ぶがごとく迅速でありました。風上から火を放ち、兵士は黒煙の下で激しく突撃し、弓と弩を一斉に射かけ、矢が雨のように降り注ぐなか、時刻が{{special:辰時|辰時（午前八時ごろ）}}に差しかかるころ、{{person:黄祖|黄祖}}の軍はついに総崩れとなりました。刃が斬り伏せるところ、烈火が焼き尽くすところ、前方には生き残った敵兵とてなく、ただ{{person:黄祖|黄祖}}一人が命からがら逃げ去りました。{{person:黄祖|黄祖}}の妻子男女七人を捕らえ、{{person:劉虎|劉虎}}・{{person:韓晞|韓晞}}以下二万余級の首を斬り、{{place:長江|長江}}に飛び込んで溺死した者は一万余人、鹵獲した船は六千余艘にのぼり、戦利品の財物は山のように積み上がりました。いまだ{{person:劉表|劉表}}自身は捕らえていないとはいえ、{{person:黄祖|黄祖}}はかねてより狡猾で{{person:劉表|劉表}}の腹心となり、外に出ては爪牙となって働いてきた者であり、{{person:劉表|劉表}}がフクロウのように威張り散らして（{{special:鴟張|鴟張}}）いられたのも{{person:黄祖|黄祖}}を呼吸の頼みとしていたからでございます。しかるに今や{{person:黄祖|黄祖}}の家族と{{special:部曲|部曲}}は根こそぎ一掃されて余すところなく、{{person:劉表|劉表}}は孤立無援の賊となり、生ける屍（成鬼・行屍）と化しました。まことにこれすべて聖朝の神武が遠くまで振るわれたおかげであり、臣は罪ある逆賊を討って、ささやかな勤労を果たすことができました」。"}, {"id": "v46_p16_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 16, "type": "本文", "raw_text": "是時袁紹方強，而策併江東，曹公力未能逞，且欲撫之。", "kakikudashi": "是の時、袁紹方に強く、而して策は江東を併せ、曹公、力未だ逞しくする能はず、且く之を撫せんと欲す。", "translation": "このとき、北方では袁紹の勢力がまさに強大であり、一方では孫策が江東を併合していたため、曹公（曹操）は孫策を討つだけの余力がなく、ひとまず孫策を懐柔しようと考えた。", "persons": "袁紹,孫策,曹操", "places": "江東", "era_year": "建安4年（199年）", "source_book": "", "keywords": "", "raw_tagged": "是時{{person:袁紹|袁紹}}方強，而{{person:孫策|策}}併{{place:江東|江東}}，{{person:曹操|曹公}}力未能逞，且欲撫之。", "kakikudashi_tagged": "是の時、{{person:袁紹|袁紹}}方に強く、而して{{person:孫策|策}}は{{place:江東|江東}}を併せ、{{person:曹操|曹公}}、力未だ逞しくする能はず、且く之を撫せんと欲す。", "translation_tagged": "このとき、北方では{{person:袁紹|袁紹}}の勢力がまさに強大であり、一方では{{person:孫策|孫策}}が{{place:江東|江東}}を併合していたため、{{person:曹操|曹公}}（{{person:曹操|曹操}}）は{{person:孫策|孫策}}を討つだけの余力がなく、ひとまず{{person:孫策|孫策}}を懐柔しようと考えた。"}, {"id": "v46_p16_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 16, "type": "裴注", "raw_text": "《吳曆》曰：「曹公聞策平定江南，意甚難之，常呼『猘兒難與爭鋒也』。」", "kakikudashi": "『呉歴』に曰く、「曹公、策が江南を平定するを聞き、意に甚だ之を難かり、常に『猘児は与に鋒を争ひ難きなり』と呼ぶ」と。", "translation": "『呉歴』にいう。「曹公（曹操）は孫策が江南を平定したと聞き、心中で大いにこれを厄介視し、常に『猘児（狂猛な若獅子）とはまともに矛先を争い難い』と嘆息していた」。", "persons": "曹操,孫策", "places": "江東", "era_year": "建安4年（199年）", "source_book": "呉歴", "keywords": "猘児", "raw_tagged": "《{{special:引用史料|吳曆}}》曰：「{{person:曹操|曹公}}聞{{person:孫策|策}}平定{{place:江東|江南}}，意甚難之，常呼『{{special:猘児|猘兒}}難與爭鋒也』。」", "kakikudashi_tagged": "『{{special:引用史料|呉歴}}』に曰く、「{{person:曹操|曹公}}、{{person:孫策|策}}が{{place:江東|江南}}を平定するを聞き、意に甚だ之を難かり、常に『{{special:猘児|猘児}}は与に鋒を争ひ難きなり』と呼ぶ」と。", "translation_tagged": "『{{special:引用史料|呉歴}}』にいう。「{{person:曹操|曹公}}（{{person:曹操|曹操}}）は{{person:孫策|孫策}}が{{place:江東|江南}}を平定したと聞き、心中で大いにこれを厄介視し、常に『{{special:猘児|猘児（狂猛な若獅子）}}とはまともに矛先を争い難い』と嘆息していた」。"}, {"id": "v46_p16_5", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 16, "type": "本文", "raw_text": "乃以弟女配策小弟匡，又爲子彰取賁女，皆禮辟策弟權、翊，又命揚州刺史嚴象舉權茂才。", "kakikudashi": "乃ち弟の女を以て策の小弟匡に配し、又た子の彰の為に賁の女を取り、皆策の弟の権・翊を礼辟し、又た揚州刺史厳象に命じて権を茂才に挙げしむ。", "translation": "そこで曹公（曹操）は亡き弟の娘を孫策の末弟・孫匡に嫁がせ、また自分の息子・曹彰のために孫賁の娘を娶り、孫策の弟である孫権・孫翊をともに礼を尽くして辟召し、さらに揚州刺史の厳象に命じて孫権を茂才に推挙させた。", "persons": "曹操,孫策,孫匡,曹彰,孫賁,孫権,孫翊,厳象", "places": "揚州", "era_year": "建安4年（199年）", "source_book": "", "keywords": "刺史,茂才", "raw_tagged": "乃以弟女配{{person:孫策|策}}小弟{{person:孫匡|匡}}，又爲子{{person:曹彰|彰}}取{{person:孫賁|賁}}女，皆禮辟{{person:孫策|策}}弟{{person:孫権|權}}、{{person:孫翊|翊}}，又命{{place:揚州|揚州}}{{office:刺史|刺史}}{{person:厳象|嚴象}}舉{{person:孫権|權}}{{special:茂才|茂才}}。", "kakikudashi_tagged": "乃ち弟の女を以て{{person:孫策|策}}の小弟{{person:孫匡|匡}}に配し、又た子の{{person:曹彰|彰}}の為に{{person:孫賁|賁}}の女を取り、皆{{person:孫策|策}}の弟の{{person:孫権|権}}・{{person:孫翊|翊}}を礼辟し、又た{{place:揚州|揚州}}{{office:刺史|刺史}}{{person:厳象|厳象}}に命じて{{person:孫権|権}}を{{special:茂才|茂才}}に挙げしむ。", "translation_tagged": "そこで{{person:曹操|曹公}}（{{person:曹操|曹操}}）は亡き弟の娘を{{person:孫策|孫策}}の末弟・{{person:孫匡|孫匡}}に嫁がせ、また自分の息子・{{person:曹彰|曹彰}}のために{{person:孫賁|孫賁}}の娘を娶り、{{person:孫策|孫策}}の弟である{{person:孫権|孫権}}・{{person:孫翊|孫翊}}をともに礼を尽くして辟召し、さらに{{place:揚州|揚州}}{{office:刺史|刺史}}の{{person:厳象|厳象}}に命じて{{person:孫権|孫権}}を{{special:茂才|茂才}}に推挙させた。"}, {"id": "v46_p17_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 17, "type": "本文", "raw_text": "建安五年，曹公與袁紹相拒於官渡，策陰欲襲許。迎漢帝，", "kakikudashi": "建安五年、曹公、袁紹と官渡に相ひ拒むや、策、陰かに許を襲ひて漢帝を迎へんと欲し、", "translation": "建安五年（200年）、曹公（曹操）と袁紹が官渡で対陣すると、孫策は密かに許都を奇襲して漢帝（献帝）を迎え入れようと計画し、", "persons": "曹操,袁紹,孫策,献帝", "places": "官渡,許", "era_year": "建安5年（200年）", "source_book": "", "keywords": "建安", "raw_tagged": "{{special:建安|建安五年}}，{{person:曹操|曹公}}與{{person:袁紹|袁紹}}相拒於{{place:官渡|官渡}}，{{person:孫策|策}}陰欲襲{{place:許|許}}。迎{{person:献帝|漢帝}}，", "kakikudashi_tagged": "{{special:建安|建安五年}}、{{person:曹操|曹公}}、{{person:袁紹|袁紹}}と{{place:官渡|官渡}}に相ひ拒むや、{{person:孫策|策}}、陰かに{{place:許|許}}を襲ひて{{person:献帝|漢帝}}を迎へんと欲し、", "translation_tagged": "{{special:建安|建安五年}}（200年）、{{person:曹操|曹公}}（{{person:曹操|曹操}}）と{{person:袁紹|袁紹}}が{{place:官渡|官渡}}で対陣すると、{{person:孫策|孫策}}は密かに{{place:許|許都}}を奇襲して{{person:献帝|漢帝}}（{{person:献帝|献帝}}）を迎え入れようと計画し、"}, {"id": "v46_p17_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 17, "type": "裴注", "raw_text": "《吳錄》曰：「時有高岱者，隱於餘姚，策命出，使會稽丞陸昭逆之，策虛己候焉。聞其善《左傳》，乃自玩讀，欲與論講。或謂之曰：『高岱以將軍但英武而已，無文學之才，若與論傳而或云不知者，則某言符矣。』又謂岱曰：『孫將軍爲人，惡勝己者，若每問，當言不知，乃合意耳。如皆辨義，此必危殆。』岱以爲然，及與論傳，或答不知。策果怒，以爲輕己，乃囚之。知交及時人皆露坐爲請。策登樓，望見數里中塡滿。策惡其收衆心，遂殺之。岱字孔文，吳郡人也。受性聰達，輕財貴義。其友士拔奇，取於未顯，所友八人，皆世之英偉也。太守盛憲以爲上計，舉孝廉。許貢來領郡，岱將憲避難於許昭家，求救於陶謙。謙未卽救，岱憔悴泣血，水漿不入口。謙感其忠壯，有申包胥之義，許爲出軍，以書與貢。岱得謙書以還，而貢已囚其母。吳人大小皆爲危竦，以貢宿忿，往必見害。岱言在君則爲君，且母在牢獄，期於當往，若得入見，事自當解。遂通書自白，貢卽與相見。才辭敏捷，好自陳謝，貢登時出其母。岱將見貢，語友人張允、沈䁕令豫具船，以貢必悔，當追逐之。出便將母乘船易道而逃。貢須臾遣人追之，令追者若及於船，江上便殺之，已過則止。使與岱錯道，遂免。被誅時，年三十餘。」《江表傳》曰：「時有道士琅邪于吉，先寓居東方，往來吳會，立精舍，燒香讀道書，製作符水以治病，吳會人多事之。策嘗於郡城門樓上，集會諸將賓客，吉乃盛服杖小函，漆畫之，名爲仙人鏵，趨度門下。諸將賓客三分之二下樓迎拜之，掌賓者禁呵不能止。策卽令收之。諸事之者，悉使婦女入見策母，請救之。母謂策曰：『于先生亦助軍作福，醫護將士，不可殺之。』策曰：『此子妖妄，能幻惑衆心，遠使諸將不復相顧君臣之禮，盡委策下樓拜之，不可不除也。』諸將復連名通白事陳乞之，策曰：『昔南陽張津爲交州刺史，舍前聖典訓，廢漢家法律，嘗著絳帕頭，鼓琴燒香，讀邪俗道書，云以助化，卒爲南夷所殺。此甚無益，諸君但未悟耳。今此子已在鬼籙，勿復費紙筆也。』卽催斬之，縣首於巿。諸事之者，尙不謂其死而云屍解焉，復祭祀求福。」《志林》曰：『初順帝時，琅邪宮崇詣闕上師于吉所得神書於曲陽泉水上，白素朱界，號太平靑領道，凡百餘卷。順帝至建安中，五六十歲，于吉是時近已百年，年在耄悼，禮不加刑。又天子巡狩，問百年者，就而見之，敬齒以親愛，聖王之至教也。吉罪不及死，而暴加酷刑，是乃謬誅，非所以爲美也。喜推考桓王之薨，建安五年四月四日。是時曹袁相攻，未有勝負。案夏侯元讓與石威則書，袁紹破後也。書云：「授孫賁以長沙，業張津以零桂。」此爲桓王於前亡，張津於後死，不得相讓，譬言津之死意矣。』臣松之案：「太康八年，廣州大中正王範上《交廣二州春秋》。建安六年，張津猶爲交州牧。《江表傳》之虛如《志林》所云。《搜神記》曰：策欲渡江襲許，與吉俱行。時大旱，所在熇厲。策催諸將士使速引船，或身自早出督切，見將吏多在吉許，策因此激怒，言：「我爲不如于吉邪，而先趨務之？」便使收吉。至，呵問之曰：「天旱不雨，道塗艱澀，不時得過，故自早出，而卿不同憂戚，安坐船中作鬼物態，敗吾部伍，今當相除。」令人縛置地上暴之，使請雨，若能感天日中雨者，當原赦，不爾行誅。俄而雲氣上蒸，膚寸而合，比至日中，大雨總至，溪澗盈溢。將士喜悅，以爲吉必見原，並往慶慰。策遂殺之。將士哀惜，共藏其屍。天夜，忽更興雲覆之；明旦往視，不知所在。案《江表傳》、《搜神記》于吉事不同，未詳孰是。」", "kakikudashi": "『呉録』に曰く、「時に高岱なる者有り、餘姚に隠る。策、命じて出でしめ、会稽丞陸昭をして之を逆へしめ、策、己を虚しくして焉を候つ。其の『左伝』を善くするを聞き、乃ち自ら玩読し、与に論講せんと欲す。或るひと之に謂ひて曰く、『高岱は将軍を以て但だ英武なるのみにして、文学の才無しと為せば、若し与に伝を論じて或いは知らずと云はば、則ち某の言、符せん』と。又た岱に謂ひて曰く、『孫将軍の人と為り、己に勝る者を悪めば、若し問ふ毎に、当に知らずと言ふべく、乃ち意に合ふのみ。如し皆義を弁ぜば、此れ必ず危殆ならん』と。岱、以て然りと為し、与に伝を論ずるに及び、或いは知らずと答ふ。策、果して怒り、己を軽んずと以為ひ、乃ち之を囚ふ。知交及び時人、皆露坐して為に請ふ。策、楼に登り、数里の中、填満するを望見す。策、其の衆心を収むるを悪み、遂に之を殺す。岱、字は孔文、呉郡の人なり。受性聡達にして、財を軽んじ義を貴ぶ。其の士を友とし奇を抜くや、未だ顕れざるに取り、友とする所の八人は、皆世の英偉なり。太守盛憲、以て上計と為し、孝廉に挙ぐ。許貢、来りて郡を領するや、岱、憲を将ゐて難を許昭の家に避け、救ひを陶謙に求む。謙、未だ即ちには救はず、岱、憔悴して血に泣き、水漿も口に入らず。謙、其の忠壮にして申包胥の義有るに感じ、許して為に軍を出し、書を以て貢に与ふ。岱、謙の書を得て以て還るに、貢は已に其の母を囚ふ。呉人の大小、皆為に危竦し、貢の宿忿を以て、往かば必ず害せられんとす。岱言ふ、君に在りては則ち君の為にし、且つ母は牢獄に在れば、期するに当に往くべきにあり、若し入りて見ゆるを得ば、事自ら当に解くべし、と。遂に書を通じて自ら白すに、貢、即ち与に相ひ見ゆ。才辞敏捷にして、好く自ら陳謝すれば、貢、登時に其の母を出す。岱、将に貢に見えんとするや、友人の張允・沈䁕に語りて豫め船を具へしむ、貢必ず悔い、当に之を追逐すべければなり。出づるや便ち母を将ゐて船に乗り、道を易へて逃る。貢、須臾にして人を遣はして之を追はしめ、追ふ者に令すらく、若し船に及ばば、江上にて便ち之を殺し、已に過ぐれば則ち止めよ、と。使ひ、岱と道を錯へ、遂に免る。誅せらるる時、年三十余なり」と。『江表伝』に曰く、「時に道士琅邪の于吉なる者有り、先に東方に寓居し、呉会に往来し、精舎を立て、香を焼き道書を読み、符水を製作して以て病を治し、呉会の人、多く之に事ふ。策、嘗て郡の城門楼上に於て、諸将・賓客を集会せしに、吉、乃ち盛服して小函を杖つき、之に漆画し、名づけて仙人鏵と為し、門下を趨り度る。諸将・賓客の三分の二、楼を下りて之を迎へ拝し、掌賓の者、禁呵すれども止むる能はず。策、即ち令して之を収へしむ。諸もろの之に事ふる者、悉く婦女をして入りて策の母に見えしめ、之を救はんことを請ふ。母、策に謂ひて曰く、『于先生も亦た軍を助けて福を作し、将士を医護すれば、之を殺すべからず』と。策曰く、『此の子は妖妄にして、能く衆心を幻惑し、遠く諸将をして復た君臣の礼を相ひ顧みざらしめ、尽く策を委てて楼を下りて之を拝せしむれば、除かざるべからざるなり』と。諸将、復た連名して白事を通じ之を陳乞するに、策曰く、『昔、南陽の張津、交州刺史と為り、前聖の典訓を舎て、漢家の法律を廃し、嘗て絳帕頭を著け、琴を鼓し香を焼き、邪俗の道書を読み、以て化を助くと云ひしが、卒に南夷の殺す所と為れり。此れ甚だ無益なるに、諸君但だ未だ悟らざるのみ。今、此の子は已に鬼籙に在れば、復た紙筆を費やす勿かれ』と。即ち催して之を斬り、首を市に県く。諸もろの之に事ふる者、尚ほ其の死せるを謂はずして屍解すと云ひ、復た祭祀して福を求む」と。『志林』に曰く、「初め順帝の時、琅邪の宮崇、闕に詣りて師の于吉が曲陽の泉水の上に得たる所の神書を上る、白素朱界にして、太平清領道と号し、凡そ百余巻なり。順帝より建安中に至るまで、五六十歳なれば、于吉は是の時近く已に百年、年は耄悼に在れば、礼に刑を加へず。又た天子の巡狩するや、百年の者を問ひ、就きて之に見え、歯を敬ひて以て親愛するは、聖王の至教なり。吉の罪は死に及ばざるに、暴に酷刑を加ふるは、是れ乃ち謬誅にして、美と為す所以に非ざるなり。喜、桓王の薨ずるを推考するに、建安五年四月四日なり。是の時、曹・袁相ひ攻め、未だ勝負有らず。夏侯元譲が石威則に与ふる書を案ずるに、袁紹破るるの後なり。書に云ふ、『孫賁に授くるに長沙を以てし、張津に業さしむるに零・桂を以てす』と。此れ桓王は前に於て亡し、張津は後に於て死したる為れば、相ひ譲りて津の死意を譬へ言ふを得ず」と。臣松之案ずるに、「太康八年、広州大中正王範、『交広二州春秋』を上る。建安六年、張津は猶ほ交州牧為り。『江表伝』の虚なること『志林』の云ふ所の如し。『捜神記』に曰く、策、江を渡りて許を襲はんと欲し、吉と倶に行く。時に大旱にして、所在熇厲たり。策、諸将士を催して速やかに船を引かしめ、或いは身自ら早く出でて督切するに、将吏の多くが吉の処に在るを見、策、此れに因りて激怒し、言ふ、『我は于吉に如かずと為すか、而も先に之に趨務するは』と。便ち吉を収へしむ。至るや、之を呵問して曰く、『天旱して雨ふらず、道塗艱渋にして、時に過ぐるを得ず、故に自ら早く出でたるに、卿は憂戚を同じくせず、船中に安坐して鬼物の態を作し、吾が部伍を敗れば、今当に相ひ除くべし』と。人をして縛して地上に置きて之を暴さしめ、雨を請はしむらく、若し能く天を感ぜしめて日中に雨ふらば、当に原赦すべく、爾らずんば誅を行はん、と。俄かにして雲気上り蒸し、膚寸にして合し、日中に至る比ひ、大雨総べて至り、渓澗盈溢す。将士喜悦し、吉は必ず見原せられんと以為ひ、並び往きて慶慰す。策、遂に之を殺す。将士哀惜し、共に其の屍を蔵む。天夜になり、忽ち更に雲を興して之を覆ひ、明旦往きて視るに、在る所を知らず、と。『江表伝』・『捜神記』を案ずるに、于吉の事同じからず、未だ孰れか是なるかを詳らかにせず」と。", "translation": "『呉録』にいう。「当時、高岱という人物がおり、会稽郡の餘姚県に隠棲していた。孫策は命を下して彼を召し出し、会稽郡丞の陸昭を遣わして迎えさせ、孫策自身も謙虚な態度で彼を待ち受けた。孫策は高岱が『春秋左氏伝（左伝）』に精通していると聞き、自らも『左伝』を熟読して、高岱と議論・講究したいと望んでいた。ところが或る者が孫策に吹き込んで言った。『高岱は、将軍（孫策）のことをただ武勇に優れているだけで学問の才はないと見下しております。もし彼と『左伝』を論じて、彼が「分かりません」などと答えたならば、私の言った通り（将軍を相手にする価値もないと馬鹿にしている証拠）でございます』。その者はまた高岱にも近づいて言った。『孫将軍（孫策）というお方は、自分より優れた者を憎む気性です。もし質問されたら、そのつど「分かりません」とお答えになるのが将軍のお心に叶うでしょう。もしすべての意義を弁じたてて論破したりすれば、必ずお命が危うくなりますぞ』。高岱はもっともだと思い込み、いざ孫策と『左伝』を論じる段になると、質問に対して『分かりません』と答えることがあった。孫策は果たして激怒し、自分を馬鹿にしているのだとみなして、高岱を獄に繋いだ。高岱の友人や当時の人々はみな屋外に座り込んで（露坐）彼の助命を嘆願した。孫策が物見櫓に登って眺めると、数里四方が嘆願の人々で埋め尽くされていた。孫策は高岱がこれほどまでに大衆の心を掴んでいることを忌み嫌い、ついに彼を処刑した。高岱は字を孔文といい、呉郡の人である。生まれつき聡明で道理に通じ、財貨を軽んじて義理を重んじた。彼が士人と交友を結んで奇才を抜擢するにあたっては、まだ世に名が出る前の無名のうちから見出し、彼が友とした八人はみな当代の傑物ばかりであった。呉郡太守の盛憲は高岱を上計吏に任じ、孝廉に推挙した。のち許貢がやって来て呉郡を統治するようになると、高岱は盛憲を連れて許昭の家へ避難させ、徐州牧の陶謙に救援を求めた。陶謙がすぐには救援を出さずにいると、高岱はやつれ果てて血の涙を流し、水や重湯すら口にしなかった。陶謙はその忠義と壮烈さに、春秋楚の申包胥にも比すべき義気があると感動し、出兵することを約束して、許貢へ威嚇の書状を送った。高岱が陶謙の書状を得て帰還すると、許貢はすでに高岱の母を投獄していた。呉郡の人々は老若を問わずみな高岱のために危惧して身をすくめ、許貢が深い恨みを抱いている以上、会いに行けば必ず殺されるだろうと案じた。しかし高岱は『主君のもとにあれば主君のために尽くし、しかも今は母が牢獄にある以上、何としても行かねばならない。もし面会することができれば、事態はおのずと解決するはずだ』と言った。こうして書状を送って自らの立場を釈明すると、許貢はただちに彼と面会した。高岱の弁舌は実に敏捷で、見事に陳謝してのけたため、許貢はその場のうちに彼の母を釈放した。高岱は許貢に会いに行く際、友人の張允・沈䁕に語ってあらかじめ船を用意させておいた。許貢が必ず後悔して追っ手を差し向けるだろうと読んでいたからである。高岱は母を連れ出すやいなや、ただちに船に乗って通常とは別の水路を通って逃走した。許貢は案の定、まもなく追っ手を差し向け、追跡者に『もし船に追いついたら長江の上でただちに殺せ。すでに通り過ぎていたら追跡を止めよ』と命じた。追っ手は高岱と道がすれ違いになり、高岱は無事に難を逃れたのであった。孫策に処刑された時、年は三十余歳であった」。『江表伝』にいう。「当時、琅邪出身の道士で于吉という者があり、以前から東方（江東）に寓居して呉郡と会稽郡の間を往来し、精舎（道場）を建て、香を焚いて道書（道教経典）を読誦し、符水（呪符の水）を作って人々の病気を治療していたため、呉郡・会稽の人々の多くが彼に師事していた。あるとき孫策が郡の城門の楼上で諸将や賓客を集めて宴会を開いていたところ、于吉が立派な道服をまとい、漆塗りで絵を描いた『仙人鏵（仙人の鋤）』と名づけた小箱を杖のように携えて、城門の下を小走りに通り過ぎた。すると楼上の諸将や賓客の三分の二までが楼を下りて于吉を出迎え礼拝し、接待役の役人が大声で制止しても止められなかった。孫策はただちに命を下して于吉を捕らえさせた。于吉に師事する者たちは、こぞって女性たちを孫策の母である呉夫人のもとへ参上させ、于吉の助命を嘆願させた。母（呉夫人）は孫策に言った。『于先生（于吉）もまた軍を助けて福をもたらし、将兵を医療・看護してくれているのですから、殺してはなりません』。しかし孫策は言った。『この男は妖しげな妄説を唱え、大衆の心を幻惑して、諸将に君臣の礼を顧みさせなくし、みな私（孫策）を放り出してまで楼を下りて拝ませるほどに至っております。絶対に除かねばなりません』。諸将が再び連名で陳情書（白事）を提出して助命を乞うと、孫策は言った。『昔、南陽の張津は交州刺史となった際、いにしえの聖人の教えを捨て去り、漢王朝の法律を廃して、いつも赤い頭巾（絳帕頭）をかぶり、琴を弾き香を焚いては邪俗の道書を読み、それで教化を助けるのだと称していたが、最後には南方の異民族（南夷）に殺されてしまった。このようなものは全く無益であるのに、諸君がまだ悟っていないだけなのだ。今、この男（于吉）はすでに死者の名簿（鬼籙）に載っている身なのだから、これ以上紙や筆を無駄に費やすな』。そしてただちにせき立てて于吉を斬首させ、その首を市場に晒した。それでも于吉に師事して
