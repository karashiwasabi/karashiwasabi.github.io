忠壮にして{{person:申包胥|申包胥}}の義有るに感じ、許して為に軍を出し、書を以て{{person:許貢|貢}}に与ふ。{{person:高岱|岱}}、{{person:陶謙|謙}}の書を得て以て還るに、{{person:許貢|貢}}は已に其の母を囚ふ。{{place:呉郡|呉}}人の大小、皆為に危竦し、{{person:許貢|貢}}の宿忿を以て、往かば必ず害せられんとす。{{person:高岱|岱}}言ふ、君に在りては則ち君の為にし、且つ母は牢獄に在れば、期するに当に往くべきにあり、若し入りて見ゆるを得ば、事自ら当に解くべし、と。遂に書を通じて自ら白すに、{{person:許貢|貢}}、即ち与に相ひ見ゆ。才辞敏捷にして、好く自ら陳謝すれば、{{person:許貢|貢}}、登時に其の母を出す。{{person:高岱|岱}}、将に{{person:許貢|貢}}に見えんとするや、友人の{{person:張允|張允}}・{{person:沈䁕|沈䁕}}に語りて豫め船を具へしむ、{{person:許貢|貢}}必ず悔い、当に之を追逐すべければなり。出づるや便ち母を将ゐて船に乗り、道を易へて逃る。{{person:許貢|貢}}、須臾にして人を遣はして之を追はしめ、追ふ者に令すらく、若し船に及ばば、{{place:長江|江上}}にて便ち之を殺し、已に過ぐれば則ち止めよ、と。使ひ、{{person:高岱|岱}}と道を錯へ、遂に免る。誅せらるる時、年三十余なり」と。『{{special:引用史料|江表伝}}』に曰く、「時に道士{{place:琅邪|琅邪}}の{{person:于吉|于吉}}なる者有り、先に東方に寓居し、{{place:呉郡|呉}}{{place:会稽|会}}に往来し、{{special:精舎|精舎}}を立て、香を焼き道書を読み、{{special:符水|符水}}を製作して以て病を治し、{{place:呉郡|呉}}{{place:会稽|会}}の人、多く之に事ふ。{{person:孫策|策}}、嘗て郡の城門楼上に於て、諸将・賓客を集会せしに、{{person:于吉|吉}}、乃ち盛服して小函を杖つき、之に漆画し、名づけて{{special:仙人鏵|仙人鏵}}と為し、門下を趨り度る。諸将・賓客の三分の二、楼を下りて之を迎へ拝し、掌賓の者、禁呵すれども止むる能はず。{{person:孫策|策}}、即ち令して之を収へしむ。諸もろの之に事ふる者、悉く婦女をして入りて{{person:呉夫人|策の母}}に見えしめ、之を救はんことを請ふ。母、{{person:孫策|策}}に謂ひて曰く、『{{person:于吉|于先生}}も亦た軍を助けて福を作し、将士を医護すれば、之を殺すべからず』と。{{person:孫策|策}}曰く、『此の子は妖妄にして、能く衆心を幻惑し、遠く諸将をして復た君臣の礼を相ひ顧みざらしめ、尽く{{person:孫策|策}}を委てて楼を下りて之を拝せしむれば、除かざるべからざるなり』と。諸将、復た連名して白事を通じ之を陳乞するに、{{person:孫策|策}}曰く、『昔、{{place:南陽|南陽}}の{{person:張津|張津}}、{{place:交州|交州}}{{office:刺史|刺史}}と為り、前聖の典訓を舎て、漢家の法律を廃し、嘗て絳帕頭を著け、琴を鼓し香を焼き、邪俗の道書を読み、以て化を助くと云ひしが、卒に南夷の殺す所と為れり。此れ甚だ無益なるに、諸君但だ未だ悟らざるのみ。今、此の子は已に{{special:鬼籙|鬼籙}}に在れば、復た紙筆を費やす勿かれ』と。即ち催して之を斬り、首を市に県く。諸もろの之に事ふる者、尚ほ其の死せるを謂はずして{{special:屍解|屍解}}すと云ひ、復た祭祀して福を求む」と。『{{special:引用史料|志林}}』に曰く、「初め{{person:順帝|順帝}}の時、{{place:琅邪|琅邪}}の{{person:宮崇|宮崇}}、闕に詣りて師の{{person:于吉|于吉}}が{{place:曲陽|曲陽}}の泉水の上に得たる所の神書を上る、白素朱界にして、{{special:太平清領道|太平清領道}}と号し、凡そ百余巻なり。{{person:順帝|順帝}}より{{special:建安|建安}}中に至るまで、五六十歳なれば、{{person:于吉|于吉}}は是の時近く已に百年、年は{{special:耄悼|耄悼}}に在れば、礼に刑を加へず。又た天子の巡狩するや、百年の者を問ひ、就きて之に見え、歯を敬ひて以て親愛するは、聖王の至教なり。{{person:于吉|吉}}の罪は死に及ばざるに、暴に酷刑を加ふるは、是れ乃ち謬誅にして、美と為す所以に非ざるなり。{{person:虞喜|喜}}、{{person:孫策|桓王}}の薨ずるを推考するに、{{special:建安|建安五年}}四月四日なり。是の時、{{person:曹操|曹}}・{{person:袁紹|袁}}相ひ攻め、未だ勝負有らず。{{person:夏侯惇|夏侯元譲}}が{{person:石威則|石威則}}に与ふる書を案ずるに、{{person:袁紹|袁紹}}破るるの後なり。書に云ふ、『{{person:孫賁|孫賁}}に授くるに{{place:長沙|長沙}}を以てし、{{person:張津|張津}}に業さしむるに{{place:零陵|零}}・{{place:桂陽|桂}}を以てす』と。此れ{{person:孫策|桓王}}は前に於て亡し、{{person:張津|張津}}は後に於て死したる為れば、相ひ譲りて{{person:張津|津}}の死意を譬へ言ふを得ず」と。{{person:裴松之|臣松之}}案ずるに、「{{special:太康|太康八年}}、{{place:交州|広州}}{{office:大中正|大中正}}{{person:王範|王範}}、『{{special:引用史料|交広二州春秋}}』を上る。{{special:建安|建安六年}}、{{person:張津|張津}}は猶ほ{{place:交州|交州}}{{office:牧|牧}}為り。『{{special:引用史料|江表伝}}』の虚なること『{{special:引用史料|志林}}』の云ふ所の如し。『{{special:引用史料|捜神記}}』に曰く、{{person:孫策|策}}、{{place:長江|江を渡り}}て{{place:許|許}}を襲はんと欲し、{{person:于吉|吉}}と倶に行く。時に大旱にして、所在熇厲たり。{{person:孫策|策}}、諸将士を催して速やかに船を引かしめ、或いは身自ら早く出でて督切するに、将吏の多くが{{person:于吉|吉}}の処に在るを見、{{person:孫策|策}}、此れに因りて激怒し、言ふ、『我は{{person:于吉|于吉}}に如かずと為すか、而も先に之に趨務するは』と。便ち{{person:于吉|吉}}を収へしむ。至るや、之を呵問して曰く、『天旱して雨ふらず、道塗艱渋にして、時に過ぐるを得ず、故に自ら早く出でたるに、卿は憂戚を同じくせず、船中に安坐して鬼物の態を作し、吾が部伍を敗れば、今当に相ひ除くべし』と。人をして縛して地上に置きて之を暴さしめ、雨を請はしむらく、若し能く天を感ぜしめて日中に雨ふらば、当に原赦すべく、爾らずんば誅を行はん、と。俄かにして雲気上り蒸し、膚寸にして合し、日中に至る比ひ、大雨総べて至り、渓澗盈溢す。将士喜悦し、{{person:于吉|吉}}は必ず見原せられんと以為ひ、並び往きて慶慰す。{{person:孫策|策}}、遂に之を殺す。将士哀惜し、共に其の屍を蔵む。天夜になり、忽ち更に雲を興して之を覆ひ、明旦往きて視るに、在る所を知らず、と。『{{special:引用史料|江表伝}}』・『{{special:引用史料|捜神記}}』を案ずるに、{{person:于吉|于吉}}の事同じからず、未だ孰れか是なるかを詳らかにせず」と。", "translation_tagged": "『{{special:引用史料|呉録}}』にいう。「当時、{{person:高岱|高岱}}という人物がおり、{{place:会稽|会稽}}郡の{{place:餘姚|餘姚}}県に隠棲していた。{{person:孫策|孫策}}は命を下して彼を召し出し、{{place:会稽|会稽}}{{office:郡丞|郡丞}}の{{person:陸昭|陸昭}}を遣わして迎えさせ、{{person:孫策|孫策}}自身も謙虚な態度で彼を待ち受けた。{{person:孫策|孫策}}は{{person:高岱|高岱}}が『{{special:左伝|春秋左氏伝（左伝）}}』に精通していると聞き、自らも『{{special:左伝|左伝}}』を熟読して、{{person:高岱|高岱}}と議論・講究したいと望んでいた。ところが或る者が{{person:孫策|孫策}}に吹き込んで言った。『{{person:高岱|高岱}}は、将軍（{{person:孫策|孫策}}）のことをただ武勇に優れているだけで学問の才はないと見下しております。もし彼と『{{special:左伝|左伝}}』を論じて、彼が「分かりません」などと答えたならば、私の言った通り（将軍を相手にする価値もないと馬鹿にしている証拠）でございます』。その者はまた{{person:高岱|高岱}}にも近づいて言った。『{{person:孫策|孫将軍}}（{{person:孫策|孫策}}）というお方は、自分より優れた者を憎む気性です。もし質問されたら、そのつど「分かりません」とお答えになるのが将軍のお心に叶うでしょう。もしすべての意義を弁じたてて論破したりすれば、必ずお命が危うくなりますぞ』。{{person:高岱|高岱}}はもっともだと思い込み、いざ{{person:孫策|孫策}}と『{{special:左伝|左伝}}』を論じる段になると、質問に対して『分かりません』と答えることがあった。{{person:孫策|孫策}}は果たして激怒し、自分を馬鹿にしているのだとみなして、{{person:高岱|高岱}}を獄に繋いだ。{{person:高岱|高岱}}の友人や当時の人々はみな屋外に座り込んで（露坐）彼の助命を嘆願した。{{person:孫策|孫策}}が物見櫓に登って眺めると、数里四方が嘆願の人々で埋め尽くされていた。{{person:孫策|孫策}}は{{person:高岱|高岱}}がこれほどまでに大衆の心を掴んでいることを忌み嫌い、ついに彼を処刑した。{{person:高岱|高岱}}は字を{{person:高岱|孔文}}といい、{{place:呉郡|呉郡}}の人である。生まれつき聡明で道理に通じ、財貨を軽んじて義理を重んじた。彼が士人と交友を結んで奇才を抜擢するにあたっては、まだ世に名が出る前の無名のうちから見出し、彼が友とした八人はみな当代の傑物ばかりであった。{{place:呉郡|呉郡}}{{office:太守|太守}}の{{person:盛憲|盛憲}}は{{person:高岱|高岱}}を{{office:上計|上計吏}}に任じ、{{special:孝廉|孝廉}}に推挙した。のち{{person:許貢|許貢}}がやって来て{{place:呉郡|呉郡}}を統治するようになると、{{person:高岱|高岱}}は{{person:盛憲|盛憲}}を連れて{{person:許昭|許昭}}の家へ避難させ、{{place:徐州|徐州}}{{office:牧|牧}}の{{person:陶謙|陶謙}}に救援を求めた。{{person:陶謙|陶謙}}がすぐには救援を出さずにいると、{{person:高岱|高岱}}はやつれ果てて血の涙を流し、水や重湯すら口にしなかった。{{person:陶謙|陶謙}}はその忠義と壮烈さに、春秋楚の{{person:申包胥|申包胥}}にも比すべき義気があると感動し、出兵することを約束して、{{person:許貢|許貢}}へ威嚇の書状を送った。{{person:高岱|高岱}}が{{person:陶謙|陶謙}}の書状を得て帰還すると、{{person:許貢|許貢}}はすでに{{person:高岱|高岱}}の母を投獄していた。{{place:呉郡|呉郡}}の人々は老若を問わずみな{{person:高岱|高岱}}のために危惧して身をすくめ、{{person:許貢|許貢}}が深い恨みを抱いている以上、会いに行けば必ず殺されるだろうと案じた。しかし{{person:高岱|高岱}}は『主君のもとにあれば主君のために尽くし、しかも今は母が牢獄にある以上、何としても行かねばならない。もし面会することができれば、事態はおのずと解決するはずだ』と言った。こうして書状を送って自らの立場を釈明すると、{{person:許貢|許貢}}はただちに彼と面会した。{{person:高岱|高岱}}の弁舌は実に敏捷で、見事に陳謝してのけたため、{{person:許貢|許貢}}はその場のうちに彼の母を釈放した。{{person:高岱|高岱}}は{{person:許貢|許貢}}に会いに行く際、友人の{{person:張允|張允}}・{{person:沈䁕|沈䁕}}に語ってあらかじめ船を用意させておいた。{{person:許貢|許貢}}が必ず後悔して追っ手を差し向けるだろうと読んでいたからである。{{person:高岱|高岱}}は母を連れ出すやいなや、ただちに船に乗って通常とは別の水路を通って逃走した。{{person:許貢|許貢}}は案の定、まもなく追っ手を差し向け、追跡者に『もし船に追いついたら{{place:長江|長江}}の上でただちに殺せ。すでに通り過ぎていたら追跡を止めよ』と命じた。追っ手は{{person:高岱|高岱}}と道がすれ違いになり、{{person:高岱|高岱}}は無事に難を逃れたのであった。{{person:孫策|孫策}}に処刑された時、年は三十余歳であった」。『{{special:引用史料|江表伝}}』にいう。「当時、{{place:琅邪|琅邪}}出身の道士で{{person:于吉|于吉}}という者があり、以前から東方（江東）に寓居して{{place:呉郡|呉郡}}と{{place:会稽|会稽}}郡の間を往来し、{{special:精舎|精舎（道場）}}を建て、香を焚いて道書（道教経典）を読誦し、{{special:符水|符水（呪符の水）}}を作って人々の病気を治療していたため、{{place:呉郡|呉郡}}・{{place:会稽|会稽}}の人々の多くが彼に師事していた。あるとき{{person:孫策|孫策}}が郡の城門の楼上で諸将や賓客を集めて宴会を開いていたところ、{{person:于吉|于吉}}が立派な道服をまとい、漆塗りで絵を描いた『{{special:仙人鏵|仙人鏵（仙人の鋤）}}』と名づけた小箱を杖のように携えて、城門の下を小走りに通り過ぎた。すると楼上の諸将や賓客の三分の二までが楼を下りて{{person:于吉|于吉}}を出迎え礼拝し、接待役の役人が大声で制止しても止められなかった。{{person:孫策|孫策}}はただちに命を下して{{person:于吉|于吉}}を捕らえさせた。{{person:于吉|于吉}}に師事する者たちは、こぞって女性たちを孫{{person:呉夫人|策の母}}である{{person:呉夫人|呉夫人}}のもとへ参上させ、{{person:于吉|于吉}}の助命を嘆願させた。母（{{person:呉夫人|呉夫人}}）は{{person:孫策|孫策}}に言った。『{{person:于吉|于先生}}（{{person:于吉|于吉}}）もまた軍を助けて福をもたらし、将兵を医療・看護してくれているのですから、殺してはなりません』。しかし{{person:孫策|孫策}}は言った。『この男は妖しげな妄説を唱え、大衆の心を幻惑して、諸将に君臣の礼を顧みさせなくし、みな私（{{person:孫策|孫策}}）を放り出してまで楼を下りて拝ませるほどに至っております。絶対に除かねばなりません』。諸将が再び連名で陳情書（白事）を提出して助命を乞うと、{{person:孫策|孫策}}は言った。『昔、{{place:南陽|南陽}}の{{person:張津|張津}}は{{place:交州|交州}}{{office:刺史|刺史}}となった際、いにしえの聖人の教えを捨て去り、漢王朝の法律を廃して、いつも赤い頭巾（絳帕頭）をかぶり、琴を弾き香を焚いては邪俗の道書を読み、それで教化を助けるのだと称していたが、最後には南方の異民族（南夷）に殺されてしまった。このようなものは全く無益であるのに、諸君がまだ悟っていないだけなのだ。今、この男（{{person:于吉|于吉}}）はすでに{{special:鬼籙|死者の名簿（鬼籙）}}に載っている身なのだから、これ以上紙や筆を無駄に費やすな』。そしてただちにせき立てて{{person:于吉|于吉}}を斬首させ、その首を市場に晒した。それでも{{person:于吉|于吉}}に師事していた者たちは、なお彼が死んだとは思わずに『{{special:屍解|屍解}}（肉体を抜け出して仙人になること）したのだ』と言い合い、再び祭祀を行って福を求めた」。{{person:虞喜|虞喜}}の『{{special:引用史料|志林}}』にいう。「かつて後漢の{{person:順帝|順帝}}の時、{{place:琅邪|琅邪}}の{{person:宮崇|宮崇}}が宮闕に参上し、師の{{person:于吉|于吉}}が{{place:曲陽|曲陽}}の泉水のほとりで手に入れたという神書（神仙の書）を献上した。白い絹地に朱色の罫線が引かれ、『{{special:太平清領道|太平清領道（太平経）}}』と号し、全百余巻であった。{{person:順帝|順帝}}の時代から{{special:建安|建安}}年間までは五、六十年が経過しているから、{{person:于吉|于吉}}はこの時すでに百歳近くになっていたはずであり、年齢が『{{special:耄悼|耄悼}}（八十・九十歳の老齢と七歳以下の幼少）』にあたるため、礼制の上では刑罰を加えない決まりである。また天子が天下を巡狩する際には、百歳の長寿者を尋ねて自らそのもとへ赴いて引見し、年長者を敬って親愛の情を示すのが聖王の至高の教えである。{{person:于吉|于吉}}の罪は死刑に値しないにもかかわらず、にわかに酷刑を加えたのは、誤った処刑（謬誅）というべきであり、美談とすべきことではない。私（{{person:虞喜|虞喜}}）が{{person:孫策|長沙桓王}}（{{person:孫策|孫策}}）の薨去した日を推考するに、{{special:建安|建安五年}}四月四日のことである。この時、{{person:曹操|曹公}}（{{person:曹操|曹操}}）と{{person:袁紹|袁紹}}が官渡で攻防を繰り広げており、いまだ勝負は決していなかった。{{person:夏侯惇|夏侯元譲}}（{{person:夏侯惇|夏侯惇}}）が{{person:石威則|石威則}}に宛てた書状を調べてみると、それは{{person:袁紹|袁紹}}が敗れた後のことであるが、その書状には『{{person:孫賁|孫賁}}に{{place:長沙|長沙}}を授け、{{person:張津|張津}}に{{place:零陵|零陵}}・{{place:桂陽|桂陽}}を治めさせる』とある。これは{{person:孫策|長沙桓王}}（{{person:孫策|孫策}}）が先に亡くなり、{{person:張津|張津}}はその後に死んだことを意味しているから、{{person:孫策|孫策}}が諸将をたしなめる際に{{person:張津|張津}}の死を例に挙げて語ることはあり得ないはずである」。臣{{person:裴松之|裴松之}}が考えるに、「西晋の{{special:太康|太康八年}}（287年）、{{place:交州|広州}}{{office:大中正|大中正}}の{{person:王範|王範}}が『{{special:引用史料|交広二州春秋}}』を献上したが、それによれば{{special:建安|建安六年}}（201年）の時点でも{{person:張津|張津}}はまだ{{place:交州|交州}}{{office:牧|牧}}の任にあった。『{{special:引用史料|江表伝}}』の記述が虚偽であることは、『{{special:引用史料|志林}}』が指摘する通りである。また『{{special:引用史料|捜神記}}』にはこう記されている。『{{person:孫策|孫策}}が{{place:長江|長江}}を渡って{{place:許|許都}}を奇襲しようとした際、{{person:于吉|于吉}}を同行させていた。時に大旱魃に見舞われ、至るところ灼けつくような猛暑であった。{{person:孫策|孫策}}は将兵を督促して速やかに船を曳かせ、あるいは自ら早朝に出向いて厳しく指図していたが、将兵や役人の多くが{{person:于吉|于吉}}のもとに集まっているのを見て、{{person:孫策|孫策}}はこれに激怒し、「私が{{person:于吉|于吉}}に及ばないとでもいうのか！ なぜ私より先に奴のもとへ駆けつけるのだ」と言い、ただちに{{person:于吉|于吉}}を捕らえさせた。{{person:于吉|于吉}}が引き立てられて来ると、{{person:孫策|孫策}}は厳しく詰問して言った。「日照りで雨が降らず、水路も難渋して予定通りに進めないからこそ、私自身が早朝から出向いているのだ。それなのに卿（{{person:于吉|于吉}}）は憂いを共にしようともせず、船中に安坐して妖しげな振る舞いをなし、我が軍の規律を乱している。今こそ処分してくれよう」。そして人に命じて{{person:于吉|于吉}}を縛り上げて炎天の地面に晒させ、雨乞いを命じて、「もし天を感応させて真昼（日中）までに雨を降らせることができれば赦免してやるが、できなければ処刑する」と言い渡した。するとたちまち雲気が立ち上り、わずかな雲が集まったかと思うと、真昼になるころには大雨が降り注ぎ、谷川や渓流が溢れ返った。将兵たちは大いに喜び、{{person:于吉|于吉}}は必ず赦免されると思ってこぞって祝いに駆けつけた。ところが{{person:孫策|孫策}}はそのまま{{person:于吉|于吉}}を処刑してしまった。将兵たちは深く哀惜し、ともにその亡骸を収めて葬った。その夜、忽ち再び雲が湧き起こって亡骸の上を覆い、翌朝に行って確かめてみると、亡骸がどこへ消えたか分からなくなっていた』。思うに『{{special:引用史料|江表伝}}』と『{{special:引用史料|捜神記}}』とでは{{person:于吉|于吉}}に関する記述が異なっており、どちらが事実であるかは定かでない」。"}, {"id": "v46_p17_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 17, "type": "本文", "raw_text": "密治兵，部署諸將。未發，會爲故吳郡太守許貢客所殺。", "kakikudashi": "密かに兵を治め、諸将を部署す。未だ発せざるに、会ま故の呉郡太守許貢の客の殺す所と為る。", "translation": "密かに軍備を整え、諸将の配置を進めていた。しかしいまだ出陣しないうちに、たまたま故の呉郡太守・許貢の食客（刺客）によって暗殺された。", "persons": "孫策,許貢", "places": "呉郡", "era_year": "建安5年（200年）", "source_book": "", "keywords": "太守", "raw_tagged": "密治兵，部署諸將。未發，會爲故{{place:呉郡|吳郡}}{{office:太守|太守}}{{person:許貢|許貢}}客所殺。", "kakikudashi_tagged": "密かに兵を治め、諸将を部署す。未だ発せざるに、会ま故の{{place:呉郡|呉郡}}{{office:太守|太守}}{{person:許貢|許貢}}の客の殺す所と為る。", "translation_tagged": "密かに軍備を整え、諸将の配置を進めていた。しかしいまだ出陣しないうちに、たまたま故の{{place:呉郡|呉郡}}{{office:太守|太守}}・{{person:許貢|許貢}}の食客（刺客）によって暗殺された。"}, {"id": "v46_p18_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 18, "type": "本文", "raw_text": "先是，策殺貢，貢小子與客亡匿江邊。策單騎出，卒與客遇，客擊傷策。", "kakikudashi": "是より先、策、貢を殺し、貢の小子、客と江辺に亡匿す。策、単騎にて出で、卒かに客と遇ひ、客、策を撃ちて傷つく。", "translation": "これより以前、孫策が許貢を殺害した際、許貢の末子と食客たちは長江のほとり（江辺）に逃げ隠れていた。孫策が単騎で外出したとき、不意にその食客たちと出くわし、食客は孫策を襲撃して重傷を負わせた。", "persons": "孫策,許貢", "places": "長江", "era_year": "建安5年（200年）", "source_book": "", "keywords": "", "raw_tagged": "先是，{{person:孫策|策}}殺{{person:許貢|貢}}，{{person:許貢|貢}}小子與客亡匿{{place:長江|江邊}}。{{person:孫策|策}}單騎出，卒與客遇，客擊傷{{person:孫策|策}}。", "kakikudashi_tagged": "是より先、{{person:孫策|策}}、{{person:許貢|貢}}を殺し、{{person:許貢|貢}}の小子、客と{{place:長江|江辺}}に亡匿す。{{person:孫策|策}}、単騎にて出で、卒かに客と遇ひ、客、{{person:孫策|策}}を撃ちて傷つく。", "translation_tagged": "これより以前、{{person:孫策|孫策}}が{{person:許貢|許貢}}を殺害した際、{{person:許貢|許貢}}の末子と食客たちは{{place:長江|長江}}のほとり（{{place:長江|江辺}}）に逃げ隠れていた。{{person:孫策|孫策}}が単騎で外出したとき、不意にその食客たちと出くわし、食客は{{person:孫策|孫策}}を襲撃して重傷を負わせた。"}, {"id": "v46_p18_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 18, "type": "裴注", "raw_text": "《江表傳》曰：「廣陵太守陳登治射陽，登卽瑀之從兄子也。策前西征，登陰復遣間使，以印綬與嚴白虎餘黨，圖爲後害，以報瑀見破之辱。策歸，復討登。軍到丹徒，須待運糧。策性好獵，將步騎數出。策驅馳逐鹿，所乘馬精駿，從騎絶不能及。初，吳郡太守許貢上表於漢帝曰：『孫策驍雄，與項籍相似，宜加貴寵，召還京邑。若被詔不得不還，若放於外必作世患。』策候吏得貢表，以示策。策請貢相見，以責讓貢。貢辭無表，策卽令武士絞殺之。貢奴客潛民間，欲爲貢報讎。獵日，卒有三人卽貢客也。策問：『爾等何人？』答云：『是韓當兵，在此射鹿耳。』策曰：『當兵吾皆識之，未嘗見汝等。』因射一人，應弦而倒。餘二人怖急，便舉弓射策，中頰。後騎尋至，皆刺殺之。」《九州春秋》曰：「策聞曹公北征柳城，悉起江南之衆，自號大司馬，將北襲許，恃其勇，行不設備，故及於難。」孫盛《異同評》曰：「凡此數書，各有所失。孫策雖威行江外，略有六郡，然黃祖乘其上流，陳登間其心腹，且深險強宗，未盡歸復，曹袁虎爭，勢傾山海，策豈暇遠師汝潁，而遷帝於吳越哉？斯蓋庸人之所鑑見，況策達於事勢者乎？又案袁紹以建安五年至黎陽，而策以四月遇害，而《志》云策聞曹公與紹相拒於官渡，謬矣。伐登之言，爲有證也。又《江表傳》説策悉識韓當軍士，疑此爲詐，便射殺一人。夫三軍將士或有新附，策爲大將，何能悉識？以所不識，便射殺之，非其論也，又策見殺在五年，柳城之役在十二年，《九州春秋》乖錯尤甚矣。」臣松之案：「《傅子》亦云曹公征柳城，將襲許。記述若斯，何其疏哉！然孫盛所譏，未爲悉是。黃祖始被策破，魂氣未反，（但）劉表君臣本無兼併之志，雖在上流，何辦規擬吳會？策之此舉，理應先圖陳登，但舉兵所在，不止登而已。於時強宗驍帥，祖郎、嚴虎之徒，禽滅已盡，所餘山越，蓋何足慮？然則策之所規，未可謂之不暇也。若使策志獲從，大權在手，淮泗之間，所在皆可都，何必畢志江外，其當遷帝於揚越哉？案《魏武紀》，武帝以建安四年已出屯官渡，乃策未死之前，久與袁紹交兵，則《國志》所云不爲謬也。許貢客，無聞之小人，而能感識恩遇，臨義忘生，卒然奮發，有侔古烈矣。詩云：『君子有徽猷，小人與屬。』貢客其有焉。」", "kakikudashi": "『江表伝』に曰く、「広陵太守陳登、射陽に治す、登は即ち瑀の従兄の子なり。策が前に西征するや、登、陰かに復た間使を遣はし、印綬を以て厳白虎の余党に与へ、後害を為さんことを図り、以て瑀が破られし辱に報いんとす。策帰り、復た登を討たんとす。軍、丹徒に到り、運糧を須待つ。策、性、猟を好み、歩騎を将ゐてしばしば出づ。策、駆馳して鹿を逐ふに、乗る所の馬は精駿にして、従騎絶えて及ぶ能はず。初め、呉郡太守許貢、漢帝に上表して曰く、『孫策は驍雄にして、項籍と相ひ似たれば、宜しく貴寵を加へて、京邑に召還すべし。若し詔を被らば還らざるを得ず、若し外に放たば必ず世の患ひを作さん』と。策の候吏、貢の表を得て、以て策に示す。策、貢に請ひて相ひ見え、以て貢を責譲す。貢、表無しと辞するも、策、即ち武士に令して之を絞殺せしむ。貢の奴客、民間に潜み、貢の為に讎を報いんと欲す。猟の日、卒かに三人有り、即ち貢の客なり。策問ふ、『爾等は何人ぞ』と。答へて云ふ、『是れ韓当の兵なり、此に在りて鹿を射るのみ』と。策曰く、『当の兵は吾れ皆之を識るに、未だ嘗て汝等を見ず』と。因りて一人を射るに、弦に応じて倒る。余の二人、怖急し、便ち弓を挙げて策を射、頬に中つ。後騎尋いで至り、皆之を刺殺す」と。『九州春秋』に曰く、「策、曹公が北のかた柳城を征するを聞き、悉く江南の衆を起し、自ら大司馬と号し、将に北のかた許を襲はんとし、其の勇を恃み、行くに備へを設けず、故に難に及ぶ」と。孫盛の『異同評』に曰く、「凡そ此の数書、各おの失する所有り。孫策、威は江外に行はれ、六郡を略有すと雖も、然れども黄祖は其の上流に乗じ、陳登は其の心腹を間し、且つ深険の強宗、未だ尽くは帰復せず、曹・袁は虎争して、勢ひ山海を傾くるに、策、豈に遠く汝・潁に師を出し、而して帝を呉越に遷すに暇あらんや。斯れ蓋し庸人の鑑見する所、況んや策が事勢に達する者をや。又た案ずるに、袁紹は建安五年を以て黎陽に至り、而して策は四月を以て害に遇へば、而ち『志』に策が曹公と紹と官渡に相ひ拒むを聞くと云ふは、謬りなり。登を伐つの言、証有りと為すなり。又た『江表伝』に、策が悉く韓当の軍士を識り、此れを疑ひて詐りと為し、便ち一人を射殺すと説く。夫れ三軍の将士には或いは新附有り、策、大将と為りて、何ぞ能く悉く識らんや。識らざる所を以て、便ち之を射殺すといふは、其の論に非ざるなり。又た策が殺さるるは五年に在り、柳城の役は十二年に在れば、『九州春秋』の乖錯は尤も甚だし」と。臣松之案ずるに、「『傅子』も亦た云ふ、曹公、柳城を征し、将に許を襲はんとす、と。記述の斯くの若き、何ぞ其れ疏なるや。然れども孫盛の譏る所も、未だ悉くは是と為さず。黄祖は始めて策に破られ、魂気未だ反らず、劉表の君臣は本より兼併の志無ければ、上流に在りと雖も、何ぞ呉会を規擬するを弁ぜんや。策の此の挙、理として応に先に陳登を図るべきも、但だ挙兵の在る所、登のみに止まらず。時に於て強宗・驍帥の、祖郎・厳虎の徒は、禽滅して已に尽き、余す所の山越は、蓋し何ぞ慮るに足らんや。然らば則ち策の規る所、未だ之を暇あらずと謂ふべからざるなり。若し策の志をして従ふを獲しめ、大権手に在らば、淮・泗の間、在る所皆都すべし、何ぞ必ずしも志を江外に畢へ、其れ当に帝を揚越に遷すべけんや。『魏武紀』を案ずるに、武帝は建安四年を以て已に出でて官渡に屯し、乃ち策が未だ死せざるの前、久しく袁紹と兵を交へたれば、則ち『国志』の云ふ所は謬りと為さざるなり。許貢の客は、聞ゆる無きの小人なるも、而も能く恩遇を感識し、義に臨みて生を忘れ、卒然として奮発し、古烈に侔しき有り。詩に云ふ、『君子に徽猷有れば、小人も与に属す』と。貢の客には其れ有り」と。", "translation": "『江表伝』にいう。「広陵太守の陳登は射陽に郡治を置いていたが、この陳登は先年孫策に破られた陳瑀の従兄の子（甥）であった。孫策がさきに西方（黄祖・劉勲討伐）へ遠征した際、陳登は密かに再び間使を派遣し、印綬を厳白虎の残党に与えて孫策の背後を脅かさせ、叔父の陳瑀が撃破された屈辱に報いようと企てた。孫策は帰還すると、改めて陳登を討伐しようとした。軍が丹徒まで進んだところで、兵糧の輸送を待機することとなった。孫策は生まれつき狩猟を好み、歩兵や騎兵を引き連れてはたびたび狩りに出かけた。孫策が馬を駆って鹿を追いかけると、乗っていた馬が極めて駿足であったため、供回りの騎兵はまったく追いつくことができなかった。これより以前、呉郡太守の許貢は漢帝（献帝）に上表してこう述べていた。『孫策は勇猛傑出した英雄であり、いにしえの項籍（項羽）によく似ておりますので、よろしく高貴な寵遇を加えて帝都へ召し還されるべきです。もし詔勅を拝受すれば帰還せざるを得ないでしょうが、このまま地方に放っておけば必ずや天下の患いとなりましょう』。孫策の斥候の役人がこの許貢の上表文を入手して孫策に見せた。孫策は許貢を招いて面会し、この件で許貢を厳しく詰問した。許貢は上表などしていないと弁解したが、孫策はただちに武士に命じて許貢を絞殺させた。許貢の召使いや食客たちは民間に潜伏し、許貢のために仇を討とうと狙っていた。狩りの当日、不意に三人の男が現れたが、これこそ許貢の食客であった。孫策が『貴様らは何者だ』と問うと、男たちは『韓当の兵でございます。ここで鹿を射ておりました』と答えた。孫策は『韓当の兵なら私はみな顔を知っているが、お前たちの顔は見たことがないぞ』と言い、そのまま一人を射ると、矢は弦音とともに命中して男は倒れた。残る二人は恐怖と焦りから、すぐさま弓を構えて孫策を射て、その頬に命中させた。そこへ後続の騎兵が駆けつけ、二人をともに刺し殺した」。司馬彪の『九州春秋』にいう。「孫策は曹公（曹操）が北方の柳城へ遠征したと聞き、江南の軍勢を総動員して自ら大司馬と号し、北上して許都を奇襲しようとしたが、自らの武勇を恃んで行軍の護衛を怠ったため、凶変に遭ったのである」。孫盛の『異同評』にいう。「およそこれら数書の記述には、それぞれ誤りがある。孫策の威勢は長江の外（江東）に行き渡り、六郡を平定していたとはいえ、上流には黄祖が目を光らせ、腹心の間近では陳登が離間工作を仕掛け、しかも奥深い山険の有力豪族（強宗）たちもいまだ完全には服属しておらず、北方では曹操と袁紹が竜虎のごとく争って天下を揺るがしていたのであるから、孫策にどうして遠く汝南・潁川まで出兵して献帝を呉越の地へ迎え遷す余裕などあっただろうか。これは凡庸な人間にすら見通せる道理であるのに、まして時勢に通じた孫策が分からぬはずがあろうか。また調べてみると、袁紹は建安五年になって黎陽に進出し、孫策は同年四月に殺害されているのであるから、『三國志』本文に『孫策は曹公と袁紹が官渡で対陣していると聞いて…』とあるのは誤りである。『江表伝』にある陳登討伐のために出陣したという説の方が証拠のあることである。また『江表伝』は、孫策が韓当の兵卒を全員見知っており、怪しんで偽者だと見破って一人を射殺したと説いている。しかし全軍の将兵の中には新参の者もいるはずであり、大将である孫策がどうして兵卒の顔をすべて記憶できようか。見覚えがないというだけでいきなり射殺したというのは、道理にかなった話ではない。さらに孫策が殺されたのは建安五年（200年）であり、曹操の柳城遠征は建安十二年（207年）のことであるから、『九州春秋』の年代の錯乱はとりわけ甚だしい」。臣裴松之が考えるに、「『傅子』もまた『曹公が柳城へ遠征した隙に許都を襲おうとした』と記しているが、歴史記述がこれほどまでに杜撰とは何事であろうか！ ただし孫盛が批判している内容も、すべてが正しいわけではない。当時、黄祖は孫策に大破されたばかりでまだ生気を取り戻しておらず、そもそも劉表君臣には他国を併呑する大志などなかったのであるから、たとえ上流にいたところで、どうして呉郡・会稽郡への侵攻を企てることなどできようか。孫策のこのたびの軍事行動は、順序としてはまず陳登を片付けるはずであったろうが、挙兵の最終目的は陳登だけに止まるものではなかった。当時、有力豪族や精強な首領であった祖郎・厳虎（厳白虎）の輩はすでにことごとく捕らえるか滅ぼすかし尽くしており、残る山越などどうして憂慮するに足りようか。そうであれば、孫策が計画していた許都奇襲を『余裕がなかった』と断ずることはできない。もし孫策の志が実現して天下の大権を手中に収めたならば、淮水・泗水の間のどこにでも都を置くことができたはずであり、どうして長江の外（江東）だけに閉じこもって、わざわざ帝を揚越（江南）へ遷す必要があっただろうか。また『三國志』武帝紀を調べてみると、武帝（曹操）は建安四年（199年）の時点ででに官渡へ出陣して駐屯しており、孫策が死ぬよりずっと前から袁紹と 出し、{{person:孫策|孫策}}は同年四月に殺害されているのであるから、『{{special:引用史料|三國志}}』本文に『{{person:孫策|孫策}}は{{person:曹操|曹公}}と{{person:袁紹|袁紹}}が{{place:官渡|官渡}}で対陣していると聞いて…』とあるのは誤りである。『{{special:引用史料|江表伝}}』にある{{person:陳登|陳登}}討伐のために出陣したという説の方が証拠のあることである。また『{{special:引用史料|江表伝}}』は、{{person:孫策|孫策}}が{{person:韓当|韓当}}の兵卒を全員見知っており、怪しんで偽者だと見破って一人を射殺したと説いている。しかし全軍の将兵の中には新参の者もいるはずであり、大将である{{person:孫策|孫策}}がどうして兵卒の顔をすべて記憶できようか。見覚えがないというだけでいきなり射殺したというのは、道理にかなった話ではない。さらに{{person:孫策|孫策}}が殺されたのは{{special:建安|建安五年}}（200年）であり、{{person:曹操|曹操}}の{{place:柳城|柳城}}遠征は{{special:建安|建安}}十二年（207年）のことであるから、『{{special:引用史料|九州春秋}}』の年代の錯乱はとりわけ甚だしい」。臣{{person:裴松之|裴松之}}が考えるに、「『{{special:引用史料|傅子}}』もまた『{{person:曹操|曹公}}が{{place:柳城|柳城}}へ遠征した隙に{{place:許|許都}}を襲おうとした』と記しているが、歴史記述がこれほどまでに杜撰とは何事であろうか！ ただし{{person:孫盛|孫盛}}が批判している内容も、すべてが正しいわけではない。当時、{{person:黄祖|黄祖}}は{{person:孫策|孫策}}に大破されたばかりでまだ生気を取り戻しておらず、そもそも{{person:劉表|劉表}}君臣には他国を併呑する大志などなかったのであるから、たとえ上流にいたところで、どうして{{place:呉郡|呉郡}}・{{place:会稽|会稽}}郡への侵攻を企てることなどできようか。{{person:孫策|孫策}}のこのたびの軍事行動は、順序としてはまず{{person:陳登|陳登}}を片付けるはずであったろうが、挙兵の最終目的は{{person:陳登|陳登}}だけに止まるものではなかった。当時、有力豪族や精強な首領であった{{person:祖郎|祖郎}}・{{person:厳白虎|厳虎}}（{{person:厳白虎|厳白虎}}）の輩はすでにことごとく捕らえるか滅ぼすかし尽くしており、残る{{special:山越|山越}}などどうして憂慮するに足りようか。そうであれば、{{person:孫策|孫策}}が計画していた{{place:許|許都}}奇襲を『余裕がなかった』と断ずることはできない。もし{{person:孫策|孫策}}の志が実現して天下の大権を手中に収めたならば、{{place:淮水|淮水}}・{{place:泗水|泗水}}の間のどこにでも都を置くことができたはずであり、どうして長江の外（{{place:江東|江東}}）だけに閉じこもって、わざわざ帝を{{place:江東|揚越}}（{{place:江東|江南}}）へ遷す必要があっただろうか。また『{{special:引用史料|三國志}}』{{person:曹操|武帝}}紀を調べてみると、{{person:曹操|武帝}}（{{person:曹操|曹操}}）は{{special:建安|建安}}四年（199年）の時点ででに{{place:官渡|官渡}}へ出陣して駐屯しており、{{person:孫策|孫策}}が死ぬよりずっと前から{{person:袁紹|袁紹}}と交戦状態にあったのであるから、『{{special:引用史料|三國志（国志）}}』の記述は誤りではない。それにしても{{person:許貢|許貢}}の食客たちは、世に名も知られぬ小人でありながら、旧主の恩遇に深く感じて、信義に臨んで自らの命を忘れ、敢然と奮起して仇を報じたのであり、いにしえの烈士にも匹敵するものがある。『詩経』に『君子に立派な道（徽猷）があれば、小人もこれに付き従う』とあるが、{{person:許貢|許貢}}と食客たちの関係にはまさにそれがあったと言えよう」。"}, {"id": "v46_p18_3", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 18, "type": "本文", "raw_text": "創甚，請張昭等謂曰：「中國方亂，夫以吳越之衆，三江之固，足以觀成敗。公等善相吾弟！」呼權佩以印綬，謂曰：「舉江東之衆，決機於兩陳之間，與天下爭衡，卿不如我。舉賢任能，各盡其心，以保江東，我不如卿。」至夜卒，時年二十六。", "kakikudashi": "創甚だしく、張昭等を請ひて謂ひて曰く、「中国方に乱る。夫れ呉越の衆、三江の固めを以てすれば、以て成敗を観るに足る。公等、善く吾が弟を相けよ」と。権を呼びて佩ぶるに印綬を以てし、謂ひて曰く、「江東の衆を挙げ、機を両陳の間に決し、天下と衡を争ふは、卿、我に如かず。賢を挙げ能に任じ、各おの其の心を尽さしめ、以て江東を保つは、我、卿に如かず」と。夜に至りて卒す、時に年二十六。", "translation": "孫策は傷が重くなると、張昭らを召し寄せて言った。「中国（中原）はいままさに乱れている。そもそも呉越（江東）の民衆と三江（長江）の険固な要害をもってすれば、天下の成敗を見極めるには十分である。公らはどうか我が弟（孫権）をよく輔佐してくれ！」。そして孫権を呼び寄せて印綬を佩びさせ、こう告げた。「江東の軍衆を総動員し、両軍が対峙する陣頭で勝機を決し、天下の群雄と覇権を争うことにおいては、卿（孫権）は私に及ばない。しかし賢才を登用し有能な者に任務を委ね、それぞれに全力を尽くさせて江東を保持することにおいては、私は卿に及ばない」。その夜に至って死去した。享年二十六であった。", "persons": "孫策,張昭,孫権", "places": "中原,江東,長江", "era_year": "建安5年（200年）", "source_book": "", "keywords": "", "raw_tagged": "創甚，請{{person:張昭|張昭}}等謂曰：「{{place:中原|中國}}方亂，夫以{{place:江東|吳越}}之衆，{{place:長江|三江}}之固，足以觀成敗。公等善相吾弟！」呼{{person:孫権|權}}佩以印綬，謂曰：「舉{{place:江東|江東}}之衆，決機於兩陳之間，與天下爭衡，卿不如我。舉賢任能，各盡其心，以保{{place:江東|江東}}，我不如卿。」至夜卒，時年二十六。", "kakikudashi_tagged": "創甚だしく、{{person:張昭|張昭}}等を請ひて謂ひて曰く、「{{place:中原|中国}}方に乱る。夫れ{{place:江東|呉越}}の衆、{{place:長江|三江}}の固めを以てすれば、以て成敗を観るに足る。公等、善く吾が弟を相けよ」と。{{person:孫権|権}}を呼びて佩ぶるに印綬を以てし、謂ひて曰く、「{{place:江東|江東}}の衆を挙げ、機を両陳の間に決し、天下と衡を争ふは、卿、我に如かず。賢を挙げ能に任じ、各おの其の心を尽さしめ、以て{{place:江東|江東}}を保つは、我、卿に如かず」と。夜に至りて卒す、時に年二十六。", "translation_tagged": "{{person:孫策|孫策}}は傷が重くなると、{{person:張昭|張昭}}らを召し寄せて言った。「{{place:中原|中国}}（{{place:中原|中原}}）はいままさに乱れている。そもそも{{place:江東|呉越}}（{{place:江東|江東}}）の民衆と{{place:長江|三江}}（{{place:長江|長江}}）の険固な要害をもってすれば、天下の成敗を見極めるには十分である。公らはどうか我が弟（{{person:孫権|孫権}}）をよく輔佐してくれ！」。そして{{person:孫権|孫権}}を呼び寄せて印綬を佩びさせ、こう告げた。「{{place:江東|江東}}の軍衆を総動員し、両軍が対峙する陣頭で勝機を決し、天下の群雄と覇権を争うことにおいては、卿（{{person:孫権|孫権}}）は私に及ばない。しかし賢才を登用し有能な者に任務を委ね、それぞれに全力を尽くさせて{{place:江東|江東}}を保持することにおいては、私は卿に及ばない」。その夜に至って死去した。享年二十六であった。"}, {"id": "v46_p18_4", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 18, "type": "裴注", "raw_text": "《吳曆》曰：「策旣被創，醫言可治，當好自將護，百日勿動。策引鏡自照，謂左右曰：『面如此，尙可復建功立事乎？』椎几大奮，創皆分裂，其夜卒。」《搜神記》曰：「策旣殺于吉，每獨坐，彷彿見吉在左右，意深惡之，頗有失常。後治創方差，而引鏡自照，見吉在鏡中，顧而弗見，如是再三，因扑鏡大叫，創皆崩裂，須臾而死。」", "kakikudashi": "『呉歴』に曰く、「策、既に創を被るも、医、治すべしと言ふ、当に好く自ら将護し、百日動く勿かるべし、と。策、鏡を引きて自ら照らし、左右に謂ひて曰く、『面此くの如し、尚ほ復た功を建て事を立つべけんや』と。几を椎ちて大いに奮ひ、創皆分裂し、其の夜卒す」と。『捜神記』に曰く、「策、既に于吉を殺し、独坐する毎に、彷彿として吉が左右に在るを見、意に深く之を悪み、頗る失常有り。後に創を治して方に差えんとするや、鏡を引きて自ら照らし、吉が鏡中に在るを見、顧みるも見えざること、是くの如きこと再三なり。因りて鏡を扑ちて大いに叫び、創皆崩裂し、須臾にして死す」と。", "translation": "『呉歴』にいう。「孫策が負傷したのち、医師は『治療可能です。ただししっかりと静養・養生し、百日のあいだは激しい動きを慎まねばなりません』と告げた。孫策は鏡を引き寄せて自分の顔を映し、側近に向かって『顔がこのような有様になってしまって、どうして再び功業を打ち立てることができようか！』と言い、脇息（几）を激しく叩いて奮い立ったため、傷口がすべて裂け、その夜のうちに亡くなった」。『捜神記』にいう。「孫策は于吉を処刑して以来、一人で座っているたびに、ぼんやりと于吉が傍らに立っている幻影を見るようになり、心中で深くこれを忌み嫌って、かなり精神に異常をきたしていた。のちに傷の治療が進んでちょうど快方に向かっていたとき、鏡を引き寄せて自分の顔を映したところ、鏡の中に于吉の姿が見え、振り返ってみると誰もいないということが二度、三度と繰り返された。そこで孫策は鏡を叩き割って大声で絶叫し、傷口がすべて破裂して、まもなく息を引き取った」。", "persons": "孫策,于吉", "places": "", "era_year": "建安5年（200年）", "source_book": "呉歴,捜神記", "keywords": "", "raw_tagged": "《{{special:引用史料|吳曆}}》曰：「{{person:孫策|策}}旣被創，醫言可治，當好自將護，百日勿動。{{person:孫策|策}}引鏡自照，謂左右曰：『面如此，尙可復建功立事乎？』椎几大奮，創皆分裂，其夜卒。」《{{special:引用史料|搜神記}}》曰：「{{person:孫策|策}}旣殺{{person:于吉|于吉}}，每獨坐，彷彿見{{person:于吉|吉}}在左右，意深惡之，頗有失常。後治創方差，而引鏡自照，見{{person:于吉|吉}}在鏡中，顧而弗見，如是再三，因扑鏡大叫，創皆崩裂，須臾而死。」", "kakikudashi_tagged": "『{{special:引用史料|呉歴}}』に曰く、「{{person:孫策|策}}、既に創を被るも、医、治すべしと言ふ、当に好く自ら将護し、百日動く勿かるべし、と。{{person:孫策|策}}、鏡を引きて自ら照らし、左右に謂ひて曰く、『面此くの如し、尚ほ復た功を建て事を立つべけんや』と。几を椎ちて大いに奮ひ、創皆分裂し、其の夜卒す」と。『{{special:引用史料|捜神記}}』に曰く、「{{person:孫策|策}}、既に{{person:于吉|于吉}}を殺し、独坐する毎に、彷彿として{{person:于吉|吉}}が左右に在るを見、意に深く之を悪み、頗る失常有り。後に創を治して方に差えんとするや、鏡を引きて自ら照らし、{{person:于吉|吉}}が鏡中に在るを見、顧みるも見えざること、是くの如きこと再三なり。因りて鏡を扑ちて大いに叫び、創皆崩裂し、須臾にして死す」と。", "translation_tagged": "『{{special:引用史料|呉歴}}』にいう。「{{person:孫策|孫策}}が負傷したのち、医師は『治療可能です。ただししっかりと静養・養生し、百日のあいだは激しい動きを慎まねばなりません』と告げた。{{person:孫策|孫策}}は鏡を引き寄せて自分の顔を映し、側近に向かって『顔がこのような有様になってしまって、どうして再び功業を打ち立てることができようか！』と言い、脇息（几）を激しく叩いて奮い立ったため、傷口がすべて裂け、その夜のうちに亡くなった」。『{{special:引用史料|捜神記}}』にいう。「{{person:孫策|孫策}}は{{person:于吉|于吉}}を処刑して以来、一人で座っているたびに、ぼんやりと{{person:于吉|于吉}}が傍らに立っている幻影を見るようになり、心中で深くこれを忌み嫌って、かなり精神に異常をきたしていた。のちに傷の治療が進んでちょうど快方に向かっていたとき、鏡を引き寄せて自分の顔を映したところ、鏡の中に{{person:于吉|于吉}}の姿が見え、振り返ってみると誰もいないということが二度、三度と繰り返された。そこで{{person:孫策|孫策}}は鏡を叩き割って大声で絶叫し、傷口がすべて破裂して、まもなく息を引き取った」。"}, {"id": "v46_p19_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（孫策）", "para_index": 19, "type": "本文", "raw_text": "權稱尊號，追諡策曰長沙桓王，封子紹爲吳侯，後改封上虞侯。紹卒，子奉嗣。孫皓時，訛言謂奉當立，誅死。", "kakikudashi": "権、尊号を称するや、策を追諡して長沙桓王と曰ひ、子の紹を封じて呉侯と為し、後に上虞侯に改封す。紹卒し、子の奉、嗣ぐ。孫皓の時、訛言ありて奉、当に立つべしと謂ひ、誅死す。", "translation": "のちに孫権が帝号（尊号）を称すると、亡き兄・孫策に追諡して「長沙桓王」といい、孫策の子の孫紹を呉侯に封じ、のちに上虞侯に改封した。孫紹が死去すると、その子の孫奉が跡を継いだ。末帝・孫皓の時代、孫奉が皇帝に擁立されるであろうという流言（訛言）が立ったため、孫奉は処刑された。", "persons": "孫権,孫策,孫紹,孫奉,孫皓", "places": "長沙,呉郡,上虞", "era_year": "黄龍元年（229年）", "source_book": "", "keywords": "列侯", "raw_tagged": "{{person:孫権|權}}稱尊號，追諡{{person:孫策|策}}曰{{person:孫策|長沙桓王}}，封子{{person:孫紹|紹}}爲{{place:呉郡|吳}}{{office:列侯|侯}}，後改封{{place:上虞|上虞}}{{office:列侯|侯}}。{{person:孫紹|紹}}卒，子{{person:孫奉|奉}}嗣。{{person:孫皓|孫皓}}時，訛言謂{{person:孫奉|奉}}當立，誅死。", "kakikudashi_tagged": "{{person:孫権|権}}、尊号を称するや、{{person:孫策|策}}を追諡して{{person:孫策|長沙桓王}}と曰ひ、子の{{person:孫紹|紹}}を封じて{{place:呉郡|呉}}{{office:列侯|侯}}と為し、後に{{place:上虞|上虞}}{{office:列侯|侯}}に改封す。{{person:孫紹|紹}}卒し、子の{{person:孫奉|奉}}、嗣ぐ。{{person:孫皓|孫皓}}の時、訛言ありて{{person:孫奉|奉}}、当に立つべしと謂ひ、誅死す。", "translation_tagged": "のちに{{person:孫権|孫権}}が帝号（尊号）を称すると、亡き兄・{{person:孫策|孫策}}に追諡して「{{person:孫策|長沙桓王}}」といい、{{person:孫策|孫策}}の子の{{person:孫紹|孫紹}}を{{place:呉郡|呉}}{{office:列侯|侯}}に封じ、のちに{{place:上虞|上虞}}{{office:列侯|侯}}に改封した。{{person:孫紹|孫紹}}が死去すると、その子の{{person:孫奉|孫奉}}が跡を継いだ。末帝・{{person:孫皓|孫皓}}の時代、{{person:孫奉|孫奉}}が皇帝に擁立されるであろうという流言（訛言）が立ったため、{{person:孫奉|孫奉}}は処刑された。"}, {"id": "v46_p20_1", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（【評】）", "para_index": 20, "type": "本文", "raw_text": "評曰：「孫堅勇摯剛毅，孤微發跡，導溫戮卓，山陵杜塞，有忠壯之烈。策英氣傑濟，猛鋭冠世，覽奇取異，志陵中夏。然皆輕佻果躁，隕身致敗。且割據江東，策之基兆也。而權尊崇未至，子止侯爵，於義儉矣。」", "kakikudashi": "評に曰く、「孫堅は勇摯剛毅、孤微より跡を発し、温を導きて卓を戮せんと請ひ、山陵の杜塞せるを掃ひ、忠壮の烈有り。策は英気傑済、猛鋭なること世に冠たり、奇を覧て異を取り、志は中夏を陵ぐ。然れども皆軽佻果躁にして、身を隕として敗を致せり。且つ江東に割拠せるは、策の基兆なり。而るに権の尊崇未だ至らず、子は侯爵に止まるは、義に於て倹なり」と。", "translation": "陳寿の評にいう。「孫堅は勇猛果敢にして剛毅であり、微賤・孤立の境遇から身を興し、張温を導いて董卓を処刑するよう進言し、荒れ果てて塞がれていた洛陽の皇帝陵（山陵）を修復・掃除するなど、忠義と壮烈の勲功があった。孫策はすぐれた気概と傑出した才略を備え、その猛々しい鋭鋒は世に冠たるものがあり、奇才を見出して異能の士を登用し、その志は中夏（中原）をも凌駕していた。しかしながら、父子ともに軽率で性急（軽佻果躁）なところがあり、自ら身を滅ぼして敗死を招いてしまった。そもそも孫氏が江東に割拠できたのは、孫策が基礎を開いたおかげである。それにもかかわらず、孫権が帝位に即いたのちの孫策に対する尊崇は十分とは言えず、孫策の子（孫紹）を王ではなく侯爵にとどめたのは、道義においてあまりに控えめ（薄情）であった」。", "persons": "陳寿,孫堅,張温,董卓,孫策,孫権,孫紹", "places": "中原,江東", "era_year": "", "source_book": "", "keywords": "園陵,軽佻果躁,列侯", "raw_tagged": "評曰：「{{person:孫堅|孫堅}}勇摯剛毅，孤微發跡，導{{person:張温|溫}}戮{{person:董卓|卓}}，{{special:園陵|山陵}}杜塞，有忠壯之烈。{{person:孫策|策}}英氣傑濟，猛鋭冠世，覽奇取異，志陵{{place:中原|中夏}}。然皆{{special:軽佻果躁|輕佻果躁}}，隕身致敗。且割據{{place:江東|江東}}，{{person:孫策|策}}之基兆也。而{{person:孫権|權}}尊崇未至，子止{{office:列侯|侯爵}}，於義儉矣。」", "kakikudashi_tagged": "評に曰く、「{{person:孫堅|孫堅}}は勇摯剛毅、孤微より跡を発し、{{person:張温|温}}を導きて{{person:董卓|卓}}を戮せんと請ひ、{{special:園陵|山陵}}の杜塞せるを掃ひ、忠壮の烈有り。{{person:孫策|策}}は英気傑済、猛鋭なること世に冠たり、奇を覧て異を取り、志は{{place:中原|中夏}}を陵ぐ。然れども皆{{special:軽佻果躁|軽佻果躁}}にして、身を隕として敗を致せり。且つ{{place:江東|江東}}に割拠せるは、{{person:孫策|策}}の基兆なり。而るに{{person:孫権|権}}の尊崇未だ至らず、子は{{office:列侯|侯爵}}に止まるは、義に於て倹なり」と。", "translation_tagged": "{{person:陳寿|陳寿}}の評にいう。「{{person:孫堅|孫堅}}は勇猛果敢にして剛毅であり、微賤・孤立の境遇から身を興し、{{person:張温|張温}}を導いて{{person:董卓|董卓}}を処刑するよう進言し、荒れ果てて塞がれていた洛陽の皇帝陵（{{special:園陵|山陵}}）を修復・掃除するなど、忠義と壮烈の勲功があった。{{person:孫策|孫策}}はすぐれた気概と傑出した才略を備え、その猛々しい鋭鋒は世に冠たるものがあり、奇才を見出して異能の士を登用し、その志は{{place:中原|中夏}}（{{place:中原|中原}}）をも凌駕していた。しかしながら、父子ともに軽率で性急（{{special:軽佻果躁|軽佻果躁}}）なところがあり、自ら身を滅ぼして敗死を招いてしまった。そもそも孫氏が{{place:江東|江東}}に割拠できたのは、{{person:孫策|孫策}}が基礎を開いたおかげである。それにもかかわらず、{{person:孫権|孫権}}が帝位に即いたのちの{{person:孫策|孫策}}に対する尊崇は十分とは言えず、{{person:孫策|孫策}}の子（{{person:孫紹|孫紹}}）を王ではなく{{office:列侯|侯爵}}にとどめたのは、道義においてあまりに控えめ（薄情）であった」。"}, {"id": "v46_p20_2", "volume": 46, "book": "呉書", "section_title": "孫破虜討逆傳（【評】）", "para_index": 20, "type": "裴注", "raw_text": "孫盛曰：「孫氏兄弟皆明略絶群。創基立事，策之由也，自臨終之日，顧命委權。夫意氣之間，猶有刎頸，況天倫之篤愛，豪達之英鑑，豈吝名號於旣往，違本情之至實哉？抑將遠思虛盈之數，而愼其名器者乎？夫正本定名，爲國之大防；杜絶疑貳，消釁之良謨。是故魯隱矜義，終致羽父之禍；宋宣懷仁，卒有殤公之哀。皆心存小善，而不達經綸之圖；求譽當年，而不思貽厥之謀。可謂輕千乘之國，蹈道則未也。孫氏因擾攘之際，得奮其縱橫之志，業非積德之基，邦無磐石之固，勢一則祿祚可終，情乖則禍亂塵起，安可不防微於未兆，慮難於將來？壯哉！策爲首事之君，有吳開國之主；將相在列，皆其舊也，而嗣子弱劣，析薪弗荷，奉援則魯桓、田巿之難作，崇之則與夷、子馮之禍興。是以正名定本，使貴賤殊邈，然後國無陵肆之責，後嗣罔猜忌之嫌，群情絶異端之論，不逞杜覬覦之心；於情雖違，於事雖儉，至於括囊遠圖，永保維城，可謂爲之於其未有，治之於其未亂者也。陳氏之評，其未達乎！」", "kakikudashi": "孫盛曰く、「孫氏兄弟は皆明略群を絶つ。基を創め事を立つるは、策の由なり、臨終の日より、顧命して権に委ぬ。夫れ意気の間すら、猶ほ刎頸有り、況んや天倫の篤愛、豪達の英鑑をや、豈に名号を既往に吝しみ、本情の至実に違はんや。抑そも将に遠く虚盈の数を思ひ、而して其の名器を慎める者か。夫れ本を正し名を定むるは、国の為の大防なり。疑弐を杜絶するは、釁を消すの良謨なり。是の故に魯隠は義に矜りて、終に羽父の禍ひを致し、宋宣は仁を懐きて、卒に殤公の哀しみ有り。皆心に小善を存して、経綸の図に達せず、誉れを当年に求めて、貽厥の謀を思はざるなり。千乗の国を軽んずと謂ふべく、道を蹈むことは則ち未だしきなり。孫氏は擾攘の際に因りて、其の縦横の志を奮ふを得たるも、業は積徳の基に非ず、邦は磐石の固め無く、勢ひ一なれば則ち禄祚終ふべく、情乖けば則ち禍乱塵のごとく起る、安んぞ微を未兆に防ぎ、難を将来に慮らざるべけんや。壮なるかな、策は首事の君為り、有呉開国の主なり。将相の列に在るは、皆其の旧なり、而して嗣子は弱劣にして、薪を析くも荷はず、奉援すれば則ち魯桓・田市の難作り、之を崇むれば則ち与夷・子馮の禍ひ興らん。是を以て名を正し本を定め、貴賤をして殊邈ならしめ、然る後に国に陵肆の責め無く、後嗣に猜忌の嫌ひ罔く、群情は異端の論を絶ち、不逞は覬覦の心を杜ぐ。情に於ては違ふと雖も、事に於ては倹なりと雖も、括囊の遠図、永く維城を保つに至りては、之を其の未だ有らざるに為し、之を其の未だ乱れざるに治むる者と謂ふべきなり。陳氏の評は、其れ未だ達せざるか」と。", "translation": "孫盛はいう。「孫氏兄弟（孫策・孫権）はいずれも明敏な知略が群を抜いていた。孫呉の礎を築き大業を立ち上げたのは孫策の力によるものであり、孫策自身も臨終の日にあたって後事を託す遺言（顧命）を残して孫権にすべてを委ねた。そもそも意気投合した友人の間でさえ、命を投げ出す『刎頸の交わり』があるのだ。まして肉親（天倫）の深い愛情と、豪邁達観した英明な器量を備えた孫権が、どうして過ぎ去った亡き兄に対して帝王の名号を出し惜しみ、本来の真心に背いたりするであろうか。そうではなく、盛衰（虚盈）の道理を遠く将来まで見据えて、国家の称号・地位（名器）の授与を慎重にしたのではなかろうか。そもそも君臣の根本を正して名分を定めることは、国家を守る最大の防波堤であり、二心や疑念（疑弐）の芽を断ち切ることは、内乱の隙を消す最良の謀である。それゆえ、春秋時代の魯の隠公は譲位の義にこだわった結果、ついに羽父（公子翬）に弑殺される禍いを招き、宋の宣公は弟に位を譲る仁愛を抱いた結果、ついには実子の殤公（与夷）が殺される悲劇を生んだ。これらはみな心中に小さな善意を抱くばかりで国家統治（経綸）の大計に達せず、その当時の名声ばかりを求めて子孫に残す永遠の謀（貽厥の謀）に思いを致さなかったものである。千乗の大国を軽々しく扱ったというべきであり、真の政治の道を践んでいたとは到底言えない。孫氏は天下動乱の時に乗じて縦横の志を振るうことができたとはいえ、その覇業は累代の徳を積み重ねた基盤によるものではなく、国家にもいまだ磐石の固めはなく、権勢が一つにまとまれば天禄を全うできるが、人心が乖離すればたちまち禍乱が塵のように湧き起こる状況にあったのであるから、どうして微細な兆候のうちに禍いを防ぎ、将来の危難に備えずにいられようか。壮んなるかな、孫策は創業の君主であり、呉の開国の主である。朝廷に居並ぶ将軍や宰相たちは、みな孫策の旧臣ばかりであった。しかるに孫策の跡継ぎの子（孫紹）は幼弱で力不足であり、父の遺業を背負う（析薪）だけの器量がなかった。もしこれを無理に擁立・後援すれば魯の桓公や斉の田市のような簒奪・内乱が勃発し、これを過度に尊崇すれば宋の与夷（殤公）や公子馮のような骨肉の禍いが興ったことであろう。だからこそ孫権は名分を正し君臣の根本を定めて、君主と臣下の身分差をはるかに隔絶させ、そうしてこそ国家に身分を犯す罪（陵肆の責）をなくし、後継の君主が孫策の子孫に猜疑心を抱く嫌疑をなくし、臣下たちの間に異端の議論が生じるのを絶ち、不逞の輩が帝位を窺う野心（覬覦の心）を封じたのである。人情においては背くようであり、礼遇においては控えめ（倹）に見えるとはいえ、口を閉ざして禍いを防ぐ深   const PERSONS_INFO = {"孫堅": {"wiki_title": "孫堅", "ai_desc": "孫堅（そんけん）：字は文台（155年〜191年／192年）。呉郡富春の人。孫武の末裔と伝わる。若くして海賊胡玉や会稽の妖賊許昌を討って頭角を現し、黄巾の乱・涼州の乱・長沙の区星討伐で武功を重ねて長沙太守・烏程侯となる。反董卓連合軍では袁術と結んで破虜将軍・領豫州刺史として陽人で董卓軍を大破し洛陽へ入城したが、のち袁術の命で荊州の劉表を攻め、峴山で黄祖の兵に討たれた。孫策・孫権らの父であり、呉の建国後に武烈皇帝（廟号・始祖）と追尊された。"}, "孫武": {"wiki_title": "孫武", "ai_desc": "孫武（そんぶ）：春秋時代の斉出身の兵法家で、呉王闔廬に仕えて楚を破った。『孫子』十三篇の著者。富春の孫氏はその末裔とされる。"}, "孫鍾": {"wiki_title": "孫鍾", "ai_desc": "孫鍾（そんしょう）：孫堅の父（本伝では単に「父」と記され、名は『宋書』符瑞志や『三國志集解』等に引く諸史料に見える）。17歳の孫堅とともに船で銭唐へ赴いた際、海賊・胡玉の掠奪に遭遇した。"}, "胡玉": {"wiki_title": "", "ai_desc": "胡玉（こぎょく）：後漢末、銭唐県の匏里付近に出没して商人の財物を略奪していた海賊の首領。当時17歳だった孫堅の機転と奇襲によって一味ともども撃退された（『三國志』巻46・孫堅伝）。"}, "許昌": {"wiki_title": "", "ai_desc": "許昌（きょしょう）：後漢末の会稽郡の妖賊（宗教的反乱の首領）。熹平元年（172年）、句章県で蜂起して「陽明皇帝」を自称し、父（許生）を越王に立て、子の許韶とともに数万の勢力で会稽諸県を席巻したが、揚州刺史・臧旻や呉郡司馬・孫堅らによって討滅された（『三國志』巻46・孫堅伝、『後漢書』巻8・霊帝紀）。"}, "許韶": {"wiki_title": "", "ai_desc": "許韶（きょしょう）：会稽の妖賊・許昌の子（『後漢書』霊帝紀では東晋の司馬昭の諱を避けて「許昭」と表記）。父とともに会稽の諸県を扇動したが、孫堅・臧旻らに討ち破られた（『三國志』巻46・孫堅伝）。"}, "臧旻": {"wiki_title": "臧旻", "ai_desc": "臧旻（ぞうびん）：広陵郡射陽県の人。臧洪の父。匈奴中郎将・揚州刺史・使匈奴中郎将などを歴任した。揚州刺史として会稽の許昌の乱を鎮圧し、従軍して活躍した呉郡司馬の孫堅の功績を朝廷に上奏した（『三國志』巻7・臧洪伝、巻46・孫堅伝）。"}, "張角": {"wiki_title": "張角", "ai_desc": "張角（ちょうかく）：冀州鉅鹿郡の人。太平道の教祖。「天公将軍」を称し、中平元年（184年）に弟の張宝・張梁とともに黄巾の乱を起こした。"}, "張宝": {"wiki_title": "張宝", "ai_desc": "張宝（ちょうほう）：張角の弟。黄巾の乱において「地公将軍」を称し、のち下曲陽で皇甫嵩に討たれた（『献帝春秋』『後漢書』皇甫嵩伝）。"}, "張梁": {"wiki_title": "張梁", "ai_desc": "張梁（ちょうりょう）：張角・張宝の末弟。黄巾の乱において「人公将軍」を称し、広宗で皇甫嵩に討たれた（『献帝春秋』『後漢書』皇甫嵩伝）。"}, "皇甫嵩": {"wiki_title": "皇甫嵩", "ai_desc": "皇甫嵩（こうほすう）：字は義真、安定朝那の人（原文表記は「皇甫崧」）。左中郎将・車騎将軍として朱儁とともに黄巾の乱の鎮圧に最大の功績を挙げた後漢末の名将（『後漢書』巻71・皇甫嵩伝）。"}, "朱儁": {"wiki_title": "朱儁", "ai_desc": "朱儁（しゅしゅん）：字は公偉、会稽上虞の人（？〜195年）。右中郎将として黄巾の乱討伐を命じられた際、孫堅を佐軍司馬に抜擢して汝南・潁川・南陽（宛城）の黄巾軍を平定した。のち車騎将軍・河南尹・太僕・太尉を歴任し、董卓の長安遷都に真っ向から反対した硬骨の重臣（『続漢書』『後漢書』巻71・朱儁伝）。"}, "董卓": {"wiki_title": "董卓", "ai_desc": "董卓（とうたく）：字は仲穎、隴西臨洮の人（？〜192年）。涼州の軍閥から台頭し、霊帝崩御後の洛陽に入って少帝を廃し献帝を擁立、相国となって暴政を敷いた。反董卓連合軍の孫堅に陽人で大敗して長安へ遷都した。"}, "李傕": {"wiki_title": "李傕", "ai_desc": "李傕（りかく）：字は稚然、北地郡の人。董卓配下の有力部将。陽人の戦いの後に董卓の使者として孫堅のもとへ和親を求めに赴いたが拒絶された。董卓の死後は郭汜らと長安を襲って朝政を掌握した。"}, "郭汜": {"wiki_title": "郭汜", "ai_desc": "郭汜（かくし）：別名は郭多、張掖郡の人。董卓配下の部将で、董卓の死後に李傕とともに長安を制圧したが、のち李傕と反目して天子・公卿を人質に取って争った。"}, "辺章": {"wiki_title": "辺章", "ai_desc": "辺章（へんしょう）：涼州金城郡の人（元の名は辺允）。中平元年（184年）以降、韓遂や北宮伯玉・先零羌らとともに涼州で反乱を起こし三輔へ侵攻した（『後漢書』巻72・董卓伝）。"}, "韓遂": {"wiki_title": "韓遂", "ai_desc": "韓遂（かんすい）：字は文約、涼州金城郡の人（元の名は韓約）。辺章とともに涼州で反乱を起こし、長年にわたり隴右・金城一帯に割拠した。"}, "張温": {"wiki_title": "張温 (後漢)", "ai_desc": "張温（ちょうおん）：字は伯慎、南陽穣県の人（？〜191年）。司空・太尉を歴任。中平3年（186年）、司空・行車騎将軍として涼州の辺章・韓遂討伐の総大将となり、孫堅を参軍事に招いて長安に駐屯した。その際、遅参して不遜な態度をとった董卓を斬るよう孫堅から進言されたが断行できなかった（『後漢書』巻56・張晧伝附張温伝）。"}, "司馬穰苴": {"wiki_title": "司馬穰苴", "ai_desc": "司馬穰苴（しばじょうしょ）：春秋時代の斉の将軍（田穰苴）。斉の景公に抜擢されて軍を率いた際、寵臣の監軍・荘賈が約束の刻限に遅参したため、軍法に照らして即座に荘賈を斬って全軍の軍規を確立した故事で知られる（『史記』巻64・司馬穰苴列伝）。"}, "荘賈": {"wiki_title": "荘賈", "ai_desc": "荘賈（そうか）：春秋時代の斉の景公の寵臣。司馬穰苴の軍の監軍に任じられたが、親戚や高官との送別の宴に興じて集合時刻に遅参したため、司馬穰苴によって軍法で斬られた（『史記』巻64・司馬穰苴列伝）。"}, "魏絳": {"wiki_title": "魏絳", "ai_desc": "魏絳（ぎこう）：春秋時代の晋の重臣（魏荘子）。司馬を務めていた際、晋の悼公の同母弟である楊干が軍列を乱したため、楊干の御者を処刑して軍規を正した故事で知られる（『春秋左氏伝』襄公三年、『史記』巻39・晋世家）。"}, "楊干": {"wiki_title": "", "ai_desc": "楊干（ようかん）：春秋時代の晋の悼公の同母弟。鶏沢の会盟の際、軍の陣列を乱したため、司馬の魏絳によってその僕（御者）が処刑された（『春秋左氏伝』襄公三年）。孫堅は司馬穰苴と魏絳の故事を引き、董卓を軍法で斬るよう張温に迫った。"}, "区星": {"wiki_title": "", "ai_desc": "区星（おうせい）：後漢末、中平4年（187年）に荊州長沙郡で一万余人を集めて蜂起し、自ら将軍と称して城邑を包囲した反乱指導者。新任の長沙太守・孫堅により一か月足らずで撃破された（『三國志』巻46・孫堅伝）。"}, "周朝": {"wiki_title": "", "ai_desc": "周朝（しゅうちょう）：後漢末、長沙の区星に呼応して郭石とともに零陵郡・桂陽郡で蜂起した反乱指導者。郡境を越えて進撃してきた長沙太守・孫堅によって討滅された（『三國志』巻46・孫堅伝）。"}, "郭石": {"wiki_title": "", "ai_desc": "郭石（かくせき）：後漢末、周朝とともに零陵・桂陽で蜂起した反乱指導者。長沙太守・孫堅の越境討伐によって平定された（『三國志』巻46・孫堅伝）。"}, "陸康": {"wiki_title": "陸康", "ai_desc": "陸康（りくこう）：字は季寧、呉郡呉県の人（126年〜195年）。陸遜の従祖父。武陵・桂陽・楽安太守を経て廬江太守となり名声を博した。甥（従子）の宜春県長が賊に攻められた際、長沙太守の孫堅に救援を求めて救われた（『後漢書』巻31・陸康伝、『呉録』）。"}, "霊帝": {"wiki_title": "霊帝", "ai_desc": "霊帝（れいてい）：姓は劉、諱は宏（156年〜189年）。後漢の第12代皇帝（在位168年〜189年）。中平6年（189年）4月に崩御し、その後の政変から董卓の専横と群雄割拠が幕を開けた。"}, "王叡": {"wiki_title": "王叡 (後漢)", "ai_desc": "王叡（おうえい）：字は通耀、徐州琅邪臨沂の人（？〜190年）。西晋の太保・王祥の伯父。荊州刺史として長沙太守・孫堅とともに零陵・桂陽の賊を討った際、孫堅を武官と見下して無礼な態度をとった。のち反董卓の兵を挙げた際、武陵太守・曹寅の偽檄を受けた孫堅に急襲され、金を削って飲み自殺した（『三國志』巻46・孫堅伝、『王氏譜』『呉録』）。"}, "王祥": {"wiki_title": "王祥", "ai_desc": "王祥（おうしょう）：字は休徴、琅邪臨沂の人（184年〜268年）。荊州刺史・王叡の甥。「二十四孝」の鯉の故事でも知られ、魏の司空・太尉から西晋の太保（三師）に昇った（『晋書』巻33・王祥伝）。"}, "曹寅": {"wiki_title": "", "ai_desc": "曹寅（そういん）：後漢末の武陵太守。荊州刺史の王叡と不仲であり、王叡が「まず曹寅を殺してから董卓を討つ」と公言したため、光禄大夫・温毅の名を騙った偽の檄文を作って長沙太守・孫堅に送り、孫堅を動かして王叡を誅殺させた（『呉録』）。"}, "温毅": {"wiki_title": "", "ai_desc": "温毅（おんき）：後漢末の朝廷の案行使者・光禄大夫。武陵太守の曹寅がその名を使って偽の檄文を作成し、孫堅に荊州刺史・王叡を討たせた（『呉録』）。"}, "張咨": {"wiki_title": "張咨", "ai_desc": "張咨（ちょうし）：字は子議、潁川郡の人（？〜190年）。中平6年（189年）に董卓によって南陽太守に任じられた。反董卓のため北上してきた孫堅の兵糧要請を拒んだため、孫堅の計略によって陣営に誘い出され、軍法により斬首された（『三國志』巻46・孫堅伝、『英雄記』『献帝春秋』『呉歴』）。"}, "袁術": {"wiki_title": "袁術", "ai_desc": "袁術（えんじゅつ）：字は公路、汝南汝陽の人（？〜199年）。司空・袁逢の嫡子、袁紹の従弟（または異母弟）。董卓を避けて南陽・魯陽に拠り、北上してきた孫堅を表して行破虜将軍・領豫州刺史とした。"}, "公仇称": {"wiki_title": "", "ai_desc": "公仇称（こうきゅうしょう）：孫堅の幕府の長史。孫堅が魯陽から董卓討伐へ出陣する際、将兵従事を率いて豫州へ戻り軍糧を督促する任務を帯び、魯陽城の東門外でその送別の宴（祖道）が開かれた（『三國志』巻46・孫堅伝）。"}, "胡軫": {"wiki_title": "胡軫", "ai_desc": "胡軫（こしん）：字は文才、涼州出身の董卓配下の将・陳郡太守。陽人の戦いで歩騎五千を率いる大督護として孫堅迎撃に向かったが、性急な言動から騎督・呂布ら諸将の反感を買って夜間に偽情報で軍を潰走させられ、敗退した（『英雄記』）。"}, "呂布": {"wiki_title": "呂布", "ai_desc": "呂布（りょふ）：字は奉先、五原郡九原の人（？〜199年）。陽人の戦いでは董卓軍の騎督として大督護・胡軫に従軍したが、胡軫を嫌って偽の情報を流して味方を混乱させ、孫堅の勝利の遠因を作った（『英雄記』）。"}, "祖茂": {"wiki_title": "祖茂", "ai_desc": "祖茂（そぼう）：孫堅の親近の部将。梁県の東で孫堅が董卓軍に包囲されて大敗した際、孫堅のトレードマークである赤い毛織の頭巾（赤罽幘）を代わりに着用して敵騎兵を引きつけ、墓場の焼け柱に頭巾をかぶせて危機を脱し、孫堅を無事に逃がした（『三國志』巻46・孫堅伝）。"}, "華雄": {"wiki_title": "華雄", "ai_desc": "華雄（かゆう）：董卓配下の都督。初平2年（191年）の陽人の戦いにおいて、兵を立て直した孫堅に大敗し、討ち取られて晒し首（梟首）にされた（『三國志』巻46・孫堅伝）。"}, "呉起": {"wiki_title": "呉起", "ai_desc": "呉起（ごき）：戦国初期の衛出身の兵法家・名将。魏の文侯に仕えて秦を破り西河郡守として威名を轟かせたが、武侯の代に宰相・公叔の讒言によって疑われ、西河を去る際に涙を流して魏の国勢衰退を嘆いた（『史記』巻65・孫子呉起列伝、『呂氏春秋』長見篇）。"}, "楽毅": {"wiki_title": "楽毅", "ai_desc": "楽毅（がくき）：戦国時代の燕の名将。五国連合軍を率いて斉の七十余城を落とし、あと二城（莒・即墨）で斉を完全平定する寸前まで迫ったが、燕の恵王が斉の反間計（讒言）を信じて楽毅を解任したため、大業を目前にして趙へ亡命せざるを得なかった（『史記』巻80・楽毅列伝）。"}, "劉艾": {"wiki_title": "", "ai_desc": "劉艾（りゅうがい）：後漢末の官僚・歴史家。董卓の長史を務め、のち献帝の侍中・宗正となった。『漢霊帝紀』『漢献帝紀』の著者。董卓と関東諸将や孫堅の用兵について問答を交わした（『山陽公載記』）。"}, "周慎": {"wiki_title": "", "ai_desc": "周慎（しゅうしん）：後漢の盪寇将軍。中平2年〜3年（185年〜186年）、司空・張温の配下として三万の兵を率い金城郡で辺章・韓遂を包囲した際、佐軍司馬・孫堅の「一万の兵で敵の兵糧輸送路を断つべきだ」という献策を退けて強攻を続けた結果、逆に葵園狭で自軍の補給路を断たれて大敗した（『山陽公載記』『後漢書』董卓伝）。"}, "劉靖": {"wiki_title": "", "ai_desc": "劉靖（りゅうせい）：董卓配下の別部司馬。先零羌討伐の際、歩騎四千を率いて安定郡に駐屯し、数万の大軍がいるかのように見せかけて董卓の本隊の退路を守った（『山陽公載記』）。"}, "劉表": {"wiki_title": "劉表", "ai_desc": "劉表（りゅうひょう）：字は景升、山陽高平の人（142年〜208年）。初平元年（190年）、孫堅に殺された王叡の後任として荊州刺史（のち荊州牧）となり、襄陽を本拠に荊州を掌握。袁術の命で侵攻してきた孫堅を峴山で討ち取った。"}, "張譲": {"wiki_title": "張譲", "ai_desc": "張譲（ちょうじょう）：潁川郡出身の宦官で、霊帝期に権勢を振るった「十常侍」の筆頭。中平6年（189年）8月、大将軍・何進を宮中で暗殺した後、袁紹らの攻撃を受けて少帝・陳留王（献帝）を連れ去り逃走、その混乱の中で伝国璽が洛陽の井戸に投じられたと伝わる（『呉書』）。"}, "呉夫人": {"wiki_title": "呉夫人", "ai_desc": "呉夫人（ごふじん）：呉郡出身（本貫は銭唐、のち呉県に移住）の孫堅の正室（？〜202年）。呉景の姉で、孫策・孫権・孫翊・孫匡の四男一女を生んだ。のちに武烈皇后と追尊された。"}, "孫皓": {"wiki_title": "孫皓", "ai_desc": "孫皓（そんこう）：字は元宗（242年〜284年）。呉の第4代（最後）の皇帝（在位264年〜280年）。太康元年（280年）に西晋へ降伏して「帰命侯」に封じられ、その際、金製の天子六璽を晋の朝廷に送った（『江表伝』『志林』）。"}, "虞喜": {"wiki_title": "虞喜", "ai_desc": "虞喜（ぐき）：字は仲寧、会稽余姚の人（281年〜356年）。三国呉の騎都尉・虞翻の族孫で、東晋の在野の碩学（虞預の兄）。著書『志林』において、天子六璽と伝国璽の違いや孫堅の諸子について詳細な考証を残した（『晋書』巻91・儒林・虞喜伝）。"}, "劉邦": {"wiki_title": "劉邦", "ai_desc": "劉邦（りゅうほう）：漢の初代皇帝・高祖（在位前202年〜前195年）。秦王子嬰から秦の始皇帝の玉璽を受け継ぎ、代々漢王朝の「伝国璽」として伝えた。"}, "始皇帝": {"wiki_title": "始皇帝", "ai_desc": "始皇帝（しこうてい）：秦の初代皇帝・政（前259年〜前210年）。「受命於天，既寿永昌（または既寿且康）」と刻まれた伝国の玉璽を作らせた。"}, "応劭": {"wiki_title": "応劭", "ai_desc": "応劭（おうしょう）：字は仲遠、汝南南頓の人。後漢末の学者・泰山太守。朝廷の礼制・官制を詳述した『漢官儀（漢官）』や『風俗通義』を著した（『後漢書』巻48・応奉伝附応劭伝）。"}, "皇甫謐": {"wiki_title": "皇甫謐", "ai_desc": "皇甫謐（こうほひつ）：字は士安、安定朝那の人（215年〜282年）。皇甫嵩の曽孫にあたる魏〜西晋の学者。『帝王世紀』『高士伝』『針灸甲乙経』などを著した（『晋書』巻51・皇甫謐伝）。"}, "陳寿": {"wiki_title": "陳寿", "ai_desc": "陳寿（ちんじゅ）：字は承祚、巴西郡安漢県の人（233年〜297年）。蜀漢・西晋に仕え、正史『三國志』全65巻を撰述した。"}, "裴松之": {"wiki_title": "裴松之", "ai_desc": "裴松之（はいしょうし）：字は世期、河東郡聞喜県の人（372年〜451年）。南朝宋の文帝の命を受け、多様な一次史料を博引して『三國志注』を完成させた。"}, "袁紹": {"wiki_title": "袁紹", "ai_desc": "袁紹（えんしょう）：字は本初、汝南汝陽の人（？〜202年）。反董卓連合軍の盟主。袁術と対立し、袁術配下の孫堅が領する豫州を奪うため会稽出身の周㬂を豫州刺史として送り込んだ（『呉録』）。"}, "周㬂": {"wiki_title": "周ユウ", "ai_desc": "周㬂（しゅうゆう）：字は仁明、会稽郡の人（『後漢書』『三國志』の諸伝では「周喁」とも表記される）。周昕・周昂の末弟。曹操の挙兵に二千人を率いて参陣して軍師となり、のち袁紹から豫州刺史に任じられて孫堅と豫州を争ったが連敗し、帰郷後に許貢に殺害された（『呉録』『会稽典録』）。"}, "周昕": {"wiki_title": "周昕", "ai_desc": "周昕（しゅうきん）：字は大明、会稽郡の人。周昂・周㬂の長兄。丹陽太守を務め、のち王朗に味方して孫策と戦い戦死した（『三國志』巻46・孫破虜討逆伝注、巻51・孫静伝注）。"}, "曹操": {"wiki_title": "曹操", "ai_desc": "曹操（そうそう）：字は孟徳、沛国譙の人（155年〜220年）。後漢末に義兵を挙げた際、会稽の周㬂を招いて軍師とした。"}, "周昂": {"wiki_title": "周昂", "ai_desc": "周昂（しゅうこう）：会稽郡の人。周昕の次弟、周㬂の兄。袁紹により九江太守に任じられ、寿春・陰陵で袁術・孫賁らと激戦を繰り広げた（『会稽典録』『三國志』巻46・孫破虜討逆伝、巻51・孫賁伝）。"}, "許貢": {"wiki_title": "許貢", "ai_desc": "許貢（きょこう）：後漢末の呉郡都尉・呉郡太守。帰郷した周㬂を殺害し、のち江東へ進出した孫策と対立して処刑された（その食客が建安5年に孫策を襲撃することになる）。"}, "黄祖": {"wiki_title": "黄祖", "ai_desc": "黄祖（こうそ）：荊州牧・劉表の配下の将・江夏太守（？〜208年）。初平3年（192年）、樊・鄧の間で孫堅に敗れて襄陽へ退いたが、夜間に峴山で追撃してきた孫堅を配下の兵が射殺し、孫氏にとって不倶戴天の仇敵となった。"}, "呂公": {"wiki_title": "", "ai_desc": "呂公（りょこう）：劉表配下の部将。『英雄記』の異伝によれば、峴山において山沿いに兵を率い、追撃してきた孫堅の頭上に大石を落として戦死させたとされる人物。"}, "孫賁": {"wiki_title": "孫賁", "ai_desc": "孫賁（そんほん）：字は伯陽、呉郡富春の人。孫堅の同母兄・孫羌（字は聖台）の長男で、孫堅の甥。孫堅が峴山で戦死した際、年少の孫策らに代わって残された将兵を統率して袁術のもとへ帰還し、袁術の上表により亡き叔父・孫堅の後を継いで豫州刺史となった（『三國志』巻51・孫賁伝）。"}, "孫策": {"wiki_title": "孫策", "ai_desc": "孫策（そんさく）：字は伯符（175年〜200年）。孫堅の長男、呉夫人所生。十余歳で周瑜と「断金の交わり」を結び、父・孫堅の戦死後、江都で張紘に大計を諮った上で袁術から父の旧部曲を回収し、江東平定の快進撃を開始した。のち討逆将軍・呉侯に封じられ、孫権が帝位に即くと「長沙桓王」と追諡された。"}, "孫権": {"wiki_title": "孫権", "ai_desc": "孫権（そんけん）：字は仲謀（182年〜252年）。孫堅の次男、孫策の同母弟。呉の初代皇帝・大帝（在位229年〜252年）。黄龍元年（229年）に帝位に即くと、父・孫堅に「武烈皇帝（始祖）」、兄・孫策に「長沙桓王」と追諡した。"}, "孫翊": {"wiki_title": "孫翊", "ai_desc": "孫翊（そんよく）：字は叔弼（184年〜204年）。孫堅の三男、呉夫人所生。兄・孫策に似た剛毅な気性を持ち丹陽太守となったが、部下の嬀覧・戴員らに暗殺された（『三國志』巻51・孫翊伝）。"}, "孫匡": {"wiki_title": "孫匡", "ai_desc": "孫匡（そんきょう）：字は季佐。孫堅の四男、呉夫人所生。兄・孫策から父・孫堅の烏程侯の爵位を譲られ、曹操の弟の娘を娶ったが、二十余歳で早世した（『三國志』巻51・孫匡伝）。"}, "孫朗": {"wiki_title": "孫朗", "ai_desc": "孫朗（そんろう）：別名は孫仁。孫堅の庶出の末子（五男）。虞喜『志林』によれば側室の所生であったため、陳寿の本伝「堅四子（呉夫人所生の四男）」には数えられなかったとされる（『三國志』巻46・孫堅伝注、巻51・孫匡伝注）。"}, "周瑜": {"wiki_title": "周瑜", "ai_desc": "周瑜（しゅうゆ）：字は公瑾、廬江郡舒県の人（175年〜210年）。太尉・周忠の従子。孫策と同年（175年生）で、少年時代に孫策の名声を聞いて舒県から寿春へ訪ねて「断金の交わり」を結び、孫策一家を舒県へ迎え入れた。のち孫策の江東平定および皖城・夏口攻略に同行し、孫策・孫権二代を支える呉の柱石となった（『三國志』巻54・周瑜伝）。"}, "陶謙": {"wiki_title": "陶謙", "ai_desc": "陶謙（とうけん）：字は恭祖、丹陽郡丹陽県の人（132年〜194年）。かつて張温の西征で孫堅とともに参軍事を務めたが、徐州牧となってからは江都に移り住んだ孫策を深く忌み嫌ったため、孫策は母を曲阿へ移して叔父・呉景のもとへ身を寄せた（『三國志』巻8・陶謙伝、巻46・孫策伝）。"}, "呉景": {"wiki_title": "呉景", "ai_desc": "呉景（ごけい）：呉郡の人（？〜203年）。孫堅の正室・呉夫人の弟で、孫策・孫権らの母方の叔父（舅）。早くから孫堅に従軍して功を立て、袁術から丹陽太守に任じられた。劉繇に迫られて歴陽へ退いた後、孫策の江東進撃を助け、再び丹陽太守・揚武将軍となった（『三國志』巻50・呉夫人伝附呉景伝）。"}, "呂範": {"wiki_title": "呂範", "ai_desc": "呂範（りょはん）：字は子衡、汝南郡細陽県の人（？〜228年）。戦乱を避けて寿春に寓居していた際、若き孫策の器量を見抜いて門客百人を率いて帰属し、孫策の母・呉夫人を江都から曲阿へ迎える大任を果たした。のち孫策の江東平定・海西の陳瑀討伐・黄祖討伐のすべてに従軍した腹心の重臣（『三國志』巻56・呂範伝）。"}, "孫河": {"wiki_title": "孫河", "ai_desc": "孫河（そんか）：字は伯海、呉郡富春の人（？〜204年）。孫堅の族子（本姓は兪氏、孫堅に愛されて孫姓を与えられた）。早くから孫堅に従って常に先登を務め、孫堅の死後は孫策・呂範とともに呉景のもとで兵を募り、江東平定に活躍した（『三國志』巻51・孫韶伝注）。"}, "張紘": {"wiki_title": "張紘", "ai_desc": "張紘（ちょうこう）：字は子綱、広陵郡射陽県の人（153年〜212年）。張昭とともに「二張」と並び称された江東屈指の碩学・名文家。江都で母の喪に服していた際、再起の策を問うた孫策に対し、丹陽・呉・会稽を拠点に荊揚を統一して漢室を輔ける大計（江都の対）を授け、のち孫策の謀主として袁術への絶交状などを起草した（『三國志』巻53・張紘伝、『呉歴』『呉録』）。"}, "祖郎": {"wiki_title": "祖郎", "ai_desc": "祖郎（そろう）：丹陽郡涇県の有力な山越宗帥（大帥）。孫策が叔父・呉景を頼って丹陽で数百人の兵を募った際、これを急襲して孫策を危うく戦死寸前まで追い詰めた。のちに海西の陳瑀と内通して再び孫策に敵対したが、孫策に討ち破られて生け捕りにされ、その才能を惜しまれて門下賊曹に登用された（『江表伝』『三國志』巻51・孫輔伝注）。"}, "馬日磾": {"wiki_title": "馬日テイ", "ai_desc": "馬日磾（ばじつてい）：字は翁叔、右扶風茂陵の人（？〜194年）。大儒・馬融の族孫。太尉から太傅に昇り、初平3年（192年）に節を杖ついて関東の慰撫・調停（安集関東）に出向いた。寿春において若き孫策を礼をもって辟召し、上表して懐義校尉に任じたが、のち袁術に符節を奪われて抑留され、憂憤のうちに寿春で没した（『後漢書』巻60下・馬融伝附馬日磾伝、『三國志』巻6・袁術伝注）。"}, "喬蕤": {"wiki_title": "橋ズイ", "ai_desc": "喬蕤（きょうずい）：袁術配下の大将（『後漢書』や『三國志』他巻では「橋蕤」とも表記）。張勲とともに若き孫策の人柄と武勇に心服して敬意を払った（『三國志』巻46・孫策伝）。"}, "張勲": {"wiki_title": "張勲 (後漢)", "ai_desc": "張勲（ちょうくん）：袁術配下の筆頭大将。喬蕤とともに若き孫策に心服していた。のちに袁術が没すると、長史の楊弘らとともに残党を率いて孫策を頼ろうとしたが、道中で廬江太守・劉勲に待ち伏せされて捕らえられた（『三國志』巻46・孫策伝）。"}, "陳紀": {"wiki_title": "陳紀 (九江太守)", "ai_desc": "陳紀（ちんき）：丹陽郡出身で袁術配下の将。袁術は当初、孫策を九江太守に任じると約束していたが、その約束を反故にして陳紀を九江太守に起用した（『三國志』巻46・孫策伝）。"}, "劉勲": {"wiki_title": "劉勲", "ai_desc": "劉勲（りゅうくん）：字は子台、琅邪郡の人。袁術の故吏（旧部下）。孫策が袁術の約束を信じて廬江太守・陸康を攻め落とした際、袁術は再び約束を破って旧部下の劉勲を廬江太守に据えたため、孫策は袁術に深く失望することとなった（『三國志』巻46・孫策伝）。"}, "劉繇": {"wiki_title": "劉ヨウ", "ai_desc": "劉繇（りゅうよう）：字は正礼、東莱牟平の人（156年〜197年）。漢の斉孝王の末裔で、兗州刺史・劉岱の弟。朝廷から揚州刺史（のち揚州牧・振武将軍）に任じられ、袁術が寿春を占拠していたため長江南岸の曲阿に州庁を置き、呉景・孫賁を歴陽へ追い出して袁術と対峙した。興平2年（195年）、渡江してきた孫策に牛渚・横江津・曲阿を次々と破られて豫章へ逃れ、そこで病没した（『三國志』巻49・劉繇伝）。"}, "樊能": {"wiki_title": "", "ai_desc": "樊能（はんのう）：揚州刺史・劉繇の部将。于麋とともに長江北岸の横江津に駐屯して袁術軍（呉景・孫賁）を食い止めていたが、興平2年（195年）に孫策に撃破された。牛渚営を一時奪還したものの、引き返してきた孫策に再び大破された（『三國志』巻46・孫策伝、『江表伝』）。"}, "于麋": {"wiki_title": "", "ai_desc": "于麋（うび）：揚州刺史・劉繇の部将。樊能とともに横江津に布陣して袁術軍を防いだが、孫策の渡江作戦によって撃破された（『三國志』巻46・孫策伝、『江表伝』）。"}, "張英": {"wiki_title": "", "ai_desc": "張英（ちょうえい）：揚州刺史・劉繇の部将。長江北岸の当利口に駐屯し、袁術が派遣した呉景・孫賁の大軍を連年にわたって防ぎ止めたが、孫策の参戦により突破された（『三國志』巻46・孫策伝）。"}, "恵衢": {"wiki_title": "", "ai_desc": "恵衢（けいく）：徐州琅邪国の人。袁術の故吏（旧部下）。袁術が朝廷任命の劉繇に対抗して独自に任命した揚州刺史であり、督軍中郎将・呉景や孫賁とともに劉繇軍を攻めたが連年勝てなかった（『三國志』巻46・孫策伝）。"}, "王朗": {"wiki_title": "王朗", "ai_desc": "王朗（おうろう）：字は景興、東海郡郯県の人（？〜228年）。会稽太守として江東の会稽郡を治めていたが、孫策の渡江進撃によって撃破され投降した。のちに曹操に召されて魏の御史大夫・司空・司徒に昇った碩学（『三國志』巻13・王朗伝）。"}, "薛礼": {"wiki_title": "薛礼", "ai_desc": "薛礼（せつれい）：後漢末の彭城相。陶謙に迫られて南下し、下邳相・笮融とともに揚州刺史・劉繇を盟主に仰いで秣陵城に拠った。孫策に攻められて包囲を突破し逃走したが、のち劉繇の許へ逃れたところを笮融に殺害された（『三國志』巻46・孫策伝注、巻49・劉繇伝）。"}, "笮融": {"wiki_title": "サク融", "ai_desc": "笮融（さくゆう）：丹陽郡の人（？〜195年）。最初は徐州牧・陶謙に仕えて広陵・下邳・彭城の漕運を監督し、その財を私物化して壮麗な仏寺を建立したことで知られる。曹操の徐州侵攻時に男女一万・馬三千匹を率いて南へ逃れ、広陵太守・趙昱を殺害したのち秣陵の南に駐屯して劉繇に従った。孫策と激戦を交えて敗走し、のち豫章で太守・朱皓と薛礼を殺害したが、劉繇に攻め破られて山中で民に殺された（『三國志』巻46・孫策伝注、巻49・劉繇伝）。"}, "于茲": {"wiki_title": "", "ai_desc": "于茲（うじ）：笮融配下の部将。孫策が流れ矢に当たって太ももを負傷し「孫郎は矢を受けて死んだ」という誤報が流れた際、笮融の命を受けて孫策軍へ攻めかかったが、孫策が仕掛けた偽装退却と伏兵の計にはまって大敗し、千余級を討ち取られた（『江表伝』）。"}, "陳宝": {"wiki_title": "", "ai_desc": "陳宝（ちんほう）：孫策配下の部将。孫策が劉繇を追い落として曲阿に入城した際、命を受けて長江北岸の阜陵へ赴き、孫策の母（呉夫人）と幼い弟たちを曲阿へ迎え入れた（『江表伝』）。"}, "厳白虎": {"wiki_title": "厳白虎", "ai_desc": "厳白虎（げんはくこ）：別名は厳虎。呉郡烏程県の有力豪族（山越・在地武装勢力の首領）。一万余の兵を集めて呉郡各地に割拠していた。呉景らは先に厳白虎を討つよう進言したが、孫策は「群盗にすぎず大志はない」と断じて先に会稽・東冶を平定し、返す刀で厳白虎を撃破した。厳白虎は弟の厳輿を孫策に殺されると餘杭の許昭のもとへ逃亡した（『三國志』巻46・孫策伝、『呉録』）。"}, "鄒他": {"wiki_title": "", "ai_desc": "鄒他（すうた）：呉郡烏程県の地方豪族・武装指導者。銭銅や嘉興の王晟、厳白虎らとともに数千〜一万余の兵を集めて孫策に抵抗したが、孫策に攻め破られて一族皆殺し（族誅）にされた（『呉録』）。"}, "銭銅": {"wiki_title": "", "ai_desc": "銭銅（せんどう）：呉郡烏程県の地方豪族・武装指導者。鄒他らとともに兵を集めて割拠したが、孫策に討滅され一族ともども処刑された（『呉録』）。"}, "王晟": {"wiki_title": "王晟", "ai_desc": "王晟（おうせい）：呉郡嘉興県の人。前合浦太守。呉郡で数千〜一万の兵を集めて孫策に抵抗したが撃破され、息子や兄弟たちはすべて処刑された。しかし王晟自身はかつて孫堅と家族同然の親交（昇堂見妻の分）があったため、孫策の母・呉夫人のとりなしによって一人だけ助命された（『呉録』）。"}, "厳輿": {"wiki_title": "厳輿", "ai_desc": "厳輿（げんよ）：厳白虎の弟。勇力と身軽さ（座ったまま跳躍できる特技）で知られていた。兄・厳白虎の使者として孫策と単独会見した際、孫策が試しに白刃で敷物を斬りつけたところ思わず身体を動かしてしまい、器量を見抜いた孫策が投げた手戟を受けてその場で即死した（『呉録』）。"}, "許昭": {"wiki_title": "許昭", "ai_desc": "許昭（きょしょう）：呉郡〜会稽郡境の餘杭付近に自立勢力を築いていた豪族・侠客。かつての主君である前呉郡太守・盛憲が許貢に迫害された際にこれを匿い、また敗走してきた旧友の厳白虎をも受け入れた。程普が攻撃を進言した際、孫策は「旧君に義があり、故友に誠がある丈夫の志だ」と称賛して攻撃を見送った（『呉録』、裴松之注）。"}, "程普": {"wiki_title": "程普", "ai_desc": "程普（ていふ）：字は徳謀、右北平土垠の人。孫堅の代から従軍した孫呉最古参の宿将。孫策の江東平定・厳白虎討伐・黄祖討伐でも常に主力として活躍し、厳白虎を受け入れた餘杭の許昭を攻めるよう進言した（『三國志』巻55・程普伝、『呉録』）。"}, "盛憲": {"wiki_title": "盛憲", "ai_desc": "盛憲（せいけん）：字は孝章、会稽郡の人。高名な名士で呉郡太守を務めたが、病気で官を辞したのち後任の許貢に命を狙われ、部下の高岱の手引きで許昭の家へ避難して危機を逃れた（『三國志』巻46・孫策伝注引『呉録』、巻51・孫韶伝注）。"}, "孫輔": {"wiki_title": "孫輔", "ai_desc": "孫輔（そんほ）：字は国儀、呉郡富春の人。孫堅の同母兄・孫羌の次男で、孫賁の弟、孫策の従兄。孫策の江東平定に従軍して武功を挙げ、孫策が豫章郡を分割して新設した廬陵郡の初代太守（のち平南将軍）に任じられた（『三國志』巻51・孫輔伝）。"}, "朱治": {"wiki_title": "朱治", "ai_desc": "朱治（しゅち）：字は君理、丹陽郡故鄣県の人（156年〜224年）。早くから孫堅に仕え、孫堅の死後は孫策を盛り立てて家族の保護や江東進撃の献策に尽力し、呉郡太守に任じられて孫氏政権の本拠地・呉郡を長年にわたり安定させた（『三國志』巻56・朱治伝）。"}, "張昭": {"wiki_title": "張昭", "ai_desc": "張昭（ちょうしょう）：字は子布、徐州彭城国の人（156年〜236年）。戦乱を避けて江東へ渡っていた北方名士の筆頭格。江東を平定した孫策に三顧の礼で迎えられて長史・撫軍中郎将となり、文武の政務を一手に委ねられて張紘らとともに孫策の「謀主」となった（『三國志』巻52・張昭伝）。"}, "秦松": {"wiki_title": "秦松", "ai_desc": "秦松（しんしょう）：字は文表、広陵郡の人。同郡の張紘・陳端とともに江東へ渡り、彭城の張昭と並んで孫策の参謀中枢（謀主）として重用され、上奏文や戦略の立案に携わった（『三國志』巻46・孫策伝、巻53・張紘伝）。"}, "陳端": {"wiki_title": "陳端", "ai_desc": "陳端（ちんたん）：字は子正、広陵郡の人。張昭・張紘・秦松とともに孫策の「謀主（首席参謀団）」を務めたが、若くして早世した（『三國志』巻46・孫策伝、巻53・張紘伝）。"}, "劉由": {"wiki_title": "", "ai_desc": "劉由（りゅうゆう）：孫策配下の奉正都尉。孫策が江東を平定した際、五官掾の高承とともに使者として許都の朝廷へ派遣され、上奏文と江南の方物（特産品）を献上した（『江表伝』）。"}, "高承": {"wiki_title": "", "ai_desc": "高承（こうしょう）：孫策配下の五官掾。奉正都尉の劉由とともに許都の朝廷へ遣わされ、孫策の上奏文と貢物を献上した（『江表伝』）。"}, "何太后": {"wiki_title": "霊思何皇后", "ai_desc": "何太后（かたいこう）：後漢の霊帝の皇后（霊思何皇后、？〜189年）。大将軍・何進の異母妹、少帝（弘農王・劉弁）の生母。霊帝崩御後に皇太后として臨朝したが、中平6年（189年）9月に董卓によって少帝が廃位されると、まもなく董卓に毒殺された（『後漢書』巻10下・何進皇后紀）。"}, "劉弁": {"wiki_title": "少帝弁", "ai_desc": "劉弁（りゅうべん）：後漢の第13代皇帝・少帝（弘農王、176年〜190年）。霊帝と何皇后の子。189年4月に即位したが、同年9月に董卓によって廃位されて弘農王に降格され、翌初平元年（190年）に関東諸侯が反董卓の義兵を挙げると、董卓が遣わした李儒によって毒殺された。"}, "献帝": {"wiki_title": "献帝", "ai_desc": "献帝（けんてい）：姓は劉、諱は協（181年〜234年）。後漢の第14代（最後）の皇帝（在位189年〜220年）。霊帝の次男、少帝弁の異母弟。9歳で董卓に擁立され、長安への遷都や李傕・郭汜の乱を経て、建安元年（196年）に曹操に迎えられて許都へ遷った。張紘が起草した袁術への絶縁状では「幼主（若き天子）」と呼ばれている。"}, "公孫瓚": {"wiki_title": "公孫サン", "ai_desc": "公孫瓚（こうそんさん）：字は伯珪、遼西令支の人（？〜199年）。白馬義従を率いて北方辺境・幽州で威名を轟かせ、冀州の袁紹と河北の覇権を巡って激しく争った（『三國志』巻8・公孫瓚伝）。"}, "劉備": {"wiki_title": "劉備", "ai_desc": "劉備（りゅうび）：字は玄徳、涿郡涿県の人（161年〜223年）。のちの蜀漢の昭烈帝。陶謙の死後に徐州を継ぎ、建安元年〜2年（196年〜197年）にかけて淮水流域（盱眙・広陵・下邳）で袁術軍と激しく対峙・交戦した。"}, "湯王": {"wiki_title": "湯王", "ai_desc": "湯王（とうおう）：殷（商）王朝の初代王・成湯（天乙）。暴君であった夏王朝の桀王を鳴条の戦いで討ち、殷王朝を開いた聖王（『史記』巻3・殷本紀）。"}, "桀": {"wiki_title": "桀", "ai_desc": "桀（けつ）：夏王朝最後の王（履癸）。暴虐を極めて民衆を苦しめ、殷の湯王に討たれた。殷の紂王と並び「桀紂」として暴君の代名詞とされる（『史記』巻2・夏本紀）。"}, "武王": {"wiki_title": "武王 (周)", "ai_desc": "武王（ぶおう）：姓は姫、諱は発。周王朝の初代王。父・文王の遺志を継ぎ、牧野の戦いで殷の暴君・紂王を討って周王朝を開いた（『史記』巻4・周本紀）。"}, "紂": {"wiki_title": "帝辛", "ai_desc": "紂（ちゅう）：殷王朝最後の王・帝辛。酒池肉林の贅沢と炮烙の刑などの暴政を行い、周の武王に牧野の戦いで討たれた（『史記』巻3・殷本紀）。"}, "光武帝": {"wiki_title": "光武帝", "ai_desc": "光武帝（こうぶてい）：姓は劉、諱は秀（前6年〜後57年）。後漢の初代皇帝（廟号は世祖、在位25年〜57年）。王莽の新を倒して群雄を平定し、漢王朝を再興（中興）した。"}, "王莽": {"wiki_title": "王莽", "ai_desc": "王莽（おうもう）：字は巨君（前45年〜後23年）。前漢末の外戚として権力を握り、符命（予言）を根拠に孺子嬰から禅譲を受けて「新」王朝を建てたが、復古的な改革と過酷な外征・労役で天下の反乱を招き、更始帝の軍に討たれた（『漢書』巻99・王莽伝）。"}, "陳勝": {"wiki_title": "陳勝", "ai_desc": "陳勝（ちんしょう）：字は渉、陽城の人（？〜前208年）。秦末に呉広とともに最初の反乱（陳勝・呉広の乱）を起こし、陳で「張楚」の王を称したが、秦将・章邯に敗れて御者の荘賈に殺された（『史記』巻48・陳渉世家）。"}, "項羽": {"wiki_title": "項羽", "ai_desc": "項羽（こうう）：名は籍、字は羽、下相の人（前232年〜前202年）。秦を滅ぼして自ら「西楚の覇王」を称したが、漢王・劉邦との楚漢戦争に敗れて垓下・烏江で自刃した（『史記』巻7・項羽本紀）。"}, "公孫述": {"wiki_title": "公孫述", "ai_desc": "公孫述（こうそんじゅつ）：字は子陽、右扶風茂陵の人（？〜36年）。前漢末〜後漢初期の群雄。蜀（益州）の成都に割拠して「成家」の天子を自称したが、光武帝が派遣した呉漢らに攻め滅ぼされた（『後漢書』巻13・公孫述伝）。"}, "成王": {"wiki_title": "成王 (周)", "ai_desc": "成王（せいおう）：姓は姫、諱は誦。周の第2代王。幼少で即位したが、叔父の周公旦と召公奭の輔佐を受けて天下を安定させ、「成康の治」と呼ばれる周王朝の最盛期を築いた（『史記』巻4・周本紀）。"}, "周公旦": {"wiki_title": "周公旦", "ai_desc": "周公旦（しゅうこうたん）：周の文王の四男、武王の弟。幼い成王を摂政として輔佐し、管叔・蔡叔の乱を平定して周の礼楽制度を定めた、儒教における理想の賢相（『史記』巻33・魯周公世家）。"}, "召公奭": {"wiki_title": "召公奭", "ai_desc": "召公奭（しょうこうせき）：周の同姓一族で、燕の始祖。周公旦とともに「二伯」として幼い成王を輔佐し、善政を敷いた名臣（『史記』巻34・燕召公世家）。張紘は袁術への書状の中で、周公旦・召公奭（旦・奭）のように幼主・献帝を輔佐するよう説いた。"}, "王誧": {"wiki_title": "", "ai_desc": "王誧（おうほ）：後漢朝廷の議郎。建安2年（197年）夏、献帝（曹操政権）の勅使として戊辰の詔書を奉じて江東の孫策のもとへ赴き、孫策を騎都尉・烏程侯・領会稽太守に任じるとともに、孫策の要請を受けて「承制」により明漢将軍の号を仮授した（『江表伝』）。"}, "陳瑀": {"wiki_title": "陳瑀", "ai_desc": "陳瑀（ちんう）：字は公瑋、下邳淮浦の人。陳登の従父（叔父）。議郎・呉郡太守・安東将軍となり、広陵・東海境の海西に駐屯した。建安2年（197年）、朝廷から孫策・呂布とともに袁術を討つよう命じられたが、密かに都尉の万演を遣わして祖郎・厳白虎らに印綬を与えて孫策の背後を襲おうと謀ったため、これを察知した孫策が派遣した呂範・徐逸に海西を攻め落とされ、単騎で冀州の袁紹のもとへ逃亡した（『江表伝』『山陽公載記』）。"}, "万演": {"wiki_title": "", "ai_desc": "万演（ばんえん）：安東将軍・陳瑀の配下の都尉。陳瑀の密命を受け、三十余りの印綬と伝信符を携えて長江を渡り、丹陽諸県の大帥・祖郎や焦已、烏程の厳白虎らと内通して孫策の背後を攪乱しようとした（『江表伝』）。"}, "焦已": {"wiki_title": "", "ai_desc": "焦已（しょうい）：丹陽郡南部の険阻な山間諸県（宣城・涇・陵陽・始安・黟・歙）に割拠していた山越の大帥の一人。祖郎・厳白虎らとともに陳瑀から印綬を受けて孫策に反抗した（『江表伝』）。"}, "徐逸": {"wiki_title": "", "ai_desc": "徐逸（じょいつ）：孫策配下の部将。建安2年（197年）、背信を企てた陳瑀を討つため呂範とともに海西へ派遣され、陳瑀を大破してその吏士・妻子四千人を捕らえた（『江表伝』）。"}, "霍去病": {"wiki_title": "霍去病", "ai_desc": "霍去病（かくきょへい）：前漢の武帝期の名将・冠軍侯（前140年〜前117年）。大将軍・衛青の甥。18歳で初めて出陣して匈奴を大破し、弱冠（20歳）で驃騎将軍となって漠北を席巻した。孫策は謝表の中で、17歳で父を亡くした自分を18歳で武功を立てた霍去病と比較して謙遜した（『呉録』）。"}, "張璠": {"wiki_title": "張ハン", "ai_desc": "張璠（ちょうはん）：西晋〜東晋の歴史家で、『後漢紀（漢紀）』三十巻の著者。裴松之は孫堅の没年を考証するにあたり、張璠『漢紀』と胡沖『呉歴』の「初平2年（191年）死去説」を正しいと結論づけた。"}, "楊弘": {"wiki_title": "楊弘", "ai_desc": "楊弘（ようこう）：袁術配下の長史（首席幕僚）。建安4年（199年）に袁術が没すると、大将の張勲らとともに袁術の遺衆を率いて旧知の孫策を頼ろうとしたが、道中で廬江太守・劉勲に待ち伏せされて捕らえられた（『三國志』巻46・孫策伝）。"}, "董承": {"wiki_title": "董承", "ai_desc": "董承（とうしょう）：後漢の献帝の寵姫・董貴人の父（外戚、？〜200年）。献帝の長安脱出・洛陽帰還を守護した功で衛将軍・開府となり、のち曹操から衣帯詔を受けて曹操暗殺を謀ったが露見して処刑された（『三國志』巻1・武帝紀、巻32・先主伝）。"}, "劉璋": {"wiki_title": "劉璋", "ai_desc": "劉璋（りゅうしょう）：字は季玉、江夏竟陵の人（？〜219年）。益州牧・劉焉の末子。興平元年（194年）に父の跡を継いで益州牧となり、建安20年（215年）に劉備に降伏するまで二十余年にわたり巴蜀を統治した（『三國志』巻31・劉二牧伝）。"}, "袁胤": {"wiki_title": "袁胤", "ai_desc": "袁胤（えんいん）：汝南汝陽の人。袁術の従弟。建安4年（199年）に袁術が病死すると、曹操を恐れて寿春を放棄し、袁術の女婿・黄猗とともに袁術の棺と妻子・部曲を率いて皖城の廬江太守・劉勲のもとへ身を寄せたが、孫策の皖城攻略により捕らえられて呉郡へ移された（『江表伝』）。"}, "黄猗": {"wiki_title": "", "ai_desc": "黄猗（こうい）：袁術の娘婿（女婿）。袁術の死後、袁術の従弟・袁胤とともに棺と妻子・部曲を奉じて皖城の劉勲を頼った（『江表伝』）。"}, "劉偕": {"wiki_title": "", "ai_desc": "劉偕（りゅうかい）：廬江太守・劉勲の従弟。建安4年（199年）、兵糧不足に陥った劉勲の命で豫章太守・華歆のもとへ穀物の買い入れ（告糴）に赴き、海昏県上繚の裕福さに目をつけて劉勲に略奪を進言した結果、皖城の留守を孫策に突かれる原因を作った（『江表伝』）。"}, "華歆": {"wiki_title": "華歆", "ai_desc": "華歆（かきん）：字は子魚、平原高唐の人（157年〜231年）。管寧・邴原とともに「一龍」と称された清流名士。朝廷から豫章太守に任じられて善政を敷き、劉勲が兵糧を求めてきた際には海昏上繚の宗帥たちに取り次いだ。のち孫策に礼をもって迎えられ、さらに曹操に召されて魏の御史大夫・相国・司徒・太尉に昇った（『三國志』巻13・華歆伝）。"}, "李術": {"wiki_title": "李術", "ai_desc": "李術（りじゅつ）：汝南郡の人。建安4年（199年）、孫策が劉勲を破って皖城を攻略した際、孫策の上表によって廬江太守に任じられ、兵三千を与えられて皖城を守備した。しかし孫策の死後、孫権に従わず反乱を起こしたため、建安5年（200年）に孫権に皖城を攻め滅ぼされて梟首された（『江表伝』、『三國志』巻47・呉主伝）。"}, "黄射": {"wiki_title": "黄射", "ai_desc": "黄射（こうしゃ）：江夏太守・黄祖の長男（史料では「太子」と表記）。章陵太守を務め、禰衡と親교を結んだことで知られる。建安4年（199年）、西塞（沂）に追い詰められた劉勲を救うため水軍五千を率いて援軍に駆けつけたが、孫策に撃破されて逃走した（『江表伝』、『後漢書』巻80下・禰衡伝）。"}, "劉虎": {"wiki_title": "劉虎 (劉表従子)", "ai_desc": "劉虎（りゅうこ）：荊州牧・劉表の従子（甥）。建安4年（199年）12月、南陽の韓晞とともに長矛隊五千人を率いて黄祖の先鋒として沙羨に出陣したが、孫策軍の猛攻を受けて韓晞ともども討ち取られた（『江表伝』『呉録』）。"}, "韓晞": {"wiki_title": "", "ai_desc": "韓晞（かんき）：荊州南陽郡出身の部将。劉表の命により、劉表の甥・劉虎とともに長矛隊五千人を率いて黄祖の先鋒を務めたが、沙羨の戦いで孫策軍に大破され斬首された（『江表伝』『呉録』）。"}, "韓当": {"wiki_title": "韓当", "ai_desc": "韓当（かんとう）：字は義公、遼西令支の人（？〜226年）。弓術と馬術に優れ、孫堅の代から最前線で活躍した宿将。孫策に従って江東平定に功を立て、建安4年（199年）12月の黄祖討伐には「行先登校尉」として参戦した（『三國志』巻55・韓当伝、『呉録』）。"}, "黄蓋": {"wiki_title": "黄蓋", "ai_desc": "黄蓋（こうがい）：字は公覆、零陵泉陵の人。孫堅の挙兵当初から従軍した孫呉の宿将。孫策の江東平定・山越討伐で活躍し、建安4年（199年）12月の黄祖討伐には「行武鋒校尉」として参戦した（『三國志』巻55・黄蓋伝、『呉録』）。"}, "曹彰": {"wiki_title": "曹彰", "ai_desc": "曹彰（そうしょう）：字は子文（？〜223年）。曹操と卞夫人の次男（曹丕の同母弟、曹植の同母兄）。のちの魏の任城威王。建安4年（199年）、曹操が孫策を懐柔する政略結婚の一環として、孫策の従兄・孫賁の娘を正室に迎えた（『三國志』巻19・任城威王彰伝、巻46・孫策伝）。"}, "厳象": {"wiki_title": "厳象", "ai_desc": "厳象（げんしょう）：字は文則、京兆尹の人（163年〜200年）。若くして聡明博学で荀彧に推挙され、曹操の命で揚州刺史として江東・淮南方面の慰撫にあたり、建安4年（199年）に孫権を茂才に推挙した。翌建安5年（200年）、孫策が任命した廬江太守・李術に殺害された（『三國志』巻10・荀彧伝注引『三輔決録』）。"}, "高岱": {"wiki_title": "高岱", "ai_desc": "高岱（こうたい）：字は孔文、呉郡の人（？〜200年頃）。聡明で義侠心に富み、無名のうちから八人の俊才と交友を結んだ。呉郡太守・盛憲に上計吏・孝廉に取り立てられ、許貢が盛憲を迫害した際には盛憲を許昭の家に匿い、徐州牧・陶謙のもとへ赴いて血の涙を流して救援を請い、さらに許貢に囚われた母を機知と弁舌で救い出した。のち餘姚に隠棲していたところを孫策に招かれたが、離間者の言葉に乗って『左伝』の議論で「知らない」と答えたため孫策の怒りを買い、数里を埋め尽くす人々の助命嘆願が却って孫策の警戒を招いて処刑された。享年三十余（『呉録』）。"}, "陸昭": {"wiki_title": "", "ai_desc": "陸昭（りくしょう）：会稽郡丞。孫策が餘姚に隠棲していた名士・高岱を召し出した際、命を受けて出迎えの使者を務めた（『呉録』）。"}, "申包胥": {"wiki_title": "申包胥", "ai_desc": "申包胥（しんほうしょ）：春秋時代の楚の大夫。伍子胥が導く呉軍によって楚の都・郢が陥落した際、秦へ赴いて援軍を請い、秦の哀公がなかなか応じないと宮廷の庭に立ち続けて七日七晩飲まず食わずで号泣し、ついに哀公を動かして秦の援軍を引き出し楚を復興させた忠臣の鑑（『春秋左氏伝』定公四年、『史記』巻66・伍子胥列伝）。"}, "張允": {"wiki_title": "", "ai_desc": "張允（ちょういん）：呉郡の人で、高岱の友人（八友の一人、沈䁕と並び称された。荊州の劉表配下の張允とは別人）。高岱が母を救うため単身で許貢のもとへ赴く際、あらかじめ脱出用の船を用意して高岱母子の逃亡を助けた（『呉録』）。"}, "沈䁕": {"wiki_title": "", "ai_desc": "沈䁕（しんびん／しんけん）：呉郡の人で、高岱の友人（『三國志集解』等では「沈睰」とも）。張允とともにあらかじめ船を手配し、許貢のもとから母を救い出した高岱の脱出を助けた（『呉録』）。"}, "于吉": {"wiki_title": "于吉", "ai_desc": "于吉（うきつ）：琅邪郡出身の道士（？〜200年、『後漢書』襄楷伝等では「干吉」とも表記）。早くから江東に寓居して呉郡・会稽郡を往来し、精舎を建てて道書を読み符水で病を治して多くの士民・将兵の信仰を集めた。『江表伝』によれば孫策が城門楼上で諸将を集めた際に諸将の三分の二が楼を下りて于吉を拝したため処刑されたといい、『捜神記』によれば旱魃のさなかに雨乞いで大雨を降らせたものの処刑され、その遺体が雲に覆われて消えたという。また虞喜『志林』は、後漢の順帝期に弟子の宮崇が『太平清領道』百余巻を献上していることから、当時すでに百歳近く（耄）に達していたはずであると考証している。"}, "張津": {"wiki_title": "張津", "ai_desc": "張津（ちょうしん）：字は子雲、荊州南陽郡の人（？〜203年頃）。交州刺史（のち交州牧）。赤い頭巾（絳帕頭）をかぶり、琴を弾き香を焚いて道書を読み、部下の区景（または夷狄）に殺害された。『江表伝』では孫策が于吉を処刑する際（200年）に張津の死を前例として挙げたと記すが、虞喜『志林』および裴松之が引く王範『交広二州春秋』によって、張津の死は孫策の死よりも後（建安6年＝201年以降）であり『江表伝』の潤色であることが立証されている。"}, "順帝": {"wiki_title": "順帝 (漢)", "ai_desc": "順帝（じゅんてい）：姓は劉、諱は保（115年〜144年）。後漢の第8代皇帝（在位125年〜144年）。その治世に琅邪の宮崇が師・于吉の得た神書『太平清領道』百余巻を朝廷へ献上した（『後漢書』巻30下・襄楷伝、『志林』）。"}, "宮崇": {"wiki_title": "宮崇", "ai_desc": "宮崇（きゅうすう）：徐州琅邪国の人、道士・于吉の弟子。後漢の順帝の時、師の于吉が曲陽の泉水のほとりで得た神書『太平清領道（太平経）』百余巻を宮闕に参上して献上した（『後漢書』巻30下・襄楷伝、『志林』）。"}, "夏侯惇": {"wiki_title": "夏侯惇", "ai_desc": "夏侯惇（かこうとん）：字は元譲、沛国譙の人（？〜220年）。曹操の挙兵以来の最側近の重将。官渡の戦いで袁紹が敗れた後、石威則に宛てた書状の中で「孫賁に長沙を授け、張津に零陵・桂陽を治めさせる」と記しており、虞喜『志林』はこれを根拠に孫策死去の時点では張津がまだ存命であったことを論証した。"}, "石威則": {"wiki_title": "", "ai_desc": "石威則（せきいそく）：威則は字。曹操政権下の人物で、官渡の戦いの後に夏侯惇（字は元譲）から荊州南部の処置（「孫賁に長沙を授け、張津に零陵・桂陽を治めさせる」）に関する書状を受け取った（虞喜『志林』）。"}, "王範": {"wiki_title": "", "ai_desc": "王範（おうはん）：西晋の広州大中正。太康8年（287年）に交州・広州の歴史書『交広二州春秋』を朝廷に献上し、その記録によって建安6年（201年）にも張津が交州牧として健在であったことが確認される（裴松之注）。"}, "陳登": {"wiki_title": "陳登", "ai_desc": "陳登（ちんとう）：字は元龍、徐州下邳国淮浦県の人（170年〜209年頃）。下邳の名族で陳珪の子。「湖海（元龍）の豪気」で名高い経世家。呂布を滅ぼした功により曹操から伏波将軍・広陵太守に任じられ、長江北岸の匡琦城に拠って江東の孫策・孫権の北上を二度撃退した。建安5年（200年）、孫策の脅威を抑えるため厳白虎の余党を煽動して背後を揺さぶったため、孫策はその報復の軍を起こす直前に許貢の客に襲撃された（『三國志』巻7・陳登伝、巻46・孫策伝）。"}, "孫盛": {"wiki_title": "孫盛", "ai_desc": "孫盛（そんせい）：字は安国、并州太原郡中都県の人（302年〜373年）。東晋を代表する歴史家・政治家で、秘書監・長沙太守などを歴任し『魏氏春秋』『晋陽秋』『異同雑語（異同評）』を著した。巻46末尾の注に引かれる『異同評』において、孫策が弟の孫権に後事を託したことを「未練を残した過ち」と評した陳寿に真っ向から反論し、乱世の創業期に弟へ大権を授けて国家を安泰に導いた孫策の決断を絶賛した。"}, "孫紹": {"wiki_title": "孫紹", "ai_desc": "孫紹（そんしょう）：孫策の嗣子（生没年不詳）。建安5年（200年）に父・孫策が26歳で急逝した際はまだ幼少であったため、叔父の孫権が後を継いだ。黄龍元年（229年）に孫権が皇帝に即位すると、孫紹は呉侯に封じられ、のちに上虞侯に改封された。没後は子の孫奉が爵位を継いだ（『三國志』巻46・孫策伝）。"}, "孫奉": {"wiki_title": "孫奉", "ai_desc": "孫奉（そんほう）：孫策の孫、上虞侯・孫紹の子（？〜270年）。父の没後に上虞侯の爵位を継いだ。呉末期の暴君・孫皓の治世である建衡2年（270年）、孫奉に帝位が移るという民間訛言（流言）が立ったため、猜疑心を抱いた孫皓によって誅殺された（『三國志』巻46・孫策伝）。"}, "隠公": {"wiki_title": "隠公 (魯)", "ai_desc": "隠公（いんこう）：姫姓、諱は息姑（？〜紀元前712年）。春秋時代の魯の第14代君主（在位：前722年〜前712年、『春秋』経伝の起点）。父・恵公が没した際、正室（仲子）の子である異母弟の軌（のちの桓公）が幼少であったため、年長の隠公が摂政として即位し、弟の成長後に君位を譲ろうとした。しかしその優柔不断につけ込んだ大夫・羽父（公子翬）の讒言と陰謀によって暗殺された（『春秋左氏伝』隠公十一年）。孫盛は「地位を譲ろうとしてかえって身を滅ぼした失敗例」として引用した。"}, "羽父": {"wiki_title": "羽父", "ai_desc": "羽父（うほ）：魯の公子翬（き、？〜紀元前700年頃）。字は羽父。春秋時代の魯の卿。隠公に太宰の地位を求めて拒まれたため、隠公の異母弟である公子軌（桓公）に近づいて「隠公があなたを廃そうとしている」と吹き込み、紀元前712年に隠公を暗殺して桓公を擁立した（『春秋左氏伝』隠公十一年）。"}, "宣公": {"wiki_title": "宣公 (宋)", "ai_desc": "宣公（せんこう）：子姓、諱は力（？〜紀元前729年）。春秋時代の宋の第13代君主（在位：前747年〜前729年）。臨終に際し、実子の与夷（のちの殤公）ではなく弟の和（穆公）に君位を譲った。穆公もまた兄の恩に報いるため、臨終に際して実子の馮（公子馮）を鄭へ追放し、兄の子である与夷（殤公）に位を返したが、これがかえって十年で十一戦に及ぶ宋の長期内乱と殤公暗殺の引き金となった（『春秋左氏伝』隠公三年、『史記』宋微子世家）。"}, "殤公": {"wiki_title": "殤公 (宋)", "ai_desc": "殤公（しょうこう）：子姓、諱は与夷（？〜紀元前710年）。春秋時代の宋の第15代君主（在位：前719年〜前710年）。宋の宣公の子。叔父の穆公から君位を譲られたが、鄭に亡命した穆公の実子・公子馮を討つため連年外征を繰り返し、十年のうちに十一戦を行って民を疲弊させ、ついに大司馬・孔父嘉ともども太宰・華督に殺害された（『春秋左氏伝』隠公三年〜桓公二年）。"}, "桓公": {"wiki_title": "桓公 (魯)", "ai_desc": "桓公（かんこう）：姫姓、諱は軌（？〜紀元前694年）。春秋時代の魯の第15代君主（在位：前711年〜前694年）。魯の恵公と正室・仲子の子で、隠公の異母弟。公子翬（羽父）と結託して兄の隠公を弑殺し君位に就いた（『春秋左氏伝』隠公十一年）。孫盛は、兄（孫策）から正統に大権を授けられて王業を築いた孫権は、兄を弑して位を奪った魯の桓公とは全く異なると論じた。"}, "田市": {"wiki_title": "田市", "ai_desc": "田市（でんし）：戦国斉の王族・田栄の子（？〜紀元前206年）。秦末の動乱で父の田栄や叔父の田横らとともに挙兵し斉王に擁立されたが、項羽の封建によって膠東王へ遷され、父・田栄に背いて項羽に従おうとしたため田栄に殺された。孫盛は「戦乱の渦中で弱小な名目上の主君（幼主）を立てても自立できない例」として引き合いに出した。"}, "公子馮": {"wiki_title": "荘公 (宋)", "ai_desc": "公子馮（こうしふう）：のちの宋の荘公（在位：紀元前710年〜前692年）。宋の穆公の子。父・穆公が兄・宣公の子である与夷（殤公）に君位を返した際、後継争いを避けるため鄭へ亡命させられたが、かえって殤公と鄭の連年の戦争の原因となり、殤公が華督に弑殺された後に迎えられて宋公となった（『春秋左氏伝』隠公三年〜桓公二年）。孫盛は、孫策の実子・孫紹には公子馮のような野心や権勢もなく、禍乱の種にはならなかったと論じた。"}};
  const NATURAL_FEATURES = [{"name": "大別山脈", "lat": 31.15, "lng": 115.8, "style": "mountain"}, {"name": "秦嶺山脈", "lat": 33.85, "lng": 108.2, "style": "mountain"}, {"name": "嵩山・箕山", "lat": 34.48, "lng": 113.05, "style": "mountain"}, {"name": "桐柏山", "lat": 32.4, "lng": 113.3, "style": "mountain"}, {"name": "天目山脈", "lat": 30.35, "lng": 119.45, "style": "mountain"}, {"name": "会稽山脈", "lat": 29.75, "lng": 120.55, "style": "mountain"}, {"name": "黄山・皖南山地", "lat": 30.15, "lng": 118.15, "style": "mountain"}, {"name": "南嶺（五嶺）", "lat": 25.35, "lng": 112.5, "style": "mountain"}, {"name": "太湖（震沢）", "lat": 31.2, "lng": 120.2, "style": "water"}, {"name": "彭蠡沢（鄱陽湖）", "lat": 29.15, "lng": 116.25, "style": "water"}, {"name": "雲夢沢・洞庭湖", "lat": 29.3, "lng": 112.9, "style": "water"}];
  const RIVER_LINES = [{"key": "長江", "name": "長江（大江）", "coords": [[29.56, 106.55], [30.82, 108.4], [30.82, 110.96], [30.33, 112.24], [29.88, 113.62], [30.58, 114.3], [29.72, 116.0], [30.5, 117.05], [31.35, 118.35], [32.1, 118.8], [32.22, 119.45], [31.95, 120.3], [31.6, 121.2]]}, {"key": "浙江", "name": "浙江（銭塘江・富春江）", "coords": [[29.55, 119.48], [29.8, 119.68], [30.05, 119.95], [30.24, 120.18], [30.32, 120.65]]}, {"key": "淮水", "name": "淮水（淮河）", "coords": [[32.4, 113.35], [32.15, 114.08], [32.42, 115.65], [32.62, 116.75], [32.92, 117.6], [33.02, 118.52], [33.58, 119.05], [34.02, 119.85]]}, {"key": "泗水", "name": "泗水", "coords": [[35.65, 117.25], [35.4, 116.82], [34.26, 117.2], [33.92, 118.02], [33.58, 119.05]]}, {"key": "漢水", "name": "漢水", "coords": [[33.07, 107.02], [32.68, 109.02], [32.38, 111.65], [32.02, 112.14], [31.15, 112.58], [30.58, 114.3]]}, {"key": "黄河", "name": "黄河", "coords": [[36.06, 103.8], [38.47, 106.27], [40.15, 111.15], [34.62, 110.28], [34.8, 112.5], [34.95, 113.6], [35.75, 115.05], [36.7, 117.0]]}];
  const PUBLISHED_MAX_PARA = 20;

  // 【方法A：自動切り替え判定】
  // 手元のPC（file:// または localhost）で開いた時、または URL に ?edit=1 を付けた時だけ制作・指摘環境を有効化。
  // github.io 等へアップロードして一般読者が開いた時は、自動的に公開モード（指摘リスト非表示＆完了段落のみ表示）になる。
  const urlParams = new URLSearchParams(window.location.search);
  const IS_AUTHOR_EDIT_ENV = (
    window.location.protocol === 'file:' ||
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1' ||
    urlParams.get('edit') === '1'
  ) && urlParams.get('public') !== '1';

  function isEditModeActive() {
    if (!IS_AUTHOR_EDIT_ENV) return false;
    const previewEl = document.getElementById('togglePublicPreview');
    return !(previewEl && previewEl.checked);
  }

  const TOTAL_PARAGRAPHS = Math.max(...RECORDS.map(r => r.para_index));

  function getMaxVisibleParagraph() {
    return isEditModeActive() ? TOTAL_PARAGRAPHS : Math.min(TOTAL_PARAGRAPHS, PUBLISHED_MAX_PARA);
  }

  function getVisibleRecords() {
    const maxP = getMaxVisibleParagraph();
    return RECORDS.filter(r => r.para_index <= maxP);
  }

  let currentActiveId = "v46_p1_1";
  let readingHistoryStack = [];
  let activeHighlightLayers = [];

  // 1. 地図の初期化
  const map = L.map('map').setView([31.8, 115.8], 6);

  const shadedReliefLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxNativeZoom: 13,
    maxZoom: 13
  });
  const physicalLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxNativeZoom: 8,
    maxZoom: 13
  });
  physicalLayer.addTo(map);

  L.control.layers({
    "① 自然地形図（山脈と川のみ・道路なし）": physicalLayer,
    "② 陰影白地図（山の凹凸のみ・詳細ズーム可）": shadedReliefLayer
  }).addTo(map);

  // 2. 山脈・大河
  const natureGroup = L.layerGroup().addTo(map);
  RIVER_LINES.forEach(river => {
    const rLine = L.polyline(river.coords, { color: '#1976d2', weight: 2.5, opacity: 0.75 }).addTo(natureGroup);
    rLine.bindTooltip(river.name, { sticky: true });
  });
  NATURAL_FEATURES.forEach(feat => {
    const icon = L.divIcon({
      className: feat.type === 'mountain' ? 'nature-label-mountain' : 'nature-label-river',
      html: feat.name,
      iconSize: [140, 20],
      iconAnchor: [70, 10]
    });
    L.marker([feat.lat, feat.lng], { icon: icon, interactive: false }).addTo(natureGroup);
  });

  // 3. エリア（郡・州）および地点ピンのレイヤー（公開範囲に応じて自動フィルタリング）
  const baseAreaGroup = L.layerGroup().addTo(map);
  const pinMarkerGroup = L.layerGroup().addTo(map);

  function getActivePlaceKeysSet() {
    if (isEditModeActive()) {
      return new Set(PLACES.map(p => p.key));
    }
    const visibleRecs = getVisibleRecords();
    const usedKeys = new Set();
    const tagRegex = /\{\{place:([^|}]+)\|/g;
    visibleRecs.forEach(rec => {
      [rec.raw_tagged, rec.kakikudashi_tagged, rec.translation_tagged].forEach(txt => {
        if (!txt) return;
        let m;
        while ((m = tagRegex.exec(txt)) !== null) {
          usedKeys.add(m[1]);
        }
      });
    });
    // 使用されている地点ピンの親エリア（parent_area）もあわせて有効化
    PLACES.forEach(p => {
      if (p.is_pin && usedKeys.has(p.key) && p.parent_area) {
        usedKeys.add(p.parent_area);
      }
    });
    return usedKeys;
  }

  function getShortNameWithReading(labelStr) {
    if (!labelStr) return '';
    return labelStr.replace(/：[^）]*）$/, '）');
  }

  function renderMapLayersForCurrentMode() {
    baseAreaGroup.clearLayers();
    pinMarkerGroup.clearLayers();
    const activeKeys = getActivePlaceKeysSet();

    PLACES.filter(p => p.is_area && p.area_polygon && activeKeys.has(p.key)).forEach(area => {
      const isCommandery = area.category.includes('郡');
      const poly = L.polygon(area.area_polygon, {
        color: isCommandery ? '#5d4037' : '#1565c0',
        weight: isCommandery ? 1.5 : 1.2,
        dashArray: isCommandery ? '4, 4' : '8, 6',
        fillColor: isCommandery ? '#8d6e63' : '#42a5f5',
        fillOpacity: isCommandery ? 0.06 : 0.03
      }).addTo(baseAreaGroup);
      poly.bindTooltip(`🗺️ ${getShortNameWithReading(area.label)}`, { sticky: true });
      poly.on('click', () => {
        focusPlaceOnMap(area.key, area.key);
      });
    });

    PLACES.filter(p => p.is_pin && activeKeys.has(p.key)).forEach(place => {
      let fillColor = '#e65100';
      if (place.province === '益州' || place.province === '涼州') fillColor = '#2e7d32';
      else if (place.province === '荊州') fillColor = '#1565c0';
      else if (place.province === '揚州' || place.province === '徐州') fillColor = '#6a1b9a';

      const marker = L.circleMarker([place.lat, place.lng], {
        radius: 6.5,
        fillColor: fillColor,
        color: '#fff',
        weight: 1.8,
        fillOpacity: 0.95
      }).addTo(pinMarkerGroup);

      marker.bindTooltip(`<span class="custom-label" id="pin-label-${place.key}">${place.key}</span>`, {
        permanent: true,
        direction: 'top',
        offset: [0, -7],
        className: 'transparent-box'
      });

      marker.on('click', () => {
        focusPlaceOnMap(place.key, place.key);
      });
    });
  }

  window.addEventListener('resize', () => {
    map.invalidateSize();
  });

  // 5. 地名クリック時の移動＆「エリア⊃地点」ハイライト処理
  function focusPlaceOnMap(placeKey, clickedRawSurface = '') {
    closeModal();
    const found = PLACES.find(p => p.key === placeKey);
    document.querySelectorAll('.custom-label').forEach(el => el.classList.remove('selected-pin'));
    activeHighlightLayers.forEach(layer => map.removeLayer(layer));
    activeHighlightLayers = [];

    if (!found) return false;

    const targetZoom = Math.round(found.zoom || 8);
    map.stop();

    let hierarchyHtml = '';
    const activeKeys = getActivePlaceKeysSet();

    // (A) エリア（州・郡・河南・河北など）をクリックした場合：領域ポリゴン（面）と中央バナーを表示
    if (found.is_area && found.area_polygon) {
      map.fitBounds(found.area_polygon, { padding: [36, 36], maxZoom: 7 });

      const areaPoly = L.polygon(found.area_polygon, {
        color: '#d84315',

        fillColor: '#ffab40',

      const bannerIcon = L.divIcon({
        className: '',

      });
      const bannerMarker = L.marker([found.lat, found.lng], { icon: bannerIcon, interactive: false }).addTo(map);
      activeHighlightLayers.push(areaPoly, bannerMarker);
    }
    // (B) 河川をクリックした場合：水系ポリラインをハイライト
    else if (found.is_river) {
      map.setView([found.lat, found.lng], 7, { animate: true, duration: 0.5 });
      RIVER_LINES.filter(r => r.key === found.key).forEach(river => {
        const hl = L.polyline(river.coords, { color: '#ffeb3b', weight: 7, opacity: 0.85 }).addTo(map);
        const fg = L.polyline(river.coords, { color: '#d32f2f', weight: 3.5, opacity: 0.95 }).addTo(map);
        activeHighlightLayers.push(hl, fg);
      });

    // (C) 地点（県・城・関・山）をクリックした場合：親エリア（豫州・徐州・兗州など）全体が見える縮尺に合わせてピン＋親枠を表示
    else {
      const labelEl = document.getElementById(`pin-label-${found.key}`);
      if (labelEl) labelEl.classList.add('selected-pin');

      const parentArea = PLACES.find(a => a.is_area && a.key === found.parent_area);
      if (parentArea && parentArea.area_polygon) {
        // 親エリア（例：許なら豫州）の枠全体が画面に収まる縮尺（最大ズーム7）に合わせる
        map.fitBounds(parentArea.area_polygon, { padding: [36, 36], maxZoom: 7 });

        const parentPoly = L.polygon(parentArea.area_polygon, {
          color: '#2e7d32',

          dashArray: '6, 4',
          fillColor: '#66bb6a',
          fillOpacity: 0.12
        }).addTo(map);
        const pLat = parentArea.area_polygon[0][0];
        const pLng = (parentArea.area_polygon[0][1] + parentArea.area_polygon[1][1]) / 2;
        const parentBanner = L.marker([pLat, pLng], {
          icon: L.divIcon({
            className: '',
            html: `<span class="parent-area-banner-label">${parentArea.key}</span>`,
            iconSize: [100, 22],
            iconAnchor: [50, 11]
          }),
          interactive: false
        }).addTo(map);
        activeHighlightLayers.push(parentPoly, parentBanner);
      } else {
        map.setView([found.lat, found.lng], 7, { animate: true, duration: 0.5 });
      }

      const ptCircle = L.circle([found.lat, found.lng], {
        radius: 14000,
        color: '#c62828',
        weight: 2.5,
        fillColor: '#ff5252',
        fillOpacity: 0.25
      }).addTo(map);
      activeHighlightLayers.push(ptCircle);
    }

    const toast = document.getElementById('mapToast');
    const safeSurface = (clickedRawSurface || found.key).replace(/'/g, "\'");
    const safeKey = found.key.replace(/'/g, "\'");
    const toastFeedbackHtml = isEditModeActive() ? `
      <div class="toast-feedback-bar">
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '🔄 場所が違う（同名別地・位置修正）')">🔄 場所が違う</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '📐 エリア⇔地点の区分変更')">📐 エリア⇔地点変更</button>
        <button class="toast-fb-btn" onclick="startMapCoordPicker('${safeKey}', '${safeSurface}')">📍 地図クリックで正しい位置を指定</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '❌ 地名タグ解除')">❌ タグ解除</button>
      </div>
    ` : '';
    const shortTitle = getShortNameWithReading(found.label);
    toast.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px;"><div>📍 <strong>${shortTitle}</strong> <span style="font-size:0.8rem; color:#ddd;">（現在の${found.modern}）</span></div><button onclick="document.getElementById('mapToast').style.display='none'" style="background:transparent; border:none; color:#ccc; cursor:pointer; font-size:0.9rem; line-height:1; padding:0 2px;" title="閉じる">✕</button></div>${toastFeedbackHtml}`;
    toast.style.display = 'block';
    return true;
  }

  // 6. データベースに埋め込まれた確定タグ（{type:key|surface}）を直接HTMLへ変換
  function getActivePersonsList() {
    return Array.from(new Set(
      getVisibleRecords().flatMap(r => (r.persons || '').split(',').map(s => s.trim()).filter(Boolean))
    ));
  }

  function getPlaceSubTypeLabel(placeKey) {
    const p = PLACES.find(item => item.key === placeKey);
    if (!p) return `地名(${placeKey})`;
    if (p.is_area) return `🗺️地名[エリア](${placeKey})`;
    if (p.is_river) return `🌊地名[河川](${placeKey})`;
    return `📍地名[地点](${placeKey})`;
  }

  function renderEmbeddedTags(taggedText, recId) {
    if (!taggedText) return '';
    const editHint = isEditModeActive() ? ' ／ 右クリックまたはドラッグ選択で指摘' : '';
    return taggedText.replace(/\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g, (m, tagType, key, surface) => {
      const safeKey = key.replace(/'/g, "\'");
      const safeSurface = surface.replace(/'/g, "\'");
      if (tagType === 'place') {
        const subLabel = getPlaceSubTypeLabel(key);
        return `<span class="inline-place" data-tag-type="place" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" title="${subLabel}：クリックで地図移動${editHint}">${surface}</span>`;
      } else if (tagType === 'office') {
        return `<span class="inline-office" data-tag-type="office" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" title="👑官職(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'person') {
        return `<span class="inline-person" data-tag-type="person" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" title="👤人名(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'special') {
        return `<span class="inline-special" data-tag-type="special" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" title="🔖特別キーワード(${key})：クリックで解説${editHint}">${surface}</span>`;
      }
      return surface;
    });
  }

  // 7. 本文・裴注リーダー描画（「1段落＝本文＋裴注」ずつの切り替え表示）
  const recordListEl = document.getElementById('recordList');
  const paraTopNavEl = document.getElementById('paraTopNav');
  let currentParaIndex = 1;

  function getSectionLabelForPara(paraIdx) {
    const rec = RECORDS.find(r => r.para_index === paraIdx);
    const maxVis = getMaxVisibleParagraph();
    if (isEditModeActive() && rec) {
      const shortSec = (rec.section_title || '').replace('孫破虜討逆傳（', '').replace('）', '');
      const pubBadge = paraIdx <= PUBLISHED_MAX_PARA ? '✅' : '🔧';
      return `${pubBadge} 第 ${paraIdx} / ${maxVis} （${shortSec}）`;
    }
    const denomLabel = PUBLISHED_MAX_PARA < TOTAL_PARAGRAPHS ? '○' : maxVis;
    return `第 ${paraIdx} / ${denomLabel}`;
  }

  function goToParagraph(paraIdx) {
    const maxVis = getMaxVisibleParagraph();
    const clamped = Math.max(1, Math.min(maxVis, paraIdx));
    currentParaIndex = clamped;
    const showAllEl = document.getElementById('toggleShowAllParas');
    if (showAllEl && showAllEl.checked) {
      showAllEl.checked = false;
    }
    renderReaderList();
    recordListEl.scrollTop = 0;
    const firstRec = getVisibleRecords().find(r => r.para_index === currentParaIndex);
    if (firstRec) {
      setActiveRecord(firstRec.id);
    }
  }

  function changeParagraph(delta) {
    goToParagraph(currentParaIndex + delta);
  }

  function renderReaderList() {
    const showAll = isEditModeActive() && document.getElementById('toggleShowAllParas') && document.getElementById('toggleShowAllParas').checked;
    const maxVis = getMaxVisibleParagraph();
    if (currentParaIndex > maxVis) {
      currentParaIndex = maxVis;
    }

    // 地図と本文の間の段落切り替えバー（← 第 1 / ○ →）を更新
    if (paraTopNavEl) {
      if (!showAll) {
        const prevDisabled = currentParaIndex <= 1 ? 'disabled' : '';
        const nextDisabled = currentParaIndex >= maxVis ? 'disabled' : '';
        let optionsHtml = '';
        for (let p = 1; p <= maxVis; p++) {
          const selectedAttr = p === currentParaIndex ? 'selected' : '';
          optionsHtml += `<option value="${p}" ${selectedAttr}>${getSectionLabelForPara(p)}</option>`;
        }
        paraTopNavEl.innerHTML = `
          <button class="slim-nav-btn" onclick="changeParagraph(-1)" ${prevDisabled}>←</button>
          <select class="para-select" onchange="goToParagraph(parseInt(this.value, 10))">${optionsHtml}</select>
          <button class="slim-nav-btn" onclick="changeParagraph(1)" ${nextDisabled}>→</button>
        `;
      } else {
        paraTopNavEl.innerHTML = `<span class="vol-nav-title">全段落連続表示（第 1 〜 ${maxVis} 段落）</span>`;
      }
    }

    recordListEl.innerHTML = '';

    // 読書履歴スタックがある場合は最上部に「元の場所に戻る」ボタンを表示
    if (readingHistoryStack.length > 0) {

  function openUnifiedModal(categoryType, itemKey, clickedSurface = '') {
    let headerTitle = '';
    let wikiTargetTitle = '';
    let mappingNote = '';
    let specialGlossaryDesc = '';
    let searchTerms = [];

    if (categoryType === 'person') {
      headerTitle = `👤 【人物】${itemKey}`;
      const pInfo = PERSONS_INFO[itemKey];
      if (pInfo) {
        wikiTargetTitle = pInfo.wiki_title || '';
        specialGlossaryDesc = pInfo.ai_desc || '';
      } else {
        wikiTargetTitle = itemKey.replace(/\(.*?\)/g, '');
      }
      if (clickedSurface && clickedSurface !== itemKey) {
        mappingNote = `原文の「${clickedSurface}」をフルネーム「${itemKey}」に特別変換して紐づけています。`;
      }
      searchTerms = [itemKey];
    } else if (categoryType === 'office') {
      const info = OFFICES[itemKey];
      if (!info) return;
      headerTitle = `👑 【官職】${info.title}`;
      wikiTargetTitle = info.wiki_title !== undefined ? info.wiki_title : itemKey;
      mappingNote = info.mapping_note || '';
      if (!wikiTargetTitle) {
        specialGlossaryDesc = info.ai_desc || '';
      }
      searchTerms = itemKey === '県令' ? ['易陽令', '雒陽令', '綿竹令'] :
                    (itemKey === '県長' ? ['臨沮長', '旌陽長', '臨邛長'] :
                    (itemKey === '相' ? ['魯相'] : info.match_terms));
    } else if (categoryType === 'special') {
      const info = SPECIAL_KW[itemKey];
      if (!info) return;
      headerTitle = `🔖 【${info.category}】${info.title}`;
      wikiTargetTitle = info.wiki_title !== undefined ? info.wiki_title : itemKey;
      mappingNote = info.mapping_note || '';
      specialGlossaryDesc = info.ai_desc || '';
      searchTerms = info.match_terms;
    }

    const fallbackAiDesc = (categoryType === 'office' && OFFICES[itemKey]) ? (OFFICES[itemKey].ai_desc || '') : '';

    const matched = getVisibleRecords().filter(rec => {
      const allText = [rec.raw_text, rec.kakikudashi, rec.translation, rec.persons, rec.keywords, rec.source_book, rec.era_year].join(' ');
      return searchTerms.some(t => allText.includes(t));

      ? `<div class="wiki-standard-box" id="unifiedWikiBox">

         </div>`

        <div class="occurrence-list" id="modalOccurrenceList"></div>

      fetchWikipediaSummary(wikiTargetTitle, 'unifiedWikiBox', fallbackAiDesc, Boolean(specialGlossaryDesc));

  async function fetchWikipediaSummary(wikiTitle, containerId, fallbackDesc = '', hasSpecialBox = false) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const encoded = encodeURIComponent(wikiTitle);
    const wikiUrl = `https://ja.wikipedia.org/wiki/${encoded}`;
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encoded}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.type === 'disambiguation') throw new Error('Disambiguation');
      box.innerHTML = `
        <div style="font-weight:bold; color:#0d47a1; margin-bottom:4px;">🌐 【Wikipedia 概略】「${data.title}」</div>
        <div>${data.extract || '（要約テキストなし）'}</div>
        <a class="wiki-link-btn" href="${wikiUrl}" target="_blank" rel="noopener">Wikipediaで「${data.title}」のページを開く ↗</a>
      `;
    } catch (err) {
      if (hasSpecialBox) {
        box.style.display = 'none';
      } else if (fallbackDesc) {
        box.className = 'ai-special-box';
        box.innerHTML = `
          <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">📖 【語句・制度の意味解説】</div>
          <div>${fallbackDesc}</div>
        `;
      } else {
        box.style.display = 'none';
      }
    }
  }
