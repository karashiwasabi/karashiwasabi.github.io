erson:諸葛亮|諸葛亮}}は{{place:巴|巴}}・{{place:蜀|蜀}}の衆をもって、{{special:虓虎|猛虎}}の師に立ち向かった。将軍は堅鎧を被り鋭兵を執り、向かうところすべてを平定した、朕は大いにこれを嘉する。食邑千戸を増やし、以前と合わせて四千三百戸とする」。{{person:司馬懿|司馬宣王}}が{{place:荊州|荊州}}で水軍を調練し、{{place:漢水|沔水}}に従って{{place:長江|長江}}に入り{{place:呉|呉}}を討とうと欲し、{{person:張郃|張郃}}に詔して{{place:関中|関中}}の諸軍を統督して赴き節度を受けさせた。{{place:荊州|荊州}}に至ったが、ちょうど冬で水が浅く、大船が航行できなかったため、還って{{place:方城|方城}}に駐屯した。{{person:諸葛亮|諸葛亮}}が再び出撃し、急に{{place:陳倉|陳倉}}を攻めた。{{person:曹叡|明帝}}は{{special:駅馬|駅馬}}をもって{{person:張郃|張郃}}を{{place:洛陽|京都}}へ召した。{{person:曹叡|明帝}}は自ら{{place:洛陽|河南城}}に行幸し、酒宴を設けて{{person:張郃|張郃}}を送り出し、南北軍の兵士三万を派遣し、また{{special:虎賁|武衛}}・{{special:虎賁|虎賁}}を分遣して{{person:張郃|張郃}}を護衛させ、そこで{{person:張郃|張郃}}に問うて言った。「将軍が到着するのを待つ間に、{{person:諸葛亮|諸葛亮}}はすでに{{place:陳倉|陳倉}}を手に入れてしまっているのではないか！」。{{person:張郃|張郃}}は、{{person:諸葛亮|諸葛亮}}が懸軍で穀物がなく、長く攻めることができないのを知っており、答えて言った。「私がまだ到着しないうちに、{{person:諸葛亮|諸葛亮}}はすでに退却しているでしょう。指を折って数えますに、{{person:諸葛亮|諸葛亮}}の兵糧は十日も持ちません」。{{person:張郃|張郃}}が昼夜兼行で進んで{{place:南鄭|南鄭}}に至ると、{{person:諸葛亮|諸葛亮}}は退却した。詔して{{person:張郃|張郃}}を{{place:洛陽|京都}}へ還らせ、{{office:征東将軍|征西車騎将軍}}に任じた。"}, {"id": "v17_p13_1", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（張郃）", "para_index": 13, "type": "本文", "raw_text": "郃識變數，善處營陳，料戰勢地形，無不如計，自諸葛亮皆憚之。郃雖武將而愛樂儒士，嘗薦同鄕卑湛經明行修，詔曰：「昔祭遵爲將，奏置五經大夫，居軍中，與諸生雅歌投壺。今將軍外勒戎旅，內存國朝。朕嘉將軍之意，今擢湛爲博士。」", "kakikudashi": "郃、変数を識り、善く営陳を処し、戦勢・地形を料るに、計の如くならざるは無く、諸葛亮より皆之を憚る。郃、武将と雖も儒士を愛楽し、嘗て同郷の卑湛の経明らかにし行修まるを薦む。詔して曰く、「昔、祭遵、将と為り、奏して五経大夫を置き、軍中に居りて、諸生と雅歌投壺す。今、将軍、外は戎旅を勒し、内は国朝を存す。朕、将軍の意を嘉し、今、湛を擢んでて博士と為す」と。", "translation": "張郃は変数を識り、巧みに営陳を配し、戦勢や地形を見極めるにあたって計算通りにならないことはなく、諸葛亮より以下みな彼を恐れた。張郃は武将でありながら儒士を愛し、かつて同郷の卑湛が経書に明るく品行が修まっているとして推挙した。詔して言った。「昔、祭遵は将となった際、上奏して五経大夫を置き、軍中に居りながら諸生と雅歌投壺したという。いま将軍は、外は軍旅を統率し、内は国朝を心にかけている。朕は将軍の意を嘉し、いま卑湛を抜擢して博士とする」。", "persons": "張郃,諸葛亮,卑湛,祭遵,曹叡", "places": "", "era_year": "太和2年〜4年頃（228年〜230年頃）", "source_book": "", "keywords": "識変数,営陳,儒士,外勒戎旅,博士,投壺", "raw_tagged": "{{person:張郃|郃}}{{special:識変数|識變數}}，善處{{special:営陳|營陳}}，料戰勢地形，無不如計，自{{person:諸葛亮|諸葛亮}}皆憚之。{{person:張郃|郃}}雖武將而愛樂{{special:儒士|儒士}}，嘗薦同鄕{{person:卑湛| 詔して諸将を統督して西の{{place:略陽|略陽}}へ至らせ、{{person:諸葛亮|諸葛亮}}が還って{{place:祁山|祁山}}を保つと、{{person:張郃|張郃}}は追撃して{{place:木門|木門}}に至り、{{person:諸葛亮|諸葛亮}}の軍と交戦し、飛矢が{{person:張郃|張郃}}の右膝に当たり、死去した。"}, {"id": "v17_p14_2", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（張郃）", "para_index": 14, "type": "裴注", "raw_text": "《魏略》曰：「亮軍退，司馬宣王使郃追之，郃曰：『軍法，圍城必開出路，歸軍勿追。』宣王不聽。郃不得已，遂進。蜀軍乘高布伏，弓弩亂發，矢中郃髀。」", "kakikudashi": "『魏略』に曰く、「亮の軍退くや、司馬宣王、郃をして之を追はしむ。郃曰く、『軍法に、城を囲めば必ず出路を開き、帰軍は追ふ勿かれとあり』と。宣王聴かず。郃、已むを得ずして、遂に進む。蜀軍、高きに乗りて伏を布き、弓弩乱発し、矢、郃の髀に中る」と。", "translation": "『魏略』にいう。諸葛亮の軍が退却すると、司馬宣王（司馬懿）は張郃に命じてこれを追撃させた。張郃は言った。「軍法に、城を囲めば必ず出路を開き、帰軍は追うなかれとあります」。司馬宣王は聞き入れなかった。張郃はやむを得ず、ついに進んだ。蜀軍は高所に乗じて伏兵を敷き、弓弩を乱射し、矢が張郃の股に当たった。", "persons": "諸葛亮,司馬懿,張郃", "places": "蜀", "era_year": "太和5年（231年）", "source_book": "魏略", "keywords": "魏略,髀", "raw_tagged": "《{{special:魏略|魏略}}》曰：「{{person:諸葛亮|亮}}軍退，{{person:司馬懿|司馬宣王}}使{{person:張郃|郃}}追之，{{person:張郃|郃}}曰：『軍法，圍城必開出路，歸軍勿追。』{{person:司馬懿|宣王}}不聽。{{person:張郃|郃}}不得已，遂進。{{place:蜀|蜀}}軍乘高布伏，弓弩亂發，矢中{{person:張郃|郃}}{{special:髀|髀}}。」", "kakikudashi_tagged": "『{{special:魏略|魏略}}』に曰く、「{{person:諸葛亮|亮}}の軍退くや、{{person:司馬懿|司馬宣王}}、{{person:張郃|郃}}をして之を追はしむ。{{person:張郃|郃}}曰く、『軍法に、城を囲めば必ず出路を開き、帰軍は追ふ勿かれとあり』と。{{person:司馬懿|宣王}}聴かず。{{person:張郃|郃}}、已むを得ずして、遂に進む。{{place:蜀|蜀}}軍、高きに乗りて伏を布き、弓弩乱発し、矢、{{person:張郃|郃}}の{{special:髀|髀}}に中る」と。", "translation_tagged": "『{{special:魏略|魏略}}』にいう。{{person:諸葛亮|諸葛亮}}の軍が退却すると、{{person:司馬懿|司馬宣王}}（{{person:司馬懿|司馬懿}}）は{{person:張郃|張郃}}に命じてこれを追撃させた。{{person:張郃|張郃}}は言った。「軍法に、城を囲めば必ず出路を開き、帰軍は追うなかれとあります」。{{person:司馬懿|司馬宣王}}は聞き入れなかった。{{person:張郃|張郃}}はやむを得ず、ついに進んだ。{{place:蜀|蜀}}軍は高所に乗じて伏兵を敷き、弓弩を乱射し、矢が{{person:張郃|張郃}}の{{special:髀|股}}に当たった。"}, {"id": "v17_p14_3", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（張郃）", "para_index": 14, "type": "本文", "raw_text": "諡曰壯侯。子雄嗣。郃前後征伐有功，明帝分郃戸，封郃四子列侯。賜小子爵關內侯。", "kakikudashi": "諡して壮侯と曰ふ。子の雄、嗣ぐ。郃、前後征伐して功有り、明帝、郃の戸を分かち、郃の四子を列侯に封ず。小子に爵関内侯を賜ふ。", "translation": "「壮侯」と諡された。子の張雄が後を継いだ。張郃が前後の征伐で功績があったことから、明帝は張郃の食邑を分け、張郃の四人の子を列侯に封じた。末の子には関内侯の爵位を賜った。", "persons": "張郃,張雄,曹叡", "places": "", "era_year": "太和5年（231年）", "source_book": "", "keywords": "壮侯,列侯,関内侯", "raw_tagged": "諡曰{{special:壮侯|壯侯}}。子{{person:張雄|雄}}嗣。{{person:張郃|郃}}前後征伐有功，{{person:曹叡|明帝}}分{{person:張郃|郃}}戸，封{{person:張郃|郃}}四子{{office:列侯|列侯}}。賜小子爵{{office:列侯|關內侯}}。", "kakikudashi_tagged": "諡して{{special:壮侯|壮侯}}と曰ふ。子の{{person:張雄|雄}}、嗣ぐ。{{person:張郃|郃}}、前後征伐して功有り、{{person:曹叡|明帝}}、{{person:張郃|郃}}の戸を分かち、{{person:張郃|郃}}の四子を{{office:列侯|列侯}}に封ず。小子に爵{{office:列侯|関内侯}}を賜ふ。", "translation_tagged": "「{{special:壮侯|壮侯}}」と諡された。子の{{person:張雄|張雄}}が後を継いだ。{{person:張郃|張郃}}が前後の征伐で功績があったことから、{{person:曹叡|明帝}}は{{person:張郃|張郃}}の食邑を分け、{{person:張郃|張郃}}の四人の子を{{office:列侯|列侯}}に封じた。末の子には{{office:列侯|関内侯}}の爵位を賜った。"}, {"id": "v17_p15_1", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（徐晃）", "para_index": 15, "type": "本文", "raw_text": "徐晃字公明，河東楊人也。爲郡吏，從車騎將軍楊奉討賊有功，拜騎都尉。李傕、郭汜之亂長安也，晃説奉，令與天子還洛陽，奉從其計。天子渡河至安邑，封晃都亭侯。及到洛陽，韓暹、董承日爭鬬，晃説奉令歸太祖；奉欲從之，後悔。太祖討奉於梁，晃遂歸太祖。", "kakikudashi": "徐晃、字は公明、河東楊の人なり。郡吏と為り、車騎将軍楊奉に従ひて賊を討ちて功有り、騎都尉に拝せらる。李傕・郭汜の長安を乱すや、晃、奉に説き、天子と洛陽に還らしめ、奉、其の計に従ふ。天子、河を渡りて安邑に至るや、晃を都亭侯に封ず。洛陽に到るに及び、韓暹・董承、日に争鬬し、晃、奉に説きて太祖に帰せしめんとす。奉、之に従はんと欲するも、後に悔ゆ。太祖、奉を梁に討つや、晃、遂に太祖に帰す。", "translation": "徐晃、字は公明は、河東楊の人である。郡の役人となり、車騎将軍の楊奉に従って賊を討って功績があり、騎都尉に任じられた。李傕・郭汜が長安を乱した際、徐晃は楊奉に説き、天子とともに洛陽へ還らせようとし、楊奉はその計に従った。天子が黄河を渡って安邑に至ると、徐晃を都亭侯に封じた。洛陽に到着するに及び、韓暹と董承が日ごとに争闘したため、徐晃は楊奉に説いて太祖（曹操）に帰属させようとした。楊奉はこれに従おうとしたが、後に悔いて取りやめた。太祖が梁で楊奉を討つと、徐晃はついに太祖に帰順した。", "persons": "徐晃,楊奉,李傕,郭汜,献帝,韓暹,董承,曹操", "places": "河東,楊,長安,洛陽,黄河,安邑,梁", "era_year": "興平2年〜建安元年（195年〜196年）", "source_book": "", "keywords": "車騎将軍,騎都尉,天子,都亭侯", "raw_tagged": "{{person:徐晃|徐晃}}字{{person:徐晃|公明}}，{{place:河東|河東}}{{place:楊|楊}}人也。爲{{office:郡吏|郡吏}}，從{{office:車騎将軍|車騎將軍}}{{person:楊奉|楊奉}}討賊有功，拜{{office:騎都尉|騎都尉}}。{{person:李傕|李傕}}、{{person:郭汜|郭汜}}之亂{{place:長安|長安}}也，{{person:徐晃|晃}}説{{person:楊奉|奉}}，令與天子還{{place:洛陽|洛陽}}，{{person:楊奉|奉}}從其計。天子渡{{place:黄河|河}}至{{place:安邑|安邑}}，封{{person:徐晃|晃}}{{office:列侯|都亭侯}}。及到{{place:洛陽|洛陽}}，{{person:韓暹|韓暹}}、{{person:董承|董承}}日爭鬬，{{person:徐晃|晃}}説{{person:楊奉|奉}}令歸{ :徐晃|徐晃}}に兵を授け、{{place:巻|巻}}・{{place:原武|原武}}の"}, {"id": "v17_p16_2", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（徐晃）", "para_index": 16, "type": "裴注", "raw_text": "卷，音墟權反。", "kakikudashi": "巻は、音は墟権の反。", "translation": "巻は、音は墟権の反（けん）である。", "persons": "", "places": "巻", "era_year": "", "source_book": "", "keywords": "", "raw_tagged": "{{place:巻|卷}}，音墟權反。", "kakikudashi_tagged": "{{place:巻|巻}}は、音は墟権の反。", "translation_tagged": "{{place:巻|巻}}は、音は墟権の反（けん）である。"}, {"id": "v17_p16_3", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（徐晃）", "para_index": 16, "type": "本文", "raw_text": "賊，破之，拜裨將軍。從征呂布，別降布將趙庶、李鄒等。與史渙斬眭固於河內。從破劉備，又從破顔良，拔白馬，進至延津，破文醜，拜偏將軍。與曹洪擊㶏強賊祝臂，破之，又與史渙擊袁紹運車於故市，功最多，封都亭侯。太祖旣圍鄴，破邯鄲，易陽令韓範僞以城降而拒守，太祖遣晃攻之。晃至，飛矢城中，爲陳成敗。範悔，晃輒降之。旣而言於太祖曰：「二袁未破，諸城未下者傾耳而聽，今日滅易陽，明日皆以死守，恐河北無定時也。原公降易陽以示諸城，則莫不望風。」太祖善之。別討毛城，設伏兵掩擊，破三屯。從破袁譚於南皮，討平原叛賊，克之。從征蹋頓，拜橫野將軍。從征荆州，別屯樊，討中廬、臨沮、宜城賊。又與滿寵討關羽於漢津，與曹仁擊周瑜於江陵。十五年，討太原反者，圍大陵，拔之，斬賊帥商曜。韓遂、馬超等反關右，遣晃屯汾陰以撫河東，賜牛酒，令上先人墓。太祖至潼關，恐不得渡，召問晃。晃曰：「公盛兵於此，而賊不復別守蒲阪，知其無謀也。今假臣", "kakikudashi": "賊を撃たしめ、之を破り、裨将軍に拝す。従ひて呂布を征し、別に布の将趙庶・李鄒等を降す。史渙と眭固を河内に斬る。従ひて劉備を破り、又従ひて顔良を破り、白馬を抜き、進みて延津に至り、文醜を破り、偏将軍に拝せらる。曹洪と㶏強の賊祝臂を撃ちて之を破り、又史渙と袁紹の運車を故市に撃ち、功最も多く、都亭侯に封ぜらる。太祖、既に鄴を囲み、邯鄲を破るや、易陽令の韓範、偽りて城を以て降りて拒守し、太祖、晃を遣はして之を攻めしむ。晃至り、矢を城中に飛ばし、為に成敗を陳ぶ。範悔い、晃、輒ち之を降す。既にして太祖に言ひて曰く、「二袁未だ破れず、諸城の未だ下らざる者、耳を傾けて聴く。今日易陽を滅ぼさば、明日皆死を以て守り、恐らくは河北、定まる時無からん。願はくは公、易陽を降して以て諸城に示さば、則ち風を望まざるは莫からん」と。太祖、之を善しとす。別に毛城を討ち、伏兵を設けて掩撃し、三屯を破る。従ひて袁譚を南皮に破り、平原の叛賊を討ちて、之に克つ。従ひて蹋頓を征し、横野将軍に拝せらる。従ひて荊州を征し、別に樊に屯し、中廬・臨沮・宜城の賊を討つ。又満寵と関羽を漢津に討ち、曹仁と周瑜を江陵に撃つ。十五年、太原の反する者を討ち、大陵を囲みて之を抜き、賊帥商曜を斬る。韓遂・馬超等、関右に反するや、晃を遣はして汾陰に屯して以て河東を撫せしめ、牛酒を賜ひ、先人の墓に上らしむ。太祖、潼関に至り、渡るを得ざるを恐れ、晃を召して問ふ。晃曰く、「公、兵を此に盛んにするも、賊、復た別に蒲阪を守らざれば、其の謀無きを知るなり。今、臣に", "translation": "賊を撃たせてこれを破り、裨将軍に任じた。従って呂布を征討し、別に呂布の将・趙庶や李鄒らを降伏させた。史渙とともに河内で眭固を斬った。従って劉備を破り、また従って顔良を破って白馬を抜き、進んで延津に至って文醜を破り、偏将軍に任じられた。曹洪とともに㶏強の賊・祝臂を撃ってこれを破り、また史渙とともに故市で袁紹の輸送車を撃ち、功績が最も多く、都亭侯に封じられた。太祖がすでに鄴を包囲し、邯鄲を破った際、易陽令の韓範が偽って城ごと降伏するふりをして防戦したため、太祖は徐晃を派遣してこれを攻めさせた。徐晃は到着すると、矢文を城中に飛ばし、韓範のために成敗の道理を述べた。韓範は悔い改め、徐晃はただちにこれを降伏させた。その上で太祖に言った。「二 未攻，太祖前後遣殷署、朱蓋等凡十二營詣晃。賊圍頭有屯，又別屯四冢。晃揚聲當攻圍頭屯，而密攻四冢。羽見四冢欲壞，自將步騎五千出戰，晃擊之，退走，遂追陷與俱入圍，破之，或自投沔水死。太祖令曰：「賊圍塹鹿角十重，將軍致戰全勝，遂陷賊圍，多斬首虜。吾用兵三十餘年，及所聞古之善用兵者，未有長驅徑入敵圍者也。且樊、襄陽之在圍，過於莒、即墨，將軍之功，逾孫武、穰苴。」晃振旅還摩陂，太祖迎晃七里，置酒大會。太祖舉巵酒勸晃，且勞之曰：「全樊、襄陽，將軍之功也。」時諸軍皆集，太祖案行諸營，士卒咸離陳觀，而晃軍營整齊，將士駐陳不動。太祖嘆曰：「徐將軍可謂有周亞夫之風矣。」", "kakikudashi": "太祖、鄴に還り、晃と夏侯淵を留めて劉備を陽平に拒がしむ。備、陳式等十余営を遣はして馬鳴閣道を絶たしむるも、晃、別に征きて之を破り、賊、自ら山谷に投じ、死する者多し。太祖聞き、甚だ喜び、晃に節を仮し、令して曰く、「此の閣道は、漢中の険要の咽喉なり。劉備、外内を断絶し、以て漢中を取らんと欲す。将軍、一挙にして賊の計を克奪す、善の善なる者なり」と。太祖、遂に自ら陽平に至り、漢中の諸軍を引き出だす。復た晃を遣はして曹仁を助けて関羽を討たしめ、宛に屯す。会たま漢水暴かに溢れ、于禁等没す。羽、仁を樊に囲み、又将軍呂常を襄陽に囲む。晃の将ゐる所、新卒多く、羽の与に鋒を争ひ難きを以て、遂に前みて陽陵陂に至りて屯す。太祖、復た還り、将軍徐商・呂建等を遣はして晃に詣らしめ、令して曰く、「須らく兵馬の集まり至るをまちて、乃ち倶に前むべし」と。賊、偃城に屯す。晃到り、詭道もて都塹を作り、其の後を截たんと欲するを示せば、賊、屯を焼きて走る。晃、偃城を得、両面に営を連ね、稍く前み、賊の囲みを去ること三丈所。未だ攻めず、太祖、前後して殷署・朱蓋等凡て十二営を遣はして晃に詣らしむ。賊の囲頭に屯有り、又別に四冢に屯す。晃、囲頭の屯を攻むべしと揚声し、密かに四冢を攻む。羽、四冢の壊れんと欲するを見、自ら歩騎五千を将ゐて出でて戦ふも、晃、之を撃ち、退き走れば、遂に追ひ陥れて与に倶に囲みに入り、之を破り、或いは自ら沔水に投じて死す。太祖、令して曰く、「賊の囲塹・鹿角十重なるに、将軍、戦ひを致して全勝し、遂に賊の囲みを陥れ、多く首虜を斬る。吾、兵を用ふること三十余年、及び聞く所の古の善く兵を用ふる者も、未だ長駆して径ちに敵の囲みに入りし者は有らざるなり。且つ樊・襄陽の囲みに在るや、莒・即墨に過ぎ、将軍の功は、孫武・司馬穰苴に逾ゆ」と。晃、旅を振へて摩陂に還るや、太祖、晃を迎ふること七里、酒を置きて大会す。太祖、巵酒を挙げて晃に勧め、且つ之を労ひて曰く、「樊・襄陽を全くせしは、将軍の功なり」と。時に諸軍皆集まり、太祖、諸営を案行するに、士卒咸く陳を離れて観るも、晃の軍営は整斉として、将士、陳に駐まりて動かず。太祖、嘆じて曰く、「徐将軍は周亜夫の風有りと謂ふべし」と。", "translation": "太祖は鄴へ還る際、徐晃と夏侯淵を残して陽平で劉備を防がせた。劉備が陳式ら十余営を派遣して馬鳴閣道を絶たせたが、徐晃は別に征討してこれを破り、賊は自ら山谷に身を投じて死ぬ者が多かった。太祖は聞いて大いに喜び、徐晃に仮節を与え、令して言った。「この閣道は、漢中の険要の咽喉である。劉備は外内を断絶して漢中を取ろうと欲したが、将軍は一挙に賊の計を奪い破った、最善の中の最善である」。太祖はついに自ら陽平に至り、漢中の諸軍を引き揚げさせた。再び徐晃を派遣して曹仁を助けて関羽を討たせ、宛に駐屯させた。ちょうど漢水が急激に溢れ、于禁らが水没した。関羽は樊で曹仁を包囲し、また将軍の呂常を襄陽で包囲した。徐晃の率いる兵には新卒が多く、関羽と鋒を争い難かったため、前進して陽陵陂に至って駐屯した。太祖はまた将軍の徐商・呂建らを徐晃のもとへ派遣し、令して「兵馬が集まり至るのを待ってから、ともに前進せよ」と命じた。賊は偃城に駐屯していた。徐晃は到着すると、詭道をもって都塹を作り、その背後を絶つかのように示したため、賊は屯営を焼いて走った。徐晃は偃城を得ると、両面に陣営を連ねて少しずつ前進し、賊の包囲陣から三丈ばかりの距離に迫った。まだ攻めないうちに、太祖は前後して殷署・朱蓋ら凡そ十二営を徐晃のもとへ派遣した。賊は囲頭に屯営があり、また別に四冢にも駐屯していた。徐晃は囲頭の屯を攻めると揚言しつつ、ひそかに四冢を攻めた。関羽は四冢が崩れそうなのを見て、自ら歩兵・騎兵五千を率いて出戦したが、徐晃はこれを撃ち、退却して走るとそのまま追撃して陥れ、ともに包囲網の中へ突入してこれを破り、敵兵はあるいは自ら沔水に身を投げて死んだ。太祖は令して言った。「賊の囲塹・鹿角は十重であったのに、将軍は戦いを挑んで全勝し、ついに賊の包囲を陥れ e:襄陽|襄陽}}を全くせしは、将軍の功なり」と。時に諸軍皆集まり、{{person:曹操|太祖}}、諸営を案行するに、士卒咸く陳を離れて観るも、{{person:徐晃|晃}}の軍営は整斉として、将士、陳に駐まりて動かず。{{person:曹操|太祖}}、嘆じて曰く、「{{person:徐晃|徐将軍}}は{{person:周亜夫|周亜夫}}の風有りと謂ふべし」と。", "translation_tagged": "{{person:曹操|太祖}}は{{place:鄴|鄴}}へ還る際、{{person:徐晃|徐晃}}と{{person:夏侯淵|夏侯淵}}を残して{{place:陽平|陽平}}で{{person:劉備|劉備}}を防がせた。{{person:劉備|劉備}}が{{person:陳式|陳式}}ら十余営を派遣して{{place:馬鳴閣道|馬鳴閣道}}を絶たせたが、{{person:徐晃|徐晃}}は別に征討してこれを破り、賊は自ら山谷に身を投じて死ぬ者が多かった。{{person:曹操|太祖}}は聞いて大いに喜び、{{person:徐晃|徐晃}}に{{special:仮節|仮節}}を与え、令して言った。「この{{place:馬鳴閣道|閣道}}は、{{place:漢中|漢中}}の険要の咽喉である。{{person:劉備|劉備}}は外内を断絶して{{place:漢中|漢中}}を取ろうと欲したが、将軍は一挙に賊の計を奪い破った、最善の中の最善である」。{{person:曹操|太祖}}はついに自ら{{place:陽平|陽平}}に至り、{{place:漢中|漢中}}の諸軍を引き揚げさせた。再び{{person:徐晃|徐晃}}を派遣して{{person:曹仁|曹仁}}を助けて{{person:関羽|関羽}}を討たせ、{{place:宛|宛}}に駐屯させた。ちょうど{{place:漢水|漢水}}が急激に溢れ、{{person:于禁|于禁}}らが水没した。{{person:関羽|関羽}}は{{place:樊|樊}}で{{person:曹仁|曹仁}}を包囲し、また将軍の{{person:呂常|呂常}}を{{place:襄陽|襄陽}}で包囲した。{{person:徐晃|徐晃}}の率いる兵には新卒が多く、{{person:関羽|関羽}}と鋒を争い難かったため、前進して{{place:陽陵陂|陽陵陂}}に至って駐屯した。{{person:曹操|太祖}}はまた将軍の{{person:徐商|徐商}}・{{person:呂建|呂建}}らを{{person:徐晃|徐晃}}のもとへ派遣し、令して「兵馬が集まり至るのを待ってから、ともに前進せよ」と命じた。賊は{{place:偃城|偃城}}に駐屯していた。{{person:徐晃|徐晃}}は到着すると、{{special:詭道|詭道}}をもって{{special:都塹|都塹}}を作り、その背後を絶つかのように示したため、賊は屯営を焼いて走った。{{person:徐晃|徐晃}}は{{place:偃城|偃城}}を得ると、両面に陣営を連ねて少しずつ前進し、賊の包囲陣から三丈ばかりの距離に迫った。まだ攻めないうちに、{{person:曹操|太祖}}は前後して{{person:殷署|殷署}}・{{person:朱蓋|朱蓋}}ら凡そ十二営を{{person:徐晃|徐晃}}のもとへ派遣した。{{special:賊囲頭有屯|賊は囲頭に屯営があり}}、{{special:又別屯四冢|また別に四冢にも駐屯していた}}。{{person:徐晃|徐晃}}は{{special:囲頭屯|囲頭の屯}}を攻めると揚言しつつ、ひそかに{{place:四冢|四冢}}を攻めた。{{person:関羽|関羽}}は{{place:四冢|四冢}}が崩れそうなのを見て、自ら歩兵・騎兵五千を率いて出戦したが、{{person:徐晃|徐晃}}はこれを撃ち、退却して走るとそのまま追撃して陥れ、ともに包囲網の中へ突入してこれを破り、敵兵はあるいは自ら{{place:漢水|沔水}}に身を投げて死んだ。{{person:曹操|太祖}}は令して言った。「賊の{{special:囲塹|囲塹}}・{{special:鹿角|鹿角}}は十重であったのに、将軍は戦いを挑んで全勝し、ついに賊の包囲を陥れ、多くの首虜を斬った。私が兵を用いること三十余年、また聞くところの古の善く兵を用いた者であっても、長駆して直接敵の包囲網に入った者はいまだかつていなかった。しかも{{place:樊|樊}}・{{place:襄陽|襄陽}}が包囲にあった危機は{{special:過於莒即墨|莒・即墨に過ぎ}}、将軍の功績は{{person:孫武|孫武}}・{{person:司馬穰苴|司馬穰苴}}をも超えるものである」。{{person:徐晃|徐晃}}が軍を整えて{{place:摩陂|摩陂}}へ還ると、{{person:曹操|太祖}}は{{person:徐晃|徐晃}}を七里先まで出迎えて酒宴を設け大会した。{{person:曹操|太祖}}は杯の酒を挙げて{{person:徐晃|徐晃}}に勧め、またこれをねぎらって言った。「{{place:樊|樊}}・{{place:襄陽|襄陽}}を全うしたのは、将軍の功績である」。時に諸軍がみな集まっており、{{person:曹操|太祖}}が諸営を巡視すると、兵士たちはみな陣列を離れて見物したが、{{person:徐晃|徐晃}}の軍営だけは整然として、将士は陣に留まって動かなかった。{{person:曹操|太祖}}は嘆じて言った。「{{person:徐晃|徐将軍}}は{{person:周亜夫|周亜夫}}の風があると言うべきである」。"}, {"id": "v17_p18_1", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（徐晃）", "para_index": 18, "type": "本文", "raw_text": "文帝即王位，以晃爲右將軍，進封逯鄕侯。及踐阼，進封楊侯。與夏侯尙討劉備於上庸，破之。以晃鎮陽平，徙封陽平侯。明帝即位，拒吳將諸葛瑾於襄陽。增邑二百，並前三千一百戸。病篤，遺令斂以時服。", "kakikudashi": "文帝、王位に即くや、晃を以て右将軍と為し、逯郷侯に進封す。践阼するに及び、楊侯に進封す。夏侯尚と劉備を上庸に討ちて、之を破る。晃を以て陽平を鎮せしめ、陽平侯に徙封す。明帝、位に即くや、呉の将諸葛瑾を襄陽に拒ぐ。邑二百を増し、前と並せて三千一百戸とす。病篤く、遺令して時服を以て斂めしむ。", "translation": "文帝（曹丕）が王位に即くと、徐晃を右将軍に任じ、逯郷侯に進封した。皇帝に即位するに及び、楊侯に進封した。夏侯尚とともに上庸で劉備を討ってこれを破った。徐晃に陽平を鎮守させ、陽平侯に徙封した。明帝（曹叡）が即位すると、襄陽で呉の将・諸葛瑾を防いだ。食邑二百戸を増やされ、以前と合わせて三千一百戸となった。病が重くなると、遺令して普段着のままで納棺させた。", "persons": "曹丕,徐晃,夏侯尚,劉備,曹叡,諸葛瑾", "places": "楊,上庸,陽平,襄陽,呉", "era_year": "黄初元年〜太和元年（220年〜227年）", "source_book": "", "keywords": "右将軍,列侯", "raw_tagged": "{{person:曹丕|文帝}}即王位，以{{person:徐晃|晃}}爲{{office:前将軍|右將軍}}，進封{{office:列侯|逯鄕侯}}。及踐阼，進封{{place:楊|楊}}{{office:列侯|侯}}。與{{person:夏侯尚|夏侯尙}}討{{person:劉備|劉備}}於{{place:上庸|上庸}}，破之。以{{person:徐晃|晃}}鎮{{place:陽平|陽平}}，徙封{{place:陽平郡|陽平}}{{office:列侯|侯}}。{{person:曹叡|明帝}}即位，拒{{place:呉|吳}}將{{person:諸葛瑾|諸葛瑾}}於{{place:襄陽|襄陽}}。增邑二百，並前三千一百戸。病篤，遺令斂以時服。", "kakikudashi_tagged": "{{person:曹丕|文帝}}、王位に即くや、{{person:徐晃|晃}}を以て{{office:前将軍|右将軍}}と為し、{{office:列侯|逯郷侯}}に進封す。践阼するに及び、{{place:楊|楊}}{{office:列侯|侯}}に進封す。{{person:夏侯尚|夏侯尚}}と{{person:劉備|劉備}}を{{place:上庸|上庸}}に討ちて、之を破る。{{person:徐晃|晃}}を以て{{place:陽平|陽平}}を鎮せしめ、{{place:陽平郡|陽平}}{{office:列侯|侯}}に徙封す。{{person:曹叡|明帝}}、位に即くや、{{place:呉|呉}}の将{{person:諸葛瑾|諸葛瑾}}を{{place:襄陽|襄陽}}に拒ぐ。邑二百を増し、前と並せて三千一百戸とす。病篤く、遺令して時服を以て斂めしむ。", "translation_tagged": "{{person:曹丕|文帝}}（{{person:曹丕|曹丕}}）が王位に即くと、{{person:徐晃|徐晃}}を{{office:前将軍|右将軍}}に任じ、{{office:列侯|逯郷侯}}に進封した。皇帝に即位するに及び、{{place:楊|楊}}{{office:列侯|侯}}に進封した。{{person:夏侯尚|夏侯尚}}とともに{{place:上庸|上庸}}で{{person:劉備|劉備}}を討ってこれを破った。{{person:徐晃|徐晃}}に{{place:陽平|陽平}}を鎮守させ、{{place:陽平郡|陽平}}{{office:列侯|侯}}に徙封した。{{person:曹叡|明帝}}（{{person:曹叡|曹叡}}）が即位すると、{{place:襄陽|襄陽}}で{{place:呉|呉}}の将・{{person:諸葛瑾|諸葛瑾}}を防いだ。食邑二百戸を増やされ、以前と合わせて三千一百戸となった。病が重くなると、遺令して普段着のままで納棺させた。"}, {"id": "v17_p19_1", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（徐晃）", "para_index": 19, "type": "本文", "raw_text": "性儉約畏愼，將軍常遠斥候，先爲不可勝，然後戰，追奔爭利，士不暇食。常嘆曰：「古人患不遭明君，今幸遇之，常以功自效，何用私譽爲！」終不廣交援。太和元年薨，諡曰壯侯。子蓋嗣。蓋薨，子霸嗣。明帝分晃戸，封晃子孫二人列侯。", "kakikudashi": "性、倹約畏慎にして、将軍として常に斥候を遠くし、先づ勝つべからざるを為して、然る後に戦ひ、奔るを追ひ利を争ふに、士、食するに暇あらず。常に嘆じて曰く、「古人は明君に遭はざるを患ふ、今幸ひに之に遇ふ、常に功を以て自ら効さん、何ぞ私誉を用て為さん！」と。終に交援を広くせず。太和元年薨じ、諡して壮侯と曰ふ。子の蓋、嗣ぐ。蓋薨じ、子の覇、嗣ぐ。明帝、晃の戸を分かち、晃の子孫二人を列侯に封ず。", "translation": "生まれつき倹約で慎み深く、将軍として常に斥候を遠くまで出し、まず敗れない態勢を作ってから戦いに臨み、敗走する敵を追って利を争う際には、兵士は食事をとる暇もなかった。常に嘆じて「古人は明君に巡り会えないことを患えたが、いま幸いにも巡り会うことができた。常に功績をもって自ら忠節を尽くすべきであり、どうして私的な名誉など必要としようか！」と言い、生涯にわたって交際を広げようとしなかった。太和元年に死去し、「壮侯」と諡された。子の徐蓋が後を継いだ。徐蓋が死去すると、子の徐覇が後を継いだ。明帝は徐晃の食邑を分け、徐晃の子孫二人を列侯に封じた。", "persons": "徐晃,徐蓋,徐覇,曹叡", "places": "", "era_year": "太和元年（227年）", "source_book": "", "keywords": "太和,列侯", "raw_tagged": "性儉約畏愼，將軍常遠斥候，先爲不可勝，然後戰，追奔爭利，士不暇食。常嘆曰：「古人患不遭明君，今幸遇之，常以功自效，何用私譽爲！」終不廣交援。{{special:太和|太和元年}}薨，諡曰{{special:壮侯|壯侯}}。子{{person:徐蓋|蓋}}嗣。{{person:徐蓋|蓋}}薨，子{{person:徐覇|霸}}嗣。{{person:曹叡|明帝}}分{{person:徐晃|晃}}戸，封{{person:徐晃|晃}}子孫二人{{office:列侯|列侯}}。", "kakikudashi_tagged": "性、倹約畏慎にして、将軍として常に斥候を遠くし、先づ勝つべからざるを為して、然る後に戦ひ、奔るを追ひ利を争ふに、士、食するに暇あらず。常に嘆じて曰く、「古人は明君に遭はざるを患ふ、今幸ひに之に遇ふ、常に功を以て自ら効さん、何ぞ私誉を用て為さん！」と。終に交援を広くせず。{{special:太和|太和元年}}薨じ、諡して{{special:壮侯|壮侯}}と曰ふ。子の{{person:徐蓋|蓋}}、嗣ぐ。{{person:徐蓋|蓋}}薨じ、子の{{person:徐覇|覇}}、嗣ぐ。{{person:曹叡|明帝}}、{{person:徐晃|晃}}の戸を分かち、{{person:徐晃|晃}}の子孫二人を{{office:列侯|列侯}}に封ず。", "translation_tagged": "生まれつき倹約で慎み深く、将軍として常に斥候を遠くまで出し、まず敗れない態勢を作ってから戦いに臨み、敗走する敵を追って利を争う際には、兵士は食事をとる暇もなかった。常に嘆じて「古人は明君に巡り会えないことを患えたが、いま幸いにも巡り会うことができた。常に功績をもって自ら忠節を尽くすべきであり、どうして私的な名誉など必要としようか！」と言い、生涯にわたって交際を広げようとしなかった。{{special:太和|太和元年}}に死去し、「{{special:壮侯|壮侯}}」と諡された。子の{{person:徐蓋|徐蓋}}が後を継いだ。{{person:徐蓋|徐蓋}}が死去すると、子の{{person:徐覇|徐覇}}が後を継いだ。{{person:曹叡|明帝}}は{{person:徐晃|徐晃}}の食邑を分け、{{person:徐晃|徐晃}}の子孫二人を{{office:列侯|列侯}}に封じた。"}, {"id": "v17_p20_1", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（朱靈）", "para_index": 20, "type": "本文", "raw_text": "初，清河朱靈爲袁紹將。太祖之征陶謙，紹使靈督三營助太祖，戰有功。紹所遣諸將各罷歸，靈曰：「靈觀人多矣，無若曹公者，此乃眞明主也。今已遇，復何之？」遂留不去。所將士卒慕之，皆隨靈留。靈後遂爲好將，名亞晃等，至後將軍，封高唐（亭）侯。", "kakikudashi": "初め、清河の朱霊、袁紹の将と為る。太祖の陶謙を征するや、紹、霊をして三営を督して太祖を助けしめ、戦ひて功有り。紹の遣はす所の諸将、各おの罷め帰るに、霊曰く、「霊、人を観ること多きも、曹公の若き者無し、此れ乃ち真の明主なり。今已に遇ふ、復た何くにか之かん？」と。遂に留まりて去らず。将ゐる所の士卒、之を慕ひ、皆霊に随ひて留まる。霊、後に遂に好将と為り、名は晃等に亜ぎ、後将軍に至り、高唐亭侯に封ぜらる。", "translation": "かつて、清河の朱霊は袁紹の将であった。太祖（曹操）が陶謙を征討した際、袁紹は朱霊に三営を統督させて太祖を助けさせ、戦って功績があった。袁紹が派遣した諸将がそれぞれ帰還する際、朱霊は言った。「私は多くの人物を見てきたが、曹公のようなお方はいない、このお方こそ真の明主である。いま既に巡り会えたのに、再びどこへ行くというのか」。かくてそのまま留まって去らなかった。率いていた兵士たちも彼を慕い、みな朱霊に従って留まった。朱霊はその後ついに好将となり、名声は徐晃らに次ぎ、後将軍に至り、高唐亭侯に封じられた。", "persons": "朱霊,袁紹,曹操,陶謙,徐晃", "places": "清河,高唐", "era_year": "初平4年〜太和年間（193年〜230年頃）", "source_book": "", "keywords": "後将軍,亭侯", "raw_tagged": "初，{{place:清河|清河}}{{person:朱霊|朱靈}}爲{{person:袁紹|袁紹}}將。{{person:曹操|太祖}}之征{{person:陶謙|陶謙}}，{{person:袁紹|紹}}使{{person:朱霊|靈}}督{{special:三営|三營}}助{{person:曹操|太祖}}，戰有功。{{person:袁紹|紹}}所遣諸將各罷歸，{{person:朱霊|靈}}曰：「{{person:朱霊|靈}}觀人多矣，無若{{person:曹操|曹公}}者，此乃眞明主也。今已遇，復何之？」遂留不去。所將士卒慕之，皆隨{{person:朱霊|靈}}留。{{person:朱霊|靈}}後遂爲好將，名亞{{person:徐晃|晃}}等，至{{office:前将軍|後將軍}}，封{{place:高唐|高唐}}{{office:列侯|（亭）侯}}。", "kakikudashi_tagged": "初め、{{place:清河|清河}}の{{person:朱霊|朱霊}}、{{person:袁紹|袁紹}}の将と為る。{{person:曹操|太祖}}の{{person:陶謙|陶謙}}を征するや、{{person:袁紹|紹}}、{{person:朱霊|霊}}をして{{special:三営|三営}}を督して{{person:曹操|太祖}}を助けしめ、戦ひて功有り。{{person:袁紹|紹}}の遣はす所の諸将、各おの罷め帰るに、{{person:朱霊|霊}}曰く、「{{person:朱霊|霊}}、人を観ること多きも、{{person:曹操|曹公}}の若き者無し、此れ乃ち真の明主なり。今已に遇ふ、復た何くにか之かん？」と。遂に留まりて去らず。将ゐる所の士卒、之を慕ひ、皆{{person:朱霊|霊}}に随ひて留まる。{{person:朱霊|霊}}、後に遂に好将と為り、名は{{person:徐晃|晃}}等に亜ぎ、{{office:前将軍|後将軍}}に至り、{{place:高唐|高唐}}{{office:列侯|亭侯}}に封ぜらる。", "translation_tagged": "かつて、{{place:清河|清河}}の{{person:朱霊|朱霊}}は{{person:袁紹|袁紹}}の将であった。{{person:曹操|太祖}}（{{person:曹操|曹操}}）が{{person:陶謙|陶謙}}を征討した際、{{person:袁紹|袁紹}}は{{person:朱霊|朱霊}}に{{special:三営|三営}}を統督させて{{person:曹操|太祖}}を助けさせ、戦って功績があった。{{person:袁紹|袁紹}}が派遣した諸将がそれぞれ帰還する際、{{person:朱霊|朱霊}}は言った。「私は多くの人物を見てきたが、{{person:曹操|曹公}}のようなお方はいない、このお方こそ真の明主である。いま既に巡り会えたのに、再びどこへ行くというのか」。かくてそのまま留まって去らなかった。率いていた兵士たちも彼を慕い、みな{{person:朱霊|朱霊}}に従って留まった。{{person:朱霊|朱霊}}はその後ついに好将となり、名声は{{person:徐晃|徐晃}}らに次ぎ、{{office:前将軍|後将軍}}に至り、{{place:高唐|高唐}}{{office:列侯|亭侯}}に封じられた。"}, {"id": "v17_p20_2", "volume": 17, "book": "魏書", "section_title": "張樂于張徐傳（朱靈）", "para_index": 20, "type": "裴注", "raw_text": "《九州春秋》曰：「初，清河季雍以鄃叛袁紹而降公孫瓚，瓚遣兵衞之。紹遣靈攻之。靈家在城中，瓚將靈母弟置城上，誘呼靈。靈望城涕泣曰：『丈夫一出身與人，豈復顧家耶！』遂力戰拔之，生擒雍而靈家皆死。」《魏書》曰：「靈字文博。太祖旣平冀州，遣靈將新兵五千人騎千匹守許南。太祖戒之曰：『冀州新兵，數承寛緩，暫見齊整，意尙怏怏。卿名先有威嚴，善以道寛之，不然即有變。』靈至陽翟，中郎將程昂等果反，即斬昂，以狀聞。太祖手書曰：『兵中所以爲危險者，外對敵國，內有姦謀不測之變。昔鄧禹中分光武軍西行，而有宗歆、馮愔之難，後將二十四騎還洛陽，禹豈以是減損哉？來書懇惻，多引咎過，未必如所云也。』文帝即位，封靈鄃侯，增其戸邑。詔曰：『將軍佐命先帝，典兵歷年，威過方邵，功逾絳灌。圖籍所美，何以加焉？朕受天命，帝有海內，元功之將，社稷之臣，皆朕所與同福共慶，傳之無窮者也。今封隃侯。富貴不歸故鄕，如夜行衣繡。若平常所志，原勿難言。』靈謝曰：『高唐，宿所原。』於是更封高唐侯，薨，諡曰威侯。」", "kakikudashi": "『九州春秋』に曰く、「初め、清河の季雍、鄃を以て袁紹に叛きて公孫瓚に降り、瓚、兵を遣はして之を衛らしむ。紹、霊を遣はして之を攻めしむ。霊の家、城中に在り、瓚、霊の母・弟を将ゐて城上に置き、霊を誘ひ呼ばしむ。霊、城を望みて涕泣して曰く、『丈夫、一たび身を出だして人に与す、豈に復た家を顧みんや！』と。遂に力戦して之を抜き、雍を生擒にするも、霊の家皆死す」と。『魏書』に曰く、「霊、字は文博。太祖、既に冀州を平らぐるや、霊を遣はして新兵五千人・騎千匹を将ゐて許の南を守らしむ。太祖、之を戒めて曰く、『冀州の新兵は、しばしば寛緩を承け、暫く斉整を見れば、意尚ほ怏怏たり。卿の名は先に威厳有り、善く道を以て之を寛くせよ、然らずんば即ち変有らん』と。霊、陽翟に至るや、中郎将程昂等、果たして反し、即ち昂を斬り、状を以て聞す。太祖、手書して曰く、『兵中の危険と為す所以の者は、外は敵国に対し、内は姦謀不測の変有ればなり。昔、鄧禹は光武の軍を中分して西行し、宗歆・馮愔の難有り、後に二十四騎を将ゐて洛陽に還るも、禹、豈に是を以て減損せんや？来書懇惻にして、多く咎過を引くも、未だ必ずしも云ふ所の如くならざるなり』と。文帝、位に即くや、霊を鄃侯に封じ、其の戸邑を増す。詔して曰く、『将軍は先帝を佐命し、兵を典ること歴年、威は方・邵に過ぎ、功は絳・灌に逾ゆ。図籍の美とする所、何を以てか焉に加へん？朕、天命を受け、海内を帝有す、元功の将、社稷の臣は、皆朕の与に福を同じくし慶を共にし、之を無窮に伝ふる所なり。今、鄃侯に封ず。富貴にして故郷に帰らざるは、夜行きて繍を衣るが如し。若し平常の志す所あらば、願はくは言ふを難かる勿かれ』と。霊、謝して曰く、『高唐は、宿より願ふ所なり』と。是に於て更めて高唐侯に封ぜられ、薨じ、諡して威侯と曰ふ」と。", "translation": "『九州春秋』にいう。かつて清河の季雍が鄃をもって袁紹に背いて公孫瓚に降伏し、公孫瓚は兵を派遣してこれを守らせた。袁紹は朱霊を派遣してこれを攻めさせた。朱霊の家族は城中にあり、公孫瓚は朱霊の母と弟を城壁の上に置いて、朱霊を誘い呼ばせた。朱霊は城を望んで涙を流して言った。「男子たる者、ひとたび身を捧げて人に仕えたからには、どうして再び家を顧みようか h_terms": ["雅歌投壺", "投壺"]}, "傅子": {"title": "『傅子』（ふし）", "category": "特別キーワード（裴注引用史料）", "wiki_title": "傅玄", "mapping_note": "『傅子』の著者である西晋の「傅玄」のWikipedia記事と紐づけています。", "ai_desc": "西晋の学者・政治家である傅玄（ふげん）が著した思想・歴史評論書。", "match_terms": ["傅子"]}, "魏書": {"title": "『魏書』（王沈撰・曹魏の国史）", "category": "特別キーワード（裴注引用史料）", "wiki_title": "魏書 (三国)", "mapping_note": "北魏の『魏書』と区別するため、王沈らが編纂した曹魏の国史「魏書 (三国)」と紐づけています。", "ai_desc": "魏末〜西晋の王沈らが編纂した曹魏の公式国史。", "match_terms": ["魏書"]}, "魏略": {"title": "『魏略』（ぎりゃく）", "category": "特別キーワード（裴注引用史料）", "wiki_title": "魏略", "mapping_note": "", "ai_desc": "三国魏の魚豢（ぎょかん）が個人で執筆した曹魏の歴史書。", "match_terms": ["魏略"]}, "漢晉春秋": {"title": "『漢晋春秋』（かんしんしゅんじゅう）", "category": "特別キーワード（裴注引用史料）", "wiki_title": "漢晋春秋", "mapping_note": "", "ai_desc": "東晋の習鑿歯（しゅうさくし）が著した、後漢から西晋までの通史。", "match_terms": ["漢晉春秋", "漢晋春秋"]}, "九州春秋": {"title": "『九州春秋』（きゅうしゅうしゅんじゅう）", "category": "特別キーワード（裴注引用史料）", "wiki_title": "司馬彪", "mapping_note": "『九州春秋』の著者である西晋の「司馬彪」のWikipedia記事と紐づけています。", "ai_desc": "西晋の司馬彪が著した、後漢末の九州（全国）の動乱と群雄の興亡を記した史書。", "match_terms": ["九州春秋"]}, "乱": {"title": "亂・乱（らん／驚乱・動乱）", "category": "特別キーワード（漢字・軍事用語）", "wiki_title": "", "mapping_note": "", "ai_desc": "「亂」は「乱」の旧字体（本来の正字）。上下の両手でもつれた糸を解き治める象形からなり、秩序が乱れること・騒乱を意味する。特に古代の軍陣における「驚乱（きょうらん）」は、夜間に陣中で原因不明のパニックや流言が連鎖し、味方同士で暴走・混乱に陥る危険な現象（夜驚）を指す。", "match_terms": ["亂", "乱"], "target_records": ["v17_p2_1"]}, "中陳": {"title": "中陳（ちゅうじん）", "category": "特別キーワード（漢文・軍事用語）", "wiki_title": "", "mapping_note": "", "ai_desc": "陣営の中央（中陣）のこと。古典漢文において「陳」は「陣」の本字（本来の古い漢字）であり、「陳列」と同様に軍隊や隊列を並べること（軍陣）を意味する。", "match_terms": ["中陳", "陣の中央"]}, "辺": {"title": "辺・邊（へん／函の辺：書箱の端・ふち）", "category": "特別キーワード（漢文語彙・文書制度）", "wiki_title": "", "mapping_note": "", "ai_desc": "物の端（はし）・ふち・外側。「函邊（函の辺）」とは、命令書（教）を納めた木箱（書函）の蓋の端や封じ目の脇を指し、開封すべき条件（「賊至乃發＝賊が来襲したら開けよ」）を外から見えるように書き添えたもの。", "match_terms": ["箱の端", "邊", "辺"], "target_records": ["v17_p3_1"]}, "陳_陣": {"title": "陳（じん／敵陣・軍陣）", "category": "特別キーワード（漢文・軍事用語）", "wiki_title": "", "mapping_note": "", "ai_desc": "古典漢文において「陳」は「陣」の本字（ 漢文語彙）", "wiki_title": "", "mapping_note": "", "ai_desc": "「驍（ぎょう）」は強健な良馬、転じて武勇・敏捷さに優れること、「果（か）」は思い切りがよく果敢・決断力があること（果敢・剛果）。楽進が小柄ながら胆力・勇猛さに優れ、常に戦場で先登（一番乗り）を果たして武名を馳せたことを指す（『三國志』巻17・楽進伝「容貌短小，以胆烈従太祖」および評）。", "match_terms": ["驍果"], "target_records": ["v17_p21_1"]}, "剛侯": {"title": "剛侯（ごうこう：張遼の諡号）", "category": "特別キーワード（諡号・礼制）", "wiki_title": "", "mapping_note": "", "ai_desc": "張遼に贈られた諡（おくりな）。『逸周書』諡法解に「強毅果敢曰剛（強毅果敢なるを剛と曰ふ）」「追補前過曰剛（前の過ちを追補するを剛と曰ふ）」とある。", "match_terms": ["剛侯"], "target_records": ["v17_p4_3"]}};
  const PERSONS_INFO = {"眭固": {"wiki_title": "スイ固", "ai_desc": "眭固（すいこ）：字は白兎。後漢末の黒山賊出身の武将で、張楊に属した。建安4年（199年）、張楊が部下の楊醜に殺害されると楊醜を討ち、袁紹への帰属を図って河内郡射犬に屯したが、同年夏4月に史渙・曹仁・楽進・于禁・徐晃らの攻撃を受け、犬城にて斬られた（『三國志』巻1・武帝紀、巻8・張楊伝、巻17・楽進伝・于禁伝・徐晃伝）。"}, "献帝": {"wiki_title": "献帝 (漢)", "ai_desc": "献帝（けんてい）：後漢の第14代（最後）の皇帝・劉協（りゅうきょう、在位189年〜220年）。霊帝の皇子。董卓に擁立され、長安への遷都や李傕・郭汜の乱を経て、建安元年（196年）に洛陽へ帰還し曹操に迎えられて許（許昌）へ遷都した。延康元年（220年）、魏王・曹丕（文帝）に禅譲して山陽公に封じられた（『後漢書』巻9・孝献帝紀）。"}, "司馬穰苴": {"wiki_title": "司馬穣苴", "ai_desc": "司馬穰苴（しばじょうしょ）：春秋時代の斉の将軍・兵法家。もとの姓は田氏（田穰苴）。斉の景公に抜擢されて軍を率い、晋・燕の軍を撃退した功により大司馬に任じられたため「司馬穰苴」と称される。兵法書『司馬法』にその兵学が伝えられ、孫武と並び称された（『史記』巻64・司馬穰苴列伝）。"}, "昌豨": {"wiki_title": "昌キ", "ai_desc": "昌豨（しょうき）：後漢末、徐州東海郡一帯で勢力を張った泰山賊出身の武将（もとは名を昌覇とも記される）。たびたび曹操に叛服を繰り返したが、三公山・東海で張遼の単身の説得により一度降伏し、のちに再び叛いて建安11年（206年）に旧友の于禁に攻囲されて降伏した際、軍法を重んじた于禁によって涙ながらに処刑された（『三國志』巻1・武帝紀、巻17・張遼伝・于禁伝）。"}, "聶壹": {"wiki_title": "", "ai_desc": "聶壹（じょういつ）：前漢の武帝時代の雁門郡馬邑の豪商。元光2年（前133年）、大行令・王恢の策により匈奴の軍臣単于を馬邑城におびき寄せて伏兵で討つ「馬邑の謀」を実行した人物（『史記』巻108・韓長孺列伝、巻110・匈奴列伝、『漢書』巻52・韓安国伝）。その子孫である張遼の一族は匈奴の報復を避けるため、「聶」から「張」へ姓を改めた（『三國志』巻17・張遼伝）。"}, "趙庶": {"wiki_title": "", "ai_desc": "趙庶（ちょうしょ）：後漢末、呂布配下の将。建安3年（198年）の呂布征討戦において、李鄒らとともに裨将軍・徐晃の別動隊に降伏した（『三國志』巻17・徐晃伝）。"}, "李鄒": {"wiki_title": "", "ai_desc": "李鄒（りすう）：後漢末、呂布配下の将。建安3年（198年）の呂布征討戦において、趙庶らとともに徐晃の説得・攻撃を受けて降伏した（『三國志』巻17・徐晃伝）。"}, "五子": {"wiki_title": "", "ai_desc": "五子（ごし）：本巻（『三國志』巻17・張楽于張徐伝）に列伝が立てられた曹魏の五人の将軍、張遼・楽進・于禁・張郃・徐晃の総称（「子」は男子・人物に対する敬称）。陳寿が本評で「時の良将、五子を先と為す（時之良将，五子為先）」と総括したことが、後世の「五子良将（ごしりょうしょう）」の呼称の由来となった。"}, "徐蓋": {"wiki_title": "", "ai_desc": "徐蓋（じょがい）：徐晃の世子。太和元年（227年）に父・徐晃が死去した後、陽平侯の爵位を継承した（『三國志』巻17・徐晃伝）。"}, "徐覇": {"wiki_title": "", "ai_desc": "徐覇（じょは）：徐晃の孫であり、徐蓋の子。父・徐蓋の死後に爵位を継承した（『三國志』巻17・徐晃伝）。"}, "季雍": {"wiki_title": "", "ai_desc": "季雍（きよう）：後漢末、冀州清河国の武将。もとは袁紹に属していたが、鄃（ゆ）城ごと袁紹に背いて公孫瓚に降伏した。袁紹の命で鄃城を攻めた朱霊（季雍らは城内にいた朱霊の母・弟を城壁上に置いて人質とした）の力戦によって城は陥落し、季雍は生け捕りにされた（『三國志』巻17・徐晃伝注引『九州春秋』）。"}, "程昂": {"wiki_title": "", "ai_desc": "程昂（ていこう）：後漢末の中郎将。曹操が冀州を平定した後に朱霊の指揮下で許の南（陽翟）へ派遣された冀州の新兵五千・騎兵千匹の中にいたが、曹操が予見した通り陽翟に到着すると反乱を起こし、ただちに朱霊に斬られた（『三國志』巻17・徐晃伝注引『魏書』）。"}, "宗歆": {"wiki_title": "", "ai_desc": "宗歆（そうきん）：後漢初期、大司徒・鄧禹（とうう）が光武帝（劉秀）から軍の半分（二万人）を預かって関中へ西征した際に従軍した部将。鄧禹により車騎将軍に任じられたが、馮愔（ふういん）と権力を巡って争い、馮愔に殺害された（『後漢書』巻16・鄧禹伝、『三國志』巻17・徐晃伝注引『魏書』）。"}, "馮愔": {"wiki_title": "", "ai_desc": "馮愔（ふういん）：後漢初期、大司徒・鄧禹の関中西征に従軍した部将。鄧禹により積弩将軍に任じられたが、同僚の車騎将軍・宗歆と争って宗歆を殺害し、そのまま鄧禹に背いて反乱を起こした（『後漢書』巻16・鄧禹伝、『三國志』巻17・徐晃伝注引『魏書』）。"}, "方叔": {"wiki_title": "", "ai_desc": "方叔（ほうしゅく）：周王朝中興の祖・宣王（前827年〜前782年在位）に仕えた卿士・名将。兵車三千乗を率いて南方の荊蛮（楚）を征討し大功を挙げた（『詩経』小雅・采芑「方叔涖止，其車三千」）。同時代の召虎（邵虎）と並べて「方・邵（方召）」と称され、王朝を支える名将の代名詞とされる。"}, "召虎": {"wiki_title": "", "ai_desc": "召虎（しょうこ）：周の宣王に仕えた大臣・名将である召穆公（しょうぼくこう、名は虎）。淮夷を平定して周王室の威信を回復した（『詩経』大雅・江漢「江漢浮浮，武夫滔滔…王命召虎，来旬来宣」、『史記』巻4・周本紀）。原文の「威過方邵」の「邵」は「召」の同音通用字であり、地名ではなく「方叔・召虎」の並称である。"}, "呂建": {"wiki_title": "", "ai_desc": "呂建（りょけん）：後漢末、曹操配下の将軍。建安24年（219年）の樊城救援戦において、陽陵陂に布陣していた徐晃のもとへ徐商らとともに増援として派遣された（『三國志』巻17・徐晃伝）。"}, "徐商": {"wiki_title": "", "ai_desc": "徐商（じょしょう）：後漢末、曹操配下の将軍。建安24年（219年）の関羽による樊城包囲の際、曹操から呂建らとともに徐晃への増援第一陣として派遣された（『三國志』巻17・徐晃伝）。"}, "殷署": {"wiki_title": "", "ai_desc": "殷署（いんしょ）：後漢末〜三国魏の武将。建安24年（219年）の樊城救援戦において、偃城を占拠して関羽の包囲陣に迫った徐晃のもとへ朱蓋らとともに計十二営の増援部隊を率いて合流した（『三國志』巻17・徐晃伝）。のち黄初年間には平南将軍・荊州刺史などを務めたことが史料にみえる（『三國志』巻2・文帝紀注）。"}, "朱蓋": {"wiki_title": "", "ai_desc": "朱蓋（しゅがい）：後漢末〜三国魏の武将。建安24年（219年）の樊城救援戦において、曹操から殷署らとともに前後十二営の増援部隊として徐晃のもとへ派遣され、関羽軍の包囲網撃破に従軍した（『三國志』巻17・徐晃伝）。"}, "呂常": {"wiki_title": "", "ai_desc": "呂常（りょじょう）：後漢末〜三国魏の将軍。建安24年（219年）、樊城の曹仁とともに襄陽城を守備し、関羽軍の包囲に耐え抜いた（『三國志』巻17・徐晃伝）。のち魏の横海将軍・関内侯として文帝（曹丕）への禅譲勧進の上表にも名を連ねている（『三國志』巻2・文帝紀注引『献帝伝』）。"}, "祝臂": {"wiki_title": "", "ai_desc": "祝臂（しゅくひ）：後漢末、豫州汝南郡㶏強県（現在の河南省漯河市臨潁県）一帯で活動した武装勢力（賊）の首領。建安5年（200年）の官渡の戦いの時期、曹洪および偏将軍・徐晃の攻撃を受けて撃破された（『三國志』巻9・曹洪伝、巻17・徐晃伝）。"}, "韓範": {"wiki_title": "", "ai_desc": "韓範（かんはん）：後漢末、冀州魏郡易陽県（現在の河北省邯鄲市永年区東南）の県令。建安9年（204年）春、曹操が鄴を包囲し邯鄲を破った際、いったん偽って降伏を申し出ながら城を固守して抵抗したが、攻囲した徐晃が城中に矢文を射込んで成敗の道理を説いたため非を悔いて降伏し、徐晃の進言により処刑されず受け入れられた（『三國志』巻1・武帝紀、巻17・徐晃伝）。"}, "商曜": {"wiki_title": "", "ai_desc": "商曜（しょうよう）：後漢末、并州太原郡大陵県（現在の山西省呂梁市文水県東北）に拠って反乱を起こした勢力の首領（賊帥）。建安16年（211年）正月、夏侯淵・徐晃・張既らに大陵城を包囲・攻略されて斬られた（『三國志』巻1・武帝紀、巻9・夏侯淵伝、巻15・張既伝、巻17・徐晃伝）。"}, "張順": {"wiki_title": "", "ai_desc": "張順（ちょうじゅん）：後漢末、曹操配下の将軍。建安20年（215年）の張魯征討・氐族平定の戦役において敵勢力に包囲されていたところを、平寇将軍に昇進した徐晃によって包囲を解かれ救援された（『三國志』巻17・徐晃伝）。"}, "陳福": {"wiki_title": "", "ai_desc": "陳福（ちんふく）：後漢末、漢中・隴右方面で三十余屯の陣営を構えていた武装勢力（賊）の首領。建安20年（215年）頃、将軍・張順の包囲を解いた徐晃の攻撃を受け、三十余屯すべてを撃破された（『三國志』巻17・徐晃伝）。"}, "張雄": {"wiki_title": "", "ai_desc": "張雄（ちょうゆう）：張郃の世子。太和5年（231年）に父・張郃が木門の戦いで戦死した後、鄚侯の爵位を継承した（『三國志』巻17・張郃伝）。"}, "卑湛": {"wiki_title": "", "ai_desc": "卑湛（ひたん）：冀州河間郡鄚県（張郃と同郷）出身の儒学者。経書に明るく品行が修まっている（経明行修）として張郃から朝廷に推挙され、明帝（曹叡）の詔によって博士（五経博士）に抜擢された（『三國志』巻17・張郃伝）。"}, "劉阿": {"wiki_title": "", "ai_desc": "劉阿（りゅうあ）：三国呉の武将。黄初7年（226年）から太和元年（227年）にかけて、孫権の命により荊州の襄陽・江陵方面へ進出したが、司馬懿（宣王）および張郃に撃破され、祁口まで追撃されて敗走した（『三國志』巻17・張郃伝、『晋書』巻1・宣帝紀）。"}, "伍子胥": {"wiki_title": "伍子胥", "ai_desc": "伍子胥（ごししょ）：春秋時代の呉の政治家・将軍。名は員（うん）、字は子胥。父兄を殺した楚の平王に復讐するため呉王闔廬に仕えて楚都・郢を陥落させたが、のち呉王夫差の代に越の勾践への警戒を説いて疎まれ、太宰嚭の讒言により属鏤の剣を賜って自害した（『春秋左氏伝』哀公十一年、『史記』巻66・伍子胥列伝）。"}, "微子": {"wiki_title": "微子啓", "ai_desc": "微子（びし）：殷王朝末期の王族・微子啓（びしけい）。帝乙の長子で、最後の王・帝辛（紂王）の庶兄。暴虐を極める紂王をたびたび諫めたが聴き入れられず、太師・少師と謀って殷の祭祀を絶やさぬために殷を去り、のち周が殷を滅ぼすと宋に封じられて殷の祭祀を継いだ（『書経』微子、『論語』微子篇「微子去之，箕子為之奴，比干諫而死」、『史記』巻38・宋微子世家）。"}, "管承": {"wiki_title": "", "ai_desc": "管承（かんしょう）：後漢末、青州北海国淳于から東莱郡沿岸にかけて活動した海賊の首領。三千余家の部衆を擁していたが、建安11年（206年）秋8月、曹操の親征および楽進・李典・張郃らの攻撃を受けて海島へ逃走し、のちに長広太守・何夔および張遼らの招諭を受けて降伏した（『三國志』巻1・武帝紀、巻12・何夔伝、巻17・楽進伝・張郃伝）。"}, "竇茂": {"wiki_title": "", "ai_desc": "竇茂（とうぼう）：後漢末、強盛を誇った氐族の王。建安20年（215年）春3月、曹操が張魯討伐のため陳倉から散関へ進軍するにあたり、興国（興和）の険に拠っていた氐王・竇茂を張郃らが先遣されて討ち平らげた（『三國志』巻1・武帝紀「西征張魯，至陳倉，将自武都入氐；氐人塞道，先遣張郃・朱霊等攻破之」、巻17・張郃伝）。"}, "梁興": {"wiki_title": "", "ai_desc": "梁興（りょうこう）：後漢末の関中十将の一人。建安16年（211年）に馬超・韓遂らとともに潼関・渭南で曹操と戦ったのち、馮翊郡の鄜・夏陽一帯で掠奪を行っていたが、建安17年（212年）に夏侯淵・張郃および鄭渾らに討たれ斬られた（『三國志』巻9・夏侯淵伝、巻16・鄭渾伝、巻17・張郃伝）。"}, "楊秋": {"wiki_title": "楊秋", "ai_desc": "楊秋（ようしゅう）：後漢末の関中諸将の一人。建安16年（211年）の渭南の戦いの後、安定へ逃れたが、同年冬10月に曹操・夏侯淵・張郃らに包囲されて降伏し、元の官爵に復されて現地にとどめ置かれ、のち魏の討寇将軍・臨涇侯に至った（『三國志』巻1・武帝紀、巻17・張郃伝）。"}, "宋建": {"wiki_title": "宋建", "ai_desc": "宋建（そうけん）：後漢末、涼州隴西郡枹罕（ほうかん）に拠り、「河首平漢王」を自称して元号を定め三十余年にわたり自立していた勢力の首領。建安19年（214年）冬10月、夏侯淵・張郃らに枹罕を攻め落とされて斬られた（『三國志』巻1・武帝紀、巻9・夏侯淵伝、巻17・張郃伝）。"}, "荀林父": {"wiki_title": "荀林父", "ai_desc": "荀林父（じゅんりんぽ）：春秋時代の晋の政治家・将軍（中行氏の祖、中行桓子）。魯の宣公12年（前597年）、邲（ひつ）の戦いで中軍の元帥として楚の荘王に大敗し死罪を請うたが、晋の景公は士貞子の諫めを容れて処刑せず復位させ、宣公15年（前594年）に赤狄の潞氏を滅ぼして狄土を獲得した（『春秋左氏伝』宣公十二年・十五年）。"}, "孟明視": {"wiki_title": "", "ai_desc": "孟明視（もうめいし）：春秋時代の秦の将軍・百里視（百里奚の子、字は孟明）。魯の僖公33年（前627年）の殽（こう）の戦いで晋軍に敗れ捕虜となったが、秦の穆公は罪を問わず元の地位に復させ、文公3年（前624年）に河を渡り舟を焼いて晋を破り、西戎に覇を唱える功を立てた（『春秋左氏伝』僖公三十三年・文公三年、『史記』巻5・秦本紀）。"}, "于圭": {"wiki_title": "", "ai_desc": "于圭（うけい）：于禁の子。父・于禁の死後に後を継ぎ、益寿亭侯に封じられた（『三國志』巻17・于禁伝）。"}, "何茂": {"wiki_title": "", "ai_desc": "何茂（かぼう）：後漢末、袁紹配下の将。建安5年（200年）の官渡の戦いの際、延津の南西・黄河沿いの汲・獲嘉方面の別営を守っていたが、于禁・楽進らの攻撃を受けて王摩ら二十余将とともに降伏した（『三國志』巻17・于禁伝）。"}, "王摩": {"wiki_title": "", "ai_desc": "王摩（おうま）：後漢末、袁紹配下の将。建安5年（200年）の官渡の戦いの際、河内郡の汲・獲嘉方面において于禁・楽進らの別動隊に攻められ、何茂ら二十余将とともに曹操軍へ降伏した（『三國志』巻17・于禁伝）。"}, "高雅": {"wiki_title": "", "ai_desc": "高雅（こうが）：後漢末、呂布配下の将。興平元年（194年）、兗州東平国の須昌において于禁に撃破された（『三國志』巻17・于禁伝）。"}, "張超": {"wiki_title": "", "ai_desc": "張超（ちょうちょう）：後漢末の広陵太守。陳留太守・張邈の弟。興平元年（194年）に兄・張邈や呂布とともに曹操に背き、雍丘に籠城したが、建安元年（196年）正月に曹操軍に攻め落とされ自害した（『三國志』巻1・武帝紀、巻7・呂布伝・臧洪伝）。"}, "厳敬": {"wiki_title": "", "ai_desc": "厳敬（げんけい）：後漢末、袁譚・袁尚配下の将。建安7年（202年）9月から翌年春にかけての黎陽の戦いで袁譚・袁尚軍の大将を務めた（『三國志』巻1・武帝紀、巻17・楽進伝）。"}, "牛蓋": {"wiki_title": "", "ai_desc": "牛蓋（ぎゅうがい）：後漢末、曹操配下の部将。『三國志』では本伝（張遼伝）の陳蘭討伐の記事にのみその名がみえる。清の盧弼『三国志集解』などの史料考証では、繁体字・異体字の「蓋（盖）」と「金」の字形が似ていることから、曹仁配下の部将として知られる「牛金（ぎゅうきん）」の誤写ではないかとも推測されている。"}, "張虎": {"wiki_title": "", "ai_desc": "張虎（ちょうこ）：張遼の子。父・張遼の死後に晋陽侯の爵位を継承し、官は偏将軍に至った。"}, "陳蘭": {"wiki_title": "", "ai_desc": "陳蘭（ちんらん）：後漢末の揚州廬江郡一帯の在地勢力の首領。もとは袁術の部将であったが、のち江淮の間で数万の衆を集めて独立勢力となった（『三國志』武帝紀・劉馥伝・張遼伝）。"}, "梅成": {"wiki_title": "", "ai_desc": "梅成（ばいせい）：後漢末の揚州廬江郡一帯の在地勢力の首領。陳蘭らとともに江淮の間（灊・六）で勢力を持った（『三國志』武帝紀・張遼伝）。"}, "孫軽": {"wiki_title": "", "ai_desc": "孫軽（そんけい）：後漢末、太行山脈東麓（常山・趙国一帯）で活動した黒山賊の頭目の一人。"}, "柳毅": {"wiki_title": "", "ai_desc": "柳毅（りゅうき）：後漢末、渤海湾沿岸（海浜）に進出していた遼東方面の武装勢力の首領。"}};

  // 2. 山脈・大河
  const natureGroup = L.layerGroup().addTo(map);
  RIVER_LINES.forEach(river => {
    const rLine = L.polyline(river.coords, { color: '#1976d2', weight: 2.5, opacity: 0.75 }).addTo(natureGroup);
    rLine.bindTooltip(river.name, { sticky: true });
  });
  NATURAL_FEATURES.forEach(feat => {
    const icon = L.divIcon({
      className: feat.type === 'mountain' ? 'nature-label-mountain' : 'nature-label-river',
      html: feat.name,
      iconSize: [140, 20],
      iconAnchor: [70, 10]
    });
    L.marker([feat.lat, feat.lng], { icon: icon, interactive: false }).addTo(natureGroup);
  });

  // 3. エリア（郡・州）および地点ピンのレイヤー（公開範囲に応じて自動フィルタリング）
  const baseAreaGroup = L.layerGroup().addTo(map);
  const pinMarkerGroup = L.layerGroup().addTo(map);

  function getActivePlaceKeysSet() {
    if (isEditModeActive()) {
      return new Set(PLACES.map(p => p.key));
    }
    const visibleRecs = getVisibleRecords();
    const usedKeys = new Set();
    const tagRegex = /\{\{place:([^|}]+)\|/g;
    visibleRecs.forEach(rec => {
      [rec.raw_tagged, rec.kakikudashi_tagged, rec.translation_tagged].forEach(txt => {
        if (!txt) return;
        let m;
        while ((m = tagRegex.exec(txt)) !== null) {
          usedKeys.add(m[1]);
        }
      });
    });
    // 使用されている地点ピンの親エリア（parent_area）もあわせて有効化
    PLACES.forEach(p => {
      if (p.is_pin && usedKeys.has(p.key) && p.parent_area) {
        usedKeys.add(p.parent_area);
      }
    });
    return usedKeys;
  }

  function getShortNameWithReading(labelStr) {
    if (!labelStr) return '';
    return labelStr.replace(/：[^）]*）$/, '）');
  }

  function renderMapLayersForCurrentMode() {
    baseAreaGroup.clearLayers();
    pinMarkerGroup.clearLayers();
    const activeKeys = getActivePlaceKeysSet();

    PLACES.filter(p => p.is_area && p.area_polygon && activeKeys.has(p.key)).forEach(area => {
      const isCommandery = area.category.includes('郡');
      const poly = L.polygon(area.area_polygon, {
        color: isCommandery ? '#5d4037' : '#1565c0',
        weight: isCommandery ? 1.5 : 1.2,
        dashArray: isCommandery ? '4, 4' : '8, 6',
        fillColor: isCommandery ? '#8d6e63' : '#42a5f5',
        fillOpacity: isCommandery ? 0.06 : 0.03
      }).addTo(baseAreaGroup);
      poly.bindTooltip(`🗺️ ${getShortNameWithReading(area.label)}`, { sticky: true });
      poly.on('click', () => {
        focusPlaceOnMap(area.key, area.key);
      });
    });

    PLACES.filter(p => p.is_pin && activeKeys.has(p.key)).forEach(place => {
      let fillColor = '#e65100';
      if (place.province === '益州' || place.province === '涼州') fillColor = '#2e7d32';
      else if (place.province === '荊州') fillColor = '#1565c0';
      else if (place.province === '揚州' || place.province === '徐州') fillColor = '#6a1b9a';

      const marker = L.circleMarker([place.lat, place.lng], {
        radius: 6.5,
        fillColor: fillColor,
        color: '#fff',
        weight: 1.8,
        fillOpacity: 0.95
      }).addTo(pinMarkerGroup);

      marker.bindTooltip(`<span class="custom-label" id="pin-label-${place.key}">${place.key}</span>`, {
        permanent: true,
        direction: 'top',
        offset: [0, -7],
        className: 'transparent-box'
      });

      marker.on('click', () => {
        focusPlaceOnMap(place.key, place.key);
      });
    });
  }

  window.addEventListener('resize', () => {
    map.invalidateSize();
  });

  // 5. 地名クリック時の移動＆「エリア⊃地点」ハイライト処理
  function focusPlaceOnMap(placeKey, clickedRawSurface = '') {
    closeModal();
    const found = PLACES.find(p => p.key === placeKey);
    document.querySelectorAll('.custom-label').forEach(el => el.classList.remove('selected-pin'));
    activeHighlightLayers.forEach(layer => map.removeLayer(layer));
    activeHighlightLayers = [];

    if (!found) return false;

    const targetZoom = Math.round(found.zoom || 8);
    map.stop();

    let hierarchyHtml = '';
    const activeKeys = getActivePlaceKeysSet();

    // (A) エリア（州・郡・河南・河北など）をクリックした場合：領域ポリゴン（面）と中央バナーを表示
    if (found.is_area && found.area_polygon) {
      map.fitBounds(found.area_polygon, { padding: [36, 36], maxZoom: 7 });

      const areaPoly = L.polygon(found.area_polygon, {
        color: '#d84315',
        weight: 3.5,
        fillColor: '#ffab40',
        fillOpacity: 0.25
      }).addTo(map);

      const bannerIcon = L.divIcon({
        className: '',
        html: `<span class="area-banner-label">🗺️ ${found.key}</span>`,
        iconSize: [140, 28],
        iconAnchor: [70, 14]
      });
      const bannerMarker = L.marker([found.lat, found.lng], { icon: bannerIcon, interactive: false }).addTo(map);
      activeHighlightLayers.push(areaPoly, bannerMarker);
    }
    // (B) 河川をクリックした場合：水系ポリラインをハイライト
    else if (found.is_river) {
      map.setView([found.lat, found.lng], 7, { animate: true, duration: 0.5 });
      RIVER_LINES.filter(r => r.key === found.key).forEach(river => {
        const hl = L.polyline(river.coords, { color: '#ffeb3b', weight: 7, opacity: 0.85 }).addTo(map);
        const fg = L.polyline(river.coords, { color: '#d32f2f', weight: 3.5, opacity: 0.95 }).addTo(map);
        activeHighlightLayers.push(hl, fg);
      });
    }
    // (C) 地点（県・城・関・山）をクリックした場合：親エリア（豫州・徐州・兗州など）全体が見える縮尺に合わせてピン＋親枠を表示
    else {
      const labelEl = document.getElementById(`pin-label-${found.key}`);
      if (labelEl) labelEl.classList.add('selected-pin');

      const parentArea = PLACES.find(a => a.is_area && a.key === found.parent_area);
      if (parentArea && parentArea.area_polygon) {
        // 親エリア（例：許なら豫州）の枠全体が画面に収まる縮尺（最大ズーム7）に合わせる
        map.fitBounds(parentArea.area_polygon, { padding: [36, 36], maxZoom: 7 });

        const parentPoly = L.polygon(parentArea.area_polygon, {
          color: '#2e7d32',
          weight: 2.5,
          dashArray: '6, 4',
          fillColor: '#66bb6a',
          fillOpacity: 0.12
        }).addTo(map);
        const pLat = parentArea.area_polygon[0][0];
        const pLng = (parentArea.area_polygon[0][1] + parentArea.area_polygon[1][1]) / 2;
        const parentBanner = L.marker([pLat, pLng], {
          icon: L.divIcon({
            className: '',
            html: `<span class="parent-area-banner-label">${parentArea.key}</span>`,
            iconSize: [100, 22],
            iconAnchor: [50, 11]
          }),
          interactive: false
        }).addTo(map);
        activeHighlightLayers.push(parentPoly, parentBanner);
      } else {
        map.setView([found.lat, found.lng], 7, { animate: true, duration: 0.5 });
      }

      const ptCircle = L.circle([found.lat, found.lng], {
        radius: 14000,
        color: '#c62828',
        weight: 2.5,
        fillColor: '#ff5252',
        fillOpacity: 0.25
      }).addTo(map);
      activeHighlightLayers.push(ptCircle);
    }

    const toast = document.getElementById('mapToast');
    const safeSurface = (clickedRawSurface || found.key).replace(/'/g, "\'");
    const safeKey = found.key.replace(/'/g, "\'");
    const toastFeedbackHtml = isEditModeActive() ? `
      <div class="toast-feedback-bar">
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '🔄 場所が違う（同名別地・位置修正）')">🔄 場所が違う</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '📐 エリア⇔地点の区分変更')">📐 エリア⇔地点変更</button>
        <button class="toast-fb-btn" onclick="startMapCoordPicker('${safeKey}', '${safeSurface}')">📍 地図クリックで正しい位置を指定</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '❌ 地名タグ解除')">❌ タグ解除</button>
      </div>
    ` : '';
    const shortTitle = getShortNameWithReading(found.label);
    toast.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px;"><div>📍 <strong>${shortTitle}</strong> <span style="font-size:0.8rem; color:#ddd;">（現在の${found.modern}）</span></div><button onclick="document.getElementById('mapToast').style.display='none'" style="background:transparent; border:none; color:#ccc; cursor:pointer; font-size:0.9rem; line-height:1; padding:0 2px;" title="閉じる">✕</button></div>${toastFeedbackHtml}`;
    toast.style.display = 'block';
    return true;
  }

  // 6. データベースに埋め込まれた確定タグ（{type:key|surface}）を直接HTMLへ変換
  function getActivePersonsList() {
    return Array.from(new Set(
      getVisibleRecords().flatMap(r => (r.persons || '').split(',').map(s => s.trim()).filter(Boolean))
    ));
  }

  function getPlaceSubTypeLabel(placeKey) {
    const p = PLACES.find(item => item.key === placeKey);
    if (!p) return `地名(${placeKey})`;
    if (p.is_area) return `🗺️地名[エリア](${placeKey})`;
    if (p.is_river) return `🌊地名[河川](${placeKey})`;
    return `📍地名[地点](${placeKey})`;
  }

  function renderEmbeddedTags(taggedText, recId) {
    if (!taggedText) return '';
    const editHint = isEditModeActive() ? ' ／ 右クリックまたはドラッグ選択で指摘' : '';
    return taggedText.replace(/\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g, (m, tagType, key, surface) => {
      const safeKey = key.replace(/'/g, "\'");
      const safeSurface = surface.replace(/'/g, "\'");
      if (tagType === 'place') {
        const subLabel = getPlaceSubTypeLabel(key);
        return `<span class="inline-place" data-tag-type="place" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" title="${subLabel}：クリックで地図移動${editHint}">${surface}</span>`;
      } else if (tagType === 'office') {
        return `<span class="inline-office" data-tag-type="office" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" title="👑官職(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'person') {
        return `<span class="inline-person" data-tag-type="person" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" title="👤人名(${key})：クリックで解説${editHint}">${surface}</span>`;
      } else if (tagType === 'special') {
        return `<span class="inline-special" data-tag-type="special" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" title="🔖特別キーワード(${key})：クリックで解説${editHint}">${surface}</span>`;
      }
      return surface;
    });
  }

  // 7. 本文・裴注リーダー描画（「1段落＝本文＋裴注」ずつの切り替え表示）
  const recordListEl = document.getElementById('recordList');
  const paraTopNavEl = document.getElementById('paraTopNav');
  let currentParaIndex = 1;

  function getSectionLabelForPara(paraIdx) {
    const rec = RECORDS.find(r => r.para_index === paraIdx);
    const maxVis = getMaxVisibleParagraph();
    if (isEditModeActive() && rec) {
      const shortSec = (rec.section_title || '').replace('張樂于張徐傳（', '').replace('）', '');
      const pubBadge = paraIdx <= PUBLISHED_MAX_PARA ? '✅' : '🔧';
      return `${pubBadge} 第 ${paraIdx} / ${maxVis} （${shortSec}）`;
    }
    const denomLabel = PUBLISHED_MAX_PARA < TOTAL_PARAGRAPHS ? '○' : maxVis;
    return `第 ${paraIdx} / ${denomLabel}`;
  }

  function goToParagraph(paraIdx) {
    const maxVis = getMaxVisibleParagraph();
    const clamped = Math.max(1, Math.min(maxVis, paraIdx));
    currentParaIndex = clamped;
    const showAllEl = document.getElementById('toggleShowAllParas');
    if (showAllEl && showAllEl.checked) {
      showAllEl.checked = false;
    }
    renderReaderList();
    recordListEl.scrollTop = 0;
    const firstRec = getVisibleRecords().find(r => r.para_index === currentParaIndex);
    if (firstRec) {
      setActiveRecord(firstRec.id);
    }
  }

  function changeParagraph(delta) {
    goToParagraph(currentParaIndex + delta);
  }

  function renderReaderList() {
    const showAll = isEditModeActive() && document.getElementById('toggleShowAllParas') && document.getElementById('toggleShowAllParas').checked;
    const maxVis = getMaxVisibleParagraph();
    if (currentParaIndex > maxVis) {
      currentParaIndex = maxVis;
    }

    // 地図と本文の間の段落切り替えバー（← 第 1 / ○ →）を更新
    if (paraTopNavEl) {
      if (!showAll) {
        const prevDisabled = currentParaIndex <= 1 ? 'disabled' : '';
        const nextDisabled = currentParaIndex >= maxVis ? 'disabled' : '';
        let optionsHtml = '';
        for (let p = 1; p <= maxVis; p++) {
          const selectedAttr = p === currentParaIndex ? 'selected' : '';
          optionsHtml += `<option value="${p}" ${selectedAttr}>${getSectionLabelForPara(p)}</option>`;
        }
        paraTopNavEl.innerHTML = `
          <button class="slim-nav-btn" onclick="changeParagraph(-1)" ${prevDisabled}>←</button>
          <select class="para-select" onchange="goToParagraph(parseInt(this.value, 10))">${optionsHtml}</select>
          <button class="slim-nav-btn" onclick="changeParagraph(1)" ${nextDisabled}>→</button>
        `;
      } else {
        paraTopNavEl.innerHTML = `<span class="vol-nav-title">全段落連続表示（第 1 〜 ${maxVis} 段落）</span>`;
      }
    }

    recordListEl.innerHTML = '';

    // 読書履歴スタックがある場合は最上部に「元の場所に戻る」ボタンを表示
    if (readingHistoryStack.length > 0) {
      const lastId = readingHistoryStack[readingHistoryStack.length - 1];
      const backBtnEl = document.createElement('button');
      backBtnEl.className = 'back-btn';
      backBtnEl.style.display = 'inline-block';
      backBtnEl.textContent = `↩ さっき読んでいた場所 (${lastId}) に戻る`;
      backBtnEl.onclick = goBackToSavedReadingSpot;
      recordListEl.appendChild(backBtnEl);
    }

    const visibleRecs = getVisibleRecords();
    const targetRecords = showAll
      ? visibleRecs
      : visibleRecs.filter(rec => rec.para_index === currentParaIndex);

    targetRecords.forEach(rec => {
      const isPei = rec.type === '裴注';
      const card = document.createElement('div');
      card.className = `record-card ${isPei ? 'pei-note' : 'main-text'}`;
      card.id = `card-${rec.id}`;
      card.dataset.id = rec.id;

      card.innerHTML = `
        <div class="card-top">
          <span><strong>${rec.id}</strong> [${rec.section_title}] （第${rec.para_index}段落） ${rec.era_year ? `｜ 📅 ${rec.era_year}` : ''}</span>
          <span class="badge ${isPei ? 'pei' : 'main'}">${rec.type}</span>
        </div>
        <div class="raw-text">${renderEmbeddedTags(rec.raw_tagged, rec.id)}</div>
        <div class="kakikudashi">${renderEmbeddedTags(rec.kakikudashi_tagged, rec.id)}</div>
        <div class="translation">${renderEmbeddedTags(rec.translation_tagged, rec.id)}</div>
      `;

      card.addEventListener('click', () => {
        setActiveRecord(rec.id);
      });

      recordListEl.appendChild(card);
    });

    // 本文末尾の索引ボタンバー
    const bottomNav = document.createElement('div');
    bottomNav.className = 'para-bottom-nav';
    bottomNav.innerHTML = `
      <button class="nav-btn" onclick="openTocModal()">📑 登場人物・地名・官職 索引</button>
    `;
    recordListEl.appendChild(bottomNav);

    // 本文の一番下に配置する Google AdSense 広告スペース
    const adBox = document.createElement('div');
    adBox.className = 'ad-footer-box';
    adBox.innerHTML = `
      <div class="ad-footer-label">スポンサーリンク</div>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-4382223240782332"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    `;
    recordListEl.appendChild(adBox);
    try {
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    } catch (e) {}
  }

  function setActiveRecord(recId) {
    currentActiveId = recId;
    document.querySelectorAll('.record-card').forEach(c => {
      c.classList.toggle('active-card', c.dataset.id === recId);
    });
  }

  // 8. 全カテゴリ統一モーダル（人物・官職はWikipedia概略＋出現箇所、特別キーワードは語句解説＋出現箇所）
  function openUnifiedModal(categoryType, itemKey, clickedSurface = '') {
    let headerTitle = '';
    let wikiTargetTitle = '';
    let mappingNote = '';
    let specialGlossaryDesc = '';
    let searchTerms = [];

    if (categoryType === 'person') {
      headerTitle = `👤 【人物】${itemKey}`;
      const pInfo = PERSONS_INFO[itemKey];
      if (pInfo) {
        wikiTargetTitle = pInfo.wiki_title || '';
        specialGlossaryDesc = pInfo.ai_desc || '';
      } else {
        wikiTargetTitle = itemKey.replace(/\(.*?\)/g, '');
      }
      if (clickedSurface && clickedSurface !== itemKey) {
        mappingNote = `原文の「${clickedSurface}」をフルネーム「${itemKey}」に特別変換して紐づけています。`;
      }
      searchTerms = [itemKey];
    } else if (categoryType === 'office') {
      const info = OFFICES[itemKey];
      if (!info) return;
      headerTitle = `👑 【官職】${info.title}`;
      wikiTargetTitle = info.wiki_title !== undefined ? info.wiki_title : itemKey;
      mappingNote = info.mapping_note || '';
      if (!wikiTargetTitle) {
        specialGlossaryDesc = info.ai_desc || '';
      }
      searchTerms = itemKey === '県令' ? ['易陽令', '雒陽令', '綿竹令'] :
                    (itemKey === '県長' ? ['臨沮長', '旌陽長', '臨邛長'] :
                    (itemKey === '相' ? ['魯相'] : info.match_terms));
    } else if (categoryType === 'special') {
      const info = SPECIAL_KW[itemKey];
      if (!info) return;
      headerTitle = `🔖 【${info.category}】${info.title}`;
      wikiTargetTitle = info.wiki_title !== undefined ? info.wiki_title : itemKey;
      mappingNote = info.mapping_note || '';
      specialGlossaryDesc = info.ai_desc || '';
      searchTerms = info.match_terms;
    }

    const fallbackAiDesc = (categoryType === 'office' && OFFICES[itemKey]) ? (OFFICES[itemKey].ai_desc || '') : '';

    const matched = getVisibleRecords().filter(rec => {
      const allText = [rec.raw_text, rec.kakikudashi, rec.translation, rec.persons, rec.keywords, rec.source_book, rec.era_year].join(' ');
      return searchTerms.some(t => allText.includes(t));
    });

    document.getElementById('modalTitle').textContent = `${headerTitle} （出現：${matched.length} 件）`;
    const bodyEl = document.getElementById('modalBody');

    const specialDescHtml = specialGlossaryDesc
      ? `<div class="ai-special-box">
           <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">📖 【語句・故事の意味解説】</div>
           <div>${specialGlossaryDesc}</div>
         </div>`
      : '';

    const wikiBoxHtml = wikiTargetTitle
      ? `<div class="wiki-standard-box" id="unifiedWikiBox">
           <div>🌐 Wikipediaから「${wikiTargetTitle}」の概略を取得中...</div>
         </div>`
      : '';

    bodyEl.innerHTML = `
      ${specialDescHtml}
      ${wikiBoxHtml}
      <details class="occurrence-details">
        <summary class="occurrence-summary">📖 出現箇所一覧（全 ${matched.length} 件）</summary>
        <div class="occurrence-list" id="modalOccurrenceList"></div>
      </details>
    `;

    if (wikiTargetTitle) {
      fetchWikipediaSummary(wikiTargetTitle, 'unifiedWikiBox', fallbackAiDesc, Boolean(specialGlossaryDesc));
    }
    const occListEl = document.getElementById('modalOccurrenceList');
    if (occListEl) {
      appendOccurrencesToModal(occListEl, matched, searchTerms);
    }
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  async function fetchWikipediaSummary(wikiTitle, containerId, fallbackDesc = '', hasSpecialBox = false) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const encoded = encodeURIComponent(wikiTitle);
    const wikiUrl = `https://ja.wikipedia.org/wiki/${encoded}`;
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encoded}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.type === 'disambiguation') throw new Error('Disambiguation');
      box.innerHTML = `
        <div style="font-weight:bold; color:#0d47a1; margin-bottom:4px;">🌐 【Wikipedia 概略】「${data.title}」</div>
        <div>${data.extract || '（要約テキストなし）'}</div>
        <a class="wiki-link-btn" href="${wikiUrl}" target="_blank" rel="noopener">Wikipediaで「${data.title}」のページを開く ↗</a>
      `;
    } catch (err) {
      if (hasSpecialBox) {
        box.style.display = 'none';
      } else if (fallbackDesc) {
        box.className = 'ai-special-box';
        box.innerHTML = `
          <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">📖 【語句・制度の意味解説】</div>
          <div>${fallbackDesc}</div>
        `;
      } else {
        box.style.display = 'none';
      }
    }
  }

  function appendOccurrencesToModal(container, records, highlightTerms) {
    records.forEach(rec => {
      const item = document.createElement('div');
      item.className = 'modal-occurrence';
      const isCurrent = rec.id === currentActiveId;
      item.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:0.82rem; font-weight:bold; color:#3d2f1d;">
            ${rec.id} [${rec.section_title}] （第${rec.para_index}段落・${rec.type}） ${isCurrent ? '👈 【現在読書中の行】' : ''}
          </span>
          <button class="jump-btn" onclick="jumpToRecordFromModal('${rec.id}')">この段落へ移動して読む</button>
        </div>
        <div class="raw-text" style="font-size:0.95rem;">${highlightSimple(rec.raw_text, highlightTerms)}</div>
        <div class="translation" style="font-size:0.88rem;">${highlightSimple(rec.translation, highlightTerms)}</div>
      `;
      container.appendChild(item);
    });
  }

  function openTocModal() {
    document.getElementById('modalTitle').textContent = '📑 巻17（五将軍伝）目次・エリア＆地点インデックス';
    const bodyEl = document.getElementById('modalBody');
    const activeKeys = getActivePlaceKeysSet();
    const activePersons = getActivePersonsList();
    const visRecords = getVisibleRecords();

    const activeOffices = Object.keys(OFFICES).filter(k => {
      if (isEditModeActive()) return true;
      const info = OFFICES[k];
      const terms = [k, ...(info.aliases || [])];
      return visRecords.some(r => terms.some(t => r.raw_text.includes(t) || r.kakikudashi.includes(t) || r.translation.includes(t)));
    });

    const activeSpecials = Object.keys(SPECIAL_KW).filter(k => {
      if (isEditModeActive()) return true;
      const info = SPECIAL_KW[k];
      const terms = [k, ...(info.aliases || [])];
      return visRecords.some(r => terms.some(t => r.raw_text.includes(t) || r.kakikudashi.includes(t) || r.translation.includes(t)));
    });

    const areaButtons = PLACES.filter(p => p.is_area && activeKeys.has(p.key)).map(p => `<button class="nav-btn" style="background:#d84315; margin:2px;" onclick="closeModal(); focusPlaceOnMap('${p.key}', '${p.key}')">🗺️ [エリア] ${p.key}</button>`).join('');
    const pointButtons = PLACES.filter(p => p.is_pin && activeKeys.has(p.key)).map(p => `<button class="nav-btn" style="background:#2e7d32; margin:2px;" onclick="closeModal(); focusPlaceOnMap('${p.key}', '${p.key}')">📍 ${p.key} (${p.parent_area})</button>`).join('');
    const riverButtons = PLACES.filter(p => p.is_river && activeKeys.has(p.key)).map(p => `<button class="nav-btn" style="background:#0277bd; margin:2px;" onclick="closeModal(); focusPlaceOnMap('${p.key}', '${p.key}')">🌊 ${p.key}</button>`).join('');
    const officeButtons = activeOffices.map(k => `<button class="nav-btn" style="background:#1565c0; margin:2px;" onclick="openUnifiedModal('office', '${k}', '${k}')">👑 ${k}</button>`).join('');
    const personButtons = activePersons.map(p => `<button class="nav-btn" style="background:#bf360c; margin:2px;" onclick="openUnifiedModal('person', '${p}', '${p}')">👤 ${p}</button>`).join('');
    const specialButtons = activeSpecials.map(k => `<button class="nav-btn" style="background:#6a1b9a; margin:2px;" onclick="openUnifiedModal('special', '${k}', '${k}')">🔖 ${k}</button>`).join('');

    bodyEl.innerHTML = `
      <div>
        <h4 style="margin-bottom:6px; color:#3d2f1d;">📌 章立て（各列伝へ移動）</h4>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="nav-btn" onclick="jumpToRecordFromModal('v17_p1_1')">${getMaxVisibleParagraph() >= 4 ? '① 張遼傳（第1〜4段落）' : '① 張遼傳'}</button>
          ${getMaxVisibleParagraph() >= 5 ? `<button class="nav-btn" onclick="jumpToRecordFromModal('v17_p5_1')">② 樂進傳（第5〜6段落）</button>` : ''}
          ${getMaxVisibleParagraph() >= 7 ? `<button class="nav-btn" onclick="jumpToRecordFromModal('v17_p7_1')">③ 于禁傳（第7〜9段落）</button>` : ''}
          ${getMaxVisibleParagraph() >= 10 ? `<button class="nav-btn" onclick="jumpToRecordFromModal('v17_p10_1')">④ 張郃傳（第10〜14段落）</button>` : ''}
          ${getMaxVisibleParagraph() >= 15 ? `<button class="nav-btn" onclick="jumpToRecordFromModal('v17_p15_1')">⑤ 徐晃傳（第15〜19段落）</button>` : ''}
          ${getMaxVisibleParagraph() >= 20 ? `<button class="nav-btn" onclick="jumpToRecordFromModal('v17_p20_1')">⑥ 朱靈傳（第20段落）</button>` : ''}
          ${getMaxVisibleParagraph() >= 21 ? `<button class="nav-btn" onclick="jumpToRecordFromModal('v17_p21_1')">⑦ 【評】陳寿の論評（第21段落）</button>` : ''}
        </div>
      </div>
      <div>
        <h4 style="margin-bottom:6px; color:#d84315;">①-A エリア地名（州・郡・広域地方：面で表示）</h4>
        <div>${areaButtons}</div>
      </div>
      <div>
        <h4 style="margin-bottom:6px; color:#1b5e20;">①-B 地点地名（県・城・関・山・戦場：ピン＋親エリア枠で表示）</h4>
        <div>${pointButtons}</div>
      </div>
      ${riverButtons ? `
      <div>
        <h4 style="margin-bottom:6px; color:#0277bd;">①-C 河川（水系ラインハイライト）</h4>
        <div>${riverButtons}</div>
      </div>` : ''}
      <div>
        <h4 style="margin-bottom:6px; color:#0d47a1;">② 官職・爵位事典</h4>
        <div>${officeButtons}</div>
      </div>
      <div>
        <h4 style="margin-bottom:6px; color:#bf360c;">③ 登場人物一覧（${activePersons.length} 名）</h4>
        <div>${personButtons}</div>
      </div>
      <div>
        <h4 style="margin-bottom:6px; color:#4a148c;">④ 特別キーワード（制度・年号・兵法・引用史料）</h4>
        <div>${specialButtons}</div>
      </div>
    `;
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function jumpToRecordFromModal(targetId) {
    if (targetId !== currentActiveId) {
      readingHistoryStack.push(currentActiveId);
    }
    closeModal();
    scrollToCard(targetId);
  }

  function goBackToSavedReadingSpot() {
    if (readingHistoryStack.length === 0) return;
    const prevId = readingHistoryStack.pop();
    scrollToCard(prevId);
  }

  function scrollToCard(recId) {
    const rec = getVisibleRecords().find(r => r.id === recId);
    if (!rec) return;
    if (currentParaIndex !== rec.para_index) {
      currentParaIndex = rec.para_index;
    }
    renderReaderList();
    const cardEl = document.getElementById(`card-${recId}`);
    if (cardEl) {
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setActiveRecord(recId);
    }
  }

  function highlightSimple(text, terms) {
    if (!text) return '';
    let res = text;
    terms.forEach(t => {
      if (!t) return;
      res = res.replace(new RegExp(t, 'g'), `<span class="highlight">${t}</span>`);
    });
    return res;
  }

  // =========================================================================
  // 9. ワンクリック指摘・校正システム（手元PCまたは ?edit=1 時のみ自動表示）
  // =========================================================================
  const FEEDBACK_STORAGE_KEY = 'threekingdom_vol17_feedback_clean_v1';
  const MAX_SELECTION_CHARS = 50;          // ポップアップを出す最大選択文字数
  const CONTEXT_SNIPPET_RADIUS_CHARS = 10; // 前後の文脈として切り出す文字数
  const POPUP_OFFSET_Y_PX = 10;            // 選択箇所からポップアップまでの縦オフセット(px)
  const POPUP_VIEWPORT_MARGIN_PX = 12;     // 画面端からの最小マージン(px)
  const COORD_DECIMAL_DIGITS = 2;          // 地図クリック時の緯度・経度の小数桁数

  let feedbackItems = [];
  let pendingFeedbackContext = null;
  let mapCoordPickerState = null;

  try {
    const saved = localStorage.getItem(FEEDBACK_STORAGE_KEY);
    if (saved) feedbackItems = JSON.parse(saved);
  } catch (e) {
    feedbackItems = [];
  }

  function saveFeedbackItems() {
    try {
      localStorage.setItem(FEEDBACK_STORAGE_KEY, JSON.stringify(feedbackItems));
    } catch (e) {}
    renderFeedbackTray();
  }

  function applyEnvironmentModeUI() {
    const editActive = isEditModeActive();
    const trayEl = document.getElementById('feedbackTray');
    const trayBodyEl = document.getElementById('feedbackTrayBody');
    const trayFooterEl = document.getElementById('feedbackTrayFooter');
    const proofreadLabelEl = document.getElementById('proofreadModeLabel');
    const showAllLabelEl = document.getElementById('showAllParasLabel');

    // 手元PCまたは ?edit=1 の時だけ制作トレイを表示（本番Webでは完全非表示）
    if (trayEl) trayEl.style.display = IS_AUTHOR_EDIT_ENV ? 'flex' : 'none';
    if (trayBodyEl) trayBodyEl.style.display = editActive ? 'flex' : 'none';
    if (trayFooterEl) trayFooterEl.style.display = editActive ? 'flex' : 'none';
    if (proofreadLabelEl) proofreadLabelEl.style.display = editActive ? 'flex' : 'none';
    if (showAllLabelEl) showAllLabelEl.style.display = editActive ? 'flex' : 'none';
    if (!editActive) hideSelectionFeedbackBar();

    renderMapLayersForCurrentMode();
    renderReaderList();
  }

  function handleInlineTagClick(event, recId, tagType, itemKey, surfaceText) {
    event.stopPropagation();
    const sel = window.getSelection();
    if (sel && sel.toString().trim().length > 0) {
      return;
    }

    setActiveRecord(recId);
    const isProofreadMode = isEditModeActive() && document.getElementById('toggleProofreadMode').checked;

    if (tagType === 'place') {
      focusPlaceOnMap(itemKey, surfaceText);
    }

    if (isProofreadMode) {
      openFeedbackBarForTagElement(event.currentTarget, recId, tagType, itemKey, surfaceText);
      return;
    }

    if (tagType !== 'place') {
      openUnifiedModal(tagType, itemKey, surfaceText);
    }
  }

  function handleInlineTagContextMenu(event, recId, tagType, itemKey, surfaceText) {
    if (!isEditModeActive()) return;
    event.preventDefault();
    event.stopPropagation();
    setActiveRecord(recId);
    if (tagType === 'place') {
      focusPlaceOnMap(itemKey, surfaceText);
    }
    openFeedbackBarForTagElement(event.currentTarget, recId, tagType, itemKey, surfaceText);
  }

  function getBlockLabelFromElement(el) {
    if (!el) return '本文';
    if (el.closest('.raw-text')) return '原文';
    if (el.closest('.kakikudashi')) return '書き下し';
    if (el.closest('.translation')) return '現代語訳';
    return '本文';
  }

  function getRangeCharOffsetInContainer(containerEl, range) {
    if (!containerEl || !range) return -1;
    try {
      const preRange = range.cloneRange();
      preRange.selectNodeContents(containerEl);
      preRange.setEnd(range.startContainer, range.startOffset);
      return preRange.toString().length;
    } catch (e) {
      return -1;
    }
  }

  function extractSurroundingContext(containerEl, targetWord, exactOffset = -1) {
    if (!containerEl || !targetWord) return targetWord;
    const fullText = containerEl.innerText || containerEl.textContent || '';
    const idx = (exactOffset >= 0 && exactOffset <= fullText.length)
      ? exactOffset
      : fullText.indexOf(targetWord);
    if (idx === -1) return `【${targetWord}】`;
    const start = Math.max(0, idx - CONTEXT_SNIPPET_RADIUS_CHARS);
    const end = Math.min(fullText.length, idx + targetWord.length + CONTEXT_SNIPPET_RADIUS_CHARS);
    const prefix = (start > 0 ? '…' : '') + fullText.slice(start, idx);
    const suffix = fullText.slice(idx + targetWord.length, end) + (end < fullText.length ? '…' : '');
    return `${prefix}【${targetWord}】${suffix}`;
  }

  function openFeedbackBarForTagElement(el, recId, tagType, itemKey, surfaceText) {
    if (!isEditModeActive()) return;
    const blockEl = el.closest('.raw-text, .kakikudashi, .translation');
    const blockLabel = getBlockLabelFromElement(el);
    let exactOffset = -1;
    if (blockEl && el) {
      try {
        const r = document.createRange();
        r.selectNodeContents(el);
        exactOffset = getRangeCharOffsetInContainer(blockEl, r);
      } catch (e) {}
    }
    const contextStr = extractSurroundingContext(blockEl, surfaceText, exactOffset);
    const typeNameMap = {
      'place': getPlaceSubTypeLabel(itemKey),
      'person': `👤人名(${itemKey})`,
      'office': `👑官職(${itemKey})`,
      'special': `🔖特別語(${itemKey})`
    };

    pendingFeedbackContext = {
      recId: recId,
      blockLabel: blockLabel,
      word: surfaceText,
      contextStr: contextStr,
      currentTag: typeNameMap[tagType] || tagType
    };

    const rect = el.getBoundingClientRect();
    showSelectionFeedbackBarAtRect(rect);
  }

  document.addEventListener('mouseup', (event) => {
    if (!isEditModeActive()) return;
    const bar = document.getElementById('selectionFeedbackBar');
    if (bar && bar.contains(event.target)) return;

    setTimeout(() => {
      if (!isEditModeActive()) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;
      const selectedText = sel.toString().trim();
      if (!selectedText || selectedText.length > MAX_SELECTION_CHARS) return;

      const anchorNode = sel.anchorNode;
      if (!anchorNode) return;
      const anchorEl = anchorNode.nodeType === 3 ? anchorNode.parentElement : anchorNode;
      if (!anchorEl) return;

      const cardEl = anchorEl.closest('.record-card');
      if (!cardEl) return;

      const recId = cardEl.dataset.id || currentActiveId;
      const blockEl = anchorEl.closest('.raw-text, .kakikudashi, .translation');
      const blockLabel = getBlockLabelFromElement(anchorEl);
      const range = sel.getRangeAt(0);
      const exactOffset = getRangeCharOffsetInContainer(blockEl, range);
      const contextStr = extractSurroundingContext(blockEl, selectedText, exactOffset);

      // 選択箇所が既存のタグ内かどうかを判定
      const inlineTagEl = anchorEl.closest('.inline-place, .inline-person, .inline-office, .inline-special');
      let currentTag = '未タグ';
      if (inlineTagEl) {
        const fullTagText = inlineTagEl.textContent || '';
        const tType = inlineTagEl.dataset.tagType || '';
        const tKey = inlineTagEl.dataset.tagKey || fullTagText;
        const detailType = tType === 'place' ? getPlaceSubTypeLabel(tKey) :
                           (tType === 'person' ? `👤人名(${tKey})` :
                           (tType === 'office' ? `👑官職(${tKey})` :
                           (tType === 'special' ? `🔖特別語(${tKey})` : `既タグ「${fullTagText}」`)));
        currentTag = fullTagText === selectedText ? detailType : `${detailType}の一部`;
      }

      pendingFeedbackContext = {
        recId: recId,
        blockLabel: blockLabel,
        word: selectedText,
        contextStr: contextStr,
        currentTag: currentTag
      };

      const rect = range.getBoundingClientRect();
      showSelectionFeedbackBarAtRect(rect);
    }, 10);
  });

  function showSelectionFeedbackBarAtRect(rect) {
    if (!pendingFeedbackContext) return;
    const bar = document.getElementById('selectionFeedbackBar');
    document.getElementById('sfbMetaLabel').textContent = `[${pendingFeedbackContext.recId}・${pendingFeedbackContext.blockLabel}]`;
    document.getElementById('sfbTargetWord').textContent = pendingFeedbackContext.word;
    document.getElementById('sfbCurrentTagInfo').textContent = `（現在: ${pendingFeedbackContext.currentTag}）`;

    bar.style.display = 'flex';
    const barRect = bar.getBoundingClientRect();

    let topPx = rect.top - barRect.height - POPUP_OFFSET_Y_PX;
    if (topPx < POPUP_VIEWPORT_MARGIN_PX) {
      topPx = rect.bottom + POPUP_OFFSET_Y_PX;
    }
    let leftPx = rect.left + (rect.width / 2) - (barRect.width / 2);
    leftPx = Math.max(POPUP_VIEWPORT_MARGIN_PX, Math.min(window.innerWidth - barRect.width - POPUP_VIEWPORT_MARGIN_PX, leftPx));

    bar.style.top = `${Math.round(topPx)}px`;
    bar.style.left = `${Math.round(leftPx)}px`;
  }

  function hideSelectionFeedbackBar() {
    const bar = document.getElementById('selectionFeedbackBar');
    if (bar) bar.style.display = 'none';
  }

  function addFeedbackFromBar(actionText) {
    if (!pendingFeedbackContext) return;
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: pendingFeedbackContext.recId,
      blockLabel: pendingFeedbackContext.blockLabel,
      word: pendingFeedbackContext.word,
      contextStr: pendingFeedbackContext.contextStr,
      currentTag: pendingFeedbackContext.currentTag,
      action: actionText
    });
    saveFeedbackItems();
    hideSelectionFeedbackBar();
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
  }

  function promptCustomFeedbackNote() {
    if (!pendingFeedbackContext) return;
    const note = window.prompt(
      `[${pendingFeedbackContext.recId}] 「${pendingFeedbackContext.word}」についての指摘・メモを入力してください（例：〇〇郡の同名別地、訳文を〇〇に修正など）：`,
      ''
    );
    if (note && note.trim()) {
      addFeedbackFromBar(`✏️ メモ指摘: ${note.trim()}`);
    }
  }

  // 地図左下の地名トースト内からのワンクリック指摘
  function addPlaceToastFeedback(placeKey, surfaceText, actionText) {
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: currentActiveId,
      blockLabel: '地図確認',
      word: surfaceText,
      contextStr: `現在位置 ${currentActiveId} で「${surfaceText}」(登録キー: ${placeKey}) を確認中`,
      currentTag: `地名(${placeKey})`,
      action: actionText
    });
    saveFeedbackItems();
  }

  // 地図上をクリックして「本当の場所（緯度・経度）」をワンクリック指定するモード
  function startMapCoordPicker(placeKey, surfaceText) {
    mapCoordPickerState = {
      recId: currentActiveId,
      placeKey: placeKey,
      surfaceText: surfaceText
    };
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `<div style="color:#ffd54f; font-weight:bold;">🎯 【位置指定モード】地図上で「${surfaceText}」の正しい位置をクリックしてください（自動で緯度・経度が指摘リストに入ります）</div>`;
    document.getElementById('map').style.cursor = 'crosshair';
  }

  map.on('click', (e) => {
    if (!mapCoordPickerState) return;
    const lat = e.latlng.lat.toFixed(COORD_DECIMAL_DIGITS);
    const lng = e.latlng.lng.toFixed(COORD_DECIMAL_DIGITS);
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: mapCoordPickerState.recId,
      blockLabel: '地図座標指定',
      word: mapCoordPickerState.surfaceText,
      contextStr: `登録キー: ${mapCoordPickerState.placeKey}`,
      currentTag: `地名(${mapCoordPickerState.placeKey})`,
      action: `📍 正しい座標を地図クリックで指定 ➔ 緯度: ${lat}, 経度: ${lng}`
    });
    saveFeedbackItems();

    L.circleMarker([e.latlng.lat, e.latlng.lng], {
      radius: 8,
      color: '#ffeb3b',
      fillColor: '#d50000',
      fillOpacity: 0.9,
      weight: 2.5
    }).addTo(activeHighlightLayers.length >= 0 ? map : map).bindTooltip(`🎯 指摘座標: ${ mapCoordPickerState.surfaceText } (${lat}, ${lng})`, { permanent: true, direction: 'top' });

    document.getElementById('map').style.cursor = '';
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `✅ <strong>「${mapCoordPickerState.surfaceText}」の指定座標 (${lat}, ${lng}) を右下の指摘リストに追加しました！</strong>`;
    mapCoordPickerState = null;
  });

  function toggleFeedbackTray() {
    const tray = document.getElementById('feedbackTray');
    const icon = document.getElementById('feedbackTrayToggleIcon');
    tray.classList.toggle('minimized');
    icon.textContent = tray.classList.contains('minimized') ? '▲ 展開する' : '▼ 折りたたむ';
  }

  function removeFeedbackItem(idx) {
    feedbackItems.splice(idx, 1);
    saveFeedbackItems();
  }

  function clearAllFeedback() {
    if (feedbackItems.length === 0) return;
    feedbackItems = [];
    saveFeedbackItems();
  }

  function renderFeedbackTray() {
    const badge = document.getElementById('feedbackCountBadge');
    const body = document.getElementById('feedbackTrayBody');
    if (!badge || !body) return;

    badge.textContent = `${feedbackItems.length}件`;

    if (feedbackItems.length === 0) {
      body.innerHTML = `
        <div class="feedback-empty">
          本文の気になる文字を<strong>なぞって選択</strong>するか、色付き単語を<strong>右クリック</strong>（🛠️指摘モードON時は左クリック）すると、ワンクリックでここに指摘が溜まります。
        </div>
      `;
      return;
    }

    body.innerHTML = feedbackItems.map((item, idx) => `
      <div class="feedback-item">
        <div>
          <div><strong>[${item.recId}・${item.blockLabel}]</strong> 「<span style="color:#ffd54f; font-weight:bold;">${item.word}</span>」 <span style="color:#b0bec5; font-size:0.74rem;">(${item.currentTag})</span></div>
          <div style="color:#a5d6a7; font-weight:bold; margin-top:2px;">➔ ${item.action}</div>
          <div style="color:#ccc; font-size:0.74rem; margin-top:1px;">文脈: ${item.contextStr}</div>
        </div>
        <button class="feedback-item-del" onclick="removeFeedbackItem(${idx})" title="この指摘を削除">✕</button>
      </div>
    `).join('');
  }

  function copyAllFeedbackToClipboard() {
    if (feedbackItems.length === 0) {
      window.alert('まだ指摘リストが空です。本文の文字をドラッグ選択するか、色付き単語を右クリックして指摘を追加してください。');
      return;
    }

    const lines = ['【巻17 ピンポイント指摘リスト】'];
    feedbackItems.forEach((item, i) => {
      lines.push(`${i + 1}. [${item.recId} / ${item.blockLabel}] 「${item.word}」（現在: ${item.currentTag}｜文脈: ${item.contextStr}） ➔ ${item.action}`);
    });
    const textToCopy = lines.join('\n');

    navigator.clipboard.writeText(textToCopy).then(() => {
      const btn = document.getElementById('feedbackCopyBtn');
      const origText = btn.textContent;
      btn.textContent = '✅ コピーしました！そのままチャットに貼り付けてください';
      btn.style.background = '#66bb6a';
      setTimeout(() => {
        btn.textContent = origText;
        btn.style.background = '';
      }, 2500);
    }).catch(() => {
      window.prompt('以下のテキストをコピーしてチャットに貼り付けてください：', textToCopy);
    });
  }

  applyEnvironmentModeUI();
  renderFeedbackTray();
  setActiveRecord("v17_p1_1");
</script>
