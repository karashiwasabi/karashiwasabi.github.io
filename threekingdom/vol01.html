ara_index": 72, "type": "裴注", "raw_text": "肄，以四反。三蒼曰：「肄，習也。」", "kakikudashi": "肄は、以四の反なり。『三蒼』に曰く、「肄とは、習なり。」", "translation": "「肄」は、以四の反切（音はイ）である。『三蒼』にいう、「肄とは、習（ならう・調練する）の意である。」", "persons": "", "places": "", "era_year": "", "source_book": "三蒼", "keywords": "三蒼", "raw_tagged": "肄，以四反。{{special:三蒼|三蒼}}曰：「肄，習也。」", "kakikudashi_tagged": "肄は、以四の反なり。{{special:三蒼|『三蒼』}}に曰く、「肄とは、習なり。」", "translation_tagged": "「肄」は、以四の反切（音はイ）である。{{special:三蒼|『三蒼』}}にいう、「肄とは、習（ならう・調練する）の意である。」"}, {"id": "v1_p72_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 72, "type": "本文", "raw_text": "漢罷三公官，置丞相、御史大夫。夏六月，以公爲丞相。", "kakikudashi": "漢は三公の官を罷め、丞相・御史大夫を置く。夏六月、公を以て丞相と為す。", "translation": "漢朝は三公の官を廃止し、丞相と御史大夫を設置した。夏六月、公を丞相に任じた。", "persons": "曹操", "places": "", "era_year": "建安13年（208年）正月〜6月", "source_book": "", "keywords": "三公,丞相,御史大夫", "raw_tagged": "漢罷{{office:三公|三公}}官，置{{office:丞相|丞相}}、{{office:御史大夫|御史大夫}}。夏六月，以{{person:曹操|公}}爲{{office:丞相|丞相}}。", "kakikudashi_tagged": "漢は{{office:三公|三公}}の官を罷め、{{office:丞相|丞相}}・{{office:御史大夫|御史大夫}}を置く。夏六月、{{person:曹操|公}}を以て{{office:丞相|丞相}}と為す。", "translation_tagged": "漢朝は{{office:三公|三公}}の官を廃止し、{{office:丞相|丞相}}と{{office:御史大夫|御史大夫}}を設置した。夏六月、{{person:曹操|公}}を{{office:丞相|丞相}}に任じた。"}, {"id": "v1_p72_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 72, "type": "裴注", "raw_text": "《獻帝起居注》曰：使太常徐璆即授印綬。御史大夫不領中丞，置長史一人。《先賢行狀》曰：璆字孟玉，廣陵人。少履清爽，立朝正色。歷任城、汝南、東海三郡，所在化行。被徵當還，爲袁術所劫。術僭號，欲授以上公之位，璆終不爲屈。術死後，璆得術璽，致之漢朝，拜衞尉太常；公爲丞相，以位讓璆焉。", "kakikudashi": "『献帝起居注』に曰く、太常の徐璆をして就きて印綬を授けしむ。御史大夫は中丞を領せず、長史一人を置く。『先賢行状』に曰く、璆は字を孟玉といい、広陵の人なり。少くして履み行うこと清爽にして、朝に立ちて色を正す。任城・汝南・東海の三郡を歴て、在る所に化行わる。徴されて当に還るべきに、袁術の劫かす所と為る。術は号を僭し、授くるに上公の位を以てせんと欲するも、璆は終に為に屈せず。術の死せし後、璆は術の璽を得て、之を漢朝に致し、衛尉・太常に拝せらる；公は丞相と為るや、位を以て璆に譲れり。", "translation": "『献帝起居注』にいう、太常の徐璆を遣わしてその場で印綬を授けさせた。御史大夫は御史中丞を統轄せず、長史一人を置いた。『先賢行状』にいう、徐璆は字を孟玉といい、広陵の人である。若いころから身の処し方が清廉爽快であり、朝廷に立っては毅然として顔色を正した。任城・汝南・東海の三郡を歴任し、赴任した先々で教化が行き届いた。中央に召し出されて帰京しようとしたとき、袁術に脅迫されて抑留された。袁術は帝号を僭称すると、上公の位を授けようとしたが、徐璆は最後まで屈服しなかった。袁術の死後、徐璆は袁術の持っていた伝国の玉璽を手に入れ、これを漢朝へ献上して、衛尉ついで太常に任じられた；公は丞相となると、その位を徐璆に譲ろうとした。", "persons": "徐璆,袁術,曹操", "places": "広陵,任城,汝南,東海", "era_year": "建安13年（208年）6月", "source_book": "献帝起居注,先賢行状", "keywords": "太常,御史大夫,御史中丞,長史,上公,衛尉,丞相", "raw_tagged": "{{special:引用史料|《獻帝起居注》}}曰：使{{office:太常|太常}}{{person:徐璆|徐璆}}即授印綬。{{office:御史大夫|御史大夫}}不領{{office:御史中丞|中丞}}，置{{office:長史|長史}}一人。{{special:引用史料|《先賢行狀》}}曰：{{person:徐璆|璆}}字{{person:徐璆|孟玉}}，{{place:広陵|廣陵}}人。少履清爽，立朝正色。歷{{place:任城|任城}}、{{place:汝南|汝南}}、{{place:東海|東海}}三郡，所在化行。被徵當還，爲{{person:袁術|袁術}}所劫。{{person:袁術|術}}僭號，欲授以{{office:上公|上公}}之位，{{person:徐璆|璆}}終不爲屈。{{person:袁術|術}}死後，{{person:徐璆|璆}}得{{person:袁術|術}}璽，致之漢朝，拜{{office:衛尉|衞尉}}{{office:太常|太常}}；{{person:曹操|公}}爲{{office:丞相|丞相}}，以位讓{{person:徐璆|璆}}焉。", "kakikudashi_tagged": "{{special:引用史料|『献帝起居注』}}に曰く、{{office:太常|太常}}の{{person:徐璆|徐璆}}をして就きて印綬を授けしむ。{{office:御史大夫|御史大夫}}は{{office:御史中丞|中丞}}を領せず、{{office:長史|長史}}一人を置く。{{special:引用史料|『先賢行状』}}に曰く、{{person:徐璆|璆}}は字を{{person:徐璆|孟玉}}といい、{{place:広陵|広陵}}の人なり。少くして履み行うこと清爽にして、朝に立ちて色を正す。{{place:任城|任城}}・{{place:汝南|汝南}}・{{place:東海|東海}}の三郡を歴て、在る所に化行わる。徴されて当に還るべきに、{{person:袁術|袁術}}の劫かす所と為る。{{person:袁術|術}}は号を僭し、授くるに{{office:上公|上公}}の位を以てせんと欲するも、{{person:徐璆|璆}}は終に為に屈せず。{{person:袁術|術}}の死せし後、{{person:徐璆|璆}}は{{person:袁術|術}}の璽を得て、之を漢朝に致し、{{office:衛尉|衛尉}}・{{office:太常|太常}}に拝せらる；{{person:曹操|公}}は{{office:丞相|丞相}}と為るや、位を以て{{person:徐璆|璆}}に譲れり。", "translation_tagged": "{{special:引用史料|『献帝起居注』}}にいう、{{office:太常|太常}}の{{person:徐璆|徐璆}}を遣わしてその場で印綬を授けさせた。{{office:御史大夫|御史大夫}}は{{office:御史中丞|御史中丞}}を統轄せず、{{office:長史|長史}}一人を置いた。{{special:引用史料|『先賢行状』}}にいう、{{person:徐璆|徐璆}}は字を{{person:徐璆|孟玉}}といい、{{place:広陵|広陵}}の人である。若いころから身の処し方が清廉爽快であり、朝廷に立っては毅然として顔色を正した。{{place:任城|任城}}・{{place:汝南|汝南}}・{{place:東海|東海}}の三郡を歴任し、赴任した先々で教化が行き届いた。中央に召し出されて帰京しようとしたとき、{{person:袁術|袁術}}に脅迫されて抑留された。{{person:袁術|袁術}}は帝号を僭称すると、{{office:上公|上公}}の位を授けようとしたが、{{person:徐璆|徐璆}}は最後まで屈服しなかった。{{person:袁術|袁術}}の死後、{{person:徐璆|徐璆}}は{{person:袁術|袁術}}の持っていた伝国の玉璽を手に入れ、これを漢朝へ献上して、{{office:衛尉|衛尉}}ついで{{office:太常|太常}}に任じられた；{{person:曹操|公}}は{{office:丞相|丞相}}となると、その位を{{person:徐璆|徐璆}}に譲ろうとした。"}, {"id": "v1_p73_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 73, "type": "本文", "raw_text": "秋七月，公南征劉表。八月，表卒，其子琮代，屯襄陽，劉備屯樊。九月，公到新野，琮遂降，備走夏口。公進軍江陵，下令荊州吏民，與之更始。乃論荊州服從之功，侯者十五人，以劉表大將文聘爲江夏太守，使統本兵，引用荊州名士韓嵩、鄧義等。", "kakikudashi": "秋七月、公は南のかた劉表を征す。八月、表は卒し、其の子の琮が代わり、襄陽に屯し、劉備は樊に屯す。九月、公が新野に到れば、琮は遂に降り、備は夏口に走る。公は軍を江陵に進め、荊州の吏民に令を下し、之と更始す。乃ち荊州の服従の功を論じ、侯たる者は十五人、劉表の大将の文聘を以て江夏太守と為し、本兵を統べしめ、荊州の名士の韓嵩・鄧義等を引用す。", "translation": "秋七月、公は南征して劉表を討った。八月、劉表が死去し、その子の劉琮が跡を継いで襄陽に駐屯し、劉備は樊に駐屯した。九月、公が新野に到着すると、劉琮はついに降伏し、劉備は夏口へ逃走した。公は軍を江陵へ進め、荊州の官吏・民衆に布告を下し、彼らとともに新たな始まりを約した。そこで荊州における帰順の功績を論じて、列侯に封じられた者は十五人にのぼり、劉表の大将であった文聘を江夏太守に任じて、従来の手勢をそのまま統率させ、荊州の名士である韓嵩・鄧義らを登用した。", "persons": "曹操,劉表,劉琮,劉備,文聘,韓嵩,鄧義", "places": "襄陽,樊,新野,夏口,江陵,荊州,江夏", "era_year": "建安13年（208年）7月〜9月", "source_book": "", "keywords": "列侯,太守", "raw_tagged": "秋七月，{{person:曹操|公}}南征{{person:劉表|劉表}}。八月，{{person:劉表|表}}卒，其子{{person:劉琮|琮}}代，屯{{place:襄陽|襄陽}}，{{person:劉備|劉備}}屯{{place:樊|樊}}。九月，{{person:曹操|公}}到{{place:新野|新野}}，{{person:劉琮|琮}}遂降，{{person:劉備|備}}走{{place:夏口|夏口}}。{{person:曹操|公}}進軍{{place:江陵|江陵}}，下令{{place:荊州|荊州}}吏民，與之更始。乃論{{place:荊州|荊州}}服從之功，{{office:列侯|侯}}者十五人，以{{person:劉表|劉表}}大將{{person:文聘|文聘}}爲{{place:江夏|江夏}}{{office:太守|太守}}，使統本兵，引用{{place:荊州|荊州}}名士{{person:韓嵩|韓嵩}}、{{person:鄧義|鄧義}}等。", "kakikudashi_tagged": "秋七月、{{person:曹操|公}}は南のかた{{person:劉表|劉表}}を征す。八月、{{person:劉表|表}}は卒し、其の子の{{person:劉琮|琮}}が代わり、{{place:襄陽|襄陽}}に屯し、{{person:劉備|劉備}}は{{place:樊|樊}}に屯す。九月、{{person:曹操|公}}が{{place:新野|新野}}に到れば、{{person:劉琮|琮}}は遂に降り、{{person:劉備|備}}は{{place:夏口|夏口}}に走る。{{person:曹操|公}}は軍を{{place:江陵|江陵}}に進め、{{place:荊州|荊州}}の吏民に令を下し、之と更始す。乃ち{{place:荊州|荊州}}の服従の功を論じ、{{office:列侯|侯}}たる者は十五人、{{person:劉表|劉表}}の大将の{{person:文聘|文聘}}を以て{{place:江夏|江夏}}{{office:太守|太守}}と為し、本兵を統べしめ、{{place:荊州|荊州}}の名士の{{person:韓嵩|韓嵩}}・{{person:鄧義|鄧義}}等を引用す。", "translation_tagged": "秋七月、{{person:曹操|公}}は南征して{{person:劉表|劉表}}を討った。八月、{{person:劉表|劉表}}が死去し、その子の{{person:劉琮|劉琮}}が跡を継いで{{place:襄陽|襄陽}}に駐屯し、{{person:劉備|劉備}}は{{place:樊|樊}}に駐屯した。九月、{{person:曹操|公}}が{{place:新野|新野}}に到着すると、{{person:劉琮|劉琮}}はついに降伏し、{{person:劉備|劉備}}は{{place:夏口|夏口}}へ逃走した。{{person:曹操|公}}は軍を{{place:江陵|江陵}}へ進め、{{place:荊州|荊州}}の官吏・民衆に布告を下し、彼らとともに新たな始まりを約した。そこで{{place:荊州|荊州}}における帰順の功績を論じて、{{office:列侯|列侯}}に封じられた者は十五人にのぼり、{{person:劉表|劉表}}の大将であった{{person:文聘|文聘}}を{{place:江夏|江夏}}{{office:太守|太守}}に任じて、従来の手勢をそのまま統率させ、{{place:荊州|荊州}}の名士である{{person:韓嵩|韓嵩}}・{{person:鄧義|鄧義}}らを登用した。"}, {"id": "v1_p73_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 73, "type": "裴注", "raw_text": "衞恒《四體書勢序》曰：上谷王次仲善隷書，始爲楷法。至靈帝好書，世多能者。而師宜官爲最，甚矜其能，每書，輙削焚其札。梁鵠乃益爲版而飲之酒，候其醉而竊其札，鵠卒以攻書至選部尚書。於是公欲爲洛陽令，鵠以爲北部尉。鵠後依劉表。及荊州平，公募求鵠，鵠懼，自縛詣門，署軍假司馬，使在祕書，以勤書自効。公甞懸著帳中，及以釘壁玩之，謂勝宜官。鵠字孟皇，安定人。魏宮殿題署，皆鵠書也。皇甫謐《逸士傳》曰：汝南王儁，字子文，少爲范滂、許章所識，與南陽岑晊善。公之爲布衣，特愛儁；儁亦稱公有治世之具。及袁紹與弟術喪母，歸葬汝南，儁與公會之，會者三萬人。公於外密語儁曰：「天下將亂，爲亂魁者必此二人也。欲濟天下，爲百姓請命，不先誅此二子，亂今作矣。」儁曰：「如卿之言，濟天下者，舍卿復誰？」相對而笑。儁爲人外靜而內明，不應州郡三府之命。公車徵，不到，避地居武陵，歸儁者一百餘家。帝之都許，復徵爲尚書，又不就。劉表見紹彊，陰與紹通，儁謂表曰：「曹公，天下之雄也，必能興霸道，繼桓、文之功者也。今乃釋近而就遠，如有一朝之急，遙望漠北之救，不亦難乎！」表不從。儁年六十四，以壽終于武陵，公聞而哀傷。及平荊州，自臨江迎喪，改葬于江陵，表爲先賢也。", "kakikudashi": "衛恒の『四体書勢序』に曰く、上谷の王次仲は隷書を善くし、始めて楷法を為る。霊帝が書を好むに至り、世に能くする者多し。而して師宜官が最たりて、甚だ其の能に矜り、書する毎に、輒ち其の札を削りて焚く。梁鵠は乃ち益ます版を為りて之に酒を飲ませ、其の酔うを候いて其の札を窃み、鵠は卒に書を攻むるを以て選部尚書に至る。是に於いて公は洛陽令と為らんと欲せしも、鵠は以て北部尉と為す。鵠は後に劉表に依る。荊州の平らぐに及び、公は鵠を募り求め、鵠は懼れ、自ら縛して門に詣り、軍仮司馬に署せられ、秘書に在らしめ、書に勤むるを以て自ら効さしむ。公は嘗て帳中に懸け著け、及び以て壁に釘うちて之を玩び、宜官に勝れりと謂う。鵠は字を孟皇といい、安定の人なり。魏の宮殿の題署は、皆な鵠の書なり。皇甫謐の『逸士伝』に曰く、汝南の王儁は、字を子文といい、少くして范滂・許章の識る所と為り、南陽の岑晊と善し。公の布衣たりしとき、特に儁を愛す；儁も亦た公に治世の具有りと称す。袁紹と弟・術とが母を喪い、汝南に帰葬するに及び、儁は公と之に会し、会する者は三万人なり。公は外に於いて密かに儁に語りて曰く、「天下は将に乱れんとし、乱魁と為る者は必ず此の二人なり。天下を済い、百姓の為に命を請わんと欲するも、先に此の二子を誅せざれば、乱は今にも作らん。」儁曰く、「卿の言の如くんば、天下を済う者は、卿を舎きて復た誰ぞや？」相い対して笑う。儁は人と為り外は静にして内は明、州郡・三府の命に応ぜず。公車もて徴さるるも、到らず、地を避けて武陵に居り、儁に帰する者は一百余家なり。帝の許に都するや、復た徴して尚書と為すも、又た就かず。劉表は紹の強きを見て、陰かに紹と通ずれば、儁は表に謂いて曰く、「曹公は、天下の雄なり、必ず能く覇道を興し、桓・文の功を継ぐ者なり。今乃ち近きを釈てて遠きに就く、如し一朝の急有りて、遥かに漠北の救いを望むとも、亦た難からずや！」表は従わず。儁は年六十四にして、寿を以て武陵に終え、公は聞きて哀傷す。荊州を平らぐるに及び、自ら江に臨みて喪を迎え、江陵に改葬し、表して先賢と為すなり。", "translation": "衛恒の『四体書勢序』にいう、上谷の王次仲は隷書に優れ、初めて楷法を作った。霊帝が書を好む時代になると、世間に優れた書き手が数多く現れた。なかでも師宜官が第一人者であったが、ひどく自分の才能を誇り、字を書くたびに、いつもその木札を削り取って焼き捨てていた。そこで梁鵠はたくさんの木版を用意して彼に酒を飲ませ、酔いつぶれた隙をうかがってその木札を盗み取って学び、梁鵠はついに書を極めたことによって選部尚書にまで昇った。このとき公は洛陽令になることを望んだが、梁鵠は公を北部尉に任じた。梁鵠はのちに劉表を頼って身を寄せた。荊州が平定されると、公は懸賞をかけて梁鵠を捜し求めたため、梁鵠は恐れ、自ら縄目について軍門に出頭したところ、軍仮司馬に任じられ、秘書に配属されて、書の揮毫に励むことで功を償わせられた。公はいつもその書を帳の中に懸け、また壁に釘で留めて鑑賞し、師宜官よりも優れていると評した。梁鵠は字を孟皇といい、安定の人である。魏の宮殿の扁額の題字は、すべて梁鵠の書である。皇甫謐の『逸士伝』にいう、汝南の王儁は、字を子文といい、若いころから范滂・許章に認められ、南陽の岑晊と親交があった。公がまだ無位無官の布衣であったころ、とりわけ王儁を敬愛した；王儁もまた公には世を治める器量があると称賛した。袁紹と弟の袁術が母を亡くし、汝南へ帰葬したとき、王儁は公とともにその葬儀に会葬したが、会葬者は三万人にのぼった。公は外でひそかに王儁に語って言った、「天下はこれから乱れようとしており、乱の首魁となる者は必ずこの二人である。天下を救い、万民のために命を守ろうとしても、先にこの二人を誅殺しなければ、戦乱は今にも起こるであろう。」王儁は言った、「あなたの言葉の通りなら、天下を救う者は、あなたをおいてほかに誰がいようか？」二人は顔を見合わせて笑った。王儁は人柄が外見は物静かで内面は聡明であり、州郡や三府からの辟召に応じなかった。公車の礼をもって朝廷から召し出されたが、出仕せず、戦乱を避けて武陵に移り住むと、王儁を慕って身を寄せた者は百余家にのぼった。献帝が許に都を置くと、再び召し出して尚書に任じたが、やはり就任しなかった。劉表は袁紹が強盛なのを見て、ひそかに袁紹とよしみを結んだため、王儁は劉表に語って言った、「曹公は、天下の英雄であり、必ずや覇道を興し、斉の桓公・晋の文公の功業を継ぐお方です。それなのにいま近くの者を見捨てて遠くの者に就いておられますが、もし一朝にして急変が生じたとき、はるか漠北からの救援を待ち望んだとしても、なんと難しいことではありませんか！」劉表は従わなかった。王儁は六十四歳で、天寿を全うして武陵で没し、公はこれを聞いて深く哀悼した。荊州を平定するにおよび、自ら長江に臨んでその棺を出迎え、江陵に改葬して、先賢として顕彰した。", "persons": "衛恒,王次仲,霊帝,師宜官,梁鵠,曹操,劉表,皇甫謐,王儁,范滂,許章,岑晊,袁紹,袁術,献帝,斉桓公,晋文公", "places": "上谷,洛陽,荊州,安定,汝南,南陽,武陵,許,漠北,長江,江陵", "era_year": "建安13年（208年）9月", "source_book": "四体書勢序,逸士伝", "keywords": "尚書,県令,北部尉,司馬,秘書,三公,公車", "raw_tagged": "{{person:衛恒|衞恒}}{{special:引用史料|《四體書勢序》}}曰：{{place:上谷|上谷}}{{person:王次仲|王次仲}}善隷書，始爲楷法。至{{person:霊帝|靈帝}}好書，世多能者。而{{person:師宜官|師宜官}}爲最，甚矜其能，每書，輙削焚其札。{{person:梁鵠|梁鵠}}乃益爲版而飲之酒，候其醉而竊其札，{{person:梁鵠|鵠}}卒以攻書至{{office:尚書|選部尚書}}。於是{{person:曹操|公}}欲爲{{place:洛陽|洛陽}}{{office:県令|令}}，{{person:梁鵠|鵠}}以爲{{office:北部尉|北部尉}}。{{person:梁鵠|鵠}}後依{{person:劉表|劉表}}。及{{place:荊州|荊州}}平，{{person:曹操|公}}募求{{person:梁鵠|鵠}}，{{person:梁鵠|鵠}}懼，自縛詣門，署{{office:司馬|軍假司馬}}，使在{{office:秘書|祕書}}，以勤書自効。{{person:曹操|公}}甞懸著帳中，及以釘壁玩之，謂勝{{person:師宜官|宜官}}。{{person:梁鵠|鵠}}字{{person:梁鵠|孟皇}}，{{place:安定|安定}}人。魏宮殿題署，皆{{person:梁鵠|鵠}}書也。{{person:皇甫謐|皇甫謐}}{{special:引用史料|《逸士傳》}}曰：{{place:汝南|汝南}}{{person:王儁|王儁}}，字{{person:王儁|子 rson:張憙|憙}}至，乃走。{{person:曹操|公}}至{{place:赤壁|赤壁}}，與{{person:劉備|備}}戰，不利。於是大疫，吏士多死者，乃引軍還。{{person:劉備|備}}遂有{{place:荊州|荊州}}、{{place:江南|江南}}諸郡。", "kakikudashi_tagged": "{{place:益州|益州}}{{office:牧|牧}}の{{person:劉璋|劉璋}}が始めて徴役を受け、兵を遣わして軍に給す。十二月、{{person:孫権|孫権}}が{{person:劉備|備}}の為に{{place:合肥|合肥}}を攻む。{{person:曹操|公}}は{{place:江陵|江陵}}より{{person:劉備|備}}を征し、{{place:巴丘|巴丘}}に至り、{{person:張憙|張憙}}を遣わして{{place:合肥|合肥}}を救わしむ。{{person:孫権|権}}は{{person:張憙|憙}}の至るを聞き、乃ち走る。{{person:曹操|公}}は{{place:赤壁|赤壁}}に至り、{{person:劉備|備}}と戦うも、利あらず。是に於いて大いに疫し、吏士に死する者多く、乃ち軍を引きて還る。{{person:劉備|備}}は遂に{{place:荊州|荊州}}・{{place:江南|江南}}の諸郡を有す。", "translation_tagged": "{{place:益州|益州}}{{office:牧|牧}}の{{person:劉璋|劉璋}}が初めて朝廷の徴発を受け入れ、兵を派遣して軍に補充した。十二月、{{person:孫権|孫権}}が{{person:劉備|劉備}}のために{{place:合肥|合肥}}を攻めた。{{person:曹操|公}}は{{place:江陵|江陵}}から{{person:劉備|劉備}}の征討に向かい、{{place:巴丘|巴丘}}に至ると、{{person:張憙|張憙}}を派遣して{{place:合肥|合肥}}を救援させた。{{person:孫権|孫権}}は{{person:張憙|張憙}}が到着すると聞いて、撤退した。{{person:曹操|公}}は{{place:赤壁|赤壁}}に至り、{{person:劉備|劉備}}と戦ったが、戦況は不利であった。このとき大疫病が発生して、将兵に死者が続出したため、軍を引いて帰還した。{{person:劉備|劉備}}はついに{{place:荊州|荊州}}および{{place:江南|江南}}の諸郡を領有した。"}, {"id": "v1_p73_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 73, "type": "裴注", "raw_text": "《山陽公載記》曰：公船艦爲備所燒，引軍從華容道步歸，遇泥濘，道不通，天又大風，悉使羸兵負草填之，騎乃得過。羸兵爲人馬所蹈藉，陷泥中，死者甚衆。軍旣得出，公大喜，諸將問之，公曰：「劉備，吾儔也。但得計少晚；向使早放火，吾徒無類矣。」備尋亦放火而無所及。孫盛異同評曰：案吳志，劉備先破公軍，然後權攻合肥，而此記云權先攻合肥，後有赤壁之事。二者不同，吳志爲是。", "kakikudashi": "『山陽公載記』に曰く、公の船艦は備の焼く所と為り、軍を引きて華容道より歩して帰るに、泥濘に遇いて、道通ぜず、天も又た大風なれば、悉く羸兵をして草を負いて之を填めしめ、騎は乃ち過ぐるを得たり。羸兵は人馬の蹈藉する所と為り、泥中に陥りて、死する者甚だ衆し。軍が既に出づるを得て、公は大いに喜び、諸将が之を問えば、公曰く、「劉備は、吾が儔なり。但だ計を得ること少しく晩きのみ；向に早く火を放たしめば、吾が徒は類無かりしならん。」備は尋いで亦た火を放つも及ぶ所無し。孫盛の『異同評』に曰く、呉志を案ずるに、劉備が先に公の軍を破り、然る後に権が合肥を攻むるに、此の記は権が先に合肥を攻め、後に赤壁の事有りと云う。二者は同じからざるも、呉志を是と為す。", "translation": "『山陽公載記』にいう、公の船艦は劉備に焼き払われ、軍を率いて華容道より徒歩で撤退したが、ぬかるみに遭遇して道が通れず、おまけに激しい風まで吹いたため、弱った兵士たち全員に草を背負わせてぬかるみを埋めさせ、騎兵はようやく通過することができた。弱った兵士たちは人馬に踏みつけられ、泥の中に沈んで、おびただしい数の死者が出た。軍が脱出を果たすと、公は大いに喜び、諸将がそのわけを尋ねると、公は言った、「劉備は、私の好敵手である。ただ計略を思いつくのが少し遅かっただけだ；もし先ほど早くに火を放っていたら、我々は全滅していたであろう   const PERSONS_INFO = {"曹操": {"name": "曹操（そうそう：字は孟徳、幼名は阿瞞・吉利、太祖武皇帝）", "wiki_title": "曹操", "role": "魏の基礎を築いた覇王（太祖武皇帝）・後漢の丞相・魏王", "ai_desc": "沛国譙県の人（155年〜220年）。前漢の相国・曹参の末裔とされ、中常侍・大長秋・費亭侯となった曹騰の養子・曹嵩（太尉）の子として生まれた。後漢末の動乱期に兗州を拠点として献帝を許に迎え、官渡の戦いで袁紹を破って華北を統一、丞相・魏公・魏王に昇り、没後に子の曹丕（文帝）が魏を建国すると「太祖武皇帝」と追尊された。"}, "曹参": {"name": "曹参（そうしん／そうさん：字は敬伯、前漢の相国・平陽侯）", "wiki_title": "曹参", "role": "前漢創業の功臣・第2代相国・平陽懿侯", "ai_desc": "沛県の人（?〜前190年）。前漢の高祖・劉邦の挙兵に従って数々の戦功を立て、平陽侯（一万六百戸）に封じられた。蕭何の没後に第2代の相国となり、黄老の無為自然の治を採って「蕭規曹随」と称えられた（『史記』巻54・曹相国世家）。曹操の一族はその末裔とされる。"}, "王沈": {"name": "王沈（おうしん：字は処道、『魏書』の撰者）", "wiki_title": "王沈 (西晋)", "role": "魏末〜西晋の政治家・歴史家（『魏書』四十余巻の撰者）", "ai_desc": "太原郡晋陽県の人（?〜266年）。魏の正元年間以降、荀顗・阮籍らとともに魏の国史『魏書』を編纂した（『晋書』巻39・王沈伝）。裴松之は『三國志』注においてこの王沈『魏書』を多数引用している。"}, "黄帝": {"name": "黄帝（こうてい：古代中国の伝説上の帝王・五帝の筆頭）", "wiki_title": "黄帝", "role": "中国神話・五帝の筆頭（有熊氏・軒轅氏）", "ai_desc": "『史記』五帝本紀の冒頭に記される古代中国の伝説上の聖王。王沈『魏書』によれば、曹氏の遠祖は黄帝から出て、その孫の顓頊（高陽氏）の代に陸終の子・安が曹姓を賜ったとされる。"}, "顓頊": {"name": "顓頊・高陽（せんぎょく／こうよう：五帝の一・高陽氏）", "wiki_title": "顓頊", "role": "古代中国の五帝の一（黄帝の孫・高陽氏）", "ai_desc": "黄帝の孫（昌意の子）で、高陽に興ったことから「高陽氏」と称される古代の聖王（『史記』五帝本紀）。その子孫である陸終の第五子・安が曹姓の祖となったとされる。"}, "陸終": {"name": "陸終（りくしゅう：顓頊の後裔・祝融氏の呉回の子）", "wiki_title": "陸終", "role": "古代の伝承上の人物（六子を生み、第五子・安が曹姓の祖）", "ai_desc": "『史記』巻40・楚世家および『大戴礼記』帝繋篇に見える顓頊（高陽氏）の後裔。鬼方氏の女・女潰を娶って六人の男子（昆吾・参胡・彭祖・会人・曹姓の安・季連）を生み、第五子の安が曹姓（邾国）の祖、第六子の季連が羋姓（楚国）の祖となった。"}, "曹安": {"name": "安・曹安（あん／そうあん：陸終の第五子・曹姓の始祖）", "wiki_title": "曹挾", "role": "陸終の第五子・曹姓の始祖", "ai_desc": "顓頊（高陽氏）の後裔である陸終の第五子。曹姓を賜り、その子孫である曹挾（曹俠）が周の武王によって邾（現在の山東省鄒城市）に封じられた（『史記』楚世家、王沈『魏書』）。"}, "武王": {"name": "武王・周武王（ぶおう：周王朝の初代天子・姫発）", "wiki_title": "武王 (周)", "role": "周王朝の建国者（文王の子）", "ai_desc": "牧野の戦いで殷の紂王を討って殷王朝を滅ぼし、周王朝を創始した天子。古の聖王（五帝・三王）の末裔を各地に封じた際、曹安の後裔である曹挾（曹俠）を邾国に封じた。"}, "曹挾": {"name": "曹挾・曹俠（そうきょう：邾国の初代君主）", "wiki_title": "曹挾", "role": "周初の諸侯・邾（鄒）国の始封君主", "ai_desc": "陸終の第五子・安（曹姓）の末裔。周の武王が殷を滅ぼした際、古の帝王の後裔として邾（現在の山東省済寧市鄒城市）に封じられ、邾国（のちの鄒国）の始祖となった。邾国は春秋時代に諸侯の会盟に参加したが、戦国時代に楚に滅ぼされ、子孫の一部が沛に移り住んだとされる。"}, "劉邦": {"name": "高祖・劉邦（こうそ／りゅうほう：前漢の初代皇帝）", "wiki_title": "劉邦", "role": "前漢の初代皇帝（太祖高皇帝）", "ai_desc": "沛県豊邑の人（前256年または前247年〜前195年）。秦末に沛県で挙兵し、同郷の蕭何・曹参らを率いて秦を滅ぼし、楚漢戦争で項羽を破って前漢王朝を建国した。"}, "桓帝": {"name": "桓帝（かんてい：後漢の第11代皇帝・劉志）", "wiki_title": "桓帝", "role": "後漢の第11代皇帝（在位146年〜167年）", "ai_desc": "章帝の曽孫・蠡吾侯劉翼の子（132年〜167年）。質帝が梁冀に毒殺された後、曹騰らの進言もあって15歳で即位した。曹騰が先帝以来の旧臣として忠孝顕著であったことから、曹騰を費亭侯に封じ、特進の位を加えた。"}, "曹騰": {"name": "曹騰（そうとう：字は季興、曹操の祖父・中常侍・大長秋・費亭侯、追尊・高皇帝）", "wiki_title": "曹騰", "role": "後漢の中常侍・大長秋・費亭侯（曹操の祖父、魏の高皇帝）", "ai_desc": "沛国譙県の人、曹節（字は元偉）の末子。若くして黄門従官となり、永寧元年（120年）に鄧太后の詔で皇太子（順帝）の学友に選抜された。順帝即位後に小黄門から中常侍・大長秋へ昇り、安帝・順帝・沖帝・質帝・桓帝の宮中に三十余年奉職して一度も過失がなく、虞放・辺韶・延固・張温・張奐・堂谿典ら多くの名士を推挙し、自らを弾劾した种暠をも称揚した。桓帝即位後に費亭侯・特進となり、魏の明帝の太和3年（229年）に「高皇帝」と追尊された（『後漢書』巻78・曹騰伝）。"}, "司馬彪": {"name": "司馬彪（しばひょう：字は紹統、『続漢書』の撰者）", "wiki_title": "司馬彪", "role": "西晋の皇族・歴史家（『続漢書』『九州春秋』の撰者）", "ai_desc": "司馬懿の弟・司馬進の孫（240年代〜306年）。西晋の秘書丞・散騎常侍を務め、後漢一代の歴史書『続漢書』八十三巻および『九州春秋』を著した（『晋書』巻82・司馬彪伝）。"}, "曹節": {"name": "曹節（そうせつ：字は元偉、曹騰の父・曹操の曽祖父）", "wiki_title": "曹節 (曹騰の父)", "role": "沛国譙県の長者（曹騰の父・曹操の曽祖父）", "ai_desc": "沛国譙県の人、字は元偉（後漢末・霊帝期の宦官である曹節〔字は漢豊〕とは同姓同名の別人）。情け深く温厚な人柄で知られ、隣人が逃げた豚を曹節の豚と誤認して持ち帰った際も争わず、後に本物の豚が戻って恥じ入った隣人が謝罪に訪れた際も笑って受け入れたため、郷里の人々から深く敬慕された。伯興・仲興・叔興・季興（曹騰）の四子をもうけた。"}, "曹伯興": {"name": "曹伯興（そうはくこう：曹節の長男・曹騰の長兄）", "wiki_title": "曹節 (曹騰の父)", "role": "曹節の長男（曹騰の長兄）", "ai_desc": "沛国譙県の人。曹節（字は元偉）の長男で、仲興・叔興・季興（曹騰）の長兄にあたる。"}, "曹仲興": {"name": "曹仲興（そうちゅうこう：曹節の次男・曹騰の次兄）", "wiki_title": "曹節 (曹騰の父)", "role": "曹節の次男（曹騰の次兄）", "ai_desc": "沛国譙県の人。曹節（字は元偉）の次男で、曹騰の兄にあたる。"}, "曹叔興": {"name": "曹叔興（そうしゅくこう：曹節の三男・曹騰の三兄）", "wiki_title": "曹節 (曹騰の父)", "role": "曹節の三男（曹騰のすぐ上の兄）", "ai_desc": "沛国譙県の人。曹節（字は元偉）の三男（原文「次子叔興」）で、末子・曹騰（字は季興）の兄にあたる。"}, "鄧太后": {"name": "鄧太后・和熹鄧皇后（とうたいこう：後漢・和帝の皇后、鄧綏）", "wiki_title": "鄧綏", "role": "後漢・和帝の皇后（皇太后として殤帝・安帝期に臨朝称制）", "ai_desc": "太傅・鄧禹の孫娘（81年〜121年）。和帝の崩御後、皇太后として殤帝・安帝の二代にわたり16年間臨朝称制し、学問・儒教の振興と清廉な政治で名高かった。永寧元年（120年）、皇太子・劉保（のちの順帝）の学友として年少温謹な曹騰を抜擢させた。"}, "順帝": {"name": "順帝（じゅんてい：後漢の第8代皇帝・劉保）", "wiki_title": "順帝 (漢)", "role": "後漢の第8代皇帝（在位125年〜144年）", "ai_desc": "安帝の皇子（115年〜144年）。永寧元年（120年）に皇太子に立てられた際、学友に配属された曹騰を深く親愛し、延光4年（125年）に即位すると曹騰を小黄門から中常侍・大長秋へと重用した。"}, "虞放": {"name": "虞放（ぐほう：字は子仲、曹騰が推挙した名士・のち司空）", "wiki_title": "虞放", "role": "後漢の司空・名士（陳留郡の人）", "ai_desc": "陳留郡東昏県の人（?〜169年）。曹騰からその賢能を称揚・推薦されて中央で昇進し、桓帝の延熹4年（161年）に司空に至った。のちに第二次党錮の禍（169年）で処刑された（『後漢書』巻67・党錮伝）。"}, "辺韶": {"name": "辺韶（へんしょう：字は孝先、曹騰が推挙した儒学者・文人）", "wiki_title": "辺韶", "role": "後漢の儒学者・尚書令・陳相（陳留郡の人）", "ai_desc": "陳留郡浚儀県の人。博学と文章の才で知られ、昼寝を弟子にからかわれた際に「辺を姓とし孝先を字とす、腹便便として五経の笥（箱）なり」と即興で応じた逸話で名高い。曹騰の推挙を受けて太中大夫・尚書令・陳相などを歴任した（『後漢書』巻80上・文苑伝）。"}, "延固": {"name": "延固（えんこ：『後漢書』では延篤〔字は叔堅〕、南陽郡の名士）", "wiki_title": "延篤", "role": "後漢の儒学者・京兆尹（南陽郡の人）", "ai_desc": "南陽郡犨県の人。『後漢書』巻64・延篤伝および巻78・曹騰伝では「延篤（字は叔堅）」と記される（『続漢書』は桓帝の諱「志」や音通により「延固」と表記）。左氏伝に通じた名儒で、曹騰に称揚されて議郎・侍中・左馮翊・京兆尹を歴任した。"}, "張温": {"name": "張温（ちょうおん：字は伯慎、南陽郡出身・のち太尉・司空）", "wiki_title": "張温 (後漢)", "role": "後漢の司空・太尉・車騎将軍（南陽郡穣県の人）", "ai_desc": "南陽郡穣県の人（?〜191年）。若くして曹騰にその才能を称揚されて引き立てられ、霊帝期に大司農・司空・車騎将軍・太尉を歴任した（『後漢書』巻56・張晧伝附張温伝）。"}, "張奐": {"name": "張奐（ちょうかん：字は然明、涼州三明の一・大司農・太常）", "wiki_title": "張奐", "role": "後漢の名将・儒学者・太常・大司農（本貫は敦煌郡、のち弘農郡華陰県に移籍）", "ai_desc": "敦煌郡淵泉県の人（104年〜181年）。皇甫規・段熲とともに「涼州三明」と称された名将・清流知識人で、辺境統治の功により弘農郡華陰県への移籍を許されたため「弘農の張奐」と呼ばれる。曹騰から推挙を受けて護匈奴中郎将・度遼将軍・大司農・太常など公卿の高位に至った（『後漢書』巻65・張奐伝）。"}, "堂谿典": {"name": "堂谿典（どうけいてん：字は伯並、潁川郡の儒学者・五官中郎将）", "wiki_title": "堂谿典", "role": "後漢の儒学者・侍中・五官中郎将（潁川郡の人）", "ai_desc": "潁川郡陽翟県の人。古文尚書・公羊伝に精通し、曹騰の推挙を受けて侍中・五官中郎将に昇り、熹平4年（175年）には蔡邕らとともに熹平石経の校定・揮毫に携わった（『後漢書』巻60下・蔡邕伝、巻64・延篤伝注）。"}, "种暠": {"name": "种暠（ちゅうこう：字は景伯、益州刺史・のち司徒）", "wiki_title": "种暠", "role": "後漢の益州刺史・涼州刺史・度遼将軍・司徒（河南郡洛陽県の人）", "ai_desc": "河南郡洛陽県の人（103年〜163年）。益州刺史であった際、蜀郡太守が上計吏を通じて中常侍・曹騰に送った書状を函谷関で検閲・発見し、太守とあわせて曹騰を「内臣外交」の罪で弾劾した。しかし曹騰は种暠を少しも恨まず、かえって「主君に仕える節義に適っている」と称賛し続けたため、延熹4年（161年）に司徒に昇った种暠は「今日私が三公となれたのは曹常侍の恩義によるものだ」と語った（『後漢書』巻56・种暠伝）。"}, "曹嵩": {"name": "曹嵩（そうすう：字は巨高、曹操の父・太尉、追尊・太皇帝）", "wiki_title": "曹嵩", "role": "後漢の太尉・費亭侯（曹騰の養子・曹操の父、魏の太皇帝）", "ai_desc": "中常侍・費亭侯であった曹騰の養子となり、その爵位を継いだ（?〜193年）。『三國志』本文は「その出生の詳しい経緯を明らかにできる者はいなかった」とし、裴注が引く『曹瞞伝』および郭頒『世語』は「夏侯氏の子で夏侯惇の叔父にあたる」と記す。司隷校尉から霊帝に抜擢されて大司農・大鴻臚を歴任し、中平4年（187年）に崔烈に代わって太尉に至った。魏の黄初元年（220年）に「太皇帝」と追尊された。"}, "霊帝": {"name": "霊帝（れいてい：後漢の第12代皇帝・劉宏）", "wiki_title": "霊帝", "role": "後漢の第12代皇帝（在位168年〜189年）", "ai_desc": "河間孝王・劉開の曽孫（156年〜189年）。桓帝の崩御後に迎立された。売官制度を大々的に行って三公・九卿の官位にも礼銭（献納金）を課し、曹嵩を大司農・大鴻臚から太尉に任じた（『後漢書』巻8・霊帝紀、巻78・曹騰伝附曹嵩伝）。"}, "崔烈": {"name": "崔烈（さいれつ：字は威考、曹嵩の前任の太尉）", "wiki_title": "崔烈", "role": "後漢の太尉・城門校尉（涿郡安平県の人、崔駰の孫・崔州平の父）", "ai_desc": "涿郡安平県の人（?〜192年）。北方の名門・博陵崔氏の出身で、霊帝の中平2年（185年）に五百万銭を納めて司徒から太尉となり、世人から「銅臭（銭の臭いがする）」と評された。中平4年（187年）11月に太尉を退き、代わって曹嵩が太尉に就任した（『後漢書』巻52・崔駰伝附崔烈伝）。"}, "郭頒": {"name": "郭頒（かくはん：西晋の史家・『魏晋世語』の撰者）", "wiki_title": "魏晋世語", "role": "西晋の官僚・歴史家（襄陽県令、『魏晋世語』の撰者）", "ai_desc": "西晋の時代に襄陽県令などを務め、後漢末から西晋にかけての逸話集『魏晋世語』（略称『世語』）を著した。裴松之は『三國志』注で同書を頻繁に引用している。"}, "夏侯惇": {"name": "夏侯惇（かこうとん：字は元譲、曹操の腹心・大将軍）", "wiki_title": "夏侯惇", "role": "曹操旗揚げ以来の宿将・大将軍・高安郷侯（沛国譙県の人）", "ai_desc": "沛国譙県の人（?〜220年）、前漢の夏侯嬰の末裔。『曹瞞伝』および郭頒『世語』によれば、曹操の父・曹嵩はもともと夏侯氏の子で夏侯惇の叔父にあたり、曹操と夏侯惇は従兄弟（いとこ）の関係にあったとされる。曹操の挙兵当初から常に軍の重鎮として従い、のちに大将軍に至った（『三國志』巻9・夏侯惇伝）。"}, "橋玄": {"name": "橋玄（きょうげん：字は公祖、後漢の太尉・若き曹操の真価を見抜いた名臣）", "wiki_title": "橋玄", "role": "後漢の太尉・司空・司徒（梁国睢陽県の人）", "ai_desc": "梁国睢陽県の人（110年〜184年）。剛直果断な名臣として度遼将軍・河南尹・司空・司徒・太尉を歴任しながらも、清廉潔白で没時には棺を安置する資産さえないほどであった。まだ無名であった若き曹操と会見して「天下はまさに乱れようとしており、これを安んずることができるのは君であろう」「私は老いた、願わくは妻子を託したい」と激賞し、人物批評家の許劭（許子将）と交わるよう勧めた（『後漢書』巻51・橋玄伝）。後の建安7年（202年）、曹操は橋玄の墓を通りかかった際に自ら祭文を捧げてその知遇に涙した。"}, "何顒": {"name": "何顒（かぎょう：字は伯求、南陽の名士・党人）", "wiki_title": "何顒", "role": "後漢末の名士・北軍中候（南陽郡棘陽県の人）", "ai_desc": "南陽郡棘陽県の人（?〜190年頃）。太学に遊んで郭泰・賈彪らと交わり、党錮の禍では変名して汝南・南陽の間で多くの党人を救出した。若き曹操を見て「漢室はまさに滅びようとしており、天下を安んずる者は必ずこの人である」と評し、橋玄とともに最も早く曹操の器量を見抜いた人物として知られる（『後漢書』巻67・党錮伝附何顒伝）。"}, "張璠": {"name": "張璠（ちょうはん：東晋の歴史家・『後漢紀』三十巻の撰者）", "wiki_title": "後漢紀", "role": "東晋の官僚・歴史家（『漢紀〔後漢紀〕』三十巻の撰者）", "ai_desc": "東晋に仕えて著作郎・令狐県令などを務め、後漢の歴史を通史としてまとめた『後漢紀』（裴注では『漢紀』と表記）三十巻を著した。完本は散逸したが、裴松之の『三國志』注に多くの逸文が保存されている。"}, "許劭": {"name": "許劭（きょしょう：字は子将、「月旦評」で名高い汝南の人物批評家）", "wiki_title": "許劭", "role": "後漢末の人物批評家・汝南郡功曹（汝南郡平輿県の人）", "ai_desc": "汝南郡平輿県の人（150年〜195年）。従兄の許靖とともに毎月朔日（ついたち）に郷里の人物を品評する「月旦評」を主宰し、その評価によって人物の声価が決まるほどの影響力を持った。橋玄の勧めで訪れた若き曹操から「私はどのような人物か」と問われ、「治世の能臣、乱世の姦雄」と評したことで知られる（『後漢書』巻68・許劭伝）。"}, "孫盛": {"name": "孫盛（そんせい：字は安国、『魏氏春秋』『異同雑語』の撰者）", "wiki_title": "孫盛", "role": "東晋の歴史家・長沙太守・秘書監（太原郡中都県の人）", "ai_desc": "太原郡中都県の人（302年〜373年）。東晋の桓温の参軍・長沙太守・秘書監を歴任し、『魏氏春秋』『晋陽秋』『異同雑語（異同評）』などを著した。『三國志』裴松之注に多数の記述が引用されている（『晋書』巻82・孫盛伝）。"}, "張譲": {"name": "張譲（ちょうじょう：後漢末・霊帝期の筆頭中常侍・十常侍の首領）", "wiki_title": "張譲", "role": "後漢の中常侍・列侯（穎川郡の人、「十常侍」の筆頭）", "ai_desc": "潁川郡の人（?〜189年）。桓帝・霊帝に仕えて中常侍となり、趙忠らとともに「十常侍」の筆頭として朝政を壟断し、霊帝から「張常侍は我が父なり」とまで寵信された。孫盛『異同雑語』によれば、若き曹操が密かに張譲の屋敷へ忍び込み、発覚するや庭で手戟を舞わせて垣根を飛び越え脱出したという（『後漢書』巻78・張譲伝）。"}, "孫武": {"name": "孫武（そんぶ：春秋時代の斉出身の兵法家、『孫子』十三篇の著者）", "wiki_title": "孫武", "role": "春秋時代の呉の将軍・兵法家（『孫子』十三篇の撰者）", "ai_desc": "春秋時代の斉の人で、呉王闔閭に仕えて楚を破った不世出の兵法家。その著書『孫子（孫武十三篇）』は兵学の最高古典とされ、曹操はこれに史上最初の体系的な注釈（『孫子略解』・魏武注孫子）を施して後世に伝えた。"}, "蹇碩": {"name": "蹇碩（けんせき：霊帝の寵愛を受けた小黄門・のち上軍校尉）", "wiki_title": "蹇碩", "role": "後漢末の宦官・小黄門・上軍校尉", "ai_desc": "霊帝に深く寵信された宦官（?〜189年）。剛健で武略に秀でていたとされ、のちに西園八校尉の筆頭である上軍校尉に任じられて大将軍・何進をも統属下に置いた。曹操が二十歳で洛陽北部尉となった頃（熹平年間）、小黄門であった蹇碩の叔父が夜間通行の禁を犯して出歩いたため、曹操は権勢を恐れず五色棒でこれを処刑し、京師を震え上がらせた（『曹瞞伝』）。"}, "宋奇": {"name": "宋奇（そうき：霊帝の最初の皇后・宋皇后の一族、㶏彊侯、曹操の従妹の夫）", "wiki_title": "宋皇后 (後漢)", "role": "後漢の列侯・㶏彊侯（霊帝の宋皇后の一族、曹操の従妹の夫）", "ai_desc": "扶風平陵県の人。後漢・霊帝の最初の皇后である宋皇后の一族（父・宋酆の兄弟または子）で、汝南郡の㶏強県を食邑とする「㶏彊侯（㶏強侯）」に封じられ、曹操の従妹（いとこ）を妻としていた。光和元年（178年）10月、宋皇后が中常侍・王甫らの誣告によって廃位・幽死させられた際、父の隠強侯・宋酆および宋奇ら一族もすべて誅殺され、姻戚であった曹操も連座して一時官を免じられた（王沈『魏書』、『後漢書』巻10下・宋皇后紀）。"}, "竇武": {"name": "竇武（とうぶ：字は游平、桓帝の竇皇后の父・大将軍・聞喜侯）", "wiki_title": "竇武", "role": "後漢の大将軍・聞喜侯（扶風平陵県の人、竇融の玄孫）", "ai_desc": "扶風平陵県の人（?〜168年）。後漢創業の功臣・竇融の玄孫で、娘（桓思竇皇后）が桓帝の皇后となったことで外戚として重きをなした。名声を重んじて清流派の学者・名士を保護し、第一次党錮の禍では上書して党人の赦免を実現させた。桓帝崩御後に霊帝を迎立して大将軍となり、太傅・陳蕃とともに中常侍・曹節や王甫ら宦官の誅滅を図ったが、建寧元年（168年）9月にクーデターで機先を制され、自殺に追い込まれた（『後漢書』巻69・竇武伝）。"}, "陳蕃": {"name": "陳蕃（ちんばん：字は仲挙、後漢の太尉・太傅・高陽郷侯、清流派の最高指導者）", "wiki_title": "陳蕃", "role": "後漢の太尉・太傅・録尚書事（汝南郡平輿県の人、「三君」の一人）", "ai_desc": "汝南郡平輿県の人（?〜168年）。李膺・竇武らとともに清流派（党人）の最高指導者「三君」と仰がれた剛直の名臣。桓帝期に太尉として宦官の専横を厳しく諫めて党人を弁護し、霊帝即位に際して竇太后から太傅・録尚書事に任じられた。大将軍・竇武と心を合わせて宦官勢力の一掃を計画したが、建寧元年（168年）9月に計画が漏洩し、八十余歳の老躯で剣を抜いて宮中に突入するも捕らえられ、即日処刑された（『後漢書』巻66・陳蕃伝）。議郎となった曹操は上書して竇武・陳蕃らの忠直と冤罪を痛切に訴えた（王沈『魏書』）。"}, "劉章": {"name": "劉章（りゅうしょう：前漢の城陽景王・朱虚侯、高祖劉邦の孫・呂氏の乱平定の功臣）", "wiki_title": "劉章", "role": "前漢の朱虚侯・城陽景王（斉悼恵王劉肥の次男、高祖劉邦の孫）", "ai_desc": "前漢の高祖・劉邦の孫で、斉悼恵王・劉肥の子（前200年〜前177年）。高后（呂后）の代に朱虚侯に封じられ、呂后崩御後の前180年に周勃・陳平らと協力して呂産ら呂氏一族を誅滅し、漢室を救う大功を立てた。文帝2年（前178年）に城陽王に封じられ、在位2年で24歳で薨去すると「景王」と諡された（『史記』巻52・斉悼恵王世家）。その武勇と功績から旧領の城陽国をはじめ青州各地で神として祀られ、後漢末の済南国では六百余祠が乱立するほどの熱狂的な淫祀となっていたが、済南相・曹操によってすべて破却された（王沈『魏書』）。"}, "王芬": {"name": "王芬（おうふん：後漢末の冀州刺史・党人八厨の一人、霊帝廃立計画の首謀者）", "wiki_title": "王芬", "role": "後漢末の冀州刺史（党人「八厨」の一人）", "ai_desc": "財を惜しまず士人を救済した清流派の「八厨」の一人として天下に高い名声を持った人物（『後漢書』巻67・党錮伝）。冀州刺史に任じられていた中平4〜5年（187〜188年）頃、陳蕃の子・陳逸や方術士・襄楷の言葉に動かされ、南陽の許攸・沛国の周旌らと結託して宦官を誅滅し、霊帝を廃位して合肥侯を擁立しようと企てた。曹操にも参加を呼びかけたが「廃立は天下の至不祥なり」と拒絶され、霊帝の河間北巡中止と中央からの召喚命令を受けて恐懼し自殺した（『九州春秋』・王沈『魏書』）。"}, "許攸": {"name": "許攸（きょゆう：字は子遠、南陽郡出身の袁紹の謀臣、官渡で曹操に来奔し故市・烏巣の兵糧庫奇襲を進言）", "wiki_title": "許攸", "role": "後漢末の豪傑・袁紹の参謀・のち曹操の幕僚（荊州南陽郡の人）", "ai_desc": "荊州南陽郡の人（?〜204年）、字は子遠。若くして袁紹・曹操と親交を結び、冀州刺史・王芬や沛国の周旌らとともに霊帝を廃して合肥侯を立てる陰謀を企てたが失敗し逃亡した。のちに冀州を領した袁紹の謀臣となったが、財貨に貪欲で袁紹がそれを満たせなかったこと（また『三國志』巻6・袁紹伝によれば留守中の家族が法を犯して審配に逮捕されたこと）から、建安5年（200年）10月の官渡対陣中に旧友の曹操のもとへ出奔した。曹操が裸足で飛び出して歓迎する中、故市・烏巣にある袁紹軍の輜重一万余乗への奇襲を進言して決定的な勝利をもたらし、捕縛された淳于瓊の処刑をも勧めたが、後に功を誇って曹操を幼名で呼ぶなど不遜な言動を重ねたため処刑された（『三國志』巻1・武帝紀および注引『曹瞞伝』、巻12・崔琰伝注引『魏略』）。"}, "周旌": {"name": "周旌（しゅうせい：沛国の豪傑、王芬・許攸らと霊帝廃立計画に参加）", "wiki_title": "王芬", "role": "後漢末の沛国の豪傑", "ai_desc": "曹操と同郡である沛国の豪傑。中平年間、冀州刺史・王芬や南陽の許攸らと結託し、各地の豪傑を連ねて霊帝を廃位し合肥侯を擁立しようと企てたが、曹操に参加を拒絶され、計画が頓挫して敗亡した。"}, "陳逸": {"name": "陳逸（ちんいつ：太傅・陳蕃の子、王芬の廃立計画に参画、のち魯相）", "wiki_title": "陳蕃", "role": "後漢の官僚・のち魯相（太傅・陳蕃の子）", "ai_desc": "汝南郡平輿県の人。建寧元年（168年）に宦官誅滅を図って殺害された太傅・陳蕃の子。父の死後、友人・朱震の助けで甘陵の境界に匿われて生き延び、党錮の禁が解けた後に官途に就いた。冀州刺史・王芬の座で方術士・襄楷から「天文は宦者に不利であり、黄門・常侍の一族は滅びる」と聞いて歓喜し、王芬らのクーデター計画の端緒を作った（『九州春秋』、『後漢書』巻66・陳蕃伝）。"}, "襄楷": {"name": "襄楷（じょうかい：字は公矩、平原郡出身の著名な天文学者・方術士）", "wiki_title": "襄楷", "role": "後漢末の学者・方術士（平原郡湿地県の人）", "ai_desc": "平原郡湿地県の人。古文尚書および天文・陰陽の術に精通し、桓帝の延熹9年（166年）には宮中に直接上書して宦官の専横と党人弾圧を天変地異の観点から痛烈に諫め、のちに『太平経』を朝廷に献上したことでも知られる（『後漢書』巻30下・襄楷伝）。霊帝末年、冀州刺史・王芬の席上で陳蕃の子・陳逸らに「天文は宦者に不利であり、黄門・常侍の貴族は滅びるであろう」と予言し、王芬が挙兵を企てるきっかけとなった（『九州春秋』）。"}, "伊尹": {"name": "伊尹（いいん：名は摯、殷の湯王を佐けて夏を滅ぼし、太甲を訓戒した伝説的名宰相）", "wiki_title": "伊尹", "role": "殷王朝創業の名宰相・阿衡", "ai_desc": "殷の湯王を補佐して夏の桀王を討ち、殷王朝を樹立した名宰相（『史記』巻3・殷本紀）。湯王の孫・太甲が即位後に暴虐で湯王の法に背いた際、伊尹は太甲を桐宮へ追放して3年間自ら国政を摂政し、太甲が過ちを悔いて善に立ち返ると再び迎えて政権を返上した。曹操は霍光とともに「君主の廃置・進退を成し遂げた古の例外的な成功例」として伊尹の名を挙げている。"}, "霍光": {"name": "霍光（かくこう：字は子孟、前漢の大司馬大将軍・博陸侯、昌邑王を廃し宣帝を擁立）", "wiki_title": "霍光", "role": "前漢の大司馬大将軍・博陸侯（河東郡平陽県の人、霍去病の異母弟）", "ai_desc": "河東郡平陽県の人（?〜前68年）。武帝の臨終に際して幼少の昭帝を託され、大司馬大将軍として約20年間にわたり前漢の政権を掌握した。昭帝が崩御した元平元年（前74年）、昌邑王・劉賀を第9代皇帝に迎えたが、劉賀が即位後わずか27日間で千百二十七件もの乱行に及んだため、上官皇太后の詔を奉じて群臣と合議し、劉賀を廃位して宣帝（劉詢）を擁立した（『漢書』巻68・霍光伝）。"}, "上官太后": {"name": "上官太后・孝昭上官皇后（じょうかんたいこう：前漢・昭帝の皇后、霍光の外孫）", "wiki_title": "上官皇后", "role": "前漢・昭帝の皇后、皇太后・太皇太后（上官安の娘・霍光の外孫）", "ai_desc": "前漢の左将軍・上官桀の孫娘で、大司馬大将軍・霍光の外孫娘（前89年〜前37年）。6歳で昭帝の皇后となり、前74年に昭帝が崩御して昌邑王・劉賀が即位すると15歳で皇太后となった。霍光が劉賀の廃位を決断した際、未央宮の承明殿で盛装して玉座に臨み、皇太后の大権をもって劉賀の廃位と宣帝擁立を裁可した（『漢書』巻97上・外戚伝）。"}, "劉賀": {"name": "昌邑王・劉賀（りゅうが：前漢の第9代皇帝・海昏侯、武帝の孫、在位27日で廃位）", "wiki_title": "劉賀", "role": "前漢の昌邑王・第9代皇帝（在位27日）・海昏侯（昌邑哀王劉髆の子）", "ai_desc": "前漢の武帝の孫で、昌邑哀王・劉髆の子（前92年〜前59年）。山陽郡の昌邑国（山東省巨野県）の王であったが、元平元年（前74年）に昭帝が後嗣なく崩御すると霍光らに迎えられて皇帝に即位した。しかし即位の日数が浅く朝廷内に基盤を持たないまま旧臣を重用し礼制を乱したため、在位わずか27日で霍光と上官皇太后によって廃位され、のちに豫章郡の海昏侯に封じられた（『漢書』巻63・武五子伝）。"}, "辺章": {"name": "辺章（へんしょう：もとの名は辺允、金城郡出身・韓遂とともに涼州で反乱を起こした首領）", "wiki_title": "辺章", "role": "後漢末の涼州反乱指導者・元新安県令（金城郡允吾県の人）", "ai_desc": "金城郡允吾県の人（?〜186年頃）。もとの名は辺允といい、新安県令などを務めて名声があった。中平元年（184年）の北宮伯玉・先零羌の反乱に際し、韓遂とともに反乱軍に擁立されて首領となり、中平4年（187年）にかけて涼州刺史・耿鄙や金城太守・陳懿らを殺害し、十余万の軍勢で三輔に侵攻して天下を震撼させた（『後漢書』巻72・董卓伝）。"}, "韓遂": {"name": "韓遂（かんすい：字は文約、もとの名は韓約、金城郡出身・三十年近くにわたり涼州に割拠した群雄）", "wiki_title": "韓遂", "role": "後漢末の涼州の群雄・鎮西将軍（金城郡允吾県の人）", "ai_desc": "金城郡允吾県の人（?〜215年）。辺章とともに涼州の反乱軍の首領となって刺史・郡守を殺害し、十余万の兵を擁して後漢朝廷を揺るがした。その後も馬騰らと結んだり対立したりしながら約30年間にわたり涼州・関中に隠然たる勢力を保ち、建安16年（211年）には馬超と連合して潼関で曹操と戦ったが敗れ、建安20年（215年）に死去した（『三國志』巻1・武帝紀、巻15・張既伝）。"}, "劉弁": {"name": "少帝・弘農王・劉弁（りゅうべん：後漢の第13代皇帝、霊帝の長男・母は何太后）", "wiki_title": "少帝弁", "role": "後漢の第13代皇帝（在位189年4月〜9月）・弘農懐王", "ai_desc": "霊帝と何皇后（何太后）の間に生まれた皇子（176年〜190年）。中平6年（189年）4月に霊帝が崩御すると14歳で即位し、母の何太后が臨朝称制し、伯父の大将軍・何進が輔政した。しかし何進が宦官に暗殺され、入京した董卓によって同年9月に廃位されて「弘農王」に降格され、翌初平元年（190年）正月に董卓の命を受けた李儒によって毒殺された（『後漢書』巻9・献帝紀、巻10下・何皇后紀）。"}, "何太后": {"name": "何太后・霊思何皇后（かたいこう：霊帝の皇后・少帝劉弁の母、大将軍何進の異母妹）", "wiki_title": "何皇后 (後漢)", "role": "後漢・霊帝の皇后、皇太后（南陽郡宛県の人、何進の異母妹）", "ai_desc": "南陽郡宛県の人（?〜189年）。大将軍・何進の異母妹で、霊帝の寵愛を受けて皇子・弁（少帝）を生み、光和3年（180年）に宋皇后に代わって皇后に立てられた。中平6年（189年）4月に霊帝が崩御すると皇太后として臨朝称制したが、兄の何進と袁紹が提案した宦官誅滅計画に同意しなかったため、何進が外将の董卓を召還する事態を招き、同年9月に董卓によって永安宮に幽閉・毒殺された（『後漢書』巻10下・霊思何皇后紀）。"}, "何進": {"name": "何進（かしん：字は遂高、後漢の大将軍・慎侯、何太后の兄）", "wiki_title": "何進", "role": "後漢の大将軍・録尚書事・慎侯（南陽郡宛県の人）", "ai_desc": "南陽郡宛県の人（?〜189年）。異母妹の何氏が霊帝の皇后となったことで外戚として栄達し、黄巾の乱が起きた中平元年（184年）に大将軍に拝された。霊帝崩御後、皇太子・劉弁（少帝）を擁立して袁紹らと宦官誅滅を謀ったが、妹の何太后が反対したため、太后を脅して同意させるべく并州牧・董卓を洛陽へ召還した。しかし董卓の到着前に計画が漏れ、中平6年（189年）8月、長楽宮の嘉徳殿前で張譲・段珪ら宦官に待ち伏せされて殺害された（『後漢書』巻69・何進伝）。"}, "袁紹": {"name": "袁紹（えんしょう：字は本初、四世三公の名門・のち冀州牧・大将軍として河北に覇を唱える）", "wiki_title": "袁紹", "role": "後漢末の群雄・司隷校尉・冀州牧・大将軍・鄴侯（豫州汝南郡汝陽県の人）", "ai_desc": "豫州汝南郡汝陽県の人（?〜202年）。四代にわたり三公を輩出した名門・汝南袁氏の出身で、若き日の曹操の盟友であり最大の宿敵。西園八校尉の中軍校尉・司隷校尉となり、大将軍・何進に宦官の皆殺しと董卓ら地方軍閥の召還を進言した。何進が暗殺されると宮中に突入して宦官二千余人を族滅したが、入京した董卓と対立して冀州へ奔り、反董卓連合軍の盟主となった。のち韓馥から冀州を譲り受け、公孫瓚を滅ぼして冀・青・幽・并の四州を制覇したが、建安5年（200年）の官渡の戦いと翌建安6年の倉亭の戦いで曹操に連敗し、建安7年（202年）5月に発病して血を吐き没した（『三國志』巻6・袁紹伝）。"}, "董卓": {"name": "董卓（とうたく：字は仲穎、隴西郡臨洮県出身・少帝を廃し献帝を擁立して朝政を壟断した暴雄）", "wiki_title": "董卓", "role": "後漢の相国・太師・郿侯（隴西郡臨洮県の人）", "ai_desc": "隴西郡臨洮県の人（?〜192年）。羌族との戦いで武名を挙げ、前将軍・并州牧となった。中平6年（189年）、大将軍・何進の召還を受けて洛陽へ進軍し、何進の死と宮中の混乱に乗じて兵権を掌握すると、少帝（劉弁）を廃して弘農王とし、陳留王（献帝・劉協）を擁立して何太后と弘農王を弑逆した。曹操の才幹を評価して驍騎校尉に上表したが曹操に脱出され、関東諸侯の反董卓連合軍が蜂起すると長安へ遷都した（『三國志』巻6・董卓伝）。"}, "献帝": {"name": "献帝・劉協（けんてい／りゅうきょう：字は伯和、後漢の第14代〔最後〕の皇帝）", "wiki_title": "献帝", "role": "後漢の第14代皇帝（在位189年〜220年）・のち魏の山陽公", "ai_desc": "霊帝の次男、母は王美人（181年〜234年）。少帝（劉弁）の異母弟で、初め勃海王、ついで陳留王に封じられた。中平6年（189年）9月、入京した董卓によって少帝に代わって9歳で皇帝に擁立された。後に長安から洛陽へ脱出したところを建安元年（196年）に曹操によって許へ迎えられ、黄初元年（220年）に曹操の子・曹丕（文帝）へ禅譲して後漢王朝400年の歴史を閉じた（『後漢書』巻9・孝献帝紀）。"}, "呂伯奢": {"name": "呂伯奢（りょはくしゃ：成皋県に住んでいた曹操の旧友〔故人〕）", "wiki_title": "呂伯奢", "role": "河南尹成皋県の人（曹操の旧友）", "ai_desc": "司隸河南尹成皋県の人で、曹操（または父・曹嵩）の旧友（故人）。中平6年（189年）秋、董卓の驍騎校尉任命を拒んで洛陽から東へ逃亡した曹操が数騎を連れてその屋敷に立ち寄った際、呂伯奢本人は外出して不在であったが、残っていた息子や食客たちが曹操に夜襲（あるいは歓待の食器の音を誤解した曹操による先制殺害）されて一家八人が惨殺される悲劇が起きた。"}, "衛茲": {"name": "衛茲（えいじ：字は子許、陳留郡襄邑県の孝廉・私財を投じて曹操の挙兵を支えた功臣）", "wiki_title": "衛茲", "role": "後漢末の陳留郡の孝廉・曹操創業の支援者（陳留郡襄邑県の人）", "ai_desc": "陳留郡襄邑県の人（?〜190年）。大節と気概を備え、三公の辟召にも応じなかった高潔の士。曹操が初めて陳留を訪れた際に一見して「平天下の者は必ずこの人なり」と見抜き、中平6年（189年）12月に曹操が陳留郡己吾県で挙兵するにあたり、私財をなげうって兵五千人を集め曹操を資助した。翌初平元年（190年）春、董卓の将・徐栄との滎陽（汴水）の戦いに従軍して終日奮戦し、戦死した。曹操は後に陳留を通るたびに使者を遣わして衛茲の墓を祀らせた（『三國志』巻22・衛臻伝）。"}, "袁術": {"name": "袁術（えんじゅつ：字は公路、四世三公の汝南袁氏の嫡流・後将軍、のち寿春で仲家皇帝を僭称）", "wiki_title": "袁術", "role": "後漢末の群雄・後将軍・左将軍（汝南郡汝陽県の人、司空・袁逢の嫡子、袁紹の従弟〔または異母弟〕）", "ai_desc": "汝南郡汝陽県の人（?〜199年）。四世三公の名門・汝南袁氏の司空・袁逢の嫡子として生まれ、若くして侠気をもって知られ、虎賁中郎将となった。董卓が入京すると懐柔のため後将軍に任じられたが、董卓の暴政を恐れて南陽郡（魯陽）へ奔り、初平元年（190年）正月の反董卓連合軍で南方の主力を担った。後に袁紹・曹操と対立して揚州の寿春へ移り、建安2年（197年）に伝国の玉璽を頼みに帝位（「仲家」）を僭称したが、四方から孤立して窮死した（『三國志』巻6・袁術伝）。"}, "韓馥": {"name": "韓馥（かんふく：字は文節、潁川郡出身の御史中丞・冀州牧、のち袁紹に冀州を譲り自害）", "wiki_title": "韓馥", "role": "後漢末の冀州牧・元御史中丞（潁川郡の人）", "ai_desc": "潁川郡の人（?〜191年）。御史中丞を務めていた中平6年（189年）、董卓によって名士登用の一環として富裕な大州である冀州牧に抜擢された。当初は董卓に憚って勃海太守・袁紹の挙兵を従事に監視させていたが、初平元年（190年）正月に東郡太守・橋瑁の檄文が届き、治中従事・劉子恵に大義を説かれたことで反董卓連合軍に参加して鄴に駐屯した。しかし後に袁紹・公孫瓚の圧力に怯えて初平2年（191年）に冀州を袁紹へ引き渡し、張邈のもとへ身を寄せたが猜疑心から厠で自害した（『三國志』巻6・袁紹伝、王粲『英雄記』）。"}, "橋瑁": {"name": "橋瑁（きょうぼう：字は元偉、東郡太守・三公の書簡を偽作して諸侯に反董卓の檄を飛ばした人物）", "wiki_title": "橋瑁", "role": "後漢末の東郡太守・元兗州刺史（梁国睢陽県の人、太尉・橋玄の一族）", "ai_desc": "梁国睢陽県の人（?〜190年）。太尉・橋玄の族子（一族）。先に兗州刺史を務めて威恵があり、次いで東郡太守に転じた。初平元年（190年）春正月、京師の三公の書簡（三公移書）を偽作して董卓の罪状と天子の危難を州郡へ布告し、関東諸侯が一斉に反董卓連合軍を挙兵する直接の導火線を作った。しかし同年、酸棗に駐屯していた連合軍内部の不和から兗州刺史・劉岱に急襲されて殺害された（『三國志』巻1・武帝紀、王粲『英雄記』）。"}, "劉子恵": {"name": "劉子恵（りゅうしけい：冀州の治中従事、韓馥に反董卓の大義を説いて挙兵を決断させた幕僚）", "wiki_title": "劉子恵", "role": "冀州牧・韓馥の治中従事", "ai_desc": "冀州の治中従事。初平元年（190年）正月、東郡太守・橋瑁から董卓討伐を呼びかける檄文が届いた際、主君の冀州牧・韓馥が「いま兵を挙げれば袁氏を助けるべきか、董氏を助けるべきか」と迷ったのに対し、「いま兵を興すのは国家のためです！どうして袁・董のためなどと言われるのですか！」と一喝して韓馥を恥じ入らせ、反董卓連合への参加を決断させた。またその際、功が成るか否かは測りがたいからと「他州が発起するのを待ってから呼応すべきです」と慎重策を献じた（王粲『英雄記』）。"}, "孔伷": {"name": "孔伷（こうちゅう：字は公緒、陳留郡出身の豫州刺史・清談で高名な反董卓連合軍の一員）", "wiki_title": "孔伷", "role": "後漢末の豫州刺史（陳留郡の人、『符融伝』では「孔宙」とも表記）", "ai_desc": "陳留郡の人（?〜190年頃）。郭泰・符融らに認められた清流派の名士で、中平6年（189年）に董卓が名士を地方長官に抜擢した際に豫州刺史に任じられた。初平元年（190年）正月の反董卓連合軍に参加して潁川に駐屯したが、間もなく病没した。鄭泰（鄭太）からは「孔公緒は清談（高踏的な談論）に長け、息を吹きかければ枯木に花を咲かせ、息を吸い込めば生木を枯らすほどの弁舌を持つが、軍旅（軍事）の才はない」と評された（王粲『英雄記』、『九州春秋』）。"}, "鄭泰": {"name": "鄭泰（ていたい：字は公業、『後漢書』では鄭太、河南尹開封県出身の尚書・侍中、卓抜した情勢分析で知られる名臣）", "wiki_title": "鄭泰", "role": "後漢末の尚書・侍中・のち揚州刺史（河南尹開封県の人、大司農・鄭衆の曾孫）", "ai_desc": "司隸河南尹開封県の人（151年頃〜193年頃）。宦官ながら清廉で知られた大司農・鄭衆の曾孫で、鄭渾の兄。大将軍・何進の謀主として董卓召還に強く反対し、のち董卓政権下で侍中・尚書となった。関東諸侯が挙兵した際、董卓が大軍で関東を討とうとするのを阻止するため、袁紹・曹操・孔伷・張邈ら関東諸将の弱点（孔伷は清談のみで軍事の才がない等）を巧みに並べ立てて董卓を油断させた。後に荀攸・何顒らと董卓暗殺を計画し、露見すると袁術のもとへ脱出し、揚州刺史に任じられたが赴任途中に病没した（『三國志』巻16・鄭渾伝、『後漢書』巻70・鄭太伝）。"}, "劉岱": {"name": "劉岱（りゅうたい：字は公山、東萊郡牟平県出身の漢室宗親・兗州刺史、反董卓連合軍に参加）", "wiki_title": "劉岱", "role": "後漢末の兗州刺史・元侍中（東萊郡牟平県の人、揚州刺史・劉繇の兄）", "ai_desc": "青州東萊郡牟平県の人（?〜192年）。前漢の斉孝王・劉将閭の末裔（漢室の宗親）で、太尉・劉寵の甥、揚州刺史・劉繇（字は正礼）の同母兄。孝悌・仁恕な人柄で虚己して人に接したため士人から広く慕われ、侍中から董卓によって兗州刺史に任じられた。初平元年（190年）正月、反董卓連合軍に参加して酸棗に駐屯したが、東郡太守・橋瑁と対立してこれを殺害した。初平3年（192年）夏、青州黄巾の百万の群衆が兗州へ侵攻した際、鮑信の諫めを聴かずに打って出て戦死し、その後任として曹操が兗州牧に迎えられることとなった（『三國志』巻1・武帝紀、巻49・劉繇伝）。"}, "劉繇": {"name": "劉繇（りゅうよう：字は正礼、東萊郡牟平県出身の揚州刺史・振武将軍、孫策と江東の覇権を争った名門宗室）", "wiki_title": "劉繇", "role": "後漢末の揚州刺史・揚州牧・振武将軍（東萊郡牟平県の人、兗州刺史・劉岱の弟）", "ai_desc": "青州東萊郡牟平県の人（156年〜197年）。前漢の斉孝王の少子・牟平侯劉渫の末裔で、太尉・劉寵の甥、兗州刺史・劉岱の同母弟。19歳のときに叔父を盗賊から救出して名を挙げ、孝廉・郎中・下邑県長となり、権門の請託を拒んで官を棄てた清流派の名士。後に揚州刺史に任じられて曲阿を拠点とし、袁術および袁術配下の孫策と長江下流で激しく戦ったが敗れて豫章へ退き、その地で病没した。『三國志』呉書（巻49）に専伝（劉繇太史慈士燮伝）が立てられている。"}, "王匡": {"name": "王匡（おうきょう：字は公節、泰山郡出身の河内太守・反董卓連合軍の北軍主力、小平津で董卓に敗北）", "wiki_title": "王匡", "role": "後漢末の河内太守・元大将軍府進符使（兗州泰山郡の人）", "ai_desc": "兗州泰山郡の人（?〜190年頃）。若くして蔡邕と親交があり、財を軽んじて施しを好む任侠の士として知られた。大将軍・何進の府に辟召されて進符使となり、徐州で強弩五百人を発して上京する途中に何進が敗死したため帰郷し、のち河内太守に拝された。初平元年（190年）正月の反董卓連合軍に参加して河内郡の河陽津（小平津）に布陣したが、董卓の奇襲を受けて壊滅し、さらに朝廷の使者として訪れた同郷の執金吾・胡母班（王匡の妹婿）を処刑したため、逃帰した泰山郡で胡母班の親族と曹操の連合によって殺害された（王粲『英雄記』、謝承『後漢書』）。"}, "謝承": {"name": "謝承（しゃしょう：字は偉平、三国呉の武陵太守・『後漢書』百三十巻を著した歴史家）", "wiki_title": "謝承", "role": "三国呉の歴史家・武陵太守（揚州会稽郡山陰県の人、孫権の謝夫人の弟）", "ai_desc": "揚州会稽郡山陰県の人。孫権の妃・謝夫人の弟にあたり、博学洽聞で一度見た書物は終生忘れなかったと伝えられる。呉の五官郎中から長沙東部都尉・武陵太守を歴任し、散逸しつつあった後漢の史料を博捜して『後漢書』百三十巻（現存する范曄『後漢書』より約200年早い最古級の後漢通史）および『会稽先賢伝』を撰述した（『三國志』巻50・呉書妃嬪伝）。"}, "蔡邕": {"name": "蔡邕（さいよう：字は伯喈、陳留郡圉県出身の当代随一の碩学・文人・書家、左中郎将）", "wiki_title": "蔡邕", "role": "後漢末の大学者・議郎・侍中・左中郎将（兗州陳留郡圉県の人、蔡琰〔文姫〕の父）", "ai_desc": "兗州陳留郡圉県の人（133年〜192年）。経学・歴史（『東観漢記』の続修）・天文・音楽（焦尾琴）・書道（飛白体・熹平石経の揮毫）のすべてに秀でた後漢末最高の知識人であり、曹操や王匡とも若き日より深い親交があった。直言によって朔方へ流罪となった後、江湖に亡命していたが、中平6年（189年）に政権を握った董卓から一族皆殺しの脅迫を受けて強引に出仕させられ、三日のうちに議郎から侍中・左中郎将・高陽郷侯へ抜擢された。初平3年（192年）に董卓が誅殺された際、王允の座で思わず嘆息したために投獄され、獄中で死去した（『後漢書』巻60下・蔡邕伝）。"}, "張邈": {"name": "張邈（ちょうばく：字は孟卓、東平国寿張県出身の陳留太守・曹操の親友、のち呂布を迎えて曹操と敵対）", "wiki_title": "張邈", "role": "後漢末の陳留太守（兗州東平国寿張県の人、字は孟卓）", "ai_desc": "兗州東平国寿張県の人（?〜195年）。財をなげうって窮乏の士を救う侠気によって「八厨」の一人に数えられ、曹操・袁紹と若き日から親友であった。陳留太守として初平元年（190年）正月の反董卓連合軍に真っ先に呼応し、酸棗に駐屯して配下の衛茲を曹操の西征に分遣した。また曹操が徐州出征に際して「自分が還らなければ家族を頼む」と託すほど信頼されたが、袁紹との確執や陳宮の勧誘から興平元年（194年）に呂布を兗州牧に迎えて曹操に背き、敗れて雍丘陥落時に部下に殺害された（『三國志』巻7・呂布張邈伝）。"}, "胡母班": {"name": "胡母班（こぼはん：字は季皮、泰山郡出身の執金吾・八厨の一人、使者として王匡のもとへ赴き殺害される）", "wiki_title": "胡母班", "role": "後漢末の執金吾（兗州泰山郡奉高県の人、王匡の妹婿）", "ai_desc": "兗州泰山郡奉高県の人（?〜190年）。少年の頃より名節をもって知られ、張邈・度尚らとともに「八厨」（財をもって人を救う八人の名士）の一人に数えられた清流派の重鎮。董卓政権下で執金吾に任じられ、初平元年（190年）に関東諸侯が挙兵した際、董卓の命により皇甫嵩の子・皇甫酈らとともに関東へ慰撫の使者として派遣されたが、河内太守・王匡（胡母班の妻の兄）によって捕らえられ、涙ながらに遺書を託した後に処刑された（『三國志』巻6・袁紹伝注引『漢末名士録』、謝承『後漢書』）。"}, "袁遺": {"name": "袁遺（えんい：字は伯業、袁紹の従兄・山陽太守、曹操が「大人になっても学に勤めたのは私と袁伯業のみ」と讃えた碩学）", "wiki_title": "袁遺", "role": "後漢末の長安令・山陽太守・揚州刺史（汝南郡汝陽県の人、袁紹の従兄）", "ai_desc": "汝南郡汝陽県の人（?〜192年頃）。袁紹の従兄（または叔父とも）。長安令・山陽太守を歴任し、張超から太尉・朱儁への推薦状で「百氏を綜括し、物を観て名を知る当代無双の器」と絶賛され、曹操からも「大人になってから学問に励み続けた者は、ただ私と袁伯業だけである」と高く評価された（文帝『典論』）。初平元年（190年）正月の反董卓連合軍に参加して酸棗に駐屯し、のちに袁紹から揚州刺史に任じられたが、袁術と戦って敗れ、部下に殺害された（王粲『英雄記』）。"}, "張超": {"name": "張超（ちょうちょう：字は子並、河間国鄚県出身の別部司馬・『張超集』を残した後漢末の文人・書家）", "wiki_title": "張超 (河間)", "role": "後漢末の文人・別部司馬・仁城県長（冀州河間国鄚県の人、留侯・張良の末裔）", "ai_desc": "冀州河間国鄚県の人（※陳留太守・張邈の弟である広陵太守・張超〔字は孟高〕とは同姓同名の別人）。前漢の留侯・張良の末裔とされ、文才と草書に秀でた。黄巾の乱に際して征西将軍・皇甫嵩や太尉・朱儁の下で別部司馬として従軍し、その間に長安令であった袁遺（字は伯業）を太尉・朱儁に推薦する名文（「薦袁遺牋」）を著した（『後漢書』巻80下・文苑列伝下）。"}, "朱儁": {"name": "朱儁（しゅしゅん：字は公偉、会稽郡上虞県出身の太尉・車騎将軍、皇甫嵩とともに黄巾の乱を平定した名将）", "wiki_title": "朱儁", "role": "後漢末の右中郎将・車騎将軍・太尉・大司農（揚州会稽郡上虞県の人）", "ai_desc": "揚州会稽郡上虞県の人（?〜195年）。母への孝養と義侠心で知られ、交趾刺史として反乱を平定した功により諫議大夫となった。光和7年（184年）の黄巾の乱では右中郎将・持節として皇甫嵩・曹操らとともに潁川・南陽・陳国の黄巾賊を平定し、車騎将軍・西郷侯に昇った。のち太尉・大司農などを歴任し、長安で李傕・郭氾が献帝を人質に争った際に憤悶のあまり発病して没した（『後漢書』巻71・朱儁伝）。"}, "曹丕": {"name": "曹丕・五官将・文帝（そうひ：字は子桓、曹操と卞夫人の長男、五官中郎将・魏王を経て魏王朝の初代皇帝）", "wiki_title": "曹丕", "role": "五官中郎将・副丞相・魏太子・魏王・三国魏の初代皇帝〔高祖文皇帝〕（豫州沛国譙県の人、曹操の子）", "ai_desc": "豫州沛国譙県の人（187年〜226年）、字は子桓。曹操と武宣卞皇后の間に生まれた長男（曹昂の異母弟、曹彰・曹植の同母兄）。幼少より騎射・剣術と学問・詩賦の双方に秀で、建安16年（211年）に五官中郎将・副丞相に任じられたことから世に「五官将」と称された。弟・曹植との後継争いを経て建安22年（217年）に魏太子となり、建安25年（220年）正月の曹操薨去により魏王を継ぎ、同年10月に後漢の献帝から禅譲を受けて魏王朝を創始した（黄初改元）。『典論』を著して「文章は経国の大業、不朽の盛事」と唱えた建安文学の中心人物でもある（『三國志』巻2・文帝紀）。"}, "鮑信": {"name": "鮑信（ほうしん：字は允誠、泰山郡平陽県出身の済北相・曹操の莫逆の友、青州黄巾との戦いで曹操を救い戦死）", "wiki_title": "鮑信", "role": "後漢末の騎都尉・済北相（兗州泰山郡平陽県の人、鮑勲の父）", "ai_desc": "兗州泰山郡平陽県の人（152年〜192年）。前漢の司隷校尉・鮑宣の八世の孫。大将軍・何進の辟召を受けて騎都尉となり、董卓の異図を見抜いて何進および袁紹に董卓の即時誅殺を進言したが容れられず帰郷して兵二万を集めた。初平元年（190年）正月の反董卓連合軍に済北相として参加し、曹操と深く結んで滎陽（汴水）の戦いで奮戦した。初平3年（192年）、兗州刺史・劉岱が青州黄巾に敗死すると曹操を兗州牧に迎え入れ、寿張での黄巾賊との激戦で曹操の窮地を救って戦死した。曹操はその死を深く悲しみ、木で鮑信の像を彫らせて祭哭した（『三國志』巻12・鮑勲伝）。"}, "鮑勲": {"name": "鮑勲（ほうくん：字は叔業、済北相・鮑信の子、魏の御史中丞・右刺姦掾、剛直な諫言で知られた忠臣）", "wiki_title": "鮑勲", "role": "魏の太子中庶子・侍御史・御史中丞・治書執法（兗州泰山郡平陽県の人、鮑信の子）", "ai_desc": "兗州泰山郡平陽県の人（?〜226年）。済北相・鮑信の次男。曹操が亡き親友・鮑信の功に報いるため取り立て、丞相掾・太子中庶子となった。公平無私・剛直な性格で、太子・曹丕の外戚である郭夫人の弟の不正をも容赦なく処断したため曹丕から深く恨まれ、曹丕（文帝）の即位後も狩猟や軍旅を巡って度々激しく諫言したため、黄初7年（226年）に文帝の怒りに触れて処刑された。『三國志』巻12に専伝があり、冒頭に父・鮑信の事績が詳しく記されている。"}, "徐栄": {"name": "徐栄（じょえい：幽州玄菟郡出身の董卓配下の猛将、滎陽汴水で曹操を、梁東で孫堅を連破）", "wiki_title": "徐栄 (後漢)", "role": "後漢末の董卓配下の将・中郎将（幽州玄菟郡の人）", "ai_desc": "幽州玄菟郡の人（?〜192年）。董卓に仕えて中郎将となり、同郷の公孫度を遼東太守に推薦した。初平元年（190年）2月、酸棗から西進してきた曹操・衛茲の軍と滎陽の汴水で遭遇し、終日の激戦の末にこれを撃破して衛茲を討ち取り、曹操の乗馬を射て敗走させたが、曹操軍が寡兵ながら死力を尽くして戦ったのを見て「酸棗は容易には攻め落とせない」と判断し軍を還した。さらにその後、梁県の東で袁術配下の孫堅をも撃破して潁川太守・李旻を生け捕りにするなど反董卓連合軍の二大英雄（曹操・孫堅）を連破したが、初平3年（192年）に董卓が王允に誅殺されると王允に従い、李傕・郭氾との新豊の戦いで戦死した（『三國志』巻1・武帝紀、巻8・公孫度伝、『後漢書』巻72・董卓伝）。"}, "曹洪": {"name": "曹洪（そうこう：字は子廉、曹操の従弟、滎陽汴水の敗戦で愛馬を曹操に捧げて命を救った創業の功臣）", "wiki_title": "曹洪", "role": "後漢末〜三国魏の驃騎将軍・衛将軍・野王侯・楽城恭侯（沛国譙県の人、曹操の従弟）", "ai_desc": "沛国譙県の人（?〜232年）。曹操の伯父・曹鼎の末子で曹操の従弟。初平元年（190年）2月の滎陽（汴水）の戦いで曹操が徐栄に大敗し、流れ矢に当たって乗馬も傷ついた絶体絶命の危機に際し、自らの馬を降りて曹操に差し出し、「天下に私（洪）はいなくとも構いませんが、公（曹操）がいなくてはなりません！」と述べて徒歩で従い、夜陰に乗じて曹操を脱出させた。その後も一貫して各地の転戦に従い、漢中争奪戦では下弁で呉蘭・張飛を破るなど大功を立てて都護将軍・衛将軍・驃騎将軍に昇った（『三國志』巻9・曹洪伝）。"}, "陳温": {"name": "陳温（ちんおん：字は元悌、汝南郡出身の揚州刺史、曹操・夏侯惇の募兵に協力）", "wiki_title": "陳温", "role": "後漢末の揚州刺史（豫州汝南郡の人）", "ai_desc": "豫州汝南郡の人（?〜192年頃）。後漢末に揚州刺史を務め、初平元年（190年）に滎陽で敗れて兵を失った曹操と夏侯惇が揚州へ募兵に訪れると、丹楊太守・周昕とともに兵四千余人を提供して曹操の再起を支えた。その後、初平3年（192年）頃に病死（一説に袁術に殺害）し、袁紹が袁遺を、袁術が陳瑀・次いで孫策の舅である呉景らを送り込んで揚州を巡る争奪戦が起きた（『三國志』巻1・武帝紀、巻46・孫破虜討逆伝）。"}, "周昕": {"name": "周昕（しゅうきん：字は泰明、会稽郡山陰県出身の丹楊太守、曹操に兵四千余人を供給、のち孫策・呉景と戦い戦死）", "wiki_title": "周昕", "role": "後漢末の丹楊太守（揚州会稽郡山陰県の人、周昂・周の兄）", "ai_desc": "揚州会稽郡山陰県の人（?〜196年頃）。太傅・陳蕃や太尉・朱儁に師事し、経学・占候にすぐれた名士。九江太守・周昂、会稽太守・周の兄。丹楊太守として善政を敷き、初平元年（190年）に曹操が募兵に訪れると揚州刺史・陳温とともに丹楊の精兵四千余人を与えて支援した。のちに袁術および袁術配下の呉景・孫策と丹楊を巡って激しく戦い、建安元年（196年）頃に孫策に攻め破られて戦死した（『三國志』巻1・武帝紀、巻46・孫破虜討逆伝注引『会稽典録』）。"}, "王肱": {"name": "王肱（おうこう：兗州刺史・劉岱が東郡太守・橋瑁を殺害した後に後任として東郡太守を兼領させた人物）", "wiki_title": "王肱", "role": "後漢末の東郡太守（兗州刺史・劉岱の腹心）", "ai_desc": "後漢末の官僚・武将。初平元年（190年）、酸棗に駐屯していた兗州刺史・劉岱が東郡太守・橋瑁と対立して橋瑁を殺害した際、劉岱によって後任の東郡太守に任じられた。しかし翌初平2年（191年）、黒山賊の于毒・白繞・眭固ら十余万が魏郡・東郡に乱入した際、王肱はこれを防ぎきれず東郡で撃破され、代わって曹操が東郡へ進軍して白繞らを平定し、袁紹の推挙により曹操が東郡太守を領することとなった（『三國志』巻1・武帝紀）。"}, "劉虞": {"name": "劉虞（りゅうぐ：字は伯安、東海郡出身の漢室宗親・幽州牧・太傅・大司馬、袁紹らによる皇帝推戴を固辞）", "wiki_title": "劉虞", "role": "後漢末の甘陵相・宗正・幽州牧・太傅・大司馬・襄賁侯（徐州東海郡郯県の人）", "ai_desc": "徐州東海郡郯県の人（?〜193年）。後漢の光武帝の長男・東海恭王劉彊の五世の孫（漢室の宗親）。質素倹約で寛仁な政治を行い、幽州刺史・甘陵相・宗正を歴任した。中平5年（188年）に幽州牧として赴任すると、烏丸・鮮卑や張純らの反乱を戦わずして懐柔・平定し、河北・北辺の民衆や異民族から絶大な信望を集め、太尉・大司馬に拝された。初平2年（191年）春、袁紹・韓馥らが長安の献帝に代わる新皇帝として劉虞を擁立しようとしたが、「天子に背くことはできない」と激怒して固辞した。のちに主戦派の公孫瓚と対立し、初平4年（193年）に公孫瓚を討とうとして敗れ、処刑された（『後漢書』巻73・劉虞伝、『三國志』巻8・公孫瓚伝）。"}, "于毒": {"name": "于毒（うどく：黒山賊の有力首領、東武陽を攻めるも曹操に西山の本営を突かれて敗れ、のち鄴で袁紹に斬られる）", "wiki_title": "于毒", "role": "後漢末の黒山賊の首領", "ai_desc": "太行山脈一帯に割拠した黒山賊の有力首領（?〜193年）。初平2年（191年）秋、白繞・眭固らとともに十余万の軍勢で魏郡・東郡を略奪し、翌初平3年（192年）春には頓丘に出陣していた曹操の隙を突いて東郡治所の東武陽を攻撃した。しかし曹操が東武陽へ引き返さずに逆方向（西方）の山中にある于毒の本営を急襲したため、驚いて東武陽の包囲を解いて引き返したところを要撃され大敗した。その後、初平4年（193年）に鄴城を急襲して魏郡太守・栗成を殺害したが、袁紹に攻め破られて斬殺された（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "白繞": {"name": "白繞（はくじょう：黒山賊の首領、十余万の衆で東郡に侵入するも濮陽で曹操に撃破される）", "wiki_title": "黒山賊", "role": "後漢末の黒山賊の首領", "ai_desc": "黒山賊の首領の一人。初平2年（191年）秋、于毒・眭固らとともに十余万の軍勢で魏郡・東郡に侵入し、東郡太守・王肱を打ち破った。しかし河内から東郡へ進軍してきた曹操によって濮陽で撃破され、この戦功により曹操は袁紹の推挙（上表）を受けて東郡太守に就任し、兗州進出の足がかりを築いた（『三國志』巻1・武帝紀）。"}, "眭固": {"name": "眭固（すいこ：字は白兎、黒山賊の首領、内黄で曹操に敗れ、のち張楊・袁紹に属して射犬で敗死）", "wiki_title": "眭固", "role": "後漢末の黒山賊の首領・のち張楊の部将", "ai_desc": "黒山賊の首領の一人（?〜199年）。字は白兎。初平2年（191年）から翌3年春にかけて于毒・白繞らとともに東郡へ侵攻したが、東武陽から退却する于毒に連動したところを曹操に要撃されて大敗した。のちに河内太守・張楊に帰属し、建安3年（198年）に張楊が部下の楊醜に殺害されると楊醜を討って袁紹への帰属を図り、河内郡の射犬（犬城）に駐屯したが、建安4年（199年）春に曹操が派遣した史渙・曹仁・楽進らに攻められて戦死した（『三國志』巻1・武帝紀）。"}, "孫臏": {"name": "孫臏（そんびん：戦国時代の斉の兵法家・軍師、『孫子』の著者・孫武の末裔、「囲魏救趙」の計で知られる）", "wiki_title": "孫臏", "role": "戦国時代の斉の軍師・兵法家（『孫臏兵法』の著者）", "ai_desc": "戦国時代中期の斉の兵法家（前4世紀頃）。『孫子』を著した孫武の子孫。龐涓に妬まれて両足の膝蓋骨を削り取られる刑（臏刑）を受けたため「孫臏」と呼ばれた。斉の威王・将軍田忌の軍師となり、前353年に魏の龐涓が趙の都・邯鄲を包囲した際、直接邯鄲へ救援に赴かず手薄となった魏の都・大梁へ進撃して龐涓を引き返させ、帰路の桂陵で撃破する「囲魏救趙（魏を囲んで趙を救う）」の戦術を創始した（『史記』巻65・孫子呉起列伝）。曹操は東武陽を攻める于毒に対し、この孫臏の故事を引いて西山の本営を衝いた。"}, "耿弇": {"name": "耿弇（こうえん：字は伯昭、扶風茂陵県出身の後漢の建威大将軍・好畤侯、雲台二十八将の第4位）", "wiki_title": "耿弇", "role": "後漢創業の功臣・建威大将軍・好畤侯（司隸右扶風茂陵県の人、雲台二十八将の第4位）", "ai_desc": "司隸右扶風茂陵県の人（3年〜58年）。上谷太守・耿況の子。光武帝（劉秀）の河北平定から従軍し、群雄の張歩が割拠する青州・斉地の平定を任された。建武5年（29年）、劇県にいた張歩に対し、耿弇はまず臨菑の西にある精兵の拠点「西安城」を某日に攻めると宣言して西安城の守備を固めさせ、一方で無防備になっていた斉の首都「臨菑城」を電撃的に急襲して半日で陥落させ、西安の敵軍をも戦わずして撤退させた（『後漢書』巻19・耿弇伝）。曹操は孫臏と並べてこの耿弇の陽動・虚実戦術を引用した。"}, "於夫羅": {"name": "於夫羅（おふら：南匈奴の持至尸逐侯単于、羌渠単于の子・呼厨泉の兄・前趙皇帝劉淵の祖父）", "wiki_title": "於夫羅", "role": "後漢末の南匈奴単于（持至尸逐侯単于、在位188年〜195年、羌渠の子）", "ai_desc": "南匈奴の単于・羌渠の長男で、呼厨泉の兄、のち五胡十六国時代に漢（前趙）を建国した劉淵の祖父（?〜195年）。中平5年（188年）、父・羌渠の命で漢朝を助けるため援軍を率いて中原へ出征していたが、その間に徴兵に反発した国人が反乱を起こして父・羌渠を殺害したため帰国できなくなり、そのまま部衆を率いて山西・河内に留まった。西河の白波賊や黒山賊・袁紹らと結んで太原・河内を抄略し、初平3年（192年）春に魏郡内黄で曹操に撃破され、翌年には陳留で再び曹操に敗れて帰順した（『三國志』巻1・武帝紀、『後漢書』巻89・南匈奴伝）。"}, "羌渠": {"name": "南単于・羌渠（きょうきょ：後漢末の南匈奴単于、於夫羅・呼厨泉の父、漢朝への援軍派遣に反発した国人に殺害される）", "wiki_title": "羌渠", "role": "後漢末の南匈奴単于（在位179年〜188年、於夫羅・呼厨泉の父）", "ai_desc": "後漢末の南匈奴の単于（?〜188年）。光和2年（179年）に中郎将・張脩によって単于に擁立された。中平4年（187年）の張純の乱および翌中平5年（188年）の白波賊蜂起に際し、後漢朝廷からの要請に応じて長男の右賢王・於夫羅に兵を率いさせて漢の救援に派遣したが、度重なる徴兵を恐れた匈奴右部の須卜氏ら国人が反乱を起こし、中平5年3月に殺害された（『後漢書』巻89・南匈奴伝）。"}, "王允": {"name": "王允（おういん：字は子師、太原郡祁県出身の司徒・録尚書事、呂布と結んで董卓を誅殺するも李傕らに殺害される）", "wiki_title": "王允", "role": "後漢の豫州刺史・河南尹・司徒・録尚書事・温侯（并州太原郡祁県の人）", "ai_desc": "并州太原郡祁県の人（137年〜192年）。代々州郡の要職を務めた名門「太原王氏」の出身で、同郷の郭泰から「王生は一日千里、王佐の才なり」と評された。豫州刺史として黄巾賊を破り、何進の下で従事中郎・河南尹となった。董卓が献帝を擁して長安に遷都すると司徒として表面上は董卓に順いつつ、密かに尚書僕射・士孫瑞および董卓の親衛隊長であった中郎将・呂布と結んで暗殺計画を進め、初平3年（192年）4月、未央宮の宮門内で董卓を誅殺した。しかし董卓の涼州旧部曲への恩赦を拒んだため、同年6月に李傕・郭汜らの決死の反撃を受けて長安が陥落し、献帝を抱えて宣平門の楼上に登ったが引きずり下ろされ、一族とともに処刑された（『後漢書』巻66・王允伝）。"}, "呂布": {"name": "呂布（りょふ：字は奉先、五原郡九原県出身の飛将・温侯、王允とともに董卓を討つも李傕らに敗れ関東へ奔る）", "wiki_title": "呂布", "role": "後漢末の群雄・中郎将・奮威将軍・温侯・のち徐州牧（并州五原郡九原県の人）", "ai_desc": "并州五原郡九原県の人（?〜198年）。弓馬の武芸と膂力に優れ「飛将」と称された。并州刺史・丁原に仕えて主簿となったが、董卓の誘いに応じて丁原を殺害し、董卓と父子の契りを結んで中郎将・都亭侯となった。しかし些細な怒りから董卓に手戟を投げつけられたことや董卓の侍女との密通が発覚することを恐れ、司徒・王允の計画に乗って初平3年（192年）4月に董卓を刺殺し、奮威将軍・温侯となった。だが6月に董卓の旧将・李傕と郭汜らに長安を攻め落とされて武関から関東へ脱出し、のちに張邈・陳宮に迎えられて兗州で曹操と死闘を繰り広げることとなる（『三國志』巻7・呂布伝）。"}, "李傕": {"name": "李傕（りかく：字は稚然、北地郡出身の董卓配下の将・車騎将軍・大司馬、長安を陥れて王允を殺し朝政を専断）", "wiki_title": "李傕", "role": "後漢末の董卓配下の将・車騎将軍・開府・池陽侯・大司馬（涼州北地郡の人）", "ai_desc": "涼州北地郡の人（?〜198年）。董卓およびその女婿・牛輔の配下として山東の朱儁や白波賊と戦った。初平3年（192年）4月に長安で董卓が王允・呂布に誅殺され、さらに牛輔も陣中で殺害されると、参謀・賈詡の「兵を解散すれば一亭長に捕らえられるが、長安を攻めれば天下を動かせる」という進言を容れ、郭汜・樊稠・張済らとともに十余万の兵で長安を包囲・陥落させて呂布を放逐し、王允を殺害して朝政を壟断した。のちに郭汜と長安城内で献帝・公卿を奪い合う内戦を起こして長安を焦土と化し、建安3年（198年）に曹操が派遣した裴茂・段煨らに討たれて三族皆殺しとなった（『三國志』巻6・董卓伝）。"}, "郭汜": {"name": "郭汜（かくし：別名は郭多、張掖郡出身の董卓配下の将・後将軍・美陽侯、李傕とともに長安を攻略し朝政を専断）", "wiki_title": "郭汜", "role": "後漢末の董卓配下の将・後将軍・美陽侯（涼州張掖郡の人）", "ai_desc": "涼州張掖郡の人（?〜197年）。別名は郭多。董卓・牛輔の部将として各地を転戦し、董卓の死後、李傕・樊稠らとともに長安へ進撃して呂布を撃破、王允を殺害し、自ら後将軍・美陽侯となって李傕とともに朝政を専断した。興平2年（195年）には李傕と猜疑心から決裂し、李傕が献帝を、郭汜が公卿をそれぞれ人質にとって長安城内で数か月にわたり凄惨な市街戦を繰り広げた。献帝が洛陽へ脱出した後の建安2年（197年）、郿において部下の伍習に殺害された（『三國志』巻6・董卓伝）。"}, "鄭遂": {"name": "鄭遂（ていすい：後漢末の任城相、兗州に侵入した青州黄巾百万の大軍と戦い戦死）", "wiki_title": "鄭遂", "role": "後漢末の任城相", "ai_desc": "後漢末の地方長官（?〜192年）。兗州の任城国の国相（任城相）を務めていたが、初平3年（192年）春〜夏、青州から兗州へ雪崩れ込んできた百万規模の青州黄巾軍の攻撃を受け、任城を守って戦死した（『三國志』巻1・武帝紀、『後漢書』巻9・孝献帝紀）。"}, "陳宮": {"name": "陳宮（ちんきゅう：字は公台、東郡出身の剛直な智謀の士、曹操を兗州牧に推戴するも後に離反し呂布の軍師となる）", "wiki_title": "陳宮", "role": "後漢末の武将・謀臣（兗州東郡東武陽県の人）", "ai_desc": "兗州東郡東武陽県の人（?〜198年）。剛直で気概と智謀に富み、若くして海内の名士たちと交わった。初平3年（192年）に兗州刺史・劉岱が青州黄巾に敗死すると、東郡太守であった曹操に「これこそ覇王の業です」と進言し、自ら単身で兗州の別駕・治中ら幹部を説得して曹操を兗州牧に迎え入れさせた。しかし後の興平元年（194年）、曹操が徐州遠征中（また名士の辺譲らを処刑した一件などから曹操に不信を抱き）、陳留太守・張邈や曹操の弟・曹穿らと語らって呂布を兗州牧として迎え入れ、曹操から兗州の大半を奪った。以後、呂布の筆頭軍師として曹操を幾度も苦しめたが、建安3年（198年）冬に下邳城が陥落して捕らえられ、曹操の助命の意を退けて従容として処刑された（『三國志』巻1・武帝紀、巻7・呂布伝）。"}, "万潜": {"name": "万潜（まんせん：兗州の州吏、鮑信とともに東郡へ赴き曹操を兗州牧に迎え入れ、のち建安年間に兗州刺史となる）", "wiki_title": "万潜", "role": "後漢末の兗州州吏・のち兗州刺史", "ai_desc": "後漢末の官僚。初平3年（192年）、兗州刺史・劉岱が青州黄巾に敗死した際、陳宮の説得を受けた州の代表（州吏）として済北相・鮑信とともに東郡へ赴き、曹操を兗州牧として迎え入れた。のち建安元年（196年）に曹操が献帝を許に奉迎した際には、曹操の上表によって列侯（関内侯）に封じられ、兗州刺史などを務めた（『三國志』巻1・武帝紀、裴注引『献帝紀』）。"}, "公孫瓚": {"name": "公孫瓚（こうそんさん：字は伯珪、遼西郡令支県出身の奮武将軍・前将軍・易侯、白馬義従を率いて袁紹と河北の覇を争う）", "wiki_title": "公孫瓚", "role": "後漢末の群雄・奮武将軍・前将軍・易侯（幽州遼西郡令支県の人）", "ai_desc": "幽州遼西郡令支県の人（?〜199年）。盧植に学び、白馬を揃えた精鋭騎兵「白馬義従」を率いて烏丸・鮮卑や青州・徐州黄巾を撃破して威名を轟かせた。従弟・公孫越が袁紹方の周昂との戦いで戦死したことを機に袁紹と全面対立し、袁術・陶謙と結んで単経を兗州刺史、田楷を青州刺史、厳綱を冀州刺史に独自に任じ、さらに別部司馬・劉備を高唐に配して南下を図ったが、界橋および平原・発干で袁紹・曹操連合軍に敗れ、のち建安4年（199年）に易京で袁紹に攻め滅ぼされた（『三國志』巻8・公孫瓚伝）。"}, "劉備": {"name": "劉備（りゅうび：字は玄徳、涿郡涿県出身の漢室宗親・のち蜀漢の初代皇帝〔昭烈帝〕）", "wiki_title": "劉備", "role": "後漢末の群雄・のち蜀漢の初代皇帝・昭烈帝（幽州涿郡涿県の人、中山靖王劉勝の末裔）", "ai_desc": "幽州涿郡涿県の人（161年〜223年）。前漢の中山靖王・劉勝の末裔。黄巾の乱で義勇兵を率いて従軍した後、同窓の公孫瓚のもとに身を寄せ、別部司馬として青州刺史・田楷とともに袁紹を防いだ功績により高唐尉・高唐令、ついで平原令・平原相に任じられた。その後、曹操の徐州侵攻に際して陶謙の救援に赴き、陶謙の没後に徐州を領して曹操・呂布・袁術らと中原の覇権を争い、のち荊州・益州を収めて蜀漢を建国した（『三國志』巻32・先主伝）。"}, "単経": {"name": "単経（ぜんけい：公孫瓚配下の将、公孫瓚により兗州刺史に任じられ平原に駐屯するも曹操・袁紹に破られる）", "wiki_title": "単経", "role": "後漢末の公孫瓚配下の部将・自称兗州刺史", "ai_desc": "後漢末の公孫瓚配下の部将（「単」は姓としては「ぜん」と読む）。初平2〜3年（191〜192年）、公孫瓚が袁紹を討つため三州の刺史を独自に任命した際、冀州刺史・厳綱、青州刺史・田楷とともに兗州刺史に任じられた。袁術の要請を受けた公孫瓚の命により平原に駐屯し、高唐の劉備・発干の陶謙とともに袁紹に迫ったが、曹操と袁紹の連合軍に撃破された（『三國志』巻1・武帝紀、巻8・公孫瓚伝）。"}, "陶謙": {"name": "陶謙（とうけん：字は恭祖、丹楊郡出身の徐州刺史・徐州牧・安東将軍・溧陽侯）", "wiki_title": "陶謙", "role": "後漢末の徐州刺史・徐州牧・安東将軍・溧陽侯（揚州丹楊郡丹楊県の人）", "ai_desc": "揚州丹楊郡丹楊県の人（132年〜194年）。幽州刺史・議郎などを経て、辺章・韓遂の乱で参軍として従軍した後に徐州刺史に任じられ、徐州の黄巾賊を破り屯田を行って州内を富ませた。長安の献帝へ貢物を送って徐州牧・安東将軍に拝される一方、袁術・公孫瓚と同盟して発干に出兵し袁紹・曹操と対立した。初平4年（193年）、下邳の闕宣と共同して泰山郡の華・費や任城国を侵した（また曹操の父・曹嵩が徐州通過中に殺害された）ことで曹操の苛烈な徐州征伐を受け、翌興平元年（194年）に病没した（『三國志』巻8・陶謙伝、『後漢書』巻73・陶謙伝）。"}, "劉表": {"name": "劉表（りゅうひょう：字は景升、山陽郡高平県出身の漢室宗親・荊州牧・鎮南将軍・成武侯、「八俊」の一人）", "wiki_title": "劉表", "role": "後漢末の荊州刺史・荊州牧・鎮南将軍・成武侯（兗州山陽郡高平県の人、魯恭王劉余の末裔）", "ai_desc": "兗州山陽郡高平県の人（142年〜208年）。前漢の魯恭王・劉余の末裔で、党人「八俊」の一人に数えられた名士。初平元年（190年）に荊州刺史として単騎で宜城に入り、蒯越・蒯良・蔡瑁ら現地豪族の協力を得て宗賊を平定し、襄陽を州治として長江・漢水流域の荊州を掌握した。袁紹と同盟を結んで南陽にいた袁術と敵対し、初平3年（192年）に孫堅を敗死させ、翌初平4年（193年）春には袁術の糧道を遮断して袁術を陳留方面へ追い出した（『三國志』巻6・劉表伝、『後漢書』巻74下・劉表伝）。"}, "劉詳": {"name": "劉詳（りゅうしょう：袁術配下の部将、初平4年春に陳留郡匡亭に駐屯するも曹操に撃破される）", "wiki_title": "袁術", "role": "後漢末の袁術配下の部将", "ai_desc": "後漢末の袁術配下の部将。初平4年（193年）春、荊州牧・劉表に糧道を断たれた袁術が北上して陳留郡の封丘に駐屯した際、前衛として匡亭に派遣されたが、鄄城から出撃した曹操の攻撃を受け、救援に駆けつけた袁術の本軍ともども大敗を喫した（『三國志』巻1・武帝紀）。"}, "闕宣": {"name": "闕宣（けつせん：下邳国の人、数千人を集めて天子を自称し陶謙と共闘するも、のち陶謙に殺害される）", "wiki_title": "闕宣", "role": "後漢末の徐州下邳国の反乱指導者", "ai_desc": "徐州下邳国の人（?〜193年）。初平4年（193年）、数千人の衆を集めて自ら天子を称した。徐州牧・陶謙は当初これと連携して共同出兵し、兗州泰山郡の華・費を奪って任城国を略奪し、配下の兵を用いて略奪を行わせたが、のちに陶謙は隙に乗じて闕宣を殺害し、その軍勢を吸収した（『三國志』巻1・武帝紀、巻8・陶謙伝、『後漢書』巻9・孝献帝紀）。"}, "孫策": {"name": "孫策（そんさく：字は伯符、呉郡富春県出身の討逆将軍・呉侯、孫堅の長男・孫権の兄、江東を平定し呉の礎を築く）", "wiki_title": "孫策", "role": "後漢末の折衝校尉・殄寇将軍・会稽太守・討逆将軍・呉侯（揚州呉郡富春県の人、孫堅の長男）", "ai_desc": "揚州呉郡富春県の人（175年〜200年）。破虜将軍・孫堅の長男で、呉の大帝・孫権の兄。父・孫堅が劉表との戦いで戦死した後、初平4年（193年）〜興平元年（194年）頃に寿春の袁術のもとへ赴いて父の旧部曲千余人を返還され、袁術の命を受けて長江を渡り、揚州刺史・劉繇、呉郡の厳白虎、会稽太守・王朗らを次々と撃破して数年で江東六郡の基盤を平定した。袁術が帝位を僭称すると絶縁して独立し、曹操の上表により討逆将軍・呉侯に封じられた。建安5年（200年）、曹操が官渡で袁紹と対峙して手薄になった隙を突き、密かに軍を整えて許都奇襲と献帝奉迎を計画したが、出陣前に旧敵である故呉郡太守・許貢の食客（刺客）に襲撃され26歳で没した（『三國志』巻1・武帝紀、巻46・孫破虜討逆伝）。"}, "応劭": {"name": "応劭（おうしょう：字は仲遠、汝南郡南頓県出身の碩学・泰山太守、『風俗通義』『漢官儀』の撰者）", "wiki_title": "応劭", "role": "後漢末の泰山太守・袁紹の軍謀校尉・著述家（豫州汝南郡南頓県の人）", "ai_desc": "豫州汝南郡南頓県の人（?〜204年頃）。博学多識で漢代の制度・故事・律令に精通し、『風俗通義』『漢官儀』『漢書集解音義』など多数の名著を残した大学者。中平6年（189年）に泰山太守となり、青州黄巾三十万の侵攻を撃退して郡内を守った。しかし初平4年（193年）〜興平元年（194年）、曹操の命で泰山郡華県に滞在していた曹操の父・曹嵩を兗州へ護送しようとした際、兵が到着する前に曹嵩一家が陶謙の兵に殺害されたため、曹操の報復を恐れて官を棄て冀州の袁紹のもとへ亡命し、軍謀校尉を務めて鄴で没した（『後漢書』巻48・応奉伝附応劭伝）。"}, "曹徳": {"name": "曹徳（そうとく：曹嵩の子・曹操の同母または異母弟、泰山郡華県で父・曹嵩とともに殺害される）", "wiki_title": "曹嵩", "role": "曹嵩の子・曹操の弟", "ai_desc": "太尉・曹嵩の子で、曹操の弟（?〜193年または194年。なお『後漢書』宦者伝・曹騰伝注引『続漢書』では名を「疾」とする）。父・曹嵩とともに徐州琅邪国・泰山郡華県に難を避けていたが、曹操のもとへ赴く途上、陶謙の兵に襲撃され、屋敷の門中で殺害された（郭頒『世語』）。"}, "韋昭": {"name": "韋昭・韋曜（いしょう／いよう：字は弘嗣、呉郡雲陽県出身の呉の侍中・高陵亭侯、『呉書』『国語注』の撰者）", "wiki_title": "韋昭", "role": "三国呉の歴史家・博士祭酒・中書僕射・侍中・左国史（揚州呉郡雲陽県の人）", "ai_desc": "揚州呉郡雲陽県の人（204年〜273年）。本来の名は「韋昭」であるが、西晋の文帝・司馬昭の諱を避けて『三國志』および裴松之注では「韋曜」と表記される。呉の太史令・丁孚や華覈らとともに呉の国史『呉書』五十五巻を編纂し、また『国語』の注釈（韋昭注）を完成させた。末帝・孫皓の暴政下で直諫を貫き、孫皓が父・孫和のために「本紀」を立てるよう命じた際にも「孫和は即位していないため『伝』とすべきである」と史家の節義を曲げずに拒んだため、鳳凰2年（273年）に獄に下されて処刑された（『三國志』巻65・韋曜伝）。"}, "張闓": {"name": "張闓（ちょうかい：陶謙配下の都尉、曹嵩の護送中に財物を奪って曹嵩を殺害し淮南へ逃亡）", "wiki_title": "張闓", "role": "後漢末の徐州牧・陶謙配下の都尉", "ai_desc": "後漢末の武将。韋昭『呉書』によれば、もと徐州牧・陶謙に仕える都尉であった。曹操が父・曹嵩を迎え入れた際、陶謙の命で騎兵二百を率いて護衛・見送りにあたったが、百余両にのぼる莫大な輜重・財物に目がくらみ、泰山郡の華県と費県の間で曹嵩一家を殺害して財物を強奪し、淮南（袁術の勢力圏）へ逃亡したとされる（のち淮南で袁術に仕え、陳国相・駱俊を暗殺した張闓と同一人物とも見られる）。"}, "荀彧": {"name": "荀彧（じゅんいく：字は文若、潁川郡潁陰県出身の尚書令・万歳亭侯、曹操から「我が子房」と称された王佐の才）", "wiki_title": "荀彧", "role": "後漢末の曹操の筆頭謀臣・侍中・守尚書令・万歳亭侯（豫州潁川郡潁陰県の人）", "ai_desc": "豫州潁川郡潁陰県の人（163年〜212年）。「荀氏の八龍」と称された荀緄の子で、若くして何顒・許劭から「王佐の才」と激賞された。初平2年（191年）、袁紹のもとを去って東郡の曹操に帰属すると、曹操は「我が子房（張良）である！」と大いに喜んで奮武司馬とした。興平元年（194年）、曹操の第2次徐州遠征中に張邈・陳宮が呂布を引き入れて兗州の大半が反乱した際、程昱・夏侯惇とともに本拠地の鄄城・范・東阿の三城を死守して曹操の覇業の崩壊を救った。さらに献帝の許都奉迎や官渡の戦いでの戦略策定など中枢の政略を一手に担い、尚書令・万歳亭侯となったが、建安17年（212年）、曹操の魏公・九錫受封に反対して曹操の不興を買い、寿春で憂死（一説に服毒自殺）した（『三國志』巻10・荀彧伝）。"}, "程昱": {"name": "程昱（ていいく：字は仲徳、東郡東阿県出身の衛尉・安郷侯、荀彧とともに兗州の三城を死守した剛毅な謀臣）", "wiki_title": "程昱", "role": "後漢末〜三国魏の東中郎将・振威将軍・衛尉・安郷粛侯（兗州東郡東阿県の人）", "ai_desc": "兗州東郡東阿県の人（141年〜220年）。初名は程立（若い頃に泰山で日輪を捧げ持つ夢を見たことを聞いた曹操が「日」を上に加えて「程昱」と改名させた）。身長八尺三寸、立派な髭を蓄えた豪胆・剛毅な人物で、青州黄巾の乱に際して東阿県を守り抜き、曹操が兗州牧となると寿張県令に招かれた。興平元年（194年）夏、曹操の徐州遠征中に張邈・陳宮・呂布が反乱を起こすと、荀彧とともに鄄城を守り、自ら故郷の范県・東阿県を説得して離反を食い止め、この三城を曹操の帰還まで守り抜いた。また苦境に陥った曹操が袁紹に家族を人質として送ろうとした際には「将軍は覇王の業を立てるお方であるのに、なぜ袁紹の下風に立つのか」と強く諫止した（『三國志』巻14・程昱伝）。"}, "曹豹": {"name": "曹豹（そうひょう：徐州牧・陶謙配下の部将、劉備とともに郯県の東で曹操を迎え撃ち、のち下邳で張飛と争い敗死）", "wiki_title": "曹豹", "role": "後漢末の陶謙・劉備配下の部将", "ai_desc": "後漢末の武将（?〜196年）。徐州牧・陶謙に仕え、興平元年（194年）夏に曹操が第2次徐州征伐を行って東海郡まで侵攻した際、救援に来ていた劉備とともに郯県の東に布陣して帰還する曹操軍を待ち伏せしたが、曹操に撃破された。陶謙の没後は徐州を継いだ劉備に仕え、建安元年（196年）に劉備が袁術と戦うため出陣した際に張飛とともに下邳の留守を任されたが、張飛と対立して呂布を城内に引き入れ、混乱の中で張飛に殺害された（『三國志』巻1・武帝紀、巻32・先主伝注引『英雄記』）。"}, "楼異": {"name": "楼異（ろうい：曹操配下の軍司馬、濮陽の戦いで落馬し火傷を負った曹操を馬に乗せて救出）", "wiki_title": "楼異", "role": "後漢末の曹操配下の司馬", "ai_desc": "後漢末、曹操に仕えた軍司馬。興平元年（194年）夏、濮陽での呂布との激戦において、青州兵が呂布の騎兵に突き崩されて曹操の陣が乱れ、曹操が炎の中を突破して脱出する際に落馬し左の掌に火傷を負った絶体絶命の場面で、すぐさま曹操を助け起こして馬に乗せ、危機から脱出させた（『三國志』巻1・武帝紀）。"}, "袁暐": {"name": "袁暐（えんい：『献帝春秋』十巻の撰者、『隋書』経籍志では「袁迪」とも表記）", "wiki_title": "献帝春秋", "role": "後漢末〜三国期の歴史家（『献帝春秋』十巻の撰者）", "ai_desc": "後漢末・献帝期の歴史を記録した史書『献帝春秋』全十巻の著者（『隋書』巻33・経籍志二では「『献帝春秋』十巻、袁迪撰」と記す）。完本は散逸したが、裴松之が『三國志』注において二十箇所近く引用しており、濮陽城内で呂布の騎兵に捕らえられた曹操が「黄色い馬に乗って逃げる者が曹操だ」と機転を利かせて難を逃れた有名な逸話などを今に伝えている。"}, "李進": {"name": "李進（りしん：済陰郡乗氏県の豪族・義士、興平元年に乗氏へ進出した呂布を独力で撃破）", "wiki_title": "李進 (後漢)", "role": "後漢末の済陰郡乗氏県の豪族・侠客", "ai_desc": "兗州済陰郡乗氏県の有力豪族（生没年不詳、なお前漢末・後漢初の同名の人物や武威太守・李進とは別人）。一族・郷党の武装勢力を率いて乗氏県を守り、興平元年（194年）9月、濮陽から南下して乗氏県へ至った天下の猛将・呂布の軍を迎え撃って打ち破り、呂布を東の山陽郡へと退却させたことでその名を歴史に刻んだ（『三國志』巻1・武帝紀）。"}, "呉資": {"name": "呉資（ごし：済陰太守、興平2年春に定陶の南城を保って曹操の奇襲を防ぎ抗戦）", "wiki_title": "呉資", "role": "後漢末の済陰太守", "ai_desc": "後漢末の済陰太守（生没年不詳）。張邈・陳宮が呂布を迎えて反乱を起こした際、呂布・陳宮側に与して済陰郡の郡治・定陶を守備した。興平2年（195年）春、曹操が定陶を奇襲した際にも南城を保って頑強に防戦し、呂布の救援軍が到来するまで持ちこたえたが、同年夏に呂布が鉅野・東緍で曹操に連敗して夜逃走した後、曹操の再攻撃を受けて定陶は陥落した（『三國志』巻1・武帝紀）。"}, "薛蘭": {"name": "薛蘭（せつらん：呂布の部将・もと泰山郡の豪族、李封とともに山陽郡鉅野に駐屯するも曹操に敗死）", "wiki_title": "薛蘭", "role": "後漢末の呂布配下の部将", "ai_desc": "後漢末の武将（?〜195年）。もと兗州泰山郡の有力者であったとみられ（『三國志』巻14・程昱伝に「東方に薛蘭・李封の徒有り」と見える）、張邈・陳宮が呂布を兗州に迎え入れると呂布に呼応した。興平2年（195年）夏、李封とともに山陽郡の鉅野に駐屯して曹操を牽制したが、曹操の攻撃を受け、呂布の救援も及ばず敗北して李封ともども斬られた（『三國志』巻1・武帝紀）。"}, "李封": {"name": "李封（りほう：呂布の部将、薛蘭とともに山陽郡鉅野に駐屯するも曹操に撃破・斬殺される）", "wiki_title": "李封", "role": "後漢末の呂布配下の部将・もと泰山郡方面の領袖", "ai_desc": "後漢末の武将（?〜195年）。薛蘭とともに泰山郡・山陽郡方面で勢力を持ち（『三國志』巻14・程昱伝）、呂布の兗州進駐に呼応してその部将となった。興平2年（195年）夏、薛蘭とともに鉅野に駐屯していたところを曹操に攻められ、救援に来た呂布も撃退されて薛蘭とともに斬首された（『三國志』巻1・武帝紀）。"}, "袁嗣": {"name": "袁嗣（えんし：袁術が任命した陳国の相、建安元年正月に武平へ進軍した曹操に降伏）", "wiki_title": "袁嗣", "role": "後漢末の袁術配下の陳相", "ai_desc": "後漢末の官僚・武将。袁術の一族または側近とみられ、袁術によって陳国の相（陳相）に任じられていたが、建安元年（196年）春正月、兗州を平定した曹操の軍が陳国の武平県に迫ると、戦わずして曹操に降伏した（『三國志』巻1・武帝紀）。"}, "董承": {"name": "董承（とうしょう：献帝の董貴人の父・霊帝母董太后の甥、衛将軍・車騎将軍、のち衣帯詔で曹操誅殺を謀り敗死）", "wiki_title": "董承", "role": "後漢末の外戚・衛将軍・車騎将軍（冀州河間国の人、董太后の甥・献帝の董貴人の父）", "ai_desc": "冀州河間国の人（?〜200年）。霊帝の生母・孝仁董皇后（董太后）の甥にあたり、娘（董貴人）が献帝の後宮に入った外戚。初め董卓の女婿・牛輔の部曲将であったが、興平2年（195年）に長安を脱出した献帝を楊奉らとともに護衛して東遷し、衛将軍に任じられた。建安元年（196年）正月には袁術の将・萇奴と結んで曹洪の献帝奉迎軍を阻んだが、後に曹操の洛陽入京・許都遷都に従って車騎将軍・開府となった。建安5年（200年）正月、献帝から密かに帯の中に隠した詔（「衣帯詔」）を受けて劉備・王子服・種輯らと曹操暗殺を企てたが、事前に発覚して一族および懐妊中の董貴人ともども処刑された（『三國志』巻1・武帝紀、巻32・先主伝）。"}, "萇奴": {"name": "萇奴（ちょうど：袁術配下の部将、衛将軍・董承と結んで険要を塞ぎ曹洪の献帝奉迎軍を阻止）", "wiki_title": "萇奴", "role": "後漢末の袁術配下の部将", "ai_desc": "後漢末の袁術配下の部将。建安元年（196年）春正月、曹操が献帝を迎え入れるため曹洪に兵を率いて西進させた際、当時献帝の側近であった衛将軍・董承と結託し、険阻な要害を塞いで曹洪の進軍を阻止した（『三國志』巻1・武帝紀、巻14・董昭伝）。"}, "何儀": {"name": "何儀（かぎ：汝南・潁川の黄巾余党の渠帥、数万の衆を擁し建安元年2月に曹操に降伏）", "wiki_title": "何儀", "role": "後漢末の汝南・潁川黄巾の首領", "ai_desc": "後漢末、豫州の汝南郡・潁川郡一帯に割拠していた黄巾の余党の首領。劉辟・黄邵・何曼らとともにそれぞれ数万の兵を擁し、初め袁術に呼応し、また孫堅にも帰附していた。建安元年（196年）2月、曹操の進撃を受けて劉辟・黄邵らが斬られると、葛陂に追い詰められて配下の軍勢とともに曹操へ降伏した（『三國志』巻1・武帝紀、巻17・于禁伝、巻18・許褚伝）。"}, "劉辟": {"name": "劉辟（りゅうへき：汝南・潁川の黄巾余党の首領、建安5年の官渡対陣中に袁紹・劉備と結んで許下を侵すも曹仁に撃破される）", "wiki_title": "劉辟", "role": "後漢末の汝南・潁川黄巾の首領", "ai_desc": "後漢末、豫州の汝南郡・潁川郡に割拠した黄巾余党の有力首領。何儀・黄邵・何曼らとともに各数万の軍勢を擁した。本紀の建安元年（196年）2月条には曹操の征討を受けて黄邵とともに斬られたと記される一方、建安5年（200年）の官渡対陣中にも「汝南の降賊・劉辟ら」が曹操に背いて袁紹に呼応し、許都周辺（許下）を略奪して袁紹から派遣された劉備の支援を受けたが、曹仁に撃破されたと記される（のち『三國志』巻32・先主伝ではさらに龔都らとともに再び劉備を迎え、高覧・張郃との戦いで戦死したと見え、建安元年時は撃破・降伏の誤記か、あるいは後継者が同名を引き継いだものと見られる）。"}, "黄邵": {"name": "黄邵（こうしょう：汝南・潁川の黄巾余党の首領、建安元年2月に曹操軍の夜襲を受けて斬殺される）", "wiki_title": "黄邵", "role": "後漢末の汝南・潁川黄巾の首領", "ai_desc": "後漢末、汝南・潁川郡に割拠した黄巾余党の首領（?〜196年）。何儀・劉辟・何曼らとそれぞれ数万の軍勢を率いた。建安元年（196年）2月、曹操が征討に乗り出すと夜間に曹操の本営を奇襲しようとしたが、于禁・楽進らの反撃・夜襲を受けて陣営を焼き払われ、斬首された（『三國志』巻1・武帝紀、巻17・于禁伝）。"}, "何曼": {"name": "何曼（かまん：汝南・潁川の黄巾余党の首領、「截天夜叉」と号した猛者、曹操・曹洪に撃破される）", "wiki_title": "何曼", "role": "後漢末の汝南・潁川黄巾の首領", "ai_desc": "後漢末、汝南・潁川郡に割拠した黄巾余党の首領。数万の兵を擁し、『三國志』巻9・曹洪伝注引王沈『魏書』によれば「截天夜叉（天を断ち切る夜叉）」と自ら号するほどの猛者であったが、建安元年（196年）2月の曹操・曹洪の征討によって撃破・斬殺された。"}, "孫堅": {"name": "孫堅（そんけん：字は文台、呉郡富春県出身の破虜将軍・長沙太守・烏程侯、孫策・孫権の父、呉の武烈皇帝）", "wiki_title": "孫堅", "role": "後漢末の破虜将軍・豫州刺史・長沙太守・烏程侯（揚州呉郡富春県の人、孫策・孫権の父）", "ai_desc": "揚州呉郡富春県の人（155年〜191年または192年）。孫子の末裔と伝えられ、黄巾の乱では朱儁の下で佐軍司馬として宛城一番乗りの大功を立て、ついで涼州の辺章・韓遂の乱に従軍した後に長沙太守・烏程侯となった。反董卓連合軍が蜂起すると長沙から北上して袁術と結び、破虜将軍・領豫州刺史として陽人・洛陽で董卓軍（胡軫・呂布・華雄）を連破し、焼け落ちた洛陽の宗廟を修復した。この頃、汝南・潁川の黄巾であった何儀・劉辟らも孫堅の威名に服して帰附していた。のち袁術の命で荊州の劉表を攻めた際、峴山で黄祖の兵に射殺され、呉の建国後に「武烈皇帝（始祖）」と追尊された（『三國志』巻46・孫破虜討逆伝）。"}, "楊奉": {"name": "楊奉（ようほう：もと白波賊の渠帥・李傕の部将、献帝の長安脱出と洛陽帰還を護衛した車騎将軍）", "wiki_title": "楊奉", "role": "後漢末の興義将軍・車騎将軍（もと白波賊の首領・李傕の部将）", "ai_desc": "後漢末の武将（?〜197年）。もとは河東・西河で蜂起した「白波賊」の首領の一人で、後に長安の李傕に仕えた。興平2年（195年）、李傕と郭汜の内戦の中で李傕の横暴を憎んで反旗を翻し、董承や故・白波賊の韓暹・胡才・李楽らとともに献帝の長安脱出・東遷を護衛して曹陽の敗戦を潜り抜け、建安元年（196年）7月に献帝を洛陽へ帰還させて車騎将軍となり河南尹の梁県に駐屯した。しかし曹操が献帝を許へ迎えるとこれを取り戻そうとして敗れ、袁術ついで呂布に身を寄せたが、建安2年（197年）に劉備に誘い出されて斬殺された（『三國志』巻1・武帝紀、巻6・董卓伝）。"}, "韓暹": {"name": "韓暹（かんせん：もと白波賊の渠帥、楊奉とともに献帝の洛陽帰還を護衛し大将軍・司隷校尉を称するも曹操入京で逃亡）", "wiki_title": "韓暹", "role": "後漢末の征東将軍・自称大将軍・領司隷校尉（もと白波賊の首領）", "ai_desc": "後漢末の武将（?〜197年）。白波賊の首領（韓暹・胡才・李楽）の一人。興平2年（195年）、董承・楊奉らの要請に応じて河東から兵を率いて献帝の東遷を救援し、建安元年（196年）7月に献帝を洛陽へ送り届けた功によって大将軍・領司隷校尉を仮称し、董承と権力を争って朝政を専断した。しかし8月に曹操が兵を率いて洛陽へ入京すると恐れて単身逃亡し、楊奉とともに袁術・呂布の間を転々とした末、建安2年（197年）に并州へ逃れる途上で抒秋県令・張宣に殺害された（『三國志』巻1・武帝紀、巻6・董卓伝）。"}, "趙忠": {"name": "趙忠（ちょうちゅう：安平国出身の十常侍の筆頭格・中常侍・車騎将軍、霊帝から「我が母」と呼ばれた権勢宦官）", "wiki_title": "趙忠", "role": "後漢末の中常侍・大長秋・車騎将軍・都郷侯（冀州安平国の人、「十常侍」の筆頭格）", "ai_desc": "冀州安平国の人（?〜189年）。桓帝の延熹2年（159年）に梁冀誅殺の功で都郷侯に封じられ、霊帝期には張譲と並ぶ「十常侍」の双璧として中常侍・大長秋・車騎将軍を歴任し、霊帝から「張常侍（張譲）は我が父、趙常侍（趙忠）は我が母なり」とまで寵信された。洛陽城西に宮殿を模した豪壮な邸宅を構えていたが、中平6年（189年）8月の袁紹・袁術らによる宦官誅滅の際に殺害された。建安元年（196年）7月、焼け野原となった洛陽へ帰還した献帝は、焼け残っていたこの趙忠の旧宅を一時の仮皇居とした（『後漢書』巻78・張譲趙忠伝、『献帝春秋』）。"}, "張楊": {"name": "張楊（ちょうよう：字は稚叔、雲中郡出身の河内太守・安国将軍・大司馬、洛陽に帰還した献帝に食糧を貢ぎ宮室を修復）", "wiki_title": "張楊", "role": "後漢末の河内太守・安国将軍・晋陽侯・大司馬（并州雲中郡の人）", "ai_desc": "并州雲中郡の人（?〜198年）。武勇により并州刺史・丁原に仕え、霊帝末年に蹇碩の配下となって仮司馬となり、のち董卓から河内太守に任じられたが反董卓連合軍に合流した。興平2年（195年）から建安元年（196年）にかけて献帝が長安から河東・洛陽へと困窮しながら東遷した際、野王から食糧や衣服を背負わせて献帝に献上し、荒廃した洛陽の宮室を修復して自らの名（「楊」）を冠した「揚安殿」を造営し、安国将軍・晋陽侯・大司馬に拝された。親友であった呂布を厚く庇護し、建安3年（198年）に曹操に包囲された呂布を救援しようとした際、部下の楊醜に殺害された（『三國志』巻8・張楊伝）。"}, "董昭": {"name": "董昭（とうしょう：字は公仁、済陰郡定陶県出身の知略家・のち魏の司徒・楽平定侯、曹操に許都遷都と魏公・九錫を献策）", "wiki_title": "董昭", "role": "後漢末〜三国魏の河南尹・冀州牧・大鴻臚・太常・司徒・楽平定侯（兗州済陰郡定陶県の人）", "ai_desc": "兗州済陰郡定陶県の人（156年〜236年）。初め袁紹に仕えて鉅鹿太守・魏郡太守として優れた治績を挙げたが、袁紹が讒言を信じたため去り、張楊を経て献帝に仕えた。建安元年（196年）、曹操が使者を送って献帝に拝謁すると、曹操の使節のために楊奉へ書簡を送って曹操を洛陽へ引き入れる道を開き、さらに洛陽が荒廃し韓暹・楊奉らが不穏であることから曹操に「許（許昌）への遷都（移駕幸許）」を献策してこれを実現させた。のちにも曹操の魏公・九錫受封や魏王昇進を主導し、魏の明帝期に司徒に至り81歳で没した（『三國志』巻14・董昭伝）。"}, "王立": {"name": "王立（おうりつ：後漢末の侍中兼太史令、天文運行から「代火者土、承漢者魏、能安天下者曹姓」と予言）", "wiki_title": "王立 (後漢)", "role": "後漢末の侍中・太史令", "ai_desc": "後漢末の侍中兼太史令。興平2年（195年）の献帝東遷に随行し、曹陽の敗戦後に献帝が黄河を下ろうとした際、太白（金星）・鎮星（土星）・熒惑（火星）の運行を理由に北渡を諫めて軹関から東へ出る進路を採らせた。また宗正・劉艾に「太白と熒惑が天関で交会したのは易姓革命の象であり、漢の天命は尽きて晋・魏の分野から興る者がある」と語り、許都遷都後も献帝に対して「火（漢）に代わる者は土、漢を継ぐ者は魏、天下を安んずる者は曹姓なり」と繰り返し進言した。曹操はこれを聞くと「朝廷への忠誠は知るが、天道は深遠ゆえ多くを語るな」と釘を刺した（張璠『漢紀』）。"}, "劉艾": {"name": "劉艾（りゅうがい：後漢末の侍中・宗正・行御史大夫、『霊帝紀』『献帝紀』の撰者）", "wiki_title": "劉艾", "role": "後漢末の陕県令・侍中・宗正・彭城相・行御史大夫（『霊献二帝紀』の撰者）", "ai_desc": "後漢末の官僚・歴史家。初め董卓の下で長史・陕県令を務め、関東諸侯の情勢分析において「孫堅は用兵に長けている」と進言した。その後、侍中・宗正（皇族を統括する九卿）として献帝の長安脱出・洛陽帰還・許都遷都に一貫して随行し、侍中兼太史令・王立から「漢の祚は終わり、晋・魏に興る者がある」との天文予言を打ち明けられた。のちに彭城相・少府などを歴任し、建安21年（216年）には行御史大夫として曹操に魏王の璽綬を授ける使者を務めた。また同時代史料として極めて価値の高い『霊帝紀』『献帝紀』（『霊献二帝紀』）を著し、裴松之注にも頻繁に引用されている。"}, "棗祗": {"name": "棗祗（そうし：潁川郡長社県出身の屯田都尉・陳留太守、許下屯田の創始を立案・主導した最大の功労者）", "wiki_title": "棗祗", "role": "後漢末の曹操配下の羽林監・屯田都尉・陳留太守（豫州潁川郡長社県の人）", "ai_desc": "豫州潁川郡長社県の人（?〜196年または197年頃）。本姓は棘（先祖が避難して棗に改姓）。曹操の挙兵に従い、興平元年（194年）に張邈・陳宮が呂布を迎えて反乱を起こした際には東阿県令として程昱とともに東阿城を死守した。建安元年（196年）、韓浩らとともに屯田制の創設を強く進言し、自ら屯田都尉（のち陳留太守）となって許都周辺（許下）での屯田事業を設計・指揮し、初年度に百万斛の穀物を収穫する大成功を収めた。その直後に病没したが、曹操は後に「故陳留太守・棗祗を封じる令」を下してその功績を惜しみなく顕彰し、子の棗処中に爵位を継がせた（『三國志』巻16・任峻伝注引『魏武故事』）。"}, "韓浩": {"name": "韓浩（かんこう：字は元嗣、河内郡出身の護軍・中護軍・万歳亭侯、屯田創始を進言し軍の統制を担った名将）", "wiki_title": "韓浩", "role": "後漢末の曹操配下の護軍・中護軍・万歳亭侯（司隸河内郡の人）", "ai_desc": "司隸河内郡の人（?〜215年頃）。義侠心と武略に富み、河内太守・王匡の従事となった後、董卓が叔父を人質にして誘ったのを拒絶し、袁術の招きにも応じず夏侯惇に招かれて曹操に仕えた。建安元年（196年）、棗祗とともに許下での屯田創設を献策して曹操の覇業の経済基盤を築き、護軍ついで中護軍（近衛・諸将監察を掌る要職）に昇って万歳亭侯に封じられた。法規の遵守と冷静沈着な判断で知られ、夏侯惇が人質に取られた際にも「国法を曲げることはできぬ」と毅然として賊を討ち夏侯惇を救出した（『三國志』巻9・夏侯惇伝附韓浩伝）。"}, "漢武帝": {"name": "孝武・武帝・劉徹（こうぶ／ぶてい：前漢の第7代皇帝、西域に屯田を開き匈奴を撃攘した前漢最盛期の皇帝）", "wiki_title": "武帝 (漢)", "role": "前漢の第7代皇帝（世宗孝武皇帝、在位前141年〜前87年）", "ai_desc": "前漢の第7代皇帝・劉徹（前156年〜前87年）。正式な諡号は「孝武皇帝（略称・孝武）」。衛青・霍去病を派遣して匈奴を漠北へ撃退し、張騫を西域へ遣わしてシルクロードを開拓した。また河西回廊から西域（輪台・渠犁など）にかけて大規模な「屯田」を設置し、現地での食糧自給によって遠征軍と西域経営を維持する先例を確立した（『史記』巻123・大宛列伝、『漢書』巻96・西域伝）。曹操は許下屯田を創始するにあたり、秦の急農政策とともにこの孝武（武帝）の西域屯田を「先代の良式（優れた手本）」として挙げた（王沈『魏書』）。"}, "張済": {"name": "張済（ちょうさい：武威郡祖厲県出身の董卓旧将・驃騎将軍・平陽侯、関中から南陽へ進出し戦死）", "wiki_title": "張済 (後漢)", "role": "後漢末の鎮東将軍・驃騎将軍・平陽侯（涼州武威郡祖厲県の人、張繡の叔父）", "ai_desc": "涼州武威郡祖厲県の人（?〜196年）。董卓の部将として山東の諸侯と戦い、董卓の死後は李傕・郭汜・樊稠とともに長安を攻略して王允を殺害し、鎮東将軍・平陽侯として弘農郡の陝に駐屯した。興平2年（195年）、長安城内で激しく争う李傕と郭汜を和解させて献帝の東遷を実現させ、驃騎将軍・開府に昇った。しかし建安元年（196年）、関中の深刻な飢饉から兵糧を求めて荊州の南陽郡へ進出し、穣城を攻めた際に流れ矢に当たって戦死した（『三國志』巻6・董卓伝附張繡伝）。"}, "張繡": {"name": "張繡（ちょうしゅう：武威郡祖厲県出身の破羌将軍・宣威侯、叔父・張済の軍勢を継いで宛に拠り曹操と戦う）", "wiki_title": "張繡", "role": "後漢末の建忠将軍・破羌将軍・宣威侯（涼州武威郡祖厲県の人、張済の従子〔甥〕）", "ai_desc": "涼州武威郡祖厲県の人（?〜207年）。驃騎将軍・張済の従子（同族の甥）。若くして県吏であった時に反乱者の韓遂・辺章に呼応した麴勝を討って郡内に名を馳せ、叔父・張済に従って長安に入り建忠将軍・宣威侯となった。建安元年（196年）、張済が南陽郡の穣城を攻めて流れ矢で戦死するとその全軍勢を引き継ぎ、同郷の謀臣・賈詡を軍師に迎え、荊州牧・劉表と同盟を結んで南陽郡の宛に駐屯した。のち一度曹操に降伏した後に叛いて曹操の長男・曹昂や典韋らを討ち取るが、官渡の戦いの前に賈詡の進言に従って再び曹操に帰順し、破羌将軍として厚遇された（『三國志』巻8・張繡伝）。"}, "曹昂": {"name": "曹昂（そうこう：字は子脩、曹操の長男・孝廉、宛城の戦いで父に馬を譲り戦死、追封・豊愍王）", "wiki_title": "曹昂", "role": "曹操の長男・孝廉（沛国譙県の人、魏の豊悼公・豊愍王）", "ai_desc": "沛国譙県の人（?〜197年）、字は子脩。曹操と劉夫人の間に生まれた長男で、生母の早世後は曹操の正室・丁夫人に実子として養育された。二十歳で孝廉に推挙された。建安2年（197年）正月、父・曹操に従って南陽郡の宛へ出征した際、一度降伏した張繡の急襲を受け、負傷した曹操に自らの馬を差し出して脱出させ、自身は宛城で戦死した（『三國志』巻1・武帝紀および注引郭頒『世語』、巻20・武文世王公伝・豊愍王昂伝）。後に魏の文帝（曹丕）の黄初2年（221年）に「豊悼公」、明帝の太和3年（229年）に「豊愍王」と追封された。"}, "曹安民": {"name": "曹安民（そうあんみん：曹操の弟の子〔甥〕、宛城の戦いで曹操に従い曹昂とともに戦死）", "wiki_title": "曹安民", "role": "曹操の甥（弟の子、沛国譙県の人）", "ai_desc": "沛国譙県の人（?〜197年）。曹操の弟の子（甥）。建安2年（197年）春正月、叔父・曹操の南陽遠征に随行していたが、宛城で張繡が突如反乱を起こした際に曹操の長男・曹昂や護衛の典韋らとともに戦死した（『三國志』巻1・武帝紀）。"}, "橋蕤": {"name": "橋蕤（きょうずい：袁術配下の筆頭大将、陳国へ侵攻した袁術の殿軍として曹操と戦い戦死）", "wiki_title": "橋蕤", "role": "後漢末の袁術配下の部将（袁術自称政権の大将軍）", "ai_desc": "後漢末の袁術配下の宿将（?〜197年）。袁術の下で各地の戦線に立ち、孫策からもその人柄を重んじられたほか（『三國志』巻46・孫破虜討逆伝注引『江表伝』）、袁術が淮南で帝位を僭称した際には大将軍に任じられて呂布攻撃などを指揮した（『三國志』巻7・呂布伝）。建安2年（197年）秋9月、袁術に従って陳国へ侵攻した際、曹操の親征を知った袁術が軍を棄てて淮南へ逃げ帰った後も李豊・梁綱・楽就とともに戦場に留め置かれ、到着した曹操軍（于禁ら）の猛攻を受けて撃破され、四将ともども斬殺された（『三國志』巻1・武帝紀、巻17・于禁伝）。"}, "李豊": {"name": "李豊（りほう：袁術配下の部将、建安2年9月に陳国で橋蕤らとともに曹操軍に撃破され戦死）", "wiki_title": "李豊 (袁術部将)", "role": "後漢末の袁術配下の部将", "ai_desc": "後漢末の袁術配下の部将（?〜197年、のち蜀漢の李厳の子・李豊や魏の中書令・李豊とは同姓同名の別人）。建安2年（197年）秋9月、袁術の陳国侵攻に従軍したが、曹操が自ら東征して来ると聞いた袁術が本軍を棄てて逃走した際、橋蕤・梁綱・楽就とともに抑えとして残され、曹操軍に撃破されて斬首された（『三國志』巻1・武帝紀、巻6・袁術伝、巻17・于禁伝）。"}, "梁綱": {"name": "梁綱（りょうこう：袁術配下の部将、建安2年9月に陳国で橋蕤・李豊・楽就とともに曹操軍に敗れ戦死）", "wiki_title": "梁綱", "role": "後漢末の袁術配下の部将", "ai_desc": "後漢末の袁術配下の部将（?〜197年）。建安2年（197年）秋9月、袁術に従って陳国へ侵攻した際、曹操の親征を知って退却した袁術により橋蕤・李豊・楽就とともに現地に留め置かれ、曹操軍（于禁ら）の攻撃を受けて敗死した（『三國志』巻1・武帝紀、巻6・袁術伝、巻17・于禁伝）。"}, "楽就": {"name": "楽就（がくしゅう：袁術配下の部将、建安2年9月に陳国で橋蕤らとともに曹操軍に敗れ戦死）", "wiki_title": "楽就", "role": "後漢末の袁術配下の部将", "ai_desc": "後漢末の袁術配下の部将（?〜197年）。寿春・淮南の袁術に仕え、建安2年（197年）秋9月の陳国侵攻において、逃走した袁術の後に橋蕤・李豊・梁綱とともに留め置かれ、東征してきた曹操の軍に撃破されて斬殺された（『三國志』巻1・武帝紀、巻6・袁術伝、巻17・于禁伝）。"}, "鄧済": {"name": "鄧済（とうさい：荊州牧・劉表配下の部将、南陽郡の湖陽を守るも曹操軍に攻め落とされ生け捕りとなる）", "wiki_title": "鄧済", "role": "後漢末の荊州牧・劉表配下の部将", "ai_desc": "後漢末、荊州牧・劉表に仕えた部将。建安2年（197年）冬11月、曹操が張繡・劉表を討つため南陽へ親征した際、南陽郡南東部の湖陽県に立てこもって防戦したが、曹操軍に城を攻め落とされて生け捕りとなり、湖陽は降伏した（『三國志』巻1・武帝紀）。"}, "田豊": {"name": "田豊（でんほう：字は元皓、鉅鹿郡出身の袁紹の別駕、許都急襲と献帝擁立を進言した剛直の名参謀）", "wiki_title": "田豊", "role": "後漢末の侍御史・冀州別駕（冀州鉅鹿郡〔一説に勃海郡〕の人）", "ai_desc": "冀州鉅鹿郡（一説に勃海郡）の人（?〜200年）、字は元皓。天姿愽大で権略に富み、朝廷で侍御史を務めたが宦官の専横を憤って官を棄てて帰郷し、後に冀州牧・袁紹に礼を尽くして招かれ別駕として重用された。公孫瓚討滅の計略を立てて功を挙げ、建安3年（198年）5月に曹操が南陽で張繡を包囲していた際には「早く許都を奇襲し、天子を挟んで諸侯に号令すべきである」と進言したが袁紹は用いなかった。建安5年（200年）の官渡の戦いでも短期決戦を戒めて持久戦を強く主張したため袁紹の怒りを買って獄に繋がれ、官渡での敗戦後に逢紀の讒言によって処刑された（『三國志』巻6・袁紹伝および注引『先賢行状』）。"}, "高順": {"name": "高順（こうじゅん：呂布配下の筆頭猛将、「陥陣営」と号された精鋭部隊を率い厳正清廉で知られた宿将）", "wiki_title": "高順", "role": "後漢末の呂布配下の部将（陥陣営の指揮官）", "ai_desc": "後漢末の呂布配下の猛将（?〜198年）。王粲『英雄記』によれば、人柄は清廉潔白・威厳重厚で酒を飲まず賄賂も一切受け取らず、率いる兵はわずか七百余人（千人と号した）であったが鎧兜・武具は常に精錬・整備され、戦うごとに必ず敵陣を突き崩したため「陥陣営（かんじんえい）」と恐れられた。建安3年（198年）、呂布の命で小沛の劉備を攻め、曹操が派遣した夏侯惇の救援軍をも撃退して劉備を打ち破ったが、同年冬の下邳城陥落時に呂布・陳宮らとともに捕らえられ、処刑された（『三國志』巻1・武帝紀、巻7・呂布伝および注引『英雄記』）。"}, "侯諧": {"name": "侯諧（こうかい：徐州彭城国の相、建安3年10月に曹操の東征を受けて彭城陥落時に捕縛される）", "wiki_title": "侯諧", "role": "後漢末の呂布陣営の彭城相", "ai_desc": "後漢末の地方長官。呂布の勢力下で徐州彭城国の相（彭城相）として彭城を守備していたが、建安3年（198年）冬10月、呂布討伐のため東征してきた曹操軍の猛攻を受けて彭城が陥落した際に捕らえられた（『三國志』巻1・武帝紀）。"}, "成廉": {"name": "成廉（せいれん：呂布側近の驍将、常山での黒山賊突撃以来の腹心騎将、下邳城外で曹操軍に捕らえられる）", "wiki_title": "成廉", "role": "後漢末の呂布配下の驍将（側近騎将）", "ai_desc": "後漢末の呂布腹心の猛将。呂布が長安を脱出して袁紹と組み常山で黒山賊の張燕と戦った際、魏越らとともに数十騎で一日三・四度も張燕の一万余の精兵に突撃して敵陣を斬り崩した側近の騎将である（『三國志』巻7・呂布伝）。建安3年（198年）冬10月、曹操軍が下邳へ迫った際に呂布に従って出撃したが、野戦で大敗して曹操軍（楽進ら）に捕らえられた（『三國志』巻1・武帝紀、巻17・楽進伝）。"}, "荀攸": {"name": "荀攸（じゅんゆう：字は公達、潁川郡潁陰県出身の曹操の軍師・尚書令・陵樹亭侯、下邳水攻めをはじめ無数の奇策を立てた謀主）", "wiki_title": "荀攸", "role": "後漢末〜魏初の曹操の中軍師・尚書令・陵樹敬侯（豫州潁川郡潁陰県の人、荀彧の従甥）", "ai_desc": "豫州潁川郡潁陰県の人（157年〜214年）、字は公達。荀彧の従甥（年上であるが系譜上は甥）にあたる。何進に徴されて黄門侍郎となり、長安で董卓暗殺を謀って投獄されたが董卓の死により免れた。建安元年（196年）、許都に迎えられた曹操から汝南太守ついで尚書に招かれ、曹操は「公達は非常の人なり、吾がこれと事を計らば、天下に何をか憂えん」と絶賛して軍師とした。建安3年（198年）の下邳包囲戦では、撤退しようとした曹操を郭嘉とともに諫め、泗水・沂水を決壊させる水攻めを献策して呂布を滅ぼしたほか、白馬・延津・烏巣など全ての主要戦役で奇策を巡らせた（『三國志』巻10・荀攸伝）。"}, "郭嘉": {"name": "郭嘉（かくか：字は奉孝、潁川郡陽翟県出身の司空軍師祭酒・洧陽亭侯、神算鬼謀で曹操の華北平定を導いた天才参謀）", "wiki_title": "郭嘉", "role": "後漢末の曹操の司空軍師祭酒・洧陽貞侯（豫州潁川郡陽翟県の人）", "ai_desc": "豫州潁川郡陽翟県の人（170年〜207年）、字は奉孝。初め北方の袁紹を訪ねたが「大業をともに成す人物ではない」と見限って去り、建安元年（196年）に戯志才の後任として荀彧の推挙を受け、曹操と天下の計を論じて「我が大業を成さしむるは必ずこの人なり」と激賞されて司空軍師祭酒となった。袁紹に対する「十勝十敗」の説を唱えて曹操の決断を促し、建安3年（198年）の下邳包囲戦では「呂布は今や勢い尽き気力も衰えており、急攻すれば必ず破れる」と撤退に反対して荀攸とともに泗水・沂水の水攻めを進言し呂布を討滅した。建安12年（207年）の白狼山（烏丸遠征）でも電撃戦を献策して大勝をもたらしたが、帰途に病没し曹操に深く悼まれた（『三國志』巻14・郭嘉伝）。"}, "宋憲": {"name": "宋憲（そうけん：呂布配下の部将、下邳水攻めの中で魏続・侯成らとともに陳宮を捕縛して曹操に降伏）", "wiki_title": "宋憲", "role": "後漢末の呂布配下の部将・のち曹操配下の将", "ai_desc": "後漢末の武将。呂布の部将として徐州に従ったが、建安3年（198年）冬、曹操軍による泗水・沂水の水攻めで下邳城が水没し一か月余りにわたり孤立する中、同僚の侯成が酒を禁じた呂布から処罰されそうになったことを契機に魏続・侯成らと共謀し、陳宮（および高順）を捕縛して城を挙げて曹操に降伏した（『三國志』巻1・武帝紀、巻7・呂布伝注引『九州春秋』）。"}, "魏続": {"name": "魏続（ぎぞく：呂布と姻戚関係にあった部将、下邳包囲戦で宋憲・侯成らと陳宮を捕らえ曹操に開城降伏）", "wiki_title": "魏続", "role": "後漢末の呂布配下の部将", "ai_desc": "後漢末の武将。王粲『英雄記』によれば呂布と親族（内・外戚）の関係にあり、かつて郝萌が反乱した際には高順とともにこれを鎮圧した。建安3年（198年）冬、曹操軍による下邳水攻めが長期化する中、侯成・宋憲らと語らって陳宮を捕らえ、城を挙げて曹操に降伏し呂布滅亡の決定打となった（『三國志』巻1・武帝紀、巻7・呂布伝および注引『英雄記』『九州春秋』）。"}, "臧覇": {"name": "臧覇（ぞうは：字は宣高、泰山郡華県出身の琅邪相・徐州刺史・鎮東将軍・良成威侯、青・徐沿海の統治を委ねられた泰山諸将の盟主）", "wiki_title": "臧覇", "role": "後漢末〜三国魏の琅邪相・徐州刺史・鎮東将軍・執金吾・良成威侯（兗州泰山郡華県の人）", "ai_desc": "兗州泰山郡華県の人（?〜230年代頃）、字は宣高。若くして無実の罪で捕らえられた父・臧戒を食客数十人を率いて費県の西山で奪還して勇名を馳せた。黄巾討伐で陶謙に仕えて騎都尉となり、開陽に駐屯して孫観・呉敦・尹礼ら泰山諸将の盟主として独自の軍事集団を形成した。呂布が劉備を破ると一時呂布と同盟したが、建安3年（198年）冬に呂布が滅びて曹操に招かれると、呉敦・尹礼・孫観らを説得して帰順し、曹操から厚遇されて琅邪相に任じられ、青州・徐州の沿海諸郡の軍政を一任された。以後、官渡の戦いでの青州牽制や対孫権戦線で常に東方の重鎮として活躍した（『三國志』巻18・臧覇伝）。"}, "孫観": {"name": "孫観（そんかん：字は仲台、泰山郡出身の北海太守・青州刺史・振威将軍、臧覇とともに帰順し対呉戦線の先鋒で活躍）", "wiki_title": "孫観", "role": "後漢末〜曹操配下の北海太守・青州刺史・振威将軍・呂都亭侯（兗州泰山郡の人）", "ai_desc": "兗州泰山郡の人（?〜217年頃）、字は仲台、別名は嬰子。臧覇・呉敦・尹礼らとともに開陽で兵を集め、呂布の滅亡後に臧覇に説得されて曹操に帰順し、北海太守に任じられた。常に臧覇とともに征伐の先鋒を務めて臧覇に次ぐ功績を挙げ、青州刺史・振威将軍・仮節に昇った。後に曹操の濡須口遠征（対孫権戦）で左足を矢で射られながらも力戦して曹操から激賞されたが、その戦傷がもとで没した（『三國志』巻18・臧覇伝附孫観伝）。"}, "呉敦": {"name": "呉敦（ごとん：別名は黯奴、泰山諸将の一人、呂布滅亡後に臧覇とともに曹操へ帰順し利城太守に任じられる）", "wiki_title": "呉敦", "role": "後漢末の泰山諸将の一人・利城太守", "ai_desc": "後漢末の武将、別名は黯奴。泰山郡・琅邪国方面で臧覇・孫観・尹礼らとともに独立勢力を築き、臧覇を帥として推戴した。一時呂布に従った後、建安3年（198年）冬に呂布が敗死すると臧覇の呼びかけに応じて曹操に帰順し、東海郡から分割新設された利城郡の太守（利城太守）に任じられた（『三國志』巻1・武帝紀、巻18・臧覇伝）。"}, "尹礼": {"name": "尹礼（いんれい：別名は盧児、泰山諸将の一人、曹操に帰順して東莞太守となり、のち魏の対呉戦線で戦死）", "wiki_title": "尹礼", "role": "後漢末〜三国魏の東莞太守（泰山諸将の一人）", "ai_desc": "後漢末〜三国魏の武将（?〜222年）、別名は盧児。臧覇・孫観・呉敦らとともに泰山・開陽に勢力を張り、呂布滅亡後に曹操へ帰順して東莞太守に任じられた（『三國志』巻18・臧覇伝）。のち魏の文帝の黄初3年（222年）、臧覇に従って洞浦で呉の呂範・全琮・徐盛らと戦った際に戦死した（『三國志』巻60・全琮伝）。"}, "昌狶": {"name": "昌狶（しょうき：泰山諸将の一人、東海・昌慮方面に割拠し曹操に帰順するも、のち再三叛いて于禁に処刑される）", "wiki_title": "昌狶", "role": "後漢末の泰山方面の群雄・東海郡周辺の領袖", "ai_desc": "後漢末の武将（?〜206年）。泰山方面で兵を集めて臧覇・孫観・呉敦・尹礼らと並び称され、呂布滅亡後に曹操に帰順した。しかし建安5年（200年）の官渡の戦いに際して劉備に呼応して東海郡で反乱を起こし、その後も張遼・夏侯淵・于禁らの討伐を受けて降伏と再反乱を繰り返した末、建安11年（206年）に旧友であった于禁に包囲されて降伏したが、于禁が涙を流して軍法を執行したことにより陣中で斬首された（『三國志』巻1・武帝紀、巻17・張遼伝・于禁伝、巻18・臧覇伝）。"}, "畢諶": {"name": "畢諶（ひつしん：東平国出身の兗州別駕・のち魯相、母を人質に取られ一度離反するも孝心を嘉され赦免）", "wiki_title": "畢諶", "role": "後漢末の曹操配下の兗州別駕・魯相（兗州東平国の人）", "ai_desc": "兗州東平国の人（生没年不詳）。曹操が兗州牧となった当初、別駕従事に抜擢された。興平元年（194年）に張邈が反乱を起こした際、母・弟・妻子を張邈に人質として拉致され、曹操から「老母が向こうにいるのだから去ってよい」と送り出されると一度は涙ながらに二心なきを誓ったが、退出後に逃亡して張邈・呂布側へ帰順した。建安3年（198年）冬に呂布が滅びて生け捕りにされた際、周囲は処刑を恐れたが、曹操は「親に孝行な者が主君に忠義でないはずがあろうか。これこそ我が求める人材である」と述べて罪を赦し、魯国の相（魯相）に任じた（『三國志』巻1・武帝紀）。"}, "楊彪": {"name": "楊彪（ようひょう：字は文先、弘農郡華陰県出身の四世三公の名臣・太尉、献帝の東遷を守り抜いた漢室の重鎮）", "wiki_title": "楊彪", "role": "後漢末の司空・司徒・太尉・光禄大夫（司隸弘農郡華陰県の人、楊震の曽孫・楊賜の子・楊脩の父）", "ai_desc": "司隸弘農郡華陰県の人（142年〜225年）、字は文先。「関西の孔子」と称された楊震の曽孫、太尉・楊賜の子で、楊脩の父にあたる四世三公の名門「弘農楊氏」の当主。司空・司徒・太尉を歴任し、董卓の洛陽遷都論に真っ向から反対し、李傕・郭汜の乱や献帝の苦難の東遷においても命を懸けて献帝を守り抜いた。袁紹とは旧怨があり、また妻が袁術の姉妹（袁術と姻戚）であったことから、建安4年（199年）頃に曹操から袁術と通謀したとの嫌疑をかけられて投獄され、死罪寸前まで追い詰められたが、孔融や荀彧の必死の弁護と許県令・満寵の公正な取り調べにより釈放された。のち曹丕が禅譲を受けて魏を建国した際にも太尉就任を固辞し、漢室の遺臣としての節を全うした（『後漢書』巻54・楊震伝附楊彪伝、『三國志』巻1・武帝紀注引『魏書』）。"}, "梁紹": {"name": "梁紹（りょうしょう：後漢末の大長秋、袁紹から旧怨により処刑を求められるも曹操に拒絶される）", "wiki_title": "大長秋", "role": "後漢末の大長秋", "ai_desc": "後漢末の宮中官僚（生没年不詳）。皇后宮の長官である大長秋を務めていた。王沈『魏書』によれば、かねてより袁紹と不仲であり、袁紹は曹操に対して前の太尉・楊彪や少府・孔融とともに別の罪過を口実にして梁紹を処刑させようと働きかけたが、曹操は天下の人心が疑心暗鬼に陥っている時期であることを理由にこれを拒絶した（『三國志』巻1・武帝紀注引『魏書』）。"}, "孔融": {"name": "孔融（こうゆう：字は文挙、魯国出身の孔子二十世の孫・北海相・少府、「建安七子」筆頭格の名士）", "wiki_title": "孔融", "role": "後漢末の北海相・将作大匠・少府・太中大夫（豫州魯国魯県の人、孔子二十世の孫）", "wiki_note": "", "ai_desc": "豫州魯国魯県の人（153年〜208年）、字は文挙。孔子二十世の孫。幼少より俊才として名高く、党錮の禍では兄に代わって張倹を匿った義節で知られた。董卓に抵抗して北海相に出向し、黄巾賊に攻められた後に許都の朝廷へ入って将作大匠・少府・太中大夫を歴任し、「建安七子」の筆頭格として文壇と清流知識人を牽引した。常に食客が門に満ち溢れる声望を持つ一方、曹操の禁酒令や烏丸遠征・曹丕の甄氏納妃などを痛烈な皮肉で批判し続けたため、建安13年（208年）8月、郗慮・路粋の弾劾奏上を受けた曹操によって不孝・大逆の罪で妻子ともども処刑された（『後漢書』巻70・孔融伝、『三國志』巻12・崔琰伝注引『続漢書』）。"}, "雍歯": {"name": "雍歯（ようし：前漢創業期の武将・什邡侯、高祖劉邦が最も憎んだ宿敵ながら群臣安定のため真っ先に封侯される）", "wiki_title": "雍歯", "role": "前漢の武将・什邡粛侯（沛県豊邑の人）", "ai_desc": "沛県豊邑の人（?〜前184年）。もと豊邑の豪族で、秦末に同郷の劉邦（高祖）に従って挙兵したが、劉邦を嫌って魏に内通し豊邑を挙げて背いたため、劉邦から骨髄に徹するほど憎まれた。のちに趙・項羽を経て再び劉邦に帰順して戦功を重ねた。前漢建国後の高祖6年（前201年）、功臣への封爵が定まらず諸将が誅殺を恐れて謀反を囁き合っていた際、張良の「陛下が平生最も憎んでおられる者を封じれば群臣はみな安心します」との献策を容れた劉邦により真っ先に什邡侯（二千五百戸）に封じられ、これを見た諸将が「雍歯ですら侯になれたのだから我々は安心だ」と静まった故事で知られる（『史記』巻55・留侯世家、『漢書』巻40・張良伝）。"}, "裴松之": {"name": "裴松之（はいしょうし：字は世期、河東郡聞喜県出身の南朝宋の歴史家・中書侍郎・太中大夫、『三國志注』の撰者）", "wiki_title": "裴松之", "role": "東晋末〜南朝宋の歴史家・中書侍郎・司州主簿・永嘉太守・国子博士・太中大夫（本貫は司州河東郡聞喜県）", "ai_desc": "本貫は河東郡聞喜県の人（372年〜451年）、字は世期。南朝宋の文帝（劉義隆）から陳寿『三國志』が簡略に過ぎるとして注釈編纂の勅命を受け、元嘉6年（429年）に全六十五巻の『三國志注』（裴松之注）を完成させて上表した（自称の「臣松之」は皇帝への上表形式による）。現在では散逸してしまった王沈『魏書』・魚豢『魏略』・韋昭『呉書』・司馬彪『九州春秋』・郭頒『世語』など二百種以上の漢末・魏晋期の史書・家伝・記録を博捜して本文の欠落や異伝を補い、あわせて史料批判や人物論評を加えており、文帝から「不朽の業」と激賞された（『宋書』巻64・裴松之伝）。"}, "楊醜": {"name": "楊醜（ようしゅう：大司馬・張楊配下の部将、主君の張楊を殺害するも同僚の眭固に討たれる）", "wiki_title": "楊醜", "role": "後漢末の張楊配下の部将", "ai_desc": "後漢末、河内太守・大司馬であった張楊の部将（?〜198年または199年）。建安3年（198年）冬、曹操に包囲された下邳の呂布に呼応して張楊が東市へ出兵し救援を図った際、張楊を殺害して曹操へ帰順しようとしたが、張楊の別将であった眭固によって直ちに討ち取られた（『三國志』巻1・武帝紀、巻8・張楊伝）。"}, "史渙": {"name": "史渙（しかん：字は公劉、沛国出身の曹操腹心の中軍校尉・列侯、曹仁とともに犬城で眭固を撃破・斬殺）", "wiki_title": "史渙", "role": "後漢末の曹操配下の中軍校尉・列侯（豫州沛国の人）", "ai_desc": "豫州沛国の人（?〜209年）、字は公劉。若くして任侠の気概と武勇で知られ、曹操の挙兵当初から行中軍校尉として従軍し、常に諸将を監督・統率して曹操から厚い信任を受けた。建安4年（199年）4月、曹仁とともに黄河を渡って犬城（射犬）で眭固の軍を迎え撃ち、これを大破して眭固を斬った。翌建安5年（200年）の官渡の戦いでも徐晃とともに袁紹軍の兵糧輸送車数千両を焼き払う大功を立て、中領軍・列侯に進み、韓浩と並び忠勇をもって称えられた（『三國志』巻1・武帝紀、巻9・夏侯惇伝附韓浩史渙伝）。"}, "曹仁": {"name": "曹仁（そうじん：字は子孝、曹操の従弟、大司馬・陳忠侯、創業の先鋒から樊城死守まで曹氏随一の武勲を立てた名将）", "wiki_title": "曹仁", "role": "後漢末〜三国魏の征南将軍・大将軍・大司馬・陳忠侯（豫州沛国譙県の人、曹操の従弟）", "ai_desc": "豫州沛国譙県の人（168年〜223年）、字は子孝。曹操の従弟（祖父は曹褒、父は熾）。若き日は弓馬と狩猟を好んで豪傑千余人を集め、曹操の挙兵に従い別部司馬・行厲鋒校尉として常に騎兵の先鋒を務めた。徐州征伐・呂布討伐・張繡征討で戦功を重ね、建安4年（199年）4月には史渙とともに黄河を渡り犬城で眭固を撃破・斬殺した。のち官渡の戦いでの隠強・鶏洛山奇襲、赤壁後の江陵防衛戦、建安24年（219年）の関羽に対する樊城死守など数多の危機を救い、文帝（曹丕）の代に大将軍・大司馬に昇った（『三國志』巻9・曹仁伝）。"}, "薛洪": {"name": "薛洪（せつこう：大司馬・張楊の旧長史、繆尚とともに射犬を守備したのち曹操に開城降伏し列侯に封じられる）", "wiki_title": "薛洪", "role": "後漢末の張楊の故長史・列侯", "ai_desc": "後漢末の官僚・武将。河内太守・大司馬であった張楊の下で長史を務めていた。張楊が楊醜に殺害され、さらに楊醜を殺した眭固が射犬に駐屯すると、河内太守・繆尚とともに射犬の留守を任された。建安4年（199年）4月、眭固が犬城で史渙・曹仁に討ち取られ、曹操の本軍が黄河を渡って射犬を包囲すると、董昭の単身入城による説得を受けて繆尚とともに軍勢を率いて降伏し、列侯に封じられた（『三國志』巻1・武帝紀、巻14・董昭伝）。"}, "繆尚": {"name": "繆尚（ぼくしょう：後漢末の河内太守、薛洪とともに射犬で曹操軍に降伏し列侯に封じられる）", "wiki_title": "繆尚", "role": "後漢末の河内太守・列侯", "ai_desc": "後漢末の地方長官（「繆」は姓としては「ぼく」と読む）。張楊・眭固の勢力下で河内太守を務め、建安4年（199年）4月、北の袁紹へ救援を求めに出た眭固に代わって故長史・薛洪とともに射犬城を留守した。眭固の戦死後、黄河を渡って射犬を包囲した曹操から告諭文と董昭の説得を受け、薛洪とともに城を開いて降伏し、列侯に封じられた（『三國志』巻1・武帝紀、巻14・董昭伝）。"}, "魏種": {"name": "魏種・魏种（ぎしゅ：兗州出身の孝廉・河内太守、反乱時の逃亡に曹操を激怒させるも射犬陥落後に才を惜しまれ抜擢）", "wiki_title": "魏種", "role": "後漢末の孝廉・河内太守（兗州の人、原文表記は「魏种」）", "ai_desc": "兗州の人（生没年不詳、『三國志』原文表記は「魏种」）。かつて曹操から孝廉に推挙され、興平元年（194年）に張邈・陳宮が兗州で反乱を起こした際にも曹操は「ただ魏種だけは私を見棄てまい」と厚く信頼していた。しかし魏種も逃亡したと聞くや曹操は激怒し、「南は越、北は胡へ逃げぬ限りお前を捨て置かぬぞ」と断言した。その後、建安4年（199年）4月に河内郡の射犬が陥落した際に生け捕りとなったが、曹操は「ただその才能ゆえである！」と述べて縄目を解き、即座に要衝の河内太守に抜擢して河北方面の軍務を委ねた（『三國志』巻1・武帝紀）。"}, "于禁": {"name": "于禁（うきん：字は文則、泰山郡鉅平県出身の左将軍・仮節鉞・益寿亭侯、厳正な軍律と堅守で知られた曹魏五将軍の筆頭格）", "wiki_title": "于禁", "role": "後漢末〜三国魏の平虜校尉・虎威将軍・左将軍・仮節鉞・益寿亭侯（兗州泰山郡鉅平県の人）", "ai_desc": "兗州泰山郡鉅平県の人（?〜221年）、字は文則。済北相・鮑信の募兵に応じたのち曹操に帰属し、軍規の厳正さと沈着堅固な指揮によって頭角を現した。宛城の敗戦時には略奪を行った青州兵を討って夏侯惇らから称賛され、曹操から「古の名将にも勝る」と激賞されて益寿亭侯に封じられた。建安4年（199年）秋8月、袁紹との決戦を前に黄河沿岸（延津付近の河上）の守備を託され、翌年にかけて延津・原武で袁紹軍の渡河攻撃を撃退し官渡本戦でも奮戦した。のち左将軍・仮節鉞に昇ったが、建安24年（219年）の樊城救援で漢水の暴漲により関羽に降伏し、呉から帰還後に死去した（『三國志』巻17・于禁伝）。"}, "袁譚": {"name": "袁譚（えんたん：字は顕思、袁紹の長男・青州刺史・車騎将軍、青州に拠り袁紹没後に弟の袁尚と後継を争う）", "wiki_title": "袁譚", "role": "後漢末の青州刺史・自称車騎将軍（豫州汝南郡汝陽県の人、袁紹の長男）", "ai_desc": "豫州汝南郡汝陽県の人（?〜205年）、字は顕思。袁紹の長男（袁紹の命で亡兄・袁基の後嗣に入った）。父の命で青州に出鎮して平原から北海・東莱に至る地域を攻略して青州刺史となったが、統治が乱れ、建安4年（199年）には困窮した叔父（一説に従叔父）の袁術を青州へ迎え入れようとしたが曹操が派遣した劉備らに阻まれ、さらに臧覇らの侵攻を受けた。建安7年（202年）に袁紹が病没すると、末弟・袁尚との間で激しい後継者内紛を起こし、一度は曹操に降って娘を曹整に嫁がせたものの再び背き、建安10年（205年）正月に南皮で曹操軍に攻め滅ぼされた（『三國志』巻6・袁紹伝附袁譚伝）。"}, "朱霊": {"name": "朱霊（しゅれい：字は文博、清河国出身の曹操配下の名将・後将軍・高唐亭侯、もと袁紹の将から曹操の器量に服して帰順）", "wiki_title": "朱霊", "role": "後漢末〜三国魏の横野将軍・後将軍・高唐亭侯・鄃威侯（冀州清河国鄃県の人）", "ai_desc": "冀州清河国鄃県の人（生没年不詳）、字は文博。初め袁紹に仕えていたが、初平4年〜興平元年頃に曹操が陶謙を征伐した際、袁紹から督三営の援軍指揮官として曹操のもとへ派遣された。その陣中で「真の明主は曹公である」と見抜き、戦後も袁紹のもとへ帰らず配下の将士ともども曹操に留まり仕えた。建安4年（199年）には北上を図る袁術を阻止するため劉備とともに派遣され、その後も官渡・冀州平定・関中平定（潼関・安定）・濡須口などあらゆる戦線で戦功を立て、于禁・張遼・張郃・徐晃らと並ぶ宿将として後将軍・高唐亭侯（のち鄃侯）に昇った（『三國志』巻17・徐晃伝附朱霊伝）。"}, "車冑": {"name": "車冑（しゃちゅう：曹操が任命した徐州刺史、建安4年冬に下邳で離反した劉備に殺害される）", "wiki_title": "車冑", "role": "後漢末の曹操配下の徐州刺史", "ai_desc": "後漢末の武将・地方長官（?〜199年）。建安3年（198年）冬に曹操が呂布を滅ぼして徐州を平定したのち、徐州刺史に任じられて下邳を守備していた。しかし翌建安4年（199年）、袁術迎撃の名目で許都を出立して下邳へ至った劉備が密かに董承らの反曹操陰謀に呼応して挙兵した際、襲撃されて殺害された（『三國志』巻1・武帝紀、巻32・先主伝）。"}, "劉岱_沛国": {"name": "劉岱（りゅうたい：字は公山、沛国出身の曹操配下の司空長史・列侯〔※東萊出身の故・兗州刺史・劉岱とは同姓同名の別人〕）", "wiki_title": "劉岱 (沛国)", "role": "後漢末の曹操配下の司空長史・列侯（豫州沛国の人）", "ai_desc": "豫州沛国の人（生没年不詳）、字は公山（初平3年〔192年〕に青州黄巾と戦って戦死した東萊郡牟平県出身の兗州刺史・劉岱〔字も公山〕とは同姓同名・同字の別人）。『魏武故事』によれば、曹操の下で司空長史として数々の征伐に従軍し、戦功によって列侯に封じられた。建安4年（199年）冬、徐州刺史・車冑を殺害して小沛に拠った劉備を討つため中郎将・王忠とともに派遣されたが勝てず、翌年正月の曹操親征を迎えることとなった（『三國志』巻1・武帝紀および注引『魏武故事』）。"}, "王忠": {"name": "王忠（おうちゅう：右扶風出身の曹操配下の中郎将・揚武将軍・都亭侯、関中の飢乱を生き抜き千余人を率いて帰順）", "wiki_title": "王忠 (三国)", "role": "後漢末〜魏初の曹操配下の中郎将・揚武将軍・都亭侯（司隸右扶風の人）", "ai_desc": "司隸右扶風の人（?〜220年代頃）。魚豢『魏略』によれば、若くして亭長となり、三輔の大乱と飢饉の中で人肉を食らって生き延び、南の武関へ向かった。その途上で荊州（劉表）の命により北方の流寓者を迎えに来ていた婁子伯（婁圭）と遭遇したが、荊州行きを拒んで仲間とともに婁圭を襲撃してその兵を奪い、千余人の衆を集めて曹操に帰順し、中郎将に拝された。建安4年（199年）には司空長史・劉岱とともに小沛の劉備を攻撃したが克てなかった。のちに揚武将軍・都亭侯に進み、黄初元年（220年）の「九品官人法」制定の上奏や魏公・魏王勧進の上表にも名を連ねている（『三國志』巻1・武帝紀注引『魏略』、巻2・文帝紀注）。"}, "婁圭": {"name": "婁圭（ろうけい：字は子伯、南陽郡出身の曹操の旧友・参謀、潼関の氷城築造など数々の大計を立てた策士）", "wiki_title": "婁圭", "role": "後漢末の曹操の謀臣（荊州南陽郡の人、字は子伯）", "ai_desc": "荊州南陽郡の人（?〜211年頃）、字は子伯。若くして雄大な志を抱き、曹操とも古くから親交があった。当初は荊州牧・劉表に身を寄せ、三輔の乱で南下してきた北方の流民を迎え入れる任務にあたった（その際に王忠に兵を奪われた）。のちに曹操へ帰属すると帷幕の参謀として重用され、俸禄・賞賜は諸将に準ずる破格の待遇を受けた。建安13年（208年）の劉琮降伏時や建安16年（211年）の馬超・韓遂との潼関の戦い（砂に水をかけて一夜で氷の城壁を築かせた献策）で大功を立て、曹操に「我が計は子伯に及ばぬ」と嘆賞されたが、後に不遜な発言を密告されて処刑された（『三國志』巻12・崔琰伝附婁圭伝および注引『呉書』『魏略』）。"}, "劉勲": {"name": "劉勲（りゅうくん：字は子台、琅邪国出身の廬江太守・征虜将軍・列侯、孫策に皖城を奪われ曹操に帰順）", "wiki_title": "劉勲", "role": "後漢末の廬江太守・征虜将軍・列侯（徐州琅邪国の人）", "ai_desc": "徐州琅邪国の人（生没年不詳）、字は子台。建安初年に曹操と旧交があった。袁術に仕えて廬江太守となり、建安4年（199年）に袁術が病死すると、袁術の従弟・袁胤や妻子・遺衆を収容して江淮の間で強勢を誇った。しかし孫策の甘言と贈り物に誘われて上繚へ遠征した隙に本拠の皖城を孫策に奇襲されて陥落し、長江を遡って退いたのち、建安4年冬12月に曹操へ帰順して列侯・征虜将軍に封じられた。旧友として曹操から厚く寵遇されたが、のちに法を無視した驕慢や収賄が重なり処刑された（『三國志』巻1・武帝紀、巻12・司馬芝伝、巻46・孫破虜討逆伝）。"}, "夫差": {"name": "夫差（ふさ：春秋時代末期の呉王、夫椒で越を破り覇を競うも、のち越王勾践に攻め滅ぼされ自害）", "wiki_title": "夫差", "role": "春秋時代末期の呉の最後の王（在位前495年〜前473年、呉王闔閭の子）", "ai_desc": "春秋時代末期の呉王（?〜前473年）。父・闔閭が越王勾践との戦いで負った傷により没すると、復讐を誓って前494年に夫椒の戦いで越軍を大破し勾践を会稽山に包囲したが、伍子胥の諫言を退けて越の降伏を許した。その後、北上して斉を破り黄池の会盟で晋と覇権を争ったが、国力を消耗した隙を臥薪嘗胆の越王勾践に突かれて都を包囲され、前473年に姑蘇山で自害した（『春秋左氏伝』哀公元年〜二十二年、『史記』巻31・呉太伯世家）。裴松之は、孫盛『魏氏春秋』が曹操の発言を『左伝』哀公二十年等の呉越故事の辞句（「将生憂寡人」）に書き換えたことについて、これから天下を取ろうとする曹操に滅亡寸前の夫差ゆかりの不吉な言葉を語らせるのは甚だ不適切であると批判した。"}, "夏侯博": {"name": "夏侯博（かこうはく：劉備配下の部将、建安5年正月の曹操東征により徐州で撃破され生け捕りとなる）", "wiki_title": "夏侯博", "role": "後漢末の劉備配下の部将", "ai_desc": "後漢末、徐州で挙兵した劉備に仕えていた部将。建安5年（200年）春正月、袁紹の背後攻撃を危惧する諸将の反対を押し切って電撃的に東征してきた曹操の攻撃を受け、劉備軍が壊滅した際に生け捕りとなった（『三國志』巻1・武帝紀）。"}, "関羽": {"name": "関羽（かんう：字は雲長、河東郡解県出身の蜀漢の前将軍・漢寿亭侯、万人敵と称えられた劉備股肱の義将）", "wiki_title": "関羽", "role": "後漢末〜劉備配下の偏将軍・襄陽太守・前将軍・仮節鉞・漢寿亭侯（司隸河東郡解県の人、諡は壮繆侯）", "ai_desc": "司隸河東郡解県の人（?〜219年）、字は雲長（本字は長生）。亡命して涿郡に至り、劉備の郷里での挙兵以来、張飛とともに寝食を共にして兄事し、周瑜・程昱・郭嘉ら敵味方から「万人敵」「熊虎の将」と畏敬された。建安5年（200年）春正月、劉備が小沛で曹操に敗れて袁紹のもとへ奔った際、下邳を守備していた関羽は曹操に攻められて降伏し、偏将軍として破格の礼遇を受けた。同年4月の白馬の戦いで袁紹軍の猛将・顔良を万衆の中で斬り捨てて曹操の恩義に報いたのち、封賜を尽く残して劉備のもとへ帰参した。のちに荊州を鎮守して建安24年（219年）に樊城の曹仁を包囲し于禁の七軍を水没させて華北を震撼させたが、背後から呂蒙の奇襲を受けて麦城に敗死した（『三國志』巻36・関羽伝）。"}, "郭図": {"name": "郭図（かくと：字は公則、潁川郡出身の袁紹の参謀、白馬・官渡の戦いに従い袁紹没後は袁譚を擁立）", "wiki_title": "郭図", "role": "後漢末の袁紹・袁譚の謀臣（豫州潁川郡の人）", "ai_desc": "豫州潁川郡の人（?〜205年）、字は公則。初め潁川太守・陰脩に計吏として抜擢され、荀彧・荀攸らとともに中央へ出仕したのち、冀州牧・韓馥を経て袁紹の参謀となった。建安5年（200年）2月、淳于瓊・顔良とともに白馬の東郡太守・劉延を攻めた。同年10月の官渡決戦で烏巣の淳于瓊が曹操の夜襲を受けた際には曹操の本営攻撃を主張し、敗北後に自らの失策が責められるのを恐れて張郃・高覧を讒言したため、両将を曹操側へ寝返らせる結果を招いた。袁紹の没後は長男・袁譚を擁立して末弟・袁尚と争わせ、建安10年（205年）正月に南皮が陥落した際、曹操によって一族皆殺しに処された（『三國志』巻6・袁紹伝および注引『英雄記』『九州春秋』）。"}, "淳于瓊": {"name": "淳于瓊（じゅんうけい：字は仲簡、潁川郡出身の西園八校尉の一・袁紹軍の宿将、白馬攻撃および烏巣守備を担う）", "wiki_title": "淳于瓊", "role": "後漢末の西園右校尉・袁紹配下の将（豫州潁川郡の人）", "ai_desc": "豫州潁川郡の人（?〜200年）、字は仲簡。霊帝の中平5年（188年）8月に創設された「西園八校尉」において右校尉（一説に左校尉）に任じられ、典軍校尉・曹操や中軍校尉・袁紹と同僚であった。董卓の乱後に袁紹に従って河北の主力大将の一人となり、建安5年（200年）2月には郭図・顔良とともに東郡太守・劉延を白馬に攻めた。同年10月の官渡本戦では督将として一万余の兵を率いて烏巣の兵糧集積地を護衛したが、曹操自ら率いる奇襲部隊の夜襲を受けて壊滅し、鼻を削がれて捕らえられたのち斬首された（『三國志』巻1・武帝紀、巻6・袁紹伝および注引『曹瞞伝』）。"}, "顔良": {"name": "顔良（がんりょう：文醜と並び称された袁紹軍随一の猛将、白馬を包囲するも曹操の奇襲を受け関羽に斬られる）", "wiki_title": "顔良", "role": "後漢末の袁紹配下の部将", "ai_desc": "後漢末の袁紹配下の猛将（?〜200年）。文醜とともに袁紹軍の武勇の双璧として知られ、孔融は「顔良・文醜の勇は三軍に冠たり」と挙げ、荀彧は「匹夫の勇であり、一戦して生け捕りにできる」と評した。建安5年（200年）2月、郭図・淳于瓊とともに東郡太守・劉延を白馬に包囲したが、4月に荀攸の献策による曹操の延津陽動で袁紹が兵力を西へ割いた隙に白馬への強行軍を受け、先陣として突撃した張遼・関羽に撃破され、陣中で関羽に斬首された（『三國志』巻1・武帝紀、巻6・袁紹伝、巻10・荀彧伝、巻17・張遼伝、巻36・関羽伝）。"}, "劉延": {"name": "劉延（りゅうえん：曹操配下の東郡太守、白馬城で顔良らの猛攻を二か月にわたり堅守し抜く）", "wiki_title": "劉延 (東郡太守)", "role": "後漢末の曹操配下の東郡太守", "ai_desc": "後漢末の曹操配下の地方長官・武将（前漢の城陽王・劉延や後漢初の阜陵王・劉延とは同姓同名の別人）。東郡太守として黄河渡河点の要衝・白馬を守備し、建安5年（200年）2月に袁紹が派遣した郭図・淳于瓊・顔良らの大軍に包囲されたが、同年4月に曹操の救援軍が到着して包囲が解かれるまで城を守り抜いた（『三國志』巻1・武帝紀、巻17・張遼伝・于禁伝）。"}, "張遼": {"name": "張遼（ちょうりょう：字は文遠、雁門郡馬邑県出身の曹魏の前将軍・晋陽剛侯、白馬先陣から合肥の死闘まで活躍した五将軍筆頭）", "wiki_title": "張遼", "role": "後漢末〜三国魏の中郎将・盪寇将軍・前将軍・晋陽剛侯（并州雁門郡馬邑県の人）", "ai_desc": "并州雁門郡馬邑県の人（169年〜222年）、字は文遠。前漢の馬邑の豪族・聶壱の末裔で、怨讐を避けて張氏に改姓した。丁原・何進・董卓を経て呂布に仕え、騎都尉・魯相となった。建安3年（198年）冬に下邳で呂布が敗死すると部衆を率いて曹操に帰順し、中郎将・関内侯に拝された。建安5年（200年）4月の白馬の戦いでは仮の裨将軍として関羽とともに先陣を務め、顔良の軍を撃破した。その後も昌狶の説得降伏、袁譚・袁尚討伐、白狼山での烏丸単于・蹋頓斬殺、天柱山の陳蘭討伐で武功を重ね、建安20年（215年）の合肥の戦いでは八百の決死隊で孫権の十万の大軍に突撃して江東を震撼させ、前将軍・晋陽侯に昇った（『三國志』巻17・張遼伝）。"}, "文醜": {"name": "文醜（ぶんしゅう：顔良と並び称された袁紹軍の驍将、延津の南で曹操・荀攸の輜重囮作戦にかかり敗死）", "wiki_title": "文醜", "role": "後漢末の袁紹配下の騎将", "ai_desc": "後漢末の袁紹配下の猛将（?〜200年）。顔良と並ぶ袁紹軍屈指の名将として知られた。建安5年（200年）4月、白馬の囲みを解いて西へ移動する曹操軍を袁紹が渡河追撃した際、騎将として劉備とともに五、六千騎を率いて延津の南へ進出した。しかし荀攸の献策により曹操が白馬の輜重を街道に並べて馬を解き放たせた囮作戦にかかり、兵が隊列を崩して輜重の略奪に向かったところを六百騎未満の曹操軍に突撃されて大敗し、陣中で戦死した（『三國志』巻1・武帝紀、巻6・袁紹伝、巻10・荀攸伝）。"}, "習鑿歯": {"name": "習鑿歯（しゅうさくし：字は彦威、襄陽郡出身の東晋の歴史家・滎陽太守、蜀漢正統論を唱えた『漢晋春秋』の撰者）", "wiki_title": "習鑿歯", "role": "東晋の歴史家・文人・荊州別駕・滎陽太守（荊州襄陽郡襄陽県の人）", "ai_desc": "荊州襄陽郡襄陽県の人（?〜384年）、字は彦威。襄陽の名族・習氏の出身で、博学と文才・弁論で知られた。東晋の実力者である荊州刺史・桓温に抜擢されて従事・別駕・滎陽太守を歴任したが、のち足の疾により帰郷した。桓温が簒奪の野心を抱いていることを察し、後漢の光武帝から西晋の愍帝に至る歴史を編纂した主著『漢晋春秋』四十七巻（一説に五十四巻）において、力によって禅譲を受けた曹魏ではなく漢室の血統を継ぐ蜀漢（昭烈帝・劉備）を正統とする「蜀漢正統論」を初めて体系的に唱えた（『晋書』巻82・習鑿歯伝）。"}, "徐晃": {"name": "徐晃（じょこう：字は公明、河東郡楊県出身の曹魏の右将軍・陽平壮侯、官渡での輸送車撃破や樊城救援で活躍した五将軍の一）", "wiki_title": "徐晃", "role": "後漢末〜三国魏の偏将軍・盪寇将軍・平寇将軍・右将軍・陽平壮侯（司隸河東郡楊県の人）", "ai_desc": "司隸河東郡楊県の人（?〜227年）、字は公明。初め郡吏から車騎将軍・楊奉の騎都尉となり、楊奉に献帝の洛陽帰還を進言したのち、建安元年（196年）冬に曹操に帰順して裨将軍となった。建安5年（200年）の官渡の戦いでは白馬・延津で顔良・文醜軍の撃破に参加して偏将軍に進み、さらに史渙とともに故市で袁紹軍の兵糧輸送車数千両を撃破・焼却する大功を立てて都亭侯に封じられた。その後も韓浩とともに烏巣攻略や河北・関中・漢中の諸戦役に従い、建安24年（219年）の樊城救援では関羽の十重の鹿角陣を正面突破して曹操から「周亜夫の風あり」と激賞され、文帝即位後に右将軍・陽平侯に昇った（『三國志』巻17・徐晃伝）。"}, "鍾繇": {"name": "鍾繇（しょうよう：字は元常、潁川郡長社県出身の司隷校尉・のち魏の太傅・定陵成侯、関中を鎮撫し官渡へ軍馬二千余匹を送る）", "wiki_title": "鍾繇", "role": "後漢末〜三国魏の侍中・司隷校尉・前軍師・相国・廷尉・太尉・太傅・定陵成侯（豫州潁川郡長社県の人、鍾会の父）", "ai_desc": "豫州潁川郡長社県の人（151年〜230年）、字は元常。清流派の名士・鍾皓の曽孫で、鍾会の父。献帝の長安脱出を支援した功により御史中丞・侍中・尚書僕射を歴任した。官渡の戦いを控えた建安4年（199年）末頃、後方の関中諸将（馬騰・韓遂ら）の動向を憂慮した曹操により、荀彧の推挙を受けて侍中・守司隷校尉・持節として関中・司隸方面の全権を委ねられた。長安に到着するや書簡を送って馬騰・韓遂らを説得し朝廷へ帰順させ、建安5年（200年）の官渡対陣中には軍馬二千余匹を調達して曹操の本軍へ送り届け、曹操から「昔、蕭何は関中を鎮守して漢業を成したが、君の勲功はそれに勝る」と絶賛された。魏王朝では廷尉・太尉・太傅を歴任し、また楷書（正書）の祖として書道史にも不滅の名を残した（『三國志』巻13・鍾繇伝）。"}, "賈詡": {"name": "賈詡（かく：字は文和、武威郡姑蔵県出身の執金吾・のち魏の太尉・魏寿粛侯、張繡を帰順させ烏巣奇襲を後押しした謀臣）", "wiki_title": "賈詡", "role": "後漢末〜三国魏の執金吾・太中大夫・太尉・魏寿粛侯（涼州武威郡姑蔵県の人）", "ai_desc": "涼州武威郡姑蔵県の人（147年〜223年）、字は文和。若くして漢陽の閻忠から「張良・陳平の奇策あり」と評された。董卓の女婿・牛輔の幕僚となり、董卓の死後に李傕・郭汜らへ長安進撃を献策したのち、段煨を経て同郷の張繡の謀主となり、宛や穣での対曹操戦で張繡を補佐した。建安4年（199年）冬、袁紹と曹操の双方から勧誘を受けた際、袁紹の使者を退けて曹操への帰順を張繡に決断させ、曹操から手を取って歓迎され執金吾・都亭侯に拝され冀州牧を領した。建安5年（200年）10月の官渡の戦いでは、来奔した許攸の烏巣奇襲策を側近が疑う中、荀攸とともに決行を強く勧めて大勝に貢献し、文帝（曹丕）の即位後に太尉へ昇った（『三國志』巻10・賈詡伝）。"}, "眭元進": {"name": "眭元進（すいげんしん：袁紹配下の督将、淳于瓊とともに烏巣の兵糧集積地を守るも曹操の夜襲を受け戦死）", "wiki_title": "眭元進", "role": "後漢末の袁紹配下の督将", "ai_desc": "後漢末の袁紹配下の武将（?〜200年）。建安5年（200年）冬10月の官渡の戦いにおいて、将軍・淳于瓊（字は仲簡）の下で督将を務め、騎督の韓莒子・呂威璜・趙叡らとともに故市・烏巣で一万余乗の輜重・兵糧の護衛にあたったが、許攸の通報を受けた曹操軍の夜襲により陣営を焼き払われ、斬首された（『三國志』巻1・武帝紀注引『曹瞞伝』、巻6・袁紹伝）。"}, "韓莒子": {"name": "韓莒子（かんきょし：袁紹配下の騎督、烏巣の兵糧集積地で曹操軍の夜襲を受け戦死）", "wiki_title": "韓莒子", "role": "後漢末の袁紹配下の騎督", "ai_desc": "後漢末の袁紹配下の武将（?〜200年）。建安5年（200年）冬10月、淳于瓊や督将・眭元進らとともに騎督として故市・烏巣の兵糧集積地を守備していたが、袁軍の旗印に偽装して間道から接近した曹操軍の夜襲を受けて敗死した（『三國志』巻1・武帝紀注引『曹瞞伝』、巻6・袁紹伝）。"}, "呂威璜": {"name": "呂威璜（りょいこう：袁紹配下の騎督、淳于瓊に従い烏巣を守備するも曹操軍の夜襲により戦死）", "wiki_title": "呂威璜", "role": "後漢末の袁紹配下の騎督", "ai_desc": "後漢末の袁紹配下の武将（?〜200年）。建安5年（200年）冬10月の官渡の戦いにおいて、騎督として淳于瓊・眭元進・韓莒子・趙叡らとともに烏巣の輜重を守備したが、曹操自ら率いる精鋭歩騎の夜襲を受けて陣営を焼かれ、斬首された（『三國志』巻1・武帝紀注引『曹瞞伝』、巻6・袁紹伝）。"}, "趙叡": {"name": "趙叡（ちょうえい：袁紹配下の騎督、淳于瓊とともに烏巣を守備するも曹操軍の夜襲を受け戦死）", "wiki_title": "趙叡", "role": "後漢末の袁紹配下の騎督", "ai_desc": "後漢末の袁紹配下の武将（?〜200年）。建安5年（200年）冬10月、袁紹軍の兵糧集積地であった故市・烏巣において淳于瓊・眭元進・韓莒子・呂威璜らとともに護衛にあたったが、曹操軍の夜襲によって撃破され、斬首された（『三國志』巻1・武帝紀注引『曹瞞伝』、巻6・袁紹伝）。"}, "張郃": {"name": "張郃（ちょうこう：字は儁乂、河間郡鄚県出身の名将、官渡の戦いで曹操に帰順しのち魏の征西車騎将軍・鄚壮侯）", "wiki_title": "張郃", "role": "後漢末〜三国魏の偏将軍・平狄将軍・左将軍・征西車騎将軍・鄚壮侯（冀州河間郡鄚県の人）", "ai_desc": "冀州河間郡鄚県の人（?〜231年）、字は儁乂。黄巾の乱に際して韓馥に属し、韓馥の敗後は袁紹に仕えて公孫瓚討滅に功を立て寧国中郎将となった。建安5年（200年）10月の官渡の戦いでは、烏巣を急襲された袁紹に対し「まず淳于瓊を救援すべきだ」と進言した
