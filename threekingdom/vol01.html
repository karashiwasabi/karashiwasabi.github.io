が郭図に阻まれ、高覧とともに曹洪の本営攻撃へ差し向けられた。しかし烏巣陥落の報が届き、さらに郭図が失敗の罪を張郃らに転嫁しようとしたため曹洪の陣へ投降し、曹操から「韓信が漢に帰したようなものだ」と大いに歓迎されて偏将軍・都亭侯に拝された（『三國志』巻1・武帝紀、巻17・張郃伝）。のち夏侯淵・曹真を輔佐して関中・街亭・陳倉などで蜀軍を幾度も破り、魏の五将軍の一人に数えられた。"}, "高覧": {"name": "高覧（こうらん：袁紹配下の部将、官渡の戦いで張郃とともに曹洪の本営を攻めるも烏巣陥落後に曹操へ帰順し偏将軍・東萊侯）", "wiki_title": "高覧", "role": "後漢末の袁紹配下の部将、のち曹操配下の偏将軍・東萊侯", "ai_desc": "後漢末の武将。袁紹配下の主力部将として重用され、建安5年（200年）10月の官渡の戦いにおいて、烏巣の淳于瓊が曹操の夜襲を受けた際、袁紹の命で張郃とともに曹操軍の本営（曹洪らが守備）を攻撃した。しかし淳于瓊が敗死したと聞き、また袁紹の参謀・郭図による讒言を恐れた張郃に同調して陣営を焼き払い曹操軍（曹洪）に投降し、偏将軍に拝され東萊侯に封じられた（『三國志』巻1・武帝紀、巻6・袁紹伝、巻17・張郃伝）。"}, "畢瑜": {"name": "畢瑜（ひつゆ：もとの鉅鹿郡任県長、袁紹・韓馥の命で金璽と符命を携え幽州牧・劉虞へ帝位推戴を説いた使者）", "wiki_title": "劉虞", "role": "後漢末のもとの任県長（故任長、袁紹・韓馥の使者）", "ai_desc": "後漢末の地方官で、かつて冀州鉅鹿郡の任県の長（任長）を務めた人物。初平2年（191年）、袁紹と韓馥が長安の献帝に対抗して幽州牧・故大司馬の劉虞を新皇帝に擁立しようと謀り黄金の玉璽を刻作した際、使者として幽州の劉虞のもとへ派遣され、天命・図録の運数が劉虞にあると説いて即位を勧めたが、劉虞に固く拒絶された（『三國志』巻1・武帝紀注引『献帝起居注』、また『後漢書』巻73・劉虞伝には「故楽浪太守張岐らを遣わす」と併記される）。"}, "袁叙": {"name": "袁叙（えんじょ：袁紹・袁術の従弟、済陰太守、袁紹に書簡を送り天命と玉璽譲渡の経緯を伝えた袁氏一門）", "wiki_title": "袁紹", "role": "後漢末の済陰太守（豫州汝南郡汝陽県の人、袁紹・袁術の従弟）", "ai_desc": "豫州汝南郡汝陽県の人。名門汝南袁氏の一族で、袁紹・袁術の従弟（いとこ）にあたり、済陰太守を務めた。袁紹へ宛てた書簡の中で「天意と神応は我が袁家にあり、本来は尊兄（袁紹）にある。南兄（袁術）の臣下が即位を勧めた際も、南兄は『年齢でも官位でも北兄（袁紹）が上だ』と述べて伝国の玉璽を送ろうとしたが、曹操に街道を遮断されて果たせなかった」と記しており、官渡の戦いで袁紹陣営の文書を接収した曹操によって、袁紹の謀逆の証拠として『献帝起居注』の上言中に引用された（『三國志』巻1・武帝紀注引『献帝起居注』）。"}, "殷馗": {"name": "殷馗・殷逵（いんき：後漢・桓帝期の遼東郡出身の天文学者、黄星の出現から五十年後の梁・沛における真人勃興を予言）", "wiki_title": "殷馗", "role": "後漢・桓帝期の天文学者・方術家（幽州遼東郡の人）", "ai_desc": "幽州遼東郡の人（「馗」は「逵」の古字であり、史料により「殷逵」とも記される）。天文・占星に精通し、後漢の桓帝期（150年代前半頃）に楚・宋の分野（沛国・梁国一帯に対応する天域）に黄星が現れたのを観測して、「五十年後に必ず真人が梁・沛の間から興り、その鋒先には誰も立ち向かえないであろう」と予言した。その約五十年後にあたる建安5年（200年）、沛国譙県出身の曹操が官渡の戦いで袁紹を撃破して天下無敵の覇権を確立したことで、その予言が成就したと伝えられる（『三國志』巻1・武帝紀、『宋書』巻27・符瑞志上）。"}, "共都": {"name": "共都・龔都（きょうと：汝南郡に割拠した反曹操勢力の首領、袁紹の命で南下した劉備に呼応し蔡揚を破る）", "wiki_title": "龔都", "role": "後漢末の汝南郡の武装勢力首領（『先主伝』では「龔都」と表記）", "ai_desc": "後漢末、豫州汝南郡一帯に割拠していた武装集団（「汝南賊」）の首領。『三國志』巻32・先主伝（劉備伝）では同音の「龔都」と表記される。建安5年（200年）の官渡対陣中、袁紹が曹操の後方を攪乱するため劉備を汝南へ派遣すると、数千の衆を擁して劉備に呼応し、曹操が差し向けた部将・蔡揚（蔡陽）の討伐軍を撃破して蔡揚を戦死させた。しかし翌建安6年（201年）秋9月以降、官渡・倉亭で袁紹を破った曹操が自ら南征して来ると聞き、劉備が荊州の劉表のもとへ逃走したのに伴い、共都らの軍勢もすべて離散した（『三國志』巻1・武帝紀、巻32・先主伝）。"}, "蔡揚": {"name": "蔡揚・蔡陽（さいよう：曹操配下の部将、汝南で共都・劉備の討伐に向かうも敗れて戦死）", "wiki_title": "蔡陽", "role": "後漢末の曹操配下の部将（『先主伝』では「蔡陽」と表記）", "ai_desc": "後漢末の曹操配下の部将（?〜200年または201年）。『三國志』巻32・先主伝や巻14・程昱伝などでは「蔡陽」と表記される。袁紹の命を受けた劉備が汝南郡へ進出して現地の首領・共都（龔都）ら数千人と合流した際、曹操の命を受けてその討伐に赴いたが、戦況不利に陥って共都・劉備軍に撃破され、戦死した（『三國志』巻1・武帝紀、巻32・先主伝）。"}, "孔子": {"name": "孔子・仲尼（こうし／ちゅうじ：名は丘、字は仲尼、春秋時代の魯の思想家・儒家の始祖）", "wiki_title": "孔子", "role": "春秋時代の思想家・儒家の始祖（魯国昌平郷陬邑の人）", "ai_desc": "春秋時代の魯の人（前551年〜前479年）、名は丘、字は仲尼。仁と礼を核とする儒学を創始した。『論語』公冶長篇において、孔子が子貢に「お前と回（顔淵）とではどちらが優れているか」と問い、子貢が「どうして回に及びましょう」と答えると、孔子が「弗如也、吾與女弗如也（及ばないな、私もお前も彼には及ばない）」と愛弟子の顔淵を称揚した故事があり、曹操は『故太尉橋玄を祀る文』において、大先輩の橋玄が若き日の自分を過分に称賛・推挽してくれた恩義をこの故事になぞらえた。"}, "顔回": {"name": "顔淵・顔回（がんえん／がんかい：名は回、字は子淵、孔子が最も深く信頼・称賛した孔門十哲の筆頭）", "wiki_title": "顔回", "role": "春秋時代の孔子の高弟・孔門十哲の徳行科筆頭（魯国の人）", "ai_desc": "春秋時代の魯の人（前521年〜前481年頃）、名は回、字は子淵（顔淵）。孔子より三十歳年少ながら最も好学・仁徳に秀で、貧困の中でも道を楽しみ、孔子から「一を聞いて十を知る」「私とて彼には及ばない（吾與女弗如也）」と絶賛された孔門筆頭の高弟（『論語』公冶長篇・雍也篇、『史記』巻67・仲尼弟子列伝）。"}, "李生": {"name": "李生（りせい：新末後漢初の南陽郡舞陰県の儒者、門下の若き賈復を「将相の器」と激賞した師）", "wiki_title": "賈復", "role": "新末後漢初の儒学者（荊州南陽郡舞陰県の人、賈復の師）", "ai_desc": "新末後漢初、荊州南陽郡舞陰県で『尚書』を講じていた学者。若き日の賈復（のち光武帝の創業功臣・雲台二十八将の一人）がその門下に学んだ際、賈復の非凡な人物を見抜き、門人たちに向かって「賈君の容貌と志気はかくのごとく優れ、しかも学問に勤しんでいる、まさに将相（将軍・宰相）の器である」と手厚く称賛して送り出した（『後漢書』巻17・賈復伝）。曹操は橋玄から受けた知遇をこの李生と賈復の故事にたとえた。"}, "賈復": {"name": "賈復（かふく：字は君文、南陽郡冠軍県出身の後漢創業の功臣・左将軍・膠東剛侯、雲台二十八将の第3位）", "wiki_title": "賈復", "role": "後漢創業の功臣・執金吾・左将軍・膠東剛侯（荊州南陽郡冠軍県の人、雲台二十八将の一）", "ai_desc": "荊州南陽郡冠軍県の人（前9年〜55年）、字は君文。若くして学問を好み、舞陰の李生に師事して『尚書』を修め、李生から「将相の器なり」と激賞された。のち光武帝（劉秀）に帰属して督盗賊・偏将軍・執金吾・左将軍として河北・中原平定の先陣に立って十二箇所の傷を負う奮戦を重ね、天下統一後に膠東侯（六県を食邑）に封じられ、鄧禹・呉漢に次ぐ雲台二十八将の第3位に列せられた（『後漢書』巻17・賈復伝）。"}, "袁尚": {"name": "袁尚（えんしょう：字は顕甫、袁紹の三男〔末子〕、父の寵愛を受け後を継いで冀州牧を称するも兄・袁譚と骨肉の争いを起こす）", "wiki_title": "袁尚", "role": "後漢末の群雄・自称大将軍・冀州牧（豫州汝南郡汝陽県の人、袁紹の三男）", "ai_desc": "豫州汝南郡汝陽県の人（?〜207年）、字は顕甫。袁紹の三男（末子）。容貌が優れていたため父・袁紹と後妻の劉夫人に偏愛され、建安7年（202年）5月に袁紹が後継者を明確に定めぬまま急死すると、審配・逢紀らに擁立されて跡を継いだ。これに反発して車騎将軍を自称し黎陽に駐屯した長兄・袁譚と対立しつつ、建安7年9月から翌建安8年3月にかけて黎陽で曹操軍と連戦したが敗れて夜陰に鄴へ退いた。曹操が一旦許へ兵を引くと直ちに袁譚と冀州をめぐる骨肉の争いを始めて袁譚を平原に追い詰め、結果として曹操による鄴攻略と河北平定を招き、最後は烏丸を経て遼東の公孫康のもとへ逃れたところを斬首された（『三國志』巻6・袁紹伝附袁譚袁尚伝）。"}, "賈信": {"name": "賈信（かしん：曹操配下の部将、建安8年5月に袁譚・袁尚撃退後の要衝・黎陽の守備を託される）", "wiki_title": "賈信", "role": "後漢末の曹操配下の部将", "ai_desc": "後漢末の曹操配下の武将。建安8年（203年）春3月に曹操が黎陽で袁譚・袁尚を撃破し、4月に鄴まで進軍したのち、5月に一旦許へ帰還するにあたり、黄河北岸の戦略要衝である黎陽の守備隊長として留め置かれた。のち建安16年（211年）の潼関・華陰方面の戦役などにも将軍として従軍している（『三國志』巻1・武帝紀、巻15・張既伝注引『魏略』）。"}, "趙括": {"name": "趙括（ちょうかつ：戦国時代の趙の将軍・名将趙奢の子、母が不連座を乞うた故事と長平の大敗で知られる）", "wiki_title": "趙括", "role": "戦国時代の趙の将軍（名将・馬服君趙奢の子）", "ai_desc": "戦国時代の趙の将軍（?〜前260年）。名将・趙奢（馬服君）の子で、幼少より兵法を学んで机上の議論では父をも言い負かしたが、実戦の機微を知らず父からは「趙を破滅させるのは必ず括である」と危惧されていた。長平の戦い（前260年）で秦の離間策に乗った趙の孝成王が廉頗に代えて趙括を大将に任じようとした際、趙括の母は上書して任命を強く諫め、王が聴き入れないと見るや「万一、括が任に堪えず罪を犯しても、どうか私を連座させないでください」と願い出て許された。果たして趙括は秦の名将・白起の包囲網に陥って射殺され、降伏した趙兵四十万人が坑殺される大惨事となったが、母だけは事前の約束により処罰を免れた（『史記』巻81・廉頗藺相如列伝）。"}, "管仲": {"name": "管仲（かんちゅう：名は夷吾、字は仲、春秋時代の斉の桓公を五覇の筆頭に押し上げた実力主義・富国強兵の名宰相）", "wiki_title": "管仲", "role": "春秋時代の斉の宰相（潁上県の人）", "ai_desc": "春秋時代の斉の名宰相（?〜前645年）、名は夷吾、字は仲。親友・鮑叔牙の推挙により斉の桓公に抜擢され、内政・軍制改革と尊王攘夷によって桓公を春秋五覇の筆頭に導き、孔子からも「管仲なかりせば吾それ被髪左衽せん」と称えられた（『史記』巻62・管晏列伝、『論語』憲問篇）。曹操が建安8年（203年）の庚申令で引用した「賢者をして能に食ましむれば則ち上は尊ばれ、闘士をして功に食ましむれば則ち卒は死を軽んじ、二者国に設くれば則ち天下は治まる」という管仲の言葉は、前漢・劉向『説苑』巻8・尊賢篇に収録された一節に基づく。"}, "辛毗": {"name": "辛毗（しんぴ：字は佐治、潁川郡陽翟県出身、袁譚の使者として来詣し河北平定の好機を説きのち曹魏の侍中・衛尉）", "wiki_title": "辛毗", "role": "後漢末〜三国魏の議郎・丞相長史・侍中・衛尉・広平剛亭侯（豫州潁川郡陽翟県の人、辛評の弟・辛憲英の父）", "ai_desc": "豫州潁川郡陽翟県の人（?〜235年頃）、字は佐治。兄の辛評とともに袁紹に仕え、袁紹の没後は兄とともに長男・袁譚に属した。建安8年（203年）8月、袁尚に敗れて平原に追い詰められた袁譚の命を受け、劉表征討のため西平に布陣していた曹操のもとへ降伏・請救の使者として赴いた。曹操が袁譚の本心を疑って尋問すると、辛毗は袁譚の信義は問うまでもなく袁氏兄弟が内紛している今こそ河北を併呑する千載一遇の好機であると率直に説き、曹操を大いに喜ばせて北上を決断させた。のち南皮陥落後に曹操へ仕えて議郎・丞相長史となり、文帝・明帝の代には侍中・衛尉として剛直な諫言で重きをなした（『三國志』巻1・武帝紀、巻25・辛毗伝）。"}, "曹整": {"name": "曹整（そうせい：曹操と李姫の子、郿戴公、建安8年10月に黎陽で袁譚の娘と婚姻を結ぶも早世）", "wiki_title": "曹整", "role": "曹操の子・郿侯〔追進・郿戴公〕（豫州沛国譙県の人）", "ai_desc": "豫州沛国譙県の人（?〜218年）。曹操と李姫の間に生まれた子で、曹操の従弟である郎中・曹紹の跡継ぎ（養子）となった。建安8年（203年）冬10月、袁尚に圧迫されて曹操に救援を求めた袁譚との政治的同盟の一環として、黎陽において袁譚の娘と婚姻（婚約）を結んだが、翌建安9年（204年）に袁譚が盟約を破ったため曹操によって袁譚の娘は送り返された（『三國志』巻1・武帝紀、巻6・袁紹伝）。のち建安22年（217年）に郿侯に封じられたが、翌建安23年（218年）に嗣子なく早世し、文帝の黄初2年（221年）に「郿戴公」と追贈された（『三國志』巻20・武文世王公伝・郿戴公整伝）。"}, "呂曠": {"name": "呂曠（りょこう：東平国出身の袁尚配下の部将、呂翔とともに陽平で袁尚に背き、袁譚が密授した印綬を差し出して曹操へ帰順）", "wiki_title": "呂曠", "role": "後漢末の袁尚配下の部将、のち曹操配下の列侯（兗州東平国の人）", "ai_desc": "兗州東平国の人。袁紹・袁尚に仕えた部将。建安8年（203年）冬10月、曹操が黎陽へ北上し袁尚が平原の包囲を解いて鄴へ引き揚げた際、同郷の呂翔とともに袁尚に背いて東郡の陽平に駐屯した。その際、包囲を免れた袁譚から密かに将軍の印綬を仮授して取り込まれそうになったが、その印綬をそのまま曹操のもとへ送り届けて軍勢ごと降伏し、列侯に封じられた（『三國志』巻1・武帝紀および注引『魏書』、巻6・袁紹伝）。"}, "呂翔": {"name": "呂翔（りょしょう：東平国出身の袁尚配下の部将、呂曠とともに陽平で袁尚に背いて曹操に降伏し列侯に封じられる）", "wiki_title": "呂翔", "role": "後漢末の袁尚配下の部将、のち曹操配下の列侯（兗州東平国の人）", "ai_desc": "兗州東平国の人。呂曠とともに袁紹・袁尚に仕えた部将。建安8年（203年）冬10月、曹操の黎陽進軍によって袁尚が平原から鄴へ撤退した際、呂曠とともに袁尚に背いて東郡の陽平に駐屯し、袁譚からの懐柔にも乗らず手勢を率いて曹操に帰順し、列侯に封じられた（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "蘇由": {"name": "蘇由（そゆう：袁尚配下の部将、審配とともに鄴の留守を任されるも洹水へ進軍した曹操に帰順し列侯となる）", "wiki_title": "蘇由", "role": "後漢末の袁尚配下の部将、のち曹操配下の列侯", "ai_desc": "後漢末の武将。袁尚に仕え、建安9年（204年）2月に袁尚が再び平原の袁譚を攻めるため出陣した際、審配とともに本拠地・鄴の留守を託された。しかし曹操が軍を進めて洹水に到達すると、密かに城内で内応を計画し、審配に露見して市街戦となった末に城を脱出して曹操に降伏し、列侯に封じられた（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "審配": {"name": "審配（しんぱい：字は正南、魏郡陰安県出身の袁紹・袁尚の治中別駕・総幕府、半年にわたり鄴を死守し北面して節に殉じる）", "wiki_title": "審配", "role": "後漢末の袁紹・袁尚配下の治中別駕・総幕府（冀州魏郡陰安県の人）", "ai_desc": "冀州魏郡陰安県の人（?〜204年）、字は正南。気節剛直・忠烈をもって知られ、初め韓馥に仕えたのち袁紹に辟召されて治中・別駕となり、田豊と並ぶ冀州出身の重鎮として軍政の総幕府を委ねられた。官渡の戦いでは許攸の家族を法により収監して許攸出奔の契機となった。建安7年（202年）5月に袁紹が急死すると、逢紀とともに袁紹の遺命と称して末子・袁尚を後継者に擁立し、袁譚派の辛評・郭図と激しく対立した。建安9年（204年）春、袁尚の出陣中に曹操の大軍に鄴を包囲されると、土山・地道や漳水決壊による水攻めで城内の餓死者が半数を超える極限状況の中、約半年にわたり徹底抗戦を指揮した。同年8月、甥の審栄が東門を開いて城が陥落し生け捕りとなった際も、曹操に対して少しも屈せず「我が君（袁尚）は北におられる」と刑吏に命じて北向きに坐したまま潔く斬首された（『三國志』巻1・武帝紀、巻6・袁紹伝および注引『先賢行状』『献帝春秋』）。"}, "尹楷": {"name": "尹楷（いんかい：袁尚配下の武安県長、毛城に駐屯して上党からの糧道を守るも曹操の親征を受け敗れる）", "wiki_title": "尹楷", "role": "後漢末の袁尚配下の武安県長", "ai_desc": "後漢末の地方官・武将。袁尚の勢力下で魏郡の武安県長を務め、建安9年（204年）春に曹操が鄴を包囲した際、太行山脈の要衝・毛城に駐屯して并州上党郡（高幹の勢力圏）から鄴へ通じる兵糧輸送路を維持していた。しかし同年4月、曹洪に鄴包囲を任せて自ら精兵を率いて来襲した曹操の攻撃を受け、撃破された（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "沮鵠": {"name": "沮鵠（そこく：袁紹の名参謀・沮授の子、袁尚の将として邯鄲を守るも曹操に攻め破られる）", "wiki_title": "沮鵠", "role": "後漢末の袁尚配下の部将（冀州広平〔鉅鹿郡広平県〕の人、沮授の子）", "ai_desc": "冀州広平の人（「沮」の音は「菹〔そ〕」）。袁紹の監軍・奮威将軍であった名参謀・沮授の子（『三國志』巻1・武帝紀裴松之注）。父の没後、袁尚の部将として趙国の国都・邯鄲を守備し、鄴の後方連絡線を支えていたが、建安9年（204年）4月、毛城の尹楷を破った曹操の連続攻撃を受けて邯鄲を攻め落とされた（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "沮授": {"name": "沮授（そじゅ：広平出身の袁紹の監軍・奮威将軍、河北四州平定と献帝奉迎・持久戦略を献策した筆頭参謀）", "wiki_title": "沮授", "role": "後漢末の韓馥・袁紹配下の別駕・監軍・奮威将軍（冀州鉅鹿郡広平県の人、沮鵠の父）", "ai_desc": "冀州鉅鹿郡広平県の人（?〜200年頃）。少年の頃より大志と謀略に富み、冀州牧・韓馥の別駕から騎都尉に挙げられた。袁紹が冀州を領すると、四州平定と献帝奉迎による覇業の大計を説いて表向きの全権たる監軍・奮威将軍に任じられた。献帝の許都遷都や袁紹の三子分遣体制（袁譚・袁煕・高幹への州分掌）がいずれも禍根となることを的確に予見して諫め、建安5年（200年）の官渡の戦いでも持久戦を一貫して主張したが疎んじられた。烏巣陥落・本軍壊滅の際に渡河できず曹操軍に捕らえられ、曹操から「孤が早く君を得ておれば天下は憂うるに足らなかった」と厚遇されたが帰順を固辞し、のち袁紹のもとへ脱出を図って処刑された（『三國志』巻6・袁紹伝および注引『献帝記』）。"}, "韓範": {"name": "韓範（かんはん：趙国の易陽県令、邯鄲陥落後に県を挙げて曹操に降伏し関内侯を賜る）", "wiki_title": "韓範", "role": "後漢末の易陽県令・関内侯", "ai_desc": "後漢末の地方官。趙国の易陽県令を務めていた。建安9年（204年）4月に曹操が毛城の尹楷・邯鄲の沮鵠を相次いで撃破すると、県を挙げて曹操に帰順し、関内侯の爵位を賜った（『三國志』巻1・武帝紀。なお巻6・袁紹伝によれば、当初は一旦降伏を装って防備を固めたため徐晃に攻囲され、徐晃の「降伏を受け入れて他県への手本とすべきだ」との進言を容れた曹操により関内侯に封じられたとされる）。"}, "梁岐": {"name": "梁岐（りょうき：魏郡の渉県長、建安9年4月に県を挙げて曹操へ帰順し関内侯を賜る）", "wiki_title": "梁岐", "role": "後漢末の渉県長・関内侯", "ai_desc": "後漢末の地方官。太行山中の要地である魏郡の渉県長を務めていたが、建安9年（204年）4月、曹操が毛城の尹楷と邯鄲の沮鵠を撃破したのに伴い、易陽県令・韓範とともに県を挙げて曹操に降伏し、関内侯の爵位を授けられた（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "陰夔": {"name": "陰夔（いんき：袁紹・袁尚陣営の故豫州刺史、滏水で包囲された袁尚の使者として陳琳とともに曹操へ降伏を請う）", "wiki_title": "陰夔", "role": "後漢末の袁紹・袁尚配下の故豫州刺史", "ai_desc": "後漢末の官僚。袁紹・袁尚の勢力下でもとの豫州刺史（故豫州刺史）の肩書を持っていた人物。建安9年（204年）7月、鄴の救援に引き返した袁尚が西山沿いの滏水の陣営で曹操に包囲され恐怖に陥った際、陳琳とともに使者として曹操の陣へ赴き降伏を願い出たが、曹操に拒絶された（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "陳琳": {"name": "陳琳（ちんりん：字は孔璋、広陵郡出身の「建安七子」の一人、袁紹のために曹操弾劾の檄文を草しのち曹操の司空軍謀祭酒となる）", "wiki_title": "陳琳", "role": "後漢末の文人・大将軍何進主簿・袁紹記室・曹操の司空軍謀祭酒・門下督（徐州広陵郡射陽県の人、「建安七子」の一人）", "ai_desc": "徐州広陵郡射陽県の人（?〜217年）、字は孔璋。初め大将軍・何進の主簿として外将（董卓）召還を強く諫めたが聴かれず、難を逃れて冀州の袁紹に仕え、記室として官渡の戦いに際し曹操の父祖まで痛罵する激烈な討曹檄文（『為袁紹檄豫州』）を起草して天下に文名を轟かせた。建安9年（204年）7月、滏水で包囲された袁尚のために陰夔とともに降伏を請うた際は拒絶されたが、8月に鄴が陥落して捕らえられると、曹操はかつての檄文を咎めずその文才を愛でて司空軍謀祭酒（のち丞相門下督）に抜擢し、阮瑀とともに軍国の一切の書檄・公文書を掌らせた。「建安七子」の一人に数えられ、建安22年（217年）の大疫で没した（『三國志』巻1・武帝紀、巻21・王粲伝附陳琳伝）。"}, "馬延": {"name": "馬延（ばえん：袁尚配下の部将、祁山の戦いで張顗らとともに戦場で曹操に降伏し袁尚軍壊滅の契機となる）", "wiki_title": "馬延", "role": "後漢末の袁尚配下の部将、のち曹操配下の将", "ai_desc": "後漢末の武将。袁尚の部将として建安9年（204年）7月の鄴救援軍に従軍した。滏水の陣営から夜間脱出して祁山に立てこもった袁尚を曹操軍が追撃した際、同僚の張顗らとともに陣頭に臨んで曹操側へ投降したため、袁尚軍は総崩れとなって中山へ敗走した（『三國志』巻1・武帝紀、巻6・袁紹伝。のち建安10〜11年の高幹討伐や袁煕・袁尚追撃にも曹操軍の将として従軍したことが巻15・梁習伝や巻18・閻温伝注引『魏略』に見える）。"}, "張顗": {"name": "張顗（ちょうがい：袁尚配下の部将、祁山で馬延らとともに陣頭で曹操に降伏し、のち高幹討伐などに従軍）", "wiki_title": "張顗", "role": "後漢末の袁尚配下の部将、のち曹操配下の将", "ai_desc": "後漢末の武将。袁尚配下の部将として建安9年（204年）7月の鄴救援に従ったが、滏水から祁山へ退いた後の追撃戦において、馬延らとともに戦場で曹操軍に降伏し、袁尚の本軍を大潰走させた（『三國志』巻1・武帝紀、巻6・袁紹伝。のち曹操配下の将として馬延とともに并州の高幹討伐等に従軍したことが巻15・梁習伝に見える）。"}, "審栄": {"name": "審栄（しんえい：審配の兄の子〔甥〕、建安9年8月に守備していた鄴城東門を夜間に開いて曹操軍を引き入れる）", "wiki_title": "審栄", "role": "後漢末の袁尚・審配配下の東門守将（冀州魏郡陰安県の人、審配の甥）", "ai_desc": "冀州魏郡陰安県の人。鄴の防衛司令官であった審配の兄の子（甥）で、東門の守備を任されていた。建安9年（204年）7月に救援の袁尚が祁山で大敗して中山へ逃走し、城内の士気が崩壊する中、同年8月、夜に乗じて自ら守る鄴城東門を開いて曹操軍を城内に引き入れ、半年に及んだ鄴包囲戦を終結させた（『三國志』巻1・武帝紀、巻6・袁紹伝。なお裴注引『先賢行状』等によれば、審配が城内の辛毗一族を処刑した際、辛毗と親しかった審栄は叔父・審配が捕縛されるのを見て号泣したという）。"}, "項羽": {"name": "項氏・項羽（こうう：名は籍、字は羽、秦末の西楚の覇王、高祖劉邦と天下を争い烏江に自刃）", "wiki_title": "項羽", "role": "秦末の西楚の覇王（下相県の人、楚の名将・項燕の孫）", "ai_desc": "下相県の人（前232年〜前202年）、名は籍、字は羽。楚の将軍・項燕の孫。叔父・項梁とともに秦末の反乱で挙兵し、鉅鹿の戦いで秦の主力軍を撃破して秦帝国を滅ぼし、「西楚の覇王」と称して諸侯を分封した。その後、漢王・劉邦（漢の高祖）と約5年間にわたる楚漢戦争を繰り広げた末、前202年に垓下で四面楚歌に陥り烏江のほとりで自刃した。死後、最後まで項羽に殉じようとした魯の地を開城させるため、劉邦は項羽の首を示した上で魯公の礼をもって項羽を穀城に葬り、自ら墓前で発喪・泣哭して去った（『史記』巻7・項羽本紀）。東晋の孫盛は、曹操が袁紹の墓前で哭泣した行為を、この漢の高祖（劉邦）による項氏（項羽）への哭泣と並べて政道上の失策と論評した。"}, "湯王": {"name": "湯王・成湯（とうおう／せいとう：名は履、殷王朝の初代天子、伊尹を登用して夏の桀王を討ち殷を開く）", "wiki_title": "湯王", "role": "殷（商）王朝の建国者（初代天子）", "ai_desc": "古代中国の殷（商）王朝の創始者、名は履（『史記』巻3・殷本紀）。毫（現在の河南省商丘市・偃師区などに比定説あり）を拠点として名宰相・伊尹を迎え、諸侯を率いて暴虐な夏の桀王を鳴条の戦いで打ち破り、殷王朝を開いた。周の武王（文王の都・豊鎬から興り牧野で殷の紂王を討った建国者）と並べて「湯・武」と称され、聖王による放伐・王業成就の模範とされる。曹操は、湯王と武王がそれぞれ異なる土地から興って王業を成したことを引き、特定の険阻な地形に固執せず機に応じて変化することの重要性を説いた（『三國志』巻1・武帝紀注引『傅子』）。"}, "袁煕": {"name": "袁煕（えんき：字は顕奕、袁紹の次男、幽州刺史）", "wiki_title": "袁煕", "role": "後漢末の幽州刺史（汝南郡汝陽県の人、袁紹の次男）", "ai_desc": "汝南郡汝陽県の人、字は顕奕（『後漢書』巻74上・袁紹伝注引『九州春秋』等。字を顕雍とする史料もある）。袁紹の次男。公孫瓚滅亡後に父・袁紹から幽州刺史（幽州牧）に任じられて幽州を統治し、妻に甄氏（のちの文昭甄皇后）を迎えた。建安9年（204年）に袁譚に敗れて故安へ逃れてきた末弟・袁尚を受け入れたが、翌建安10年（205年）正月、配下の大将である焦触・張南らに反旗を翻されて攻撃を受け、袁尚とともに三郡烏丸のもとへ出奔した（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "焦触": {"name": "焦触（しょうしょく：袁煕配下の大将、建安10年正月に袁煕・袁尚を逐って曹操に降伏し列侯に封じられる）", "wiki_title": "焦触", "role": "後漢末の袁煕配下の部将、のち曹操配下の列侯・幽州刺史", "ai_desc": "後漢末の武将。幽州の袁煕に仕える大将であったが、建安10年（205年）正月、同僚の張南らとともに反旗を翻して袁煕・袁尚を攻め、二人を三郡烏丸へ追放した。自ら幽州刺史を称し、管内の諸郡県の長官を率いて曹操に降伏し、列侯に封じられた（『三國志』巻1・武帝紀、巻6・袁紹伝、および同注引『英雄記』）。"}, "張南": {"name": "張南（ちょうなん：袁煕配下の大将、焦触とともに袁煕・袁尚を攻めて曹操に降伏）", "wiki_title": "張南 (後漢)", "role": "後漢末の袁煕配下の部将、のち曹操配下の将", "ai_desc": "後漢末の武将（蜀漢の武将・張南〔字は文進〕とは別人）。幽州の袁煕に仕える大将であったが、建安10年（205年）正月、焦触らとともに反旗を翻して袁煕・袁尚を攻めて三郡烏丸へ走らせ、県を挙げて曹操に降伏して列侯に封じられた（『三國志』巻1・武帝紀、巻6・袁紹伝）。"}, "張燕": {"name": "張燕（ちょうえん：本姓は褚、通称は飛燕、黒山賊の首領、のち平北将軍・安国亭侯）", "wiki_title": "張燕", "role": "後漢末の黒山賊の首領、のち曹魏の平北将軍・安国亭侯（常山国真定県の人）", "ai_desc": "常山国真定県の人、本姓は褚。黄巾の乱の際に蜂起し、張牛角の死後にその衆を継いで「張燕」と改姓、身軽で勇敢であったことから「飛燕」と呼ばれた。常山・趙国・中山・上党・河内の太行山脈（黒山）諸山谷の武装集団を統合して衆百万と号し（「黒山賊」）、後漢朝廷に平難中郎将に任じられた。官渡・河北の戦いでは袁紹の背後を牽制して曹操に呼応し、建安10年（205年）4月、冀州平定を受けて十余万の衆を率いて曹操に正式に帰順し、平北将軍・安国亭侯（列侯）に封じられた（『三國志』巻1・武帝紀、巻8・張燕伝）。"}, "趙犢": {"name": "趙犢（ちょうとく：涿郡故安県の豪族・武装勢力指導者、建安10年に幽州刺史・涿郡太守を殺害するも曹操に斬られる）", "wiki_title": "", "role": "後漢末の幽州涿郡故安県の反乱首領", "ai_desc": "幽州涿郡故安県の人。建安10年（205年）4月、同地の霍奴らとともに蜂起して幽州刺史および涿郡太守を殺害したが、同年8月、北征してきた曹操に討伐されて斬られた（『三國志』巻1・武帝紀）。"}, "霍奴": {"name": "霍奴（かくど：趙犢とともに幽州刺史・涿郡太守を殺害した反乱首領）", "wiki_title": "", "role": "後漢末の幽州の反乱首領", "ai_desc": "後漢末の幽州の武装勢力指導者。建安10年（205年）4月、故安の趙犢らとともに反乱を起こして幽州刺史・涿郡太守を殺害したが、同年8月に曹操の征討を受けて討ち滅ぼされた（『三國志』巻1・武帝紀）。"}, "鮮于輔": {"name": "鮮于輔（せんうほ：旧劉虞従事、建安10年に漁陽郡獷平で三郡烏丸に攻められるも曹操に救援される、のち度遼将軍・都亭侯）", "wiki_title": "鮮于輔", "role": "後漢末〜曹魏の武将・度遼将軍・虎牙将軍（漁陽郡の人、元幽州牧・劉虞の従事）", "ai_desc": "漁陽郡の人。もと幽州牧・劉虞の従事。初平4年（193年）に劉虞が公孫瓚に殺害されると、斉周・鮮于銀らと州兵を率いて劉虞の子・劉和を奉じ、烏丸峭王（蘇僕延）や袁紹の将・麴義と結んで公孫瓚を撃破した。その後、田豫の助言を容れて朝廷（曹操）に帰順し、建忠将軍・督幽州六郡となり、官渡の戦いにも参陣して度遼将軍・都亭侯に拝された。建安10年（205年）4月、袁煕・袁尚を受け入れた三郡烏丸に漁陽郡獷平県で包囲攻撃されたが、同年8月に曹操が潞河を渡って救援に駆けつけたことで危難を脱した（『三國志』巻1・武帝紀、巻8・公孫瓚伝、巻26・田豫伝、『後漢書』巻73・劉虞伝）。"}, "直不疑": {"name": "直不疑（ちょくふぎ：前漢の文帝・景帝に仕えた御史大夫・塞侯、「盗嫂」の濡れ衣にも弁明しなかった長者）", "wiki_title": "直不疑", "role": "前漢の御史大夫・塞信侯（南陽郡の人）", "ai_desc": "南陽郡の人（?〜前137年）。前漢の文帝に仕えて郎となり、同室の郎が誤って他人の黄金を持ち帰った際に疑われると黙って金を買い償い、のちに持ち帰った本人が返却して無実が明らかになった逸話や、「直不疑は器量は立派だが、兄嫁と密通している（盗嫂）のが玉に瑕だ」と誹謗された際、実際にはそもそも兄がいなかったにもかかわらず「私には兄はいないのだが」と一言述べただけで一切弁解しなかった故事で知られる。呉楚七国の乱での軍功により塞侯に封じられ、景帝末年に御史大夫に昇った（『史記』巻103・万石張叔列伝附直不疑伝、『漢書』巻46・直不疑伝）。建安10年（205年）9月、曹操は冀州の党派的中傷を戒める令の中で、白を黒と言いくるめる誣告の先例としてこの故事を引いた。"}, "第五倫": {"name": "第五倫・第五伯魚（だいごりん：字は伯魚、後漢の司空、孤女を三度娶りながら「婦翁を殴った」と中傷された清廉の名臣）", "wiki_title": "第五倫", "role": "後漢の会稽太守・蜀郡太守・司空（京兆尹長陵県の人）", "ai_desc": "京兆尹長陵県の人（生没年不詳、章帝期に八十余歳で卒）、字は伯魚。戦国斉の田氏の後裔で、漢初に関中の諸陵へ移住した順序から「第五」を姓とした。会稽太守・蜀郡太守として私財を蓄えず清廉公平な統治を行い、章帝の建初元年（76年）に司空に抜擢された。かつて章帝から「公にも私心はあるか」と問われた際、そのついでに世間の流言に触れ、「私は三度妻を娶りましたがいずれも父のいない孤児の娘（孤女）であったにもかかわらず、世間には私が妻の父（婦翁）を殴った（撾婦翁）と言い触らす者がおりました」と語った故事が伝わる（『後漢書』巻41・第五倫伝）。曹操は建安10年（205年）9月の令で、事実無根の誹謗の例としてこの故事を挙げた。"}, "王鳳": {"name": "王鳳（おうほう：字は孝卿、前漢の元帝皇后・王政君の同母兄、成帝期に大司馬大将軍として外戚王氏専権の端緒を開く）", "wiki_title": "王鳳", "role": "前漢の大司馬大将軍・領尚書事・陽平敬成侯（魏郡元城県の人、王莽の伯父）", "ai_desc": "魏郡元城県の人（?〜前22年）、字は孝卿。前漢の元帝の皇后・王政君（孝元皇太后）の同母兄で、王莽の伯父にあたる。前33年に甥の成帝が即位すると大司馬大将軍・領尚書事となり、陽平侯を継いで朝政の全権を掌握し、異母弟5人が同日に列侯（「五侯」）に封じられるなど外戚・王氏一族による専権の基礎を築いた。政敵であった丞相・王商を陥れて罷免・憤死に追い込み、一方で谷永らの阿諛追従を受けて権勢を振るった（『漢書』巻82・王商伝、巻85・谷永伝、巻98・元后伝）。"}, "谷永": {"name": "谷永（こくえい：字は子雲、長安出身の経学者・大司農、権勢を握る外戚・王鳳に迎合して周の名臣・申伯になぞらえる）", "wiki_title": "谷永", "role": "前漢の涼州刺史・北地太守・大司農（京兆尹長安県の人）", "ai_desc": "京兆尹長安県の人（?〜前8年頃）、字は子雲。博学で災異・経学に通じ、楼護と並んで「谷子雲の筆札」と称えられた文筆家。前漢の成帝期、日食・地震に際する対策上奏で頭角を現したが、朝政の実権が大司馬大将軍・王鳳にあると見るや外戚・王氏に深く阿附し、上奏の中で専権を振るう王鳳を周の宣王の賢臣・外戚である「申伯」になぞらえて激賞し、王氏の権力を擁護した（『漢書』巻85・谷永伝）。曹操は建安10年（205年）9月の令で、権力者への阿諛迎合の例としてこれを挙げた。"}, "申伯": {"name": "申伯（しんぱく：西周の宣王の母方の叔父、中興の賢臣として謝に封じられ『詩経』大雅「嵩高」に称えられる）", "wiki_title": "申伯", "role": "西周・宣王期の外戚・諸侯（申国の君主）", "ai_desc": "西周の第11代天子・宣王（在位前827年〜前782年）の母方の叔父（母后・申姜の兄弟）。姜姓。周室の中興を支えた有徳の賢臣・藩屏として南方の要衝・謝（現在の河南省南陽市付近）に改封され、尹吉甫が作ったとされる『詩経』大雅・嵩高篇において「維嶽降神、生甫及申（山嶽が神霊を降し、仲山甫と申伯を生んだ）」「揉此万邦、聞于四国」と外戚・輔佐臣の模範として称賛された（『詩経』大雅・嵩高）。前漢末の谷永は、専権を振るう大将軍・王鳳をこの申伯になぞらえて迎合した（『漢書』巻85・谷永伝）。"}, "王商": {"name": "王商（おうしょう：字は子威、前漢の宣帝の母方の従兄弟・成帝期の丞相・楽昌侯、忠直により王鳳・張匡らに陥れられる）", "wiki_title": "王商 (楽昌侯)", "role": "前漢の右将軍・左将軍・丞相・楽昌戻侯（涿郡蠡吾県の人）", "ai_desc": "涿郡蠡吾県の人（?〜前25年）、字は子威（元帝皇后・王政君の異母弟である成都侯・王商とは同姓同名の別人）。前漢の宣帝の生母・王夫人（悼后）の兄・王武の子。威厳ある風貌と重厚忠直な人柄で知られ、成帝の建始3年（前30年）に長安で大水への恐怖からパニックが起きた際、大将軍・王鳳が太后・皇帝に船へ避難するよう狼狽して勧めたのに対し、王商が「訛言にすぎない」と落ち着いて制止して人心を鎮めたことで成帝の信任を得て丞相に昇った。しかしこれを深く恨んだ王鳳が、日食に乗じて配下の張匡に王商を弾劾させたため、河平4年（前25年）に丞相を罷免され、数日後に血を吐いて没した（『漢書』巻82・王商伝）。"}, "張匡": {"name": "張匡（ちょうきょう：字は文通、前漢成帝期の太中大夫、大将軍・王鳳の意を受けて忠臣の丞相・王商を「左道」と誣告）", "wiki_title": "", "role": "前漢の太中大夫（琅邪郡の人）", "ai_desc": "琅邪郡の人、字は文通。巧言・姦佞をもって知られた前漢・成帝期の官僚。大司馬大将軍・王鳳が政敵である丞相・王商を憎んで失脚させようとしていた際、王商の閨門の内事を陰で探らせた上で、日食が発生した機会に乗じ、太中大夫であった張匡が王鳳の意を受けて上書し、忠直な王商を「心術に邪心があり、執政において『左道（邪道）』を行って国政を乱し皇天の怒り（日食）を招いた」と激しく誣告した。成帝は王商を庇ったものの王鳳の強硬な要求を抑えきれず王商を罷免するに至った（『漢書』巻82・王商伝）。"}, "高幹": {"name": "高幹（こうかん：字は元才、陳留郡圉県出身の袁紹の甥・并州刺史、壺関に拠って曹操に叛くも敗走し上洛で斬られる）", "wiki_title": "高幹", "role": "後漢末の袁紹配下の并州牧・曹操配下の并州刺史（兗州陳留郡圉県の人、高躬の子・袁紹の外甥）", "ai_desc": "兗州陳留郡圉県の人（?〜206年）、字は元才。蜀郡太守・高躬の子で、袁紹の姉妹の子（外甥）にあたる（『三國志』巻6・袁紹伝注引謝承『後漢書』）。才志があり士を好んで招いた。初平2年（191年）には荀諶らとともに冀州牧・韓馥を説得して袁紹に冀州を譲らせ、袁紹の下で并州牧を領した。建安9年（204年）8月に曹操が鄴を抜くと一旦降伏して并州刺史とされたが、翌建安10年（205年）に曹操が北方の烏丸討伐へ向かった隙に上党太守（仲長統らを擁した并州庁周辺、時の太守）を捕らえて反乱を起こし、壺関口を守備した。楽進・李典に撃たれて壺関城へ退き、建安11年（206年）正月に曹操の親征を受けると南匈奴の呼厨泉単于へ救援を求めたが拒絶され、3月に壺関が陥落すると荊州へ逃れようとして上洛都尉・王琰に捕らえられ斬られた（『三國志』巻1・武帝紀、巻6・袁紹伝、巻18・李典伝）。"}, "楽進": {"name": "楽進（がくしん：字は文謙、陽平郡衛国県出身の曹魏の右将軍・広昌威侯、小柄ながら常に先登一番乗りを果たした猛将）", "wiki_title": "楽進", "role": "後漢末〜三国魏の討寇校尉・折衝将軍・右将軍・広昌威侯（兗州東郡衛国県〔のち陽平郡衛国県〕の人）", "ai_desc": "兗州東郡衛国県（のち陽平郡衛国県）の人（?〜218年）、字は文謙。容貌は小柄であったが胆力と果敢さで知られ、曹操の陣営で帳下吏から身を起こし、郷里で兵千余人を募って軍司馬・陥陣都尉となった。濮陽の呂布戦・雍丘の張超戦・下邳の呂布戦・官渡の戦い（淳于瓊の烏巣陣営突入・斬首）・南皮の袁譚戦などあらゆる攻城戦・野戦で常に「先登（一番乗り）」の功を立てた。建安10年（205年）冬〜11年（206年）には李典とともに高幹を壺関に撃ち、回軍して高幹の背後から城を攻め破り、同年8月には淳于で海賊・管承を撃破して海島まで追撃した。のち張遼・李典とともに合肥を守備して孫権の大軍を撃退し、右将軍に昇った（『三國志』巻17・楽進伝）。"}, "李典": {"name": "李典（りてん：字は曼成、山陽郡鉅野県出身の破虜将軍・都亭愍侯、学問・礼譲を好んだ曹魏の宿将）", "wiki_title": "李典", "role": "後漢末〜曹操配下の裨将軍・捕虜将軍・破虜将軍・都亭愍侯（兗州山陽郡鉅野県の人）", "ai_desc": "兗州山陽郡鉅野県の人（?〜215年頃、享年三十六）、字は曼成。従父・李乾およびその子・李整の遺衆を引き継いで曹操に仕え、離狐太守・中郎将・裨将軍となった。武将でありながら若くして学問を好み、『春秋左氏伝』などを師について学び、諸将と功を争わず儒雅・慎み深い態度で知られた。官渡・黎陽・鄴包囲戦で活躍したのち、建安10年（205年）〜11年（206年）には楽進とともに壺関で高幹を撃ち、同年8月には管承を撃破して山東沿海を平定した。のち張遼・楽進とともに合肥に駐屯し、建安20年（215年）に孫権が十万の軍で来攻した際には張遼との私怨を捨てて国家の大義のために共同出撃し、大勝に貢献した（『三國志』巻18・李典伝）。"}, "呼厨泉": {"name": "呼厨泉・単于（こちゅうせん：後漢末の南匈奴最後の単于、兄・於夫羅の跡を継ぎ平陽に居る、高幹の救援要請を拒絶）", "wiki_title": "呼厨泉", "role": "後漢末の南匈奴単于（在位195年〜216年、羌渠単于の子・於夫羅単于の弟）", "ai_desc": "南匈奴の単于（在位195年〜216年）。単于・羌渠の子で、持至尸逐侯単于・於夫羅の弟。興平2年（195年）に兄・於夫羅が没すると跡を継いで単于となり、河東郡平陽に拠った。建安7年（202年）に袁尚・高幹が派遣した郭援と結んで平陽で反乱を起こしたが、司隷校尉・鍾繇に包囲されて降伏し、以後は漢朝（曹操政権）に帰順していた。そのため建安11年（206年）正月、壺関から逃れてきた高幹が救援を求めた際にはこれを拒絶した。のち建安21年（216年）に入朝した際、曹操によってそのまま鄴に抑留され、南匈奴の部衆は右賢王・去卑が監国し五部に分割統治されることとなった（『後漢書』巻89・南匈奴伝、『三國志』巻1・武帝紀、巻13・鍾繇伝、巻15・梁習伝）。"}, "王琰": {"name": "王琰（おうえん：京兆尹の上洛都尉、荊州へ逃亡を図った高幹を上洛で捕斬し列侯に封じられる）", "wiki_title": "", "role": "後漢末の上洛都尉・列侯", "ai_desc": "後漢末の地方武官。司隸京兆尹南東部の武関道要衝である上洛県の都尉（上洛都尉）を務めていた。建安11年（206年）春、壺関から脱出して南の荊州（劉表のもと）へ逃亡しようとした高幹が数騎で上洛を通りかかった際、これを捕らえて斬首し、その功によって列侯に封じられた（『三國志』巻1・武帝紀、巻6・袁紹伝および注引曹丕『典論』自叙）。"}, "管承": {"name": "管承（かんしょう：青州・徐州沿海に勢力を張った海賊首領、淳于で楽進・李典に破られ海島へ逃走し、のち投降）", "wiki_title": "管承", "role": "後漢末の青州東莱・北海方面の海賊首領", "ai_desc": "後漢末、青州の東莱郡・北海国などの山東半島沿岸に三千余家の部衆を擁して割拠していた海賊の首領。袁氏政権の滅亡後も沿海を荒らしていたため、建安11年（206年）秋8月、曹操が自ら淳于まで東征し、派遣された楽進・李典（および現地で協力した長広太守・何夔、東莱太守・管統ら）の攻撃を受けて大敗し、沖合の海島へ逃走した。その後、曹操が派遣した張遼や牽招らの経略・招撫を受けて部衆を率いて帰順した（『三國志』巻1・武帝紀、巻11・何夔伝、巻17・楽進伝、巻18・李典伝、巻26・牽招伝）。"}, "蹋頓": {"name": "蹋頓（とうとん：遼西烏丸の大人・単于、三郡烏丸を総摂して袁尚兄弟を庇護するも白狼山の戦いで張遼に斬られる）", "wiki_title": "蹋頓", "role": "後漢末の遼西烏丸大人・単于（丘力居の従子）", "ai_desc": "後漢末の遼西烏丸の首長（?〜207年）。大人・丘力居の従子（甥）で武略に秀でた。丘力居の没時にその子・楼班が幼少であったため代わって立ち、遼西・右北平・遼東属国の「三郡烏丸」を総摂して諸部族の信服を集めた。袁紹を助けて公孫瓚を撃破した功により、袁紹から単于の印綬と養女（家人子）を与えられて厚遇された。のち成長した楼班を単于に立てて自らは王と称しつつ実権を握り続け、建安10年（205年）に亡命してきた袁煕・袁尚を受け入れてたびたび塞内を侵した。建安12年（207年）8月、盧龍塞から奇襲進軍してきた曹操軍と白狼山で遭遇して激突したが、先鋒・張遼の突撃を受けて大敗し、陣中で斬首された（『三國志』巻1・武帝紀、巻17・張遼伝、巻30・烏丸伝、『後漢書』巻90・烏桓伝）。"}, "趙奢": {"name": "趙奢（ちょうしゃ：戦国時代の趙の名将・馬服君、閼与の戦いで秦軍を大破し下賜の千金を配下に散じた良将）", "wiki_title": "趙奢", "role": "戦国時代の趙の将軍・馬服君（趙括の父）", "ai_desc": "戦国時代の趙の名将（生没年不詳、趙括の父）。初め趙の田部吏（租税徴収官）として平原君の家をも法によって厳正に処断したことで見出され、恵文王に重用された。前270年、秦軍が韓の閼与を包囲した際に救援軍の将として出陣し、強行軍で北山高地を先取する奇策によって秦軍を大破し、恵文王から「馬服君」に封じられて廉頗・藺相如と同列の位を授けられた（『史記』巻81・廉頗藺相如列伝附趙奢伝）。下賜された財物を惜しみなく配下の将士に分け与えて士心を得た名将として、前漢の竇嬰とともに建安12年（207年）2月の曹操の令に引かれた（王沈『魏書』）。"}, "竇嬰": {"name": "竇嬰（とうえい：字は王孫、前漢の孝文竇太后の従兄の子・大将軍・丞相・魏其侯、下賜の千金を廊下に積んで軍吏に分かち与えた名将）", "wiki_title": "竇嬰", "role": "前漢の大将軍・太子太傅・丞相・魏其侯（冀州清河郡観津県の人）", "ai_desc": "冀州清河郡観津県の人（?〜前131年頃）、字は王孫。前漢の文帝の皇后（景帝の母・孝文竇太后）の従兄の子。任侠と節義を重んじ、景帝の前3年（前154年）に呉楚七国の乱が勃発すると大将軍に拝されて滎陽を守備し、斉・趙方面の戦線を統括した。その際、朝廷から下賜された黄金千斤をすべて陣営の廊下に積み上げ、軍吏が出入りするたびに必要なだけ持ち去らせて私家には一金も入れなかったことで全軍の心服を得、乱平定後に魏其侯に封じられた。のち武帝の初年に丞相となったが、外戚・田蚡との政争に敗れ灌夫に連座して処刑された（『史記』巻107・魏其武安侯列伝、『漢書』巻52・竇田灌韓伝）。"}, "田疇": {"name": "田疇（でんちゅう：字は子泰、右北平郡無終県出身の清節の処士、徐無山中に自治を築き曹操の烏丸遠征で盧龍塞五百里の奇襲路を先導）", "wiki_title": "田疇", "role": "後漢末の処士・曹操配下の司空戸曹掾・議郎（幽州右北平郡無終県の人）", "ai_desc": "幽州右北平郡無終県の人（169年〜214年）、字は子泰。読書と撃剣を好み節義に厚かった。初平年間、幽州牧・劉虞の使者として長安へ赴いて献帝から騎都尉を拝命したが固辞し、帰還した時には劉虞が公孫瓚に殺害されていたため、危険を冒して劉虞の墓前に上奏文を捧げて哭泣した。その後、一族と附従者五百余家を率いて徐無山の奥地へ入り、法制と礼教を整えて五千余家が暮らす自治共同体を築いた。烏丸に家族を殺害された恨みを抱いていたことから、建安12年（207年）秋7月、大水で海沿いの道が塞がり立ち往生していた曹操の招きに応じて道案内（郷導）を買って出、二百年近く途絶えていた盧龍塞から白檀・平岡を経て柳城の背後を突く間道を進言・先導し、白狼山での大勝をもたらした。戦後、曹操は柳亭侯（食邑五百戸）に封じようとしたが田疇は死を賭して固辞し続け、世にその高節を称えられた（『三國志』巻11・田疇伝）。"}, "楼班": {"name": "楼班（ろうばん：遼西烏丸の大人・丘力居の子、成長後に単于に立てられ蹋頓とともに白狼山で曹操軍と戦う）", "wiki_title": "楼班", "role": "後漢末の遼西烏丸単于（丘力居の子）", "ai_desc": "後漢末の遼西烏丸の単于（?〜207年）。五千余落を統率した大人・丘力居の子。初平年間に丘力居が没した際には幼少であったため、従父（父の甥）の蹋頓が代わって三郡烏丸を総領した。のち楼班が成長すると、右北平の難楼や遼東属国の蘇僕延（速僕丸）らが奉じて単于に立て、蹋頓は王に退いて引き続き軍政の実権を補佐した。建安12年（207年）8月、袁尚・袁煕や蹋頓・能臣抵之らとともに数万騎を率いて白狼山で曹操軍を迎え撃ったが大敗し、遼東へ逃れたのち袁尚らとともに公孫康に殺害された（『三國志』巻1・武帝紀、巻30・烏丸伝および注引『英雄記』、『後漢書』巻90・烏桓伝）。"}, "能臣抵之": {"name": "能臣抵之（のうしんていし：右北平烏丸の単于、建安12年8月に蹋頓・楼班・袁尚らとともに白狼山で曹操軍を迎え撃つ）", "wiki_title": "", "role": "後漢末の右北平烏丸単于", "ai_desc": "後漢末の右北平烏丸の単于（大人）。建安12年（207年）8月、盧龍塞を越えて柳城へ迫った曹操の遠征軍に対し、袁尚・袁煕および蹋頓・遼西単于の楼班らとともに数万騎を率いて白狼山で迎え撃ったが、張遼を先鋒とする曹操軍の突撃を受けて大敗した（『三國志』巻1・武帝紀、巻30・烏丸伝）。"}, "速僕丸": {"name": "速僕丸・蘇僕延（そくぼくがん／そぼくえん：遼東属国烏丸の単于・峭王、白狼山で敗れ袁尚らと遼東へ奔り公孫康に斬られる）", "wiki_title": "蘇僕延", "role": "後漢末の遼東属国烏丸単于（自号は「峭王」、『烏丸伝』等の表記は「蘇僕延」）", "ai_desc": "後漢末の遼東属国烏丸の大人・単于（?〜207年）。『三國志』巻30・烏丸伝および『後漢書』巻90・烏桓伝では「蘇僕延」と表記され、千余落を率いて自ら「峭王」と号した。かつて幽州牧・劉虞が公孫瓚に殺害された際には鮮于輔を助けて公孫瓚を破り、のちに袁紹から単于の印綬を授けられた。建安12年（207年）8月、白狼山の戦いで曹操軍に大敗すると、自らの部族民を見棄てて袁尚・袁煕とともに数千騎を率いて遼東の公孫康のもとへ逃走したが、同年9月、公孫康によって袁尚・袁煕とともに斬首され、その首級は曹操のもとへ送り届けられた（『三國志』巻1・武帝紀、巻30・烏丸伝）。"}, "公孫康": {"name": "公孫康（こうそんこう：遼東太守・公孫度の子、父の跡を継ぎ遼東に自立、逃れてきた袁尚・袁煕・速僕丸を斬って曹操に帰順し襄平侯となる）", "wiki_title": "公孫康", "role": "後漢末の遼東太守・左将軍・襄平侯（幽州遼東郡襄平県の人、公孫度の長男・公孫淵の父）", "ai_desc": "幽州遼東郡襄平県の人（生没年不詳）、公孫度の長男で公孫淵の父。建安9年（204年）に父・公孫度が没すると跡を継いで遼東太守となり、父に授けられていた永寧郷侯の印綬を弟の公孫恭に譲り、遠隔の地を恃んで自立を保っていた。建安12年（207年）9月、白狼山で曹操に敗れた袁尚・袁煕・速僕丸らが数千騎を率いて遼東へ逃げ込んでくると、曹操が追撃すれば力を合わせて抵抗するが撤退すれば互いに疑心暗鬼となって殺し合うであろうと読んだ曹操の策通り、袁尚らが自分の地位を奪おうとしていると警戒し、使者として迎え入れた会見の席に伏兵を設けて袁尚・袁煕・速僕丸らを一網打尽に捕らえて斬首した。その首級を曹操へ送り届けた功によって左将軍・襄平侯に拝され、のち高句麗や韓・濊を討って帯方郡を新設した（『三國志』巻1・武帝紀、巻8・公孫度伝、巻30・東夷伝）。"}, "普富盧": {"name": "普富盧（ふふろ：代郡烏丸の行単于、建安12年11月に易水へ帰還した曹操のもとへ名王を率いて戦勝祝賀・帰順に訪れる）", "wiki_title": "", "role": "後漢末の代郡烏丸大人・行単于", "ai_desc": "後漢末、幽州西端の代郡内外に居住していた代郡烏丸の大人（行単于）。建安12年（207年）8月に曹操が白狼山で三郡烏丸を撃破し、さらに遼東の袁尚・袁煕らの首級を得て同年11月に易水まで凱旋帰還すると、曹操の武威に服し、上郡烏丸の行単于・那楼とともに配下の名王たちを率いて戦勝の祝賀に訪れた（『三國志』巻1・武帝紀、巻30・烏丸伝）。"}, "那楼": {"name": "那楼（なろう：上郡烏丸の行単于、建安12年11月に代郡烏丸の普富盧とともに易水で曹操へ来賀・帰順する）", "wiki_title": "", "role": "後漢末の上郡烏丸大人・行単于", "ai_desc": "後漢末、并州南西部の上郡に居住していた上郡烏丸の大人（行単于）。建安12年（207年）11月、北征で三郡烏丸と袁氏兄弟を滅ぼした曹操の軍が易水に到着した際、代郡烏丸の行単于・普富盧とともに配下の名王たちを率いて戦勝の祝賀に訪れ帰順した（『三國志』巻1・武帝紀、巻30・烏丸伝）。"}, "徐璆": {"name": "徐璆（じょきゅう：字は孟玉、広陵郡海西県出身の衛尉・太常、袁術の上公授与を拒み死後に伝国璽を奪還して漢朝へ献上）", "wiki_title": "徐璆", "role": "後漢末の荊州刺史・汝南太守・東海相・衛尉・太常（徐州広陵郡海西県の人）", "ai_desc": "徐州広陵郡海西県の人（?〜217年頃）、字は孟玉。度遼将軍・徐淑の子。若くして博学・清廉方正で知られ、荊州刺史として太后の姉の子にあたる南陽太守・張忠の不正を弾劾して威名を挙げ、さらに任城・汝南・東海の三郡の太守・国相を歴任して善政を敷いた。中央へ召し還される途中で寿春の袁術に脅迫・抑留され、帝号を僭称した袁術から「上公」の位を授けられそうになったが決して屈しなかった。建安4年（199年）に袁術が窮死すると、袁術が所持していた「伝国の玉璽」を手に入れて許都の後漢朝廷へ奉還し、衛尉ついで太常に拝された。建安13年（208年）6月に曹操が丞相に任じられた際には勅使として印綬を授け、曹操は徐璆の徳望に敬意を表して丞相の位を譲ろうとした。のち曹操に従って馬超・韓遂討伐（潼関の戦い）に赴いた際、陣中で病没した（『三國志』巻1・武帝紀注引『献帝起居注』『先賢行状』、『後漢書』巻48・徐璆伝）。"}, "劉琮": {"name": "劉琮（りゅうそう：荊州牧・劉表の次男、後妻蔡氏・蔡瑁らに擁立されて後を継ぎ、建安13年9月に曹操へ降伏）", "wiki_title": "劉琮 (劉表の子)", "role": "後漢末の荊州牧・のち青州刺史・諫議大夫・参同軍事・列侯（兗州山陽郡高平県の人、劉表の次男・劉琦の弟）", "ai_desc": "兗州山陽郡高平県の人（生没年不詳）。荊州牧・劉表の次男で、長男・劉琦の弟。劉表の後妻・蔡氏の姪を妻としたことから蔡氏および蔡瑁・張允らの後ろ盾を得て寵愛され、建安13年（208年）8月に父・劉表が病没すると兄・劉琦を退けて後継者となり襄陽に駐屯した。同年9月、南征してきた曹操の軍が新野に到達すると、蒯越・韓嵩・傅巽らの進言を容れて曹操への降伏を決断した。このとき樊城に駐屯していた劉備には事前に降伏を知らせなかったため、気付いた劉備は夏口へと南走した。降伏後、曹操から青州刺史・列侯に拝され、のちに諫議大夫・参同軍事へと優遇された（『三國志』巻1・武帝紀、巻6・劉表伝）。"}, "文聘": {"name": "文聘（ぶんぺい：字は仲業、南陽郡宛県出身の江夏太守・後将軍・新野侯、旧主劉表への忠義を曹操に嘉され数十年にわたり江夏を守り抜いた名将）", "wiki_title": "文聘", "role": "後漢末〜三国魏の江夏太守・討逆将軍・後将軍・新野壮侯（荊州南陽郡宛県の人）", "ai_desc": "荊州南陽郡宛県の人（生没年不詳）、字は仲業。荊州牧・劉表の大将として北方の防衛を任されていた。建安13年（208年）9月に劉表の跡を継いだ劉琮が曹操に降伏した際、「州を保全できなかったのに顔向けできない」としてすぐには出頭せず、曹操が漢水を渡った後に初めて参上して「先君の領土を守り切れず悲しみに暮れていたため遅れました」と涙を流した。曹操はその忠臣ぶりに深く感動して「まことの忠臣である」と称賛し、従来の手勢をそのまま預けて対呉・対劉備の最前線である江夏太守に任命し、関内侯を授けた。以後数十年にわたり江夏に鎮して関羽や孫権の大軍（石陽包囲戦など）を幾度も撃退し、威名を南方に轟かせた（『三國志』巻1・武帝紀、巻18・文聘伝）。"}, "韓嵩": {"name": "韓嵩（かんすう：字は徳高、南陽郡義陽県出身の荊州の名士・侍中・零陵太守、荊州平定後に曹操から朋友の礼で遇され大鴻臚に至る）", "wiki_title": "韓嵩", "role": "後漢末の荊州別駕・侍中・零陵太守・のち大鴻臚（荊州南陽郡義陽県の人）", "ai_desc": "荊州南陽郡義陽県の人（生没年不詳）、字は徳高。若くして学問を好み清貧を守って黄巾賊からも敬避された名士。劉表に強いられて別駕従事となり、官渡の戦いの最中に情勢視察の使者として許都へ赴く際、「もし天子から官職を授けられれば天子の臣となり、劉表の専属ではなくなる」と事前に釘を刺した上で上京し、果して朝廷から侍中・零陵太守を拝命して帰還し曹操への帰順を説いたため、激怒した劉表に処刑されそうになり軟禁された。建安13年（208年）9月に劉琮が降伏して荊州が平定されると、曹操はその先見と忠節を高く評価して重用し、交友（朋友）の礼をもって待遇して九卿の大鴻臚に任じた（『三國志』巻1・武帝紀、巻6・劉表伝および注引『傅子』、『後漢書』巻74下・劉表伝）。"}, "鄧義": {"name": "鄧義・鄧羲（とうぎ：章陵郡出身の荊州の名士・治中従事、劉表を諫めて退いたのち曹操に抜擢されて侍中となる）", "wiki_title": "鄧羲", "role": "後漢末の荊州治中従事・のち侍中（荊州章陵郡の人、『劉表伝』では「鄧羲」と表記）", "ai_desc": "荊州章陵郡の人（生没年不詳、『三國志』巻6・劉表伝および『後漢書』巻74下・劉表伝では「鄧羲」と表記）。荊州牧・劉表の下で治中従事を務めていたが、建安初期に劉表が南方で天子の祭祀である郊祀を僭行したことを厳しく諫め、聞き入れられないと見るや病と称して官を辞した。建安13年（208年）9月、曹操が荊州を平定すると韓嵩らとともに荊州の名士として登用され、侍中に拝された（『三國志』巻1・武帝紀、巻6・劉表伝）。"}, "衛恒": {"name": "衛恒（えいこう：字は巨山、河東郡安邑県出身の西晋の書家・黄門侍郎、衛瓘の長男、『四体書勢』の著者）", "wiki_title": "衛恒", "role": "西晋の書家・太子舎人・尚書郎・黄門侍郎（司州河東郡安邑県の人、衛覬の曽孫・衛瓘の子）", "ai_desc": "司州河東郡安邑県の人（?〜291年）、字は巨山。曹魏の尚書・衛覬の曽孫、西晋の太保・衛瓘の長男にあたり、書聖・王羲之の師である衛夫人（衛鑠）の一族（従兄または叔父）。父祖以来の書学を受け継いで草書・隷書・篆書に精通し、西晋の恵帝期に黄門侍郎を務めたが、元康元年（291年）に賈南風のクーデターで父・衛瓘ら一族とともに非業の死を遂げた。主著『四体書勢』（古文・篆・隷・草の四書体の歴史と筆勢を論じた書論）は中国書道史の最重要古典の一つであり、『晋書』巻36・衛瓘伝附衛恒伝に全文が収録されている。"}, "王次仲": {"name": "王次仲（おうじちゅう：上谷郡沮陽県出身の秦〜漢代の伝説的書家、篆書・古隷から実用的な八分隷書〔楷法〕を創始）", "wiki_title": "王次仲", "role": "秦〜漢代の書家（幽州上谷郡沮陽県の人）", "ai_desc": "幽州上谷郡沮陽県の人（生没年諸説あり）。衛恒『四体書勢序』によれば、上谷の王次仲は早くから隷書に秀で、今日にも通じる端正な隷書の規範（「楷法」＝八分・漢隷の定型筆法）を初めて確立した人物とされる（なお『水経注』巻13・聖水注など後世の伝説では、秦の始皇帝に召された際に大鳥に化して飛び去り大翮山・小翮山に羽を落とした仙人としても語られる）。"}, "師宜官": {"name": "師宜官（しぎかん：南陽郡出身の後漢末・霊帝期随一の書家、八分隷書の第一人者として鴻都門学に召される）", "wiki_title": "師宜官", "role": "後漢末・霊帝期の書家（荊州南陽郡の人、のち袁術の将）", "ai_desc": "荊州南陽郡の人（生没年不詳）。後漢・霊帝が書芸・辞賦を愛好して設けた鴻都門学において、数百人の能書家の中でも随一の名手と称えられた八分（隷書）の大家。一字が方一丈の大字から一寸四方に千字を収める細字まで自在に書きこなしたが、自らの才能を鼻にかけて秘伝が盗まれるのを嫌い、酒代のために酒店の壁に字を書いて銭が集まると削り落とし、木札に書くたびにその札を削って焼き捨てた。しかし梁鵠に酒を飲まされて酔いつぶれている間に木札を盗み学ばれたという。のち袁術の部将となり、鉅鹿の耿氏のために碑を揮毫した（衛恒『四体書勢序』、『晋書』巻36・衛恒伝）。"}, "梁鵠": {"name": "梁鵠（りょうこく：字は孟皇、安定郡烏氏県出身の選部尚書・軍仮司馬、曹操に愛重され曹魏宮殿の扁額をすべて揮毫した大書家）", "wiki_title": "梁鵠", "role": "後漢末〜曹魏の書家・涼州刺史・選部尚書・軍仮司馬（涼州安定郡烏氏県の人）", "ai_desc": "涼州安定郡烏氏県の人（生没年不詳）、字は孟皇。若い頃に師宜官を酒で酔わせて書き捨ての木札を盗み取って八分（隷書）の筆法を極め、孝廉・郎から涼州刺史を経て、書を好んだ霊帝に抜擢されて選部尚書（人事を掌る尚書）に昇った。このとき洛陽令への任官を望んだ若き曹操を洛陽北部尉に任じた。董卓の乱後に荊州の劉表を頼って身を寄せていたが、建安13年（208年）9月に曹操が荊州を平定して梁鵠を捜し求めると、恐れて自ら縄目について軍門に出頭した。曹操はこれを罪に問わず軍仮司馬に任じて秘書に配属し、その書を陣中の帳や壁に留めて「師宜官にも勝る」と愛玩した。のち曹魏の宮殿の門額・題署はすべて梁鵠の書が用いられた（衛恒『四体書勢序』、『晋書』巻36・衛恒伝）。"}, "皇甫謐": {"name": "皇甫謐（こうほひつ：字は士安、幼名は静、自号は玄晏先生、安定郡朝那県出身の西晋の大学者、『帝王世紀』『高士伝』『逸士伝』『針灸甲乙経』の著者）", "wiki_title": "皇甫謐", "role": "西晋の学者・著述家・処士（雍州安定郡朝那県の人、皇甫嵩の曽孫）", "ai_desc": "雍州安定郡朝那県の人（215年〜282年）、字は士安、自号は玄晏先生。後漢末の名将・皇甫嵩の曽孫。二十歳を過ぎてから叔母の訓戒を受けて発憤して学問に打ち込み、半身不随の病（風痺）を抱えながらも手から書物を離さず、西晋の武帝（司馬炎）からの度重なる徴召をすべて辞退し、代わりに朝廷から車一乗分の書物を下賜されて生涯を在野の著述に捧げた。『帝王世紀』『高士伝』『逸士伝』『列女伝』『玄晏春秋』および医学古典『針灸甲乙経』など膨大な著作を残し、裴松之注にも多く引用されている（『晋書』巻51・皇甫謐伝）。"}, "王儁": {"name": "王儁（おうしゅん：字は子文、汝南郡出身の清流派の隠士、無官時代の曹操の器量を認め、没後に曹操が自ら長江に出て棺を迎え江陵に改葬）", "wiki_title": "", "role": "後漢末の処士・隠逸の名士（豫州汝南郡の人）", "ai_desc": "豫州汝南郡の人（?〜208年以前、享年64）、字は子文。若い頃から同郡の清流派指導者・范滂や許章に認められ、南陽の岑晊と親交を結んだ。曹操がまだ無位無官の布衣であった頃から曹操に深く敬愛され、王儁も曹操に「治世の具（天下を治める器量）」があると称え、袁紹・袁術兄弟の母の葬儀に3万人が会葬した際には、密かに「天下を乱す首魁はこの二人だ」と語った曹操に対し「天下を救う者は君をおいて誰がいよう」と笑い合った。外見は物静かで内面は聡明であり、州郡・三府の辟召や公車の礼による召聘、さらに許都遷都後の尚書への任命をもすべて辞退し、戦乱を避けて荊州の武陵郡へ移り住むと百余家が慕って従った。劉表が袁紹と結んだ際には「曹公こそ覇道を興し斉桓・晋文の功を継ぐ英雄であり、近くの曹公を棄てて遥か漠北の救いを頼むのは危うい」と忠告したが容れられず、64歳で武陵に没した。建安13年（208年）秋に荊州を平定した曹操は、自ら長江のほとりまで出向いて王儁の棺を出迎え、江陵に改葬して「先賢」として顕彰した（『三國志』巻1・武帝紀注引皇甫謐『逸士伝』）。"}, "范滂": {"name": "范滂（はんぼう：字は孟博、汝南郡征羌県出身の清流派「八顧」の筆頭格、慨然として天下澄清の志を抱き党錮の禍に殉じた烈士）", "wiki_title": "范滂", "role": "後漢の清詔使・太尉掾・汝南郡功曹（豫州汝南郡征羌県の人、「八顧」の一人）", "ai_desc": "豫州汝南郡征羌県の人（137年〜169年）、字は孟博。少年の頃より清節をもって郷里に仰がれ、冀州への清詔使に抜擢されると車に乗って手綱を握り慨然として「天下を澄清する（清らかに正す）」の志を示したため、不正な守相・県令たちが風を望んで自ら印綬を解いて逃げ去ったという。汝南郡の功曹としては太守・宗資に一切の人事を委ねられ、「汝南の太守は范孟博、南陽の宗資は画諾するのみ」と謡われた。「八顧」（徳行をもって人を導く八名士）の一人に数えられたが、建寧2年（169年）の第二次党錮の禍において逃亡を潔しとせず自ら県獄に出頭し、母と涙ながらに訣別して33歳で処刑された（『後漢書』巻67・党錮列伝・范滂伝）。"}, "許章": {"name": "許章（きょしょう：汝南郡平輿県出身の清流派の名士、范滂らと並び郷里の人材鑑識で重きをなす）", "wiki_title": "", "role": "後漢の汝南郡の名士（豫州汝南郡平輿県の人）", "ai_desc": "豫州汝南郡平輿県の人（生没年不詳、霊帝期の宦官・許璋とは別人）。後漢の桓帝・霊帝期に同郡の范滂らと並んで高い声望と人物鑑識眼を持った清流派の名士であり（同郷の許劭・許靖ら平輿許氏の一族とみられる）、若き日の王儁（字は子文）の才器を范滂とともにいち早く見出した（皇甫謐『逸士伝』）。"}, "岑晊": {"name": "岑晊（しんしつ：字は公孝、南陽郡棘陽県出身の清流派「八及」の一人、「南陽の太守は岑公孝」と謳われた名士）", "wiki_title": "岑晊", "role": "後漢の南陽郡功曹（荊州南陽郡棘陽県の人、「八及」の一人）", "ai_desc": "荊州南陽郡棘陽県の人（生没年不詳）、字は公孝。高潔な才気と弁論で知られ、太学に遊学しながらも権勢家の梁冀や外戚の招聘には一切応じず、李膺・王暢らから「高世の君子」と敬重された。南陽太守・成瑨に請われて功曹となると、太守に代わって郡内の綱紀を粛正して権豪・奸吏を容赦なく処断したため、汝南の范滂と対になって「南陽の太守は岑公孝、弘農の成瑨は但だ坐嘯するのみ」と巷で謡われ、「八及」（人を導いて宗とさせる八名士）の一人に列した。のちに成瑨が宦官の恨みを買って獄死し党錮の禍が及ぶと、江夏や親交のあった名士たちのもとへ身を隠して難を逃れた（『後漢書』巻67・党錮列伝・岑晊伝）。"}, "斉桓公": {"name": "斉の桓公・小白（せいのこうこう：春秋五覇の筆頭、管仲を宰相に任じて「尊王攘夷」を掲げ諸侯を九合した覇者）", "wiki_title": "桓公 (斉)", "role": "春秋時代の斉の第16代君主（在位前685年〜前643年、姓は姜・氏は呂・名は小白）", "ai_desc": "春秋時代の斉の君主・小白（?〜前643年）。公位争いの際に自らの腹の帯鉤を射た宿敵・管仲（管夷吾）の才を惜しみ、鮑叔の推薦を容れて宰相に抜擢した。「尊王攘夷（周王室を尊び夷狄を打ち払う）」の旗印のもと、兵車を用いずに諸侯を九たび会盟させ（「九合諸侯、一匡天下」）、春秋五覇の筆頭として晋の文公と並び「斉桓・晋文（桓・文）」と称えられた（『史記』巻32・斉太公世家、『論語』憲問篇）。"}, "晋文公": {"name": "晋の文公・重耳（しんのぶんこう：春秋五覇の代表、十九年の亡命を経て帰国し城濮の戦いで楚を破り覇業を樹立）", "wiki_title": "文公 (晋)", "role": "春秋時代の晋の第22代君主（在位前636年〜前628年、姓は姫・名は重耳）", "ai_desc": "春秋時代の晋の君主・重耳（前697年〜前628年）。驪姫の乱によって国外へ逃れ、趙衰・狐偃・介子推ら賢臣とともに19年間にわたり諸国を流亡した末、秦の穆公の支援を受けて62歳で帰国・即位した。国内の政治・軍制を整えて周の襄王の危難を救い、前632年の城濮の戦いで強国・楚を撃破し、践土の会盟で周王から諸侯の覇者（侯伯）に冊命された。斉の桓公と並んで覇道の理想像「桓・文」と並称される（『史記』巻39・晋世家）。のち建安15年冬12月の『述志令』においても、曹操自身が「斉桓・晋文の所以で今日に至った」と自らを桓・文になぞらえている。"}, "劉璋": {"name": "劉璋（りゅうしょう：字は季玉、江夏郡竟陵県出身の漢室宗親・益州牧、建安13年に初めて曹操へ遣使・送兵して帰順を示す）", "wiki_title": "劉璋", "role": "後漢末の益州牧・振威将軍（荊州江夏郡竟陵県の人、魯恭王劉余の末裔・劉焉の末子）", "ai_desc": "荊州江夏郡竟陵県の人（?〜220年頃）、字は季玉。前漢の魯恭王・劉余の末裔で、益州牧・劉焉の末子。興平元年（194年）に父・劉焉が病没すると、帳下司馬・趙韙らの推戴と朝廷の追認によって益州牧を継いだ。漢中の張魯と対立し、長らく巴蜀の険に拠って中原の朝廷への徴発・貢納を絶っていたが、建安13年（208年）秋に曹操が荊州へ南征して劉琮を降すと威勢に恐れを抱き、陰溥や別駕・張松らを相次いで使者として派遣し、初めて朝廷の徴役を受け入れて曹操の軍へ補充兵を送った。しかし張松が曹操に冷遇されたことに反発して劉備の引き入れを画策したことから、のち建安19年（214年）に劉備に成都を包囲されて降伏し、荊州の公安へ移されたのち呉の孫権に荊州牧とされ没した（『三國志』巻1・武帝紀、巻31・劉二牧伝）。"}, "孫権": {"name": "孫権（そんけん：字は仲謀、呉郡富春県出身の江東の覇主・のち呉の初代皇帝〔大帝〕、劉備と同盟して赤壁で曹操を阻み合肥を攻める）", "wiki_title": "孫権", "role": "後漢末の討虜将軍・会稽太守・車騎将軍・呉王・のち三国呉の初代皇帝・大帝（揚州呉郡富春県の人、孫堅の次男・孫策の弟）", "ai_desc": "揚州呉郡富春県の人（182年〜252年）、字は仲謀。破虜将軍・孫堅の次男で、討逆将軍・孫策の弟。建安5年（200年）に兄・孫策が刺客に襲われて急逝すると、わずか19歳で江東六郡の統治を引き継ぎ、張昭・周瑜・魯粛ら文武の英才を任用し、曹操の上表によって討虜将軍・領会稽太守となった。建安13年（208年）秋に曹操が荊州を制圧して江陵から長江を下ってくると、魯粛・周瑜および劉備の使者・諸葛亮の主戦論を容れて劉備と同盟を結び、周瑜・程普に精兵三万を授けて赤壁（烏林）で曹操の大軍を撃退させ、自らも別軍を率いて淮南の要衝・合肥を包囲した（張憙の救援接近を聞いて撤退）。のち荊州・交州を併せて黄龍元年（229年）に皇帝に即位し、三国呉を建国した（『三國志』巻1・武帝紀、巻47・呉主伝）。"}, "張憙": {"name": "張憙（ちょうき：曹操配下の別部統軍の将、建安13年冬に孫権が包囲する合肥へ救援に急行し巧みな計略で包囲を解かせる）", "wiki_title": "蒋済#合肥防衛の偽書", "role": "後漢末〜曹魏の将軍・のち司空（『三國志』巻14・蒋済伝等に見える合肥救援の将）", "ai_desc": "後漢末〜三国魏の武将・重臣。建安13年（208年）冬12月、孫権が自ら大軍を率いて揚州九江郡の要衝・合肥を包囲した際、荊州の巴丘まで進軍していた曹操から将軍として合肥救援に急派された。『三國志』巻14・蒋済伝および巻47・呉主伝によれば、曹操本軍が疫病に苦しみ大軍を割けない中、張憙はわずか千人の兵を率いて汝南・譙で増援を募りつつ急行し、途上で疫病により兵の半数を失ったが、揚州別駕の蒋済が「歩騎四万を率いる張憙がすでに雩婁に到着した」という偽の書状を仕立てて孫権軍にわざと奪わせたため、大軍の到来を信じた孫権は陣営を焼いて撤退し、合肥の危機を救った（『三國志』巻1・武帝紀、巻14・蒋済伝、巻47・呉主伝）。"}};

    const usedKeys = new Set();
    if (extraPlaceKey) {

    const tagRegex = /\{\{place:([^|}]+)\|/g;
    targetRecs.forEach(rec => {
      [rec.raw_tagged, rec.kakikudashi_tagged, rec.translation_tagged].forEach(txt => {

        let m;
        while ((m = tagRegex.exec(txt)) !== null) {
          usedKeys.add(m[1]);
        }
      });
    });
    // 使用されている地点ピンの親エリア（parent_area）もあわせて有効化
    PLACES.forEach(p => {
      if (p.is_pin && usedKeys.has(p.key) && p.parent_area) {

    });

  function renderEmbeddedTags(taggedText, recId) {

      if (tagType === 'place') {

  function renderReaderList() {
    const showAll = isEditModeActive() && document.getElementById('toggleShowAllParas') && document.getElementById('toggleShowAllParas').checked;
    const maxVis = getMaxVisibleParagraph();
    if (currentParaIndex > maxVis) {
      currentParaIndex = maxVis;
    }

    // 地図と本文の間の段落切り替えバー（← 第 1 / ○ →）を更新
    if (paraTopNavEl) {
      if (!showAll) {
        const prevDisabled = currentParaIndex <= 1 ? 'disabled' : '';
        const nextDisabled = currentParaIndex >= maxVis ? 'disabled' : '';
        let optionsHtml = '';
        for (let p = 1; p <= maxVis; p++) {
          const selectedAttr = p === currentParaIndex ? 'selected' : '';
          optionsHtml += `<option value="${p}" ${selectedAttr}>${getSectionLabelForPara(p)}</option>`;
        }
        paraTopNavEl.innerHTML = `
          <button class="slim-nav-btn" onclick="changeParagraph(-1)" ${prevDisabled}>←</button>
          <select class="para-select" onchange="goToParagraph(parseInt(this.value, 10))">${optionsHtml}</select>
          <button class="slim-nav-btn" onclick="changeParagraph(1)" ${nextDisabled}>→</button>
        `;
      } else {
        paraTopNavEl.innerHTML = `<span class="vol-nav-title">全段落連続表示（第 1 〜 ${maxVis} 段落）</span>`;
      }
    }

    recordListEl.innerHTML = '';

    // 読書履歴スタックがある場合は最上部に「元の場所に戻る」ボタンを表示
    if (readingHistoryStack.length > 0) {
      const lastId = readingHistoryStack[readingHistoryStack.length - 1];

    const visibleRecs = getVisibleRecords();
    const targetRecords = showAll

    targetRecords.forEach(rec => {

        <div class="translation">${renderEmbeddedTags(rec.translation_tagged, rec.id)}</div>

      card.addEventListener('click', () => {

      recordListEl.appendChild(card);

    // 本文末尾の索引ボタンバー
    const bottomNav = document.createElement('div');
    bottomNav.className = 'para-bottom-nav';
    bottomNav.innerHTML = `
      <button class="nav-btn" onclick="openTocModal()">📑 登場人物・地名・官職 索引</button>

      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-4382223240782332"
           data-ad-format="auto"

    if (categoryType === 'person') {
      headerTitle = `👤 【人物】${itemKey}`;
      const pInfo = PERSONS_INFO[itemKey];
      if (pInfo) {
        wikiTargetTitle = pInfo.wiki_title || '';
        specialGlossaryDesc = pInfo.ai_desc || '';
      } else {

      }
      if (clickedSurface && clickedSurface !== itemKey) {
        mappingNote = `原文の「${clickedSurface}」をフルネーム「${itemKey}」に特別変換して紐づけています。`;
      }
      searchTerms = [itemKey];
    } else if (categoryType === 'office') {
      const info = OFFICES[itemKey];
      if (!info) return;

      wikiTargetTitle = info.wiki_title !== undefined ? info.wiki_title : itemKey;
      mappingNote = info.mapping_note || '';

        specialGlossaryDesc = info.ai_desc || '';

      searchTerms = itemKey === '県令' ? ['易陽令', '雒陽令', '綿竹令'] :
                    (itemKey === '県長' ? ['臨沮長', '旌陽長', '臨邛長'] :
                    (itemKey === '相' ? ['魯相'] : info.match_terms));
    } else if (categoryType === 'special') {
      const info = SPECIAL_KW[itemKey];
      if (!info) return;
      headerTitle = `🔖 【${info.category}】${info.title}`;
      wikiTargetTitle = info.wiki_title !== undefined ? info.wiki_title : itemKey;
      mappingNote = info.mapping_note || '';
      specialGlossaryDesc = info.ai_desc || '';

    const fallbackAiDesc = (categoryType === 'office' && OFFICES[itemKey]) ? (OFFICES[itemKey].ai_desc || '') : '';

  async function fetchWikipediaSummary(wikiTitle, containerId, fallbackDesc = '', hasSpecialBox = false) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const encoded = encodeURIComponent(wikiTitle);
    const wikiUrl = `https://ja.wikipedia.org/wiki/${encoded}`;
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encoded}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.type === 'disambiguation') throw new Error('Disambiguation');
      box.innerHTML = `
        <div style="font-weight:bold; color:#0d47a1; margin-bottom:4px;">🌐 【Wikipedia 概略】「${data.title}」</div>
        <div>${data.extract || '（要約テキストなし）'}</div>
        <a class="wiki-link-btn" href="${wikiUrl}" target="_blank" rel="noopener">Wikipediaで「${data.title}」のページを開く ↗</a>
      `;
    } catch (err) {
      if (hasSpecialBox) {
        box.style.display = 'none';
      } else if (fallbackDesc) {
        box.className = 'ai-special-box';
        box.innerHTML = `
          <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">📖 【語句・制度の意味解説】</div>
          <div>${fallbackDesc}</div>
        `;
      } else {
        box.style.display = 'none';
      }
    }
  }

  function highlightSimple(text, terms) {

    terms.forEach(t => {
      if (!t) return;
      res = res.replace(new RegExp(t, 'g'), `<span class="highlight">${t}</span>`);
    });
    return res;

        cardEl.classList.add('flash-card-target');
        return;

      const containerEl = (blockClass ? cardEl.querySelector(`.${blockClass}`) : null) || cardEl;
      const tagSpans = Array.from(containerEl.querySelectorAll('.inline-place, .inline-person, .inline-office, .inline-special'));
      let matchedEl = tagSpans.find(sp => (sp.textContent || '').trim() === targetWord)
                   || tagSpans.find(sp => (sp.textContent || '').includes(targetWord));

      if (matchedEl) {
        matchedEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        matchedEl.classList.add('flash-update-target');
      } else {
        containerEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cardEl.classList.add('flash-card-target');
      }
    }, 60);
  }

  function applyEnvironmentModeUI() {
    const editActive = isEditModeActive();
    const trayEl = document.getElementById('feedbackTray');
    const trayBodyEl = document.getElementById('feedbackTrayBody');
    const trayFooterEl = document.getElementById('feedbackTrayFooter');
    const proofreadLabelEl = document.getElementById('proofreadModeLabel');
    const showAllLabelEl = document.getElementById('showAllParasLabel');

    // 手元PCまたは ?edit=1 の時だけ制作トレイを表示（本番Webでは完全非表示）
    if (trayEl) trayEl.style.display = IS_AUTHOR_EDIT_ENV ? 'flex' : 'none';
    if (trayBodyEl) trayBodyEl.style.display = editActive ? 'flex' : 'none';
    if (trayFooterEl) trayFooterEl.style.display = editActive ? 'flex' : 'none';
    if (proofreadLabelEl) proofreadLabelEl.style.display = editActive ? 'flex' : 'none';
    if (showAllLabelEl) showAllLabelEl.style.display = editActive ? 'flex' : 'none';
    if (!editActive) hideSelectionFeedbackBar();

    renderMapLayersForCurrentMode();
    renderReaderList();
  }

  function handleInlineTagClick(event, recId, tagType, itemKey, surfaceText) {
    event.stopPropagation();
    const sel = window.getSelection();
    if (sel && sel.toString().trim().length > 0) {
      return;
    }

    setActiveRecord(recId);
    const isProofreadMode = isEditModeActive() && document.getElementById('toggleProofreadMode').checked;

    if (tagType === 'place') {
      focusPlaceOnMap(itemKey, surfaceText);
    }

    if (isProofreadMode) {
      openFeedbackBarForTagElement(event.currentTarget, recId, tagType, itemKey, surfaceText);
      return;
    }

    if (tagType !== 'place') {
      openUnifiedModal(tagType, itemKey, surfaceText);
    }
  }

  function handleInlineTagContextMenu(event, recId, tagType, itemKey, surfaceText) {
    if (!isEditModeActive()) return;
    event.preventDefault();
    event.stopPropagation();
    setActiveRecord(recId);
    if (tagType === 'place') {
      focusPlaceOnMap(itemKey, surfaceText);
    }
    openFeedbackBarForTagElement(event.currentTarget, recId, tagType, itemKey, surfaceText);
  }

  function getBlockLabelFromElement(el) {
    if (!el) return '本文';
    if (el.closest('.raw-text')) return '原文';
    if (el.closest('.kakikudashi')) return '書き下し';
    if (el.closest('.translation')) return '現代語訳';
    return '本文';
  }

  function getRangeCharOffsetInContainer(containerEl, range) {
    if (!containerEl || !range) return -1;
    try {
      const preRange = range.cloneRange();
      preRange.selectNodeContents(containerEl);
      preRange.setEnd(range.startContainer, range.startOffset);
      return preRange.toString().length;
    } catch (e) {
      return -1;
    }
  }

  function extractSurroundingContext(containerEl, targetWord, exactOffset = -1) {
    if (!containerEl || !targetWord) return targetWord;
    const fullText = containerEl.innerText || containerEl.textContent || '';
    const idx = (exactOffset >= 0 && exactOffset <= fullText.length)
      ? exactOffset
      : fullText.indexOf(targetWord);
    if (idx === -1) return `【${targetWord}】`;
    const start = Math.max(0, idx - CONTEXT_SNIPPET_RADIUS_CHARS);
    const end = Math.min(fullText.length, idx + targetWord.length + CONTEXT_SNIPPET_RADIUS_CHARS);
    const prefix = (start > 0 ? '…' : '') + fullText.slice(start, idx);
    const suffix = fullText.slice(idx + targetWord.length, end) + (end < fullText.length ? '…' : '');
    return `${prefix}【${targetWord}】${suffix}`;
  }

  function openFeedbackBarForTagElement(el, recId, tagType, itemKey, surfaceText) {
    if (!isEditModeActive()) return;
    const blockEl = el.closest('.raw-text, .kakikudashi, .translation');
    const blockLabel = getBlockLabelFromElement(el);
    let exactOffset = -1;
    if (blockEl && el) {
      try {
        const r = document.createRange();
        r.selectNodeContents(el);
        exactOffset = getRangeCharOffsetInContainer(blockEl, r);
      } catch (e) {}
    }
    const contextStr = extractSurroundingContext(blockEl, surfaceText, exactOffset);
    const typeNameMap = {
      'place': getPlaceSubTypeLabel(itemKey),
      'person': `👤人名(${itemKey})`,
      'office': `👑官職(${itemKey})`,
      'special': `🔖特別語(${itemKey})`
    };

    pendingFeedbackContext = {
      recId: recId,
      blockLabel: blockLabel,
      word: surfaceText,
      contextStr: contextStr,
      currentTag: typeNameMap[tagType] || tagType
    };

    const rect = el.getBoundingClientRect();
    showSelectionFeedbackBarAtRect(rect);
  }

  document.addEventListener('mouseup', (event) => {
    if (!isEditModeActive()) return;
    const bar = document.getElementById('selectionFeedbackBar');
    if (bar && bar.contains(event.target)) return;

    setTimeout(() => {
      if (!isEditModeActive()) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;
      const selectedText = sel.toString().trim();
      if (!selectedText || selectedText.length > MAX_SELECTION_CHARS) return;

      const anchorNode = sel.anchorNode;
      if (!anchorNode) return;
      const anchorEl = anchorNode.nodeType === 3 ? anchorNode.parentElement : anchorNode;
      if (!anchorEl) return;

      const cardEl = anchorEl.closest('.record-card');
      if (!cardEl) return;

      const recId = cardEl.dataset.id || currentActiveId;
      const blockEl = anchorEl.closest('.raw-text, .kakikudashi, .translation');
      const blockLabel = getBlockLabelFromElement(anchorEl);
      const range = sel.getRangeAt(0);
      const exactOffset = getRangeCharOffsetInContainer(blockEl, range);
      const contextStr = extractSurroundingContext(blockEl, selectedText, exactOffset);

      // 選択箇所が既存のタグ内かどうかを判定
      const inlineTagEl = anchorEl.closest('.inline-place, .inline-person, .inline-office, .inline-special');
      let currentTag = '未タグ';
      if (inlineTagEl) {
        const fullTagText = inlineTagEl.textContent || '';
        const tType = inlineTagEl.dataset.tagType || '';
        const tKey = inlineTagEl.dataset.tagKey || fullTagText;
        const detailType = tType === 'place' ? getPlaceSubTypeLabel(tKey) :
                           (tType === 'person' ? `👤人名(${tKey})` :
                           (tType === 'office' ? `👑官職(${tKey})` :
                           (tType === 'special' ? `🔖特別語(${tKey})` : `既タグ「${fullTagText}」`)));
        currentTag = fullTagText === selectedText ? detailType : `${detailType}の一部`;
      }

      pendingFeedbackContext = {
        recId: recId,
        blockLabel: blockLabel,
        word: selectedText,
        contextStr: contextStr,
        currentTag: currentTag
      };

      const rect = range.getBoundingClientRect();
      showSelectionFeedbackBarAtRect(rect);
    }, 10);
  });

  function showSelectionFeedbackBarAtRect(rect) {
    if (!pendingFeedbackContext) return;
    const bar = document.getElementById('selectionFeedbackBar');
    document.getElementById('sfbMetaLabel').textContent = `[${pendingFeedbackContext.recId}・${pendingFeedbackContext.blockLabel}]`;
    document.getElementById('sfbTargetWord').textContent = pendingFeedbackContext.word;
    document.getElementById('sfbCurrentTagInfo').textContent = `（現在: ${pendingFeedbackContext.currentTag}）`;

    bar.style.display = 'flex';
    const barRect = bar.getBoundingClientRect();

    let topPx = rect.top - barRect.height - POPUP_OFFSET_Y_PX;
    if (topPx < POPUP_VIEWPORT_MARGIN_PX) {
      topPx = rect.bottom + POPUP_OFFSET_Y_PX;
    }
    let leftPx = rect.left + (rect.width / 2) - (barRect.width / 2);
    leftPx = Math.max(POPUP_VIEWPORT_MARGIN_PX, Math.min(window.innerWidth - barRect.width - POPUP_VIEWPORT_MARGIN_PX, leftPx));

    bar.style.top = `${Math.round(topPx)}px`;
    bar.style.left = `${Math.round(leftPx)}px`;
  }

  function hideSelectionFeedbackBar() {
    const bar = document.getElementById('selectionFeedbackBar');
    if (bar) bar.style.display = 'none';
  }

  function addFeedbackFromBar(actionText) {
    if (!pendingFeedbackContext) return;
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: pendingFeedbackContext.recId,
      blockLabel: pendingFeedbackContext.blockLabel,
      word: pendingFeedbackContext.word,
      contextStr: pendingFeedbackContext.contextStr,
      currentTag: pendingFeedbackContext.currentTag,
      action: actionText
    });
    saveFeedbackItems();
    hideSelectionFeedbackBar();
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
  }

  function promptCustomFeedbackNote() {
    if (!pendingFeedbackContext) return;
    const note = window.prompt(
      `[${pendingFeedbackContext.recId}] 「${pendingFeedbackContext.word}」についての指摘・メモを入力してください（例：〇〇郡の同名別地、訳文を〇〇に修正など）：`,
      ''
    );
    if (note && note.trim()) {
      addFeedbackFromBar(`✏️ メモ指摘: ${note.trim()}`);
    }
  }

  // 地図左下の地名トースト内からのワンクリック指摘
  function addPlaceToastFeedback(placeKey, surfaceText, actionText) {
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: currentActiveId,
      blockLabel: '地図確認',
      word: surfaceText,
      contextStr: `現在位置 ${currentActiveId} で「${surfaceText}」(登録キー: ${placeKey}) を確認中`,
      currentTag: `地名(${placeKey})`,
      action: actionText
    });
    saveFeedbackItems();
  }

  // 地図上をクリックして「本当の場所（緯度・経度）」をワンクリック指定するモード
  function startMapCoordPicker(placeKey, surfaceText) {
    mapCoordPickerState = {
      recId: currentActiveId,
      placeKey: placeKey,
      surfaceText: surfaceText
    };
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `<div style="color:#ffd54f; font-weight:bold;">🎯 【位置指定モード】地図上で「${surfaceText}」の正しい位置をクリックしてください（自動で緯度・経度が指摘リストに入ります）</div>`;
    document.getElementById('map').style.cursor = 'crosshair';
  }

  map.on('click', (e) => {
    if (!mapCoordPickerState) return;
    const lat = e.latlng.lat.toFixed(COORD_DECIMAL_DIGITS);
    const lng = e.latlng.lng.toFixed(COORD_DECIMAL_DIGITS);
    feedbackItems.push({
      id: Date.now() + Math.random(),
      recId: mapCoordPickerState.recId,
      blockLabel: '地図座標指定',
      word: mapCoordPickerState.surfaceText,
      contextStr: `登録キー: ${mapCoordPickerState.placeKey}`,
      currentTag: `地名(${mapCoordPickerState.placeKey})`,
      action: `📍 正しい座標を地図クリックで指定 ➔ 緯度: ${lat}, 経度: ${lng}`
    });
    saveFeedbackItems();

    L.circleMarker([e.latlng.lat, e.latlng.lng], {
      radius: 8,
      color: '#ffeb3b',
      fillColor: '#d50000',
      fillOpacity: 0.9,
      weight: 2.5
    }).addTo(activeHighlightLayers.length >= 0 ? map : map).bindTooltip(`🎯 指摘座標: ${ mapCoordPickerState.surfaceText } (${lat}, ${lng})`, { permanent: true, direction: 'top' });

    document.getElementById('map').style.cursor = '';
    const toast = document.getElementById('mapToast');
    toast.innerHTML = `✅ <strong>「${mapCoordPickerState.surfaceText}」の指定座標 (${lat}, ${lng}) を右下の指摘リストに追加しました！</strong>`;
    mapCoordPickerState = null;
  });

  function toggleFeedbackTray() {
    const tray = document.getElementById('feedbackTray');
    const icon = document.getElementById('feedbackTrayToggleIcon');
    tray.classList.toggle('minimized');
    icon.textContent = tray.classList.contains('minimized') ? '▲ 展開する' : '▼ 折りたたむ';
  }

  function removeFeedbackItem(idx) {
    feedbackItems.splice(idx, 1);
    saveFeedbackItems();
  }

  function clearAllFeedback() {
    if (feedbackItems.length === 0) return;
    feedbackItems = [];
    saveFeedbackItems();
  }

  function renderFeedbackTray() {
    const badge = document.getElementById('feedbackCountBadge');
    const body = document.getElementById('feedbackTrayBody');
    if (!badge || !body) return;

    badge.textContent = `${feedbackItems.length}件`;

    if (feedbackItems.length === 0) {
      body.innerHTML = `
        <div class="feedback-empty">
          本文の気になる文字を<strong>なぞって選択</strong>するか、色付き単語を<strong>右クリック</strong>（🛠️指摘モードON時は左クリック）すると、ワンクリックでここに指摘が溜まります。
        </div>
      `;
      return;
    }

    body.innerHTML = feedbackItems.map((item, idx) => `
      <div class="feedback-item">
        <div>
          <div><strong>[${item.recId}・${item.blockLabel}]</strong> 「<span style="color:#ffd54f; font-weight:bold;">${item.word}</span>」 <span style="color:#b0bec5; font-size:0.74rem;">(${item.currentTag})</span></div>
          <div style="color:#a5d6a7; font-weight:bold; margin-top:2px;">➔ ${item.action}</div>
          <div style="color:#ccc; font-size:0.74rem; margin-top:1px;">文脈: ${item.contextStr}</div>
        </div>
        <button class="feedback-item-del" onclick="removeFeedbackItem(${idx})" title="この指摘を削除">✕</button>
      </div>
    `).join('');
  }

  function copyAllFeedbackToClipboard() {
    if (feedbackItems.length === 0) {
      window.alert('まだ指摘リストが空です。本文の文字をドラッグ選択するか、色付き単語を右クリックして指摘を追加してください。');
      return;
    }

    const lines = ['【巻1 ピンポイント指摘リスト】'];
    feedbackItems.forEach((item, i) => {
      lines.push(`${i + 1}. [${item.recId} / ${item.blockLabel}] 「${item.word}」（現在: ${item.currentTag}｜文脈: ${item.contextStr}） ➔ ${item.action}`);
    });
    const textToCopy = lines.join('\n');

    navigator.clipboard.writeText(textToCopy).then(() => {
      const btn = document.getElementById('feedbackCopyBtn');
      const origText = btn.textContent;
      btn.textContent = '✅ コピーしました！そのままチャットに貼り付けてください';
      btn.style.background = '#66bb6a';
      setTimeout(() => {
        btn.textContent = origText;
        btn.style.background = '';
      }, 2500);
    }).catch(() => {
      window.prompt('以下のテキストをコピーしてチャットに貼り付けてください：', textToCopy);
    });
  }

  applyEnvironmentModeUI();
  renderFeedbackTray();
  setActiveRecord("v1_p1_1");
</script>
</body>
</html>
