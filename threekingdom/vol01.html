kudashi_tagged": "是の歳、{{place:長安|長安}}乱れ、{{person:献帝|天子}}は東遷し、{{place:曹陽|曹陽}}に敗れ、{{place:黄河|河}}を渡りて{{place:安邑|安邑}}に幸す。", "translation_tagged": "この年、{{place:長安|長安}}が戦乱に陥り、{{person:献帝|天子}}（{{person:献帝|献帝}}）は東へ遷幸したが、{{place:曹陽|曹陽}}で敗れ、{{place:黄河|黄河}}を渡って{{place:安邑|安邑}}に行幸した。"}, {"id": "v1_p29_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 29, "type": "本文", "raw_text": "建安元年春正月，太祖軍臨武平，袁術所置陳相袁嗣降。", "kakikudashi": "建安元年春正月、太祖の軍が武平に臨むや、袁術が置く所の陳相の袁嗣が降る。", "translation": "建安元年（一九六年）春正月、太祖の軍が武平に迫ると、袁術が任命していた陳国の相・袁嗣が降伏した。", "persons": "曹操,袁術,袁嗣", "places": "武平,陳国", "era_year": "建安元年（196年）春正月", "source_book": "", "keywords": "陳相", "raw_tagged": "{{special:建安|建安元年}}春正月，{{person:曹操|太祖}}軍臨{{place:武平|武平}}，{{person:袁術|袁術}}所置{{place:陳国|陳}}{{office:相|相}}{{person:袁嗣|袁嗣}}降。", "kakikudashi_tagged": "{{special:建安|建安元年}}春正月、{{person:曹操|太祖}}の軍が{{place:武平|武平}}に臨むや、{{person:袁術|袁術}}が置く所の{{place:陳国|陳}}{{office:相|相}}の{{person:袁嗣|袁嗣}}が降る。", "translation_tagged": "{{special:建安|建安元年}}（一九六年）春正月、{{person:曹操|太祖}}の軍が{{place:武平|武平}}に迫ると、{{person:袁術|袁術}}が任命していた{{place:陳国|陳国}}の相・{{person:袁嗣|袁嗣}}が降伏した。"}, {"id": "v1_p30_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 30, "type": "本文", "raw_text": "太祖將迎天子，諸將或疑，荀彧、程昱勸之，乃遣曹洪將兵西迎，衞將軍董承與袁術將萇奴拒險，洪不得進。", "kakikudashi": "太祖は将に天子を迎えんとすれども、諸将は或いは疑う。荀彧・程昱が之を勧むれば、乃ち曹洪を遣わして兵を将いて西のかた迎えしむるも、衛将軍の董承と袁術の将の萇奴とが険に拒ぎ、洪は進むを得ず。", "translation": "太祖は天子（献帝）を迎え入れようとしたが、諸将の中には疑念を抱く者もいた。荀彧と程昱がこれを強く勧めたため、そこで曹洪を派遣して兵を率い西へ迎えに行かせたが、衛将軍の董承と袁術の部将・萇奴が険阻な要害を塞いで阻んだため、曹洪は前進することができなかった。", "persons": "曹操,献帝,荀彧,程昱,曹洪,董承,袁術,萇奴", "places": "", "era_year": "建安元年（196年）春正月", "source_book": "", "keywords": "衛将軍", "raw_tagged": "{{person:曹操|太祖}}將迎{{person:献帝|天子}}，諸將或疑，{{person:荀彧|荀彧}}、{{person:程昱|程昱}}勸之，乃遣{{person:曹洪|曹洪}}將兵西迎，{{office:衛将軍|衞將軍}}{{person:董承|董承}}與{{person:袁術|袁術}}將{{person:萇奴|萇奴}}拒險，{{person:曹洪|洪}}不得進。", "kakikudashi_tagged": "{{person:曹操|太祖}}は将に{{person:献帝|天子}}を迎えんとすれども、諸将は或いは疑う。{{person:荀彧|荀彧}}・{{person:程昱|程昱}}が之を勧むれば、乃ち{{person:曹洪|曹洪}}を遣わして兵を将いて西のかた迎えしむるも、{{office:衛将軍|衛将軍}}の{{person:董承|董承}}と{{person:袁術|袁術}}の将の{{person:萇奴|萇奴}}とが険に拒ぎ、{{person:曹洪|洪}}は進むを得ず。", "translation_tagged": "{{person:曹操|太祖}}は{{person:献帝|天子}}（{{person:献帝|献帝}}）を迎え入れようとしたが、諸将の中には疑念を抱く者もいた。{{person:荀彧|荀彧}}と{{person:程昱|程昱}}がこれを強く勧めたため、そこで{{person:曹洪|曹洪}}を派遣して兵を率い西へ迎えに行かせたが、{{office:衛将軍|衛将軍}}の{{person:董承|董承}}と{{person:袁術|袁術}}の部将・{{person:萇奴|萇奴}}が険阻な要害を塞いで阻んだため、{{person:曹洪|曹洪}}は前進することができなかった。"}, {"id": "v1_p31_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 31, "type": "本文", "raw_text": "汝南、潁川黃巾何儀、劉辟、黃邵、何曼等，衆各數萬，初應袁術，又附孫堅。二月，太祖進軍討破之，斬辟、邵等，儀及其衆皆降。天子拜太祖建德將軍，夏六月，遷鎮東將軍，封費亭侯。秋七月，楊奉、韓暹以天子還洛陽，", "kakikudashi": "汝南・潁川の黄巾の何儀・劉辟・黄邵・何曼等は、衆各々数万にして、初めは袁術に応じ、又た孫堅に附く。二月、太祖は軍を進めて討ちて之を破り、辟・邵等を斬り、儀及び其の衆は皆降る。天子は太祖を拝して建徳将軍と為し、夏六月、鎮東将軍に遷り、費亭侯に封ぜらる。秋七月、楊奉・韓暹が天子を以て洛陽に還り、", "translation": "汝南・潁川の黄巾の残党である何儀・劉辟・黄邵・何曼らは、それぞれ数万の軍勢を擁し、当初は袁術に呼応し、また孫堅にも帰附していた。二月、太祖は軍を進めて彼らを討伐・撃破し、劉辟・黄邵らを斬り、何儀およびその軍勢はみな降伏した。天子（献帝）は太祖を建徳将軍に拝し、夏六月には鎮東将軍に昇進させ、費亭侯に封じた。秋七月、楊奉と韓暹が天子（献帝）を奉じて洛陽へ帰還し、", "persons": "何儀,劉辟,黄邵,何曼,袁術,孫堅,曹操,献帝,楊奉,韓暹", "places": "汝南,潁川,費亭,洛陽", "era_year": "建安元年（196年）2月〜秋7月", "source_book": "", "keywords": "黄巾,建徳将軍,鎮東将軍,費亭侯", "raw_tagged": "{{place:汝南|汝南}}、{{place:潁川|潁川}}{{special:黄巾|黃巾}}{{person:何儀|何儀}}、{{person:劉辟|劉辟}}、{{person:黄邵|黃邵}}、{{person:何曼|何曼}}等，衆各數萬，初應{{person:袁術|袁術}}，又附{{person:孫堅|孫堅}}。二月，{{person:曹操|太祖}}進軍討破之，斬{{person:劉辟|辟}}、{{person:黄邵|邵}}等，{{person:何儀|儀}}及其衆皆降。{{person:献帝|天子}}拜{{person:曹操|太祖}}{{office:建徳将軍|建德將軍}}，夏六月，遷{{office:鎮東将軍|鎮東將軍}}，封{{place:費亭|費亭}}{{office:列侯|侯}}。秋七月，{{person:楊奉|楊奉}}、{{person:韓暹|韓暹}}以{{person:献帝|天子}}還{{place:洛陽|洛陽}}，", "kakikudashi_tagged": "{{place:汝南|汝南}}・{{place:潁川|潁川}}の{{special:黄巾|黄巾}}の{{person:何儀|何儀}}・{{person:劉辟|劉辟}}・{{person:黄邵|黄邵}}・{{person:何曼|何曼}}等は、衆各々数万にして、初めは{{person:袁術|袁術}}に応じ、又た{{person:孫堅|孫堅}}に附く。二月、{{person:曹操|太祖}}は軍を進めて討ちて之を破り、{{person:劉辟|辟}}・{{person:黄邵|邵}}等を斬り、{{person:何儀|儀}}及び其の衆は皆降る。{{person:献帝|天子}}は{{person:曹操|太祖}}を拝して{{office:建徳将軍|建徳将軍}}と為し、夏六月、{{office:鎮東将軍|鎮東将軍}}に遷り、{{place:費亭|費亭}}{{office:列侯|侯}}に封ぜらる。秋七月、{{person:楊奉|楊奉}}・{{person:韓暹|韓暹}}が{{person:献帝|天子}}を以て{{place:洛陽|洛陽}}に還り、", "translation_tagged": "{{place:汝南|汝南}}・{{place:潁川|潁川}}の{{special:黄巾|黄巾}}の残党である{{person:何儀|何儀}}・{{person:劉辟|劉辟}}・{{person:黄邵|黄邵}}・{{person:何曼|何曼}}らは、それぞれ数万の軍勢を擁し、当初は{{person:袁術|袁術}}に呼応し、また{{person:孫堅|孫堅}}にも帰附していた。二月、{{person:曹操|太祖}}は軍を進めて彼らを討伐・撃破し、{{person:劉辟|劉辟}}・{{person:黄邵|黄邵}}らを斬り、{{person:何儀|何儀}}およびその軍勢はみな降伏した。{{person:献帝|天子}}（{{person:献帝|献帝}}）は{{person:曹操|太祖}}を{{office:建徳将軍|建徳将軍}}に拝し、夏六月には{{office:鎮東将軍|鎮東将軍}}に昇進させ、{{place:費亭|費亭}}{{office:列侯|侯}}に封じた。秋七月、{{person:楊奉|楊奉}}と{{person:韓暹|韓暹}}が{{person:献帝|天子}}（{{person:献帝|献帝}}）を奉じて{{place:洛陽|洛陽}}へ帰還し、"}, {"id": "v1_p31_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 31, "type": "裴注", "raw_text": "《獻帝春秋》曰：天子初至洛陽，幸城西故中常侍趙忠宅。使張楊繕治宮室，名殿曰揚安殿，八月，帝乃遷居。", "kakikudashi": "『献帝春秋』に曰く、「天子は初めて洛陽に至るや、城西の故の中常侍の趙忠が宅に幸す。張楊をして宮室を繕治せしめ、殿に名づけて揚安殿と曰い、八月、帝は乃ち遷り居す」と。", "translation": "『献帝春秋』にいう。「天子（献帝）は洛陽に到着した当初、城西にあった故・中常侍の趙忠の旧宅に行幸した。張楊に命じて宮室を修復させ、その宮殿を『揚安殿』と名づけ、八月になって帝（献帝）はそこへ移り住んだ」。", "persons": "献帝,趙忠,張楊", "places": "洛陽", "era_year": "建安元年（196年）秋7月〜8月", "source_book": "献帝春秋", "keywords": "中常侍", "raw_tagged": "{{special:引用史料|《獻帝春秋》}}曰：{{person:献帝|天子}}初至{{place:洛陽|洛陽}}，幸城西故{{office:中常侍|中常侍}}{{person:趙忠|趙忠}}宅。使{{person:張楊|張楊}}繕治宮室，名殿曰揚安殿，八月，{{person:献帝|帝}}乃遷居。", "kakikudashi_tagged": "{{special:引用史料|『献帝春秋』}}に曰く、「{{person:献帝|天子}}は初めて{{place:洛陽|洛陽}}に至るや、城西の故の{{office:中常侍|中常侍}}の{{person:趙忠|趙忠}}が宅に幸す。{{person:張楊|張楊}}をして宮室を繕治せしめ、殿に名づけて揚安殿と曰い、八月、{{person:献帝|帝}}は乃ち遷り居す」と。", "translation_tagged": "{{special:引用史料|『献帝春秋』}}にいう。「{{person:献帝|天子}}（{{person:献帝|献帝}}）は{{place:洛陽|洛陽}}に到着した当初、城西にあった故・{{office:中常侍|中常侍}}の{{person:趙忠|趙忠}}の旧宅に行幸した。{{person:張楊|張楊}}に命じて宮室を修復させ、その宮殿を『揚安殿』と名づけ、八月になって{{person:献帝|帝}}（{{person:献帝|献帝}}）はそこへ移り住んだ」。"}, {"id": "v1_p31_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 31, "type": "本文", "raw_text": "奉別屯梁。太祖遂至洛陽，衞京都，暹遁走。天子假太祖節鉞，錄尚書事。", "kakikudashi": "奉は別に梁に屯す。太祖は遂に洛陽に至り、京都を衛るに、暹は遁れ走る。天子は太祖に節鉞を仮し、尚書事を録せしむ。", "translation": "楊奉は別行動をとって梁県に駐屯した。太祖はついに洛陽へ至り、京都（洛陽）を護衛すると、韓暹は逃亡した。天子（献帝）は太祖に節鉞を仮し、録尚書事とした。", "persons": "楊奉,曹操,韓暹,献帝", "places": "梁県,洛陽", "era_year": "建安元年（196年）8月", "source_book": "", "keywords": "節鉞,録尚書事", "raw_tagged": "{{person:楊奉|奉}}別屯{{place:梁県|梁}}。{{person:曹操|太祖}}遂至{{place:洛陽|洛陽}}，衞{{place:洛陽|京都}}，{{person:韓暹|暹}}遁走。{{person:献帝|天子}}假{{person:曹操|太祖}}{{special:節鉞|節鉞}}，{{office:録尚書事|錄尚書事}}。", "kakikudashi_tagged": "{{person:楊奉|奉}}は別に{{place:梁県|梁}}に屯す。{{person:曹操|太祖}}は遂に{{place:洛陽|洛陽}}に至り、{{place:洛陽|京都}}を衛るに、{{person:韓暹|暹}}は遁れ走る。{{person:献帝|天子}}は{{person:曹操|太祖}}に{{special:節鉞|節鉞}}を仮し、{{office:録尚書事|尚書事を録せしむ}}。", "translation_tagged": "{{person:楊奉|楊奉}}は別行動をとって{{place:梁県|梁県}}に駐屯した。{{person:曹操|太祖}}はついに{{place:洛陽|洛陽}}へ至り、{{place:洛陽|京都}}（{{place:洛陽|洛陽}}）を護衛すると、{{person:韓暹|韓暹}}は逃亡した。{{person:献帝|天子}}（{{person:献帝|献帝}}）は{{person:曹操|太祖}}に{{special:節鉞|節鉞}}を仮し、{{office:録尚書事|録尚書事}}とした。"}, {"id": "v1_p31_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 31, "type": "裴注", "raw_text": "《獻帝紀》曰：又領司隷校尉。", "kakikudashi": "『献帝紀』に曰く、「又た司隷校尉を領す」と。", "translation": "『献帝紀』にいう。「また司隷校尉を兼領した」。", "persons": "曹操", "places": "", "era_year": "建安元年（196年）8月", "source_book": "献帝紀", "keywords": "司隷校尉", "raw_tagged": "{{special:引用史料|《獻帝紀》}}曰：又領{{office:司隷校尉|司隷校尉}}。", "kakikudashi_tagged": "{{special:引用史料|『献帝紀』}}に曰く、「又た{{office:司隷校尉|司隷校尉}}を領す」と。", "translation_tagged": "{{special:引用史料|『献帝紀』}}にいう。「また{{office:司隷校尉|司隷校尉}}を兼領した」。"}, {"id": "v1_p31_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 31, "type": "本文", "raw_text": "洛陽殘破，董昭等勸太祖都許。九月，車駕出轘轅而東，以太祖爲大將軍，封武平侯。自天子西遷，朝廷日亂，至是宗廟社稷制度始立。", "kakikudashi": "洛陽は残破し、董昭等は太祖に許に都せんことを勧む。九月、車駕は轘轅を出でて東し、太祖を以て大将軍と為し、武平侯に封ず。天子が西遷してより、朝廷は日に乱るるも、是に至りて宗廟・社稷・制度が始めて立つ。", "translation": "洛陽は荒廃し切っていたため、董昭らは太祖に許都（許県）へ遷都するよう勧めた。九月、天子（献帝）の車駕は轘轅関を出て東へ進み、太祖を大将軍に任じ、武平侯に封じた。天子（献帝）が長安へ西遷して以来、朝廷は日増しに混乱していたが、ここに至って宗廟・社稷および朝廷の諸制度が初めて再建された。", "persons": "董昭,曹操,献帝", "places": "洛陽,許,轘轅,武平,長安", "era_year": "建安元年（196年）9月", "source_book": "", "keywords": "大将軍,武平侯", "raw_tagged": "{{place:洛陽|洛陽}}殘破，{{person:董昭|董昭}}等勸{{person:曹操|太祖}}都{{place:許|許}}。九月，{{person:献帝|車駕}}出{{place:轘轅|轘轅}}而東，以{{person:曹操|太祖}}爲{{office:大将軍|大將軍}}，封{{place:武平|武平}}{{office:列侯|侯}}。自{{person:献帝|天子}}西遷，朝廷日亂，至是宗廟社稷制度始立。", "kakikudashi_tagged": "{{place:洛陽|洛陽}}は残破し、{{person:董昭|董昭}}等は{{person:曹操|太祖}}に{{place:許|許}}に都せんことを勧む。九月、{{person:献帝|車駕}}は{{place:轘轅|轘轅}}を出でて東し、{{person:曹操|太祖}}を以て{{office:大将軍|大将軍}}と為し、{{place:武平|武平}}{{office:列侯|侯}}に封ず。{{person:献帝|天子}}が西遷してより、朝廷は日に乱るるも、是に至りて宗廟・社稷・制度が始めて立つ。", "translation_tagged": "{{place:洛陽|洛陽}}は荒廃し切っていたため、{{person:董昭|董昭}}らは{{person:曹操|太祖}}に{{place:許|許都}}（{{place:許|許県}}）へ遷都するよう勧めた。九月、{{person:献帝|天子}}（{{person:献帝|献帝}}）の{{person:献帝|車駕}}は{{place:轘轅|轘轅関}}を出て東へ進み、{{person:曹操|太祖}}を{{office:大将軍|大将軍}}に任じ、{{place:武平|武平}}{{office:列侯|侯}}に封じた。{{person:献帝|天子}}（{{person:献帝|献帝}}）が{{place:長安|長安}}へ西遷して以来、朝廷は日増しに混乱していたが、ここに至って宗廟・社稷および朝廷の諸制度が初めて再建された。"}, {"id": "v1_p31_6", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 31, "type": "裴注", "raw_text": "張璠《漢紀》曰：初，天子敗於曹陽，欲浮河東下。侍中太史令王立曰：「自去春太白犯鎮星於牛斗，過天津，熒惑又逆行守北河，不可犯也。」由是天子遂不北渡河，將自軹關東出。立又謂宗正劉艾曰：「前太白守天關，與熒惑會；金火交會，革命之象也。漢祚終矣，晉、魏必有興者。」立後數言於帝曰：「天命有去就，五行不常盛，代火者土也，承漢者魏也，能安天下者，曹姓也，唯委任曹氏而已。」公聞之，使人語立曰：「知公忠於朝廷，然天道深遠，幸勿多言。」", "kakikudashi": "張璠の『漢紀』に曰く、「初め、天子が曹陽に敗るるや、河に浮かびて東下せんと欲す。侍中・太史令の王立曰く、『去春より太白が鎮星を牛・斗に犯し、天津を過ぎ、熒惑は又た逆行して北河を守れば、犯す可からざるなり』と。是に由りて天子は遂に北のかた河を渡らず、将に軹関より東に出でんとす。立は又た宗正の劉艾に謂いて曰く、『前に太白が天関を守り、熒惑と会す。金火の交会するは、革命の象なり。漢の祚は終われり、晋・魏に必ず興る者有らん』と。立は後に数々帝に言いて曰く、『天命に去就有り、五行は常には盛んならず、火に代わる者は土なり、漢を承くる者は魏なり、能く天下を安んずる者は、曹姓なり、唯だ曹氏に委任せんのみ』と。公は之を聞き、人をして立に語げしめて曰く、『公が朝廷に忠なるを知るも、然れども天道は深遠なれば、幸わくは多言する勿かれ』と」と。", "translation": "張璠の『漢紀』にいう。「当初、天子（献帝）が曹陽で敗れた際、黄河に船を浮かべて東へ下ろうとした。すると侍中兼太史令の王立が言った、『去年の春以来、太白（金星）が牛宿・斗宿の分野で鎮星（土星）を犯し、天津（星座名）を通過し、さらに熒惑（火星）が逆行して北河（星座名）に留まっておりますので、その方角を犯してはなりません』と。これにより天子（献帝）はついに北へ黄河を渡らず、軹関から東へ出ようとした。王立はまた宗正の劉艾に語って言った、『先ごろ太白（金星）が天関（星座名）に留まり、熒惑（火星）と交会した。金星と火星が交会するのは、易姓革命の徴候である。漢の天命（帝位）は終わった。晋・魏の分野から必ずや勃興する者が現れるであろう』と。王立はその後もたびたび帝（献帝）に言上した、『天命には去就があり、五行の徳は常に同じものが盛んではあり得ません。火徳（漢）に代わるものは土徳であり、漢を継ぐものは魏であり、よく天下を安んじることのできる者は曹姓であります。ただ曹氏に国政を委任されるほかありません』と。公（曹操）はこれを聞き、使者を遣わして王立に伝えさせた、『貴公が朝廷に忠誠を尽くしておられることは承知しているが、天道というものは深遠であるから、どうか多くを語らないでいただきたい』と」。", "persons": "張璠,献帝,王立,劉艾,曹操", "places": "曹陽,黄河,軹関", "era_year": "興平2年（195年）〜建安元年（196年）", "source_book": "漢紀", "keywords": "侍中,太史令,宗正", "raw_tagged": "{{person:張璠|張璠}}{{special:引用史料|《漢紀》}}曰：初，{{person:献帝|天子}}敗於{{place:曹陽|曹陽}}，欲浮{{place:黄河|河}}東下。{{office:侍中|侍中}}{{office:太史|太史令}}{{person:王立|王立}}曰：「自去春太白犯鎮星於牛斗，過天津，熒惑又逆行守北河，不可犯也。」由是{{person:献帝|天子}}遂不北渡{{place:黄河|河}}，將自{{place:軹関|軹關}}東出。{{person:王立|立}}又謂{{office:宗正|宗正}}{{person:劉艾|劉艾}}曰：「前太白守天關，與熒惑會；金火交會，革命之象也。漢祚終矣，晉、魏必有興者。」{{person:王立|立}}後數言於{{person:献帝|帝}}曰：「天命有去就，五行不常盛，代火者土也，承漢者魏也，能安天下者，曹姓也，唯委任曹氏而已。」{{person:曹操|公}}聞之，使人語{{person:王立|立}}曰：「知公忠於朝廷，然天道深遠，幸勿多言。」", "kakikudashi_tagged": "{{person:張璠|張璠}}の{{special:引用史料|『漢紀』}}に曰く、「初め、{{person:献帝|天子}}が{{place:曹陽|曹陽}}に敗るるや、{{place:黄河|河}}に浮かびて東下せんと欲す。{{office:侍中|侍中}}・{{office:太史|太史令}}の{{person:王立|王立}}曰く、『去春より太白が鎮星を牛・斗に犯し、天津を過ぎ、熒惑は又た逆行して北河を守れば、犯す可からざるなり』と。是に由りて{{person:献帝|天子}}は遂に北のかた{{place:黄河|河}}を渡らず、将に{{place:軹関|軹関}}より東に出でんとす。{{person:王立|立}}は又た{{office:宗正|宗正}}の{{person:劉艾|劉艾}}に謂いて曰く、『前に太白が天関を守り、熒惑と会す。金火の交会するは、革命の象なり。漢の祚は終われり、晋・魏に必ず興る者有らん』と。{{person:王立|立}}は後に数々{{person:献帝|帝}}に言いて曰く、『天命に去就有り、五行は常には盛んならず、火に代わる者は土なり、漢を承くる者は魏なり、能く天下を安んずる者は、曹姓なり、唯だ曹氏に委任せんのみ』と。{{person:曹操|公}}は之を聞き、人をして{{person:王立|立}}に語げしめて曰く、『公が朝廷に忠なるを知るも、然れども天道は深遠なれば、幸わくは多言する勿かれ』と」と。", "translation_tagged": "{{person:張璠|張璠}}の{{special:引用史料|『漢紀』}}にいう。「当初、{{person:献帝|天子}}（{{person:献帝|献帝}}）が{{place:曹陽|曹陽}}で敗れた際、{{place:黄河|黄河}}に船を浮かべて東へ下ろうとした。すると{{office:侍中|侍中}}兼{{office:太史|太史令}}の{{person:王立|王立}}が言った、『去年の春以来、太白（金星）が牛宿・斗宿の分野で鎮星（土星）を犯し、天津（星座名）を通過し、さらに熒惑（火星）が逆行して北河（星座名）に留まっておりますので、その方角を犯してはなりません』と。これにより{{person:献帝|天子}}（{{person:献帝|献帝}}）はついに北へ{{place:黄河|黄河}}を渡らず、{{place:軹関|軹関}}から東へ出ようとした。{{person:王立|王立}}はまた{{office:宗正|宗正}}の{{person:劉艾|劉艾}}に語って言った、『先ごろ太白（金星）が天関（星座名）に留まり、熒惑（火星）と交会した。金星と火星が交会するのは、易姓革命の徴候である。漢の天命（帝位）は終わった。晋・魏の分野から必ずや勃興する者が現れるであろう』と。{{person:王立|王立}}はその後もたびたび{{person:献帝|帝}}（{{person:献帝|献帝}}）に言上した、『天命には去就があり、五行の徳は常に同じものが盛んではあり得ません。火徳（漢）に代わるものは土徳であり、漢を継ぐものは魏であり、よく天下を安んじることのできる者は曹姓であります。ただ曹氏に国政を委任されるほかありません』と。{{person:曹操|公}}（{{person:曹操|曹操}}）はこれを聞き、使者を遣わして{{person:王立|王立}}に伝えさせた、『貴公が朝廷に忠誠を尽くしておられることは承知しているが、天道というものは深遠であるから、どうか多くを語らないでいただきたい』と」。"}, {"id": "v1_p32_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 32, "type": "本文", "raw_text": "天子之東也，奉自梁欲要之，不及。冬十月，公征奉，奉南奔袁術，遂攻其梁屯，拔之。於是以袁紹爲太尉，紹恥班在公下，不肯受。公乃固辭，以大將軍讓紹。天子拜公司空，行車騎將軍。是歲用棗祗、韓浩等議，始興屯田。", "kakikudashi": "天子の東するや、奉は梁より之を要せんと欲するも、及ばず。冬十月、公は奉を征し、奉は南のかた袁術に奔り、遂に其の梁の屯を攻め、之を抜く。是に於て袁紹を以て太尉と為すに、紹は班の公が下に在るを恥じ、受くるを肯んぜず。公は乃ち固辞し、大将軍を以て紹に譲る。天子は公を拝して司空、行車騎将軍と為す。是の歳、棗祗・韓浩等の議を用い、始めて屯田を興す。", "translation": "天子（献帝）が東（許都）へ遷幸した際、楊奉は梁県からこれを待ち伏せて奪い返そうとしたが、追いつけなかった。冬十月、公（曹操）は楊奉を征討し、楊奉は南の袁術のもとへ逃奔したため、そのまま楊奉の梁県の陣営を攻めてこれを陥落させた。ここにおいて朝廷は袁紹を太尉に任じたが、袁紹は席次が公（大将軍である曹操）の下になることを恥じ、受けようとしなかった。そこで公（曹操）は固辞し、大将軍の地位を袁紹に譲った。天子（献帝）は公（曹操）を司空・行車騎将軍に拝した。この年、棗祗や韓浩らの献策を採用し、初めて屯田を興した。", "persons": "献帝,楊奉,曹操,袁術,袁紹,棗祗,韓浩", "places": "梁県", "era_year": "建安元年（196年）冬10月", "source_book": "", "keywords": "太尉,大将軍,司空,車騎将軍,屯田", "raw_tagged": "{{person:献帝|天子}}之東也，{{person:楊奉|奉}}自{{place:梁県|梁}}欲要之，不及。冬十月，{{person:曹操|公}}征{{person:楊奉|奉}}，{{person:楊奉|奉}}南奔{{person:袁術|袁術}}，遂攻其{{place:梁県|梁}}屯，拔之。於是以{{person:袁紹|袁紹}}爲{{office:太尉|太尉}}，{{person:袁紹|紹}}恥班在{{person:曹操|公}}下，不肯受。{{person:曹操|公}}乃固辭，以{{office:大将軍|大將軍}}讓{{person:袁紹|紹}}。{{person:献帝|天子}}拜{{person:曹操|公}}{{office:司空|司空}}，{{office:車騎将軍|行車騎將軍}}。是歲用{{person:棗祗|棗祗}}、{{person:韓浩|韓浩}}等議，始興{{special:屯田|屯田}}。", "kakikudashi_tagged": "{{person:献帝|天子}}の東するや、{{person:楊奉|奉}}は{{place:梁県|梁}}より之を要せんと欲するも、及ばず。冬十月、{{person:曹操|公}}は{{person:楊奉|奉}}を征し、{{person:楊奉|奉}}は南のかた{{person:袁術|袁術}}に奔り、遂に其の{{place:梁県|梁}}の屯を攻め、之を抜く。是に於て{{person:袁紹|袁紹}}を以て{{office:太尉|太尉}}と為すに、{{person:袁紹|紹}}は班の{{person:曹操|公}}が下に在るを恥じ、受くるを肯んぜず。{{person:曹操|公}}は乃ち固辞し、{{office:大将軍|大将軍}}を以て{{person:袁紹|紹}}に譲る。{{person:献帝|天子}}は{{person:曹操|公}}を拝して{{office:司空|司空}}、{{office:車騎将軍|行車騎将軍}}と為す。是の歳、{{person:棗祗|棗祗}}・{{person:韓浩|韓浩}}等の議を用い、始めて{{special:屯田|屯田}}を興す。", "translation_tagged": "{{person:献帝|天子}}（{{person:献帝|献帝}}）が東（許都）へ遷幸した際、{{person:楊奉|楊奉}}は{{place:梁県|梁県}}からこれを待ち伏せて奪い返そうとしたが、追いつけなかった。冬十月、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{person:楊奉|楊奉}}を征討し、{{person:楊奉|楊奉}}は南の{{person:袁術|袁術}}のもとへ逃奔したため、そのまま{{person:楊奉|楊奉}}の{{place:梁県|梁県}}の陣営を攻めてこれを陥落させた。ここにおいて朝廷は{{person:袁紹|袁紹}}を{{office:太尉|太尉}}に任じたが、{{person:袁紹|袁紹}}は席次が{{person:曹操|公}}（{{office:大将軍|大将軍}}である{{person:曹操|曹操}}）の下になることを恥じ、受けようとしなかった。そこで{{person:曹操|公}}（{{person:曹操|曹操}}）は固辞し、{{office:大将軍|大将軍}}の地位を{{person:袁紹|袁紹}}に譲った。{{person:献帝|天子}}（{{person:献帝|献帝}}）は{{person:曹操|公}}（{{person:曹操|曹操}}）を{{office:司空|司空}}・{{office:車騎将軍|行車騎将軍}}に拝した。この年、{{person:棗祗|棗祗}}や{{person:韓浩|韓浩}}らの献策を採用し、初めて{{special:屯田|屯田}}を興した。"}, {"id": "v1_p32_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 32, "type": "裴注", "raw_text": "《魏書》曰：自遭荒亂，率乏糧穀。諸軍並起，無終歲之計，饑則寇略，飽則棄餘，瓦解流離，無敵自破者不可勝數。袁紹之在河北，軍人仰食桑椹。袁術在江、淮，取給蒲蠃。民人相食，州里蕭條。公曰：「夫定國之術，在於彊兵足食，秦人以急農兼天下，孝武以屯田定西域，此先代之良式也。」是歲乃募民屯田許下，得穀百萬斛。於是州郡例置田官，所在積穀。征伐四方，無運糧之勞，遂兼滅羣賊，克平天下。", "kakikudashi": "『魏書』に曰く、「荒乱に遭いてより、率ね糧穀に乏し。諸軍並び起こるも、終歳の計無く、飢うれば則ち寇略し、飽けば則ち余りを棄て、瓦解流離し、敵無くして自ら破るる者は勝げて数う可からず。袁紹の河北に在るや、軍人は桑椹を仰ぎ食らう。袁術の江・淮に在るや、蒲蠃を取りて給す。民人は相食み、州里は蕭条たり。公曰く、『夫れ国を定むるの術は、強兵足食に在り、秦人は急農を以て天下を兼ね、孝武は屯田を以て西域を定む、此れ先代の良式なり』と。是の歳、乃ち民を募りて許下に屯田せしめ、穀百万斛を得たり。是に於て州郡に例して田官を置き、在る所に穀を積む。四方を征伐するに、運糧の労無く、遂に群賊を兼滅し、克く天下を平らぐ」と。", "translation": "『魏書』にいう。「戦乱と飢饉に見舞われて以来、どこもみな兵糧の穀物が欠乏していた。各地の軍勢が並び立ったものの、一年を見通した蓄えの計画すらなく、飢えれば略奪に走り、腹が満たされれば余った食糧を打ち捨て、瓦解・流散して、敵と戦わずして自滅した者は数え切れないほどであった。袁紹が河北にいたとき、兵士たちは桑の実（桑椹）を仰ぎ見て食べて飢えをしのいだ。袁術が長江と淮水の間にいたときも、蒲（がま）や巻貝・タニシ（蠃）を採って食糧に充てた。民衆は互いに人肉を食い合い、村里は荒れ果てて人影も絶えた。公（曹操）は言った、『そもそも国を平定する要諦は、強兵と十分な食糧（足食）にある。秦の人々は農業を最優先（急農）とすることで天下を併合し、前漢の孝武皇帝（武帝）は屯田によって西域を平定した。これこそ先代の優れた手本である』と。こうしてこの年、民を募って許都の周辺（許下）で屯田を行わせ、百万斛もの穀物を収穫した。そこで各州郡に一律に田官（典農中郎将・典農校尉・典農都尉）を設置し、各地に穀物を蓄えさせた。四方を征伐するにあたっても兵糧輸送の労苦がなくなり、ついに群雄・諸賊をことごとく平らげ、天下を平定することができたのである」。", "persons": "袁紹,袁術,曹操,漢武帝", "places": "河北,長江,淮水,西域,許", "era_year": "建安元年（196年）", "source_book": "魏書", "keywords": "屯田,田官", "raw_tagged": "{{special:引用史料|《魏書》}}曰：自遭荒亂，率乏糧穀。諸軍並起，無終歲之計，饑則寇略，飽則棄餘，瓦解流離，無敵自破者不可勝數。{{person:袁紹|袁紹}}之在{{place:河北|河北}}，軍人仰食桑椹。{{person:袁術|袁術}}在{{place:長江|江}}、{{place:淮水|淮}}，取給蒲蠃。民人相食，州里蕭條。{{person:曹操|公}}曰：「夫定國之術，在於彊兵足食，秦人以急農兼天下，{{person:漢武帝|孝武}}以{{special:屯田|屯田}}定{{place:西域|西域}}，此先代之良式也。」是歲乃募民{{special:屯田|屯田}}{{place:許|許下}}，得穀百萬斛。於是州郡例置{{office:田官|田官}}，所在積穀。征伐四方，無運糧之勞，遂兼滅羣賊，克平天下。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「荒乱に遭いてより、率ね糧穀に乏し。諸軍並び起こるも、終歳の計無く、飢うれば則ち寇略し、飽けば則ち余りを棄て、瓦解流離し、敵無くして自ら破るる者は勝げて数う可からず。{{person:袁紹|袁紹}}の{{place:河北|河北}}に在るや、軍人は桑椹を仰ぎ食らう。{{person:袁術|袁術}}の{{place:長江|江}}・{{place:淮水|淮}}に在るや、蒲蠃を取りて給す。民人は相食み、州里は蕭条たり。{{person:曹操|公}}曰く、『夫れ国を定むるの術は、強兵足食に在り、秦人は急農を以て天下を兼ね、{{person:漢武帝|孝武}}は{{special:屯田|屯田}}を以て{{place:西域|西域}}を定む、此れ先代の良式なり』と。是の歳、乃ち民を募りて{{place:許|許下}}に{{special:屯田|屯田}}せしめ、穀百万斛を得たり。是に於て州郡に例して{{office:田官|田官}}を置き、在る所に穀を積む。四方を征伐するに、運糧の労無く、遂に群賊を兼滅し、克く天下を平らぐ」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう。「戦乱と飢饉に見舞われて以来、どこもみな兵糧の穀物が欠乏していた。各地の軍勢が並び立ったものの、一年を見通した蓄えの計画すらなく、飢えれば略奪に走り、腹が満たされれば余った食糧を打ち捨て、瓦解・流散して、敵と戦わずして自滅した者は数え切れないほどであった。{{person:袁紹|袁紹}}が{{place:河北|河北}}にいたとき、兵士たちは桑の実（桑椹）を仰ぎ見て食べて飢えをしのいだ。{{person:袁術|袁術}}が{{place:長江|長江}}と{{place:淮水|淮水}}の間にいたときも、蒲（がま）や巻貝・タニシ（蠃）を採って食糧に充てた。民衆は互いに人肉を食い合い、村里は荒れ果てて人影も絶えた。{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、『そもそも国を平定する要諦は、強兵と十分な食糧（足食）にある。秦の人々は農業を最優先（急農）とすることで天下を併合し、前漢の{{person:漢武帝|孝武皇帝}}（武帝）は{{special:屯田|屯田}}によって{{place:西域|西域}}を平定した。これこそ先代の優れた手本である』と。こうしてこの年、民を募って{{place:許|許都}}の周辺（{{place:許|許下}}）で{{special:屯田|屯田}}を行わせ、百万斛もの穀物を収穫した。そこで各州郡に一律に{{office:田官|田官}}（{{office:田官|典農中郎将}}・{{office:田官|典農校尉}}・{{office:田官|典農都尉}}）を設置し、各地に穀物を蓄えさせた。四方を征伐するにあたっても兵糧輸送の労苦がなくなり、ついに群雄・諸賊をことごとく平らげ、天下を平定することができたのである」。"}, {"id": "v1_p33_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 33, "type": "本文", "raw_text": "呂布襲劉備，取下邳。備來奔。程昱說公曰：「觀劉備有雄才而甚得衆心，終不爲人下，不如早圖之。」公曰：「方今收英雄時也，殺一人而失天下之心，不可。」", "kakikudashi": "呂布が劉備を襲い、下邳を取る。備は来奔す。程昱が公に説きて曰く、『劉備を観るに雄才有りて甚だ衆心を得たり、終に人の下と為らじ、早く之を図るに如かず』と。公曰く、『方今、英雄を収むるの時なり、一人を殺して天下の心を失うは、不可なり』と。", "translation": "呂布が劉備を奇襲し、下邳を奪い取った。劉備は公（曹操）のもとへ逃れて身を寄せた。程昱が公（曹操）に説いて言った、『劉備を観ますに、英雄の才を備えており、しかも大いに人望を得ております。決していつまでも人の下に甘んじる男ではありませんから、今のうちに始末してしまうに越したことはありません』と。公（曹操）は言った、『今はまさに天下の英雄を傘下に収めるべき時である。一人を殺して天下の人心を失うようなことは、してはならぬ』と。", "persons": "呂布,劉備,程昱,曹操", "places": "下邳", "era_year": "建安元年（196年）", "source_book": "", "keywords": "", "raw_tagged": "{{person:呂布|呂布}}襲{{person:劉備|劉備}}，取{{place:下邳|下邳}}。{{person:劉備|備}}來奔。{{person:程昱|程昱}}說{{person:曹操|公}}曰：「觀{{person:劉備|劉備}}有雄才而甚得衆心，終不爲人下，不如早圖之。」{{person:曹操|公}}曰：「方今收英雄時也，殺一人而失天下之心，不可。」", "kakikudashi_tagged": "{{person:呂布|呂布}}が{{person:劉備|劉備}}を襲い、{{place:下邳|下邳}}を取る。{{person:劉備|備}}は来奔す。{{person:程昱|程昱}}が{{person:曹操|公}}に説きて曰く、『{{person:劉備|劉備}}を観るに雄才有りて甚だ衆心を得たり、終に人の下と為らじ、早く之を図るに如かず』と。{{person:曹操|公}}曰く、『方今、英雄を収むるの時なり、一人を殺して天下の心を失うは、不可なり』と。", "translation_tagged": "{{person:呂布|呂布}}が{{person:劉備|劉備}}を奇襲し、{{place:下邳|下邳}}を奪い取った。{{person:劉備|劉備}}は{{person:曹操|公}}（{{person:曹操|曹操}}）のもとへ逃れて身を寄せた。{{person:程昱|程昱}}が{{person:曹操|公}}（{{person:曹操|曹操}}）に説いて言った、『{{person:劉備|劉備}}を観ますに、英雄の才を備えており、しかも大いに人望を得ております。決していつまでも人の下に甘んじる男ではありませんから、今のうちに始末してしまうに越したことはありません』と。{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、『今はまさに天下の英雄を傘下に収めるべき時である。一人を殺して天下の人心を失うようなことは、してはならぬ』と。"}, {"id": "v1_p34_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 34, "type": "本文", "raw_text": "張濟自關中走南陽。濟死，從子繡領其衆。", "kakikudashi": "張済が関中より南陽に走る。済死し、従子の繡が其の衆を領す。", "translation": "張済が関中から南陽へ逃れてきた。張済が戦死すると、甥（従子）の張繡がその軍勢を引き継いだ。", "persons": "張済,張繡", "places": "関中,南陽", "era_year": "建安元年（196年）", "source_book": "", "keywords": "", "raw_tagged": "{{person:張済|張濟}}自{{place:関中|關中}}走{{place:南陽|南陽}}。{{person:張済|濟}}死，從子{{person:張繡|繡}}領其衆。", "kakikudashi_tagged": "{{person:張済|張済}}が{{place:関中|関中}}より{{place:南陽|南陽}}に走る。{{person:張済|済}}死し、従子の{{person:張繡|繡}}が其の衆を領す。", "translation_tagged": "{{person:張済|張済}}が{{place:関中|関中}}から{{place:南陽|南陽}}へ逃れてきた。{{person:張済|張済}}が戦死すると、甥（従子）の{{person:張繡|張繡}}がその軍勢を引き継いだ。"}, {"id": "v1_p35_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 35, "type": "本文", "raw_text": "二年春正月，公到宛。張繡降，旣而悔之，復反。公與戰，軍敗，爲流矢所中，長子昂、弟子安民遇害。", "kakikudashi": "二年春正月、公は宛に到る。張繡は降るも、既にして之を悔い、復た反く。公は与に戦い、軍敗れ、流矢の中つる所と為り、長子の昂・弟の子の安民は害に遇う。", "translation": "二年春正月、公（曹操）は宛に到着した。張繡は降伏したが、まもなくこれを悔い、再び背いた。公（曹操）はこれと戦って軍が敗れ、流れ矢に当たり、長男の曹昂と甥（弟の子）の曹安民が殺害された。", "persons": "曹操,張繡,曹昂,曹安民", "places": "宛", "era_year": "建安2年（197年）正月", "source_book": "", "keywords": "", "raw_tagged": "二年春正月，{{person:曹操|公}}到{{place:宛|宛}}。{{person:張繡|張繡}}降，旣而悔之，復反。{{person:曹操|公}}與戰，軍敗，爲流矢所中，長子{{person:曹昂|昂}}、弟子{{person:曹安民|安民}}遇害。", "kakikudashi_tagged": "二年春正月、{{person:曹操|公}}は{{place:宛|宛}}に到る。{{person:張繡|張繡}}は降るも、既にして之を悔い、復た反く。{{person:曹操|公}}は与に戦い、軍敗れ、流矢の中つる所と為り、長子の{{person:曹昂|昂}}・弟の子の{{person:曹安民|安民}}は害に遇う。", "translation_tagged": "二年春正月、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{place:宛|宛}}に到着した。{{person:張繡|張繡}}は降伏したが、まもなくこれを悔い、再び背いた。{{person:曹操|公}}（{{person:曹操|曹操}}）はこれと戦って軍が敗れ、流れ矢に当たり、長男の{{person:曹昂|曹昂}}と甥（弟の子）の{{person:曹安民|曹安民}}が殺害された。"}, {"id": "v1_p35_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 35, "type": "裴注", "raw_text": "《魏書》曰：公所乘馬名絕影，爲流矢所中，傷頰及足，并中公右臂。《世語》曰：昂不能騎，進馬於公，公故免，而昂遇害。", "kakikudashi": "『魏書』に曰く、「公の乗る所の馬は名を絶影といい、流矢の中つる所と為りて、頬及び足を傷つけ、并せて公の右臂に中たる」と。『世語』に曰く、「昂は騎する能わず、馬を公に進め、公は故に免るるも、昂は害に遇う」と。", "translation": "『魏書』にいう、「公（曹操）が乗っていた馬は名を絶影といい、流れ矢に当たって頬と足を負傷し、あわせて公（曹操）の右腕にも矢が当たった」と。『世語』にいう、「曹昂は騎乗することができず、馬を公（曹操）に差し出したため、公（曹操）はそのおかげで難を逃れたが、曹昂は殺害された」と。", "persons": "曹操,曹昂", "places": "", "era_year": "建安2年（197年）正月", "source_book": "魏書,世語", "keywords": "絶影", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:曹操|公}}所乘馬名{{special:絶影|絕影}}，爲流矢所中，傷頰及足，并中{{person:曹操|公}}右臂。{{special:引用史料|《世語》}}曰：{{person:曹昂|昂}}不能騎，進馬於{{person:曹操|公}}，{{person:曹操|公}}故免，而{{person:曹昂|昂}}遇害。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{person:曹操|公}}の乗る所の馬は名を{{special:絶影|絶影}}といい、流矢の中つる所と為りて、頬及び足を傷つけ、并せて{{person:曹操|公}}の右臂に中たる」と。{{special:引用史料|『世語』}}に曰く、「{{person:曹昂|昂}}は騎する能わず、馬を{{person:曹操|公}}に進め、{{person:曹操|公}}は故に免るるも、{{person:曹昂|昂}}は害に遇う」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう、「{{person:曹操|公}}（{{person:曹操|曹操}}）が乗っていた馬は名を{{special:絶影|絶影}}といい、流れ矢に当たって頬と足を負傷し、あわせて{{person:曹操|公}}（{{person:曹操|曹操}}）の右腕にも矢が当たった」と。{{special:引用史料|『世語』}}にいう、「{{person:曹昂|曹昂}}は騎乗することができず、馬を{{person:曹操|公}}（{{person:曹操|曹操}}）に差し出したため、{{person:曹操|公}}（{{person:曹操|曹操}}）はそのおかげで難を逃れたが、{{person:曹昂|曹昂}}は殺害された」と。"}, {"id": "v1_p35_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 35, "type": "本文", "raw_text": "公乃引兵還舞陰，繡將騎來鈔，公擊破之。繡奔穰，與劉表合。公謂諸將曰：「吾降張繡等，失不便取其質，以至于此。吾知所以敗。諸卿觀之，自今已後不復敗矣。」遂還許。", "kakikudashi": "公は乃ち兵を引きて舞陰に還るに、繡は騎を将いて来たり鈔するも、公は撃ちて之を破る。繡は穣に奔り、劉表と合す。公は諸将に謂いて曰く、「吾が張繡等を降すに、便ち其の質を取らざりしを失し、以て此に至れり。吾は敗るる所以を知れり。諸卿よ之を観よ、今より已後、復たは敗れじ」と。遂に許に還る。", "translation": "公（曹操）はそこで兵を引き揚げて舞陰へ戻ったところ、張繡が騎兵を率いて襲撃してきたが、公（曹操）は迎え撃ってこれを打ち破った。張繡は穣へ奔り、劉表と合流した。公（曹操）は諸将に語って言った、「私が張繡らを降伏させた際、すぐにその人質を取らなかったのが手落ちであり、そのためにこのような事態を招いた。私は敗れた原因が分かった。諸君、よく見ておくがよい、今より後は二度と敗れはしないぞ」と。かくて許都へ帰還した。", "persons": "曹操,張繡,劉表", "places": "舞陰,穣,許", "era_year": "建安2年（197年）正月", "source_book": "", "keywords": "", "raw_tagged": "{{person:曹操|公}}乃引兵還{{place:舞陰|舞陰}}，{{person:張繡|繡}}將騎來鈔，{{person:曹操|公}}擊破之。{{person:張繡|繡}}奔{{place:穣|穰}}，與{{person:劉表|劉表}}合。{{person:曹操|公}}謂諸將曰：「吾降{{person:張繡|張繡}}等，失不便取其質，以至于此。吾知所以敗。諸卿觀之，自今已後不復敗矣。」遂還{{place:許|許}}。", "kakikudashi_tagged": "{{person:曹操|公}}は乃ち兵を引きて{{place:舞陰|舞陰}}に還るに、{{person:張繡|繡}}は騎を将いて来たり鈔するも、{{person:曹操|公}}は撃ちて之を破る。{{person:張繡|繡}}は{{place:穣|穣}}に奔り、{{person:劉表|劉表}}と合す。{{person:曹操|公}}は諸将に謂いて曰く、「吾が{{person:張繡|張繡}}等を降すに、便ち其の質を取らざりしを失し、以て此に至れり。吾は敗るる所以を知れり。諸卿よ之を観よ、今より已後、復たは敗れじ」と。遂に{{place:許|許}}に還る。", "translation_tagged": "{{person:曹操|公}}（{{person:曹操|曹操}}）はそこで兵を引き揚げて{{place:舞陰|舞陰}}へ戻ったところ、{{person:張繡|張繡}}が騎兵を率いて襲撃してきたが、{{person:曹操|公}}（{{person:曹操|曹操}}）は迎え撃ってこれを打ち破った。{{person:張繡|張繡}}は{{place:穣|穣}}へ奔り、{{person:劉表|劉表}}と合流した。{{person:曹操|公}}（{{person:曹操|曹操}}）は諸将に語って言った、「私が{{person:張繡|張繡}}らを降伏させた際、すぐにその人質を取らなかったのが手落ちであり、そのためにこのような事態を招いた。私は敗れた原因が分かった。諸君、よく見ておくがよい、今より後は二度と敗れはしないぞ」と。かくて{{place:許|許都}}へ帰還した。"}, {"id": "v1_p35_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 35, "type": "裴注", "raw_text": "《世語》曰：舊制，三公領兵入見，皆交戟叉頸而前。初，公將討張繡，入覲天子，時始復此制。公自此不復朝見。", "kakikudashi": "『世語』に曰く、「旧制に、三公が兵を領して入見するや、皆な戟を交えて頸を叉して前む。初め、公が将に張繡を討たんとして、入りて天子に覲するに、時に始めて此の制を復す。公は此より復たは朝見せず」と。", "translation": "『世語』にいう、「旧来の制度では、三公が兵を率いて参内・拝謁する際には、みな衛士が戟を交差させてその首筋を挟み押さえながら進み出た。初め、公（曹操）が張繡を討伐しようとして参内し天子（献帝）に拝謁した際、この時になって初めてこの旧制が復活させられた。公（曹操）はこれ以来、二度と朝見しなくなった」と。", "persons": "曹操,張繡,献帝", "places": "", "era_year": "建安2年（197年）正月", "source_book": "世語", "keywords": "三公,交戟叉頸", "raw_tagged": "{{special:引用史料|《世語》}}曰：舊制，{{office:三公|三公}}領兵入見，皆{{special:交戟叉頸|交戟叉頸}}而前。初，{{person:曹操|公}}將討{{person:張繡|張繡}}，入覲{{person:献帝|天子}}，時始復此制。{{person:曹操|公}}自此不復朝見。", "kakikudashi_tagged": "{{special:引用史料|『世語』}}に曰く、「旧制に、{{office:三公|三公}}が兵を領して入見するや、皆な{{special:交戟叉頸|戟を交えて頸を叉し}}て前む。初め、{{person:曹操|公}}が将に{{person:張繡|張繡}}を討たんとして、入りて{{person:献帝|天子}}に覲するに、時に始めて此の制を復す。{{person:曹操|公}}は此より復たは朝見せず」と。", "translation_tagged": "{{special:引用史料|『世語』}}にいう、「旧来の制度では、{{office:三公|三公}}が兵を率いて参内・拝謁する際には、みな衛士が{{special:交戟叉頸|戟を交差させてその首筋を挟み}}押さえながら進み出た。初め、{{person:曹操|公}}（{{person:曹操|曹操}}）が{{person:張繡|張繡}}を討伐しようとして参内し{{person:献帝|天子}}（{{person:献帝|献帝}}）に拝謁した際、この時になって初めてこの旧制が復活させられた。{{person:曹操|公}}（{{person:曹操|曹操}}）はこれ以来、二度と朝見しなくなった」と。"}, {"id": "v1_p36_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 36, "type": "本文", "raw_text": "袁術欲稱帝於淮南，使人告呂布。布收其使，上其書。術怒，攻布，爲布所破。秋九月，術侵陳，公東征之。術聞公自來，棄軍走，留其將橋蕤、李豐、梁綱、樂就；公到，擊破蕤等，皆斬之。術走渡淮。公還許。", "kakikudashi": "袁術が帝を淮南に称せんと欲し、人をして呂布に告げしむ。布は其の使を収め、其の書を上る。術は怒り、布を攻むるも、布の破る所と為る。秋九月、術が陳を侵し、公は之を東征す。術は公が自ら来たると聞き、軍を棄てて走り、其の将の橋蕤・李豊・梁綱・楽就を留む。公は到りて、蕤等を撃破し、皆な之を斬る。術は走りて淮を渡る。公は許に還る。", "translation": "袁術は淮南で皇帝を称しようと望み、使者を遣わして呂布に告げさせた。呂布はその使者を捕らえ、その書状を朝廷に奉呈した。袁術は怒って呂布を攻めたが、呂布に打ち破られた。秋九月、袁術が陳国に侵攻したため、公（曹操）は東征してこれを討った。袁術は公（曹操）が親征して来ると聞くや、軍を棄てて逃走し、配下の部将である橋蕤・李豊・梁綱・楽就を残し留めた。公（曹操）は到着すると、橋蕤らを撃破し、全員を斬った。袁術は逃走して淮水を渡った。公（曹操）は許都へ帰還した。", "persons": "袁術,呂布,曹操,橋蕤,李豊,梁綱,楽就", "places": "九江,陳国,淮水,許", "era_year": "建安2年（197年）9月", "source_book": "", "keywords": "", "raw_tagged": "{{person:袁術|袁術}}欲稱帝於{{place:九江|淮南}}，使人告{{person:呂布|呂布}}。{{person:呂布|布}}收其使，上其書。{{person:袁術|術}}怒，攻{{person:呂布|布}}，爲{{person:呂布|布}}所破。秋九月，{{person:袁術|術}}侵{{place:陳国|陳}}，{{person:曹操|公}}東征之。{{person:袁術|術}}聞{{person:曹操|公}}自來，棄軍走，留其將{{person:橋蕤|橋蕤}}、{{person:李豊|李豐}}、{{person:梁綱|梁綱}}、{{person:楽就|樂就}}；{{person:曹操|公}}到，擊破{{person:橋蕤|蕤}}等，皆斬之。{{person:袁術|術}}走渡{{place:淮水|淮}}。{{person:曹操|公}}還{{place:許|許}}。", "kakikudashi_tagged": "{{person:袁術|袁術}}が帝を{{place:九江|淮南}}に称せんと欲し、人をして{{person:呂布|呂布}}に告げしむ。{{person:呂布|布}}は其の使を収め、其の書を上る。{{person:袁術|術}}は怒り、{{person:呂布|布}}を攻むるも、{{person:呂布|布}}の破る所と為る。秋九月、{{person:袁術|術}}が{{place:陳国|陳}}を侵し、{{person:曹操|公}}は之を東征す。{{person:袁術|術}}は{{person:曹操|公}}が自ら来たると聞き、軍を棄てて走り、其の将の{{person:橋蕤|橋蕤}}・{{person:李豊|李豊}}・{{person:梁綱|梁綱}}・{{person:楽就|楽就}}を留む。{{person:曹操|公}}は到りて、{{person:橋蕤|蕤}}等を撃破し、皆な之を斬る。{{person:袁術|術}}は走りて{{place:淮水|淮}}を渡る。{{person:曹操|公}}は{{place:許|許}}に還る。", "translation_tagged": "{{person:袁術|袁術}}は{{place:九江|淮南}}で皇帝を称しようと望み、使者を遣わして{{person:呂布|呂布}}に告げさせた。{{person:呂布|呂布}}はその使者を捕らえ、その書状を朝廷に奉呈した。{{person:袁術|袁術}}は怒って{{person:呂布|呂布}}を攻めたが、{{person:呂布|呂布}}に打ち破られた。秋九月、{{person:袁術|袁術}}が{{place:陳国|陳国}}に侵攻したため、{{person:曹操|公}}（{{person:曹操|曹操}}）は東征してこれを討った。{{person:袁術|袁術}}は{{person:曹操|公}}（{{person:曹操|曹操}}）が親征して来ると聞くや、軍を棄てて逃走し、配下の部将である{{person:橋蕤|橋蕤}}・{{person:李豊|李豊}}・{{person:梁綱|梁綱}}・{{person:楽就|楽就}}を残し留めた。{{person:曹操|公}}（{{person:曹操|曹操}}）は到着すると、{{person:橋蕤|橋蕤}}らを撃破し、全員を斬った。{{person:袁術|袁術}}は逃走して{{place:淮水|淮水}}を渡った。{{person:曹操|公}}（{{person:曹操|曹操}}）は{{place:許|許都}}へ帰還した。"}, {"id": "v1_p37_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 37, "type": "本文", "raw_text": "公之自舞陰還也，南陽、章陵諸縣復叛爲繡，公遣曹洪擊之，不利，還屯葉，數爲繡、表所侵。冬十一月，公自南征，至宛。", "kakikudashi": "公の舞陰より還るや、南陽・章陵の諸県は復た叛きて繡の為にし、公は曹洪を遣わして之を撃たしむるも、利あらず、還りて葉に屯し、数々繡・表の侵す所と為る。冬十一月、公は自ら南征し、宛に至る。", "translation": "公（曹操）が舞陰から帰還した際、南陽・章陵の諸県が再び背いて張繡に味方したため、公（曹操）は曹洪を派遣してこれを討たせたが、戦況は不利となり、退いて葉に駐屯し、たびたび張繡・劉表から侵攻を受けた。冬十一月、公（曹操）は自ら南征し、宛に到着した。", "persons": "曹操,張繡,曹洪,劉表", "places": "舞陰,南陽,章陵,葉,宛", "era_year": "建安2年（197年）11月", "source_book": "", "keywords": "", "raw_tagged": "{{person:曹操|公}}之自{{place:舞陰|舞陰}}還也，{{place:南陽|南陽}}、{{place:章陵|章陵}}諸縣復叛爲{{person:張繡|繡}}，{{person:曹操|公}}遣{{person:曹洪|曹洪}}擊之，不利，還屯{{place:葉|葉}}，數爲{{person:張繡|繡}}、{{person:劉表|表}}所侵。冬十一月，{{person:曹操|公}}自南征，至{{place:宛|宛}}。", "kakikudashi_tagged": "{{person:曹操|公}}の{{place:舞陰|舞陰}}より還るや、{{place:南陽|南陽}}・{{place:章陵|章陵}}の諸県は復た叛きて{{person:張繡|繡}}の為にし、{{person:曹操|公}}は{{person:曹洪|曹洪}}を遣わして之を撃たしむるも、利あらず、還りて{{place:葉|葉}}に屯し、数々{{person:張繡|繡}}・{{person:劉表|表}}の侵す所と為る。冬十一月、{{person:曹操|公}}は自ら南征し、{{place:宛|宛}}に至る。", "translation_tagged": "{{person:曹操|公}}（{{person:曹操|曹操}}）が{{place:舞陰|舞陰}}から帰還した際、{{place:南陽|南陽}}・{{place:章陵|章陵}}の諸県が再び背いて{{person:張繡|張繡}}に味方したため、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{person:曹洪|曹洪}}を派遣してこれを討たせたが、戦況は不利となり、退いて{{place:葉|葉}}に駐屯し、たびたび{{person:張繡|張繡}}・{{person:劉表|劉表}}から侵攻を受けた。冬十一月、{{person:曹操|公}}（{{person:曹操|曹操}}）は自ら南征し、{{place:宛|宛}}に到着した。"}, {"id": "v1_p37_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 37, "type": "裴注", "raw_text": "《魏書》曰：臨淯水，祠亡將士，歔欷流涕，衆皆感慟。", "kakikudashi": "『魏書』に曰く、「淯水に臨み、亡将士を祠り、歔欷流涕するに、衆は皆な感慟す」と。", "translation": "『魏書』にいう、「淯水のほとりに臨んで戦没した将士を祀り、むせび泣いて涙を流すと、将兵はみな深く感動して慟哭した」と。", "persons": "曹操", "places": "淯水", "era_year": "建安2年（197年）11月", "source_book": "魏書", "keywords": "", "raw_tagged": "{{special:引用史料|《魏書》}}曰：臨{{place:淯水|淯水}}，祠亡將士，歔欷流涕，衆皆感慟。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{place:淯水|淯水}}に臨み、亡将士を祠り、歔欷流涕するに、衆は皆な感慟す」と。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう、「{{place:淯水|淯水}}のほとりに臨んで戦没した将士を祀り、むせび泣いて涙を流すと、将兵はみな深く感動して慟哭した」と。"}, {"id": "v1_p37_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 37, "type": "本文", "raw_text": "表將鄧濟據湖陽。攻拔之，生禽濟，湖陽降。攻舞陰，下之。", "kakikudashi": "表の将の鄧済が湖陽に拠る。攻めて之を抜き、済を生け捕りにし、湖陽は降る。舞陰を攻め、之を下す。", "translation": "劉表の部将の鄧済が湖陽に立てこもっていた。これを攻め落として鄧済を生け捕りにすると、湖陽は降伏した。ついで舞陰を攻め、これを陥落させた。", "persons": "劉表,鄧済,曹操", "places": "湖陽,舞陰", "era_year": "建安2年（197年）11月", "source_book": "", "keywords": "", "raw_tagged": "{{person:劉表|表}}將{{person:鄧済|鄧濟}}據{{place:湖陽|湖陽}}。攻拔之，生禽{{person:鄧済|濟}}，{{place:湖陽|湖陽}}降。攻{{place:舞陰|舞陰}}，下之。", "kakikudashi_tagged": "{{person:劉表|表}}の将の{{person:鄧済|鄧済}}が{{place:湖陽|湖陽}}に拠る。攻めて之を抜き、{{person:鄧済|済}}を生け捕りにし、{{place:湖陽|湖陽}}は降る。{{place:舞陰|舞陰}}を攻め、之を下す。", "translation_tagged": "{{person:劉表|劉表}}の部将の{{person:鄧済|鄧済}}が{{place:湖陽|湖陽}}に立てこもっていた。これを攻め落として{{person:鄧済|鄧済}}を生け捕りにすると、{{place:湖陽|湖陽}}は降伏した。ついで{{place:舞陰|舞陰}}を攻め、これを陥落させた。"}, {"id": "v1_p38_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 38, "type": "本文", "raw_text": "三年春正月，公還許，初置軍師祭酒。三月，公圍張繡於穰。夏五月，劉表遣兵救繡，以絕軍後。", "kakikudashi": "三年春正月、公は許に還り、初めて軍師祭酒を置く。三月、公は張繡を穣に囲む。夏五月、劉表が兵を遣わして繡を救わしめ、以て軍の後を絶つ。", "translation": "三年春正月、公（曹操）は許都へ帰還し、初めて軍師祭酒を設置した。三月、公（曹操）は張繡を穣に包囲した。夏五月、劉表が援軍を派遣して張繡を救わせ、公（曹操）の軍の背後を遮断した。", "persons": "曹操,張繡,劉表", "places": "許,穣", "era_year": "建安3年（198年）正月〜5月", "source_book": "", "keywords": "軍師祭酒", "raw_tagged": "三年春正月，{{person:曹操|公}}還{{place:許|許}}，初置{{office:軍師祭酒|軍師祭酒}}。三月，{{person:曹操|公}}圍{{person:張繡|張繡}}於{{place:穣|穰}}。夏五月，{{person:劉表|劉表}}遣兵救{{person:張繡|繡}}，以絕軍後。", "kakikudashi_tagged": "三年春正月、{{person:曹操|公}}は{{place:許|許}}に還り、初めて{{office:軍師祭酒|軍師祭酒}}を置く。三月、{{person:曹操|公}}は{{person:張繡|張繡}}を{{place:穣|穣}}に囲む。夏五月、{{person:劉表|劉表}}が兵を遣わして{{person:張繡|繡}}を救わしめ、以て軍の後を絶つ。", "translation_tagged": "三年春正月、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{place:許|許都}}へ帰還し、初めて{{office:軍師祭酒|軍師祭酒}}を設置した。三月、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{person:張繡|張繡}}を{{place:穣|穣}}に包囲した。夏五月、{{person:劉表|劉表}}が援軍を派遣して{{person:張繡|張繡}}を救わせ、公（{{person:曹操|曹操}}）の軍の背後を遮断した。"}, {"id": "v1_p38_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 38, "type": "裴注", "raw_text": "《獻帝春秋》曰：袁紹叛卒詣公云：「田豐使紹早襲許，若挾天子以令諸侯，四海可指麾而定。」公乃解繡圍。", "kakikudashi": "『献帝春秋』に曰く、「袁紹の叛卒が公に詣りて云う、『田豊が紹をして早く許を襲わしめんとす、若し天子を挟みて以て諸侯に令せば、四海は指麾して定む可しと』と。公は乃ち繡の囲みを解く」と。", "translation": "『献帝春秋』にいう、「袁紹軍からの脱走兵が公（曹操）のもとへ来て語った、『田豊が袁紹に、今のうちに許都を奇襲するよう進言し、もし天子を挟んで諸侯に号令すれば、四海は采配一つで平定できると説いております』と。公（曹操）はそこで張繡の包囲を解いた」と。", "persons": "袁紹,曹操,田豊,張繡", "places": "許", "era_year": "建安3年（198年）5月", "source_book": "献帝春秋", "keywords": "挟天子以令諸侯", "raw_tagged": "{{special:引用史料|《獻帝春秋》}}曰：{{person:袁紹|袁紹}}叛卒詣{{person:曹操|公}}云：「{{person:田豊|田豐}}使{{person:袁紹|紹}}早襲{{place:許|許}}，若{{special:挟天子以令諸侯|挾天子以令諸侯}}，四海可指麾而定。」{{person:曹操|公}}乃解{{person:張繡|繡}}圍。", "kakikudashi_tagged": "{{special:引用史料|『献帝春秋』}}に曰く、「{{person:袁紹|袁紹}}の叛卒が{{person:曹操|公}}に詣りて云う、『{{person:田豊|田豊}}が{{person:袁紹|紹}}をして早く{{place:許|許}}を襲わしめんとす、若し{{special:挟天子以令諸侯|天子を挟みて以て諸侯に令せば}}、四海は指麾して定む可しと』と。{{person:曹操|公}}は乃ち{{person:張繡|繡}}の囲みを解く」と。", "translation_tagged": "{{special:引用史料|『献帝春秋』}}にいう、「{{person:袁紹|袁紹}}軍からの脱走兵が{{person:曹操|公}}（{{person:曹操|曹操}}）のもとへ来て語った、『{{person:田豊|田豊}}が{{person:袁紹|袁紹}}に、今のうちに{{place:許|許都}}を奇襲するよう進言し、もし{{special:挟天子以令諸侯|天子を挟んで諸侯に号令すれば}}、四海は采配一つで平定できると説いております』と。{{person:曹操|公}}（{{person:曹操|曹操}}）はそこで{{person:張繡|張繡}}の包囲を解いた」と。"}, {"id": "v1_p38_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 38, "type": "本文", "raw_text": "公將引還，繡兵來，公軍不得進，連營稍前。公與荀彧書曰：「賊來追吾，雖日行數里，吾策之，到安衆，破繡必矣。」到安衆，繡與表兵合守險，公軍前後受敵。公乃夜鑿險爲地道，悉過輜重，設奇兵。會明，賊謂公爲遁也，悉軍來追。乃縱奇兵步騎夾攻，大破之。秋七月，公還許。荀彧問公：「前以策賊必破，何也？」公曰：「虜遏吾歸師，而與吾死地戰，吾是以知勝矣。」", "kakikudashi": "公は将に引き還さんとするに、繡の兵が来たり、公の軍は進むを得ず、営を連ねて稍く前む。公は荀彧に書を与えて曰く、「賊は来たりて吾を追うも、日に行くこと数里と雖も、吾が之を策るに、安衆に到らば、繡を破ること必せり」と。安衆に到るや、繡は表の兵と合して険を守り、公の軍は前後に敵を受く。公は乃ち夜に険を鑿ちて地道と為し、悉く輜重を過し、奇兵を設く。明くるに会い、賊は公を遁げたりと謂い、軍を悉くして来たり追う。乃ち奇兵を縦ちて歩騎もて夾攻し、大いに之を破る。秋七月、公は許に還る。荀彧が公に問う、「前に賊を必ず破らんと策りしは、何ぞや？」公曰く、「虜は吾が帰師を遏め、吾と死地に戦う、吾は是を以て勝つを知れり」と。", "translation": "公（曹操）が軍を引き揚げようとしたところ、張繡の兵が追ってきたため、公（曹操）の軍は進むことができず、陣営を連ねながら少しずつ前進した。公（曹操）は荀彧に書簡を送って言った、「賊が私を追撃してきているが、一日に数里しか進めないとはいえ、私の見通しでは、安衆に着けば必ず張繡を打ち破れる」と。安衆に到着すると、張繡は劉表の兵と合流して険要の地を固め、公（曹操）の軍は前後から敵を受ける形となった。公（曹操）はそこで夜間に険路を掘り抜いて抜け道を造り、輜重をすべて通過させるとともに、奇兵を配置した。夜が明けると、賊は公（曹操）が逃走したと思い込み、全軍を挙げて追撃してきた。そこで奇兵を放ち、歩兵と騎兵で挟み撃ちにして、これを大いに打ち破った。秋七月、公（曹操）は許都へ帰還した。荀彧は公（曹操）に尋ねた、「さきに賊を必ず打ち破れると予測なさったのは、なぜでしょうか？」公（曹操）は言った、「敵は我が帰師（帰還軍）の退路を塞ぎ、我々と死地で戦おうとしたため、私はそれによって勝利を確信したのだ」と。", "persons": "曹操,張繡,荀彧,劉表", "places" したため、私はそれによって勝利を確信したのだ」と。"}, {"id": "v1_p39_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 39, "type": "本文", "raw_text": "呂布復爲袁術使高順攻劉備，公遣夏侯惇救之，不利。備爲順所敗。九月，公東征布。冬十月，屠彭城，獲其相侯諧。進至下邳，布自將騎逆擊。大破之，獲其驍將成廉。追至城下，布恐，欲降。陳宮等沮其計，求救於術，勸布出戰，戰又敗，乃還固守，攻之不下。時公連戰，士卒罷，欲還，用荀攸、郭嘉計，遂決泗、沂水以灌城。月餘，布將宋憲、魏續等執陳宮，舉城降，生禽布、宮，皆殺之。太山臧霸、孫觀、吳敦、尹禮、昌狶各聚衆。布之破劉備也，霸等悉從布。布敗，獲霸等，公厚納待，遂割青、徐二州附于海以委焉，分琅邪、東海、北海爲城陽、利城、昌慮郡。", "kakikudashi": "呂布は復た袁術と為し、高順をして劉備を攻めしめ、公は夏侯惇を遣わして之を救わしむるも、利あらず。備は順の敗る所と為る。九月、公は布を東征す。冬十月、彭城を屠り、其の相の侯諧を獲たり。進みて下邳に至るに、布は自ら騎を将いて逆え撃つ。大いに之を破り、其の驍将の成廉を獲たり。追いて城下に至るに、布は恐れ、降らんと欲す。陳宮等が其の計を沮み、救いを術に求め、布に勧めて出で戦わしむるも、戦いて又た敗れ、乃ち還りて固守し、之を攻むれども下らず。時に公は連戦し、士卒は罷れ、還らんと欲するも、荀攸・郭嘉の計を用い、遂に泗・沂水を決し以て城に灌ぐ。月余にして、布の将の宋憲・魏続等が陳宮を執らえ、城を挙げて降り、布・宮を生け捕りにし、皆な之を殺す。太山の臧覇・孫観・呉敦・尹礼・昌狶が各々衆を聚む。布の劉備を破るや、覇等は悉く布に従う。布敗れ、覇等を獲るに、公は厚く納れ待ち、遂に青・徐二州の海に附くを割きて以て焉に委ね、琅邪・東海・北海を分かちて城陽・利城・昌慮郡と為す。", "translation": "呂布は再び袁術と手を結び、高順に劉備を攻めさせたため、公（曹操）は夏侯惇を派遣して救援させたが、戦況は不利となった。劉備は高順に打ち破られた。九月、公（曹操）は東征して呂布を討った。冬十月、彭城を攻略して城内を掃討し、その国相の侯諧を捕らえた。進軍して下邳に至ると、呂布は自ら騎兵を率いて迎え撃ってきた。これを大いに打ち破り、その猛将の成廉を捕らえた。追撃して城下に迫ると、呂布は恐れて降伏しようとした。しかし陳宮らがその方針を押しとどめ、袁術に救援を求めるとともに呂布に勧めて出撃させたが、戦ってまたも敗れたため、引き返して固く籠城し、これを攻めたが陥落しなかった。この時、公（曹操）は連戦で兵士たちが疲弊していたため引き揚げようとしたが、荀攸・郭嘉の計略を採用し、ついに泗水・沂水の堤を決壊させて城に水を注ぎ込んだ。一か月余り経つと、呂布の部将の宋憲・魏続らが陳宮を捕らえ、城を挙げて降伏したため、呂布・陳宮を生け捕りにし、ともに処刑した。これより先、太山（泰山）の臧覇・孫観・呉敦・尹礼・昌狶らがそれぞれ軍勢を集めていた。呂布が劉備を打ち破った際、臧覇らはみな呂布に従った。呂布が敗れて臧覇らを得ると、公（曹操）は手厚く迎え入れて処遇し、かくて青州・徐州二州の海沿いの地域を割いて彼らに委任し、琅邪・東海・北海を分割して城陽・利城・昌慮郡を設置した。", "persons": "呂布,袁術,高順,劉備,曹操,夏侯惇,侯諧,成廉,陳宮,荀攸,郭嘉,宋憲,魏続,臧覇,孫観,呉敦,尹礼,昌狶", "places": "彭城,下邳,泗水,沂水,泰山,青州,徐州,琅邪,東海,北海,城陽,利城,昌慮", "era_year": "建安3年（198年）9月〜12月", "source_book": "", "keywords": "", "raw_tagged": "{{person:呂布|呂布}}復爲{{person:袁術|袁術}}使{{person:高順|高順}}攻{{person:劉備|劉備}}，{{person:曹操|公}}遣{{person:夏侯惇|夏侯惇}}救之，不利。{{person:劉備|備}}爲{{person:高順|順}}所敗。九月，{{person:曹操|公}}東征{{person:呂布|布}}。冬十月，屠{{place:彭城|彭城}}，獲其相{{person:侯諧|侯諧}}。進至{{place:下邳|下邳}}，{{person:呂布|布}}自將騎逆擊。大破之，獲其驍將{{person:成廉|成廉}}。追至城下，{{person:呂布|布}}恐，欲降。{{person:陳宮|陳宮}}等沮其計，求救於{{person:袁術|術}} ,魯国", "era_year": "建安3年（198年）12月", "source_book": "", "keywords": "", "raw_tagged": "初，{{person:曹操|公}}爲{{place:兗州|兖州}}，以{{place:東平|東平}}{{person:畢諶|畢諶}}爲{{office:別駕|別駕}}。{{person:張邈|張邈}}之叛也，{{person:張邈|邈}}劫{{person:畢諶|諶}}母弟妻子；{{person:曹操|公}}謝遣之，曰：「卿老母在彼，可去。」{{person:畢諶|諶}}頓首無二心，{{person:曹操|公}}嘉之，爲之流涕。旣出，遂亡歸。及{{person:呂布|布}}破，{{person:畢諶|諶}}生得，衆爲{{person:畢諶|諶}}懼，{{person:曹操|公}}曰：「夫人孝於其親者，豈不亦忠於君乎！吾所求也。」以爲{{place:魯国|魯}}{{office:相|相}}。", "kakikudashi_tagged": "初め、{{person:曹操|公}}の{{place:兗州|兖州}}と為るや、{{place:東平|東平}}の{{person:畢諶|畢諶}}を以て{{office:別駕|別駕}}と為す。{{person:張邈|張邈}}の叛くや、{{person:張邈|邈}}は{{person:畢諶|諶}}の母・弟・妻子を劫かす。{{person:曹操|公}}は謝して之を遣り、曰く、「卿の老母は彼に在り、去るべし」と。{{person:畢諶|諶}}は頓首して二心無きをいい、{{person:曹操|公}}は之を嘉し、之が為に流涕す。既に出ずるや、遂に亡げ帰す。{{person:呂布|布}}の破るるに及び、{{person:畢諶|諶}}は生け捕りにせられ、衆は{{person:畢諶|諶}}の為に懼るるも、{{person:曹操|公}}曰く、「夫れ人の其の親に孝なる者は、豈に亦た君に忠ならざらんや！吾が求むる所なり」と。以て{{place:魯国|魯}}{{office:相|相}}と為す。", "translation_tagged": "これより先、{{person:曹操|公}}（{{person:曹操|曹操}}）が{{place:兗州|兗州}}を領した際、{{place:東平|東平}}の{{person:畢諶|畢諶}}を{{office:別駕|別駕}}に任じた。{{person:張邈|張邈}}が反乱を起こした時、{{person:張邈|張邈}}は{{person:畢諶|畢諶}}の母・弟・妻子を人質として拉致した。{{person:曹操|公}}（{{person:曹操|曹操}}）は暇を与えて{{person:畢諶|畢諶}}を送り出し、「君の老母はあちらにいるのだから、行ってよいぞ」と言った。{{person:畢諶|畢諶}}は額を地面に打ちつけて二心のないことを誓い、{{person:曹操|公}}（{{person:曹操|曹操}}）はこれを嘉して、そのために涙を流した。ところが{{person:畢諶|畢諶}}は退出すると、そのまま逃亡して{{person:張邈|張邈}}側へ帰順してしまった。{{person:呂布|呂布}}が打ち破られるに及んで、{{person:畢諶|畢諶}}は生け捕りにされ、人々は{{person:畢諶|畢諶}}のために処刑を恐れたが、{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、「そもそもその親に孝行な者が、どうして主君に対しても忠義でないことがあろうか！それこそ私が求めている人材なのだ」と。こうして{{person:畢諶|畢諶}}を{{place:魯国|魯}}{{office:相|相}}に任じた。"}, {"id": "v1_p40_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 40, "type": "裴注", "raw_text": "《魏書》曰：袁紹宿與故太尉楊彪、大長秋梁紹、少府孔融有隙，欲使公以他過誅之。公曰：「當今天下土崩瓦解，雄豪並起，輔相君長，人懷怏怏，各有自爲之心，此上下相疑之秋也，雖以無嫌待之，猶懼未信；如有所除，則誰不自危？且夫起布衣，在塵垢之間，爲庸人之所陵陷，可勝怨乎！高祖赦雍齒之讎而羣情以安，如何忘之？」紹以爲公外託公義，內實離異，深懷怨望。臣松之以爲楊彪亦曾爲魏武所困，幾至於死，孔融竟不免於誅滅，豈所謂先行其言而後從之哉！非知之難，其在行之，信矣。", "kakikudashi": "『魏書』に曰く、「袁紹は宿て故の太尉の楊彪・大長秋の梁紹・少府の孔融と隙有り、公をして他の過ちを以て之を誅せしめんと欲す。公曰く、『当今天下は土崩瓦解し、雄豪は並び起こり、輔相・君長は、人ごとに怏怏を懐き、各々自ら為さんとするの心有り、此れ上下相疑うの秋なれば、嫌無きを以て之を待つと雖も、猶お未だ信ぜざらんことを懼る。如し除く所有らば、則ち誰か自ら危ぶまざらんや？且つ夫れ布衣より起こり、塵垢の間に在りて、庸人の陵陥する所と為るも、勝げて怨むべけんや！高祖は雍歯の讎を赦して群情は以て安んず、如何ぞ之を忘れんや？』紹は公が外は公義に託し、内は実に離異すと為し、深く怨望を懐く」と。臣松之以為えらく、楊彪も亦た曾て魏武の困しむる所と為り、幾ど死するに至り、孔融も竟に誅滅を免れず、豈に所謂「先ず其の言を行いて而る後に之に従う」ならんや！「之を知ることの難きに非ず、其れ之を行うに在り」とは、信なるかな。", "translation": "『魏書』にいう、「袁紹はかねてより前の太尉・楊彪、大長秋・梁紹、少府・孔融と不仲であり、公（曹操）に別の罪過を口実として彼らを処刑させようと望んだ。公（曹操）は言った、『今や天下は土崩瓦解して群雄が並び立ち、宰相から君主に至るまで人々みな不満を抱き、それぞれに自立の下心を持っており、まさに上下が互いに疑心暗鬼に陥っている重大な時期であるから、猜疑心を持たずに彼らを遇したとしても、なお信じてもらえないのではないかと危惧されるほどである。もし誰かを排除するようなことがあれば、いったい誰が我が身を危ぶまずにいられようか？まして無位無官の身分から身を起こし、俗世の塵や垢にまみれていた頃に、凡庸な輩から侮られ陥れられたことなど、いちいち怨みきれるものであろうか！高祖（劉邦）は宿敵・雍歯への怨みを赦すことで群臣たちの動揺を安んじたというのに、どうしてその故事を忘れてよかろうか？』袁紹は、公（曹操）が表面では大義名分に託けながら内心では実は自分に背いているのだとみなし、深く怨みを抱いた」と。臣松之（裴松之）が考えるに、楊彪もまたかつて魏の武帝（曹操）に苦しめられてあやうく死ぬところまで追い詰められ、孔融も結局は誅滅を免れなかったのだから、どうして『論語』にいわゆる「まずその言葉を実行してから後に口に出す」と言えようか！古語に「それを知ることが難しいのではなく、それを実行することにこそ難しさがある」というのは、まことにその通りである。", "persons": "袁紹,楊彪,梁紹,孔融,曹操,劉邦,雍歯,裴松之", "places": "", "era_year": "建安3年（198年）頃", "source_book": "魏書", "keywords": "先行其言,非知之難", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:袁紹|袁紹}}宿與故{{office:太尉|太尉}}{{person:楊彪|楊彪}}、{{office:大長秋|大長秋}}{{person:梁紹|梁紹}}、{{office:少府|少府}}{{person:孔融|孔融}}有隙，欲使{{person:曹操|公}}以他過誅之。{{person:曹操|公}}曰：「當今天下土崩瓦解，雄豪並起，輔相君長，人懷怏怏，各有自爲之心，此上下相疑之秋也，雖以無嫌待之，猶懼未信；如有所除，則誰不自危？且夫起布衣，在塵垢之間，爲庸人之所陵陷，可勝怨乎！{{person:劉邦|高祖}}赦{{person:雍歯|雍齒}}之讎而羣情以安，如何忘之？」{{person:袁紹|紹}}以爲{{person:曹操|公}}外託公義，內實離異，深懷怨望。{{person:裴松之|臣松之}}以爲{{person:楊彪|楊彪}}亦曾爲{{person:曹操|魏武}}所困，幾至於死，{{person:孔融|孔融}}竟不免於誅滅，豈所謂{{special:先行其言|先行其言而後從之}}哉！{{special:非知之難|非知之難，其在行之}}，信矣。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、「{{person:袁紹|袁紹}}は宿て故の{{office:太尉|太尉}}の{{person:楊彪|楊彪}}・{{office:大長秋|大長秋}}の{{person:梁紹|梁紹}}・{{office:少府|少府}}の{{person:孔融|孔融}}と隙有り、{{person:曹操|公}}をして他の過ちを以て之を誅せしめんと欲す。{{person:曹操|公}}曰く、『当今天下は土崩瓦解し、雄豪は並び起こり、輔相・君長は、人ごとに怏怏を懐き、各々自ら為さんとするの心有り、此れ上下相疑うの秋なれば、嫌無きを以て之を待つと雖も、猶お未だ信ぜざらんことを懼る。如し除く所有らば、則ち誰か自ら危ぶまざらんや？且つ夫れ布衣より起こり、塵垢の間に在りて、庸人の陵陥する所と為るも、勝げて怨むべけんや！{{person:劉邦|高祖}}は{{person:雍歯|雍歯}}の讎を赦して群情は以て安んず、如何ぞ之を忘れんや？』{{person:袁紹|紹}}は{{person:曹操|公}}が外は公義に託し、内は実に離異すと為し、深く怨望を懐く」と。{{person:裴松之|臣松之}}以為えらく、{{person:楊彪|楊彪}}も亦た曾て{{person:曹操|魏武}}の困しむる所と為り、幾ど死するに至り、{{person:孔融|孔融}}も竟に誅滅を免れず、豈に所謂「{{special:先行其言|先ず其の言を行いて而る後に之に従う}}」ならんや！「{{special:非知之難|之を知ることの難きに非ず、其れ之を行うに在り}}」とは、信なるかな。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう、「{{person:袁紹|袁紹}}はかねてより前の{{office:太尉|太尉}}・{{person:楊彪|楊彪}}、{{office:大長秋|大長秋}}・{{person:梁紹|梁紹}}、{{office:少府|少府}}・{{person:孔融|孔融}}と不仲であり、{{person:曹操|公}}（{{person:曹操|曹操}}）に別の罪過を口実として彼らを処刑させようと望んだ。{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、『今や天下は土崩瓦解して群雄が並び立ち、宰相から君主に至るまで人々みな不満を抱き、それぞれに自立の下心を持っており、まさに上下が互いに疑心暗鬼に陥っている重大な時期であるから、猜疑心を持たずに彼らを遇したとしても、なお信じてもらえないのではないかと危惧されるほどである。もし誰かを排除するようなことがあれば、いったい誰が我が身を危ぶまずにいられようか？まして無位無官の身分から身を起こし、俗世の塵や垢にまみれていた頃に、凡庸な輩から侮られ陥れられたことなど、いちいち怨みきれるものであろうか！{{person:劉邦|高祖}}（{{person:劉邦|劉邦}}）は宿敵・{{person:雍歯|雍歯}}への怨みを赦すことで群臣たちの動揺を安んじたというのに、どうしてその故事を忘れてよかろうか？』{{person:袁紹|袁紹}}は、{{person:曹操|公}}（{{person:曹操|曹操}}）が表面では大義名分に託けながら内心では実は自分に背いているのだとみなし、深く怨みを抱いた」と。{{person:裴松之|臣松之}}（{{person:裴松之|裴松之}}）が考えるに、{{person:楊彪|楊彪}}もまたかつて{{person:曹操|魏の武帝}}（{{person:曹操|曹操}}）に苦しめられてあやうく死ぬところまで追い詰められ、{{person:孔融|孔融}}も結局は誅滅を免れなかったのだから、どうして『論語』にいわゆる「{{special:先行其言|まずその言葉を実行してから後に口に出す}}」と言えようか！古語に「{{special:非知之難|それを知ることが難しいのではなく、それを実行することにこそ難しさがある}}」というのは、まことにその通りである。"}, {"id": "v1_p41_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 41, "type": "本文", "raw_text": "四年春二月，公還至昌邑。張楊將楊醜殺楊，眭固又殺醜，以其衆屬袁紹，屯射犬。夏四月，進軍臨河，使史渙、曹仁渡河擊之。固使楊故長史薛洪、河內太守繆尚留守，自將兵北迎紹求救，與渙、仁相遇犬城。交戰，大破之，斬固。公遂濟河，圍射犬。洪、尚率衆降，封爲列侯，還軍敖倉。以魏种爲河內太守，屬以河北事。", "kakikudashi": "四年春二月、公は還りて昌邑に至る。張楊の将の楊醜が楊を殺し、眭固が又た醜を殺し、其の衆を以て袁紹に属し、射犬に屯す。夏四月、軍を進めて河に臨み、史渙・曹仁をして河を渡りて之を撃たしむ。固は楊の故の長史の薛洪・河内太守の繆尚をして留守せしめ、自ら兵を将いて北のかた紹を迎えて救いを求め、渙・仁と犬城に相遇う。交戦し、大いに之を破り、固を斬る。公は遂に河を済り、射犬を囲む。洪・尚は衆を率いて降り、封じて列侯と為し、軍を敖倉に還す。魏種を以て河内太守と為し、属するに河北の事を以てす。", "translation": "建安四年春二月、公（曹操）は帰還して昌邑に至った。これより先、張楊の部将の楊醜が張楊を殺害し、眭固がさらに楊醜を殺害して、その軍勢をもって はなりません」と言った。公（曹操）は後悔し、これを追わせたが追いつかなかった。劉備はまだ東へ出立する前、密かに董承らと謀反を企てており、下邳に到着すると、ついに徐州刺史の車冑を殺害し、兵を挙げて沛に駐屯した。劉岱・王忠を派遣してこれを討たせたが、勝てなかった。", "persons": "袁術,袁譚,曹操,劉備,朱霊,程昱,郭嘉,董承,車冑,劉岱_沛国,王忠", "places": "陳国,青州,下邳,徐州,沛県", "era_year": "建安4年（199年）6月〜12月", "source_book": "", "keywords": "", "raw_tagged": "{{person:袁術|袁術}}自敗於{{place:陳国|陳}}，稍困，{{person:袁譚|袁譚}}自{{place:青州|青州}}遣迎之。{{person:袁術|術}}欲從{{place:下邳|下邳}}北過，{{person:曹操|公}}遣{{person:劉備|劉備}}、{{person:朱霊|朱靈}}要之。會{{person:袁術|術}}病死。{{person:程昱|程昱}}、{{person:郭嘉|郭嘉}}聞{{person:曹操|公}}遣{{person:劉備|備}}，言於{{person:曹操|公}}曰：「{{person:劉備|劉備}}不可縱。」{{person:曹操|公}}悔，追之不及。{{person:劉備|備}}之未東也，陰與{{person:董承|董承}}等謀反，至{{place:下邳|下邳}}，遂殺{{place:徐州|徐州}}{{office:刺史|刺史}}{{person:車冑|車冑}}，舉兵屯{{place:沛県|沛}}。遣{{person:劉岱_沛国|劉岱}}、{{person:王忠|王忠}}擊之，不克。", "kakikudashi_tagged": "{{person:袁術|袁術}}は{{place:陳国|陳}}に敗れてより、稍く困しみ、{{person:袁譚|袁譚}}が{{place:青州|青州}}より遣わして之を迎えしむ。{{person:袁術|術}}は{{place:下邳|下邳}}より北に過ぎらんと欲し、{{person:曹操|公}}は{{person:劉備|劉備}}・{{person:朱霊|朱霊}}を遣わして之を要せしむ。会々{{person:袁術|術}}が病死す。{{person:程昱|程昱}}・{{person:郭嘉|郭嘉}}は{{person:曹操|公}}の{{person:劉備|備}}を遣わすを聞き、{{person:曹操|公}}に言いて曰く、「{{person:劉備|劉備}}は縦つべからず」と。{{person:曹操|公}}は悔い、之を追わしむるも及ばず。{{person:劉備|備}}の未だ東せざるや、陰かに{{person:董承|董承}}等と反を謀り、{{place:下邳|下邳}}に至るや、遂に{{place:徐州|徐州}}{{office:刺史|刺史}}の{{person:車冑|車冑}}を殺し、兵を挙げて{{place:沛県|沛}}に屯す。{{person:劉岱_沛国|劉岱}}・{{person:王忠|王忠}}を遣わして之を撃たしむるも、克たず。", "translation_tagged": "{{person:袁術|袁術}}は{{place:陳国|陳国}}で敗れて以来、次第に困窮し、{{person:袁譚|袁譚}}が{{place:青州|青州}}から使者を遣わして迎え入れようとした。{{person:袁術|袁術}}は{{place:下邳|下邳}}を通って北へ向かおうとし、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{person:劉備|劉備}}・{{person:朱霊|朱霊}}を派遣してこれを待ち伏せさせた。ちょうどその時、{{person:袁術|袁術}}は病死した。{{person:程昱|程昱}}・{{person:郭嘉|郭嘉}}は{{person:曹操|公}}（{{person:曹操|曹操}}）が{{person:劉備|劉備}}を派遣したと聞くと、{{person:曹操|公}}（{{person:曹操|曹操}}）に言上して「{{person:劉備|劉備}}を解き放ってはなりません」と言った。{{person:曹操|公}}（{{person:曹操|曹操}}）は後悔し、これを追わせたが追いつかなかった。{{person:劉備|劉備}}はまだ東へ出立する前、密かに{{person:董承|董承}}らと謀反を企てており、{{place:下邳|下邳}}に到着すると、ついに{{place:徐州|徐州}}{{office:刺史|刺史}}の{{person:車冑|車冑}}を殺害し、兵を挙げて{{place:沛県|沛}}に駐屯した。{{person:劉岱_沛国|劉岱}}・{{person:王忠|王忠}}を派遣してこれを討たせたが、勝てなかった。"}, {"id": "v1_p44_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 44, "type": "裴注", "raw_text": "《獻帝春秋》曰：備謂岱等曰：「使汝百人來，其無如我何；曹公自來，未可知耳！」《魏武故事》曰：岱字公山，沛國人。以司空長史從征伐有功，封列侯。《魏略》曰：王忠，扶風人，少爲亭長。三輔亂，忠饑乏噉人，隨輩南向武關。值婁子伯爲荊州遣迎北方客人；忠不欲去，因率等仵逆擊之，奪其兵，聚衆千餘人以歸公。拜忠中郎將，從征討。五官將知忠甞噉人，因從駕出行，令俳取冢間髑髏繫著忠馬鞍，以爲歡笑。", "kakikudashi": "『献帝春秋』に曰く、「備は岱等に謂いて曰く、『汝ら百人をして来たらしむとも、其れ我を如何ともする無からん。曹公が自ら来たらば、未だ知るべからざるのみ！』」『魏武故事』に曰く、「岱は字は公山、沛国の人なり。司空長史を以て征伐に従いて功有り、列侯に封ぜらる」と。『魏略』に曰く、「王忠は、扶風の人にして、少くして亭長と為る。三輔乱れ、忠は飢乏して人を噉らい、輩に随いて南のかた武関に向かう。婁子伯が荊州の為に遣わされて北方の客人を迎うるに値う。忠は去るを欲せず、因りて等仵を率いて之を逆え撃ち、其の兵を奪い、衆千余人を聚めて以て公に帰す。忠を中郎将に拝し、征討に従わしむ。五官将は忠が甞て人を噉らいしを知り、駕に従いて出行するに因り、俳をして冢間の髑髏を取りて忠の馬鞍に繋ぎ著けしめ、以て歓笑と為す」と。", "translation": "『献帝春秋』にいう、「劉備は劉岱らに語って言った、『お前たちが百人束になってやって来ようとも、私をどうすることもできまい。曹公（曹操）が自ら乗り出して来たならば、どうなるか分からぬがな！』」『魏武故事』にいう、「劉岱は字を公山といい、沛国の人である。司空長史として征伐に従って戦功があり、列侯に封じられた」と。『魏略』にいう、「王忠は扶風の人で、若い頃に亭長となった。三輔が戦乱に陥ると、王忠は飢えに窮して人肉を食らい、仲間とともに南の武関へ向かった。折しも婁子伯（婁圭）が荊州のために派遣されて北方の流寓者たちを迎え入れているところに出くわした。王忠は荊州へ行くことを望まず、そこで仲間たちを率いてこれを迎え撃ち、その兵を奪い取り、千余人の軍勢を集めて公（曹操）に帰順した。王忠を中郎将に拝し、征討に従軍させた。五官将（曹丕）は王忠がかつて人肉を食らったことがあるのを知っており、車駕に随行して外出した際、道化役に命じて墓場の間の髑髏（しゃれこうべ）を拾って王忠の馬の鞍に結びつけさせ、笑いものにした」と。", "persons": "劉備,劉岱_沛国,曹操,王忠,婁圭,曹丕", "places": "沛国,扶風,三輔,武関,荊州", "era_year": "建安4年（199年）冬", "source_book": "献帝春秋,魏武故事,魏略", "keywords": "", "raw_tagged": "{{special:引用史料|《獻帝春秋》}}曰：{{person:劉備|備}}謂{{person:劉岱_沛国|岱}}等曰：「使汝百人來，其無如我何；{{person:曹操|曹公}}自來，未可知耳！」{{special:引用史料|《魏武故事》}}曰：{{person:劉岱_沛国|岱}}字{{person:劉岱_沛国|公山}}，{{place:沛国|沛國}}人。以{{office:司空|司空}}{{office:長史|長史}}從征伐有功，封{{office:列侯|列侯}}。{{special:引用史料|《魏略》}}曰：{{person:王忠|王忠}}，{{place:扶風|扶風}}人，少爲{{office:亭長|亭長}}。{{place:三輔|三輔}}亂，{{person:王忠|忠}}饑乏噉人，隨輩南向{{place:武関|武關}}。值{{person:婁圭|婁子伯}}爲{{place:荊州|荊州}}遣迎北方客人；{{person:王忠|忠}}不欲去，因率等仵逆擊之，奪其兵，聚衆千餘人以歸{{person:曹操|公}}。拜{{person:王忠|忠}}{{office:中郎将|中郎將}}，從征討。{{person:曹丕|五官將}}知{{person:王忠|忠}}甞噉人，因從駕出行，令俳取冢間髑髏繫著{{person:王忠|忠}}馬鞍，以爲歡笑。", "kakikudashi_tagged": "{{special:引用史料|『献帝春秋』}}に曰く、「{{person:劉備|備}}は{{person:劉岱_沛国|岱}}等に謂いて曰く、『汝ら百人をして来たらしむとも、其れ我を如何ともする無からん。{{person:曹操|曹公}}が自ら来たらば、未だ知るべからざるのみ！』」{{special:引用史料|『魏武故事』}}に曰く、「{{person:劉岱_沛国|岱}}は字は{{person:劉岱_沛国|公山}}、{{place:沛国|沛国}}の人なり。{{office:司空|司空}}{{office:長史|長史}}を以て征伐に従いて功有り、{{office:列侯|列侯}}に封ぜらる」と。{{special:引用史料|『魏略』}}に曰く、「{{person:王忠|王忠}}は、{{place:扶風|扶風}}の人にして、少くして{{office:亭長|亭長}}と為る。{{place:三輔|三輔}}乱れ、{{person:王忠|忠}}は飢乏して人を噉らい、輩に随いて南のかた{{place:武関|武関}}に向かう。{{person:婁圭|婁子伯}}が{{place:荊州|荊州}}の為に遣わされて北方の客人を迎うるに値う。{{person:王忠|忠}}は去るを欲せず、因りて等仵を率いて之を逆え撃ち、其の兵を奪い、衆千余人を聚めて以て{{person:曹操|公}}に帰す。{{person:王忠|忠}}を{{office:中郎将|中郎将}}に拝し、征討に従わしむ。{{person:曹丕|五官将}}は{{person:王忠|忠}}が甞て人を噉らいしを知り、駕に従いて出行するに因り、俳をして冢間の髑髏を取りて{{person:王忠|忠}}の馬鞍に繋ぎ著けしめ、以て歓笑と為す」と。", "translation_tagged": "{{special:引用史料|『献帝春秋』}}にいう、「{{person:劉備|劉備}}は{{person:劉岱_沛国|劉岱}}らに語って言った、『お前たちが百人束になってやって来ようとも、私をどうすることもできまい。{{person:曹操|曹公}}（{{person:曹操|曹操}}）が自ら乗り出して来たならば、どうなるか分からぬがな！』」{{special:引用史料|『魏武故事』}}にいう、「{{person:劉岱_沛国|劉岱}}は字を{{person:劉岱_沛国|公山}}といい、{{place:沛国|沛国}}の人である。{{office:司空|司空}}{{office:長史|長史}}として征伐に従って戦功があり、{{office:列侯|列侯}}に封じられた」と。{{special:引用史料|『魏略』}}にいう、「{{person:王忠|王忠}}は{{place:扶風|扶風}}の人で、若い頃に{{office:亭長|亭長}}となった。{{place:三輔|三輔}}が戦乱に陥ると、{{person:王忠|王忠}}は飢えに窮して人肉を食らい、仲間とともに南の{{place:武関|武関}}へ向かった。折しも{{person:婁圭|婁子伯}}（{{person:婁圭|婁圭}}）が{{place:荊州|荊州}}のために派遣されて北方の流寓者たちを迎え入れているところに出くわした。{{person:王忠|王忠}}は{{place:荊州|荊州}}へ行くことを望まず、そこで仲間たちを率いてこれを迎え撃ち、その兵を奪い取り、千余人の軍勢を集めて{{person:曹操|公}}（{{person:曹操|曹操}}）に帰順した。{{person:王忠|王忠}}を{{office:中郎将|中郎将}}に拝し、征討に従軍させた。{{person:曹丕|五官将}}（{{person:曹丕|曹丕}}）は{{person:王忠|王忠}}がかつて人肉を食らったことがあるのを知っており、車駕に随行して外出した際、道化役に命じて墓場の間の髑髏（しゃれこうべ）を拾って{{person:王忠|王忠}}の馬の鞍に結びつけさせ、笑いものにした」と。"}, {"id": "v1_p45_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 45, "type": "本文", "raw_text": "廬江太守劉勳率衆降，封爲列侯。", "kakikudashi": "廬江太守の劉勲が衆を率いて降り、封じて列侯と為す。", "translation": "廬江太守の劉勲が軍勢を率いて降伏したため、封じて列侯とした。", "persons": "劉勲", "places": "廬江", "era_year": "建安4年（199年）12月", "source_book": "", "keywords": "", "raw_tagged": "{{place:廬江|廬江}}{{office:太守|太守}}{{person:劉勲|劉勳}}率衆降，封爲{{office:列侯|列侯}}。", "kakikudashi_tagged": "{{place:廬江|廬江}}{{office:太守|太守}}の{{person:劉勲|劉勲}}が衆を率いて降り、封じて{{office:列侯|列侯}}と為す。", "translation_tagged": "{{place:廬江|廬江}}{{office:太守|太守}}の{{person:劉勲|劉勲}}が軍勢を率いて降伏したため、封じて{{office:列侯|列侯}}とした。"}, {"id": "v1_p46_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 46, "type": "本文", "raw_text": "五年春正月，董承等謀泄，皆伏誅。公將自東征備，諸將皆曰：「與公爭天下者，袁紹也。今紹方來而棄之東，紹乘人後，若何？」公曰：「夫劉備，人傑也，今不擊，必爲後患。", "kakikudashi": "五年春正月、董承等の謀泄れ、皆な誅に伏す。公は将に自ら備を東征せんとするに、諸将皆な曰く、「公と天下を争う者は、袁紹なり。今、紹が方に来たらんとするに之を棄てて東し、紹が人の後に乗ぜば、若何せん？」公曰く、「夫れ劉備は、人傑なり、今撃たずんば、必ず後患と為らん。", "translation": "建安五年春正月、董承らの陰謀が露見し、全員が処刑された。公（曹操）が自ら東征して劉備を討とうとすると、諸将はみな言った、「公と天下を争う相手は、袁紹です。今まさに袁紹が攻め寄せようとしているのに、これを放置して東へ向かい、袁紹が背後を突いてきたら、どうなさいますか？」公（曹操）は言った、「そもそも劉備は人傑であり、今のうちに討たなければ、必ず後の憂いとなる。", "persons": "董承,曹操,劉備,袁紹", "places": "", "era_year": "建安5年（200年）正月", "source_book": "", "keywords": "", "raw_tagged": "五年春正月，{{person:董承|董承}}等謀泄，皆伏誅。{{person:曹操|公}}將自東征{{person:劉備|備}}，諸將皆曰：「與{{person:曹操|公}}爭天下者，{{person:袁紹|袁紹}}也。今{{person:袁紹|紹}}方來而棄之東，{{person:袁紹|紹}}乘人後，若何？」{{person:曹操|公}}曰：「夫{{person:劉備|劉備}}，人傑也，今不擊，必爲後患。", "kakikudashi_tagged": "五年春正月、{{person:董承|董承}}等の謀泄れ、皆な誅に伏す。{{person:曹操|公}}は将に自ら{{person:劉備|備}}を東征せんとするに、諸将皆な曰く、「公と天下を争う者は、{{person:袁紹|袁紹}}なり。今、{{person:袁紹|紹}}が方に来たらんとするに之を棄てて東し、{{person:袁紹|紹}}が人の後に乗ぜば、若何せん？」{{person:曹操|公}}曰く、「夫れ{{person:劉備|劉備}}は、人傑なり、今撃たずんば、必ず後患と為らん。", "translation_tagged": "{{special:建安|建安}}五年春正月、{{person:董承|董承}}らの陰謀が露見し、全員が処刑された。{{person:曹操|公}}（{{person:曹操|曹操}}）が自ら東征して{{person:劉備|劉備}}を討とうとすると、諸将はみな言った、「公と天下を争う相手は、{{person:袁紹|袁紹}}です。今まさに{{person:袁紹|袁紹}}が攻め寄せようとしているのに、これを放置して東へ向かい、{{person:袁紹|袁紹}}が背後を突いてきたら、どうなさいますか？」{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、「そもそも{{person:劉備|劉備}}は人傑であり、今のうちに討たなければ、必ず後の憂いとなる。"}, {"id": "v1_p46_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 46, "type": "裴注", "raw_text": "孫盛《魏氏春秋》云：荅諸將曰：「劉備，人傑也，將生憂寡人。」臣松之以爲史之記言，旣多潤色，故前載所述有非實者矣，後之作者又生意改之，於失實也，不亦彌遠乎！凡孫盛製書，多用左氏以易舊文，如此者非一。嗟乎，後之學者將何取信哉？且魏武方以天下勵志，而用夫差分死之言，尤非其類。", "kakikudashi": "孫盛の『魏氏春秋』に云う、諸将に答えて曰く、「劉備は、人傑なり、将に生きながらにして寡人を憂えしめんとす」と。臣松之以為えらく、史の記言は、既に潤色多し、故に前載の述ぶる所にも実に非ざる者有り、後の作者が又た意を生じて之を改むれば、実を失うに於いてや、亦た弥々遠からずや！凡そ孫盛の書を製するや、多く左氏を用いて以て旧文を易え、此の如き者は一に非ず。嗟乎、後の学者は将に何にか信を取らんや？且つ魏武は方に天下を以て志を励ますに、夫差が死を分とするの言を用うるは、尤も其の類に非ず。", "translation": "孫盛の『魏氏春秋』にいう、諸将に答えて「劉備は人傑であり、このまま生かしておけば私に憂いをもたらすであろう」と言った、と。臣松之（裴松之）が考えるに、歴史書における発言の記録にはもともと潤色が多いため、先行する史書の記述にも事実でないものがあるのに、後世の著述家がさらに独自の思いつきでこれを書き換えてしまっては、真実からますます遠ざかってしまうではないか！いったいに孫盛が歴史書を編纂する際には、多くの箇所で『左氏伝』の表現を用いて旧来の文面を書き換えており、このような例は一つにとどまらない。ああ、後世の学者はいったい何を信拠とすればよいのか？しかも魏の武帝（曹操）はまさに天下平定に向けて志を奮い立たせていた時期であるのに、呉王・夫差が滅亡と死を覚悟した際の言葉を用いるなど、とりわけ場にそぐわないものである。", "persons": "孫盛,劉備,裴松之,曹操,夫差", "places": "", "era_year": "建安5年（200年）正月", "source_book": "魏氏春秋", "keywords": "左氏", "raw_tagged": "{{person:孫盛|孫盛}}{{special:引用史料|《魏氏春秋》}}云：荅諸將曰：「{{person:劉備|劉備}}，人傑也，將生憂寡人。」{{person:裴松之|臣松之}}以爲史之記言，旣多潤色，故前載所述有非實者矣，後之作者又生意改之，於失實也，不亦彌遠乎！凡{{person:孫盛|孫盛}}製書，多用{{special:左氏|左氏}}以易舊文，如此者非一。嗟乎，後之學者將何取信哉？且{{person:曹操|魏武}}方以天下勵志，而用{{person:夫差|夫差}}分死之言，尤非其類。", "kakikudashi_tagged": "{{person:孫盛|孫盛}}の{{special:引用史料|『魏氏春秋』}}に云う、諸将に答えて曰く、「{{person:劉備|劉備}}は、人傑なり、将に生きながらにして寡人を憂えしめんとす」と。{{person:裴松之|臣松之}}以為えらく、史の記言は、既に潤色多し、故に前載の述ぶる所にも実に非ざる者有り、後の作者が又た意を生じて之を改むれば、実を失うに於いてや、亦た弥々遠からずや！凡そ{{person:孫盛|孫盛}}の書を製するや、多く{{special:左氏|左氏}}を用いて以て旧文を易え、此の如き者は一に非ず。嗟乎、後の学者は将に何にか信を取らんや？且つ{{person:曹操|魏武}}は方に天下を以て志を励ますに、{{person:夫差|夫差}}が死を分とするの言を用うるは、尤も其の類に非ず。", "translation_tagged": "{{person:孫盛|孫盛}}の{{special:引用史料|『魏氏春秋』}}にいう、諸将に答えて「{{person:劉備|劉備}}は人傑であり、このまま生かしておけば私に憂いをもたらすであろう」と言った、と。{{person:裴松之|臣松之}}（{{person:裴松之|裴松之}}）が考えるに、歴史書における発言の記録にはもともと潤色が多いため、先行する史書の記述にも事実でないものがあるのに、後世の著述家がさらに独自の思いつきでこれを書き換えてしまっては、真実からますます遠ざかってしまうではないか！いったいに{{person:孫盛|孫盛}}が歴史書を編纂する際には、多くの箇所で{{special:左氏|『左氏伝』}}の表現を用いて旧来の文面を書き換えており、このような例は一つにとどまらない。ああ、後世の学者はいったい何を信拠とすればよいのか？しかも{{person:曹操|魏の武帝}}（{{person:曹操|曹操}}）はまさに天下平定に向けて志を奮い立たせていた時期であるのに、呉王・{{person:夫差|夫差}}が滅亡と死を覚悟した際の言葉を用いるなど、とりわけ場にそぐわないものである。"}, {"id": "v1_p46_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 46, "type": "本文", "raw_text": "袁紹雖有大志，而見事遟，必不動也。」郭嘉亦勸公，遂東擊備，破之，生禽其將夏侯博。備走奔紹，獲其妻子。備將關羽屯下邳，復進攻之，羽降。昌狶叛爲備，又攻破之。公還官渡，紹卒不出。", "kakikudashi": "袁紹は大志有りと雖も、事を見るに遅ければ、必ず動かざるなり」と。郭嘉も亦た公に勧め、遂に東のかた備を撃ち、之を破り、其の将の夏侯博を生け捕りにす。備は走りて紹に奔り、其の妻子を獲たり。備の将の関羽が下邳に屯するも、復た進みて之を攻め、羽は降る。昌狶が叛きて備の為にするも、又た攻めて之を破る。公は官渡に還るも、紹は卒に出でず。", "translation": "袁紹は大きな志を持っているとはいえ、事態を見極めるのが遅いから、きっと動きはしないであろう」と。郭嘉もまた公（曹操）に勧めたため、かくて東進して劉備を攻撃し、これを打ち破り、その部将の夏侯博を生け捕りにした。劉備は逃走して袁紹のもとへ奔り、その妻子を捕らえた。劉備の部将の関羽が下邳に駐屯していたが、さらに進軍してこれを攻め、関羽は降伏した。昌狶が背いて劉備に味方したが、これもまた攻めて打ち破った。公（曹操）は官渡へ帰還したが、袁紹は結局出兵してこなかった。", "persons": "袁紹,郭嘉,曹操,劉備,夏侯博,関羽,昌狶", "places": "下邳,官渡", "era_year": "建安5年（200年）正月", "source_book": "", "keywords": "", "raw_tagged": "{{person:袁紹|袁紹}}雖有大志，而見事遟，必不動也。」{{person:郭嘉|郭嘉}}亦勸{{person:曹操|公}}，遂東擊{{person:劉備|備}}，破之，生禽其將{{person:夏侯博|夏侯博}}。{{person:劉備|備}}走奔{{person:袁紹|紹}}，獲其妻子。{{person:劉備|備}}將{{person:関羽|關羽}}屯{{place:下邳|下邳}}，復進攻之，{{person:関羽|羽}}降。{{person:昌狶|昌狶}}叛爲{{person:劉備|備}}，又攻破之。{{person:曹操|公}}還{{place:官渡|官渡}}，{{person:袁紹|紹}}卒不出。", "kakikudashi_tagged": "{{person:袁紹|袁紹}}は大志有りと雖も、事を見るに遅ければ、必ず動かざるなり」と。{{person:郭嘉|郭嘉}}も亦た{{person:曹操|公}}に勧め、遂に東のかた{{person:劉備|備}}を撃ち、之を破り、其の将の{{person:夏侯博|夏侯博}}を生け捕りにす。{{person:劉備|備}}は走りて{{person:袁紹|紹}}に奔り、其の妻子を獲たり。{{person:劉備|備}}の将の{{person:関羽|関羽}}が{{place:下邳|下邳}}に屯するも、復た進みて之を攻め、{{person:関羽|羽}}は降る。{{person:昌狶|昌狶}}が叛きて{{person:劉備|備}}の為にするも、又た攻めて之を破る。{{person:曹操|公}}は{{place:官渡|官渡}}に還るも、{{person:袁紹|紹}}は卒に出でず。", "translation_tagged": "{{person:袁紹|袁紹}}は大きな志を持っているとはいえ、事態を見極めるのが遅いから、きっと動きはしないであろう」と。{{person:郭嘉|郭嘉}}もまた{{person:曹操|公}}（{{person:曹操|曹操}}）に勧めたため、かくて東進して{{person:劉備|劉備}}を攻撃し、これを打ち破り、その部将の{{person:夏侯博|夏侯博}}を生け捕りにした。{{person:劉備|劉備}}は逃走して{{person:袁紹|袁紹}}のもとへ奔り、その妻子を捕らえた。{{person:劉備|劉備}}の部将の{{person:関羽|関羽}}が{{place:下邳|下邳}}に駐屯していたが、さらに進軍してこれを攻め、{{person:関羽|関羽}}は降伏した。{{person:昌狶|昌狶}}が背いて{{person:劉備|劉備}}に味方したが、これもまた攻めて打ち破った。{{person:曹操|公}}（{{person:曹操|曹操}}）は{{place:官渡|官渡}}へ帰還したが、{{person:袁紹|袁紹}}は結局出兵してこなかった。"}, {"id": "v1_p47_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 47, "type": "本文", "raw_text": "二月，紹遣郭圖、淳于瓊、顏良攻東郡太守劉延於白馬，紹引兵至黎陽，將渡河。夏四月，公北救延。荀攸說公曰：「今兵少不敵，分其勢乃可。公到延津，若將渡兵向其後者，紹必西應之，然後輕兵襲白馬，掩其不備，顏良可禽也。」公從之。紹聞兵渡，即分兵西應之。公乃引軍兼行趣白馬，未至十餘里，良大驚，來逆戰。使張遼、關羽前登，擊破，斬良。遂解白馬圍，徙其民，循河而西。紹於是渡河追公軍，至延津南。公勒兵駐營南阪下，使登壘望之，曰：「可五六百騎。」有頃，復白：「騎稍多，步兵不可勝數。」公曰：「勿復白。」乃令騎解鞍放馬。是時，白馬輜重就道。諸將以爲敵騎多，不如還保營。荀攸曰：「此所以餌敵，如何去之！」紹騎將文醜與劉備將五六千騎前後至。諸將復白：「可上馬。」公曰：「未也。」有頃，騎至稍多，或分趣輜重。公曰：「可矣。」乃皆上馬。時騎不滿六百，遂縱兵擊，大破之，斬醜。醜、良皆紹名將也，再戰，悉禽，紹軍大震。公還軍官渡。紹進保陽武。關羽亡歸劉備。", "kakikudashi": "二月、紹は郭図・淳于瓊・顔良を遣わして東郡太守の劉延を白馬に攻めしめ、紹は兵を引きて黎陽に至り、将に河を渡らんとす。夏四月、公は北のかた延を救う。荀攸が公に説きて曰く、「今、兵少なくして敵せざれば、其の勢いを分かちて乃ち可なり。公は延津に到り、将に兵を渡して其の後に向かわんとする者の若くせば、紹は必ず西のかた之に応ぜん、然る後に軽兵もて白馬を襲い、其の不備を掩わば、顔良は禽にすべきなり。」公は之に従う。紹は兵の渡るを聞き、即ち兵を分かちて西のかた之に応ず。公は乃ち軍を引きて兼行し白馬に趣き、未だ至らざること十余里にして、良は大いに驚き、来たりて逆え戦う。張遼・関羽をして前みて登らしめ、撃破し、良を斬る。遂に白馬の囲みを解き、其の民を徙し、河に循いて西す。紹は是に於いて河を渡りて公の軍を追い、延津の南に至る。公は兵を勒して南阪の下に駐営し、塁に登りて之を望ましむるに、曰く、「五六百騎ばかりならん。」頃く有りて、復た白す、「騎は稍く多く、歩兵は勝げて数うべからず。」公曰く、「復た白す勿かれ。」乃ち騎をして鞍を解き馬を放たしむ。是の時、白馬の輜重が道に就く。諸将は敵騎が多ければ、還りて営を保つに如かずと以為う。荀攸曰く、「此れ敵に餌する所以なり、如何ぞ之を去らん！」紹の騎将の文醜は劉備と五六千騎を将いて前後して至る。諸将は復た白す、「馬に上るべし。」公曰く、「未だしなり。」頃く有りて、騎の至ること稍く多く、或いは分かれて輜重に趣く。公曰く、「可なり。」乃ち皆な馬に上る。時に騎は六百に満たざるも、遂に兵を縦ちて撃ち、大いに之を破り、醜を斬る。醜・良は皆な紹の名将なるも、再戦して、悉く禽にし、紹の軍は大いに震う。公は軍を官渡に還す。紹は進みて陽武を保つ。関羽は亡げて劉備に帰す。", "translation": "二月、袁紹は郭図・淳于瓊・顔良を派遣して東郡太守の劉延を白馬に攻めさせ、袁紹自身も兵を率いて黎陽に至り、黄河を渡ろうとした。夏四月、公（曹操）は北上して劉延を救援した。荀攸は公（曹操）に説いて言った、「いま我が軍は兵が少なくて正面からは対抗できませんから、敵の勢力を分散させてこそ勝機が生まれます。公が延津へ進み、兵を渡河させて敵の背後へ向かうかのように見せかければ、袁紹は必ず西へ向かってこれに対応するでしょうから、その後に軽装の精兵で白馬を奇襲し、その不備を突けば、顔良を生け捕りにできます。」公（曹操）はこれに従った。袁紹は兵が渡河すると聞き、ただちに兵を分けて西へ向かいこれに対応した。公（曹操）はそこで軍を率いて倍速の強行軍で白馬へ急行し、まだ十余里手前に達したところで、顔良は大いに驚き、出撃して迎え撃ってきた。張遼・関羽に先陣として突撃させ、これを打ち破り、顔良を斬った。かくて白馬の包囲を解き、その住民を移し、黄河に沿って西へ退いた。袁紹はここにおいて黄河を渡って公（曹操）の軍を追撃し、延津の南に至った。公（曹操）は兵を整えて南の坂の下に陣営を駐め、物見に塁壁へ登って敵情を遠望させると、報告して言った、「五、六百騎ほどです。」しばらくして、再び報告した、「騎兵は次第に増え、歩兵は数え切れません。」公（曹操）は言った、「もう報告するな。」そこで騎兵に命じて馬の鞍を外し、馬を解き放たせた。この時、白馬から運んできた輜重が街道上に並んでいた。諸将は敵の騎兵が多いことから、引き返して陣営に立てこもるに越したことはないと考えた。荀攸は言った、「これこそ敵を釣り寄せる餌なのです、どうしてここを立ち去りましょうか！」袁紹の騎将の文醜が劉備とともに五、六千騎を率いて前後して押し寄せてきた。諸将は再び進言した、「馬に乗るべきです。」公（曹操）は言った、「まだだ。」しばらくすると、到着する敵騎がさらに増え、隊列を離れて輜重へ群がり向かう者が出始めた。公（曹操）は言った、「今だ。」そこで全員が馬に跨がった。この時、味方の騎兵は六百に満たなかったが、そのまま兵を解き放って突撃し、これを大いに打ち破って、文醜を斬った。文醜・顔良はいずれも袁紹の名将であったが、二度の戦いでことごとく討ち取ったため、袁紹の軍は大いに動揺した。公（曹操）は軍を官渡へ帰還させた。袁紹は進んで陽武に拠った。関羽は出奔して劉備のもとへ帰参した。", "persons": "袁紹,郭図,淳于瓊,顔良,劉延,曹操,荀攸,張遼,関羽,文醜,劉備", "places": "東郡,白馬,黎陽,黄河,延津,官渡,陽武", "era_year": "建安5年（200年）2月〜4月", "source_book": "", "keywords": "", "raw_tagged": "二月，{{person:袁紹|紹}}遣{{person:郭図|郭圖}}、{{person:淳于瓊|淳于瓊}}、{{person:顔良|顏良}}攻{{place:東郡|東郡}}{{office:太守|太守}}{{person:劉延|劉延}}於{{place:白馬|白馬}}，{{person:袁紹|紹}}引兵至{{place:黎陽|黎陽}}，將渡{{place:黄河|河}}。夏四月，{{person:曹操|公}}北救{{person:劉延|延}}。{{person:荀攸|荀攸}}說{{person:曹操|公}}曰：「今兵少不敵，分其勢乃可。{{person:曹操|公}}到{{place:延津|延津}}，若將渡兵向其後者，{{person:袁紹|紹}}必西應之，然後輕兵襲{{place:白馬|白馬}}，掩其不備，{{person:顔良|顏良}}可禽也。」{{person:曹操|公}}從之。{{person:袁紹|紹}}聞兵渡，即分兵西應之。{{person:曹操|公}}乃引軍兼行趣{{place:白馬|白馬}}，未至十餘里，{{person:顔良|良}}大驚，來逆戰。使{{person:張遼|張遼}}、{{person:関羽|關羽}}前登，擊破，斬{{person:顔良|良}}。遂解{{place:白馬|白馬}}圍，徙其民，循{{place:黄河|河}}而西。{{person:袁紹|紹}}於是渡{{place:黄河|河}}追{{person:曹操|公}}軍，至{{place:延津|延津}}南。{{person:曹操|公}}勒兵駐營南阪下，使登壘望之，曰：「可五六百騎。」有頃，復白：「騎稍多，步兵不可勝數。」{{person:曹操|公}}曰：「勿復白。」乃令騎解鞍放馬。是時，{{place:白馬|白馬}}輜重就道。諸將以爲敵騎多，不如還保營。{{person:荀攸|荀攸}}曰：「此所以餌敵，如何去之！」{{person:袁紹|紹}}騎將{{person:文醜|文醜}}與{{person:劉備|劉備}}將五六千騎前後至。諸將復白：「可上馬。」{{person:曹操|公}}曰：「未也。」有頃，騎至稍多，或分趣輜重。{{person:曹操|公}}曰：「可矣。」乃皆上馬。時騎不滿六百，遂縱兵擊，大破之，斬{{person:文醜|醜}}。{{person:文醜|醜}}、{{person:顔良|良}}皆{{person:袁紹|紹}}名將也，再戰，悉禽，{{person:袁紹|紹}}軍大震。{{person:曹操|公}}還軍{{place:官渡|官渡}}。{{person:袁紹|紹}}進保{{place:陽武|陽武}}。{{person:関羽|關羽}}亡歸{{person:劉備|劉備}}。", "kakikudashi_tagged": "二月、{{person:袁紹|紹}}は{{person:郭図|郭図}}・{{person:淳于瓊|淳于瓊}}・{{person:顔良|顔良}}を遣わして{{place:東郡|東郡}}{{office:太守|太守}}の{{person:劉延|劉延}}を{{place:白馬|白馬}}に攻めしめ、{{person:袁紹|紹}}は兵を引きて{{place:黎陽|黎陽}}に至り、将に{{place:黄河|河}}を渡らんとす。夏四月、{{person:曹操|公}}は北のかた{{person:劉延|延}}を救う。{{person:荀攸|荀攸}}が{{person:曹操|公}}に説きて曰く、「今、兵少なくして敵せざれば、其の勢いを分かちて乃ち可なり。{{per 破り、{{person:顔良|顔良}}を斬った。かくて{{place:白馬|白馬}}の包囲を解き、その住民を移し、{{place:黄河|黄河}}に沿って西へ退いた。{{person:袁紹|袁紹}}はここにおいて{{place:黄河|黄河}}を渡って{{person:曹操|公}}（{{person:曹操|曹操}}）の軍を追撃し、{{place:延津|延津}}の南に至った。{{person:曹操|公}}（{{person:曹操|曹操}}）は兵を整えて南の坂の下に陣営を駐め、物見に塁壁へ登って敵情を遠望させると、報告して言った、「五、六百騎ほどです。」しばらくして、再び報告した、「騎兵は次第に増え、歩兵は数え切れません。」{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、「もう報告するな。」そこで騎兵に命じて馬の鞍を外し、馬を解き放たせた。この時、{{place:白馬|白馬}}から運んできた輜重が街道上に並んでいた。諸将は敵の騎兵が多いことから、引き返して陣営に立てこもるに越したことはないと考えた。{{person:荀攸|荀攸}}は言った、「これこそ敵を釣り寄せる餌なのです、どうしてここを立ち去りましょうか！」{{person:袁紹|袁紹}}の騎将の{{person:文醜|文醜}}が{{person:劉備|劉備}}とともに五、六千騎を率いて前後して押し寄せてきた。諸将は再び進言した、「馬に乗るべきです。」{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、「まだだ。」しばらくすると、到着する敵騎がさらに増え、隊列を離れて輜重へ群がり向かう者が出始めた。{{person:曹操|公}}（{{person:曹操|曹操}}）は言った、「今だ。」そこで全員が馬に跨がった。この時、味方の騎兵は六百に満たなかったが、そのまま兵を解き放って突撃し、これを大いに打ち破って、{{person:文醜|文醜}}を斬った。{{person:文醜|文醜}}・{{person:顔良|顔良}}はいずれも{{person:袁紹|袁紹}}の名将であったが、二度の戦いでことごとく討ち取ったため、{{person:袁紹|袁紹}}の軍は大いに動揺した。{{person:曹操|公}}（{{person:曹操|曹操}}）は軍を{{place:官渡|官渡}}へ帰還させた。{{person:袁紹|袁紹}}は進んで{{place:陽武|陽武}}に拠った。{{person:関羽|関羽}}は出奔して{{person:劉備|劉備}}のもとへ帰参した。"}, {"id": "v1_p48_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 48, "type": "本文", "raw_text": "八月，紹連營稍前，依沙塠爲屯，東西數十里。公亦分營與相當，合戰不利。", "kakikudashi": "八月、紹は営を連ねて稍く前み、沙塠に依りて屯を為し、東西数十里なり。公も亦た営を分かちて与に相当たり、合戦するも利あらず。", "translation": "八月、袁紹は陣営を連ねてじわじわと前進し、沙塠に拠って陣を構え、東西数十里にわたった。公（曹操）もまた陣営を分けてこれと対峙し、交戦したが戦況は不利であった。", "persons": "袁紹,曹操", "places": "沙塠", "era_year": "建安5年（200年）8月", "source_book": "", "keywords": "", "raw_tagged": "八月，{{person:袁紹|紹}}連營稍前，依{{place:沙塠|沙塠}}爲屯，東西數十里。{{person:曹操|公}}亦分營與相當，合戰不利。", "kakikudashi_tagged": "八月、{{person:袁紹|紹}}は営を連ねて稍く前み、{{place:沙塠|沙塠}}に依りて屯を為し、東西数十里なり。{{person:曹操|公}}も亦た営を分かちて与に相当たり、合戦するも利あらず。", "translation_tagged": "八月、{{person:袁紹|袁紹}}は陣営を連ねてじわじわと前進し、{{place:沙塠|沙塠}}に拠って陣を構え、東西数十里にわたった。{{person:曹操|公}}（{{person:曹操|曹操}}）もまた陣営を分けてこれと対峙し、交戦したが戦況は不利であった。"}, {"id": "v1_p48_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 48, "type": "裴注", "raw_text": "習鑿齒《漢晉春秋》曰：許攸說紹曰：「公無與操相攻也。急分諸軍持之，而徑從他道迎天子，則事立濟矣。」紹不從，曰：「吾要當先圍取之。」攸怒。", "kakikudashi": "習鑿歯の『漢晋春秋』に曰く、許攸が紹に説きて曰く、「公は操と相攻むる無きなり。急ぎ諸軍を分かちて之を持し、径ちに他道より天子を迎えなば、則ち事は立ちどころに済らん。」紹は従わずして曰く、「吾は要ず当に先ず囲みて之を取るべし。」攸は怒る。", "translation": "習鑿歯の『漢晋春秋』にいう、許攸が袁紹に説いて言った、「公よ、曹操と攻め合ってはなりません。急いで諸軍を分けてこれを釘付けにしておき、ただちに別道から天子を迎え入れれば、大業はたちどころに成就いたしましょう。」袁紹は従わずに言った、「私は何としてもまず奴を包囲して討ち取らねばならぬ。」許攸は怒った。", "persons": "習鑿歯,許攸,袁紹,曹操,献帝", "places": "", "era_year": "建安5年（200年）8月", "source_book": "漢晋春秋", "keywords": "", "raw_tagged": "{{person:習鑿歯|習鑿齒}}{{special:引用史料|《漢晉春秋》}}曰：{{person:許攸|許攸}}說{{person:袁紹|紹}}曰：「公無與{{person:曹操|操}}相攻也。急分諸軍持之，而徑從他道迎{{person:献帝|天子}}，則事立濟矣。」{{person:袁紹|紹}}不從，曰：「吾要當先圍取之。」{{person:許攸|攸}}怒。", "kakikudashi_tagged": "{{person:習鑿歯|習鑿歯}}の{{special:引用史料|『漢晋春秋』}}に曰く、{{person:許攸|許攸}}が{{person:袁紹|紹}}に説きて曰く、「公は{{person:曹操|操}}と相攻むる無きなり。急ぎ諸軍を分かちて之を持し、径ちに他道より{{person:献帝|天子}}を迎えなば、則ち事は立ちどころに済らん。」{{person:袁紹|紹}}は従わずして曰く、「吾は要ず当に先ず囲みて之を取るべし。」{{person:許攸|攸}}は怒る。", "translation_tagged": "{{person:習鑿歯|習鑿歯}}の{{special:引用史料|『漢晋春秋』}}にいう、{{person:許攸|許攸}}が{{person:袁紹|袁紹}}に説いて言った、「公よ、{{person:曹操|曹操}}と攻め合ってはなりません。急いで諸軍を分けてこれを釘付けにしておき、ただちに別道から{{person:献帝|天子}}を迎え入れれば、大業はたちどころに成就いたしましょう。」{{person:袁紹|袁紹}}は従わずに言った、「私は何としてもまず奴を包囲して討ち取らねばならぬ。」{{person:許攸|許攸}}は怒った。"}, {"id": "v1_p48_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 48, "type": "本文", "raw_text": "時公兵不滿萬，傷者十二三。", "kakikudashi": "時に公の兵は万に満たず、傷つく者は十に二三なり。", "translation": "この時、公（曹操）の兵は一万に満たず、負傷した者は十人のうち二、三人にのぼった。", "persons": "曹操", "places": "", "era_year": "建安5年（200年）8月〜9月", "source_book": "", "keywords": "", "raw_tagged": "時{{person:曹操|公}}兵不滿萬，傷者十二三。", "kakikudashi_tagged": "時に{{person:曹操|公}}の兵は万に満たず、傷つく者は十に二三なり。", "translation_tagged": "この時、{{person:曹操|公}}（{{person:曹操|曹操}}）の兵は一万に満たず、負傷した者は十人のうち二、三人にのぼった。"}, {"id": "v1_p48_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 48, "type": "裴注", "raw_text": "臣松之以爲魏武初起兵，已有衆五千，自後百戰百勝，敗者十二三而已矣。但一破黃巾，受降卒三十餘萬，餘所吞并，不可悉紀；雖征戰損傷，未應如此之少也。夫結營相守，異於摧鋒決戰。本紀云：「紹衆十餘萬，屯營東西數十里。」魏太祖雖機變無方，略不世出，安有以數千之兵，而得逾時相抗者哉？以理而言，竊謂不然。紹爲屯數十里，公能分營與相當，此兵不得甚少，一也。紹若有十倍之衆，理應當悉力圍守，使出入斷絕，而公使徐晃等擊其運車，公又自出擊淳于瓊等，揚旌往還，曾無抵閡，明紹力不能制，是不得甚少，二也。諸書皆云公坑紹衆八萬，或云七萬。夫八萬人奔散，非八千人所能縛，而紹之大衆皆拱手就戮，何緣力能制之？是不得甚少，三也。將記述者欲以少見奇，非其實錄也。按《鍾繇傳》云：「公與紹相持，繇爲司隷，送馬二千餘匹以給軍。」本紀及《世語》並云公時有騎六百餘匹，繇馬爲安在哉？", "kakikudashi": "臣松之以為えらく、魏武が初めて兵を起こせしとき、已に衆五千有り、自後百戦百勝し、敗れし者は十に二三なるのみ。但だ一たび黄巾を破りしのみにても、降卒三十余万を受け、余の呑并せし所は、悉くは紀すべからず。征戦して損傷すと雖も、未だ応に此の如くの少なきにはあらざるべきなり。夫れ営を結びて相守るは、鋒を摧きて決戦するとは異なる。本紀に云う、「紹の衆は十余万、屯営は東西数十里なり。」魏の太祖は機変に方無く、略は不世出なりと雖も、安んぞ数千の兵を以てして、時を逾えて相抗するを得る者有らんや？理を以てして言わば、窃かに謂えらく然らずと。紹は屯を為すこと数十里にして、公が能く営を分かちて与に相当たるは、此れ兵の甚だしくは少なきを得ざること、一なり。紹に若し十倍の衆有らば、理として応に当に力を悉くして囲守し、出入をして断絶せしむべきに、公が徐晃等をして其の運車を撃たしめ、公も又た自ら出でて淳于瓊等を撃ち、旌を揚げて往還するに、曾て抵閡無きは、紹の力の制する能わざるを明らかにし、是れ甚だしくは少なきを得ざること、二なり。諸書は皆な公が紹の衆八万を坑にすと云い、或いは七万と云う。夫れ八万人が奔散せば、八千人の能く縛する所に非ざるに、紹の大衆が皆な手を拱きて戮に就きしは、何に縁りてか力の能く之を制せんや？是れ甚だしくは少なきを得ざること、三なり。将た記述する者が少なきを以て奇を見さんと欲せしものにして、其の実録に非ざるなり。『鍾繇伝』を按ずるに云う、「公が紹と相持するや、繇は司隷と為り、馬二千余匹を送りて以て軍に給す。」本紀及び『世語』は並びに公に時に騎六百余匹有りと云うも、繇の馬は安くに在りと為すや？", "translation": "臣松之（裴松之）が考えるに、魏の武帝（曹操）が初めて挙兵した際、すでに五千の軍勢があり、その後は百戦百勝して、敗れた戦いは十のうち二、三に過ぎなかった。ただ一度黄巾を打ち破っただけでも、三十余万の降伏兵を受け入れており、その他に併合した勢力はすべてを書き尽くせないほどである。転戦によって損耗したとはいえ、これほどまでに少なくなるはずがないのである。そもそも陣営を連ねて対峙し守備し合う戦いは、敵の切っ先を挫いて一挙に決戦するのとは訳が違う。本紀には「袁紹の軍勢は十余万で、陣営は東西数十里にわたった」という。魏の太祖（曹操）がどれほど臨機応変の妙計に富み、不世出の軍略を備えていたとしても、どうして数千の兵だけで季節を越えて対抗し続けることなどできようか？道理をもって考えるに、私見では決してそうではないと思われる。袁紹が数十里にわたって布陣したのに対し、公（曹操）が陣営を分けてこれと正面から対峙できた以上、兵力が極端に少なかったはずはないというのが、第一の理由である。もし袁紹に十倍もの軍勢があったならば、道理からして当然全力を挙げて包囲・封鎖し、出入りを完全に遮断していたはずであるのに、公（曹操）が徐晃らを遣わしてその輸送車を襲撃させ、また公（曹操）自身も出撃して淳于瓊らを討ち、軍旗を掲げて行き来しても少しも阻まれることがなかったのは、袁紹の兵力では抑え込めなかったことを物語っており、兵力が極端に少なかったはずはないというのが、第二の理由である。諸々の史書はいずれも公（曹操）が袁紹の軍勢八万を生き埋めにしたと記し、あるいは七万とも記している。そもそも八万人もの兵が逃げ散ったならば、到底八千人程度で捕縛できるものではないのに、袁紹の大軍がみな手をこまねいて処刑に服したのは、どうして寡兵の力でこれを制圧できたであろうか？兵力が極端に少なかったはずはないというのが、第三の理由である。おそらく記録者が兵数を少なく書くことで奇抜な戦果を際立たせようとしたのであって、事実をありのままに記した実録ではないのである。『鍾繇伝』を調べてみると、「公（曹操）が袁紹と対峙していた際、鍾繇は司隷校尉を務めており、馬二千余匹を送って軍に供給した」という。本紀および『世語』はいずれも当時公（曹操）には騎馬が六百余匹しかなかったと記しているが、鍾繇が送った馬はいったい （曹操）もまた陣営の内部でこれを作って対抗した。袁紹軍が陣営の中へ矢を射かけると、矢は雨のように降り注ぎ、陣中を行き来する者はみな楯を頭上にかざして歩き、将兵は大いに怯えた。この時、公（曹操）は兵糧が乏しくなったため、荀彧に書簡を送り、許へ撤退しようと相談した。荀彧は考えて言った、「袁紹は全軍を挙げて官渡に集結させ、公と勝敗を決しようとしております。公は最も弱小な兵力をもって最も強大な敵に立ち向かっておられ、もしここで抑え込むことができなければ、必ず敵に付け込まれることになりましょうから、これこそ天下の命運を分ける重大な転機であります。しかも袁紹は、一介の在野の英雄に過ぎず、人を集めることはできても使いこなすことはできません。そもそも公の神武と明哲をもって、さらに天子を奉じる大義の順理を後ろ盾とされるならば、どこへ向かおうと成し遂げられないことがありましょうか！」公（曹操）はこれに従った。", "persons": "袁紹,曹操,荀彧", "places": "官渡,許", "era_year": "建安5年（200年）8月〜9月", "source_book": "", "keywords": "", "raw_tagged": "{{person:袁紹|紹}}復進臨{{place:官渡|官渡}}，起土山地道。{{person:曹操|公}}亦於內作之，以相應。{{person:袁紹|紹}}射營中，矢如雨下，行者皆蒙楯，衆大懼。時{{person:曹操|公}}糧少，與{{person:荀彧|荀彧}}書，議欲還{{place:許|許}}。{{person:荀彧|彧}}以爲「{{person:袁紹|紹}}悉衆聚{{place:官渡|官渡}}，欲與{{person:曹操|公}}決勝敗。{{person:曹操|公}}以至弱當至彊，若不能制，必爲所乘，是天下之大機也。且{{person:袁紹|紹}}，布衣之雄耳，能聚人而不能用。夫以{{person:曹操|公}}之神武明哲而輔以大順，何向而不濟！」{{person:曹操|公}}從之。", "kakikudashi_tagged": "{{person:袁紹|紹}}は復た進みて{{place:官渡|官渡}}に臨み、土山・地道を起こす。{{person:曹操|公}}も亦た内に於いて之を作り、以て相応ず。{{person:袁紹|紹}}が営中を射るに、矢は雨の如く下り、行く者は皆な楯を蒙り、衆は大いに懼る。時に{{person:曹操|公}}は糧少なく、{{person:荀彧|荀彧}}に書を与え、議して{{place:許|許}}に還らんと欲す。{{person:荀彧|彧}}以為えらく、「{{person:袁紹|紹}}は衆を悉くして{{place:官渡|官渡}}に聚め、{{person:曹操|公}}と勝敗を決せんと欲す。{{person:曹操|公}}は至弱を以て至彊に当たり、若し制する能わずんば、必ず乗ずる所と為らん、是れ天下の大機なり。且つ{{person:袁紹|紹}}は、布衣の雄なるのみ、能く人を聚むれども用うる能わず。夫れ{{person:曹操|公}}の神武明哲を以てして輔くるに大順を以てせば、何れに向かいてか済らざらん！」{{person:曹操|公}}は之に従う。", "translation_tagged": "{{person:袁紹|袁紹}}は再び前進して{{place:官渡|官渡}}に迫り、土山を築き地下道を掘った。{{person:曹操|公}}（{{person:曹操|曹操}}）もまた陣営の内部でこれを作って対抗した。{{person:袁紹|袁紹}}軍が陣営の中へ矢を射かけると、矢は雨のように降り注ぎ、陣中を行き来する者はみな楯を頭上にかざして歩き、将兵は大いに怯えた。この時、{{person:曹操|公}}（{{person:曹操|曹操}}）は兵糧が乏しくなったため、{{person:荀彧|荀彧}}に書簡を送り、{{place:許|許}}へ撤退しようと相談した。{{person:荀彧|荀彧}}は考えて言った、「{{person:袁紹|袁紹}}は全軍を挙げて{{place:官渡|官渡}}に集結させ、{{person:曹操|公}}と勝敗を決しようとしております。{{person:曹操|公}}は最も弱小な兵力をもって最も強大な敵に立ち向かっておられ、もしここで抑え込むことができなければ、必ず敵に付け込まれることになりましょうから、これこそ天下の命運を分ける重大な転機であります。しかも{{person:袁紹|袁紹}}は、一介の在野の英雄に過ぎず、人を集めることはできても使いこなすことはできません。そもそも{{person:曹操|公}}の神武と明哲をもって、さらに天子を奉じる大義の順理を後ろ盾 これを撃ち破らせた。{{person:劉備|劉備}}は逃走し、ついに{{person:劉辟|劉辟}}の陣営を撃破した。"}, {"id": "v1_p51_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 51, "type": "本文", "raw_text": "袁紹運穀車數千乘至，公用荀攸計，遣徐晃、史渙邀擊，大破之，盡燒其車。公與紹相拒連月，雖比戰斬將，然衆少糧盡，士卒疲乏。公謂運者曰：「却十五日爲汝破紹，不復勞汝矣。」冬十月，紹遣車運穀，使淳于瓊等五人將兵萬餘人送之，宿紹營北四十里。紹謀臣許攸貪財，紹不能足，來奔，因說公擊瓊等。左右疑之，荀攸、賈詡勸公。公乃留曹洪守，自將步騎五千人夜往，會明至。瓊等望見公兵少，出陳門外。公急擊之，瓊退保營，遂攻之。紹遣騎救瓊。左右或言「賊騎稍近，請分兵拒之」。公怒曰：「賊在背後，乃白！」士卒皆殊死戰，大破瓊等，皆斬之。", "kakikudashi": "袁紹の穀を運ぶ車数千乗が至るや、公は荀攸の計を用い、徐晃・史渙を遣わして邀撃せしめ、大いに之を破り、尽く其の車を焼く。公は紹と相拒ぐこと月を連ね、比りに戦いて将を斬ると雖も、然れども衆は少なく糧は尽き、士卒は疲乏す。公は運ぶ者に謂いて曰く、「却ること十五日にして汝の為に紹を破り、復た汝を労せざらん。」冬十月、紹は車を遣わして穀を運ばしめ、淳于瓊等五人をして兵万余人を将いて之を送らしめ、紹の営の北四十里に宿す。紹の謀臣の許攸は財を貪り、紹は足らしむる能わざれば、来奔し、因りて公に説きて瓊等を撃たしむ。左右は之を疑うも、荀攸・賈詡が公に勧む。公は乃ち曹洪を留めて守らしめ、自ら歩騎五千人を将いて夜に往き、会々明くるころに至る。瓊等は公の兵の少なきを望見し、門外に出でて陳す。公が急に之を撃てば、瓊は退きて営を保ち、遂に之を攻む。紹は騎を遣わして瓊を救わしむ。左右の或るひとが言う、「賊騎は稍く近づく、請うらくは兵を分かちて之を拒がん」と。公は怒りて曰く、「賊が背後に在らば、乃ち白せ！」士卒は皆な殊死して戦い、大いに瓊等を破り、皆な之を斬る。", "translation": "袁紹の兵糧を運ぶ輸送車数千両が到着すると、公（曹操）は荀攸の計略を用い、徐晃・史渙を派遣して待ち伏せ攻撃させ、これを大いに打ち破って、その車をことごとく焼き払った。公（曹操）は袁紹と幾月も対峙し続け、連戦して敵将を斬ったとはいえ、兵は少なく兵糧も尽きかけ、将兵は疲労困憊していた。公（曹操）は輸送にあたる者たちに語って言った、「あと十五日のうちにそなたらのために袁紹を打ち破り、二度とそなたらに苦労はかけまい。」冬十月、袁紹は車を遣わして兵糧を輸送させ、淳于瓊ら五人に兵一万余人を率いてこれを護送させ、袁紹の本営の北四十里の地点に宿営させた。袁紹の謀臣である許攸は財貨に貪欲で、袁紹はその欲を満たしてやることができなかったため、こちらへ出奔してきて、そのまま公（曹操）に淳于瓊らを襲撃するよう説いた。側近たちはこれを疑ったが、荀攸・賈詡が公（曹操）に決行を勧めた。公（曹操）はそこで曹洪を残して本営を守らせ、自ら歩兵・騎兵五千人を率いて夜陰に乗じて進発し、ちょうど夜が明けるころに現地へ到達した。淳于瓊らは公（曹操）の兵が少ないのを遠望し、陣門の外に出て布陣した。公（曹操）がこれを猛攻すると、淳于瓊は退却して陣営に立てこもったため、そのままこれを包囲攻撃した。袁紹は騎兵を派遣して淳于瓊を救援させた。側近のある者が言った、「敵の騎兵が次第に迫っております、どうか兵を分けてこれを防がせてください」と。公（曹操）は怒って言った、「敵が真後ろに来てから報告せよ！」将兵はみな決死の覚悟で奮戦し、淳于瓊らを大いに打ち破って、ことごとくこれを斬った。", "persons": "袁紹,曹操,荀攸,徐晃,史渙,淳于瓊,許攸,賈詡,曹洪", "places": "", "era_year": "建安5年（200年）9月〜10月", "source_book": "", "keywords": "", "raw_tagged": "{{person:袁紹|袁紹}}運穀車數千乘至，{{person:曹操|公}}用{{person:荀攸|荀攸}}計，遣{{person:徐晃|徐晃}}、{{person:史渙|史渙}}邀擊，大破之，盡燒其車。{{person:曹操|公}}與{{person:袁紹|紹}}相拒連月，雖比戰斬將，然衆少糧盡，士卒疲乏。{{person:曹操|公}}謂運者曰：「却十五日爲汝破{{person:袁紹|紹}}，不復勞汝矣。」冬十月，{{person:袁紹|紹}}遣車運穀，使{{person:淳于瓊|淳 erson:淳于瓊|淳于瓊}}らを襲撃するよう説いた。側近たちはこれを疑ったが、{{person:荀攸|荀攸}}・{{person:賈詡|賈詡}}が{{person:曹操|公}}（{{person:曹操|曹操}}）に決行を勧めた。{{person:曹操|公}}（{{person:曹操|曹操}}）はそこで{{person:曹洪|曹洪}}を残して本営を守らせ、自ら歩兵・騎兵五千人を率いて夜陰に乗じて進発し、ちょうど夜が明けるころに現地へ到達した。{{person:淳于瓊|淳于瓊}}らは{{person:曹操|公}}（{{person:曹操|曹操}}）の兵が少ないのを遠望し、陣門の外に出て布陣した。{{person:曹操|公}}（{{person:曹操|曹操}}）がこれを猛攻すると、{{person:淳于瓊|淳于瓊}}は退却して陣営に立てこもったため、そのままこれを包囲攻撃した。{{person:袁紹|袁紹}}は騎兵を派遣して{{person:淳于瓊|淳于瓊}}を救援させた。側近のある者が言った、「敵の騎兵が次第に迫っております、どうか兵を分けてこれを防がせてください」と。{{person:曹操|公}}（{{person:曹操|曹操}}）は怒って言った、「敵が真後ろに来てから報告せよ！」将兵はみな決死の覚悟で奮戦し、{{person:淳于瓊|淳于瓊}}らを大いに打ち破って、ことごとくこれを斬った。"}, {"id": "v1_p51_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 51, "type": "裴注", "raw_text": "《曹瞞傳》曰：公聞攸來，跣出迎之，撫掌笑曰：「子遠，卿來，吾事濟矣！」旣入坐，謂公曰：「袁氏軍盛，何以待之？今有幾糧乎？」公曰：「尚可支一歲。」攸曰：「無是，更言之！」又曰：「可支半歲。」攸曰：「足下不欲破袁氏邪，何言之不實也！」公曰：「向言戲之耳。其實可一月，爲之柰何？」攸曰：「公孤軍獨守，外無救援而糧穀已盡，此危急之日也。今袁氏輜重有萬餘乘，在故市、烏巢，屯軍無嚴備；今以輕兵襲之，不意而至，燔其積聚，不過三日，袁氏自敗也。」公大喜，乃選精銳步騎，皆用袁軍旗幟，銜枚縛馬口，夜從間道出，人抱束薪，所歷道有問者，語之曰：「袁公恐曹操鈔略後軍，遣兵以益備。」聞者信以爲然，皆自若。旣至，圍屯，大放火，營中驚亂。大破之，盡燔其糧穀寶貨，斬督將眭元進、騎督韓莒子、呂威璜、趙叡等首，割得將軍淳于仲簡鼻，未死，殺士卒千餘人，皆取鼻，牛馬割脣舌，以示紹軍。將士皆怛懼。時有夜得仲簡，將以詣麾下，公謂曰：「何爲如是？」仲簡曰：「勝負自天，何用爲問乎！」公意欲不殺。許攸曰：「明旦鑒於鏡，此益不忘人。」乃殺之。", "kakikudashi": "『曹瞞伝』に曰く、公は攸の来たるを聞くや、跣にして出でて之を迎え、掌を撫して笑いて曰く、「子遠よ、卿が来たりたれば、吾が事は済れり！」既に入りて坐するや、公に謂いて曰く、「袁氏の軍は盛んなり、何を以てか之を待たん？今、幾ばくの糧有りや？」公曰く、「尚お一歳を支うべし。」攸曰く、「是れ無し、更に之を言え！」又た曰く、「半歳を支うべし。」攸曰く、「足下は袁氏を破るを欲せざるか、何ぞ言の不実なるや！」公曰く、「向の言は之に戯れしのみ。其の実は一月ばかりなり、之を為すこと柰何せん？」攸曰く、「公は孤軍にて独り守り、外に救援無くして糧穀は已に尽く、此れ危急の日なり。今、袁氏の輜重は万余乗有りて、故市・烏巣に在り、屯軍に厳備無し。今、軽兵を以て之を襲い、不意にして至り、其の積聚を燔かば、三日を過ぎずして、袁氏は自ら敗れん。」公は大いに喜び、乃ち精鋭の歩騎を選び、皆な袁軍の旗幟を用い、枚を銜み馬口を縛り、夜に間道より出で、人ごとに束薪を抱き、歴る所の道に問う者有らば、之に語りて曰く、「袁公は曹操が後軍を鈔略せんことを恐れ、兵を遣わして以て備えを益さしむ」と。聞く者は信じて然りと以為い、皆な自若たり。既に至るや、屯を囲み、大いに火を放ち、営中は驚乱す。大いに之を破り、尽く其の糧穀・宝貨を燔き、督将の眭元進・騎督の韓莒子・呂威璜・趙叡等の首を斬り、将軍の淳于仲簡の鼻を割き得るも、未だ死せず、士卒千余人を殺して、皆な鼻を取り、牛馬は脣舌を割き、以て紹の軍に示す。将士は皆な怛懼す。時に夜に仲簡を得たる者有り、将いて以て麾下に詣るに、公は謂いて曰く、「何為れぞ是の如きや？」仲簡曰く、「勝負は天よりす、何を用いてか問うを為さん！」公の意は殺さざらんと欲す。許攸曰く、「明旦に鏡に鑒みなば、此れ益々人を忘れざらん。」乃ち之を殺す。", "translation": "『曹瞞伝』にいう、公（曹操）は許攸がやって来たと聞 所歸矣！」乃使{{person:張郃|張郃}}、{{person:高覧|高覽}}攻{{person:曹洪|曹洪}}。{{person:張郃|郃}}等聞{{person:淳于瓊|瓊}}破，遂來降。{{person:袁紹|紹}}衆大潰，{{person:袁紹|紹}}及{{person:袁譚|譚}}棄軍走，渡{{place:黄河|河}}。追之不及，盡收其輜重圖書珎寶，虜其衆。", "kakikudashi_tagged": "{{person:袁紹|紹}}は初め{{person:曹操|公}}の{{person:淳于瓊|瓊}}を撃つを聞くや、長子の{{person:袁譚|譚}}に謂いて曰く、「たとい彼れ{{person:淳于瓊|瓊}}等を攻むとも、吾れ其の営を攻め抜かば、彼れ固より帰する所無からん！」乃ち{{person:張郃|張郃}}・{{person:高覧|高覧}}をして{{person:曹洪|曹洪}}を攻めしむ。{{person:張郃|郃}}等は{{person:淳于瓊|瓊}}の破るるを聞き、遂に来り降る。{{person:袁紹|紹}}の衆は大いに潰え、{{person:袁紹|紹}}及び{{person:袁譚|譚}}は軍を棄てて走り、{{place:黄河|河}}を渡る。之を追うも及ばず、尽く其の輜重・図書・珍宝を収め、其の衆を虜にす。", "translation_tagged": "{{person:袁紹|袁紹}}は初め{{person:曹操|公}}（{{person:曹操|曹操}}）が{{person:淳于瓊|淳于瓊}}を攻撃していると聞くや、長男の{{person:袁譚|袁譚}}に語って言った、「たとえ奴が{{person:淳于瓊|淳于瓊}}らを攻めようとも、私がその本営を攻め落とせば、奴にはもともと帰る場所がなくなるのだ！」そこで{{person:張郃|張郃}}・{{person:高覧|高覧}}に命じて{{person:曹洪|曹洪}}を攻撃させた。{{person:張郃|張郃}}らは{{person:淳于瓊|淳于瓊}}が敗れたと聞くと、ついに投降してきた。{{person:袁紹|袁紹}}の軍勢は大潰走し、{{person:袁紹|袁紹}}および{{person:袁譚|袁譚}}は軍を棄てて逃走し、{{place:黄河|黄河}}を渡った。これを追撃したが追いつけず、その輜重・図書・珍宝をことごとく接収し、その兵衆を捕虜とした。"}, {"id": "v1_p51_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 51, "type": "裴注", "raw_text": "《獻帝起居注》曰：公上言「大將軍鄴侯袁紹前與冀州牧韓馥立故大司馬劉虞，刻作金璽，遣故任長畢瑜詣虞，爲說命錄之數。又紹與臣書云：『可都鄄城，當有所立。』擅鑄金銀印，孝廉計吏，皆往詣紹。從弟濟陰太守敘與紹書云：『今海內喪敗，天意實在我家，神應有徵，當在尊兄。南兄臣下欲使即位，南兄言，以年則北兄長，以位則北兄重。便欲送璽，會曹操斷道。』紹宗族累世受國重恩，而凶逆無道，乃至於此。輙勒兵馬，與戰官渡，乘聖朝之威，得斬紹大將淳于瓊等八人首，遂大破潰。紹與子譚輕身迸走。凡斬首七萬餘級，輜重財物巨億。」", "kakikudashi": "『献帝起居注』に曰く、公は上言すらく、「大将軍・鄴侯の袁紹は、前に冀州牧の韓馥と故の大司馬の劉虞を立てんと、金璽を刻作し、故の任長の畢瑜を遣わして虞に詣らしめ、為に命録の数を説かしむ。又た紹は臣に書を与えて云わく、『鄄城に都すべし、当に立つる所有るべし。』擅ままに金銀の印を鋳て、孝廉・計吏は、皆な往きて紹に詣る。従弟の済陰太守の叙が紹に書を与えて云わく、『今、海内は喪敗し、天意は実に我が家に在り、神応に徴有りて、当に尊兄に在るべし。南兄の臣下は位に即かしめんと欲するも、南兄は言う、年を以てすれば則ち北兄が長じ、位を以てすれば則ち北兄が重しと。便ち璽を送らんと欲するも、会たま曹操が道を断つ。』紹の宗族は累世に国の重恩を受くるも、凶逆無道なること、乃ち此に至る。輒ち兵馬を勒し、与に官渡に戦い、聖朝の威に乗じ、紹の大将の淳于瓊等八人の首を斬るを得て、遂に大いに破り潰えしむ。紹と子の譚とは軽身にて迸走す。凡そ斬首は七万余級、輜重・財物は巨億なり。」", "translation": "『献帝起居注』にいう、公（曹操）は上言して申し上げた、「大将軍・鄴侯の袁紹は、以前、冀州牧の韓馥とともに故の大司馬・劉虞を擁立しようと企て、黄金の玉璽を彫り作り、もとの任県長の畢瑜を劉虞のもとへ派遣して、そのために天命・図録の運数を説かせました。また袁紹は臣に書簡を送って申しました、『鄄城に都を置くがよい、新たに擁立すべき方があるのだ。』ほしいままに金印・銀印を鋳造し、諸郡の孝廉や計吏は、みな袁紹のもとへ赴きました。従弟の済陰太守・袁叙が袁紹に送った書簡にはこう申しております、『いま天下は荒廃し、天意はまことに我が一門にあり、神の感応にも瑞徴が現れており、まさに尊兄のもとにあるはずです。南兄の臣下たちは帝位に即かせようと望みましたが、南兄は申しました、年齢からいえば北兄が年長であり、官位からいえば北兄が重いと。そこで玉璽を送ろうといたしましたが、折しも曹操が街道を遮断いたしました。』袁紹の一族は代々にわたって国の厚い恩恵を受けながら、凶悪不道な振る舞いは、ついにこれほどの極みに達しました。ただちに兵馬を統率し、これと官渡で戦い、聖朝の御稜威に乗じて、袁紹の大将・淳于瓊ら八人の首を斬ることができ、ついに大いに打ち破って潰滅させました。袁紹と子の袁譚は身一つで逃げ散りました。すべて斬首した数は七万余級、輜重や財物は巨億にのぼります。」", "persons": "曹操,袁紹,韓馥,劉虞,畢瑜,袁叙,袁術,淳于瓊,袁譚", "places": "鄴,冀州,任,鄄城,済陰,官渡", "era_year": "建安5年（200年）10月", "source_book": "献帝起居注", "keywords": "大将軍,列侯,牧,大司馬,県長,孝廉,計吏,太守", "raw_tagged": "{{special:引用史料|《獻帝起居注》}}曰：{{person:曹操|公}}上言「{{office:大将軍|大將軍}}{{place:鄴|鄴}}{{office:列侯|侯}}{{person:袁紹|袁紹}}前與{{place:冀州|冀州}}{{office:牧|牧}}{{person:韓馥|韓馥}}立故{{office:大司馬|大司馬}}{{person:劉虞|劉虞}}，刻作金璽，遣故{{place:任|任}}{{office:県長|長}}{{person:畢瑜|畢瑜}}詣{{person:劉虞|虞}}，爲說命錄之數。又{{person:袁紹|紹}}與臣書云：『可都{{place:鄄城|鄄城}}，當有所立。』擅鑄金銀印，{{office:孝廉|孝廉}}{{office:計吏|計吏}}，皆往詣{{person:袁紹|紹}}。從弟{{place:済陰|濟陰}}{{office:太守|太守}}{{person:袁叙|敘}}與{{person:袁紹|紹}}書云：『今海內喪敗，天意實在我家，神應有徵，當在{{person:袁紹|尊兄}}。{{person:袁術|南兄}}臣下欲使即位，{{person:袁術|南兄}}言，以年則{{person:袁紹|北兄}}長，以位則{{person:袁紹|北兄}}重。便欲送璽，會{{person:曹操|曹操}}斷道。』{{person:袁紹|紹}}宗族累世受國重恩，而凶逆無道，乃至於此。輙勒兵馬，與戰{{place:官渡|官渡}}，乘聖朝之威，得斬{{person:袁紹|紹}}大將{{person:淳于瓊|淳于瓊}}等八人首，遂大破潰。{{person:袁紹|紹}}與子{{person:袁譚|譚}}輕身迸走。凡斬首七萬餘級，輜重財物巨億。」", "kakikudashi_tagged": "{{special:引用史料|『献帝起居注』}}に曰く、{{person:曹操|公}}は上言すらく、「{{office:大将軍|大将軍}}・{{place:鄴|鄴}}{{office:列侯|侯}}の{{person:袁紹|袁紹}}は、前に{{place:冀州|冀州}}{{office:牧|牧}}の{{person:韓馥|韓馥}}と故の{{office:大司馬|大司馬}}の{{person:劉虞|劉虞}}を立てんと、金璽を刻作し、故の{{place:任|任}}{{office:県長|長}}の{{person:畢瑜|畢瑜}}を遣わして{{person:劉虞|虞}}に詣らしめ、為に命録の数を説かしむ。又た{{person:袁紹|紹}}は臣に書を与えて云わく、『{{place:鄄城|鄄城}}に都すべし、当に立つる所有るべし。』擅ままに金銀の印を鋳て、{{office:孝廉|孝廉}}・{{office:計吏|計吏}}は、皆な往きて{{person:袁紹|紹}}に詣る。従弟の{{place:済陰|済陰}}{{office:太守|太守}}の{{person:袁叙|叙}}が{{person:袁紹|紹}}に書を与えて云わく、『今、海内は喪敗し、天意は実に我が家に在り、神応に徴有りて、当に{{person:袁紹|尊兄}}に在るべし。{{person:袁術|南兄}}の臣下は位に即かしめんと欲するも、{{person:袁術|南
