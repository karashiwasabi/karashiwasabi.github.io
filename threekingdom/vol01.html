rson:曹操|公}}（{{person:曹操|曹操}}）は{{person:袁紹|袁紹}}の文書を接収した際、{{place:許|許都}}および自軍の中の者が送っていた書簡を手に入れたが、すべてこれを焼き捨てた。"}, {"id": "v1_p51_6", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 51, "type": "裴注", "raw_text": "《魏氏春秋》曰：公云：「當紹之彊，孤猶不能自保，而況衆人乎！」", "kakikudashi": "『魏氏春秋』に曰く、公は云わく、「紹の強きに当たりては、孤すら猶お自ら保つ能わず、而るを況んや衆人をや！」", "translation": "『魏氏春秋』にいう、公（曹操）は語った、「袁紹が強盛であった時には、この私でさえわが身を保てるか分からなかったのだ、まして一般の者たちならなおさらであろう！」", "persons": "曹操,袁紹", "places": "", "era_year": "建安5年（200年）10月", "source_book": "魏氏春秋", "keywords": "", "raw_tagged": "{{special:引用史料|《魏氏春秋》}}曰：{{person:曹操|公}}云：「當{{person:袁紹|紹}}之彊，{{person:曹操|孤}}猶不能自保，而況衆人乎！」", "kakikudashi_tagged": "{{special:引用史料|『魏氏春秋』}}に曰く、{{person:曹操|公}}は云わく、「{{person:袁紹|紹}}の強きに当たりては、孤すら猶お自ら保つ能わず、而るを況んや衆人をや！」", "translation_tagged": "{{special:引用史料|『魏氏春秋』}}にいう、{{person:曹操|公}}（{{person:曹操|曹操}}）は語った、「{{person:袁紹|袁紹}}が強盛であった時には、この私でさえわが身を保てるか分からなかったのだ、まして一般の者たちならなおさらであろう！」"}, {"id": "v1_p51_7", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 51, "type": "本文", "raw_text": "冀州諸郡多舉城邑降者。", "kakikudashi": "冀州の諸郡には城邑を挙げて降る者多し。", "translation": "冀州の諸郡では城邑を挙げて降伏してくる者が多かった。", "persons": "", "places": "冀州", "era_year": "建安5年（200年）冬", "source_book": "", "keywords": "", "raw_tagged": "{{place:冀州|冀州}}諸郡多舉城邑降者。", "kakikudashi_tagged": "{{place:冀州|冀州}}の諸郡には城邑を挙げて降る者多し。", "translation_tagged": "{{place:冀州|冀州}}の諸郡では城邑を挙げて降伏してくる者が多かった。"}, {"id": "v1_p52_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 52, "type": "本文", "raw_text": "初，桓帝時有黃星見於楚、宋之分，遼東殷馗", "kakikudashi": "初め、桓帝の時に黄星有りて楚・宋の分に見われ、遼東の殷馗は", "translation": "かつて、桓帝の時代に黄星が楚・宋の分野に現れ、遼東の殷馗は", "persons": "桓帝,殷馗", "places": "楚,宋,遼東", "era_year": "桓帝期（150年頃）", "source_book": "", "keywords": "黄星", "raw_tagged": "初，{{person:桓帝|桓帝}}時有{{special:黄星|黃星}}見於{{place:楚|楚}}、{{place:宋|宋}}之分，{{place:遼東|遼東}}{{person:殷馗|殷馗}}", "kakikudashi_tagged": "初め、{{person:桓帝|桓帝}}の時に{{special:黄星|黄星}}有りて{{place:楚|楚}}・{{place:宋|宋}}の分に見われ、{{place:遼東|遼東}}の{{person:殷馗|殷馗}}は", "translation_tagged": "かつて、{{person:桓帝|桓帝}}の時代に{{special:黄星|黄星}}が{{place:楚|楚}}・{{place:宋|宋}}の分野に現れ、{{place:遼東|遼東}}の{{person:殷馗|殷馗}}は"}, {"id": "v1_p52_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 52, "type": "裴注", "raw_text": "馗，古逵字，見三蒼。", "kakikudashi": "馗は、古の逵の字なり、『三蒼』に見ゆ。", "translation": "「馗」は、古の「逵」の字であり、『三蒼』に見える。", "persons": "", "places": "", "era_year": "", "source_book": "三蒼", "keywords": "三蒼", "raw_tagged": "馗，古逵字，見{{special:三蒼|三蒼}}。", "kakikudashi_tagged": "馗は、古の逵の字なり、{{special:三蒼|『三蒼』}}に見ゆ。", "translation_tagged": "「馗」は、古の「逵」の字であり、{{special:三蒼|『三蒼』}}に見える。"}, {"id": "v1_p52_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 52, "type": "本文", "raw_text": "善天文，言後五十歲當有真人起於梁、沛之閒，其鋒不可當。至是凡五十年，而公破紹，天下莫敵矣。", "kakikudashi": "天文を善くし、後五十歳にして当に真人の梁・沛の間に起こる有るべく、其の鋒は当たるべからずと言う。是に至りて凡そ五十年、而して公は紹を破り、天下に敵する莫し。", "translation": "天文に精通し、五十年後にきっと真人が梁・沛の間から興り、その鋒先には誰も立ち向かえないであろうと語った。この時に至るまでおよそ五十年となり、公（曹操）は袁紹を打ち破って、天下に敵する者はいなくなったのである。", "persons": "曹操,袁紹", "places": "梁国,沛国", "era_year": "建安5年（200年）", "source_book": "", "keywords": "", "raw_tagged": "善天文，言後五十歲當有真人起於{{place:梁国|梁}}、{{place:沛国|沛}}之閒，其鋒不可當。至是凡五十年，而{{person:曹操|公}}破{{person:袁紹|紹}}，天下莫敵矣。", "kakikudashi_tagged": "天文を善くし、後五十歳にして当に真人の{{place:梁国|梁}}・{{place:沛国|沛}}の間に起こる有るべく、其の鋒は当たるべからずと言う。是に至りて凡そ五十年、而して{{person:曹操|公}}は{{person:袁紹|紹}}を破り、天下に敵する莫し。", "translation_tagged": "天文に精通し、五十年後にきっと真人が{{place:梁国|梁}}・{{place:沛国|沛}}の間から興り、その鋒先には誰も立ち向かえないであろうと語った。この時に至るまでおよそ五十年となり、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{person:袁紹|袁紹}}を打ち破って、天下に敵する者はいなくなったのである。"}, {"id": "v1_p53_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 53, "type": "本文", "raw_text": "六年夏四月，揚兵河上，擊紹倉亭軍，破之。紹歸，復收散卒，攻定諸叛郡縣。九月，公還許。紹之未破也，使劉備略汝南，汝南賊共都等應之。遣蔡揚擊都，不利，爲都所破。公南征備。備聞公自行，走奔劉表，都等皆散。", "kakikudashi": "六年夏四月、兵を河上に揚げ、紹の倉亭の軍を撃ちて、之を破る。紹は帰り、復た散卒を収め、諸々の叛ける郡県を攻め定む。九月、公は許に還る。紹の未だ破れざるや、劉備をして汝南を略せしめ、汝南の賊の共都等が之に応ず。蔡揚を遣わして都を撃たしむるも、利あらず、都の破る所と為る。公は南のかた備を征す。備は公の自ら行くを聞くや、走りて劉表に奔り、都等は皆な散ず。", "translation": "六年夏四月、黄河のほとりで軍勢の威を示し、袁紹の倉亭の軍を攻撃して、これを打ち破った。袁紹は帰還すると、再び敗残の兵を収容し、離反した諸郡県を攻めて平定した。九月、公（曹操）は許へ帰還した。袁紹がまだ敗れる前、劉備を派遣して汝南を経略させており、汝南の賊である共都らがこれに呼応した。蔡揚を派遣して共都を攻撃させたが、戦況は不利となり、共都に打ち破られた。公（曹操）は南へ出征して劉備を討った。劉備は公（曹操）が自ら出陣したと聞くや、逃走して劉表のもとへ奔り、共都らはみな離散した。", "persons": "曹操,袁紹,劉備,共都,蔡揚,劉表", "places": "黄河,倉亭,許,汝南", "era_year": "建安6年（201年）4月〜9月", "source_book": "", "keywords": "", "raw_tagged": "六年夏四月，揚兵{{place:黄河|河上}}，擊{{person:袁紹|紹}}{{place:倉亭|倉亭}}軍，破之。{{person:袁紹|紹}}歸，復收散卒，攻定諸叛郡縣。九月，{{person:曹操|公}}還{{place:許|許}}。{{person:袁紹|紹}}之未破也，使{{person:劉備|劉備}}略{{place:汝南|汝南}}，{{place:汝南|汝南}}賊{{person:共都|共都}}等應之。遣{{person:蔡揚|蔡揚}}擊{{person:共都|都}}，不利，爲{{person:共都|都}}所破。{{person:曹操|公}}南征{{person:劉備|備}}。{{person:劉備|備}}聞{{person:曹操|公}}自行，走奔{{person:劉表|劉表}}，{{person:共都|都}}等皆散。", "kakikudashi_tagged": "六年夏四月、兵を{{place:黄河|河上}}に揚げ、{{person:袁紹|紹}}の{{place:倉亭|倉亭}}の軍を撃ちて、之を破る。{{person:袁紹|紹}}は帰り、復た散卒を収め、諸々の叛ける郡県を攻め定む。九月、{{person:曹操|公}}は{{place:許|許}}に還る。{{person:袁紹|紹}}の未だ破れざるや、{{person:劉備|劉備}}をして{{place:汝南|汝南}}を略せしめ、{{place:汝南|汝南}}の賊の{{person:共都|共都}}等が之に応ず。{{person:蔡揚|蔡揚}}を遣わして{{person:共都|都}}を撃たしむるも、利あらず、{{person:共都|都}}の破る所と為る。{{person:曹操|公}}は南のかた{{person:劉備|備}}を征す。{{person:劉備|備}}は{{person:曹操|公}}の自ら行くを聞くや、走りて{{person:劉表|劉表}}に奔り、{{person:共都|都}}等は皆な散ず。", "translation_tagged": "六年夏四月、{{place:黄河|黄河}}のほとりで軍勢の威を示し、{{person:袁紹|袁紹}}の{{place:倉亭|倉亭}}の軍を攻撃して、これを打ち破った。{{person:袁紹|袁紹}}は帰還すると、再び敗残の兵を収容し、離反した諸郡県を攻めて平定した。九月、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{place:許|許}}へ帰還した。{{person:袁紹|袁紹}}がまだ敗れる前、{{person:劉備|劉備}}を派遣して{{place:汝南|汝南}}を経略させており、{{place:汝南|汝南}}の賊である{{person:共都|共都}}らがこれに呼応した。{{person:蔡揚|蔡揚}}を派遣して{{person:共都|共都}}を攻撃させたが、戦況は不利となり、{{person:共都|共都}}に打ち破られた。{{person:曹操|公}}（{{person:曹操|曹操}}）は南へ出征して{{person:劉備|劉備}}を討った。{{person:劉備|劉備}}は{{person:曹操|公}}（{{person:曹操|曹操}}）が自ら出陣したと聞くや、逃走して{{person:劉表|劉表}}のもとへ奔り、{{person:共都|共都}}らはみな離散した。"}, {"id": "v1_p54_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 54, "type": "本文", "raw_text": "七年春正月，公軍譙，令曰：「吾起義兵，爲天下除暴亂。舊土人民，死喪略盡，國中終日行，不見所識，使吾悽愴傷懷。其舉義兵已來，將士絕無後者，求其親戚以後之，授上田，官給耕牛，置學師以教之。爲存者立廟，使祀其先人，魂而有靈，吾百年之後何恨哉！」遂至浚儀，治睢陽渠，遣使以太牢祀橋玄。", "kakikudashi": "七年春正月、公は譙に軍し、令して曰く、「吾れ義兵を起こし、天下の為に暴乱を除く。旧土の人民は、死喪して略ぼ尽き、国中を終日行くも、識る所を見ず、吾をして悽愴として懐いを傷ましむ。其れ義兵を挙げて已来、将士の絶えて後無き者は、其の親戚を求めて以て之が後と為し、上田を授け、官より耕牛を給し、学師を置きて以て之を教えよ。存する者の為には廟を立て、其の先人を祀らしめば、魂にして霊有らば、吾れ百年の後に何ぞ恨みんや！」遂に浚儀に至り、睢陽渠を治め、使者を遣わして太牢を以て橋玄を祀らしむ。", "translation": "七年春正月、公（曹操）は譙に駐屯し、令を下して言った、「私は義兵を起こし、天下のために暴乱を除こうとしてきた。故郷の民は、死に絶えてほぼ尽き果て、領内を終日歩いても、見知った顔を見かけることはなく、私の胸を痛切な悲しみに暮れさせる。義兵を挙げて以来、将兵で血統が絶えて跡継ぎのない者については、その親族を探し求めて跡を継がせ、上等の田地を授け、官から耕牛を支給し、学師を置いてこれを教育せよ。残された遺族のためには廟を立てて、その先人を祀らせるようにすれば、もし魂に霊があるならば、私が百年ののち世を去っても何の心残りがあろうか！」こうして浚儀に至り、睢陽渠を修治し、使者を遣わして太牢の礼をもって橋玄を祀らせた。", "persons": "曹操,橋玄", "places": "譙,浚儀,睢陽渠", "era_year": "建安7年（202年）正月", "source_book": "", "keywords": "太牢", "raw_tagged": "七年春正月，{{person:曹操|公}}軍{{place:譙|譙}}，令曰：「吾起義兵，爲天下除暴亂。舊土人民，死喪略盡，國中終日行，不見所識，使吾悽愴傷懷。其舉義兵已來，將士絕無後者，求其親戚以後之，授上田，官給耕牛，置學師以教之。爲存者立廟，使祀其先人，魂而有靈，吾百年之後何恨哉！」遂至{{place:浚儀|浚儀}}，治{{place:睢陽渠|睢陽渠}}，遣使以{{special:太牢|太牢}}祀{{person:橋玄|橋玄}}。", "kakikudashi_tagged": "七年春正月、{{person:曹操|公}}は{{place:譙|譙}}に軍し、令して曰く、「吾れ義兵を起こし、天下の為に暴乱を除く。旧土の人民は、死喪して略ぼ尽き、国中を終日行くも、識る所を見ず、吾をして悽愴として懐いを傷ましむ。其れ義兵を挙げて已来、将士の絶えて後無き者は、其の親戚を求めて以て之が後と為し、上田を授け、官より耕牛を給し、学師を置きて以て之を教えよ。存する者の為には廟を立て、其の先人を祀らしめば、魂にして霊有らば、吾れ百年の後に何ぞ恨みんや！」遂に{{place:浚儀|浚儀}}に至り、{{place:睢陽渠|睢陽渠}}を治め、使者を遣わして{{special:太牢|太牢}}を以て{{person:橋玄|橋玄}}を祀らしむ。", "translation_tagged": "七年春正月、{{person:曹操|公}}（{{person:曹操|曹操}}）は{{place:譙|譙}}に駐屯し、令を下して言った、「私は義兵を起こし、天下のために暴乱を除こうとしてきた。故郷の民は、死に絶えてほぼ尽き果て、領内を終日歩いても、見知った顔を見かけることはなく、私の胸を痛切な悲しみに暮れさせる。義兵を挙げて以来、将兵で血統が絶えて跡継ぎのない者については、その親族を探し求めて跡を継がせ、上等の田地を授け、官から耕牛を支給し、学師を置いてこれを教育せよ。残された遺族のためには廟を立てて、その先人を祀らせるようにすれば、もし魂に霊があるならば、私が百年ののち世を去っても何の心残りがあろうか！」こうして{{place:浚儀|浚儀}}に至り、{{place:睢陽渠|睢陽渠}}を修治し、使者を遣わして{{special:太牢|太牢}}の礼をもって{{person:橋玄|橋玄}}を祀らせた。"}, {"id": "v1_p54_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 54, "type": "裴注", "raw_text": "襃賞令載公祀文曰：「故太尉橋公，誕敷明德，汎愛博容。國念明訓，士思令謨。靈幽體翳，邈哉晞矣！吾以幼年，逮并堂室，特以頑鄙之姿，爲大君子所納。增榮益觀，皆由獎助，猶仲尼稱不如顏淵，李生之厚歎賈復。士死知己，懷此無忘。又承從容約誓之言：『殂逝之後，路有經由，不以斗酒隻雞過相沃酹，車過三步，腹痛勿怪！』雖臨時戲笑之言，非至親之篤好，胡肯爲此辭乎？匪謂靈忿，能詒己疾，懷舊惟顧，念之悽愴。奉命東征，屯次鄉里，北望貴土，乃心陵墓。裁致薄奠，公其尚饗！」", "kakikudashi": "『褒賞令』に公の祀文を載せて曰く、「故の太尉の橋公は、誕いに明徳を敷き、汎く愛して博く容る。国は明訓を念い、士は令謨を思う。霊は幽に体は翳れ、邈なるかな晞ぐ！吾れ幼年を以て、堂室に逮び并び、特に頑鄙の姿を以て、大君子の納るる所と為る。栄を増し観を益すは、皆な奨助に由り、猶お仲尼の顔淵に如かずと称し、李生の賈復を厚く歎ぜしがごとし。士は知己に死す、此を懐いて忘るる無し。又た従容として約誓せる言を承く、『殂逝の後、路に経由する有りて、斗酒隻鶏を以て過ぎて相い沃酹せざれば、車過ぎること三歩にして、腹痛するも怪しむ勿かれ！』臨時の戯笑の言と雖も、至親の篤好に非ざれば、胡ぞ肯えて此の辞を為さんや？霊の忿りて、能く己に疾を詒すと謂うには匪ず、旧を懐い惟れ顧み、之を念えば悽愴たり。命を奉じて東征し、郷里に屯次し、北のかた貴土を望み、乃ち陵墓に心あり。裁かに薄奠を致す、公よ其れ尚わくは饗けよ！」", "translation": "『褒賞令』に公（曹操）の祭文を載せていう、「故太尉・橋公は、大いに明徳を敷き広め、あまねく人々を愛して広く包容されました。国じゅうがその明らかな教えを思い、士人はその優れた導きを慕っております。御霊は幽界に入り御身は隠れ、はるか遠く仰ぎ慕うばかりとなりました！私は若年のころ、お屋敷の座敷に連なる機会を得て、とりわけ愚かで鄙しい身でありながら、大君子に受け入れていただきました。栄誉を増し名声を博することができましたのも、すべてお力添えによるものであり、あたかも仲尼が顔淵には及ばないと称え、李生が賈復を手厚く絶賛したようなものでした。士は己を知る者のために死すといいますが、このご恩を胸に抱いて忘れることはありません。また穏やかに語られた折にお約束くださったお言葉を承っております、『私が世を去ったのち、道すがら近くを通りかかりながら、一斗の酒と一羽の鶏をもって立ち寄り墓前に注ぎ供えなければ、車が三歩進んだところで、腹痛を起こしても不思議に思うなよ！』その場での冗談のお言葉とはいえ、肉親にも等しい篤い好意がなければ、どうしてこのような言葉を口にされたでしょうか？御霊がお怒りになって、本当に私へ腹痛をもたらすというのではなく、往時を懐かしみ振り返るにつけ、これを思えば胸が痛むのです。勅命を奉じて東征し、故郷に駐屯するにあたり、北のかた貴公の故郷を望み見て、御陵墓に心を馳せております。ささやかな供物を捧げます、公よどうかお受けくださいませ！」", "persons": "曹操,橋玄,孔子,顔回,李生,賈復", "places": "", "era_year": "建安7年（202年）正月", "source_book": "褒賞令", "keywords": "太尉,斗酒隻鶏", "raw_tagged": "{{special:引用史料|襃賞令}}載{{person:曹操|公}}祀文曰：「故{{office:太尉|太尉}}{{person:橋玄|橋公}}，誕敷明德，汎愛博容。國念明訓，士思令謨。靈幽體翳，邈哉晞矣！吾以幼年，逮并堂室，特以頑鄙之姿，爲大君子所納。增榮益觀，皆由獎助，猶{{person:孔子|仲尼}}稱不如{{person:顔回|顏淵}}，{{person:李生|李生}}之厚歎{{person:賈復|賈復}}。士死知己，懷此無忘。又承從容約誓之言：『殂逝之後，路有經由，不以{{special:斗酒隻鶏|斗酒隻雞}}過相沃酹，車過三步，腹痛勿怪！』雖臨時戲笑之言，非至親之篤好，胡肯爲此辭乎？匪謂靈忿，能詒己疾，懷舊惟顧，念之悽愴。奉命東征，屯次鄉里，北望貴土，乃心陵墓。裁致薄奠，公其尚饗！」", "kakikudashi_tagged": "{{special:引用史料|『褒賞令』}}に{{person:曹操|公}}の祀文を載せて曰く、「故の{{office:太尉|太尉}}の{{person:橋玄|橋公}}は、誕いに明徳を敷き、汎く愛して博く容る。国は明訓を念い、士は令謨を思う。霊は幽に体は翳れ、邈なるかな晞ぐ！吾れ幼年を以て、堂室に逮び并び、特に頑鄙の姿を以て、大君子の納るる所と為る。栄を増し観を益すは、皆な奨助に由り、猶お{{person:孔子|仲尼}}の{{person:顔回|顔淵}}に如かずと称し、{{person:李生|李生}}の{{person:賈復|賈復}}を厚く歎ぜしがごとし。士は知己に死す、此を懐いて忘るる無し。又た従容として約誓せる言を承く、『殂逝の後、路に経由する有りて、{{special:斗酒隻鶏|斗酒隻鶏}}を以て過ぎて相い沃酹せざれば、車過ぎること三歩にして、腹痛するも怪しむ勿かれ！』臨時の戯笑の言と雖も、至親の篤好に非ざれば、胡ぞ肯えて此の辞を為さんや？霊の忿りて、能く己に疾を詒すと謂うには匪ず、旧を懐い惟れ顧み、之を念えば悽愴たり。命を奉じて東征し、郷里に屯次し、北のかた貴土を望み、乃ち陵墓に心あり。裁かに薄奠を致す、公よ其れ尚わくは饗けよ！」", "translation_tagged": "{{special:引用史料|『褒賞令』}}に{{person:曹操|公}}（{{person:曹操|曹操}}）の祭文を載せていう、「故{{office:太尉|太尉}}・{{person:橋玄|橋公}}は、大いに明徳を敷き広め、あまねく人々を愛して広く包容されました。国じゅうがその明らかな教えを思い、士人はその優れた導きを慕っております。御霊は幽界に入り御身は隠れ、はるか遠く仰ぎ慕うばかりとなりました！私は若年のころ、お屋敷の座敷に連なる機会を得て、とりわけ愚かで鄙しい身でありながら、大君子に受け入れていただきました。栄誉を増し名声を博することができましたのも、すべてお力添えによるものであり、あたかも{{person:孔子|仲尼}}が{{person:顔回|顔淵}}には及ばないと称え、{{person:李生|李生}}が{{person:賈復|賈復}}を手厚く絶賛したようなものでした。士は己を知る者のために死すといいますが、このご恩を胸に抱いて忘れることはありません。また穏やかに語られた折にお約束くださったお言葉を承っております、『私が世を去ったのち、道すがら近くを通りかかりながら、{{special:斗酒隻鶏|一斗の酒と一羽の鶏}}をもって立ち寄り墓前に注ぎ供えなければ、車が三歩進んだところで、腹痛を起こしても不思議に思うなよ！』その場での冗談のお言葉とはいえ、肉親にも等しい篤い好意がなければ、どうしてこのような言葉を口にされたでしょうか？御霊がお怒りになって、本当に私へ腹痛をもたらすというのではなく、往時を懐かしみ振り返るにつけ、これを思えば胸が痛むのです。勅命を奉じて東征し、故郷に駐屯するにあたり、北のかた貴公の故郷を望み見て、御陵墓に心を馳せております。ささやかな供物を捧げます、公よどうかお受けくださいませ！」"}, {"id": "v1_p54_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 54, "type": "本文", "raw_text": "進軍官渡。", "kakikudashi": "軍を官渡に進む。", "translation": "軍を官渡へ進めた。", "persons": "", "places": "官渡", "era_year": "建安7年（202年）春", "source_book": "", "keywords": "", "raw_tagged": "進軍{{place:官渡|官渡}}。", "kakikudashi_tagged": "軍を{{place:官渡|官渡}}に進む。", "translation_tagged": "軍を{{place:官渡|官渡}}へ進めた。"}, {"id": "v1_p55_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 55, "type": "本文", "raw_text": "紹自軍破後，發病歐血，夏五月死。小子尚代，譚自號車騎將軍，屯黎陽。秋九月，公征之，連戰。譚、尚數敗退，固守。", "kakikudashi": "紹は軍の破れしより後、病を発して血を欧き、夏五月に死す。小子の尚が代わり、譚は自ら車騎将軍と号し、黎陽に屯す。秋九月、公は之を征し、連戦す。譚・尚は数々敗退し、固守す。", "translation": "袁紹は軍が打ち破られてから後、病を発して血を吐き、夏五月に死去した。末子の袁尚が跡を継ぎ、袁譚は自ら車騎将軍と号して、黎陽に駐屯した。秋九月、公はこれを征討し、連戦した。袁譚・袁尚はたびたび敗退し、城を固守した。", "persons": "袁紹,袁尚,袁譚,曹操", "places": "黎陽", "era_year": "建安7年（202年）5月〜9月", "source_book": "", "keywords": "車騎将軍", "raw_tagged": "{{person:袁紹|紹}}自軍破後，發病歐血，夏五月死。小子{{person:袁尚|尚}}代，{{person:袁譚|譚}}自號{{office:車騎将軍|車騎將軍}}，屯{{place:黎陽|黎陽}}。秋九月，{{person:曹操|公}}征之，連戰。{{person:袁譚|譚}}、{{person:袁尚|尚}}數敗退，固守。", "kakikudashi_tagged": "{{person:袁紹|紹}}は軍の破れしより後、病を発して血を欧き、夏五月に死す。小子の{{person:袁尚|尚}}が代わり、{{person:袁譚|譚}}は自ら{{office:車騎将軍|車騎将軍}}と号し、{{place:黎陽|黎陽}}に屯す。秋九月、{{person:曹操|公}}は之を征し、連戦す。{{person:袁譚|譚}}・{{person:袁尚|尚}}は数々敗退し、固守す。", "translation_tagged": "{{person:袁紹|袁紹}}は軍が打ち破られてから後、病を発して血を吐き、夏五月に死去した。末子の{{person:袁尚|袁尚}}が跡を継ぎ、{{person:袁譚|袁譚}}は自ら{{office:車騎将軍|車騎将軍}}と号して、{{place:黎陽|黎陽}}に駐屯した。秋九月、{{person:曹操|公}}はこれを征討し、連戦した。{{person:袁譚|袁譚}}・{{person:袁尚|袁尚}}はたびたび敗退し、城を固守した。"}, {"id": "v1_p56_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 56, "type": "本文", "raw_text": "八年春三月，攻其郭，乃出戰，擊，大破之，譚、尚夜遁。夏四月，進軍鄴。五月還許，留賈信屯黎陽。", "kakikudashi": "八年春三月、其の郭を攻むれば、乃ち出でて戦うも、撃ちて、大いに之を破り、譚・尚は夜に遁る。夏四月、軍を鄴に進む。五月に許に還り、賈信を留めて黎陽に屯せしむ。", "translation": "八年春三月、その外郭を攻めると、敵は出撃して戦いを挑んできたが、迎え撃ってこれを大いに打ち破り、袁譚・袁尚は夜陰に乗じて逃走した。夏四月、軍を鄴へ進めた。五月に許へ帰還し、賈信を留めて黎陽に駐屯させた。", "persons": "袁譚,袁尚,賈信", "places": "鄴,許,黎陽", "era_year": "建安8年（203年）3月〜5月", "source_book": "", "keywords": "", "raw_tagged": "八年春三月，攻其郭，乃出戰，擊，大破之，{{person:袁譚|譚}}、{{person:袁尚|尚}}夜遁。夏四月，進軍{{place:鄴|鄴}}。五月還{{place:許|許}}，留{{person:賈信|賈信}}屯{{place:黎陽|黎陽}}。", "kakikudashi_tagged": "八年春三月、其の郭を攻むれば、乃ち出でて戦うも、撃ちて、大いに之を破り、{{person:袁譚|譚}}・{{person:袁尚|尚}}は夜に遁る。夏四月、軍を{{place:鄴|鄴}}に進む。五月に{{place:許|許}}に還り、{{person:賈信|賈信}}を留めて{{place:黎陽|黎陽}}に屯せしむ。", "translation_tagged": "八年春三月、その外郭を攻めると、敵は出撃して戦いを挑んできたが、迎え撃ってこれを大いに打ち破り、{{person:袁譚|袁譚}}・{{person:袁尚|袁尚}}は夜陰に乗じて逃走した。夏四月、軍を{{place:鄴|鄴}}へ進めた。五月に{{place:許|許}}へ帰還し、{{person:賈信|賈信}}を留めて{{place:黎陽|黎陽}}に駐屯させた。"}, {"id": "v1_p57_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 57, "type": "本文", "raw_text": "己酉，令曰：「《司馬法》『將軍死綏』，", "kakikudashi": "己酉、令して曰く、「『司馬法』に『将軍は綏に死す』とあり、", "translation": "己酉の日、令を下して言った、「『司馬法』には『将軍は退却の罪に死す』とあり、", "persons": "", "places": "", "era_year": "建安8年（203年）5月", "source_book": "", "keywords": "司馬法", "raw_tagged": "己酉，令曰：「{{special:司馬法|《司馬法》}}『將軍死綏』，", "kakikudashi_tagged": "己酉、令して曰く、「{{special:司馬法|『司馬法』}}に『将軍は綏に死す』とあり、", "translation_tagged": "己酉の日、令を下して言った、「{{special:司馬法|『司馬法』}}には『将軍は退却の罪に死す』とあり、"}, {"id": "v1_p57_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 57, "type": "裴注", "raw_text": "《魏書》云：綏，却也。有前一尺，無却一寸。", "kakikudashi": "『魏書』に云わく、綏とは、却くなり。前むこと一尺有るも、却くこと一寸無しと。", "translation": "『魏書』にいう、「綏」とは、退却することである。一尺前進することはあっても、一寸たりとも後退することはないの意であると。", "persons": "", "places": "", "era_year": "", "source_book": "魏書", "keywords": "", "raw_tagged": "{{special:引用史料|《魏書》}}云：綏，却也。有前一尺，無却一寸。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に云わく、綏とは、却くなり。前むこと一尺有るも、却くこと一寸無しと。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう、「綏」とは、退却することである。一尺前進することはあっても、一寸たりとも後退することはないの意であると。"}, {"id": "v1_p57_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 57, "type": "本文", "raw_text": "故趙括之母，乞不坐括。是古之將者，軍破於外，而家受罪於內也。自命將征行，但賞功而不罰罪，非國典也。其令諸將出征，敗軍者抵罪，失利者免官爵。」", "kakikudashi": "故に趙括の母は、括に坐せざらんことを乞う。是れ古の将たる者は、軍は外に破れて、家は内に罪を受くればなり。将に命じて征行せしめてより、但だ功を賞して罪を罰せざるは、国典に非ざるなり。其れ諸将の出征するに令し、軍を敗る者は罪に抵て、利を失う者は官爵を免ぜよ。」", "translation": "それゆえ趙括の母は、趙括の罪に連座しないことを願い出たのである。これは古の将たる者が、外で軍を敗れさせれば、内ではその家族までもが罪を受けたからである。私が諸将に命じて出征させるようになって以来、ただ戦功を賞するのみで敗戦の罪を罰してこなかったのは、国の法典にかなうことではない。いま出征する諸将に布告する、軍を敗北させた者は罪に処し、戦機を失して不利を招いた者は官職と爵位を剥奪せよ。」", "persons": "趙括", "places": "", "era_year": "建安8年（203年）5月", "source_book": "", "keywords": "", "raw_tagged": "故{{person:趙括|趙括}}之母，乞不坐{{person:趙括|括}}。是古之將者，軍破於外，而家受罪於內也。自命將征行，但賞功而不罰罪，非國典也。其令諸將出征，敗軍者抵罪，失利者免官爵。」", "kakikudashi_tagged": "故に{{person:趙括|趙括}}の母は、{{person:趙括|括}}に坐せざらんことを乞う。是れ古の将たる者は、軍は外に破れて、家は内に罪を受くればなり。将に命じて征行せしめてより、但だ功を賞して罪を罰せざるは、国典に非ざるなり。其れ諸将の出征するに令し、軍を敗る者は罪に抵て、利を失う者は官爵を免ぜよ。」", "translation_tagged": "それゆえ{{person:趙括|趙括}}の母は、{{person:趙括|趙括}}の罪に連座しないことを願い出たのである。これは古の将たる者が、外で軍を敗れさせれば、内ではその家族までもが罪を受けたからである。私が諸将に命じて出征させるようになって以来、ただ戦功を賞するのみで敗戦の罪を罰してこなかったのは、国の法典にかなうことではない。いま出征する諸将に布告する、軍を敗北させた者は罪に処し、戦機を失して不利を招いた者は官職と爵位を剥奪せよ。」"}, {"id": "v1_p57_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 57, "type": "裴注", "raw_text": "《魏書》載庚申令曰：「議者或以軍吏雖有功能，德行不足堪任郡國之選，所謂『可與適道，未可與權』。管仲曰：『使賢者食於能則上尊，鬬士食於功則卒輕於死，二者設於國則天下治。』未聞無能之人，不鬬之士，並受祿賞，而可以立功興國者也。故明君不官無功之臣，不賞不戰之士；治平尚德行，有事賞功能。論者之言，一似管窺虎歟！」", "kakikudashi": "『魏書』に庚申の令を載せて曰く、「議者は或いは以為えらく、軍吏は功能有りと雖も、徳行は郡国の選に堪任するに足らずと、所謂『与に道に適くべきも、未だ与に権すべからず』なり。管仲曰く、『賢者をして能に食ましむれば則ち上は尊ばれ、闘士をして功に食ましむれば則ち卒は死を軽んじ、二者国に設くれば則ち天下は治まる。』未だ無能の人、不闘の士が、並びに禄賞を受けて、以て功を立て国を興すべしという者を聞かざるなり。故に明君は功無きの臣を官とせず、戦わざるの士を賞せず。治平には徳行を尚び、有事には功能を賞す。論者の言は、一に管もて虎を窺うに似たるか！」", "translation": "『魏書』に庚申の令を載せていう、「議論する者の中には、軍吏に実務や武功の才があっても、徳行の面では郡国の長官・属吏の選考に任ずるに足りないとする者があるが、これこそいわゆる『ともに道を歩むことはできても、いまだともに臨機応変の判断を行うことはできない』というものである。管仲は言った、『賢者にその能力によって禄を食ませれば主君は尊ばれ、闘士にその戦功によって禄を食ませれば兵卒は死を恐れなくなり、この二つを国に設ければ天下は治まる。』無能な人間や戦わない士が、そろって俸禄や恩賞を受けながら、それでいて功績を立て国を興すことができたなどという例は聞いたことがない。それゆえ明君は功績のない臣下に官職を授けず、戦わない兵士に恩賞を与えたりはしないのである。天下が太平であれば徳行を尊び、戦乱の有事にあっては実務と武功の能力を賞するのだ。論者たちの言葉は、なんと細い管から虎を覗き見るような狭い見識に似ていることか！」", "persons": "管仲", "places": "", "era_year": "建安8年（203年）5月〜6月", "source_book": "魏書", "keywords": "可與適道,管窺虎", "raw_tagged": "{{special:引用史料|《魏書》}}載庚申令曰：「議者或以軍吏雖有功能，德行不足堪任郡國之選，所謂『{{special:可與適道|可與適道，未可與權}}』。{{person:管仲|管仲}}曰：『使賢者食於能則上尊，鬬士食於功則卒輕於死，二者設於國則天下治。』未聞無能之人，不鬬之士，並受祿賞，而可以立功興國者也。故明君不官無功之臣，不賞不戰之士；治平尚德行，有事賞功能。論者之言，一似{{special:管窺虎|管窺虎}}歟！」", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に庚申の令を載せて曰く、「議者は或いは以為えらく、軍吏は功能有りと雖も、徳行は郡国の選に堪任するに足らずと、所謂『{{special:可與適道|与に道に適くべきも、未だ与に権すべからず}}』なり。{{person:管仲|管仲}}曰く、『賢者をして能に食ましむれば則ち上は尊ばれ、闘士をして功に食ましむれば則ち卒は死を軽んじ、二者国に設くれば則ち天下は治まる。』未だ無能の人、不闘の士が、並びに禄賞を受けて、以て功を立て国を興すべしという者を聞かざるなり。故に明君は功無きの臣を官とせず、戦わざるの士を賞せず。治平には徳行を尚び、有事には功能を賞す。論者の言は、一に{{special:管窺虎|管もて虎を窺う}}に似たるか！」", "translation_tagged": "{{special:引用史料|『魏書』}}に庚申の令を載せていう、「議論する者の中には、軍吏に実務や武功の才があっても、徳行の面では郡国の長官・属吏の選考に任ずるに足りないとする者があるが、これこそいわゆる『{{special:可與適道|ともに道を歩むことはできても、いまだともに臨機応変の判断を行うことはできない}}』というものである。{{person:管仲|管仲}}は言った、『賢者にその能力によって禄を食ませれば主君は尊ばれ、闘士にその戦功によって禄を食ませれば兵卒は死を恐れなくなり、この二つを国に設ければ天下は治まる。』無能な人間や戦わない士が、そろって俸禄や恩賞を受けながら、それでいて功績を立て国を興すことができたなどという例は聞いたことがない。それゆえ明君は功績のない臣下に官職を授けず、戦わない兵士に恩賞を与えたりはしないのである。天下が太平であれば徳行を尊び、戦乱の有事にあっては実務と武功の能力を賞するのだ。論者たちの言葉は、なんと{{special:管窺虎|細い管から虎を覗き見る}}ような狭い見識に似ていることか！」"}, {"id": "v1_p58_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 58, "type": "本文", "raw_text": "秋七月，令曰：「喪亂已來，十有五年，後生者不見仁義禮讓之風，吾甚傷之。其令郡國各修文學，縣滿五百戶置校官，選其鄉之俊造而教學之，庶幾先王之道不廢，而有以益於天下。」", "kakikudashi": "秋七月、令して曰く、「喪乱より已来、十有五年、後生なる者は仁義礼譲の風を見ず、吾れ甚だ之を傷む。其れ郡国に令して各々文学を修め、県は五百戸に満つれば校官を置き、其の郷の俊造を選びて之に教学せしめば、庶幾わくは先王の道は廃れずして、以て天下に益する有らん。」", "translation": "秋七月、令を下して言った、「戦乱が始まって以来、十五年となり、後に生まれた若い世代は仁義礼譲の気風を目にしておらず、私はひどくこのことを痛ましく思っている。そこで郡国に命じてそれぞれ文学の官を整えさせ、県は戸数が五百戸に達していれば校官を置き、その郷里の優れた人材を選んで教育を施させよ、そうすればどうか先王の道が廃れることなく、天下に資するところがあるであろう。」", "persons": "", "places": "", "era_year": "建安8年（203年）7月", "source_book": "", "keywords": "校官", "raw_tagged": "秋七月，令曰：「喪亂已來，十有五年，後生者不見仁義禮讓之風，吾甚傷之。其令郡國各修文學，縣滿五百戶置{{office:校官|校官}}，選其鄉之俊造而教學之，庶幾先王之道不廢，而有以益於天下。」", "kakikudashi_tagged": "秋七月、令して曰く、「喪乱より已来、十有五年、後生なる者は仁義礼譲の風を見ず、吾れ甚だ之を傷む。其れ郡国に令して各々文学を修め、県は五百戸に満つれば{{office:校官|校官}}を置き、其の郷の俊造を選びて之に教学せしめば、庶幾わくは先王の道は廃れずして、以て天下に益する有らん。」", "translation_tagged": "秋七月、令を下して言った、「戦乱が始まって以来、十五年となり、後に生まれた若い世代は仁義礼譲の気風を目にしておらず、私はひどくこのことを痛ましく思っている。そこで郡国に命じてそれぞれ文学の官を整えさせ、県は戸数が五百戸に達していれば{{office:校官|校官}}を置き、その郷里の優れた人材を選んで教育を施させよ、そうすればどうか先王の道が廃れることなく、天下に資するところがあるであろう。」"}, {"id": "v1_p59_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 59, "type": "本文", "raw_text": "八月，公征劉表，軍西平。公之去鄴而南也，譚、尚爭冀州，譚爲尚所敗，走保平原。尚攻之急，譚遣辛毗乞降請救。諸將皆疑，荀攸勸公許之，", "kakikudashi": "八月、公は劉表を征し、西平に軍す。公の鄴を去りて南するや、譚・尚は冀州を争い、譚は尚の敗る所と為り、走りて平原を保つ。尚の之を攻むること急なれば、譚は辛毗を遣わして降を乞い救いを請わしむ。諸将は皆な疑うも、荀攸は公に之を許さんことを勧め、", "translation": "八月、公は劉表を征討し、西平に布陣した。公が鄴を去って南下すると、袁譚・袁尚は冀州をめぐって争い、袁譚は袁尚に打ち破られ、逃走して平原を保った。袁尚がこれを激しく攻撃したため、袁譚は辛毗を派遣して降伏を願い出て救援を請うた。諸将はみな疑念を抱いたが、荀攸は公にこれを許すよう勧め、", "persons": "曹操,劉表,袁譚,袁尚,辛毗,荀攸", "places": "西平,鄴,冀州,平原", "era_year": "建安8年（203年）8月", "source_book": "", "keywords": "", "raw_tagged": "八月，{{person:曹操|公}}征{{person:劉表|劉表}}，軍{{place:西平|西平}}。{{person:曹操|公}}之去{{place:鄴|鄴}}而南也，{{person:袁譚|譚}}、{{person:袁尚|尚}}爭{{place:冀州|冀州}}，{{person:袁譚|譚}}爲{{person:袁尚|尚}}所敗，走保{{place:平原|平原}}。{{person:袁尚|尚}}攻之急，{{person:袁譚|譚}}遣{{person:辛毗|辛毗}}乞降請救。諸將皆疑，{{person:荀攸|荀攸}}勸{{person:曹操|公}}許之，", "kakikudashi_tagged": "八月、{{person:曹操|公}}は{{person:劉表|劉表}}を征し、{{place:西平|西平}}に軍す。{{person:曹操|公}}の{{place:鄴|鄴}}を去りて南するや、{{person:袁譚|譚}}・{{person:袁尚|尚}}は{{place:冀州|冀州}}を争い、{{person:袁譚|譚}}は{{person:袁尚|尚}}の敗る所と為り、走りて{{place:平原|平原}}を保つ。{{person:袁尚|尚}}の之を攻むること急なれば、{{person:袁譚|譚}}は{{person:辛毗|辛毗}}を遣わして降を乞い救いを請わしむ。諸将は皆な疑うも、{{person:荀攸|荀攸}}は{{person:曹操|公}}に之を許さんことを勧め、", "translation_tagged": "八月、{{person:曹操|公}}は{{person:劉表|劉表}}を征討し、{{place:西平|西平}}に布陣した。{{person:曹操|公}}が{{place:鄴|鄴}}を去って南下すると、{{person:袁譚|袁譚}}・{{person:袁尚|袁尚}}は{{place:冀州|冀州}}をめぐって争い、{{person:袁譚|袁譚}}は{{person:袁尚|袁尚}}に打ち破られ、逃走して{{place:平原|平原}}を保った。{{person:袁尚|袁尚}}がこれを激しく攻撃したため、{{person:袁譚|袁譚}}は{{person:辛毗|辛毗}}を派遣して降伏を願い出て救援を請うた。諸将はみな疑念を抱いたが、{{person:荀攸|荀攸}}は{{person:曹操|公}}にこれを許すよう勧め、"}, {"id": "v1_p59_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 59, "type": "裴注", "raw_text": "《魏書》曰：公云：「我攻呂布，表不爲寇，官渡之役，不救袁紹，此自守之賊也，宜爲後圖。譚、尚狡猾，當乘其亂。縱譚挾詐，不終束手，使我破尚，徧收其地，利自多矣。」乃許之。", "kakikudashi": "『魏書』に曰く、公云わく、「我れ呂布を攻むるに、表は寇を為さず、官渡の役にも、袁紹を救わず、此れ自守の賊なれば、宜しく後の図と為すべし。譚・尚は狡猾なれば、当に其の乱に乗ずべし。縦い譚が詐を挟み、終には手を束ねずとも、我をして尚を破り、徧く其の地を収めしむれば、利は自ずから多からん。」乃ち之を許す。", "translation": "『魏書』にいう、公は言った、「私が呂布を攻めたとき、劉表は侵攻してこず、官渡の戦いにおいても、袁紹を救援しなかった、これは自分の領地を守るだけの賊であるから、後回しにして図るのがよい。袁譚・袁尚は狡猾であるから、その内乱に乗じるべきである。たとえ袁譚が偽りを抱いており、最後までおとなしく従うことはないとしても、私に袁尚を打ち破らせ、あまねくその領地を収めさせることになれば、利益はおのずと大きいはずだ。」そこでこれを許した。", "persons": "曹操,呂布,劉表,袁紹,袁譚,袁尚", "places": "官渡", "era_year": "建安8年（203年）8月", "source_book": "魏書", "keywords": "", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:曹操|公}}云：「我攻{{person:呂布|呂布}}，{{person:劉表|表}}不爲寇，{{place:官渡|官渡}}之役，不救{{person:袁紹|袁紹}}，此自守之賊也，宜爲後圖。{{person:袁譚|譚}}、{{person:袁尚|尚}}狡猾，當乘其亂。縱{{person:袁譚|譚}}挾詐，不終束手，使我破{{person:袁尚|尚}}，徧收其地，利自多矣。」乃許之。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、{{person:曹操|公}}云わく、「我れ{{person:呂布|呂布}}を攻むるに、{{person:劉表|表}}は寇を為さず、{{place:官渡|官渡}}の役にも、{{person:袁紹|袁紹}}を救わず、此れ自守の賊なれば、宜しく後の図と為すべし。{{person:袁譚|譚}}・{{person:袁尚|尚}}は狡猾なれば、当に其の乱に乗ずべし。縦い{{person:袁譚|譚}}が詐を挟み、終には手を束ねずとも、我をして{{person:袁尚|尚}}を破り、徧く其の地を収めしむれば、利は自ずから多からん。」乃ち之を許す。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう、{{person:曹操|公}}は言った、「私が{{person:呂布|呂布}}を攻めたとき、{{person:劉表|劉表}}は侵攻してこず、{{place:官渡|官渡}}の戦いにおいても、{{person:袁紹|袁紹}}を救援しなかった、これは自分の領地を守るだけの賊であるから、後回しにして図るのがよい。{{person:袁譚|袁譚}}・{{person:袁尚|袁尚}}は狡猾であるから、その内乱に乗じるべきである。たとえ{{person:袁譚|袁譚}}が偽りを抱いており、最後までおとなしく従うことはないとしても、私に{{person:袁尚|袁尚}}を打ち破らせ、あまねくその領地を収めさせることになれば、利益はおのずと大きいはずだ。」そこでこれを許した。"}, {"id": "v1_p59_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 59, "type": "本文", "raw_text": "公乃引軍還。冬十月，到黎陽，爲子整與譚結婚。", "kakikudashi": "公は乃ち軍を引きて還る。冬十月、黎陽に到り、子の整の為に譚と婚を結ぶ。", "translation": "公はこうして軍を引いて帰還した。冬十月、黎陽に到着し、子の曹整のために袁譚と婚姻を結んだ。", "persons": "曹操,曹整,袁譚", "places": "黎陽", "era_year": "建安8年（203年）10月", "source_book": "", "keywords": "", "raw_tagged": "{{person:曹操|公}}乃引軍還。冬十月，到{{place:黎陽|黎陽}}，爲子{{person:曹整|整}}與{{person:袁譚|譚}}結婚。", "kakikudashi_tagged": "{{person:曹操|公}}は乃ち軍を引きて還る。冬十月、{{place:黎陽|黎陽}}に到り、子の{{person:曹整|整}}の為に{{person:袁譚|譚}}と婚を結ぶ。", "translation_tagged": "{{person:曹操|公}}はこうして軍を引いて帰還した。冬十月、{{place:黎陽|黎陽}}に到着し、子の{{person:曹整|曹整}}のために{{person:袁譚|袁譚}}と婚姻を結んだ。"}, {"id": "v1_p59_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 59, "type": "裴注", "raw_text": "臣松之案：紹死至此，過周五月耳。譚雖出後其伯，不爲紹服三年，而於再朞之內以行吉禮，悖矣。魏武或以權宜與之約言；今云結婚，未必便以此年成禮。", "kakikudashi": "臣松之案ずるに、紹の死してより此に至るまで、周を過ぐること五月なるのみ。譚は出でて其の伯の後と為り、紹の為に三年の服を為さずと雖も、再朞の内に於て以て吉礼を行うは、悖れり。魏武は或いは権宜を以て之と約言せるならん。今、婚を結ぶと云うも、未だ必ずしも便ち此の年を以て礼を成さざらん。", "translation": "臣・裴松之が考えるに、袁紹が死去してからこの時に至るまで、丸一年を過ぎて五か月経ったばかりである。袁譚は養子に出てその伯父の跡を継ぎ、袁紹のために三年の喪に服さないとはいえ、丸二年の期間のうちに婚礼という吉礼を行うのは、礼に悖っている。魏の武帝はおそらく権宜の処置として袁譚と婚約の言葉を交わしたのであろう。いま婚姻を結んだと記されていても、必ずしもすぐこの年のうちに婚礼の儀式を挙げたわけではあるまい。", "persons": "裴松之,袁紹,袁譚,曹操", "places": "", "era_year": "", "source_book": "", "keywords": "再朞", "raw_tagged": "{{person:裴松之|臣松之}}案：{{person:袁紹|紹}}死至此，過周五月耳。{{person:袁譚|譚}}雖出後其伯，不爲{{person:袁紹|紹}}服三年，而於{{special:再朞|再朞}}之內以行吉禮，悖矣。{{person:曹操|魏武}}或以權宜與之約言；今云結婚，未必便以此年成禮。", "kakikudashi_tagged": "{{person:裴松之|臣松之}}案ずるに、{{person:袁紹|紹}}の死してより此に至るまで、周を過ぐること五月なるのみ。{{person:袁譚|譚}}は出でて其の伯の後と為り、{{person:袁紹|紹}}の為に三年の服を為さずと雖も、{{special:再朞|再朞}}の内に於て以て吉礼を行うは、悖れり。{{person:曹操|魏武}}は或いは権宜を以て之と約言せるならん。今、婚を結ぶと云うも、未だ必ずしも便ち此の年を以て礼を成さざらん。", "translation_tagged": "臣・{{person:裴松之|裴松之}}が考えるに、{{person:袁紹|袁紹}}が死去してからこの時に至るまで、丸一年を過ぎて五か月経ったばかりである。{{person:袁譚|袁譚}}は養子に出てその伯父の跡を継ぎ、{{person:袁紹|袁紹}}のために三年の喪に服さないとはいえ、{{special:再朞|丸二年の期間}}のうちに婚礼という吉礼を行うのは、礼に悖っている。{{person:曹操|魏の武帝}}はおそらく権宜の処置として{{person:袁譚|袁譚}}と婚約の言葉を交わしたのであろう。いま婚姻を結んだと記されていても、必ずしもすぐこの年のうちに婚礼の儀式を挙げたわけではあるまい。"}, {"id": "v1_p59_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 59, "type": "本文", "raw_text": "尚聞公北，乃釋平原還鄴。東平呂曠、呂翔叛尚，屯陽平，率其衆降，封爲列侯。", "kakikudashi": "尚は公の北するを聞き、乃ち平原を釈きて鄴に還る。東平の呂曠・呂翔は尚に叛きて、陽平に屯し、其の衆を率いて降り、封ぜられて列侯と為る。", "translation": "袁尚は公が北上したと聞くと、平原の包囲を解いて鄴へ引き返した。東平の呂曠・呂翔は袁尚に背いて、陽平に駐屯し、その軍勢を率いて降伏したので、列侯に封じられた。", "persons": "袁尚,曹操,呂曠,呂翔", "places": "平原,鄴,東平,陽平", "era_year": "建安8年（203年）10月", "source_book": "", "keywords": "列侯", "raw_tagged": "{{person:袁尚|尚}}聞{{person:曹操|公}}北，乃釋{{place:平原|平原}}還{{place:鄴|鄴}}。{{place:東平|東平}}{{person:呂曠|呂曠}}、{{person:呂翔|呂翔}}叛{{person:袁尚|尚}}，屯{{place:陽平|陽平}}，率其衆降，封爲{{office:列侯|列侯}}。", "kakikudashi_tagged": "{{person:袁尚|尚}}は{{person:曹操|公}}の北するを聞き、乃ち{{place:平原|平原}}を釈きて{{place:鄴|鄴}}に還る。{{place:東平|東平}}の{{person:呂曠|呂曠}}・{{person:呂翔|呂翔}}は{{person:袁尚|尚}}に叛きて、{{place:陽平|陽平}}に屯し、其の衆を率いて降り、封ぜられて{{office:列侯|列侯}}と為る。", "translation_tagged": "{{person:袁尚|袁尚}}は{{person:曹操|公}}が北上したと聞くと、{{place:平原|平原}}の包囲を解いて{{place:鄴|鄴}}へ引き返した。{{place:東平|東平}}の{{person:呂曠|呂曠}}・{{person:呂翔|呂翔}}は{{person:袁尚|袁尚}}に背いて、{{place:陽平|陽平}}に駐屯し、その軍勢を率いて降伏したので、{{office:列侯|列侯}}に封じられた。"}, {"id": "v1_p59_6", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 59, "type": "裴注", "raw_text": "《魏書》曰：譚之圍解，陰以將軍印綬假曠。曠受印送之，公曰：「我固知譚之有小計也。欲使我攻尚，得以其閒略民聚衆，比尚之破，可得自彊以乘我弊也。尚破我盛，何弊之乘乎？」", "kakikudashi": "『魏書』に曰く、譚は囲みの解くるや、陰かに将軍の印綬を以て曠に仮す。曠は印を受けて之を送れば、公曰く、「我れ固より譚の小計有るを知るなり。我をして尚を攻めしめ、其の間を以て民を略し衆を聚むるを得て、尚の破るるに比び、自ら彊くして以て我が弊に乗ずるを得んと欲するなり。尚の破るれば我れは盛んなり、何の弊にか之れ乗ぜんや？」", "translation": "『魏書』にいう、袁譚は包囲が解けると、密かに将軍の印綬を呂曠に仮授した。呂曠がその印を受け取ってこれを届けてくると、公は言った、「私はもとより袁譚に小賢しい計略があることを知っていた。私に袁尚を攻めさせ、その隙に民を奪い兵衆を集め、袁尚が打ち破られる頃合いには、自ら勢力を強めて我が軍の疲弊に乗じることができると目論んでいるのだ。袁尚が敗れれば我が軍の勢いはいよいよ盛んになるのに、いったいどんな疲弊につけ込むというのか？」", "persons": "袁譚,呂曠,曹操,袁尚", "places": "", "era_year": "建安8年（203年）10月", "source_book": "魏書", "keywords": "", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:袁譚|譚}}之圍解，陰以將軍印綬假{{person:呂曠|曠}}。{{person:呂曠|曠}}受印送之，{{person:曹操|公}}曰：「我固知{{person:袁譚|譚}}之有小計也。欲使我攻{{person:袁尚|尚}}，得以其閒略民聚衆，比{{person:袁尚|尚}}之破，可得自彊以乘我弊也。{{person:袁尚|尚}}破我盛，何弊之乘乎？」", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、{{person:袁譚|譚}}は囲みの解くるや、陰かに将軍の印綬を以て{{person:呂曠|曠}}に仮す。{{person:呂曠|曠}}は印を受けて之を送れば、{{person:曹操|公}}曰く、「我れ固より{{person:袁譚|譚}}の小計有るを知るなり。我をして{{person:袁尚|尚}}を攻めしめ、其の間を以て民を略し衆を聚むるを得て、{{person:袁尚|尚}}の破るるに比び、自ら彊くして以て我が弊に乗ずるを得んと欲するなり。{{person:袁尚|尚}}の破るれば我れは盛んなり、何の弊にか之れ乗ぜんや？」", "translation_tagged": "{{special:引用史料|『魏書』}}にいう、{{person:袁譚|袁譚}}は包囲が解けると、密かに将軍の印綬を{{person:呂曠|呂曠}}に仮授した。{{person:呂曠|呂曠}}がその印を受け取ってこれを届けてくると、{{person:曹操|公}}は言った、「私はもとより{{person:袁譚|袁譚}}に小賢しい計略があることを知っていた。私に{{person:袁尚|袁尚}}を攻めさせ、その隙に民を奪い兵衆を集め、{{person:袁尚|袁尚}}が打ち破られる頃合いには、自ら勢力を強めて我が軍の疲弊に乗じることができると目論んでいるのだ。{{person:袁尚|袁尚}}が敗れれば我が軍の勢いはいよいよ盛んになるのに、いったいどんな疲弊につけ込むというのか？」"}, {"id": "v1_p60_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 60, "type": "本文", "raw_text": "九年春正月，濟河，遏淇水入白溝以通糧道。二月，尚復攻譚，留蘇由、審配守鄴。公進軍到洹水，由降。旣至，攻鄴，爲土山、地道。武安長尹楷屯毛城，通上黨糧道。夏四月，留曹洪攻鄴，公自將擊楷，破之而還。尚將沮鵠守邯鄲，", "kakikudashi": "九年春正月、河を済り、淇水を遏めて白溝に入れ以て糧道を通ず。二月、尚は復た譚を攻め、蘇由・審配を留めて鄴を守らしむ。公は軍を進めて洹水に到れば、由は降る。既に至りて、鄴を攻め、土山・地道を為る。武安長の尹楷は毛城に屯し、上党の糧道を通ず。夏四月、曹洪を留めて鄴を攻めしめ、公は自ら将として楷を撃ち、之を破りて還る。尚の将の沮鵠は邯鄲を守りしが、", "translation": "建安九年春正月、黄河を渡り、淇水をせき止めて白溝へ流し込み、兵糧の輸送路を通じさせた。二月、袁尚が再び袁譚を攻め、蘇由・審配を残して鄴を守らせた。公が軍を進めて洹水に到達すると、蘇由は降伏した。到着すると、鄴を攻撃し、土山と地下道を築いた。武安県長の尹楷が毛城に駐屯し、上党からの兵糧輸送路を通じさせていた。夏四月、曹洪を残して ", "persons": "沮鵠,沮授", "places": "河朔", "era_year": "", "source_book": "", "keywords": "", "raw_tagged": "沮音菹，{{place:河朔|河朔}}閒今猶有此姓。{{person:沮鵠|鵠}}，{{person:沮授|沮授}}子也。", "kakikudashi_tagged": "沮の音は菹なり、{{place:河朔|河朔}}の間には今も猶お此の姓有り。{{person:沮鵠|鵠}}は、{{person:沮授|沮授}}の子なり。", "translation_tagged": "「沮」の発音は「菹」と同じであり、{{place:河朔|河朔}}の地域には今もなおこの姓がある。{{person:沮鵠|沮鵠}}は、{{person:沮授|沮授}}の子である。"}, {"id": "v1_p60_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 60, "type": "本文", "raw_text": "又擊拔之。易陽令韓範、涉長梁岐舉縣降，賜爵關內侯。五月，毀土山、地道，作圍壍，決漳水灌城；城中餓死者過半。秋七月，尚還救鄴，諸將皆以爲「此歸師，人自爲戰，不如避之」。公曰：「尚從大道來，當避之；若循西山來者，此成禽耳。」尚果循西山來，臨滏水爲營。", "kakikudashi": "又た撃ちて之を抜く。易陽令の韓範・渉長の梁岐は県を挙げて降り、爵関内侯を賜う。五月、土山・地道を毀ち、囲壍を作り、漳水を決して城に灌ぐ。城中の餓死する者は半ばに過ぐ。秋七月、尚は還りて鄴を救わんとすれば、諸将は皆な以為えらく、「此れ帰師なれば、人は自ら戦いを為さん、之を避くるに如かず」と。公曰く、「尚にして大道より来たらば、当に之を避くべし。若し西山に循いて来たらば、此れ成禽なるのみ。」尚は果たして西山に循いて来たり、滏水に臨みて営を為す。", "translation": "さらに攻撃してこれを陥落させた。易陽県令の韓範・渉県長の梁岐が県を挙げて降伏し、関内侯の爵位を賜った。五月、土山と地下道を取り壊し、包囲の堀を掘り、漳水を決壊させて城内に水を注ぎ込んだ。城内で餓死する者は半数を超えた。秋七月、袁尚が引き返して鄴を救援しようとすると、諸将はみな「これは本拠へ帰還する帰師であり、兵士は各自が必死に戦うでしょうから、これを避けるに越したことはありません」と考えた。公は言った、「袁尚が本道からやって来るならば、これを避けるべきである。もし西山に沿ってやって来るならば、これは生け捕りも同然の獲物にすぎない。」袁尚は果たして西山に沿ってやって来て、滏水に臨んで陣営を築いた。", "persons": "曹操,韓範,梁岐,袁尚", "places": "易陽,渉,漳水,鄴,西山,滏水", "era_year": "建安9年（204年）4月〜7月", "source_book": "", "keywords": "県令,県長,関内侯,死地", "raw_tagged": "又擊拔之。{{place:易陽|易陽}}{{office:県令|令}}{{person:韓範|韓範}}、{{place:渉|涉}}{{office:県長|長}}{{person:梁岐|梁岐}}舉縣降，賜爵{{office:関内侯|關內侯}}。五月，毀土山、地道，作圍壍，決{{place:漳水|漳水}}灌城；城中餓死者過半。秋七月，{{person:袁尚|尚}}還救{{place:鄴|鄴}}，諸將皆以爲「此{{special:死地|歸師}}，人自爲戰，不如避之」。{{person:曹操|公}}曰：「{{person:袁尚|尚}}從大道來，當避之；若循{{place:西山|西山}}來者，此成禽耳。」{{person:袁尚|尚}}果循{{place:西山|西山}}來，臨{{place:滏水|滏水}}爲營。", "kakikudashi_tagged": "又た撃ちて之を抜く。{{place:易陽|易陽}}{{office:県令|令}}の{{person:韓範|韓範}}・{{place:渉|渉}}{{office:県長|長}}の{{person:梁岐|梁岐}}は県を挙げて降り、爵{{office:関内侯|関内侯}}を賜う。五月、土山・地道を毀ち、囲壍を作り、{{place:漳水|漳水}}を決して城に灌ぐ。城中の餓死する者は半ばに過ぐ。秋七月、{{person:袁尚|尚}}は還りて{{place:鄴|鄴}}を救わんとすれば、諸将は皆な以為えらく、「此れ{{special:死地|帰師}}なれば、人は自ら戦いを為さん、之を避くるに如かず」と。{{person:曹操|公}}曰く、「{{person:袁尚|尚}}にして大道より来たらば、当に之を避くべし。若し{{place:西山|西山}}に循いて来たらば、此れ成禽なるのみ。」{{person:袁尚|尚}}は果たして{{place:西山|西山}}に循いて来たり、{{place:滏水|滏水}}に臨みて営を為す。", "translation_tagged": "さらに攻撃してこれを陥落させた。{{place:易陽|易陽県}}{{office:県令|令}}の{{person:韓範|韓範}}・{{place:渉|渉県}}{{office:県長|長}}の{{person:梁岐|梁岐}}が県を挙げて降伏し、{{office:関内侯|関内侯}}の爵位を賜った。五月、土山と地下道を取り壊し、包囲の堀を掘り、{{place:漳水|漳水}}を決壊させて城内に水を注ぎ込んだ。城内で餓死する者は半数を超えた。秋七月、{{person:袁尚|袁尚}}が引き返して{{place:鄴|鄴}}を救援しようとすると、諸将はみな「これは本拠へ帰還する{{special:死地|帰師}}であり、兵士は各自が必死に戦うでしょうから、これを避けるに越したことはありません」と考えた。{{person:曹操|公}}は言った、「{{person:袁尚|袁尚}}が本道からやって来るならば、これを避けるべきである。もし{{place:西山|西山}}に沿ってやって来るならば、これは生け捕りも同然の獲物にすぎない。」{{person:袁尚|袁尚}}は果たして{{place:西山|西山}}に沿ってやって来て、{{place:滏水|滏水}}に臨んで陣営を築いた。"}, {"id": "v1_p60_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 60, "type": "裴注", "raw_text": "《曹瞞傳》曰：遣候者數部前後參之，皆曰「定從西道，已在邯鄲」。公大喜，會諸將曰：「孤已得冀州，諸君知之乎？」皆曰：「不知。」公曰：「諸君方見不久也。」", "kakikudashi": "『曹瞞伝』に曰く、候者数部を遣わして前後に之を参せしむるに、皆な曰く、「定めて西道よりし、已に邯鄲に在り」と。公は大いに喜び、諸将を会して曰く、「孤は已に冀州を得たり、諸君は之を知るか？」皆な曰く、「知らず。」公曰く、「諸君は方に久しからずして見ん。」", "translation": "『曹瞞伝』にいう、斥候数隊を派遣して前後してその動静を探らせたところ、みな「間違いなく西の道を通っており、すでに邯鄲に入っております」と報告した。公は大いに喜び、諸将を集めて言った、「私はすでに冀州を手に入れたが、諸君はそれがわかるか？」みな言った、「わかりません。」公は言った、「諸君もまもなく目の当たりにするであろう。」", "persons": "曹操", "places": "邯鄲,冀州", "era_year": "建安9年（204年）7月", "source_book": "曹瞞伝", "keywords": "", "raw_tagged": "{{special:引用史料|《曹瞞傳》}}曰：遣候者數部前後參之，皆曰「定從西道，已在{{place:邯鄲|邯鄲}}」。{{person:曹操|公}}大喜，會諸將曰：「{{person:曹操|孤}}已得{{place:冀州|冀州}}，諸君知之乎？」皆曰：「不知。」{{person:曹操|公}}曰：「諸君方見不久也。」", "kakikudashi_tagged": "{{special:引用史料|『曹瞞伝』}}に曰く、候者数部を遣わして前後に之を参せしむるに、皆な曰く、「定めて西道よりし、已に{{place:邯鄲|邯鄲}}に在り」と。{{person:曹操|公}}は大いに喜び、諸将を会して曰く、「{{person:曹操|孤}}は已に{{place:冀州|冀州}}を得たり、諸君は之を知るか？」皆な曰く、「知らず。」{{person:曹操|公}}曰く、「諸君は方に久しからずして見ん。」", "translation_tagged": "{{special:引用史料|『曹瞞伝』}}にいう、斥候数隊を派遣して前後してその動静を探らせたところ、みな「間違いなく西の道を通っており、すでに{{place:邯鄲|邯鄲}}に入っております」と報告した。{{person:曹操|公}}は大いに喜び、諸将を集めて言った、「私はすでに{{place:冀州|冀州}}を手に入れたが、諸君はそれがわかるか？」みな言った、「わかりません。」{{person:曹操|公}}は言った、「諸君もまもなく目の当たりにするであろう。」"}, {"id": "v1_p60_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 60, "type": "本文", "raw_text": "夜遣兵犯圍，公逆擊破走之，遂圍其營。未合，尚懼。故豫州刺史陰夔及陳琳乞降，公不許，爲圍益急。尚夜遁，保祁山，追擊之。其將馬延、張顗等臨陣降，衆大潰，尚走中山。盡獲其輜重，得尚印綬節鉞，使尚降人示其家，城中崩沮。八月，審配兄子榮夜開所守城東門內兵。配逆戰，敗，生禽配，斬之，鄴定。公臨祀紹墓，哭之流涕；慰勞紹妻，還其家人寶物，賜雜繒絮，廩食之。", "kakikudashi": "夜に兵を遣わして囲みを犯さしむれば、公は逆え撃ちて之を破り走らせ、遂に其の営を囲む。未だ合せざるに、尚は懼る。故の豫州刺史の陰夔及び陳琳、降を乞うも、公は許さず、囲みを為すこと益々急なり。尚は夜に遁れて、祁山を保てば、之を追撃す。其の将の馬延・張顗等は陣に臨みて降り、衆は大いに潰え、尚は中山に走る。尽く其の輜重を獲、尚の印綬・節鉞を得て、尚の降人をして其の家に示さしむれば、城中は崩沮す。八月、審配の兄の子の栄は夜に守る所の城の東門を開きて兵を内る。配は逆え戦いて、敗れ、配を生禽にして、之を斬り、鄴は定まる。公は紹の墓に臨み祀りて、之に哭して涕を流す。紹の妻を慰労し、其の家人の宝物を還し、雑繒・絮を賜い、之に廩食せしむ。", "translation": "夜間に兵を遣わして包囲網を突破させようとしたが、公は迎え撃ってこれを打ち破り敗走させ、ついにその陣営を包囲した。包囲がまだ完結しないうちに、袁尚は恐れをなした。もとの豫州刺史の陰夔および陳琳が降伏を願い出たが、公は許さず、包囲をいよいよ厳しくした。袁尚が夜間に逃走して、祁山に立てこもると、これを追撃した。その部将の馬延・張顗らが戦場で降伏したため、軍勢は大崩壊し、袁尚は中山へ敗走した。その輜重を残らず獲得し、袁尚の印綬と節鉞を手に入れ、袁尚軍の投降者に命じてその家族たちに示させると、城内の戦意は挫け崩れた。八月、審配の兄の子の審栄が、夜間に自ら守備していた城の東門を開いて兵を引き入れた。審配は迎え戦ったが敗れ、審配を生け捕りにしてこれを斬り、鄴は平定された。公は袁紹の墓に赴いて祭祀を行い、哭礼して涙を流した。袁紹の妻をねぎらい、その家族の宝物を返還し、種々の絹織物や真綿を下賜し、官倉から扶持米を支給した。", "persons": "曹操,袁尚,陰夔,陳琳,馬延,張顗,審配,審栄,袁紹", "places": "豫州,祁山,中山,鄴", "era_year": "建安9年（204年）7月〜8月", "source_book": "", "keywords": "刺史,節鉞", "raw_tagged": "夜遣兵犯圍，{{person:曹操|公}}逆擊破走之，遂圍其營。未合，{{person:袁尚|尚}}懼。故{{place:豫州|豫州}}{{office:刺史|刺史}}{{person:陰夔|陰夔}}及{{person:陳琳|陳琳}}乞降，{{person:曹操|公}}不許，爲圍益急。{{person:袁尚|尚}}夜遁，保{{place:祁山|祁山}}，追擊之。其將{{person:馬延|馬延}}、{{person:張顗|張顗}}等臨陣降，衆大潰，{{person:袁尚|尚}}走{{place:中山|中山}}。盡獲其輜重，得{{person:袁尚|尚}}印綬{{special:節鉞|節鉞}}，使{{person:袁尚|尚}}降人示其家，城中崩沮。八月，{{person:審配|審配}}兄子{{person:審栄|榮}}夜開所守城東門內兵。{{person:審配|配}}逆戰，敗，生禽{{person:審配|配}}，斬之，{{place:鄴|鄴}}定。{{person:曹操|公}}臨祀{{person:袁紹|紹}}墓，哭之流涕；慰勞{{person:袁紹|紹}}妻，還其家人寶物，賜雜繒絮，廩食之。", "kakikudashi_tagged": "夜に兵を遣わして囲みを犯さしむれば、{{person:曹操|公}}は逆え撃ちて之を破り走らせ、遂に其の営を囲む。未だ合せざるに、{{person:袁尚|尚}}は懼る。故の{{place:豫州|豫州}}{{office:刺史|刺史}}の{{person:陰夔|陰夔}}及び{{person:陳琳|陳琳}}、降を乞うも、{{person:曹操|公}}は許さず、囲みを為すこと益々急なり。{{person:袁尚|尚}}は夜に遁れて、{{place:祁山|祁山}}を保てば、之を追撃す。其の将の{{person:馬延|馬延}}・{{person:張顗|張顗}}等は陣に臨みて降り、衆は大いに潰え、{{person:袁尚|尚}}は{{place:中山|中山}}に走る。尽く其の輜重を獲、{{person:袁尚|尚}}の印綬・{{special:節鉞|節鉞}}を得て、{{person:袁尚|尚}}の降人をして其の家に示さしむれば、城中は崩沮す。八月、{{person:審配|審配}}の兄の子の{{person:審栄|栄}}は夜に守る所の城の東門を開きて兵を内る。{{person:審配|配}}は逆え戦いて、敗れ、{{person:審配|配}}を生禽にして、之を斬り、{{place:鄴|鄴}}は定まる。{{person:曹操|公}}は{{person:袁紹|紹}}の墓に臨み祀りて、之に哭して涕を流す。{{person:袁紹|紹}}の妻を慰労し、其の家人の宝物を還し、雑繒・絮を賜い、之に廩食せしむ。", "translation_tagged": "夜間に兵を遣わして包囲網を突破させようとしたが、{{person:曹操|公}}は迎え撃ってこれを打ち破り敗走させ、ついにその陣営を包囲した。包囲がまだ完結しないうちに、{{person:袁尚|袁尚}}は恐れをなした。もとの{{place:豫州|豫州}}{{office:刺史|刺史}}の{{person:陰夔|陰夔}}および{{person:陳琳|陳琳}}が降伏を願い出たが、{{person:曹操|公}}は許さず、包囲をいよいよ厳しくした。{{person:袁尚|袁尚}}が夜間に逃走して、{{place:祁山|祁山}}に立てこもると、これを追撃した。その部将の{{person:馬延|馬延}}・{{person:張顗|張顗}}らが戦場で降伏したため、軍勢は大崩壊し、{{person:袁尚|袁尚}}は{{place:中山|中山}}へ敗走した。その輜重を残らず獲得し、{{person:袁尚|袁尚}}の印綬と{{special:節鉞|節鉞}}を手に入れ、{{person:袁尚|袁尚}}軍の投降者に命じてその家族たちに示させると、城内の戦意は挫け崩れた。八月、{{person:審配|審配}}の兄の子の{{person:審栄|審栄}}が、夜間に自ら守備していた城の東門を開いて兵を引き入れた。{{person:審配|審配}}は迎え戦ったが敗れ、{{person:審配|審配}}を生け捕りにしてこれを斬り、{{place:鄴|鄴}}は平定された。{{person:曹操|公}}は{{person:袁紹|袁紹}}の墓に赴いて祭祀を行い、哭礼して涙を流した。{{person:袁紹|袁紹}}の妻をねぎらい、その家族の宝物を返還し、種々の絹織物や真綿を下賜し、官倉から扶持米を支給した。"}, {"id": "v1_p60_6", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 60, "type": "裴注", "raw_text": "孫盛云：昔者先王之爲誅賞也，將以懲惡勸善，永彰鑒戒。紹因世艱危，遂懷逆謀，上議神器，下干國紀。荐社汙宅，古之制也。而乃盡哀於逆臣之冢，加恩於饕餮之室，爲政之道，於斯躓矣。夫匿怨友人，前哲所恥，稅驂舊館，義無虛涕，苟道乖好絕，何哭之有！昔漢高失之於項氏，魏武遵謬於此舉，豈非百慮之一失也。", "kakikudashi": "孫盛云わく、昔者、先王の誅賞を為すや、将に以て悪を懲らし善を勧め、永く鑒戒を彰らかにせんとす。紹は世の艱危に因りて、遂に逆謀を懐き、上は神器を議し、下は国紀を干す。社を荐ぎ宅を汙すは、古の制なり。而るに乃ち哀を逆臣の冢に尽くし、恩を饕餮の室に加う、政を為すの道、斯に於て躓けり。夫れ怨みを匿して人を友とするは、前哲の恥とする所、驂を旧館に税くも、義として虚涕無し、苟くも道乖き好絶ゆれば、何の哭か之れ有らん！昔、漢高は之を項氏に失し、魏武は謬りを此の挙に遵う、豈に百慮の一失に非ずや。", "translation": "孫盛はいう、昔、先王が刑罰と褒賞を行ったのは、それによって悪を懲らしめ善を勧め、永く後世への戒めを明らかにするためであった。袁紹は世の危難に乗じて、ついに逆謀を抱き、上は帝位を窺い、下は国の綱紀を犯した。社を塞ぎ屋敷を汚水池とするのが、古の制度である。それなのに逆臣の墓で哀悼を尽くし、強欲な一族の家に恩恵を加えるとは、政を行う道は、ここにおいてつまずいたのである。そもそも怨みを隠して人と友人のように振る舞うのは、先哲が恥としたところであり、旧知の宿で副え馬を解いて弔う故事も、道理としてうわべだけの涙を流すものではないのだから、いやしくも道が背きよしみが絶えた以上、どうして哭泣することなどあろうか！昔、漢の高祖は項氏に対してこの過ちを犯し、魏の武帝はこの振る舞いにおいてその誤りを踏襲したが、なんと多くの思慮の中の一つの失策ではなかろうか。", "persons": "孫盛,袁紹,劉邦,項羽,曹操", "places": "", "era_year": "", "source_book": "", "keywords": "荐社汙宅,稅驂舊館", "raw_tagged": "{{person:孫盛|孫盛}}云：昔者先王之爲誅賞也，將以懲惡勸善，永彰鑒戒。{{person:袁紹|紹}}因世艱危，遂懷逆謀，上議神器，下干國紀。{{special:荐社汙宅|荐社汙宅}}，古之制也。而乃盡哀於逆臣之冢，加恩於饕餮之室，爲政之道，於斯躓矣。夫匿怨友人，前哲所恥，{{special:稅驂舊館|稅驂舊館}}，義無虛涕，苟道乖好絕，何哭之有！昔{{person:劉邦|漢高}}失之於{{person:項羽|項氏}}，{{person:曹操|魏武}}遵謬於此舉，豈非百慮之一失也。", "kakikudashi_tagged": "{{person:孫盛|孫盛}}云わく、昔者、先王の誅賞を為すや、将に以て悪を懲らし善を勧め、永く鑒戒を彰らかにせんとす。{{person:袁紹|紹}}は世の艱危に因りて、遂に逆謀を懐き、上は神器を議し、下は国紀を干す。{{special:荐社汙宅|社を荐ぎ宅を汙す}}は、古の制なり。而るに乃ち哀を逆臣の冢に尽くし、恩を饕餮の室に加う、政を為すの道、斯に於て躓けり。夫れ怨みを匿して人を友とするは、前哲の恥とする所、{{special:稅驂舊館|驂を旧館に税く}}も、義として虚涕無し、苟くも道乖き好絶ゆれば、何の哭か之れ有らん！昔、{{person:劉邦|漢高}}は之を{{person:項羽|項氏}}に失し、{{person:曹操|魏武}}は謬りを此の挙に遵う、豈に百慮の一失に非ずや。", "translation_tagged": "{{person:孫盛|孫盛}}はいう、昔、先王が刑罰と褒賞を行ったのは、それによって悪を懲らしめ善を勧め、永く後世への戒めを明らかにするためであった。{{person:袁紹|袁紹}}は世の危難に乗じて、ついに逆謀を抱き、上は帝位を窺い、下は国の綱紀を犯した。{{special:荐社汙宅|社を塞ぎ屋敷を汚水池とする}}のが、古の制度である。それなのに逆臣の墓で哀悼を尽くし、強欲な一族の家に恩恵を加えるとは、政を行う道は、ここにおいてつまずいたのである。そもそも怨みを隠して人と友人のように振る舞うのは、先哲が恥としたところであり、{{special:稅驂舊館|旧知の宿で副え馬を解いて弔う}}故事も、道理としてうわべだけの涙を流すものではないのだから、いやしくも道が背きよしみが絶えた以上、どうして哭泣することなどあろうか！昔、{{person:劉邦|漢の高祖}}は{{person:項羽|項氏}}に対してこの過ちを犯し、{{person:曹操|魏の武帝}}はこの振る舞いにおいてその誤りを踏襲したが、なんと多くの思慮の中の一つの失策ではなかろうか。"}, {"id": "v1_p61_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 61, "type": "本文", "raw_text": "初，紹與公共起兵，紹問公曰：「若事不輯，則方面何所可據？」公曰：「足下意以爲何如？」紹曰：「吾南據河，北阻燕、代，兼戎狄之衆，南向以爭天下，庶可以濟乎？」公曰：「吾任天下之智力，以道御之，無所不可。」", "kakikudashi": "初め、紹の公と共に兵を起こすや、紹は公に問いて曰く、「若し事の輯らざれば、則ち方面は何れの所か拠るべき？」公曰く、「足下の意は以て何如と為すか？」紹曰く、「吾は南は河に拠り、北は燕・代を阻とし、戎狄の衆を兼ね、南向して以て天下を争わば、庶わくは以て済すべきか？」公曰く、「吾は天下の智力に任じ、道を以て之を御すれば、不可なる所無し。」", "translation": "かつて、袁紹が公とともに兵を挙げたとき、袁紹は公に尋ねて言った、「もし事がうまくまとまらなかったならば、どの方面を拠点とすべきであろうか？」公は言った、「足下のお考えではいかがであろうか？」袁紹は言った、「私は南は黄河に拠り、北は燕・代を要害とし、戎狄の軍勢を併せ、南に向かって天下を争えば、あるいは成し遂げられるであろうか？」公は言った、「私は天下の知恵と力を活用し、道によってこれを統御するから、どこであっても不可ということはない。」", "persons": "袁紹,曹操", "places": "黄河,燕,代", "era_year": "初平元年（190年）頃（回想）", "source_book": "", "keywords": "", "raw_tagged": "初，{{person:袁紹|紹}}與{{person:曹操|公}}共起兵，{{person:袁紹|紹}}問{{person:曹操|公}}曰：「若事不輯，則方面何所可據？」{{person:曹操|公}}曰：「足下意以爲何如？」{{person:袁紹|紹}}曰：「吾南據{{place:黄河|河}}，北阻{{place:燕|燕}}、{{place:代|代}}，兼戎狄之衆，南向以爭天下，庶可以濟乎？」{{person:曹操|公}}曰：「吾任天下之智力，以道御之，無所不可。」", "kakikudashi_tagged": "初め、{{person:袁紹|紹}}の{{person:曹操|公}}と共に兵を起こすや、{{person:袁紹|紹}}は{{person:曹操|公}}に問いて曰く、「若し事の輯らざれば、則ち方面は何れの所か拠るべき？」{{person:曹操|公}}曰く、「足下の意は以て何如と為すか？」{{person:袁紹|紹}}曰く、「吾は南は{{place:黄河|河}}に拠り、北は{{place:燕|燕}}・{{place:代|代}}を阻とし、戎狄の衆を兼ね、南向して以て天下を争わば、庶わくは以て済すべきか？」{{person:曹操|公}}曰く、「吾は天下の智力に任じ、道を以て之を御すれば、不可なる所無し。」", "translation_tagged": "かつて、{{person:袁紹|袁紹}}が{{person:曹操|公}}とともに兵を挙げたとき、{{person:袁紹|袁紹}}は{{person:曹操|公}}に尋ねて言った、「もし事がうまくまとまらなかったならば、どの方面を拠点とすべきであろうか？」{{person:曹操|公}}は言った、「足下のお考えではいかがであろうか？」{{person:袁紹|袁紹}}は言った、「私は南は{{place:黄河|黄河}}に拠り、北は{{place:燕|燕}}・{{place:代|代}}を要害とし、戎狄の軍勢を併せ、南に向かって天下を争えば、あるいは成し遂げられるであろうか？」{{person:曹操|公}}は言った、「私は天下の知恵と力を活用し、道によってこれを統御するから、どこであっても不可ということはない。」"}, {"id": "v1_p61_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 61, "type": "裴注", "raw_text": "《傅子》曰：太祖又云：「湯、武之王，豈同土哉？若以險固爲資，則不能應機而變化也。」", "kakikudashi": "『傅子』に曰く、太祖は又た云わく、「湯・武の王たる、豈に土を同じくせんや？若し険固を以て資と為さば、則ち機に応じて変化する能わざるなり。」", "translation": "『傅子』にいう、太祖はまたこう語った、「湯王と武王が王業を成し遂げたとき、どうして同じ土地に拠ったであろうか？もし険阻堅固な地形ばかりを頼みとすれば、好機に応じて臨機応変に動くことができなくなるのである。」", "persons": "曹操,湯王,武王", "places": "", "era_year": "", "source_book": "傅子", "keywords": "", "raw_tagged": "{{special:引用史料|《傅子》}}曰：{{person:曹操|太祖}}又云：「{{person:湯王|湯}}、{{person:武王|武}}之王，豈同土哉？若以險固爲資，則不能應機而變化也。」", "kakikudashi_tagged": "{{special:引用史料|『傅子』}}に曰く、{{person:曹操|太祖}}は又た云わく、「{{person:湯王|湯}}・{{person:武王|武}}の王たる、豈に土を同じくせんや？若し険固を以て資と為さば、則ち機に応じて変化する能わざるなり。」", "translation_tagged": "{{special:引用史料|『傅子』}}にいう、{{person:曹操|太祖}}はまたこう語った、「{{person:湯王|湯王}}と{{person:武王|武王}}が王業を成し遂げたとき、どうして同じ土地に拠ったであろうか？もし険阻堅固な地形ばかりを頼みとすれば、好機に応じて臨機応変に動くことができなくなるのである。」"}, {"id": "v1_p62_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 62, "type": "本文", "raw_text": "九月，令曰：「河北罹袁氏之難，其令無出今年租賦！」重豪彊兼并之法，百姓喜恱。", "kakikudashi": "九月、令して曰く、「河北は袁氏の難に罹れり、其れ今年の租賦を出すこと無からしめよ！」豪彊兼并の法を重くすれば、百姓は喜悦す。", "translation": "九月、令を下して言った、「河北は袁氏の戦禍に苦しんだゆえ、今年の租税・賦役を免除させよ！」豪族による土地・民衆の兼併を取り締まる法を厳しくしたので、民衆は大いに喜んだ。", "persons": "曹操", "places": "河北", "era_year": "建安9年（204年）9月", "source_book": "", "keywords": "", "raw_tagged": "九月，令曰：「{{place:河北|河北}}罹袁氏之難，其令無出今年租賦！」重豪彊兼并之法，百姓喜恱。", "kakikudashi_tagged": "九月、令して曰く、「{{place:河北|河北}}は袁氏の難に罹れり、其れ今年の租賦を出すこと無からしめよ！」豪彊兼并の法を重くすれば、百姓は喜悦す。", "translation_tagged": "九月、令を下して言った、「{{place:河北|河北}}は袁氏の戦禍に苦しんだゆえ、今年の租税・賦役を免除させよ！」豪族による土地・民衆の兼併を取り締まる法を厳しくしたので、民衆は大いに喜んだ。"}, {"id": "v1_p62_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 62, "type": "裴注", "raw_text": "《魏書》載公令曰：「有國有家者，不患寡而患不均，不患貧而患不安。袁氏之治也，使豪彊擅恣，親戚兼并；下民貧弱，代出租賦，衒鬻家財，不足應命；審配宗族，至乃藏匿罪人，爲逋逃主。欲望百姓親附，甲兵彊盛，豈可得邪！其收田租畝四升，戶出絹二匹、緜二斤而已，他不得擅興發。郡國守相明檢察之，無令彊民有所隱藏，而弱民兼賦也。」", "kakikudashi": "『魏書』に公の令を載せて曰く、「国を有ち家を有つ者は、寡なきを患えずして均しからざるを患え、貧しきを患えずして安からざるを患う。袁氏の治や、豪彊をして擅恣にせしめ、親戚をして兼并せしむ。下民は貧弱にして、代わりて租賦を出し、家財を衒鬻するも、命に応ずるに足らず。審配の宗族は、乃ち罪人を蔵匿し、逋逃の主と為るに至る。百姓の親附し、甲兵の彊盛ならんことを望み欲するも、豈に得べけんや！其れ田租を収むるは畝ごとに四升、戸ごとに絹二匹・綿二斤を出さしむるのみにして、他は擅ままに興発するを得ざれ。郡国の守相は明らかに之を検察し、彊民をして隠蔵する所有りて、弱民をして兼賦せしむること無かれ。」", "translation": "『魏書』に公の令を載せていう、「国を保ち家を保つ者は、民の少ないことを憂えず負担の不公平なことを憂え、貧しいことを憂えず世の安定しないことを憂える。袁氏の政治は、豪族に専横を許し、その親族に土地や民を兼併させた。下々の民は貧しく弱いのに、代わって租税・賦役を負担させられ、家財を売り払っても、徴発の命に応じきれない有様であった。審配の一族に至っては、罪人を匿い、逃亡者たちの元締めとなる始末であった。これで民衆が親しみ従い、軍備が強盛となることを望んだところで、どうして得られようか！これより田租を徴収するにあたっては一畝につき四升とし、一戸につき絹二匹・真綿二斤を出させるのみとし、それ以外に勝手に徴発してはならない。郡国の太守・国相はこれを明確に検察し、有力な民が資産や戸口を隠匿して、弱い民が二重に税を負わされることのないようにせよ。」", "persons": "曹操,審配", "places": "", "era_year": "建安9年（204年）9月", "source_book": "魏書", "keywords": "不患寡而患不均,租調制,守相", "raw_tagged": "{{special:引用史料|《魏書》}}載{{person:曹操|公}}令曰：「有國有家者，{{special:不患寡而患不均|不患寡而患不均，不患貧而患不安}}。袁氏之治也，使豪彊擅恣，親戚兼并；下民貧弱，代出租賦，衒鬻家財，不足應命；{{person:審配|審配}}宗族，至乃藏匿罪人，爲逋逃主。欲望百姓親附，甲兵彊盛，豈可得邪！其{{special:租調制|收田租畝四升，戶出絹二匹、緜二斤}}而已，他不得擅興發。郡國{{office:守相|守相}}明檢察之，無令彊民有所隱藏，而弱民兼賦也。」", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に{{person:曹操|公}}の令を載せて曰く、「国を有ち家を有つ者は、{{special:不患寡而患不均|寡なきを患えずして均しからざるを患え、貧しきを患えずして安からざるを患う}}。袁氏の治や、豪彊をして擅恣にせしめ、親戚をして兼并せしむ。下民は貧弱にして、代わりて租賦を出し、家財を衒鬻するも、命に応ずるに足らず。{{person:審配|審配}}の宗族は、乃ち罪人を蔵匿し、逋逃の主と為るに至る。百姓の親附し、甲兵の彊盛ならんことを望み欲するも、豈に得べけんや！其れ{{special:租調制|田租を収むるは畝ごとに四升、戸ごとに絹二匹・綿二斤を出さしむる}}のみにして、他は擅ままに興発するを得ざれ。郡国の{{office:守相|守相}}は明らかに之を検察し、彊民をして隠蔵する所有りて、弱民をして兼賦せしむること無かれ。」", "translation_tagged": "{{special:引用史料|『魏書』}}に{{person:曹操|公}}の令を載せていう、「国を保ち家を保つ者は、{{special:不患寡而患不均|民の少ないことを憂えず負担の不公平なことを憂え、貧しいことを憂えず世の安定しないことを憂える}}。袁氏の政治は、豪族に専横を許し、その親族に土地や民を兼併させた。下々の民は貧しく弱いのに、代わって租税・賦役を負担させられ、家財を売り払っても、徴発の命に応じきれない有様であった。{{person:審配|審配}}の一族に至っては、罪人を匿い、逃亡者たちの元締めとなる始末であった。これで民衆が親しみ従い、軍備が強盛となることを望んだところで、どうして得られようか！これより{{special:租調制|田租を徴収するにあたっては一畝につき四升とし、一戸につき絹二匹・真綿二斤を出させる}}のみとし、それ以外に勝手に徴発してはならない。郡国の{{office:太守|太守}}・{{office:相|国相}}はこれを明確に検察し、有力な民が資産や戸口を隠匿して、弱い民が二重に税を負わされることのないようにせよ。」"}, {"id": "v1_p62_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 62, "type": "本文", "raw_text": "天子以公領冀州牧，公讓還兖州。", "kakikudashi": "天子は公を以て冀州牧を領せしめ、公は譲りて兗州を還す。", "translation": "天子は公に冀州牧を兼領させ、公は辞退して兗州を返上した。", "persons": "献帝,曹操", "places": "冀州,兗州", "era_year": "建安9年（204年）9月", "source_book": "", "keywords": "牧", "raw_tagged": "{{person:献帝|天子}}以{{person:曹操|公}}領{{place:冀州|冀州}}{{office:牧|牧}}，{{person:曹操|公}}讓還{{place:兗州|兖州}}。", "kakikudashi_tagged": "{{person:献帝|天子}}は{{person:曹操|公}}を以て{{place:冀州|冀州}}{{office:牧|牧}}を領せしめ、{{person:曹操|公}}は譲りて{{place:兗州|兗州}}を還す。", "translation_tagged": "{{person:献帝|天子}}は{{person:曹操|公}}に{{place:冀州|冀州}}{{office:牧|牧}}を兼領させ、{{person:曹操|公}}は辞退して{{place:兗州|兗州}}を返上した。"}, {"id": "v1_p63_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 63, "type": "本文", "raw_text": "公之圍鄴也，譚略取甘陵、安平、勃海、河間。尚敗，還中山。譚攻之，尚奔故安，遂并其衆。公遺譚書，責以負約，與之絕婚，女還，然後進軍。譚懼，拔平原，走保南皮。十二月，公入平原，略定諸縣。", "kakikudashi": "公の鄴を囲むや、譚は甘陵・安平・勃海・河間を略取す。尚は敗れ、中山に還る。譚は之を攻め、尚は故安に奔り、遂に其の衆を并す。公は譚に書を遺り、責むるに約に負くを以てし、之と婚を絶ち、女を還して、然る後に軍を進む。譚は懼れ、平原を抜きて、走りて南皮を保つ。十二月、公は平原に入り、諸県を略定す。", "translation": "公が鄴を包囲していたとき、袁譚は甘陵・安平・勃海・河間を攻略して奪い取った。袁尚は敗れると、中山へ引き返した。袁譚がこれを攻めると、袁尚は故安へ出奔し、袁譚はついにその軍勢を併合した。公は袁譚に書簡を送り、盟約に背いたことを責めて、婚姻関係を絶ち、その娘を送り返してから、軍を進めた。袁譚は恐れ、平原を引き払って、南皮へ逃れ立てこもった。十二月、公は平原に入り、諸県を平定した。", "persons": "曹操,袁譚,袁尚", "places": "鄴,甘陵,安平,勃海,河間,中山,故安,平原,南皮", "era_year": "建安9年（204年）10月〜12月", "source_book": "", "keywords": "", "raw_tagged": "{{person:曹操|公}}之圍{{place:鄴|鄴}}也，{{person:袁譚|譚}}略取{{place:甘陵|甘陵}}、{{place:安平|安平}}、{{place:勃海|勃海}}、{{place:河間|河間}}。{{person:袁尚|尚}}敗，還{{place:中山|中山}}。{{person:袁譚|譚}}攻之，{{person:袁尚|尚}}奔{{place:故安|故安}}，遂并其衆。{{person:曹操|公}}遺{{person:袁譚|譚}}書，責以負約，與之絕婚，女還，然後進軍。{{person:袁譚|譚}}懼，拔{{place:平原|平原}}，走保{{place:南皮|南皮}}。十二月，{{person:曹操|公}}入{{place:平原|平原}}，略定諸縣。", "kakikudashi_tagged": "{{person:曹操|公}}の{{place:鄴|鄴}}を囲むや、{{person:袁譚|譚}}は{{place:甘陵|甘陵}}・{{place:安平|安平}}・{{place:勃海|勃海}}・{{place:河間|河間}}を略取す。{{person:袁尚|尚}}は敗れ、{{place:中山|中山}}に還る。{{person:袁譚|譚}}は之を攻め、{{person:袁尚|尚}}は{{place:故安|故安}}に奔り、遂に其の衆を并す。{{person:曹操|公}}は{{person:袁譚|譚}}に書を遺り、責むるに約に負くを以てし、之と婚を絶ち、女を還して、然る後に軍を進む。{{person:袁譚|譚}}は懼れ、{{place:平原|平原}}を抜きて、走りて{{place:南皮|南皮}}を保つ。十二月、{{person:曹操|公}}は{{place:平原|平原}}に入り、諸県を略定す。", "translation_tagged": "{{person:曹操|公}}が{{place:鄴|鄴}}を包囲していたとき、{{person:袁譚|袁譚}}は{{place:甘陵|甘陵}}・{{place:安平|安平}}・{{place:勃海|勃海}}・{{place:河間|河間}}を攻略して奪い取った。{{person:袁尚|袁尚}}は敗れると、{{place:中山|中山}}へ引き返した。{{person:袁譚|袁譚}}がこれを攻めると、{{person:袁尚|袁尚}}は{{place:故安|故安}}へ出奔し、{{person:袁譚|袁譚}}はついにその軍勢を併合した。{{person:曹操|公}}は{{person:袁譚|袁譚}}に書簡を送り、盟約に背いたことを責めて、婚姻関係を絶ち、その娘を送り返してから、軍を進めた。{{person:袁譚|袁譚}}は恐れ、{{place:平原|平原}}を引き払って、{{place:南皮|南皮}}へ逃れ立てこもった。十二月、{{person:曹操|公}}は{{place:平原|平原}}に入り、諸県を平定した。"}, {"id": "v1_p64_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 64, "type": "本文", "raw_text": "十年春正月，攻譚，破之，斬譚，誅其妻子，冀州平。", "kakikudashi": "十年春正月、譚を攻め、之を破り、譚を斬り、其の妻子を誅し、冀州は平らぐ。", "translation": "十年春正月、袁譚を攻め、これを打ち破り、袁譚を斬り、その妻子を誅殺し、冀州は平定された。", "persons": "袁譚", "places": "冀州", "era_year": "建安10年（205年）正月", "source_book": "", "keywords": "", "raw_tagged": "十年春正月，攻{{person:袁譚|譚}}，破之，斬{{person:袁譚|譚}}，誅其妻子，{{place:冀州|冀州}}平。", "kakikudashi_tagged": "十年春正月、{{person:袁譚|譚}}を攻め、之を破り、{{person:袁譚|譚}}を斬り、其の妻子を誅し、{{place:冀州|冀州}}は平らぐ。", "translation_tagged": "十年春正月、{{person:袁譚|袁譚}}を攻め、これを打ち破り、{{person:袁譚|袁譚}}を斬り、その妻子を誅殺し、{{place:冀州|冀州}}は平定された。"}, {"id": "v1_p64_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 64, "type": "裴注", "raw_text": "《魏書》曰：公攻譚，旦及日中不決；公乃自執桴鼓，士卒咸奮，應時破陷。", "kakikudashi": "『魏書』に曰く、公は譚を攻むるも、旦より日中に及ぶまで決せず。公は乃ち自ら桴鼓を執れば、士卒は咸な奮い、時に応じて破り陥る。", "translation": "『魏書』にいう、公は袁譚を攻めたが、夜明けから真昼に至るまで決着がつかなかった。公がそこで自ら桴と太鼓を手に取って打ち鳴らすと、兵卒はみな奮い立ち、たちまちのうちに打ち破って陥落させた。", "persons": "曹操,袁譚", "places": "", "era_year": "建安10年（205年）正月", "source_book": "魏書", "keywords": "", "raw_tagged": "{{special:引用史料|《魏書》}}曰：{{person:曹操|公}}攻{{person:袁譚|譚}}，旦及日中不決；{{person:曹操|公}}乃自執桴鼓，士卒咸奮，應時破陷。", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に曰く、{{person:曹操|公}}は{{person:袁譚|譚}}を攻むるも、旦より日中に及ぶまで決せず。{{person:曹操|公}}は乃ち自ら桴鼓を執れば、士卒は咸な奮い、時に応じて破り陥る。", "translation_tagged": "{{special:引用史料|『魏書』}}にいう、{{person:曹操|公}}は{{person:袁譚|袁譚}}を攻めたが、夜明けから真昼に至るまで決着がつかなかった。{{person:曹操|公}}がそこで自ら桴と太鼓を手に取って打ち鳴らすと、兵卒はみな奮い立ち、たちまちのうちに打ち破って陥落させた。"}, {"id": "v1_p64_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 64, "type": "本文", "raw_text": "下令曰：「其與袁氏同惡者，與之更始。」令民不得復私讎，禁厚葬，皆一之於法。是月，袁熙大將焦觸、張南等叛攻熙、尚，熙、尚奔三郡烏丸。觸等舉其縣降，封爲列侯。初討譚時，民亡椎冰，", "kakikudashi": "令を下して曰く、「其れ袁氏と悪を同じくせし者は、之と更始せん。」民をして私讎を復するを得ざらしめ、厚葬を禁じ、皆な之を法に一にす。是の月、袁煕の大将の焦触・張南等が叛きて煕・尚を攻め、煕・尚は三郡烏丸に奔る。触等は其の県を挙げて降り、封じて列侯と為す。初め譚を討ちし時、民の椎氷より亡ぐるや、", "translation": "令を下して言った、「袁氏とともに悪事に加担した者については、これより心を入れ替えて再出発することを許す。」民が私的な仇討ちをすることを禁じ、手厚い葬儀を禁じて、すべてこれを法によって統一した。この月、袁煕の大将である焦触・張南らが反旗を翻して袁煕・袁尚を攻め、袁煕・袁尚は三郡烏丸へ出奔した。焦触らはその県を挙げて降伏し、列侯に封じられた。かつて袁譚を討った時、民が氷割りの労役から逃亡したため、", "persons": "袁煕,焦触,張南,袁尚,袁譚", "places": "", "era_year": "建安10年（205年）正月", "source_book": "", "keywords": "烏丸,列侯", "raw_tagged": "下令曰：「其與袁氏同惡者，與之更始。」令民不得復私讎，禁厚葬，皆一之於法。是月，{{person:袁煕|袁熙}}大將{{person:焦触|焦觸}}、{{person:張南|張南}}等叛攻{{person:袁煕|熙}}、{{person:袁尚|尚}}，{{person:袁煕|熙}}、{{person:袁尚|尚}}奔{{special:烏丸|三郡烏丸}}。{{person:焦触|觸}}等舉其縣降，封爲{{office:列侯|列侯}}。初討{{person:袁譚|譚}}時，民亡椎冰，", "kakikudashi_tagged": "令を下して曰く、「其れ袁氏と悪を同じくせし者は、之と更始せん。」民をして私讎を復するを得ざらしめ、厚葬を禁じ、皆な之を法に一にす。是の月、{{person:袁煕|袁煕}}の大将の{{person:焦触|焦触}}・{{person:張南|張南}}等が叛きて{{person:袁煕|煕}}・{{person:袁尚|尚}}を攻め、{{person:袁煕|煕}}・{{person:袁尚|尚}}は{{special:烏丸|三郡烏丸}}に奔る。{{person:焦触|触}}等は其の県を挙げて降り、封じて{{office:列侯|列侯}}と為す。初め{{person:袁譚|譚}}を討ちし時、民の椎氷より亡ぐるや、", "translation_tagged": "令を下して言った、「袁氏とともに悪事に加担した者については、これより心を入れ替えて再出発することを許す。」民が私的な仇討ちをすることを禁じ、手厚い葬儀を禁じて、すべてこれを法によって統一した。この月、{{person:袁煕|袁煕}}の大将である{{person:焦触|焦触}}・{{person:張南|張南}}らが反旗を翻して{{person:袁煕|袁煕}}・{{person:袁尚|袁尚}}を攻め、{{person:袁煕|袁煕}}・{{person:袁尚|袁尚}}は{{special:烏丸|三郡烏丸}}へ出奔した。{{person:焦触|焦触}}らはその県を挙げて降伏し、{{office:列侯|列侯}}に封じられた。かつて{{person:袁譚|袁譚}}を討った時、民が氷割りの労役から逃亡したため、"}, {"id": "v1_p64_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 64, "type": "裴注", "raw_text": "臣松之以爲討譚時，川渠水凍，使民椎冰以通舩，民憚役而亡。", "kakikudashi": "臣松之以為えらく、譚を討ちし時、川渠の水凍り、民をして氷を椎ちて以て船を通ぜしむるに、民は役を憚りて亡げしならん。", "translation": "臣松之が考えるに、袁譚を討った時、川や水路の水が凍りついたため、民を使って氷を打ち砕き船を通行させたところ、民はその労役を嫌がって逃亡したのであろう。", "persons": "裴松之,袁譚", "places": "", "era_year": "", "source_book": "", "keywords": "", "raw_tagged": "{{person:裴松之|臣松之}}以爲討{{person:袁譚|譚}}時，川渠水凍，使民椎冰以通舩，民憚役而亡。", "kakikudashi_tagged": "{{person:裴松之|臣松之}}以為えらく、{{person:袁譚|譚}}を討ちし時、川渠の水凍り、民をして氷を椎ちて以て船を通ぜしむるに、民は役を憚りて亡げしならん。", "translation_tagged": "{{person:裴松之|臣松之}}が考えるに、{{person:袁譚|袁譚}}を討った時、川や水路の水が凍りついたため、民を使って氷を打ち砕き船を通行させたところ、民はその労役を嫌がって逃亡したのであろう。"}, {"id": "v1_p64_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 64, "type": "本文", "raw_text": "令不得降。頃之，亡民有詣門首者，公謂曰：「聽汝則違令，殺汝則誅首，歸深自藏，無爲吏所獲。」民垂泣而去；後竟捕得。", "kakikudashi": "令して降るを得ざらしむ。頃くして、亡民に門に詣りて首する者有り、公は謂いて曰く、「汝を聴さば則ち令に違い、汝を殺さば則ち首を誅するなり、帰りて深く自ら蔵れ、吏の獲る所と為る無かれ。」民は泣を垂れて去る。後に竟に捕え得たり。", "translation": "投降することを許さぬと令を下した。しばらくして、逃亡した民の中に門に出頭して自首する者があると、公は語りかけて言った、「お前を許せば法令に背くことになり、お前を殺せば自首した者を処刑することになる、帰って深く身を隠し、役人に捕らえられるでないぞ。」民は涙を流して立ち去った。その後、ついに捕らえられた。", "persons": "曹操", "places": "", "era_year": "建安10年（205年）春", "source_book": "", "keywords": "", "raw_tagged": "令不得降。頃之，亡民有詣門首者，{{person:曹操|公}}謂曰：「聽汝則違令，殺汝則誅首，歸深自藏，無爲吏所獲。」民垂泣而去；後竟捕得。", "kakikudashi_tagged": "令して降るを得ざらしむ。頃くして、亡民に門に詣りて首する者有り、{{person:曹操|公}}は謂いて曰く、「汝を聴さば則ち令に違い、汝を殺さば則ち首を誅するなり、帰りて深く自ら蔵れ、吏の獲る所と為る無かれ。」民は泣を垂れて去る。後に竟に捕え得たり。", "translation_tagged": "投降することを許さぬと令を下した。しばらくして、逃亡した民の中に門に出頭して自首する者があると、{{person:曹操|公}}は語りかけて言った、「お前を許せば法令に背くことになり、お前を殺せば自首した者を処刑することになる、帰って深く身を隠し、役人に捕らえられるでないぞ。」民は涙を流して立ち去った。その後、ついに捕らえられた。"}, {"id": "v1_p65_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 65, "type": "本文", "raw_text": "夏四月，黑山賊張燕率其衆十餘萬降，封爲列侯。故安趙犢、霍奴等殺幽州刺史、涿郡太守。三郡烏丸攻鮮于輔於獷平。", "kakikudashi": "夏四月、黒山賊の張燕は其の衆十余万を率いて降り、封じて列侯と為す。故安の趙犢・霍奴等が幽州刺史・涿郡太守を殺す。三郡烏丸、鮮于輔を獷平に攻む。", "translation": "夏四月、黒山賊の張燕がその軍勢十余万を率いて降伏し、列侯に封じられた。故安の趙犢・霍奴らが幽州刺史・涿郡太守を殺害した。三郡烏丸が鮮于輔を獷平に攻めた。", "persons": "張燕,趙犢,霍奴,鮮于輔", "places": "故安,幽州,涿郡,獷平", "era_year": "建安10年（205年）4月", "source_book": "", "keywords": "黒山賊,列侯,刺史,太守,烏丸", "raw_tagged": "夏四月，{{special:黒山賊|黑山賊}}{{person:張燕|張燕}}率其衆十餘萬降，封爲{{office:列侯|列侯}}。{{place:故安|故安}}{{person:趙犢|趙犢}}、{{person:霍奴|霍奴}}等殺{{place:幽州|幽州}}{{office:刺史|刺史}}、{{place:涿郡|涿郡}}{{office:太守|太守}}。{{special:烏丸|三郡烏丸}}攻{{person:鮮于輔|鮮于輔}}於{{place:獷平|獷平}}。", "kakikudashi_tagged": "夏四月、{{special:黒山賊|黒山賊}}の{{person:張燕|張燕}}は其の衆十余万を率いて降り、封じて{{office:列侯|列侯}}と為す。{{place:故安|故安}}の{{person:趙犢|趙犢}}・{{person:霍奴|霍奴}}等が{{place:幽州|幽州}}{{office:刺史|刺史}}・{{place:涿郡|涿郡}}{{office:太守|太守}}を殺す。{{special:烏丸|三郡烏丸}}、{{person:鮮于輔|鮮于輔}}を{{place:獷平|獷平}}に攻む。", "translation_tagged": "夏四月、{{special:黒山賊|黒山賊}}の{{person:張燕|張燕}}がその軍勢十余万を率いて降伏し、{{office:列侯|列侯}}に封じられた。{{place:故安|故安}}の{{person:趙犢|趙犢}}・{{person:霍奴|霍奴}}らが{{place:幽州|幽州}}{{office:刺史|刺史}}・{{place:涿郡|涿郡}}{{office:太守|太守}}を殺害した。{{special:烏丸|三郡烏丸}}が{{person:鮮于輔|鮮于輔}}を{{place:獷平|獷平}}に攻めた。"}, {"id": "v1_p65_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 65, "type": "裴注", "raw_text": "《續漢書》郡國志曰：獷平，縣名，屬漁陽郡。", "kakikudashi": "『続漢書』郡国志に曰く、獷平は、県名にして、漁陽郡に属す。", "translation": "『続漢書』郡国志にいう、獷平は、県の名であり、漁陽郡に属する。", "persons": "", "places": "獷平,漁陽", "era_year": "", "source_book": "続漢書", "keywords": "", "raw_tagged": "{{special:引用史料|《續漢書》郡國志}}曰：{{place:獷平|獷平}}，縣名，屬{{place:漁陽|漁陽郡}}。", "kakikudashi_tagged": "{{special:引用史料|『続漢書』郡国志}}に曰く、{{place:獷平|獷平}}は、県名にして、{{place:漁陽|漁陽郡}}に属す。", "translation_tagged": "{{special:引用史料|『続漢書』郡国志}}にいう、{{place:獷平|獷平}}は、県の名であり、{{place:漁陽|漁陽郡}}に属する。"}, {"id": "v1_p65_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 65, "type": "本文", "raw_text": "秋八月，公征之，斬犢等，乃渡潞河救獷平，烏丸奔走出塞。", "kakikudashi": "秋八月、公は之を征し、犢等を斬り、乃ち潞河を渡りて獷平を救えば、烏丸は奔走して塞を出づ。", "translation": "秋八月、公はこれを征討し、趙犢らを斬り、そのまま潞河を渡って獷平を救援すると、烏丸は潰走して長城の外へ逃れ出た。", "persons": "曹操,趙犢", "places": "潞河,獷平", "era_year": "建安10年（205年）8月", "source_book": "", "keywords": "烏丸", "raw_tagged": "秋八月，{{person:曹操|公}}征之，斬{{person:趙犢|犢}}等，乃渡{{place:潞河|潞河}}救{{place:獷平|獷平}}，{{special:烏丸|烏丸}}奔走出塞。", "kakikudashi_tagged": "秋八月、{{person:曹操|公}}は之を征し、{{person:趙犢|犢}}等を斬り、乃ち{{place:潞河|潞河}}を渡りて{{place:獷平|獷平}}を救えば、{{special:烏丸|烏丸}}は奔走して塞を出づ。", "translation_tagged": "秋八月、{{person:曹操|公}}はこれを征討し、{{person:趙犢|趙犢}}らを斬り、そのまま{{place:潞河|潞河}}を渡って{{place:獷平|獷平}}を救援すると、{{special:烏丸|烏丸}}は潰走して長城の外へ逃れ出た。"}, {"id": "v1_p66_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 66, "type": "本文", "raw_text": "九月，令曰：「阿黨比周，先聖所疾也。聞冀州俗，父子異部，更相毀譽。昔直不疑無兄，世人謂之盜嫂；第五伯魚三娶孤女，謂之撾婦翁；王鳳擅權，谷永比之申伯；王商忠議，張匡謂之左道：此皆以白爲黑，欺天罔君者也。吾欲整齊風俗，四者不除，吾以爲羞。」冬十月，公還鄴。", "kakikudashi": "九月、令して曰く、「阿党比周は、先聖の疾む所なり。聞くならく冀州の俗は、父子が部を異にし、更も相い毀誉すと。昔、直不疑は兄無きに、世人は之を嫂を盗むと謂い；第五伯魚は三たび孤女を娶るに、之を婦翁を撾つと謂い；王鳳は権を擅にするに、谷永は之を申伯に比し；王商は忠議なるに、張匡は之を左道と謂う、此れ皆な白を以て黒と為し、天を欺き君を罔する者なり。吾は風俗を整斉せんと欲す、四者を除かずんば、吾は以て羞と為す。」冬十月、公は鄴に還る。", "translation": "九月、令を下して言った、「私党を組んでなれ合い庇い合うことは、古の聖人が憎んだところである。聞くところによれば冀州の風俗では、父と子がそれぞれ別の派閥に属し、代わる代わる互いをけなし合ったり褒め合ったりしているという。昔、直不疑には兄がいなかったのに、世間の人々は彼が兄嫁と密通したと言い立て；第五伯魚は三度も身寄りのない娘を娶ったのに、人々は彼が妻の父を殴ったと言い立て；王鳳が権力をほしいままにしていたのに、谷永は彼を申伯になぞらえて称え；王商が忠義の議論を尽くしたのに、張匡は彼を邪道であると誣告した、これらはみな白を黒と言いくるめ、天を欺き君主を惑わす者たちである。私は風俗を正し整えたいと願っており、この四つの悪弊を取り除けなければ、私はそれを恥とする。」冬十月、公は鄴へ帰還した。", "persons": "直不疑,第五倫,王鳳,谷永,申伯,王商,張匡,曹操", "places": "冀州,鄴", "era_year": "建安10年（205年）9月〜10月", "source_book": "", "keywords": "", "raw_tagged": "九月，令曰：「阿黨比周，先聖所疾也。聞{{place:冀州|冀州}}俗，父子異部，更相毀譽。昔{{person:直不疑|直不疑}}無兄，世人謂之盜嫂；{{person:第五倫|第五伯魚}}三娶孤女，謂之撾婦翁；{{person:王鳳|王鳳}}擅權，{{person:谷永|谷永}}比之{{person:申伯|申伯}}；{{person:王商|王商}}忠議，{{person:張匡|張匡}}謂之左道：此皆以白爲黑，欺天罔君者也。吾欲整齊風俗，四者不除，吾以爲羞。」冬十月，{{person:曹操|公}}還{{place:鄴|鄴}}。", "kakikudashi_tagged": "九月、令して曰く、「阿党比周は、先聖の疾む所なり。聞くならく{{place:冀州|冀州}}の俗は、父子が部を異にし、更も相い毀誉すと。昔、{{person:直不疑|直不疑}}は兄無きに、世人は之を嫂を盗むと謂い；{{person:第五倫|第五伯魚}}は三たび孤女を娶るに、之を婦翁を撾つと謂い；{{person:王鳳|王鳳}}は権を擅にするに、{{person:谷永|谷永}}は之を{{person:申伯|申伯}}に比し；{{person:王商|王商}}は忠議なるに、{{person:張匡|張匡}}は之を左道と謂う、此れ皆な白を以て黒と為し、天を欺き君を罔する者なり。吾は風俗を整斉せんと欲す、四者を除かずんば、吾は以て羞と為す。」冬十月、{{person:曹操|公}}は{{place:鄴|鄴}}に還る。", "translation_tagged": "九月、令を下して言った、「私党を組んでなれ合い庇い合うことは、古の聖人が憎んだところである。聞くところによれば{{place:冀州|冀州}}の風俗では、父と子がそれぞれ別の派閥に属し、代わる代わる互いをけなし合ったり褒め合ったりしているという。昔、{{person:直不疑|直不疑}}には兄がいなかったのに、世間の人々は彼が兄嫁と密通したと言い立て；{{person:第五倫|第五伯魚}}は三度も身寄りのない娘を娶ったのに、人々は彼が妻の父を殴ったと言い立て；{{person:王鳳|王鳳}}が権力をほしいままにしていたのに、{{person:谷永|谷永}}は彼を{{person:申伯|申伯}}になぞらえて称え；{{person:王商|王商}}が忠義の議論を尽くしたのに、{{person:張匡|張匡}}は彼を邪道であると誣告した、これらはみな白を黒と言いくるめ、天を欺き君主を惑わす者たちである。私は風俗を正し整えたいと願っており、この四つの悪弊を取り除けなければ、私はそれを恥とする。」冬十月、{{person:曹操|公}}は{{place:鄴|鄴}}へ帰還した。"}, {"id": "v1_p67_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 67, "type": "本文", "raw_text": "初，袁紹以甥高幹領并州牧，公之拔鄴，幹降，遂以爲刺史。幹聞公討烏丸，乃以州叛，執上黨太守，舉兵守壺關口。遣樂進、李典擊之，幹還守壺關城。十一年春正月，公征幹。幹聞之，乃留其別將守城，走入匈奴，求救於單于，單于不受。公圍壺關三月，拔之。幹遂走荊州，上洛都尉王琰捕斬之。", "kakikudashi": "初め、袁紹は甥の高幹を以て并州牧を領せしめ、公の鄴を抜くや、幹は降り、遂に以て刺史と為す。幹は公の烏丸を討つを聞き、乃ち州を以て叛き、上党太守を執らえ、兵を挙げて壺関口を守る。楽進・李典を遣わして之を撃たしむれば、幹は還りて壺関城を守る。十一年春正月、公は幹を征す。幹は之を聞き、乃ち其の別将を留めて城を守らしめ、走りて匈奴に入り、救いを単于に求むるも、単于は受けず。公は壺関を囲むこと三月にして、之を抜く。幹は遂に荊州に走り、上洛都尉の王琰が捕らえて之を斬る。", "translation": "かつて、袁紹は甥の高幹に并州牧を兼領させていたが、公が鄴を陥落させると、高幹は降伏したため、そのまま刺史とした。高幹は公が烏丸を討伐していると聞くと、州を挙げて反旗を翻し、上党太守を捕らえ、兵を挙げて壺関口を守備した。楽進・李典を派遣してこれを攻撃させると、高幹は引き返して壺関城に立てこもった。十一年春正月、公は高幹を征討した。高幹はこれを聞くと、別将を残して城を守らせ、逃走して匈奴へ入り、単于に救援を求めたが、単于は受け入れなかった。公は壺関を三か月包囲して、これを陥落させた。高幹はついに荊州へ向かって逃走したが、上洛都尉の王琰が捕らえてこれを斬った。", "persons": "袁紹,高幹,曹操,楽進,李典,呼厨泉,王琰", "places": "并州,鄴,上党,壺関口,壺関,荊州,上洛", "era_year": "建安10年（205年）冬〜建安11年（206年）3月", "source_book": "", "keywords": "牧,刺史,烏丸,太守,匈奴,都尉", "raw_tagged": "初，{{person:袁紹|袁紹}}以甥{{person:高幹|高幹}}領{{place:并州|并州}}{{office:牧|牧}}，{{person:曹操|公}}之拔{{place:鄴|鄴}}，{{person:高幹|幹}}降，遂以爲{{office:刺史|刺史}}。{{person:高幹|幹}}聞{{person:曹操|公}}討{{special:烏丸|烏丸}}，乃以州叛，執{{place:上党|上黨}}{{office:太守|太守}}，舉兵守{{place:壺関口|壺關口}}。遣{{person:楽進|樂進}}、{{person:李典|李典}}擊之，{{person:高幹|幹}}還守{{place:壺関|壺關城}}。十一年春正月，{{person:曹操|公}}征{{person:高幹|幹}}。{{person:高幹|幹}}聞之，乃留其別將守城，走入{{special:匈奴|匈奴}}，求救於{{person:呼厨泉|單于}}，{{person:呼厨泉|單于}}不受。{{person:曹操|公}}圍{{place:壺関|壺關}}三月，拔之。{{person:高幹|幹}}遂走{{place:荊州|荊州}}，{{place:上洛|上洛}}{{office:都尉|都尉}}{{person:王琰|王琰}}捕斬之。", "kakikudashi_tagged": "初め、{{person:袁紹|袁紹}}は甥の{{person:高幹|高幹}}を以て{{place:并州|并州}}{{office:牧|牧}}を領せしめ、{{person:曹操|公}}の{{place:鄴|鄴}}を抜くや、{{person:高幹|幹}}は降り、遂に以て{{office:刺史|刺史}}と為す。{{person:高幹|幹}}は{{person:曹操|公}}の{{special:烏丸|烏丸}}を討つを聞き、乃ち州を以て叛き、{{place:上党|上党}}{{office:太守|太守}}を執らえ、兵を挙げて{{place:壺関口|壺関口}}を守る。{{person:楽進|楽進}}・{{person:李典|李典}}を遣わして之を撃たしむれば、{{person:高幹|幹}}は還りて{{place:壺関|壺関城}}を守る。十一年春正月、{{person:曹操|公}}は{{person:高幹|幹}}を征す。{{person:高幹|幹}}は之を聞き、乃ち其の別将を留めて城を守らしめ、走りて{{special:匈奴|匈奴}}に入り、救いを{{person:呼厨泉|単于}}に求むるも、{{person:呼厨泉|単于}}は受けず。{{person:曹操|公}}は{{place:壺関|壺関}}を囲むこと三月にして、之を抜く。{{person:高幹|幹}}は遂に{{place:荊州|荊州}}に走り、{{place:上洛|上洛}}{{office:都尉|都尉}}の{{person:王琰|王琰}}が捕らえて之を斬る。", "translation_tagged": "かつて、{{person:袁紹|袁紹}}は甥の{{person:高幹|高幹}}に{{place:并州|并州}}{{office:牧|牧}}を兼領させていたが、{{person:曹操|公}}が{{place:鄴|鄴}}を陥落させると、{{person:高幹|高幹}}は降伏したため、そのまま{{office:刺史|刺史}}とした。{{person:高幹|高幹}}は{{person:曹操|公}}が{{special:烏丸|烏丸}}を討伐していると聞くと、州を挙げて反旗を翻し、{{place:上党|上党}}{{office:太守|太守}}を捕らえ、兵を挙げて{{place:壺関口|壺関口}}を守備した。{{person:楽進|楽進}}・{{person:李典|李典}}を派遣してこれを攻撃させると、{{person:高幹|高幹}}は引き返して{{place:壺関|壺関城}}に立てこもった。十一年春正月、{{person:曹操|公}}は{{person:高幹|高幹}}を征討した。{{person:高幹|高幹}}はこれを聞くと、別将を残して城を守らせ、逃走して{{special:匈奴|匈奴}}へ入り、{{person:呼厨泉|単于}}に救援を求めたが、{{person:呼厨泉|単于}}は受け入れなかった。{{person:曹操|公}}は{{place:壺関|壺関}}を三か月包囲して、これを陥落させた。{{person:高幹|高幹}}はついに{{place:荊州|荊州}}へ向かって逃走したが、{{place:上洛|上洛}}{{office:都尉|都尉}}の{{person:王琰|王琰}}が捕らえてこれを斬った。"}, {"id": "v1_p68_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 68, "type": "本文", "raw_text": "秋八月，公東征海賊管承，至淳于，遣樂進、李典擊破之，承走入海島。割東海之襄賁、郯、戚以益琅邪，省昌慮郡。", "kakikudashi": "秋八月、公は海賊の管承を東征し、淳于に至り、楽進・李典を遣わして撃ちて之を破らしめ、承は走りて海島に入る。東海の襄賁・郯・戚を割きて以て琅邪に益し、昌慮郡を省く。", "translation": "秋八月、公は海賊の管承を東征して淳于に至り、楽進・李典を派遣してこれを撃ち破らせると、管承は逃走して海の島へ入った。東海の襄賁・郯・戚を割いて琅邪に編入し、昌慮郡を廃止した。", "persons": "曹操,管承,楽進,李典", "places": "淳于,東海,襄賁,郯,戚,琅邪,昌慮", "era_year": "建安11年（206年）8月", "source_book": "", "keywords": "", "raw_tagged": "秋八月，{{person:曹操|公}}東征海賊{{person:管承|管承}}，至{{place:淳于|淳于}}，遣{{person:楽進|樂進}}、{{person:李典|李典}}擊破之，{{person:管承|承}}走入海島。割{{place:東海|東海}}之{{place:襄賁|襄賁}}、{{place:郯|郯}}、{{place:戚|戚}}以益{{place:琅邪|琅邪}}，省{{place:昌慮|昌慮郡}}。", "kakikudashi_tagged": "秋八月、{{person:曹操|公}}は海賊の{{person:管承|管承}}を東征し、{{place:淳于|淳于}}に至り、{{person:楽進|楽進}}・{{person:李典|李典}}を遣わして撃ちて之を破らしめ、{{person:管承|承}}は走りて海島に入る。{{place:東海|東海}}の{{place:襄賁|襄賁}}・{{place:郯|郯}}・{{place:戚|戚}}を割きて以て{{place:琅邪|琅邪}}に益し、{{place:昌慮|昌慮郡}}を省く。", "translation_tagged": "秋八月、{{person:曹操|公}}は海賊の{{person:管承|管承}}を東征して{{place:淳于|淳于}}に至り、{{person:楽進|楽進}}・{{person:李典|李典}}を派遣してこれを撃ち破らせると、{{person:管承|管承}}は逃走して海の島へ入った。{{place:東海|東海}}の{{place:襄賁|襄賁}}・{{place:郯|郯}}・{{place:戚|戚}}を割いて{{place:琅邪|琅邪}}に編入し、{{place:昌慮|昌慮郡}}を廃止した。"}, {"id": "v1_p68_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 68, "type": "裴注", "raw_text": "《魏書》載十月乙亥令曰：「夫治世御衆，建立輔弼，誡在面從，詩稱『聽用我謀，庶無大悔』，斯實君臣懇懇之求也。吾充重任，每懼失中，頻年已來，不聞嘉謀，豈吾開延不勤之咎邪？自今已後，諸掾屬治中、別駕，常以月旦各言其失，吾將覽焉。」", "kakikudashi": "『魏書』に十月乙亥の令を載せて曰く、「夫れ世を治め衆を御し、輔弼を建立するは、誡め面従に在り、詩に『我が謀を聴き用うれば、庶わくは大悔無からん』と称するは、斯れ実に君臣の懇懇の求めなり。吾は重任に充たり、毎に中を失うを懼るるに、頻年已来、嘉謀を聞かざるは、豈に吾が開延するに勤めざるの咎ならんや？今より已後、諸々の掾属・治中・別駕は、常に月旦を以て各々其の失を言え、吾は将に焉を覧んとす。」", "translation": "『魏書』に十月乙亥の令を載せていう、「そもそも世を治め人々を統御し、補佐の臣を設けるにあたって、戒むべきはうわべばかり従うことにあり、『詩』に『私の謀を聴き入れて用いるならば、おそらく大きな後悔はないであろう』と述べているのは、これこそまことに君臣が真心から求め合うところである。私は重い責務に当たり、常に中正を失うことを恐れているが、ここ数年というもの、すぐれた献策を聞かないのは、私が人材を招き入れて耳を傾けることに努めてこなかった過ちであろうか？今よりのち、諸々の掾属・治中・別駕は、常に毎月一日にそれぞれ私の過失を述べよ、私はそれに目を通すこととする。」", "persons": "", "places": "", "era_year": "建安11年（206年）10月", "source_book": "魏書", "keywords": "掾属,従事,別駕", "raw_tagged": "{{special:引用史料|《魏書》}}載十月乙亥令曰：「夫治世御衆，建立輔弼，誡在面從，詩稱『聽用我謀，庶無大悔』，斯實君臣懇懇之求也。吾充重任，每懼失中，頻年已來，不聞嘉謀，豈吾開延不勤之咎邪？自今已後，諸{{office:掾属|掾屬}}{{office:従事|治中}}、{{office:別駕|別駕}}，常以月旦各言其失，吾將覽焉。」", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に十月乙亥の令を載せて曰く、「夫れ世を治め衆を御し、輔弼を建立するは、誡め面従に在り、詩に『我が謀を聴き用うれば、庶わくは大悔無からん』と称するは、斯れ実に君臣の懇懇の求めなり。吾は重任に充たり、毎に中を失うを懼るるに、頻年已来、嘉謀を聞かざるは、豈に吾が開延するに勤めざるの咎ならんや？今より已後、諸々の{{office:掾属|掾属}}・{{office:従事|治中}}・{{office:別駕|別駕}}は、常に月旦を以て各々其の失を言え、吾は将に焉を覧んとす。」", "translation_tagged": "{{special:引用史料|『魏書』}}に十月乙亥の令を載せていう、「そもそも世を治め人々を統御し、補佐の臣を設けるにあたって、戒むべきはうわべばかり従うことにあり、『詩』に『私の謀を聴き入れて用いるならば、おそらく大きな後悔はないであろう』と述べているのは、これこそまことに君臣が真心から求め合うところである。私は重い責務に当たり、常に中正を失うことを恐れているが、ここ数年というもの、すぐれた献策を聞かないのは、私が人材を招き入れて耳を傾けることに努めてこなかった過ちであろうか？今よりのち、諸々の{{office:掾属|掾属}}・{{office:従事|治中}}・{{office:別駕|別駕}}は、常に毎月一日にそれぞれ私の過失を述べよ、私はそれに目を通すこととする。」"}, {"id": "v1_p69_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 69, "type": "本文", "raw_text": "三郡烏丸承天下亂，破幽州，略有漢民合十餘萬戶。袁紹皆立其酋豪爲單于，以家人子爲己女，妻焉。遼西單于蹋頓尤彊，爲紹所厚，故尚兄弟歸之，數入塞爲害。公將征之，鑿渠，自呼沲入泒水，", "kakikudashi": "三郡烏丸は天下の乱に乗じ、幽州を破り、漢の民を略して有すること合して十余万戸なり。袁紹は皆其の酋豪を立てて単于と為し、家人の子を以て己が女と為し、焉に妻あわす。遼西単于の蹋頓は尤も強く、紹の厚くする所と為り、故に尚の兄弟は之に帰し、しばしば塞に入りて害を為す。公は将に之を征せんとし、渠を鑿ち、呼沲より泒水に入れ、", "translation": "三郡烏丸は天下の戦乱に乗じて幽州を破り、漢の民を略奪してあわせて十余万戸を傘下に置いていた。袁紹は彼らの有力首長たちをみな立てて単于とし、配下の家人の娘を実の娘として、彼らに娶わせていた。遼西単于の蹋頓がとりわけ強盛で、袁紹から厚遇されていたため、袁尚の兄弟はこれに身を寄せ、たびたび塞内に侵入しては害をなしていた。公はこれを征討しようとして運河を開鑿し、呼沲より泒水へ引き入れ、", "persons": "袁紹,蹋頓,袁尚,曹操", "places": "幽州,遼西,呼沲,泒水", "era_year": "建安11年（206年）冬", "source_book": "", "keywords": "烏丸,単于", "raw_tagged": "{{special:烏丸|三郡烏丸}}承天下亂，破{{place:幽州|幽州}}，略有漢民合十餘萬戶。{{person:袁紹|袁紹}}皆立其酋豪爲{{office:単于|單于}}，以家人子爲己女，妻焉。{{place:遼西|遼西}}{{office:単于|單于}}{{person:蹋頓|蹋頓}}尤彊，爲{{person:袁紹|紹}}所厚，故{{person:袁尚|尚}}兄弟歸之，數入塞爲害。{{person:曹操|公}}將征之，鑿渠，自{{place:呼沲|呼沲}}入{{place:泒水|泒水}}，", "kakikudashi_tagged": "{{special:烏丸|三郡烏丸}}は天下の乱に乗じ、{{place:幽州|幽州}}を破り、漢の民を略して有すること合して十余万戸なり。{{person:袁紹|袁紹}}は皆其の酋豪を立てて{{office:単于|単于}}と為し、家人の子を以て己が女と為し、焉に妻あわす。{{place:遼西|遼西}}{{office:単于|単于}}の{{person:蹋頓|蹋頓}}は尤も強く、{{person:袁紹|紹}}の厚くする所と為り、故に{{person:袁尚|尚}}の兄弟は之に帰し、しばしば塞に入りて害を為す。{{person:曹操|公}}は将に之を征せんとし、渠を鑿ち、{{place:呼沲|呼沲}}より{{place:泒水|泒水}}に入れ、", "translation_tagged": "{{special:烏丸|三郡烏丸}}は天下の戦乱に乗じて{{place:幽州|幽州}}を破り、漢の民を略奪してあわせて十余万戸を傘下に置いていた。{{person:袁紹|袁紹}}は彼らの有力首長たちをみな立てて{{office:単于|単于}}とし、配下の家人の娘を実の娘として、彼らに娶わせていた。{{place:遼西|遼西}}{{office:単于|単于}}の{{person:蹋頓|蹋頓}}がとりわけ強盛で、{{person:袁紹|袁紹}}から厚遇されていたため、{{person:袁尚|袁尚}}の兄弟はこれに身を寄せ、たびたび塞内に侵入しては害をなしていた。{{person:曹操|公}}はこれを征討しようとして運河を開鑿し、{{place:呼沲|呼沲}}より{{place:泒水|泒水}}へ引き入れ、"}, {"id": "v1_p69_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 69, "type": "裴注", "raw_text": "泒音孤。", "kakikudashi": "泒の音は孤なり。", "translation": "「泒」の音は「孤（こ）」である。", "persons": "", "places": "", "era_year": "", "source_book": "", "keywords": "", "raw_tagged": "泒音孤。", "kakikudashi_tagged": "泒の音は孤なり。", "translation_tagged": "「泒」の音は「孤（こ）」である。"}, {"id": "v1_p69_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 69, "type": "本文", "raw_text": "名平虜渠；又從泃河口", "kakikudashi": "名づけて平虜渠と曰い；又た泃河口より", "translation": "平虜渠と名づけ；また泃河口から", "persons": "", "places": "平虜渠,泃河口", "era_year": "建安11年（206年）冬", "source_book": "", "keywords": "", "raw_tagged": "名{{place:平虜渠|平虜渠}}；又從{{place:泃河口|泃河口}}", "kakikudashi_tagged": "名づけて{{place:平虜渠|平虜渠}}と曰い；又た{{place:泃河口|泃河口}}より", "translation_tagged": "{{place:平虜渠|平虜渠}}と名づけ；また{{place:泃河口|泃河口}}から"}, {"id": "v1_p69_4", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 69, "type": "裴注", "raw_text": "泃音句。", "kakikudashi": "泃の音は句なり。", "translation": "「泃」の音は「句（く）」である。", "persons": "", "places": "", "era_year": "", "source_book": "", "keywords": "", "raw_tagged": "泃音句。", "kakikudashi_tagged": "泃の音は句なり。", "translation_tagged": "「泃」の音は「句（く）」である。"}, {"id": "v1_p69_5", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 69, "type": "本文", "raw_text": "鑿入潞河，名泉州渠，以通海。", "kakikudashi": "鑿ちて潞河に入れ、名づけて泉州渠と曰い、以て海に通ず。", "translation": "開鑿して潞河へ引き入れ、泉州渠と名づけて、海へと通じさせた。", "persons": "", "places": "潞河,泉州渠", "era_year": "建安11年（206年）冬", "source_book": "", "keywords": "", "raw_tagged": "鑿入{{place:潞河|潞河}}，名{{place:泉州渠|泉州渠}}，以通海。", "kakikudashi_tagged": "鑿ちて{{place:潞河|潞河}}に入れ、名づけて{{place:泉州渠|泉州渠}}と曰い、以て海に通ず。", "translation_tagged": "開鑿して{{place:潞河|潞河}}へ引き入れ、{{place:泉州渠|泉州渠}}と名づけて、海へと通じさせた。"}, {"id": "v1_p70_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 70, "type": "本文", "raw_text": "十二年春二月，公自淳于還鄴。丁酋，令曰：「吾起義兵誅暴亂，於今十九年，所征必克，豈吾功哉？乃賢士大夫之力也。天下雖未悉定，吾當要與賢士大夫共定之；而專饗其勞，吾何以安焉！其促定功行封。」於是大封功臣二十餘人，皆爲列侯，其餘各以次受封，及復死事之孤，輕重各有差。", "kakikudashi": "十二年春二月、公は淳于より鄴に還る。丁酉、令して曰く、「吾は義兵を起こして暴乱を誅し、今に於いて十九年、征する所は必ず克つも、豈に吾が功ならんや？乃ち賢士大夫の力なり。天下は未だ悉くは定まらずと雖も、吾は当に要ず賢士大夫と与に共に之を定むべし；而るに専ら其の労を饗くれば、吾は何を以てか焉に安んぜん！其れ促やかに功を定めて封を行え。」是に於いて大いに功臣二十余人を封じて、皆列侯と為し、其の余も各々次を以て封を受け、及び事に死せし者の孤を復すること、軽重各々差有り。", "translation": "十二年春二月、公は淳于より鄴へ帰還した。丁酉の日、令を下して言った、「私が義兵を起こして暴乱を討つこと、今日に至るまで十九年、征討するところ必ず勝利を収めてきたが、どうして私ひとりの功績であろうか？これこそ賢士大夫の力によるものである。天下はいまだすべて平定されたわけではないが、私は必ずや賢士大夫とともに力を合わせてこれを平定するつもりである；それなのにその労苦の報いを私ひとりで享受するならば、どうして心安らかにいられようか！速やかに功績を査定して封賞を行え。」そこで功臣二十余人に大々的な封賞を行ってみな列侯とし、その他の者もそれぞれ順を追って封賞を受け、あわせて戦死者の遺児の租税・労役を免除すること、功績の軽重に応じてそれぞれ差等をつけた。", "persons": "曹操", "places": "淳于,鄴", "era_year": "建安12年（207年）2月", "source_book": "", "keywords": "列侯", "raw_tagged": "十二年春二月，{{person:曹操|公}}自{{place:淳于|淳于}}還{{place:鄴|鄴}}。丁酋，令曰：「吾起義兵誅暴亂，於今十九年，所征必克，豈吾功哉？乃賢士大夫之力也。天下雖未悉定，吾當要與賢士大夫共定之；而專饗其勞，吾何以安焉！其促定功行封。」於是大封功臣二十餘人，皆爲{{office:列侯|列侯}}，其餘各以次受封，及復死事之孤，輕重各有差。", "kakikudashi_tagged": "十二年春二月、{{person:曹操|公}}は{{place:淳于|淳于}}より{{place:鄴|鄴}}に還る。丁酉、令して曰く、「吾は義兵を起こして暴乱を誅し、今に於いて十九年、征する所は必ず克つも、豈に吾が功ならんや？乃ち賢士大夫の力なり。天下は未だ悉くは定まらずと雖も、吾は当に要ず賢士大夫と与に共に之を定むべし；而るに専ら其の労を饗くれば、吾は何を以てか焉に安んぜん！其れ促やかに功を定めて封を行え。」是に於いて大いに功臣二十余人を封じて、皆{{office:列侯|列侯}}と為し、其の余も各々次を以て封を受け、及び事に死せし者の孤を復すること、軽重各々差有り。", "translation_tagged": "十二年春二月、{{person:曹操|公}}は{{place:淳于|淳于}}より{{place:鄴|鄴}}へ帰還した。丁酉の日、令を下して言った、「私が義兵を起こして暴乱を討つこと、今日に至るまで十九年、征討するところ必ず勝利を収めてきたが、どうして私ひとりの功績であろうか？これこそ賢士大夫の力によるものである。天下はいまだすべて平定されたわけではないが、私は必ずや賢士大夫とともに力を合わせてこれを平定するつもりである；それなのにその労苦の報いを私ひとりで享受するならば、どうして心安らかにいられようか！速やかに功績を査定して封賞を行え。」そこで功臣二十余人に大々的な封賞を行ってみな{{office:列侯|列侯}}とし、その他の者もそれぞれ順を追って封賞を受け、あわせて戦死者の遺児の租税・労役を免除すること、功績の軽重に応じてそれぞれ差等をつけた。"}, {"id": "v1_p70_2", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 70, "type": "裴注", "raw_text": "《魏書》載公令曰：「昔趙奢、竇嬰之爲將也，受賜千金，一朝散之，故能濟成大功，永世流聲。吾讀其文，未甞不慕其爲人也。與諸將士大夫共從戎事，幸賴賢人不愛其謀，羣士不遺其力，是以夷險平亂，而吾得竊大賞，戶邑三萬。追思竇嬰散金之義，今分所受租與諸將掾屬及故戍於陳、蔡者，庶以疇荅衆勞，不擅大惠也。宜差死事之孤，以租穀及之。若年殷用足，租奉畢入，將大與衆人悉共饗之。」", "kakikudashi": "『魏書』に公の令を載せて曰く、「昔、趙奢・竇嬰の将と為るや、賜うこと千金を受くるも、一朝にして之を散じ、故に能く大功を済成し、永世に声を流せり。吾は其の文を読み、未だ嘗て其の人と為りを慕わずんばあらざるなり。諸将・士大夫と共に戎事に従い、幸いに賢人の其の謀を愛しまず、群士の其の力を遺さざるに頼り、是を以て険を夷らげ乱を平らげ、而して吾は大賞を窃み、戸邑三万を得るを得たり。竇嬰が金を散ぜしの義を追思し、今、受くる所の租を分かちて諸将・掾属及び故の陳・蔡に戍せし者に与え、庶わくは以て衆の労に疇荅し、大恵を擅ままにせざらん。宜しく事に死せし者の孤に差をつけ、租穀を以て之に及ぼすべし。若し年殷んにして用足り、租奉畢く入らば、将に大いに衆人と悉く共に之を饗けんとす。」", "translation": "『魏書』に公の令を載せていう、「昔、趙奢や竇嬰が将軍であったとき、千金もの下賜を受けながら、一朝にしてこれを配下に分け与え、それゆえに大功を成し遂げて、永く後世に名声を伝えた。私はその記録を読むたび、いつもその人柄を慕わしく思わずにはいられなかった。諸将や士大夫とともに軍事に従い、幸いにも賢人たちが知謀を惜しまず、多くの士が力を尽くしてくれたおかげで、険難を平らげて戦乱を鎮めることができ、私は身に余る恩賞を忝なくして、食邑三万戸を賜るに至った。竇嬰が黄金を分け与えた義挙に思いを致し、いま私が受け取る租税を分けて諸将・掾属およびかつて陳・蔡で守備に就いた者たちに与え、それによって皆の労苦に報い、大きな恩恵を私ひとりで独占しないこととしたい。戦死者の遺児たちにも功績に応じて差等をつけ、租税の穀物を分け与えるようにせよ。もし豊作となって財用が満ち足り、租税や俸禄がすべて納められたならば、大いに皆と残らずこれを分かち合って享受するつもりである。」", "persons": "曹操,趙奢,竇嬰", "places": "陳国,蔡", "era_year": "建安12年（207年）2月", "source_book": "魏書", "keywords": "掾属", "raw_tagged": "{{special:引用史料|《魏書》}}載{{person:曹操|公}}令曰：「昔{{person:趙奢|趙奢}}、{{person:竇嬰|竇嬰}}之爲將也，受賜千金，一朝散之，故能濟成大功，永世流聲。吾讀其文，未甞不慕其爲人也。與諸將士大夫共從戎事，幸賴賢人不愛其謀，羣士不遺其力，是以夷險平亂，而吾得竊大賞，戶邑三萬。追思{{person:竇嬰|竇嬰}}散金之義，今分所受租與諸將{{office:掾属|掾屬}}及故戍於{{place:陳国|陳}}、{{place:蔡|蔡}}者，庶以疇荅衆勞，不擅大惠也。宜差死事之孤，以租穀及之。若年殷用足，租奉畢入，將大與衆人悉共饗之。」", "kakikudashi_tagged": "{{special:引用史料|『魏書』}}に{{person:曹操|公}}の令を載せて曰く、「昔、{{person:趙奢|趙奢}}・{{person:竇嬰|竇嬰}}の将と為るや、賜うこと千金を受くるも、一朝にして之を散じ、故に能く大功を済成し、永世に声を流せり。吾は其の文を読み、未だ嘗て其の人と為りを慕わずんばあらざるなり。諸将・士大夫と共に戎事に従い、幸いに賢人の其の謀を愛しまず、群士の其の力を遺さざるに頼り、是を以て険を夷らげ乱を平らげ、而して吾は大賞を窃み、戸邑三万を得るを得たり。{{person:竇嬰|竇嬰}}が金を散ぜしの義を追思し、今、受くる所の租を分かちて諸将・{{office:掾属|掾属}}及び故の{{place:陳国|陳}}・{{place:蔡|蔡}}に戍せし者に与え、庶わくは以て衆の労に疇荅し、大恵を擅ままにせざらん。宜しく事に死せし者の孤に差をつけ、租穀を以て之に及ぼすべし。若し年殷んにして用足り、租奉畢く入らば、将に大いに衆人と悉く共に之を饗けんとす。」", "translation_tagged": "{{special:引用史料|『魏書』}}に{{person:曹操|公}}の令を載せていう、「昔、{{person:趙奢|趙奢}}や{{person:竇嬰|竇嬰}}が将軍であったとき、千金もの下賜を受けながら、一朝にしてこれを配下に分け与え、それゆえに大功を成し遂げて、永く後世に名声を伝えた。私はその記録を読むたび、いつもその人柄を慕わしく思わずにはいられなかった。諸将や士大夫とともに軍事に従い、幸いにも賢人たちが知謀を惜しまず、多くの士が力を尽くしてくれたおかげで、険難を平らげて戦乱を鎮めることができ、私は身に余る恩賞を忝なくして、食邑三万戸を賜るに至った。{{person:竇嬰|竇嬰}}が黄金を分け与えた義挙に思いを致し、いま私が受け取る租税を分けて諸将・{{office:掾属|掾属}}およびかつて{{place:陳国|陳}}・{{place:蔡|蔡}}で守備に就いた者たちに与え、それによって皆の労苦に報い、大きな恩恵を私ひとりで独占しないこととしたい。戦死者の遺児たちにも功績に応じて差等をつけ、租税の穀物を分け与えるようにせよ。もし豊作となって財用が満ち足り、租税や俸禄がすべて納められたならば、大いに皆と残らずこれを分かち合って享受するつもりである。」"}, {"id": "v1_p71_1", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 71, "type": "本文", "raw_text": "將北征三郡烏丸，諸將皆曰：「袁尚，亡虜耳，夷狄貪而無親，豈能爲尚用？今深入征之，劉備必說劉表以襲許。萬一爲變，事不可悔。」惟郭嘉策表必不能任備，勸公行。夏五月，至無終。秋七月，大水，傍海道不通，田疇請爲鄉導，公從之。引軍出盧龍塞，塞外道絕不通，乃壍山堙谷五百餘里，經白檀，歷平岡，涉鮮卑庭，東指柳城。未至二百里，虜乃知之。尚、熙與蹋頓、遼西單于樓班、右北平單于能臣抵之等，將數萬騎逆軍。八月，登白狼山，卒與虜遇，衆甚盛。公車重在後，被甲者少，左右皆懼。公登高，望虜陣不整，乃縱兵擊之，使張遼爲先鋒，虜衆大崩，斬蹋頓及名王已下，胡、漢降者二十餘萬口。遼東單于速僕丸及遼西、北平諸豪，棄其種人，與尚、熙奔遼東，衆尚有數千騎。初，遼東太守公孫康恃遠不服。及公破烏丸，或說公遂征之，尚兄弟可禽也。公曰：「吾方使康斬送尚、熙首，不煩兵矣。」九月，公引兵自柳城還，", "kakikudashi": "将に三郡烏丸を北征せんとするとき、諸将は皆曰く、「袁尚は亡虜なるのみ、夷狄は貪にして親しみ無ければ、豈に能く尚の為に用いられんや？今、深く入りて之を征せば、劉備は必ず劉表に説きて以て許を襲わん。万一変を為さば、事は悔ゆべからず。」惟だ郭嘉のみ表の必ず備に任ずる能わざるを策り、公に行くを勧む。夏五月、無終に至る。秋七月、大水ありて、傍海の道通ぜず、田疇が郷導を為さんと請い、公は之に従う。軍を引きて盧龍塞を出で、塞外の道絶えて通ぜざれば、乃ち山を壍り谷を堙むること五百余里、白檀を経、平岡を歴、鮮卑庭を渉り、 うを難かること勿かれ。」", "translation": "『曹瞞伝』にいう、当時、寒いうえに日照りが続き、二百里にわたってまったく水がなく、軍は食糧にも窮したため、馬数千頭を殺して食糧とし、地面を三十余丈も掘り下げてようやく水を得た。帰還したのち、以前に遠征を諫めた者たちを取り調べたため、皆その理由がわからず、誰もが恐れおののいた。公は彼ら全員に手厚く恩賞を与えて言った、「私の先の遠征は、危険を冒して僥倖を求めたものであり、勝利を得たとはいえ、天の助けによるものであって、もとより常道としてはならない。諸君の諫言こそ万全の計であったから、こうして恩賞を与えるのである、今後も遠慮せずに意見を述べてほしい。」", "persons": "曹操", "places": "", "era_year": "建安12年（207年）9月", "source_book": "曹瞞伝", "keywords": "", "raw_tagged": "{{special:引用史料|《曹瞞傳》}}曰：時寒且旱，二百里無復水，軍又乏食，殺馬數千匹以爲糧，鑿地入三十餘丈乃得水。旣還，利問前諫者，衆莫知其故，人人皆懼。{{person:曹操|公}}皆厚賞之，曰：「{{person:曹操|孤}}前行，乘危以徼倖，雖得之，天所佐也，顧不可以爲常。諸君之諫，萬安之計，是以相賞，後勿難言之。」", "kakikudashi_tagged": "{{special:引用史料|『曹瞞伝』}}に曰く、時に寒くして且つ旱し、二百里に復た水無く、軍は又た食に乏しければ、馬数千匹を殺して以て糧と為し、地を鑿ちて入ること三十余丈にして乃ち水を得たり。既に還るや、前に諫めし者を問うに、衆は其の故を知る莫く、人人は皆懼る。{{person:曹操|公}}は皆厚く之を賞して、曰く、「{{person:曹操|孤}}の前の行は、危うきに乗じて以て倖いを徼め、之を得たりと雖も、天の佐くる所なり、顧うに以て常と為すべからず。諸君の諫めは、万安の計なれば、是を以て相賞す、後に之を言うを難かること勿かれ。」", "translation_tagged": "{{special:引用史料|『曹瞞伝』}}にいう、当時、寒いうえに日照りが続き、二百里にわたってまったく水がなく、軍は食糧にも窮したため、馬数千頭を殺して食糧とし、地面を三十余丈も掘り下げてようやく水を得た。帰還したのち、以前に遠征を諫めた者たちを取り調べたため、皆その理由がわからず、誰もが恐れおののいた。{{person:曹操|公}}は彼ら全員に手厚く恩賞を与えて言った、「私の先の遠征は、危険を冒して僥倖を求めたものであり、勝利を得たとはいえ、天の助けによるものであって、もとより常道としてはならない。諸君の諫言こそ万全の計であったから、こうして恩賞を与えるのである、今後も遠慮せずに意見を述べてほしい。」"}, {"id": "v1_p71_3", "volume": 1, "book": "魏書", "section_title": "武帝紀", "para_index": 71, "type": "本文", "raw_text": "康即斬尚、熙及速僕丸等，傳其首。諸將或問：「公還而康斬送尚、熙，何也？」公曰：「彼素畏尚等，吾急之則并力，緩之則自相圖，其勢然也。」十一月至易水，代郡烏丸行單于普富盧、上郡烏丸行單于那樓將其名王來賀。", "kakikudashi": "康は即ち尚・熙及び速僕丸等を斬り、其の首を伝う。諸将の或るひと問う、「公が還りて康が尚・熙を斬りて送れるは、何ぞや？」公曰く、「彼は素より尚等を畏れ、吾が之を急にせば則ち力を并せ、之を緩くせば則ち自ら相図る、其の勢い然るなり。」十一月、易水に至り、代郡烏丸の行単于の普富盧・上郡烏丸の行単于の那楼が其の名王を将いて来たり賀す。", "translation": "公孫康はただちに袁尚・袁熙および速僕丸らを斬り、その首級を送り届けてきた。諸将のある者が尋ねた、「公が引き揚げられたとたんに公孫康が袁尚・袁熙を斬って送ってきたのは、なぜでしょうか？」公は言った、「彼はもともと袁尚らを警戒しており、私が急追すれば力を合わせて抵抗するが、手を緩めれば互いに謀り合う、事の勢いとはそういうものなのだ。」十一月、易水に至ると、代郡烏丸の行単于である普富盧と上郡烏丸の行単于である那楼がその名王たちを率いて戦勝の祝賀に訪れた。", "persons": "公孫康,袁尚,袁煕,速僕丸,曹操,普富盧,那楼", "places": "易水,代,上郡", "era_year": "建安12年（207年）9月〜11月", "source_book": "", "keywords": "烏丸,単于", "
