祭酒，欲妻之以女，或諫魯曰：「有人若此不愛其親，焉能愛人？」魯乃止。初，超未反時，其小婦弟種留三輔，及超敗，種先入漢中。正旦，種上壽於超，超搥胸吐血曰：「闔門百口，一旦同命，今二人相賀邪？」後數從魯求兵，欲北取涼州，魯遣往，無利。又魯將楊白等欲害其能，超遂從武都逃入氐中，轉奔往蜀。是歲建安十九年也。", "kakikudashi": "『典略』に曰く、建安十六年、超は関中の諸将の侯選・程銀・李堪・張横・梁興・成宜・馬玩・楊秋・韓遂等、凡そ十部と倶に反し、其の衆は十万、同じく河・潼に拠りて、営陳を建列す。是の歳、曹公西征し、超等と河・渭の交に戦い、超等は敗走す。超は安定に至り、遂に涼州に奔る。詔して超の家属を収滅す。超は復た隴上に敗る。後に漢中に奔り、張魯は以て都講祭酒と為し、之に妻わすに女を以てせんと欲するも、或るひと魯を諫めて曰く、「人有りて此くの若く其の親を愛せずんば、焉んぞ能く人を愛せんや？」と。魯は乃ち止む。初め、超の未だ反せざる時、其の小婦の弟の種、三輔に留まり、超の敗るるに及び、種は先に漢中に入る。正旦、種は寿を超に上るに、超は胸を搥ち血を吐きて曰く、「闔門百口、一旦に命を同じくせるに、今二人相賀せんや？」と。後に数しば魯より兵を求め、北のかた涼州を取らんと欲し、魯は遣わして往かしむるも、利無し。又た魯の将の楊白等、其の能を害せんと欲すれば、超は遂に武都より逃れて氐中に入り、転じて蜀に奔り往く。是の歳は建安十九年なり。", "translation": "『典略』にいう。建安十六年（211年）、馬超は関中の諸将である侯選・程銀・李堪・張横・梁興・成宜・馬玩・楊秋・韓遂ら、あわせて十部の勢力とともに一斉に挙兵し、その兵力は十万にのぼり、共同して黄河・潼関の要害に拠って陣営を連ねた。この年、曹公は西征し、馬超らと黄河・渭水の合流付近で戦い、馬超らは敗走した。馬超は安定に至り、さらに涼州へと逃れた。朝廷は詔を下して馬超の一族を捕らえ処刑した。馬超は再び隴上でも敗れた。のちに漢中へ逃れると、張魯は馬超を都講祭酒に任じ、自分の娘を彼に嫁がせようとしたが、ある人が張魯を諫めて、「このように自分の肉親すら愛せない者が、どうして他人を愛せましょうか？」と言ったため、張魯は縁談を取りやめた。これより先、馬超がまだ反乱を起こしていなかったころ、その側室の弟である種が三輔に留まっており、馬超が敗れると、種は一足先に漢中へ入っていた。元旦になり、種が馬超に新年の祝いの言葉を述べたところ、馬超は胸を叩いて血を吐き、「一門百人もの家族が、一日にして同じ命運に散ったというのに、いま二人きりで何を祝い合うというのか？」と嘆いた。その後、たびたび張魯に兵を請い求めて北の涼州を奪回しようとし、張魯も兵を遣わして出陣させたが、戦果は挙がらなかった。さらに張魯の部将の楊白らが馬超の才能を妬んで陥れようとしたため、馬超はついに武都から逃れて氐族の居住地に入り、そこから転じて蜀へと出奔した。この年は建安十九年（214年）であった。", "persons": "馬超,侯選,程銀,李堪,張横,梁興,成宜,馬玩,楊秋,韓遂,曹操,張魯,種,楊白", "places": "関中,黄河,潼関,渭水,安定,涼州,隴上,漢中,三輔,武都,蜀", "era_year": "建安16年（211年）〜建安19年（214年）", "source_book": "典略", "keywords": "典略,建安,都講祭酒", "raw_tagged": "《{{special:典略|典略}}》曰：{{special:建安|建安}}十六年，{{person:馬超|超}}與{{place:関中|關中}}諸將{{person:侯選|侯選}}、{{person:程銀|程銀}}、{{person:李堪|李堪}}、{{person:張横|張橫}}、{{person:梁興|梁興}}、{{person:成宜|成宜}}、{{person:馬玩|馬玩}}、{{person:楊秋|楊秋}}、{{person:韓遂|韓遂}}等，凡十部，俱反，其眾十萬，同據{{place:黄河|河}}、{{place:潼関|潼}}，建列營陳。是歲，{{person:曹操|曹公}}西征，與{{person:馬超|超}}等戰於{{place:黄河|河}}、{{place:渭水|渭}}之交，{{person:馬超|超}}等敗走。{{person:馬超|超}}至{{place:安定|安定}}，遂奔{{place:涼州|涼州}}。詔收滅{{person:馬超|超}}家屬。{{person:馬超|超}}復敗於{{place:隴上|隴上}}。後奔{{place:漢中|漢中}}，{{person:張魯|張魯}}以為{{office:都講祭酒 州を得たり」と。乃ち人をして超を止めしめ、而して潜かに兵を以て之に資す。超の到るや、軍を引きて城北に屯せしむるに、超の至りて未だ一旬ならずして成都は潰ゆ。", "translation": "『典略』にいう。劉備は馬超がやって来たと聞くと、喜んで「これで私は益州を手に入れたぞ」と言った。そこで使者を遣わして馬超をいったん押しとどめさせ、ひそかに軍勢を送ってこれを支援した。馬超が到着すると、軍を率いて城の北側に駐屯させたが、馬超が着いてから十日も経たないうちに成都は陥落した。", "persons": "劉備,馬超", "places": "益州,成都", "era_year": "建安19年（214年）", "source_book": "『典略』", "keywords": "典略", "raw_tagged": "{{special:典略|典略}}曰：{{person:劉備|備}}聞{{person:馬超|超}}至，喜曰：「我得{{place:益州|益州}}矣。」乃使人止{{person:馬超|超}}，而潛以兵資之。{{person:馬超|超}}到，令引軍屯城北，{{person:馬超|超}}至未一旬而{{place:成都|成都}}潰。", "kakikudashi_tagged": "『{{special:典略|典略}}』に曰く、{{person:劉備|備}}は{{person:馬超|超}}の至るを聞き、喜びて曰く、「我、{{place:益州|益州}}を得たり」と。乃ち人をして{{person:馬超|超}}を止めしめ、而して潜かに兵を以て之に資す。{{person:馬超|超}}の到るや、軍を引きて城北に屯せしむるに、{{person:馬超|超}}の至りて未だ一旬ならずして{{place:成都|成都}}は潰ゆ。", "translation_tagged": "『{{special:典略|典略}}』にいう。{{person:劉備|劉備}}は{{person:馬超|馬超}}がやって来たと聞くと、喜んで「これで私は{{place:益州|益州}}を手に入れたぞ」と言った。そこで使者を遣わして{{person:馬超|馬超}}をいったん押しとどめさせ、ひそかに軍勢を送ってこれを支援した。{{person:馬超|馬超}}が到着すると、軍を率いて城の北側に駐屯させたが、{{person:馬超|馬超}}が着いてから十日も経たないうちに{{place:成都|成都}}は陥落した。"}, {"id": "v36_p12_3", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（馬超）", "para_index": 12, "type": "本文", "raw_text": "以超為平西將軍，督臨沮，因為前都亭侯。", "kakikudashi": "超を以て平西将軍と為し、臨沮を督せしめ、因りて前の都亭侯と為す。", "translation": "馬超を平西将軍に任じて臨沮の軍事を統括させ、従前のまま都亭侯の爵位を帯びさせた。", "persons": "馬超", "places": "臨沮", "era_year": "建安19年（214年）", "source_book": "", "keywords": "列侯,平西将軍", "raw_tagged": "以{{person:馬超|超}}為{{office:平西将軍|平西將軍}}，督{{place:臨沮|臨沮}}，因為前{{office:列侯|都亭侯}}。", "kakikudashi_tagged": "{{person:馬超|超}}を以て{{office:平西将軍|平西将軍}}と為し、{{place:臨沮|臨沮}}を督せしめ、因りて前の{{office:列侯|都亭侯}}と為す。", "translation_tagged": "{{person:馬超|馬超}}を{{office:平西将軍|平西将軍}}に任じて{{place:臨沮|臨沮}}の軍事を統括させ、従前のまま{{office:列侯|都亭侯}}の爵位を帯びさせた。"}, {"id": "v36_p12_4", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（馬超）", "para_index": 12, "type": "裴注", "raw_text": "山陽公載記曰：超因見備待之厚，與備言，常呼備字，關羽怒，請殺之。備曰：「人窮來歸我，卿等怒，以呼我字故而殺之，何以示於天下也！」張飛曰：「如是，當示之以禮。」明日大會，請超入，羽、飛並杖刀立直，超顧坐席，不見羽、飛，見其直也，乃大驚，遂一不復呼備字。明日歎曰：「我今乃知其所以敗。為呼人主字，幾為關羽、張飛所殺。」自後乃尊事備。臣松之按以為超以窮歸備，受其爵位，何容傲慢而呼備字？且備之入蜀，留關羽鎮荊州，羽未嘗在益土也。故羽聞馬超歸降，以書問諸葛亮「超人才可誰比類」，不得如書所云。羽焉得與張飛立直乎？凡人行事，皆謂其可也，知其不可，則不行之矣。超若果呼備字，亦謂於理宜爾也。就令羽請殺超，超不應聞，但見二子立直，何由便知以呼字之故，云幾為關、張所殺乎？言不經理，深可忿疾也。袁暐、樂資等諸所記載，穢雜虛謬，若此之類，殆不可勝言也。", "kakikudashi": "『山陽公載記』に曰く、超は備の之を待すること厚きを見るに因り、備と言うに、常に備の字を呼び、関羽は怒りて、之を殺さんことを請う。備曰く、「人窮して来たりて我に帰す、卿等怒り、我が字を呼ぶを以ての故にして之を殺さば、何を以てか天下に示さんや！」と、張飛曰く、「是くの如くんば、当に之に示すに礼を以てすべし」と。明日大会し、超を請いて入れしむるに、羽・飛は並びに刀を杖つきて立直し、超は坐席を顧みるも、羽・飛を見ず、其の直するを見るや、乃ち大いに驚き、遂に一たびも復た備の字を呼ばず。明日歎じて曰く、「我は今にして乃ち其の敗るる所以を知る。人主の字を呼びたるが為に、幾んど関羽・張飛の殺す所と為らんとせり」と。後より乃ち備に尊事す。臣松之按じて以為えらく、超は窮するを以て備に帰し、其の爵位を受くるに、何ぞ傲慢にして備の字を呼ぶを容さんや？且つ備の蜀に入るや、関羽を留めて荊州を鎮せしめ、羽は未だ嘗て益土に在らざるなり。故に羽は馬超の帰降するを聞き、書を以て諸葛亮に「超の人材は誰にか比類す可き」と問えば、書に云う所の如くするを得ず。羽は焉んぞ張飛と立直するを得んや？凡そ人の事を行うや、皆な其の可なるを謂うなり、其の不可なるを知らば、則ち之を行わざるなり。超もし果たして備の字を呼ばば、亦た理に於いて宜しく爾るべしと謂えるなり。就令い羽が超を殺さんことを請うとも、超は聞く応からず、但だ二子の立直するを見るのみにて、何に由りてか便ち字を呼ぶを以ての故を知り、幾んど関・張の殺す所と為らんとすと云わんや？言は理を経ず、深く忿疾す可きなり。袁暐・楽資等の諸もろの記載する所、穢雑虚謬にして、此くの若きの類、殆ど勝げて言う可からざるなり。", "translation": "『山陽公載記』にいう、馬超は劉備から手厚く遇されているのを見て、劉備と話す際につねづね劉備を字（玄徳）で呼んだため、関羽が怒って馬超を処刑するよう願い出た。劉備は「人が困窮して私を頼ってきたというのに、お前たちが腹を立て、私の字を呼んだからといって殺してしまったら、いったい天下にどう顔向けができようか！」と言い、張飛は「それならば、礼儀というものを思い知らせてやりましょう」と言った。翌日、盛大な宴会を開いて馬超を招き入れたところ、関羽と張飛は並んで刀を杖ついて護衛として直立しており、馬超が席を見回しても関羽・張飛の姿はなく、二人が背後に直立しているのを目にするや、大いに驚愕し、それ以来二度と劉備の字を呼ばなくなった。翌日、馬超は嘆息して言った、「私は今になって自分が敗れた理由を悟った。主君の字を呼んだばかりに、もう少しで関羽と張飛に殺されるところであった」と。それからは謹んで劉備に仕えるようになった。臣裴松之が考察するに、馬超は進退窮まって劉備に帰順し、その官爵を受けた身でありながら、どうして傲慢にも劉備を字で呼ぶことなどあり得ようか？しかも劉備が蜀に入った際、関羽を残留させて荊州を鎮守させていたのであり、関羽は一度たりとも益土にいたことはない。それゆえ関羽は馬超が帰順したと聞くと、手紙で諸葛亮に「馬超の人材は誰に比肩し得るか」と尋ねているのであって、この書の言うような出来事が起こり得るはずがない。関羽がどうして張飛と並んで護衛に立つことなどできようか？およそ人が何か行動を起こすときは、みなそれが妥当だと考えて行うのであり、不当だと分かっていれば行わないものである。もし馬超が本当に劉備の字を呼んでいたとすれば、馬超自身は道理の上でそうして当然だと考えていたはずである。仮に関羽が馬超の処刑を請うたとしても、馬超がその内情を耳にするはずはなく、ただ二人が直立しているのを見ただけで、どうして字を呼んだせいだと即座に悟り、もう少しで関・張に殺されるところだったなどと言うであろうか？話は筋道が通っておらず、はなはだ腹立たしく憎むべき代物である。袁暐や楽資らの書き記したものには、雑駁で虚偽・誤謬に満ちたこの種の記述が、ほとんど数え切れないほどある。", "persons": "劉備,裴松之,楽資,張飛,袁暐,諸葛亮,関羽,馬超", "places": "蜀,荊州,益州", "era_year": " ど数え切れないほどある。"}, {"id": "v36_p13_1", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（馬超）", "para_index": 13, "type": "本文", "raw_text": "先主為漢中王，拜超為左將軍，假節。章武元年，遷驃騎將軍，領涼州牧，進封斄鄉侯，策曰：「朕以不德，獲繼至尊，奉承宗廟。曹操父子，世載其罪，朕用慘怛，疢如疾首。海內怨憤，歸正反本，暨於氐、羌率服，獯鬻慕義。以君信著北土，威武並昭，是以委任授君，抗颺虓虎，兼董萬里，求民之瘼。其明宣朝化，懷保遠邇，肅慎賞罰，以篤漢祜，以對於天下。」", "kakikudashi": "先主の漢中王と為るや、超を拝して左将軍と為し、節を仮す。章武元年、驃騎将軍に遷り、涼州牧を領し、斄郷侯に進封せられ、策に曰く、「朕は不徳を以て、至尊を継ぐを獲て、宗廟を奉承す。曹操父子、世よ其の罪を載ね、朕は用て惨怛し、疢むこと疾首するが如し。海内は怨憤し、正に帰し本に反り、氐・羌の率服するに暨び、獯鬻も義を慕う。君の信は北土に著われ、威武も並びに昭らかなるを以て、是を以て君に委任授与し、虓虎を抗颺し、万里を兼董して、民の瘼いを求めしむ。其れ明らかに朝化を宣べ、遠邇を懐保し、賞罰を粛慎し、以て漢の祜いを篤くし、以て天下に対えよ」と。", "translation": "先主が漢中王となると、馬超を左将軍に拝し、仮節を授けた。章武元年（221年）、驃騎将軍に昇進し、涼州牧を兼任し、斄郷侯に進封され、その策命にいう、「朕は不徳の身ながら、帝位を受け継ぐことを得て、漢室の宗廟を奉じ承けた。曹操父子は、代々その大罪を積み重ね、朕はそのために深く心を痛め、頭を病むかのように苦しんでいる。海内の人々は怨み憤り、正道に帰し本来の漢室へと立ち返り、氐族・羌族もこぞって服属するに及び、北方の獯鬻までもが大義を慕っている。そなたの信望は北方の地に知れ渡り、威名と武勇もともに輝き渡っているゆえ、そなたに重任を委ね授け、猛虎のごとき武威を高く掲げさせ、万里の広域を兼ね統べさせて、民草の苦しみを救い求めさせるのである。どうか朝廷の徳化を明らかに宣べ広め、遠近の民を懐け安んじ、賞罰を厳粛かつ慎重に行い、それによって漢室の天祐を厚くし、天下の期待に応えよ」と。", "persons": "馬超,曹操,劉備", "places": "斄,涼州,漢中", "era_year": "建安24年（219年）〜章武元年（221年）", "source_book": "", "keywords": "牧,列侯,氐,羌,獯鬻,左将軍,漢中王,仮節,驃騎将軍,章武,虓虎,海内", "raw_tagged": "{{person:劉備|先主}}為{{office:漢中王|漢中王}}，拜{{person:馬超|超}}為{{office:左将軍|左將軍}}，{{office:仮節|假節}}。{{special:章武|章武}}元年，遷{{office:驃騎将軍|驃騎將軍}}，領{{place:涼州|涼州}}{{office:牧|牧}}，進封{{place:斄|斄}}{{office:列侯|鄉侯}}，策曰：「朕以不德，獲繼至尊，奉承宗廟。{{person:曹操|曹操}}父子，世載其罪，朕用慘怛，疢如疾首。{{special:海内|海內}}怨憤，歸正反本，暨於{{special:氐|氐}}、{{special:羌|羌}}率服，{{special:獯鬻|獯鬻}}慕義。以君信著北土，威武並昭，是以委任授君，抗颺{{special:虓虎|虓虎}}，兼董萬里，求民之瘼。其明宣朝化，懷保遠邇，肅慎賞罰，以篤漢祜，以對於天下。」", "kakikudashi_tagged": "{{person:劉備|先主}}の{{office:漢中王|漢中王}}と為るや、{{person:馬超|超}}を拝して{{office:左将軍|左将軍}}と為し、{{special:仮節|節を仮す}}。{{special:章武|章武}}元年、{{office:驃騎将軍|驃騎将軍}}に遷り、{{place:涼州|涼州}}{{office:牧|牧}}を領し、{{place:斄|斄}}{{office:列侯|郷侯}}に進封せられ、策に曰く、「朕は不徳を以て、至尊を継ぐを獲て、宗廟を奉承す。{{person:曹操|曹操}}父子、世よ其の罪を載ね、朕は用て惨怛し、疢むこと疾首するが如し。{{special:海内|海内}}は怨憤し、正に帰し本に反り、{{special:氐|氐}}・{{special:羌|羌}}の率服するに暨び、{{special:獯鬻|獯鬻}}も義を慕う。君の信は北土に著われ、威武も並びに昭らかなるを以て、是を以て君に委任授与し、{{special:虓虎|虓虎}}を抗颺し、万里を兼董して、民の瘼いを求めしむ。其れ明らかに朝化を宣べ、遠邇を懐保し、賞罰を粛慎し、以て漢の祜いを篤くし、以て天下に対えよ」と。", "translation_tagged": "{{person:劉備|先主}}が{{office:漢中王|漢中王}}となると、{{person:馬超|馬超}}を{{office:左将軍|左将軍}}に拝し、{{office:仮節|仮節}}を授けた。{{special:章武|章武}}元年（221年）、{{office:驃騎将軍|驃騎将軍}}に昇進し、{{place:涼州|涼州}}{{office:牧|牧}}を兼任し、{{place:斄|斄}}{{office:列侯|郷侯}}に進封され、その策命にいう、「朕は不徳の身ながら、帝位を受け継ぐことを得て、漢室の宗廟を奉じ承けた。{{person:曹操|曹操}}父子は、代々その大罪を積み重ね、朕はそのために深く心を痛め、頭を病むかのように苦しんでいる。{{special:海内|海内}}の人々は怨み憤り、正道に帰し本来の漢室へと立ち返り、{{special:氐|氐}}族・{{special:羌|羌}}族もこぞって服属するに及び、北方の{{special:獯鬻|獯鬻}}までもが大義を慕っている。そなたの信望は北方の地に知れ渡り、威名と武勇もともに輝き渡っているゆえ、そなたに重任を委ね授け、{{special:虓虎|猛虎}}のごとき武威を高く掲げさせ、万里の広域を兼ね統べさせて、民草の苦しみを救い求めさせるのである。どうか朝廷の徳化を明らかに宣べ広め、遠近の民を懐け安んじ、賞罰を厳粛かつ慎重に行い、それによって漢室の天祐を厚くし、天下の期待に応えよ」と。"}, {"id": "v36_p14_1", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（馬超）", "para_index": 14, "type": "本文", "raw_text": "二年卒，時年四十七。臨沒上疏曰：「臣門宗二百餘口，為孟德所誅略盡，惟有從弟岱，當為微宗血食之繼，深讬陛下，餘無復言。」追諡超曰威侯，子承嗣。岱位至平北將軍，進爵陳倉侯。超女配安平王理。", "kakikudashi": "二年に卒す、時に年四十七。没するに臨みて上疏して曰く、「臣が門宗二百余口、孟徳の誅する所と為りて略ぼ尽き、惟だ従弟の岱有るのみ、当に微宗の血食の継ぎと為すべければ、深く陛下に託す、余は復た言うこと無し」と。超に追諡して威侯と曰い、子の承が嗣ぐ。岱は位、平北将軍に至り、爵は陳倉侯に進む。超の女は安平王の理に配す。", "translation": "章武二年（222年）に死去した、享年四十七であった。臨終に際して上疏して言った、「私の一門二百余人は、孟徳に誅殺されてほぼ尽き果て、ただ従弟の馬岱だけが残っておりますので、どうかこの微賤な一族の祭祀を継ぐ者としてくださいますよう、深く陛下に託し奉ります、ほかに申し上げることはございません」と。馬超に追諡して威侯といい、子の馬承が後を継いだ。馬岱は官位が平北将軍に至り、爵位は陳倉侯に進んだ。馬超の娘は安平王の劉理に嫁いだ。", "persons": "馬超,曹操,馬岱,劉備,馬承,劉理", "places": "安平,陳倉", "era_year": "章武2年（222年）〜景耀3年（260年）", "source_book": "", "keywords": "列侯,諸侯王,平北将軍,章武,威侯", "raw_tagged": "二年卒，時年四十七。臨沒上疏曰：「臣門宗二百餘口，為{{person:曹操|孟德}}所誅略盡，惟有從弟{{person:馬岱|岱}}，當為微宗血食之繼，深讬{{person:劉備|陛下}}，餘無復言。」追諡{{person:馬超|超}}曰{{special:威侯|威侯}}，子{{person:馬承|承}}嗣。{{person:馬岱|岱}}位至{{office:平北将軍|平北將軍}}，進爵{{place:陳倉|陳倉}}{{office:列侯|侯}}。{{person:馬超|超}}女配{{place:安平|安平}}{{office:諸侯王|王}}{{person:劉理|理}}。", "kakikudashi_tagged": "二年に卒す、時に年四十七。没するに臨みて上疏して曰く、「臣が門宗二百余口、{{person:曹操|孟徳}}の誅する所と為りて略ぼ尽き、惟だ従弟の{{person:馬岱|岱}}有るのみ、当に微宗の血食の継ぎと為すべければ、深く{{person:劉備|陛下}}に託す、 身柄を得て、{{person:董氏_馬超妻|董氏}}を{{person:閻圃|閻圃}}に賜い、{{person:馬秋|馬秋}}を{{person:張魯|張魯}}に引き渡したところ、{{person:張魯|張魯}}は自らの手で{{person:馬秋|馬秋}}を殺害した。"}, {"id": "v36_p15_1", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（黃忠）", "para_index": 15, "type": "本文", "raw_text": "黃忠字漢升，南陽人也。荊州牧劉表以為中郎將，與表從子磐共守長沙攸縣。及曹公克荊州，假行裨將軍，仍就故任，統屬長沙守韓玄。先主南定諸郡，忠遂委質，隨從入蜀。自葭萌受任，還攻劉璋，忠常先登陷陣，勇毅冠三軍。益州既定，拜為討虜將軍。建安二十四年，於漢中定軍山擊夏侯淵。淵眾甚精，忠推鋒必進，勸率士卒，金鼓振天，歡聲動谷，一戰斬淵，淵軍大敗。遷征西將軍。是歲，先主為漢中王，欲用忠為後將軍，諸葛亮說先主曰：「忠之名望，素非關、馬之倫也。而今便令同列。馬、張在近，親見其功，尚可喻指；關遙聞之，恐必不悅，得無不可乎！」先主曰：「吾自當解之。」遂與羽等齊位，賜爵關內侯。明年卒，追諡剛侯。子敘，早沒，無後。", "kakikudashi": "黄忠は字を漢升といい、南陽の人なり。荊州牧の劉表、以て中郎将と為し、表の従子の磐と共に長沙の攸県を守らしむ。曹公の荊州を克するに及び、仮に裨将軍を行せしめ、仍お故任に就き、長沙守の韓玄に統属す。先主の南のかた諸郡を定むるや、忠は遂に質を委ね、随従して蜀に入る。葭萌より任を受け、還りて劉璋を攻むるに、忠は常に先登して陣を陥れ、勇毅は三軍に冠たり。益州の既に定まるや、拝して討虜将軍と為す。建安二十四年、漢中の定軍山に於いて夏侯淵を撃つ。淵の衆は甚だ精なるも、忠は鋒を推して必ず進み、士卒を勧率し、金鼓は天を振わせ、歓声は谷を動かし、一戦して淵を斬り、淵の軍は大敗す。征西将軍に遷る。是の歳、先主は漢中王と為り、忠を用いて後将軍と為さんと欲するに、諸葛亮は先主に説きて曰く、「忠の名望は、素より関・馬の倫に非ざるなり。而るに今便ち同列ならしめん。馬・張は近きに在りて、親しく其の功を見れば、尚お指を喩す可きも、関は遥かに之を聞かば、恐らくは必ず悦ばざらん、不可なる無きを得んや！」と、先主曰く、「吾れ自ら当に之を解くべし」と。遂に羽等と位を斉しくし、爵関内侯を賜う。明る年に卒し、剛侯と追諡す。子の叙は、早く没して、後無し。", "translation": "黄忠は字を漢升といい、南陽郡の人である。荊州牧の劉表は彼を中郎将に任じ、劉表の甥である劉磐とともに長沙郡の攸県を守らせた。曹公が荊州を制圧するに及んで、仮の裨将軍とされ、そのまま従来の任務にとどまって、長沙太守の韓玄の統属下に置かれた。先主が南方の諸郡を平定すると、黄忠はついに臣従を誓い、先主に従って蜀へ入った。葭萌から任務を受けて引き返し劉璋を攻撃した戦いでは、黄忠はつねに先陣を切って敵陣を陥れ、その武勇と剛毅さは全軍随一であった。益州が平定されると、討虜将軍に拝された。建安二十四年（219年）、漢中の定軍山において夏侯淵を攻撃した。夏侯淵の軍勢はきわめて精鋭であったが、黄忠は切っ先を押し進めて退かず前進し、将兵を鼓舞して率い、鉦や太鼓の音は天を震わせ、歓声は谷を揺るがし、一戦のうちに夏侯淵を討ち取って、夏侯淵の軍は大敗を喫した。黄忠は征西将軍に昇進した。この年、先主が漢中王となり、黄忠を抜擢して後将軍に任じようとしたところ、諸葛亮は先主に進言して言った、「黄忠の名望は、もともと関羽や馬超と同列のものではございません。それなのに、いま急に彼らと同列に並べようとしておられます。馬超と張飛は近くにいて、その武功を目の当たりにしておりますから、まだご意向を説いて納得させることもできますが、関羽が遠くからこの報を聞けば、おそらく必ず不満を抱くことでしょう、差し支えがあるのではございませんか！」と、先主は「私が自分で彼を説き伏せよう」と言った。こうしてついに関羽らと同等の位に列し、関内侯の爵位を賜った。翌年に死去し、剛侯と追諡された。子の黄叙は、若くして亡くなり、跡継ぎは絶えた。", "persons": "黄忠,劉表,劉磐,曹操,韓玄,劉備,劉璋,夏侯淵,諸葛亮,関羽,馬超,張飛,黄叙", "places": "南陽,荊州,長沙,攸県,蜀,葭萌,益州,漢中,定軍山", "era_year": "建安13年（208年）〜建安25年（220年）", "source_book": "", "keywords": "牧,中郎将,裨将軍,太守,討虜将軍,征西将軍,漢中王 字子龍，常山真定人也。本屬公孫瓚，瓚遣先主為田楷拒袁紹，雲遂隨從，為先主主騎。", "kakikudashi": "趙雲は字を子龍といい、常山真定の人なり。本と公孫瓚に属し、瓚が先主を遣わして田楷の為に袁紹を拒がしむるや、雲は遂に随従し、先主の主騎と為る。", "translation": "趙雲は字を子龍といい、常山国真定県の人である。もとは公孫瓚に属していたが、公孫瓚が先主を派遣して田楷のために袁紹を防がせると、趙雲はそのままこれに従って、先主の主騎となった。", "persons": "趙雲,公孫瓚,劉備,田楷,袁紹", "places": "常山,真定", "era_year": "初平2年（191年）頃", "source_book": "", "keywords": "主騎", "raw_tagged": "{{person:趙雲|趙雲}}字{{person:趙雲|子龍}}，{{place:常山|常山}}{{place:真定|真定}}人也。本屬{{person:公孫瓚|公孫瓚}}，{{person:公孫瓚|瓚}}遣{{person:劉備|先主}}為{{person:田楷|田楷}}拒{{person:袁紹|袁紹}}，{{person:趙雲|雲}}遂隨從，為{{person:劉備|先主}}{{office:主騎|主騎}}。", "kakikudashi_tagged": "{{person:趙雲|趙雲}}は字を{{person:趙雲|子龍}}といい、{{place:常山|常山}}{{place:真定|真定}}の人なり。本と{{person:公孫瓚|公孫瓚}}に属し、{{person:公孫瓚|瓚}}が{{person:劉備|先主}}を遣わして{{person:田楷|田楷}}の為に{{person:袁紹|袁紹}}を拒がしむるや、{{person:趙雲|雲}}は遂に随従し、{{person:劉備|先主}}の{{office:主騎|主騎}}と為る。", "translation_tagged": "{{person:趙雲|趙雲}}は字を{{person:趙雲|子龍}}といい、{{place:常山|常山国}}{{place:真定|真定}}県の人である。もとは{{person:公孫瓚|公孫瓚}}に属していたが、{{person:公孫瓚|公孫瓚}}が{{person:劉備|先主}}を派遣して{{person:田楷|田楷}}のために{{person:袁紹|袁紹}}を防がせると、{{person:趙雲|趙雲}}はそのままこれに従って、{{person:劉備|先主}}の{{office:主騎|主騎}}となった。"}, {"id": "v36_p16_2", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（趙雲）", "para_index": 16, "type": "裴注", "raw_text": "雲別傳曰：雲身長八尺，姿顏雄偉，為本郡所舉，將義從吏兵詣公孫瓚。時袁紹稱冀州牧，瓚深憂州人之從紹也，善雲來附，嘲雲曰：「聞貴州人皆願袁氏，君何獨回心，迷而能反乎？」雲答曰：「天下訩訩，未知孰是，民有倒縣之厄，鄙州論議，從仁政所在，不為忽袁公私明將軍也。」遂與瓚征討。時先主亦依讬瓚，每接納雲，雲得深自結讬。雲以兄喪，辭瓚暫歸，先主知其不反，捉手而別，雲辭曰：「終不背德也。」先主就袁紹，雲見於鄴。先主與雲同床眠臥，密遣雲合募得數百人，皆稱劉左將軍部曲，紹不能知。遂隨先主至荊州。", "kakikudashi": "『雲別伝』に曰く、雲は身長八尺、姿顔は雄偉にして、本郡の挙ぐる所と為り、義従の吏兵を将いて公孫瓚に詣る。時に袁紹は冀州牧と称し、瓚は深く州人の紹に従うを憂え、雲の来附するを善しとし、雲を嘲りて曰く、「聞くならく貴州の人は皆な袁氏を願うと、君は何ぞ独り心を回らし、迷いて能く反るや？」と、雲は答えて曰く、「天下は訩訩として、未だ孰れか是なるを知らず、民に倒懸の厄有り、鄙州の論議は、仁政の在る所に従うのみにして、袁公を忽せにして明将軍に私するを為さざるなり」と。遂に瓚と征討す。時に先主も亦た瓚に依託し、毎に雲を接納し、雲は深く自ら結託するを得たり。雲は兄の喪を以て、瓚に辞して暫く帰るに、先主は其の反らざるを知り、手を捉りて別るるや、雲は辞して曰く、「終に徳に背かざるなり」と。先主の袁紹に就くや、雲は鄴に見ゆ。先主は雲と床を同じうして眠臥し、密かに雲を遣わして合募せしめて数百人を得、皆な劉左将軍の部曲と称し、紹は知る能わず。遂に先主に随いて荊州に至る。", "translation": "『雲別伝』にいう、趙雲は身長八尺、容姿は雄々しく堂々としており、出身郡から推挙されて、義従の官吏 して牙門将軍となった。先主が蜀へ入ると、趙雲は荊州に留まった。", "persons": "劉備,曹操,趙雲,劉禅,甘夫人", "places": "当陽,長阪,蜀,荊州", "era_year": "建安13年（208年）〜建安16年（211年）", "source_book": "", "keywords": "牙門将軍", "raw_tagged": "及{{person:劉備|先主}}為{{person:曹操|曹公}}所追於{{place:当陽|當陽}}{{place:長阪|長阪}}，棄妻子南走，{{person:趙雲|雲}}身抱弱子，即{{person:劉禅|後主}}也，保護{{person:甘夫人|甘夫人}}，即{{person:劉禅|後主}}母也，皆得免難。遷為{{office:牙門将軍|牙門將軍}}。{{person:劉備|先主}}入{{place:蜀|蜀}}，{{person:趙雲|雲}}留{{place:荊州|荊州}}。", "kakikudashi_tagged": "{{person:劉備|先主}}の{{person:曹操|曹公}}に{{place:当陽|当陽}}の{{place:長阪|長阪}}に追われ、妻子を棄てて南走するに及び、{{person:趙雲|雲}}は身ずから弱子を抱き、即ち{{person:劉禅|後主}}なり、{{person:甘夫人|甘夫人}}を保護し、即ち{{person:劉禅|後主}}の母なり、皆な難を免るるを得たり。遷りて{{office:牙門将軍|牙門将軍}}と為る。{{person:劉備|先主}}の{{place:蜀|蜀}}に入るや、{{person:趙雲|雲}}は{{place:荊州|荊州}}に留まる。", "translation_tagged": "{{person:劉備|先主}}が{{person:曹操|曹公}}に{{place:当陽|当陽}}の{{place:長阪|長阪}}で追撃され、妻子を棄てて南へ逃走するに及んで、{{person:趙雲|趙雲}}は自らの身で幼子を抱きかかえ――すなわち{{person:劉禅|後主}}である――、また{{person:甘夫人|甘夫人}}を守り抜き――すなわち{{person:劉禅|後主}}の生母である――、ともに危難を免れることができた。昇進して{{office:牙門将軍|牙門将軍}}となった。{{person:劉備|先主}}が{{place:蜀|蜀}}へ入ると、{{person:趙雲|趙雲}}は{{place:荊州|荊州}}に留まった。"}, {"id": "v36_p16_4", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（趙雲）", "para_index": 16, "type": "裴注", "raw_text": "雲別傳曰：初，先主之敗，有人言雲已北去者，先主以手戟擿之曰：「子龍不棄我走也。」頃之，雲至。從平江南，以為偏將軍，領桂陽太守，代趙範。範寡嫂曰樊氏，有國色，範欲以配雲。雲辭曰：「相與同姓，卿兄猶我兄。」固辭不許。時有人勸雲納之，雲曰：「範迫降耳，心未可測；天下女不少。」遂不取。範果逃走，雲無纖介。先是，與夏侯惇戰於博望，生獲夏侯蘭。蘭是雲鄉里人，少小相知，雲白先主活之，薦蘭明於法律，以為軍正。雲不用自近，其慎慮類如此。先主入益州，雲領留營司馬。此時先主孫夫人以權妹驕豪，多將吳吏兵，縱橫不法。先主以雲嚴重，必能整齊，特任掌內事。權聞備西征，大遣舟船迎妹，而夫人內欲將後主還吳，雲與張飛勒兵截江，乃得後主還。", "kakikudashi": "『雲別伝』に曰く、初め、先主の敗るるや、人の「雲は已に北に去れり」と言う者有り、先主は手戟を以て之に擿ちて曰く、「子龍は我を棄てて走らざるなり」と。頃くして、雲は至る。従いて江南を平らげ、以て偏将軍と為し、桂陽太守を領し、趙範に代わらしむ。範の寡嫂を樊氏と曰い、国色有り、範は以て雲に配せんと欲す。雲は辞して曰く、「相与に同姓なれば、卿の兄は猶お我が兄のごとし」と。固く辞して許さず。時に人の雲に之を納るるを勧むる有り、雲は曰く、「範は迫られて降るのみ、心は未だ測る可からず、天下に女は少なからず」と。遂に取らず。範は果たして逃走するも、雲には繊介も無し。是より先、夏侯惇と博望に戦い、夏侯蘭を生獲す。蘭は是れ雲の郷里の人にして、少小より相知り、雲は先主に白して之を活かし、蘭の法律に明るきを薦め、以て軍正と為さしむ。雲は自らの近くに用いず、其の慎慮なること類ね此くの如し。先主の益州に入るや、雲は留営司馬を領す。此の時、先主の孫夫人は権の妹なるを以て驕豪にして、多く呉の吏兵を将い、縦横不法なり。先主は雲の厳重にして、必ず能く整斉するを以て、特に任じて内事を掌らしむ。権は備の西征するを聞き、大いに舟船を遣わして妹を迎えしめ、而して夫人は内に後主を将いて呉に還らんと欲するも、雲は張飛と兵を勒して江を截り、乃ち後主の還るを得たり。", "translation": "『雲別伝』にいう、当初、先主が敗走した際、「趙雲はすでに北へ走り去りました」と告げる者があったが、先主は手戟をその者に投げつけて「子龍が私を見棄てて逃げ去るはずがない」と言った。まもなく、趙雲が帰還した。先主に従って江南を平定すると、偏将軍に任じられ、桂陽太守を兼任して、趙範に代わった。趙範の亡兄の妻は樊氏といい、天下に冠たる美貌の持ち主であったため、趙範は彼女を趙雲に娶らせようとした。趙雲は辞退して「お互い同じ趙姓であるから、貴殿の兄上は私の兄も同然である」と言った。固く辞退して承諾しなかった。そのとき趙雲に彼女を娶るよう勧める者があったが、趙雲は「趙範は追い詰められて降伏したにすぎず、その胸中はいまだ測りがたいし、天下に女性は少なくない」と言った。こうしてついに娶らなかった。趙範は案の定逃亡したが、趙雲にはいささかの後ろ暗い関わりもなかった。これより以前、夏侯惇と博望で戦い、夏侯蘭を生け捕りにした。夏侯蘭は趙雲と同郷の出身で、幼い頃からの知り合いであったため、趙雲は先主に申し上げて彼の命を助け、夏侯蘭が法律に明るいことを推薦して、軍正に任じさせた。それでいて趙雲は彼を自身の側近くに用いようとはせず、その慎重で思慮深い態度はみなこのようであった。先主が益州へ入ると、趙雲は留営司馬を兼任した。この当時、先主の孫夫人は孫権の妹であることを鼻にかけて驕り高ぶり、大勢の呉の官吏や兵士を引き連れて、勝手気ままに不法を働いていた。先主は趙雲が厳格重厚であり、必ず規律を正し整えられる人物であると見込んで、特別に任じて奥向きの規律管理を掌らせた。孫権は劉備が西征したと聞き、大挙して船団を遣わして妹を迎えさせたが、夫人はひそかに後主を連れて呉へ帰ろうとしたため、趙雲は張飛とともに兵を率いて長江を遮断し、こうして後主を取り戻すことができた。", "persons": "劉備,趙雲,趙範,樊氏_趙範嫂,夏侯惇,夏侯蘭,孫夫人,孫権,劉禅,張飛", "places": "江南,桂陽,博望,益州,呉,長江", "era_year": "建安7年（202年）〜建安17年（212年）", "source_book": "『雲別伝』", "keywords": "雲別伝,偏将軍,太守,軍正,留営司馬", "raw_tagged": "{{special:雲別伝|雲別傳}}曰：初，{{person:劉備|先主}}之敗，有人言{{person:趙雲|雲}}已北去者，{{person:劉備|先主}}以手戟擿之曰：「{{person:趙雲|子龍}}不棄我走也。」頃之，{{person:趙雲|雲}}至。從平{{place:江南|江南}}，以為{{office:偏将軍|偏將軍}}，領{{place:桂陽|桂陽}}{{office:太守|太守}}，代{{person:趙範|趙範}}。{{person:趙範|範}}寡嫂曰{{person:樊氏_趙範嫂|樊氏}}，有國色，{{person:趙範|範}}欲以配{{person:趙雲|雲}}。{{person:趙雲|雲}}辭曰：「相與同姓，卿兄猶我兄。」固辭不許。時有人勸{{person:趙雲|雲}}納之，{{person:趙雲|雲}}曰：「{{person:趙範|範}}迫降耳，心未可測；天下女不少。」遂不取。{{person:趙範|範}}果逃走，{{person:趙雲|雲}}無纖介。先是，與{{person:夏侯惇|夏侯惇}}戰於{{place:博望|博望}}，生獲{{person:夏侯蘭|夏侯蘭}}。{{person:夏侯蘭|蘭}}是{{person:趙雲|雲}}鄉里人，少小相知，{{person:趙雲|雲}}白{{person:劉備|先主}}活之，薦{{person:夏侯蘭|蘭}}明於法律，以為{{office:軍正|軍正}}。{{person:趙雲|雲}}不用自近，其慎慮類如此。{{person:劉備|先主}}入{{place:益州|益州}}，{{person:趙雲|雲}}領{{office:留営司馬|留營司馬}}。此時{{person:劉備|先主}}{{person:孫夫人|孫夫人}}以{{person:孫権|權}}妹驕豪，多將{{place:呉|吳}}吏兵，縱橫不法。{{person:劉備|先主}}以{{person:趙雲|雲}}嚴重，必能整齊，特任掌內事。{{person:孫権|權}}聞{{person:劉備|備}}西征，大遣舟船迎妹，而{{person:孫夫人|夫人}}內欲 降伏したにすぎず、その胸中はいまだ測りがたいし、天下に女性は少なくない」と言った。こうしてついに娶らなかった。{{person:趙範|趙範}}は案の定逃亡したが、{{person:趙雲|趙雲}}にはいささかの後ろ暗い関わりもなかった。これより以前、{{person:夏侯惇|夏侯惇}}と{{place:博望|博望}}で戦い、{{person:夏侯蘭|夏侯蘭}}を生け捕りにした。{{person:夏侯蘭|夏侯蘭}}は{{person:趙雲|趙雲}}と同郷の出身で、幼い頃からの知り合いであったため、{{person:趙雲|趙雲}}は{{person:劉備|先主}}に申し上げて彼の命を助け、{{person:夏侯蘭|夏侯蘭}}が法律に明るいことを推薦して、{{office:軍正|軍正}}に任じさせた。それでいて{{person:趙雲|趙雲}}は彼を自身の側近くに用いようとはせず、その慎重で思慮深い態度はみなこのようであった。{{person:劉備|先主}}が{{place:益州|益州}}へ入ると、{{person:趙雲|趙雲}}は{{office:留営司馬|留営司馬}}を兼任した。この当時、{{person:劉備|先主}}の{{person:孫夫人|孫夫人}}は{{person:孫権|孫権}}の妹であることを鼻にかけて驕り高ぶり、大勢の{{place:呉|呉}}の官吏や兵士を引き連れて、勝手気ままに不法を働いていた。{{person:劉備|先主}}は{{person:趙雲|趙雲}}が厳格重厚であり、必ず規律を正し整えられる人物であると見込んで、特別に任じて奥向きの規律管理を掌らせた。{{person:孫権|孫権}}は{{person:劉備|劉備}}が西征したと聞き、大挙して船団を遣わして妹を迎えさせたが、{{person:孫夫人|夫人}}はひそかに{{person:劉禅|後主}}を連れて{{place:呉|呉}}へ帰ろうとしたため、{{person:趙雲|趙雲}}は{{person:張飛|張飛}}とともに兵を率いて{{place:長江|長江}}を遮断し、こうして{{person:劉禅|後主}}を取り戻すことができた。"}, {"id": "v36_p17_1", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（趙雲）", "para_index": 17, "type": "本文", "raw_text": "先主自葭萌還攻劉璋，召諸葛亮。亮率雲與張飛等俱溯江西上，平定郡縣。至江州，分遣雲從外水上江陽，與亮會於成都。成都既定，以雲為翊軍將軍。", "kakikudashi": "先主は葭萌より還りて劉璋を攻むるや、諸葛亮を召す。亮は雲及び張飛等を率いて倶に江を溯りて西に上り、郡県を平定す。江州に至り、雲を分遣して外水より江陽に上らしめ、亮と成都に会す。成都の既に定まるや、雲を以て翊軍将軍と為す。", "translation": "先主は葭萌から引き返して劉璋を攻撃すると、諸葛亮を呼び寄せた。諸葛亮は趙雲や張飛らを率いてともに長江を遡って西へ上り、各地の郡県を平定した。江州に到着すると、趙雲を別動隊として派遣して外水から江陽へ遡上させ、諸葛亮と成都で合流した。成都が平定されると、趙雲を翊軍将軍に任じた。", "persons": "劉備,劉璋,諸葛亮,趙雲,張飛", "places": "葭萌,長江,江州,外水,江陽,成都", "era_year": "建安18年（213年）〜建安19年（214年）", "source_book": "", "keywords": "翊軍将軍", "raw_tagged": "{{person:劉備|先主}}自{{place:葭萌|葭萌}}還攻{{person:劉璋|劉璋}}，召{{person:諸葛亮|諸葛亮}}。{{person:諸葛亮|亮}}率{{person:趙雲|雲}}與{{person:張飛|張飛}}等俱溯{{place:長江|江}}西上，平定郡縣。至{{place:江州|江州}}，分遣{{person:趙雲|雲}}從{{place:外水|外水}}上{{place:江陽|江陽}}，與{{person:諸葛亮|亮}}會於{{place:成都|成都}}。{{place:成都|成都}}既定，以{{person:趙雲|雲}}為{{office:翊軍将軍|翊軍將軍}}。", "kakikudashi_tagged": "{{person:劉備|先主}}は{{place:葭萌|葭萌}}より還りて{{person:劉璋|劉璋}}を攻むるや、{{person:諸葛亮|諸葛亮}}を召す。{{person:諸葛亮|亮}}は{{person:趙雲|雲}}及び{{person:張飛|張飛}}等を率いて倶に{{place:長江|江}}を溯りて西に上り、郡県を平定す。{{place:江州|江州}}に至り、{{person:趙雲|雲}}を分遣して{{place:外水|外水}}より{{place:江陽|江陽}}に上らしめ、{{person:諸葛亮|亮}}と{{place:成都|成都}}に会す。{{place:成都|成都}}の既に定まるや、{{person:趙雲|雲}}を以て{{office:翊軍将軍|翊軍将軍}}と為す。", "translation_tagged": "{{person:劉備|先主}}は{{place:葭萌|葭萌}}から引き返して{{person:劉璋|劉璋}}を攻撃すると、{{person:諸葛亮|諸葛亮}}を呼び寄せた。{{person:諸葛亮|諸葛亮}}は{{person:趙雲|趙雲}}や{{person:張飛|張飛}}らを率いてともに{{place:長江|長江}}を遡って西へ上り、各地の郡県を平定した。{{place:江州|江州}}に到着すると、{{person:趙雲|趙雲}}を別動隊として派遣して{{place:外水|外水}}から{{place:江陽|江陽}}へ遡上させ、{{person:諸葛亮|諸葛亮}}と{{place:成都|成都}}で合流した。{{place:成都|成都}}が平定されると、{{person:趙雲|趙雲}}を{{office:翊軍将軍|翊軍将軍}}に任じた。"}, {"id": "v36_p17_2", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（趙雲）", "para_index": 17, "type": "裴注", "raw_text": "雲別傳曰：益州既定，時議欲以成都中屋舍及城外園地桑田分賜諸將。雲駮之曰：「霍去病以匈奴未滅，無用家為，今國賊非但匈奴，未可求安也。須天下都定，各反桑梓，歸耕本土，乃其宜耳。益州人民，初罹兵革，田宅皆可歸還，今安居復業，然後可役調，得其歡心。」先主即從之。夏侯淵敗，曹公爭漢中地，運米北山下，數千萬囊。黃忠以為可取，雲兵隨忠取米。忠過期不還，雲將數十騎輕行出圍，迎視忠等。值曹公揚兵大出，雲為公前鋒所擊，方戰，其大眾至，勢偪，遂前突其陳，且鬥且卻。公軍散，已復合，雲陷敵，還趣圍。將張著被創，雲復馳馬還營迎著。公軍追至圍，此時沔陽長張翼在雲圍內，翼欲閉門拒守，而雲入營，更大開門，偃旗息鼓。公軍疑雲有伏兵，引去。雲雷鼓震天，惟以戎弩於後射公軍，公軍驚駭，自相蹂踐，墮漢水中死者甚多。先主明旦自來至雲營圍視昨戰處，曰：「子龍一身都是膽也。」作樂飲宴至暝，軍中號雲為虎威將軍。孫權襲荊州，先主大怒，欲討權。雲諫曰：「國賊是曹操，非孫權也，且先滅魏，則吳自服。操身雖斃，子丕篡盜，當因眾心，早圖關中，居河、渭上流以討凶逆，關東義士必裹糧策馬以迎王師。不應置魏，先與吳戰；兵勢一交，不得卒解。」先主不聽，遂東征，留雲督江州。先主失利於秭歸，雲進兵至永安，吳軍已退。", "kakikudashi": "『雲別伝』に曰く、益州の既に定まるや、時議は成都中の屋舎及び城外の園地・桑田を以て諸将に分賜せんと欲す。雲は之を駮して曰く、「霍去病は匈奴の未だ滅びざるを以て、家を用いて為す無しとせり、今の国賊は但だ匈奴のみに非ざれば、未だ安きを求む可からざるなり。天下の都て定まるを須ちて、各おの桑梓に反り、本土に帰耕する、乃ち其の宜しきのみ。益州の人民は、初めて兵革に罹りたれば、田宅は皆な帰還す可く、今安居して業に復せしめ、然る後に役調す可くして、其の歓心を得ん」と。先主は即ち之に従う。夏侯淵の敗るるや、曹公は漢中の地を争い、米を北山の下に運ぶこと、数千万嚢なり。黄忠は取る可しと以為い、雲の兵も忠に随いて米を取る。忠は期を過ぐるも還らず、雲は数十騎を将いて軽行して囲を出で、忠等を迎え視る。曹公の兵を揚げて大いに出ずるに値い、雲は公の前鋒の撃つ所と為り、方に戦うに、其の大衆至り、勢い偪り、遂に前みて其の陣を突き、且つ闘い且つ却く。公の軍は散じ、已にして復た合し、雲は敵を陥れ、還りて囲に趣く。将の張著が創を被り、雲は復た馬を馳せて営に還り著を迎う。公の軍は追いて囲に至り、此の時、沔陽長の張翼は雲の囲内に在り、翼は門を閉じて拒守せんと欲するも、而れども雲は営に入るや、更に大いに門を開き、旗を偃せ鼓を息む。公の軍は雲に伏兵有るかと疑い、引き去る。雲は雷鼓して天を震わせ、惟だ戎弩を以て後ろより公の軍を射るに、公の軍は驚駭し、自ら相蹂践し、漢水の中に堕ちて死する者甚だ多し。先主は明旦自ら来たりて雲の営囲に至り昨日の戦処を視て、曰く、「子龍は一身都て是れ胆なり」と。楽を作し飲宴して暝に至り、軍中は雲を号して虎威将軍と為す。孫権の荊州を襲うや、先主は大いに怒り、権を討たんと欲す。雲は諫めて曰く、「国賊は是れ曹操にして、孫権に非ざるなり、且つ先ず魏を滅ぼさば、則ち呉は自ら服せん。操の身は斃ると雖も、子の丕が篡盗したれば、当に衆心に因りて、早く関中を図り、河・渭の上流に居りて以て凶逆を討つべくんば、関東の義士は必ず糧を裹み馬に策うちて以て王師を迎えん。魏を置きて、先ず呉と戦う応からず、兵勢一たび交わらば、卒かに解くを得ず」と。先主は聴かず、遂に東征し、雲を留めて江州を督せしむ。先主の秭帰に利を失うや、雲は兵を進めて永安に至るも、呉の軍は已に退く。", "translation": "『雲別伝』にいう、益州が平定された際、当時の議論では成都城内の家屋および城外の果樹園や桑畑を諸将に分け与えようとした。趙雲はこれに反論して言った、「霍去病は匈奴がいまだ滅びていないことを理由に、家を構える必要はないと申しましたが、今の国賊はただ匈奴ばかりではございませんから、まだ安逸を求めるべきではございません。天下がすべて平定されるのを待って、それぞれ故郷へ帰り、本来の土地に戻って耕作するのが、筋というものです。益州の人々は、戦乱に遭ったばかりですから、田畑や屋敷はみな返還すべきであり、いま安心して暮らして生業に復帰させてこそ、その後に労役や租税を課すことができ、民衆の歓心を得ることができましょう」と。先主はただちにこの意見に従った。夏侯淵が敗死すると、曹公は漢中の地を争い、北山の麓へ兵糧米を運び込むこと、数千万袋にのぼった。黄忠はこれを奪取できると考え、趙雲の兵も黄忠に従って兵糧奪取に向かった。黄忠が予定の時刻を過ぎても帰還しなかったため、趙雲は数十騎を率いて軽装で陣営の囲いを出、黄忠らを迎えがてら様子を見に出た。ちょうど曹公が大軍を繰り出して出撃してきたのに鉢合わせし、趙雲は曹公の先鋒部隊に攻撃され、交戦しているうちに、その本隊の大軍が到着して、激しい圧力を受けたため、そのまま前進して敵陣へ突撃し、戦いながら退却した。曹公の軍は蹴散らされては、またすぐ集結して包囲したが、趙雲は敵陣を突き破り、陣営の囲いへと引き返した。部将の張著が負傷して取り残されると、趙雲は再び馬を走らせて敵営の方へ引き返し、張著を迎え取って救出した。曹公の軍が追撃して陣営の囲いに迫ったとき、当時、沔陽長の張翼が趙雲の陣営内にいて、張翼は門を閉ざして防戦しようとしたが、趙雲は陣営に入るや、かえって大きく営門を開け放ち、軍旗を伏せて陣太鼓を鳴り止ませた。曹公の軍は趙雲に伏兵があるのではないかと疑い、兵を引いて退却しはじめた。そこへ趙雲が雷のように陣太鼓を打ち鳴らして天を震わせ、ただ大弩をもって背後から曹公の軍を射かけたため、曹公の軍は驚き恐れて、味方同士で踏みつけ合い、漢水の中に転落して死ぬ者がおびただしかった。先主は翌朝みずから趙雲の陣営までやって来て昨日の戦場を視察し、「子龍は全身これすべて胆であるな」と言った。音楽を奏で酒宴を開いて日暮れに及び、軍中では趙雲を虎威将軍と呼び慣わした。孫権が荊州を奇襲すると、先主は大いに怒り、孫権を討とうとした。趙雲は諫めて言った、「国賊とは曹操であって、孫権ではございません、それにまず魏を滅ぼせば、呉はおのずから服属いたしましょう。曹操自身は死んだとはいえ、子の曹丕が帝位を簒奪したのですから、人々の心に従って、早急に関中攻略を図り、黄河・渭水の上流を拠点として凶逆の賊を討つべきであり、そうすれば関東の義士たちは必ず兵糧を包み馬に鞭打って王者の軍を迎えることでしょう。魏を放置して、先に呉と戦うべきではございません、ひとたび戦端が開かれれば、にわかには兵を解くことができなくなります」と。先主は聞き入れず、ついに東征を決行し、趙雲を残留させて江州の軍事を統括させた。先主が秭帰で敗北を喫すると、趙雲は兵を進めて永安まで駆けつけたが、呉の軍はすでに撤退していた。", "persons": "趙雲,霍去病,劉備,夏侯淵,曹操,黄忠,張著,張翼,孫権,曹丕", "places": "益州,成都,漢中,沔陽,漢水,荊州,魏,呉,関中,黄河,渭水,関東,江州,秭帰,永安", "era_year": "建安19年（214年）〜章武2年（222年）", "source_book": "『雲別伝』", "keywords": "雲別伝,匈奴,県長,虎威将軍", "raw_tagged": "{{special:雲別伝|雲別傳}}曰：{{place:益州|益州}}既定，時議欲以{{place:成都|成都}}中屋舍及城外園地桑田分賜諸將。{{person:趙雲|雲}}駮之曰：「{{person:霍去病|霍去病}}以{{special:匈奴|匈奴}}未滅，無 陣営の囲いを出、{{person:黄忠|黄忠}}らを迎えがてら様子を見に出た。ちょうど{{person:曹操|曹公}}が大軍を繰り出して出撃してきたのに鉢合わせし、{{person:趙雲|趙雲}}は{{person:曹操|曹公}}の先鋒部隊に攻撃され、交戦しているうちに、その本隊の大軍が到着して、激しい圧力を受けたため、そのまま前進して敵陣へ突撃し、戦いながら退却した。{{person:曹操|曹公}}の軍は蹴散らされては、またすぐ集結して包囲したが、{{person:趙雲|趙雲}}は敵陣を突き破り、陣営の囲いへと引き返した。部将の{{person:張著|張著}}が負傷して取り残されると、{{person:趙雲|趙雲}}は再び馬を走らせて敵営の方へ引き返し、{{person:張著|張著}}を迎え取って救出した。{{person:曹操|曹公}}の軍が追撃して陣営の囲いに迫ったとき、当時、{{place:沔陽|沔陽}}{{office:県長|長}}の{{person:張翼|張翼}}が{{person:趙雲|趙雲}}の陣営内にいて、{{person:張翼|張翼}}は門を閉ざして防戦しようとしたが、{{person:趙雲|趙雲}}は陣営に入るや、かえって大きく営門を開け放ち、軍旗を伏せて陣太鼓を鳴り止ませた。{{person:曹操|曹公}}の軍は{{person:趙雲|趙雲}}に伏兵があるのではないかと疑い、兵を引いて退却しはじめた。そこへ{{person:趙雲|趙雲}}が雷のように陣太鼓を打ち鳴らして天を震わせ、ただ大弩をもって背後から{{person:曹操|曹公}}の軍を射かけたため、{{person:曹操|曹公}}の軍は驚き恐れて、味方同士で踏みつけ合い、{{place:漢水|漢水}}の中に転落して死ぬ者がおびただしかった。{{person:劉備|先主}}は翌朝みずから{{person:趙雲|趙雲}}の陣営までやって来て昨日の戦場を視察し、「{{person:趙雲|子龍}}は全身これすべて胆であるな」と言った。音楽を奏で酒宴を開いて日暮れに及び、軍中では{{person:趙雲|趙雲}}を{{office:虎威将軍|虎威将軍}}と呼び慣わした。{{person:孫権|孫権}}が{{place:荊州|荊州}}を奇襲すると、{{person:劉備|先主}}は大いに怒り、{{person:孫権|孫権}}を討とうとした。{{person:趙雲|趙雲}}は諫めて言った、「国賊とは{{person:曹操|曹操}}であって、{{person:孫権|孫権}}ではございません、それにまず{{place:魏|魏}}を滅ぼせば、{{place:呉|呉}}はおのずから服属いたしましょう。{{person:曹操|曹操}}自身は死んだとはいえ、子の{{person:曹丕|曹丕}}が帝位を簒奪したのですから、人々の心に従って、早急に{{place:関中|関中}}攻略を図り、{{place:黄河|黄河}}・{{place:渭水|渭水}}の上流を拠点として凶逆の賊を討つべきであり、そうすれば{{place:関東|関東}}の義士たちは必ず兵糧を包み馬に鞭打って王者の軍を迎えることでしょう。{{place:魏|魏}}を放置して、先に{{place:呉|呉}}と戦うべきではございません、ひとたび戦端が開かれれば、にわかには兵を解くことができなくなります」と。{{person:劉備|先主}}は聞き入れず、ついに東征を決行し、{{person:趙雲|趙雲}}を残留させて{{place:江州|江州}}の軍事を統括させた。{{person:劉備|先主}}が{{place:秭帰|秭帰}}で敗北を喫すると、{{person:趙雲|趙雲}}は兵を進めて{{place:永安|永安}}まで駆けつけたが、{{place:呉|呉}}の軍はすでに撤退していた。"}, {"id": "v36_p17_3", "volume": 36, "book": "蜀書", "section_title": "關張馬黃趙傳（趙雲）", "para_index": 17, "type": "本文", "raw_text": "建興元年，為中護軍、征南將軍，封永昌亭侯，遷鎮東將軍。五年，隨諸葛亮駐漢中。明年，亮出軍，揚聲由斜谷道，曹真遣大眾當之。亮令雲與鄧芝往拒，而身攻祁山。雲、芝兵弱敵強，失利於箕谷，然斂眾固守，不至大敗。軍退，貶為鎮軍將軍。", "kakikudashi": "建興元年、中護軍・征南将軍と為り、永昌亭侯に封ぜられ、鎮東将軍に遷る。五年、諸葛亮に随いて漢中に駐す。明る年、亮は軍を出し、斜谷道に由ると揚声し、曹真は大衆を遣わして之に当たらしむ。亮は雲と鄧芝とをして往きて拒がしめ、而して身ずからは祁 ", "section_title": "關張馬黃趙傳（趙雲）", "para_index": 17, "type": "裴注", "raw_text": "雲別傳曰：亮曰：「街亭軍退，兵將不復相錄，箕谷軍退，兵將初不相失，何故？」芝答曰：「雲身自斷後，軍資什物，略無所棄，兵將無緣相失。」雲有軍資餘絹，亮使分賜將士，雲曰：「軍事無利，何為有賜？其物請悉入赤岸府庫，須十月為冬賜。」亮大善之。", "kakikudashi": "『雲別伝』に曰く、亮曰く、「街亭の軍退くや、兵将は復た相録せず、箕谷の軍退くや、兵将は初めより相失わず、何の故ぞ？」と、芝は答えて曰く、「雲は身ずから後を断ち、軍資・什物、略ぼ棄つる所無く、兵将は相失うに縁無かりしなり」と。雲に軍資の余絹有り、亮は将士に分賜せしめんとするに、雲曰く、「軍事に利無きに、何ぞ賜有るを為さん？其の物は請うらくは悉く赤岸の府庫に入れ、十月を須ちて冬賜と為さん」と。亮は大いに之を善しとす。", "translation": "『雲別伝』にいう、諸葛亮が「街亭の軍が退却した際は、兵も将もばらばらになって統率が取れなくなったのに、箕谷の軍が退却した際は、兵も将もまったく離散しなかったのは、どういうわけか？」と尋ねると、鄧芝は答えて「趙雲がみずから殿軍を務め、軍需物資や器物も、ほとんど棄て去ったものがなく、兵も将もはぐれようがなかったのです」と言った。趙雲の手元に軍需用の余剰の絹があり、諸葛亮がこれを将兵に分け与えさせようとしたところ、趙雲は「戦いに戦果がなかったのに、どうして恩賞を与えることがありましょうか？その品はどうかすべて赤岸の倉庫に納め、十月になるのを待って冬の賞賜にあててください」と言った。諸葛亮は大いにこれを立派だと称賛した。", "persons": "諸葛亮,鄧芝,趙雲", "places": "街亭,箕谷,赤岸", "era_year": "建興6年（228年）", "source_book": "『雲別伝』", "keywords": "雲別伝", "raw_tagged": "{{special:雲別伝|雲別傳}}曰：{{person:諸葛亮|亮}}曰：「{{place:街亭|街亭}}軍退，兵將不復相錄，{{place:箕谷|箕谷}}軍退，兵將初不相失，何故？」{{person:鄧芝|芝}}答曰：「{{person:趙雲|雲}}身自斷後，軍資什物，略無所棄，兵將無緣相失。」{{person:趙雲|雲}}有軍資餘絹，{{person:諸葛亮|亮}}使分賜將士，{{person:趙雲|雲}}曰：「軍事無利，何為有賜？其物請悉入{{place:赤岸|赤岸}}府庫，須十月為冬賜。」{{person:諸葛亮|亮}}大善之。", "kakikudashi_tagged": "『{{special:雲別伝|雲別伝}}』に曰く、{{person:諸葛亮|亮}}曰く、「{{place:街亭|街亭}}の軍退くや、兵将は復た相録せず、{{place:箕谷|箕谷}}の軍退くや、兵将は初めより相失わず、何の故ぞ？」と、{{person:鄧芝|芝}}は答えて曰く、「{{person:趙雲|雲}}は身ずから後を断ち、軍資・什物、略ぼ棄つる所無く、兵将は相失うに縁無かりしなり」と。{{person:趙雲|雲}}に軍資の余絹有り、{{person:諸葛亮|亮}}は将士に分賜せしめんとするに、{{person:趙雲|雲}}曰く、「軍事に利無きに、何ぞ賜有るを為さん？其の物は請うらくは悉く{{place:赤岸|赤岸}}の府庫に入れ、十月を須ちて冬賜と為さん」と。{{person:諸葛亮|亮}}は大いに之を善しとす。", "translation_tagged": "『{{special:雲別伝|雲別伝}}』にいう、{{person:諸葛亮|諸葛亮}}が「{{place:街亭|街亭}}の軍が退却した際は、兵も将もばらばらになって統率が取れなくなったのに、{{place:箕谷|箕谷}}の軍が退却した際は、兵も将もまったく離散しなかったのは、どういうわけか？」と尋ねると、{{person:鄧芝|鄧芝}}は答えて「{{person:趙雲|趙雲}}がみずから殿軍を務め、軍需物資や器物も、ほとんど棄て去ったものがなく、兵も将もはぐれようがなかったのです」と言った。{{person:趙雲|趙雲}}の手元に軍需用の余剰の絹があり、{{person:諸葛亮|諸葛亮}}がこれを将兵に分け与えさせようとしたところ、{{person:趙雲|趙雲}}は「戦いに戦果がなかったのに、どうして恩賞を与えることがありましょうか？その品はどうかすべて{{place:赤岸|赤岸}}の倉庫に納め、十月になるのを待って冬の賞賜にあててください   const OFFICES = {"相": {"title": "相（しょう：諸侯王国の長官・国相、平原相）", "wiki_title": "国相", "mapping_note": "", "rank": "二千石（郡太守と同格の王国統治長官）", "ai_desc": "皇族が封じられた「王国（諸侯王国）」において、朝廷から派遣されて国内の民政・軍事・司法の一切を統括した最高長官（『続漢書』百官志五）。前漢中期の景帝・武帝の改革によって諸侯王から統治権が回収されて以降、王国の「相（国相）」は郡の「太守」と全く同一の職権（二千石）を持った。済南相に任じられた曹操は、権門貴戚に阿附していた十余県のうち八県の長吏を一挙に奏免し、城陽景王祠の淫祀六百余りを打ち壊して一郡を粛然と治めた。", "match_terms": ["国相", "國相"], "yomi": "しょう", "office_group": "local"}, "司馬": {"title": "別部司馬・軍司馬・司馬（べつぶしば／ぐんしば／しば）", "wiki_title": "司馬", "mapping_note": "", "rank": "比千石（将軍幕下の部隊指揮官）", "ai_desc": "大将軍・諸将軍および五校尉の傘下に置かれ、軍の編成・行軍・陣中規律・実戦指揮を掌った幕府の中核武官（『続漢書』百官志一）。興平元年（194年）の濮陽の戦いで、曹操が火中を突破した際に落馬して左の掌に火傷を負う窮地に陥ったとき、司馬の楼異が駆け寄って曹操を抱きかかえ馬に乗せて脱出させた。また建安13年（208年）の荊州平定時には、書家の梁鵠が軍仮司馬（仮司馬）に署されて秘書に配属された（衛恒『四体書勢序』）。", "match_terms": ["別部司馬", "軍司馬", "司馬"], "yomi": "しば", "office_group": "military"}, "刺史": {"title": "刺史（しし：徐州刺史・涼州刺史）", "wiki_title": "刺史", "mapping_note": "", "rank": "六百石（一州を監察・統治する地方長官）", "ai_desc": "一州を管轄し、傘下の郡太守（二千石）や県令長を監察・弾劾した地方長官（『続漢書』百官志五）。益州刺史であった种暠は、函谷関で蜀郡太守が曹騰へ送った書状を検閲・摘発して弾劾奏上を行った。", "match_terms": ["刺史"], "yomi": "しし", "office_group": "local"}, "牧": {"title": "牧・州牧（ぼく／しゅうぼく：涼州牧・并州牧）", "wiki_title": "州牧", "mapping_note": "", "rank": "二千石（刺史より格上の州最高軍政長官）", "ai_desc": "一州の行政・軍事・人事を直接統括する最高地方長官。後漢では長らく六百石の監察官である「刺史」が置かれていたが、霊帝の中平5年（188年）に劉焉の建言によって主要州に中央の九卿経験者などを「州牧（牧）」として派遣する制度が復活し、州牧が事実上の独立領主（群雄）となる契機となった（『後漢書』巻75・劉焉伝）。御史中丞であった韓馥は董卓によって冀州牧に抜擢された。", "match_terms": ["州牧"], "yomi": "ぼく", "office_group": "local"}, "太守": {"title": "太守（たいしゅ：下邳太守代行・東郡太守・襄陽太守・南郡太守）", "wiki_title": "太守", "mapping_note": "", "rank": "二千石（一郡の民政・軍事を統括する長官）", "ai_desc": "一郡の行政・軍事・司法を統括する地方長官（『続漢書』百官志五）。毎年末には「計吏（上計吏）」を帝都・洛陽へ派遣して郡の戸口・財政・治績を朝廷に報告させた。", "match_terms": ["太守"], "yomi": "たいしゅ", "office_group": "local"}, "偏将軍": {"title": "偏将軍（へんしょうぐん）", "wiki_title": "偏将軍", "mapping_note": "", "rank": "雑号将軍の下位・裨将軍の上位にあたる将軍号", "ai_desc": "大将軍や重号将軍・雑号将軍の副将・別動隊指揮官として一部隊（一偏の師）を率いる中堅将軍号。後漢末〜三国時代には常設に近い武官位（魏の九品官人法では第五品）となり、将軍号の最下位である「裨将軍」のすぐ上位に位置づけられ、「裨将軍→偏将軍→雑号 軍、益州平定後に黄忠が就任）", "wiki_title": "雑号将軍", "mapping_note": "", "ai_desc": "後漢初期の功臣・王覇（雲台二十八将の一人）が任じられて以来の由緒ある征討将軍号（『後漢書』巻20・王覇伝、魏制では第三品）。東呉では孫権・孫賁らが帯び、蜀漢では建安19年（214年）の益州平定後に、入蜀戦で常に先登陥陣の武功を立てた黄忠が討虜将軍に拝された（『三國志』巻36・黄忠伝）。", "yomi": "とうりょしょうぐん", "office_group": "military", "match_terms": ["討虜将軍", "討虜將軍"]}, "諸侯王": {"title": "諸侯王・藩王（しょこうおう／はんおう：漢代において皇族や創業期の異姓功臣が封ぜられた最高爵位、国内に丞相以下の百官を備えた）", "wiki_title": "諸侯王", "mapping_note": "", "ai_desc": "前漢の高祖・劉邦が楚漢戦争期に韓信・彭越・英布・張耳・臧荼・盧綰・韓王信・呉芮の「異姓八王」を封じ、ついで同姓の劉氏一族を各地に封じた最高位の封爵（『漢書』巻14・諸侯王表、巻19上・百官公卿表上）。前漢初期の諸侯王国には中央朝廷に倣って丞相（のち相と改称）・太傅・内史・御史大夫・中尉および群卿・百官が完備されており、建安18年（213年）5月に曹操が魏公に冊封された際には、魏国にこの「漢初の諸侯王の制」にならって丞相以下の群卿百官を置く特権が認められた（『三國志』巻1・武帝紀）。", "yomi": "しょこうおう", "office_group": "title_priv", "match_terms": ["諸侯王"]}, "軍正": {"title": "軍正（ぐんせい：軍中において軍法・軍律の執行と綱紀維持を掌る法務武官）", "wiki_title": "", "mapping_note": "", "ai_desc": "漢代以来、出征軍や大将軍幕下に置かれて軍中の法規・処罰・軍紀を司った武官（『漢書』巻1下・高帝紀下、巻69・趙充国伝、『続漢書』百官志一注）。博望の戦いで趙雲に生け捕られた同郷の夏侯蘭は、法律に通暁していたことから趙雲の推薦を受けて劉備軍の軍正に任じられた（『三國志』巻36・趙雲伝注引『雲別伝』）。", "yomi": "ぐんせい", "office_group": "military", "match_terms": ["軍正"]}, "鎮東将軍": {"title": "鎮東将軍（ちんとうしょうぐん：四鎮将軍の一、建安元年6月に曹操が就任）", "wiki_title": "四鎮将軍", "mapping_note": "", "ai_desc": "鎮東・鎮南・鎮西・鎮北の「四鎮将軍」の一つで、後漢末に創設され魏晋南北朝を通じて重号将軍（第二品〜第三品）に列した高位将軍職。建安元年（196年）6月、献帝は曹操を建徳将軍から鎮東将軍に昇進させ、あわせて祖父・曹騰や父・曹嵩ゆかりの「費亭侯」に封じた。", "yomi": "ちんとうしょうぐん", "office_group": "military", "match_terms": ["鎮東将軍", "鎮東將軍", "鎭東将軍", "鎭東將軍"]}, "鎮軍将軍": {"title": "鎮軍将軍（ちんぐんしょうぐん：諸軍鎮撫を冠する重号将軍）", "wiki_title": "雑号将軍", "mapping_note": "", "ai_desc": "魏・蜀・呉で置かれた高位将軍号で、魏制では第二〜三品相当。建興6年（228年）の第一次北伐で箕谷に退いたのち、趙雲は鎮東将軍から一等降格して鎮軍将軍に任じられた（『三國志』巻36・趙雲伝）。", "yomi": "ちんぐんしょうぐん", "office_group": "military", "match_terms": ["鎮軍将軍", "鎮軍將軍", "鎭軍将軍", "鎭軍將軍"]}, "関内侯": {"title": "関内侯（かんないこう：二十等爵の第19位、列侯に次ぐ準貴族爵位）", "wiki_title": "関内侯", "mapping_note": "", "ai_desc": "秦・漢の二十等爵制において、第20位「列侯（徹侯）」のすぐ下に位置する第19位の爵位（『漢書』巻19上・百官公卿表上、『続漢書』百官志五）。本来は関中（畿内）に居住して封国を持たず、規定の食邑や租税優遇・世襲の特権を受ける高爵であったが、後漢末〜三国時代には食邑を持たずに侯号と格式を授ける戦功褒賞として広く活用された。建安9年（204年）4月、   const PERSONS_INFO = {"張達": {"wiki_title": "張達", "ai_desc": "張飛配下の帳下将。章武元年（221年）、劉備の呉征討に従軍するため張飛が閬中から江州へ出発しようとした際、同僚の范彊とともに張飛を殺害し、その首級を持って長江を下り呉の孫権のもとへ逃亡した（『三國志』巻36・張飛伝）。", "yomi": "ちょうたつ", "name": "張達（ちょうたつ：張飛の帳下将、章武元年に范彊とともに閬中で張飛を殺害し孫権へ奔る）", "role": "蜀漢・張飛配下の帳下将"}, "徐晃": {"wiki_title": "徐晃", "ai_desc": "司隸河東郡楊県の人（?〜227年）、字は公明。初め郡吏から車騎将軍・楊奉の騎都尉となり、楊奉に献帝の洛陽帰還を進言したのち、建安元年（196年）冬に曹操に帰順して裨将軍となった。建安5年（200年）の官渡の戦いでは白馬・延津で顔良・文醜軍の撃破に参加して偏将軍に進み、さらに史渙とともに故市で袁紹軍の兵糧輸送車数千両を撃破・焼却する大功を立てて都亭侯に封じられた。その後も韓浩とともに烏巣攻略や河北・関中・漢中の諸戦役に従い、建安24年（219年）の樊城救援では関羽の十重の鹿角陣を正面突破して曹操から「周亜夫の風あり」と激賞され、文帝即位後に右将軍・陽平侯に昇った（『三國志』巻17・徐晃伝）。", "yomi": "じょこう", "name": "徐晃（じょこう：字は公明、河東郡楊県出身の曹魏の右将軍・陽平壮侯、官渡での輸送車撃破や樊城救援で活躍した五将軍の一）", "role": "後漢末〜三国魏の偏将軍・盪寇将軍・平寇将軍・右将軍・陽平壮侯（司隸河東郡楊県の人）"}, "許褚": {"name": "許褚（きょちょ：字は仲康、譙国譙県出身の曹操親衛の猛将・武衛将軍・牟郷壮侯、「虎痴」と恐れられ潼関で馬超を睨み威圧）", "yomi": "きょちょ", "wiki_title": "許褚", "role": "後漢末〜三国魏の武衛中郎将・武衛将軍・牟郷壮侯（豫州沛国譙県の人）", "ai_desc": "豫州沛国譙県の人（生没年不詳）、字は仲康。身長八尺余・腰回り十囲の巨漢で、曹操に帰順すると「我が樊噲なり」と称賛されて宿衛の虎士を統率し、剛勇だが実直な性格から「虎痴（こち）」と呼ばれた。建安16年（211年）の潼関の戦いで、曹操が単騎で馬超・韓遂と会語した際にただ一人随行し、多力を恃んで曹操に襲いかかろうとした馬超をカッと目を瞋らして睨みつけ（「瞋目盻之」）、手を出させなかった逸話で名高い（『三國志』巻18・許褚伝、巻36・馬超伝）。"}, "秦宜禄": {"wiki_title": "秦宜禄", "ai_desc": "後漢末の呂布配下の部将（?〜199年）。建安3年（198年）、曹操と劉備が呂布を下邳に包囲した際、呂布の命により救援を求める使者として袁術のもとへ赴き、袁術から漢の宗室の娘を娶らされてその地に留まった。この時、下邳城内に残されていた前妻（杜氏、秦朗の生母）を関羽が妻に迎えたいと曹操に願い出たが、城が陥落すると美貌を疑った曹操が自ら側室に留め置いた。のち秦宜禄は曹操に帰順して銍県長となったが、劉備が小沛へ走る際に張飛に誘われて従ったものの途中で後悔して引き返そうとしたため、張飛に斬殺された（『三國志』巻36・関羽伝注引『蜀記』『魏氏春秋』、巻3・明帝紀注引『献帝伝』）。", "yomi": "しんぎろく", "name": "秦宜禄（しんぎろく：呂布配下の部将、下邳包囲中に求援使節として出向いた間に前妻・杜氏が曹操の側室となる）", "role": "後漢末の呂布配下の部将・のち曹操配下の銍県長（魏の驍騎将軍・秦朗の実父）"}, "関彝": {"wiki_title": "関彝", "ai_desc": "関興の庶子で、関統の異母弟、関羽の孫。嫡兄の関統が子を残さずに没したため、代わって関氏の封爵（漢寿亭侯）を継承した（『三國志』巻36・関羽伝）。", "yomi": "かんい", "name": "関彝（かんい：関興の庶子・関羽の孫、子なく没した兄・関統の後を受けて漢寿亭侯の封爵を継ぐ）", "role": "蜀漢の漢寿亭侯（関興の庶子・関羽の孫）"}, "張著": {"wiki_title": "", "ai_desc": "劉備配下の部将。建安24年（219年）の漢中争奪戦において趙雲に従い曹操軍と交戦した際、負傷して取り残されたが、趙雲が単騎で敵中へ引き返して救出し本営へ連れ帰った（『三國志』巻36・趙雲伝注引『雲別伝』）。", "yomi": "ちょうちょ", "name": "張著（ちょうちょ：趙雲配下の将、漢水の戦いで負傷し趙雲に救出された武将）", "role": "蜀漢（劉備配下）の将"}, "姜叙": {"name": "姜叙（きょうじょ：字は伯奕、天水郡冀県出身の撫夷将軍、楊阜と結び鹵城で馬超討伐の義兵を挙げる）", "yomi": "きょうじょ", "wiki_title": "姜叙", "role": "後漢末の撫夷将軍（涼州天水郡冀県の人、楊阜の従兄、姜維と同郡の名族）", "ai_desc": "涼州天水郡冀県の人（生没年不詳）、字は伯奕。楊阜の叔母の子（従兄）にあたり、撫夷将軍として歴城（鹵城付近）に駐屯していた。建安18年（213年）、旧主・韋康の仇を報じようと訪れた楊阜の訴えと、自らの老母（楊氏）の「主君の死を救えず、人質となった我が子や命を惜しんで大義を忘れるな」という烈しい激励を受け、趙昂・尹奉らとともに鹵城で挙兵した。母と子は冀城で馬超に殺害されたが、夏侯淵の援軍と連携してついに馬超を漢中へ駆逐した（『三國志』巻25・楊阜伝、巻36・馬超伝）。"}, "彭越": {"wiki_title": "彭越", "ai_desc": "秦末・楚漢戦争期の武将（?〜前196年）、昌邑の人、字は仲。鉅野沢の漁労・群盗から身を起こし、楚漢戦争では梁の地を拠点に神出鬼没の遊撃戦を展開して項羽の背後と糧道を絶えず脅かし、垓下の決戦に大きく貢献した。前漢建国後に梁王に封じられたが、高祖11年（前196年）に謀反の嫌疑をかけられて廃位・処刑された（『史記』巻90・魏豹彭越列伝、『漢書』巻34・彭越伝）。諸葛亮は関羽への返書で馬超を黥布（英布）・彭越の輩に喩えた。", "yomi": "ほうえつ", "name": "彭越（ほうえつ：字は仲、昌邑出身の楚漢戦争期の名将、遊撃戦で項羽の糧道を断ち前漢の梁王に封じられる）", "role": "楚漢戦争期の魏相国→前漢の梁王"}, "郭援": {"name": "郭援（かくえん：鍾繇の甥・袁尚配下の河東太守、建安7年に平陽で馬超配下の龐徳に斬られる）", "yomi": "かくえん", "wiki_title": "郭援", "role": "後漢末の袁尚配下の河東太守（司隷校尉・鍾繇の姉の子）", "ai_desc": "後漢末の武将（?〜202年）。司隷校尉・鍾繇の姉の子（甥）にあたるが、袁氏陣営（袁尚）に仕えて河東太守に任じられた。建安7年（202年）、并州刺史・高幹および南匈奴単于・呼厨泉とともに数万の兵で河東へ侵攻し平陽を包囲したが、鍾繇の説得に応じて参戦した馬騰・韓遂の援軍（馬超・龐徳ら）と汾水の戦いで激突して大敗し、龐徳に親ら首を討ち取られた（『三國志』巻13・鍾繇伝、巻18・龐徳伝、巻36・馬超伝）。"}, "曹仁": {"wiki_title": "曹仁", "ai_desc": "豫州沛国譙県の人（168年〜223年）、字は子孝。曹操の従弟（祖父は曹褒、父は熾）。若き日は弓馬と狩猟を好んで豪傑千余人を集め、曹操の挙兵に従い別部司馬・行厲鋒校尉として常に騎兵の先鋒を務めた。徐州征伐・呂布討伐・張繡征討で戦功を重ね、建安4年（199年）4月には史渙とともに黄河を渡り犬城で眭固を撃破・斬殺した。のち官渡の戦いでの隠強・鶏洛山奇襲、赤壁後の江陵防衛戦、建安24年（219年）の関羽に対する樊城死守など数多の危機を救い、文帝（曹丕）の代に大将軍・大司馬に昇った（『三國志』巻9・曹仁伝）。", "yomi": "そうじん", "name": "曹仁（そうじん：字は子孝、曹操の従弟、大司馬・陳忠侯、創業の先鋒から樊城死守まで曹氏随一の武勲を立てた名将）", "role": "後漢末〜三国魏の征南将軍・大将軍・大司馬・陳忠侯（豫州沛国譙県の人、曹操の従弟）"}, "龐会": {"wiki_title": "龐会", "ai_desc": "曹魏の武将、立義将軍・関門亭侯であった龐徳の子。父の遺風を継ぐ勇烈な将として知られ、父・龐徳が建安24年（219年）に樊城で関羽に処刑されたことから深い恨みを抱いていた。曹魏では中衛将軍・列侯に進み、諸葛誕の乱平定などに功を立てたのち、景元4年（263年）の鍾会・鄧艾による蜀漢征討に従軍した。王隠『蜀記』によれば、蜀漢の滅亡時に龐会は関羽の子孫・一族を尽く滅ぼしたとされる（『三國志』巻18・龐悳伝、巻36・関羽伝注引『蜀記』）。", "yomi": "ほうかい", "name": "龐会（ほうかい：龐徳の子、曹魏の中衛将軍・列侯、鍾会・鄧艾の蜀征討に従軍し『蜀記』では関氏の一族を滅ぼしたと伝わる）", "role": "曹魏の平寇将軍・中衛将軍・郷侯（龐徳の子）"}, "裴松之": {"wiki_title": "裴松之", "ai_desc": "本貫は河東郡聞喜県の人（372年〜451年）、字は世期。南朝宋の文帝（劉義隆）から陳寿『三國志』が簡略に過ぎるとして注釈編纂の勅命を受け、元嘉6年（429年）に全六十五巻の『三國志注』（裴松之注）を完成させて上表した（自称の「臣松之」は皇帝への上表形式による）。現在では散逸してしまった王沈『魏書』・魚豢『魏略』・韋昭『呉書』・司馬彪『九州春秋』・郭頒『世語』など二百種以上の漢末・魏晋期の史書・家伝・記録を博捜して本文の欠落や異伝を補い、あわせて史料批判や人物論評を加えており、文帝から「不朽の業」と激賞された（『宋書』巻64・裴松之伝）。", "yomi": "はいしょうし", "name": "裴松之（はいしょうし：字は世期、河東郡聞喜県出身の南朝宋の歴史家・中書侍郎・太中大夫、『三國志注』の撰者）", "role": "東晋末〜南朝宋の歴史家・中書侍郎・司州主簿・永嘉太守・国子博士・太中大夫（本貫は司州河東郡聞喜県）"}, "種": {"name": "種（しゅ：馬超の側室〔小婦〕の弟、三輔から漢中へ逃れ元旦に馬超へ祝寿を述べる）", "yomi": "しゅ", "wiki_title": "", "role": "馬超の側室（小婦）の弟", "ai_desc": "馬超の側室（小婦）の弟（姓は不詳）。魚豢『典略』によれば、馬超が反乱を起こす前は三輔に留まっており、馬超が敗れると一足先に漢中へ入っていた。のちに漢中へ逃れてきた馬超に対し、元旦（正旦）に新年の祝いの言葉を述べたところ、鄴の一族（馬騰・馬休・馬鉄ら）を処刑で失っていた馬超は胸を叩いて血を吐き、「一門百口が一朝にして命を落としたというのに、今お前と二人だけで何を祝い合うというのか」と慟哭した（『三國志』巻36・馬超伝注引『典略』）。"}, "厳顔": {"wiki_title": "厳顔", "ai_desc": "後漢末の益州牧・劉璋配下の巴郡太守。かつて劉備が入蜀した際には「窮山に独坐し、虎を放ちて自ら衛るなり」と嘆じたと伝わる（『華陽国志』）。建安18〜19年（213〜214年）、長江を遡上してきた張飛の軍に江州で敗れて生け捕りとなった際、「我が州には断頭将軍はあっても降将軍はない」と屈せず、処刑を命じられても顔色一つ変えなかったため、その気概に感服した張飛に釈放されて賓客として遇された（『三國志』巻36・張飛伝）。", "yomi": "げんがん", "name": "厳顔（げんがん：劉璋配下の巴郡太守、「断頭将軍ありて降将軍なし」と気節を示し張飛に礼遇される）", "role": "後漢末の巴郡太守（劉璋配下→劉備の賓客）"}, "龐徳": {"wiki_title": "龐徳", "ai_desc": "後漢末の武将。南安郡狟道県（甘粛省武山県南西）の人、字は令明。初め馬騰・馬超父子に従って武勇で知られ、漢中の張魯のもとに留まったのち建安20年（215年）に曹操へ帰順して立義将軍となった。建安24年（219年）、曹仁・于禁とともに樊城救援に赴いたが漢水の氾濫で関羽に捕らえられ、降伏を拒んで処刑された（『三國志』巻18・龐悳伝、巻17・于禁伝）。", "yomi": "ほうとく", "name": "龐徳（ほうとく）"}, "公孫瓚": {"wiki_title": "公孫瓚", "ai_desc": "幽州遼西郡令支県の人（?〜199年）。盧植に学び、白馬を揃えた精鋭騎兵「白馬義従」を率いて烏丸・鮮卑や青州・徐州黄巾を撃破して威名を轟かせた。従弟・公孫越が袁紹方の周昂との戦いで戦死したことを機に袁紹と全面対立し、袁術・陶謙と結んで単経を兗州刺史、田楷を青州刺史、厳綱を冀州刺史に独自に任じ、さらに別部司馬・劉備を高唐に配して南下を図ったが、界橋および平原・発干で袁紹・曹操連合軍に敗れ、のち建安4年（199年）に易京で袁紹に攻め滅ぼされた（『三國志』巻8・公孫瓚伝）。", "yomi": "こうそんさん", "name": "公孫瓚（こうそんさん：字は伯珪、遼西郡令支県出身の奮武将軍・前将軍・易侯、白馬義従を率いて袁紹と河北の覇を争う）", "role": "後漢末の群雄・奮武将軍・前将軍・易侯（幽州遼西郡令支県の人）"}, "張苞": {"wiki_title": "張苞", "ai_desc": "蜀漢の車騎将軍・張飛の長男。父に先立つか若くして早世したため爵位は次男の張紹が継いだが、遺児の張遵がのちに尚書となり綿竹で戦死した（『三國志』巻36・張飛伝）。", "yomi": "ちょうほう", "name": "張苞（ちょうほう：張飛の長男、早世し遺子の張遵がのちに尚書となる）", "role": "張飛の長男（早世、張遵の父）"}, "張翼": {"wiki_title": "張翼", "ai_desc": "蜀漢の将軍（？〜264年）、字は伯恭、犍為郡武陽の人。建安24年（219年）の漢中戦では沔陽長として趙雲の陣営内にあり、のち庲降都督・尚書・征西大将軍・左車騎将軍（領冀州刺史）を歴任し、蜀漢滅亡後の咸煕元年（264年）に成都の兵乱で殺害された（『三國志』巻45・張翼伝、巻36・趙雲伝注引『雲別伝』）。", "yomi": "ちょうよく", "name": "張翼（ちょうよく：字は伯恭、漢水戦時の沔陽長、のち蜀漢の左車騎将軍に至る）", "role": "蜀漢の沔陽長・のち左車騎将軍"}, "耿鄙": {"name": "耿鄙（こうひ：後漢末の涼州刺史、奸吏の程球を信任して王国・韓遂・馬騰らの反乱を招き殺害される）", "yomi": "こうひ", "wiki_title": "耿鄙", "role": "後漢霊帝末期の涼州刺史", "ai_desc": "後漢末の地方長官（?〜187年）。中平年間、涼州の反乱鎮圧と統治再建のため涼州刺史に任じられたが、治中従事の程球ら奸吏を信任して腐敗を招き、傅燮の諫言も聴き入れなかった。中平4年（187年）4月、6郡の兵を率いて金城の王国・韓遂らを討とうと隴西郡狄道まで進軍した際、不満を爆発させた配下や漢陽の民・王国らの反乱に遭い、程球とともに殺害された（『後漢書』巻8・霊帝紀、巻58・傅燮伝、『三國志』巻36・馬超伝注引『典略』）。"}, "楊秋": {"wiki_title": "楊秋", "ai_desc": "関中の部曲将の一人。建安16年（211年）、馬超・韓遂らと連合して潼関に挙兵したが、9月の渭南の戦いで曹操に敗れると北方の涼州安定郡へ逃奔した。同年10月、長安から北上してきた曹操軍に安定を包囲されると降伏し、元の爵位を復されて現地の民衆慰撫を任された。その後も安定に留まって夏侯淵・張既らの梁興・盧水胡討伐に協力し、魏の文帝の黄初年間に討寇将軍・特進・臨涇侯に昇って天寿を全うした（『三國志』巻1・武帝紀および注引『魏略』、巻15・張既伝）。", "yomi": "ようしゅう", "name": "楊秋（ようしゅう：関中諸将の一人、安定で曹操に降伏し魏の討寇将軍・特進・臨涇侯に至った将軍）", "role": "関中の部曲将・のち魏の討寇将軍・特進・臨涇侯"}, "梁寛": {"name": "梁寛（りょうかん：涼州刺史・韋康の故吏、馬超が鹵城攻撃に出陣した隙に趙衢とともに冀城の城門を閉ざす）", "yomi": "りょうかん", "wiki_title": "梁寛 (三国)", "role": "後漢末の涼州刺史・韋康の故吏", "ai_desc": "後漢末の涼州の官人。殺害された涼州刺史・韋康の旧臣（故吏）であり、建安18年（213年）9月、楊阜・姜叙が鹵城で挙兵し馬超がこれを討つため冀城から出陣すると、趙衢らと共謀して冀城を占拠し、馬超の妻子を殺して城門を固く閉ざし、馬超を進退窮まらせて漢中へ敗走させた（『三國志』巻25・楊阜伝、巻36・馬超伝）。"}, "韋康": {"name": "韋康（いこう：字は元将、京兆杜陵出身の涼州刺史、冀城で馬超に包囲され民を救うため開城降伏するも殺害される）", "yomi": "いこう", "wiki_title": "韋康", "role": "後漢末の涼州刺史（司隷京兆尹杜陵県の人、太僕・韋端の子、韋誕の兄）", "ai_desc": "司隷京兆尹杜陵県の人（?〜213年）、字は元将。涼州牧・太僕を務めた韋端の子。父が中央に召されると代わって涼州刺史となり、天水郡の冀城で政務を執った。建安17〜18年（212〜213年）、再起した馬超の軍に冀城を約8か月にわたり包囲されて救援も届かず、吏民の犠牲を見かねて楊阜の反対を押し切り和議を結んで開城したが、城に入った馬超（命を受けた楊昂）によって約束を破られ殺害された（『三國志』巻25・楊阜伝、巻36・馬超伝）。"}, "趙雲": {"wiki_title": "趙雲", "ai_desc": "蜀漢の将軍（？〜229年）、字は子龍、常山真定の人。本郡の推挙を受けて義従の吏兵を率い公孫瓚に属したのち、平原相・劉備に随従して主騎となり、鄴での募兵を経て荊州へ従った。建安13年（208年）の当陽長阪では幼少の後主・劉禅と甘夫人を抱えて危難から救出し牙門将軍に昇進。江南平定後に偏将軍・領桂陽太守となり、劉備の入蜀時は留営司馬として荊州に留まり、孫夫人が劉禅を連れて呉へ帰ろうとした際には張飛とともに長江を遮断して奪還した。のち入蜀して翊軍将軍、漢中争奪戦での空営の計、建興年間の征南将軍・永昌亭侯・鎮東将軍を歴任し、建興7年（229年）に死去、景耀4年（261年）に順平侯と追諡された（『三國志』巻36・趙雲伝および注引『雲別伝』）。", "yomi": "ちょううん", "name": "趙雲（ちょううん：字は子龍、常山真定の人、長阪で劉禅を救出し鎮東将軍・順平侯に至る）", "role": "蜀漢の鎮東将軍・永昌亭侯（諡は順平侯）"}, "曹丕": {"wiki_title": "曹丕", "ai_desc": "豫州沛国譙県の人（187年〜226年）、字は子桓。曹操と武宣卞皇后の間に生まれた長男（曹昂の異母弟、曹彰・曹植の同母兄）。幼少より騎射・剣術と学問・詩賦の双方に秀で、建安16年（211年）に五官中郎将・副丞相に任じられたことから世に「五官将」と称された。弟・曹植との後継争いを経て建安22年（217年）に魏太子となり、建安25年（220年）正月の曹操薨去により魏王を継ぎ、同年10月に後漢の献帝から禅譲を受けて魏王朝を創始した（黄初改元）。『典論』を著して「文章は経国の大業、不朽の盛事」と唱えた建安文学の中心人物でもある（『三國志』巻2・文帝紀）。", "yomi": "そうひ", "name": "曹丕・五官将・文帝（そうひ：字は子桓、曹操と卞夫人の長男、五官中郎将・魏王を経て魏王朝の初代皇帝）", "role": "五官中郎将・副丞相・魏太子・魏王・三国魏の初代皇帝〔高祖文皇帝〕（豫州沛国譙県の人、曹操の子）"}, "劉理": {"name": "劉理（りゅうり：字は奉孝、劉備の皇子・安平悼王、馬超の娘を妃に迎える）", "yomi": "りゅうり", "wiki_title": "劉理", "role": "蜀漢の梁王・のち安平王（昭烈帝・劉備の子、後主・劉禅の異母弟、諡は悼王）", "ai_desc": "蜀漢の皇族（?〜244年）、字は奉孝。昭烈帝・劉備の子で、後主・劉禅および魯王・劉永の異母弟。章武元年（221年）6月に梁王に封じられ、建興8年（230年）に安平王へ改封された。馬超の娘を正妃（王妃）に迎え、延熙7年（244年）に没して悼王と諡された（『三國志』巻34・劉理伝、巻36・馬超伝）。"}, "馬休": {"name": "馬休（ばきゅう：馬騰の子・馬超の弟、奉車都尉に拝されて父や一族とともに鄴へ移り、のち馬超の挙兵により処刑される）", "yomi": "ばきゅう", "wiki_title": "馬休", "role": "後漢末の奉車都尉（馬騰の子、馬超の弟・馬鉄の兄）", "ai_desc": "司隷右扶風茂陵県の人（?〜212年）。馬騰の子で、長兄・馬超の弟、馬鉄の兄。父の馬騰が衛尉として中央に召された際、奉車都尉に任じられ、弟の騎都尉・馬鉄および一族とともに鄴へ移住した。しかし建安16年（211年）に兄の馬超が関中で曹操に対して反乱を起こしたため、翌建安17年（212年）5月、父の馬騰・弟の馬鉄ら三族ともども処刑された（『後漢書』巻9・孝献帝紀、『三國志』巻36・馬超伝注引『典略』）。"}, "劉璋": {"wiki_title": "劉璋", "ai_desc": "荊州江夏郡竟陵県の人（?〜220年頃）、字は季玉。前漢の魯恭王・劉余の末裔で、益州牧・劉焉の末子。興平元年（194年）に父・劉焉が病没すると、帳下司馬・趙韙らの推戴と朝廷の追認によって益州牧を継いだ。漢中の張魯と対立し、長らく巴蜀の険に拠って中原の朝廷への徴発・貢納を絶っていたが、建安13年（208年）秋に曹操が荊州へ南征して劉琮を降すと威勢に恐れを抱き、陰溥や別駕・張松らを相次いで使者として派遣し、初めて朝廷の徴役を受け入れて曹操の軍へ補充兵を送った。しかし張松が曹操に冷遇されたことに反発して劉備の引き入れを画策したことから、のち建安19年（214年）に劉備に成都を包囲されて降伏し、荊州の公安へ移されたのち呉の孫権に荊州牧とされ没した（『三國志』巻1・武帝紀、巻31・劉二牧伝）。", "yomi": "りゅうしょう", "name": "劉璋（りゅうしょう：字は季玉、江夏郡竟陵県出身の漢室宗親・益州牧、建安13年に初めて曹操へ遣使・送兵して帰順を示す）", "role": "後漢末の益州牧・振威将軍（荊州江夏郡竟陵県の人、魯恭王劉余の末裔・劉焉の末子）"}, "呂蒙": {"wiki_title": "呂蒙", "ai_desc": "豫州汝南郡富陂県の人（178年〜219年）、字は子明。少年の頃に姉の夫・鄧当に従って孫策の軍に入り、孫権から学問を勧められて篤学に励み、魯粛から「呉下の阿蒙にあらず」と感嘆された。魯粛の没後にその軍団を引き継いで陸口に駐屯し、外には関羽との親睦を装いつつ密かに荊州奪取を計画した。建安24年（219年）秋、関羽が主力を率いて樊城を攻めると病と称して建業へ下がって関羽を油断させ、精兵を大型商船（𦩷𦪇）の船底に伏せ白衣の商人に変装させて長江を遡上し、沿岸の烽火台を無力化した上で南郡太守・麋芳と公安の士仁を降伏させて江陵を無血占領した。関羽敗死の直後、公安・江陵で病が再発して四十二歳で没した（『三國志』巻54・呂蒙伝、巻36・関羽伝）。", "yomi": "りょもう", "name": "呂蒙（りょもう：字は子明、汝南富陂出身の呉の南郡太守・孱陵侯、「白衣揺櫓」の奇襲で関羽から江陵を奪取した名将）", "role": "三国呉の武将・偏将軍・左護軍・虎威将軍・南郡太守・孱陵孱侯"}, "韓信": {"wiki_title": "韓信", "ai_desc": "淮陰（臨淮郡淮陰県）の人（?〜前196年）。若い頃は貧困で生業も治めず他人の家に寄食して嫌われ、淮陰の無頼の若者から挑発された際には剣を佩びながらその股の下を這い潜る（「胯下の辱・股くぐり」）嘲笑を甘受した（『史記』巻92・淮陰侯列伝）。項羽の下では重用されなかったが、漢の蕭何に「国士無双」と見抜かれて高祖・劉邦の大将軍に抜擢されると、暗渡陳倉・背水の陣・濰水の戦い・垓下の包囲など古今無双の用兵で魏・代・趙・燕・斉・楚を次々と平定し、蕭何・張良とともに漢王朝創業の「三傑」と称えられた。のち謀反の疑いにより呂后と蕭何に誘殺された。", "yomi": "かんしん", "name": "韓信（かんしん：淮陰出身の不世出の兵家、「股くぐり」の恥を忍んで前漢の高祖・劉邦の天下統一を成し遂げた斉王・楚王・淮陰侯）", "role": "前漢創業の筆頭名将（大将軍→斉王→楚王→淮陰侯、「漢の三傑」の一）"}, "楽資": {"name": "楽資（がくし：東晋の著作佐郎・史家、『山陽公載記』十巻を撰するも裴松之から記事の虚妄を批判される）", "yomi": "がくし", "wiki_title": "山陽公載記", "role": "東晋の著作佐郎・史家（『山陽公載記』撰者）", "ai_desc": "東晋の史家・著作佐郎（生没年不詳）。後漢最後の皇帝・献帝（禅譲後に山陽公へ封じられる）の治世から魏への禅譲前後にかけての逸事・異聞を記録した史書『山陽公載記』（全十巻、『隋書』経籍志二）を撰した。裴松之は『三國志』注に同書をしばしば引用しつつも、馬超が劉備の字を呼んで関羽・張飛に殺されかけたとする逸話（当時関羽は荊州鎮守中で益州に不在）などに対し、袁暐（『献帝春秋』撰者）と並べて「穢雑虚謬（雑駁で虚偽・誤謬だらけ）」と厳しく批判している（『三國志』巻36・馬超伝注）。"}, "袁暐": {"wiki_title": "献帝春秋", "ai_desc": "後漢末・献帝期の歴史を記録した史書『献帝春秋』全十巻の著者（『隋書』巻33・経籍志二では「『献帝春秋』十巻、袁迪撰」と記す）。完本は散逸したが、裴松之が『三國志』注において二十箇所近く引用しており、濮陽城内で呂布の騎兵に捕らえられた曹操が「黄色い馬に乗って逃げる者が曹操だ」と機転を利かせて難を逃れた有名な逸話などを今に伝えている。", "yomi": "えんい", "name": "袁暐（えんい：『献帝春秋』十巻の撰者、『隋書』経籍志では「袁迪」とも表記）", "role": "後漢末〜三国期の歴史家（『献帝春秋』十巻の撰者）"}, "馬騰": {"wiki_title": "馬騰", "ai_desc": "馬騰（ばとう）：字は寿成、右扶風茂陵の人。征西将軍として郿に駐屯し、興平元年（194年）に劉焉・劉範父子と内通して長安の李傕政権を攻めたが敗れ、涼州へ退却した。", "yomi": "ばとう", "name": "馬騰（ばとう）"}, "曹真": {"wiki_title": "曹真", "ai_desc": "後漢末から三国魏にかけての宗室・武将。沛国譙県の人、字は子丹。曹操の族子として養育され、虎豹騎を率いたのち漢中戦線や雍涼平定で活躍した。文帝・明帝期には上軍大将軍・中軍大将軍・大将軍・大司馬を歴任し、太和2年（228年）には関中・隴右の諸軍を統率して張郃らを街亭へ派遣し、諸葛亮の第一次北伐を退けた（『三國志』巻9・曹真伝、巻17・張郃伝・徐晃伝）。", "yomi": "そうしん", "name": "曹真（そうしん）"}, "馬子碩": {"name": "馬子碩（ばしせき：馬騰の父・馬超の祖父、字は子碩、天水郡蘭干県尉を失官後、隴西で羌族の娘を娶る）", "yomi": "ばしせき", "wiki_title": "", "role": "後漢桓帝期の天水郡蘭干県尉（馬援の後裔、馬騰の父・馬超の祖父）", "ai_desc": "後漢桓帝の時代の官人（生没年不詳、実名は伝わらず字は子碩）。魚豢『典略』によれば伏波将軍・馬援の末裔で、かつて天水郡（漢陽郡）蘭干県の県尉を務めたが、のちに官を失ってそのまま隴西に留まり羌族と雑居した。家が貧しく妻がいなかったため羌族の女性を娶り、馬騰をもうけた（『三國志』巻36・馬超伝注引『典略』）。"}, "趙範": {"wiki_title": "趙範", "ai_desc": "後漢末の桂陽太守。赤壁の戦いののち劉備が江南四郡を平定した際、桂陽郡を挙げて降伏し、後任の桂陽太守を兼ねた偏将軍・趙雲と交代した。未亡人となっていた兄嫁の樊氏が国色の美女であったことから、同姓の誼を結ぼうとして趙雲に娶らせようとしたが固辞され、はたして後に離反して逃亡した（『三國志』巻36・趙雲伝注引『雲別伝』）。", "yomi": "ちょうはん", "name": "趙範（ちょうはん：後漢末の桂陽太守、劉備に降り寡嫂の樊氏を趙雲に配そうとした人物）", "role": "後漢末の桂陽太守"}, "法正": {"wiki_title": "法正", "ai_desc": "法正（ほうせい）：字は孝直、右扶風郿の人。劉璋の使者として劉備のもとへ派遣され、張松とともに劉備の益州招請および入蜀作戦の主謀者となった（『三國志』巻37・法正伝）。", "yomi": "ほうせい", "name": "法正（ほうせい）"}, "韓玄": {"name": "韓玄（かんげん：後漢末の長沙太守、曹操の荊州平定後に裨将軍・黄忠を統属させるも赤壁後に劉備へ帰順）", "yomi": "かんげん", "wiki_title": "韓玄", "role": "後漢末の長沙太守", "ai_desc": "後漢末の長沙太守（生没年不詳）。建安13年（208年）に曹操が荊州を制圧した際、攸県を守っていた黄忠は仮の裨将軍として長沙太守・韓玄の統属下に置かれた。同年冬の赤壁の戦い後、先主・劉備が荊州南部の江南四郡（武陵・長沙・桂陽・零陵）を平定した際に帰順した（『三國志』巻32・先主伝、巻36・黄忠伝）。"}, "高幹": {"wiki_title": "高幹", "ai_desc": "兗州陳留郡圉県の人（?〜206年）、字は元才。蜀郡太守・高躬の子で、袁紹の姉妹の子（外甥）にあたる（『三國志』巻6・袁紹伝注引謝承『後漢書』）。才志があり士を好んで招いた。初平2年（191年）には荀諶らとともに冀州牧・韓馥を説得して袁紹に冀州を譲らせ、袁紹の下で并州牧を領した。建安9年（204年）8月に曹操が鄴を抜くと一旦降伏して并州刺史とされたが、翌建安10年（205年）に曹操が北方の烏丸討伐へ向かった隙に上党太守（仲長統らを擁した并州庁周辺、時の太守）を捕らえて反乱を起こし、壺関口を守備した。楽進・李典に撃たれて壺関城へ退き、建安11年（206年）正月に曹操の親征を受けると南匈奴の呼厨泉単于へ救援を求めたが拒絶され、3月に壺関が陥落すると荊州へ逃れようとして上洛都尉・王琰に捕らえられ斬られた（『三國志』巻1・武帝紀、巻6・袁紹伝、巻18・李典伝）。", "yomi": "こうかん", "name": "高幹（こうかん：字は元才、陳留郡圉県出身の袁紹の甥・并州刺史、壺関に拠って曹操に叛くも敗走し上洛で斬られる）", "role": "後漢末の袁紹配下の并州牧・曹操配下の并州刺史（兗州陳留郡圉県の人、高躬の子・袁紹の外甥）"}, "車冑": {"wiki_title": "車冑", "ai_desc": "後漢末の武将・地方長官（?〜199年）。建安3年（198年）冬に曹操が呂布を滅ぼして徐州を平定したのち、徐州刺史に任じられて下邳を守備していた。しかし翌建安4年（199年）、袁術迎撃の名目で許都を出立して下邳へ至った劉備が密かに董承らの反曹操陰謀に呼応して挙兵した際、襲撃されて殺害された（『三國志』巻1・武帝紀、巻32・先主伝）。", "yomi": "しゃちゅう", "name": "車冑（しゃちゅう：曹操が任命した徐州刺史、建安4年冬に下邳で離反した劉備に殺害される）", "role": "後漢末の曹操配下の徐州刺史"}, "馬玩": {"name": "馬玩（ばがん：関中十部将の一人、建安16年に馬超・韓遂らとともに潼関で曹操軍と戦う）", "yomi": "ばがん", "wiki_title": "馬玩", "role": "後漢末の関中諸将（十部）の一人", "ai_desc": "後漢末の関中の部将。建安16年（211年）、馬超・韓遂ら関中十部の諸将と合従して十万の軍勢で潼関に拠り、西征してきた曹操軍と黄河・渭水の合流付近で決戦に及んだが敗走した（『三國志』巻1・武帝紀、巻36・馬超伝注引『典略』）。"}, "樊氏_趙範嫂": {"wiki_title": "樊氏", "ai_desc": "後漢末の桂陽太守・趙範の亡兄の妻（寡嫂）。「国色」と称される美貌の持ち主であり、劉備に降った趙範が後任の桂陽太守・趙雲と親密になろうとして彼女を趙雲に娶らせようとしたが、趙雲は同姓であることと趙範の心底が測り難いことを理由に固辞した（『三國志』巻36・趙雲伝注引『雲別伝』）。", "yomi": "はんし", "name": "樊氏（はんし：桂陽太守・趙範の寡嫂、国色の美貌と伝えられる）", "role": "桂陽太守・趙範の亡兄の妻"}, "麋芳": {"wiki_title": "麋芳", "ai_desc": "徐州東海郡朐県の人、字は子方。安漢将軍・麋竺の弟。兄とともに莫大な家財を投じて徐州時代から劉備に従い、劉備の入蜀後は荊州に残留して南郡太守に任じられ、本拠の江陵を守備した。しかし日頃から関羽に自分を軽んじられていると不満を抱いており、建安24年（219年）に関羽が樊城へ出陣した際、軍資の供給が行き届かず関羽から「帰還したら処罰する」と脅されたため深く恐怖し、孫権・呂蒙の誘いに応じて使者を出し江陵を開城して呉へ降伏した（『三國志』巻36・関羽伝、巻38・麋竺伝、巻54・呂蒙伝）。", "yomi": "びほう", "name": "麋芳（びほう：字は子方、東海朐県の人、麋竺の弟、劉備配下の南郡太守として江陵を守るも関羽の処罰を恐れて孫権に降伏）", "role": "劉備配下の南郡太守→呉の将軍"}, "顔良": {"wiki_title": "顔良", "ai_desc": "後漢末の袁紹配下の猛将（?〜200年）。文醜とともに袁紹軍の武勇の双璧として知られ、孔融は「顔良・文醜の勇は三軍に冠たり」と挙げ、荀彧は「匹夫の勇であり、一戦して生け捕りにできる」と評した。建安5年（200年）2月、郭図・淳于瓊とともに東郡太守・劉延を白馬に包囲したが、4月に荀攸の献策による曹操の延津陽動で袁紹が兵力を西へ割いた隙に白馬への強行軍を受け、先陣として突撃した張遼・関羽に撃破され、陣中で関羽に斬首された（『三國志』巻1・武帝紀、巻6・袁紹伝、巻10・荀彧伝、巻17・張遼伝、巻36・関羽伝）。", "yomi": "がんりょう", "name": "顔良（がんりょう：文醜と並び称された袁紹軍随一の猛将、白馬を包囲するも曹操の奇襲を受け関羽に斬られる）", "role": "後漢末の袁紹配下の部将"}, "劉禅": {"wiki_title": "劉禅", "ai_desc": "蜀漢の第2代皇帝・後主（207年〜271年、在位223年〜263年）、字は公嗣、幼名は阿斗。劉備の長男で母は甘夫人。建安13年（208年）の当陽長阪の敗走時には趙雲に抱かれて難を免れ、建安17年（212年）頃に孫夫人が呉へ連れ帰ろうとした際も趙雲と張飛により奪還された。章武3年（223年）に成都で即位し、前半は丞相・諸葛亮、後半は蔣琬・費禕らに国政を委ねて41年間在位したが、炎興元年（263年）に魏の鄧艾が成都へ迫ると降伏し、洛陽へ移って安楽県公に封じられた（『三國志』巻33・後主伝、巻36・趙雲伝）。", "yomi": "りゅうぜん", "name": "劉禅・後主（りゅうぜん／こうしゅ：字は公嗣、劉備と甘夫人の子、蜀漢の第2代皇帝）", "role": "蜀漢の第2代皇帝（後主）・安楽公"}, "劉備": {"wiki_title": "劉備", "ai_desc": "幽州涿郡涿県の人（161年〜223年）。前漢の中山靖王・劉勝の末裔。黄巾の乱で義勇兵を率いて従軍した後、同窓の公孫瓚のもとに身を寄せ、別部司馬として青州刺史・田楷とともに袁紹を防いだ功績により高唐尉・高唐令、ついで平原令・平原相に任じられた。その後、曹操の徐州侵攻に際して陶謙の救援に赴き、陶謙の没後に徐州を領して曹操・呂布・袁術らと中原の覇権を争い、のち荊州・益州を収めて蜀漢を建国した（『三國志』巻32・先主伝）。", "yomi": "りゅうび", "name": "劉備（りゅうび：字は玄徳、涿郡涿県出身の漢室宗親・のち蜀漢の初代皇帝〔昭烈帝〕）", "role": "後漢末の群雄・のち蜀漢の初代皇帝・昭烈帝（幽州涿郡涿県の人、中山靖王劉勝の末裔）"}, "侯選": {"name": "侯選（こうせん：河東郡出身の関中十部将の一人、潼関で曹操と戦い、のち漢中平定時に降伏して振威将軍となる）", "yomi": "こうせん", "wiki_title": "侯選", "role": "後漢末の関中諸将（十部）の一人・のち曹操配下の振威将軍（司隷河東郡の人）", "ai_desc": "司隷河東郡の人（生没年不詳）。後漢末に関中で独自の部曲を率いた有力諸将の一人。建安16年（211年）、馬超・韓遂・程銀・李堪ら十部（兵十万）と連合して潼関に拠り曹操と戦ったが敗れ、漢中の張魯のもとへ逃れた。建安20年（215年）に曹操が漢中を平定した際に程銀・龐徳らとともに曹操へ降伏し、従来の官爵を回復されて振威将軍に任じられた（『三國志』巻1・武帝紀、巻15・張既伝注引『魏略』、巻36・馬超伝注引『典略』）。"}, "曹操": {"wiki_title": "曹操", "ai_desc": "沛国譙県の人（155年〜220年）。前漢の相国・曹参の末裔とされ、中常侍・大長秋・費亭侯となった曹騰の養子・曹嵩（太尉）の子として生まれた。後漢末の動乱期に兗州を拠点として献帝を許に迎え、官渡の戦いで袁紹を破って華北を統一、丞相・魏公・魏王に昇り、没後に子の曹丕（文帝）が魏を建国すると「太祖武皇帝」と追尊された。", "yomi": "そうそう", "name": "曹操（そうそう：字は孟徳、幼名は阿瞞・吉利、太祖武皇帝）", "role": "魏の基礎を築いた覇王（太祖武皇帝）・後漢の丞相・魏王"}, "韋端": {"name": "韋端（いたん：字は休甫、京兆杜陵出身の涼州牧・太僕、鍾繇と協力して馬騰・韓遂を和解させた名門重臣）", "yomi": "いたん", "wiki_title": "韋端", "role": "後漢末の涼州牧・太僕（司隷京兆尹杜陵県の人、韋康・韋誕の父）", "ai_desc": "司隷京兆尹杜陵県の人（生没年不詳）、字は休甫。京兆の名門・韋氏の出身で、涼州刺史・韋康および能書家として名高い韋誕（字は仲将）の父。建安初年、涼州牧として在任中、関中を鎮撫していた司隷校尉・鍾繇と協力して、仇敵として争い続けていた馬騰と韓遂を和解させて朝廷に帰順させた。のちに中央へ召されて九卿の太僕に昇り、子の韋康が後任の涼州刺史となった（『三國志』巻10・荀彧伝注引『三輔決録注』、巻36・馬超伝注引『典略』）。"}, "張遼": {"wiki_title": "張遼", "ai_desc": "并州雁門郡馬邑県の人（169年〜222年）、字は文遠。前漢の馬邑の豪族・聶壱の末裔で、怨讐を避けて張氏に改姓した。丁原・何進・董卓を経て呂布に仕え、騎都尉・魯相となった。建安3年（198年）冬に下邳で呂布が敗死すると部衆を率いて曹操に帰順し、中郎将・関内侯に拝された。建安5年（200年）4月の白馬の戦いでは仮の裨将軍として関羽とともに先陣を務め、顔良の軍を撃破した。その後も昌狶の説得降伏、袁譚・袁尚討伐、白狼山での烏丸単于・蹋頓斬殺、天柱山の陳蘭討伐で武功を重ね、建安20年（215年）の合肥の戦いでは八百の決死隊で孫権の十万の大軍に突撃して江東を震撼させ、前将軍・晋陽侯に昇った（『三國志』巻17・張遼伝）。", "yomi": "ちょうりょう", "name": "張遼（ちょうりょう：字は文遠、雁門郡馬邑県出身の曹魏の前将軍・晋陽剛侯、白馬先陣から合肥の死闘まで活躍した五将軍筆頭）", "role": "後漢末〜三国魏の中郎将・盪寇将軍・前将軍・晋陽剛侯（并州雁門郡馬邑県の人）"}, "馬超": {"wiki_title": "馬超", "ai_desc": "司隸右扶風茂陵県の人（176年〜222年）。伏波将軍・馬援の後裔で、衛尉・馬騰の長男。司隷校尉・鍾繇のもとで郭援・高幹を平陽に破って偏将軍・都亭侯となり、父・馬騰の入朝後にその部曲を引き継いだ。建安16年（211年）3月、鍾繇の漢中張魯討伐を自分たちへの襲撃と疑い、韓遂・楊秋・李堪・成宜ら関中十部の諸将と結んで挙兵し、潼関・渭南で曹操と交戦したが、同年9月に賈詡の離間策と虎騎の挟撃に敗れて涼州へ逃れた。その後、隴上で再起を図ったのち張魯を経て劉備に帰順し、蜀漢の左将軍・驃騎将軍・涼州牧・斄郷侯となった（『三國志』巻36・馬超伝）。", "yomi": "ばちょう", "name": "馬超（ばちょう：字は孟起、関中諸将を率いて潼関・渭南で曹操と戦った将軍）", "role": "右扶風茂陵出身の将軍・偏将軍・都亭侯、のち蜀漢の驃騎将軍・斄郷威侯"}, "李堪": {"wiki_title": "李堪", "ai_desc": "司隸河東郡の人。後漢末に関中で部曲を擁した諸将の一人であり、建安3年（198年）頃には鍾繇・張既の説得に応じて馬騰・韓遂らとともに朝廷へ帰順していた（『三國志』巻15・張既伝注引『魏略』）。建安16年（211年）、馬超・韓遂・楊秋・成宜らとともに反乱を起こして潼関・渭南で曹操軍と戦ったが、同年9月の会戦で敗れて斬られた（『三國志』巻1・武帝紀、巻8・張魯伝注引『魏略』）。", "yomi": "りかん", "name": "李堪（りかん：河東出身の関中諸将の一人、渭南の戦いで戦死）", "role": "関中諸将の一人"}, "黄忠": {"name": "黄忠（こうちゅう：字は漢升、南陽出身の蜀漢の後将軍・関内侯・剛侯、定軍山の戦いで夏侯淵を斬り関羽らと位を並べる）", "yomi": "こうちゅう", "wiki_title": "黄忠", "role": "後漢末〜蜀漢の後将軍・関内侯（荊州南陽郡の人、諡は剛侯）", "ai_desc": "荊州南陽郡の人（?〜220年）、字は漢升。初め荊州牧・劉表から中郎将に任じられて劉磐とともに長沙郡攸県を守り、曹操の荊州平定後は仮の裨将軍として長沙太守・韓玄に属した。劉備の荊州南部平定に伴い帰順して入蜀に従軍し、葭萌から反転して劉璋を攻めた戦いでは常に先陣を切って三軍に冠たる勇名を馳せ、益州平定後に討虜将軍に拝された。建安24年（219年）、漢中の定軍山で夏侯淵の精鋭軍を撃破して一戦のうちに夏侯淵を斬り、征西将軍、ついで漢中王・劉備のもとで関羽・馬超・張飛と同列の後将軍に抜擢され関内侯を賜った。翌建安25年（220年）に没し、景耀3年（260年）に剛侯と追諡された（『三國志』巻36・黄忠伝）。"}, "孫夫人": {"wiki_title": "孫夫人", "ai_desc": "孫堅の娘で孫権の妹。建安14年（209年）頃、荊州牧となった劉備に政略結婚で嫁いだが、才気煥発で気性が剛猛であり、兄・孫権の威勢を背景に百余人の侍婢に刀を帯びさせて立たせ、多くの呉の官兵を率いて驕慢不法に振る舞ったため、劉備も内心警戒し、趙雲に内事を掌らせて規律を正させた。建安16〜17年（211〜212年）頃、劉備の益州入りを聞いた孫権が船団を遣わして妹を迎えると、幼い劉禅を連れて呉へ帰ろうとしたが、趙雲と張飛が兵を率いて長江を遮断したため、劉禅を残して単身で呉へ帰国した（『三國志』巻36・趙雲伝注引『雲別伝』、巻37・法正伝）。", "yomi": "そんふじん", "name": "孫夫人（そんふじん：孫権の妹、劉備に嫁ぎ、入蜀時に後主・劉禅を呉へ連れ帰ろうとした女性）", "role": "劉備の夫人（孫堅の娘・孫権の妹）"}, "鄧芝": {"wiki_title": "鄧芝", "ai_desc": "蜀漢の重臣・将軍（？〜251年）、字は伯苗、義陽郡新野の人。後漢の司徒・鄧禹の末裔。劉備の死後に使者として呉へ赴き孫権との同盟を修復し、建興6年（228年）には中監軍・揚武将軍として趙雲とともに箕谷で曹真軍を防ぎ、のち前軍師・前将軍・車騎将軍・陽武亭侯に至った（『三國志』巻45・鄧芝伝、巻36・趙雲伝）。", "yomi": "とうし", "name": "鄧芝（とうし：字は伯苗、呉との同盟修復を担い、趙雲とともに箕谷に出陣した蜀漢の重臣）", "role": "蜀漢の中監軍・のち車騎将軍・陽武亭侯"}, "張飛": {"wiki_title": "張飛", "ai_desc": "幽州涿郡の人（?〜221年）、字は益徳（『三國志』巻36・張飛伝）。若き日より関羽とともに劉備に兄事して各地を転戦し、長坂の戦いでは二十騎で殿軍を務め橋を断って曹操の追撃軍を睨み止め、益州平定戦・巴西宕渠の戦い（張郃撃破）でも大功を立てて「万人の敵」「熊虎の将」と恐れられた。建安22年（217年）冬、劉備の漢中侵攻に先立って馬超・呉蘭・雷銅らとともに北の涼州武都郡・下弁へ進出して曹操軍の背後を牽制したが、建安23年（218年）春に曹洪・曹休らに呉蘭が撃破されると馬超とともに漢中へ退いた。のち章武元年（221年）、関羽の仇を討つ東征出陣の直前に部下の張達・範強に暗殺された。", "yomi": "ちょうひ", "name": "張飛（ちょうひ：字は益徳、涿郡出身の劉備創業の猛将、関羽と並び「万人敵」と称され下弁・巴西方面に出陣）", "role": "劉備配下の宿将（征虜将軍・巴西太守・新亭侯→蜀漢の車騎将軍・司隷校尉・西郷侯）"}, "劉表": {"wiki_title": "劉表", "ai_desc": "兗州山陽郡高平県の人（142年〜208年）。前漢の魯恭王・劉余の末裔で、党人「八俊」の一人に数えられた名士。初平元年（190年）に荊州刺史として単騎で宜城に入り、蒯越・蒯良・蔡瑁ら現地豪族の協力を得て宗賊を平定し、襄陽を州治として長江・漢水流域の荊州を掌握した。袁紹と同盟を結んで南陽にいた袁術と敵対し、初平3年（192年）に孫堅を敗死させ、翌初平4年（193年）春には袁術の糧道を遮断して袁術を陳留方面へ追い出した（『三國志』巻6・劉表伝、『後漢書』巻74下・劉表伝）。", "yomi": "りゅうひょう", "name": "劉表（りゅうひょう：字は景升、山陽郡高平県出身の漢室宗親・荊州牧・鎮南将軍・成武侯、「八俊」の一人）", "role": "後漢末の荊州刺史・荊州牧・鎮南将軍・成武侯（兗州山陽郡高平県の人、魯恭王劉余の末裔）"}, "甘夫人": {"wiki_title": "甘皇后", "ai_desc": "劉備の側室で後主・劉禅の生母（？〜209年頃）、沛国の人。劉備が豫州小沛にいた頃に側室として納められ、劉備がたびたび正室を喪ったため奥向きの家政を総括した。建安13年（208年）、当陽長阪で曹操軍の急追を受けた際には趙雲の保護によって劉禅とともに難を免れた。その後まもなく荊州で死去して南郡に葬られ、章武2年（222年）に皇思夫人と追諡されて蜀へ改葬、さらに劉禅の即位後に昭烈皇后と追尊されて恵陵に合葬された（『三國志』巻34・甘皇后伝、巻36・趙雲伝）。", "yomi": "かんふじん", "name": "甘夫人（かんふじん：沛の人、劉備の側室で後主・劉禅の生母、のちの昭烈皇后）", "role": "劉備の夫人・後主劉禅の生母（昭烈皇后）"}, "召虎": {"wiki_title": "召穆公", "ai_desc": "西周後期の宣王に仕えた大臣・名将である召穆公（しょうぼくこう、名は虎）。南方の淮夷を平定して周王室の威信を回復し（『詩経』大雅・江漢、『史記』巻4・周本紀）、同時代の方叔と並べて「方・邵（方召）」とも称され、王朝を支えて江淮・南方の外敵を打ち破った名将の代名詞として引用される。", "yomi": "しょうこ", "name": "召虎（しょうこ）"}, "夏侯淵": {"wiki_title": "夏侯淵", "ai_desc": "沛国譙県の人（?〜219年）。夏侯惇の族弟。曹操の挙兵以来、別部司馬・騎都尉・陳留太守・潁川太守・督軍校尉を歴任し、急襲・機動戦に長じて軍中で「典軍校尉の夏侯淵は三日で五百里、六日で一千里を駆ける」と語られた。建安16年（211年）には行征西護軍として徐晃とともに太原大陵の商曜を討滅し、潼関・渭南の戦いに従軍したのち、同年12月に長安へ留屯して安定の梁興や隴右の韓遂・宋建らを平定し、征西将軍に昇った。のち建安24年（219年）、漢中の定軍山で劉備軍と戦って戦死し、愍侯と諡された（『三國志』巻9・夏侯淵伝）。", "yomi": "かこうえん", "name": "夏侯淵（かこうえん：字は妙才、西方戦線を統括した曹操軍の重鎮・征西将軍）", "role": "曹操旗揚げ以来の宿将・征西将軍・博昌愍侯"}, "趙衢": {"wiki_title": "趙衢", "ai_desc": "涼州南安郡の人。建安18年（213年）に馬超が冀城を陥落させて涼州刺史・韋康を殺害したのち、馬超の信任を得てその側近に食い込みつつ、楊阜・姜叙・梁寛・龐恭・尹奉らと密かに馬超打倒を謀った。撫夷将軍・姜叙が歴城（鹵城）で挙兵すると、趙衢は馬超に自ら出撃するよう勧めて冀城から誘い出し、その隙に梁寛らとともに冀城の門を閉ざして馬超の妻子を斬首・梟首し、建安19年（214年）正月に馬超を漢中の張魯のもとへ放逐した。功により討夷将軍や射声校尉に拝され列侯に封じられた（『三國志』巻1・武帝紀、巻18・閻温伝注引『魏略』、巻25・楊阜伝および注引『魏書』）。", "yomi": "ちょうく", "name": "趙衢（ちょうく：南安郡の人、楊阜・姜叙・尹奉らと計略を結んで馬超を漢陽から放逐した武将）", "role": "涼州南安郡出身の武将・のち射声校尉"}, "王国": {"name": "王国（おうこく：涼州漢陽郡出身の反乱指導者、韓遂・馬騰らに推戴されて合衆将軍を称し三輔へ侵攻）", "yomi": "おうこく", "wiki_title": "王国 (後漢)", "role": "後漢霊帝末期の涼州反乱軍盟主・自称合衆将軍（涼州漢陽郡の人）", "ai_desc": "涼州漢陽郡の人（?〜189年）。中平4年（187年）、涼州刺史・耿鄙の失政に対して氐・羌とともに反乱を起こして耿鄙を殺害し、韓遂・馬騰らに推戴されて「合衆将軍」を号した。翌中平5年（188年）には十余万の大軍で三輔に侵攻して陳倉を包囲したが、左将軍・皇甫嵩と前将軍・董卓の救援軍に阻まれて翌春に大敗し、敗戦の責を問われた韓遂・馬騰らに廃位された（『後漢書』巻71・皇甫嵩伝、巻72・董卓伝、『三國志』巻36・馬超伝注引『典略』）。"}, "関統": {"wiki_title": "関統", "ai_desc": "関興の嫡男で、関羽の孫。早世した父・関興の後を継いで漢寿亭侯となり、蜀漢の公主（後主・劉禅の皇女）を妻に迎え（尚公主）、官は近衛武官の虎賁中郎将に至ったが、子を残さずに没した（『三國志』巻36・関羽伝）。", "yomi": "かんとう", "name": "関統（かんとう：関興の子・関羽の孫、蜀漢の公主を娶り虎賁中郎将・漢寿亭侯に至る）", "role": "蜀漢の虎賁中郎将・漢寿亭侯（関興の子・関羽の孫）"}, "張郃": {"wiki_title": "張郃", "ai_desc": "冀州河間郡鄚県の人（?〜231年）、字は儁乂。黄巾の乱に際して韓馥に属し、韓馥の敗後は袁紹に仕えて公孫瓚討滅に功を立て寧国中郎将となった。建安5年（200年）10月の官渡の戦いでは、烏巣を急襲された袁紹に対し「まず淳于瓊を救援すべきだ」と進言したが郭図に阻まれ、高覧とともに曹洪の本営攻撃へ差し向けられた。しかし烏巣陥落の報が届き、さらに郭図が失敗の罪を張郃らに転嫁しようとしたため曹洪の陣へ投降し、曹操から「韓信が漢に帰したようなものだ」と大いに歓迎されて偏将軍・都亭侯に拝された（『三國志』巻1・武帝紀、巻17・張郃伝）。のち夏侯淵・曹真を輔佐して関中・街亭・陳倉などで蜀軍を幾度も破り、魏の五将軍の一人に数えられた。", "yomi": "ちょうこう", "name": "張郃（ちょうこう：字は儁乂、河間郡鄚県出身の名将、官渡の戦いで曹操に帰順しのち魏の征西車騎将軍・鄚壮侯）", "role": "後漢末〜三国魏の偏将軍・平狄将軍・左将軍・征西車騎将軍・鄚壮侯（冀州河間郡鄚県の人）"}, "張遵": {"wiki_title": "張遵", "ai_desc": "蜀漢の官僚・武将（？〜263年）。張飛の孫で、早世した長男・張苞の子。蜀漢で尚書を務め、炎興元年（263年）、陰平の間道から侵攻した魏の鄧艾を諸葛瞻に従って綿竹で迎え撃ち、奮戦して戦死した（『三國志』巻36・張飛伝、巻35・諸葛亮伝附諸葛瞻伝）。", "yomi": "ちょうじゅん", "name": "張遵（ちょうじゅん：張飛の孫・張苞の子、尚書として諸葛瞻に従い綿竹で鄧艾軍と戦い戦死）", "role": "蜀漢の尚書（張飛の孫・張苞の子）"}, "士仁": {"wiki_title": "士仁", "ai_desc": "幽州広陽郡の人、字は君義（『呉書』や楊戯『季漢輔臣賛』等では「傅士仁」とも記される）。劉備配下の将軍として荊州南郡の要衝・公安に駐屯していたが、南郡太守・麋芳とともに日頃から関羽の傲慢な態度に反感を抱いていた。建安24年（219年）の樊城出兵に際して軍資の補給が不十分であったことから関羽の処罰を恐れ、孫権の密かな誘いと虞翻の説得に応じて公安を挙げて呉へ降伏した（『三國志』巻36・関羽伝、巻45・楊戯伝、巻54・呂蒙伝）。", "yomi": "しじん", "name": "士仁・傅士仁（しじん：字は君義、広陽郡出身の劉備配下の将軍、公安に駐屯するも関羽との不和から麋芳とともに孫権へ降伏）", "role": "劉備配下の将軍（公安駐屯）"}, "馬秋": {"name": "馬秋（ばしゅう：馬超と庶妻・董氏の子、漢中に残され張魯降伏後に張魯自身の手で殺害される）", "yomi": "ばしゅう", "wiki_title": "馬秋", "role": "馬超の子（母は庶妻・董氏）", "ai_desc": "馬超と側室・董氏の間に生まれた子（?〜215年）。建安19年（214年）、父・馬超が武都を経て蜀へ出奔した際に母とともに漢中の張魯のもとに残された。翌建安20年（215年）に張魯が曹操へ降伏した際、曹操から身柄を張魯に引き渡され、馬超を恨んでいた張魯自らの手で殺害された（『三國志』巻36・馬超伝注引『典略』）。"}, "鍾繇": {"wiki_title": "鍾繇", "ai_desc": "豫州潁川郡長社県の人（151年〜230年）、字は元常。清流派の名士・鍾皓の曽孫で、鍾会の父。献帝の長安脱出を支援した功により御史中丞・侍中・尚書僕射を歴任した。官渡の戦いを控えた建安4年（199年）末頃、後方の関中諸将（馬騰・韓遂ら）の動向を憂慮した曹操により、荀彧の推挙を受けて侍中・守司隷校尉・持節として関中・司隸方面の全権を委ねられた。長安に到着するや書簡を送って馬騰・韓遂らを説得し朝廷へ帰順させ、建安5年（200年）の官渡対陣中には軍馬二千余匹を調達して曹操の本軍へ送り届け、曹操から「昔、蕭何は関中を鎮守して漢業を成したが、君の勲功はそれに勝る」と絶賛された。魏王朝では廷尉・太尉・太傅を歴任し、また楷書（正書）の祖として書道史にも不滅の名を残した（『三國志』巻13・鍾繇伝）。", "yomi": "しょうよう", "name": "鍾繇（しょうよう：字は元常、潁川郡長社県出身の司隷校尉・のち魏の太傅・定陵成侯、関中を鎮撫し官渡へ軍馬二千余匹を送る）", "role": "後漢末〜三国魏の侍中・司隷校尉・前軍師・相国・廷尉・太尉・太傅・定陵成侯（豫州潁川郡長社県の人、鍾会の父）"}, "楊白": {"name": "楊白・楊柏（ようはく：漢中の張魯配下の部将、馬超の才能を妬み害そうとして馬超の蜀出奔を招く）", "yomi": "ようはく", "wiki_title": "", "role": "後漢末の漢中・張魯配下の部将（他巻では「楊柏」とも表記）", "ai_desc": "後漢末、漢中に割拠した張魯配下の部将（『資治通鑑』等では「楊柏」とも記される）。魚豢『典略』によれば、漢中へ身を寄せた馬超が張魯から兵を借りて涼州奪還を図ったものの戦果を挙げられなかった際、同僚らとともに馬超の武才を忌み嫌って陥れようとしたため、身の危険を感じた馬超は建安19年（214年）に武都の氐族の地を経て成都包囲中の劉備のもとへ出奔した（『三國志』巻36・馬超伝注引『典略』）。"}, "潘璋": {"wiki_title": "潘璋", "ai_desc": "兗州東郡発干県の人（?〜234年）、字は文珪。豪胆猛鋭な気性で若き日の孫権に抜擢され、山越討伐や合肥・濡須の戦いで戦功を重ねて偏将軍となった。建安24年（219年）冬の荊州攻略戦では孫権の命を受けて関羽の退路を遮断するため臨沮（夾石）へ急行し、配下の司馬・馬忠が関羽および子の関平・都督の趙累らを捕らえて即座に斬首した。この大功により固陵太守・振威将軍・溧陽侯に拝され、のち右将軍に進んだ（『三國志』巻55・潘璋伝、巻36・関羽伝裴松之注引『呉書』）。", "yomi": "はんしょう", "name": "潘璋（はんしょう：字は文珪、東郡発干出身の呉の振威将軍・右将軍・溧陽侯、臨沮で関羽父子の退路を断ち討ち取る）", "role": "三国呉の偏将軍・固陵太守・振威将軍・右将軍・溧陽侯"}, "桓帝": {"wiki_title": "桓帝", "ai_desc": "章帝の曽孫・蠡吾侯劉翼の子（132年〜167年）。質帝が梁冀に毒殺された後、曹騰らの進言もあって15歳で即位した。曹騰が先帝以来の旧臣として忠孝顕著であったことから、曹騰を費亭侯に封じ、特進の位を加えた。", "yomi": "かんてい", "name": "桓帝（かんてい：後漢の第11代皇帝・劉志）", "role": "後漢の第11代皇帝（在位146年〜167年）"}, "孫権": {"wiki_title": "孫権", "ai_desc": "揚州呉郡富春県の人（182年〜252年）、字は仲謀。破虜将軍・孫堅の次男で、討逆将軍・孫策の弟。建安5年（200年）に兄・孫策が刺客に襲われて急逝すると、わずか19歳で江東六郡の統治を引き継ぎ、張昭・周瑜・魯粛ら文武の英才を任用し、曹操の上表によって討虜将軍・領会稽太守となった。建安13年（208年）秋に曹操が荊州を制圧して江陵から長江を下ってくると、魯粛・周瑜および劉備の使者・諸葛亮の主戦論を容れて劉備と同盟を結び、周瑜・程普に精兵三万を授けて赤壁（烏林）で曹操の大軍を撃退させ、自らも別軍を率いて淮南の要衝・合肥を包囲した（張憙の救援接近を聞いて撤退）。のち荊州・交州を併せて黄龍元年（229年）に皇帝に即位し、三国呉を建国した（『三國志』巻1・武帝紀、巻47・呉主伝）。", "yomi": "そんけん", "name": "孫権（そんけん：字は仲謀、呉郡富春県出身の江東の覇主・のち呉の初代皇帝〔大帝〕、劉備と同盟して赤壁で曹操を阻み合肥を攻める）", "role": "後漢末の討虜将軍・会稽太守・車騎将軍・呉王・のち三国呉の初代皇帝・大帝（揚州呉郡富春県の人、孫堅の次男・孫策の弟）"}, "張紹": {"wiki_title": "張紹", "ai_desc": "蜀漢の車騎将軍・張飛の次男。兄の張苞が早世したため父・張飛の西郷侯の爵位を継承し、蜀漢で侍中・尚書僕射の高位に至った。炎興元年（263年）の蜀漢滅亡時には後主・劉禅の命により譙周・鄧良とともに鄧艾のもとへ降伏の印綬を奉持した（『三國志』巻36・張飛伝、巻33・後主伝）。", "yomi": "ちょうしょう", "name": "張紹（ちょうしょう：張飛の次男、父の爵位を継ぎ侍中・尚書僕射に至る）", "role": "蜀漢の侍中・尚書僕射・西郷侯（張飛の次男）"}, "関興": {"wiki_title": "関興", "ai_desc": "関羽の次男、字は安国。父・関羽と兄・関平が臨沮で敗死したのち、漢寿亭侯の爵位を継いだ。少年の頃より名声（令問）があり、蜀漢の丞相・諸葛亮からその器量を深く重んじられて特別に目をかけられ、弱冠（数え二十歳）にして侍中・中監軍の要職に抜擢されたが、数年後に若くして病没した（『三國志』巻36・関羽伝）。", "yomi": "かんこう", "name": "関興（かんこう：字は安国、関羽の子・漢寿亭侯、諸葛亮に器量を愛され弱冠で侍中・中監軍に昇るも早世）", "role": "蜀漢の侍中・中監軍・漢寿亭侯（関羽の子）"}, "袁紹": {"wiki_title": "袁紹", "ai_desc": "豫州汝南郡汝陽県の人（?〜202年）。四代にわたり三公を輩出した名門・汝南袁氏の出身で、若き日の曹操の盟友であり最大の宿敵。西園八校尉の中軍校尉・司隷校尉となり、大将軍・何進に宦官の皆殺しと董卓ら地方軍閥の召還を進言した。何進が暗殺されると宮中に突入して宦官二千余人を族滅したが、入京した董卓と対立して冀州へ奔り、反董卓連合軍の盟主となった。のち韓馥から冀州を譲り受け、公孫瓚を滅ぼして冀・青・幽・并の四州を制覇したが、建安5年（200年）の官渡の戦いと翌建安6年の倉亭の戦いで曹操に連敗し、建安7年（202年）5月に発病して血を吐き没した（『三國志』巻6・袁紹伝）。", "yomi": "えんしょう", "name": "袁紹（えんしょう：字は本初、四世三公の名門・のち冀州牧・大将軍として河北に覇を唱える）", "role": "後漢末の群雄・司隷校尉・冀州牧・大将軍・鄴侯（豫州汝南郡汝陽県の人）"}, "張魯": {"wiki_title": "張魯", "ai_desc": "沛国豊県の人。五斗米道（天師道）を創始した祖父・張陵、父・張衡の教団を継ぎ、初平2年（191年）頃に益州牧・劉焉の命で漢中へ入って太守・蘇固を討ち、以後約三十年にわたり「師君」と称して祭酒・鬼卒による教団統治と義舎（無償の米・肉を置く宿舎）を設ける政権を漢中に築いた。建安16年（211年）3月、曹操が鍾繇を派遣して張魯討伐を図ったことが関中諸将（馬超・韓遂ら）の疑心と蜂起の端緒となった。のち建安20年（215年）に曹操の漢中親征を受けて降伏し、鎮南将軍・閬中侯（一万戸）として処遇された（『三國志』巻8・張魯伝）。", "yomi": "ちょうろ", "name": "張魯（ちょうろ：字は公祺、五斗米道の教主として漢中に約三十年間割拠した群雄）", "role": "漢中の群雄・五斗米道第3代教主（師君）・のち鎮南将軍・閬中侯"}, "成宜": {"wiki_title": "成宜", "ai_desc": "関中に割拠した諸将（『典略』にいう関中十部）の一人。建安16年（211年）、馬超・韓遂・楊秋・李堪らと連合して潼関に布陣し曹操軍と対峙したが、同年9月、曹操が離間策ののちに仕掛けた渭南の会戦において虎騎の挟撃を受けて大敗し、李堪らとともに斬られた（『三國志』巻1・武帝紀、巻36・馬超伝注引『典略』）。", "yomi": "せいぎ", "name": "成宜（せいぎ：馬超・韓遂とともに挙兵し渭南の戦いで斬られた関中諸将の一人）", "role": "関中諸将の一人"}, "程昱": {"wiki_title": "程昱", "ai_desc": "兗州東郡東阿県の人（141年〜220年）。初名は程立（若い頃に泰山で日輪を捧げ持つ夢を見たことを聞いた曹操が「日」を上に加えて「程昱」と改名させた）。身長八尺三寸、立派な髭を蓄えた豪胆・剛毅な人物で、青州黄巾の乱に際して東阿県を守り抜き、曹操が兗州牧となると寿張県令に招かれた。興平元年（194年）夏、曹操の徐州遠征中に張邈・陳宮・呂布が反乱を起こすと、荀彧とともに鄄城を守り、自ら故郷の范県・東阿県を説得して離反を食い止め、この三城を曹操の帰還まで守り抜いた。また苦境に陥った曹操が袁紹に家族を人質として送ろうとした際には「将軍は覇王の業を立てるお方であるのに、なぜ袁紹の下風に立つのか」と強く諫止した（『三國志』巻14・程昱伝）。", "yomi": "ていいく", "name": "程昱（ていいく：字は仲徳、東郡東阿県出身の衛尉・安郷侯、荀彧とともに兗州の三城を死守した剛毅な謀臣）", "role": "後漢末〜三国魏の東中郎将・振威将軍・衛尉・安郷粛侯（兗州東郡東阿県の人）"}, "劉磐": {"name": "劉磐（りゅうばん：荊州牧・劉表の従子、驍勇で知られ中郎将・黄忠とともに長沙郡攸県を守備して孫権軍と対峙）", "yomi": "りゅうばん", "wiki_title": "劉磐", "role": "後漢末の武将（荊州牧・劉表の従子）", "ai_desc": "後漢末の武将（生没年不詳）。荊州牧・劉表の従子（甥）。驍勇果敢な武将として知られ、劉表の命により中郎将・黄忠とともに揚州（江東）との境に近い長沙郡攸県を守備し、たびたび艾・西安など予章郡方面へ出撃して孫策・孫権側の太史慈と攻防を繰り広げた（『三國志』巻36・黄忠伝、巻49・太史慈伝）。"}, "梁興": {"wiki_title": "梁興", "ai_desc": "関中・左馮翊方面の部曲将（?〜212年）。建安3年（198年）頃には馬騰・韓遂らとともに関中で部曲を擁し、建安16年（211年）には馬超・韓遂らの反乱に加わった。同年9月の渭南の戦いで連合軍が敗れた後も、馬超の余衆を率いて京兆尹の藍田に駐屯し、さらに左馮翊の鄜・夏陽一帯に入って諸県を威圧していたが、建安17年（212年）春から夏にかけて長安駐屯の夏侯淵（および鄭渾・張既ら）の討伐を受けて撃破され、鄜において斬首された（『三國志』巻1・武帝紀、巻9・夏侯淵伝、巻15・張既伝、巻16・鄭渾伝）。", "yomi": "りょうこう", "name": "梁興（りょうこう：関中諸将の一人、渭南敗戦後に藍田・馮翊で活動するも夏侯淵らに撃破・斬殺される）", "role": "関中・馮翊方面の部曲将"}, "王承": {"name": "王承（おうしょう：馬騰配下の部将、池陽・長平岸頭への移屯時に馬騰の陣営を襲撃）", "yomi": "おうしょう", "wiki_title": "", "role": "後漢末の馬騰配下の部将", "ai_desc": "後漢末の武将。魚豢『典略』によれば、初平年間に西州（涼州）が食糧不足に陥り、馬騰が池陽での食糧調達を求めて長平岸頭へ陣営を移した際、馬騰に害されることを恐れて無防備で近隣に出ていた馬騰の陣営を急襲し、馬騰を西方へ敗走させた（『三國志』巻36・馬超伝注引『典略』）。"}, "関羽": {"wiki_title": "関羽", "ai_desc": "司隸河東郡解県の人（?〜219年）、字は雲長（本字は長生）。亡命して涿郡に至り、劉備の郷里での挙兵以来、張飛とともに寝食を共にして侍立し、周瑜・程昱・郭嘉ら敵味方から「万人敵」「熊虎の将」と畏敬された。建安5年（200年）春正月、劉備が小沛で曹操に敗れて袁紹のもとへ奔った際、下邳を守備していた関羽は曹操に捕らえられて偏将軍として厚遇を受け、同年4月の白馬の戦いで袁紹軍の猛将・顔良を万衆の中で刺殺して恩義に報いたのち、賞賜を尽く封印して劉備のもとへ帰参した。のちに荊州を督して建安24年（219年）に前将軍・仮節鉞に進み、樊城の曹仁を包囲し漢水の暴漲に乗じて于禁の七軍を水没させ華夏を震撼させたが、背後から孫権・呂蒙に江陵を奇襲され、退却途上の南郡臨沮で子の関平とともに斬られた（『三國志』巻36・関羽伝）。", "yomi": "かんう", "name": "関羽（かんう：字は雲長、河東郡解県出身の蜀漢の前将軍・漢寿亭侯、万人敵と称えられた劉備股肱の義将）", "role": "後漢末〜劉備配下の偏将軍・襄陽太守・前将軍・仮節鉞・漢寿亭侯（司隸河東郡解県の人、諡は壮繆侯）"}, "鍾会": {"wiki_title": "鍾会", "ai_desc": "豫州潁川郡長社県の人（225年〜264年）、字は士季。曹魏の太傅・鍾繇の末子。幼少より神童と称えられ、司馬師・司馬昭の腹心参謀として毌丘倹・諸葛誕の討伐で奇策を立てて「張良（子房）」に擬せられた。司隷校尉を経て景元4年（263年）に鎮西将軍・仮節都督関中諸軍事となり、十余万の主力軍を率いて漢中を攻略し剣閣で姜維と対峙、鄧艾による成都降伏を受けて蜀漢を平定し司徒に拝された。しかし翌咸熙元年（264年）正月、姜維と結んで成都で自立の反乱を起こし、将兵の蜂起により殺害された（『三國志』巻28・鍾会伝）。", "yomi": "しょうかい", "name": "鍾会（しょうかい：字は士季、太傅・鍾繇の末子、曹魏の鎮西将軍・司徒、鄧艾とともに蜀漢を滅ぼすも成都で反乱を起こし敗死）", "role": "曹魏の黄門侍郎・司隷校尉・鎮西将軍・司徒・県侯（潁川郡長社県の人、鍾繇の子）"}, "劉延": {"wiki_title": "劉延 (東郡太守)", "ai_desc": "後漢末の曹操配下の地方長官・武将（前漢の城陽王・劉延や後漢初の阜陵王・劉延とは同姓同名の別人）。東郡太守として黄河渡河点の要衝・白馬を守備し、建安5年（200年）2月に袁紹が派遣した郭図・淳于瓊・顔良らの大軍に包囲されたが、同年4月に曹操の救援軍が到着して包囲が解かれるまで城を守り抜いた（『三國志』巻1・武帝紀、巻17・張遼伝・于禁伝）。", "yomi": "りゅうえん", "name": "劉延（りゅうえん：曹操配下の東郡太守、白馬城で顔良らの猛攻を二か月にわたり堅守し抜く）", "role": "後漢末の曹操配下の東郡太守"}, "霍去病": {"wiki_title": "霍去病", "ai_desc": "霍去病（かくきょへい）：前漢の武帝期の名将・冠軍侯（前140年〜前117年）。大将軍・衛青の甥。18歳で初めて出陣して匈奴を大破し、弱冠（20歳）で驃騎将軍となって漠北を席巻した。孫策は謝表の中で、17歳で父を亡くした自分を18歳で武功を立てた霍去病と比較して謙遜した（『呉録』）。", "yomi": "かくきょへい", "name": "霍去病（かくきょへい）"}, "閻圃": {"name": "閻圃（えんほ：巴郡安漢出身の張魯の功曹、張魯に王号自称を諫止し曹操帰順後に列侯に封じられる）", "yomi": "えんほ", "wiki_title": "閻圃", "role": "後漢末の張魯配下の功曹・のち魏の列侯（益州巴郡安漢県の人）", "ai_desc": "益州巴郡安漢県の人（生没年不詳）。漢中の張魯に功曹として仕えて深く信任され、群臣が張魯に漢寧王の即位を勧めた際には「王となればかえって災いを招く」と諫めて思いとどまらせた。建安20年（215年）に張魯が曹操に降伏すると功績を認められて列侯に封じられ、漢中に残されていた馬超の庶妻・董氏を曹操から賜った（『三國志』巻8・張魯伝、巻36・馬超伝注引『典略』）。"}, "馬岱": {"name": "馬岱（ばたい：馬超の従弟、馬超臨終の上疏で一門の祭祀継承を劉備に託され、平北将軍・陳倉侯に昇る）", "yomi": "ばたい", "wiki_title": "馬岱", "role": "蜀漢の平北将軍・陳倉侯（司隷右扶風茂陵県の人、馬超の従弟）", "ai_desc": "司隷右扶風茂陵県の人（生没年不詳）。馬超の従弟。章武2年（222年）、臨終を迎えた馬超が一族二百余口のほとんどを曹操に誅滅された中で唯一残った馬岱に馬氏の血統・祭祀（血食）を継がせるよう劉備に託した。のちに蜀漢で平北将軍・陳倉侯に昇り、建興12年（234年）の諸葛亮死後に反乱を起こした魏延を斬り、建興13年（235年）には軍を率いて北伐に出陣した（『三國志』巻33・後主伝、巻36・馬超伝、巻40・魏延伝）。"}, "范彊": {"wiki_title": "范彊", "ai_desc": "張飛配下の帳下将（諸本に「范強」とも表記）。日頃より士卒に苛烈な鞭打ちを加えていた張飛のもとで左右に仕えていたが、章武元年（221年）の対呉出陣の直前、同僚の張達とともに閬中で張飛を殺害し、その首級を携えて孫権のもとへ奔った（『三國志』巻36・張飛伝）。", "yomi": "はんきょう", "name": "范彊・范強（はんきょう：張飛の帳下将、章武元年に張達とともに張飛を殺害し呉へ逃亡）", "role": "蜀漢・張飛配下の帳下将"}, "程銀": {"name": "程銀（ていぎん：河東郡出身の関中十部将の一人、潼関敗戦後に漢中へ奔り、のち曹操に降伏して官爵を復される）", "yomi": "ていぎん", "wiki_title": "程銀", "role": "後漢末の関中諸将（十部）の一人（司隷河東郡の人）", "ai_desc": "司隷河東郡の人（生没年不詳）。建安16年（211年）、馬超・韓遂・侯選ら関中十部の諸将とともに十万の軍勢で潼関に布陣して曹操軍と戦った。敗戦後は侯選とともに漢中の張魯のもとへ亡命し、建安20年（215年）に張魯が曹操へ降伏した際にともに帰順して旧来の官爵を回復された（『三國志』巻15・張既伝注引『魏略』、巻36・馬超伝注引『典略』 ※『武帝紀』本文には戦死・逃亡の異伝もあるが『魏略』『典略』では生存・降伏とする）。"}, "呂布": {"wiki_title": "呂布", "ai_desc": "并州五原郡九原県の人（?〜198年）。弓馬の武芸と膂力に優れ「飛将」と称された。并州刺史・丁原に仕えて主簿となったが、董卓の誘いに応じて丁原を殺害し、董卓と父子の契りを結んで中郎将・都亭侯となった。しかし些細な怒りから董卓に手戟を投げつけられたことや董卓の侍女との密通が発覚することを恐れ、司徒・王允の計画に乗って初平3年（192年）4月に董卓を刺殺し、奮威将軍・温侯となった。だが6月に董卓の旧将・李傕と郭汜らに長安を攻め落とされて武関から関東へ脱出し、のちに張邈・陳宮に迎えられて兗州で曹操と死闘を繰り広げることとなる（『三國志』巻7・呂布伝）。", "yomi": "りょふ", "name": "呂布（りょふ：字は奉先、五原郡九原県出身の飛将・温侯、王允とともに董卓を討つも李傕らに敗れ関東へ奔る）", "role": "後漢末の群雄・中郎将・奮威将軍・温侯・のち徐州牧（并州五原郡九原県の人）"}, "鄧艾": {"wiki_title": "鄧艾", "ai_desc": "荊州義陽郡棘陽県の人（197年〜264年）、字は士載。貧苦と吃音のハンディキャップを乗り越えて司馬懿に見出され、淮南での大規模屯田・水利事業（「鄧艾の屯田」）を推進したのち、隴右・関中戦線で蜀の姜維の北伐を幾度も撃退して征西将軍に進んだ。景元4年（263年）秋の蜀漢征討では、鍾会が剣閣で足止めされる中、自ら精兵を率いて人跡未踏の陰平の間道七百余里を踏破し、綿竹で諸葛瞻を撃破して成都へ迫り、後主・劉禅を降伏させて蜀漢滅亡の最大殊勲を立て太尉に拝された。しかし翌年正月、鍾会の誣告により収監されたのち、田続によって綿竹西で殺害された（『三國志』巻28・鄧艾伝）。", "yomi": "とうがい", "name": "鄧艾（とうがい：字は士載、義陽棘陽出身の曹魏の征西将軍・太尉、陰平の険道を突破して蜀漢を滅ぼした名将）", "role": "曹魏の尚書郎・南安太守・兗州刺史・征西将軍・太尉・鄧侯"}, "召公奭": {"wiki_title": "召公奭", "ai_desc": "周王室と同姓（姫姓）の支族で、文王・武王・成王・康王に仕えた建国の元勲（諡は康公、『三國志』原文では「邵康公」「邵」と表記）。武王の克殷後に北方の燕に封じられ（長子を赴任させ自身は周都に留まった）、成王期には「三公」の太保となり、陝（弘農郡陝県）を境に周公旦と天下を東西に分掌する「二伯」として西方を統轄し、甘棠の樹の下で政務を聴いた善政が『詩経』召南「甘棠」に詠われた。また成王の命を奉じて斉の太公望に五侯九伯専征の命を伝えたとされる（『史記』巻34・燕召公世家、『春秋左氏伝』僖公四年）。", "yomi": "しょうこうせき", "name": "召公奭・邵康公（しょうこうせき／しょうこうこう：姓は姫、名は奭、諡は康公、周の太保・燕の始祖、周公旦と並び二伯として周室を輔佐）", "role": "西周初期の元老・太保・西伯（燕国の始祖、『三國志』原文は「邵」と表記）"}, "夏侯蘭": {"wiki_title": "夏侯蘭", "ai_desc": "常山真定の人。趙雲と同郷で幼少期からの旧知であった。曹操配下の夏侯惇に従って博望の戦いに参加した際、趙雲に生け捕られたが、趙雲が劉備に助命を請うとともに法律に明るい人物として推薦したため、軍正に任じられた。なお趙雲は私情の疑いを避けるため、彼を自らの側近くには用いなかった（『三國志』巻36・趙雲伝注引『雲別伝』）。", "yomi": "かこうらん", "name": "夏侯蘭（かこうらん：常山真定の人、博望で捕らえられ趙雲の推薦で軍正となった法務官）", "role": "劉備配下の軍正（もと夏侯惇配下・趙雲の同郷人）"}, "賈詡": {"wiki_title": "賈詡", "ai_desc": "涼州武威郡姑蔵県の人（147年〜223年）、字は文和。若くして漢陽の閻忠から「張良・陳平の奇策あり」と評された。董卓の女婿・牛輔の幕僚となり、董卓の死後に李傕・郭汜らへ長安進撃を献策したのち、段煨を経て同郷の張繡の謀主となり、宛や穣での対曹操戦で張繡を補佐した。建安4年（199年）冬、袁紹と曹操の双方から勧誘を受けた際、袁紹の使者を退けて曹操への帰順を張繡に決断させ、曹操から手を取って歓迎され執金吾・都亭侯に拝され冀州牧を領した。建安5年（200年）10月の官渡の戦いでは、来奔した許攸の烏巣奇襲策を側近が疑う中、荀攸とともに決行を強く勧めて大勝に貢献し、文帝（曹丕）の即位後に太尉へ昇った（『三國志』巻10・賈詡伝）。", "yomi": "かく", "name": "賈詡（かく：字は文和、武威郡姑蔵県出身の執金吾・のち魏の太尉・魏寿粛侯、張繡を帰順させ烏巣奇襲を後押しした謀臣）", "role": "後漢末〜三国魏の執金吾・太中大夫・太尉・魏寿粛侯（涼州武威郡姑蔵県の人）"}, "蔣済": {"wiki_title": "蒋済", "ai_desc": "揚州楚国平阿県の人（?〜249年）、字は子通。郡の計吏・揚州治中・別駕を務め、建安13年（208年）冬の孫権による合肥包囲では偽書を用いて孫権軍を撤退させた。のち曹操に召されて丹楊太守・丞相主簿西曹属となり、建安24年（219年）秋に関羽が于禁の七軍を水没させて威を華夏に震わせ、曹操が許都からの遷都を議した際には、司馬懿（宣王）とともに「関羽が志を得るのは孫権の望むところではないゆえ、江南割譲を条件に孫権を動かして関羽の背後を衝かせるべきだ」と献策して樊城の包囲を解かせた。曹魏では文帝・明帝・斉王芳の三代に仕えて護軍将軍・領軍将軍・太尉・都郷侯に至り、高平陵の変の後に病没した（『三國志』巻14・蔣済伝、巻36・関羽伝）。", "yomi": "しょうさい", "name": "蔣済・蒋済（しょうさい：字は子通、楚国平阿出身の曹操の丞相主簿西曹属、司馬懿とともに孫権に背後を襲わせる対関羽策を進言、のち魏の太尉）", "role": "後漢末〜曹魏の重臣（揚州別駕・丞相主簿西曹属→散騎常侍・中護軍・領軍将軍・太尉・都郷景侯）"}, "董承": {"wiki_title": "董承", "ai_desc": "冀州河間国の人（?〜200年）。霊帝の生母・孝仁董皇后（董太后）の甥にあたり、娘（董貴人）が献帝の後宮に入った外戚。初め董卓の女婿・牛輔の部曲将であったが、興平2年（195年）に長安を脱出した献帝を楊奉らとともに護衛して東遷し、衛将軍に任じられた。建安元年（196年）正月には袁術の将・萇奴と結んで曹洪の献帝奉迎軍を阻んだが、後に曹操の洛陽入京・許都遷都に従って車騎将軍・開府となった。建安5年（200年）正月、献帝から密かに帯の中に隠した詔（「衣帯詔」）を受けて劉備・王子服・種輯らと曹操暗殺を企てたが、事前に発覚して一族および懐妊中の董貴人ともども処刑された（『三國志』巻1・武帝紀、巻32・先主伝）。", "yomi": "とうしょう", "name": "董承（とうしょう：献帝の董貴人の父・霊帝母董太后の甥、衛将軍・車騎将軍、のち衣帯詔で曹操誅殺を謀り敗死）", "role": "後漢末の外戚・衛将軍・車騎将軍（冀州河間国の人、董太后の甥・献帝の董貴人の父）"}, "英布": {"wiki_title": "英布", "ai_desc": "秦末・楚漢戦争期の武将（?〜前196年）、六県の人。若い頃に法に触れて黥刑（顔に入れ墨を施す刑）を受けたことから「黥布（げいふ）」と通称された。驪山の徒刑から蜂起して項梁・項羽に従い、常に諸軍の先鋒となって秦軍を撃破した功により項羽から九江王に封じられた。のち漢王・劉邦に帰順して垓下の戦いで項羽を滅ぼし、前漢建国後に異姓諸侯王の一人として淮南王に封じられたが、高祖11年（前196年）に反乱を起こして敗死した（『史記』巻91・黥布列伝、『漢書』巻34・黥布伝）。諸葛亮は関羽への書簡で馬超の武勇を「黥（英布）・彭（彭越）の徒」に擬した。", "yomi": "えいふ", "name": "英布・黥布（えいふ／げいふ：秦末・楚漢戦争期の猛将、九江王ついで前漢の淮南王、彭越・韓信と並ぶ創業期の英傑）", "role": "楚漢戦争期の九江王→前漢の淮南王"}, "董氏_馬超妻": {"name": "董氏（とうし：馬超の側室〔庶妻〕、馬超入蜀時に子・馬秋と漢中に残され、のち曹操から閻圃に賜与される）", "yomi": "とうし", "wiki_title": "", "role": "馬超の庶妻（馬秋の生母、のち閻圃の妻）", "ai_desc": "馬超の側室（庶妻）。魚豢『典略』によれば、建安19年（214年）に馬超が漢中から蜀の劉備のもとへ出奔した際、子の馬秋とともに漢中の張魯のもとに取り残された。建安20年（215年）に張魯が曹操に降伏すると曹操の手に落ち、張魯の功曹・閻圃に賜与された（『三國志』巻36・馬超伝注引『典略』）。"}, "馬承": {"name": "馬承（ばしょう：馬超の嗣子、父の死後に斄郷侯の爵位を継ぐ）", "yomi": "ばしょう", "wiki_title": "馬承", "role": "蜀漢の列侯（馬超の子・嗣子）", "ai_desc": "司隷右扶風茂陵県の人（生没年不詳）。馬超の子。章武2年（222年）に父・馬超が47歳で没すると、その爵位（斄郷侯）を継いだ（『三國志』巻36・馬超伝）。"}, "諸葛瞻": {"wiki_title": "諸葛瞻", "ai_desc": "蜀漢の重臣・将軍（227年〜263年）、字は思遠。丞相・諸葛亮の子。後主・劉禅の皇女（公主）を娶り、羽林中郎将・侍中・尚書僕射・軍師将軍を経て行都護・衛将軍に進み平尚書事を兼ねた。炎興元年（263年）冬、陰平から進軍した魏の鄧艾を綿竹で迎え撃ち、子の諸葛尚や張遵・黄崇・李球らとともに戦死した（『三國志』巻35・諸葛亮伝附諸葛瞻伝）。", "yomi": "しょかつせん", "name": "諸葛瞻（しょかつせん：字は思遠、諸葛亮の子、衛将軍として綿竹で鄧艾軍を迎え撃ち戦死）", "role": "蜀漢の衛将軍・平尚書事（諸葛亮の子）"}, "霊帝": {"wiki_title": "霊帝", "ai_desc": "霊帝（れいてい）：劉宏（りゅうこう）。後漢の第12代皇帝（在位168年〜189年）。治世末期に黄巾の乱（184年）や各地の反乱が相次ぎ、中平5年（188年）に劉焉の建議を容れて主要州の刺史を「州牧」に改めた（『後漢書』巻8・霊帝紀）。", "yomi": "れいてい", "name": "霊帝（れいてい：後漢の第12代皇帝・劉宏）", "role": "後漢の第12代皇帝（在位168年〜189年）"}, "于禁": {"wiki_title": "于禁", "ai_desc": "兗州泰山郡鉅平県の人（?〜221年）、字は文則。済北相・鮑信の募兵に応じたのち曹操に帰属し、軍規の厳正さと沈着堅固な指揮によって頭角を現した。宛城の敗戦時には略奪を行った青州兵を討って夏侯惇らから称賛され、曹操から「古の名将にも勝る」と激賞されて益寿亭侯に封じられた。建安4年（199年）秋8月、袁紹との決戦を前に黄河沿岸（延津付近の河上）の守備を託され、翌年にかけて延津・原武で袁紹軍の渡河攻撃を撃退し官渡本戦でも奮戦した。のち左将軍・仮節鉞に昇ったが、建安24年（219年）の樊城救援で漢水の暴漲により関羽に降伏し、呉から帰還後に死去した（『三國志』巻17・于禁伝）。", "yomi": "うきん", "name": "于禁（うきん：字は文則、泰山郡鉅平県出身の左将軍・仮節鉞・益寿亭侯、厳正な軍律と堅守で知られた曹魏五将軍の筆頭格）", "role": "後漢末〜三国魏の平虜校尉・虎威将軍・左将軍・仮節鉞・益寿亭侯（兗州泰山郡鉅平県の人）"}, "辺章": {"wiki_title": "辺章", "ai_desc": "金城郡允吾県の人（?〜186年頃）。もとの名は辺允といい、新安県令などを務めて名声があった。中平元年（184年）の北宮伯玉・先零羌の反乱に際し、韓遂とともに反乱軍に擁立されて首領となり、中平4年（187年）にかけて涼州刺史・耿鄙や金城太守・陳懿らを殺害し、十余万の軍勢で三輔に侵攻して天下を震撼させた（『後漢書』巻72・董卓伝）。", "yomi": "へんしょう", "name": "辺章（へんしょう：もとの名は辺允、金城郡出身・韓遂とともに涼州で反乱を起こした首領）", "role": "後漢末の涼州反乱指導者・元新安県令（金城郡允吾県の人）"}, "司馬懿": {"wiki_title": "司馬懿", "ai_desc": "河内郡温県の人（179年〜251年）、字は仲達、司馬防の次男で司馬朗の弟（『晋書』巻1・宣帝紀）。建安13年（208年）に丞相となった曹操に召されて文学掾となり、魏王国の太子中庶子として曹丕を補佐したのち、文帝・明帝・斉王芳の代に大将軍・太尉・太傅を歴任し、諸葛亮の北伐阻止や遼東の公孫淵討滅に大功を立て、正始10年（249年）の高平陵の変によって曹魏政権の実権を掌握した。没後に晋王に封ぜられた次男・司馬昭によって「晋の宣王」と追尊され、孫の司馬炎（武帝）による西晋建国後に高祖宣皇帝と追尊された。", "yomi": "しばい", "name": "司馬懿・司馬宣王（しばい／しばせんおう：字は仲達、司馬防の次男、曹魏の四代に仕えた重臣・西晋の宣帝）", "role": "曹魏の丞相・太尉・太傅→追尊晋宣王・高祖宣皇帝"}, "韓遂": {"wiki_title": "韓遂", "ai_desc": "金城郡允吾県の人（?〜215年）。辺章とともに涼州の反乱軍の首領となって刺史・郡守を殺害し、十余万の兵を擁して後漢朝廷を揺るがした。その後も馬騰らと結んだり対立したりしながら約30年間にわたり涼州・関中に隠然たる勢力を保ち、建安16年（211年）には馬超と連合して潼関で曹操と戦ったが敗れ、建安20年（215年）に死去した（『三國志』巻1・武帝紀、巻15・張既伝）。", "yomi": "かんすい", "name": "韓遂（かんすい：字は文約、もとの名は韓約、金城郡出身・三十年近くにわたり涼州に割拠した群雄）", "role": "後漢末の涼州の群雄・鎮西将軍（金城郡允吾県の人）"}, "馬援": {"name": "馬援（ばえん：字は文淵、右扶風茂陵県出身の後漢の名将・伏波将軍・新息忠成侯、馬騰・馬超の先祖）", "yomi": "ばえん", "wiki_title": "馬援", "role": "後漢初期の隴西太守・伏波将軍・新息忠成侯（司隷右扶風茂陵県の人、馬騰・馬超の先祖）", "ai_desc": "司隷右扶風茂陵県の人（前14年〜後49年）、字は文淵。初め隴右の隗囂に属したのち後漢の光武帝（劉秀）に帰順し、隴西太守として先零羌を平定、さらに伏波将軍として交趾の徴姉妹の乱を鎮定し、「男児まさに死すべくんば辺野に於いてし、馬革を以て屍を裏（つつ）み還り葬らるべし（馬革裹尸）」の名言を残した功臣（『後漢書』巻24・馬援伝）。魚豢『典略』によれば馬騰・馬超父子はその末裔とされる。"}, "関平": {"wiki_title": "関平", "ai_desc": "関羽の長男（?〜219年）。父・関羽に従って荊州の軍務および建安24年（219年）の樊城攻囲戦に参陣した。同年冬、孫権軍の奇襲により江陵が陥落して関羽の本軍が離散した際、父とともに退却を図ったが、南郡臨沮において呉の潘璋の軍に退路を断たれ、関羽とともに捕らえられて斬られた（『三國志』巻36・関羽伝、巻55・潘璋伝）。", "yomi": "かんぺい", "name": "関平（かんぺい：関羽の長男、父に従って樊城攻囲戦に参陣し、退却途上の臨沮で父とともに戦死）", "role": "関羽の長男"}, "夏侯惇": {"wiki_title": "夏侯惇", "ai_desc": "沛国譙県の人（?〜220年）、前漢の夏侯嬰の末裔。『曹瞞伝』および郭頒『世語』によれば、曹操の父・曹嵩はもともと夏侯氏の子で夏侯惇の叔父にあたり、曹操と夏侯惇は従兄弟（いとこ）の関係にあったとされる。曹操の挙兵当初から常に軍の重鎮として従い、のちに大将軍に至った（『三國志』巻9・夏侯惇伝）。", "yomi": "かこうとん", "name": "夏侯惇（かこうとん：字は元譲、曹操の腹心・大将軍）", "role": "曹操旗揚げ以来の宿将・大将軍・高安郷侯（沛国譙県の人）"}, "黄叙": {"name": "黄叙（こうじょ：黄忠の子、父に先立って若くして没し黄忠の家は絶える）", "yomi": "こうじょ", "wiki_title": "黄叙", "role": "黄忠の子（早世）", "ai_desc": "荊州南陽郡の人（生没年不詳）。黄忠の子。若くして早世し、他に継嗣もなかったため、黄忠の家は跡継ぎが絶えた（『三國志』巻36・黄忠伝）。"}, "馬鉄": {"name": "馬鉄（ばてつ：馬騰の子・馬超と馬休の弟、騎都尉に拝されて一族とともに鄴へ移り、のち処刑される）", "yomi": "ばてつ", "wiki_title": "馬鉄", "role": "後漢末の騎都尉（馬騰の子、馬超・馬休の弟）", "ai_desc": "司隷右扶風茂陵県の人（?〜212年）。馬騰の子で、馬超・馬休の弟。父の馬騰が入朝して衛尉となった際、騎都尉に任じられて一族とともに鄴へ移住したが、兄・馬超の潼関挙兵に伴い、建安17年（212年）5月に父・馬騰や兄・馬休ら一族百余口とともに処刑された（『三國志』巻36・馬超伝注引『典略』）。"}, "楊阜": {"name": "楊阜（ようふ：字は義山、天水郡冀県出身の涼州別駕・将作大匠・少府、曹操に馬超への警戒を説き鹵城で挙兵して馬超を放逐）", "yomi": "ようふ", "wiki_title": "楊阜", "role": "後漢末〜三国魏の涼州治中従事・武都太守・将作大匠・少府（涼州天水郡冀県の人）", "ai_desc": "涼州天水郡冀県の人（生没年不詳）、字は義山。涼州牧・韋端および涼州刺史・韋康に仕えた。建安16年（211年）、潼関の戦い後に東帰しようとした曹操に対し、「馬超は韓信・英布の勇を持ち羌・胡の心を得ているため、厳重に備えねば隴上諸郡は国家の有ではなくなる」と予見して警告した。翌年、果たして馬超が冀城を陥落させて主君・韋康を殺害すると、建安18年（213年）に外兄の姜叙や梁寛・趙衢らと密謀し、鹵城で挙兵して一族7人を失い身も五創を負いながら馬超を漢中へ放逐した忠節の名臣（『三國志』巻25・楊阜伝、巻36・馬超伝）。"}, "張横": {"name": "張横（ちょうおう：関中十部将の一人、建安16年に馬超・韓遂らと連合して潼関・渭水に布陣）", "yomi": "ちょうおう", "wiki_title": "張横 (後漢)", "role": "後漢末の関中諸将（十部）の一人", "ai_desc": "後漢末に関中で勢力を持った部将。建安16年（211年）、馬超・韓遂・侯選・程銀・李堪・梁興・成宜・馬玩・楊秋らと十部十万の連合軍を結成し、黄河・潼関に陣を連ねて曹操の西征軍と戦ったが、河水・渭水の交わる戦場で大敗した（『三國志』巻36・馬超伝注引『典略』）。"}, "田楷": {"wiki_title": "田楷", "ai_desc": "後漢末の武将。公孫瓚に属し、初平2年（191年）頃に公孫瓚が袁紹と対立した際、青州刺史に署されて平原相の劉備とともに袁紹軍を防ぎ、劉備は戦功により田楷の下で平原相に試用された。興平元年（194年）には劉備とともに徐州牧・陶謙を救援して曹操に備えたが、のち建安4年（199年）の公孫瓚滅亡に前後して袁紹との戦いで戦死した（『三國志』巻8・公孫瓚伝、巻32・先主伝、巻36・趙雲伝）。", "yomi": "でんかい", "name": "田楷（でんかい：公孫瓚が署した青州刺史、劉備とともに袁紹を防いだ武将）", "role": "公孫瓚配下の青州刺史"}, "諸葛亮": {"wiki_title": "諸葛亮", "ai_desc": "諸葛亮（しょかつりょう）：字は孔明。蜀漢の丞相。", "yomi": "しょかつりょう", "name": "諸葛亮（しょかつりょう）"}};
  const NATURAL_FEATURES = [{"name": "⛰️ 嵩山", "lat": 34.48, "lng": 113.04, "type": "mountain"}, {"name": "⛰️ 荊山", "lat": 31.42, "lng": 111.35, "type": "mountain"}, {"name": "⛰️ 大別山脈", "lat": 31.15, "lng": 115.3, "type": "mountain"}, {"name": "⛰️ 秦嶺山脈", "lat": 33.85, "lng": 107.8, "type": "mountain"}, {"name": "⛰️ 隴山", "lat": 34.95, "lng": 106.65, "type": "mountain"}, {"name": "⛰️ 大巴山脈", "lat": 32.15, "lng": 108.6, "type": "mountain"}, {"name": "🌊 長江（大江）", "lat": 30.2, "lng": 112.9, "type": "river"}, {"name": "🌊 漢水（沔水）", "lat": 31.55, "lng": 112.35, "type": "river"}, {"name": "🌊 嘉陵江（墊江水）", "lat": 30.8, "lng": 106.15, "type": "river"}, {"name": "🌊 渭水", "lat": 34.38, "lng": 108.2, "type": "river"}, {"name": "🌊 黄河", "lat": 35.1, "lng": 113.6, "type": "river"}];

  const PUBLISHED_MAX_PARA = 17;

  const CROSS_JUMP_STORAGE_KEY = 'threekingdom_cross_vol_return_v1'; // 巻またぎジャンプ時の復帰先保存キー

  // 【方法A：自動切り替え判定】
  // 手元のPC（file:// または localhost）で開いた時、または URL に ?edit=1 を付けた時だけ制作・指摘環境を有効化。
  // github.io 等へアップロードして一般読者が開いた時は、自動的に公開モード（指摘リスト非表示＆完了段落のみ表示）になる。
  const urlParams = new URLSearchParams(window.location.search);

  const TOTAL_PARAGRAPHS = Math.max(...RECORDS.map(r => r.para_index));

  let currentActiveId = null;
  let readingHistoryStack = [];
  // 1. 共通地図コントローラ（shared_map_controller.js）による地図初期化・地名ピン制御
  function buildAuthorToastFeedbackHtml(found, clickedRawSurface) {
    if (!isEditModeActive()) return '';

  });
  const map = mapController.getMap();

  function extractDirectPlaceKeysFromRecord(rec) {
    const keys = [];
    const seen = new Set();
    if (!rec) return keys;
    const tagRegex = /\{\{place:([^|}]+)\|/g;
    [rec.raw_tagged, rec.kakikudashi_tagged, rec.translation_tagged].forEach(txt => {
      if (!txt) return;
      let m;
      while ((m = tagRegex.exec(txt)) !== null) {
        if (!seen.has(m[1])) {
          seen.add(m[1]);
          keys.push(m[1]);
        }
      }
    });
    return keys;
  }

  // 段落移動・表示モード切替時は、該当段落の地名ピン・エリア枠に入れ替えるのみ（中心移動・fitBoundsは一切行わない）
  function renderMapLayersForCurrentMode(extraPlaceKey = '') {
    const showAll = isEditModeActive() && document.getElementById('toggleShowAllParas') && document.getElementById('toggleShowAllParas').checked;
    const visRecs = getVisibleRecords();
    const paraRecs = visRecs.filter(rec => rec.para_index === currentParaIndex);
    const targetRecs = showAll ? visRecs : (paraRecs.length > 0 ? paraRecs : visRecs);
    const directKeys = [];
    if (extraPlaceKey) directKeys.push(extraPlaceKey);
    targetRecs.forEach(rec => {
      extractDirectPlaceKeysFromRecord(rec).forEach(k => directKeys.push(k));
    });
    mapController.renderPlaceKeys(directKeys);
  }

  function focusPlaceOnMap(placeKey, clickedRawSurface = '', showToast = true) {

  function getPlaceSubTypeLabel(placeKey) {
    const p = PLACES.find(item => item.key === placeKey);
    if (!p) return `地名(${placeKey})`;
    if (p.is_area) return `🗺️地名[エリア](${placeKey})`;
    if (p.is_river) return `🌊地名[河川](${placeKey})`;
    return `📍地名[地点](${placeKey})`;
  }

  function getSharedPersonInfo(personKey) {
    if (window.THREEKINGDOM_SHARED && window.THREEKINGDOM_SHARED.persons && window.THREEKINGDOM_SHARED.persons[personKey]) {
      return window.THREEKINGDOM_SHARED.persons[personKey];
    }
    return PERSONS_INFO[personKey] || null;
  }

  function getSharedOfficeInfo(officeKey) {
    if (OFFICES[officeKey]) return OFFICES[officeKey];
    if (window.THREEKINGDOM_SHARED && window.THREEKINGDOM_SHARED.offices && window.THREEKINGDOM_SHARED.offices[officeKey]) {
      return window.THREEKINGDOM_SHARED.offices[officeKey];
    }
    return null;
  }

  function getPersonDisplayName(personKey) {
    const pInfo = getSharedPersonInfo(personKey);
    if (pInfo && pInfo.display_name) return pInfo.display_name;
    return personKey;
  }

  function renderEmbeddedTags(taggedText, recId) {
    if (!taggedText) return '';
    const editHint = isEditModeActive() ? ' ／ 右クリックまたはドラッグ選択で指摘' : '';
    return taggedText.replace(/\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g, (m, tagType, key, surface) => {
      const safeKey = key.replace(/'/g, "\'");
      const safeSurface = surface.replace(/'/g, "\'");
      if (tagType === 'place') {
        const subLabel = getPlaceSubTypeLabel(key);
        return `<span class="inline-place" data-tag-type="place" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" title="${subLabel}：クリックで地図移動${editHint}">${surface}</span>`;
      } else if (tagType === 'office') {
        return `<span class="inline-office" data-tag-type="office" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" title="👑官職(${key})：クリックで全巻解説${editHint}">${surface}</span>`;

        const dispName = getPersonDisplayName(key);
        return `<span class="inline-person" data-tag-type="person" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" title="👤人名(${dispName})：クリックで全巻解説${editHint}">${surface}</span>`;
      } else if (tagType === 'special') {
        return `<span class="inline-special" data-tag-type="special" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" title="🔖特別キーワード(${key})：クリックで解説${editHint}">${surface}</span>`;

  // 7. 本文・裴注リーダー描画（「1段落＝本文＋裴注」ずつの切り替え表示）
  const recordListEl = document.getElementById('recordList');
