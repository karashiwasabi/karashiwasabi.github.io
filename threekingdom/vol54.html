なり」と。権は即ち之に従う、と。", "translation": "『漢晋春秋』にいう、呂範は劉備を引き留めておくよう勧めたが、魯粛は言った、「なりませぬ。将軍は神武にして世に抜きん出たお方とはいえ、曹公の威力はまことに重く、しかも荊州に臨んだばかりで、恩義と信望がまだ行き渡っておりませぬから、劉備に貸し与えて、これを慰撫し安定させるべきであります。曹操の敵を増やし、みずからの味方を打ち立てることこそ、最上の計略であります」と。孫権はただちにこれに従った、と。", "persons": "呂範, 劉備, 魯粛, 曹操, 孫権", "places": "荊州", "era_year": "建安15年（210）", "source_book": "『漢晋春秋』", "keywords": "漢晉春秋", "raw_tagged": "《{{special:漢晉春秋|漢晉春秋}}》曰：{{person:呂範|呂範}}勸留{{person:劉備|備}}，{{person:魯粛|肅}}曰：「不可。將軍雖神武命世，然{{person:曹操|曹公}}威力實重，初臨{{place:荊州|荊州}}，恩信未洽，宜以藉{{person:劉備|備}}，使撫安之。多{{person:曹操|操}}之敵，而自為樹黨，計之上也。」{{person:孫権|權}}即從之。", "kakikudashi_tagged": "『{{special:漢晉春秋|漢晋春秋}}』に曰く、{{person:呂範|呂範}}は{{person:劉備|備}}を留むるを勧むるも、{{person:魯粛|粛}}曰く、「不可なり。将軍は神武命世なりと雖も、然れども{{person:曹操|曹公}}の威力は実に重く、初めて{{place:荊州|荊州}}に臨み、恩信未だ洽からざれば、宜しく以て{{person:劉備|備}}に藉し、之を撫安せしむべし。{{person:曹操|操}}の敵を多くし、而して自ら為に党を樹つるは、計の上なり」と。{{person:孫権|権}}は即ち之に従う、と。", "translation_tagged": "『{{special:漢晉春秋|漢晋春秋}}』にいう、{{person:呂範|呂範}}は{{person:劉備|劉備}}を引き留めておくよう勧めたが、{{person:魯粛|魯粛}}は言った、「なりませぬ。将軍は神武にして世に抜きん出たお方とはいえ、{{person:曹操|曹公}}の威力はまことに重く、しかも{{place:荊州|荊州}}に臨んだばかりで、恩義と信望がまだ行き渡っておりませぬから、{{person:劉備|劉備}}に貸し与えて、これを慰撫し安定させるべきであります。{{person:曹操|曹操}}の敵を増やし、みずからの味方を打ち立てることこそ、最上の計略であります」と。{{person:孫権|孫権}}はただちにこれに従った、と。"}, {"id": "v54_p18_3", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（魯粛）", "para_index": 18, "type": "本文", "raw_text": "曹公聞權以土地業備，方作書，落筆於地。周瑜病困，上疏曰：「當今天下，方有事役，是瑜乃心夙夜所憂，願至尊先慮未然，然後康樂。今既與曹操為敵，劉備近在公安，邊境密邇，百姓未附，宜得良將以鎮撫之。魯肅智略足任，乞以代瑜。瑜隕踣之日，所懷盡矣。」", "kakikudashi": "曹公、権の土地を以て備に業せしむるを聞くや、方に書を作るも、筆を地に落とす。周瑜、病困し、上疏して曰く、「当今天下に、方に事役有り、是れ瑜の乃心夙夜に憂うる所なれば、願わくは至尊、先に未然を慮り、然る後に康楽せられんことを。今既に曹操と敵と為り、劉備は近く公安に在り、辺境は密邇し、百姓は未だ附かざれば、宜しく良将を得て以て之を鎮撫すべし。魯粛は智略任ずるに足れば、乞うらくは以て瑜に代えられよ。瑜の隕踣するの日、懐う所は尽きたり」と。", "translation": "曹公は孫権が土地を与えて劉備の基盤とさせたと聞くと、ちょうど書簡を認めている最中であったが、思わず筆を地面に取り落とした。周瑜は病が重篤になると、上疏して言った、「いまや天下には、まさに戦役が打ち続いており、これこそ周瑜が衷心より昼夜を問わず憂えているところでありますから、どうか至尊におかれては、まず未然のうちに備えを講じ、その後に安楽を享受されますように。いま既に曹操と敵対しているうえ、劉備がすぐ近くの公安におり、辺境は間近に接し、民衆もまだなついておりませぬから、良将を得てこれを鎮撫させるべきであります。魯粛は智略ともに任に堪える人物でありますので、どうか周瑜の代わりに任じてくださいますようお願い申し上げます。周瑜が倒れ伏す日を迎えましても、胸に抱く思いはこれで尽きました」と。", "persons": "曹操, 孫権, 劉備, 周瑜, 魯粛", "places": "公安", "era_year": "建安15年（210）", "source_book": "", "keywords": "", "raw_tagged": "{{person:曹操|曹公}}聞{{person:孫権|權}}以土地業{{person:劉備|備}}，方作書，落筆於地。{{person:周瑜|周瑜}}病困，上疏曰：「當今天下，方有事役，是{{person:周瑜|瑜}}乃心夙夜所憂，願{{person:孫権|至尊}}先慮未然，然後康樂。今既與{{person:曹操|曹操}}為敵，{{person:劉備|劉備}}近在{{place:公安|公安}}，邊境密邇，百姓未附，宜得良將以鎮撫之。{{person:魯粛|魯肅}}智略足任，乞以代{{person:周瑜|瑜}}。{{person:周瑜|瑜}}隕踣之日，所懷盡矣。」", "kakikudashi_tagged": "{{person:曹操|曹公}}、{{person:孫権|権}}の土地を以て{{person:劉備|備}}に業せしむるを聞くや、方に書を作るも、筆を地に落とす。{{person:周瑜|周瑜}}、病困し、上疏して曰く、「当今天下に、方に事役有り、是れ{{person:周瑜|瑜}}の乃心夙夜に憂うる所なれば、願わくは{{person:孫権|至尊}}、先に未然を慮り、然る後に康楽せられんことを。今既に{{person:曹操|曹操}}と敵と為り、{{person:劉備|劉備}}は近く{{place:公安|公安}}に在り、辺境は密邇し、百姓は未だ附かざれば、宜しく良将を得て以て之を鎮撫すべし。{{person:魯粛|魯粛}}は智略任ずるに足れば、乞うらくは以て{{person:周瑜|瑜}}に代えられよ。{{person:周瑜|瑜}}の隕踣するの日、懐う所は尽きたり」と。", "translation_tagged": "{{person:曹操|曹公}}は{{person:孫権|孫権}}が土地を与えて{{person:劉備|劉備}}の基盤とさせたと聞くと、ちょうど書簡を認めている最中であったが、思わず筆を地面に取り落とした。{{person:周瑜|周瑜}}は病が重篤になると、上疏して言った、「いまや天下には、まさに戦役が打ち続いており、これこそ{{person:周瑜|周瑜}}が衷心より昼夜を問わず憂えているところでありますから、どうか{{person:孫権|至尊}}におかれては、まず未然のうちに備えを講じ、その後に安楽を享受されますように。いま既に{{person:曹操|曹操}}と敵対しているうえ、{{person:劉備|劉備}}がすぐ近くの{{place:公安|公安}}におり、辺境は間近に接し、民衆もまだなついておりませぬから、良将を得てこれを鎮撫させるべきであります。{{person:魯粛|魯粛}}は智略ともに任に堪える人物でありますので、どうか{{person:周瑜|周瑜}}の代わりに任じてくださいますようお願い申し上げます。{{person:周瑜|周瑜}}が倒れ伏す日を迎えましても、胸に抱く思いはこれで尽きました」と。"}, {"id": "v54_p18_4", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（魯粛）", "para_index": 18, "type": "裴注", "raw_text": "《江表傳》載：初瑜疾困，與權箋曰：「瑜以凡才，昔受討逆殊特之遇，委以腹心，遂荷榮任，統御兵馬，志執鞭弭，自效戎行。規定巴蜀，次取襄陽，憑賴威靈，謂若在握。至以不謹，道遇暴疾，昨自醫療，日加無損。人生有死，修短命矣，誠不足惜，但恨微志未展，不復奉教命耳。方今曹公在北，疆埸未靜，劉備寄寓，有似養虎，天下之事，未知終始，此朝士旰食之秋，至尊垂慮之日也。魯肅忠烈，臨事不苟，可以代瑜。人之將死，其言也善，儻或可採，瑜死不朽矣。」案此箋與本傳所載，意旨雖同，其辭乖異耳。", "kakikudashi": "『江表伝』に載す、初め瑜の疾困するや、権に箋を与えて曰く、「瑜は凡才を以て、昔、討逆の殊特の遇を受け、委ぬるに腹心を以てせられ、遂に栄任を荷い、兵馬を統御し、鞭弭を執りて、自ら戎行に効さんことを志せり。巴蜀を規定し、次いで襄陽を取るも、威霊に憑頼せば、握に在るが若しと謂えり。不謹なるを以てするに至り、道に暴疾に遇い、昨より自ら医療するも、日に加わりて損ずる無し。人生に死有り、修短は命なり、誠に惜しむに足らざるも、但だ微志の未だ展びず、復た教命を奉ぜざるを恨むのみ。方今、曹公は北に在りて、疆場未だ静かならず、劉備の寄寓するは、虎を養うに似たる有り、天下の事、未だ終始を知らざれば、此れ朝士の旰食するの秋、至尊の慮を垂るるの日なり。魯粛は忠烈にして、事に臨みて苟くもせざれば、以て瑜に代うべし。人のまさに死なんとするや、其の言や善し、儻し或いは採るべくんば、瑜は死すとも朽ちず」と。案ずるに此の箋は本伝に載する所と、意旨は同じきと雖も、其の辞は乖異するのみ。", "translation": "『江表伝』に載せる、はじめ周瑜は病が重篤になると、孫権に書簡を奉って言った、「周瑜は凡庸の身でありながら、昔、討逆より格別の知遇を受け、腹心として信任を委ねられ、ついには栄えある重任を担って兵馬を統率し、鞭と弓を手にして戦陣に力を尽くそうと志してまいりました。巴蜀を平定し、次いで襄陽を取ることも、ご威光に頼れば掌中にあるも同然と考えておりました。ところが不摂生から旅の途上で急病にかかり、このところ治療に努めておりますものの、日に日に悪化するばかりで一向に快方へ向かいませぬ。人の一生に死はつきものであり、寿命の長短は天命でありますから、まことに惜しむには足りませぬが、ただささやかな志をいまだ果たせず、もはやご教命を奉じることができなくなることだけが心残りであります。いまや曹公が北に控え、国境はいまだ穏やかならず、劉備が身を寄せているのは、あたかも虎を養っているようなものであり、天下の行く末がいまだどうなるか見通せない今は、まさに朝廷の士が夜遅くまで食事を忘れて政務に励むべき時、至尊が深く思慮をめぐらされるべき日であります。魯粛は忠烈にして、事に臨んでかりそめの振る舞いをせぬ人物でありますから、周瑜の代わりに任ずることができます。人が死に臨んだとき、その言葉は善なるものと申します、もしお採り上げいただけるのであれば、周瑜は死しても朽ちることはございませぬ」と。考えるに、この書簡は本伝に載せるものと、趣旨は同じであるものの、その文辞は異なっているのである。", "persons": "周瑜, 孫権, 孫策, 曹操, 劉備, 魯粛", "places": "巴, 蜀, 襄陽", "era_year": "建安15年（210）", "source_book": "『江表伝』・裴松之案", "keywords": "江表伝", "raw_tagged": "《{{special:江表伝|江表傳}}》載：初{{person:周瑜|瑜}}疾困，與{{person:孫権|權}}箋曰：「{{person:周瑜|瑜}}以凡才，昔受{{person:孫策|討逆}}殊特之遇，委以腹心，遂荷榮任，統御兵馬，志執鞭弭，自效戎行。規定{{place:巴|巴}}{{place:蜀|蜀}}，次取{{place:襄陽|襄陽}}，憑賴威靈，謂若在握。至以不謹，道遇暴疾，昨自醫療，日加無損。人生有死，修短命矣，誠不足惜，但恨微志未展，不復奉教命耳。方今{{person:曹操|曹公}}在北，疆埸未靜，{{person:劉備|劉備}}寄寓，有似養虎，天下之事，未知終始，此朝士旰食之秋，{{person:孫権|至尊}}垂慮之日也。{{person:魯粛|魯肅}}忠烈，臨事不苟，可以代{{person:周瑜|瑜}}。人之將死，其言也善，儻或可採，{{person:周瑜|瑜}}死不朽矣。」案此箋與本傳所載，意旨雖同，其辭乖異耳。", "kakikudashi_tagged": "『{{special:江表伝|江表伝}}』に載す、初め{{person:周瑜|瑜}}の疾困するや、{{person:孫権|権}}に箋を与えて曰く、「{{person:周瑜|瑜}}は凡才を以て、昔、{{person:孫策|討逆}}の殊特の遇を受け、委ぬるに腹心を以てせられ、遂に栄任を荷い、兵馬を統御し、鞭弭を執りて、自ら戎行に効さんことを志せり。{{place:巴|巴}}{{place:蜀|蜀}}を規定し、次いで{{place:襄陽|襄陽}}を取るも、威霊に憑頼せば、握に在るが若しと謂えり。不謹なるを以てするに至り、道に暴疾に遇い、昨より自ら医療するも、日に加わりて損ずる無し。人生に死有り、修短は命なり、誠に惜しむに足らざるも、但だ微志の未だ展びず、復た教命を奉ぜざるを恨むのみ。方今、{{person:曹操|曹公}}は北に在りて、疆場未だ静かならず、{{person:劉備|劉備}}の寄寓するは、虎を養うに似たる有り、天下の事、未だ終始を知らざれば、此れ朝士の旰食するの秋、{{person:孫権|至尊}}の慮を垂るるの日なり。{{person:魯粛|魯粛}}は忠烈にして、事に臨みて苟 :建安|十九年}}，從{{person:孫権|權}}破{{place:皖|皖城}}，轉{{office:横江将軍|橫江將軍}}。", "kakikudashi_tagged": "即ち{{person:魯粛|粛}}を{{office:奮武校尉|奮武校尉}}に拝し、{{person:周瑜|瑜}}に代わりて兵を領せしむ。{{person:周瑜|瑜}}の士衆四千余人、{{special:奉邑|奉邑}}四県は、皆な焉に属す。{{person:程普|程普}}をして{{place:南郡|南郡}}{{office:太守|太守}}を領せしむ。{{person:魯粛|粛}}は初め{{place:江陵|江陵}}に住まり、後に下りて{{place:陸口|陸口}}に屯し、威恩大いに行われ、衆は万余人を増し、{{place:漢昌|漢昌}}{{office:太守|太守}}・{{office:偏将軍|偏将軍}}に拝せらる。{{special:建安|十九年}}、{{person:孫権|権}}に従いて{{place:皖|皖城}}を破り、{{office:横江将軍|横江将軍}}に転ず。", "translation_tagged": "ただちに{{person:魯粛|魯粛}}を{{office:奮武校尉|奮武校尉}}に任じ、{{person:周瑜|周瑜}}に代わって兵を率いさせた。{{person:周瑜|周瑜}}の将兵四千余人と{{special:奉邑|奉邑}}の四県は、すべて{{person:魯粛|魯粛}}に属することとなった。{{person:程普|程普}}には{{place:南郡|南郡}}{{office:太守|太守}}を兼任させた。{{person:魯粛|魯粛}}ははじめ{{place:江陵|江陵}}に駐在したが、のちに下って{{place:陸口|陸口}}に駐屯し、威信と恩徳が大いに行き渡って、兵衆は一万余人も増え、{{place:漢昌|漢昌}}{{office:太守|太守}}・{{office:偏将軍|偏将軍}}に任じられた。{{special:建安|十九年}}、{{person:孫権|孫権}}に従って{{place:皖|皖城}}を攻め破り、{{office:横江将軍|横江将軍}}に転任した。"}, {"id": "v54_p19_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（魯粛）", "para_index": 19, "type": "本文", "raw_text": "先是，益州牧劉璋綱維頹弛。周瑜、甘寧並勸權取蜀，權以諮備，備內欲自規。仍偽報曰：「備與璋托為宗室，冀憑英靈，以匡漢朝。今璋得罪左右，備獨竦懼，非所敢聞，願加寬貸。若不獲請，備當放髮歸於山林。」後備西圖璋，留關羽守。權曰：「猾虜乃敢挾詐！」及羽與肅鄰界，數生狐疑，疆場紛錯，肅常以歡好撫之。備既定益州，權求長沙、零、桂，備不承旨，權遣呂蒙率眾進取。備聞，自還公安，遣羽爭三郡。肅住益陽，與羽相拒。肅邀羽相見，各駐兵馬百步上，但諸將軍單刀俱會。肅因責數羽曰：「國家區區本以土地借卿家者，卿家軍敗遠來，無以為資故也。今已得益州，既無奉還之意，但求三郡，又不從命。」語未究竟，坐有一人曰：「夫土地者，惟德所在耳，何常之有！」肅厲聲呵之，辭色甚切。羽操刀起謂曰：「此自國家事，是人何知！」目使之去。", "kakikudashi": "是より先、益州牧の劉璋は綱維頽弛す。周瑜・甘寧は並びに権に蜀を取るを勧め、権は以て備に諮るに、備は内に自ら規らんと欲す。仍りて偽り報じて曰く、「備は璋と託して宗室と為り、英霊に憑りて、以て漢朝を匡さんことを冀う。今、璋の罪を左右に得るに、備は独り竦懼し、敢えて聞く所に非ず、願わくは寛貸を加えられんことを。若し請いを獲ずんば、備は当に髪を放ちて山林に帰すべし」と。後に備は西のかた璋を図り、関羽を留めて守らしむ。権曰く、「猾虜、乃ち敢えて詐を挟むか」と。羽と粛と界を隣するに及び、数しば狐疑を生じ、疆場紛錯するも、粛は常に歓好を以て之を撫す。備既に益州を定むるや、権は長沙・零・桂を求め、備は旨を承けざれば、権は呂蒙を遣わし衆を率いて進取せしむ。備聞きて、自ら公安に還り、羽を遣わして三郡を争わしむ。粛は益陽に住まり、羽と相い拒む。粛は羽を邀えて相い見え、各おの兵馬を百歩の上に駐め、但だ諸将軍のみ単刀にて倶に会す。粛は因りて羽を責め数めて曰く、「国家の区区として本より土地を以て卿が家に借せし者は、卿が家の軍敗れて遠く来たり、以て資と為す無きが故なり。今已に益州を得たるに、既に奉還の意無く、但だ三郡を求むるも、又た命に従わず」と。語未だ究竟せざるに、坐に一人有りて曰く、「夫れ土地なる者は、惟だ徳の在る所のみ、何の常か之れ有らん」と。粛は声を厲まして之を呵し、辞色甚だ切なり。羽は刀を操りて起ち謂いて曰く、「此れ自ずから国家の事なり、是の人何をか知らん」と。目もて之をして去らしむ。", "translation": "これより以前、益州牧の劉璋は統治の綱紀が緩み乱れていた。周瑜と甘寧はそろって孫権に蜀を取るよう勧め、孫権はこれを劉備に諮ったが、劉備は内心で自ら図ろうと望んでいた。そこで偽って返答して言った、「劉備は劉璋と同じく宗室に連なる身であり、ご威霊に頼って漢朝を匡救したいと願っております。いま劉璋がおそばに対して罪を得たことに、劉備はひとり恐れおののいており、とても承れる話ではございませぬ、どうか寛大なご宥恕を賜りますように。もし願いが聞き届けられないのであれば、劉備は髪を解き放って山林に隠棲するほかありませぬ」と。のちに劉備は西へ向かって劉璋を攻略し、関羽を残して守備にあたらせた。孫権は「悪賢い奴め、よくもぬけぬけと詐略を弄したな」と言った。関羽と魯粛が国境を接するようになると、たびたび疑心暗鬼が生じ、国境地帯で紛争が入り乱れたが、魯粛はつねに友好の態度をもってこれをなだめた。劉備がすでに益州を平定すると、孫権は長沙・零陵・桂陽の返還を求めたが、劉備が意向に従わなかったため、孫権は呂蒙を遣わし軍勢を率いて進撃・奪取させた。劉備はこれを聞くと、自ら公安に引き返し、関羽を遣わして三郡を争わせた。魯粛は益陽に駐屯し、関羽と対峙した。魯粛は関羽を招いて会見することとし、おのおの兵馬を百歩の後方に留め、ただ諸将軍だけが刀一振りを帯びて一堂に会した。魯粛はそこで関羽の非を責め立てて言った、「わが国家が誠意を尽くしてもとより土地を貴殿のご主君にお貸ししたのは、貴殿のご主君が戦に敗れて遠く逃れてこられ、足がかりとすべき基盤がなかったからであります。いま既に益州を手に入れられたというのに、返還する意思がないばかりか、ただ三郡だけを求めても、それすら命に従われませぬ」と。言葉がまだ終わらぬうちに、席上の一人が言った、「そもそも土地というものは、ただ有徳の者の帰するところにあるのであって、どうして決まった持ち主などありましょうか」と。魯粛は声を荒らげてこれを一喝し、言葉も顔色もきわめて厳しかった。関羽は刀を手に取って立ち上がり、その者に向かって「これはもとより国家の大事である、この者が何を知ろうか」と言い、目配せして立ち去らせた。", "persons": "劉璋, 周瑜, 甘寧, 孫権, 劉備, 関羽, 魯粛, 呂蒙", "places": "益州, 蜀, 長沙, 零陵, 桂陽, 公安, 益陽", "era_year": "建安15年〜20年（210〜215）", "source_book": "", "keywords": "牧, 宗室", "raw_tagged": "先是，{{place:益州|益州}}{{office:牧|牧}}{{person:劉璋|劉璋}}綱維頹弛。{{person:周瑜|周瑜}}、{{person:甘寧|甘寧}}並勸{{person:孫権|權}}取{{place:益州|蜀}}，{{person:孫権|權}}以諮{{person:劉備|備}}，{{person:劉備|備}}內欲自規。仍偽報曰：「{{person:劉備|備}}與{{person:劉璋|璋}}托為{{special:宗室|宗室}}，冀憑英靈，以匡漢朝。今{{person:劉璋|璋}}得罪左右，{{person:劉備|備}}獨竦懼，非所敢聞，願加寬貸。若不獲請，{{person:劉備|備}}當放髮歸於山林。」後{{person:劉備|備}}西圖{{person:劉璋|璋}}，留{{person:関羽|關羽}}守。{{person:孫権|權}}曰：「猾虜乃敢挾詐！」及{{person:関羽|羽}}與{{person:魯粛|肅}}鄰界，數生狐疑，疆場紛錯，{{person:魯粛|肅}}常以歡好撫之。{{person:劉備|備}}既定{{place:益州|益州}}，{{person:孫権|權}}求{{place:長沙|長沙}}、{{place:零陵|零}}、{{place:桂陽|桂}}，{{person:劉備|備}}不承旨，{{person:孫権|權}}遣{{person:呂蒙|呂蒙}}率眾進取。{{person:劉備|備}}聞，自還{{place:公安|公安}}，遣{{person:関羽|羽}}爭三郡。{{person:魯粛|肅}}住{{place:益陽|益陽}}，與{{person:関羽|羽}}相拒。{{person:魯粛|肅}}邀{{person:関羽|羽}}相見，各駐兵馬百步上，但諸將軍單刀俱會。{{person:魯粛|肅}}因責數{{person:関羽|羽 すを獲んや」と。羽、以て答うる無し、と。", "translation": "『呉書』にいう、魯粛が関羽と会見して語り合おうとしたとき、諸将は変事が起こるのではないかと疑い恐れ、行くべきではないと議論した。魯粛は言った、「今日の事態は、互いに道理を説いて諭すべきである。劉備がわが国に背き、是非がいまだ決着していないというのに、関羽とてどうして重ねて天命を犯すような真似ができようか」と。こうして関羽のもとへ赴いた。関羽は言った、「烏林の戦いにおいて、左将軍はみずから陣中に身を置き、眠るときも鎧を脱がず、力を合わせて魏を打ち破ったというのに、どうして骨折り損のまま一塊の土地も得られず、しかも貴殿がやって来て土地を回収しようなどということが許されようか」と。魯粛は言った、「そうではない。はじめ豫州と長阪でお会いしたとき、豫州の軍勢は一校の兵力にも満たず、計略も思慮も行き詰まり、志気も勢力も挫け衰えて、遠くへ落ち延びようと図るのがやっとであり、今のような望みなど思いもよらぬことであった。わが主上は豫州の身に落ち着く場所もないことを哀れみいたわり、土地や士人の力を惜しまず提供して、庇護を受けられるようにしてその苦境を救われたのに、豫州はひとり勝手に本心を飾り立て、恩徳に背き友好を損なわれた。いま既に西州を手中に収めておきながら、さらに荊州の土地まで切り取って併呑しようとしておられるが、これは凡夫でさえ行うに忍びないことであるのに、ましてや人材を統率する主君であればなおさらではないか。この魯粛が聞くところでは、利を貪って信義を棄てれば、必ず禍の端緒となるという。貴殿はちょうど重任の立場にありながら、道理を明らかにして適切に処置し、信義をもって時局を補佐することがまったくできず、かえって弱小の兵衆を頼みとして力ずくで争おうとしておられるが、非のある軍は気力が萎えるというのに、いったいどうして事を成し遂げられようか」と。関羽は返す言葉がなかった、と。", "persons": "魯粛, 関羽, 劉備, 孫権", "places": "烏林, 長阪, 益州, 荊州", "era_year": "建安20年（215）", "source_book": "『呉書』", "keywords": "呉書, 左将軍", "raw_tagged": "《{{special:呉書|吳書}}》曰：{{person:魯粛|肅}}欲與{{person:関羽|羽}}會語，諸將疑恐有變，議不可往。{{person:魯粛|肅}}曰：「今日之事，宜相開譬。{{person:劉備|劉備}}負國，是非未決，{{person:関羽|羽}}亦何敢重欲干命！」乃趨就{{person:関羽|羽}}。{{person:関羽|羽}}曰：「{{place:烏林|烏林}}之役，{{office:左将軍|左將軍}}身在行間，寢不脫介，戮力破魏，豈得徒勞，無一塊壤，而足下來欲收地邪？」{{person:魯粛|肅}}曰：「不然。始與{{person:劉備|豫州}}觀於{{place:長阪|長阪}}，{{person:劉備|豫州}}之眾不當一校，計窮慮極，志勢摧弱，圖欲遠竄，望不及此。{{person:孫権|主上}}矜愍{{person:劉備|豫州}}之身，無有處所，不愛土地士人之力，使有所庇廕以濟其患，而{{person:劉備|豫州}}私獨飾情，愆德隳好。今已藉手於{{place:益州|西州}}矣，又欲翦並{{place:荊州|荊州}}之土，斯蓋凡夫所不忍行，而況整領人物之主乎！{{person:魯粛|肅}}聞貪而棄義，必為禍階。吾子屬當重任，曾不能明道處分，以義輔時，而負恃弱眾以圖力爭，師曲為老，將何獲濟？」{{person:関羽|羽}}無以答。", "kakikudashi_tagged": "『{{special:呉書|呉書}}』に曰く、{{person:魯粛|粛}}は{{person:関羽|羽}}と会語せんと欲するに、諸将は変有らんことを疑い恐れ、往くべからずと議す。{{person:魯粛|粛}}曰く、「今日の事、宜しく相い開譬すべし。{{person:劉備|劉備}}は国に負き、是非未だ決せざれば、{{person:関羽|羽}}も亦た何ぞ敢えて重ねて命を干さんと欲せんや」と。乃ち趨りて{{person:関羽|羽}}に就く。{{person:関羽|羽}}曰く、「{{place:烏林|烏林}}の役に、{{office:左将軍|左将軍}}は身ら行間に在りて、寝ぬるにも介を脱せず、力を戮せて魏を破りしに、豈に徒労にして、一塊の壤も無く、而も足下は来たりて地を収めんと欲するを得んや」と。{{person:魯粛|粛}}曰く、「然らず。始め{{person:劉備|豫州}}と{{place:長阪|長阪}} きて界と為し、是に於いて軍を罷む。", "translation_tagged": "{{person:劉備|劉備}}はついに{{place:湘水|湘水}}を割いて境界とし、ここに軍を引き揚げた。"}, {"id": "v54_p20_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（魯粛）", "para_index": 20, "type": "本文", "raw_text": "肅年四十六，建安二十二年卒。權為舉哀，又臨其葬。諸葛亮亦為發哀。", "kakikudashi": "粛、年四十六、建安二十二年に卒す。権、為に哀を挙げ、又た其の葬に臨む。諸葛亮も亦た為に哀を発す。", "translation": "魯粛は年四十六で、建安二十二年に死去した。孫権はそのために挙哀の礼を行い、さらにその葬儀にも親臨した。諸葛亮もまた彼のために弔意を表して哀悼の礼を行った。", "persons": "魯粛, 孫権, 諸葛亮", "places": "", "era_year": "建安22年（217）", "source_book": "", "keywords": "建安", "raw_tagged": "{{person:魯粛|肅}}年四十六，{{special:建安|建安}}二十二年卒。{{person:孫権|權}}為舉哀，又臨其葬。{{person:諸葛亮|諸葛亮}}亦為發哀。", "kakikudashi_tagged": "{{person:魯粛|粛}}、年四十六、{{special:建安|建安}}二十二年に卒す。{{person:孫権|権}}、為に哀を挙げ、又た其の葬に臨む。{{person:諸葛亮|諸葛亮}}も亦た為に哀を発す。", "translation_tagged": "{{person:魯粛|魯粛}}は年四十六で、{{special:建安|建安}}二十二年に死去した。{{person:孫権|孫権}}はそのために挙哀の礼を行い、さらにその葬儀にも親臨した。{{person:諸葛亮|諸葛亮}}もまた彼のために弔意を表して哀悼の礼を行った。"}, {"id": "v54_p20_2", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（魯粛）", "para_index": 20, "type": "裴注", "raw_text": "《吳書》曰：肅為人方嚴，寡於玩飾，內外節儉，不務俗好。治軍整頓，禁令必行，雖在軍陳，手不釋卷。又善談論，能屬文辭，思度弘遠，有過人之明。周瑜之後，肅為之冠。", "kakikudashi": "『呉書』に曰く、粛は人となり方厳にして、玩飾に寡なく、内外節倹にして、俗好を務めず。軍を治むること整頓にして、禁令は必ず行われ、軍陳に在りと雖も、手に巻を釈てず。又た談論を善くし、能く文辞を属り、思度は弘遠にして、人に過ぐるの明有り。周瑜の後、粛は之が冠たり、と。", "translation": "『呉書』にいう、魯粛は人柄が方正厳格で、愛玩品や装飾を好まず、家の内外ともに質素倹約を旨とし、世俗の嗜好を追い求めなかった。軍の統治は整然としており、禁令は必ず徹底され、陣中にあっても書物を手放さなかった。また談論に長け、よく文章を綴り、思慮と度量は広大深遠で、人に抜きん出た先見の明を備えていた。周瑜の亡き後、魯粛がその筆頭であった、と。", "persons": "魯粛, 周瑜", "places": "", "era_year": "建安22年（217）", "source_book": "『呉書』", "keywords": "呉書", "raw_tagged": "《{{special:呉書|吳書}}》曰：{{person:魯粛|肅}}為人方嚴，寡於玩飾，內外節儉，不務俗好。治軍整頓，禁令必行，雖在軍陳，手不釋卷。又善談論，能屬文辭，思度弘遠，有過人之明。{{person:周瑜|周瑜}}之後，{{person:魯粛|肅}}為之冠。", "kakikudashi_tagged": "『{{special:呉書|呉書}}』に曰く、{{person:魯粛|粛}}は人となり方厳にして、玩飾に寡なく、内外節倹にして、俗好を務めず。軍を治むること整頓にして、禁令は必ず行われ、軍陳に在りと雖も、手に巻を釈てず。又た談論を善くし、能く文辞を属り、思度は弘遠にして、人に過ぐるの明有り。{{person:周瑜|周瑜}}の後、{{person:魯粛|粛}}は之が冠たり、と。", "translation_tagged": "『{{special:呉書|呉書}}』にいう、{{person:魯粛|魯粛}}は人柄が方正厳格で、愛玩品や装飾を好まず、家の内外ともに質素倹約を旨とし、世俗の嗜好を追い求めなかった。軍の統治は整然としており、禁令は必ず徹底され、陣中にあっても書物を手放さなかった。また談論に長け、よく文章を綴り、思慮と度量は広大深遠で、人に抜きん出た先見の明を備えていた。{{person:周瑜|周瑜}}の亡き後、{{person:魯粛|魯粛}}がその筆頭であった、と。"}, {"id": "v54_p20_3", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（魯粛）", "para_index": 20, "type": "本文", "raw_text": "權稱尊號，臨壇，顧謂公卿曰：「昔魯子敬嘗道此，可謂明於事勢矣。」肅遺腹子淑既壯，濡須督張承謂終當到至。永安中，為昭武將軍、都亭侯、武昌督。建衡中，假節，遷夏口督。所在嚴整，有方幹。鳳凰三年卒。子睦襲爵，領兵馬。", "kakikudashi": "権、尊号を称し、壇に臨むや、公卿を顧み謂いて曰く、「昔、魯子敬は嘗て此れを道えり、事勢に明らかなりと謂うべし」と。粛の遺腹の子の淑、既に壮なるや、濡須督の張承、終に当に到至すべしと謂う。永安中、昭武将軍・都亭侯・武昌督と為る。建衡中、仮節し、夏口督に遷る。在る所厳整にして、方幹有り。鳳凰三年に卒す。子の睦、爵を襲い、兵馬を領す。", "translation": "孫権は帝号を称して祭壇に臨んだ際、公卿たちを振り返って言った、「昔、魯子敬はかつてこのことを予言していたが、まことに時勢を見通す明があったと言うべきだ」と。魯粛の遺腹の子の魯淑が成人すると、濡須督の張承はきっと大成に至るであろうと評した。永安年間、昭武将軍・都亭侯・武昌督となった。建衡年間、仮節を与えられ、夏口督に遷った。赴任する先々で規律は厳正であり、方略と才幹を備えていた。鳳凰三年に死去した。子の魯睦が爵位を継ぎ、兵馬を統率した。", "persons": "孫権, 魯粛, 魯淑, 張承_呉, 魯睦", "places": "濡須, 武昌, 夏口", "era_year": "黄龍元年〜鳳凰3年（229〜274）", "source_book": "", "keywords": "公卿, 都督, 永安_年号, 昭武将軍, 列侯, 建衡, 仮節, 鳳凰_年号", "raw_tagged": "{{person:孫権|權}}稱尊號，臨壇，顧謂{{office:公卿|公卿}}曰：「昔{{person:魯粛|魯子敬}}嘗道此，可謂明於事勢矣。」{{person:魯粛|肅}}遺腹子{{person:魯淑|淑}}既壯，{{place:濡須|濡須}}{{office:都督|督}}{{person:張承_呉|張承}}謂終當到至。{{special:永安_年号|永安中}}，為{{office:昭武将軍|昭武將軍}}、{{office:列侯|都亭侯}}、{{place:武昌|武昌}}{{office:都督|督}}。{{special:建衡|建衡中}}，{{office:仮節|假節}}，遷{{place:夏口|夏口}}{{office:都督|督}}。所在嚴整，有方幹。{{special:鳳凰_年号|鳳凰三年}}卒。子{{person:魯睦|睦}}襲爵，領兵馬。", "kakikudashi_tagged": "{{person:孫権|権}}、尊号を称し、壇に臨むや、{{office:公卿|公卿}}を顧み謂いて曰く、「昔、{{person:魯粛|魯子敬}}は嘗て此れを道えり、事勢に明らかなりと謂うべし」と。{{person:魯粛|粛}}の遺腹の子の{{person:魯淑|淑}}、既に壮なるや、{{place:濡須|濡須}}{{office:都督|督}}の{{person:張承_呉|張承}}、終に当に到至すべしと謂う。{{special:永安_年号|永安中}}、{{office:昭武将軍|昭武将軍}}・{{office:列侯|都亭侯}}・{{place:武昌|武昌}}{{office:都督|督}}と為る。{{special:建衡|建衡中}}、{{office:仮節|仮節}}し、{{place:夏口|夏口}}{{office:都督|督}}に遷る。在る所厳整にして、方幹有り。{{special:鳳凰_年号|鳳凰三年}}に卒す。子の{{person:魯睦|睦}}、爵を襲い、兵馬を領す。", "translation_tagged": "{{person:孫権|孫権}}は帝号を称して祭壇に臨んだ際、{{office:公卿|公卿}}たちを振り返って言った、「昔、{{person:魯粛|魯子敬}}はかつてこのことを予言していたが、まことに時勢を見通す明があったと言うべきだ」と。{{person:魯粛|魯粛}}の遺腹の子の{{person:魯淑|魯淑}}が成人すると、{{place:濡須|濡須}}{{office:都督|督}}の{{person:張承_呉|張承}}はきっと大成に至るであろうと評した。{{special:永安_年号|永安年間}}、{{office:昭武将軍|昭武将軍}}・{{office:列侯|都亭侯}}・{{place:武昌|武昌}}{{office:都督|督}}となった。{{special:建衡|建衡年間}}、{{office:仮節|仮節}}を与えられ、{{place:夏口|夏口}}{{office:都督|督}}に遷った。赴任する先々で規律は厳正であり、方略と才幹を備えていた。{{special:鳳凰_年号|鳳凰三年}}に死去した。子の{{person:魯睦|魯睦}}が爵位を継ぎ、兵馬を統率した。"}, {"id": "v54_p21_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 21, "type": "本文", "raw_text": "呂蒙字子明，汝南富陂人也。少南渡，依姊夫鄧當。當為孫策將，數討山越。蒙年十五六，竊隨當擊賊，當顧見大驚，呵叱不能禁止。歸以告蒙母，母恚欲罰之，蒙曰：「貧賤難可居，脫誤有功，富貴可致。且不探虎穴，安得虎子？」母哀而捨之。時當職吏以蒙年小輕之，曰：「彼堅子何能為？此欲以肉餧虎耳。」他日與蒙會，又蚩辱之。蒙大怒，引刀殺吏，出走，逃邑子鄭長家。出因校尉袁雄自首，承間為言，策召見奇之，引置左右。數歲，鄧當死，張昭薦蒙代當，拜別部司馬。權統事，料諸小將兵少而用薄者，欲併合之。蒙陰賒貰，為兵作絳衣行滕，及簡日，陳列赫然，兵人練習，權見之大悅，增其兵。從討丹楊，所向有功，拜平北都尉，領廣德長。從征黃祖，祖令都督陳就逆以水軍出戰。蒙勒前鋒，親梟就首，將士乘勝，進攻其城。祖聞就死，委城走，兵追禽之。權曰：「事之克，由陳就先獲也。」以蒙為橫野中郎將，賜錢千萬。", "kakikudashi": "呂蒙、字は子明、汝南の富陂の人なり。少くして南のかた渡り、姉の夫の鄧当に依る。当は孫策の将と為り、しばしば山越を討つ。蒙、年十五六、竊かに当に随いて賊を撃つに、当は顧み見て大いに驚き、呵叱すれども禁止する能わず。帰りて以て蒙の母に告ぐれば、母は恚りて之を罰せんと欲するに、蒙曰く、「貧賤には居り難し、脱誤して功有らば、富貴致すべし。且つ虎穴を探らずんば、安んぞ虎子を得んや」と、母は哀れみて之を捨す。時に当の職吏、蒙の年小なるを以て之を軽んじ、曰く、「彼の堅子、何をか能く為さん、此れ肉を以て虎に餧せんと欲するのみ」と。他日、蒙と会するに、又た之を蚩辱す。蒙は大いに怒り、刀を引きて吏を殺し、出走して、邑子の鄭長の家に逃る。出でて校尉の袁雄に因りて自首し、間を承けて為に言えば、策は召見して之を奇とし、引きて左右に置く。数歳にして、鄧当死し、張昭は蒙を薦めて当に代えしめ、別部司馬に拝す。権、事を統ぶるや、諸もろの小将の兵少なくして用薄き者を料り、之を併合せんと欲す。蒙は陰かに賒貰し、兵の為に絳衣・行滕を作り、簡日に及ぶや、陳列は赫然として、兵人は練習したれば、権は之を見て大いに悦び、其の兵を増す。従いて丹楊を討ち、向かう所に功有り、平北都尉に拝せられ、広徳長を領す。従いて黄祖を征するに、祖は都督の陳就をして逆えて水軍を以て出戦せしむ。蒙は前鋒を勒し、親ら就の首を梟すれば、将士は勝に乗じ、進みて其の城を攻む。祖は就の死せるを聞き、城を委てて走り、兵、追いて之を禽にす。権曰く、「事の克つは、陳就の先ず獲られしに由るなり」と。蒙を以て横野中郎将と為し、銭千万を賜う。", "translation": "呂蒙は字を子明といい、汝南郡富陂県の人である。幼い頃に南へ渡り、姉の夫である鄧当を頼った。鄧当は孫策の部将となって、たびたび山越を討伐していた。呂蒙は年十五、六のとき、ひそかに鄧当について行き賊を撃ったが、鄧当は振り返り見て大いに驚き、叱りつけたものの押しとどめることができなかった。帰還してからそのことを呂蒙の母に告げると、母は怒って呂蒙を罰しようとしたが、呂蒙が「貧しく賤しい境遇にはとても甘んじていられません、万一にも戦功を立てられれば、富貴を手に入れることができます。それに虎穴を探らなければ、どうして虎の子を得られましょうか」と言ったので、母は不憫に思ってこれを許した。当時、鄧当の配下の役人が、呂蒙が年少であることから侮り、「あの小僧に何ができるものか、これでは肉を虎に食わせようとするようなものだ」と言った。後日、呂蒙と顔を合わせた際、またも呂蒙をあざけり辱めた。呂蒙は大いに怒り、刀を抜いてその役人を斬り殺し、出奔して、同郷の鄭長の家に逃れた。のちに出て校尉の袁雄を通じて自首すると、袁雄が折を見て取り成して言上したので、孫策は召し出して引見し、その人物を奇才と認めて、引き立てて側近くに置いた。数年して鄧当が死去すると、張昭は呂蒙を推挙して鄧当の後を継がせ、別部司馬に任じた。孫権が政務を統括するようになると、小部隊を率いる諸将のうち兵が少なく戦力も乏しい者を整理して、併合しようとした。呂蒙はひそかに掛け買いをして、兵士のために赤い軍衣と脚絆をあつらえ、閲兵の当日になると、整列した軍容は鮮やかに輝き、兵士たちもよく訓練が行き届いていたので、孫権はこれを見て大いに喜び、その兵を増員した。孫権に従って丹陽を討伐し、向かう先々で戦功を立て、平北都尉に任じられ、広徳長を兼任した。孫権に従って黄祖を征討した際、黄祖は都督の陳就に命じて水軍を率い出撃して迎え撃たせた。呂蒙は先鋒を指揮し、みずから陳就の首を討ち取って晒したので、将兵は勝勢に乗じ、進んでその城を攻めた。黄祖は陳就が戦死したと聞くと、城を捨てて逃走したが、兵が追撃してこれを生け捕りにした。孫権は「戦いに勝てたのは、陳就が真っ先に討ち取られたおかげである」と言った。呂蒙を横野中郎将とし、銭千万を賜った。", "persons": "呂蒙, 鄧当, 孫策, 鄭長, 袁雄, 張昭, 孫権, 黄祖, 陳就", "places": "汝南, 富陂, 丹陽, 広徳", "era_year": "建安初年〜建安13年（196頃〜208）", "source_book": "", "keywords": "山越, 校尉, 別部司馬, 平北都尉, 県長, 都督, 横野中郎将", "raw_tagged": "{{person:呂蒙|呂蒙}}字{{person:呂蒙|子明}}，{{place:汝南|汝南}}{{place:富陂|富陂}}人也。少南渡，依姊夫{{person:鄧当|鄧當}}。{{person:鄧当|當}}為{{person:孫策|孫策}}將，數討{{special:山越|山越}}。{{person:呂蒙|蒙}}年十五六，竊隨{{person:鄧当|當}}擊賊，{{person:鄧当|當}}顧見大驚，呵叱不能禁止。歸以告{{person:呂蒙|蒙}}母，母恚欲罰之，{{person:呂蒙|蒙}}曰：「貧賤難可居，脫誤有功，富貴可致。且不探虎穴，安得虎子？」母哀而捨之。時{{person:鄧当|當}}職吏以{{person:呂蒙|蒙}}年小輕之，曰：「彼堅子何能為？此欲以肉餧虎耳。」他日與{{person:呂蒙|蒙}}會，又蚩辱之。{{person:呂蒙|蒙}}大怒，引刀殺吏，出走，逃邑子{{person:鄭長|鄭長}}家。出因{{office:校尉|校尉}}{{person:袁雄|袁雄}}自首，承間為言，{{person:孫策|策}}召見奇之，引置左右。數歲，{{person:鄧当|鄧當}}死，{{person:張昭|張昭}}薦{{person:呂蒙|蒙}}代{{person:鄧当|當}}，拜{{office:別部司馬|別部司馬}}。{{person:孫権|權}}統事，料諸小將兵少而用薄者，欲併合之。{{person:呂蒙|蒙}}陰賒貰，為兵作絳衣行滕，及簡日，陳列赫然，兵人練習，{{person:孫権|權}}見之大悅，增其兵。從討{{place:丹陽|丹楊}}，所向有功，拜{{office:平北都尉|平北都尉}}，領{{place:広徳|廣德}}{{office:県長|長}}。從征{{person:黄祖|黃祖}}，{{person:黄祖|祖}}令{{office:都督|都督}}{{person:陳就|陳就}}逆以水軍出戰。{{person:呂蒙|蒙}}勒前鋒，親梟{{person:陳就|就}}首，將士乘勝，進攻其城。{{person:黄祖|祖}}聞{{person:陳就|就}}死，委城走，兵追禽之。{{person:孫権|權}}曰：「事之克，由{{person:陳就|陳就}}先獲也。」以{{person:呂蒙|蒙}}為{{office:横野中郎将|橫野中郎將}}，賜錢千萬。", "kakikudashi_tagged": "{{person:呂蒙|呂蒙}}、字は{{person:呂蒙|子明}}、{{place:汝南|汝南}}の{{place:富陂|富陂}}の人なり。少くして南のかた渡り、姉の夫の{{person:鄧当|鄧当}}に依る。{{person:鄧当|当}}は{{person:孫策|孫策}}の将と為り、しばしば{{special:山越|山越}}を討つ。{{person:呂蒙|蒙}}、年十五六、竊かに erson:鄧当|鄧当}}が死去すると、{{person:張昭|張昭}}は{{person:呂蒙|呂蒙}}を推挙して{{person:鄧当|鄧当}}の後を継がせ、{{office:別部司馬|別部司馬}}に任じた。{{person:孫権|孫権}}が政務を統括するようになると、小部隊を率いる諸将のうち兵が少なく戦力も乏しい者を整理して、併合しようとした。{{person:呂蒙|呂蒙}}はひそかに掛け買いをして、兵士のために赤い軍衣と脚絆をあつらえ、閲兵の当日になると、整列した軍容は鮮やかに輝き、兵士たちもよく訓練が行き届いていたので、{{person:孫権|孫権}}はこれを見て大いに喜び、その兵を増員した。{{person:孫権|孫権}}に従って{{place:丹陽|丹陽}}を討伐し、向かう先々で戦功を立て、{{office:平北都尉|平北都尉}}に任じられ、{{place:広徳|広徳}}{{office:県長|長}}を兼任した。{{person:孫権|孫権}}に従って{{person:黄祖|黄祖}}を征討した際、{{person:黄祖|黄祖}}は{{office:都督|都督}}の{{person:陳就|陳就}}に命じて水軍を率い出撃して迎え撃たせた。{{person:呂蒙|呂蒙}}は先鋒を指揮し、みずから{{person:陳就|陳就}}の首を討ち取って晒したので、将兵は勝勢に乗じ、進んでその城を攻めた。{{person:黄祖|黄祖}}は{{person:陳就|陳就}}が戦死したと聞くと、城を捨てて逃走したが、兵が追撃してこれを生け捕りにした。{{person:孫権|孫権}}は「戦いに勝てたのは、{{person:陳就|陳就}}が真っ先に討ち取られたおかげである」と言った。{{person:呂蒙|呂蒙}}を{{office:横野中郎将|横野中郎将}}とし、銭千万を賜った。"}, {"id": "v54_p22_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 22, "type": "本文", "raw_text": "是歲，又與周瑜、程普等西破曹公於烏林，圍曹仁於南郡。益州將襲肅舉軍來附，瑜表以肅兵益蒙，蒙盛稱肅有膽用。且慕化遠來，於義宜益不宜奪也。權善其言，還肅兵。瑜使甘寧前據夷陵，曹仁分眾圍寧，寧困急，使使請救。諸將以兵少不足分，蒙謂瑜、普曰：「留凌公績，蒙與君行，解圍釋急，勢亦不久，蒙保公績能十日守也。」又說瑜分遣三百人柴斷險道，賊走可得其馬。瑜從之。軍到夷陵，即日交戰，所殺過半。敵夜遁去，行遇柴道，騎皆捨馬步走。兵追蹙擊，獲馬三百匹，方船載還。於是將士形勢自倍，乃渡江立屯，與相攻擊，曹仁退走。遂據南郡，撫定荊州。還，拜偏將軍，領尋陽令。", "kakikudashi": "是の歳、又た周瑜・程普等と西のかた曹公を烏林に破り、曹仁を南郡に囲む。益州の将の襲粛、軍を挙げて来たり附くに、瑜は表して粛の兵を以て蒙に益さんとすれども、蒙は盛んに粛に胆用有るを称す。且つ化を慕いて遠く来たりたれば、義に於いて宜しく益すべくして奪うべからざるなり、と。権は其の言を善しとし、粛の兵を還す。瑜は甘寧をして前みて夷陵に拠らしむるに、曹仁は衆を分かちて寧を囲み、寧は困急して、使いをして救いを請わしむ。諸将は兵少なくして分かつのに足らずと以為えども、蒙は瑜・普に謂いて曰く、「凌公績を留め、蒙と君と行かば、囲みを解き急を釈くこと、勢い亦た久しからず、蒙は公績の能く十日守るを保するなり」と。又た瑜に説きて三百人を分遣し険道を柴断せしめ、賊走らば其の馬を得べしとす。瑜は之に従う。軍、夷陵に到り、即日に交戦し、殺す所は過半なり。敵は夜に遁れ去り、行きて柴道に遇えば、騎は皆な馬を捨てて歩走す。兵、追いて蹙撃し、馬三百匹を獲て、船を方べて載せ還る。是に於いて将士の形勢は自ずから倍し、乃ち江を渡りて屯を立て、与に相い攻撃すれば、曹仁は退走す。遂に南郡に拠り、荊州を撫定す。還りて、偏将軍に拝せられ、尋陽令を領す。", "translation": "この年、さらに周瑜・程普らとともに西へ進んで曹公を烏林に打ち破り、曹仁を南郡に包囲した。益州の部将である襲粛が全軍を挙げて帰附してくると、周瑜は上表して襲粛の兵を呂蒙の部隊に加えようとしたが、呂蒙はしきりに襲粛には胆力と器量があると称揚した。そのうえ徳化を慕って遠方からやって来たのであるから、道義において兵を増やしてやるべきであっても奪うべきではない、と述べた。孫権はその言葉を立派だと認め、襲粛に兵を返還した。周瑜が甘寧を派遣して前方の夷陵を占拠させると、曹仁は軍勢を割いて甘寧を包囲し、甘寧は窮地に陥って、使者を の今の論、何ぞ一に穰侯を称するや。兄は今、公瑾に代わる、既に継ぎ為し難く、且つ関羽と隣を為す。斯の人は長じて学を好み、左伝を読みて略ぼ皆な口に上せ、梗亮にして雄気有り、然れども性は頗る自負し、好みて人を陵ぐ。今、与に対を為すに、当に単複の以て卿の之を待つ有るべし」と。密かに粛の為に三策を陳べ、粛は敬みて之を受け、秘して宣べず。権は常に歎じて曰く、「人の長じて進益すること、呂蒙・蔣欽の如きは、蓋し及ぶべからざるなり。富貴栄顕にして、更に能く節を折りて学を好み、書伝を耽悦し、財を軽んじ義を尚び、行う所は跡とすべく、並に国士と作る、亦た休ならずや」と。", "translation": "『江表伝』にいう、はじめ、孫権は呂蒙および蔣欽に語って言った、「君たちはいま揃って要路に立って政務や軍務を掌っているのだから、学問をして自ら見識を広め高めるべきである」と。呂蒙は言った、「軍中にあっていつも多忙に苦しんでおりますので、とても読書をするゆとりはないかと存じます」と。孫権は言った、「私はどうして君に経書を修めて博士になれなどと望もうか、ただ広く書物を渉猟して古の事績を知ってほしいだけなのだ。君が多忙だといってもどうして私ほどであろうか、私は若い頃に『詩』『書』『礼記』『左伝』『国語』を一通り学んだが、ただ『易』だけは読まなかった。政務を統括するようになってからは、三史や諸家の兵法書に目を通したが、自分でも大いに有益であったと思っている。君たち二人のような者は、気質が明朗で理解が速いのだから、学べば必ず身につくはずなのに、どうしてやらずにいてよいものか、急ぎ『孫子』『六韜』『左伝』『国語』および三史を読むがよい。孔子は『一日中食事もせず、一晩中眠りもせずに思索してみたが、何の益もなかった、学ぶのに越したことはない』と言っている。光武は軍務のさなかにあっても、手から書物を離さなかった。孟徳もまた、みずから老いてなお学問を好むと語っている。君はどうしてひとり自ら勉め励もうとしないのか」と、そこで呂蒙は初めて学問に志し、熱心に打ち込んで倦むことなく、その読破した書物の広さは、古参の儒者ですら及ばないほどであった。のちに魯粛が川を上って周瑜の後任となった際、呂蒙のもとに立ち寄って議論を交わすと、いつも言い負かされそうになった。魯粛は呂蒙の背を撫でて言った、「私は貴殿にはただ武略があるだけだと思っていたが、今となってみれば、学識はすぐれて広く、もはや呉下の阿蒙ではないな」と。呂蒙は言った、「士たる者は三日も別れていれば、目をこすって見直さなければなりません。兄上の今の議論は、どうしてまた穰侯などを引き合いに出されるのですか。兄上はいま公瑾の後を継がれましたが、その後任を務めるだけでも難しいうえ、さらに関羽と隣り合うことになります。この人物は成長してからも学問を好み、左伝を読んでほぼすべて暗誦しており、剛直で雄々しい気概を備えておりますが、性格はすこぶる自負心が強く、好んで人を見下すところがあります。いま彼と対峙するにあたっては、貴殿が彼に対処するための幾重もの備えがなくてはなりません」と。そして密かに魯粛のために三つの策を述べると、魯粛は謹んでこれを受け入れ、秘して口外しなかった。孫権はつねづね感嘆して言った、「人が成長してからさらに進歩向上すること、呂蒙や蔣欽のような者は、実に及びがたいものがある。富貴栄達を極めながら、さらに身をへりくだって学問を好み、書物に親しみ楽しみ、財貨を軽んじて信義を尊び、その行いは模範とするに足り、ともに国士となった、なんと立派なことではないか」と。", "persons": "孫権, 呂蒙, 蔣欽, 孔子, 光武帝, 曹操, 魯粛, 周瑜, 魏冉, 関羽", "places": "呉郡", "era_year": "建安15年（210）前後", "source_book": "『江表伝』", "keywords": "江表伝, 博士, 詩経_五経, 書経, 礼記, 左伝, 国語, 易経, 三史, 孫子, 六韜", "raw_tagged": "《{{special:江表伝|江表傳}}》曰：初，{{person:孫権|權}}謂{{person:呂蒙|蒙}}及{{person:蔣欽|蔣欽}}曰：「卿今並當塗掌事，宜學問以自開益。」{{person:呂蒙|蒙}}曰：「在軍中常苦多務，恐不容復讀書。」{{person:孫権|權}}曰：「孤豈欲卿治經為{{office:博士|博士}}邪？但當令涉獵見往事耳。卿言多務孰若孤，孤少時歷{{special:詩経_五経|《詩》}}{{special:書経|《書》}}《{{special:礼記|禮記}}》《{{special:左伝|左傳}}》{{special:国語|《國語》}}，惟不讀 負し、好みて人を陵ぐ。今、与に対を為すに、当に単複の以て卿の之を待つ有るべし」と。密かに{{person:魯粛|粛}}の為に三策を陳べ、{{person:魯粛|粛}}は敬みて之を受け、秘して宣べず。{{person:孫権|権}}は常に歎じて曰く、「人の長じて進益すること、{{person:呂蒙|呂蒙}}・{{person:蔣欽|蔣欽}}の如きは、蓋し及ぶべからざるなり。富貴栄顕にして、更に能く節を折りて学を好み、書伝を耽悦し、財を軽んじ義を尚び、行う所は跡とすべく、並に国士と作る、亦た休ならずや」と。", "translation_tagged": "『{{special:江表伝|江表伝}}』にいう、はじめ、{{person:孫権|孫権}}は{{person:呂蒙|呂蒙}}および{{person:蔣欽|蔣欽}}に語って言った、「君たちはいま揃って要路に立って政務や軍務を掌っているのだから、学問をして自ら見識を広め高めるべきである」と。{{person:呂蒙|呂蒙}}は言った、「軍中にあっていつも多忙に苦しんでおりますので、とても読書をするゆとりはないかと存じます」と。{{person:孫権|孫権}}は言った、「私はどうして君に経書を修めて{{office:博士|博士}}になれなどと望もうか、ただ広く書物を渉猟して古の事績を知ってほしいだけなのだ。君が多忙だといってもどうして私ほどであろうか、私は若い頃に{{special:詩経_五経|『詩』}}{{special:書経|『書』}}『{{special:礼記|礼記}}』『{{special:左伝|左伝}}』{{special:国語|『国語』}}を一通り学んだが、ただ{{special:易経|『易』}}だけは読まなかった。政務を統括するようになってからは、{{special:三史|三史}}や諸家の兵法書に目を通したが、自分でも大いに有益であったと思っている。君たち二人のような者は、気質が明朗で理解が速いのだから、学べば必ず身につくはずなのに、どうしてやらずにいてよいものか、急ぎ『{{special:孫子|孫子}}』『{{special:六韜|六韜}}』『{{special:左伝|左伝}}』{{special:国語|『国語』}}および{{special:三史|三史}}を読むがよい。{{person:孔子|孔子}}は『一日中食事もせず、一晩中眠りもせずに思索してみたが、何の益もなかった、学ぶのに越したことはない』と言っている。{{person:光武帝|光武}}は軍務のさなかにあっても、手から書物を離さなかった。{{person:曹操|孟徳}}もまた、みずから老いてなお学問を好むと語っている。君はどうしてひとり自ら勉め励もうとしないのか」と、そこで{{person:呂蒙|呂蒙}}は初めて学問に志し、熱心に打ち込んで倦むことなく、その読破した書物の広さは、古参の儒者ですら及ばないほどであった。のちに{{person:魯粛|魯粛}}が川を上って{{person:周瑜|周瑜}}の後任となった際、{{person:呂蒙|呂蒙}}のもとに立ち寄って議論を交わすと、いつも言い負かされそうになった。{{person:魯粛|魯粛}}は{{person:呂蒙|呂蒙}}の背を撫でて言った、「私は貴殿にはただ武略があるだけだと思っていたが、今となってみれば、学識はすぐれて広く、もはや{{place:呉郡|呉下}}の{{person:呂蒙|阿蒙}}ではないな」と。{{person:呂蒙|呂蒙}}は言った、「士たる者は三日も別れていれば、目をこすって見直さなければなりません。兄上の今の議論は、どうしてまた{{person:魏冉|穰侯}}などを引き合いに出されるのですか。兄上はいま{{person:周瑜|公瑾}}の後を継がれましたが、その後任を務めるだけでも難しいうえ、さらに{{person:関羽|関羽}}と隣り合うことになります。この人物は成長してからも学問を好み、{{special:左伝|左伝}}を読んでほぼすべて暗誦しており、剛直で雄々しい気概を備えておりますが、性格はすこぶる自負心が強く、好んで人を見下すところがあります。いま彼と対峙するにあたっては、貴殿が彼に対処するための幾重もの備えがなくてはなりません」と。そして密かに{{person:魯粛|魯粛}}のために三つの策を述べると、{{person:魯粛|魯粛}}は謹んでこれを受け入れ、秘して口外しなかった。{{person:孫権|孫権}}はつねづね感嘆して言った、「人が成長してからさらに進歩向上すること、{{person:呂蒙|呂蒙}}や{{person:蔣欽|蔣欽}}のような者は、実に及びがたいものがある。富貴栄達を極めながら、さらに身をへりくだって学問を好み、書物に親しみ楽しみ、財貨を軽んじて信義を尊び、その行いは模範とするに足り、ともに国士となった、なんと立派なことではないか」と。"}, {"id": "v54_p23_3", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 23, "type": "本文", "raw_text": "時蒙與成當、宋定、徐顧屯次比近，三將死，子弟幼弱，權悉以兵並蒙。蒙固辭，陳啟顧等皆勤勞國事，子弟雖小，不可廢也。書三上，權乃聽。蒙於是又為擇師，使輔導之，其操心率如此。", "kakikudashi": "時に蒙は成当・宋定・徐顧と屯次比近なり、三将死し、子弟は幼弱なれば、権は悉く兵を以て蒙に並せんとす。蒙は固辞し、陳啓すらく、顧等は皆な国事に勤労したれば、子弟は小なりと雖も、廃すべからざるなり、と。書、三たび上り、権は乃ち聴す。蒙は是に於いて又た為に師を択び、之を輔導せしむ、其の心を操ること率ね此くの如し。", "translation": "当時、呂蒙は成当・宋定・徐顧と駐屯地が隣り合っていたが、三人の部将が亡くなり、遺された子弟が幼弱であったため、孫権はその兵をすべて呂蒙の部隊に併合しようとした。呂蒙は固辞し、徐顧らはいずれも国事に勤労したのであるから、子弟が幼いとはいえ、廃絶させるべきではありません、と上申した。上書を三度奉ると、孫権はようやく聞き入れた。そこで呂蒙はさらに彼らのために師を選んで、彼らを輔導させたが、その心の持ちようはおおむねこのようであった。", "persons": "呂蒙, 成当, 宋定, 徐顧, 孫権", "places": "", "era_year": "建安15年（210）頃", "source_book": "", "keywords": "", "raw_tagged": "時{{person:呂蒙|蒙}}與{{person:成当|成當}}、{{person:宋定|宋定}}、{{person:徐顧|徐顧}}屯次比近，三將死，子弟幼弱，{{person:孫権|權}}悉以兵並{{person:呂蒙|蒙}}。{{person:呂蒙|蒙}}固辭，陳啟{{person:徐顧|顧}}等皆勤勞國事，子弟雖小，不可廢也。書三上，{{person:孫権|權}}乃聽。{{person:呂蒙|蒙}}於是又為擇師，使輔導之，其操心率如此。", "kakikudashi_tagged": "時に{{person:呂蒙|蒙}}は{{person:成当|成当}}・{{person:宋定|宋定}}・{{person:徐顧|徐顧}}と屯次比近なり、三将死し、子弟は幼弱なれば、{{person:孫権|権}}は悉く兵を以て{{person:呂蒙|蒙}}に並せんとす。{{person:呂蒙|蒙}}は固辞し、陳啓すらく、{{person:徐顧|顧}}等は皆な国事に勤労したれば、子弟は小なりと雖も、廃すべからざるなり、と。書、三たび上り、{{person:孫権|権}}は乃ち聴す。{{person:呂蒙|蒙}}は是に於いて又た為に師を択び、之を輔導せしむ、其の心を操ること率ね此くの如し。", "translation_tagged": "当時、{{person:呂蒙|呂蒙}}は{{person:成当|成当}}・{{person:宋定|宋定}}・{{person:徐顧|徐顧}}と駐屯地が隣り合っていたが、三人の部将が亡くなり、遺された子弟が幼弱であったため、{{person:孫権|孫権}}はその兵をすべて{{person:呂蒙|呂蒙}}の部隊に併合しようとした。{{person:呂蒙|呂蒙}}は固辞し、{{person:徐顧|徐顧}}らはいずれも国事に勤労したのであるから、子弟が幼いとはいえ、廃絶させるべきではありません、と上申した。上書を三度奉ると、{{person:孫権|孫権}}はようやく聞き入れた。そこで{{person:呂蒙|呂蒙}}はさらに彼らのために師を選んで、彼らを輔導させたが、その心の持ちようはおおむねこのようであった。"}, {"id": "v54_p24_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 24, "type": "本文", "raw_text": "魏使廬江謝奇為蘄春典農，屯皖田鄉，數為邊寇。蒙使人誘之，不從，則伺隙襲擊，奇遂縮退，其部伍孫子才、宋豪等，皆攜負老弱，詣蒙降。後從權拒曹公於濡須，數進奇計，又勸權夾水口立塢，所以備禦甚精，", "kakikudashi": "魏、廬江の謝奇をして蘄春典農と為し、皖の田郷に屯し、数しば辺寇を為さしむ。蒙は人をして之を誘わしむるに、従わざれば、則ち隙を伺いて襲撃し、奇は遂に縮退し、其の部伍の孫子才・宋豪等、皆な老弱を携負し、蒙に詣りて降る。後に権に従いて曹公を濡須に拒み、数しば奇計を進め、又た権に水口を夾みて塢を立てんことを勧め、備禦する所以甚だ精しく、", "translation": "魏は廬江の謝奇を蘄春典農とし、皖の田郷に駐屯させて、たびたび国境を荒らさせた。呂蒙は人をやって彼を帰順に誘わせたが、従わなかったため、隙をうかがって襲撃すると、謝奇はついに退却し、その配下の孫子才・宋豪らは、みな老人や幼弱の家族を引き連れて、呂蒙のもとへ赴き降伏した。のちに孫権に従って曹公を濡須に拒み、たびたび奇計を進言し、さらに孫権に水口を挟んで塢を築くよう勧め、防備の手立てはきわめて精緻を極め、", "persons": "謝奇, 呂蒙, 孫子才, 宋豪, 孫権, 曹操", "places": "廬江, 蘄春, 皖, 濡須", "era_year": "建安17年〜18年（212〜213）", "source_book": "", "keywords": "典農", "raw_tagged": "魏使{{place:廬江|廬江}}{{person:謝奇|謝奇}}為{{place:蘄春|蘄春}}{{office:典農|典農}}，屯{{place:皖|皖}}田鄉，數為邊寇。{{person:呂蒙|蒙}}使人誘之，不從，則伺隙襲擊，{{person:謝奇|奇}}遂縮退，其部伍{{person:孫子才|孫子才}}、{{person:宋豪|宋豪}}等，皆攜負老弱，詣{{person:呂蒙|蒙}}降。後從{{person:孫権|權}}拒{{person:曹操|曹公}}於{{place:濡須|濡須}}，數進奇計，又勸{{person:孫権|權}}夾水口立塢，所以備禦甚精，", "kakikudashi_tagged": "魏、{{place:廬江|廬江}}の{{person:謝奇|謝奇}}をして{{place:蘄春|蘄春}}{{office:典農|典農}}と為し、{{place:皖|皖}}の田郷に屯し、数しば辺寇を為さしむ。{{person:呂蒙|蒙}}は人をして之を誘わしむるに、従わざれば、則ち隙を伺いて襲撃し、{{person:謝奇|奇}}は遂に縮退し、其の部伍の{{person:孫子才|孫子才}}・{{person:宋豪|宋豪}}等、皆な老弱を携負し、{{person:呂蒙|蒙}}に詣りて降る。後に{{person:孫権|権}}に従いて{{person:曹操|曹公}}を{{place:濡須|濡須}}に拒み、数しば奇計を進め、又た{{person:孫権|権}}に水口を夾みて塢を立てんことを勧め、備禦する所以甚だ精しく、", "translation_tagged": "魏は{{place:廬江|廬江}}の{{person:謝奇|謝奇}}を{{place:蘄春|蘄春}}{{office:典農|典農}}とし、{{place:皖|皖}}の田郷に駐屯させて、たびたび国境を荒らさせた。{{person:呂蒙|呂蒙}}は人をやって彼を帰順に誘わせたが、従わなかったため、隙をうかがって襲撃すると、{{person:謝奇|謝奇}}はついに退却し、その配下の{{person:孫子才|孫子才}}・{{person:宋豪|宋豪}}らは、みな老人や幼弱の家族を引き連れて、{{person:呂蒙|呂蒙}}のもとへ赴き降伏した。のちに{{person:孫権|孫権}}に従って{{person:曹操|曹公}}を{{place:濡須|濡須}}に拒み、たびたび奇計を進言し、さらに{{person:孫権|孫権}}に水口を挟んで塢を築くよう勧め、防備の手立てはきわめて精緻を極め、"}, {"id": "v54_p24_2", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 24, "type": "裴注", "raw_text": "《吳錄》曰：權欲作塢，諸將皆曰：「上岸擊賊，洗足入船，何用塢為？」呂蒙曰：「兵有利鈍，戰無百勝，如有邂逅，敵步騎蹙人，不暇及水，其得入船乎？」權曰：「善。」遂作之。", "kakikudashi": "『呉録』に曰く、権は塢を作らんと欲するに、諸将皆な曰く、「岸に上りて賊を撃ち、足を洗いて船に入る、何ぞ塢を用いて為さん」と。呂蒙曰く、「兵に利鈍有り、戦に百勝無し、如し邂逅有りて、敵の歩騎人を蹙め、水に及ぶに暇あらずんば、其れ船に入るを得んや」と。権曰く、「善し」と。遂に之を作る、と。", "translation": "『呉録』にいう、孫権が塢を築こうとしたとき、諸将はみな「岸に上がって賊を撃ち、足を洗って船に乗り込めばよいのですから、どうして塢などを用いる必要がありましょうか」と言った。呂蒙は言った、「戦には順調なときも難渋するときもあり、百戦百勝ということはありませぬ、もし万一の事態が起こり、敵の歩兵や騎兵が味方を追い詰めて、水辺にたどり着く暇もなかったならば、はたして船に乗り込むことができましょうか」と。孫権は「もっともだ」と言った。こうしてこれを築いた、と。", "persons": "孫権, 呂蒙", "places": "", "era_year": "建安17年〜18年（212〜213）", "source_book": "『呉録』", "keywords": "呉録", "raw_tagged": "《{{special:呉録|吳錄}}》曰：{{person:孫権|權}}欲作塢，諸將皆曰：「上岸擊賊，洗足入船，何用塢為？」{{person:呂蒙|呂蒙}}曰：「兵有利鈍，戰無百勝，如有邂逅，敵步騎蹙人，不暇及水，其得入船乎？」{{person:孫権|權}}曰：「善。」遂作之。", "kakikudashi_tagged": "『{{special:呉録|呉録}}』に曰く、{{person:孫権|権}}は塢を作らんと欲するに、諸将皆な曰く、「岸に上りて賊を撃ち、足を洗いて船に入る、何ぞ塢を用いて為さん」と。{{person:呂蒙|呂蒙}}曰く、「兵に利鈍有り、戦に百勝無し、如し邂逅有りて、敵の歩騎人を蹙め、水に及ぶに暇あらずんば、其れ船に入るを得んや」と。{{person:孫権|権}}曰く、「善し」と。遂に之を作る、と。", "translation_tagged": "『{{special:呉録|呉録}}』にいう、{{person:孫権|孫権}}が塢を築こうとしたとき、諸将はみな「岸に上がって賊を撃ち、足を洗って船に乗り込めばよいのですから、どうして塢などを用いる必要がありましょうか」と言った。{{person:呂蒙|呂蒙}}は言った、「戦には順調なときも難渋するときもあり、百戦百勝ということはありませぬ、もし万一の事態が起こり、敵の歩兵や騎兵が味方を追い詰めて、水辺にたどり着く暇もなかったならば、はたして船に乗り込むことができましょうか」と。{{person:孫権|孫権}}は「もっともだ」と言った。こうしてこれを築いた、と。"}, {"id": "v54_p24_3", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 24, "type": "本文", "raw_text": "曹公不能下而退。", "kakikudashi": "曹公は下す能わずして退く。", "translation": "曹公は攻め落とすことができずに退却した。", "persons": "曹操", "places": "", "era_year": "建安18年（213）", "source_book": "", "keywords": "", "raw_tagged": "{{person:曹操|曹公}}不能下而退。", "kakikudashi_tagged": "{{person:曹操|曹公}}は下す能わずして退く。", "translation_tagged": "{{person:曹操|曹公}}は攻め落とすことができずに退却した。"}, {"id": "v54_p25_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 25, "type": "本文", "raw_text": "曹公遣朱光為廬江太守，屯皖，大開稻田，又令間人招誘鄱陽賊帥，使作內應。蒙曰：「皖田肥美，若一收孰，彼眾必增，如是數歲，操態見矣，宜早除之。」乃具陳其狀。於是權親征皖，引見諸將，問以計策。", "kakikudashi": "曹公は朱光を遣わして廬江太守と為し、皖に屯して、大いに稲田を開き、又た間人をして鄱陽の賊帥を招誘し、内応を作さしむ。蒙曰く、「皖の田は肥美なれば、若し一たび収孰せば、彼の衆は必ず増し、是くの如くすること数歳ならば、操の態見われん、宜しく早く之を除くべし」と。乃ち具さに其の状を陳ぶ。是に於いて権は親ら皖を征し、諸将を引見し、問うに計策を以てす。", "translation": "曹公は朱光を派遣して廬江太守とし、皖に駐屯させて、大規模に水田を切り開かせ、さらに間者に命じて鄱陽の賊帥を誘い入れ、内応させようとした。呂蒙は「皖の耕地は肥沃でありますから、もしひとたび収穫を上げれば、かの軍勢は必ず増大し、このような状態が数年続けば、曹操の勢威がいよいよ現れ出るでありましょう、早めにこれを取り除くべきです」と言った。そこでつぶさにその実情を述べた。こうして孫権は自ら皖を征討し、諸将を引見して、計策を諮問した。", "persons": "曹操, 朱光, 呂蒙, 孫権", "places": "廬江, 皖, 鄱陽", "era_year": "建安19年（214）", "source_book": "", "keywords": "太守", "raw_tagged": "{{person:曹操|曹公}}遣{{person:朱光|朱光}}為{{place:廬江|廬江}}{{office:太守|太守}}，屯{{place:皖|皖}}，大開稻田，又令間人招誘{{place:鄱陽|鄱陽}}賊帥，使作內應。{{person:呂蒙|蒙}}曰：「{{place:皖|皖}}田肥美，若一收孰，彼眾必增，如是數歲，{{person:曹操|操}}態見矣，宜早除之。」乃具陳其狀。於是{{person:孫権|權}}親征{{place:皖|皖}}，引見諸將，問以計策。", "kakikudashi_tagged": "{{person:曹操|曹公}}は{{person:朱光|朱光}}を遣わして{{place:廬江|廬江}}{{office:太守|太守}}と為し、{{place:皖|皖}}に屯して、大いに稲田を開き、又た間人をして{{place:鄱陽|鄱陽}}の賊帥を招誘し、内応を作さしむ。{{person:呂蒙|蒙}}曰く、「{{place:皖|皖}}の田は肥美なれば、若し一たび収孰せば、彼の衆は必ず増し、是くの如くすること数歳ならば、{{person:曹操|操}}の態見われん、宜しく早く之を除くべし」と。乃ち具さに其の状を陳ぶ。是に於いて{{person:孫権|権}}は親ら{{place:皖|皖}}を征し、諸将を引見し、問うに計策を以てす。", "translation_tagged": "{{person:曹操|曹公}}は{{person:朱光|朱光}}を派遣して{{place:廬江|廬江}}{{office:太守|太守}}とし、{{place:皖|皖}}に駐屯させて、大規模に水田を切り開かせ、さらに間者に命じて{{place:鄱陽|鄱陽}}の賊帥を誘い入れ、内応させようとした。{{person:呂蒙|呂蒙}}は「{{place:皖|皖}}の耕地は肥沃でありますから、もしひとたび収穫を上げれば、かの軍勢は必ず増大し、このような状態が数年続けば、{{person:曹操|曹操}}の勢威がいよいよ現れ出るでありましょう、早めにこれを取り除くべきです」と言った。そこでつぶさにその実情を述べた。こうして{{person:孫権|孫権}}は自ら{{place:皖|皖}}を征討し、諸将を引見して、計策を諮問した。"}, {"id": "v54_p25_2", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 25, "type": "裴注", "raw_text": "《吳書》曰：諸將皆勸作土山，添攻具，蒙趨進曰：「治攻具及土山，必歷日乃成，城備既脩，外救必至，不可圖也。且乘雨水以入，若留經日，水必向盡，還道艱難，蒙竊危之。今觀此城，不能甚固，以三軍銳氣，四面並攻，不移時可拔，及水以歸，全勝之道也。」權從之。", "kakikudashi": "『呉書』に曰く、諸将は皆な土山を作り、攻具を添えんことを勧むるに、蒙は趨り進みて曰く、「攻具及び土山を治むれば、必ず日を歴て乃ち成り、城備既に脩まり、外救必ず至りて、図るべからざるなり。且つ雨水に乗じて以て入りたれば、若し留まりて日を経ば、水は必ず尽くるに向かい、還道は艱難にして、蒙は竊かに之を危ぶむ。今、此の城を観るに、甚だしくは固きこと能わず、三軍の鋭気を以て、四面より並び攻むれば、時を移さずして抜くべく、水に及びて以て帰るは、全勝の道なり」と。権は之に従う、と。", "translation": "『呉書』にいう、諸将はみな土山を築き、攻城具を増やすよう勧めたが、呂蒙は小走りに進み出て言った、「攻城具や土山を整えようとすれば、必ず日数を費やしてようやく完成することになり、その間に城の防備は整えられ、外部からの救援も必ず到着して、攻略できなくなります。そのうえ増水に乗じて進入してまいりましたから、もし留まって日数を重ねれば、水量は必ず引きはじめ、帰路は困難を極めることになり、呂蒙はひそかにこれを危惧しております。いまこの城を見ますに、さほど堅固ではありませぬから、三軍の鋭気をもって四方から一斉に攻めかかれば、時を移さず陥落させることができ、水があるうちに帰還することこそ、全勝の道であります」と。孫権はこれに従った、と。", "persons": "呂蒙, 孫権", "places": "", "era_year": "建安19年（214）", "source_book": "『呉書』", "keywords": "呉書", "raw_tagged": "《{{special:呉書|吳書}}》曰：諸將皆勸作土山，添攻具，{{person:呂蒙|蒙}}趨進曰：「治攻具及土山，必歷日乃成，城備既脩，外救必至，不可圖也。且乘雨水以入，若留經日，水必向盡，還道艱難，{{person:呂蒙|蒙}}竊危之。今觀此城，不能甚固，以三軍銳氣，四面並攻，不移時可拔，及水以歸，全勝之道也。」{{person:孫権|權}}從之。", "kakikudashi_tagged": "『{{special:呉書|呉書}}』に曰く、諸将は皆な土山を作り、攻具を添えんことを勧むるに、{{person:呂蒙|蒙}}は趨り進みて曰く、「攻具及び土山を治むれば、必ず日を歴て乃ち成り、城備既に脩まり、外救必ず至りて、図るべからざるなり。且つ雨水に乗じて以て入りたれば、若し留まりて日を経ば、水は必ず尽くるに向かい、還道は艱難にして、{{person:呂蒙|蒙}}は竊かに之を危ぶむ。今、此の城を観るに、甚だしくは固きこと能わず、三軍の鋭気を以て、四面より並び攻むれば、時を移さずして抜くべく、水に及びて以て帰るは、全勝の道なり」と。{{person:孫権|権}}は之に従う、と。", "translation_tagged": "『{{special:呉書|呉書}}』にいう、諸将はみな土山を築き、攻城具を増やすよう勧めたが、{{person:呂蒙|呂蒙}}は小走りに進み出て言った、「攻城具や土山を整えようとすれば、必ず日数を費やしてようやく完成することになり、その間に城の防備は整えられ、外部からの救援も必ず到着して、攻略できなくなります。そのうえ増水に乗じて進入してまいりましたから、もし留まって日数を重ねれば、水量は必ず引きはじめ、帰路は困難を極めることになり、{{person:呂蒙|呂蒙}}はひそかにこれを危惧しております。いまこの城を見ますに、さほど堅固ではありませぬから、三軍の鋭気をもって四方から一斉に攻めかかれば、時を移さず陥落させることができ、水があるうちに帰還することこそ、全勝の道であります」と。{{person:孫権|孫権}}はこれに従った、と。"}, {"id": "v54_p25_3", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 25, "type": "本文", "raw_text": "蒙乃薦甘寧為升城督，督攻在前，蒙以精銳繼之。侵晨進攻，蒙手執枹鼓，士卒皆騰踴自升，食時破之。既而張遼至夾石，聞城已拔，乃退。權嘉其功，即拜廬江太守，所得人馬皆分與之，別賜尋陽屯田六百戶，官屬三十人。蒙還尋陽，未期而廬陵賊起，諸將討擊不能禽，權曰：「鷙鳥累百，不如一鶚。」復令蒙討之。蒙至，誅其首惡，餘皆釋放，復為平民。", "kakikudashi": "蒙は乃ち甘寧を薦めて升城督と為し、攻めを督して前に在らしめ、蒙は精鋭を以て之に継ぐ。侵晨に進み攻め、蒙は手ずから枹鼓を執り、士卒は皆な騰踴して自ら升り、食時に之を破る。既にして張遼は夾石に至り、城の已に抜かれしを聞き、乃ち退く。権は其の功を嘉し、即ち廬江太守に拝し、得る所の人馬は皆な分かちて之に与え、別に尋陽の屯田六百戸、官属三十人を賜う。蒙は尋陽に還り、未だ期ならざるに廬陵に賊起こり、諸将は討撃すれども禽にする能わず、権曰く、「鷙鳥百を累ぬるも、一鶚に如かず」と。復た蒙をして之を討たしむ。蒙は至りて、其の首悪を誅し、余は皆な釈放して、復た平民と為す。", "translation": "呂蒙はそこで甘寧を推挙して升城督とし、先陣で攻撃を指揮させ、呂蒙は精鋭を率いてその後に続いた。夜明け方に攻撃を開始すると、呂蒙は手ずからばちと陣太鼓を執って打ち鳴らし、兵士たちはみな勇み躍って自ら城壁をよじ登り、朝食の頃にはこれを攻め破った。やがて張遼が夾石まで進軍してきたが、城がすでに陥落したと聞き、引き返した。孫権はその功績を称え、ただちに廬江太守に任じ、鹵獲した人馬はすべて分け与え、これとは別に尋陽の屯田六百戸と官属三十人を賜った。呂蒙が尋陽に帰還して一年も経たないうちに廬陵で賊が蜂起し、諸将が討伐にあたったものの捕らえることができなかったため、孫権は「猛禽を百羽集めても、一羽の鶚には及ばない」と言った。そこで再び呂蒙に命じてこれを討伐させた。呂蒙は現地に到着すると、その首謀者だけを誅殺し、残りの者はすべて釈放して、再び平民に戻した。", "persons": "呂蒙, 甘寧, 張遼, 孫権", "places": "夾石_廬江, 廬江, 尋陽, 廬陵", "era_year": "建安19年（214）", "source_book": "", "keywords": "升城督, 太守", "raw_tagged": "{{person:呂蒙|蒙}}乃薦{{person:甘寧|甘寧}}為{{office:升城督|升城督}}，督攻在前，{{person:呂蒙|蒙}}以精銳繼之。侵晨進攻，{{person:呂蒙|蒙}}手執枹鼓，士卒皆騰踴自升，食時破之。既而{{person:張遼|張遼}}至{{place:夾石_廬江|夾石}}，聞城已拔，乃退。{{person:孫権|權}}嘉其功，即拜{{place:廬江|廬江}}{{office:太守|太守}}，所得人馬皆分與之，別賜{{place:尋陽|尋陽}}屯田六百戶，官屬三十人。{{person:呂蒙|蒙}}還{{place:尋陽|尋陽}}，未期而{{place:廬陵|廬陵}}賊起，諸將討擊不能禽，{{person:孫権|權}}曰：「鷙鳥累百，不如一鶚。」復令{{person:呂蒙|蒙}}討之。{{person:呂蒙|蒙}}至，誅其首惡，餘皆釋放，復為平民。", "kakikudashi_tagged": "{{person:呂蒙|蒙}}は乃ち{{person:甘寧|甘寧}}を薦めて{{office:升城督|升城督}}と為し、攻めを督して前に在らしめ、{{person:呂蒙|蒙}}は精鋭を以て之に継ぐ。侵晨に進み攻め、{{person:呂蒙|蒙}}は手ずから枹鼓を執り、士卒は皆な騰踴して自ら升り、食時に之を破る。既にして{{person:張遼|張遼}}は{{place:夾石_廬江|夾石}}に至り、城の已に抜かれしを聞き、乃ち退く。{{person:孫権|権}}は其の功を嘉し、即ち{{place:廬江|廬江}}{{office:太守|太守}}に拝し、得る所の人馬は皆な分かちて之に与え、別に{{place:尋陽|尋陽}}の屯田六百戸、官属三十人を賜う。{{person:呂蒙|蒙}}は{{place:尋陽|尋陽}}に還り、未だ期ならざるに{{place:廬陵|廬陵}}に賊起こり、諸将は討撃すれども禽にする能わず、{{person:孫権|権}}曰く、「鷙鳥百を累ぬるも、一鶚に如かず」と。復た{{person:呂蒙|蒙}}をして之を討たしむ。{{person:呂蒙|蒙}}は至りて、其の首悪を誅し、余は皆な釈放して、復た平民と為す。", "translation_tagged": "{{person:呂蒙|呂蒙}}はそこで{{person:甘寧|甘寧}}を推挙して{{office:升城督|升城督}}とし、先陣で攻撃を指揮させ、{{person:呂蒙|呂蒙}}は精鋭を率いてその後に続いた。夜明け方に攻撃を開始すると、{{person:呂蒙|呂蒙}}は手ずからばちと陣太鼓を執って打ち鳴らし、兵士たちはみな勇み躍って自ら城壁をよじ登り、朝食の頃にはこれを攻め破った。やがて{{person:張遼|張遼}}が{{place:夾石_廬江|夾石}}まで進軍してきたが、城がすでに陥落したと聞き、引き返した。{{person:孫権|孫権}}はその功績を称え、ただちに{{place:廬江|廬江}}{{office:太守|太守}}に任じ、鹵獲した人馬はすべて分け与え、これとは別に{{place:尋陽|尋陽}}の屯田六百戸と官属三十人を賜った。{{person:呂蒙|呂蒙}}が{{place:尋陽|尋陽}}に帰還して一年も経たないうちに{{place:廬陵|廬陵}}で賊が蜂起し、諸将が討伐にあたったものの捕らえることができなかったため、{{person:孫権|孫権}}は「猛禽を百羽集めても、一羽の鶚には及ばない」と言った。そこで再び{{person:呂蒙|呂蒙}}に命じてこれを討伐させた。{{person:呂蒙|呂蒙}}は現地に到着すると、その首謀者だけを誅殺し、残りの者はすべて釈放して、再び平民に戻した。"}, {"id": "v54_p26_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 26, "type": "本文", "raw_text": "是時劉備令關羽鎮守，專有荊土，權命蒙西取長沙、零、桂三郡。蒙移書二郡，望風歸服，惟零陵太守郝普城守不降。而備自蜀親至公安，遣羽爭三郡。權時住陸口，使魯肅萬人屯益陽拒羽，而飛書召蒙，使捨零陵，急還助肅。初，蒙既定長沙，當之零陵，過酃，載南陽鄧玄之，玄之者郝普之舊也，欲令誘普。及被書當還，蒙秘之。夜召諸將，授以方畧，晨當攻城。顧謂玄之曰：「郝子太聞世間有忠義事，亦欲為之，而不知時也。左將軍在漢中，為夏侯淵所圍。關羽在南郡，今至尊身自臨之。近者破樊本屯，救酃，逆為孫規所破。此皆目前之事，君所親見也。彼方首尾倒懸，救死不給，豈有餘力復營此哉？今吾士卒精銳，人思致命。至尊遣兵，相繼於道。今子太以旦夕之命，待不可望之救。猶牛蹄中魚，冀賴江漢，其不可恃亦明矣。若子太必能一士卒之心，保孤城之守，尚能稽延旦夕，以待所歸者，可也。今吾計力度慮，而以攻此，曾不移日，而城必破，城破之後，身死何益於事，而令百歲老母，戴白受誅，豈不痛哉？度此家不得外問，謂援可恃，故至於此耳。君可見之，為陳禍福。」玄之見普，具宣蒙意，普懼而聽之。玄之先出報蒙：「普尋後當至。」蒙豫敕四將，各選百人，普出，便入守城門。須臾普出，蒙迎執其手，與俱下船。語畢，出書示之。因拊手大笑。普見書，知備在公安，而羽在益陽，慚恨入地。蒙留孫河，委以後事，即日引軍赴益陽。劉備請盟，權乃歸普等。割湘水，以零陵還之。以尋陽、陽新為蒙奉邑。", "kakikudashi": "是の時、劉備は関羽をして鎮守せしめ、専ら荊土を有すれば、権は蒙に命じて西のかた長沙・零・桂の三郡を取らしむ。蒙の書を二郡に移すや、風を望みて帰服するも、惟だ零陵太守の郝普のみ城守して降らず。而して備は蜀より親ら公安に至り、羽を遣わして三郡を争わしむ。権は時に陸口に住まり、魯粛をして万人をもて益陽に屯して羽を拒ましめ、書を飛ばして蒙を召し、零陵を捨てて、急ぎ還りて粛を助けしむ。初め、蒙は既に長沙を定め、零陵に之くに当たり、酃を過ぐるや、南陽の鄧玄之を載す、玄之なる者は郝普の旧なり、普を誘わしめんと欲すればなり。書を被りて当に還るべきに及び、蒙は之を秘す。夜に諸将を召し、授くるに方畧を以てし、晨に当に城を攻むべしとす。玄之を顧み謂いて曰く、「郝子太は世間に忠義の事有るを聞き、亦た之を為さんと欲すれども、時を知らざるなり。左将軍は漢中に在りて、夏侯淵の囲む所と為る。関羽は南郡に在りて、今、至尊身ら自ら之に臨む。近ごろ樊本の屯を破り、酃を救わんとするも、逆に孫規の破る所と為る。此れ皆な目前の事にして、君の親しく見る所なり。彼は方に首尾倒懸し、死を救うに給あらず、豈に余力の復た此れを営む有らんや。今、吾が士卒は精鋭にして、人は命を致さんことを思う。至尊の兵を遣わすこと、道に相い継ぐ。今、子太は旦夕の命を以て、望むべからざるの救いを待つ。猶お牛蹄の中の魚の、江漢に頼らんことを冀うがごとく、其の恃むべからざること亦た明らかなり。若し子太の必ず能く士卒の心を一にし、孤城の守りを保ち、尚お能く旦夕を稽延し、以て帰する所を待たば、可なり。今、吾は力を計り慮を度りて、以て此れを攻むれば、曾て日を移さずして、城は必ず破れん、城破るるの後、身死するも事に何の益か有らん、而も百歳の老母をして、白を戴きて誅を受けしむるは、豈に痛ましからずや。此の家の外問を得ず、援け恃むべしと謂うを度るに、故に此に至るのみ。君、之に見ゆべし、為に禍福を陳べよ」と。玄之、普に見え、具さに蒙の意を宣ぶれば、普は懼れて之を聴く。玄之は先に出でて蒙に報ずらく、「普は尋いで後に当に至るべし」と。蒙は豫め四将に敕し、各おの百人を選ばしめ、普の出でなば、便ち入りて城門を守らしむ。須臾にして普の出ずれば、蒙は迎えて其の手を執り、与に倶に船に下る。語り畢りて、書を出だして之に示す。因りて手を拊ちて大いに笑う。普は書を見て、備の公安に在り、羽の益陽に在るを知り、慚恨して地に入らんとす。蒙は孫河を留め、委ぬるに後事を以てし、即日、軍を引きて益陽に赴く。劉備は盟いを請い、権は乃ち普等を帰す。湘水を割き、零陵を以て之に還す。尋陽・陽新を以て蒙の奉邑と為す。", "translation": "このとき、劉備は関羽に命じて鎮守させ、荊州の地を独占していたため、孫権は呂蒙に命じて西方の長沙・零陵・桂陽の三郡を奪取させた。呂蒙が二郡に檄文を送ると、威風を望み見て帰服したが、ただ零陵太守の郝普だけは籠城して降伏しなかった。すると劉備は蜀から自ら公安へ乗り込み、関羽を遣わして三郡を争わせた。孫権はこのとき陸口に駐在しており、魯粛に一万人を率いて益陽に駐屯し関羽を拒ませるとともに、急使の書簡を飛ばして呂蒙を召し還し、零陵を放棄して急ぎ引き返し魯粛を援護するよう命じた。これより先、呂蒙はすでに長沙を平定し、零陵へ向かうにあたり、酃県を通りかかった際、南陽の鄧玄之を同行させていたが、玄之という人物は郝普の旧友であったため、郝普を帰順に誘わせようと考えたのであった。帰還を命じる書簡を受け取ると、呂蒙はこれを秘密にした。夜に諸将を召し集めて方略を授け、夜明けとともに城を攻める手はずとした。そして玄之を振り返って言った、「郝子太は世の中に忠義という行いがあることを聞き知り、自分もそれを成し遂げようと望んでいるが、時勢というものを弁えていない。左将軍は漢中にあって、夏侯淵に包囲されている。関羽は南郡におり、いま至尊がみずからその地に臨んでおられる。ちかごろ樊本の屯営を打ち破り、酃県を救援しようとした敵も、逆に孫規に撃破された。これらはすべて目の前の出来事であり、貴公が親しく目にしたところである。かの陣営はいまや前後とも逆さ吊りのような苦境に陥り、自らの死を救うことすら手が回らない有様であるのに、どうして再びここを救援する余力などあろうか。いま我が軍の将兵は精鋭であり、みな命を捧げて戦おうと願っている。至尊が派遣される援軍も、街道に引きも切らず続いている。いま子太は旦夕に迫った命運でありながら、望むべくもない救援を心待ちにしている。それはあたかも牛の蹄の窪みにたまった水の中の魚が、長江や漢水の水に頼ろうと望むようなもので、頼みにできないことはあまりにも明らかである。もし子太が確実に兵士たちの心を一つに束ね、孤城の守りを保って、なお朝夕の間だけでも持ちこたえ、帰趨を見極められるというのであれば、それでもよかろう。しかし、いま私が戦力を計算し思慮をめぐらしてここを攻めれば、一日もかからぬうちに城は必ず陥落するし、城が落ちたのちにわが身が死んだところで事態に何の益があろうか、そればかりか百歳になる老母に白髪を頂いたまま誅殺を受けさせることになり、なんと痛ましいことではないか。察するにこの御仁は外部の情勢を知ることができず、援軍を頼みにできると思い込んでいるがゆえに、かような仕儀に立ち至っているにすぎない。貴公は彼に面会し、そのために禍福の道理を説いてやるがよい」と。玄之が郝普に面会し、つぶさに呂蒙の意向を伝えると、郝普は恐れてこれを受け入れた。玄之は先に城を出て呂蒙に「郝普もまもなく後から参るはずです」と報告した。呂蒙はあらかじめ四人の部将に命じて、それぞれ百人を選抜させ、郝普が出てきたら、ただちに城内へ入って城門を押さえさせることとした。まもなく郝普が城を出ると、呂蒙は出迎えてその手を取り、ともに船へ乗り込んだ。話が終わると、例の書簡を取り出して彼に見せた。そして手を打ち鳴らして大笑いした。郝普は書簡を見て、劉備が公安におり、関羽が益陽にいることを知り、恥じ入って恨みつつ地にもぐり込みたい思いであった。呂蒙は孫河を留めて後事を委ね、その日のうちに軍を引き揚げて益陽へ急行した。劉備が盟約を請うたため、孫権は郝普らを送還した。湘水を割いて境界とし、零陵を返還した。そして尋陽・陽新を呂蒙の奉邑とした。", "persons": "劉備, 関羽, 孫権, 呂蒙, 郝普, 魯粛, 鄧玄之, 夏侯淵, 樊本, 孫規, 孫河", "places": "荊州, 長沙, 零陵, 桂陽, 蜀, 公安, 陸口, 益陽, 酃, 南陽, 漢中, 南郡, 長江, 漢水, 湘水, 尋陽, 陽新", "era_year": "建安20年（215）", "source_book": "", "keywords": "太守, 左将軍, 奉邑", "raw_tagged": "是時{{person:劉備|劉備}}令{{person:関羽|關羽}}鎮守，專有{{place:荊州|荊土}}，{{person:孫権|權}}命{{person:呂蒙|蒙}}西取{{place:長沙|長沙}}、{{place:零陵|零}}、{{place:桂陽|桂}}三郡。{{person:呂蒙|蒙}}移書二郡，望風歸服，惟{{place:零陵|零陵}}{{office:太守|太守}}{{person:郝普|郝普}}城守不降。而{{person:劉備|備}}自{{place:蜀|蜀}}親至{{place:公安|公安}}，遣{{person:関羽|羽}}爭三郡。{{person:孫権|權}}時住{{place:陸口|陸口}}，使{{person:魯粛|魯肅}}萬人屯{{place:益陽|益陽}}拒{{person:関羽|羽}}，而飛書召{{person:呂蒙|蒙}}，使捨{{place:零陵|零陵}}，急還助{{person:魯粛|肅}}。初，{{person:呂蒙|蒙}}既定{{place:長沙|長沙}}，當之{{place:零陵|零陵}}，過{{place:酃|酃}}，載{{place:南陽|南陽}}{{person:鄧玄之|鄧玄之}}，{{person:鄧玄之|玄之}}者{{person:郝普|郝普}}之舊也，欲令誘{{person:郝普|普}}。及被書當還，{{p  "本文", "raw_text": "師還，遂征合肥，既撤兵，為張遼等所襲，蒙與淩統以死扦衛。後曹公又大出濡須，權以蒙為督，據前所立塢，置強弩萬張於其上，以拒曹公。曹公前鋒屯未就，蒙攻破之，曹公引退。拜蒙左護軍、虎威將軍。", "kakikudashi": "師還り、遂に合肥を征するも、既に兵を撤するや、張遼等の襲う所と為り、蒙は凌統と死を以て扦衛す。後に曹公又た大いに濡須に出ずるや、権は蒙を以て督と為し、前に立つる所の塢に拠り、強弩万張を其の上に置きて、以て曹公を拒ましむ。曹公の前鋒、屯未だ就らざるに、蒙は攻めて之を破り、曹公は引きて退く。蒙を左護軍・虎威将軍に拝す。", "translation": "軍が帰還すると、そのまま合肥を征討したが、撤兵にあたって張遼らの襲撃を受け、呂蒙は凌統とともに死力を尽くして防ぎ守った。のちに曹公が再び大軍を率いて濡須へ出撃してくると、孫権は呂蒙を督とし、以前に築いた塢に拠って、その上に強弩一万張を配備し、曹公を防がせた。曹公の先鋒がまだ陣営を築き終えないうちに、呂蒙が攻めかかってこれを打ち破ると、曹公は兵を引いて退却した。呂蒙を左護軍・虎威将軍に任じた。", "persons": "張遼, 呂蒙, 凌統, 曹操, 孫権", "places": "合肥, 濡須", "era_year": "建安20年〜22年（215〜217）", "source_book": "", "keywords": "左護軍, 虎威将軍", "raw_tagged": "師還，遂征{{place:合肥|合肥}}，既撤兵，為{{person:張遼|張遼}}等所襲，{{person:呂蒙|蒙}}與{{person:凌統|淩統}}以死扦衛。後{{person:曹操|曹公}}又大出{{place:濡須|濡須}}，{{person:孫権|權}}以{{person:呂蒙|蒙}}為督，據前所立塢，置強弩萬張於其上，以拒{{person:曹操|曹公}}。{{person:曹操|曹公}}前鋒屯未就，{{person:呂蒙|蒙}}攻破之，{{person:曹操|曹公}}引退。拜{{person:呂蒙|蒙}}{{office:左護軍|左護軍}}、{{office:虎威将軍|虎威將軍}}。", "kakikudashi_tagged": "師還り、遂に{{place:合肥|合肥}}を征するも、既に兵を撤するや、{{person:張遼|張遼}}等の襲う所と為り、{{person:呂蒙|蒙}}は{{person:凌統|凌統}}と死を以て扦衛す。後に{{person:曹操|曹公}}又た大いに{{place:濡須|濡須}}に出ずるや、{{person:孫権|権}}は{{person:呂蒙|蒙}}を以て督と為し、前に立つる所の塢に拠り、強弩万張を其の上に置きて、以て{{person:曹操|曹公}}を拒ましむ。{{person:曹操|曹公}}の前鋒、屯未だ就らざるに、{{person:呂蒙|蒙}}は攻めて之を破り、{{person:曹操|曹公}}は引きて退く。{{person:呂蒙|蒙}}を{{office:左護軍|左護軍}}・{{office:虎威将軍|虎威将軍}}に拝す。", "translation_tagged": "軍が帰還すると、そのまま{{place:合肥|合肥}}を征討したが、撤兵にあたって{{person:張遼|張遼}}らの襲撃を受け、{{person:呂蒙|呂蒙}}は{{person:凌統|凌統}}とともに死力を尽くして防ぎ守った。のちに{{person:曹操|曹公}}が再び大軍を率いて{{place:濡須|濡須}}へ出撃してくると、{{person:孫権|孫権}}は{{person:呂蒙|呂蒙}}を督とし、以前に築いた塢に拠って、その上に強弩一万張を配備し、{{person:曹操|曹公}}を防がせた。{{person:曹操|曹公}}の先鋒がまだ陣営を築き終えないうちに、{{person:呂蒙|呂蒙}}が攻めかかってこれを打ち破ると、{{person:曹操|曹公}}は兵を引いて退却した。{{person:呂蒙|呂蒙}}を{{office:左護軍|左護軍}}・{{office:虎威将軍|虎威将軍}}に任じた。"}, {"id": "v54_p28_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 28, "type": "本文", "raw_text": "魯肅卒，蒙西屯陸口，肅軍人馬萬餘盡以屬蒙。又拜漢昌太守，食下雋、劉陽、漢昌、州陵。與關羽分土接境，知羽驍雄，有並兼心，且居國上流，其勢難久。初，魯肅等以為曹公尚存，禍難始構，宜相輔協，與之同仇，不可失也。蒙乃密陳計策曰：「今令征虜守南郡，潘璋住白帝，蔣欽將遊兵萬人循江上下，應敵所在，蒙為國家前據襄陽，如此，何憂於操，何賴於羽？且羽君臣，矜其詐力，所在反覆，不可以腹心待也。今羽所以未便東向者，以至尊聖明，蒙等尚存也。今不於強壯時圖之，一旦僵仆，欲復陳力，其可得邪？」權深納其策，又聊復與論取徐州意。蒙對曰：「今操遠在河北，新破諸袁，撫集幽、冀，未暇東顧。徐土守兵，聞不足言，往自可克。然地勢陸通，驍騎所騁，至尊今日得徐州，操後旬必來爭，雖以七八萬人守之，猶當懷憂。不如取羽，全據長江，形勢益張。」權尤以此言為當。及蒙代肅，初至陸口，外倍修恩厚，與羽結好。", "kakikudashi": "魯粛卒し、蒙は西のかた陸口に屯し、粛の軍の人馬万余は尽く以て蒙に属す。又た漢昌太守に拝せられ、下雋・劉陽・漢昌・州陵を食む。関羽と土を分かち境を接するも、羽の驍雄にして、並兼の心有り、且つ国の上流に居れば、其の勢い久しきこと難きを知る。初め、魯粛等は以為えらく、曹公尚お存し、禍難始めて構うれば、宜しく相い輔協し、之と仇を同じくすべく、失うべからざるなり、と。蒙は乃ち密かに計策を陳べて曰く、「今、征虜をして南郡を守らしめ、潘璋は白帝に住まり、蔣欽は遊兵万人を将いて江に循いて上下し、敵の所在に応じ、蒙は国家の為に前みて襄陽に拠らば、此くの如くにして、何ぞ操を憂え、何ぞ羽に頼らんや。且つ羽の君臣は、其の詐力を矜り、所在に反覆すれば、腹心を以て待つべからざるなり。今、羽の未だ便ち東向せざる所以の者は、至尊の聖明にして、蒙等の尚お存するを以てなり。今、強壮の時に於いて之を図らずんば、一旦僵仆して、復た力を陳べんと欲するも、其れ得べけんや」と。権は深く其の策を納れ、又た聊か復た与に徐州を取るの意を論ず。蒙対えて曰く、「今、操は遠く河北に在り、新たに諸袁を破り、幽・冀を撫集し、未だ東を顧みるに暇あらず。徐土の守兵は、聞くに言うに足らざれば、往かば自ずから克つべし。然れども地勢は陸通し、驍騎の騁する所なれば、至尊今日徐州を得るも、操は後旬に必ず来たり争わん、七八万人を以て之を守ると雖も、猶お当に憂いを懐くべし。如かず、羽を取りて、全く長江に拠らば、形勢は益ます張らん」と。権は尤も此の言を以て当と為す。蒙の粛に代わり、初めて陸口に至るに及び、外には倍ます恩厚を修め、羽と好みを結ぶ。", "translation": "魯粛が死去すると、呂蒙は西方の陸口に駐屯し、魯粛の軍の人馬一万余りはすべて呂蒙に配属された。さらに漢昌太守に任じられ、下雋・劉陽・漢昌・州陵を食邑とした。関羽と領域を分け合って国境を接したが、関羽が勇猛な傑物で併呑の野心を抱いており、しかもわが国の上流に位置していることから、その関係が長くは続きがたいことを知っていた。はじめ、魯粛らは、曹公がなお健在で禍難が構えられたばかりであるから、互いに協力し助け合い、彼と共通の敵にあたるべきであって、誼を失ってはならないと考えていた。そこで呂蒙は密かに計策を述べて言った、「いま征虜に南郡を守らせ、潘璋を白帝に駐屯させ、蔣欽に遊撃兵一万人を率いて長江に沿って上下し敵のいる所へ即応させ、呂蒙が国家のために前進して襄陽を占拠すれば、このようにして、どうして曹操を憂え、どうして関羽に頼る必要がありましょうか。それに関羽ら君臣は、おのれの詐略と武力を誇り、いたる所で表裏常なき振る舞いをしており、腹心の友として遇することはできませぬ。いま関羽がすぐには東へ軍を向けないのは、至尊が聖明であられ、呂蒙らがなお健在だからであります。いま我らが強壮なうちにこれを図らなければ、ひとたび倒れ伏したのち、再び力を尽くそうと願っても、どうして叶いましょうか」と。孫権は深くその策を受け入れ、さらにまた試みに徐州を取る意向について議論を交わした。呂蒙は答えて言った、「いま曹操は遠く河北にあり、諸袁を打ち破ったばかりで、幽州・冀州を鎮撫・収攬しており、まだ東方を顧みる暇がありませぬ。徐土の守備兵は、聞くところでは問題にするにも足りないほどですから、赴けばおのずと攻め勝てましょう。しかしながら地勢は陸続きで、精強な騎兵が縦横に駆け巡る土地柄でありますから、至尊が今日徐州を手に入れられても、曹操は十日も経たぬうちに必ず奪い返しに来るはずであり、たとえ七、八万人をもって守ったとしても、なお憂いを抱くことになりましょう。それよりも関羽を討ち取って、長江全域を完全に掌握なさるに越したことはなく、そうすれば勢威はいよいよ張り広がるでありましょう」と。孫権はとりわけこの言葉を妥当であるとした。呂蒙が魯粛の後任となって初めて陸口に到着すると、外面ではひときわ恩義と厚情を尽くし、関羽と友好を結んだ。", "persons": "魯 関羽|関羽}}を討ち取って、{{place:長江|長江}}全域を完全に掌握なさるに越したことはなく、そうすれば勢威はいよいよ張り広がるでありましょう」と。{{person:孫権|孫権}}はとりわけこの言葉を妥当であるとした。{{person:呂蒙|呂蒙}}が{{person:魯粛|魯粛}}の後任となって初めて{{place:陸口|陸口}}に到着すると、外面ではひときわ恩義と厚情を尽くし、{{person:関羽|関羽}}と友好を結んだ。"}, {"id": "v54_p29_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 29, "type": "本文", "raw_text": "後羽討樊，留兵將備公安、南郡。蒙上疏曰：「羽討樊而多留備兵，必恐蒙圖其後故也。蒙常有病，乞分士眾還建業，以治疾為名。羽聞之，必撤備兵，盡赴襄陽。大軍浮江，晝夜馳上，襲其空虛，則南郡可下，而羽可擒也。」遂稱病篤，權乃露檄召蒙還，陰與圖計。羽果信之，稍撤兵以赴樊。魏使于禁救樊，羽盡擒禁等，人馬數萬，託以糧乏，擅取湘關米。權聞之，遂行。先遣蒙在前。蒙至尋陽，盡伏其精兵𦩷𦪇中，使白衣搖櫓，作商賈人服，晝夜兼行，至羽所置江邊屯候，盡收縛之，是故羽不聞知。遂到南郡，士仁、麋芳皆降。", "kakikudashi": "後に羽は樊を討ち、兵将を留めて公安・南郡に備えしむ。蒙は上疏して曰く、「羽は樊を討ちて多く備兵を留むるは、必ず蒙の其の後を図らんことを恐るるが故なり。蒙は常に病有り、乞うらくは士衆を分かちて建業に還し、疾を治むるを以て名と為さんことを。羽之を聞かば、必ず備兵を撤して、尽く襄陽に赴かん。大軍もて江に浮かび、昼夜馳せ上りて、其の空虚を襲わば、則ち南郡は下すべくして、羽は擒にすべきなり」と。遂に病篤しと称し、権は乃ち露檄して蒙を召し還し、陰かに与に計を図る。羽は果たして之を信じ、稍く兵を撤して以て樊に赴かしむ。魏は于禁をして樊を救わしむるに、羽は尽く禁等を擒にし、人馬数万、託するに糧の乏しきを以てし、擅ままに湘関の米を取る。権之を聞き、遂に行く。先ず蒙を遣わして前に在らしむ。蒙は尋陽に至り、尽く其の精兵を𦩷𦪇の中に伏せ、白衣をして櫓を揺がしめ、商賈人の服を作さしめ、昼夜兼行し、羽の置く所の江辺の屯候に至りて、尽く之を収縛す、是の故に羽は聞知せず。遂に南郡に到れば、士仁・麋芳は皆な降る。", "translation": "のちに関羽は樊を討つにあたり、兵と部将を残して公安・南郡の守備にあたらせた。呂蒙は上疏して言った、「関羽が樊を討ちながら多くの守備兵を残しておりますのは、必ずや呂蒙がその背後を図ることを恐れているためであります。呂蒙は日頃より持病がございますゆえ、どうか兵衆の一部を割いて建業へ帰還させ、病気療養を名目とさせてください。関羽がこれを聞けば、必ず守備兵を引き揚げて、ことごとく襄陽へ差し向けるでありましょう。そのとき大軍を長江に浮かべて、昼夜兼行で遡上し、その手薄となった隙を奇襲すれば、南郡は陥落させることができ、関羽を生け捕りにできましょう」と。こうして病が重篤であると称すると、孫権は公開の檄文をもって呂蒙を召し還し、密かにともにはかりごとを練った。関羽は果たしてこれを信じ、次第に兵を引き揚げて樊へ向かわせた。魏が于禁を遣わして樊を救援させると、関羽は于禁らをことごとく生け捕りにし、人馬数万を抱えることとなったため、兵糧の不足を口実にして、独断で湘関の米を奪い取った。孫権はこれを聞くと、ついに出陣した。まず呂蒙を先鋒として進発させた。呂蒙は尋陽に到着すると、その精鋭兵をことごとく𦩷𦪇の船中に潜ませ、白衣の漕ぎ手に櫓を漕がせ、商人の衣服をまとわせて、昼夜を問わず進軍し、関羽が長江沿岸に設けていた見張り所に至るや、その兵を一人残らず捕らえて縛り上げたため、関羽は事態を知ることができなかった。こうして南郡に到達すると、士仁と麋芳はいずれも降伏した。", "persons": "関羽, 呂蒙, 孫権, 于禁, 士仁, 麋芳", "places": "樊, 公安, 南郡, 建業, 襄陽, 長江, 湘関, 尋陽", "era_year": "建安24年（219）", "source_book": "", "keywords": "𦩷𦪇, 白衣揺櫓", "raw_tagged": "後{{person:関羽|羽}}討{{place:樊|樊}}，留兵將備{{place:公安|公安}}、{{place:南郡|南郡}}。{{person:呂蒙|蒙}}上疏曰：「{{person:関羽|羽}}討{{place:樊|樊}}而多留備兵，必恐{{person:呂蒙 ace:南郡|南郡}}は陥落させることができ、{{person:関羽|関羽}}を生け捕りにできましょう」と。こうして病が重篤であると称すると、{{person:孫権|孫権}}は公開の檄文をもって{{person:呂蒙|呂蒙}}を召し還し、密かにともにはかりごとを練った。{{person:関羽|関羽}}は果たしてこれを信じ、次第に兵を引き揚げて{{place:樊|樊}}へ向かわせた。魏が{{person:于禁|于禁}}を遣わして{{place:樊|樊}}を救援させると、{{person:関羽|関羽}}は{{person:于禁|于禁}}らをことごとく生け捕りにし、人馬数万を抱えることとなったため、兵糧の不足を口実にして、独断で{{place:湘関|湘関}}の米を奪い取った。{{person:孫権|孫権}}はこれを聞くと、ついに出陣した。まず{{person:呂蒙|呂蒙}}を先鋒として進発させた。{{person:呂蒙|呂蒙}}は{{place:尋陽|尋陽}}に到着すると、その精鋭兵をことごとく{{special:𦩷𦪇|𦩷𦪇}}の船中に潜ませ、{{special:白衣揺櫓|白衣の漕ぎ手に櫓を漕がせ}}、商人の衣服をまとわせて、昼夜を問わず進軍し、{{person:関羽|関羽}}が{{place:長江|長江}}沿岸に設けていた見張り所に至るや、その兵を一人残らず捕らえて縛り上げたため、{{person:関羽|関羽}}は事態を知ることができなかった。こうして{{place:南郡|南郡}}に到達すると、{{person:士仁|士仁}}と{{person:麋芳|麋芳}}はいずれも降伏した。"}, {"id": "v54_p29_2", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 29, "type": "裴注", "raw_text": "《吳書》曰：將軍士仁在公安拒守，蒙令虞翻說之。翻至城門，謂守者曰：「吾欲與汝將軍語。」仁不肯相見。乃為書曰：「明者防禍於未萌，智者圖患於將來，知得知失，可與為人，知存知亡，足別吉凶。大軍之行，斥候不及施，烽火不及舉，此非天命，必有內應。將軍不先見時，時至又不應之，獨守縈帶之城而不降，死戰則毀宗滅祀，為天下譏笑。呂虎威欲徑到南郡，斷絕陸道，生路一塞，案其地形，將軍為在箕舌上耳，奔走不得免，降則失義，竊為將軍不安，幸熟思焉。」仁得書，流涕而降。翻謂蒙曰：「此譎兵也，當將仁行，留兵備城。」遂將仁至南郡。南郡太守麋芳城守，蒙以仁示之，遂降。《吳錄》曰：初，南郡城中失火，頗焚燒軍器。羽以責芳，芳內畏懼，權聞而誘之，芳潛相和。及蒙攻之，乃以牛酒出降。", "kakikudashi": "『呉書』に曰く、将軍の士仁は公安に在りて拒守し、蒙は虞翻をして之を説かしむ。翻、城門に至り、守者に謂いて曰く、「吾、汝が将軍と語らんと欲す」と。仁、相い見ゆるを肯んぜず。乃ち書を為りて曰く、「明者は禍を未萌に防ぎ、智者は患いを将来に図る、得を知り失を知れば、与に人と為すべく、存を知り亡を知れば、吉凶を別つに足る。大軍の行くや、斥候も施すに及ばず、烽火も挙ぐるに及ばざるは、此れ天命に非ざれば、必ず内応有ればなり。将軍は先に時を見ず、時至りて又た之に応ぜず、独り縈帯の城を守りて降らず、死戦せば則ち宗を毀ち祀を滅ぼし、天下の譏笑する所と為らん。呂虎威は径ちに南郡に到り、陸道を断絶せんと欲す、生路一たび塞がれば、其の地形を案ずるに、将軍は箕舌の上に在るが為きのみ、奔走するも免るるを得ず、降らば則ち義を失わん、竊かに将軍の為に安んぜず、幸わくは焉を熟思せよ」と。仁は書を得て、流涕して降る。翻、蒙に謂いて曰く、「此れ譎兵なり、当に仁を将いて行き、兵を留めて城に備うべし」と。遂に仁を将いて南郡に至る。南郡太守の麋芳は城守するも、蒙は仁を以て之に示せば、遂に降る、と。『呉録』に曰く、初め、南郡の城中に失火し、頗る軍器を焚焼す。羽は以て芳を責め、芳は内に畏懼す、権は聞きて之を誘い、芳は潜かに相い和す。蒙の之を攻むるに及び、乃ち牛酒を以て出でて降る、と。", "translation": "『呉書』にいう、将軍の士仁が公安にあって防戦・籠城していたため、呂蒙は虞翻に命じて彼を説得させた。虞翻は城門に至り、門番に「私はお前たちの将軍と話をしたい」と言った。士仁は面会しようとしなかった。そこで虞翻は書簡を認めて言った、「明敏な者は禍をまだ芽生えぬうちに防ぎ、智恵ある者は患いを将来に備えて図るものであり、得失をわきまえればこそ人として共に事を成すことができ、存亡の理を知ればこそ吉凶を見分けるに足りるのです。いま大軍が進軍するにあたり、物見の兵も手を打つ暇がなく、狼煙すら挙げる間もなかったのは、これが天命でなければ、必ず内応する者がいるからであります。将軍はあらかじめ時勢を見抜くことができず、時節が到来してもまたこれに応じようとせず、ひとり帯のように小さな城を守って降伏しておられませぬが、このまま死戦すれば一族を滅ぼし祖先の祭祀を絶やすことになり、天下のもの笑いとなりましょう。呂虎威はただちに南郡へ直行し、陸路を遮断しようとしておりますから、ひとたび活路が塞がれれば、その地形から考えますに、将軍は箕の舌の上におられるも同然であり、逃げ走ろうにも免れることはできず、その時になって降伏すれば信義をも失うことになり、ひそかに将軍のために不安を覚える次第です、どうかよくよくお考えください」と。士仁は書簡を受け取ると、涙を流して降伏した。虞翻は呂蒙に言った、「これは詐謀の恐れがある兵ですから、士仁を引き連れて進み、味方の兵を残して城の守備にあたらせるべきです」と。こうして士仁を連れて南郡に至った。南郡太守の麋芳は籠城していたが、呂蒙が士仁の姿を彼に示すと、ついに降伏した、と。『呉録』にいう、はじめ、南郡の城中で失火があり、少なからず武器・軍需品を焼失した。関羽がそのことで麋芳を叱責したため、麋芳は内心恐れおののいており、孫権はこれを聞き知って彼を誘い入れ、麋芳は密かに内通していた。呂蒙がこれを攻めるに及び、牛と酒を携えて城を出て降伏した、と。", "persons": "士仁, 呂蒙, 虞翻, 麋芳, 関羽, 孫権", "places": "公安, 南郡", "era_year": "建安24年（219）", "source_book": "『呉書』・『呉録』", "keywords": "呉書, 虎威将軍, 太守, 呉録", "raw_tagged": "《{{special:呉書|吳書}}》曰：將軍{{person:士仁|士仁}}在{{place:公安|公安}}拒守，{{person:呂蒙|蒙}}令{{person:虞翻|虞翻}}說之。{{person:虞翻|翻}}至城門，謂守者曰：「吾欲與汝將軍語。」{{person:士仁|仁}}不肯相見。乃為書曰：「明者防禍於未萌，智者圖患於將來，知得知失，可與為人，知存知亡，足別吉凶。大軍之行，斥候不及施，烽火不及舉，此非天命，必有內應。將軍不先見時，時至又不應之，獨守縈帶之城而不降，死戰則毀宗滅祀，為天下譏笑。{{person:呂蒙|呂}}{{office:虎威将軍|虎威}}欲徑到{{place:南郡|南郡}}，斷絕陸道，生路一塞，案其地形，將軍為在箕舌上耳，奔走不得免，降則失義，竊為將軍不安，幸熟思焉。」{{person:士仁|仁}}得書，流涕而降。{{person:虞翻|翻}}謂{{person:呂蒙|蒙}}曰：「此譎兵也，當將{{person:士仁|仁}}行，留兵備城。」遂將{{person:士仁|仁}}至{{place:南郡|南郡}}。{{place:南郡|南郡}}{{office:太守|太守}}{{person:麋芳|麋芳}}城守，{{person:呂蒙|蒙}}以{{person:士仁|仁}}示之，遂降。《{{special:呉録|吳錄}}》曰：初，{{place:南郡|南郡}}城中失火，頗焚燒軍器。{{person:関羽|羽}}以責{{person:麋芳|芳}}，{{person:麋芳|芳}}內畏懼，{{person:孫権|權}}聞而誘之，{{person:麋芳|芳}}潛相和。及{{person:呂蒙|蒙}}攻之，乃以牛酒出降。", "kakikudashi_tagged": "『{{special:呉書|呉書}}』に曰く、将軍の{{person:士仁|士仁}}は{{place:公安|公安}}に在りて拒守し、{{person:呂蒙|蒙}}は{{person:虞翻|虞翻}}をして之を説かしむ。{{person:虞翻|翻}}、城門に至り、守者に謂いて曰く、「吾、汝が将軍と語らんと欲す」と。{{person:士仁|仁}}、相い見ゆるを肯んぜず。乃ち書を為りて曰く、「明者は禍を未萌に防ぎ、智者は患いを将来に図る、得を知り失を知れば、与に人と為すべく、存を知り亡を知れば、吉凶を別つに足る。大軍の行くや、斥候も施すに及ばず、烽火も挙ぐるに及ばざるは、此れ天命に非ざれば、必ず内応有ればなり。将軍は先に時を見ず、時至りて又た之に応ぜず、独り縈帯の城を守りて降らず、死戦せば則ち宗を毀ち祀を滅ぼし、天下の譏笑する所と為らん。{{person:呂蒙|呂}}{{office:虎威将軍|虎威}}は径ちに{{place:南郡|南郡}}に到り、陸道を断絶せんと欲す、生路一たび塞がれば、其の地形を案ずるに、将軍は箕舌の上に在るが為きのみ、奔走するも免るるを得ず、降らば則ち義を失わん、竊かに将軍の為に安んぜず、幸わくは焉を熟思せよ」と。{{person:士仁|仁}}は書を得て、流涕して降る。{{person:虞翻|翻}}、{{person:呂蒙|蒙}}に謂いて曰く、「此れ譎兵なり、当に{{person:士仁|仁}}を将いて行き、兵を留めて城に備うべし」と。遂に{{person:士仁|仁}}を将いて{{place:南郡|南郡}}に至る。{{place:南郡|南郡}}{{office:太守|太守}}の{{person:麋芳|麋芳}}は城守するも、{{person:呂蒙|蒙}}は{{person:士仁|仁}}を以て之に示せば、遂に降る、と。『{{special:呉録|呉録}}』に曰く、初め、{{place:南郡|南郡}}の城中に失火し、頗る軍器を焚焼す。{{person:関羽|羽}}は以て{{person:麋芳|芳}}を責め、{{person:麋芳|芳}}は内に畏懼す、{{person:孫権|権}}は聞きて之を誘い、{{person:麋芳|芳}}は潜かに相い和す。{{person:呂蒙|蒙}}の之を攻むるに及び、乃ち牛酒を以て出でて降る、と。", "translation_tagged": "『{{special:呉書|呉書}}』にいう、将軍の{{person:士仁|士仁}}が{{place:公安|公安}}にあって防戦・籠城していたため、{{person:呂蒙|呂蒙}}は{{person:虞翻|虞翻}}に命じて彼を説得させた。{{person:虞翻|虞翻}}は城門に至り、門番に「私はお前たちの将軍と話をしたい」と言った。{{person:士仁|士仁}}は面会しようとしなかった。そこで{{person:虞翻|虞翻}}は書簡を認めて言った、「明敏な者は禍をまだ芽生えぬうちに防ぎ、智恵ある者は患いを将来に備えて図るものであり、得失をわきまえればこそ人として共に事を成すことができ、存亡の理を知ればこそ吉凶を見分けるに足りるのです。いま大軍が進軍するにあたり、物見の兵も手を打つ暇がなく、狼煙すら挙げる間もなかったのは、これが天命でなければ、必ず内応する者がいるからであります。将軍はあらかじめ時勢を見抜くことができず、時節が到来してもまたこれに応じようとせず、ひとり帯のように小さな城を守って降伏しておられませぬが、このまま死戦すれば一族を滅ぼし祖先の祭祀を絶やすことになり、天下のもの笑いとなりましょう。{{person:呂蒙|呂}}{{office:虎威将軍|虎威}}はただちに{{place:南郡|南郡}}へ直行し、陸路を遮断しようとしておりますから、ひとたび活路が塞がれれば、その地形から考えますに、将軍は箕の舌の上におられるも同然であり、逃げ走ろうにも免れることはできず、その時になって降伏すれば信義をも失うことになり、ひそかに将軍のために不安を覚える次第です、どうかよくよくお考えください」と。{{person:士仁|士仁}}は書簡を受け取ると、涙を流して降伏した。{{person:虞翻|虞翻}}は{{person:呂蒙|呂蒙}}に言った、「これは詐謀の恐れがある兵ですから、{{person:士仁|士仁}}を引き連れて進み、味方の兵を残して城の守備にあたらせるべきです」と。こうして{{person:士仁|士仁}}を連れて{{place:南郡|南郡}}に至った。{{place:南郡|南郡}}{{office:太守|太守}}の{{person:麋芳|麋芳}}は籠城していたが、{{person:呂蒙|呂蒙}}が{{person:士仁|士仁}}の姿を彼に示すと、ついに降伏した、と。『{{special:呉録|呉録}}』にいう、はじめ、{{place:南郡|南郡}}の城中で失火があり、少なからず武器・軍需品を焼失した。{{person:関羽|関羽}}がそのことで{{person:麋芳|麋芳}}を叱責したため、{{person:麋芳|麋芳}}は内心恐れおののいており、{{person:孫権|孫権}}はこれを聞き知って彼を誘い入れ、{{person:麋芳|麋芳}}は密かに内通していた。{{person:呂蒙|呂蒙}}がこれを攻めるに及び、牛と酒を携えて城を出て降伏した、と。"}, {"id": "v54_p29_3", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 29, "type": "本文", "raw_text": "蒙入據城，盡得羽及將士家屬，皆撫慰，約令軍中不得干歷人家，有所求取。蒙麾下士，是汝南人，取民家一笠，以覆官鎧，官鎧雖公，蒙猶以為犯軍令，不可以鄉里故而廢法，遂垂涕斬之。於是軍中震慄，道不拾遺。蒙旦暮使親近存卹耆老，問所不足，疾病者給醫藥，饑寒者賜衣糧。羽府藏財寶，皆封閉以待權至。羽還，在道路，數使人與蒙相聞，蒙輒厚遇其使，周遊城中，家家致問，或手書示信。羽人還，私相參訊，咸知家門無恙，見待過於平時，故羽吏士無鬬心。會權尋至，羽自知孤窮，乃走麥城，西至漳鄉，眾皆委羽而降。權使朱然、潘璋斷其徑路，即父子俱獲，荊州遂定。", "kakikudashi": "蒙は入りて城に拠り、尽く羽及び将士の家属を得て、皆な撫慰し、軍中に約令して人家を干歴し、求取する所有るを得ざらしむ。蒙の麾下の士に、是れ汝南の人あり、民家の一笠を取りて、以て官鎧を覆う、官鎧は公なりと雖も、蒙は猶お以て軍令を犯すと為し、郷里の故を以て法を廃すべからずとし、遂に涕を垂れて之を斬る。是に於いて軍中は震慄し、道に遺ちたるを拾わず。蒙は旦暮に親近をして耆老を存卹し、足らざる所を問わしめ、疾病の者には医薬を給し、饑寒の者には衣糧を賜う。羽の府蔵の財宝は、皆な封閉して以て権の至るを待つ。羽は還り、道路に在りて、数しば人をして蒙と相い聞せしむるに、蒙は輒ち其の使いを厚遇し、城中を周遊して、家ごとに問を致さしめ、或いは手書して信を示さしむ。羽の人の還るや、私かに相い参訊し、咸な家門の恙無く、待せらるること平時に過ぐるを知る、故に羽の吏士に闘心無し。会たま権尋いで至り、羽は自ら孤窮せるを知り、乃ち麦城に走り、西のかた漳郷に至れば、衆は皆な羽を委てて降る。権は朱然・潘璋をして其の径路を断たしめ、即ち父子倶に獲られ、荊州は遂に定まる。", "translation": "呂蒙は入城して拠点を押さえると、関羽および将兵たちの家族をすべて保護下に置き、みな懇ろに慰撫し、全軍に厳命を下して民家に立ち入り何かを求め奪うことを禁じた。呂蒙の麾下の兵士で、汝南出身の者がおり、民家の菅笠を一つ取って、官給の鎧に被せたが、官給の鎧は公物であるとはいえ、呂蒙はなお軍令違反であるとみなし、同郷のよしみによって法を曲げることはできないとして、ついに涙を流してこの兵を斬った。これにより軍中は震えおののき、道に落とし物があっても誰も拾わぬほどに規律が徹底された。呂蒙は朝夕に側近の者を遣わして老人たちを見舞って労わらせ、足りないものがないか尋ねさせ、病に苦しむ者には医薬を給し、飢えや寒さに苦しむ者には衣服や食糧を与えた。関羽の倉庫の財宝は、すべて封印して閉ざし、孫権の到着を待った。関羽は引き返す途上にあって、たびたび使者を送って呂蒙と連絡を取らせたが、呂蒙はそのたびに使者を手厚くもてなし、城中を隈なく巡らせて家ごとに安否を尋ねさせ、あるいは直筆の手紙を書いて無事を伝える証拠とさせた。関羽の使者が戻ると、兵士たちはひそかに互いに尋ね合い、みな家族が無事で、普段以上に手厚く遇されていることを知ったため、関羽の将兵たちは戦意を失った。まもなく孫権が到着すると、関羽は自ら孤立無援に陥ったことを悟り、麦城へ逃れ、さらに西方の漳郷に至ったところで、兵衆はみな関羽を見捨てて降伏した。孫権が朱然・潘璋に命じてその退路を遮断させると、ただちに父子ともに捕らえられ、荊州はついに平定された。", "persons": "呂蒙, 関羽, 孫権, 朱然, 潘璋", "places": "汝南, 麦城, 漳郷, 荊州", "era_year": "建安24年（219）", "source_book": "", "keywords": "", "raw_tagged": "{{person:呂蒙|蒙}}入據城，盡得{{person:関羽|羽}}及將士家屬，皆撫慰，約令軍中不得干歷人家，有所求取。{{person:呂蒙|蒙}}麾下士，是{{place:汝南|汝南}}人，取民家一笠，以覆官鎧，官鎧雖公，{{person:呂蒙|蒙}}猶以為犯軍令，不可以鄉里故而廢法，遂垂涕斬之。於是軍中震慄，道不拾遺。{{person:呂蒙|蒙}}旦暮使親近存卹耆老，問所不足，疾病者給醫藥，饑寒者賜衣糧。{{person:関羽|羽}}府藏財寶，皆封閉以待{{person:孫権|權}}至。{{person:関羽|羽}}還，在道路，數使人與{{person:呂蒙|蒙}}相聞，{{person:呂蒙|蒙}}輒厚遇其使，周遊城中，家家致問，或手書示信。{{person:関羽|羽}}人還，私相參訊，咸知家門無恙，見待過於平時，故{{person:関羽|羽}}吏士無鬬心。會{{person:孫権|權}}尋至，{{person:関羽|羽}}自知孤窮，乃走{{place:麦城|麥城}}，西至{{place:漳郷|漳鄉}}，眾皆委{{person:関羽|羽}}而降。{{person:孫権|權}}使{{person:朱然|朱然}}、{{person:潘璋|潘璋}}斷其徑路，即父子俱獲，{{place:荊州|荊州}}遂定。", "kakikudashi_tagged": "{{person:呂蒙|蒙}}は入りて城に拠り、尽く{{person:関羽|羽}}及び将士の家属を得て、皆な撫慰し、軍中に約令して人家を干歴し、求取する所有るを得ざらしむ。{{person:呂蒙|蒙}}の麾下の士に、是れ{{place:汝南|汝南}}の人あり、民家の一笠を取りて、以て官鎧を覆う、官鎧は公なりと雖も、{{person:呂蒙|蒙}}は猶お以て軍令を犯すと為し、郷里の故を以て法を廃すべからずとし、遂に涕を垂れて之を斬る。是に於いて軍中は震慄し、道に遺ちたるを拾わず。{{person:呂蒙|蒙}}は旦暮に親近をして耆老を存卹し、足らざる所を問わしめ、疾病の者には医薬を給し、饑寒の者には衣糧を賜う。{{person:関羽|羽}}の府蔵の財宝は、皆な封閉して以て{{person:孫権|権}}の至るを待つ。{{person:関羽|羽}}は還り、道路に在りて、数しば人をして{{person:呂蒙|蒙}}と相い聞せしむるに、{{person:呂蒙|蒙}}は輒ち其の使いを厚遇し、城中を周遊して、家ごとに問を致さしめ、或いは手書して信を示さしむ。{{person:関羽|羽}}の人の還るや、私かに相い参訊し、咸な家門の恙無く、待せらるること平時に過ぐるを知る、故に{{person:関羽|羽}}の吏士に闘心無し。会たま{{person:孫権|権}}尋いで至り、{{person:関羽|羽}}は自ら孤窮せるを知り、乃ち{{place:麦城|麦城}}に走り、西のかた{{place:漳郷|漳郷}}に至れば、衆は皆な{{person:関羽|羽}}を委てて降る。{{person:孫権|権}}は{{person:朱然|朱然}}・{{person:潘璋|潘璋}}をして其の径路を断たしめ、即ち父子倶に獲られ、{{place:荊州|荊州}}は遂に定まる。", "translation_tagged": "{{person:呂蒙|呂蒙}}は入城して拠点を押さえると、{{person:関羽|関羽}}および将兵たちの家族をすべて保護下に置き、みな懇ろに慰撫し、全軍に厳命を下して民家に立ち入り何かを求め奪うことを禁じた。{{person:呂蒙|呂蒙}}の麾下の兵士で、{{place:汝南|汝南}}出身の者がおり、民家の菅笠を一つ取って、官給の鎧に被せたが、官給の鎧は公物であるとはいえ、{{person:呂蒙|呂蒙}}はなお軍令違反であるとみなし、同郷のよしみによって法を曲げることはできないとして、ついに涙を流してこの兵を斬った。これにより軍中は震えおののき、道に落とし物があっても誰も拾わぬほどに規律が徹底された。{{person:呂蒙|呂蒙}}は朝夕に側近の者を遣わして老人たちを見舞って労わらせ、足りないものがないか尋ねさせ、病に苦しむ者には医薬を給し、飢えや寒さに苦しむ者には衣服や食糧を与えた。{{person:関羽|関羽}}の倉庫の財宝は、すべて封印して閉ざし、{{person:孫権|孫権}}の到着を待った。{{person:関羽|関羽}}は引き返す途上にあって、たびたび使者を送って{{person:呂蒙|呂蒙}}と連絡を取らせたが、{{person:呂蒙|呂蒙}}はそのたびに使者を手厚くもてなし、城中を隈なく巡らせて家ごとに安否を尋ねさせ、あるいは直筆の手紙を書いて無事を伝える証拠とさせた。{{person:関羽|関羽}}の使者が戻ると、兵士たちはひそかに互いに尋ね合い、みな家族が無事で、普段以上に手厚く遇されていることを知ったため、{{person:関羽|関羽}}の将兵たちは戦意を失った。まもなく{{person:孫権|孫権}}が到着すると、{{person:関羽|関羽}}は自ら孤立無援に陥ったことを悟り、{{place:麦城|麦城}}へ逃れ、さらに西方の{{place:漳郷|漳郷}}に至ったところで、兵衆はみな{{person:関羽|関羽}}を見捨てて降伏した。{{person:孫権|孫権}}が{{person:朱然|朱然}}・{{person:潘璋|潘璋}}に命じてその退路を遮断させると、ただちに父子ともに捕らえられ、{{place:荊州|荊州}}はついに平定された。"}, {"id": "v54_p30_1", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 30, "type": "本文", "raw_text": "以蒙為南郡太守，封孱陵侯，", "kakikudashi": "蒙を以て南郡太守と為し、孱陵侯に封じ、", "translation": "呂蒙を南郡太守とし、孱陵侯に封じ、", "persons": "呂蒙", "places": "南郡, 孱陵", "era_year": "建安24年（219）", "source_book": "", "keywords": "太守, 列侯", "raw_tagged": "以{{person:呂蒙|蒙}}為{{place:南郡|南郡}}{{office:太守|太守}}，封{{place:孱陵|孱陵}}{{office:列侯|侯}}，", "kakikudashi_tagged": "{{person:呂蒙|蒙}}を以て{{place:南郡|南郡}}{{office:太守|太守}}と為し、{{place:孱陵|孱陵}}{{office:列侯|侯}}に封じ、", "translation_tagged": "{{person:呂蒙|呂蒙}}を{{place:南郡|南郡}}{{office:太守|太守}}とし、{{place:孱陵|孱陵}}{{office:列侯|侯}}に封じ、"}, {"id": "v54_p30_2", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 30, "type": "裴注", "raw_text": "《江表傳》曰：權於公安大會，呂蒙以疾辭，權笑曰：「禽羽之功，子明謀也，今大功已捷，慶賞未行，豈邑邑邪？」乃增給步騎鼓吹，敕選虎威將軍官屬，並南郡、廬江二郡威儀。拜畢還營，兵馬導從，前後鼓吹，光燿於路。", "kakikudashi": "『江表伝』に曰く、権は公安に於いて大いに会するに、呂蒙は疾を以て辞すれば、権は笑いて「羽を禽にせし功は、子明の謀なり、今大功已に捷ち、慶賞未だ行われざるに、豈に邑邑たらんや」と曰い、乃ち歩騎・鼓吹を増給し、敕して虎威将軍の官属を選ばしめ、南郡・廬江二郡の威儀を並せしむ。拝し畢りて営に還るや、兵馬導従し、前後に鼓吹ありて、路に光燿す、と。", "translation": "『江表伝』にいう、孫権が公安において盛大な宴会を催した際、呂蒙が病を理由に辞退すると、孫権は笑って「関羽を生け捕りにした功績は、子明の謀略によるものだ、いま大功を成し遂げて戦勝を収め、恩賞もまだ行われていないというのに、どうしてふさぎ込んでいるのか」と言い、歩兵・騎兵および鼓吹を増し加え、勅命を下して虎威将軍の官属を選抜させ、南郡・廬江二郡の威儀を併せ備えさせた。拝命を終えて陣営へ帰還する際には、兵馬が先導・随従し、前後に鼓吹が奏でられて、沿道にまばゆく輝きわたった、と。", "persons": "孫権, 呂蒙, 関羽", "places": "公安, 南郡, 廬江", "era_year": "建安24年（219）", "source_book": "『江表伝』", "keywords": "江表伝, 鼓吹, 虎威将軍", "raw_tagged": "《{{special:江表伝|江表傳}}》曰：{{person:孫権|權}}於{{place:公安|公安}}大會，{{person:呂蒙|呂蒙}}以疾辭，{{person:孫権|權}}笑曰：「禽{{person:関羽|羽}}之功，{{person:呂蒙|子明}}謀也，今大功已捷，慶賞未行，豈邑邑邪？」乃增給步騎{{special:鼓吹|鼓吹}}，敕選{{office:虎威将軍|虎威將軍}}官屬，並{{place:南郡|南郡}}、{{place:廬江|廬江}}二郡威儀。拜畢還營，兵馬導從，前後{{special:鼓吹|鼓吹}}，光燿於路。", "kakikudashi_tagged": "『{{special:江表伝|江表伝}}』に曰く、{{person:孫権|権}}は{{place:公安|公安}}に於いて大いに会するに、{{person:呂蒙|呂蒙}}は疾を以て辞すれば、{{person:孫権|権}}は笑いて「{{person:関羽|羽}}を禽にせし功は、{{person:呂蒙|子明}}の謀なり、今大功已に捷ち、慶賞未だ行われざるに、豈に邑邑たらんや」と曰い、乃ち歩騎・{{special:鼓吹|鼓吹}}を増給し、敕して{{office:虎威将軍|虎威将軍}}の官属を選ばしめ、{{place:南郡|南郡}}・{{place:廬江|廬江}}二郡の威儀を並せしむ。拝し畢りて営に還るや、兵馬導従し、前後に{{special:鼓吹|鼓吹}}ありて、路に光燿す、と。", "translation_tagged": "『{{special:江表伝|江表伝}}』にいう、{{person:孫権|孫権}}が{{place:公安|公安}}において盛大な宴会を催した際、{{person:呂蒙|呂蒙}}が病を理由に辞退すると、{{person:孫権|孫権}}は笑って「{{person:関羽|関羽}}を生け捕りにした功績は、{{person:呂蒙|子明}}の謀略によるものだ、いま大功を成し遂げて戦勝を収め、恩賞もまだ行われていないというのに、どうしてふさぎ込んでいるのか」と言い、歩兵・騎兵および{{special:鼓吹|鼓吹}}を増し加え、勅命を下して{{office:虎威将軍|虎威将軍}}の官属を選抜させ、{{place:南郡|南郡}}・{{place:廬江|廬江}}二郡の威儀を併せ備えさせた。拝命を終えて陣営へ帰還する際には、兵馬が先導・随従し、前後に{{special:鼓吹|鼓吹}}が奏でられて、沿道にまばゆく輝きわたった、と。"}, {"id": "v54_p30_3", "volume": 54, "book": "呉書", "section_title": "周瑜魯粛呂蒙傳（呂蒙）", "para_index": 30, "type": "本文", "raw_text": "賜錢一億，黃金五百斤。蒙固辭金錢，權不許。封爵未下。會蒙疾發，權時在公安，迎置內殿。所以治護者萬方，募封內有能愈蒙疾者，賜千金。時有針加，權為之慘戚，欲數見其顏色，又恐勞動，常穿壁瞻之，見小能下食則喜，顧左右言笑，不然則咄唶，夜不能寐。病中瘳，為下赦令，群臣畢賀。後更增篤，權自臨視，命道士於星辰下為之請命。年四十二，遂卒於內殿。時權哀痛甚，為之降損。蒙未死時，所得金寶諸賜盡付府藏，敕主者命絕之日皆上還，喪事務約。權聞之，益以悲感。", "kakikudashi": "銭一億、黄金五百斤を賜う。蒙は固く金銭を辞すれども、権は許さず。封爵未だ下らず。会たま蒙の疾発し、権は時に公安に在れば、迎えて内殿に置く。治護する所以の者万方にして、封内に能く蒙の疾を愈やす者有らば、千金を賜わんと募る。時に針の加うる有れば、権は之が為に惨戚し、数しば其の顔色を見んと欲するも、又た労働せんことを恐れ、常に壁を穿ちて之を瞻、少ししく能く食を下すを見れば則ち喜び、左右を顧みて言笑し、然らずんば則ち咄唶し、夜も寐ぬる能わず。病中ば瘳ゆれば、為に赦令を下し、群臣畢く賀す。後に更に増篤するや、権は自ら臨視し、道士に命じて星辰の下に於いて之が為に命を請わしむ。年四十二にして、遂に内殿に卒す。時に権は哀痛すること甚だしく、之が為に降損す。蒙、未だ死せざる時、得る所の金宝・諸賜は尽く府蔵に付し、主者に敕して命絶ゆるの日には皆な上還せしめ、喪事は務めて約にせしむ。権、之を聞きて、益ます以て悲感す。", "translation": "銭一億、黄金五百斤を下賜した。呂蒙は金銭を固辞したが、孫権は許さなかった。封爵の沙汰はまだ下されていなかった。おりしも呂蒙の持病が再発し、孫権は当時公安にいたため、迎え入れて内殿に休ませた。あらゆる手を尽くして治療と看護にあたらせ、領内で呂蒙の病を治せる者があれば千金を賜うと募った。鍼の治療が施されることがあると、孫権はその痛ましさに心を痛め、たびたびその顔色を見たいと思いながらも、かえって気疲れさせてはと案じ、いつも壁に穴をあけて様子をうかがい、少しでも食事が喉を通るのを見れば喜んで、側近を振り返って談笑し、そうでなければ舌打ちして嘆息し、夜も眠ることができなかった。病がいくらか快方に向かうと、そのために恩赦の令を下し、群臣はこぞって祝賀を述べた。のちに再び悪化して重篤となると、孫権は自ら枕元に臨んで見舞い、道士に命じて星辰の下で彼のために延命を祈らせた。年四十二で、ついに内殿において没した。このとき孫権の哀悼はなはだしく、そのために食事や日常の格式を減らして慎んだ。呂蒙はまだ亡くなる前、拝領した金宝や諸々の下賜品をすべて官の倉庫に預けさせ、担当の者に命じて息絶えた日にはすべて返納させ、葬儀はつとめて質素に行うよう言い遺していた。孫権はこれを聞いて、いよいよ深く悲しみ胸を打たれた。", "persons": "呂蒙, 孫権", "places": "公安", "era_year": "建安24年（219）", "source_book": "", "keywords": "", "raw_tagged": "賜錢一億，黃金五百斤。{{person:呂蒙|蒙}}固辭金錢，{{person:孫権|權}}不許。封爵未下。會{{person:呂蒙|蒙}}疾發，{{person:孫権|權}}時在{{place:公安|公安}}，迎置內殿。所以治護者萬方，募封內有能愈{{person:呂蒙|蒙}}疾者，賜千金。時有針加，{{person:孫権|權}}為之慘戚，欲數見其顏色，又恐勞動，常穿壁瞻之，見小能下食則喜，顧左右言笑，不然則咄唶，夜 めざるなり。然れども其の軍を作し営に屯するや、令行われ禁止むを失わず、部界に廃負無く、路に遺ちたるを拾わず、其の法も亦た美なり」と。", "translation": "孫権は陸遜と周瑜・魯粛および呂蒙について論じて言った、「公瑾は雄々しく烈しい気概を持ち、胆力と智略は人並み外れており、ついに孟徳を打ち破り、荊州を切り開いて、はるかに後を継ぎがたい存在であったが、君がいまその跡を継いでくれた。公瑾がかつて子敬を招いて東へ来させ、私に引き合わせてくれたとき、私がともに酒宴で語り合うと、すぐさま遠大な計略や帝王の大業に話が及んだ、これが一つ目の痛快事である。のちに孟徳は劉琮を降した勢いに乗じ、まさに数十万の大軍を率いて水陸ともに下ろうとしていると豪語した。私はあまねく諸将を召し集め、取るべき方策を諮問したが、誰ひとり進み出て答える者がなく、子布や文表に至っては、そろって使者を遣わし文書を整えて迎え入れるべきだと言ったが、子敬はただちに反論してならぬと言い、私に勧めて急ぎ公瑾を呼び戻させ、軍勢を委ねて迎え撃たせた、これが二つ目の痛快事である。しかもその計略を決断し構想を練り上げた手際は、張儀・蘇秦をはるかに凌駕していた。のちに私に勧めて玄徳へ土地を貸し与えさせたとはいえ、それは彼の一つの短所であって、二つの長所を損なうには足りないものである。周公は一人の人間に完全無欠を求めなかったというから、私もその短所を忘れて長所を貴び、つねづね彼を鄧禹になぞらえているのだ。また子明は若い頃、私はただ難事も平易な事も厭わず、果敢で胆力があるだけの男だと思っていた。ところが成長するにつれて、学問によって見識が開け進歩し、計略は奇抜にして精緻を極め、公瑾に次ぐほどになったが、ただ議論の颯爽とした才気だけは公瑾に及ばなかった。しかし関羽を図って討ち取った手並みは、子敬に勝っている。子敬は私の書簡に答えて、『帝王が興るときには、みな先駆けとなって露払いをする者があるもので、関羽など恐れるに足りません』と言っていた。これは子敬が内心では対処しきれないため、外面で大言を吐いたにすぎないが、私もそれを大目に見て、あえて咎め立てはしなかったのだ。とはいえ彼が軍を編成して陣営を敷けば、命令は実行され禁令は厳守される規律を失わず、管轄の領域に職務を怠り背く者はなく、道に落とし物があっても誰も拾わぬほどであり、その統率の法もまた見事なものであった」と。", "persons": "孫権, 陸遜, 周瑜, 魯粛, 呂蒙, 曹操, 劉琮, 張昭, 秦松, 張儀, 蘇秦, 劉備, 周公, 鄧禹, 関羽", "places": "荊州", "era_year": "黄武元年（222）前後", "source_book": "", "keywords": "", "raw_tagged": "{{person:孫権|孫權}}與{{person:陸遜|陸遜}}論{{person:周瑜|周瑜}}、{{person:魯粛|魯肅}}及{{person:呂蒙|蒙}}曰：「{{person:周瑜|公瑾}}雄烈，膽略兼人，遂破{{person:曹操|孟德}}，開拓{{place:荊州|荊州}}，邈焉難繼，君今繼之。{{person:周瑜|公瑾}}昔要{{person:魯粛|子敬}}來東，致達於孤，孤與宴語，便及大略帝王之業，此一快也。後{{person:曹操|孟德}}因獲{{person:劉琮|劉琮}}之勢，張言方率數十萬眾水步俱下。孤普請諸將，諮問所宜，無適先對，至{{person:張昭|子布}}、{{person:秦松|文表}}，俱言宜遣使修檄迎之，{{person:魯粛|子敬}}即駁言不可，勸孤急呼{{person:周瑜|公瑾}}，付任以眾，逆而擊之，此二快也。且其決計策意，出{{person:張儀|張}}、{{person:蘇秦|蘇}}遠矣。後雖勸吾借{{person:劉備|玄德}}地，是其一短，不足以損其二長也。{{person:周公|周公}}不求備於一人，故孤忘其短而貴其長，常以比方{{person:鄧禹|鄧禹}}也。又{{person:呂蒙|子明}}少時，孤謂不辭劇易，果敢有膽而已。及身長大，學問開益，籌略奇至，可以次於{{person:周瑜|公瑾}}，但言議英發不及之耳。圖取{{person:関羽|關羽}}，勝於{{person:魯粛|子敬}}。{{person:魯粛|子敬}}答孤書云：『帝王之起，皆有驅除，{{person:関羽|羽}}不足忌。』此{{person:魯粛|子敬}}內不能辦，外為大言耳，孤亦恕，不苟責也。然其作軍屯營，不失令行禁止，部界無廢負，路無拾遺，其法亦美也。」", "kakikudashi_tagged": "{{person:孫権|孫権}}、{{pe   const OFFICES = {"列侯": {"match_terms": ["都郷侯", "都鄕侯", "都鄉侯", "都亭侯", "郷侯", "鄕侯", "鄉侯", "亭侯", "列侯"], "wiki_title": "列侯", "ai_desc": "二十等爵の最高位（『漢書』巻19上・百官公卿表上、『続漢書』百官志五）。後漢では食邑の規模に応じて県侯・郷侯（都郷侯を含む）・亭侯（都亭侯や万歳・千秋・国明などの嘉名を冠した亭侯を含む）に細分された。前漢の曹参は高祖（劉邦）に従った功績で一万六百戸の「平陽侯」（県侯）に封じられ、後漢の曹騰は桓帝即位の功により「費亭侯」（亭侯）に封じられて曹嵩・曹操へと継承されたほか、建安18年（213年）の魏公勧進表には荀攸（謝亭侯）・鍾繇（東武亭侯）・夏侯惇（高安侯）・程昱（安国亭侯）・賈詡（都郷侯）・董昭（千秋亭侯）・曹洪（国明亭侯）・韓浩（万歳亭侯）・曹仁（安平亭侯）ら多数の列侯が連署している（『三國志』巻1・武帝紀注引『魏書』）。", "yomi": "れっこう", "office_group": "title_priv"}, "下曹従事": {"title": "下曹従事（かそうじゅうじ：州庁の諸曹のうち下位の部局を担当する従事）", "wiki_title": "従事", "mapping_note": "", "ai_desc": "後漢の州牧・刺史の下に置かれた諸曹従事のうち、治中従事・別駕従事などの上席幕僚に対し、実務末端の下位部局（下曹）を担う属吏（『続漢書』百官志五）。建安13年（208年）、魯粛は曹操への降伏に反対した際、士人である自分は降伏しても郷里で下曹従事程度の地位は失わないが、主君の孫権には帰すべき所がないと説いた（『三國志』巻54・魯粛伝）。", "yomi": "かそうじゅうじ", "office_group": "local", "match_terms": ["下曹従事", "下曹從事"]}, "中護軍": {"title": "中護軍（ちゅうごぐん：丞相府・中軍の諸将を監督し武官の選任・軍紀を掌った重職、建安12年に護軍から改称され韓浩・曹洪らが就任）", "wiki_title": "中護軍", "mapping_note": "", "ai_desc": "曹操が幕府に創設した軍制中枢職の一つ。当初は「護軍」と称し、建安12年（207年）に韓浩を中護軍、史渙を中領軍に改めて長史・司馬を置いたのに始まる（『三國志』巻9・夏侯惇伝注引『魏書』、『晋書』巻24・職官志）。諸将の統制や武官の選挙（人事選考）に携わる要職であり、建安18年（213年）5月の魏公勧進表では一族の重鎮・曹洪が「中護軍・国明亭侯」として在任している（『三國志』巻1・武帝紀注引『魏書』）。", "yomi": "ちゅうごぐん", "office_group": "military", "match_terms": ["中護軍"]}, "仮節": {"title": "仮節（かせつ：天子・王の符節を仮授され、戦時の軍令違反者を専断処罰できる軍事特権）", "wiki_title": "使持節", "mapping_note": "「仮節」をWikipedia「使持節」と紐づけています。", "ai_desc": "方面軍司令官や重鎮に対し、君主の信証である「節（符節）」を仮授する軍事特権。魏晋期の三等節制（使持節・持節・仮節）においては、戦時（「軍事と興る時」）に軍令に違反した者を朝廷への事前上奏なしに処刑できる権限を持った（『晋書』巻24・職官志、杜佑『通典』巻32・職官十四）。建安24年（219年）、漢中王となった劉備は張飛を右将軍・仮節に拝した（『三國志』巻36・張飛伝）。", "yomi": "かせつ", "office_group": "title_priv", "match_terms": ["仮節", "假節"]}, "偏将軍": {"title": "偏将軍（へんしょうぐん）", "wiki_title": "", "mapping_note": "", "ai_desc": "大将軍や重号将軍・雑号将軍の副将・別動隊指揮官として一部隊（一偏の師）を率いる中堅将軍号。後漢末〜三国時代には常設に近い武官位（魏の九品官人法では第五品）となり、将軍号の最下位である「裨将軍」のすぐ上位に位置づけられ、「裨将軍→偏将軍→雑号将軍」の順で昇進するのが通例であった（『宋書』巻39・百官志上、『通典』巻29・職官十一）。", "yomi": "へんしょうぐん", "office_group": "military", "match_terms": ["偏将軍", "偏將軍"]}, "公主": {"title": "公主（こうしゅ：天子の娘および特命によってこれに準じた諸侯王の娘に授けられる称号）", "wiki_title": "公主", "mapping_note": "", "ai_desc": "本来は皇帝の娘を指す称号（天子が自ら婚礼を主宰せず同姓の諸侯・「公」に主宰させたことに由来。『春秋公羊伝』荘公元年・『続漢書』百官志五）。後漢制では皇女は県公主に封ぜられて列侯と同格の礼遇を受け、諸侯王の娘は通常「郷亭公主」に封ぜられたが、建安21年（216年）5月、献帝は特命をもって魏王・曹操の娘（清河長公主や金郷公主ら、あるいは曹憲・曹華ら）を「公主」となし、湯沐の邑を食邑として授けた（『三國志』巻1・武帝紀、盧弼『三国志集解』）。", "yomi": "こうしゅ", "office_group": "title_priv", "match_terms": ["公主"]}, "公卿": {"title": "公卿（こうけい：三公および九卿の総称）", "wiki_title": "公卿", "mapping_note": "", "ai_desc": "最高執政官である「三公」（太尉・司徒・司空）と、中央各省庁の長官である「九卿」（太常・光禄勲・衛尉・太僕・廷尉・大鴻臚・宗正・大司農・少府）の総称。曹騰が推挙した虞放（司空）・辺韶・延固・張温（太尉・司空）・張奐（太常・大司農）・堂谿典らはいずれも公卿の高位に至った。", "yomi": "こうけい", "office_group": "central", "match_terms": ["公卿"]}, "典農": {"title": "典農・典農校尉・典農都尉（てんのう：曹操政権・曹魏で各地の屯田の開墾・徴税・軍事管理を統括した農政官）", "wiki_title": "屯田制", "mapping_note": "", "ai_desc": "建安元年（196年）の屯田制創始に伴い設置された屯田統括官で、規模に応じ典農中郎将・典農校尉・典農都尉が置かれ、郡県から独立して屯田の開墾・徴税・防衛を掌った（『三國志』巻16・任峻伝、『続漢書』百官志三注）。曹魏は謝奇を蘄春典農に任じて皖の田郷に駐屯させた（『三國志』巻54・呂蒙伝）。", "yomi": "てんのう", "office_group": "local", "match_terms": ["典農中郎将", "典農中郎將", "典農校尉", "典農都尉", "典農"]}, "別部司馬": {"title": "別部司馬（べつぶしば：将軍幕府の別営・独立部隊を率いる司馬職）", "wiki_title": "別部司馬", "mapping_note": "", "ai_desc": "後漢から三国時代にかけて将軍幕府に属し別営（独立部隊）を統率した武官（『続漢書』百官志一）。孫呉では部曲を率いる若手や新参の部将への初任武官として広く授けられ、義兄・鄧当の兵を継いだ呂蒙のほか、凌統・甘寧・潘璋らも任じられた（『三國志』巻54・呂蒙伝、巻55諸伝）。", "yomi": "べつぶしば", "office_group": "military", "match_terms": ["別部司馬"]}, "別駕": {"title": "別駕・別駕従事（べつが／べつがじゅうじ：州牧・刺史の巡行に別乗で随行し州政を総括する筆頭幕僚）", "wiki_title": "別駕", "mapping_note": "", "ai_desc": "州牧・刺史が州内を巡察する際、別に専用の車（「別駕」）を仕立てて随行したことから名づけられた州庁の最高位幕僚（『続漢書』百官志五）。治中従事とともに州の行政・人事を総覧した。初平3年（192年）に兗州刺史・劉岱が青州黄巾との戦いで戦死した際、陳宮は兗州の別駕・治中ら最高幹部を説得し、東郡太守であった曹操を兗州牧として迎え入れさせた（郭頒『世語』）。", "yomi": "べつが", "office_group": "local", "match_terms": ["別駕"]}, "刺史": {"title": "刺史（しし：益州刺史・各州の監察長官）", "wiki_title": "刺史", "mapping_note": "", "ai_desc": "一州を管轄し、傘下の郡太守（二千石）や県令長を監察・弾劾した地方長官（『続漢書』百官志五）。益州刺史であった种暠は、函谷関で蜀郡太守が曹騰へ送った書状を検閲・摘発して弾劾奏上を行った。", "yomi": "しし", "office_group": "local", "match_terms": ["刺史"]}, "前部大督": {"title": "前部大督（ぜんぶだいとく：遠征軍の前衛諸部隊を統括する総指揮官職）", "wiki_title": "都督", "mapping_note": "", "ai_desc": "孫呉の出征軍において前衛（先鋒）諸軍を統率した総指揮官号。建安13年（208年）春、孫権が江夏の黄祖を親征して討ち破った際、周瑜が前部大督に任じられ、呂蒙や凌統らがその指揮下で戦功を挙げた（『三國志』巻47・呉主伝、巻54・周瑜伝）。", "yomi": "ぜんぶだいとく", "office_group": "military", "match_terms": ["前部大督"]}, "升城督": {"title": "升城督（しょうじょうとく：攻城戦において城壁登攀の先陣部隊を指揮する特命督戦官）", "wiki_title": "", "mapping_note": "", "ai_desc": "攻城戦において城壁へ登攀する先陣部隊を統率・督励するため臨時に置かれた指揮官職。建安19年（214年）閏五月の廬江郡皖城攻略戦に際し、呂蒙の推挙で甘寧が升城督に任じられ、手ずから練絹を執って城壁を真っ先に登り陥落の殊勲を立てた（『三國志』巻54・呂蒙伝、巻55・甘寧伝）。", "yomi": "しょうじょうとく", "office_group": "military", "match_terms": ["升城督"]}, "博士": {"title": "博士（はくし：五経の教授・伝承および国家礼制・故実の議定を掌った学官）", "wiki_title": "博士 (官職)", "mapping_note": "", "ai_desc": "漢朝では太常に属し（定員十四人、先頭を博士祭酒という）、五経の教授・弟子育成とともに、国有の大事・吉凶礼制に際して経義と故事に基づく諮問・議定を担った学官（『続漢書』百官志二）。魏公国にも設置され、建安19年（214年）2月に曹操の二女（貴人）が鄴から許都へ輿入れする際、郎中令・少府らとともに婚礼の威儀を整えて貴人を侍送した（『三國志』巻1・武帝紀注引『献帝起居注』）。", "yomi": "はくし", "office_group": "central", "match_terms": ["博士"]}, "司徒": {"title": "司徒（しと：三公の一）", "wiki_title": "司徒", "mapping_note": "", "ai_desc": "太尉・司空とともに「三公」を構成し、天下の民政・教化・礼制を統括した最高官職（『続漢書』百官志一）。かつて益州刺史として曹騰を弾劾した种暠は、曹騰がその忠直を称賛して恨まなかったこともあり、延熹4年（161年）に司徒に昇った（『後漢書』巻56・种暠伝）。", "yomi": "しと", "office_group": "central", "match_terms": ["司徒"]}, "太守": {"title": "太守（たいしゅ：蜀郡太守・郡の最高長官）", "wiki_title": "太守", "mapping_note": "", "ai_desc": "一郡の行政・軍事・司法を統括する地方長官（『続漢書』百官志五）。毎年末には「計吏（上計吏）」を帝都・洛陽へ派遣して郡の戸口・財政・治績を朝廷に報告させた。", "yomi": "たいしゅ", "office_group": "local", "match_terms": ["太守"]}, "太尉": {"title": "太尉（たいい：三公の筆頭）", "wiki_title": "太尉", "mapping_note": "", "ai_desc": "司徒・司空とともに後漢の最高官「三公」を構成し、天下の軍事・国防・人事を統括した最高官職（『続漢書』百官志一）。曹操の父・曹嵩は霊帝の中平4年（187年）11月、崔烈に代わって太尉に昇った（『後漢書』巻8・霊帝紀）。", "yomi": "たいい", "office_group": "central", "match_terms": ["太尉"]}, "奮武校尉": {"title": "奮武校尉（ふんぶこうい：武威を奮い起こす意を冠した校尉職）", "wiki_title": "校尉", "mapping_note": "", "ai_desc": "後漢末から三国時代にかけて置かれた征討・統兵用の校尉号。建安15年（210年）、病没した周瑜の遺疏により後任に推挙された魯粛が奮武校尉に拝され、周瑜の兵四千余人と奉邑四県を引き継いだ（『三國志』巻54・魯粛伝）。", "yomi": "ふんぶこうい", "office_group": "military", "match_terms": ["奮武校尉"]}, "孝廉": {"title": "孝廉（こうれん：郡国から孝行・廉潔な人物を中央へ推挙する官吏登用科目）", "wiki_title": "孝廉", "mapping_note": "", "ai_desc": "漢代の官吏登用制度（察挙・郷挙里選）において、毎年各郡国から親孝行（孝）で清廉潔白（廉）な人物を中央へ推挙させた最も主要な科目。孝廉に挙げられた者は光禄勲傘下の三署（五官署・左署・右署）の「郎（郎官）」に任じられて宮中宿衛・見習いを務めた後、中央官や地方の県令・県長・北部尉などに除せられた。曹操は二十歳（熹平3年＝174年）で孝廉に推挙されて郎となった。", "yomi": "こうれん", "office_group": "central", "match_terms": ["孝廉"]}, "尚書令": {"title": "尚書令（しょうしょれい：尚書台の長官・奏下文書と政務中枢を総括、魏国初代には荀攸が就任）", "wiki_title": "尚書令", "mapping_note": "", "ai_desc": "宮中の文書・詔勅起草および百官の上奏を総括する尚書台の最高長官（『続漢書』百官志三）。後漢本朝では荀彧が長年この職にあって朝政の中枢を担い、建安18年（213年）11月に魏公国に初めて尚書・侍中・六卿が置かれると、曹操の謀主であった荀攸が魏国の初代尚書令に拝された（『三國志』巻1・武帝紀注引『魏氏春秋』、巻10・荀攸伝）。", "yomi": "しょうしょれい", "office_group": "central", "match_terms": ["尚書令", "尙書令"]}, "左将軍": {"title": "左将軍（さしょうぐん：前後左右将軍の一）", "wiki_title": "左将軍", "mapping_note": "", "ai_desc": "前・後・左・右将軍（四将軍）の一。袁術は朝廷から左将軍に任じられていたが、建安2年（197年）に寿春で帝号を僭称したため、朝廷の詔勅で「故の左将軍袁術」として討伐対象とされた（『江表伝』）。", "yomi": "さしょうぐん", "office_group": "military", "match_terms": ["左将軍", "左將軍"]}, "左護軍": {"title": "左護軍（さごぐん：右護軍・中護軍と並び諸軍の統制・軍紀監督を掌る重職）", "wiki_title": "護軍", "mapping_note": "", "ai_desc": "三国時代に諸将の統制・軍紀監督を担った護軍職の一つ。孫呉では左右護軍が軍制の要職として置かれ、建安22年（217年）の濡須口防衛戦の功により呂蒙が左護軍・虎威将軍（蔣欽が右護軍）に拝されたほか、後に全琮らもこの職を帯びた（『三國志』巻54・呂蒙伝、巻55・蔣欽伝、巻60・全琮伝）。", "yomi": "さごぐん", "office_group": "military", "match_terms": ["左護軍"]}, "平北都尉": {"title": "平北都尉（へいほくとい：北方平定の号を冠した孫呉の都尉職）", "wiki_title": "都尉", "mapping_note": "", "ai_desc": "後漢末から孫呉にかけて、戦功ある部将に授けられた征討用の雑号都尉の一つ。孫権の丹陽郡山越討伐に従軍して各地で功績を挙げた呂蒙が、別部司馬から昇進して平北都尉に拝され、丹陽郡の広徳長を兼任した（『三國志』巻54・呂蒙伝）。", "yomi": "へいほくとい", "office_group": "military", "match_terms": ["平北都尉"]}, "建威中郎将": {"title": "建威中郎将（けんいちゅうろうじょう：武威を打ち立てる意を冠した中郎将号）", "wiki_title": "中郎将", "mapping_note": "", "ai_desc": "後漢末から三国時代にかけて有力部将に授けられた征討用の中郎将号（比二千石相当）。建安3年（198年）、袁術のもとを離れて呉へ帰還した24歳の周瑜に対し、孫策が自ら出迎えて授け、兵二千人と騎馬五十匹を委ねた（『三國志』巻54・周瑜伝）。", "yomi": "けんいちゅうろうじょう", "office_group": "military", "match_terms": ["行建威中郎将", "行建威中郎將", "建威中郎将", "建威中郎將"]}, "従事": {"title": "治中従事・従事（ちちゅうじゅうじ／じゅうじ：州牧・刺史が独自に辟召する州の高級幕僚）", "wiki_title": "従事", "mapping_note": "", "ai_desc": "州牧・刺史の下に置かれた幕僚（『続漢書』百官志五）。とりわけ「治中従事（治中）」は別駕従事と並ぶ州庁の最高幹部であり、州内の文書・選挙（人事考課）の中枢を掌った。冀州牧・韓馥は当初、勃海太守・袁紹の挙兵を抑え込むため従事を派遣して監視させていたが、東郡太守・橋瑁の檄文が届いた際、治中従事・劉子恵から「兵を興すのは国のためであって袁氏か董氏かの問題ではない」と諫められて反董卓連合に加わった（王粲『英雄記』）。", "yomi": "じゅうじ", "office_group": "local", "match_terms": ["従事", "從事"]}, "昭武将軍": {"title": "昭武将軍（しょうぶしょうぐん：武徳を明らかにする意を冠した雑号将軍）", "wiki_title": "雑号将軍", "mapping_note": "", "ai_desc": "三国時代から晋代にかけて置かれた雑号将軍の一つ。孫呉では景帝（孫休）の永安年間（258〜264年）、魯粛の遺腹の子である魯淑が昭武将軍・都亭侯・武昌督に任じられたほか、曹魏・西晋でも第三〜四品相当の将軍号として用いられた（『三國志』巻54・魯粛伝、『晋書』巻24・職官志）。", "yomi": "しょうぶしょうぐん", "office_group": "military", "match_terms": ["昭武将軍", "昭武將軍"]}, "校尉": {"title": "校尉（こうい：将軍に次ぐ武官号、宿衛・辺境・諸軍の部隊指揮官）", "wiki_title": "校尉", "mapping_note": "", "ai_desc": "漢代から魏晋にかけて将軍に次ぐ地位に置かれた武官号（『続漢書』百官志四）。中央の北軍五校尉（屯騎・越騎・歩兵・長水・射声）や司隷校尉・西域戊己校尉などの定設職のほか、出征軍や宿衛部隊を率いる諸校尉が置かれた。建安16年（211年）閏8月の潼関北渡の戦いでは、曹操と同郷（沛国譙県出身）の校尉・丁斐（のち典軍校尉）が牛馬を解き放って馬超軍の追撃を乱し、曹操の渡河を助けた（『三國志』巻1・武帝紀、巻9・曹爽伝注引『魏略』）。", "yomi": "こうい", "office_group": "military", "match_terms": ["校尉"]}, "横江将軍": {"title": "横江将軍（おうこうしょうぐん：長江を制覇・横断する武威を冠した孫呉の雑号将軍）", "wiki_title": "雑号将軍", "mapping_note": "", "ai_desc": "孫呉で置かれた雑号将軍の一つ。建安19年（214年）閏五月、漢昌太守・偏将軍として陸口に駐屯していた魯粛が、孫権の廬江郡皖城攻略に従軍した功により横江将軍へ転任し、建安22年（217年）に没するまで帯びた（『三國志』巻47・呉主伝、巻54・魯粛伝）。", "yomi": "おうこうしょうぐん", "office_group": "military", "match_terms": ["横江将軍", "横江將軍", "橫江将軍", "橫江將軍"]}, "横野中郎将": {"title": "横野中郎将（おうやちゅうろうじょう：山野を縦横に制圧する武威を冠した中郎将号）", "wiki_title": "中郎将", "mapping_note": "", "ai_desc": "後漢末から三国時代にかけて有力部将に授けられた雑号中郎将の一つ。建安13年（208年）春、孫権の黄祖親征において先鋒を務め敵将・陳就の首を討ち取った呂蒙が、戦勝の殊勲第一として横野中郎将に任じられ銭千万を賜ったほか、曹魏の徐晃らも帯びた（『三國志』巻17・徐晃伝、巻54・呂蒙伝）。", "yomi": "おうやちゅうろうじょう", "office_group": "military", "match_terms": ["横野中郎将", "横野中郎將", "橫野中郎将", "橫野中郎將"]}, "牧": {"title": "牧（州牧）", "wiki_title": "州牧", "mapping_note": "", "ai_desc": "一州の行政・軍事・人事を直接統括する最高地方長官。後漢では長らく六百石の監察官である「刺史」が置かれていたが、霊帝の中平5年（188年）に劉焉の建言によって主要州に中央の九卿経験者などを「州牧（牧）」として派遣する制度が復活し、州牧が事実上の独立領
