ki_title": "鼓吹", "mapping_note": "", "ai_desc": "太鼓（鼓）・鉦・簫・笳（笛）などの打楽器と吹奏楽器からなる軍楽・儀仗音楽隊。漢代には軍中で士気を鼓舞し行軍・宴席を彩る象徴であり、特に帝号を僭称していた袁術は大規模な宮廷百工（職人団）と鼓吹（楽隊）を抱えていたが、建安4年（199年）の皖城攻略によってそのすべてが孫策・周瑜の手中に帰した（『江表伝』）。", "match_terms": ["鼓吹（軍楽隊）", "鼓吹（軍樂隊）", "鼓吹"]}, "𦩷𦪇": {"title": "𦩷𦪇（こうろ：『艠艪』とも書く、船室・覆いを備えた大型の屋形輸送船）", "category": "水軍・船舶用語", "wiki_title": "", "mapping_note": "", "ai_desc": "『釈名』釈船や『三國志』呂蒙伝注などにみえる大型船の一種（「艠艪」「艑艪」とも表記）。甲板上に深い船室や覆い構造を持つ商船・輸送船であったため、呂蒙は船底に武装した精鋭兵を満載して外から見えないように隠し、関羽が設けた長江沿岸の烽火台（見張り所）を欺いて無血突破した。", "match_terms": ["𦩷𦪇"]}};
  const PERSONS_INFO = {"襲粛": {"wiki_title": "襲粛", "ai_desc": "後漢末の益州出身の部将（生没年不詳）。建安13年（208年）の烏林・南郡攻防戦の頃、軍勢を挙げて孫権陣営へ帰順した。周瑜が上表してその兵を呂蒙へ編入しようとしたが、呂蒙が襲粛の胆力・器量と遠来の信義を称えて反対したため、孫権により兵を還付された（『三國志』巻54・呂蒙伝）。", "yomi": "しゅうしゅく", "name": "襲粛（しゅうしゅく：軍を挙げて孫呉に帰附した益州の部将、呂蒙の進言により兵を還付される）", "role": "益州出身の孫呉帰順部将"}, "秦松": {"wiki_title": "秦松", "ai_desc": "秦松（しんしょう）：字は文表、広陵郡の人。同郡の張紘・陳端とともに江東へ渡り、彭城の張昭と並んで孫策の参謀中枢（謀主）として重用され、上奏文や戦略の立案に携わった（『三國志』巻46・孫策伝、巻53・張紘伝）。", "yomi": "しんしょう", "name": "秦松（しんしょう）"}, "杜密": {"wiki_title": "杜密", "ai_desc": "字は周甫、潁川郡陽城県の人（？〜169年）。豫州刺史・周景に従事として辟召されたのち、代郡太守・泰山太守・北海相・尚書令・河南尹・太僕を歴任した。同郷の李膺と名声を等しくして「李杜」と並称され、「八俊」の一人に数えられたが、建寧2年（169年）の第二次党錮の禁に際し自害した（『後漢書』巻67・党錮列伝）。", "yomi": "とみつ", "name": "杜密（とみつ：字は周甫、潁川郡陽城県出身の後漢の太僕、李膺と並称された「八俊」の一人）", "role": "後漢の北海相・太僕（党錮の名士）"}, "諸葛亮": {"wiki_title": "諸葛亮", "ai_desc": "諸葛亮（しょかつりょう）：字は孔明。蜀漢の丞相。", "yomi": "しょかつりょう", "name": "諸葛亮（しょかつりょう）"}, "凌統": {"wiki_title": "凌統", "ai_desc": "字は公績、呉郡餘杭県の人（189年〜217年、一説に237年）。凌操の子。父の戦死後に兵を継いで別部司馬となり、黄祖討伐や江陵攻防戦、逍遥津の戦い等で奮戦して偏将軍に至った。国士を愛し財を軽んじて義を重んじる気風で知られた（『三國志』巻55・凌統伝）。", "yomi": "りょうとう", "name": "凌統（りょうとう：字は公績、呉郡餘杭県出身の孫呉の偏将軍、凌操の子）", "role": "孫呉の別部司馬・偏将軍（凌操の子）"}, "魏冉": {"wiki_title": "魏冉", "ai_desc": "戦国秦の宰相・武将（？〜前265年頃）。昭襄王の母・宣太后の異父弟。昭襄王を擁立して相国となり、穣に封じられて「穰侯」と号し、白起を登用して諸国を連破し秦の強盛を築いた。のち范雎の進言により罷免され、封邑の陶で没した（『史記』巻72・穰侯列伝）。", "yomi": "ぎぜん", "name": "魏冉・穰侯（ぎぜん／じょうこう：戦国秦の昭襄王を補佐して強秦の礎を築いた宰相・宣太后の異父弟）", "role": "戦国秦の相国・穰侯"}, "張儀": {"wiki_title": "張儀", "ai_desc": "戦国時代の縦横家・秦の相（？〜前309年）。魏の人。秦の恵文王に仕え、強国・秦と諸侯を個別に結ばせる「連衡」の策を唱えて蘇秦らの合従を切り崩し、巧みな弁舌で列国を動かした。蘇秦と並び「蘇張」と称される弁士の代表格（『史記』巻70・張儀列伝）。", "yomi": "ちょうぎ", "name": "張儀（ちょうぎ：戦国時代の縦横家・秦の宰相、連衡策を主導した大弁士）", "role": "戦国時代の縦横家・秦の相"}, "郝普": {"wiki_title": "郝普", "ai_desc": "字は子太、義陽郡の人（？〜230年）。建安20年（215年）、劉備配下の零陵太守として籠城したが、旧友・鄧玄之を通じた呂蒙の計略で開城し、湘水分割後に返還された。のち孫呉に仕えて廷尉に至ったが、黄龍2年（230年）に隠蕃の事件で責められ自害した（『三國志』巻45・楊戯伝、巻54・呂蒙伝、巻57・胡綜伝）。", "yomi": "かくふ", "name": "郝普（かくふ：字は子太、義陽出身の劉備配下の零陵太守、呂蒙の計略により開城し後に孫呉の廷尉に至る）", "role": "劉備配下の零陵太守・のち孫呉の廷尉"}, "袁胤": {"wiki_title": "袁胤", "ai_desc": "袁胤（えんいん）：汝南汝陽の人。袁術の従弟。建安4年（199年）に袁術が病死すると、曹操を恐れて寿春を放棄し、袁術の女婿・黄猗とともに袁術の棺と妻子・部曲を率いて皖城の廬江太守・劉勲のもとへ身を寄せたが、孫策の皖城攻略により捕らえられて呉郡へ移された（『江表伝』）。", "yomi": "えんいん", "name": "袁胤（えんいん）"}, "曹仁": {"wiki_title": "曹仁", "ai_desc": "豫州沛国譙県の人（168年〜223年）、字は子孝。曹操の従弟（祖父は曹褒、父は熾）。若き日は弓馬と狩猟を好んで豪傑千余人を集め、曹操の挙兵に従い別部司馬・行厲鋒校尉として常に騎兵の先鋒を務めた。徐州征伐・呂布討伐・張繡征討で戦功を重ね、建安4年（199年）4月には史渙とともに黄河を渡り犬城で眭固を撃破・斬殺した。のち官渡の戦いでの隠強・鶏洛山奇襲、赤壁後の江陵防衛戦、建安24年（219年）の関羽に対する樊城死守など数多の危機を救い、文帝（曹丕）の代に大将軍・大司馬に昇った（『三國志』巻9・曹仁伝）。", "yomi": "そうじん", "name": "曹仁（そうじん：字は子孝、曹操の従弟、大司馬・陳忠侯、創業の先鋒から樊城死守まで曹氏随一の武勲を立てた名将）", "role": "後漢末〜三国魏の征南将軍・大将軍・大司馬・陳忠侯（豫州沛国譙県の人、曹操の従弟）"}, "周異": {"wiki_title": "", "ai_desc": "廬江郡舒県の人。後漢の洛陽令を務めた人物で、周瑜の父。一族からは従父の周景、従兄弟の周忠がともに後漢の太尉に登っている（『三國志』巻54・周瑜伝）。", "yomi": "しゅうい", "name": "周異（しゅうい：廬江郡舒県出身の後漢の洛陽令、周瑜の父）", "role": "後漢の洛陽令（周瑜の父）"}, "荀緄": {"wiki_title": "荀コン", "ai_desc": "潁川郡潁陰県の人。朗陵長・荀淑の子（「荀氏八龍」の一人）で、尚書令・荀彧の父。若い頃に豫州刺史・周景に従事として辟召され、のち尚書を経て済南相に至った（『後漢書』巻62・荀淑伝、『三國志』巻10・荀彧伝、巻54・周瑜伝注引謝承『後漢書』）。", "yomi": "じゅんこん", "name": "荀緄（じゅんこん：潁川郡潁陰県出身の後漢の済南相、荀淑の子・荀彧の父）", "role": "後漢の尚書・済南相（荀彧の父）"}, "魯睦": {"wiki_title": "", "ai_desc": "孫呉の武将（生没年不詳）。臨淮郡東城県を本貫とする魯粛の孫で、夏口督・魯淑の子。鳳凰3年（274年）に父・魯淑が死去すると、その爵位である都亭侯を襲封し、父が統率していた部曲・兵馬を引き継いで領した（『三國志』巻54・魯粛伝）。", "yomi": "ろぼく", "name": "魯睦（ろぼく：魯粛の孫・魯淑の子、父の死後に都亭侯を継ぎ兵馬を領す）", "role": "孫呉の武将・都亭侯（魯粛の孫・魯淑の子）"}, "陳蕃": {"wiki_title": "陳蕃", "ai_desc": "汝南郡平輿県の人（?〜168年）。李膺・竇武らとともに清流派（党人）の最高指導者「三君」と仰がれた剛直の名臣。桓帝期に太尉として宦官の専横を厳しく諫めて党人を弁護し、霊帝即位に際して竇太后から太傅・録尚書事に任じられた。大将軍・竇武と心を合わせて宦官勢力の一掃を計画したが、建寧元年（168年）9月に計画が漏洩し、八十余歳の老躯で剣を抜いて宮中に突入するも捕らえられ、即日処刑された（『後漢書』巻66・陳蕃伝）。議郎となった曹操は上書して竇武・陳蕃らの忠直と冤罪を痛切に訴えた（王沈『魏書』）。", "yomi": "ちんばん", "name": "陳蕃（ちんばん：字は仲挙、後漢の太尉・太傅・高陽郷侯、清流派の最高指導者）", "role": "後漢の太尉・太傅・録尚書事（汝南郡平輿県の人、「三君」の一人）"}, "謝奇": {"wiki_title": "", "ai_desc": "揚州廬江郡の人（生没年不詳）。曹魏により蘄春典農に任じられ、皖県の田郷に駐屯してたびたび孫呉の辺境を侵した。呂蒙からの帰順勧告に従わなかったため、隙を突いた呂蒙の襲撃を受けて縮退し、配下の孫子才・宋豪らは老弱を連れて呂蒙に降伏した（『三國志』巻54・呂蒙伝）。", "yomi": "しゃき", "name": "謝奇（しゃき：廬江郡出身の曹魏の蘄春典農、皖の田郷に駐屯し呂蒙に撃退される）", "role": "曹魏の蘄春典農（廬江郡出身）"}, "麋芳": {"wiki_title": "麋芳", "ai_desc": "徐州東海郡朐県の人、字は子方。安漢将軍・麋竺の弟。兄とともに莫大な家財を投じて徐州時代から劉備に従い、劉備の入蜀後は荊州に残留して南郡太守に任じられ、本拠の江陵を守備した。しかし日頃から関羽に自分を軽んじられていると不満を抱いており、建安24年（219年）に関羽が樊城へ出陣した際、軍資の供給が行き届かず関羽から「帰還したら処罰する」と脅されたため深く恐怖し、孫権・呂蒙の誘いに応じて使者を出し江陵を開城して呉へ降伏した（『三國志』巻36・関羽伝、巻38・麋竺伝、巻54・呂蒙伝）。", "yomi": "びほう", "name": "麋芳（びほう：字は子方、東海朐県の人、麋竺の弟、劉備配下の南郡太守として江陵を守るも関羽の処罰を恐れて孫権に降伏）", "role": "劉備配下の南郡太守→呉の将軍"}, "呂範": {"wiki_title": "呂範", "ai_desc": "呂範（りょはん）：字は子衡、汝南郡細陽県の人（？〜228年）。戦乱を避けて寿春に寓居していた際、若き孫策の器量を見抜いて門客百人を率いて帰属し、孫策の母・呉夫人を江都から曲阿へ迎える大任を果たした。のち孫策の江東平定・海西の陳瑀討伐・黄祖討伐のすべてに従軍した腹心の重臣（『三國志』巻56・呂範伝）。", "yomi": "りょはん", "name": "呂範（りょはん）"}, "周峻": {"wiki_title": "", "ai_desc": "廬江郡舒県の人（生没年不詳）。周瑜の兄の子。叔父・周瑜の赤壁・荊州開拓における元功によって孫権から偏将軍に拝され、吏士千人を統率した（『三國志』巻54・周瑜伝）。", "yomi": "しゅうしゅん", "name": "周峻（しゅうしゅん：廬江郡舒県出身の孫呉の偏将軍、周瑜の兄の子）", "role": "孫呉の偏将軍（周瑜の甥）"}, "周循": {"wiki_title": "周循", "ai_desc": "廬江郡舒県の人（生没年不詳）。周瑜の長男。孫権と歩夫人の間に生まれた娘（孫魯班、のち全琮に再嫁し全公主と称される）を娶り、騎都尉に拝された。父・周瑜の風格を受け継いでいたが、若くして早世した（『三國志』巻50・孫権歩夫人伝、巻54・周瑜伝）。", "yomi": "しゅうじゅん", "name": "周循（しゅうじゅん：周瑜の長男、孫権の娘・公主を娶り騎都尉となるも早世）", "role": "孫呉の騎都尉（周瑜の長男）"}, "張魯": {"wiki_title": "張魯", "ai_desc": "沛国豊県の人。五斗米道（天師道）を創始した祖父・張陵、父・張衡の教団を継ぎ、初平2年（191年）頃に益州牧・劉焉の命で漢中へ入って太守・蘇固を討ち、以後約三十年にわたり「師君」と称して祭酒・鬼卒による教団統治と義舎（無償の米・肉を置く宿舎）を設ける政権を漢中に築いた。建安16年（211年）3月、曹操が鍾繇を派遣して張魯討伐を図ったことが関中諸将（馬超・韓遂ら）の疑心と蜂起の端緒となった。のち建安20年（215年）に曹操の漢中親征を受けて降伏し、鎮南将軍・閬中侯（一万戸）として処遇された（『三國志』巻8・張魯伝）。", "yomi": "ちょうろ", "name": "張魯（ちょうろ：字は公祺、五斗米道の教主として漢中に約三十年間割拠した群雄）", "role": "漢中の群雄・五斗米道第3代教主（師君）・のち鎮南将軍・閬中侯"}, "蔣幹": {"wiki_title": "蒋幹", "ai_desc": "字は子翼、九江郡の人。端整な容姿と優れた弁舌で江・淮の間に名を馳せた。曹操の命を受け布衣葛巾の私行を装って旧知の周瑜を訪ね帰順を説こうとしたが、周瑜の揺るぎない忠義と雅量に圧倒され、帰還後にその高潔な器量を称えた（『三國志』巻54・周瑜伝注引『江表伝』）。", "yomi": "しょうかん", "name": "蔣幹（しょうかん：字は子翼、九江郡出身の弁士、曹操の使者として周瑜を訪ねる）", "role": "曹操配下の弁士（九江郡出身）"}, "斉桓公": {"wiki_title": "桓公 (斉)", "ai_desc": "春秋時代の斉の君主・小白（?〜前643年）。公位争いの際に自らの腹の帯鉤を射た宿敵・管仲（管夷吾）の才を惜しみ、鮑叔の推薦を容れて宰相に抜擢した。「尊王攘夷（周王室を尊び夷狄を打ち払う）」の旗印のもと、兵車を用いずに諸侯を九たび会盟させ（「九合諸侯、一匡天下」）、春秋五覇の筆頭として晋の文公と並び「斉桓・晋文（桓・文）」と称えられた（『史記』巻32・斉太公世家、『論語』憲問篇）。", "display_name": "斉桓公（春秋斉の覇者・小白）", "homonyms": [{"key": "魯桓公", "label": "魯桓公（春秋魯の君主・姫軌）"}], "yomi": "せいかんこう", "name": "斉の桓公・小白（せいのこうこう：春秋五覇の筆頭、管仲を宰相に任じて「尊王攘夷」を掲げ諸侯を九合した覇者）", "role": "春秋時代の斉の第16代君主（在位前685年〜前643年、姓は姜・氏は呂・名は小白）"}, "魯桓公": {"wiki_title": "桓公 (魯)", "ai_desc": "桓公（かんこう）：姫姓、諱は軌（？〜紀元前694年）。春秋時代の魯の第15代君主（在位：前711年〜前694年）。魯の恵公と正室・仲子の子で、隠公の異母弟。公子翬（羽父）と結託して兄の隠公を弑殺し君位に就いた（『春秋左氏伝』隠公十一年）。孫盛は、兄（孫策）から正統に大権を授けられて王業を築いた孫権は、兄を弑して位を奪った魯の桓公とは全く異なると論じた。", "display_name": "魯桓公（春秋魯の君主・姫軌）", "homonyms": [{"key": "斉桓公", "label": "斉桓公（春秋斉の覇者・小白）"}], "yomi": "ろかんこう", "name": "魯桓公（春秋魯の君主・姫軌）（ろかんこう）"}, "関羽": {"wiki_title": "関羽", "ai_desc": "司隸河東郡解県の人（?〜219年）、字は雲長（本字は長生）。亡命して涿郡に至り、劉備の郷里での挙兵以来、張飛とともに寝食を共にして侍立し、周瑜・程昱・郭嘉ら敵味方から「万人敵」「熊虎の将」と畏敬された。建安5年（200年）春正月、劉備が小沛で曹操に敗れて袁紹のもとへ奔った際、下邳を守備していた関羽は曹操に捕らえられて偏将軍として厚遇を受け、同年4月の白馬の戦いで袁紹軍の猛将・顔良を万衆の中で刺殺して恩義に報いたのち、賞賜を尽く封印して劉備のもとへ帰参した。のちに荊州を督して建安24年（219年）に前将軍・仮節鉞に進み、樊城の曹仁を包囲し漢水の暴漲に乗じて于禁の七軍を水没させ華夏を震撼させたが、背後から孫権・呂蒙に江陵を奇襲され、退却途上の南郡臨沮で子の関平とともに斬られた（『三國志』巻36・関羽伝）。", "yomi": "かんう", "name": "関羽（かんう：字は雲長、河東郡解県出身の蜀漢の前将軍・漢寿亭侯、万人敵と称えられた劉備股肱の義将）", "role": "後漢末〜劉備配下の偏将軍・襄陽太守・前将軍・仮節鉞・漢寿亭侯（司隸河東郡解県の人、諡は壮繆侯）"}, "孫子才": {"wiki_title": "", "ai_desc": "後漢末の部将（生没年不詳）。曹魏の蘄春典農・謝奇の配下として皖県の田郷に駐屯していた。謝奇が呂蒙の襲撃を受けて退却した際、同僚の宋豪らとともに老人や幼弱な家族を引き連れて呂蒙のもとへ赴き降伏した（『三國志』巻54・呂蒙伝）。", "yomi": "そんしさい", "name": "孫子才（そんしさい：蘄春典農・謝奇の部将、謝奇敗退後に老弱を率いて呂蒙へ降る）", "role": "蘄春典農・謝奇配下の部将"}, "呂布": {"wiki_title": "呂布", "ai_desc": "并州五原郡九原県の人（?〜198年）。弓馬の武芸と膂力に優れ「飛将」と称された。并州刺史・丁原に仕えて主簿となったが、董卓の誘いに応じて丁原を殺害し、董卓と父子の契りを結んで中郎将・都亭侯となった。しかし些細な怒りから董卓に手戟を投げつけられたことや董卓の侍女との密通が発覚することを恐れ、司徒・王允の計画に乗って初平3年（192年）4月に董卓を刺殺し、奮威将軍・温侯となった。だが6月に董卓の旧将・李傕と郭汜らに長安を攻め落とされて武関から関東へ脱出し、のちに張邈・陳宮に迎えられて兗州で曹操と死闘を繰り広げることとなる（『三國志』巻7・呂布伝）。", "yomi": "りょふ", "name": "呂布（りょふ：字は奉先、五原郡九原県出身の飛将・温侯、王允とともに董卓を討つも李傕らに敗れ関東へ奔る）", "role": "後漢末の群雄・中郎将・奮威将軍・温侯・のち徐州牧（并州五原郡九原県の人）"}, "袁術": {"wiki_title": "袁術", "ai_desc": "汝南郡汝陽県の人（?〜199年）。四世三公の名門・汝南袁氏の司空・袁逢の嫡子として生まれ、若くして侠気をもって知られ、虎賁中郎将となった。董卓が入京すると懐柔のため後将軍に任じられたが、董卓の暴政を恐れて南陽郡（魯陽）へ奔り、初平元年（190年）正月の反董卓連合軍で南方の主力を担った。後に袁紹・曹操と対立して揚州の寿春へ移り、建安2年（197年）に伝国の玉璽を頼みに帝位（「仲家」）を僭称したが、四方から孤立して窮死した（『三國志』巻6・袁術伝）。", "yomi": "えんじゅつ", "name": "袁術（えんじゅつ：字は公路、四世三公の汝南袁氏の嫡流・後将軍、のち寿春で仲家皇帝を僭称）", "role": "後漢末の群雄・後将軍・左将軍（汝南郡汝陽県の人、司空・袁逢の嫡子、袁紹の従弟〔または異母弟〕）"}, "項羽": {"wiki_title": "項羽", "ai_desc": "下相県の人（前232年〜前202年）、名は籍、字は羽。楚の将軍・項燕の孫。叔父・項梁とともに秦末の反乱で挙兵し、鉅鹿の戦いで秦の主力軍を撃破して秦帝国を滅ぼし、「西楚の覇王」と称して諸侯を分封した。その後、漢王・劉邦（漢の高祖）と約5年間にわたる楚漢戦争を繰り広げた末、前202年に垓下で四面楚歌に陥り烏江のほとりで自刃した。死後、最後まで項羽に殉じようとした魯の地を開城させるため、劉邦は項羽の首を示した上で魯公の礼をもって項羽を穀城に葬り、自ら墓前で発喪・泣哭して去った（『史記』巻7・項羽本紀）。東晋の孫盛は、曹操が袁紹の墓前で哭泣した行為を、この漢の高祖（劉邦）による項氏（項羽）への哭泣と並べて政道上の失策と論評した。", "yomi": "こうう", "name": "項氏・項羽（こうう：名は籍、字は羽、秦末の西楚の覇王、高祖劉邦と天下を争い烏江に自刃）", "role": "秦末の西楚の覇王（下相県の人、楚の名将・項燕の孫）"}, "魯淑": {"wiki_title": "魯淑", "ai_desc": "孫呉の武将（217年〜274年）、魯粛の遺腹の子。成人すると濡須督・張承に将来大成すると評された。永安年間に昭武将軍・都亭侯・武昌督となり、建衡年間に仮節・夏口督へ遷る。任地では常に軍規厳整で方略の才幹を備え、鳳凰3年（274年）に没した（『三國志』巻54・魯粛伝）。", "yomi": "ろしゅく", "name": "魯淑（ろしゅく：魯粛の遺腹の子、昭武将軍・都亭侯・武昌督・仮節・夏口督）", "role": "孫呉の武将（昭武将軍・都亭侯・武昌督・夏口督）"}, "黄祖": {"wiki_title": "黄祖", "ai_desc": "黄祖（こうそ）：荊州牧・劉表の配下の将・江夏太守（？〜208年）。初平3年（192年）、樊・鄧の間で孫堅に敗れて襄陽へ退いたが、夜間に峴山で追撃してきた孫堅を配下の兵が射殺し、孫氏にとって不倶戴天の仇敵となった。", "yomi": "こうそ", "name": "黄祖（こうそ）"}, "方叔": {"wiki_title": "", "ai_desc": "方叔（ほうしゅく）：周王朝中興の祖・宣王（前827年〜前782年在位）に仕えた卿士・名将。兵車三千乗を率いて南方の荊蛮（楚）を征討し大功を挙げた（『詩経』小雅・采芑「方叔涖止，其車三千」）。同時代の召虎（邵虎）と並べて「方・邵（方召）」と称され、王朝を支える名将の代名詞とされる。", "yomi": "ほうしゅく", "name": "方叔（ほうしゅく）"}, "呂琮": {"wiki_title": "", "ai_desc": "汝南郡富陂県の人（生没年不詳）。孫呉の南郡太守・孱陵侯である呂蒙の子で、呂覇・呂睦の兄。父・呂蒙の没後はまず弟の呂覇が孱陵侯を襲爵したが、呂覇が死去したのちに兄の呂琮がその侯爵を継承した。死後は末弟の呂睦が跡を継いだ（『三國志』巻54・呂蒙伝）。", "yomi": "りょそう", "name": "呂琮（りょそう：呂蒙の子・呂覇の兄、弟呂覇の没後に孱陵侯を継承）", "role": "孫呉の孱陵侯（呂蒙の子・呂覇の兄）"}, "呂睦": {"wiki_title": "", "ai_desc": "汝南郡富陂県の人（生没年不詳）。孫呉の南郡太守・孱陵侯である呂蒙の子で、呂琮・呂覇の弟。父・呂蒙の孱陵侯の爵位は兄の呂覇、ついで長兄の呂琮へと受け継がれ、呂琮が死去したのちに弟の呂睦が後を継いだ（『三國志』巻54・呂蒙伝）。", "yomi": "りょぼく", "name": "呂睦（りょぼく：呂蒙の子、兄の呂覇・呂琮に次いで孱陵侯を継承）", "role": "孫呉の孱陵侯（呂蒙の子・呂琮の弟）"}, "黄蓋": {"wiki_title": "黄蓋", "ai_desc": "黄蓋（こうがい）：字は公覆、零陵泉陵の人。孫堅の挙兵当初から従軍した孫呉の宿将。孫策の江東平定・山越討伐で活躍し、建安4年（199年）12月の黄祖討伐には「行武鋒校尉」として参戦した（『三國志』巻55・黄蓋伝、『呉録』）。", "yomi": "こうがい", "name": "黄蓋（こうがい）"}, "橋公": {"wiki_title": "橋公", "ai_desc": "廬江郡皖県にいた人物（生没年・諱・官歴は不詳）。大橋・小橋姉妹の父。建安4年（199年）末に孫策・周瑜が皖城を攻略した際、国色と謳われた二人の娘はそれぞれ孫策・周瑜に迎えられた（『三國志』巻54・周瑜伝および注引『江表伝』）。", "yomi": "きょうこう", "name": "橋公（きょうこう：廬江郡皖県の人物、大橋・小橋姉妹の父）", "role": "大橋・小橋の父（廬江郡皖県）"}, "劉備": {"wiki_title": "劉備", "ai_desc": "幽州涿郡涿県の人（161年〜223年）。前漢の中山靖王・劉勝の末裔。黄巾の乱で義勇兵を率いて従軍した後、同窓の公孫瓚のもとに身を寄せ、別部司馬として青州刺史・田楷とともに袁紹を防いだ功績により高唐尉・高唐令、ついで平原令・平原相に任じられた。その後、曹操の徐州侵攻に際して陶謙の救援に赴き、陶謙の没後に徐州を領して曹操・呂布・袁術らと中原の覇権を争い、のち荊州・益州を収めて蜀漢を建国した（『三國志』巻32・先主伝）。", "yomi": "りゅうび", "name": "劉備（りゅうび：字は玄徳、涿郡涿県出身の漢室宗親・のち蜀漢の初代皇帝〔昭烈帝〕）", "role": "後漢末の群雄・のち蜀漢の初代皇帝・昭烈帝（幽州涿郡涿県の人、中山靖王劉勝の末裔）"}, "張承_呉": {"wiki_title": "張承", "ai_desc": "孫呉の武将（178年〜244年）、字は仲嗣、彭城国の人（張範の弟・張承〔字は公先〕とは別人）。張昭の長男。長沙西部都尉を経て濡須督・奮威将軍・都郷侯に至り、赤烏7年に没した。人物鑑識に優れ、蔡款・謝景や若年の魯淑らの大成を見抜いた（『三國志』巻52・張承伝、巻54・魯粛伝）。", "display_name": "張承（彭城・張昭の長男／濡須督）", "homonyms": [{"key": "張承", "label": "張承（河内・張範の弟／諫議大夫）"}], "yomi": "ちょうしょう", "name": "張承（ちょうしょう：字は仲嗣、彭城の人・張昭の長男、濡須督・奮威将軍・都郷侯〔※河内の張承とは同姓同名の別人〕）", "role": "孫呉の武将（長沙西部都尉・濡須督・奮威将軍・都郷侯）"}, "張承": {"wiki_title": "張承 (後漢)", "ai_desc": "河内郡修武県の人（呉の張昭の長男・張承〔字は仲嗣〕とは同姓同名の別人）。太尉・張延の子で、魏国奉常・張範（字は公儀）の弟。議郎・伊闕都尉を経て、建安13年（208年）の丞相府開設後に諫議大夫・丞相参軍祭酒となり、建安18年（213年）5月の魏公勧進表に祭酒として連署した。その後、趙郡太守を兼領し、建安22年（217年）の曹操の漢中征討に際して長安で病没した（『三國志』巻1・武帝紀注引『魏書』、巻11・張範伝附張承伝）。", "display_name": "張承（河内・張範の弟／諫議大夫）", "yomi": "ちょうしょう", "name": "張承（ちょうしょう：字は公先、河内修武の人、張範の弟、諫議大夫・丞相参軍祭酒・領趙郡太守）", "role": "曹操幕府の参謀幕僚・地方長官（議郎・伊闕都尉・諫議大夫・丞相参軍祭酒・趙郡太守）"}, "劉繇": {"wiki_title": "劉繇", "ai_desc": "青州東萊郡牟平県の人（156年〜197年）。前漢の斉孝王の少子・牟平侯劉渫の末裔で、太尉・劉寵の甥、兗州刺史・劉岱の同母弟。19歳のときに叔父を盗賊から救出して名を挙げ、孝廉・郎中・下邑県長となり、権門の請託を拒んで官を棄てた清流派の名士。後に揚州刺史に任じられて曲阿を拠点とし、袁術および袁術配下の孫策と長江下流で激しく戦ったが敗れて豫章へ退き、その地で病没した。『三國志』呉書（巻49）に専伝（劉繇太史慈士燮伝）が立てられている。", "yomi": "りゅうよう", "name": "劉繇（りゅうよう：字は正礼、東萊郡牟平県出身の揚州刺史・振武将軍、孫策と江東の覇権を争った名門宗室）", "role": "後漢末の揚州刺史・揚州牧・振武将軍（東萊郡牟平県の人、兗州刺史・劉岱の弟）"}, "韓縯": {"wiki_title": "韓演", "ai_desc": "字は伯南、潁川郡舞陽県の人（『後漢書』桓帝紀等では「韓演」とも表記）。丹楊太守・河内太守・司隷校尉を経て、桓帝の永寿元年（155年）に司徒、延熹8年（165年）に司空を歴任した。河内太守時代には公明無私を重んじ、推挙した人物やその一門と私的な交際を持たなかったと伝えられる（『後漢書』巻7・孝桓帝紀、『三國志』巻54・周瑜伝注引張璠『漢紀』）。", "yomi": "かんえん", "name": "韓縯（かんえん：後漢の河内太守・司徒・司空、『後漢書』では韓演）", "role": "後漢の河内太守・司徒・司空"}, "顧邵": {"wiki_title": "顧邵", "ai_desc": "字は孝則、呉郡呉県の人（184年〜214年頃）。丞相・顧雍の長男で、母は陸康の娘、妻は孫策の娘。若くして舅の陸績と名を斉しくして人物鑑識に優れ、27歳で孫権に抜擢されて豫章太守となり、学校を興し礼教を広める善政を敷いたが、在任5年、年31で病没した（『三國志』巻52・顧雍伝附顧邵伝）。", "yomi": "こしょう", "name": "顧邵（こしょう：字は孝則、顧雍の長男、人物鑑識と善政で知られた孫呉の豫章太守）", "role": "孫呉の豫章太守（顧雍の長男）"}, "全琮": {"wiki_title": "全琮", "ai_desc": "字は子璜、呉郡銭唐県の人（？〜249年）。財を散じて士人を賑恤し名声を得て孫権に仕え、関羽討伐・洞口戦・東安郡の山越平定などで戦功を重ねた。黄龍元年（229年）に衛将軍・左護軍・徐州牧となり、孫権の娘・孫魯班（全公主）を娶り、赤烏9年（246年）に右大司馬に至った（『三國志』巻60・全琮伝）。", "yomi": "ぜんそう", "name": "全琮（ぜんそう：字は子璜、呉郡銭唐県出身の孫呉の衛将軍・右大司馬、全公主の夫）", "role": "孫呉の衛将軍・右大司馬・銭唐侯"}, "曹操": {"wiki_title": "曹操", "ai_desc": "沛国譙県の人（155年〜220年）。前漢の相国・曹参の末裔とされ、中常侍・大長秋・費亭侯となった曹騰の養子・曹嵩（太尉）の子として生まれた。後漢末の動乱期に兗州を拠点として献帝を許に迎え、官渡の戦いで袁紹を破って華北を統一、丞相・魏公・魏王に昇り、没後に子の曹丕（文帝）が魏を建国すると「太祖武皇帝」と追尊された。", "yomi": "そうそう", "name": "曹操（そうそう：字は孟徳、幼名は阿瞞・吉利、太祖武皇帝）", "role": "魏の基礎を築いた覇王（太祖武皇帝）・後漢の丞相・魏王"}, "周胤": {"wiki_title": "周胤", "ai_desc": "廬江郡舒県の人（？〜239年）。周瑜の次男で周循の弟。興業都尉に拝され孫氏一門の娘を娶り、兵千人を授けられて公安に駐屯した。黄龍元年（229年）に都郷侯に封じられたが、のちに罪を得て廬陵郡へ流され、赤烏2年（239年）に諸葛瑾・歩騭・朱然・全琮らの赦免陳情により許された直後に病没した（『三國志』巻54・周瑜伝）。", "yomi": "しゅういん", "name": "周胤（しゅういん：周瑜の次男、興業都尉・都郷侯、罪により廬陵郡へ流され赦免直後に病没）", "role": "孫呉の興業都尉・都郷侯（周瑜の次男）"}, "孫皎": {"wiki_title": "孫皎", "ai_desc": "字は叔朗、呉郡富春県の人（？〜219年）。孫堅の弟・孫静の子で孫権の従兄弟。兄・孫瑜の没後に兵を継ぎ、征虜将軍として夏口を鎮守した。建安24年（219年）の関羽討伐では呂蒙と並び軍の左右を督して荊州平定に参画し、同年没した（『三國志』巻51・孫皎伝、巻54・呂蒙伝）。", "yomi": "そんこう", "name": "孫皎（そんこう：字は叔朗、孫静の子・孫権の従兄弟、夏口を鎮守した征虜将軍）", "role": "孫呉の征虜将軍・都護（孫静の子）"}, "周公": {"wiki_title": "周公旦", "ai_desc": "西周王朝草創期の政治家・王族で、文王（姫昌）の四男、武王（姫発）の同母弟。兄・武王を助けて殷の紂王を討ち、武王が病に倒れた際には自ら身代わりとなることを三王の霊に祈ってその祝冊を「金縢」の匱に納めた。武王の崩御後、幼少の成王に代わって国政を摂行したため、弟の管叔・蔡叔らが「周公は成王に不利を図っている」と流言を放って殷の遺民・武庚とともに反乱を起こしたが、周公は東征してこれを鎮圧し、また成王が金縢の書を開いて周公の忠誠を知ったことで疑念が氷解した。成王が長じると政権を返上し、礼楽制度を定めて周王朝の基礎を固めたとされる（『尚書』金縢篇、『史記』巻33・魯周公世家）。", "yomi": "しゅうこう", "name": "周公（しゅうこう：周公旦、周の文王の子・武王の弟、幼主・成王を摂政として補佐し『金縢の書』の故事を残した聖人）", "role": "西周初期の王族・摂政（姓は姫・名は旦、文王の四男・武王の同母弟、魯の始祖）"}, "孫権": {"wiki_title": "孫権", "ai_desc": "揚州呉郡富春県の人（182年〜252年）、字は仲謀。破虜将軍・孫堅の次男で、討逆将軍・孫策の弟。建安5年（200年）に兄・孫策が刺客に襲われて急逝すると、わずか19歳で江東六郡の統治を引き継ぎ、張昭・周瑜・魯粛ら文武の英才を任用し、曹操の上表によって討虜将軍・領会稽太守となった。建安13年（208年）秋に曹操が荊州を制圧して江陵から長江を下ってくると、魯粛・周瑜および劉備の使者・諸葛亮の主戦論を容れて劉備と同盟を結び、周瑜・程普に精兵三万を授けて赤壁（烏林）で曹操の大軍を撃退させ、自らも別軍を率いて淮南の要衝・合肥を包囲した（張憙の救援接近を聞いて撤退）。のち荊州・交州を併せて黄龍元年（229年）に皇帝に即位し、三国呉を建国した（『三國志』巻1・武帝紀、巻47・呉主伝）。", "yomi": "そんけん", "name": "孫権（そんけん：字は仲謀、呉郡富春県出身の江東の覇主・のち呉の初代皇帝〔大帝〕、劉備と同盟して赤壁で曹操を阻み合肥を攻める）", "role": "後漢末の討虜将軍・会稽太守・車騎将軍・呉王・のち三国呉の初代皇帝・大帝（揚州呉郡富春県の人、孫堅の次男・孫策の弟）"}, "周景": {"wiki_title": "周景 (後漢)", "ai_desc": "字は仲郷（范曄『後漢書』では仲饗）、廬江郡舒県の人（？〜168年）。尚書令・周栄の子で、周瑜の従祖父（大伯父）。豫州刺史として陳蕃・李膺・荀緄・杜密・朱寓ら名士を辟召し、尚書令を経て桓帝の延熹6年（163年）および永康元年（167年）に太尉に登った（『後漢書』巻45・周栄伝附周景伝、『三國志』巻54・周瑜伝注引謝承『後漢書』）。", "yomi": "しゅうけい", "name": "周景（しゅうけい：字は仲郷、廬江郡舒県出身の後漢の太尉、周瑜の従祖父）", "role": "後漢の豫州刺史・尚書令・太尉（周栄の子・周瑜の従祖父）"}, "徐顧": {"wiki_title": "", "ai_desc": "孫呉の部将（生没年不詳）。成当・宋定とともに呂蒙の屯営の近くに駐屯していた。三将の死後、孫権は幼弱な子弟に代えてその兵を呂蒙に併合しようとしたが、呂蒙が「徐顧らはみな国事に勤労したゆえ廃してはならない」と三度上書して認めさせ、師を選んで遺児を輔導した（『三國志』巻54・呂蒙伝）。", "yomi": "じょこ", "name": "徐顧（じょこ：呂蒙の近隣に駐屯した孫呉の部将、死後に呂蒙の上書と尽力で遺児が保護される）", "role": "孫呉の部将"}, "謝承": {"wiki_title": "謝承", "ai_desc": "揚州会稽郡山陰県の人。孫権の妃・謝夫人の弟にあたり、博学洽聞で一度見た書物は終生忘れなかったと伝えられる。呉の五官郎中から長沙東部都尉・武陵太守を歴任し、散逸しつつあった後漢の史料を博捜して『後漢書』百三十巻（現存する范曄『後漢書』より約200年早い最古級の後漢通史）および『会稽先賢伝』を撰述した（『三國志』巻50・呉書妃嬪伝）。", "yomi": "しゃしょう", "name": "謝承（しゃしょう：字は偉平、三国呉の武陵太守・『後漢書』百三十巻を著した歴史家）", "role": "三国呉の歴史家・武陵太守（揚州会稽郡山陰県の人、孫権の謝夫人の弟）"}, "蔣欽": {"wiki_title": "蔣欽", "ai_desc": "字は公奕、九江郡寿春県の人（？〜219年）。孫策の渡江以前から仕え、山越平定や濡須の戦いで功を立てて盪寇将軍・右護軍に至る。孫権の勧学を受けて呂蒙とともに学問に励み、私怨を捨てて徐盛を推挙するなど国士と称えられ、関羽討伐からの帰途に病没した（『三國志』巻55・蔣欽伝）。", "yomi": "しょうきん", "name": "蔣欽（しょうきん：字は公奕、九江郡寿春県出身の孫呉の盪寇将軍・右護軍、呂蒙とともに勧学を受け国士と称えられる）", "role": "孫呉の武将（盪寇将軍・濡須督・右護軍）"}, "李膺": {"wiki_title": "李膺 (後漢)", "ai_desc": "字は元礼、潁川郡襄城県の人（110年〜169年）。清廉剛直をもって知られ、豫州刺史・周景に従事として辟召されたのち、漁陽太守・度遼将軍・河南尹・司隷校尉を歴任した。陳蕃らとともに宦官勢力と対立して士大夫の模範「八俊」の筆頭に挙げられたが、建寧2年（169年）の第二次党錮の禁により獄死した（『後漢書』巻67・党錮列伝）。", "yomi": "りよう", "name": "李膺（りよう：字は元礼、潁川郡襄城県出身の後漢の司隷校尉、党錮の名士「八俊」の筆頭）", "role": "後漢の河南尹・司隷校尉（党錮の名士）"}, "呂蒙": {"wiki_title": "呂蒙", "ai_desc": "豫州汝南郡富陂県の人（178年〜219年）、字は子明。少年の頃に姉の夫・鄧当に従って孫策の軍に入り、孫権から学問を勧められて篤学に励み、魯粛から「呉下の阿蒙にあらず」と感嘆された。魯粛の没後にその軍団を引き継いで陸口に駐屯し、外には関羽との親睦を装いつつ密かに荊州奪取を計画した。建安24年（219年）秋、関羽が主力を率いて樊城を攻めると病と称して建業へ下がって関羽を油断させ、精兵を大型商船（𦩷𦪇）の船底に伏せ白衣の商人に変装させて長江を遡上し、沿岸の烽火台を無力化した上で南郡太守・麋芳と公安の士仁を降伏させて江陵を無血占領した。関羽敗死の直後、公安・江陵で病が再発して四十二歳で没した（『三國志』巻54・呂蒙伝、巻36・関羽伝）。", "yomi": "りょもう", "name": "呂蒙（りょもう：字は子明、汝南富陂出身の呉の南郡太守・孱陵侯、「白衣揺櫓」の奇襲で関羽から江陵を奪取した名将）", "role": "三国呉の武将・偏将軍・左護軍・虎威将軍・南郡太守・孱陵孱侯"}, "袁雄": {"wiki_title": "", "ai_desc": "後漢末の孫策配下の校尉（生没年不詳）。若き呂蒙が義兄・鄧当の職吏を殺害して同郷の鄭長の家に逃れたのち、袁雄を頼って自首すると、折を見て孫策に呂蒙のことを取り成して言上した。これにより呂蒙は孫策に召見され、奇才を認められて左右に置かれた（『三國志』巻54・呂蒙伝）。", "yomi": "えんゆう", "name": "袁雄（えんゆう：孫策配下の校尉、自首した若き呂蒙を孫策に取り成して推挙した武官）", "role": "孫策配下の校尉"}, "蘇秦": {"wiki_title": "蘇秦", "ai_desc": "東周の洛陽の人（?〜前284年頃）。鬼谷先生に縦横の術を学び、秦の恵王に退けられたのち困窮の中で『太公陰符』を熟読して揣摩の術を完成させた。北方の弱小国であった燕の文侯に説いて趙・韓・魏・斉・楚と結ぶ対秦同盟「六国合従」を成立させ、合従の長として六国の相印を兼ね佩び、十五年間にわたり秦兵を函谷関から出させなかったとされる。また文侯没後に斉の宣王が喪に乗じて燕の十城を奪うと、斉へ赴いて宣王を説き伏せ十城を返還させて弱小の燕を救った。燕で母と私通したとの誹りや尾生の信を守らぬとの批判に対しても「信義や廉直の名は自らのためのものにすぎず、進取の臣は国の尊栄を図る」と弁明し、のち燕の昭王（または易王・噲）のために斉で反間活動に従事し、斉で刺客に襲われ車裂の刑に処された（『戦国策』燕策一、『史記』巻69・蘇秦列伝）。", "yomi": "そしん", "name": "蘇秦（そしん：字は季子、東周の洛陽の人、戦国時代に燕の文侯・易王に仕え六国合従を成し遂げた縦横家）", "role": "戦国時代の縦横家・六国合従の盟長（武安君）"}, "劉琮": {"wiki_title": "劉琮 (劉表の子)", "ai_desc": "兗州山陽郡高平県の人（生没年不詳）。荊州牧・劉表の次男で、長男・劉琦の弟。劉表の後妻・蔡氏の姪を妻としたことから蔡氏および蔡瑁・張允らの後ろ盾を得て寵愛され、建安13年（208年）8月に父・劉表が病没すると兄・劉琦を退けて後継者となり襄陽に駐屯した。同年9月、南征してきた曹操の軍が新野に到達すると、蒯越・韓嵩・傅巽らの進言を容れて曹操への降伏を決断した。このとき樊城に駐屯していた劉備には事前に降伏を知らせなかったため、気付いた劉備は夏口へと南走した。降伏後、曹操から青州刺史・列侯に拝され、のちに諫議大夫・参同軍事へと優遇された（『三國志』巻1・武帝紀、巻6・劉表伝）。", "yomi": "りゅうそう", "name": "劉琮（りゅうそう：荊州牧・劉表の次男、後妻蔡氏・蔡瑁らに擁立されて後を継ぎ、建安13年9月に曹操へ降伏）", "role": "後漢末の荊州牧・のち青州刺史・諫議大夫・参同軍事・列侯（兗州山陽郡高平県の人、劉表の次男・劉琦の弟）"}, "潘璋": {"wiki_title": "潘璋", "ai_desc": "兗州東郡発干県の人（?〜234年）、字は文珪。豪胆猛鋭な気性で若き日の孫権に抜擢され、山越討伐や合肥・濡須の戦いで戦功を重ねて偏将軍となった。建安24年（219年）冬の荊州攻略戦では孫権の命を受けて関羽の退路を遮断するため臨沮（夾石）へ急行し、配下の司馬・馬忠が関羽および子の関平・都督の趙累らを捕らえて即座に斬首した。この大功により固陵太守・振威将軍・溧陽侯に拝され、のち右将軍に進んだ（『三國志』巻55・潘璋伝、巻36・関羽伝裴松之注引『呉書』）。", "yomi": "はんしょう", "name": "潘璋（はんしょう：字は文珪、東郡発干出身の呉の振威将軍・右将軍・溧陽侯、臨沮で関羽父子の退路を断ち討ち取る）", "role": "三国呉の偏将軍・固陵太守・振威将軍・右将軍・溧陽侯"}, "周忠": {"wiki_title": "周忠", "ai_desc": "廬江郡舒県の人。太尉・周景の子で、周瑜の従父（伯叔父）世代にあたる。大司農を経て、献帝の初平3年（192年）冬12月に皇甫嵩の後任として太尉に任じられ、録尚書事を兼ねた（『後漢書』巻9・献帝紀、巻45・周栄伝附周景伝、『三國志』巻54・周瑜伝）。", "yomi": "しゅうちゅう", "name": "周忠（しゅうちゅう：廬江郡舒県出身の後漢の太尉、周景の子）", "role": "後漢の大司農・太尉（周景の子）"}, "孫登": {"wiki_title": "孫登", "display_name": "孫登（孫権の長男・宣太子）", "ai_desc": "字は子高、呉郡富春県の人（209年〜241年）。孫権の長男で、周瑜の娘を妃に迎えた（汲郡共県の隠者・孫登〔字は公和〕とは別人）。黄武元年（222年）に王太子、黄龍元年（229年）に皇太子に立てられ、諸葛恪・張休・顧譚・陳表ら四友と親交したが、赤烏4年（241年）に33歳で早世し宣太子と諡された（『三國志』巻59・孫登伝）。", "yomi": "そんとう", "name": "孫登（そんとう：字は子高、孫権の長男・皇太子、周瑜の娘婿、諡は宣太子）", "role": "孫呉の皇太子（孫権の長男・宣太子）"}, "諸葛瑾": {"wiki_title": "諸葛瑾", "ai_desc": "後漢末から三国呉にかけての政治家・武将。琅邪国陽都県（山東省沂南県）の人、字は子瑜。蜀の丞相・諸葛亮の兄。戦乱を避けて江東へ移り、孫権に仕えて長史・南郡太守・左将軍・大将軍を歴任した。黄武元年（222年）の江陵攻防戦では魏の夏侯尚・張郃らと交戦した（『三國志』巻52・諸葛瑾伝、巻17・張郃伝）。", "yomi": "しょかつきん", "name": "諸葛瑾（しょかつきん）"}, "陸遜": {"wiki_title": "陸遜", "ai_desc": "字は伯言（初名は陸議）、呉郡呉県の人（183年〜245年）。建安24年（219年）に病と称して退いた呂蒙に代わり陸口へ赴いて関羽を油断させ、荊州平定に参画した。黄武元年（222年）には大都督として夷陵で劉備軍を大破し、のち上大将軍・丞相・荊州牧・婁侯に至った（『三國志』巻58・陸遜伝）。", "yomi": "りくそん", "name": "陸遜（りくそん：字は伯言、呉郡呉県出身の孫呉の大都督・上大将軍・丞相）", "role": "孫呉の大都督・上大将軍・丞相・婁侯"}, "鄧龍": {"wiki_title": "", "ai_desc": "後漢末の武将。荊州牧・劉表配下の江夏太守・黄祖に仕えた部将。建安11年（206年）、黄祖の命により兵数千人を率いて柴桑へ侵攻したが、周瑜の追撃を受けて撃破され、生け捕りにされて呉へ護送された（『三國志』巻54・周瑜伝）。", "yomi": "とうりゅう", "name": "鄧龍（とうりゅう：江夏太守・黄祖の部将、柴桑へ侵攻して周瑜に捕らえられる）", "role": "江夏太守・黄祖の部将"}, "公孫僑": {"wiki_title": "子産", "ai_desc": "字は子産、春秋時代の鄭の公族・宰相（？〜前522年）。鄭の穆公の孫（子国の子）で、内政改革・刑書の鋳造と巧みな外交により晋・楚二大国の狭間で鄭を安泰に導いた。呉の公子・季札が鄭を訪れた際、初対面ながら旧知のごとく帯と衣を贈り合って親交を結び、後世「僑・札の分」として知己の交わりの代名詞となった（『春秋左氏伝』襄公二十九年、『史記』巻119・循吏列伝）。", "yomi": "こうそんきょう", "name": "公孫僑・子産（こうそんきょう／しさん：春秋時代の鄭の賢相、呉の季札と旧知のごとく親交を結ぶ）", "role": "春秋時代・鄭の宰相（字は子産）"}, "劉曄": {"wiki_title": "劉曄", "ai_desc": "後漢末から三国魏にかけての謀臣・政治家。淮南郡成悳県（安徽省寿県南東）の人、字は子揚。光武帝の子・阜陵王劉延の後裔。揚州の豪族・鄭宝を斬ってその衆を劉勲に委ねたのち曹操に仕え、倉亭の戦いや漢中張魯討伐などで献策した。魏王朝では侍中・大鴻臚・太中大夫を歴任した（『三國志』巻14・劉曄伝、巻17・張遼伝・張郃伝）。", "yomi": "りゅうよう", "name": "劉曄（りゅうよう）"}, "孫規": {"wiki_title": "", "ai_desc": "後漢末の孫呉の部将（生没年不詳）。建安20年（215年）に呂蒙らが長沙・零陵・桂陽三郡を進取した際、長沙郡酃県の救援に向かった劉備側の軍勢を迎え撃って撃破したことが、零陵城下で呂蒙が鄧玄之に語った言葉に記録されている（『三國志』巻54・呂蒙伝）。", "yomi": "そんき", "name": "孫規（そんき：建安20年の荊州三郡争奪戦で酃県への敵救援軍を撃破した孫呉の部将）", "role": "孫呉の部将"}, "晋文公": {"wiki_title": "文公 (晋)", "ai_desc": "春秋時代の晋の君主・重耳（前697年〜前628年）。驪姫の乱によって国外へ逃れ、趙衰・狐偃・介子推ら賢臣とともに19年間にわたり諸国を流亡した末、秦の穆公の支援を受けて62歳で帰国・即位した。国内の政治・軍制を整えて周の襄王の危難を救い、前632年の城濮の戦いで強国・楚を撃破し、践土の会盟で周王から諸侯の覇者（侯伯）に冊命された。斉の桓公と並んで覇道の理想像「桓・文」と並称される（『史記』巻39・晋世家）。のち建安15年冬12月の『述志令』においても、曹操自身が「斉桓・晋文の所以で今日に至った」と自らを桓・文になぞらえている。", "yomi": "しんぶんこう", "name": "晋の文公・重耳（しんのぶんこう：春秋五覇の代表、十九年の亡命を経て帰国し城濮の戦いで楚を破り覇業を樹立）", "role": "春秋時代の晋の第22代君主（在位前636年〜前628年、姓は姫・名は重耳）"}, "宋定": {"wiki_title": "", "ai_desc": "孫呉の部将（生没年不詳）。成当・徐顧とともに呂蒙の屯営の近くに駐屯していた。三将の死後、遺された子弟が幼弱であったため孫権はその兵を呂蒙へ併合しようとしたが、呂蒙が三度上書して国事への勤労を訴えて固辞したため廃絶を免れ、呂蒙の選んだ師により輔導された（『三國志』巻54・呂蒙伝）。", "yomi": "そうてい", "name": "宋定（そうてい：呂蒙の近隣に駐屯した孫呉の部将、死後に呂蒙の尽力で幼少の遺児が保護される）", "role": "孫呉の部将"}, "小橋": {"wiki_title": "小橋", "ai_desc": "廬江郡皖県の人（後世『三国志演義』等では「小喬」と表記）。橋公の次女で、大橋の妹。姉とともに国色と称えられた美女であり、建安4年（199年）の皖城攻略後に25歳の周瑜に迎えられた（『三國志』巻54・周瑜伝および注引『江表伝』）。", "yomi": "しょうきょう", "name": "小橋（しょうきょう：廬江郡皖県出身の女性、橋公の次女・周瑜の妻妾）", "role": "周瑜の妻妾（橋公の次女・大橋の妹）"}, "鄭長": {"wiki_title": "", "ai_desc": "後漢末の人物（生没年不詳）。汝南郡富陂県出身の呂蒙と同郷の人物（邑子）。若き呂蒙が義兄・鄧当の配下の職吏に侮辱されて怒りのあまり刀を抜いて殺害した際、出奔した呂蒙を自宅に匿った。のち呂蒙は校尉・袁雄を通じて自首し孫策に抜擢された（『三國志』巻54・呂蒙伝）。", "yomi": "ていちょう", "name": "鄭長（ていちょう：呂蒙と同郷〔邑子〕の人物、職吏を斬って逃亡した若き呂蒙を匿う）", "role": "呂蒙と同郷の人物（邑子）"}, "季札": {"wiki_title": "季札", "ai_desc": "春秋時代の呉の王族（生没年不詳）。呉王・寿夢の末子で、延陵に封じられたため「延陵の季子」と称される。父兄からの王位継承を固辞して節義を貫き、諸国歴訪の途上で鄭の公孫僑（子産）と出会って旧知の友のごとく親交を結んだほか、徐君の墓樹に宝剣を掛けた逸話でも知られる（『春秋左氏伝』襄公二十九年、『史記』巻31・呉太伯世家）。", "yomi": "きさつ", "name": "季札（きさつ：春秋時代の呉の公子・「延陵の季子」、鄭の公孫僑と「僑・札の分」を結んだ賢人）", "role": "春秋時代・呉の公子（延陵の季子）"}, "樊本": {"wiki_title": "", "ai_desc": "後漢末の劉備陣営の部将（生没年不詳）。建安20年（215年）の荊州三郡争奪戦の頃、長沙・零陵方面に屯営を構えていたが孫呉軍に撃破され、これに関連して酃県を救援しようとした部隊も孫規に敗れたことが、呂蒙から鄧玄之への言葉の中に見える（『三國志』巻54・呂蒙伝）。", "yomi": "はんほん", "name": "樊本（はんほん：荊州南部方面に屯営を構えていた劉備陣営の部将）", "role": "劉備陣営の荊州方面部将"}, "光武帝": {"wiki_title": "光武帝", "ai_desc": "南陽郡蔡陽県春陵郷の人（前6年〜後57年）、前漢の景帝の子・長沙定王劉発の末裔。王莽の新朝末期に兄・劉縯とともに舂陵で挙兵し、昆陽の戦いで新の主力軍を撃破したのち河北を平定して建武元年（25年）6月に鄗で皇帝に即位、洛陽を都と定めて赤眉・隗囂・公孫述ら群雄を次々と平定し漢王朝を再興（「光武中興」）した。創業の過程において、遠征中の鄧禹や来歙ら腹心の将帥に臨機応変の「承制」権を認めて迅速に威信と懐柔を示させたことが、後世の献帝の詔でも模範として称揚されている（『後漢書』巻1・光武帝紀、『三國志』巻1・武帝紀注引『漢魏春秋』）。", "yomi": "こうぶてい", "name": "光武帝・世祖（こうぶてい／せいそ：諱は劉秀、字は文叔、後漢の初代皇帝・世祖光武皇帝）", "role": "後漢の初代皇帝（在位25年〜57年、廟号は世祖）"}, "和帝": {"wiki_title": "和帝 (漢)", "ai_desc": "姓は劉、諱は肇（79年〜105年、在位88年〜105年）。後漢の第4代皇帝で、章帝の第4皇子。10歳で即位し、永元4年（92年）に宦官・鄭衆と謀って外戚の大将軍・竇憲一族を誅滅して親政を開始した（『後漢書』巻4・孝和孝殤帝紀）。", "yomi": "わてい", "name": "和帝（わてい：諱は劉肇、後漢の第4代皇帝、章帝の子）", "role": "後漢の第4代皇帝（在位88年〜105年）"}, "祁奚": {"wiki_title": "祁奚", "ai_desc": "春秋時代の晋の大夫・中軍尉（生没年不詳）。老齢により致仕する際、晋の悼公に後任を問われて私怨のあった解狐を推し、解狐の死後に再問されると実子の祁午を推挙した。『左伝』に「外挙は讎を避けず、内挙は親を避けず」と称えられ、私情を挟まぬ公正な人材推挙の故事となった（『春秋左氏伝』襄公三年）。", "yomi": "きけい", "name": "祁奚（きけい：春秋時代・晋の中軍尉、仇や実子を私情なく推挙した公正無私の大夫）", "role": "春秋時代・晋の大夫・中軍尉"}, "英布": {"wiki_title": "英布", "ai_desc": "秦末・楚漢戦争期の武将（?〜前196年）、六県の人。若い頃に法に触れて黥刑（顔に入れ墨を施す刑）を受けたことから「黥布（げいふ）」と通称された。驪山の徒刑から蜂起して項梁・項羽に従い、常に諸軍の先鋒となって秦軍を撃破した功により項羽から九江王に封じられた。のち漢王・劉邦に帰順して垓下の戦いで項羽を滅ぼし、前漢建国後に異姓諸侯王の一人として淮南王に封じられたが、高祖11年（前196年）に反乱を起こして敗死した（『史記』巻91・黥布列伝、『漢書』巻34・黥布伝）。諸葛亮は関羽への書簡で馬超の武勇を「黥（英布）・彭（彭越）の徒」に擬した。", "yomi": "えいふ", "name": "英布・黥布（えいふ／げいふ：秦末・楚漢戦争期の猛将、九江王ついで前漢の淮南王、彭越・韓信と並ぶ創業期の英傑）", "role": "楚漢戦争期の九江王→前漢の淮南王"}, "馬超": {"wiki_title": "馬超", "ai_desc": "司隸右扶風茂陵県の人（176年〜222年）。伏波将軍・馬援の後裔で、衛尉・馬騰の長男。司隷校尉・鍾繇のもとで郭援・高幹を平陽に破って偏将軍・都亭侯となり、父・馬騰の入朝後にその部曲を引き継いだ。建安16年（211年）3月、鍾繇の漢中張魯討伐を自分たちへの襲撃と疑い、韓遂・楊秋・李堪・成宜ら関中十部の諸将と結んで挙兵し、潼関・渭南で曹操と交戦したが、同年9月に賈詡の離間策と虎騎の挟撃に敗れて涼州へ逃れた。その後、隴上で再起を図ったのち張魯を経て劉備に帰順し、蜀漢の左将軍・驃騎将軍・涼州牧・斄郷侯となった（『三國志』巻36・馬超伝）。", "yomi": "ばちょう", "name": "馬超（ばちょう：字は孟起、関中諸将を率いて潼関・渭南で曹操と戦った将軍）", "role": "右扶風茂陵出身の将軍・偏将軍・都亭侯、のち蜀漢の驃騎将軍・斄郷威侯"}, "董卓": {"wiki_title": "董卓", "ai_desc": "隴西郡臨洮県の人（?〜192年）。羌族との戦いで武名を挙げ、前将軍・并州牧となった。中平6年（189年）、大将軍・何進の召還を受けて洛陽へ進軍し、何進の死と宮中の混乱に乗じて兵権を掌握すると、少帝（劉弁）を廃して弘農王とし、陳留王（献帝・劉協）を擁立して何太后と弘農王を弑逆した。曹操の才幹を評価して驍騎校尉に上表したが曹操に脱出され、関東諸侯の反董卓連合軍が蜂起すると長安へ遷都した（『三國志』巻6・董卓伝）。", "yomi": "とうたく", "name": "董卓（とうたく：字は仲穎、隴西郡臨洮県出身・少帝を廃し献帝を擁立して朝政を壟断した暴雄）", "role": "後漢の相国・太師・郿侯（隴西郡臨洮県の人）"}, "裴松之": {"wiki_title": "裴松之", "ai_desc": "本貫は河東郡聞喜県の人（372年〜451年）、字は世期。南朝宋の文帝（劉義隆）から陳寿『三國志』が簡略に過ぎるとして注釈編纂の勅命を受け、元嘉6年（429年）に全六十五巻の『三國志注』（裴松之注）を完成させて上表した（自称の「臣松之」は皇帝への上表形式による）。現在では散逸してしまった王沈『魏書』・魚豢『魏略』・韋昭『呉書』・司馬彪『九州春秋』・郭頒『世語』など二百種以上の漢末・魏晋期の史書・家伝・記録を博捜して本文の欠落や異伝を補い、あわせて史料批判や人物論評を加えており、文帝から「不朽の業」と激賞された（『宋書』巻64・裴松之伝）。", "yomi": "はいしょうし", "name": "裴松之（はいしょうし：字は世期、河東郡聞喜県出身の南朝宋の歴史家・中書侍郎・太中大夫、『三國志注』の撰者）", "role": "東晋末〜南朝宋の歴史家・中書侍郎・司州主簿・永嘉太守・国子博士・太中大夫（本貫は司州河東郡聞喜県）"}, "周護": {"wiki_title": "", "ai_desc": "廬江郡舒県の人（生没年不詳）。偏将軍・周峻の子で、周瑜の従孫。父・周峻の死後、全琮が上表して将に推挙したが、性行に危うさがあり登用すればかえって禍を招くとして孫権に退けられた（『三國志』巻54・周瑜伝）。", "yomi": "しゅうご", "name": "周護（しゅうご：周瑜の兄の孫・周峻の子、全琮に推挙されるも孫権に退けられる）", "role": "孫呉の偏将軍・周峻の子"}, "甘寧": {"wiki_title": "甘寧", "ai_desc": "甘寧（かんねい）：字は興覇、巴郡臨江の人。若き日に劉璋に対する沈弥・婁発らの反乱に加わって荊州へ逃れ、のちに呉の孫権に仕えて猛将として活躍した（『三國志』巻55・甘寧伝）。", "yomi": "かんねい", "name": "甘寧（かんねい）"}, "夔": {"wiki_title": "", "ai_desc": "中国古代の帝・舜に仕えた楽官（典楽）。『尚書』舜典に舜から音楽による教化を命じられたと記され、石を撃てば百獣が率い舞うほどの妙なる音律を奏でたと伝わる。後世、音楽・音律の達人の代名詞として師曠らと並び称された（『尚書』舜典、『史記』巻1・五帝本紀）。", "yomi": "き", "name": "夔（き：古代の帝・舜に仕えた伝説の楽官、音律の達人）", "role": "古代・舜帝の楽官（典楽）"}, "程普": {"wiki_title": "程普", "ai_desc": "程普（ていふ）：字は徳謀、右北平土垠の人。孫堅の代から従軍した孫呉最古参の宿将。孫策の江東平定・厳白虎討伐・黄祖討伐でも常に主力として活躍し、厳白虎を受け入れた餘杭の許昭を攻めるよう進言した（『三國志』巻55・程普伝、『呉録』）。", "yomi": "ていふ", "name": "程普（ていふ）"}, "孔子": {"wiki_title": "孔子", "ai_desc": "春秋時代の魯の人（前551年〜前479年）、名は丘、字は仲尼。仁と礼を核とする儒学を創始した。『論語』公冶長篇において、孔子が子貢に「お前と回（顔淵）とではどちらが優れているか」と問い、子貢が「どうして回に及びましょう」と答えると、孔子が「弗如也、吾與女弗如也（及ばないな、私もお前も彼には及ばない）」と愛弟子の顔淵を称揚した故事があり、曹操は『故太尉橋玄を祀る文』において、大先輩の橋玄が若き日の自分を過分に称賛・推挽してくれた恩義をこの故事になぞらえた。", "yomi": "こうし", "name": "孔子・仲尼（こうし／ちゅうじ：名は丘、字は仲尼、春秋時代の魯の思想家・儒家の始祖）", "role": "春秋時代の思想家・儒家の始祖（魯国昌平郷陬邑の人）"}, "朱寓": {"wiki_title": "朱寓", "ai_desc": "沛国の人（？〜169年）。豫州刺史・周景に従事として辟召され、のち尚書に至った。李膺・杜密・荀昱らとともに天下の清流名士「八俊」の一人に数えられたが、建寧2年（169年）の第二次党錮の禁に連坐して獄死した（『後漢書』巻67・党錮列伝、『三國志』巻54・周瑜伝注引謝承『後漢書』）。", "yomi": "しゅぐう", "name": "朱寓（しゅぐう：沛国出身の後漢の尚書、党錮の名士「八俊」の一人）", "role": "後漢の尚書（党錮の名士「八俊」の一人）"}, "朱光": {"wiki_title": "朱光", "ai_desc": "後漢末、曹操に任じられた廬江太守（生没年不詳）。皖城に駐屯して大いに稲作を開き、鄱陽の賊帥を招誘して内応させようとした。建安19年（214年）閏五月、呂蒙の進言による孫権の親征と甘寧・呂蒙の急攻を受けて皖城は陥落し、男女数万口とともに捕らえられた（『三國志』巻47・呉主伝、巻54・呂蒙伝）。", "yomi": "しゅこう", "name": "朱光（しゅこう：曹操が派遣した廬江太守、皖城で大いに稲作を開くも孫権・呂蒙に攻略される）", "role": "曹操配下の廬江太守"}, "張昭": {"wiki_title": "張昭", "ai_desc": "張昭（ちょうしょう）：字は子布、徐州彭城国の人（156年〜236年）。戦乱を避けて江東へ渡っていた北方名士の筆頭格。江東を平定した孫策に三顧の礼で迎えられて長史・撫軍中郎将となり、文武の政務を一手に委ねられて張紘らとともに孫策の「謀主」となった（『三國志』巻52・張昭伝）。", "yomi": "ちょうしょう", "name": "張昭（ちょうしょう）"}, "大橋": {"wiki_title": "大橋", "ai_desc": "廬江郡皖県の人（後世『三国志演義』等では「大喬」と表記）。橋公の長女で、小橋の姉。妹とともに国色と称えられた美女であり、建安4年（199年）の皖城攻略後に孫策に迎えられたが、翌建安5年に孫策と死別した（『三國志』巻54・周瑜伝および注引『江表伝』）。", "yomi": "だいきょう", "name": "大橋（だいきょう：廬江郡皖県出身の女性、橋公の長女・孫策の妻妾）", "role": "孫策の妻妾（橋公の長女・小橋の姉）"}, "張飛": {"wiki_title": "張飛", "ai_desc": "幽州涿郡の人（?〜221年）、字は益徳（『三國志』巻36・張飛伝）。若き日より関羽とともに劉備に兄事して各地を転戦し、長坂の戦いでは二十騎で殿軍を務め橋を断って曹操の追撃軍を睨み止め、益州平定戦・巴西宕渠の戦い（張郃撃破）でも大功を立てて「万人の敵」「熊虎の将」と恐れられた。建安22年（217年）冬、劉備の漢中侵攻に先立って馬超・呉蘭・雷銅らとともに北の涼州武都郡・下弁へ進出して曹操軍の背後を牽制したが、建安23年（218年）春に曹洪・曹休らに呉蘭が撃破されると馬超とともに漢中へ退いた。のち章武元年（221年）、関羽の仇を討つ東征出陣の直前に部下の張達・範強に暗殺された。", "yomi": "ちょうひ", "name": "張飛（ちょうひ：字は益徳、涿郡出身の劉備創業の猛将、関羽と並び「万人敵」と称され下弁・巴西方面に出陣）", "role": "劉備配下の宿将（征虜将軍・巴西太守・新亭侯→蜀漢の車騎将軍・司隷校尉・西郷侯）"}, "周瑜": {"wiki_title": "周瑜", "ai_desc": "周瑜（しゅうゆ）：字は公瑾、廬江郡舒県の人（175年〜210年）。太尉・周忠の従子。孫策と同年（175年生）で、少年時代に孫策の名声を聞いて舒県から寿春へ訪ねて「断金の交わり」を結び、孫策一家を舒県へ迎え入れた。のち孫策の江東平定および皖城・夏口攻略に同行し、孫策・孫権二代を支える呉の柱石となった（『三國志』巻54・周瑜伝）。", "yomi": "しゅうゆ", "name": "周瑜（しゅうゆ）"}, "陳就": {"wiki_title": "", "ai_desc": "後漢末の江夏太守・黄祖配下の都督（？〜208年）。建安13年（208年）春、孫権が黄祖を親征した際、水軍を率いて迎え撃ったが、先鋒を率いた呂蒙に討ち取られて首級を梟された。陳就の戦死を聞いた黄祖は城を捨てて逃走し、追撃を受けて捕らえられた（『三國志』巻54・呂蒙伝）。", "yomi": "ちんしゅう", "name": "陳就（ちんしゅう：江夏太守・黄祖配下の水軍都督、先鋒の呂蒙に親しく首を討ち取られる）", "role": "黄祖配下の都督"}, "成当": {"wiki_title": "", "ai_desc": "孫呉の部将（生没年不詳）。宋定・徐顧とともに呂蒙の屯営の近くに駐屯していた。三将の死後、遺児が幼弱であったため孫権はその兵を呂蒙へ併合しようとしたが、呂蒙が三度上書して三将の国事への勤労を訴えて固辞し、遺児たちに師を選んで輔導させた（『三國志』巻54・呂蒙伝）。", "yomi": "せいとう", "name": "成当（せいとう：呂蒙の近隣に駐屯した孫呉の部将、死後に呂蒙の尽力で幼少の遺児が保護される）", "role": "孫呉の部将"}, "酈食其": {"wiki_title": "酈食其", "ai_desc": "前漢創業期の弁士（？〜前203年）、陳留郡高陽の人。読書を好むが家貧しく里の監門を務め、60余歳で劉邦に帰属して広野君と号した。巧みな弁舌で斉王・田広を説き伏せ無血で斉の七十余城を下したが、韓信の奇襲により斉で烹殺された（『史記』巻97・酈生陸賈列伝）。", "yomi": "れきいき", "name": "酈食其（れきいき：号は広野君、陳留郡高陽出身の前漢創業期の老弁士、「酈叟」と称される）", "role": "前漢創業期の弁士（広野君）"}, "師曠": {"wiki_title": "師曠", "ai_desc": "字は子野、春秋時代の晋の楽師。生まれながら盲目であったが音律に精通し、晋の平公に仕えて楽音から国政の得失や戦の吉凶を言い当てた。古代最高の音曲の鑑識者（知音）として夔や伯牙と並び称される（『春秋左氏伝』襄公十八年、『史記』巻47・孔子世家）。", "yomi": "しこう", "name": "師曠（しこう：字は子野、春秋時代の晋の楽師、音律・鑑識の達人）", "role": "春秋時代・晋の楽師"}, "章帝": {"wiki_title": "章帝", "ai_desc": "章帝（しょうてい）：劉炟（りゅうたつ）。後漢の第3代皇帝（在位75年〜88年）。明帝の第五子。寛容な仁政を敷き、白虎観会議を主催して五経の異同を論じさせ、元和年間には魯恭王の末裔を竟陵へ転封した（『後漢書』巻3・章帝紀）。", "yomi": "しょうてい", "name": "章帝（しょうてい）"}, "周尚": {"wiki_title": "", "ai_desc": "廬江郡舒県の人。周異の兄弟で、周瑜の従父（叔父）。興平年間、袁術により呉景の後任として丹陽太守に任じられ、甥の周瑜が訪問した際に孫策の東渡を支援した。のち袁術の従弟・袁胤と交代して周瑜とともに寿春へ帰還した（『三國志』巻54・周瑜伝）。", "yomi": "しゅうしょう", "name": "周尚（しゅうしょう：廬江郡舒県出身の丹陽太守、周瑜の従父）", "role": "丹陽太守（周瑜の叔父）"}, "韓信": {"wiki_title": "韓信", "ai_desc": "淮陰（臨淮郡淮陰県）の人（?〜前196年）。若い頃は貧困で生業も治めず他人の家に寄食して嫌われ、淮陰の無頼の若者から挑発された際には剣を佩びながらその股の下を這い潜る（「胯下の辱・股くぐり」）嘲笑を甘受した（『史記』巻92・淮陰侯列伝）。項羽の下では重用されなかったが、漢の蕭何に「国士無双」と見抜かれて高祖・劉邦の大将軍に抜擢されると、暗渡陳倉・背水の陣・濰水の戦い・垓下の包囲など古今無双の用兵で魏・代・趙・燕・斉・楚を次々と平定し、蕭何・張良とともに漢王朝創業の「三傑」と称えられた。のち謀反の疑いにより呂后と蕭何に誘殺された。", "yomi": "かんしん", "name": "韓信（かんしん：淮陰出身の不世出の兵家、「股くぐり」の恥を忍んで前漢の高祖・劉邦の天下統一を成し遂げた斉王・楚王・淮陰侯）", "role": "前漢創業の筆頭名将（大将軍→斉王→楚王→淮陰侯、「漢の三傑」の一）"}, "劉邦": {"wiki_title": "劉邦", "ai_desc": "沛県豊邑の人（前256年または前247年〜前195年）。秦末に沛県で挙兵し、同郷の蕭何・曹参らを率いて秦を滅ぼし、楚漢戦争で項羽を破って前漢王朝を建国した。", "yomi": "こうそ", "name": "高祖・劉邦（こうそ／りゅうほう：前漢の初代皇帝）", "role": "前漢の初代皇帝（太祖高皇帝）"}, "朱然": {"wiki_title": "朱然", "ai_desc": "字は義封、丹陽郡故鄣県の人（182年〜249年）。本姓は施氏で、母方の叔父・朱治の養子となった。孫権と幼少より共に学び、建安24年（219年）には呂蒙に従い潘璋とともに関羽父子を捕縛した。呂蒙の没後は江陵を鎮守して黄武元年（222年）の魏軍包囲を半年耐え抜き、官は左大司馬・右軍師に至った（『三國志』巻56・朱然伝）。", "yomi": "しゅぜん", "name": "朱然（しゅぜん：字は義封、丹陽郡故鄣県出身の孫呉の名将、江陵を死守し左大司馬に至る）", "role": "孫呉の車騎将軍・左大司馬・右軍師"}, "義帝": {"wiki_title": "義帝", "ai_desc": "姓は羋、氏は熊、名は心（？〜前206年）。戦国楚の懐王の孫。秦末の動乱期に民間で羊を飼っていたところを項梁・范増らに擁立されて「楚の懐王」となり、反秦諸将の名目上の盟主となった。秦滅亡後、項羽により「義帝」と尊称されつつ長沙の郴県へ遷され、その途上で項羽の密命を受けた英布らに殺害された（『史記』巻7・項羽本紀、巻8・高祖本紀）。", "yomi": "ぎてい", "name": "義帝・楚の懐王心（ぎてい：戦国楚の懐王の孫・熊心、反秦諸将の盟主に擁立されるも後に項羽に殺害される）", "role": "秦末の楚の懐王・義帝（名は熊心）"}, "孫瑜": {"wiki_title": "孫瑜", "ai_desc": "字は仲異、呉郡富春県の人（177年〜215年）。孫堅の弟・孫静の次男。恭義校尉を経て建安9年（204年）に丹楊太守となり、建安11年（206年）に周瑜とともに麻・保二屯を討った。のち奮威将軍・丹楊太守として溧陽や牛渚に駐屯し、年39で没した（『三國志』巻51・孫瑜伝）。", "yomi": "そんゆ", "name": "孫瑜（そんゆ：字は仲異、呉郡富春県出身の丹楊太守・奮威将軍、孫静の次男）", "role": "孫呉の丹楊太守・奮威将軍（孫静の次男・孫権の従兄）"}, "歩騭": {"wiki_title": "歩騭", "ai_desc": "字は子山、臨淮郡淮陰県の人（？〜247年）。戦乱を避けて江東へ渡り孫権に仕え、建安15年（210年）に交州刺史・立武中郎将となって士燮を帰服させ嶺南を平定した。のち驃騎将軍・臨湘侯・西陵督として20年にわたり西境を鎮守し、赤烏9年（246年）に陸遜の後任として丞相に登った（『三國志』巻52・歩騭伝）。", "yomi": "ほしつ", "name": "歩騭（ほしつ：字は子山、臨淮郡淮陰県出身の孫呉の驃騎将軍・西陵督・丞相）", "role": "孫呉の交州刺史・驃騎将軍・丞相"}, "呉夫人": {"wiki_title": "呉夫人", "ai_desc": "呉夫人（ごふじん）：呉郡出身（本貫は銭唐、のち呉県に移住）の孫堅の正室（？〜202年）。呉景の姉で、孫策・孫権・孫翊・孫匡の四男一女を生んだ。のちに武烈皇后と追尊された。", "yomi": "ごふじん", "name": "呉夫人（ごふじん）"}, "于禁": {"wiki_title": "于禁", "ai_desc": "兗州泰山郡鉅平県の人（?〜221年）、字は文則。済北相・鮑信の募兵に応じたのち曹操に帰属し、軍規の厳正さと沈着堅固な指揮によって頭角を現した。宛城の敗戦時には略奪を行った青州兵を討って夏侯惇らから称賛され、曹操から「古の名将にも勝る」と激賞されて益寿亭侯に封じられた。建安4年（199年）秋8月、袁紹との決戦を前に黄河沿岸（延津付近の河上）の守備を託され、翌年にかけて延津・原武で袁紹軍の渡河攻撃を撃退し官渡本戦でも奮戦した。のち左将軍・仮節鉞に昇ったが、建安24年（219年）の樊城救援で漢水の暴漲により関羽に降伏し、呉から帰還後に死去した（『三國志』巻17・于禁伝）。", "yomi": "うきん", "name": "于禁（うきん：字は文則、泰山郡鉅平県出身の左将軍・仮節鉞・益寿亭侯、厳正な軍律と堅守で知られた曹魏五将軍の筆頭格）", "role": "後漢末〜三国魏の平虜校尉・虎威将軍・左将軍・仮節鉞・益寿亭侯（兗州泰山郡鉅平県の人）"}, "魯粛": {"wiki_title": "魯粛", "ai_desc": "字は子敬、臨淮郡東城県の人（172年〜217年）。居巣長時代の周瑜に糧米を贈って親交を結び、ともに江東へ渡って孫権に仕えた。建安13年（208年）に劉備との同盟を主導して賛軍校尉として赤壁の勝利に貢献し、周瑜の没後は軍権を継いで横江将軍となり陸口に鎮守した（『三國志』巻54・魯粛伝）。", "yomi": "ろしゅく", "name": "魯粛（ろしゅく：字は子敬、臨淮郡東城県出身の孫呉の横江将軍、周瑜とともに赤壁の勝利と孫劉同盟を主導）", "role": "孫呉の賛軍校尉・横江将軍"}, "韓遂": {"wiki_title": "韓遂", "ai_desc": "金城郡允吾県の人（?〜215年）。辺章とともに涼州の反乱軍の首領となって刺史・郡守を殺害し、十余万の兵を擁して後漢朝廷を揺るがした。その後も馬騰らと結んだり対立したりしながら約30年間にわたり涼州・関中に隠然たる勢力を保ち、建安16年（211年）には馬超と連合して潼関で曹操と戦ったが敗れ、建安20年（215年）に死去した（『三國志』巻1・武帝紀、巻15・張既伝）。", "yomi": "かんすい", "name": "韓遂（かんすい：字は文約、もとの名は韓約、金城郡出身・三十年近くにわたり涼州に割拠した群雄）", "role": "後漢末の涼州の群雄・鎮西将軍（金城郡允吾県の人）"}, "馬援": {"name": "馬援（ばえん：字は文淵、右扶風茂陵県出身の後漢の名将・伏波将軍・新息忠成侯、馬騰・馬超の先祖）", "yomi": "ばえん", "wiki_title": "馬援", "role": "後漢初期の隴西太守・伏波将軍・新息忠成侯（司隷右扶風茂陵県の人、馬騰・馬超の先祖）", "ai_desc": "司隷右扶風茂陵県の人（前14年〜後49年）、字は文淵。初め隴右の隗囂に属したのち後漢の光武帝（劉秀）に帰順し、隴西太守として先零羌を平定、さらに伏波将軍として交趾の徴姉妹の乱を鎮定し、「男児まさに死すべくんば辺野に於いてし、馬革を以て屍を裏（つつ）み還り葬らるべし（馬革裹尸）」の名言を残した功臣（『後漢書』巻24・馬援伝）。魚豢『典略』によれば馬騰・馬超父子はその末裔とされる。"}, "鄧禹": {"wiki_title": "鄧禹", "ai_desc": "南陽郡新野県の人（2年〜58年）、字は仲華。長安遊学中に若き劉秀（のちの光武帝）の非凡さを見抜いて親交を結び、河北へ渡った劉秀を追って鄴で再会すると天下統一の基本戦略を進言して帷幄の第一人者となった。建武元年（25年）春正月、前将軍として精兵二万を率い単独で西方の河東・関中平定に向かい、河東を鎮定すると光武帝への事前奏請を経ず現地で印を刻み「承制」して幕下の軍祭酒・李文を河東太守に拝し、さらに関中へ入って赤眉・更始帝勢力と戦った。二十四歳の若さで大司徒・酇侯（のち高密侯）に昇り、明帝の永平初年に太傅となって雲台二十八将の筆頭に列せられた（『後漢書』巻16・鄧禹伝）。", "yomi": "とうう", "name": "鄧禹（とうう：字は仲華、荊州南陽郡新野県の人、後漢創業の元勲・雲台二十八将の筆頭・大司徒・太傅・高密元侯）", "role": "後漢創業の元勲・雲台二十八将第一（前将軍→大司徒→太傅・高密元侯）"}, "孫策": {"wiki_title": "孫策", "ai_desc": "揚州呉郡富春県の人（175年〜200年）。破虜将軍・孫堅の長男で、呉の大帝・孫権の兄。父・孫堅が劉表との戦いで戦死した後、初平4年（193年）〜興平元年（194年）頃に寿春の袁術のもとへ赴いて父の旧部曲千余人を返還され、袁術の命を受けて長江を渡り、揚州刺史・劉繇、呉郡の厳白虎、会稽太守・王朗らを次々と撃破して数年で江東六郡の基盤を平定した。袁術が帝位を僭称すると絶縁して独立し、曹操の上表により討逆将軍・呉侯に封じられた。建安5年（200年）、曹操が官渡で袁紹と対峙して手薄になった隙を突き、密かに軍を整えて許都奇襲と献帝奉迎を計画したが、出陣前に旧敵である故呉郡太守・許貢の食客（刺客）に襲撃され26歳で没した（『三國志』巻1・武帝紀、巻46・孫破虜討逆伝）。", "yomi": "そんさく", "name": "孫策（そんさく：字は伯符、呉郡富春県出身の討逆将軍・呉侯、孫堅の長男・孫権の兄、江東を平定し呉の礎を築く）", "role": "後漢末の折衝校尉・殄寇将軍・会稽太守・討逆将軍・呉侯（揚州呉郡富春県の人、孫堅の長男）"}, "劉璋": {"wiki_title": "劉璋", "ai_desc": "荊州江夏郡竟陵県の人（?〜220年頃）、字は季玉。前漢の魯恭王・劉余の末裔で、益州牧・劉焉の末子。興平元年（194年）に父・劉焉が病没すると、帳下司馬・趙韙らの推戴と朝廷の追認によって益州牧を継いだ。漢中の張魯と対立し、長らく巴蜀の険に拠って中原の朝廷への徴発・貢納を絶っていたが、建安13年（208年）秋に曹操が荊州へ南征して劉琮を降すと威勢に恐れを抱き、陰溥や別駕・張松らを相次いで使者として派遣し、初めて朝廷の徴役を受け入れて曹操の軍へ補充兵を送った。しかし張松が曹操に冷遇されたことに反発して劉備の引き入れを画策したことから、のち建安19年（214年）に劉備に成都を包囲されて降伏し、荊州の公安へ移されたのち呉の孫権に荊州牧とされ没した（『三國志』巻1・武帝紀、巻31・劉二牧伝）。", "yomi": "りゅうしょう", "name": "劉璋（りゅうしょう：字は季玉、江夏郡竟陵県出身の漢室宗親・益州牧、建安13年に初めて曹操へ遣使・送兵して帰順を示す）", "role": "後漢末の益州牧・振威将軍（荊州江夏郡竟陵県の人、魯恭王劉余の末裔・劉焉の末子）"}, "張璠": {"wiki_title": "後漢紀", "ai_desc": "張璠（ちょうはん）：西晋〜東晋の歴史家で、『後漢紀（漢紀）』三十巻の著者。裴松之は孫堅の没年を考証するにあたり、張璠『漢紀』と胡沖『呉歴』の「初平2年（191年）死去説」を正しいと結論づけた。", "yomi": "ちょうはん", "name": "張璠（ちょうはん：東晋の歴史家・『後漢紀』三十巻の撰者）", "role": "東晋の官僚・歴史家（『漢紀〔後漢紀〕』三十巻の撰者）"}, "孫堅": {"wiki_title": "孫堅", "ai_desc": "揚州呉郡富春県の人（155年〜191年または192年）。孫子の末裔と伝えられ、黄巾の乱では朱儁の下で佐軍司馬として宛城一番乗りの大功を立て、ついで涼州の辺章・韓遂の乱に従軍した後に長沙太守・烏程侯となった。反董卓連合軍が蜂起すると長沙から北上して袁術と結び、破虜将軍・領豫州刺史として陽人・洛陽で董卓軍（胡軫・呂布・華雄）を連破し、焼け落ちた洛陽の宗廟を修復した。この頃、汝南・潁川の黄巾であった何儀・劉辟らも孫堅の威名に服して帰附していた。のち袁術の命で荊州の劉表を攻めた際、峴山で黄祖の兵に射殺され、呉の建国後に「武烈皇帝（始祖）」と追尊された（『三國志』巻46・孫破虜討逆伝）。", "yomi": "そんけん", "name": "孫堅（そんけん：字は文台、呉郡富春県出身の破虜将軍・長沙太守・烏程侯、孫策・孫権の父、呉の武烈皇帝）", "role": "後漢末の破虜将軍・豫州刺史・長沙太守・烏程侯（揚州呉郡富春県の人、孫策・孫権の父）"}, "笮融": {"wiki_title": "サク融", "ai_desc": "笮融（さくゆう）：丹陽郡の人（？〜195年）。最初は徐州牧・陶謙に仕えて広陵・下邳・彭城の漕運を監督し、その財を私物化して壮麗な仏寺を建立したことで知られる。曹操の徐州侵攻時に男女一万・馬三千匹を率いて南へ逃れ、広陵太守・趙昱を殺害したのち秣陵の南に駐屯して劉繇に従った。孫策と激戦を交えて敗走し、のち豫章で太守・朱皓と薛礼を殺害したが、劉繇に攻め破られて山中で民に殺された（『三國志』巻46・孫策伝注、巻49・劉繇伝）。", "yomi": "さくゆう", "name": "笮融（さくゆう）"}, "孫盛": {"wiki_title": "孫盛", "ai_desc": "孫盛（そんせい）：字は安国、并州太原郡中都県の人（302年〜373年）。東晋を代表する歴史家・政治家で、秘書監・長沙太守などを歴任し『魏氏春秋』『晋陽秋』『異同雑語（異同評）』を著した。巻46末尾の注に引かれる『異同評』において、孫策が弟の孫権に後事を託したことを「未練を残した過ち」と評した陳寿に真っ向から反論し、乱世の創業期に弟へ大権を授けて国家を安泰に導いた孫策の決断を絶賛した。", "yomi": "そんせい", "name": "孫盛（そんせい：字は安国、『魏氏春秋』『異同雑語』の撰者）", "role": "東晋の歴史家・長沙太守・秘書監（太原郡中都県の人）"}, "袁紹": {"wiki_title": "袁紹", "ai_desc": "豫州汝南郡汝陽県の人（?〜202年）。四代にわたり三公を輩出した名門・汝南袁氏の出身で、若き日の曹操の盟友であり最大の宿敵。西園八校尉の中軍校尉・司隷校尉となり、大将軍・何進に宦官の皆殺しと董卓ら地方軍閥の召還を進言した。何進が暗殺されると宮中に突入して宦官二千余人を族滅したが、入京した董卓と対立して冀州へ奔り、反董卓連合軍の盟主となった。のち韓馥から冀州を譲り受け、公孫瓚を滅ぼして冀・青・幽・并の四州を制覇したが、建安5年（200年）の官渡の戦いと翌建安6年の倉亭の戦いで曹操に連敗し、建安7年（202年）5月に発病して血を吐き没した（『三國志』巻6・袁紹伝）。", "yomi": "えんしょう", "name": "袁紹（えんしょう：字は本初、四世三公の名門・のち冀州牧・大将軍として河北に覇を唱える）", "role": "後漢末の群雄・司隷校尉・冀州牧・大将軍・鄴侯（豫州汝南郡汝陽県の人）"}, "薛礼": {"wiki_title": "薛礼", "ai_desc": "薛礼（せつれい）：後漢末の彭城相。陶謙に迫られて南下し、下邳相・笮融とともに揚州刺史・劉繇を盟主に仰いで秣陵城に拠った。孫策に攻められて包囲を突破し逃走したが、のち劉繇の許へ逃れたところを笮融に殺害された（『三國志』巻46・孫策伝注、巻49・劉繇伝）。", "yomi": "せつれい", "name": "薛礼（せつれい）"}, "虞翻": {"wiki_title": "虞翻", "ai_desc": "字は仲翔、会稽郡余姚県の人（164年〜233年）。王朗ついで孫策・孫権に仕えて騎都尉となり、『易』をはじめ経学に精通した。建安24年（219年）の荊州攻略では呂蒙に従い、公安を守る士仁を書簡で説得して降伏させたが、のち直言により交州へ流され没した（『三國志』巻57・虞翻伝）。", "yomi": "ぐほん", "name": "虞翻（ぐほん：字は仲翔、会稽余姚出身の孫呉の騎都尉・経学者、公安の士仁を説き降伏させる）", "role": "孫呉の騎都尉・経学者（会稽郡余姚県の人）"}, "孫河": {"wiki_title": "孫河", "ai_desc": "孫河（そんか）：字は伯海、呉郡富春の人（？〜204年）。孫堅の族子（本姓は兪氏、孫堅に愛されて孫姓を与えられた）。早くから孫堅に従って常に先登を務め、孫堅の死後は孫策・呂範とともに呉景のもとで兵を募り、江東平定に活躍した（『三國志』巻51・孫韶伝注）。", "yomi": "そんか", "name": "孫河（そんか）"}, "鄧玄之": {"wiki_title": "", "ai_desc": "荊州南陽郡の人（生没年不詳）。零陵太守・郝普の旧友。建安20年（215年）に呂蒙が長沙を平定して零陵へ向かう途上、酃県で同行を求められた。撤退命令を秘した呂蒙から劉備・関羽が窮地にあるとの虚報を聞かされ、城内に入って郝普に禍福を説き開城させた（『三國志』巻54・呂蒙伝）。", "yomi": "とうげんし", "name": "鄧玄之（とうげんし：南陽郡出身の士人、旧友の零陵太守・郝普を説得し呂蒙に開城させた人物）", "role": "南陽郡出身の士人（郝普の旧友）"}, "劉表": {"wiki_title": "劉表", "ai_desc": "兗州山陽郡高平県の人（142年〜208年）。前漢の魯恭王・劉余の末裔で、党人「八俊」の一人に数えられた名士。初平元年（190年）に荊州刺史として単騎で宜城に入り、蒯越・蒯良・蔡瑁ら現地豪族の協力を得て宗賊を平定し、襄陽を州治として長江・漢水流域の荊州を掌握した。袁紹と同盟を結んで南陽にいた袁術と敵対し、初平3年（192年）に孫堅を敗死させ、翌初平4年（193年）春には袁術の糧道を遮断して袁術を陳留方面へ追い出した（『三國志』巻6・劉表伝、『後漢書』巻74下・劉表伝）。", "yomi": "りゅうひょう", "name": "劉表（りゅうひょう：字は景升、山陽郡高平県出身の漢室宗親・荊州牧・鎮南将軍・成武侯、「八俊」の一人）", "role": "後漢末の荊州刺史・荊州牧・鎮南将軍・成武侯（兗州山陽郡高平県の人、魯恭王劉余の末裔）"}, "宋豪": {"wiki_title": "", "ai_desc": "後漢末の部将（生没年不詳）。曹魏の蘄春典農・謝奇の配下として皖県の田郷に駐屯していた。呂蒙の襲撃により謝奇が後退すると、同僚の孫子才らとともに老弱の家族を伴って呂蒙の軍門に降り帰順した（『三國志』巻54・呂蒙伝）。", "yomi": "そうごう", "name": "宋豪（そうごう：蘄春典農・謝奇の部将、孫子才とともに老弱を率いて呂蒙へ降る）", "role": "蘄春典農・謝奇配下の部将"}, "蔡遺": {"wiki_title": "", "ai_desc": "後漢末、孫権配下の江夏太守（生没年不詳）。呂蒙が部曲の件で蔡遺から孫権へ不手際を上申された際、呂蒙は恨みを抱かず、のちに豫章太守・顧邵が没して後任を問われると、職務に忠実な良吏として蔡遺を推挙した。孫権は祁奚の故事になぞらえて笑い、蔡遺を任用した（『三國志』巻54・呂蒙伝）。", "yomi": "さいい", "name": "蔡遺（さいい：孫呉の江夏太守、呂蒙の推挙により顧邵の後任として豫章太守に登用される）", "role": "孫呉の江夏太守・豫章太守"}, "士仁": {"wiki_title": "士仁", "ai_desc": "幽州広陽郡の人、字は君義（『呉書』や楊戯『季漢輔臣賛』等では「傅士仁」とも記される）。劉備配下の将軍として荊州南郡の要衝・公安に駐屯していたが、南郡太守・麋芳とともに日頃から関羽の傲慢な態度に反感を抱いていた。建安24年（219年）の樊城出兵に際して軍資の補給が不十分であったことから関羽の処罰を恐れ、孫権の密かな誘いと虞翻の説得に応じて公安を挙げて呉へ降伏した（『三國志』巻36・関羽伝、巻45・楊戯伝、巻54・呂蒙伝）。", "yomi": "しじん", "name": "士仁・傅士仁（しじん：字は君義、広陽郡出身の劉備配下の将軍、公安に駐屯するも関羽との不和から麋芳とともに孫権へ降伏）", "role": "劉備配下の将軍（公安駐屯）"}, "張遼": {"wiki_title": "張遼", "ai_desc": "并州雁門郡馬邑県の人（169年〜222年）、字は文遠。前漢の馬邑の豪族・聶壱の末裔で、怨讐を避けて張氏に改姓した。丁原・何進・董卓を経て呂布に仕え、騎都尉・魯相となった。建安3年（198年）冬に下邳で呂布が敗死すると部衆を率いて曹操に帰順し、中郎将・関内侯に拝された。建安5年（200年）4月の白馬の戦いでは仮の裨将軍として関羽とともに先陣を務め、顔良の軍を撃破した。その後も昌狶の説得降伏、袁譚・袁尚討伐、白狼山での烏丸単于・蹋頓斬殺、天柱山の陳蘭討伐で武功を重ね、建安20年（215年）の合肥の戦いでは八百の決死隊で孫権の十万の大軍に突撃して江東を震撼させ、前将軍・晋陽侯に昇った（『三國志』巻17・張遼伝）。", "yomi": "ちょうりょう", "name": "張遼（ちょうりょう：字は文遠、雁門郡馬邑県出身の曹魏の前将軍・晋陽剛侯、白馬先陣から合肥の死闘まで活躍した五将軍筆頭）", "role": "後漢末〜三国魏の中郎将・盪寇将軍・前将軍・晋陽剛侯（并州雁門郡馬邑県の人）"}, "鄭宝": {"wiki_title": "鄭宝", "ai_desc": "後漢末の揚州の群雄（？〜199年頃）。巣湖を拠点に一万余の衆を擁し、肥沃な土地に拠って廬江一帯の流民を集め、魯粛や劉曄を招き入れようとした。さらに民衆を駆り立てて江東へ渡ろうと図ったが、劉曄の謀略により宴席で斬殺され、その部衆は廬江太守・劉勲に帰属した（『三國志』巻14・劉曄伝、巻54・魯粛伝）。", "yomi": "ていほう", "name": "鄭宝（ていほう：後漢末に巣湖で一万余の衆を擁した群雄、のち劉曄に斬られる）", "role": "後漢末・巣湖の群雄"}, "鄧当": {"wiki_title": "鄧当", "ai_desc": "後漢末の武将（生没年不詳）。呂蒙の姉の夫。孫策の部将として従軍し、たびたび山越を討伐した。年十五、六の呂蒙が密かに従軍した際には驚いて叱責したが止められず、数年後に死去すると、張昭の推挙により呂蒙がその部隊を引き継いで別部司馬となった（『三國志』巻54・呂蒙伝）。", "yomi": "とうとう", "name": "鄧当（とうとう：孫策配下の部将、呂蒙の姉の夫として若き呂蒙が身を寄せた人物）", "role": "孫策配下の部将（呂蒙の姉婿）"}, "劉勲": {"wiki_title": "劉勲", "ai_desc": "徐州琅邪国の人（生没年不詳）、字は子台。建安初年に曹操と旧交があった。袁術に仕えて廬江太守となり、建安4年（199年）に袁術が病死すると、袁術の従弟・袁胤や妻子・遺衆を収容して江淮の間で強勢を誇った。しかし孫策の甘言と贈り物に誘われて上繚へ遠征した隙に本拠の皖城を孫策に奇襲されて陥落し、長江を遡って退いたのち、建安4年冬12月に曹操へ帰順して列侯・征虜将軍に封じられた。旧友として曹操から厚く寵遇されたが、のちに法を無視した驕慢や収賄が重なり処刑された（『三國志』巻1・武帝紀、巻12・司馬芝伝、巻46・孫破虜討逆伝）。", "yomi": "りゅうくん", "name": "劉勲（りゅうくん：字は子台、琅邪国出身の廬江太守・征虜将軍・列侯、孫策に皖城を奪われ曹操に帰順）", "role": "後漢末の廬江太守・征虜将軍・列侯（徐州琅邪国の人）"}, "呂覇": {"wiki_title": "", "ai_desc": "汝南郡富陂県の人（生没年不詳）。孫呉の南郡太守・孱陵侯である呂蒙の子（呂琮の弟、呂睦の兄）。建安24年（219年）末に父・呂蒙が没すると孱陵侯の爵位を継ぎ、墓守三百家と免税の田五十頃を与えられた。死後、兄の呂琮が侯爵を継いだ（『三國志』巻54・呂蒙伝）。", "yomi": "りょは", "name": "呂覇（りょは：呂蒙の子、父の没後に孱陵侯の爵位を継承）", "role": "孫呉の孱陵侯（呂蒙の子）"}, "周栄": {"wiki_title": "周栄 (後漢)", "ai_desc": "字は平孫、廬江郡舒県の人。太尉・周景の父。司徒・袁安に辟召され、章帝・和帝の時代に尚書令を務めて竇氏の専横を退ける議に功を立て、のち潁川太守・山陽太守を歴任して善政を称えられた（『後漢書』巻45・周栄伝、『三國志』巻54・周瑜伝注引張璠『漢紀』）。", "yomi": "しゅうえい", "name": "周栄（しゅうえい：字は平孫、廬江郡舒県出身の後漢の尚書令、太尉周景の父）", "role": "後漢の尚書令・潁川太守・山陽太守（周景の父）"}, "夏侯淵": {"wiki_title": "夏侯淵", "ai_desc": "沛国譙県の人（?〜219年）。夏侯惇の族弟。曹操の挙兵以来、別部司馬・騎都尉・陳留太守・潁川太守・督軍校尉を歴任し、急襲・機動戦に長じて軍中で「典軍校尉の夏侯淵は三日で五百里、六日で一千里を駆ける」と語られた。建安16年（211年）には行征西護軍として徐晃とともに太原大陵の商曜を討滅し、潼関・渭南の戦いに従軍したのち、同年12月に長安へ留屯して安定の梁興や隴右の韓遂・宋建らを平定し、征西将軍に昇った。のち建安24年（219年）、漢中の定軍山で劉備軍と戦って戦死し、愍侯と諡された（『三國志』巻9・夏侯淵伝）。", "yomi": "かこうえん", "name": "夏侯淵（かこうえん：字は妙才、西方戦線を統括した曹操軍の重鎮・征西将軍）", "role": "曹操旗揚げ以来の宿将・征西将軍・博昌愍侯"}};

  const PUBLISHED_MAX_PARA = 33;
  const CURRENT_VOL_ID = 54;
  const INITIAL_MAP_VIEW = {"lat": 30.6, "lng": 115.2, "zoom": 6};
  const CROSS_JUMP_STORAGE_KEY = 'threekingdom_cross_vol_return_v1'; // 巻またぎジャンプ時の復帰先保存キー
  const LAST_READING_STORAGE_KEY = 'threekingdom_last_reading_v1';   // サイト全体で最後に読んでいた巻・段落のしおりキー
  const PER_VOL_READING_STORAGE_KEY = 'threekingdom_vol_pos_v1';     // 各巻ごとの最後に読んでいた段落のしおりキー
  const CROSS_JUMP_SCROLL_DELAY_MS = 80;      // 初期描画後にジャンプ先カードへスクロールする待機時間(ms)
  const CROSS_JUMP_FLASH_DURATION_MS = 2400;  // ジャンプ着地カードの点滅クラス保持時間(ms)
  let isBookmarkTrackingReady = false;        // 初期復元完了後にしおり保存を有効化するフラグ

  // 【方法A：自動切り替え判定】
  // 手元のPC（file:// または localhost）で開いた時、または URL に ?edit=1 を付けた時だけ制作・指摘環境を有効化。
  // github.io 等へアップロードして一般読者が開いた時は、自動的に公開モード（指摘リスト非表示＆完了段落のみ表示）になる。
  const urlParams = new URLSearchParams(window.location.search);
  const IS_AUTHOR_EDIT_ENV = (
    window.location.protocol === 'file:' ||
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1' ||

  function isEditModeActive() {
    if (!IS_AUTHOR_EDIT_ENV) return false;
    const previewEl = document.getElementById('togglePublicPreview');
    return !(previewEl && previewEl.checked);
  }

  const TOTAL_PARAGRAPHS = Math.max(...RECORDS.map(r => r.para_index));

  function getMaxVisibleParagraph() {
    return isEditModeActive() ? TOTAL_PARAGRAPHS : Math.min(TOTAL_PARAGRAPHS, PUBLISHED_MAX_PARA);
  }

  function getVisibleRecords() {
    const maxP = getMaxVisibleParagraph();
    return RECORDS.filter(r => r.para_index <= maxP);
  }

  let currentActiveId = null;
  let readingHistoryStack = [];
  // 1. 共通地図コントローラ（shared_map_controller.js）による地図初期化・地名ピン制御
  function buildAuthorToastFeedbackHtml(found, clickedRawSurface) {
    if (!isEditModeActive()) return '';
    const safeSurface = (clickedRawSurface || found.key).replace(/'/g, "\'");
    const safeKey = found.key.replace(/'/g, "\'");
    return `
      <div class="toast-feedback-bar">
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '🔄 場所が違う（同名別地・位置修正）')">🔄 場所が違う</button>
        <button class="toast-fb-btn" onclick="addPlaceToastFeedback('${safeKey}', '${safeSurface}', '📐 エリア⇔地点の区分変更')">📐 エリア⇔地点変更</button>

  const mapController = window.ThreeKingdomMapController.create({
    containerId: 'map',
    toastId: 'mapToast',

    initialZoom: INITIAL_MAP_VIEW.zoom,
    places: PLACES,
    naturalFeatures: NATURAL_FEATURES,
    riverLines: RIVER_LINES,
    protectedControlIds: ['mapToast'],
    beforeFocusPlace: () => closeModal(),
    buildToastBottomHtml: buildAuthorToastFeedbackHtml
  });
  const map = mapController.getMap();

  function extractDirectPlaceKeysFromRecord(rec) {
    const keys = [];
    const seen = new Set();
    if (!rec) return keys;
    const tagRegex = /\{\{place:([^|}]+)\|/g;
    [rec.raw_tagged, rec.kakikudashi_tagged, rec.translation_tagged].forEach(txt => {
      if (!txt) return;
      let m;
      while ((m = tagRegex.exec(txt)) !== null) {
        if (!seen.has(m[1])) {
          seen.add(m[1]);
          keys.push(m[1]);
        }
      }
    });
    return keys;
  }

  // 段落移動・表示モード切替時は、該当段落の地名ピン・エリア枠に入れ替えるのみ（中心移動・fitBoundsは一切行わない）
  function renderMapLayersForCurrentMode(extraPlaceKey = '') {
    const showAll = isEditModeActive() && document.getElementById('toggleShowAllParas') && document.getElementById('toggleShowAllParas').checked;
    const visRecs = getVisibleRecords();
    const paraRecs = visRecs.filter(rec => rec.para_index === currentParaIndex);
    const targetRecs = showAll ? visRecs : (paraRecs.length > 0 ? paraRecs : visRecs);
    const directKeys = [];
    if (extraPlaceKey) directKeys.push(extraPlaceKey);
    targetRecs.forEach(rec => {
      extractDirectPlaceKeysFromRecord(rec).forEach(k => directKeys.push(k));
    });
    mapController.renderPlaceKeys(directKeys);
  }

  // 読者が地名（本文の緑文字・地図ピン）を明示的にクリックした時のみ移動・ズーム7表示
  function focusPlaceOnMap(placeKey, clickedRawSurface = '', showToast = true) {
    return mapController.focusPlace(placeKey, clickedRawSurface, showToast);
  }

  // 6. データベースに埋め込まれた確定タグ（{type:key|surface}）を直接HTMLへ変換
  function getActivePersonsList() {
    return Array.from(new Set(
      getVisibleRecords().flatMap(r => (r.persons || '').split(',').map(s => s.trim()).filter(Boolean))
    ));
  }

  function getPlaceSubTypeLabel(placeKey) {
    const p = PLACES.find(item => item.key === placeKey);
    if (!p) return `地名(${placeKey})`;
    if (p.is_area) return `🗺️地名[エリア](${placeKey})`;
    if (p.is_river) return `🌊地名[河川](${placeKey})`;
    return `📍地名[地点](${placeKey})`;
  }

  function getSharedPersonInfo(personKey) {
    if (window.THREEKINGDOM_SHARED && window.THREEKINGDOM_SHARED.persons && window.THREEKINGDOM_SHARED.persons[personKey]) {
      return window.THREEKINGDOM_SHARED.persons[personKey];
    }
    return PERSONS_INFO[personKey] || null;
  }

  function getSharedOfficeInfo(officeKey) {
    if (OFFICES[officeKey]) return OFFICES[officeKey];
    if (window.THREEKINGDOM_SHARED && window.THREEKINGDOM_SHARED.offices && window.THREEKINGDOM_SHARED.offices[officeKey]) {
      return window.THREEKINGDOM_SHARED.offices[officeKey];
    }
    return null;
  }

  function getPersonDisplayName(personKey) {
    const pInfo = getSharedPersonInfo(personKey);
    if (pInfo && pInfo.display_name) return pInfo.display_name;
    return personKey;
  }

  function renderEmbeddedTags(taggedText, recId) {
    if (!taggedText) return '';
    const editHint = isEditModeActive() ? ' ／ 右クリックまたはドラッグ選択で指摘' : '';
    return taggedText.replace(/\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g, (m, tagType, key, surface) => {
      const safeKey = key.replace(/'/g, "\'");
      const safeSurface = surface.replace(/'/g, "\'");
      if (tagType === 'place') {
        const subLabel = getPlaceSubTypeLabel(key);
        return `<span class="inline-place" data-tag-type="place" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'place', '${safeKey}', '${safeSurface}')" title="${subLabel}：クリックで地図移動${editHint}">${surface}</span>`;
      } else if (tagType === 'office') {
        return `<span class="inline-office" data-tag-type="office" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'office', '${safeKey}', '${safeSurface}')" title="👑官職(${key})：クリックで全巻解説${editHint}">${surface}</span>`;
      } else if (tagType === 'person') {
        const dispName = getPersonDisplayName(key);
        return `<span class="inline-person" data-tag-type="person" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'person', '${safeKey}', '${safeSurface}')" title="👤人名(${dispName})：クリックで全巻解説${editHint}">${surface}</span>`;
      } else if (tagType === 'special') {
        return `<span class="inline-special" data-tag-type="special" data-tag-key="${key}" onclick="handleInlineTagClick(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" oncontextmenu="handleInlineTagContextMenu(event, '${recId}', 'special', '${safeKey}', '${safeSurface}')" title="🔖特別キーワード(${key})：クリックで解説${editHint}">${surface}</span>`;
      }
      return surface;
    });
  }

  // 7. 本文・裴注リーダー描画（「1段落＝本文＋裴注」ずつの切り替え表示）
  const recordListEl = document.getElementById('recordList');
  const paraTopNavEl = document.getElementById('paraTopNav');
  let currentParaIndex = 1;

  function getSectionLabelForPara(paraIdx) {
    const rec = RECORDS.find(r => r.para_index === paraIdx);
    const maxVis = getMaxVisibleParagraph();
    if (isEditModeActive() && rec) {
      const shortSec = (rec.section_title || '').replace('周瑜魯粛呂蒙傳（', '').replace('）', '');
      const pubBadge = paraIdx <= PUBLISHED_MAX_PARA ? '✅' : '🔧';
      return `${pubBadge} 第 ${paraIdx} / ${maxVis} （${shortSec}）`;
    }
    const denomLabel = PUBLISHED_MAX_PARA < TOTAL_PARAGRAPHS ? '○' : maxVis;
    return ThreeKingdomI18n.t('paraLabel', { p: paraIdx, d: denomLabel });
  }

  function goToParagraph(paraIdx) {
    const maxVis = getMaxVisibleParagraph();
    const clamped = Math.max(1, Math.min(maxVis, paraIdx));
    currentParaIndex = clamped;
    currentActiveId = null;
    const showAllEl = document.getElementById('toggleShowAllParas');
    if (showAllEl && showAllEl.checked) {
      showAllEl.checked = false;
    }
    renderRecentUpdatesBar();
    renderMapLayersForCurrentMode();
    renderReaderList();
    recordListEl.scrollTop = 0;
    const firstRec = getVisibleRecords().find(r => r.para_index === currentParaIndex);
    if (firstRec) {
      saveReadingBookmark(firstRec.id);
    }
  }

  function changeParagraph(delta) {
    goToParagraph(currentParaIndex + delta);
  }

  function renderReaderList() {
    const showAll = isEditModeActive() && document.getElementById('toggleShowAllParas') && document.getElementById('toggleShowAllParas').checked;
    const maxVis = getMaxVisibleParagraph();
    if (currentParaIndex > maxVis) {
      currentParaIndex = maxVis;
    }

    // 地図と本文の間の段落切り替えバー（← 第 1 / ○ →）を更新
    if (paraTopNavEl) {
      if (!showAll) {
        const prevDisabled = currentParaIndex <= 1 ? 'disabled' : '';
        const nextDisabled = currentParaIndex >= maxVis ? 'disabled' : '';
        let optionsHtml = '';
        for (let p = 1; p <= maxVis; p++) {
          const selectedAttr = p === currentParaIndex ? 'selected' : '';
          optionsHtml += `<option value="${p}" ${selectedAttr}>${getSectionLabelForPara(p)}</option>`;
        }
        paraTopNavEl.innerHTML = `
          <button class="slim-nav-btn" onclick="changeParagraph(-1)" ${prevDisabled}>←</button>
          <select class="para-select" onchange="goToParagraph(parseInt(this.value, 10))">${optionsHtml}</select>
          <button class="slim-nav-btn" onclick="changeParagraph(1)" ${nextDisabled}>→</button>
        `;
      } else {
        paraTopNavEl.innerHTML = `<span class="vol-nav-title">全段落連続表示（第 1 〜 ${maxVis} 段落）</span>`;
      }
    }

    recordListEl.innerHTML = '';

    // 他巻からのジャンプ復帰履歴がある場合は最上部にワンクリック復帰バーを表示
    const crossReturnState = getSavedCrossVolumeReturnState();
    if (crossReturnState && crossReturnState.fromVolId !== CURRENT_VOL_ID) {
      const crossBarEl = document.createElement('div');
      crossBarEl.className = 'cross-back-bar';
      const mainBackBtn = document.createElement('button');
      mainBackBtn.className = 'cross-back-main-btn';
      mainBackBtn.textContent = crossReturnState.fromVolId === 'glossary'
        ? ThreeKingdomI18n.t('backIndex', { v: ThreeKingdomI18n.volLabel(crossReturnState.fromVolLabel) })
        : ThreeKingdomI18n.t('backVolSpot', { v: ThreeKingdomI18n.volLabel(crossReturnState.fromVolLabel), p: crossReturnState.fromParaIndex, id: crossReturnState.fromRecId });
      mainBackBtn.onclick = returnToPreviousVolumeReadingSpot;
      const dismissBtn = document.createElement('button');
      dismissBtn.className = 'cross-back-dismiss-btn';
      dismissBtn.textContent = ThreeKingdomI18n.t('closeBtn');
      dismissBtn.title = 'この復帰案内を消す';
      dismissBtn.onclick = () => {
        clearCrossVolumeReturnState();
        renderReaderList();
      };
      crossBarEl.appendChild(mainBackBtn);
      crossBarEl.appendChild(dismissBtn);
      recordListEl.appendChild(crossBarEl);
    }

    // 自巻内の読書履歴スタックがある場合は最上部に「元の場所に戻る」ボタンを表示
    if (readingHistoryStack.length > 0) {
      const lastId = readingHistoryStack[readingHistoryStack.length - 1];
      const backBtnEl = document.createElement('button');
      backBtnEl.className = 'back-btn';
      backBtnEl.style.display = 'inline-block';
      backBtnEl.textContent = ThreeKingdomI18n.t('backSpot', { id: lastId });
      backBtnEl.onclick = goBackToSavedReadingSpot;
      recordListEl.appendChild(backBtnEl);
    }

    const visibleRecs = getVisibleRecords();
    const targetRecords = showAll
      ? visibleRecs
      : visibleRecs.filter(rec => rec.para_index === currentParaIndex);

    targetRecords.forEach(rec => {
      const isPei = rec.type === '裴注';
      const card = document.createElement('div');
      card.className = `record-card ${isPei ? 'pei-note' : 'main-text'}`;
      card.id = `card-${rec.id}`;
      card.dataset.id = rec.id;

      card.innerHTML = `
        <div class="card-top">
          <span><strong>${rec.id}</strong> [${ThreeKingdomI18n.sectionTitle(rec.section_title)}] ${ThreeKingdomI18n.t('paraParen', { p: rec.para_index })} ${rec.era_year ? `｜ 📅 ${ThreeKingdomI18n.eraYear(rec.era_year)}` : ''}</span>
          <span class="badge ${isPei ? 'pei' : 'main'}">${ThreeKingdomI18n.typeLabel(rec.type)}</span>
        </div>
        ${ThreeKingdomI18n.renderCardBody(rec, txt => renderEmbeddedTags(txt, rec.id))}
      `;

      card.addEventListener('click', () => {
        setActiveRecord(rec.id);
      });

      recordListEl.appendChild(card);
    });

    // 本文の一番下に配置する Google AdSense 広告スペース（右下の旧索引ボタンは左上プルダウンへ統合廃止）
    const adBox = document.createElement('div');
    adBox.className = 'ad-footer-box';
    adBox.innerHTML = `
      <div class="ad-footer-label">${ThreeKingdomI18n.t('sponsor')}</div>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-4382223240782332"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    `;
    recordListEl.appendChild(adBox);
    try {
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    } catch (e) {}
  }

  function saveReadingBookmark(recId) {
    if (!isBookmarkTrackingReady || !recId) return;
    const curMeta = getVolumeMetaById(CURRENT_VOL_ID);
    try {
      localStorage.setItem(LAST_READING_STORAGE_KEY, JSON.stringify({
        volId: CURRENT_VOL_ID,
        file: curMeta.file,
        recId: recId,
        paraIndex: currentParaIndex
      }));
      const rawPerVol = localStorage.getItem(PER_VOL_READING_STORAGE_KEY);
      const perVolMap = rawPerVol ? JSON.parse(rawPerVol) : {};
      perVolMap[String(CURRENT_VOL_ID)] = recId;
      localStorage.setItem(PER_VOL_READING_STORAGE_KEY, JSON.stringify(perVolMap));
    } catch (e) {}
  }

  function setActiveRecord(recId) {
    const rec = RECORDS.find(r => r.id === recId);
    if (rec && rec.para_index !== currentParaIndex) {
      currentParaIndex = rec.para_index;
      renderMapLayersForCurrentMode();
    }
    currentActiveId = recId;
    document.querySelectorAll('.record-card').forEach(c => {
      c.classList.toggle('active-card', c.dataset.id === recId);
    });
    saveReadingBookmark(recId);
  }

  // 8. 全カテゴリ統一モーダル（確定構造化タグによる全巻横断出現抽出・同姓同名相互切替・巻またぎジャンプ）
  const VOLUME_META_FALLBACK = [
    { id: 1, file: 'vol01.html', short_label: '魏書一 武帝紀', full_label: '魏書一　武帝紀' },
    { id: 17, file: 'vol17.html', short_label: '魏書十七 五将軍伝', full_label: '魏書十七　張樂于張徐傳' },

    { id: 46, file: 'vol46.html', short_label: '呉書一 孫堅孫策伝', full_label: '呉書一　孫破虜討逆傳' }
  ];

  let currentModalOccurrences = [];
  let currentModalVolumeFilter = 'all';
  let quickSearchCatalogCache = null;

  function getVolumesMetaList() {
    if (window.THREEKINGDOM_SHARED && Array.isArray(window.THREEKINGDOM_SHARED.volumes)) {
      return window.THREEKINGDOM_SHARED.volumes;
    }
    return VOLUME_META_FALLBACK;
  }

  function getVolumeMetaById(volId) {
    return getVolumesMetaList().find(v => v.id === volId) || {
      id: volId,
      file: `vol${String(volId).padStart(2, '0')}.html`,
      short_label: `巻${volId}`,
      full_label: `巻${volId}`
    };
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeRegExp(str) {
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlightExactSurfaces(text, surfaces) {
    if (!text) return '';
    const validSurfaces = Array.from(new Set((surfaces || []).map(s => String(s || '').trim()).filter(Boolean)))
      .sort((a, b) => b.length - a.length);
    if (validSurfaces.length === 0) return escapeHtml(text);
    const pattern = new RegExp('(' + validSurfaces.map(escapeRegExp).join('|') + ')', 'g');
    const parts = String(text).split(pattern);
    return parts.map((part, idx) => (
      idx % 2 === 1 ? `<span class="highlight">${escapeHtml(part)}</span>` : escapeHtml(part)
    )).join('');
  }

  function extractLocalVolumeOccurrences(categoryType, itemKey) {
    const volMeta = getVolumeMetaById(CURRENT_VOL_ID);
    const results = [];
    const tagRegex = /\{\{(place|office|person|special):([^|}]+)\|([^}]+)\}\}?/g;
    const baseName = itemKey.split('_')[0];

    getVisibleRecords().forEach(rec => {
      const surfaceSet = new Set();
      [rec.raw_tagged, rec.kakikudashi_tagged, rec.translation_tagged].forEach(taggedStr => {
        if (!taggedStr) return;
        tagRegex.lastIndex = 0;
        let m;
        while ((m = tagRegex.exec(taggedStr)) !== null) {
          if (m[1] === categoryType && m[2] === itemKey) {
            surfaceSet.add(m[3]);
          }
        }
      });

      let isMatched = surfaceSet.size > 0;
      if (categoryType === 'person') {
        const recPersonKeys = String(rec.persons || '').split(',').map(s => s.trim()).filter(Boolean);
        if (recPersonKeys.includes(itemKey)) {
          isMatched = true;
          if (surfaceSet.size === 0 && baseName) surfaceSet.add(baseName);
        }
      } else if (categoryType === 'special' && !isMatched) {
        const spInfo = SPECIAL_KW[itemKey];
        if (spInfo) {
          const targetRecs = spInfo.target_records;
          if (!targetRecs || targetRecs.includes(rec.id)) {
            const terms = spInfo.match_terms || [itemKey];
            const hay = [rec.raw_text, rec.kakikudashi, rec.translation, rec.source_book].join(' ');
            terms.forEach(t => {
              if (t && hay.includes(t)) surfaceSet.add(t);
            });
            isMatched = surfaceSet.size > 0;
          }
        }
      }

      if (isMatched) {
        results.push({
          vol_id: CURRENT_VOL_ID,
          vol_short_label: volMeta.short_label,
          vol_file: volMeta.file,
          id: rec.id,
          para_index: rec.para_index,
          section_title: rec.section_title,
          type: rec.type,
          era_year: rec.era_year || '',
          raw_text: rec.raw_text,
          translation: rec.translation,
          surfaces: Array.from(surfaceSet)
        });
      }
    });
    return results;
  }

  function collectUnifiedOccurrences(categoryType, itemKey) {
    const localOccs = extractLocalVolumeOccurrences(categoryType, itemKey);
    if (categoryType === 'special' || !window.THREEKINGDOM_SHARED) {
      return localOccs;
    }

    const shared = window.THREEKINGDOM_SHARED;
    const occMap = categoryType === 'person' ? shared.person_occurrences : shared.office_occurrences;
    const sharedList = (occMap && occMap[itemKey]) ? occMap[itemKey] : [];
    const byVol = new Map();
    getVolumesMetaList().forEach(v => byVol.set(v.id, []));

    // 自巻は常に現在の表示モード（公開段落または制作中全段落）と完全同期した localOccs を採用
    byVol.set(CURRENT_VOL_ID, localOccs);

    // 他巻は shared_cross_index.js の確定構造化データから取得
    sharedList.forEach(entry => {
      const rec = shared.records && shared.records[entry.rec_id];
      if (!rec || rec.vol_id === CURRENT_VOL_ID) return;
      const vMeta = getVolumeMetaById(rec.vol_id);
      if (!byVol.has(rec.vol_id)) byVol.set(rec.vol_id, []);
      byVol.get(rec.vol_id).push({
        vol_id: rec.vol_id,
        vol_short_label: vMeta.short_label,
        vol_file: vMeta.file,
        id: entry.rec_id,
        para_index: rec.para_index,
        section_title: rec.section_title,
        type: rec.type,
        era_year: rec.era_year || '',
        raw_text: rec.raw_text,
        translation: rec.translation,
        surfaces: entry.surfaces || []
      });
    });

    const merged = [];
    Array.from(byVol.keys()).sort((a, b) => a - b).forEach(vId => {
      merged.push(...(byVol.get(vId) || []));
    });
    return merged;
  }

  function getTotalOccurrenceCountForKey(categoryType, itemKey) {
    return collectUnifiedOccurrences(categoryType, itemKey).length;
  }

      wikiTargetTitle = info.wiki_title !== undefined ? info.wiki_title : itemKey;
      mappingNote = info.mapping_note ? `💡 ${escapeHtml(info.mapping_note)}` : '';
      specialGlossaryDesc = ThreeKingdomI18n.localDesc(categoryType, itemKey, info.ai_desc || '');

      ? ThreeKingdomI18n.t('descPerson')
      : (categoryType === 'office' ? ThreeKingdomI18n.t('descOffice') : ThreeKingdomI18n.t('descTerm'));

    const specialDescHtml = specialGlossaryDesc

           <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">${descBoxLabel}</div>
           <div>${escapeHtml(specialGlossaryDesc)}</div>
         </div>`
      : '';

    const wikiBoxHtml = (wikiTargetTitle && ThreeKingdomI18n.getLang() === 'ja')
      ? `<div class="wiki-standard-box" id="unifiedWikiBox">
           <div>${ThreeKingdomI18n.t('wikiLoading', { n: escapeHtml(wikiTargetTitle) })}</div>
         </div>`

    bodyEl.innerHTML = `

  function setModalVolumeFilter(volFilterValue, categoryType = 'person') {
    currentModalVolumeFilter = volFilterValue;
    renderModalVolumeFilterAndList(categoryType);
  }

  function renderModalVolumeFilterAndList(categoryType) {
    const filterBarEl = document.getElementById('modalVolFilterBar');
    if (filterBarEl) {
      const countsByVol = new Map();
      currentModalOccurrences.forEach(o => {
        countsByVol.set(o.vol_id, (countsByVol.get(o.vol_id) || 0) + 1);
      });
      let pillsHtml = `<button class="vol-filter-pill ${currentModalVolumeFilter === 'all' ? 'active' : ''}" onclick="setModalVolumeFilter('all', '${categoryType}')">${ThreeKingdomI18n.t('allVolsBtn')}</button>`;
      getVolumesMetaList().forEach(v => {
        const c = countsByVol.get(v.id) || 0;
        if (c === 0) return;
        const isCurVol = v.id === CURRENT_VOL_ID;
        const activeCls = currentModalVolumeFilter === v.id ? 'active' : '';
        const curMark = isCurVol ? '📍' : '';
        pillsHtml += `<button class="vol-filter-pill ${activeCls}" onclick="setModalVolumeFilter(${v.id}, '${categoryType}')">${curMark}${escapeHtml(ThreeKingdomI18n.volLabel(v.short_label))}</button>`;
      });
      filterBarEl.innerHTML = pillsHtml;
    }

    const filtered = currentModalVolumeFilter === 'all'
      ? currentModalOccurrences
      : currentModalOccurrences.filter(o => o.vol_id === currentModalVolumeFilter);

    const summaryEl = document.getElementById('modalOccurrenceSummary');
    if (summaryEl) {
      if (currentModalVolumeFilter === 'all') {
        summaryEl.textContent = categoryType === 'special'
          ? ThreeKingdomI18n.t('occList')
          : ThreeKingdomI18n.t('occListAll');
      } else {
        const vMeta = getVolumeMetaById(currentModalVolumeFilter);
        summaryEl.textContent = ThreeKingdomI18n.t('occInVol', { v: ThreeKingdomI18n.volLabel(vMeta.short_label) });
      }
    }

    const occListEl = document.getElementById('modalOccurrenceList');
    if (occListEl) {
      occListEl.innerHTML = '';
      appendOccurrencesToModal(occListEl, filtered);
    }
  }

  async function fetchWikipediaSummary(wikiTitle, containerId, fallbackDesc = '', hasSpecialBox = false) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const encoded = encodeURIComponent(wikiTitle);
    const wikiUrl = `https://ja.wikipedia.org/wiki/${encoded}`;
    try {
      const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encoded}`);
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      if (data.type === 'disambiguation') throw new Error('Disambiguation');
      box.innerHTML = `
        <div style="font-weight:bold; color:#0d47a1; margin-bottom:4px;">🌐 【Wikipedia 概略】「${escapeHtml(data.title)}」</div>
        <div>${escapeHtml(data.extract || '（要約テキストなし）')}</div>
        <a class="wiki-link-btn" href="${wikiUrl}" target="_blank" rel="noopener">Wikipediaで「${escapeHtml(data.title)}」のページを開く ↗</a>
      `;
    } catch (err) {
      if (hasSpecialBox) {
        box.style.display = 'none';
      } else if (fallbackDesc) {
        box.className = 'ai-special-box';
        box.innerHTML = `
          <div style="font-weight:bold; color:#4a148c; margin-bottom:4px;">${ThreeKingdomI18n.t('descTermFallback')}</div>
          <div>${escapeHtml(fallbackDesc)}</div>
        `;
      } else {
        box.style.display = 'none';
      }
    }
  }

  function appendOccurrencesToModal(container, occurrences) {
    if (!occurrences || occurrences.length === 0) {
      container.innerHTML = `<div style="padding:10px; color:#666; font-size:0.86rem;">${ThreeKingdomI18n.t('noOcc')}</div>`;
      return;
    }
    occurrences.forEach(occ => {
      const item = document.createElement('div');
      item.className = 'modal-occurrence';
      const isSameVol = occ.vol_id === CURRENT_VOL_ID;
      const isCurrent = isSameVol && occ.id === currentActiveId;
      const safeFile = String(occ.vol_file || '').replace(/'/g, "\'");
      const safeRecId = String(occ.id || '').replace(/'/g, "\'");

      const volBadgeHtml = isSameVol
        ? `<span class="cross-vol-badge same-vol">📍 ${escapeHtml(ThreeKingdomI18n.volLabel(occ.vol_short_label))}</span>`
        : `<span class="cross-vol-badge">📘 ${escapeHtml(ThreeKingdomI18n.volLabel(occ.vol_short_label))}</span>`;

      const actionBtnHtml = isSameVol
        ? `<button class="jump-btn" onclick="jumpToRecordFromModal('${safeRecId}')">${ThreeKingdomI18n.t('jumpHere')}</button>`
        : `<button class="jump-btn other-vol" onclick="jumpToOtherVolumeRecord('${safeFile}', '${safeRecId}')">${ThreeKingdomI18n.t('jumpOtherVol', { v: ThreeKingdomI18n.volLabel(occ.vol_short_label) })}</button>`;

      item.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
          <span style="font-size:0.82rem; font-weight:bold; color:#3d2f1d;">
            ${volBadgeHtml} ${escapeHtml(occ.id)} [${escapeHtml(ThreeKingdomI18n.sectionTitle(occ.section_title))}] ${ThreeKingdomI18n.t('paraParenType', { p: occ.para_index, type: ThreeKingdomI18n.typeLabel(occ.type) })}${occ.era_year ? ` ｜ 📅 ${escapeHtml(ThreeKingdomI18n.eraYear(occ.era_year))}` : ''} ${isCurrent ? ThreeKingdomI18n.t('nowReading') : ''}
          </span>
          ${actionBtnHtml}
        </div>
        <div class="raw-text" style="font-size:0.95rem;">${highlightExactSurfaces(occ.raw_text, occ.surfaces)}</div>
        <div class="translation" style="font-size:0.88rem;">${highlightExactSurfaces(occ.translation, occ.surfaces)}</div>
      `;
      container.appendChild(item);
    });
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function getSavedCrossVolumeReturnState() {
    try {
      const raw = sessionStorage.getItem(CROSS_JUMP_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function clearCrossVolumeReturnState() {
    try {
      sessionStorage.removeItem(CROSS_JUMP_STORAGE_KEY);
    } catch (e) {}
  }

  function jumpToOtherVolumeRecord(targetFile, targetRecId) {
    const curMeta = getVolumeMetaById(CURRENT_VOL_ID);
    try {
      sessionStorage.setItem(CROSS_JUMP_STORAGE_KEY, JSON.stringify({
        fromVolId: CURRENT_VOL_ID,
        fromVolLabel: curMeta.short_label,
        fromFile: curMeta.file,
        fromRecId: currentActiveId,
        fromParaIndex: currentParaIndex
      }));
    } catch (e) {}
    window.location.href = `${targetFile}?jump=${encodeURIComponent(targetRecId)}`;
  }

  function returnToPreviousVolumeReadingSpot() {
    const st = getSavedCrossVolumeReturnState();
    if (!st || !st.fromFile) return;
    clearCrossVolumeReturnState();
    if (st.returnUrl) {
      window.location.href = st.returnUrl;
      return;
    }
    window.location.href = `${st.fromFile}?return_to=${encodeURIComponent(st.fromRecId)}`;
  }

  function flashJumpCardElement(recId) {
    setTimeout(() => {
      const cardEl = document.getElementById(`card-${recId}`);
      if (!cardEl) return;
      cardEl.classList.add('cross-jump-flash-card');
      setTimeout(() => {
        cardEl.classList.remove('cross-jump-flash-card');
      }, CROSS_JUMP_FLASH_DURATION_MS);
    }, CROSS_JUMP_SCROLL_DELAY_MS);
  }

  function handleInitialCrossVolumeNavigation() {
    const jumpTargetId = urlParams.get('jump');
    const returnTargetId = urlParams.get('return_to');
    const resumeTargetId = urlParams.get('resume');

    if (returnTargetId) {
      clearCrossVolumeReturnState();
      isBookmarkTrackingReady = true;
      scrollToCard(returnTargetId);
      flashJumpCardElement(returnTargetId);
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
      return;
    }

    if (jumpTargetId) {
      isBookmarkTrackingReady = true;
      scrollToCard(jumpTargetId);
      flashJumpCardElement(jumpTargetId);
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
      return;
    }

    if (resumeTargetId) {
      isBookmarkTrackingReady = true;
      scrollToCard(resumeTargetId);
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
      return;
    }

    // URLパラメータなしの通常アクセス：トップURL（index.html または /）なら全体の最終読書位置を再開、個別巻URLならその巻の最終段落を復元
    const pathLower = (window.location.pathname || '').toLowerCase();
    const isExplicitVolPage = /vol\d+\.html$/.test(pathLower);

    if (!isExplicitVolPage) {
      try {
        const rawLast = localStorage.getItem(LAST_READING_STORAGE_KEY);
        if (rawLast) {
          const lastSt = JSON.parse(rawLast);
          if (lastSt && lastSt.volId && lastSt.volId !== CURRENT_VOL_ID && lastSt.file && lastSt.recId) {
            window.location.replace(`${lastSt.file}?resume=${encodeURIComponent(lastSt.recId)}`);
            return;
          }
          if (lastSt && lastSt.volId === CURRENT_VOL_ID && lastSt.recId) {
            isBookmarkTrackingReady = true;
            scrollToCard(lastSt.recId, false);
            return;
          }
        }
      } catch (e) {}
    } else {
      try {
        const rawPerVol = localStorage.getItem(PER_VOL_READING_STORAGE_KEY);
        if (rawPerVol) {
          const perVolMap = JSON.parse(rawPerVol);
          const savedRecId = perVolMap && perVolMap[String(CURRENT_VOL_ID)];
          if (savedRecId) {
            isBookmarkTrackingReady = true;
            scrollToCard(savedRecId, false);
            return;
          }
        }
      } catch (e) {}
    }

    isBookmarkTrackingReady = true;
    saveReadingBookmark(currentActiveId);
  }

  function jumpToRecordFromModal(targetId) {
    if (targetId !== currentActiveId) {
      readingHistoryStack.push(currentActiveId);
    }
    closeModal();
    scrollToCard(targetId);
  }

  function goBackToSavedReadingSpot() {
    if (readingHistoryStack.length === 0) return;
    const prevId = readingHistoryStack.pop();
    scrollToCard(prevId);
  }

  function scrollToCard(recId, highlightCard = true) {
    const rec = getVisibleRecords().find(r => r.id === recId);
    if (!rec) return;
    if (currentParaIndex !== rec.para_index) {
      currentParaIndex = rec.para_index;
      renderMapLayersForCurrentMode();
    }
    renderReaderList();
    if (!highlightCard) {
      recordListEl.scrollTop = 0;
      currentActiveId = rec.id;
      saveReadingBookmark(rec.id);
      return;
    }
    const cardEl = document.getElementById(`card-${recId}`);
    if (cardEl) {
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setActiveRecord(recId);
    }
  }

  function highlightSimple(text, terms) {
    if (!text) return '';
    let res = text;
    terms.forEach(t => {
      if (!t) return;
      res = res.replace(new RegExp(t, 'g'), `<span class="highlight">${t}</span>`);
    });
    return res;
  }

  function jumpToRecentUpdate(recId, blockClass, targetWord) {
    scrollToCard(recId);
    setTimeout(() => {
      const cardEl = document.getElementById(`card-${recId}`);
      if (!cardEl) return;

      document.querySelectorAll('.flash-update-target').forEach(el => el.classList.remove('flash-update-target'));
      document.querySelectorAll('.flash-card-target').forEach(el => el.classList.remove('flash-card-target'));

      if (!targetWord) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        cardEl.classList.add('flash-card-target');
        return;
      }

      const containerEl = (blockClass ? cardEl.querySelector(`.${blockClass}`) : null) || cardEl;
      const tagSpans = Array.from(containerEl.querySelectorAll('.inline-place, .inline-person, .inline-office, .inline-special'));
      let matchedEl = tagSpans.find(sp => (sp.textContent || '').trim() === targetWord)
                   || tagSpans.find(sp => (sp.textContent || '').includes(targetWord));

      if (matchedEl) {
        matchedEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        matchedEl.classList.add('flash-update-target');
      } else {
        containerEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cardEl.classList.add('flash-card-target');
      }
    }, 60);
  }
