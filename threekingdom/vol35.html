"para_index": 34, "type": "本文", "raw_text": "當此之時，亮之素志，進欲龍驤虎視，包括四海，退欲跨陵邊疆，震蕩宇內。又自以為無身之日，則未有能蹈涉中原、抗衡上國者，是以用兵不戢，屢耀其武。然亮才，於治戎為長，奇謀為短，理民之干，優於將略。而所與對敵，或值人傑，加眾寡不侔，攻守異體，故雖連年動眾，未能有克。昔蕭何薦韓信，管仲舉王子城父，皆忖己之長，未能兼有故也。亮之器能政理，抑亦管、蕭之亞匹也，而時之名將無城父、韓信，故使功業陵遲，大義不及邪？蓋天命有歸，不可以智力爭也。", "kakikudashi": "此の時に当たり、亮の素志は、進みては龍驤虎視して、四海を包括せんと欲し、退きては辺疆を跨陵して、宇内を震蕩せんと欲せり。又た自ら以為えらく、身無きの日には、則ち未だ能く中原を蹈渉し、上国に抗衡する者有らじと、是を以て兵を用いて戢めず、屢しば其の武を耀かせり。然れども亮の才は、治戎に於いて長と為し、奇謀を短と為し、民を理むるの幹は、将略よりも優れり。而して与に対敵する所、或いは人傑に値い、加うるに衆寡侔しからず、攻守体を異にするを以て、故に連年衆を動かすと雖も、未だ能く克つこと有らず。昔、蕭何は韓信を薦め、管仲は王子城父を挙げしは、皆な己の長を忖りて、未だ能く兼ね有せざるが故なり。亮の器能・政理は、抑そも亦た管・蕭の亜匹なるも、而も時の名将に城父・韓信無かりしゆえ、功業をして陵遅し、大義をして及ばざらしめしや？蓋し天命に帰する有りて、智力を以て争うべからざればなり。", "translation": "この当時にあって、諸葛亮の本来の志は、進んでは龍が天に昇り虎が睨み据えるがごとく、四海をその手に包み込もうと望み、退いては辺境を踏み越えて、天下を震い動かそうと望むところにありました。また自らの亡き後には、もはや中原に足を踏み入れ、上国と対等に渡り合える者はあるまいと考え、それゆえ用兵をやめようとせず、たびたびその武威を示したのであります。しかしながら諸葛亮の才能は、軍隊を治め整えることに長じ、奇策謀略を短所としており、民を治める幹能は、将帥としての戦略よりも優れておりました。しかも対戦した相手には、たまたま人傑に巡り合わせたこともあり、加えて兵力の多寡が釣り合わず、攻める側と守る側とで立場も異なっていたため、連年にわたり軍衆を動かしたとはいえ、ついに勝利を収めることができなかったのであります。むかし蕭何が韓信を推薦し、管仲が王子城父を推挙したのは、みな己の長所と限界を推し量り、双方の才を兼ね備えることはできないと悟っていたからでございます。諸葛亮の器量才能と政治手腕は、そもそもまた管仲・蕭何に次ぐ匹敵者でありましたが、当時の名将のなかに王子城父や韓信がいなかったために、功業が振るわず衰え、大義が届かなかったのでありましょうか？思うに天命には帰趨するところが定まっており、人間の知恵や力では争い得ないからでございましょう。", "persons": "諸葛亮, 蕭何, 韓信, 管仲, 王子城父", "places": "中原", "era_year": "泰始10年（274）2月", "source_book": "", "keywords": "", "raw_tagged": "當此之時，{{person:諸葛亮|亮}}之素志，進欲龍驤虎視，包括四海，退欲跨陵邊疆，震蕩宇內。又自以為無身之日，則未有能蹈涉{{place:中原|中原}}、抗衡上國者，是以用兵不戢，屢耀其武。然{{person:諸葛亮|亮}}才，於治戎為長，奇謀為短，理民之干，優於將略。而所與對敵，或值人傑，加眾寡不侔，攻守異體，故雖連年動眾，未能有克。昔{{person:蕭何|蕭何}}薦{{person:韓信|韓信}}，{{person:管仲|管仲}}舉{{person:王子城父|王子城父}}，皆忖己之長，未能兼有故也。{{person:諸葛亮|亮}}之器能政理，抑亦{{person:管仲|管}}{{person:蕭何|、蕭}}之亞匹也，而時之名將無{{person:王子城父|城父}}、{{person:韓信|韓信}}，故使功業陵遲，大義不及邪？蓋天命有歸，不可以智力爭也。", "kakikudashi_tagged": "此の時に当たり、{{person:諸葛亮|亮}}の素志は、進みては龍驤虎視して、四海を包括せんと欲し、退きては辺疆を跨陵して、宇内を震蕩せんと欲せり。又た自ら以為えらく、身無きの日には、則ち未だ能く{{place:中原|中原}}を蹈渉し、上国に抗衡する者有らじと、是を以て兵を用いて戢めず、屢しば其の武を耀かせり。然れども{{person:諸葛亮|亮}}の才は、治戎に於いて長と為し、奇謀を短と為し、民を理むるの幹は、将略よりも優れり。而して与に対敵する所、或いは人傑に値い、加うるに衆寡侔しからず、攻守体を異にするを以て、故に連年衆を動かすと雖も、未だ能く克つこと有らず。昔、{{person:蕭何|蕭何}}は{{person:韓信|韓信}}を薦め、{{person:管仲|管仲}}は{{person:王子城父|王子城父}}を挙げしは、皆な己の長を忖りて、未だ能く兼ね有せざるが故なり。{{person:諸葛亮|亮}}の器能・政理は、抑そも亦た{{person:管仲|管}}{{person:蕭何|・蕭}}の亜匹なるも、而も時の名将に{{person:王子城父|城父}}・{{person:韓信|韓信}}無かりしゆえ、功業をして陵遅し、大義をして及ばざらしめしや？蓋し天命に帰する有りて、智力を以て争うべからざればなり。", "translation_tagged": "この当時にあって、{{person:諸葛亮|諸葛亮}}の本来の志は、進んでは龍が天に昇り虎が睨み据えるがごとく、四海をその手に包み込もうと望み、退いては辺境を踏み越えて、天下を震い動かそうと望むところにありました。また自らの亡き後には、もはや{{place:中原|中原}}に足を踏み入れ、上国と対等に渡り合える者はあるまいと考え、それゆえ用兵をやめようとせず、たびたびその武威を示したのであります。しかしながら{{person:諸葛亮|諸葛亮}}の才能は、軍隊を治め整えることに長じ、奇策謀略を短所としており、民を治める幹能は、将帥としての戦略よりも優れておりました。しかも対戦した相手には、たまたま人傑に巡り合わせたこともあり、加えて兵力の多寡が釣り合わず、攻める側と守る側とで立場も異なっていたため、連年にわたり軍衆を動かしたとはいえ、ついに勝利を収めることができなかったのであります。むかし{{person:蕭何|蕭何}}が{{person:韓信|韓信}}を推薦し、{{person:管仲|管仲}}が{{person:王子城父|王子城父}}を推挙したのは、みな己の長所と限界を推し量り、双方の才を兼ね備えることはできないと悟っていたからでございます。{{person:諸葛亮|諸葛亮}}の器量才能と政治手腕は、そもそもまた{{person:管仲|管仲}}・{{person:蕭何|蕭何}}に次ぐ匹敵者でありましたが、当時の名将のなかに{{person:王子城父|王子城父}}や{{person:韓信|韓信}}がいなかったために、功業が振るわず衰え、大義が届かなかったのでありましょうか？思うに天命には帰趨するところが定まっており、人間の知恵や力では争い得ないからでございましょう。"}, {"id": "v35_p35_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 35, "type": "本文", "raw_text": "青龍二年春，亮帥眾出武功，分兵屯田，為久駐之基。其秋病卒，黎庶追思，以為口實。至今梁、益之民，咨述亮者，言猶在耳，雖甘棠之詠召公，鄭人之歌子產，無以遠譬也。孟軻有云：「以逸道使民，雖勞不怨；以生道殺人，雖死不忿。」信矣！論者或怪亮文彩不艷，而過於丁寧周至。臣愚以為咎繇大賢也，周公聖人也，考之《尚書》，咎繇之謨略而雅，周公之誥煩而悉。何則？咎繇與舜、禹共談，周公與群下矢誓故也。亮所與言，盡眾人凡士，故其文指不得及遠也。然其聲教遺言，皆經事綜物，公誠之心，形於文墨，足以知其人之意理，而有補於當世。", "kakikudashi": "青龍二年の春、亮は衆を帥いて武功に出で、兵を分かちて屯田し、久駐の基を為す。其の秋、病みて卒するや、黎庶追思し、以て口実と為す。今に至るも梁・益の民、亮を咨述する者、言は猶お耳に在り、甘棠の召公を詠じ、鄭人の子産を歌うと雖も、以て遠く譬うる無きなり。孟軻の云える有り、「逸道を以て民を使わば、労すと雖も怨みず、生道を以て人を殺さば、死すと雖も忿らず」と。信なるかな！論者、或いは亮の文彩艶ならずして、丁寧周至に過ぎたるを怪しむ。臣、愚以為えらく、咎繇は大賢なり、周公は聖人なり、之を『尚書』に考うるに、咎繇の謨は略にして雅、周公の誥は煩にして悉なり。何となれば則ち、咎繇は舜・禹と共に談じ、周公は群下と矢誓せしが故なり。亮の与に言う所は、尽く衆人・凡士なれば、故に其の文指は遠きに及ぶを得ざるなり。然れども其の声教・遺言は、皆な事を経め物を綜べ、公誠の心、文墨に形れ、以て其の人の意理を知るに足り、而して当世に補い有り。", "translation": "青龍二年の春、諸葛亮は軍衆を率いて武功に出陣し、兵を分けて屯田を行い、長期駐留の基盤を築きました。その秋に病没すると、民衆は彼を慕い偲んで、語り草といたしました。今に至るまで梁州・益州の民が、諸葛亮を嘆賞して語り継ぐ言葉は、なお耳に残るほどであり、甘棠の詩が召公を詠い、鄭の人々が子産を歌い称えた故事といえども、これほどまでとは譬えきれないほどでございます。孟軻の言葉に、「民を安んじる道をもって民を使役すれば、労苦しても怨まず、人を生かす道をもって人を処刑すれば、死んでも憤らない」とあります。まことにその通りでございます！論者のなかには、あるいは諸葛亮の文章に華やかな彩りがなく、あまりにも懇切丁寧・周到に過ぎるのを怪しむ者もおります。臣が愚考いたしますに、咎繇は大賢であり、周公は聖人でありますが、これを『尚書』に照らして考えますと、咎繇の謨は簡略にして高雅であり、周公の誥は煩雑なほど詳細を極めております。なぜならば、咎繇は舜・禹とともに語り合い、周公は多くの臣下たちと誓いを立てたからでございます。諸葛亮が言葉を交わした相手は、ことごとく並の人々や凡庸な士でありましたから、それゆえその文章の趣旨も高遠な表現に及ぶわけにはいかなかったのであります。しかしながらその教化や遺された言葉は、いずれも実務を筋道立てて万事を総括し、公正至誠の心が、文章筆墨のうえに現れ出ており、その人物の志向と道理を知るに足り、今の世にも裨益するところがございます。", "persons": "諸葛亮, 召公奭, 公孫僑, 孟子, 皋陶, 周公, 虞舜, 禹", "places": "武功, 梁州, 益州, 鄭", "era_year": "泰始10年（274）2月", "source_book": "", "keywords": "青龍, 屯田, 書経", "raw_tagged": "{{special:青龍|青龍}}二年春，{{person:諸葛亮|亮}}帥眾出{{place:武功|武功}}，分兵{{special:屯田|屯田}}，為久駐之基。其秋病卒，黎庶追思，以為口實。至今{{place:梁州|梁}}{{place:益州|、益}}之民，咨述{{person:諸葛亮|亮}}者，言猶在耳，雖甘棠之詠{{person:召公奭|召公}}，{{place:鄭|鄭}}人之歌{{person:公孫僑|子產}}，無以遠譬也。{{person:孟子|孟軻}}有云：「以逸道使民，雖勞不怨；以生道殺人，雖死不忿。」信矣！論者或怪{{person:諸葛亮|亮}}文彩不艷，而過於丁寧周至。臣愚以為{{person:皋陶|咎繇}}大賢也，{{person:周公|周公}}聖人也，考之{{special:書経|《尚書》}}，{{person:皋陶|咎繇}}之謨略而雅，{{person:周公|周公}}之誥煩而悉。何則？{{person:皋陶|咎繇}}與{{person:虞舜|舜}}{{person:禹|、禹}}共談，{{person:周公|周公}}與群下矢誓故也。{{person:諸葛亮|亮}}所與言，盡眾人凡士，故其文指不得及遠也。然其聲教遺言，皆經事綜物，公誠之心，形於文墨，足以知其人之意理，而有補於當世。", "kakikudashi_tagged": "{{special:青龍|青龍}}二年の春、{{person:諸葛亮|亮}}は衆を帥いて{{place:武功|武功}}に出で、兵を分かちて{{special:屯田|屯田}}し、久駐の基を為す。其の秋、病みて卒するや、黎庶追思し、以て口実と為す。今に至るも{{place:梁州|梁}}{{place:益州|・益}}の民、{{person:諸葛亮|亮}}を咨述する者、言は猶お耳に在り、甘棠の{{person:召公奭|召公}}を詠じ、{{place:鄭|鄭}}人の{{person:公孫僑|子産}}を歌うと雖も、以て遠く譬うる無きなり。{{person:孟子|孟軻}}の云える有り、「逸道を以て民を使わば、労すと雖も怨みず、生道を以て人を殺さば、死すと雖も忿らず」と。信なるかな！論者、或いは{{person:諸葛亮|亮}}の文彩艶ならずして、丁寧周至に過ぎたるを怪しむ。臣、愚以為えらく、{{person:皋陶|咎繇}}は大賢なり、{{person:周公|周公}}は聖人なり、之を{{special:書経|『尚書』}}に考うるに、{{person:皋陶|咎繇}}の謨は略にして雅、{{person:周公|周公}}の誥は煩にして悉なり。何となれば則ち、{{person:皋陶|咎繇}}は{{person:虞舜|舜}}{{person:禹|・禹}}と共に談じ、{{person:周公|周公}}は群下と矢誓せしが故なり。{{person:諸葛亮|亮}}の与に言う所は、尽く衆人・凡士なれば、故に其の文指は遠きに及ぶを得ざるなり。然れども其の声教・遺言 は、大通の道を明らかにする所以なり。謹んで録写し上りて著作に詣らしむ。臣{{person:陳寿|寿}}、誠惶誠恐、頓首頓首、死罪死罪。{{special:泰始|泰始}}十年二月一日癸巳、{{place:平陽|平陽}}{{office:侯相|侯相}}の臣{{person:陳寿|陳寿}}上る。", "translation_tagged": "伏して思いまするに、{{person:司馬炎|陛下}}には古の聖王の足跡をも超えられ、広大無辺にして忌み憚られるところがなく、それゆえ敵国による誹謗の言葉といえども、ことごとくその文辞をそのまま残して改変や避諱を加えさせないのは、公明正大なる大通の道を明らかにされるゆえんでございます。謹んで筆録書写し奉呈して著作省へ差し出します。臣・{{person:陳寿|陳寿}}、誠惶誠恐、頓首頓首、死罪死罪。{{special:泰始|泰始}}十年二月一日癸巳、{{place:平陽|平陽}}{{office:侯相|侯相}}の臣・{{person:陳寿|陳寿}}が奉呈いたします。"}, {"id": "v35_p37_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛喬）", "para_index": 37, "type": "本文", "raw_text": "喬字伯松，亮兄瑾之第二子也，本字仲慎。與兄元遜俱有名於時，論者以為喬才不及兄，而性業過之。初，亮未有子，求喬為嗣，瑾啟孫權遣喬來西，亮以喬為己適子，故易其字焉。拜為駙馬都尉，隨亮至漢中。", "kakikudashi": "喬、字は伯松、亮の兄・瑾の第二子なり、本の字は仲慎。兄の元遜と倶に時に名有り、論者以為えらく、喬の才は兄に及ばざれども、性業は之に過ぐ、と。初め、亮に未だ子有らず、喬を求めて嗣と為さんとす、瑾、孫権に啓し喬を遣わして来西せしむれば、亮は喬を以て己が適子と為し、故に其の字を易う。拝して駙馬都尉と為し、亮に随いて漢中に至る。", "translation": "諸葛喬、字は伯松は、諸葛亮の兄・諸葛瑾の次男であり、もとの字は仲慎といった。兄の元遜とともに当時名を知られ、批評する者たちは、諸葛喬の才能は兄に及ばないが、篤実な気質と行いは兄に勝っていると考えた。はじめ、諸葛亮にはまだ子がなかったため、諸葛喬を請うて跡継ぎにしようとし、諸葛瑾が孫権に申し上げて諸葛喬を西方へ遣わすと、諸葛亮は諸葛喬を自らの嫡子とし、それゆえその字を改めたのであった。拝せられて駙馬都尉となり、諸葛亮に従って漢中に至った。", "persons": "諸葛喬, 諸葛亮, 諸葛瑾, 諸葛恪, 孫権", "places": "漢中", "era_year": "建安末〜建興5年（220〜227）頃", "source_book": "", "keywords": "駙馬都尉", "raw_tagged": "{{person:諸葛喬|喬}}字{{person:諸葛喬|伯松}}，亮兄{{person:諸葛瑾|瑾}}之第二子也，本字{{person:諸葛喬|仲慎}}。與兄{{person:諸葛恪|元遜}}俱有名於時，論者以為{{person:諸葛喬|喬}}才不及兄，而性業過之。初，亮未有子，求{{person:諸葛喬|喬}}為嗣，{{person:諸葛瑾|瑾}}啟{{person:孫権|孫權}}遣{{person:諸葛喬|喬}}來西，亮以{{person:諸葛喬|喬}}為己適子，故易其字焉。拜為{{office:駙馬都尉|駙馬都尉}}，隨亮至{{place:漢中|漢中}}。", "kakikudashi_tagged": "{{person:諸葛喬|喬}}、字は{{person:諸葛喬|伯松}}、亮の兄・{{person:諸葛瑾|瑾}}の第二子なり、本の字は{{person:諸葛喬|仲慎}}。兄の{{person:諸葛恪|元遜}}と倶に時に名有り、論者以為えらく、{{person:諸葛喬|喬}}の才は兄に及ばざれども、性業は之に過ぐ、と。初め、亮に未だ子有らず、{{person:諸葛喬|喬}}を求めて嗣と為さんとす、{{person:諸葛瑾|瑾}}、{{person:孫権|孫権}}に啓し{{person:諸葛喬|喬}}を遣わして来西せしむれば、亮は{{person:諸葛喬|喬}}を以て己が適子と為し、故に其の字を易う。拝して{{office:駙馬都尉|駙馬都尉}}と為し、亮に随いて{{place:漢中|漢中}}に至る。", "translation_tagged": "{{person:諸葛喬|諸葛喬}}、字は{{person:諸葛喬|伯松}}は、{{person:諸葛亮|諸葛亮}}の兄・{{person:諸葛瑾|諸葛瑾}}の次男であり、もとの字は{{person:諸葛喬|仲慎}}といった。兄の{{person:諸葛恪|元遜}}とともに当時名を知られ、批評する者たちは、{{person:諸葛喬|諸葛喬}}の才能は兄に及ばないが、篤実な気質と行いは兄に勝っていると考えた。はじめ、{{person:諸葛亮|諸葛亮}}にはまだ子がなかったため、{{person:諸葛喬|諸葛喬}}を請うて跡継ぎにしようとし、{{person:諸葛瑾|諸葛瑾}}が{{person:孫権|孫権}}に申し上げて{{person:諸葛喬|諸葛喬}}を西方へ遣わすと、{{person:諸葛亮|諸葛亮}}は{{person:諸葛喬|諸葛喬}}を自らの嫡子とし、それゆえその字を改めたのであった。拝せられて{{office:駙馬都尉|駙馬都尉}}となり、{{person:諸葛亮|諸葛亮}}に従って{{place:漢中|漢中}}に至った。"}, {"id": "v35_p37_2", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛喬）", "para_index": 37, "type": "裴注", "raw_text": "亮與兄瑾書曰：「喬本當還成都，今諸將子弟皆得傳運，思惟宜同榮辱。今使喬督五六百兵，與諸子弟傳於谷中。」書在亮集。", "kakikudashi": "亮、兄の瑾に与うるの書に曰く、「喬は本より当に成都に還るべきも、今、諸将の子弟は皆な伝運するを得たれば、思惟するに宜しく栄辱を同じくすべし。今、喬をして五、六百の兵を督し、諸子弟と谷中に伝せしむ」と。書は『亮集』に在り。", "translation": "諸葛亮が兄の諸葛瑾に与えた書簡にいう、「諸葛喬は本来なら成都へ帰すべきところですが、いま諸将の子弟たちはみな兵糧の継送に従事しておりますので、つくづく思いますに栄誉も苦難もともに分かち合うべきでありましょう。いま諸葛喬に五、六百の兵を監督させ、諸将の子弟たちとともに山谷のなかで輸送にあたらせております」と。この書簡は『亮集』に収められている。", "persons": "諸葛亮, 諸葛瑾, 諸葛喬", "places": "成都", "era_year": "建興5年〜6年（227〜228）", "source_book": "『諸葛亮集』", "keywords": "諸葛亮集", "raw_tagged": "亮與兄{{person:諸葛瑾|瑾}}書曰：「{{person:諸葛喬|喬}}本當還{{place:成都|成都}}，今諸將子弟皆得傳運，思惟宜同榮辱。今使{{person:諸葛喬|喬}}督五六百兵，與諸子弟傳於谷中。」書在{{special:諸葛亮集|亮集}}。", "kakikudashi_tagged": "亮、兄の{{person:諸葛瑾|瑾}}に与うるの書に曰く、「{{person:諸葛喬|喬}}は本より当に{{place:成都|成都}}に還るべきも、今、諸将の子弟は皆な伝運するを得たれば、思惟するに宜しく栄辱を同じくすべし。今、{{person:諸葛喬|喬}}をして五、六百の兵を督し、諸子弟と谷中に伝せしむ」と。書は『{{special:諸葛亮集|亮集}}』に在り。", "translation_tagged": "{{person:諸葛亮|諸葛亮}}が兄の{{person:諸葛瑾|諸葛瑾}}に与えた書簡にいう、「{{person:諸葛喬|諸葛喬}}は本来なら{{place:成都|成都}}へ帰すべきところですが、いま諸将の子弟たちはみな兵糧の継送に従事しておりますので、つくづく思いますに栄誉も苦難もともに分かち合うべきでありましょう。いま{{person:諸葛喬|諸葛喬}}に五、六百の兵を監督させ、諸将の子弟たちとともに山谷のなかで輸送にあたらせております」と。この書簡は『{{special:諸葛亮集|亮集}}』に収められている。"}, {"id": "v35_p37_3", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛喬）", "para_index": 37, "type": "本文", "raw_text": "年二十五，建興六年卒。子攀，官至行護軍翊武將軍，亦早卒。諸葛恪見誅於吳，子孫皆盡，而亮自有冑裔，故攀還復為瑾後。", "kakikudashi": "年二十五、建興六年に卒す。子の攀、官は行護軍・翊武将軍に至るも、亦た早くに卒す。諸葛恪、呉に誅せらるるや、子孫皆な尽き、而して亮には自ら冑裔有り、故に攀は還りて復た瑾の後と為る。", "translation": "二十五歳で、建興六年に没した。子の諸葛攀は、官は行護軍・翊武将軍に至ったが、やはり若くして没した。諸葛恪が呉で誅殺されると、その子孫はみな絶え果て、いっぽう諸葛亮には自身の血を引く跡継ぎがいたため、諸葛攀は帰還して再び諸葛瑾の後嗣となった。", "persons": "諸葛喬, 諸葛攀, 諸葛恪, 諸葛亮, 諸葛瑾", "places": "江東", "era_year": "建興6年（228）〜延熙16年（253）以後", "source_book": "", "keywords": "建興, 護軍, 翊武将軍", "raw_tagged": "年二十五，{{special:建興|建興}}六年卒。子{{person:諸葛攀|攀}}，官至行{{office:護軍|護軍}}{{office:翊武将軍|翊武將軍}}，亦早卒。{{person:諸葛恪|諸葛恪}}見誅於{{place:江東|吳}}，子孫皆盡，而亮自有冑裔，故{{person:諸葛攀|攀}}還復為{{person:諸葛瑾|瑾}}後。", "kakikudashi_tagged": "年二十五、{{special:建興|建興}}六年に卒す。子の{{person:諸葛攀|攀}}、官は行{{office:護軍|護軍}}・{{office:翊武将軍|翊武将軍}}に至るも、亦た早くに卒す。{{person:諸葛恪|諸葛恪}}、{{place:江東|呉}}に誅せらるるや、子孫皆な尽き、而して亮には自ら冑裔有り、故に{{person:諸葛攀|攀}}は還りて復た{{person:諸葛瑾|瑾}}の後と為る。", "translation_tagged": "二十五歳で、{{special:建興|建興}}六年に没した。子の{{person:諸葛攀|諸葛攀}}は、官は行{{office:護軍|護軍}}・{{office:翊武将軍|翊武将軍}}に至ったが、やはり若くして没した。{{person:諸葛恪|諸葛恪}}が{{place:江東|呉}}で誅殺されると、その子孫はみな絶え果て、いっぽう{{person:諸葛亮|諸葛亮}}には自身の血を引く跡継ぎがいたため、{{person:諸葛攀|諸葛攀}}は帰還して再び{{person:諸葛瑾|諸葛瑾}}の後嗣となった。"}, {"id": "v35_p38_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛瞻）", "para_index": 38, "type": "本文", "raw_text": "瞻字思遠。建興十二年，亮出武功，與瑾書曰：「瞻今已八歲，聰慧可愛，嫌其早成，恐不為重器耳。」年十七，尚公主，拜騎都尉。其明年為羽林中郎將，屢遷射聲校尉、侍中、尚書僕射，加軍師將軍。瞻工書畫，強識念，蜀人追思亮，咸愛其才敏。每朝廷有一善政佳事，雖非瞻所建倡，百姓皆傳相告曰：「葛侯之所為也。」是以美聲溢譽，有過其實。景耀四年，為行都護衛將軍，與輔國大將軍南鄉侯董厥并平尚書事。六年冬，魏征西將軍鄧艾伐蜀，自陰平由景谷道旁入。瞻督諸軍至涪停住，前鋒破，退還，住綿竹。艾遣書誘瞻曰：「若降者，必表為琅邪王。」瞻怒，斬艾使。遂戰，大敗，臨陣死，時年三十七。眾皆離散，艾長驅至成都。瞻長子尚，與瞻俱沒。", "kakikudashi": "瞻、字は思遠。建興十二年、亮、武功に出で、瑾に与うるの書に曰く、「瞻は今已に八歳、聡慧にして愛すべし、其の早成にして、恐らくは重器と為らざらんことを嫌うのみ」と。年十七、公主に尚し、騎都尉に拝せらる。其の明年、羽林中郎将と為り、屢しば射声校尉・侍中・尚書僕射に遷り、軍師将軍を加えらる。瞻は書画に工みにして、識念強く、蜀人は亮を追思し、咸な其の才敏を愛す。朝廷に一善政・佳事有る毎に、瞻の建倡する所に非ずと雖も、百姓は皆な伝え相い告げて曰く、「葛侯の為す所なり」と。是を以て美声・溢誉、其の実に過ぐる有り。景耀四年、行都護・衛将軍と為り、輔国大将軍・南郷侯の董厥と并びに平尚書事たり。六年の冬、魏の征西将軍・鄧艾、蜀を伐ち、陰平より景谷道に由りて旁入す。瞻、諸軍を督して涪に至りて停住するも、前鋒破れ、退き還りて、綿竹に住まる。艾、書を遣わして瞻を誘いて曰く、「若し降らば、必ず表して琅邪王と為さん」と。瞻怒りて、艾の使を斬る。遂に戦い、大敗して、陣に臨みて死す、時に年三十七。衆皆な離散し、艾は長駆して成都に至る。瞻の長子の尚、瞻と倶に没す。", "translation": "諸葛瞻、字は思遠。建興十二年、諸葛亮は武功に出陣した折、諸葛瑾に与えた書簡で、「諸葛瞻はいまやもう八歳になり、聡明で愛らしいのですが、あまりに早熟すぎて、大器にはなれぬのではないかと気がかりなばかりです」と述べた。十七歳のとき、公主を娶り、騎都尉に拝せられた。その翌年に羽林中郎将となり、たびたび昇進して射声校尉・侍中・尚書僕射に遷り、軍師将軍を加えられた。諸葛瞻は書画に巧みで、記憶力に優れており、蜀人は諸葛亮を追慕していたため、みなその才気と機敏さを愛した。朝廷に何か一つでも善政や美事があるたびに、諸葛瞻が発案提唱したものでなくとも、民衆はみな口々に伝え合って、「葛侯のなさったことだ」と言った。そのため美名や過分の称賛が、その内実を上回るほどであった。景耀四年、行都護・衛将軍となり、輔国大将軍・南郷侯の董厥と並んで平尚書事となった。六年の冬、魏の征西将軍・鄧艾が蜀を討ち、陰平から景谷道を通って脇道より侵入した。諸葛瞻は諸軍を統率して涪に至って駐留したが、先鋒が撃破されたため、退却して引き返し、綿竹に陣を据えた。鄧艾は書簡を送って諸葛瞻を誘って言った、「もし降伏するならば、必ず上表して琅邪王としよう」と。諸葛瞻は怒り、鄧艾の使者を斬った。ついに出撃して戦ったが、大敗を喫し、戦陣に臨んで討ち死にした、時に年三十七であった。兵衆はみなちりぢりに潰走し、鄧艾は長駆して成都に至った。諸葛瞻の長子の諸葛尚も、諸葛瞻とともに戦死した。", "persons": "諸葛瞻, 諸葛亮, 諸葛瑾, 董厥, 鄧艾, 諸葛尚", "places": "武功, 南郷, 益州, 陰平, 景谷, 涪, 綿竹, 琅邪, 成都", "era_year": "建興12年（234）〜景耀6年（263）冬", "source_book": "", "keywords": "建興, 公主, 騎都尉, 羽林中郎将, 射声校尉, 侍中, 尚書僕射, 軍師将軍, 景耀, 都護, 衛将軍, 輔国大将軍, 列侯, 平尚書事, 征西将軍, 諸侯王", "raw_tagged": "{{person:諸葛瞻|瞻}}字{{person:諸葛瞻|思遠}}。{{special:建興|建興}}十二年，亮出{{place:武功|武功}}，與{{person:諸葛瑾|瑾}}書曰：「{{person:諸葛瞻|瞻}}今已八歲，聰慧可愛，嫌其早成，恐不為重器耳。」年十七，尚{{office:公主|公主}}，拜{{office:騎都尉|騎都尉}}。其明年為{{office:羽林中郎将|羽林中郎將}}，屢遷{{office:射声校尉|射聲校尉}}、{{office:侍中|侍中}}、{{office:尚書僕射|尚書僕射}}，加{{office:軍師将軍|軍師將軍}}。{{person:諸葛瞻|瞻}}工書畫，強識念，蜀人追思亮，咸愛其才敏。每朝廷有一善政佳事，雖非{{person:諸葛瞻|瞻}}所建倡，百姓皆傳相告曰：「{{person:諸葛瞻|葛侯}}之所為也。」是以美聲溢譽，有過其實。{{special:景耀|景耀}}四年，為{{office:都護|行都護}}{{office:衛将軍|衛將軍}}，與{{office:輔国大将軍|輔國大將軍}}{{place:南郷|南鄉}}{{office:列侯|侯}}{{person:董厥|董厥}}并{{office:平尚書事|平尚書事}}。六年冬，魏{{office:征西将軍|征西將軍}}{{person:鄧艾|鄧艾}}伐蜀，自{{place:陰平|陰平}}由{{place:景谷|景谷道}}旁入。{{person:諸葛瞻|瞻}}督諸軍至{{place:涪|涪}}停住，前鋒破，退還，住{{place:綿竹|綿竹}}。{{person:鄧艾|艾}}遣書誘{{person:諸葛瞻|瞻}}曰：「若降者，必表為{{place:琅邪|琅邪}}{{office:諸侯王|王}}。」{{person:諸葛瞻|瞻}}怒，斬{{person:鄧艾|艾}}使。遂戰，大敗，臨陣死，時年三十七。眾皆離散，{{person:鄧艾|艾}}長驅至{{place:成都|成都}}。{{person:諸葛瞻|瞻}}長子{{person:諸葛尚|尚}}，與{{person:諸葛瞻|瞻}}俱沒。", "kakikudashi_tagged": "{{person:諸葛瞻|瞻}}、字は{{person:諸葛瞻|思遠}}。{{special:建興|建興}}十二年、亮、{{place:武功|武功}}に出で、{{person:諸葛瑾|瑾}}に与うるの書に曰く、「{{person:諸葛瞻|瞻}}は今已に八歳、聡慧にして愛すべし、其の早成にして、恐らくは重器と為らざらんことを嫌うのみ」と。年十七、{{office:公主|公主}}に尚し、{{office:騎都尉|騎都尉}}に拝せらる。其の明年、{{office:羽林中郎将|羽林中郎将}}と為り、屢しば{{office:射声校尉|射声校尉}}・{{office:侍中|侍中}}・{{office:尚書僕射|尚 い、同じく{{place:義陽|義陽}}の人である。{{person:樊建|樊建}}は字を{{person:樊建|長元}}という。"}, {"id": "v35_p39_3", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（董厥）", "para_index": 39, "type": "本文", "raw_text": "延熙十四年，以校尉使吳，值孫權病篤，不自見建。權問諸葛恪曰：「樊建何如宗預也？」恪對曰：「才識不及預，而雅性過之。」後為侍中，守中書令。自瞻、厥、建統事，姜維常征伐在外，宦人黃皓竊弄機柄，咸共將護，無能匡矯，", "kakikudashi": "延熙十四年、校尉を以て呉に使いするに、孫権の病篤きに値い、自ら建を見ず。権、諸葛恪に問いて曰く、「樊建は宗預に何如ぞや？」と。恪対えて曰く、「才識は預に及ばざれども、雅性は之に過ぐ」と。後に侍中と為り、中書令に守たり。瞻・厥・建の事を統べてより、姜維は常に外に征伐し、宦人の黄皓、機柄を窃弄すれども、咸な共に将護して、能く匡矯する無し、", "translation": "延熙十四年、校尉として呉へ使いしたが、おりしも孫権が重病の床にあったため、親しく樊建に引見することができなかった。孫権が諸葛恪に尋ねて、「樊建は宗預と比べてどうか？」と言うと、諸葛恪は答えて、「才能と見識は宗預に及びませんが、端正で高雅な気質はそれに勝っております」と言った。のちに侍中となり、中書令を仮に務めた。諸葛瞻・董厥・樊建が国政を統括するようになって以降、姜維はつねに外にあって征伐を続け、宦官の黄皓が枢機の権柄をほしいままにしたが、みな互いに庇い合って、誰ひとりこれを正すことができなかったが、", "persons": "樊建, 孫権, 諸葛恪, 宗預, 諸葛瞻, 董厥, 姜維, 黄皓", "places": "江東", "era_year": "延熙14年（251）〜景耀年間（258〜263）", "source_book": "", "keywords": "延熙, 校尉, 侍中, 中書令", "raw_tagged": "{{special:延熙|延熙}}十四年，以{{office:校尉|校尉}}使{{place:江東|吳}}，值{{person:孫権|孫權}}病篤，不自見{{person:樊建|建}}。{{person:孫権|權}}問{{person:諸葛恪|諸葛恪}}曰：「{{person:樊建|樊建}}何如{{person:宗預|宗預}}也？」{{person:諸葛恪|恪}}對曰：「才識不及{{person:宗預|預}}，而雅性過之。」後為{{office:侍中|侍中}}，守{{office:中書令|中書令}}。自{{person:諸葛瞻|瞻}}、{{person:董厥|厥}}、{{person:樊建|建}}統事，{{person:姜維|姜維}}常征伐在外，宦人{{person:黄皓|黃皓}}竊弄機柄，咸共將護，無能匡矯，", "kakikudashi_tagged": "{{special:延熙|延熙}}十四年、{{office:校尉|校尉}}を以て{{place:江東|呉}}に使いするに、{{person:孫権|孫権}}の病篤きに値い、自ら{{person:樊建|建}}を見ず。{{person:孫権|権}}、{{person:諸葛恪|諸葛恪}}に問いて曰く、「{{person:樊建|樊建}}は{{person:宗預|宗預}}に何如ぞや？」と。{{person:諸葛恪|恪}}対えて曰く、「才識は{{person:宗預|預}}に及ばざれども、雅性は之に過ぐ」と。後に{{office:侍中|侍中}}と為り、{{office:中書令|中書令}}に守たり。{{person:諸葛瞻|瞻}}・{{person:董厥|厥}}・{{person:樊建|建}}の事を統べてより、{{person:姜維|姜維}}は常に外に征伐し、宦人の{{person:黄皓|黄皓}}、機柄を窃弄すれども、咸な共に将護して、能く匡矯する無し、", "translation_tagged": "{{special:延熙|延熙}}十四年、{{office:校尉|校尉}}として{{place:江東|呉}}へ使いしたが、おりしも{{person:孫権|孫権}}が重病の床にあったため、親しく{{person:樊建|樊建}}に引見することができなかった。{{person:孫権|孫権}}が{{person:諸葛恪|諸葛恪}}に尋ねて、「{{person:樊建|樊建}}は{{person:宗預|宗預}}と比べてどうか？」と言うと、{{person:諸葛恪|諸葛恪}}は答えて、「 , "type": "裴注", "raw_text": "《漢晉春秋》曰：樊建為給事中，晉武帝問諸葛亮之治國，建對曰：「聞惡必改，而不矜過，賞罰之信，足感神明。」帝曰：「善哉！使我得此人以自輔，豈有今日之勞乎！」建稽首曰：「臣竊聞天下之論，皆謂鄧艾見枉，陛下知而不理，此豈馮唐之所謂『雖得頗、牧而不能用』者乎！」帝笑曰：「吾方欲明之，卿言起我意。」於是發詔治艾焉。", "kakikudashi": "『漢晋春秋』に曰く、樊建、給事中と為るや、晋の武帝、諸葛亮の治国を問う、建対えて曰く、「悪を聞けば必ず改め、而して過ちを矜らず、賞罰の信なること、神明を感ぜしむるに足れり」と。帝曰く、「善きかな！我をして此の人を得て以て自ら輔けしめば、豈に今日の労有らんや！」と。建、稽首して曰く、「臣、窃かに天下の論を聞くに、皆な鄧艾は枉げらるるも、陛下知りて理めずと謂えり、此れ豈に馮唐の謂わゆる『頗・牧を得と雖も而も用うること能わざる』者ならんや！」と。帝笑いて曰く、「吾、方に之を明らかにせんと欲せしに、卿の言、我が意を起こせり」と。是に於いて詔を発して艾を治む、と。", "translation": "『漢晋春秋』にいう、樊建が給事中となった折、晋の武帝が諸葛亮の治国について尋ねると、樊建は答えて、「悪しき点を聞けば必ず改め、決して過ちを取り繕うことなく、賞罰に信義が貫かれていたことは、神明をも感動させるに足るものでございました」と申し上げた。帝は言った、「なんと素晴らしいことか！もし私がこの人物を得て自らを補佐させることができていたなら、どうして今日のような労苦があったであろうか！」と。樊建は稽首して申し上げた、「臣がひそかに天下の議論を聞き及びますところでは、みな鄧艾が無実の罪を被りながら、陛下はそのことをご承知でありながら正しておられないと申しております、これではまさに馮唐のいわゆる『頗・牧を得ても用いることができない』というものではございませんでしょうか！」と。帝は笑って、「私はちょうどその件を明らかにしようと思っていたところであったが、卿の言葉が私の気持ちを奮い起こしてくれた」と言った。ここにおいて詔を発して鄧艾の冤罪を正した、と。", "persons": "樊建, 司馬炎, 諸葛亮, 鄧艾, 馮唐, 廉頗, 李牧", "places": "", "era_year": "泰始9年（273）頃", "source_book": "『漢晋春秋』", "keywords": "漢晉春秋, 給事中", "raw_tagged": "《{{special:漢晉春秋|漢晉春秋}}》曰：{{person:樊建|樊建}}為{{office:給事中|給事中}}，{{person:司馬炎|晉武帝}}問{{person:諸葛亮|諸葛亮}}之治國，{{person:樊建|建}}對曰：「聞惡必改，而不矜過，賞罰之信，足感神明。」{{person:司馬炎|帝}}曰：「善哉！使我得此人以自輔，豈有今日之勞乎！」{{person:樊建|建}}稽首曰：「臣竊聞天下之論，皆謂{{person:鄧艾|鄧艾}}見枉，{{person:司馬炎|陛下}}知而不理，此豈{{person:馮唐|馮唐}}之所謂『雖得{{person:廉頗|頗}}{{person:李牧|、牧}}而不能用』者乎！」{{person:司馬炎|帝}}笑曰：「吾方欲明之，卿言起我意。」於是發詔治{{person:鄧艾|艾}}焉。", "kakikudashi_tagged": "『{{special:漢晉春秋|漢晋春秋}}』に曰く、{{person:樊建|樊建}}、{{office:給事中|給事中}}と為るや、{{person:司馬炎|晋の武帝}}、{{person:諸葛亮|諸葛亮}}の治国を問う、{{person:樊建|建}}対えて曰く、「悪を聞けば必ず改め、而して過ちを矜らず、賞罰の信なること、神明を感ぜしむるに足れり」と。{{person:司馬炎|帝}}曰く、「善きかな！我をして此の人を得て以て自ら輔けしめば、豈に今日の労有らんや！」と。{{person:樊建|建}}、稽首して曰く、「臣、窃かに天下の論を聞くに、皆な{{person:鄧艾|鄧艾}}は枉げらるるも、{{person:司馬炎|陛下}}知りて理めずと謂えり、此れ豈に{{person:馮唐|馮唐}}の謂わゆる『{{person:廉頗|頗}}{{person:李牧|・牧}}を得と雖も而も用うること能わざる』者ならんや！」と。{{person:司馬炎|帝}}笑いて曰く、「吾、方に之を明らかにせんと欲せしに、卿の言、我が意を起こせり」と。是に於いて詔を発して{{person:鄧艾|艾}}を治む、と。", "translation_tagged": "『{{special:漢晉春秋|漢晋春秋}}』にいう、{{person:樊建|樊建}}が{{office:給事中|給事中}}となった折、{{person:司馬炎|晋の武帝}}が{{person:諸葛亮|諸葛亮}}の治国について尋ねると、{{person:樊建|樊建}}は答えて、「悪しき点を聞けば必ず改め、決して過ちを取り繕うことなく、賞罰に信義が貫かれていたことは、神明をも感動させるに足るものでございました」と申し上げた。{{person:司馬炎|帝}}は言った、「なんと素晴らしいことか！もし私がこの人物を得て自らを補佐させることができていたなら、どうして今日のような労苦があったであろうか！」と。{{person:樊建|樊建}}は稽首して申し上げた、「臣がひそかに天下の議論を聞き及びますところでは、みな{{person:鄧艾|鄧艾}}が無実の罪を被りながら、{{person:司馬炎|陛下}}はそのことをご承知でありながら正しておられないと申しております、これではまさに{{person:馮唐|馮唐}}のいわゆる『{{person:廉頗|頗}}{{person:李牧|・牧}}を得ても用いることができない』というものではございませんでしょうか！」と。{{person:司馬炎|帝}}は笑って、「私はちょうどその件を明らかにしようと思っていたところであったが、卿の言葉が私の気持ちを奮い起こしてくれた」と言った。ここにおいて詔を発して{{person:鄧艾|鄧艾}}の冤罪を正した、と。"}, {"id": "v35_p40_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（評）", "para_index": 40, "type": "本文", "raw_text": "評曰：諸葛亮之為相國也，撫百姓，示儀軌，約官職，從權制，開誠心，布公道；盡忠益時者雖讎必賞，犯法怠慢者雖親必罰，服罪輸情者雖重必釋，游辭巧飾者雖輕必戮；善無微而不賞，惡無纖而不貶；庶事精練，物理其本，循名責實，虛偽不齒；終於邦域之內，咸畏而愛之，刑政雖峻而無怨者，以其用心平而勸戒明也。可謂識治之良才，管、蕭之亞匹矣。然連年動眾，未能成功，蓋應變將略，非其所長歟！", "kakikudashi": "評に曰く、諸葛亮の相国と為るや、百姓を撫し、儀軌を示し、官職を約し、権制に従い、誠心を開き、公道を布く。忠を尽くし時を益する者は讎と雖も必ず賞し、法を犯し怠慢なる者は親と雖も必ず罰し、罪に服し情を輸す者は重しと雖も必ず釈し、游辞巧飾する者は軽しと雖も必ず戮す。善は微として賞せざる無く、悪は繊として貶せざる無し。庶事に精練し、物は其の本を理め、名に循いて実を責め、虚偽は歯せず。終に邦域の内、咸な畏れて之を愛し、刑政は峻なりと雖も怨む者無きは、其の心を用うること平らかにして勧戒の明らかなるを以てなり。治を識るの良才、管・蕭の亜匹と謂うべし。然れども連年衆を動かし、未だ功を成す能わざりしは、蓋し応変の将略は、其の長ずる所に非ざりしか！", "translation": "評にいう、諸葛亮が相国となるや、万民を慈しみ撫で、礼儀法度を示し、官職を簡素に引き締め、臨機の制宜に従い、誠心を開き、公正な道を敷いた。忠節を尽くして時世に有益な者は仇敵であっても必ず賞し、法を犯して職務を怠る者は親近の者であっても必ず罰し、罪に服して真情を打ち明ける者は重罪であっても必ず赦免し、言葉を飾って巧みに言い逃れる者は軽罪であっても必ず処断した。善行はどれほど些細なものでも賞さぬことはなく、悪事はどれほど僅かなものでも退けぬことはなかった。諸々の政務に精通し熟練して、物事はその根本から筋道を立てて治め、名目に照らして実質を厳しく求め、虚偽の振る舞いは決して相手にせず退けた。かくてついには領内のすべての人々が、みな彼を畏敬しつつ慕い愛し、刑政が厳格でありながら誰ひとり怨む者がなかったのは、その心の用い方が公平で勧善懲悪が明白であったからである。まことに治国の要諦をわきまえた良才であり、管仲・蕭何に次ぐ好一対の人物というべきである。さりながら連年にわたり軍衆を動かしながら、ついに成功を収めることができなかったのは、思うに臨機応変の将略は、その得意とするところではなかったからであろうか！", "persons": "諸葛亮, 管仲, 蕭何", "places": "", "era_year": "", "source_book": "", "keywords": "相国", "raw_tagged": "評曰：{{person:諸葛亮|諸葛亮}}之為{{office:相国|相國}}也，撫百姓，示儀軌，約官職，從權制，開誠心，布公道；盡忠益時者雖讎必賞，犯法怠慢者雖親必罰，服罪輸情者雖重必釋，游辭巧飾者雖輕必戮；善無微而不賞，惡無纖而不貶；庶事精練，物理其本，循名責實，虛偽不齒；終於邦域之內，咸畏而愛之，刑政雖峻而無怨者，以其用心平而勸戒明也。可謂識治之良才，{{person:管仲|管}}{{person:蕭何|、蕭}}之亞匹矣。然連年動眾，未能成功，蓋應變將略，非其所長歟！", "kakikudashi_tagged": "評に曰く、{{person:諸葛亮|諸葛亮}}の{{office:相国|相国}}と為るや、百姓を撫し、儀軌を示し、官職を約し、権制に従い、誠心を開き、公道を布く。忠を尽くし時を益する者は讎と雖も必ず賞し、法を犯し怠慢なる者は親と雖も必ず罰し、罪に服し情を輸す者は重しと雖も必ず釈し、游辞巧飾する者は軽しと雖も必ず戮す。善は微として賞せざる無く、悪は繊として貶せざる無し。庶事に精練し、物は其の本を理め、名に循いて実を責め、虚偽は歯せず。終に邦域の内、咸な畏れて之を愛し、刑政は峻なりと雖も怨む者無きは、其の心を用うること平らかにして勧戒の明らかなるを以てなり。治を識るの良才、{{person:管仲|管}}{{person:蕭何|・蕭}}の亜匹と謂うべし。然れども連年衆を動かし、未だ功を成す能わざりしは、蓋し応変の将略は、其の長ずる所に非ざりしか！", "translation_tagged": "評にいう、{{person:諸葛亮|諸葛亮}}が{{office:相国|相国}}となるや、万民を慈しみ撫で、礼儀法度を示し、官職を簡素に引き締め、臨機の制宜に従い、誠心を開き、公正な道を敷いた。忠節を尽くして時世に有益な者は仇敵であっても必ず賞し、法を犯して職務を怠る者は親近の者であっても必ず罰し、罪に服して真情を打ち明ける者は重罪であっても必ず赦免し、言葉を飾って巧みに言い逃れる者は軽罪であっても必ず処断した。善行はどれほど些細なものでも賞さぬことはなく、悪事はどれほど僅かなものでも退けぬことはなかった。諸々の政務に精通し熟練して、物事はその根本から筋道を立てて治め、名目に照らして実質を厳しく求め、虚偽の振る舞いは決して相手にせず退けた。かくてついには領内のすべての人々が、みな彼を畏敬しつつ慕い愛し、刑政が厳格でありながら誰ひとり怨む者がなかったのは、その心の用い方が公平で勧善懲悪が明白であったからである。まことに治国の要諦をわきまえた良才であり、{{person:管仲|管仲}}・{{person:蕭何|蕭何}}に次ぐ好一対の人物というべきである。さりながら連年にわたり軍衆を動かしながら、ついに成功を収めることができなかったのは、思うに臨機応変の将略は、その得意とするところではなかったからであろうか！"}, {"id": "v35_p41_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（評）", "para_index": 41, "type": "裴注", "raw_text": "《袁子》曰：或問諸葛亮何如人也，袁子曰：張飛、關羽與劉備俱起，爪牙腹心之臣，而武人也。晚得諸葛亮，因以為佐相，而群臣悅服，劉備足信、亮足重故也。及其受六尺之孤，攝一國之政，事凡庸之君，專權而不失禮，行君事而國人不疑，如此即以為君臣百姓之心欣戴之矣。行法嚴而國人悅服，用民盡其力而下不怨。及其兵出入如賓，行不寇，芻蕘者不獵，如在國中。其用兵也，止如山，進退如風，兵出之日，天下震動，而人心不憂。亮死至今數十年，國人歌思，如周人之思召公也，孔子曰「雍也可使南面」，諸葛亮有焉。又問諸葛亮始出隴右，南安、天水、安定三郡人反應之，若亮速進，則三郡非中國之有也，而亮徐行不進；既而官兵上隴，三郡復，亮無尺寸之功，失此機，何也？袁子曰：蜀兵輕銳，良將少，亮始出，未知中國彊弱，是以疑而嘗之；且大會者不求近功，所以不進也。曰：何以知其疑也？袁子曰：初出遲重，屯營重複，後轉降未進兵欲戰，亮勇而能鬥，三郡反而不速應，此其疑徵也。曰：何以知其勇而能鬥也？袁子曰：亮之在街亭也，前軍大破，亮屯去數里，不救；官兵相接，又徐行，此其勇也。亮之行軍，安靜而堅重；安靜則易動，堅重則可以進退。亮法令明，賞罰信，士卒用命，赴險而不顧，此所以能鬥也。曰：亮率數萬之眾，其所興造，若數十萬之功，是其奇者也。所至營壘、井竈、圊溷、籓籬、障塞皆應繩墨，一月之行，去之如始至，勞費而徒為飾好，何也？袁子曰：蜀人輕脫，亮故堅用之。曰：何以知其然也？袁子曰：亮治實而不治名，志大而所欲遠，非求近速者也。曰：亮好治官府、次舍、橋梁、道路，此非急務，何也？袁子曰：小國賢才少，故欲其尊嚴也。亮之治蜀，田疇辟，倉廩實，器械利，蓄積饒，朝會不華，路無醉人。夫本立故末治，有餘力而後及小事，此所以勸其功也。曰：子之論諸葛亮，則有證也。以亮之才而少其功，何也？袁子曰：亮，持本者也，其於應變，則非所長也，故不敢用其短。曰：然則吾子美之，何也？袁子曰：此固賢者之遠矣，安可以備體責也。夫能知所短而不用，此賢者之大也；知所短則知所長矣。夫前識與言而不中，亮之所不用也，此吾之所謂可也。吳大鴻臚張儼作默記，其述佐篇論亮與司馬宣王書曰：漢朝傾覆，天下崩壞，豪傑之士，競希神器。魏氏跨中土，劉氏據益州，並稱兵海內，為世霸主。諸葛、司馬二相，遭值際會，託身明主，或收功於蜀、漢，或冊名於伊、洛。丕、備既沒，後嗣繼統，各受保阿之任，輔翼幼主，不負然諾之誠，亦一國之宗臣，霸王之賢佐也。歷前世以觀近事，二相優劣，可得而詳也。孔明起巴、蜀之地，蹈一州之土，方之大國，其戰士人民，蓋有九分之一也，而以貢贄大吳，抗對北敵，至使耕戰有伍，刑法整齊，提步卒數萬，長驅祁山，慨然有飲馬河、洛之志。仲達據天下十倍之地，仗兼并之眾，據牢城，擁精銳，無禽敵之意，務自保全而已，使彼孔明自來自去。若此人不亡，終其志意，連年運思，刻日興謀，則涼、雍不解甲，中國不釋鞍，勝負之勢，亦已決矣。昔子產治鄭，諸侯不敢加兵，蜀相其近之矣。方之司馬，不亦優乎！或曰，兵者兇器，戰者危事也，有國者不務保安境內，綏靜百姓，而好開闢土地，征伐天下，未為得計也。諸葛丞相誠有匡佐之才，然處孤絕之地，戰士不滿五萬，自可閉關守險，君臣無事。空勞師旅，無歲不征，未能進咫尺之地，開帝王之基，而使國內受其荒殘，西土苦其役調。魏司馬懿才用兵眾，未易可輕，量敵而進，兵家所慎；若丞相必有以策之，則未見坦然之勳，若無策以裁之，則非明哲之謂，海內歸向之意也，余竊疑焉，請聞其說。答曰：蓋聞湯以七十里、文王以百里之地而有天下，皆用征伐而定之。揖讓而登王位者，惟舜、禹而已。今蜀、魏為敵戰之國，勢不俱王，自操、備時，彊弱縣殊，而備猶出兵陽平，禽夏侯淵。羽圍襄陽，將降曹仁，生獲于禁，當時北邊大小憂懼，孟德身出南陽，樂進、徐晃等為救，圍不即解，故蔣子通言彼時有徙許渡河之計，會國家襲取南郡，羽乃解軍。玄德與操，智力多少，士眾眾寡，用兵行軍之道，不可同年而語，猶能暫以取勝，是時又無大吳掎角之勢也。今仲達之才，減於孔明，當時之勢，異於曩日，玄德尚與抗衡，孔明何以不可出軍而圖敵邪？昔樂毅以弱燕之眾，兼從五國之兵，長驅彊齊，下七十餘城。今蜀漢之卒，不少燕軍，君臣之接，信於樂毅，加以國家為脣齒之援，東西相應，首尾如蛇，形勢重大，不比於五國之兵也，何憚於彼而不可哉？夫兵以奇勝，制敵以智，土地廣狹，人馬多少，未可偏恃也。余觀彼治國之體，當時既肅整，遺教在後，及其辭意懇切，陳進取之圖，忠謀謇謇，義形於主，雖古之管、晏，何以加之乎？", "kakikudashi": "『袁子』に曰く、或るひと諸葛亮は何如なる人ぞやと問うに、袁子曰く、張飛・関羽は劉備と倶に起こり、爪牙・腹心の臣なれども、武人なり。晩に諸葛亮を得て、因りて以て佐相と為すに、群臣悦服せしは、劉備は信ずるに足り、亮は重んずるに足るが故なり。其の六尺の孤を受け、一国の政を摂し、凡庸の君に事うるに及び、権を専らにして礼を失わず、君事を行いて国人疑わず、此くの如きは即ち以て君臣・百姓の心、之を欣戴せりと為す。法を行うこと厳にして国人悦服し、民を用うること其の力を尽くさしめて下怨まず。其の兵の出入するに及びては賓の如く、行くゆく寇せず、芻蕘する者も猟せずして、国中に在るが如し。其の兵を用うるや、止まること山の如く、進退すること風の如く、兵出づるの日、天下震動すれども、人心は憂えず。亮の死して今に至るまで数十年、国人の歌思すること、周人の召公を思うが如きなり、孔子曰く「雍や南面せしむべし」と、諸葛亮に焉れ有り。又た問う、諸葛亮の始めて隴右に出づるや、南安・天水・安定の三郡の人、反して之に応じ、若し亮速やかに進まば、則ち三郡は中国の有に非ざりしならんに、亮は徐行して進まず、既にして官兵、隴に上り、三郡復し、亮は尺寸の功無くして、此の機を失いしは、何ぞや？袁子曰く、蜀兵は軽鋭にして、良将少なく、亮は始めて出で、未だ中国の強弱を知らず、是を以て疑いて之を嘗む、且つ大会する者は近功を求めず、進まざりし所以なり。曰く、何を以て其の疑えるを知るや？袁子曰く、初め出づるや遅重にして、屯営は重複し、後に転じて降るも未だ兵を進めて戦わんと欲せず、亮は勇にして能く闘うに、三郡反すれども速やかには応ぜず、此れ其の疑えるの徴なり。曰く、何を以て其の勇にして能く闘うを知るや？袁子曰く、亮の街亭に在るや、前軍大いに破れ、亮の屯は去ること数里なれども、救わず、官兵相い接するも、又た徐行す、此れ其の勇なり。亮の軍を行うや、安静にして堅重なり、安静なれば則ち動かし易く、堅重なれば則ち以て進退すべし。亮は法令明らかに、賞罰信あり、士卒は命を用い、険に赴きて顧みず、此れ能く闘う所以なり。曰く、亮は数万の衆を率い、其の興造する所、数十万の功の若きは、是れ其の奇なる者なり。至る所の営塁・井竈・圊溷・籓籬・障塞は皆な縄墨に応じ、一月の行も、之を去るとき始めて至りしが如きは、労費して徒らに飾好を為せるか、何ぞや？袁子曰く、蜀人は軽脱なり、亮は故に堅く之を用いしなり。曰く、何を以て其の然るを知るや？袁子曰く、亮は実を治めて名を治めず、志大にして欲する所遠く、近速を求むる者に非ざるなり。曰く、亮は好みて官府・次舎・橋梁・道路を治む、此れ急務に非ざるに、何ぞや？袁子曰く、小国には賢才少なし、故に其の尊厳ならんことを欲せしなり。亮の蜀を治むるや、田疇は辟け、倉廩は実ち、器械は利く、蓄積は饒かに、朝会は華ならず、路に酔人無し。夫れ本立つが故に末治まり、余力有りて然る後に小事に及ぶ、此れ其の功を勧むる所以なり。曰く、子の諸葛亮を論ずるや、則ち証有り。亮の才を以てして其の功少なきは、何ぞや？袁子曰く、亮は、本を持する者なり、其の応変に於けるは、則ち長ずる所に非ざるなり、故に敢えて其の短を用いず。曰く、然らば則ち吾子の之を美とするは、何ぞや？袁子曰く、此れ固より賢者の遠きなり、安んぞ備体を以て責むべけんや。夫れ能く短なる所を知りて用いざるは、此れ賢者の大なるなり、短なる所を知れば則ち長ずる所を知る。夫れ前識と言いて中らざるとは、亮の用いざる所なり、此れ吾の謂わゆる可なるなり。呉の大鴻臚・張儼、『黙記』を作り、其の「述佐篇」に亮と司馬宣王とを論ずる書に曰く、漢朝傾覆し、天下崩壊し、豪傑の士、競いて神器を希う。魏氏は中土に跨り、劉氏は益州に拠り、並びに兵を海内に称し、世の覇主と為る。諸葛・司馬の二相は、際会に遭値し、身を明主に託し、或いは功を蜀・漢に収め、或いは名を伊・洛に冊す。丕・備既に没し、後嗣統を継ぐや、各おの保阿の任を受け、幼主を輔翼し、然諾の誠に負かず、亦た一国の宗臣、覇王の賢佐なり。前世を歴て以て近事を観れば、二相の優劣、得て詳らかにすべきなり。孔明は巴・蜀の地に起こり、一州の土を蹈み、之を大国に方ぶれば、其の戦士・人民は、蓋し九分の一有るのみなるも、以て大呉に貢贄し、北敵に抗対し、耕戦をして伍有り、刑法をして整斉ならしむるに至り、歩卒数万を提げ、祁山に長駆し、慨然として馬に河・洛に飲かわんとするの志有り。仲達は天下十倍の地に拠り、兼并の衆に仗り、牢城に拠り、精鋭を擁しながら、敵を禽にするの意無く、務めて自ら保全するのみにして、彼の孔明をして自ら来たり自ら去らしむ。若し此の人亡ぜず、其の志意を終え、連年思いを運らし、日を刻して謀を興さば、則ち涼・雍は甲を解かず、中国は鞍を釈かずして、勝負の勢いは、亦た已に決せしならん。昔、子産は鄭を治め、諸侯敢えて兵を加えず、蜀の相は其れ之に近し。之を司馬に方ぶれば、亦た優ならずや！或るひと曰く、兵なる者は凶器、戦なる者は危事なり、国を有つ者、境内を保安し、百姓を綏静するを務めずして、好みて土地を開闢し、天下を征伐するは、未だ計を得たりと為さざるなり。諸葛丞相には誠に匡佐の才有れども、然れども孤絶の地に処り、戦士は五万に満たざれば、自ら関を閉じ険を守りて、君臣無事なるべし。空しく師旅を労し、歳として征せざるは無く、未だ咫尺の地を進め、帝王の基を開く能わずして、国内をして其の荒残を受けしめ、西土をして其の役調に苦しましむ。魏の司馬懿は才用・兵衆ありて、未だ容易く軽んずべからず、敵を量りて進むは、兵家の慎む所なり、若し丞相に必ず以て之を策する有らば、則ち未だ坦然の勲を見ず、若し策の以て之を裁する無くんば、則ち明哲の謂い、海内帰向の意に非ざるなり、余は窃かに焉れを疑う、請う其の説を聞かん、と。答えて曰く、蓋し聞く、湯は七十里を以てし、文王は百里の地を以てして天下を有ちしは、皆な征伐を用いて之を定めしなり、と。揖譲して王位に登りし者は、惟だ舜・禹のみ。今、蜀・魏は敵戦の国と為り、勢い倶には王たらず、操・備の時より、強弱は県殊なれども、備は猶お兵を陽平に出だして、夏侯淵を禽にせり。羽は襄陽を囲み、将に曹仁を降さんとし、于禁を生獲すれば、当時北辺の大小憂懼し、孟徳は身ら南陽に出で、楽進・徐晃等救いを為せども、囲みは即ちには解けず、故に蔣子通は彼の時に許を徙し河を渡るの計有りと言い、会たま国家、南郡を襲い取れば、羽は乃ち軍を解けり。玄徳と操とは、智力の多少、士衆の衆寡、用兵・行軍の道、年を同じくして語るべからざるも、猶お能く暫く以て勝ちを取れり、是の時又た大呉の掎角の勢い無かりしなり。今、仲達の才は、孔明より減じ、当時の勢いは、曩日に異なるに、玄徳すら尚お与に抗衡せしに、孔明は何を以てか軍を出だして敵を図るべからざらんや？昔、楽毅は弱燕の衆を以て、五国の兵を兼 n:諸葛亮|亮}}勇而能鬥，三郡反而不速應，此其疑徵也。曰：何以知其勇而能鬥也？{{special:袁子|袁子}}曰：{{person:諸葛亮|亮}}之在{{place:街亭|街亭}}也，前軍大破，{{person:諸葛亮|亮}}屯去數里，不救；官兵相接，又徐行，此其勇也。{{person:諸葛亮|亮}}之行軍，安靜而堅重；安靜則易動，堅重則可以進退。{{person:諸葛亮|亮}}法令明，賞罰信，士卒用命，赴險而不顧，此所以能鬥也。曰：{{person:諸葛亮|亮}}率數萬之眾，其所興造，若數十萬之功，是其奇者也。所至營壘、井竈、圊溷、籓籬、障塞皆應繩墨，一月之行，去之如始至，勞費而徒為飾好，何也？{{special:袁子|袁子}}曰：蜀人輕脫，{{person:諸葛亮|亮}}故堅用之。曰：何以知其然也？{{special:袁子|袁子}}曰：{{person:諸葛亮|亮}}治實而不治名，志大而所欲遠，非求近速者也。曰：{{person:諸葛亮|亮}}好治官府、次舍、橋梁、道路，此非急務，何也？{{special:袁子|袁子}}曰：小國賢才少，故欲其尊嚴也。{{person:諸葛亮|亮}}之治{{place:益州|蜀}}，田疇辟，倉廩實，器械利，蓄積饒，朝會不華，路無醉人。夫本立故末治，有餘力而後及小事，此所以勸其功也。曰：子之論{{person:諸葛亮|諸葛亮}}，則有證也。以{{person:諸葛亮|亮}}之才而少其功，何也？{{special:袁子|袁子}}曰：{{person:諸葛亮|亮}}，持本者也，其於應變，則非所長也，故不敢用其短。曰：然則吾子美之，何也？{{special:袁子|袁子}}曰：此固賢者之遠矣，安可以備體責也。夫能知所短而不用，此賢者之大也；知所短則知所長矣。夫前識與言而不中，{{person:諸葛亮|亮}}之所不用也，此吾之所謂可也。{{place:江東|吳}}{{office:大鴻臚|大鴻臚}}{{person:張儼|張儼}}作{{special:黙記|默記}}，其述佐篇論{{person:諸葛亮|亮}}與{{person:司馬懿|司馬宣王}}書曰：漢朝傾覆，天下崩壞，豪傑之士，競希神器。魏氏跨{{place:中原|中土}}，劉氏據{{place:益州|益州}}，並稱兵{{special:海内|海內}}，為世霸主。{{person:諸葛亮|諸葛}}{{person:司馬懿|、司馬}}二相，遭值際會，託身明主，或收功於{{place:益州|蜀}}{{place:漢中|、漢}}，或冊名於{{place:伊水|伊}}{{place:洛水|、洛}}。{{person:曹丕|丕}}{{person:劉備|、備}}既沒，後嗣繼統，各受保阿之任，輔翼幼主，不負然諾之誠，亦一國之宗臣，霸王之賢佐也。歷前世以觀近事，二相優劣，可得而詳也。{{person:諸葛亮|孔明}}起{{place:巴|巴}}、{{place:益州|蜀}}之地，蹈一州之土，方之大國，其戰士人民，蓋有九分之一也，而以貢贄{{place:江東|大吳}}，抗對北敵，至使耕戰有伍，刑法整齊，提步卒數萬，長驅{{place:祁山_涼州|祁山}}，慨然有飲馬{{place:黄河|河}}{{place:洛水|、洛}}之志。{{person:司馬懿|仲達}}據天下十倍之地，仗兼并之眾，據牢城，擁精銳，無禽敵之意，務自保全而已，使彼{{person:諸葛亮|孔明}}自來自去。若此人不亡，終其志意，連年運思，刻日興謀，則{{place:涼州|涼}}{{place:雍州|、雍}}不解甲，{{place:中原|中國}}不釋鞍，勝負之勢，亦已決矣。昔{{person:公孫僑|子產}}治{{place:鄭|鄭}}，{{office:諸侯|諸侯}}不敢加兵，{{place:益州|蜀}}{{office:相|相}}其近之矣。方之{{office:司馬|司馬}}，不亦優乎！或曰，兵者兇器，戰者危事也，有國者不務保安境內，綏靜百姓，而好開闢土地，征伐天下，未為得計也。{{person:諸葛亮|諸葛}}{{office:丞相|丞相}}誠有匡佐之才，然處孤絕之地，戰士不滿五萬，自可閉關守險，君臣無事。空勞師旅，無歲不征，未能進咫尺之地，開帝王之基，而使國內受其荒殘，{{place:益州|西土}}苦其役調。魏{{person:司馬懿|司馬懿}}才用兵眾，未易可輕，量敵而進，兵家所慎；若{{office:丞相|丞相}}必有以策之，則未見坦然之勳，若無策以裁之，則非明哲之謂，{{special:海内|海內}}歸向之意也，余竊疑焉，請聞其說。答曰：蓋聞{{person:湯王|湯}}以七十里、{{person:文王|文王}}以百里之地而有天下，皆用征伐而定之。揖讓而登王位者，惟{{person:虞舜|舜}}{{person:禹|、禹}}而已。今{{place:益州|蜀}}、魏為敵戰之國，勢不俱王，自{{person:曹操|操}}{{person:劉備|、備}}時，彊弱縣殊，而{{person:劉備|備}}猶出兵{{place:陽平関|陽平}}，禽{{person:夏侯淵|夏侯淵}}。{{person:関羽|羽}}圍{{place:襄陽|襄陽}}，將降{{person:曹仁|曹仁}}，生獲{{person:于禁|于禁}}，當時北邊大小憂懼，{{person:曹操|孟德}}身出{{place:南陽|南陽}}，{{person:楽進|樂進}}、{{person:徐晃|徐晃}}等為救，圍不即解，故{{person:蔣済|蔣子通}}言彼時有徙{{place:許|許}}渡{{place:黄河|河}}之計，會國家襲取{{place:南郡|南郡}}，{{person:関羽|羽}}乃解軍。{{person:劉備|玄德}}與{{person:曹操|操}}，智力多少，士眾眾寡，用兵行軍之道，不可同年而語，猶能暫以取勝，是時又無{{place:江東|大吳}}{{special:掎角|掎角}}之勢也。今{{person:司馬懿|仲達}}之才，減於{{person:諸葛亮|孔明}}，當時之勢，異於曩日，{{person:劉備|玄德}}尚與抗衡，{{person:諸葛亮|孔明}}何以不可出軍而圖敵邪？昔{{person:楽毅|樂毅}}以弱{{place:燕|燕}}之眾，兼從五國之兵，長驅彊{{place:斉国|齊}}，下七十餘城。今蜀漢之卒，不少{{place:燕|燕}}軍，君臣之接，信於{{person:楽毅|樂毅}}，加以國家為脣齒之援，東西相應，首尾如蛇，形勢重大，不比於五國之兵也，何憚於彼而不可哉？夫兵以奇勝，制敵以智，土地廣狹，人馬多少，未可偏恃也。余觀彼治國之體，當時既肅整，遺教在後，及其辭意懇切，陳進取之圖，忠謀謇謇，義形於主，雖古之{{person:管仲|管}}、{{person:晏嬰|晏}}，何以加之乎？", "kakikudashi_tagged": "『{{special:袁子|袁子}}』に曰く、或るひと{{person:諸葛亮|諸葛亮}}は何如なる人ぞやと問うに、{{special:袁子|袁子}}曰く、{{person:張飛|張飛}}・{{person:関羽|関羽}}は{{person:劉備|劉備}}と倶に起こり、爪牙・腹心の臣なれども、武人なり。晩に{{person:諸葛亮|諸葛亮}}を得て、因りて以て佐相と為すに、群臣悦服せしは、{{person:劉備|劉備}}は信ずるに足り、{{person:諸葛亮|亮}}は重んずるに足るが故なり。其の六尺の孤を受け、一国の政を摂し、凡庸の君に事うるに及び、権を専らにして礼を失わず、君事を行いて国人疑わず、此くの如きは即ち以て君臣・百姓の心、之を欣戴せりと為す。法を行うこと厳にして国人悦服し、民を用うること其の力を尽くさしめて下怨まず。其の兵の出入するに及びては賓の如く、行くゆく寇せず、芻蕘する者も猟せずして、国中に在るが如し。其の兵を用うるや、止まること山の如く、進退すること風の如く、兵出づるの日、天下震動すれども、人心は憂えず。{{person:諸葛亮|亮}}の死して今に至るまで数十年、国人の歌思すること、周人の{{person:召公奭|召公}}を思うが如きなり、{{person:孔子|孔子}}曰く「{{person:冉雍|雍}}や南面せしむべし」と、{{person:諸葛亮|諸葛亮}}に焉れ有り。又た問う、{{person:諸葛亮|諸葛亮}}の始めて{{place:隴右|隴右}}に出づるや、{{place:南安|南安}}・{{place:天水|天水}}・{{place:安定|安定}}の三郡の人、反して之に応じ、若し{{person:諸葛亮|亮}}速やかに進まば、則ち三郡は{{place:中原|中国}}の有に非ざりしならんに、{{person:諸葛亮|亮}}は徐行して進まず、既にして官兵、{{place:涼州|隴}}に上り、三郡復し、{{person:諸葛亮|亮}}は尺寸の功無くして、此の機を失いしは、何ぞや？{{special:袁子|袁子}}曰く、蜀兵は軽鋭にして、良将少なく、{{person:諸葛亮|亮}}は始めて出で、未だ{{place:中原|中国}}の強弱を知らず、是を以て疑いて之を嘗む、且つ大会する者は近功を求めず、進まざりし所以なり。曰く、何を以て其の疑えるを知るや？{{special:袁子|袁子}}曰く、初め出づるや遅重にして、屯営は重複し、後に転じて降るも未だ兵を進めて戦わんと欲せず、{{person:諸葛亮|亮}}は勇にして能く闘うに、三郡反すれども速やかには応ぜず、此れ其の疑えるの徴なり。曰く、何を以て其の勇にして能く闘うを知るや？{{special:袁子|袁子}}曰く、{{person:諸葛亮|亮}}の{{place:街亭|街亭}}に在るや、前軍大いに破れ、{{person:諸葛亮|亮}}の屯は去ること数里なれども、救わず、官兵相い接するも、又た徐行す、此れ其の勇なり。{{person:諸葛亮|亮}}の軍を行うや、安静にして堅重なり、安静なれば則ち動かし易く、堅重なれば則ち以て進退すべし。{{person:諸葛亮|亮}}は法令明らかに、賞罰信あり、士卒は命を用い、険に赴きて顧みず、此れ能く闘う所以なり。曰く、{{person:諸葛亮|亮}}は数万の衆を率い、其の興造する所、数十万の功の若きは、是れ其の奇なる者なり。至る所の営塁・井竈・圊溷・籓籬・障塞は皆な縄墨に応じ、一月の行も、之を去るとき始めて至りしが如きは、労費して徒らに飾好を為せるか、何ぞや？{{special:袁子|袁子}}曰く、蜀人は軽脱なり、{{person:諸葛亮|亮}}は故に堅く之を用いしなり。曰く、何を以て其の然るを知るや？{{special:袁子|袁子}}曰く、{{person:諸葛亮|亮}}は実を治めて名を治めず、志大にして欲する所遠く、近速を求むる者に非ざるなり。曰く、{{person:諸葛亮|亮}}は好みて官府・次舎・橋梁・道路を治む、此れ急務に非ざるに、何ぞや？{{special:袁子|袁子}}曰く、小国には賢才少なし、故に其の尊厳ならんことを欲せしなり。{{person:諸葛亮|亮}}の{{place:益州|蜀}}を治むるや、田疇は辟け、倉廩は実ち、器械は利く、蓄積は饒かに、朝会は華ならず、路に酔人無し。夫れ本立つが故に末治まり、余力有りて然る後に小事に及ぶ、此れ其の功を勧むる所以なり。曰く、子の{{person:諸葛亮|諸葛亮}}を論ずるや、則ち証有り。{{person:諸葛亮|亮}}の才を以てして其の功少なきは、何ぞや？{{special:袁子|袁子}}曰く、{{person:諸葛亮|亮}}は、本を持する者なり、其の応変に於けるは、則ち長ずる所に非ざるなり、故に敢えて其の短を用いず。曰く、然らば則ち吾子の之を美とするは、何ぞや？{{special:袁子|袁子}}曰く、此れ固より賢者の遠きなり、安んぞ備体を以て責むべけんや。夫れ能く短なる所を知りて用いざるは、此れ賢者の大なるなり、短なる所を知れば則ち長ずる所を知る。夫れ前識と言いて中らざるとは、{{person:諸葛亮|亮}}の用いざる所なり、此れ吾の謂わゆる可なるなり。{{place:江東|呉}}の{{office:大鴻臚|大鴻臚}}・{{person:張儼|張儼}}、『{{special:黙記|黙記}}』を作り、其の「述佐篇」に{{person:諸葛亮|亮}}と{{person:司馬懿|司馬宣王}}とを論ずる書に曰く、漢朝傾覆し、天下崩壊し、豪傑の士、競いて神器を希う。魏氏は{{place:中原|中土}}に跨り、劉氏は{{place:益州|益州}}に拠り、並びに兵を{{special:海内|海内}}に称し、世の覇主と為る。{{person:諸葛亮|諸葛}}{{person:司馬懿|・司馬}}の二相は、際会に遭値し、身を明主に託し、或いは功を{{place:益州|蜀}}{{place:漢中|・漢}}に収め、或いは名を{{place:伊水|伊}}{{place:洛水|・洛}}に冊す。{{person:曹丕|丕}}{{person:劉備|・備}}既に没し、後嗣統を継ぐや、各おの保阿の任を受け、幼主を輔翼し、然諾の誠に負かず、亦た一国の宗臣、覇王の賢佐なり。前世を歴て以て近事を観れば、二相の優劣、得て詳らかにすべきなり。{{person:諸葛亮|孔明}}は{{place:巴|巴}}・{{place:益州|蜀}}の地に起こり、一州の土を蹈み、之を大国に方ぶれば、其の戦士・人民は、蓋し九分の一有るのみなるも、以て{{place:江東|大呉}}に貢贄し、北敵に抗対し、耕戦をして伍有り、刑法をして整斉ならしむるに至り、歩卒数万を提げ、{{place:祁山_涼州|祁山}}に長駆し、慨然として馬に{{place:黄河|河}}{{place:洛水|・洛}}に飲かわんとするの志有り。{{person:司馬懿|仲達}}は天下十倍の地に拠り、兼并の衆に仗り、牢城に拠り、精鋭を擁しながら、敵を禽にするの意無く、務めて自ら保全するのみにして、彼の{{person:諸葛亮|孔明}}をして自ら来たり自ら去らしむ。若し此の人亡ぜず、其の志意を終え、連年思いを運らし、日を刻して謀を興さば、則ち{{place:涼州|涼}}{{place:雍州|・雍}}は甲を解かず、{{place:中原|中国}}は鞍を釈かずして、勝負の勢いは、亦た已に決せしならん。昔、{{person:公孫僑|子産}}は{{place:鄭|鄭}}を治め、{{office:諸侯|諸侯}}敢えて兵を加えず、{{place:益州|蜀}}の相は其れ之に近し。之を{{office:司馬|司馬}}に方ぶれば、亦た優ならずや！或るひと曰く、兵なる者は凶器、戦なる者は危事なり、国を有つ者、境内を保安し、百姓を綏静するを務めずして、好みて土地を開闢し、天下を征伐するは、未だ計を得たりと為さざるなり。{{person:諸葛亮|諸葛}}{{office:丞相|丞相}}には誠に匡佐の才有れども、然れども孤絶の地に処り、戦士は五万に満たざれば、自ら関を閉じ険を守りて、君臣無事なるべし。空しく師旅を労し、歳として征せざるは無く、未だ咫尺の地を進め、帝王の基を開く能わずして、国内をして其の荒残を受けしめ、{{place:益州|西土}}をして其の役調に苦しましむ。魏の{{person:司馬懿|司馬懿}}は才用・兵衆ありて、未だ容易く軽んずべからず、敵を量りて進むは、兵家の慎む所なり、若し{{office:丞相|丞相}}に必ず以て之を策する有らば、則ち未だ坦然の勲を見ず、若し策の以て之を裁する無くんば、則ち明哲の謂い、{{special:海内|海内}}帰向の意に非ざるなり、余は窃かに焉れを疑う、請う其の説を聞かん、と。答えて曰く、蓋し聞く、{{person:湯王|湯}}は七十里を以てし、{{person:文王|文王}}は百里の地を以てして天下を有ちしは、皆な征伐を用いて之を定めしなり、と。揖譲して王位に登りし者は、惟だ{{person:虞舜|舜}}{{person:禹|・禹}}のみ。今、{{place:益州|蜀}}・魏は敵戦の国と為り、勢い倶には王たらず、{{person:曹操|操}}{{person:劉備|・備}}の時より、強弱は県殊なれども、{{person:劉備|備}}は猶お兵を{{place:陽平関|陽平}}に出だして、{{person:夏侯淵|夏侯淵}}を禽にせり。{{person:関羽|羽}}は{{place:襄陽|襄陽}}を囲み、将に{{person:曹仁|曹仁}}を降さんとし、{{person:于禁|于禁}}を生獲すれば、当時北辺の大小憂懼し、{{person:曹操|孟徳}}は身ら{{place:南陽|南陽}}に出で、{{person:楽進|楽進}}・{{person:徐晃|徐晃}}等救いを為せども、囲みは即ちには解けず、故に{{person:蔣済|蔣子通}}は彼の時に{{place:許|許}}を徙し{{place:黄河|河}}を渡るの計有りと言い、会たま国家、{{place:南郡|南郡}}を襲い取れば、{{person:関羽|羽}}は乃ち軍を解けり。{{person:劉備|玄徳}}と{{person:曹操|操}}とは、智力の多少、士衆の衆寡、用兵・行軍の道、年を同じくして語るべからざるも、猶お能く暫く以て勝ちを取れり、是の時又た{{place:江東|大呉}}の{{special:掎角|掎角}}の勢い無かりしなり。今、{{person:司馬懿|仲達}}の才は、{{person:諸葛亮|孔明}}より減じ、当時の勢いは、曩日に異なるに、{{person:劉備|玄徳}}すら尚お与に抗衡せしに、{{person:諸葛亮|孔明}}は何を以てか軍を出だして敵を図るべからざらんや？昔、{{person:楽毅|楽毅}}は弱{{place:燕|燕}}の衆を以て、五国の兵を兼従し、強{{place:斉国|斉}}に長駆して、七十余城を下せり。今、蜀漢の卒は、{{place:燕|燕}}軍より少なからず、君臣の接わりは、{{person:楽毅|楽毅}}より信あり、加うるに国家は脣歯の援を為し、東西相い応じ、首尾蛇の如く、形勢の重大なること、五国の兵の比に非ざるなり、何ぞ彼に憚りて不可ならんや？夫れ兵は奇を以て勝ち、敵を制するは智を以てすれば、土地の広狭、人馬の多少は、未だ偏えに恃むべからざるなり。余、彼の国を治むるの体を観るに、当時既に粛整にして、遺教は後に在り、其の辞意懇切にして、進取の図を陳べ、忠謀謇謇として、義は主に形わるるに及びては、古の{{person:管仲|管}}・{{person:晏嬰|晏}}と雖も、何を以てか之に加えんや？", "translation_tagged": "『{{special:袁子|袁子}}』にいう、ある人が{{person:諸葛亮|諸葛亮}}とはどのような人物かと問うたところ、{{special:袁子|袁子}}は言った、{{person:張飛|張飛}}・{{person:関羽|関羽}}は{{person:劉備|劉備}}とともに身を起こし、爪牙・腹心の臣ではあったが、武人であった。後になって{{person:諸葛亮|諸葛亮}}を得て、これを補佐の宰相としたところ、群臣が心から悦んで服したのは、{{person:劉備|劉備}}が信じるに足る主君であり、{{person:諸葛亮|諸葛亮}}が重んじるに足る人物であったからである。やがて年少の孤児を託され、一国の政務を摂行し、凡庸な主君に仕えるに及んでは、権柄を専らにしながら礼節を失わず、君主の政事を行いながら国中の人々が少しも疑わなかったが、このようであったからこそ君臣も万民も心から喜んで彼を推戴したといえるのである。法の執行は厳格でありながら国中の人々は心から悦んで服し、民を使役してその力を出し尽くさせながら下々の者は怨まなかった。その軍兵が出入りするに及んでは賓客のごとく礼儀正しく、行軍の途上でも略奪せず、まぐさ刈りや薪採りの兵も狩りをして荒らすことがなく、あたかも自国内にいるかのようであった。その用兵たるや、止まることは山のごとく、進退することは風のごとくであり、軍が出撃する日には、天下が震動したにもかかわらず、人々の心は少しも不安に憂えることがなかった。{{person:諸葛亮|諸葛亮}}が死去してから今日に至るまで数十年、国中の人々が歌に詠んで慕い思うことは、周の人々が{{person:召公奭|召公}}を慕い思ったかのようであり、{{person:孔子|孔子}}が「{{person:冉雍|雍}}は南面させることができる」と言った資質を、{{person:諸葛亮|諸葛亮}}は備えていたのである。また問うた、{{person:諸葛亮|諸葛亮}}がはじめて{{place:隴右|隴右}}へ出兵したとき、{{place:南安|南安}}・{{place:天水|天水}}・{{place:安定|安定}}の三郡の人々が反旗を翻してこれに呼応し、もし{{person:諸葛亮|諸葛亮}}が速やかに進軍していたならば、三郡は{{place:中原|中国}}の領有ではなくなっていたはずであるのに、{{person:諸葛亮|諸葛亮}}は緩やかに進むばかりで前進せず、やがて官兵が{{place:涼州|隴}}に上り、三郡が奪還されて、{{person:諸葛亮|諸葛亮}}はわずかな戦功も挙げられぬまま、この好機を逸したのは、なぜであるか？{{special:袁子|袁子}}は言った、蜀兵は軽快鋭敏ではあるが、良将が少なく、{{person:諸葛亮|諸葛亮}}ははじめて出兵したばかりで、まだ{{place:中原|中国}}の強弱を把握していなかったため、慎重に疑って小手調べをしたのであり、それに大計を統べる者は目先の功を求めない、それが前進しなかった理由である。問うて言った、何によって彼が疑っていたとわかるのか？{{special:袁子|袁子}}は言った、出陣の当初は動きが慎重で重々しく、陣営を幾重にも設営し、のちに転じて投降者が出てもすぐには兵を進めて戦おうとしなかった、{{person:諸葛亮|諸葛亮}}は勇気があり戦いに長けているにもかかわらず、三郡が反乱しても速やかに呼応しなかった、これが疑っていた証拠である。問うて言った、何によって彼が勇気があり戦いに長けているとわかるのか？{{special:袁子|袁子}}は言った、{{person:諸葛亮|諸葛亮}}が{{place:街亭|街亭}}にいたとき、前軍が大敗を喫し、{{person:諸葛亮|諸葛亮}}の本営はそこから数里しか離れていなかったが、救援に出ず、官兵が間近に迫り接触しても、なお整然と緩やかに行軍して退いた、これが彼の勇気である。{{person:諸葛亮|諸葛亮}}の行軍は、静粛にして堅固重厚であり、静粛であれば動かしやすく、堅固重厚であれば自在に進退することができる。{{person:諸葛亮|諸葛亮}}は法令が明快で、賞罰に信義があるため、兵士たちは命令によく従い、危険な場へ赴いても身を顧みない、これが戦いに長けている理由である。問うて言った、{{person:諸葛亮|諸葛亮}}は数万の兵衆を率いながら、その築造した陣地や施設が、あたかも数十万人の工事によるかのようであったのは、まことに驚異とすべき点である。至るところの陣塁・井戸やかまど・厠・垣根・防塞はみな規矩準縄にかない、わずか一か月の駐留であっても、立ち去るときには到着した当初そのままであったというが、労力と費用をかけていたずらに見栄えを飾っていたのではないか、なぜであるか？{{special:袁子|袁子}}は言った、蜀人は気質が軽薄で締まりがないため、{{person:諸葛亮|諸葛亮}}はことさらに厳格・堅実にこれを用いたのである。問うて言った、何によってそうであるとわかるのか？{{special:袁子|袁子}}は言った、{{person:諸葛亮|諸葛亮}}は実質を治めて虚名を求めず、志は大きく目指すところは遠大であって、目先の速成を求める者ではなかったからである。問うて言った、{{person:諸葛亮|諸葛亮}}は好んで官庁・宿舎・橋梁・道路を整備したが、これらは急務ではないのに、なぜであるか？{{special:袁子|袁子}}は言った、小国には賢才が少ないため、国家の威儀を尊厳あるものにしようと望んだのである。{{person:諸葛亮|諸葛亮}}が{{place:益州|蜀}}を治めるや、田畑は開墾され、穀倉は充ち満ち、武器・道具は鋭利に整い、蓄えは豊かになり、朝廷の集会は華美に流れず、道には酔いどれの姿もなかった。そもそも根本が確立していたからこそ枝葉末節までよく治まり、余力があってはじめて細かな事業にも手が及んだのであり、これこそ治績を奨励し成し遂げたゆえんである。問うて言った、あなたが{{person:諸葛亮|諸葛亮}}を論じたところには、たしかに裏づけがある。しかし{{person:諸葛亮|諸葛亮}}ほどの才能をもってしながらその戦功が少なかったのは、なぜであるか？{{special:袁子|袁子}}は言った、{{person:諸葛亮|諸葛亮}}は、根本を堅守する人物であって、臨機応変の駆け引きにおいては、得意とするところではなかった、それゆえあえておのれの短所を用いなかったのである。問うて言った、そうであるならばあなたが彼を称賛するのは、なぜであるか？{{special:袁子|袁子}}は言った、これこそまことに賢者の深遠なところであって、どうして一人にすべての能力が備わることを求めて責められようか。そもそもおのれの短所をよく知ってそれを用いないことこそ、賢者の偉大なところであり、おのれの短所を知っていればこそおのれの長所をも知るのである。そもそも当て推量の予見や言葉ばかりで的中しない策は、{{person:諸葛亮|諸葛亮}}が採用しないところであり、これこそ私が立派であると認めるゆえんである。{{place:江東|呉}}の{{office:大鴻臚|大鴻臚}}・{{person:張儼|張儼}}が『{{special:黙記|黙記}}』を著し、その「述佐篇」において{{person:諸葛亮|諸葛亮}}と{{person:司馬懿|司馬宣王}}とを論じた一文にいう、漢王朝が傾き覆り、天下が崩れ壊れると、豪傑の士は、競って帝王の神器を望んだ。魏氏は{{place:中原|中土}}にまたがり、劉氏は{{place:益州|益州}}に拠って、並び立って{{special:海内|海内}}に兵を挙げ、当世の覇主となった。{{person:諸葛亮|諸葛}}{{person:司馬懿|・司馬}}の二人の宰相は、風雲の際会にめぐり逢い、明主に身を託して、一方は{{place:益州|蜀}}{{place:漢中|・漢}}の地に功績を収め、一方は{{place:伊水|伊水}}・{{place:洛水|洛水}}のほとりに功名を記録した。{{person:曹丕|曹丕}}・{{person:劉備|劉備}}がすでに没し、後嗣が大統を継ぐと、それぞれ保傅・阿衡の重任を受け、幼主を補佐して、生前の信義ある諾言に背かなかったのであり、いずれも一国の宗臣であり、覇王の賢佐である。前代の歴史を通覧したうえで近時の事績を観察すれば、二人の宰相の優劣は、詳しく明らかにすることができる。{{person:諸葛亮|孔明}}は{{place:巴|巴}}・{{place:益州|蜀}}の地に身を起こし、わずか一州の領土に立脚しており、これを大国と比べれば、その戦士・人民は、おおよそ九分の一にすぎなかったが、それでも{{place:江東|大呉}}に礼物を通じ、北方の強敵に対抗し、農耕と軍事に整然たる編制を備えさせ、刑法を厳正に整えるまでに至り、歩兵数万をひっさげて、{{place:祁山_涼州|祁山}}へ長駆し、慨然として{{place:黄河|黄河}}{{place:洛水|・洛水}}に馬を飲ませようとする高い志を抱いた。これに対し{{person:司馬懿|仲達}}は天下に十倍する広大な領土に拠り、兼併した大軍を頼みとし、堅固な城塞に立てこもり、精鋭を擁していながら、敵を捕らえ討とうとする意欲はなく、ひたすら自己の保全に努めるばかりで、あの{{person:諸葛亮|孔明}}が自在にやって来ては自在に引き揚げて行くに任せた。もしこの人物が世を去ることなく、その志を最後まで貫き、連年にわたり思慮を巡らし、期日を定めて謀略を興し続けていたならば、{{place:涼州|涼州}}・{{place:雍州|雍州}}では鎧を解く暇もなく、{{place:中原|中国}}では馬の鞍を下ろす暇もなくなって、勝負の大勢は、おのずからすでに決していたことであろう。むかし{{person:公孫僑|子産}}が{{place:鄭|鄭}}を治めたとき、{{office:諸侯|諸侯}}はあえて兵を加えようとしなかったというが、{{place:益州|蜀}}の宰相はこれに近いものがあった。これを{{person:司馬懿|司馬懿}}と比べれば、なんと優れていることではないか！ある人が言った、武器とは凶器であり、戦争とは危険な事柄であって、国を保つ者が領内の安寧を守り、万民を撫で安んじることに努めず、好んで領土を切り開き、天下を征伐しようとするのは、上策を得たものとはいえない。{{person:諸葛亮|諸葛}}{{office:丞相|丞相}}にはまことに国家を匡輔する才能があったとはいえ、孤立隔絶した地に身を置き、戦士は五万にも満たなかったのであるから、おのずから関門を閉ざして険阻を守り、君臣ともに平穏無事であることもできたはずである。それなのにいたずらに軍旅を疲弊させ、出征せぬ年とてなく、わずか一尺の領土を押し進めることも、帝王の基業を切り開くこともできぬまま、国内に荒廃の被害を受けさせ、{{place:益州|西土}}を労役と徴発に苦しませた。魏の{{person:司馬懿|司馬懿}}は才能・手腕に優れ兵衆も多く、たやすく軽視できる相手ではなく、敵の力を測ってから進むことこそ、兵家が慎み重んじるところである、もし{{office:丞相|丞相}}に必ず勝てるだけの策があったというのなら、ついに明白な勲功は現れなかったし、もし相手を制する策もなかったというのなら、明哲と呼ばれるゆえんにも、{{special:海内|海内}}の人々が心を寄せる期待にもそぐわないではないか、私はひそかにこの点に疑問を抱いているので、どうかその説明を聞かせてほしい、と。これに答えて言った、聞くところによれば、{{person:湯王|湯王}}は七十里四方、{{person:文王|文王}}は百里四方の地から興って天下を保ったが、いずれも征伐を用いてこれを平定したのである。礼譲によって王位に登った者は、ただ{{person:虞舜|舜}}{{person:禹|・禹}}だけである。いま{{place:益州|蜀}}と魏とは互いに戦い合う敵国であり、勢い並び立ってともに王者となることはできず、{{person:曹操|曹操}}・{{person:劉備|劉備}}の時代から、強弱の差は懸隔していたにもかかわらず、{{person:劉備|劉備}}はなお{{place:陽平関|陽平}}へ出兵して、{{person:夏侯淵|夏侯淵}}を討ち取った。{{person:関羽|関羽}}が{{place:襄陽|襄陽}}を包囲し、いまにも{{person:曹仁|曹仁}}を降伏させようとし、{{person:于禁|于禁}}を生け捕りにすると、当時北辺の者は上下の別なく憂え恐れ、{{person:曹操|孟徳}}は自ら{{place:南陽|南陽}}まで出陣し、{{person:楽進|楽進}}・{{person:徐晃|徐晃}}らが救援にあたったが、包囲はすぐには解けず、それゆえ{{person:蔣済|蔣子通}}もあの時{{place:許|許}}から遷都して{{place:黄河|黄河}}を渡る計画があったと述べており、おりしも我が国が{{place:南郡|南郡}}を奇襲して攻略したことで、{{person:関羽|関羽}}はようやく軍を解いたのであった。{{person:劉備|玄徳}}と{{person:曹操|曹操}}とでは、智力の大小、兵衆の多寡、用兵・行軍の手腕において、到底同列に論じられるものではなかったが、それでもなお一時的に勝利を収めることができたし、この時にはまだ{{place:江東|大呉}}による{{special:掎角|掎角}}の援勢すらなかったのである。いま{{person:司馬懿|仲達}}の才能は、{{person:諸葛亮|孔明}}より劣っており、当時の情勢も、往日とは異なっているのに、{{person:劉備|玄徳}}でさえなお対抗し得たからには、{{person:諸葛亮|孔明}}がどうして軍を出して敵を図ってはならぬことがあろうか？むかし{{person:楽毅|楽毅}}は弱小な{{place:燕|燕}}の兵衆をもって、五国の軍勢を合わせ率い、強大な{{place:斉国|斉}}へ長駆して、七十余城を攻め落とした。いま蜀漢の兵卒は、{{place:燕|燕}}の軍より少なくはなく、君臣の結びつきも、{{person:楽毅|楽毅}}のときより厚い信義で結ばれ、加えて我が国が唇歯の援軍となって、東西で互いに呼応し、首尾が長蛇のごとく連動しており、形勢の重みと大きさは、五国の連合軍の比ではないのであるから、どうして相手を憚って出兵できぬことがあろうか？そもそも兵は奇策によって勝ち、敵を制するのは智略によるのであるから、領土の広狭や、人馬の多寡ばかりを、一概に頼みとすることはできないのである。私があの人の治国のありさまを見るに、当時すでに厳粛に整っていたうえ、遺された教化は後世にまで生き続け、その言葉と真意が懇切を極めて、進取の計略を述べ、忠義の謀を直言して憚らず、大義が主君への誠として表れ出た点に及んでは、いにしえの{{person:管仲|管仲}}・{{person:晏嬰|晏子}}といえども、どうしてこれ以上のことがあろうか？"}, {"id": "v35_p42_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（評）", "para_index": 42, "type": "裴注", "raw_text": "《蜀記》曰：晉永興中，鎮南將軍劉弘至隆中，觀亮故宅，立碣表閭，命太傅掾犍為李興為文曰：「天子命我，于沔之陽，聽鼓鼙而永思，庶先哲之遺光，登隆山以遠望，軾諸葛之故鄉。蓋神物應機，大器無方，通人靡滯，大德不常。故谷風發而騶虞嘯，雲雷升而潛鱗驤；摯解褐於三聘，尼得招而褰裳，管豹變於受命，貢感激以回莊，異徐生之摘寶，釋臥龍於深藏，偉劉氏之傾蓋，嘉吾子之周行。夫有知己之主，則有竭命之良，固所以三分我漢鼎，跨帶我邊荒，抗衡我北面，馳騁我魏疆者也。英哉吾子，獨含天靈。豈神之祗，豈人之精？何思之深，何德之清！異世通夢，恨不同生。推子八陳，不在孫、吳，木牛之奇，則非般模，神弩之功，一何微妙！千井齊甃，又何祕要！昔在顛、夭，有名無跡，孰若吾儕，良籌妙畫？臧文既沒，以言見稱，又未若子，言行並徵。夷吾反坫，樂毅不終，奚比於爾，明哲守沖。臨終受寄，讓過許由，負扆蒞事，民言不流。刑中於鄭，教美於魯，蜀民知恥，河、渭安堵。匪皋則伊，寧彼管、晏，豈徒聖宣，慷慨屢歎！昔爾之隱，卜惟此宅，仁智所處，能無規廓。日居月諸，時殞其夕，誰能不歿，貴有遺格。惟子之勳，移風來世，詠歌餘典，懦夫將厲。遐哉邈矣，厥規卓矣，凡若吾子，難可究已。疇昔之乖，萬里殊塗；今我來思，覿爾故墟。漢高歸魂於豐、沛，太公五世而反周，想罔兩以髣髴，冀影響之有餘。魂而有靈，豈其識諸！」王隱《晉書》云：李興，密之子；一名安。", "kakikudashi": "『蜀記』に曰く、晋の永興中、鎮南将軍の劉弘、隆中に至り、亮の故宅を観、碣を立てて閭を表し、太傅掾の犍為の李興に命じて文を為らしめて曰く、「天子、我に命じ、沔の陽に于いてせしめ、鼓鼙を聴きて永く思い、先哲の遺光を庶い、隆山に登りて以て遠望し、諸葛の故郷に軾す。蓋し神物は機に応じ、大器は方無く、通人は滞る靡く、大徳は常ならず。故に谷風発して騶虞嘯き、雲雷升りて潜鱗驤り、摯は褐を三聘に解き、尼は招きを得て裳を褰げ、管は受命に豹変し、貢は感激して以て荘を回らし、徐生の宝を摘するを異とし、臥龍を深蔵より釈き、劉氏の傾蓋を偉とし、吾子の周行を嘉す。夫れ知己の主有れば、則ち命を竭くすの良有り、固より我が漢鼎を三分し、我が辺荒に跨帯し、我が北面に抗衡し、我が魏疆に馳騁せし所以の者なり。英なるかな吾子、独り天霊を含む。豈に神の祗か、豈に人の精か？何ぞ思いの深く、何ぞ徳の清きや！異世に夢を通わせ、生を同じくせざるを恨む。子の八陳を推すに、孫・呉に在らず、木牛の奇なる、則ち般の模に非ず、神弩の功は、一に何ぞ微妙なる！千井斉しく甃むは、又た何ぞ秘要なる！昔、顛・夭に在りては、名有りて跡無し、孰れか吾が儕の、良籌・妙画なるに若かんや？臧文既に没し、言を以て称せらるるも、又た未だ子の、言行並びに徴あるに若かず。夷吾は反坫し、楽毅は終えざれば、奚ぞ爾の、明哲にして沖を守るに比せん。終わりに臨みて寄を受け、譲は許由に過ぎ、扆を負いて事に蒞めども、民言流れず。刑は鄭より中り、教は魯より美しく、蜀民は恥を知り、河・渭は安堵す。皋に匪ざれば則ち伊なり、寧んぞ彼の管・晏のみならんや、豈に徒だ聖宣の、慷慨して屢しば歎ぜしのみならんや！昔、爾の隠るるや、惟だ此の宅を卜し、仁智の処る所、能く規廓無からんや。日居月諸、時に其の夕に殞つ、誰か能く歿せざらん、遺格有るを貴ぶ。惟うに子の勲は、風を来世に移し、余典を詠歌すれば、懦夫も将に厲まんとす。遐かなるかな邈たり、厥の規は卓たり、凡そ吾子の若きは、究むべからざるのみ。疇昔の乖くや、万里塗を殊にせしも、今我来たりて、爾の故墟を覿る。漢高は魂を豊・沛に帰し、太公は五世にして周に反る、罔両を想いて以て髣髴とし、影響の余り有らんことを冀う。魂にして霊有らば、豈に其れ諸れを識らんや！」と。王隠の『晋書』に云う、李興は、密の子なり、一名は安、と。", "translation": "『蜀記』にいう、晋の永興年間、鎮南将軍の劉   const OFFICES = {"太守": {"match_terms": ["太守", "郡守"], "wiki_title": "太守", "ai_desc": "一郡の行政・軍事・司法を統括する地方長官（『続漢書』百官志五）。毎年末には「計吏（上計吏）」を帝都・洛陽へ派遣して郡の戸口・財政・治績を朝廷に報告させた。", "yomi": "たいしゅ", "office_group": "local"}, "太史": {"match_terms": ["太史令", "太史"], "wiki_title": "太史令", "ai_desc": "太常に属し、国史の編纂・記録とともに天文・暦法・気象・災異の観測と占候を掌った長官（『続漢書』百官志二）。霊帝が河間の旧宅へ北巡しようとした際、北方の空に東西にわたる赤気（オーロラまたは彗星・妖気）が現れたため、太史は「陰謀の兆しがあるため北巡すべきではない」と進言して霊帝の行幸を中止させ、結果として王芬らのクーデター計画を頓挫させた。", "yomi": "たいし", "office_group": "central"}, "丞相": {"title": "丞相（じょうしょう：建安13年に三公を廃して復置された百官の最高執政官、同年6月に曹操が就任）", "wiki_title": "丞相", "mapping_note": "", "ai_desc": "皇帝を補佐して百官を統率し万機を総覧する最高宰相職（『漢書』巻19上・百官公卿表上）。前漢末の哀帝期に大司徒と改められ、後漢では太尉・司徒・司空の「三公」鼎立制が採られていたが、建安13年（208年）春正月、後漢朝廷は三公の官を廃止して前漢の旧制である「丞相」と「御史大夫」を復置し、同年夏6月に曹操を丞相に任じた（太常・徐璆が印綬を授与し、曹操は一たび徐璆に位を譲ろうとした）。これにより朝廷の行政・人事・軍事権は丞相府に一元化され、以後の曹魏覇権の中枢機関となった（『三國志』巻1・武帝紀および注引『献帝起居注』『先賢行状』、『後漢書』巻9・孝献帝紀）。", "yomi": "じょうしょう", "office_group": "central", "match_terms": ["丞相"]}, "中書令": {"title": "中書令（ちゅうしょれい：中書省の長官、宮中の詔勅起草と国政機密を掌る枢要高官）", "wiki_title": "中書令", "mapping_note": "", "ai_desc": "前漢武帝が宦官を用いた中書謁者令に淵源し、曹魏の黄初初年に士人を任ずる中書省の長官として中書監と並び設置された要職（第三品）。蜀漢でも設置されて後主劉禅期に樊建らが守中書令を務め、西晋では和嶠らが在任した（『晋書』巻24・職官志、『三國志』巻35・諸葛亮伝）。", "yomi": "ちゅうしょれい", "office_group": "central", "match_terms": ["中書令"]}, "中書監": {"title": "中書監（ちゅうしょかん：中書省の筆頭長官、中書令と並び機密詔命と枢機を総掌した要職）", "wiki_title": "中書監", "mapping_note": "", "ai_desc": "曹魏の文帝・黄初初年に秘書令を改めて中書省を新設した際、中書令とともに置かれた最高長官（第三品、位次は中書令の上）。宮中の機密文書・詔勅の起草と献替を総括し、当初は孫資、西晋初には荀勗らが侍中を帯びて中書監を兼領し、絶大な政務中枢権を握った（『晋書』巻24・職官志、巻39・荀勗伝、『三國志』巻14・劉放伝）。", "yomi": "ちゅうしょかん", "office_group": "central", "match_terms": ["中書監"]}, "中書郎": {"title": "中書郎・中書侍郎（ちゅうしょろう：中書省において詔勅起草・機密文書を掌る側近要職）", "wiki_title": "中書侍郎", "mapping_note": "", "ai_desc": "曹魏の黄初年間に秘書を改めて創設された中書省（中書監・中書令の下）において、詔勅の起草や宮中の機密文書を管掌した要職（正式官名は中書侍郎、通称は中書郎、曹魏で第五品。『晋書』巻24・職官志、『通典』巻21）。蜀漢でも後主・劉禅の代に中書令・中書郎の官が置かれ、景耀6年（263年）春に中書郎の向充が歩兵校尉・習隆らとともに諸葛亮の立廟を上表した（『三國志』巻35・諸葛亮伝注引『襄陽記』、巻41・向朗伝附伝）。", "yomi": "ちゅうしょろう", "office_group": "central", "match_terms": ["中書侍郎", "中書郎"]}, "主簿": {"title": "主簿（しゅぼ：公府・覇府や州郡において門下の機密文書・帳簿・庶務を統括した側近要職）", "wiki_title": "主簿", "mapping_note": "", "ai_desc": "三公・丞相の幕府や州郡・県において、府主のすぐ側近くで文書・記録・印綬・諸事の決済取次を総括した要職（『続漢書』百官志一・百官志五、『晋書』巻24・職官志）。曹操の幕府では楊脩・司馬懿・賈逵らが主簿を務め、建安24年（219年）の漢中陣中では楊脩が「鶏肋」の号令から撤退の意図を察知したほか、麦畑を踏み荒らした乗馬の罪を曹操が議せしめた故事でも主簿が「春秋の義、罰は尊に加えざるなり」と答申している（『三國志』巻1・武帝紀注引『九州春秋』『曹瞞伝』）。", "yomi": "しゅぼ", "office_group": "central", "match_terms": ["主簿"]}, "令史": {"title": "令史・府令史（れいし／ふれいし：丞相府・三公府や尚書台で文書記録・実務を掌った属吏）", "wiki_title": "令史", "mapping_note": "", "ai_desc": "漢代から三国・晋代にかけ、三公・丞相の幕府（「府令史」）や尚書台・御史台・蘭台などの諸官署に置かれ、公文書の作成・記録・帳簿管理などの実務を担った下級〜中級属吏（秩百石〜二百石相当、『続漢書』百官志一・三）。蜀漢では董厥が諸葛亮の丞相府の令史から思慮の緻密さを認められて主簿へ抜擢され、のちに尚書令・大将軍へ昇った（『三國志』巻35・諸葛亮伝附董厥伝）。", "yomi": "れいし", "office_group": "central", "match_terms": ["府令史", "令史"]}, "仮節": {"title": "仮節（かせつ：天子・王の符節を仮授され、戦時の軍令違反者を専断処罰できる軍事特権）", "wiki_title": "使持節", "mapping_note": "「仮節」をWikipedia「使持節」と紐づけています。", "ai_desc": "方面軍司令官や重鎮に対し、君主の信証である「節（符節）」を仮授する軍事特権。魏晋期の三等節制（使持節・持節・仮節）においては、戦時（「軍事と興る時」）に軍令に違反した者を朝廷への事前上奏なしに処刑できる権限を持った（『晋書』巻24・職官志、杜佑『通典』巻32・職官十四）。建安24年（219年）、漢中王となった劉備は張飛を右将軍・仮節に拝した（『三國志』巻36・張飛伝）。", "yomi": "かせつ", "office_group": "title_priv", "match_terms": ["仮節", "假節"]}, "使持節": {"title": "使持節・持節（しじせつ／じせつ：天子の符節を奉じて特命使節・重鎮が帯びる最高使節資格）", "wiki_title": "使持節", "mapping_note": "", "ai_desc": "天子の信証である「節（符節）」を奉持して職務を遂行する特命資格。漢代においては重大な冊封・婚礼納聘・辺境統撫などの特使が「使持節」あるいは「持節」を称し、魏晋期には「使持節（二千石以下を専殺可）・持節（無官位者を専殺可）・仮節（戦時軍令違反者を専殺可）」の三等の軍権資格へと体系化された（『晋書』巻24・職官志）。建安18年（213年）7月の納娉および翌建安19年（214年）2月の二貴人奉迎に際し、大司農・王邑と宗正・劉艾が節を奉じて鄴の魏公国へ派遣された（『三國志』巻1・武帝紀注引『献帝起居注』）。", "yomi": "しじせつ", "office_group": "title_priv", "match_terms": ["使持節"]}, "侍中": {"title": "侍中（じちゅう：皇帝の車駕に陪乗し左右で顧問・献替を掌る側近高官）", "wiki_title": "侍中", "mapping_note": "", "ai_desc": "宮中の禁中に出入りして皇帝の左右に侍り、乗輿（天子の車駕）への陪乗や制度・天文・政務の顧問応対を掌った側近の要職（『続漢書』百官志三）。太史令であった王立は侍中を兼任して献帝の東遷に随行し、天文の運行から「漢の天命は尽き、晋・魏が興る」「天下を安んずる者は曹姓なり」と進言した（張璠『漢紀』）。", "yomi": "じちゅう", "office_group": "central", "match_terms": ["侍中"]}, "侍郎": {"title": "侍郎（じろう：黄門侍郎や尚書侍郎など宮中・尚書台で天子に近侍して機密・献替に携わる郎官）", "wiki_title": "黄門侍郎", "mapping_note": "", "ai_desc": "漢代から三国時代にかけて、宮中禁門の内に侍して詔命の伝達・顧問献替を掌った黄門侍郎（給事黄門侍郎、比六百石）や、尚書台で文書起草を担った尚書侍郎などの総称。諸葛亮の『出師表』に「侍中・侍郎の郭攸之・費禕・董允ら」と見える「侍郎」は、当時黄門侍郎であった董允を指す（『続漢書』百官志二、『三國志』巻35・諸葛亮伝、巻39・董允伝）。", "yomi": "じろう", "office_group": "central", "match_terms": ["侍郎"]}, "侯相": {"title": "侯相（こうしょう：列侯の封国〔県侯国〕に置かれ県令と同格で民政を治めた長官）", "wiki_title": "県令", "mapping_note": "", "ai_desc": "漢・魏・晋制において、県が列侯（県侯）の封国とされた場合に「県令・県長」に代えて置かれた封国の行政長官（『続漢書』百官志五、『晋書』巻24・職官志）。朝廷から任命されて一般の県と同様に領域内の民政・租税・裁判を統括し、封侯に対しては臣礼を執った。泰始10年（274年）に『諸葛氏集』を上進した際、陳寿は平陽侯国の相（平陽侯相）を務めていた（『三國志』巻35・諸葛亮伝）。", "yomi": "こうしょう", "office_group": "local", "match_terms": ["侯相"]}, "公主": {"title": "公主（こうしゅ：天子の娘および特命によってこれに準じた諸侯王の娘に授けられる称号）", "wiki_title": "公主", "mapping_note": "", "ai_desc": "本来は皇帝の娘を指す称号（天子が自ら婚礼を主宰せず同姓の諸侯・「公」に主宰させたことに由来。『春秋公羊伝』荘公元年・『続漢書』百官志五）。後漢制では皇女は県公主に封ぜられて列侯と同格の礼遇を受け、諸侯王の娘は通常「郷亭公主」に封ぜられたが、建安21年（216年）5月、献帝は特命をもって魏王・曹操の娘（清河長公主や金郷公主ら、あるいは曹憲・曹華ら）を「公主」となし、湯沐の邑を食邑として授けた（『三國志』巻1・武帝紀、盧弼『三国志集解』）。", "yomi": "こうしゅ", "office_group": "title_priv", "match_terms": ["公主"]}, "典農": {"title": "典農・典農校尉・典農都尉（てんのう：曹操政権・曹魏で各地の屯田の開墾・徴税・軍事管理を統括した農政官）", "wiki_title": "屯田制", "mapping_note": "", "ai_desc": "建安元年（196年）の屯田制創始に伴い設置された屯田統括官で、規模に応じ典農中郎将・典農校尉・典農都尉が置かれ、郡県から独立して屯田の開墾・徴税・防衛を掌った（『三國志』巻16・任峻伝、『続漢書』百官志三注）。曹魏は謝奇を蘄春典農に任じて皖の田郷に駐屯させた（『三國志』巻54・呂蒙伝）。", "yomi": "てんのう", "office_group": "local", "match_terms": ["典農中郎将", "典農中郎將", "典農校尉", "典農都尉", "典農"]}, "列侯": {"title": "列侯・郷侯・亭侯（れっこう／きょうこう／ていこう：県侯・郷侯・亭侯・都郷侯・都亭侯などの最高位爵位）", "wiki_title": "列侯", "mapping_note": "", "ai_desc": "二十等爵の最高位（『漢書』巻19上・百官公卿表上、『続漢書』百官志五）。後漢では食邑の規模に応じて県侯・郷侯（都郷侯を含む）・亭侯（都亭侯や万歳・千秋・国明などの嘉名を冠した亭侯を含む）に細分された。前漢の曹参は高祖（劉邦）に従った功績で一万六百戸の「平陽侯」（県侯）に封じられ、後漢の曹騰は桓帝即位の功により「費亭侯」（亭侯）に封じられて曹嵩・曹操へと継承されたほか、建安18年（213年）の魏公勧進表には荀攸（謝亭侯）・鍾繇（東武亭侯）・夏侯惇（高安侯）・程昱（安国亭侯）・賈詡（都郷侯）・董昭（千秋亭侯）・曹洪（国明亭侯）・韓浩（万歳亭侯）・曹仁（安平亭侯）ら多数の列侯が連署している（『三國志』巻1・武帝紀注引『魏書』）。", "yomi": "れっこう", "office_group": "title_priv", "match_terms": ["列侯"]}, "刺史": {"title": "刺史（しし：益州刺史・各州の監察長官）", "wiki_title": "刺史", "mapping_note": "", "ai_desc": "一州を管轄し、傘下の郡太守（二千石）や県令長を監察・弾劾した地方長官（『続漢書』百官志五）。益州刺史であった种暠は、函谷関で蜀郡太守が曹騰へ送った書状を検閲・摘発して弾劾奏上を行った。", "yomi": "しし", "office_group": "local", "match_terms": ["刺史"]}, "参軍": {"title": "参軍・参軍事（さんぐん：丞相府・将軍幕府の軍事謀議に参画する高級参謀幕僚）", "wiki_title": "参軍", "mapping_note": "", "ai_desc": "後漢末に三公・丞相や大将軍・州牧の幕府において、軍事・政略の帷幄に参画させた「参〇〇軍事」（参司空軍事・参丞相軍事など）に起源を持つ参謀職であり、略して「参軍」「参軍事」と称された（『続漢書』百官志一注、『晋書』巻24・職官志、杜佑『通典』巻29・職官十一）。建安19年（214年）秋7月、曹操が孫権征討の軍を起こすにあたり、参軍（参丞相軍事）であった傅幹が文武・威徳の均衡を説いて出兵を諫めた（『三國志』巻1・武帝紀注引『九州春秋』）。", "yomi": "さんぐん", "office_group": "military", "match_terms": ["参軍", "參軍"]}, "右中郎将": {"title": "右中郎将（うちゅうろうじょう：五官・左・右の三署中郎将の一つ、宿衛および征討を掌る比二千石の武官）", "wiki_title": "中郎将", "mapping_note": "", "ai_desc": "漢代の光禄勲に属して宮廷宿衛の郎官を統率した三署中郎将（五官・左・右中郎将、比二千石）の一つで、後漢末には兵を率いて出征する例も多く、曹魏でも第四品武官として継承された。北帰した徐庶（福）が黄初年間に右中郎将・御史中丞に至った（『続漢書』百官志二、『三國志』巻35・諸葛亮伝注引『魏略』）。", "yomi": "うちゅうろうじょう", "office_group": "military", "match_terms": ["右中郎将", "右中郎將"]}, "右将軍": {"title": "右将軍（うしょうぐん：前後左右将軍〔四方将軍〕の一、九卿と同格の高位常設将軍）", "wiki_title": "前後左右将軍", "mapping_note": "", "ai_desc": "前将軍・左将軍・後将軍とともに「四方将軍（四将軍）」を構成し、大将軍・驃騎将軍・車騎将軍・衛将軍に次ぎ上卿に準ずる高位の常設将軍職（『続漢書』百官志一）。建安24年（219年）秋7月に劉備が漢中王に即位すると、関羽を前将軍、馬超を左将軍、張飛を右将軍、黄忠を後将軍に拝した（『三國志』巻36・張飛伝、魏では楽進・徐晃らも歴任）。", "yomi": "うしょうぐん", "office_group": "military", "match_terms": ["右将軍", "右將軍"]}, "司徒": {"title": "司徒（しと：三公の一）", "wiki_title": "司徒", "mapping_note": "", "ai_desc": "太尉・司空とともに「三公」を構成し、天下の民政・教化・礼制を統括した最高官職（『続漢書』百官志一）。かつて益州刺史として曹騰を弾劾した种暠は、曹騰がその忠直を称賛して恨まなかったこともあり、延熹4年（161年）に司徒に昇った（『後漢書』巻56・种暠伝）。", "yomi": "しと", "office_group": "central", "match_terms": ["司徒"]}, "司空": {"title": "司空（しくう：三公の一、建安元年10月に曹操が就任し12年間にわたり幕府を開いた最高執政官）", "wiki_title": "司空", "mapping_note": "", "ai_desc": "太尉・司徒とともに後漢の最高執政官「三公」を構成し、本来は天下の水土・土木造営・法令監察を総括した大臣（『続漢書』百官志一）。建安元年（196年）10月、袁紹が太尉に任じられた際に「大将軍の曹操より席次が下になる」と不満を抱いたため、曹操は大将軍の地位を袁紹に譲り、自らは司空・行車騎将軍に就任した。以後、建安13年（208年）に三公を廃して丞相を復活させるまでの約12年間、曹操は「司空（曹司空）」として許都の朝政と軍事を統括した。", "yomi": "しくう", "office_group": "central", "match_terms": ["司空"]}, "司隷校尉": {"title": "司隷校尉（しれいこうい：帝都および司隸七郡を監察・統括する長官）", "wiki_title": "司隷校尉", "mapping_note": "", "ai_desc": "符節を持して帝都・洛陽および周辺の司隸七郡（河南・河内・河東・弘農・京兆・左馮翊・右扶風）の百官・皇族・豪族を監察・弾劾した長官（『続漢書』百官志四）。曹嵩は霊帝の代に司隷校尉を務めた。", "yomi": "しれいこうい", "office_group": "local", "match_terms": ["司隷校尉", "司隸校尉"]}, "司馬": {"title": "軍司馬・司馬（ぐんしば／しば：将軍・校尉の幕府に属して兵馬と軍紀を統率する武官）", "wiki_title": "軍司馬", "mapping_note": "", "ai_desc": "大将軍・諸将軍および五校尉の傘下に置かれ、軍の編成・行軍・陣中規律・実戦指揮を掌った幕府の中核武官（『続漢書』百官志一）。興平元年（194年）の濮陽の戦いで、曹操が火中を突破した際に落馬して左の掌に火傷を負う窮地に陥ったとき、司馬の楼異が駆け寄って曹操を抱きかかえ馬に乗せて脱出させた。また建安13年（208年）の荊州平定時には、書家の梁鵠が軍仮司馬（仮司馬）に署されて秘書に配属された（衛恒『四体書勢序』）。", "yomi": "しば", "office_group": "military", "match_terms": ["司馬"]}, "大司馬": {"title": "大司馬（だいしば：太尉と並ぶ最高軍事長官、後漢末に上公・三公の上に復置され劉虞・張楊らが就任）", "wiki_title": "大司馬", "mapping_note": "", "ai_desc": "軍事を総管する最高官職。前漢の武帝が太尉に代えて大司馬を置き、後漢の光武帝が建武27年（51年）に再び太尉へ改めたが、霊帝の中平6年（189年）に幽州牧・劉虞が大司馬に拝されて以降、太尉と並置される上公級の最高職として復活した（『後漢書』巻73・劉虞伝、『続漢書』百官志一）。劉虞や李傕・張楊らも大司馬に任じられた。", "yomi": "だいしば", "office_group": "central", "match_terms": ["大司馬"]}, "大将軍": {"title": "大将軍（だいしょうぐん：全軍の最高統帥官、外戚の竇武らが就任）", "wiki_title": "大将軍", "mapping_note": "", "ai_desc": "将軍号の最高位。後漢では主に皇后の父兄（外戚）が就任して「録尚書事」を兼ね、三公と並んで朝政の最高権力を握った（『続漢書』百官志一）。桓帝の竇皇后の父・竇武は霊帝即位に伴い大将軍となり、太傅・陳蕃とともに宦官勢力の誅滅を図ったが、建寧元年（168年）9月に曹節・王甫らの反撃を受けて敗死した。", "yomi": "だいしょうぐん", "office_group": "military", "match_terms": ["大将軍", "大將軍"]}, "大鴻臚": {"title": "大鴻臚（だいこうろ：九卿の一・諸侯王や朝貢国との外交儀礼を統括）", "wiki_title": "大鴻臚", "mapping_note": "", "ai_desc": "諸侯王・列侯の封爵儀礼や、周辺諸民族・外国使節の朝貢・賓客応接を総管する中央の大臣（『続漢書』百官志二）。", "yomi": "だいこうろ", "office_group": "central", "match_terms": ["大鴻臚"]}, "太傅": {"title": "太傅（たいふ：上公・皇帝を道義的に輔導する百官の最高名誉職）", "wiki_title": "太傅", "mapping_note": "", "ai_desc": "天子を善道に導く「上公」の職であり、後漢では新帝が即位するごとに徳望の極めて高い元老1名が太傅に任じられ、三公の上に立って「録尚書事」を兼ねた（『続漢書』百官志一）。清流派の領袖であった陳蕃は霊帝即位に際して太傅に拝され、大将軍・竇武と協力して宦官一掃を計画したが、機密が漏れて殺害された。", "yomi": "たいふ", "office_group": "central", "match_terms": ["太傅"]}, "太尉": {"title": "太尉（たいい：三公の筆頭）", "wiki_title": "太尉", "mapping_note": "", "ai_desc": "司徒・司空とともに後漢の最高官「三公」を構成し、天下の軍事・国防・人事を統括した最高官職（『続漢書』百官志一）。曹操の父・曹嵩は霊帝の中平4年（187年）11月、崔烈に代わって太尉に昇った（『後漢書』巻8・霊帝紀）。", "yomi": "たいい", "office_group": "central", "match_terms": ["太尉"]}, "射声校尉": {"title": "射声校尉（しゃせいこうい：京師宿衛の常備軍「北軍五校尉」の一、弓弩部隊を掌る武官）", "wiki_title": "五校尉", "mapping_note": "", "ai_desc": "前漢の武帝が創設し、後漢・三国時代を通じて屯騎・越騎・歩兵・長水各校尉とともに中央常備軍「北軍五校（五営）」を構成した比二千石の武官（『漢書』巻19上・百官公卿表上、『続漢書』百官志四）。暗闇の中で物音を聞くだけで射当てる精妙な射手を統率したことに由来し、蜀漢では諸葛瞻や向充らが歴任した（『三國志』巻35・諸葛亮伝附諸葛瞻伝、巻41・向朗伝附伝）。", "yomi": "しゃせいこうい", "office_group": "military", "match_terms": ["射声校尉", "射聲校尉"]}, "尚書": {"title": "尚書・選部尚書（しょうしょ／せんぶしょうしょ：尚書台で詔奏・人事を掌る中枢官、霊帝期に梁鵠が選部尚書を務める）", "wiki_title": "尚書", "mapping_note": "", "ai_desc": "皇帝直属の政務機関である「尚書台」において、尚書令・尚書僕射の下で各部局（六曹：吏曹〔選部〕・二千石曹・民曹・客曹・三公曹など）の政務・詔勅起草・上奏審査を分掌した中枢官僚（『続漢書』百官志三）。とりわけ官吏の任用・人事を掌る吏曹尚書は霊帝期に「選部尚書」（のちの吏部尚書）と呼ばれ、書の名手であった安定の梁鵠が霊帝に愛重されて選部尚書に昇り、当時洛陽令を望んだ若き曹操を洛陽北部尉に任じた。また献帝が許に遷都した際には隠逸の名士・王儁を尚書として召したが、王儁は応じなかった（衛恒『四体書勢序』、皇甫謐『逸士伝』）。", "yomi": "しょうしょ", "office_group": "central", "match_terms": ["尚書", "尙書"]}, "尚書令": {"title": "尚書令（しょうしょれい：尚書台の長官・奏下文書と政務中枢を総括、魏国初代には荀攸が就任）", "wiki_title": "尚書令", "mapping_note": "", "ai_desc": "宮中の文書・詔勅起草および百官の上奏を総括する尚書台の最高長官（『続漢書』百官志三）。後漢本朝では荀彧が長年この職にあって朝政の中枢を担い、建安18年（213年）11月に魏公国に初めて尚書・侍中・六卿が置かれると、曹操の謀主であった荀攸が魏国の初代尚書令に拝された（『三國志』巻1・武帝紀注引『魏氏春秋』、巻10・荀攸伝）。", "yomi": "しょうしょれい", "office_group": "central", "match_terms": ["尚書令", "尙書令"]}, "尚書僕射": {"title": "尚書僕射・僕射（しょうしょぼくや／ぼくや：尚書台の次官、尚書令を補佐し不在時には台事を総括）", "wiki_title": "尚書僕射", "mapping_note": "", "ai_desc": "尚書令を補佐して奏章の封印・開閉や尚書諸曹の統括にあたり、令が欠員または不在の際には尚書台の全政務を代行した次官職（『続漢書』百官志三）。建安18年（213年）11月に魏公国に尚書が置かれると、涼茂が初代の尚書僕射に任じられ、のち毛玠・何夔・杜襲らがこの職を務めた（『三國志』巻1・武帝紀注引『魏氏春秋』、巻11・涼茂伝、巻12・毛玠伝）。", "yomi": "しょうしょぼくや", "office_group": "central", "match_terms": ["尚書僕射", "尙書僕射"]}, "左中郎将": {"title": "左中郎将（さちゅうろうしょう：光禄勲に属し三署の左署郎を統率する比二千石の宿衛・統兵武官）", "wiki_title": "中郎将", "mapping_note": "", "ai_desc": "光禄勲に属し、五官中郎将・右中郎将とともに三署（五官・左・右）の郎官を分掌・統率して宮殿の宿衛や車駕の鹵簿護衛を掌った比二千石の武官であり、後漢末には特命の使節や征討軍の統兵官としても用いられた（『続漢書』百官志二）。建安19年（214年）3月、献帝が魏公・曹操の位を諸侯王の上に置いて金璽・赤紱・遠遊冠を改授した際、左中郎将・楊宣が亭侯・裴茂とともに節・印を持して授与の使者を務めた（『三國志』巻1・武帝紀注引『献帝起居注』）。", "yomi": "さちゅうろうしょう", "office_group": "military", "match_terms": ["左中郎将", "左中郎將"]}, "左将軍": {"title": "左将軍（さしょうぐん：前後左右将軍の一）", "wiki_title": "左将軍", "mapping_note": "", "ai_desc": "前・後・左・右将軍（四将軍）の一。袁術は朝廷から左将軍に任じられていたが、建安2年（197年）に寿春で帝号を僭称したため、朝廷の詔勅で「故の左将軍袁術」として討伐対象とされた（『江表伝』）。", "yomi": "さしょうぐん", "office_group": "military", "match_terms": ["左将軍", "左將軍"]}, "平尚書事": {"title": "平尚書事・平台事（へいしょうしょじ／へいだいじ：尚書台の重要政務を参決・裁断する宰相級の加官）", "wiki_title": "録尚書事", "mapping_note": "", "ai_desc": "尚書台（「臺」）の奏上文書や国政の機務を評議・裁決（「平」）する権限を付与する加官。「録尚書事」が尚書台の全政務を総攬する最高権であるのに対し、「平尚書事（平臺事）」はそれに次ぐ準宰相職として重臣・将軍に加えられた。蜀漢末期の景耀4年（261年）以降、諸葛瞻と董厥がともにこの任に就いて国政を統括した（『三國志』巻35・諸葛亮伝附諸葛瞻伝・董厥伝、洪飴孫『三国職官表』）。", "yomi": "へいしょうしょじ", "office_group": "central", "match_terms": ["平尚書事", "平尙書事", "平臺事", "平台事"]}, "征西将軍": {"title": "征西将軍（せいせいしょうぐん：四征将軍の一、西方征討を統括する高位将軍号）", "wiki_title": "四征将軍", "mapping_note": "", "ai_desc": "前漢・後漢から魏晋にかけて置かれた「四征将軍」（征東・征南・征西・征北将軍）の一つで、西方方面の軍事征討を統括した高位の将軍職（後漢では馮異・耿秉・馬賢らが就任。『後漢書』巻17・馮異伝、巻19・耿秉伝）。建安15年（210年）12月己亥の令（『魏武故事』所載）において、曹操はかつて都尉・典軍校尉に召された頃、国家のために賊を討って功を立て、列侯に封ぜられて「征西将軍」となり、死後には墓道に『漢故征西将軍曹侯之墓』と刻まれることを人生の本懐としていたと述懐した。", "yomi": "せいせいしょうぐん", "office_group": "military", "match_terms": ["征西将軍", "征西將軍"]}, "御史中丞": {"title": "御史中丞（ぎょしちゅうじょう：御史台の事実上の長官・百官の監察と弾劾を統括）", "wiki_title": "御史中丞", "mapping_note": "", "ai_desc": "御史台（蘭台）の長として宮中の図書・秘籍を管掌するとともに、侍御史・州刺史を統率して中央の百官および地方の郡国を検察・弾劾した監察長官（『続漢書』百官志三）。尚書令・司隷校尉とともに朝会では特別に単独の席（「三独坐」）を与えられた。韓馥は御史中丞から董卓の推挙によって冀州牧へと転出した（王粲『英雄記』）。また建安13年（208年）に御史大夫が復置された際には、前漢の旧制と異なり御史大夫は御史中丞を兼領せず、代わりに長史一人を置く規定とされた（『献帝起居注』）。", "yomi": "ぎょしちゅうじょう", "office_group": "central", "match_terms": ["御史中丞"]}, "掾属": {"title": "掾属（えんぞく：三公幕府や州郡の諸曹に分属する上級属吏「掾」と「属」の総称）", "wiki_title": "掾", "mapping_note": "", "ai_desc": "三公（太尉・司徒・司空）や大将軍の幕府、および地方の州郡において、各部局（諸曹）の実務・企画を分担した正副の幹部属吏である「掾（えん）」と「属（ぞく）」の総称（『続漢書』百官志一・百官志五）。当時の司空兼冀州牧であった曹操の下には司空府の諸曹掾属および州庁の治中・別駕らが仕えており、建安11年（206年）10月の乙亥令において、曹操はこれら諸掾属・治中・別駕に対し、毎月一日（月旦）ごとに自らの政治上の過失を直言するよう命じた（王沈『魏書』）。", "yomi": "えんぞく", "office_group": "central", "match_terms": ["掾属", "掾屬"]}, "散騎常侍": {"title": "散騎常侍（さんきじょうじ：皇帝側近に侍従して規諫・顧問・詔命奉使を掌った清要高官）", "wiki_title": "散騎常侍", "mapping_note": "", "ai_desc": "曹魏の文帝・黄初初年、秦漢の「散騎」と「中常侍」を統合し、宦官を排して士人・高徳の文臣を任ずる皇帝側近の侍従・顧問官として再編された要職（第三品、定員四人、侍中と並び称される清職。『晋書』巻24・職官志、『通典』巻21）。乗輿への陪乗や献替・規諫のほか、特命使節としての宣撫も担い、咸熙元年（264年）秋には相国参軍の董厥・樊建が散騎常侍を兼任して旧蜀地の慰労に派遣された（『三國志』巻35・諸葛亮伝附董厥伝）。", "yomi": "さんきじょうじ", "office_group": "central", "match_terms": ["散騎常侍"]}, "有司": {"title": "有司（ゆうし：それぞれの職掌を担当する百官・諸官署の総称）", "wiki_title": "有司", "mapping_note": "", "ai_desc": "「司（つかさど）る所を有する者」の意で、それぞれ固有の職務・管轄を受け持つ朝廷・政府の諸官吏を指す古典的呼称（『尚書』大禹謨・『論語』泰伯篇「籩豆之事、則有司存」）。建安25年（220年）正月、曹操は臨終の『遺令』において、自らの死後も前線の将兵は駐屯地を離れず、中央・地方の「有司」は平常どおり各自の職務を遂行するよう厳命した（『三國志』巻1・武帝紀）。", "yomi": "ゆうし", "office_group": "central", "match_terms": ["有司"]}, "東宮舎人": {"title": "東宮舎人・太子舎人（とうぐうしゃじん／たいししゃじん：皇太子の東宮に仕え宿衛・文翰を掌る清職）", "wiki_title": "太子舎人", "mapping_note": "", "ai_desc": "皇太子の宮殿である東宮（春宮）の属官「太子舎人」の別称（秦漢以来設置され秩二百石、魏・西晋では第六〜七品、定員十六人。『続漢書』百官志四、『晋書』巻24・職官志）。東宮での宿衛・侍従・文書起草を掌り、西晋では名門貴族や高潔な人物の初任・抜擢の清職とされた。泰始年間、尚書僕射・山濤は郿県令として治績を挙げた諸葛亮の孫・諸葛京を東宮舎人に補すよう上啓した（『三國志』巻35・諸葛亮伝注引山濤『啓事』）。", "yomi": "とうぐうしゃじん", "office_group": "central", "match_terms": ["東宮舎人", "東宮舍人", "東宮捨人"]}, "校尉": {"title": "校尉（こうい：将軍に次ぐ武官号、宿衛・辺境・諸軍の部隊指揮官）", "wiki_title": "校尉", "mapping_note": "", "ai_desc": "漢代から魏晋にかけて将軍に次ぐ地位に置かれた武官号（『続漢書』百官志四）。中央の北軍五校尉（屯騎・越騎・歩兵・長水・射声）や司隷校尉・西域戊己校尉などの定設職のほか、出征軍や宿衛部隊を率いる諸校尉が置かれた。建安16年（211年）閏8月の潼関北渡の戦いでは、曹操と同郷（沛国譙県出身）の校尉・丁斐（のち典軍校尉）が牛馬を解き放って馬超軍の追撃を乱し、曹操の渡河を助けた（『三國志』巻1・武帝紀、巻9・曹爽伝注引『魏略』）。", "yomi": "こうい", "office_group": "military", "match_terms": ["校尉"]}, "歩兵校尉": {"title": "歩兵校尉（ほへいこうい：京師宿衛の常備軍である北軍五校尉の一、歩兵部隊を掌る比二千石の武官）", "wiki_title": "北軍五校", "mapping_note": "", "ai_desc": "前漢の武帝期に創設され、後漢・三国時代を通じて屯騎・越騎・長水・射声の各校尉とともに中央常備軍「北軍五校（五営）」を構成した比二千石の武官で、宿衛の歩兵を統率した（『漢書』巻19上・百官公卿表上、『続漢書』百官志四）。蜀漢でも中央宿衛武官として置かれ、景耀6年（263年）春に歩兵校尉の習隆が中書郎・向充らとともに諸葛亮の立廟を上表した（『三國志』巻35・諸葛亮伝注引『襄陽記』）。", "yomi": "ほへいこうい", "office_group": "military", "match_terms": ["歩兵校尉", "步兵校尉"]}, "無当監": {"title": "無当監（むとうかん：南中・氐羌の精鋭からなる蜀漢の常設精鋭部隊「無当飛軍」の統監官）", "wiki_title": "", "mapping_note": "", "ai_desc": "諸葛亮が南中平定後に南中の勁卒や青羌らを編成して創設した蜀漢の精鋭部隊「無当飛軍（無当軍）」を統率する軍監職。「無当」は「向かうところ敵なし」の意。街亭の戦いの後に参軍・討寇将軍となった王平（何平）が初代統監に任じられ、建興9年（231年）の鹵城の戦いで南囲を堅守して張郃の攻撃を退け、のち張嶷らも統率した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、巻43・王平伝、張嶷伝、『華陽国志』）。", "yomi": "むとうかん", "office_group": "military", "match_terms": ["無当監", "無當監"]}, "牧": {"title": "牧（州牧）", "wiki_title": "州牧", "mapping_note": "", "ai_desc": "一州の行政・軍事・人事を直接統括する最高地方長官。後漢では長らく六百石の監察官である「刺史」が置かれていたが、霊帝の中平5年（188年）に劉焉の建言によって主要州に中央の九卿経験者などを「州牧（牧）」として派遣する制度が復活し、州牧が事実上の独立領主（群雄）となる契機となった（『後漢書』巻75・劉焉伝）。御史中丞であった韓馥は董卓によって冀州牧に抜擢された。", "yomi": "ぼく", "office_group": "local", "match_terms": ["牧"]}, "相国": {"title": "相国（しょうこく：百官の最高位・前漢の曹参が歴任）", "wiki_title": "相国", "mapping_note": "", "ai_desc": "皇帝を補佐して国政を総覧する最高位の宰相職。前漢では高祖（劉邦）の創業期に蕭何が初めて相国に任じられ、蕭何の没後（恵帝2年＝前193年）に斉相であった曹参が第2代の相国となって「蕭規曹随（蕭何の定めた法規を曹参がそのまま遵守し民を休養させた）」と称えられた（『史記』巻54・曹相国世家）。", "yomi": "しょうこく", "office_group": "central", "match_terms": ["相国", "相國"]}, "県令": {"title": "県令（けんれい：頓丘令など、万戸以上の大県を治める長官）", "wiki_title": "県令", "mapping_note": "", "ai_desc": "漢代の地方行政の基本単位である「県」の長官（人口一万戸以上の大県は「令」、一万戸未満の小県は「長」と称した。『続漢書』百官志五）。洛陽北部尉として蹇碩の叔父を処刑し側近たちから恐れられた曹操は、彼らがこぞって称揚・推薦する形で東郡の頓丘県令へと転出（昇進）させられた。", "yomi": "けんれい", "office_group": "local", "match_terms": ["県令", "縣令"]}, "給事中": {"title": "給事中（きゅうじちゅう：禁中に侍して顧問・章奏審査・政務補佐を掌った近侍官）", "wiki_title": "給事中", "mapping_note": "", "ai_desc": "秦漢では大夫・博士・議郎などに加官されて禁中（「中」）で政事・経義の諮問に与る職であり、曹魏・西晋では第五品の正官または加官として置かれ、皇帝の側近で顧問応対や諸奏事の審査・駁正を掌った（『漢書』巻19上・百官公卿表上、『晋書』巻24・職官志）。西晋初年、旧蜀漢の尚書令であった樊建が給事中に任じられ、武帝・司馬炎の下問に答えて諸葛亮の治国を称え鄧艾の冤罪を訴えた（『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "きゅうじちゅう", "office_group": "central", "match_terms": ["給事中"]}, "羽林中郎将": {"title": "羽林中郎将（うりんちゅうろうじょう：光禄勲に属し宮中宿衛の羽林郎を統率する近衛武官）", "wiki_title": "羽林", "mapping_note": "", "ai_desc": "前漢の武帝が創設した「建章営騎」を宣帝期に「羽林」と改称し、その統率官として置かれた比二千石の近衛武官（『漢書』巻19上・百官公卿表上、『続漢書』百官志二）。「羽の如く疾く、林の如く多し」の意を帯び、戦死者の子孫や良家の子弟からなる宿衛騎兵を率いて皇帝の車駕警護・宿衛を担った。蜀漢では18歳の諸葛瞻が騎都尉から羽林中郎将に遷った（『三國志』巻35・諸葛亮伝附諸葛瞻伝）。", "yomi": "うりんちゅうろうじょう", "office_group": "military", "match_terms": ["羽林中郎将", "羽林中郎將"]}, "翊武将軍": {"title": "翊武将軍（よくぶしょうぐん：武威を輔翼する意を冠した蜀漢の雑号将軍）", "wiki_title": "雑号将軍", "mapping_note": "", "ai_desc": "「翊」は輔佐・護衛の意で、蜀漢において置かれた雑号将軍の一つ。諸葛喬の子である諸葛攀が若くして行護軍・翊武将軍に至った（『三國志』巻35・諸葛亮伝附諸葛喬伝、洪飴孫『三国職官表』）。", "yomi": "よくぶしょうぐん", "office_group": "military", "match_terms": ["翊武将軍", "翊武將軍"]}, "著作郎": {"title": "著作郎（ちょさくろう：中書省〔のち秘書省〕に属して国史編纂を掌った修史官）", "wiki_title": "著作郎", "mapping_note": "", "ai_desc": "曹魏の明帝・太和年間に初めて置かれた国史編纂の専任官（当初は中書省に属し、西晋の恵帝・元康2年に秘書省へ移管、第六品）。大著作郎（著作郎）と佐著作郎があり、西晋初には陳寿が佐著作郎・著作郎として『諸葛氏集』の整理編定や『三國志』の撰述にあたった（『晋書』巻24・職官志、巻82・陳寿伝、『三國志』巻35・諸葛亮伝）。", "yomi": "ちょさくろう", "office_group": "central", "match_terms": ["著作郎", "着作郎"]}, "衛将軍": {"title": "衛将軍（えいしょうぐん：大将軍・驃騎将軍・車騎将軍に次ぎ三公に準ずる高位将軍号）", "wiki_title": "衛将軍", "mapping_note": "", "ai_desc": "大将軍・驃騎将軍・車騎将軍に次ぎ、前後左右の四将軍の上に位置する高位の重号将軍（『続漢書』百官志一）。前漢の文帝期に宋昌が任じられたのに始まり、武帝期には衛青が就任して名を馳せた。後漢末、献帝の長安脱出・東遷に従った董承は衛将軍に任じられ、建安元年（196年）正月に曹操が曹洪を派遣して献帝を迎えようとした際には、袁術の将・萇奴と結んで険要を塞ぎ曹洪の進入を阻んだ。", "yomi": "えいしょうぐん", "office_group": "military", "match_terms": ["衛将軍", "衛將軍", "衞将軍", "衞將軍"]}, "衛尉": {"title": "衛尉（えいい：九卿の一・宮城諸門の衛士と宮中宿衛警備を統括する大臣）", "wiki_title": "衛尉", "mapping_note": "", "ai_desc": "九卿の一つで、宮城の諸門に配された衛士（近衛守備兵）および宮中の宿衛・巡警・武器管理を統括した中央の大臣（『続漢書』百官志二）。袁術の抑留に屈せず、袁術の死後に伝国の玉璽を回収して許都の後漢朝廷へ送り届けた広陵の徐璆は、その忠節によって衛尉に拝され、ついで太常へと昇った（『三國志』巻1・武帝紀注引『先賢行状』）。", "yomi": "えいい", "office_group": "central", "match_terms": ["衛尉", "衞尉"]}, "諸侯": {"title": "諸侯（しょこう：天子から封土と爵位を授けられ藩屏として国を治める封建君主の総称）", "wiki_title": "諸侯", "mapping_note": "", "ai_desc": "周代の封建制度における公・侯・伯・子・男の五等諸侯、および漢代における諸侯王・列侯・地方牧守など王室の藩屏たる地位の総称（『礼記』王制）。魏公冊命文（潘勗撰）が引く「羣后釋位以謀王室」の典拠である『春秋左氏伝』昭公二十六年条「諸侯釋位以間王政」について、後漢の服虔は「諸侯が自国の私政を投げうって王室を補佐すること」と注釈している（『三國志』巻1・武帝紀裴松之注）。", "yomi": "しょこう", "office_group": "title_priv", "match_terms": ["諸侯"]}, "諸侯王": {"title": "諸侯王・藩王（しょこうおう／はんおう：漢代において皇族や創業期の異姓功臣が封ぜられた最高爵位、国内に丞相以下の百官を備えた）", "wiki_title": "諸侯王", "mapping_note": "", "ai_desc": "前漢の高祖・劉邦が楚漢戦争期に韓信・彭越・英布・張耳・臧荼・盧綰・韓王信・呉芮の「異姓八王」を封じ、ついで同姓の劉氏一族を各地に封じた最高位の封爵（『漢書』巻14・諸侯王表、巻19上・百官公卿表上）。前漢初期の諸侯王国には中央朝廷に倣って丞相（のち相と改称）・太傅・内史・御史大夫・中尉および群卿・百官が完備されており、建安18年（213年）5月に曹操が魏公に冊封された際には、魏国にこの「漢初の諸侯王の制」にならって丞相以下の群卿百官を置く特権が認められた（『三國志』巻1・武帝紀）。", "yomi": "しょこうおう", "office_group": "title_priv", "match_terms": ["諸侯王"]}, "謁者僕射": {"title": "謁者僕射（えっしゃぼくや：宮廷儀礼・使節派遣・賓客応接を掌る謁者台の長官、比千石）", "wiki_title": "謁者", "mapping_note": "", "ai_desc": "漢代から魏晋にかけて光禄勲に属した謁者（宮廷の取次・儀礼・冊命使節を掌る官）の統括長官で、秩は比千石（曹魏では第五品）。黄初4年（223年）、曹魏の謁者僕射・諸葛璋が華歆・王朗らとともに諸葛亮へ書簡を送って魏への藩属を促した（『続漢書』百官志二、『三國志』巻35・諸葛亮伝注）。", "yomi": "えっしゃぼくや", "office_group": "central", "match_terms": ["謁者僕射"]}, "護軍": {"title": "護軍（ごぐん）", "wiki_title": "護軍", "mapping_note": "", "ai_desc": "前線の諸将の軍紀を監督し、将軍間の調整を行う役職。", "yomi": "ごぐん", "office_group": "military", "match_terms": ["護軍"]}, "軍師中郎将": {"title": "軍師中郎将（ぐんしちゅうろうじょう：劉備が荊州江南平定後に諸葛亮・龐統らを任じた軍政・参謀統括官）", "wiki_title": "軍師", "mapping_note": "", "ai_desc": "建安13年（208年）の赤壁の戦いの後、荊州江南諸郡を収めた劉備が創設・授与した軍政・参謀職。諸葛亮はこの官をもって零陵・桂陽・長沙三郡の統治と賦税徴収を総督して軍資を支え、のち龐統も同職に拝され、益州平定後に軍師将軍へと進んだ（『三國志』巻35・諸葛亮伝、巻37・龐統伝）。", "yomi": "ぐんしちゅうろうじょう", "office_group": "military", "match_terms": ["軍師中郎将", "軍師中郎將"]}, "軍師将軍": {"title": "軍師将軍（ぐんししょうぐん：建安19年の成都平定後に劉備が諸葛亮に授けた軍政・幕府統括の将軍号）", "wiki_title": "軍師", "mapping_note": "", "ai_desc": "建安19年（214年）に益州を平定した劉備が、軍師中郎将であった諸葛亮を進めた将軍号。諸葛亮はこの官をもって左将軍（劉備）幕府の政務全般を統括（署左将軍府事）し、劉備の出征時には常に成都を鎮守して兵糧・兵員の補給を一手に担い、章武元年（221年）に丞相へ昇るまで帯びた（『三國志』巻35・諸葛亮伝）。", "yomi": "ぐんししょうぐん", "office_group": "military", "match_terms": ["軍師将軍", "軍師將軍"]}, "輔国大将軍": {"title": "輔国大将軍（ほこくだいしょうぐん：国家輔佐の美号を冠した高位の大将軍号）", "wiki_title": "輔国将軍", "mapping_note": "", "ai_desc": "後漢献帝期に伏完らが拝した「輔国将軍」をさらに格上げした重号大将軍（魏・晋制では第二〜三品相当、『晋書』巻24・職官志）。蜀漢では後主・劉禅の景耀年間に、尚書令を務めた董厥が輔国大将軍・南郷侯に進み、行都護・衛将軍の諸葛瞻と並んで尚書事（台事）を参決した（『三國志』巻35・諸葛亮伝附諸葛瞻伝・董厥伝）。", "yomi": "ほこくだいしょうぐん", "office_group": "military", "match_terms": ["輔国大将軍", "輔国大將軍", "輔國大将軍", "輔國大將軍"]}, "郡丞": {"title": "郡丞・丞（ぐんじょう／じょう：会稽丞など郡太守を補佐する次官）", "wiki_title": "", "mapping_note": "", "ai_desc": "郡太守を補佐して郡府の行政・文書を統括する次官（辺郡では「長史」と称した：『続漢書』百官志五）。孫策が餘姚に隠棲していた高岱を招いた際、会稽丞の陸昭を使者として出迎えさせた（『呉録』）。", "yomi": "ぐんじょう", "office_group": "local", "match_terms": ["郡丞"]}, "都督": {"title": "都督（ととく：方面や前線拠点の諸軍を監督・統率する軍事指揮官）", "wiki_title": "都督", "mapping_note": "", "ai_desc": "諸軍を監督・統率する軍事指揮官の職号。後漢末から三国時代にかけて、方面軍や前線拠点の諸部隊を束ねる司令官として「都督」が置かれ、孫権陣営でも主力軍団から各戦線・要害の守備指揮官に至るまで広く都督が任じられた。建安18年（213年）春正月、曹操軍は濡須口へ進軍して孫権の江西の陣営を攻め破り、孫権配下の都督・公孫陽を捕らえた（『三國志』巻1・武帝紀、巻47・呉主伝）。", "yomi": "ととく", "office_group": "military", "match_terms": ["都督"]}, "都護": {"title": "都護・行都護（とご／こうとご：内外の諸軍統率・軍政統括を担った重職）", "wiki_title": "都護", "mapping_note": "", "ai_desc": "本来は前漢の宣帝期に西域諸国を総監するため置かれた「西域都護」に由来する官名（「都」は総べる、「護」は監護する意）。三国時代には孫呉で左右都護が置かれたほか、蜀漢では内外の軍事全般を総括する最高級の軍職として「中都護」「行都護」が設けられ、章武3年に李厳が中都護に任じられ、景耀4年（261年）には諸葛瞻が行都護・衛将軍に進んだ（『三國志』巻35・諸葛亮伝附諸葛瞻伝、巻40・李厳伝）。", "yomi": "とご", "office_group": "military", "match_terms": ["行都護", "都護"]}, "録尚書事": {"title": "録尚書事（ろくしょうしょじ：尚書台の全政務を総攬する事実上の最高宰相権）", "wiki_title": "録尚書事", "mapping_note": "", "ai_desc": "「尚書の事を録（総括）す」の意。後漢では皇帝の秘書機関である「尚書台」に国政の実権が集中したため、太傅・大将軍・三公などの最高位の大臣が「録尚書事」の称号を帯びることで初めて尚書台の上に立って全政務を総覧することができた（『続漢書』百官志一）。建安元年（196年）8月、洛陽へ入京して韓暹を走らせた曹操は、献帝から「仮節鉞」とともに「録尚書事」を授けられ、朝政の中枢を掌握した。", "yomi": "ろくしょうしょじ", "office_group": "title_priv", "match_terms": ["録尚書事", "録尙書事", "錄尚書事", "錄尙書事"]}, "鎮南将軍": {"title": "鎮南将軍（ちんなんしょうぐん：四鎮将軍の一、荊州など南方方面の軍事・鎮撫を統括する重号将軍）", "wiki_title": "四鎮将軍", "mapping_note": "", "ai_desc": "後漢末から三国・魏晋時代にかけて、鎮東・鎮南・鎮西・鎮北の「四鎮将軍」の一角として置かれた重号将軍（魏・西晋制で第二〜三品、位次は四征将軍に次ぐ。『晋書』巻24・職官志、『通典』巻29）。主として荊州など南方戦線の都督・州刺史が帯び、後漢末に劉表、曹魏で曹仁・毌丘倹、西晋では羊祜・杜預・劉弘らが鎮南将軍として襄陽を鎮守した（『三國志』巻6・劉表伝、巻35・諸葛亮伝注引『蜀記』、『晋書』巻66・劉弘伝）。", "yomi": "ちんなんしょうぐん", "office_group": "military", "match_terms": ["鎮南将軍", "鎮南將軍", "鎭南将軍", "鎭南將軍"]}, "鎮西将軍": {"title": "鎮西将軍（ちんせいしょうぐん：四鎮将軍の一、西方辺境の鎮撫を冠した高位将軍号）", "wiki_title": "四鎮将軍", "mapping_note": "", "ai_desc": "「鎮東・鎮南・鎮西・鎮北」の四方を冠する高位将軍号（四鎮将軍）の一つ。後漢末に設置され、四征将軍に次ぎ前後左右将軍と同格〜上位に位置づけられた重号将軍（魏制では第二〜三品、『宋書』巻39・百官志上） ote": "", "ai_desc": "諸葛亮が祁山・斜谷道などの険阻な山岳路における兵糧輸送の困難を克服するために考案・製作した木製の運搬具。建興9年（231年）の祁山出兵で「木牛」を用い、建興12年（234年）の斜谷・五丈原出兵で「流馬」を用いて軍糧を運んだ。『諸葛亮集』には各部の構造と寸法を詳述した「作木牛流馬法」が伝わる（『三國志』巻35・諸葛亮伝および裴注）。", "match_terms": ["木牛流馬", "木牛", "流馬"], "target_records": ["v35_p15_1", "v35_p16_1", "v35_p20_1", "v35_p20_2", "v35_p42_1"]}, "晋陽秋": {"title": "晋陽秋（しんようしゅう：東晋の孫盛が撰した西晋初から東晋哀帝期に至る編年体史書）", "category": "史書・典籍", "wiki_title": "", "mapping_note": "", "ai_desc": "東晋の歴史家・孫盛（字は安国）が著した西晋泰始年間から東晋哀帝期に至る全三十二巻の編年体史書（『晋書』巻82・孫盛伝、『隋書』経籍志二、現在は散佚し逸文が伝わる。「春秋」を雅称・避諱により「陽秋」と改めた書名）。五丈原の諸葛亮の本営に赤く芒角のある流星が落ちてまもなく諸葛亮が没したとする記事が裴松之注に引用される（『三國志』巻35・諸葛亮伝注）。", "match_terms": ["晋陽秋", "晉陽秋"], "target_records": ["v35_p16_4"]}, "忠武侯": {"title": "忠武侯（ちゅうぶこう：建興12年8月に蜀漢の丞相・諸葛亮へ追贈された諡号）", "category": "諡号・礼制", "wiki_title": "", "mapping_note": "", "ai_desc": "建興12年（234年）8月、五丈原の陣中で病没した蜀漢の丞相・武郷侯・諸葛亮に対し、後主・劉禅が使持節・左中郎将の杜瓊を遣わして贈った諡号。身を忘れて国に尽くした篤誠（忠）と、連年六師を整えて威武を振るった功烈（武）を兼ね称えた美諡であり、後世「諸葛忠武侯」と尊称された（『三國志』巻35・諸葛亮伝）。", "match_terms": ["忠武侯"], "target_records": ["v35_p18_1"]}, "連弩": {"title": "連弩・元戎（れんの／げんじゅう：諸葛亮が改良を加え鉄矢十本を同時発射可能にした多連装弩）", "category": "軍事・兵器", "wiki_title": "連弩", "mapping_note": "", "ai_desc": "諸葛亮が古来の連装弩に工夫・改良を加えて完成させた新式弩兵器の名称。「元戎」と名づけられ、長さ八寸の鉄製の矢を用い、一丁の弩から一度に十本の矢を斉射できる構造を備えており、蜀漢軍の有力な制圧兵器として威力を発揮した（『三國志』巻35・諸葛亮伝および注引『魏氏春秋』）。", "match_terms": ["連弩", "元戎"], "target_records": ["v35_p20_1", "v35_p20_2"]}, "八陣図": {"title": "八陣図（はちじんず：諸葛亮が古来の兵法を推演して体系化した八陣の陣法図）", "category": "軍事・兵器", "wiki_title": "八陣", "mapping_note": "", "ai_desc": "古来の八陣の兵法をもとに諸葛亮が推演・体系化した戦闘陣法およびその図譜。天・地・風・雲・龍・虎・鳥・蛇の八陣を自在に変化させて奇正を運用する法とされ、益州巴東郡魚復県（永安）の江岸や漢中郡沔陽（定軍山麓）、成都近郊の弥牟鎮などに石を積んで陣形を示した遺構が伝わる（『三國志』巻35・諸葛亮伝、『水経注』巻33・江水、『晋書』巻98・桓温伝）。", "match_terms": ["八陣図", "八陣圖", "八陣", "八陳"], "target_records": ["v35_p20_1", "v35_p42_1"]}, "景耀": {"title": "景耀（けいよう：蜀漢の第2代皇帝・後主劉禅の3番目の元号、258年〜263年）", "category": "年号・時代", "wiki_title": "景耀", "mapping_note": "", "ai_desc": "蜀漢の後主・劉禅の3番目の元号（258年〜263年7月）。延熙21年（258年）に改元され、景耀3年（260年）〜4年（261年）に関羽・張飛・馬超・龐統・黄忠・趙雲ら功臣への追諡が行われ、
