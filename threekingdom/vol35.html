  const PERSONS_INFO = {"廉頗": {"wiki_title": "廉頗", "ai_desc": "戦国時代の趙の名将（生没年不詳）。恵文王に仕えて斉・魏・秦の軍を連破し、上卿となって「信平君」に封じられた。当初は弁舌の功で己より上位に就いた藺相如を憎んだが、秦への抑止力を優先して争いを避ける藺相如の忠心に恥じ入り、茨を背負って謝罪し「刎頸の交わり」を結んだ。長平の戦いでは堅塁を築いて秦軍を防いだが孝成王により趙括と交代させられ、のち燕軍を大破して復権したものの、悼襄王の代に讒言で魏・楚へ亡命して没し、李牧と並び「頗・牧」と称された（『史記』巻81・廉頗藺相如列伝）。", "yomi": "れんぱ", "name": "廉頗（れんぱ：戦国時代・趙の上卿・信平君、藺相如と「刎頸の交わり」を結び李牧と並び「頗・牧」と称された名将）", "role": "戦国時代・趙の上卿・将軍・信平君"}, "申生": {"wiki_title": "申生", "ai_desc": "春秋時代の晋の献公の太子（？〜前656年）、諡は共太子。献公の寵姫・驪姫が実子の奚斉を世嗣に立てようとして祭肉に毒を盛ったと讒言した際、老父の心を傷つけるのを忍びず出奔や弁明を拒み、曲沃で自害した。諸葛亮は「申生は内に在りて危うく、重耳は外に在りて安し」として劉琦に外鎮を暗示した（『春秋左氏伝』僖公四年、『史記』巻39・晋世家）。", "yomi": "しんせい", "name": "申生（しんせい：春秋時代・晋の献公の太子、驪姫の讒言により国内に留まり自害した悲劇の世嗣）", "role": "春秋時代・晋の太子（共太子）"}, "諸葛喬": {"wiki_title": "諸葛喬", "ai_desc": "字は伯松、本来の字は仲慎、徐州琅邪郡陽都県の人（204年〜228年）。孫呉の大将軍・諸葛瑾の次男で、諸葛恪（字は元遜）の弟。兄の諸葛恪とともに若くして名を知られ、才気は兄に及ばないが篤実な資質と行いは兄に勝ると評された。当初まだ子のなかった叔父の諸葛亮が継嗣に請うたため、諸葛瑾が孫権に啓上して蜀へ遣わされ、諸葛亮の嫡子として字を伯松と改められた。駙馬都尉に拝されて諸葛亮の漢中駐屯に従い、諸将の子弟と栄辱をともにすべく兵五、六百人を督して谷中の兵糧輸送に従事したが、建興6年（228年）に年二十五で早世した（『三國志』巻35・諸葛亮伝附諸葛喬伝）。", "yomi": "しょかつきょう", "name": "諸葛喬（しょかつきょう：字は伯松・旧字は仲慎、諸葛瑾の次男・諸葛亮の養嗣子、蜀漢の駙馬都尉）", "role": "蜀漢の駙馬都尉（諸葛瑾の次男・諸葛亮の養嗣子）"}, "太公望": {"wiki_title": "太公望", "ai_desc": "東海のほとりの出身で、先祖が四岳として禹の治水を佐け呂に封じられたことから呂尚（呂望）と称した人物。渭水のほとりで釣りをしていたところを西伯昌（周の文王）に見出され、「吾が太公が待ち望んでいた人（太公望）」として師に迎えられたと伝わる。文王の没後は武王を補佐して「師尚父」と尊ばれ、牧野の戦いで白旄と黄鉞を執って殷の紂王を討ち滅ぼし、功績第一として斉の営丘（臨淄）に封じられた。成王の代に管・蔡の乱が起こると、召公奭を通じて東は海・西は黄河・南は穆陵・北は無棣に至る五侯九伯の専征権を賜り、東海の表率となった（『史記』巻32・斉太公世家、『春秋左氏伝』僖公四年・襄公二十九年）。", "yomi": "たいこうぼう", "name": "太公望・呂望（たいこうぼう／りょぼう：姓は姜、氏は呂、名は尚、斉の太公、周の文王・武王・成王を輔佐した太師・斉国の始祖）", "role": "西周の太師・建国の元勲（斉国の初代君主・斉太公）"}, "張昭": {"wiki_title": "張昭", "ai_desc": "張昭（ちょうしょう）：字は子布、徐州彭城国の人（156年〜236年）。戦乱を避けて江東へ渡っていた北方名士の筆頭格。江東を平定した孫策に三顧の礼で迎えられて長史・撫軍中郎将となり、文武の政務を一手に委ねられて張紘らとともに孫策の「謀主」となった（『三國志』巻52・張昭伝）。", "yomi": "ちょうしょう", "name": "張昭（ちょうしょう）"}, "華歆": {"wiki_title": "華歆", "ai_desc": "青州平原国高唐県の人（157年〜231年）。若い頃より高潔な徳行で知られ、管寧・邴原とともに「一龍」（華歆が龍頭）と称された。何進に召されて尚書郎となり、下邽令を経て豫章太守として善政を敷き、孫策の江東平定に際して礼遇を受けた。孫策没後に曹操の上表によって中央へ召還され、議郎・参司空軍事・尚書・侍中を経て荀彧に代わって尚書令となった。建安19年（214年）11月の伏皇后廃位事件では、『曹瞞伝』によれば曹操の命で兵を率いて入宮し、壁中に隠れた伏皇后を引き出して収捕した（『後漢書』伏皇后紀では御史大夫・郗慮の副使として入宮）。のち魏国の御史大夫・相国となり、文帝（曹丕）が即位すると司徒、明帝（曹叡）の代には太尉・博平侯に進み、没後に敬侯と諡された（『三國志』巻1・武帝紀注引『曹瞞伝』、巻13・華歆伝、『後漢書』巻10下・献帝伏皇后紀）。", "yomi": "かきん", "name": "華歆（かきん：字は子魚、青州平原国高唐県の人、豫章太守・尚書令、のち曹魏の相国・司徒・太尉・博平敬侯）", "role": "後漢末〜曹魏の重臣（豫章太守→尚書令・御史大夫→魏の相国・司徒・太尉・博平敬侯）"}, "習隆": {"wiki_title": "", "ai_desc": "荊州襄陽郡の人（生没年不詳、東晋の歴史家・習鑿歯の一族）。蜀漢に仕えて歩兵校尉に至った。諸葛亮の没後、各地の民衆や異民族が道端や野辺で私的に祭祀を続けていた状況を受け、景耀6年（263年）春、中書郎・向充らとともに後主・劉禅へ上表し、墓所に近い漢中郡沔陽県に官廟を建てて私祀を正礼に改めるよう進言して裁可された（『三國志』巻35・諸葛亮伝注引『襄陽記』）。", "yomi": "しゅうりゅう", "name": "習隆（しゅうりゅう：襄陽出身の蜀漢の歩兵校尉、景耀6年に向充らと上表し沔陽への諸葛亮廟建立を実現させた官僚）", "role": "蜀漢の歩兵校尉（襄陽の人）"}, "老子": {"wiki_title": "老子", "ai_desc": "春秋時代の思想家で道家の祖（生没年不詳、姓は李、名は耳、字は聃と伝えられる）。周王室の守蔵室の史（図書管理官）を務め、無為自然や道・徳を説く『老子』（『道徳経』）上下篇を著したとされる。第33章の「人を知る者は智なり、自ら知る者は明なり」の語が裴松之の諸葛亮論に引用される（『史記』巻63・老子韓非列伝）。", "yomi": "ろうし", "name": "老子・老氏（ろうし：春秋時代の思想家・道家の祖、『老子』の著者とされる哲人）", "role": "春秋時代の思想家・道家の祖"}, "董允": {"wiki_title": "董允", "ai_desc": "字は休昭、荊州南郡枝江県の人（？〜246年）。掌軍中郎将・董和の子。劉禅の皇太子時代から費禕とともに舎人・洗馬を務め、後主即位後に黄門侍郎となった。建興5年（227年）に諸葛亮が北伐に際し『出師表』で郭攸之・費禕とともに宮中の事を託し、まもなく侍中・虎賁中郎将へ進んで匡諫・献替を一身に担い、後に尚書令・輔国大将軍に至り宦官の黄皓を終生抑え抜いた。蜀漢の「四英（四相）」の一人（『三國志』巻35・諸葛亮伝、巻39・董允伝）。", "yomi": "とういん", "name": "董允（とういん：字は休昭、董和の子、蜀漢の侍中・尚書令、『出師表』に挙げられた「四相」の一人）", "role": "蜀漢の黄門侍郎・侍中・尚書令（董和の子）"}, "田横": {"wiki_title": "田横", "ai_desc": "戦国斉の王族・秦末漢初の斉王（？〜前202年）。秦末に従兄の田儋・兄の田栄に継いで斉を再興し、韓信に敗れたのちは部下五百余人とともに海島へ拠った。漢の高祖・劉邦から召喚されると、漢帝に臣事する屈辱を拒んで洛陽の東三十里の尸郷で自刎し、海島の五百人も全員殉死した。「義を守りて辱められず」の象徴として諸葛亮が孫権説得の際に引いた（『史記』巻94・田儋列伝）。", "yomi": "でんおう", "name": "田横（でんおう：秦末漢初の斉王、劉邦への臣従を潔しとせず自刎して節義を貫いた壮士）", "role": "秦末漢初の斉王"}, "諸葛豊": {"wiki_title": "諸葛豊", "ai_desc": "字は少季、琅邪郡の人（生没年不詳）。前漢元帝期の司隷校尉で、諸葛亮・諸葛瑾らの先祖。経術に明るく剛直・厳正な法執行で知られ、権貴を恐れず弾劾したため長安で「諸葛に逢うこと間（ま）なし」と畏怖されたが、のち外戚の許章らと対立して城門校尉へ左遷され庶人に落とされた（『漢書』巻77・諸葛豊伝、『三國志』巻35・諸葛亮伝）。", "yomi": "しょかつほう", "name": "諸葛豊（しょかつほう：字は少季、琅邪郡出身の前漢元帝期の司隷校尉、剛直で知られた諸葛亮の先祖）", "role": "前漢の司隷校尉（諸葛亮の先祖）"}, "郭淮": {"wiki_title": "郭淮", "ai_desc": "後漢末から三国魏にかけての武将。太原郡陽曲県（山西省太原市）の人、字は伯済。建安24年（219年）の定軍山の戦いで夏侯淵が戦死した際、混乱する全軍をまとめて張郃を仮の主将に推戴し戦線を安定させた。以後約30年にわたり雍州刺史・征西将軍・車騎将軍として関中・隴右を守り、蜀の諸葛亮・姜維の北伐を阻んだ（『三國志』巻26・郭淮伝、巻17・張郃伝）。", "yomi": "かくわい", "name": "郭淮（かくわい）"}, "臧文仲": {"wiki_title": "臧文仲", "ai_desc": "春秋時代の魯国の重臣・大夫（？〜前617年、姓は姫、氏は臧孫、名は辰、諡は文、字は仲）。魯の荘公・閔公・僖公・文公の四代に歴仕して国政を担い、博識と名言をもって諸侯の間に重きをなした。その死後、魯の叔孫豹（穆叔）が「太上は徳を立て、その次は功を立て、その次は言を立つ（三不朽）」を論じた際、「魯に先大夫ありて臧文仲と曰う、既に没したれども、その言は立てり」と評され、立言不朽の代表的人物として後世に称えられた（『春秋左氏伝』文公二年・襄公二十四年、『論語』公冶長・衛霊公、『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "ぞうぶんちゅう", "name": "臧文仲・臧孫辰（ぞうぶんちゅう：春秋時代・魯の賢大夫、没後も「立言」が不朽に残ったと称えられた名臣）", "role": "春秋時代・魯の大夫（名は辰、臧孫氏）"}, "張飛": {"wiki_title": "張飛", "ai_desc": "幽州涿郡の人（?〜221年）、字は益徳（『三國志』巻36・張飛伝）。若き日より関羽とともに劉備に兄事して各地を転戦し、長坂の戦いでは二十騎で殿軍を務め橋を断って曹操の追撃軍を睨み止め、益州平定戦・巴西宕渠の戦い（張郃撃破）でも大功を立てて「万人の敵」「熊虎の将」と恐れられた。建安22年（217年）冬、劉備の漢中侵攻に先立って馬超・呉蘭・雷銅らとともに北の涼州武都郡・下弁へ進出して曹操軍の背後を牽制したが、建安23年（218年）春に曹洪・曹休らに呉蘭が撃破されると馬超とともに漢中へ退いた。のち章武元年（221年）、関羽の仇を討つ東征出陣の直前に部下の張達・範強に暗殺された。", "yomi": "ちょうひ", "name": "張飛（ちょうひ：字は益徳、涿郡出身の劉備創業の猛将、関羽と並び「万人敵」と称され下弁・巴西方面に出陣）", "role": "劉備配下の宿将（征虜将軍・巴西太守・新亭侯→蜀漢の車騎将軍・司隷校尉・西郷侯）"}, "馬謖": {"wiki_title": "馬謖", "ai_desc": "後漢末から三国蜀にかけての参謀・武将。襄陽郡宜城県（湖北省宜城市）の人、字は幼常。侍中・馬良の弟。才気と軍略の議論を諸葛亮に愛されたが、劉備は臨終の際に「言が実に過ぎるゆえ大任を委ねるな」と戒めた。建興6年／太和2年（228年）の第一次北伐で街亭を守った際、山上に布陣して給水路を魏の張郃に断たれ大敗し、獄中で没した（『三國志』巻39・馬良伝附馬謖伝、巻17・張郃伝）。", "yomi": "ばしょく", "name": "馬謖（ばしょく）"}, "周公": {"wiki_title": "周公旦", "ai_desc": "西周王朝草創期の政治家・王族で、文王（姫昌）の四男、武王（姫発）の同母弟。兄・武王を助けて殷の紂王を討ち、武王が病に倒れた際には自ら身代わりとなることを三王の霊に祈ってその祝冊を「金縢」の匱に納めた。武王の崩御後、幼少の成王に代わって国政を摂行したため、弟の管叔・蔡叔らが「周公は成王に不利を図っている」と流言を放って殷の遺民・武庚とともに反乱を起こしたが、周公は東征してこれを鎮圧し、また成王が金縢の書を開いて周公の忠誠を知ったことで疑念が氷解した。成王が長じると政権を返上し、礼楽制度を定めて周王朝の基礎を固めたとされる（『尚書』金縢篇、『史記』巻33・魯周公世家）。", "yomi": "しゅうこう", "name": "周公（しゅうこう：周公旦、周の文王の子・武王の弟、幼主・成王を摂政として補佐し『金縢の書』の故事を残した聖人）", "role": "西周初期の王族・摂政（姓は姫・名は旦、文王の四男・武王の同母弟、魯の始祖）"}, "孝文帝": {"wiki_title": "文帝 (前漢)", "ai_desc": "前漢の第5代皇帝（在位：前180年〜前157年、諱は恒、高祖・劉邦の四男、廟号は太宗、諡号は孝文皇帝）。呂氏一族の乱の後に代王から迎えられて即位し、倹約・減税と刑罰緩和によって「文景の治」の礎を築いた。北方の強盛な匈奴に対しては、国力の充実を優先して謙虚な文辞の書簡と和親の礼をもって接し、軽率な全面対決を避けて辺境の安定を図った（『史記』巻10・孝文本紀、『漢書』巻4・文帝紀）。", "yomi": "こうぶんてい", "name": "孝文帝・文帝（こうぶんてい：諱は恒、前漢第5代皇帝、「文景の治」を開き匈奴に謙辞をもって和親した名君）", "role": "前漢第5代皇帝（太宗孝文皇帝）"}, "宗預": {"wiki_title": "宗預", "ai_desc": "字は徳艶、荊州南陽郡安衆県の人（？〜264年）。建安年間に張飛に従って入蜀し、建興初年に丞相・諸葛亮から主簿ついで参軍・右中郎将に抜擢された。諸葛亮の死後、呉が白帝への増兵を警戒した際に東呉へ使し、率直明快な弁論で孫権に深く敬愛されて「鄧芝に次ぐ両国の好を結ぶ使者」と称えられた。のち侍中・尚書・屯騎校尉・後将軍（永安鎮守）・征西大将軍・関内侯を歴任し、蜀漢滅亡後の咸熙元年（264年）に洛陽へ移送される途上で病没した（『三國志』巻45・宗預伝、巻35・諸葛亮伝附董厥伝）。", "yomi": "そうよ", "name": "宗預（そうよ：字は徳艶、南陽安衆出身の蜀漢の外交官・征西大将軍、たびたび呉へ使し孫権に深く敬愛された重臣）", "role": "蜀漢の侍中・尚書・後将軍・征西大将軍・関内侯"}, "孟建": {"wiki_title": "孟建", "ai_desc": "字は公威、豫州汝南郡の人（生没年不詳）。建安初年に荊州で諸葛亮・石韜・徐庶らとともに遊学し、郷里を思って北帰しようとした際に諸葛亮から惜別の言葉を贈られた。のち曹魏に仕えて温恢に重用され、丞相東曹属を経て涼州刺史・征東将軍に至った（『三國志』巻15・温恢伝、巻35・諸葛亮伝注引『魏略』）。", "yomi": "もうけん", "name": "孟建（もうけん：字は公威、汝南出身の官僚・将軍、荊州で諸葛亮らと遊学し曹魏の涼州刺史・征東将軍に至る）", "role": "曹魏の涼州刺史・征東将軍（諸葛亮の学友）"}, "魏延": {"wiki_title": "魏延", "ai_desc": "字は文長、荊州義陽郡の人（？〜234年）。部曲として劉備に随行して入蜀し数多の戦功を立て、建安24年（219年）の漢中平定後に抜擢されて都督漢中・鎮遠将軍・漢中太守となり、十余年にわたり北方の要衝・漢中を鎮守した。建興年間の北伐では前軍師・征西大将軍・南鄭侯に進み、たびたび精兵一万を請うて別道より潼関へ出る奇策（「子午谷の計」）を献じたが諸葛亮に制止された。諸葛亮の没後、長史・楊儀と対立して敗死した（『三國志』巻35・諸葛亮伝注、巻40・魏延伝）。", "yomi": "ぎえん", "name": "魏延（ぎえん：字は文長、義陽出身の蜀漢の征西大将軍・漢中太守、漢中を鎮守し北伐で活躍した猛将）", "role": "蜀漢の鎮遠将軍・漢中太守・征西大将軍"}, "陳式": {"wiki_title": "陳式", "ai_desc": "後漢末から三国蜀にかけての武将。劉備に従って漢中攻略戦に参加し、建安23年（218年）に馬鳴閣道を遮断しようとしたが魏の徐晃に撃破された。章武2年（222年）の夷陵の戦いでは水軍を率い、建興7年（229年）には諸葛亮の命で武都・陰平の二郡を攻略・平定した（『三國志』巻17・徐晃伝、巻32・先主伝、巻35・諸葛亮伝）。", "yomi": "ちんしき", "name": "陳式（ちんしき）"}, "李興": {"wiki_title": "李密 (西晋)", "ai_desc": "字は雋石、一名は安、益州犍為郡武陽県の人（生没年不詳）。『陳情表』で名高い漢中太守・李密の子（兄は李賜、弟は李盛）。父に継ぐ文才で知られ、西晋の太傅掾を務めた。永興年間（304〜306年）、荊州を鎮守する鎮南将軍・劉弘が隆中の諸葛亮故宅を訪れて石碑を立て里門を表彰した際、劉弘の命を受けて格調高い四言・六言の頌徳碑文（「諸葛亮故宅銘」）を撰した（『晋書』巻66・劉弘伝、巻88・李密伝附伝、『華陽国志』巻11、『三國志』巻35・諸葛亮伝注引『蜀記』・王隠『晋書』）。", "yomi": "りこう", "name": "李興（りこう：字は雋石・一名は安、犍為武陽出身の西晋の太傅掾、李密の子、隆中の「諸葛亮故宅銘」の作者）", "role": "西晋の太傅掾・文人（李密の子）"}, "楽毅": {"wiki_title": "楽毅", "ai_desc": "戦国時代の名将。中山国霊寿の人で、魏の将軍・楽羊の後裔。燕の昭王が賢者を招いていると聞いて魏から燕へ赴き、亜卿ついで上将軍となって趙・楚・韓・魏・燕の五国連合軍を統率し、前284年に済西で斉軍を大破して臨淄を陥れ、五年の間に斉の七十余城を下して昌国君に封じられた。前279年に昭王が没して子の恵王が立つと、斉の田単の反間計と恵王の不信によって更迭され、趙へ亡命して望諸君に封じられた。趙の恵文王が楽毅とともに燕を攻めようと持ちかけた際、楽毅は平伏して泣き、「臣が昭王に仕えたのは大王に仕えるのと同じです。もし罪を得て他国に放逐されても死ぬまで忍ぶのみであり、趙の奴隷をさえ謀るに忍びないのに、まして燕の後嗣に対してできましょうか」と断り、また恵王への返書『報遺燕恵王書』でも先王への忠誠を述べた（『戦国策』燕策二、『史記』巻80・楽毅列伝）。", "yomi": "がくき", "name": "楽毅（がくき：戦国時代の燕の上将軍・昌国君、昭王に仕えて斉の七十余城を下し趙への亡命後も燕への節義を貫いた名将）", "role": "戦国時代の燕の上将軍・昌国君、のち趙の望諸君（中山国霊寿の人、魏将・楽羊の後裔）"}, "耿純": {"wiki_title": "耿純", "ai_desc": "字は伯山、冀州鉅鹿郡宋子県の人（？〜37年）。後漢創業の功臣「雲台二十八将」の一人。一族を率いて劉秀（光武帝）に従い王郎討伐などで功を立てた。建武元年（25年）、群臣の即位勧進を光武帝が再三辞退した際、「従われねば士大夫はそれぞれ去って別の主を求めましょう」と切言して即位を決断させた。のち東郡太守・東光侯に至る（『後漢書』巻21・耿純伝、『三國志』巻35・諸葛亮伝）。", "yomi": "こうじゅん", "name": "耿純（こうじゅん：字は伯山、鉅鹿宋子出身の後漢創業功臣、切言により光武帝に即位を決断させた武将）", "role": "後漢の東郡太守・東光成侯（雲台二十八将）"}, "陳震": {"wiki_title": "陳震", "ai_desc": "字は孝起、荊州南陽郡の人（？〜235年）。劉備の荊州牧時代に召し出されて諸郡の太守を歴任し、蜀漢建国後に尚書・尚書令へ進んだ。建興7年（229年）、孫権が皇帝を称した際、諸葛亮の方針により衛尉として呉へ慶賀の使者に赴き、武昌で孫権と壇に登って天下二分の盟約を結んだ。諸葛亮は兄・諸葛瑾への書簡でその忠純・篤実な人柄を称賛している（『三國志』巻35・諸葛亮伝注、巻39・陳震伝）。", "yomi": "ちんしん", "name": "陳震（ちんしん：字は孝起、南陽出身の蜀漢の尚書令・衛尉、孫権の帝位即位を慶賀する使者を務めた重臣）", "role": "蜀漢の尚書令・衛尉・城陽亭侯（南陽の人）"}, "后稷": {"wiki_title": "后稷", "ai_desc": "名は棄（き）、母は有邰氏の女・姜嫄（『史記』巻4・周本紀、『詩経』大雅・生民）。幼少より麻や菽（豆）・五穀の栽培に天賦の才を示し、帝堯に登用されて農師となり、ついで帝舜から「后稷（穀物・農事を司る長官）」に任じられて邰に封じられ、天下の民に播種・農耕を教えて飢えから救った。周の文王・武王の遠祖にあたり、後世には五穀の神（「稷」）としても社とともに国家の最高祭壇に祀られた。", "yomi": "こうしょく", "name": "后稷・棄（こうしょく：名は棄、帝堯・帝舜に仕えて農耕・五穀播種を司った周王朝の始祖）", "role": "古代の農官の長（稷官）・周王室（姫姓）の始祖"}, "禹": {"wiki_title": "禹", "ai_desc": "鯀の子（『史記』巻2・夏本紀、『尚書』禹貢・皋陶謨）。父・鯀が堤防で水を塞ぐ治水に失敗して処罰された後を継ぎ、帝堯・帝舜に仕えて十三年にわたり私宅の前を通り過ぎても中に入らぬほどの刻苦精励を重ね、山を切り開き河道を浚渫して海へ導く疎通法によって大洪水を平定し、天下の九州と貢賦を定めた。その功徳により帝舜から禅譲を受けて夏王朝を開き、古来より后稷と並んで「稷・禹」と称えられた。", "yomi": "う", "name": "禹・夏禹（う：姓は姒、名は文命、黄河の大洪水を治めて九州を画定した夏王朝の創始者）", "role": "帝舜の司空→夏王朝の初代王"}, "李厳": {"wiki_title": "李厳 (三国)", "ai_desc": "字は正方、建興8年（230年）に李平と改名、荊州南陽郡の人（？〜234年）。劉璋ついで劉備に仕えて興古・犍為太守などで治績と武功を挙げ、章武3年（223年）に永安で諸葛亮とともに後主・劉禅の託孤を受けて尚書令・中都護・統内外軍事となった。建興4年に前将軍、建興8年に驃騎将軍へ進んだが、建興9年（231年）の祁山北伐に際し長雨による軍糧輸送の不備を糊塗するため虚偽の退軍要請と上奏を行った罪で、諸葛亮らの連名上表により廃されて庶人となり梓潼郡へ流された。建興12年に諸葛亮の訃報を聞くと復職の望みが絶たれたことを悲憤し病死した（『三國志』巻40・李厳伝、巻35・諸葛亮伝）。", "yomi": "りげん", "name": "李厳・李平（りげん／りへい：字は正方、諸葛亮とともに託孤を受けた蜀漢の中都護・驃騎将軍、のち軍糧問題で廃される）", "role": "蜀漢の尚書令・中都護・前将軍・驃騎将軍（のち李平と改名）"}, "孫策": {"wiki_title": "孫策", "ai_desc": "揚州呉郡富春県の人（175年〜200年）。破虜将軍・孫堅の長男で、呉の大帝・孫権の兄。父・孫堅が劉表との戦いで戦死した後、初平4年（193年）〜興平元年（194年）頃に寿春の袁術のもとへ赴いて父の旧部曲千余人を返還され、袁術の命を受けて長江を渡り、揚州刺史・劉繇、呉郡の厳白虎、会稽太守・王朗らを次々と撃破して数年で江東六郡の基盤を平定した。袁術が帝位を僭称すると絶縁して独立し、曹操の上表により討逆将軍・呉侯に封じられた。建安5年（200年）、曹操が官渡で袁紹と対峙して手薄になった隙を突き、密かに軍を整えて許都奇襲と献帝奉迎を計画したが、出陣前に旧敵である故呉郡太守・許貢の食客（刺客）に襲撃され26歳で没した（『三國志』巻1・武帝紀、巻46・孫破虜討逆伝）。", "yomi": "そんさく", "name": "孫策（そんさく：字は伯符、呉郡富春県出身の討逆将軍・呉侯、孫堅の長男・孫権の兄、江東を平定し呉の礎を築く）", "role": "後漢末の折衝校尉・殄寇将軍・会稽太守・討逆将軍・呉侯（揚州呉郡富春県の人、孫堅の長男）"}, "常璩": {"wiki_title": "常璩", "ai_desc": "字は道将、益州蜀郡江原県の人（291年頃〜361年頃）。成漢（李氏政権）で散騎常侍・著作郎として史官を務め、東晋の永和3年（347年）に征西大将軍・桓温が成漢を討った際、主君の李勢に降伏を勧めて東晋に帰順した。東晋移住後に古今の巴・蜀・漢中・南中の歴史・地理・人物を体系化した地方史の名著『華陽国志』全十二巻および成漢史『漢之書』十巻を著した（『晋書』巻121・李勢載記、『隋書』経籍志二、『三國志』巻35・諸葛亮伝注引『異同記』）。", "yomi": "じょうきょ", "name": "常璩（じょうきょ：字は道将、蜀郡江原出身の東晋・成漢の歴史家、巴蜀地方史の名著『華陽国志』の撰者）", "role": "成漢の散騎常侍・東晋の歴史家（『華陽国志』撰者）"}, "郭攸之": {"wiki_title": "郭攸之", "ai_desc": "字は演長、荊州南陽郡の人（生没年不詳）。器量と学業によって当時に名を知られ、蜀漢で侍中に任じられた。建興5年（227年）、諸葛亮は北伐に臨んで奉った『出師表』において費禕・董允と並べて「みな善良誠実であり、志慮は忠純である」と推賞し、宮中の事柄を大小となく諮問すべき適任者に挙げた。人柄が素直で温和であったため、宮中における献替・諫言の実務は主に董允が担った（『三國志』巻35・諸葛亮伝、巻39・董允伝および注）。", "yomi": "かくゆうし", "name": "郭攸之（かくゆうし：字は演長、南陽出身の蜀漢の侍中、『出師表』で費禕・董允と並び推賞された良臣）", "role": "蜀漢の侍中（南陽の人）"}, "龐統": {"wiki_title": "龐統", "ai_desc": "劉備配下の謀臣・軍師中郎将（179年〜214年）、字は士元、襄陽の人。諸葛亮と並び重用されて入蜀戦略を主導したが、建安19年（214年）の雒城包囲戦で流れ矢に当たり戦死し、景耀3年（260年）に靖侯と追諡された（『三國志』巻37・龐統伝）。", "yomi": "ほうとう", "name": "龐統（ほうとう：字は士元、諸葛亮と並び称された劉備の軍師中郎将、雒城で戦死、諡は靖侯）", "role": "劉備配下の軍師中郎将・関内侯（諡は靖侯）"}, "劉繇": {"wiki_title": "劉繇", "ai_desc": "青州東萊郡牟平県の人（156年〜197年）。前漢の斉孝王の少子・牟平侯劉渫の末裔で、太尉・劉寵の甥、兗州刺史・劉岱の同母弟。19歳のときに叔父を盗賊から救出して名を挙げ、孝廉・郎中・下邑県長となり、権門の請託を拒んで官を棄てた清流派の名士。後に揚州刺史に任じられて曲阿を拠点とし、袁術および袁術配下の孫策と長江下流で激しく戦ったが敗れて豫章へ退き、その地で病没した。『三國志』呉書（巻49）に専伝（劉繇太史慈士燮伝）が立てられている。", "yomi": "りゅうよう", "name": "劉繇（りゅうよう：字は正礼、東萊郡牟平県出身の揚州刺史・振武将軍、孫策と江東の覇権を争った名門宗室）", "role": "後漢末の揚州刺史・揚州牧・振武将軍（東萊郡牟平県の人、兗州刺史・劉岱の弟）"}, "孫権": {"wiki_title": "孫権", "ai_desc": "揚州呉郡富春県の人（182年〜252年）、字は仲謀。破虜将軍・孫堅の次男で、討逆将軍・孫策の弟。建安5年（200年）に兄・孫策が刺客に襲われて急逝すると、わずか19歳で江東六郡の統治を引き継ぎ、張昭・周瑜・魯粛ら文武の英才を任用し、曹操の上表によって討虜将軍・領会稽太守となった。建安13年（208年）秋に曹操が荊州を制圧して江陵から長江を下ってくると、魯粛・周瑜および劉備の使者・諸葛亮の主戦論を容れて劉備と同盟を結び、周瑜・程普に精兵三万を授けて赤壁（烏林）で曹操の大軍を撃退させ、自らも別軍を率いて淮南の要衝・合肥を包囲した（張憙の救援接近を聞いて撤退）。のち荊州・交州を併せて黄龍元年（229年）に皇帝に即位し、三国呉を建国した（『三國志』巻1・武帝紀、巻47・呉主伝）。", "yomi": "そんけん", "name": "孫権（そんけん：字は仲謀、呉郡富春県出身の江東の覇主・のち呉の初代皇帝〔大帝〕、劉備と同盟して赤壁で曹操を阻み合肥を攻める）", "role": "後漢末の討虜将軍・会稽太守・車騎将軍・呉王・のち三国呉の初代皇帝・大帝（揚州呉郡富春県の人、孫堅の次男・孫策の弟）"}, "辛毗": {"wiki_title": "辛毗", "ai_desc": "豫州潁川郡陽翟県の人（?〜235年頃）、字は佐治。兄の辛評とともに袁紹に仕え、袁紹の没後は兄とともに長男・袁譚に属した。建安8年（203年）8月、袁尚に敗れて平原に追い詰められた袁譚の命を受け、劉表征討のため西平に布陣していた曹操のもとへ降伏・請救の使者として赴いた。曹操が袁譚の本心を疑って尋問すると、辛毗は袁譚の信義は問うまでもなく袁氏兄弟が内紛している今こそ河北を併呑する千載一遇の好機であると率直に説き、曹操を大いに喜ばせて北上を決断させた。のち南皮陥落後に曹操へ仕えて議郎・丞相長史となり、文帝・明帝の代には侍中・衛尉として剛直な諫言で重きをなした（『三國志』巻1・武帝紀、巻25・辛毗伝）。", "yomi": "しんぴ", "name": "辛毗（しんぴ：字は佐治、潁川郡陽翟県出身、袁譚の使者として来詣し河北平定の好機を説きのち曹魏の侍中・衛尉）", "role": "後漢末〜三国魏の議郎・丞相長史・侍中・衛尉・広平剛亭侯（豫州潁川郡陽翟県の人、辛評の弟・辛憲英の父）"}, "崔州平": {"wiki_title": "崔州平", "ai_desc": "冀州博陵郡安平県の人（生没年不詳）。後漢の太尉・崔烈の子で、西河太守・崔均の弟。荊州で諸葛亮や徐庶と親しく交わり、自らを管仲・楽毅になぞらえて世人から認められなかった諸葛亮の才器を「まことにその通りだ」と評価した知己の一人（『三國志』巻35・諸葛亮伝および注引『崔氏譜』）。", "yomi": "さいしゅうへい", "name": "崔州平（さいしゅうへい：博陵郡安平県出身・太尉崔烈の子、荊州で諸葛亮の器量を認めた親友）", "role": "博陵崔氏の名士（太尉崔烈の子・諸葛亮の知友）"}, "楽進": {"wiki_title": "楽進", "ai_desc": "兗州東郡衛国県（のち陽平郡衛国県）の人（?〜218年）、字は文謙。容貌は小柄であったが胆力と果敢さで知られ、曹操の陣営で帳下吏から身を起こし、郷里で兵千余人を募って軍司馬・陥陣都尉となった。濮陽の呂布戦・雍丘の張超戦・下邳の呂布戦・官渡の戦い（淳于瓊の烏巣陣営突入・斬首）・南皮の袁譚戦などあらゆる攻城戦・野戦で常に「先登（一番乗り）」の功を立てた。建安10年（205年）冬〜11年（206年）には李典とともに高幹を壺関に撃ち、回軍して高幹の背後から城を攻め破り、同年8月には淳于で海賊・管承を撃破して海島まで追撃した。のち張遼・李典とともに合肥を守備して孫権の大軍を撃退し、右将軍に昇った（『三國志』巻17・楽進伝）。", "yomi": "がくしん", "name": "楽進（がくしん：字は文謙、陽平郡衛国県出身の曹魏の右将軍・広昌威侯、小柄ながら常に先登一番乗りを果たした猛将）", "role": "後漢末〜三国魏の討寇校尉・折衝将軍・右将軍・広昌威侯（兗州東郡衛国県〔のち陽平郡衛国県〕の人）"}, "諸葛顕": {"wiki_title": "", "ai_desc": "徐州琅邪郡陽都県の人（生没年不詳、原文表記「顯」）。蜀漢の行護軍・翊武将軍であった諸葛攀の子で、諸葛喬の孫。蜀漢滅亡の翌年である咸熙元年（264年）、諸葛瞻の次男・諸葛京らとともに河東郡へ内移し、のち西晋に仕えた（『三國志』巻35・諸葛亮伝附諸葛瞻伝）。", "yomi": "しょかつけん", "name": "諸葛顕（しょかつけん：諸葛攀の子・諸葛喬の孫、咸熙元年に諸葛京とともに河東へ内移）", "role": "諸葛攀の子・諸葛喬の孫"}, "蕭何": {"wiki_title": "蕭何", "ai_desc": "沛県豊邑の人（?〜前193年）。秦末に沛県の主吏掾として劉邦（高祖）の挙兵を補佐し、咸陽入城時には秦の丞相・御史の律令・図書を収めて天下の戸口・要害を把握した。楚漢戦争中は関中に留まって兵員・兵糧の補給と法令整備を一手に担い、前漢建国後の論功行賞で功臣第一とされて酇侯に封じられ、丞相ついで相国に昇った。その際、劉邦から特別の礼遇として剣を帯び履を履いたまま殿上に昇ること（「剣履上殿」）、および参内時に小走りを免除されること（「入朝不趨」）を許された（『史記』巻53・蕭相国世家、『漢書』巻39・蕭何伝）。建安17年（212年）正月、献帝は曹操に対してこの蕭何の先例にならう殊礼を下賜した（『三國志』巻1・武帝紀）。", "yomi": "しょうか", "name": "蕭何（しょうか：前漢創業第一の功臣・初代相国・酇侯、帯剣履上殿・入朝不趨の殊礼を許された宰相）", "role": "前漢の丞相・初代相国・酇文終侯（沛県豊邑の人）"}, "勾践": {"wiki_title": "勾践", "ai_desc": "春秋時代末期の越王（？〜前465年、姓は姒、名は勾践、古典では「句践」とも表記）。夫椒の戦いで呉王・夫差に大敗し会稽山で屈辱的な講和を結んだが、臥薪嘗胆の労苦と范蠡・文種らの輔佐によって国力を充実させ、前473年に呉を滅ぼして覇者となった。功成り身を引いて去った范蠡の勲功を偲び、黄金を鋳造してその像を作らせ座右に置いたと伝わる（『国語』越語下、『史記』巻41・越王勾践世家、『三國志』巻35・諸葛亮伝注引『襄陽記』）。", "yomi": "こうせん", "name": "勾践・越王勾践（こうせん：春秋末期の越王、臥薪嘗胆の末に呉を滅ぼした覇者、去った范蠡を偲び黄金像を鋳造）", "role": "春秋時代末期の越王（春秋五覇の一）"}, "曹叡": {"wiki_title": "曹叡", "ai_desc": "三国魏の第2代皇帝・明帝（諱は叡、字は元仲、在位：226年〜239年）。文帝・曹丕の長子で、母は文昭甄皇后。即位後、蜀の諸葛亮による北伐や呉の孫権による侵攻に対し、曹真・曹休・張郃・司馬懿らを的確に配置して防衛し、太和・青龍・景初年間に宮殿造営や律令整備を進めた（『三國志』巻3・明帝紀、巻17・張郃伝・徐晃伝）。", "yomi": "そうえい", "name": "曹叡（そうえい）"}, "孟子": {"wiki_title": "孟子", "ai_desc": "名は軻（孟軻）、字は子輿、戦国時代・鄒国の人（前372年頃〜前289年頃）。孔子の孫・子思の学統に連なり、斉の宣王や梁（魏）の恵王ら諸国を遊歴して仁義に基づく王道政治と性善説を説いた儒家の大思想家であり、後世「亜聖」と尊称される。その著『孟子』尽心上篇の「佚道（民を安んじる道）を以て民を使わば、労すと雖も怨みず、生道（人を生かす道）を以て人を殺さば、死すと雖も殺す者を怨みず」の言葉が、諸葛亮の政治に対する梁・益の民の追慕を論じる陳寿の進表に引用される（『史記』巻74・孟子荀卿列伝、『孟子』尽心上、『三國志』巻35・諸葛亮伝）。", "yomi": "もうし", "name": "孟子・孟軻（もうし／もうか：字は子輿、戦国時代・鄒出身の儒家の大思想家・『孟子』の著者）", "role": "戦国時代の儒家の思想家（名は軻、亜聖）"}, "孟獲": {"wiki_title": "孟獲", "ai_desc": "益州南部（南中）・建寧郡の豪帥（生没年不詳）。南中の夷族・漢人の双方から深く信服されていた。建興3年（225年）の諸葛亮の南征に際し、生け捕りにされて陣営を見学したのち再戦を挑み、七たび捕らえられ七たび解き放たれた（「七縦七擒」）。ついに「公は天威なり、南人は二度と反きません」と心服して帰順し、のち蜀漢の御史中丞に至ったと伝えられる（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、『華陽国志』巻4・南中志）。", "yomi": "もうかく", "name": "孟獲（もうかく：南中の夷・漢双方に信服された豪帥、諸葛亮の「七縦七擒」に心服して帰順）", "role": "南中の豪帥・のち蜀漢の御史中丞"}, "崔烈": {"wiki_title": "崔烈", "ai_desc": "涿郡安平県の人（?〜192年）。北方の名門・博陵崔氏の出身で、霊帝の中平2年（185年）に五百万銭を納めて司徒から太尉となり、世人から「銅臭（銭の臭いがする）」と評された。中平4年（187年）11月に太尉を退き、代わって曹嵩が太尉に就任した（『後漢書』巻52・崔駰伝附崔烈伝）。", "yomi": "さいれつ", "name": "崔烈（さいれつ：字は威考、曹嵩の前任の太尉）", "role": "後漢の太尉・城門校尉（涿郡安平県の人、崔駰の孫・崔州平の父）"}, "劉宝": {"wiki_title": "", "ai_desc": "字は道真、兗州山陽郡高平国の人（生没年不詳）。西晋初の学者・官僚。扶風王・司馬駿が関中を鎮守した際にその幕府の司馬を務め、長史の桓隰らとともに諸葛亮の得失を論じた。のちに安北将軍・皇太子侍講（『晋書』巻53・愍懐太子伝など）を務めた高平の劉宝と同一人物とみられる（『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "りゅうほう", "name": "劉宝（りゅうほう：字は道真、山陽郡高平出身の西晋の学者、扶風王司馬駿の司馬）", "role": "西晋・扶風王司馬駿の司馬（高平の人）"}, "桓帝": {"wiki_title": "桓帝", "ai_desc": "章帝の曽孫・蠡吾侯劉翼の子（132年〜167年）。質帝が梁冀に毒殺された後、曹騰らの進言もあって15歳で即位した。曹騰が先帝以来の旧臣として忠孝顕著であったことから、曹騰を費亭侯に封じ、特進の位を加えた。", "yomi": "かんてい", "name": "桓帝（かんてい：後漢の第11代皇帝・劉志）", "role": "後漢の第11代皇帝（在位146年〜167年）"}, "劉琨": {"wiki_title": "劉琨", "ai_desc": "字は越石、冀州中山国魏昌県の人（271年〜318年）。西晋末の動乱期に并州刺史となって晋陽の廃墟を復興し、祖逖と並び中原回復に挺身した（「聞鶏起舞」の故事で名高い）。司空・都督并冀幽三州諸軍事に進んだが石勒に敗れて兵を失い、建武元年（317年）に江南の晋王・司馬睿（東晋・元帝）へ勧進と謝罪の箋を奉り、その文中で諸葛亮が敗れて吐血したとする俗説を引いたため裴松之に批判された。翌年、段匹磾に害され広武愍侯と諡された（『晋書』巻62・劉琨伝、『三國志』巻35・諸葛亮伝注）。", "yomi": "りゅうこん", "name": "劉琨（りゅうこん：字は越石、中山魏昌出身の西晋末東晋初の并州刺史・司空、晋元帝へ箋を奉った名将）", "role": "西晋・東晋の并州刺史・司空・広武愍侯"}, "山濤": {"wiki_title": "山濤", "ai_desc": "字は巨源、司隷河内郡懐県の人（205年〜283年）。曹魏から西晋にかけての重臣で、嵇康・阮籍らとともに「竹林の七賢」の一人に数えられる。司馬懿の張春華夫人の遠縁にあたり、40歳を過ぎて仕官したのち西晋の武帝・司馬炎から厚く信任され、吏部尚書・尚書僕射・侍中・司徒を歴任した。十余年にわたり人事を統括し、各人物の才器を的確に評して推挙した奏啓集は『山公啓事』（『啓事』）と称され、郿県令であった諸葛亮の孫・諸葛京を東宮舎人に推挙した。死後、康侯と諡された（『晋書』巻43・山濤伝、『三國志』巻35・諸葛亮伝注）。", "yomi": "さんとう", "name": "山濤（さんとう：字は巨源、河内懐県出身の西晋の尚書僕射・司徒、「竹林の七賢」の一人、郿令諸葛京を東宮舎人に推挙）", "role": "西晋の吏部尚書・尚書僕射・司徒・新沓康侯（竹林の七賢）"}, "郭沖": {"wiki_title": "郭沖", "ai_desc": "涼州金城郡の人（生没年不詳）。西晋初に関中を鎮守した扶風王・司馬駿のもとで、諸葛亮の権智・英略は管仲・晏嬰を凌ぐと主張し、世に知られていない逸話五条（「郭沖五事」：法正との刑政問答・曹氏刺客看破・陽平関空城の計など）を挙げて称揚し、後に中書郎に至った。ただし裴松之は年代・官職・情理の矛盾から五事すべてを虚構と論破している（『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "かくちゅう", "name": "郭沖（かくちゅう：金城出身の西晋の官僚・中書郎、諸葛亮の逸話「郭沖五事」を伝えた人物）", "role": "西晋の中書郎（金城の人・「郭沖五事」の語り手）"}, "英布": {"wiki_title": "英布", "ai_desc": "秦末・楚漢戦争期の武将（?〜前196年）、六県の人。若い頃に法に触れて黥刑（顔に入れ墨を施す刑）を受けたことから「黥布（げいふ）」と通称された。驪山の徒刑から蜂起して項梁・項羽に従い、常に諸軍の先鋒となって秦軍を撃破した功により項羽から九江王に封じられた。のち漢王・劉邦に帰順して垓下の戦いで項羽を滅ぼし、前漢建国後に異姓諸侯王の一人として淮南王に封じられたが、高祖11年（前196年）に反乱を起こして敗死した（『史記』巻91・黥布列伝、『漢書』巻34・黥布伝）。諸葛亮は関羽への書簡で馬超の武勇を「黥（英布）・彭（彭越）の徒」に擬した。", "yomi": "えいふ", "name": "英布・黥布（えいふ／げいふ：秦末・楚漢戦争期の猛将、九江王ついで前漢の淮南王、彭越・韓信と並ぶ創業期の英傑）", "role": "楚漢戦争期の九江王→前漢の淮南王"}, "韓信": {"wiki_title": "韓信", "ai_desc": "淮陰（臨淮郡淮陰県）の人（?〜前196年）。若い頃は貧困で生業も治めず他人の家に寄食して嫌われ、淮陰の無頼の若者から挑発された際には剣を佩びながらその股の下を這い潜る（「胯下の辱・股くぐり」）嘲笑を甘受した（『史記』巻92・淮陰侯列伝）。項羽の下では重用されなかったが、漢の蕭何に「国士無双」と見抜かれて高祖・劉邦の大将軍に抜擢されると、暗渡陳倉・背水の陣・濰水の戦い・垓下の包囲など古今無双の用兵で魏・代・趙・燕・斉・楚を次々と平定し、蕭何・張良とともに漢王朝創業の「三傑」と称えられた。のち謀反の疑いにより呂后と蕭何に誘殺された。", "yomi": "かんしん", "name": "韓信（かんしん：淮陰出身の不世出の兵家、「股くぐり」の恥を忍んで前漢の高祖・劉邦の天下統一を成し遂げた斉王・楚王・淮陰侯）", "role": "前漢創業の筆頭名将（大将軍→斉王→楚王→淮陰侯、「漢の三傑」の一）"}, "太顛": {"wiki_title": "太顛", "ai_desc": "殷末周初の賢臣（生没年不詳）。閎夭・散宜生・南宮括とともに西伯昌（周の文王）を補佐した「文王の四友」の一人。文王が殷の紂王によって羑里に幽閉された際、閎夭らとともに美女や珍宝・良馬を求めて紂王に献上し文王を救出したと伝わり、のち武王の牧野の戦いにも従って周王朝創業を助けた。李興は碑文で太顛・閎夭は名のみ伝わって具体的な籌策の事跡が残っていないとし、良籌妙画が歴然と伝わる諸葛亮をその上に置いている（『尚書』君奭篇、『史記』巻4・周本紀、『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "たいてん", "name": "太顛（たいてん：周の文王・武王を補佐した「文王の四友」の一人、周王朝創業の賢臣）", "role": "殷末周初の賢臣（文王の四友の一）"}, "孔子": {"wiki_title": "孔子", "ai_desc": "春秋時代の魯の人（前551年〜前479年）、名は丘、字は仲尼。仁と礼を核とする儒学を創始した。『論語』公冶長篇において、孔子が子貢に「お前と回（顔淵）とではどちらが優れているか」と問い、子貢が「どうして回に及びましょう」と答えると、孔子が「弗如也、吾與女弗如也（及ばないな、私もお前も彼には及ばない）」と愛弟子の顔淵を称揚した故事があり、曹操は『故太尉橋玄を祀る文』において、大先輩の橋玄が若き日の自分を過分に称賛・推挽してくれた恩義をこの故事になぞらえた。", "yomi": "こうし", "name": "孔子・仲尼（こうし／ちゅうじ：名は丘、字は仲尼、春秋時代の魯の思想家・儒家の始祖）", "role": "春秋時代の思想家・儒家の始祖（魯国昌平郷陬邑の人）"}, "司馬相如": {"wiki_title": "司馬相如", "ai_desc": "字は長卿、蜀郡成都の人（前179年〜前117年）。前漢の景帝・武帝期に活躍した漢賦の最高峰と称される文学者・郎官。『子虚賦』『上林賦』で武帝に召され、中郎将として巴蜀・西南夷の宣撫にもあたった。その檄文『難蜀父老』の「鵾鵬すでに遼廓に翔るに、羅者はなお藪沢を視る」の句が裴松之注に引かれる（『史記』巻117・司馬相如列伝）。", "yomi": "しばしょうじょ", "name": "司馬相如（しばしょうじょ：字は長卿、蜀郡成都出身の前漢武帝期の辞賦の大家）", "role": "前漢の文学者・中郎将（辞賦の大家）"}, "丁立": {"wiki_title": "", "ai_desc": "蜀漢の将校（？〜228年頃）。数十年にわたり四方から糾合された歴戦の精鋭幹部の一人であり、建興5年（227年）の諸葛亮の漢中進駐から翌建興6年（228年）11月までの1年間に、陽群・馬玉・閻芝・白寿・劉郃・鄧銅らとともに死去した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "ていりつ", "name": "丁立（ていりつ：蜀漢の歴戦の将校、諸葛亮の漢中進駐後の1年間に没した精鋭幹部の一人）", "role": "蜀漢の将校"}, "関羽": {"wiki_title": "関羽", "ai_desc": "司隸河東郡解県の人（?〜219年）、字は雲長（本字は長生）。亡命して涿郡に至り、劉備の郷里での挙兵以来、張飛とともに寝食を共にして侍立し、周瑜・程昱・郭嘉ら敵味方から「万人敵」「熊虎の将」と畏敬された。建安5年（200年）春正月、劉備が小沛で曹操に敗れて袁紹のもとへ奔った際、下邳を守備していた関羽は曹操に捕らえられて偏将軍として厚遇を受け、同年4月の白馬の戦いで袁紹軍の猛将・顔良を万衆の中で刺殺して恩義に報いたのち、賞賜を尽く封印して劉備のもとへ帰参した。のちに荊州を督して建安24年（219年）に前将軍・仮節鉞に進み、樊城の曹仁を包囲し漢水の暴漲に乗じて于禁の七軍を水没させ華夏を震撼させたが、背後から孫権・呂蒙に江陵を奇襲され、退却途上の南郡臨沮で子の関平とともに斬られた（『三國志』巻36・関羽伝）。", "yomi": "かんう", "name": "関羽（かんう：字は雲長、河東郡解県出身の蜀漢の前将軍・漢寿亭侯、万人敵と称えられた劉備股肱の義将）", "role": "後漢末〜劉備配下の偏将軍・襄陽太守・前将軍・仮節鉞・漢寿亭侯（司隸河東郡解県の人、諡は壮繆侯）"}, "王平": {"wiki_title": "王平", "ai_desc": "字は子均、益州巴西郡宕渠県の人（？〜248年）。母方の何氏に養われたため初め「何平」と称し、のち本姓の王氏に復した。建安24年（219年）の漢中争奪戦で曹操軍から劉備に帰順し、建興6年（228年）の街亭の戦いでは馬謖の布陣を諫め、敗戦後も太鼓を鳴らして自軍を整然と収容した功により参軍・討寇将軍・亭侯に進み、無当監として精鋭部隊を統率した。建興9年（231年）の鹵城の戦いでは南囲を堅守して張郃の攻撃を退け、のち鎮北大将軍・漢中太守・安漢侯に至った（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、巻43・王平伝）。", "yomi": "おうへい", "name": "王平・何平（おうへい／かへい：字は子均、巴西宕渠出身の蜀漢の無当監・鎮北大将軍、初め外家の姓により何平と称す）", "role": "蜀漢の無当監・鎮北大将軍・安漢侯（巴西宕渠の人）"}, "張魯": {"wiki_title": "張魯", "ai_desc": "沛国豊県の人。五斗米道（天師道）を創始した祖父・張陵、父・張衡の教団を継ぎ、初平2年（191年）頃に益州牧・劉焉の命で漢中へ入って太守・蘇固を討ち、以後約三十年にわたり「師君」と称して祭酒・鬼卒による教団統治と義舎（無償の米・肉を置く宿舎）を設ける政権を漢中に築いた。建安16年（211年）3月、曹操が鍾繇を派遣して張魯討伐を図ったことが関中諸将（馬超・韓遂ら）の疑心と蜂起の端緒となった。のち建安20年（215年）に曹操の漢中親征を受けて降伏し、鎮南将軍・閬中侯（一万戸）として処遇された（『三國志』巻8・張魯伝）。", "yomi": "ちょうろ", "name": "張魯（ちょうろ：字は公祺、五斗米道の教主として漢中に約三十年間割拠した群雄）", "role": "漢中の群雄・五斗米道第3代教主（師君）・のち鎮南将軍・閬中侯"}, "晏嬰": {"wiki_title": "晏嬰", "ai_desc": "字は仲、諡は平、春秋時代の斉の名宰相（？〜前500年）。「晏子」と尊称される。霊公・荘公・景公の三代に仕え、質素倹約を貫きつつ機知と直言で斉の国政を支え、管仲と並び「管・晏」と称された（『史記』巻62・管晏列伝、『晏子春秋』）。", "yomi": "あんえい", "name": "晏嬰・晏子（あんえい／あんし：字は仲、春秋時代の斉の賢相、管仲と並び「管・晏」と称される）", "role": "春秋時代・斉の宰相（晏平仲）"}, "公孫僑": {"wiki_title": "子産", "ai_desc": "字は子産、春秋時代の鄭の公族・宰相（？〜前522年）。鄭の穆公の孫（子国の子）で、内政改革・刑書の鋳造と巧みな外交により晋・楚二大国の狭間で鄭を安泰に導いた。呉の公子・季札が鄭を訪れた際、初対面ながら旧知のごとく帯と衣を贈り合って親交を結び、後世「僑・札の分」として知己の交わりの代名詞となった（『春秋左氏伝』襄公二十九年、『史記』巻119・循吏列伝）。", "yomi": "こうそんきょう", "name": "公孫僑・子産（こうそんきょう／しさん：春秋時代の鄭の賢相、呉の季札と旧知のごとく親交を結ぶ）", "role": "春秋時代・鄭の宰相（字は子産）"}, "閻宇": {"wiki_title": "閻宇", "ai_desc": "字は文平、荊州南郡の人（生没年不詳）。蜀漢の宿将。勤勉で緻密な実務能力を持ち、馬忠の後を継いで庲降都督となって南中を統治したのち、右大将軍・巴東都督に昇って東境の要衝・永安（白帝城）を鎮守した。孫盛『異同記』によれば、景耀年間に諸葛瞻・董厥らは外征を繰り返して国力を疲弊させる姜維を益州刺史に召還し、閻宇を姜維の後任に充てるよう後主に上表しようとしたという（『三國志』巻43・馬忠伝、巻35・諸葛亮伝注引『異同記』、巻44・姜維伝）。", "yomi": "えんう", "name": "閻宇（えんう：字は文平、南郡出身の蜀漢の右大将軍・巴東都督、諸葛瞻らが姜維に代えるべく推した宿将）", "role": "蜀漢の庲降都督・右大将軍・巴東都督"}, "劉琦": {"wiki_title": "劉琦", "ai_desc": "山陽郡高平県の人（？〜209年）。荊州牧・劉表の長男。はじめ父・劉表に愛されたが、弟・劉琮が後妻の蔡氏の一族を娶ったことで疎んじられ、諸葛亮を高楼に招いて梯子を外し身の振り方を尋ね、申生・重耳の故事に学んで黄祖死後の江夏太守として外に出た。長阪敗走後の劉備を夏口へ迎え入れて赤壁の戦いに参陣し、劉備から荊州刺史に推されたが翌建安14年（209年）に病没した（『三國志』巻6・劉表伝、巻32・先主伝、巻35・諸葛亮伝）。", "yomi": "りゅうき", "name": "劉琦（りゅうき：荊州牧・劉表の長男、江夏太守・荊州刺史、高楼で梯子を外し諸葛亮に計を問う）", "role": "後漢末の江夏太守・荊州刺史（劉表の長男）"}, "徐晃": {"wiki_title": "徐晃", "ai_desc": "司隸河東郡楊県の人（?〜227年）、字は公明。初め郡吏から車騎将軍・楊奉の騎都尉となり、楊奉に献帝の洛陽帰還を進言したのち、建安元年（196年）冬に曹操に帰順して裨将軍となった。建安5年（200年）の官渡の戦いでは白馬・延津で顔良・文醜軍の撃破に参加して偏将軍に進み、さらに史渙とともに故市で袁紹軍の兵糧輸送車数千両を撃破・焼却する大功を立てて都亭侯に封じられた。その後も韓浩とともに烏巣攻略や河北・関中・漢中の諸戦役に従い、建安24年（219年）の樊城救援では関羽の十重の鹿角陣を正面突破して曹操から「周亜夫の風あり」と激賞され、文帝即位後に右将軍・陽平侯に昇った（『三國志』巻17・徐晃伝）。", "yomi": "じょこう", "name": "徐晃（じょこう：字は公明、河東郡楊県出身の曹魏の右将軍・陽平壮侯、官渡での輸送車撃破や樊城救援で活躍した五将軍の一）", "role": "後漢末〜三国魏の偏将軍・盪寇将軍・平寇将軍・右将軍・陽平壮侯（司隸河東郡楊県の人）"}, "公輸盤": {"wiki_title": "魯班", "ai_desc": "春秋末期から戦国初期の魯国の伝説的な名工匠（生没年不詳、姓は公輸、名は盤または般、魯の出身であることから「魯班」「公輸子」と通称される）。雲梯（攻城梯）や鉤強などの精巧な攻城・舟戦器械や木工道具を次々に考案し、古来より百工・木工技術の最高峰の象徴と仰がれた。李興は諸葛亮が創案した木牛の奇抜な構造を「公輸般の型にもよらぬ独創（非般模）」と称賛している（『墨子』公輸篇、『孟子』離婁上、『礼記』檀弓下、『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "こうしゅはん", "name": "公輸盤・公輸般・魯班（こうしゅはん／ろはん：春秋戦国時代・魯の伝説的名工、古来最高峰の工匠の代名詞）", "role": "春秋戦国時代・魯の名工匠（公輸子・魯班）"}, "袁術": {"wiki_title": "袁術", "ai_desc": "汝南郡汝陽県の人（?〜199年）。四世三公の名門・汝南袁氏の司空・袁逢の嫡子として生まれ、若くして侠気をもって知られ、虎賁中郎将となった。董卓が入京すると懐柔のため後将軍に任じられたが、董卓の暴政を恐れて南陽郡（魯陽）へ奔り、初平元年（190年）正月の反董卓連合軍で南方の主力を担った。後に袁紹・曹操と対立して揚州の寿春へ移り、建安2年（197年）に伝国の玉璽を頼みに帝位（「仲家」）を僭称したが、四方から孤立して窮死した（『三國志』巻6・袁術伝）。", "yomi": "えんじゅつ", "name": "袁術（えんじゅつ：字は公路、四世三公の汝南袁氏の嫡流・後将軍、のち寿春で仲家皇帝を僭称）", "role": "後漢末の群雄・後将軍・左将軍（汝南郡汝陽県の人、司空・袁逢の嫡子、袁紹の従弟〔または異母弟〕）"}, "杜瓊": {"wiki_title": "杜瓊", "ai_desc": "字は伯瑜、益州蜀郡成都県の人（？〜250年、享年80余）。蜀の碩学・任安に師事して図讖・経学・術数に精通し、劉璋の従事から劉備の議曹従事となった。後主・劉禅の代に諫議大夫・左中郎将・大鴻臚・太常を歴任し、重厚沈黙な長者として尊ばれた。建興12年（234年）8月、五丈原で没した諸葛亮に対し、使持節・左中郎将として丞相・武郷侯の印綬を追贈し「忠武侯」と諡する策命使を務めた（『三國志』巻35・諸葛亮伝、巻42・杜瓊伝）。", "yomi": "とけい", "name": "杜瓊（とけい：字は伯瑜、成都出身の蜀漢の左中郎将・太常、諸葛亮に忠武侯を贈る策命使を務めた碩学）", "role": "蜀漢の左中郎将・大鴻臚・太常（成都の人）"}, "鍾会": {"wiki_title": "鍾会", "ai_desc": "豫州潁川郡長社県の人（225年〜264年）、字は士季。曹魏の太傅・鍾繇の末子。幼少より神童と称えられ、司馬師・司馬昭の腹心参謀として毌丘倹・諸葛誕の討伐で奇策を立てて「張良（子房）」に擬せられた。司隷校尉を経て景元4年（263年）に鎮西将軍・仮節都督関中諸軍事となり、十余万の主力軍を率いて漢中を攻略し剣閣で姜維と対峙、鄧艾による成都降伏を受けて蜀漢を平定し司徒に拝された。しかし翌咸熙元年（264年）正月、姜維と結んで成都で自立の反乱を起こし、将兵の蜂起により殺害された（『三國志』巻28・鍾会伝）。", "yomi": "しょうかい", "name": "鍾会（しょうかい：字は士季、太傅・鍾繇の末子、曹魏の鎮西将軍・司徒、鄧艾とともに蜀漢を滅ぼすも成都で反乱を起こし敗死）", "role": "曹魏の黄門侍郎・司隷校尉・鎮西将軍・司徒・県侯（潁川郡長社県の人、鍾繇の子）"}, "文王": {"wiki_title": "文王 (周)", "ai_desc": "古公亶父の孫、季歴の子（姫昌）。殷末に西方の諸侯を束ねる「西伯」となり、岐山南麓から豊邑へ拠点を移し、渭水のほとりで太公望（呂尚）を迎えて国力を充実させ、仁政によって諸侯の信望を集め「天下を三分してその二を保つ」勢力を築いた。子の武王が殷を滅ぼして周王朝を開いたのち、文王と追尊された（『史記』巻4・周本紀、『論語』泰伯篇）。", "yomi": "しゅうぶんおう", "name": "周文王（しゅうぶんおう：姓は姫、名は昌、西伯、太公望を得て徳政を敷き周王朝創業の礎を築いた君主）", "role": "周王朝の基礎を築いた西伯（武王・周公旦・管叔鮮・蔡叔度・畢公らの父）"}, "曹仁": {"wiki_title": "曹仁", "ai_desc": "豫州沛国譙県の人（168年〜223年）、字は子孝。曹操の従弟（祖父は曹褒、父は熾）。若き日は弓馬と狩猟を好んで豪傑千余人を集め、曹操の挙兵に従い別部司馬・行厲鋒校尉として常に騎兵の先鋒を務めた。徐州征伐・呂布討伐・張繡征討で戦功を重ね、建安4年（199年）4月には史渙とともに黄河を渡り犬城で眭固を撃破・斬殺した。のち官渡の戦いでの隠強・鶏洛山奇襲、赤壁後の江陵防衛戦、建安24年（219年）の関羽に対する樊城死守など数多の危機を救い、文帝（曹丕）の代に大将軍・大司馬に昇った（『三國志』巻9・曹仁伝）。", "yomi": "そうじん", "name": "曹仁（そうじん：字は子孝、曹操の従弟、大司馬・陳忠侯、創業の先鋒から樊城死守まで曹氏随一の武勲を立てた名将）", "role": "後漢末〜三国魏の征南将軍・大将軍・大司馬・陳忠侯（豫州沛国譙県の人、曹操の従弟）"}, "陳祗": {"wiki_title": "陳祗", "ai_desc": "蜀漢の官僚（？〜258年）、字は奉宗、汝南郡の人（許靖の兄の外孫）。侍中・守尚書令・鎮軍将軍として後主・劉禅および宦官の黄皓と結んで重用され、死後に忠侯と特諡された（『三國志』巻39・董允伝附陳祗伝）。", "yomi": "ちんし", "name": "陳祗（ちんし：字は奉宗、後主・劉禅に寵遇された侍中・守尚書令、諡は忠侯）", "role": "蜀漢の侍中・守尚書令・鎮軍将軍（諡は忠侯）"}, "周瑜": {"wiki_title": "周瑜", "ai_desc": "周瑜（しゅうゆ）：字は公瑾、廬江郡舒県の人（175年〜210年）。太尉・周忠の従子。孫策と同年（175年生）で、少年時代に孫策の名声を聞いて舒県から寿春へ訪ねて「断金の交わり」を結び、孫策一家を舒県へ迎え入れた。のち孫策の江東平定および皖城・夏口攻略に同行し、孫策・孫権二代を支える呉の柱石となった（『三國志』巻54・周瑜伝）。", "yomi": "しゅうゆ", "name": "周瑜（しゅうゆ）"}, "習鑿歯": {"wiki_title": "習鑿歯", "ai_desc": "荊州襄陽郡襄陽県の人（?〜384年）、字は彦威。襄陽の名族・習氏の出身で、博学と文才・弁論で知られた。東晋の実力者である荊州刺史・桓温に抜擢されて従事・別駕・滎陽太守を歴任したが、のち足の疾により帰郷した。桓温が簒奪の野心を抱いていることを察し、後漢の光武帝から西晋の愍帝に至る歴史を編纂した主著『漢晋春秋』四十七巻（一説に五十四巻）において、力によって禅譲を受けた曹魏ではなく漢室の血統を継ぐ蜀漢（昭烈帝・劉備）を正統とする「蜀漢正統論」を初めて体系的に唱えた（『晋書』巻82・習鑿歯伝）。", "yomi": "しゅうさくし", "name": "習鑿歯（しゅうさくし：字は彦威、襄陽郡出身の東晋の歴史家・滎陽太守、蜀漢正統論を唱えた『漢晋春秋』の撰者）", "role": "東晋の歴史家・文人・荊州別駕・滎陽太守（荊州襄陽郡襄陽県の人）"}, "和嶠": {"wiki_title": "和嶠", "ai_desc": "字は長輿、豫州汝南郡西平県の人（？〜292年）。曹魏の太常・和洽の孫で、吏部尚書・和逌の子。重厚清廉な風格を備えて西晋の武帝・司馬炎に重んじられ、潁川太守・御史中丞・侍中を経て中書令・関内侯に任じられた。中書監の荀勗の専権に阿らず別乗を貫くなど気節を守り、泰始10年（274年）には荀勗とともに陳寿をして『諸葛氏集』二十四篇を編定させるよう奏上した。のち恵帝期に太子少傅・光禄大夫に至り、簡と諡された（『晋書』巻45・和嶠伝、『三國志』巻35・諸葛亮伝）。", "yomi": "かきょう", "name": "和嶠（かきょう：字は長輿、汝南西平出身の西晋の中書令・関内侯、和洽の孫、荀勗とともに『諸葛氏集』編定を上奏）", "role": "西晋の侍中・中書令・太子少傅・関内侯（和洽の孫）"}, "光武帝": {"wiki_title": "光武帝", "ai_desc": "南陽郡蔡陽県春陵郷の人（前6年〜後57年）、前漢の景帝の子・長沙定王劉発の末裔。王莽の新朝末期に兄・劉縯とともに舂陵で挙兵し、昆陽の戦いで新の主力軍を撃破したのち河北を平定して建武元年（25年）6月に鄗で皇帝に即位、洛陽を都と定めて赤眉・隗囂・公孫述ら群雄を次々と平定し漢王朝を再興（「光武中興」）した。創業の過程において、遠征中の鄧禹や来歙ら腹心の将帥に臨機応変の「承制」権を認めて迅速に威信と懐柔を示させたことが、後世の献帝の詔でも模範として称揚されている（『後漢書』巻1・光武帝紀、『三國志』巻1・武帝紀注引『漢魏春秋』）。", "yomi": "こうぶてい", "name": "光武帝・世祖（こうぶてい／せいそ：諱は劉秀、字は文叔、後漢の初代皇帝・世祖光武皇帝）", "role": "後漢の初代皇帝（在位25年〜57年、廟号は世祖）"}, "司馬駿": {"wiki_title": "司馬駿", "ai_desc": "字は子臧、河内郡温県の人（232年〜286年）。司馬懿の子（晋の宣帝の第七子）で、西晋の武帝・司馬炎の叔父。汝陰王ついで扶風王に封じられ、鎮西大将軍・使持節・都督雍涼等州諸軍事として長く関中を鎮守し、善政と辺境防衛により「扶風武王」と諡された。その幕府で郭沖が諸葛亮の五事を語ったとされるが、裴松之は子の前で父・司馬懿を貶める不自然さを指摘している（『晋書』巻38・扶風武王駿伝、『三國志』巻35・諸葛亮伝注）。", "yomi": "しばしゅん", "name": "司馬駿・扶風王駿（しばしゅん：字は子臧、司馬懿の子、西晋初に関中を鎮守した扶風武王）", "role": "西晋の扶風王・鎮西大将軍（司馬懿の子）"}, "虞舜": {"wiki_title": "舜", "ai_desc": "古代中国の伝説上の聖王で「五帝」の一人。有虞氏の出であることから「虞舜」と称され、姓は姚、名は重華とされる（『史記』巻1・五帝本紀、『尚書』虞書・舜典）。頑迷な父・瞽瞍や継母・異母弟の象に孝悌を尽くしたことで帝堯に見出されて禅譲を受け、八元・八愷や禹・皋陶・契・棄（后稷）・伯夷・夔らを登用して天下を治めた。また王命に背いた三苗（有苗）に対して武力征討を止め、宮廷の両階で干（盾）と戚（斧）を執って舞い文徳を広めたことで自ら帰服させたと伝わる（『尚書』大禹謨、『韓非子』五蠹篇）。", "yomi": "ぐしゅん", "name": "虞舜・舜（ぐしゅん／しゅん：五帝の一人、有虞氏、名は重華、堯から禅譲を受け孝徳と文教で天下を治めた聖王）", "role": "中国古代伝説の聖王・五帝の一（有虞氏）"}, "費禕": {"wiki_title": "費禕", "ai_desc": "蜀漢の政治家・大将軍（？〜253年）、字は文偉、江夏郡鄳県の人。蔣琬に次いで尚書令・大将軍・録尚書事として蜀漢の国政を担ったが、延煕16年（253年）正月の歳首大会で魏からの降人・郭脩に刺殺され、敬侯と諡された（『三國志』巻44・費禕伝）。", "yomi": "ひい", "name": "費禕（ひい：字は文偉、蔣琬の後を継いで蜀漢国政を担った大将軍、諡は敬侯）", "role": "蜀漢の大将軍・録尚書事・成郷侯（諡は敬侯）"}, "諸葛攀": {"wiki_title": "諸葛攀", "ai_desc": "徐州琅邪郡陽都県の人（生没年不詳）。蜀漢の駙馬都尉・諸葛喬の子で、諸葛亮の養孫（実の祖父は孫呉の諸葛瑾）。蜀漢に仕えて官は行護軍・翊武将軍に至った。延熙16年（呉の建興2年、253年）に呉で伯父の諸葛恪が誅殺されて実祖父・諸葛瑾の直系子孫が絶滅した一方、諸葛亮には実子の諸葛瞻がいたため、実家の祭祀を継ぐべく再び諸葛瑾の後嗣に復したが、やはり若くして没した（『三國志』巻35・諸葛亮伝附諸葛喬伝、巻52・諸葛瑾伝）。", "yomi": "しょかつはん", "name": "諸葛攀（しょかつはん：諸葛喬の子、蜀漢の行護軍・翊武将軍、諸葛恪族滅後に諸葛瑾の後嗣に復す）", "role": "蜀漢の行護軍・翊武将軍（諸葛喬の子）"}, "王子城父": {"wiki_title": "", "ai_desc": "春秋時代の斉の武将（生没年不詳、『管子』『韓非子』『呂氏春秋』では「王子成父」「公子成父」とも表記）。斉の桓公が覇業を進める際、宰相の管仲が「平原広牧において車馬を馳せ、白刃に臨んで敵陣を破り太鼓の音の絶えぬ用兵の才は、私は王子城父に及ばない」として自ら推挙し、大司馬・将帥として外征の軍事統帥を一任された名将。陳寿は蕭何が韓信を推挙した故事と並べて、管仲が己の長短を知って名将を挙げた例として引いている（『管子』小匡篇、『韓非子』外儲説左下、『三國志』巻35・諸葛亮伝）。", "yomi": "おうじじょうほ", "name": "王子城父（おうじじょうほ：春秋時代・斉の名将、宰相の管仲から軍略の第一人者として桓公に推挙された将帥）", "role": "春秋時代・斉の大司馬・将軍"}, "皋陶": {"wiki_title": "皐陶", "ai_desc": "中国上古の伝説的な大賢臣・司法官（生没年不詳、古籍では「咎繇」「皐陶」とも表記）。帝舜および夏王・禹に仕えて「士（大理・最高裁判官）」を務め、五刑の法と九徳の政治を明らかにして天下を治めた。『尚書』（『書経』）の「皋陶謨」には舜・禹と語り合った簡潔高雅な政道論が収められており、陳寿は周公旦が群臣に誓った懇切周到な誥文と対比して諸葛亮の文体の意義を論じた（『尚書』皋陶謨、『史記』巻2・夏本紀、『三國志』巻35・諸葛亮伝）。", "yomi": "こうよう", "name": "皋陶・咎繇（こうよう：帝舜・夏禹に仕えて刑政と謨謀を掌った中国上古の大賢臣）", "role": "中国上古の賢臣・司法官（舜・禹の臣）"}, "魯粛": {"wiki_title": "魯粛", "ai_desc": "字は子敬、臨淮郡東城県の人（172年〜217年）。居巣長時代の周瑜に糧米を贈って親交を結び、ともに江東へ渡って孫権に仕えた。建安13年（208年）に劉備との同盟を主導して賛軍校尉として赤壁の勝利に貢献し、周瑜の没後は軍権を継いで横江将軍となり陸口に鎮守した（『三國志』巻54・魯粛伝）。", "yomi": "ろしゅく", "name": "魯粛（ろしゅく：字は子敬、臨淮郡東城県出身の孫呉の横江将軍、周瑜とともに赤壁の勝利と孫劉同盟を主導）", "role": "孫呉の賛軍校尉・横江将軍"}, "諸葛均": {"wiki_title": "諸葛均", "ai_desc": "琅邪郡陽都県の人（生没年不詳）。泰山郡丞・諸葛圭の子で、諸葛瑾・諸葛亮の弟。早くに父を亡くし、兄の諸葛亮とともに従父・諸葛玄に伴われて豫章ついで荊州へ移り、隆中に暮らした。のち蜀漢に仕え、官は長水校尉に至った（『三國志』巻35・諸葛亮伝）。", "yomi": "しょかつきん", "name": "諸葛均（しょかつきん：諸葛亮の弟、兄とともに荊州へ移り後に蜀漢の長水校尉に至る）", "role": "蜀漢の長水校尉（諸葛亮の弟）"}, "鄧芝": {"wiki_title": "鄧芝", "ai_desc": "蜀漢の重臣・将軍（？〜251年）、字は伯苗、義陽郡新野の人。後漢の司徒・鄧禹の末裔。劉備の死後に使者として呉へ赴き孫権との同盟を修復し、建興6年（228年）には中監軍・揚武将軍として趙雲とともに箕谷で曹真軍を防ぎ、のち前軍師・前将軍・車騎将軍・陽武亭侯に至った（『三國志』巻45・鄧芝伝、巻36・趙雲伝）。", "yomi": "とうし", "name": "鄧芝（とうし：字は伯苗、呉との同盟修復を担い、趙雲とともに箕谷に出陣した蜀漢の重臣）", "role": "蜀漢の中監軍・のち車騎将軍・陽武亭侯"}, "諸葛瞻": {"wiki_title": "諸葛瞻", "ai_desc": "蜀漢の重臣・将軍（227年〜263年）、字は思遠。丞相・諸葛亮の子。後主・劉禅の皇女（公主）を娶り、羽林中郎将・侍中・尚書僕射・軍師将軍を経て行都護・衛将軍に進み平尚書事を兼ねた。炎興元年（263年）冬、陰平から進軍した魏の鄧艾を綿竹で迎え撃ち、子の諸葛尚や張遵・黄崇・李球らとともに戦死した（『三國志』巻35・諸葛亮伝附諸葛瞻伝）。", "yomi": "しょかつせん", "name": "諸葛瞻（しょかつせん：字は思遠、諸葛亮の子、衛将軍として綿竹で鄧艾軍を迎え撃ち戦死）", "role": "蜀漢の衛将軍・平尚書事（諸葛亮の子）"}, "袁準": {"wiki_title": "袁準", "ai_desc": "字は孝尼、豫州陳郡扶溝県の人（生没年不詳）。曹魏の郎中令・袁渙（字は曜卿）の子。儒学・礼学に精通し、西晋の泰始年間頃に給事中・国子祭酒に至り、政治・人物論集『袁子正論』『袁子正書』（『三國志』裴注では『袁子』と略称）を著した。諸葛亮の治国と器量を高く評価した論考が本巻裴注に引用される（『三國志』巻11・袁渙伝注、巻35・諸葛亮伝注、『晋書』巻83・袁準伝）。", "yomi": "えんじゅん", "name": "袁準（えんじゅん：字は孝尼、陳郡扶溝出身の西晋の儒学者・給事中、袁渙の子・『袁子』の著者）", "role": "西晋の給事中・儒学者（『袁子』の著者）"}, "高翔": {"wiki_title": "高翔 (三国)", "ai_desc": "蜀漢の武将（生没年不詳、史料により「高詳」とも表記）。建安24年（219年）の漢中攻防戦に従軍し、建興6年（228年）の北伐では列柳城に駐屯して郭淮らと戦った。建興9年（231年）の北伐では督前部・右将軍・玄郷侯の地位にあり、同年5月の鹵城の戦いで諸葛亮の命を受け魏延・呉班とともに司馬懿の主力軍を迎え撃ち、大破する戦功を立てた（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、巻40・李厳伝注）。", "yomi": "こうしょう", "name": "高翔（こうしょう：蜀漢の右将軍・玄郷侯、鹵城の戦いで魏延・呉班とともに司馬懿軍を大破した武将）", "role": "蜀漢の督前部・右将軍・玄郷侯"}, "鄧艾": {"wiki_title": "鄧艾", "ai_desc": "荊州義陽郡棘陽県の人（197年〜264年）、字は士載。貧苦と吃音のハンディキャップを乗り越えて司馬懿に見出され、淮南での大規模屯田・水利事業（「鄧艾の屯田」）を推進したのち、隴右・関中戦線で蜀の姜維の北伐を幾度も撃退して征西将軍に進んだ。景元4年（263年）秋の蜀漢征討では、鍾会が剣閣で足止めされる中、自ら精兵を率いて人跡未踏の陰平の間道七百余里を踏破し、綿竹で諸葛瞻を撃破して成都へ迫り、後主・劉禅を降伏させて蜀漢滅亡の最大殊勲を立て太尉に拝された。しかし翌年正月、鍾会の誣告により収監されたのち、田続によって綿竹西で殺害された（『三國志』巻28・鄧艾伝）。", "yomi": "とうがい", "name": "鄧艾（とうがい：字は士載、義陽棘陽出身の曹魏の征西将軍・太尉、陰平の険道を突破して蜀漢を滅ぼした名将）", "role": "曹魏の尚書郎・南安太守・兗州刺史・征西将軍・太尉・鄧侯"}, "曹休": {"wiki_title": "曹休", "ai_desc": "後漢末から三国魏にかけての宗室・武将。沛国譙県の人、字は文烈。曹操の族子で「我が家の千里の駒」と称賛され、虎豹騎を率いて漢中下弁の戦いでは曹洪を補佐して呉蘭を撃破した。文帝・明帝期には鎮東将軍・征東大将軍・大司馬に進んで対呉戦線を統括したが、太和2年（228年）の石亭の戦いの直後に病没した（『三國志』巻9・曹休伝、巻17・張遼伝）。", "yomi": "そうきゅう", "name": "曹休（そうきゅう）"}, "張竦": {"wiki_title": "", "ai_desc": "字は伯松、前漢末の司隷京兆尹出身の文人・官僚（生没年不詳）。名臣・張敞の孫。博学達文で知られ、王莽政権に仕えて淑徳侯に封じられ、陳崇のために王莽の功徳を称える精緻な上奏文を代作した。諸葛亮は『正議』の中で、偽朝に阿って書簡を送ってきた華歆らを「崇・竦が莽の功を称えたごとし」と批判した（『漢書』巻92・陳遵伝、巻99上・王莽伝上）。", "yomi": "ちょうしょう", "name": "張竦（ちょうしょう：字は伯松、京兆尹出身の前漢末の文人・淑徳侯、陳崇のために王莽称賛の上奏文を起草）", "role": "前漢末・新の文人・淑徳侯（張敞の孫）"}, "陳羣": {"wiki_title": "陳羣", "ai_desc": "潁川郡許県の人（?〜236年）、字は長文（『三國志』巻22・陳羣伝）。太丘長・陳寔の孫、大鴻臚・陳紀の子。幼少の頃より祖父・陳寔に「わが宗族を興すのはこの子であろう」と嘱望された。劉備が豫州にいた際に別駕となり、呂布討滅後に曹操に辟召されて司空西曹掾属・治書侍御史・侍中・丞相東西曹掾を歴任し、魏国建国後に御史中丞、ついで吏部尚書・侍中となった。建安24年（219年）冬、孫権が上書して臣と称した際、尚書・桓階とともに漢の命数はすでに尽きたとして曹操に即位（正位）を上奏した（『魏略』）。翌建安25年（220年）、曹操の崩御後に曹丕（文帝）のもとで尚書として「九品官人法（九品中正制）」を制定し、尚書令・司空・録尚書事として文帝・明帝の二代を支えた。", "yomi": "ちんぐん", "name": "陳羣・陳群（ちんぐん：字は長文、潁川許の名門・陳寔の孫、「九品官人法」を創案した曹魏の重臣・司空）", "role": "侍中→尚書→尚書令・鎮軍大将軍・中護軍・司空・録尚書事・潁陰靖侯（豫州潁川郡許県の人）"}, "程普": {"wiki_title": "程普", "ai_desc": "程普（ていふ）：字は徳謀、右北平土垠の人。孫堅の代から従軍した孫呉最古参の宿将。孫策の江東平定・厳白虎討伐・黄祖討伐でも常に主力として活躍し、厳白虎を受け入れた餘杭の許昭を攻めるよう進言した（『三國志』巻55・程普伝、『呉録』）。", "yomi": "ていふ", "name": "程普（ていふ）"}, "荀勗": {"wiki_title": "荀勗", "ai_desc": "字は公曽、豫州潁川郡潁陰県の人（？〜289年、古籍では「荀勖」とも表記）。後漢の司空・荀爽の曾孫。曹魏の大将軍・曹爽の掾や中書通事郎を経て司馬昭の腹心幕僚となり、西晋建国の功により済北郡公（固辞して済北侯）・侍中・中書監に進んだ。泰始10年（274年）、中書令の和嶠とともに陳寿に故蜀丞相・諸葛亮の遺文故事（『諸葛氏集』二十四篇）を整理編定させるよう上奏した。宮中秘籍の分類目録『中経新簿』の編纂や音律の考定にも不朽の業績を残し、のち尚書令に至り成侯と諡された（『晋書』巻39・荀勗伝、『三國志』巻35・諸葛亮伝）。", "yomi": "じゅんきょく", "name": "荀勗（じゅんきょく：字は公曽、潁川潁陰出身の西晋の侍中・中書監・済北成侯、和嶠とともに『諸葛氏集』編定を上奏）", "role": "西晋の侍中・中書監・尚書令・済北侯（荀爽の曾孫）"}, "白寿": {"wiki_title": "", "ai_desc": "蜀漢の将校（？〜228年頃）。先主・劉備以来、四方から集められた歴戦の精鋭幹部（突将）の一人であり、建興5年（227年）に諸葛亮が漢中へ進駐してから翌建興6年（228年）11月に至る1年間に、陽群・馬玉・閻芝・丁立・劉郃・鄧銅らとともに死去した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "はくじゅ", "name": "白寿（はくじゅ：蜀漢の歴戦の将校、諸葛亮の漢中進駐後の1年間に没した精鋭幹部の一人）", "role": "蜀漢の将校"}, "向寵": {"wiki_title": "向寵", "ai_desc": "荊州襄陽郡宜城県の人（？〜240年）。蜀漢の重臣・向朗の兄の子。先主・劉備の在世時に試用されて有能と称えられ、章武2年（222年）の夷陵敗戦時にも彼の営だけは全く損なわれなかった。建興元年（223年）に都亭侯・中部督となって近衛宿衛兵を統率し、建興5年の『出師表』で諸葛亮から「性行は淑均にして、軍事に暁暢す」と称揚され中領軍に進んだが、延煕3年（240年）に漢嘉の異民族反乱討伐で戦没した（『三國志』巻35・諸葛亮伝、巻41・向朗伝附伝）。", "yomi": "しょうちょう", "name": "向寵（しょうちょう：襄陽宜城出身の蜀漢の中部督・中領軍、向朗の甥、『出師表』で営中の事を託された良将）", "role": "蜀漢の中部督・中領軍・都亭侯（向朗の甥）"}, "董厥": {"wiki_title": "董厥", "ai_desc": "字は龔襲、荊州義陽郡の人（生没年不詳）。諸葛亮の丞相府で令史を務め、諸葛亮から「董令史は良士である。私が彼と語り合うたび、思慮深く慎みがあり適切である」と称賛されて主簿に抜擢された。諸葛亮の没後、次第に昇進して尚書僕射となり、陳祗に代わって尚書令に就き、さらに輔国大将軍・南郷侯に進んで諸葛瞻とともに平尚書事（平台事）として国政を統括したが、宦官・黄皓の専権を正すことはできなかった。蜀漢滅亡の翌咸熙元年（264年）春に樊建とともに洛陽へ赴いて相国参軍となり、秋には散騎常侍を兼ねて蜀の慰労に派遣された（『三國志』巻35・諸葛亮伝附董厥伝）。", "yomi": "とうけつ", "name": "董厥（とうけつ：字は龔襲、義陽出身の蜀漢の尚書令・輔国大将軍・南郷侯、諸葛瞻とともに国政を統括）", "role": "蜀漢の尚書令・輔国大将軍・平尚書事・南郷侯、のち魏の相国参軍・散騎常侍"}, "董卓": {"wiki_title": "董卓", "ai_desc": "隴西郡臨洮県の人（?〜192年）。羌族との戦いで武名を挙げ、前将軍・并州牧となった。中平6年（189年）、大将軍・何進の召還を受けて洛陽へ進軍し、何進の死と宮中の混乱に乗じて兵権を掌握すると、少帝（劉弁）を廃して弘農王とし、陳留王（献帝・劉協）を擁立して何太后と弘農王を弑逆した。曹操の才幹を評価して驍騎校尉に上表したが曹操に脱出され、関東諸侯の反董卓連合軍が蜂起すると長安へ遷都した（『三國志』巻6・董卓伝）。", "yomi": "とうたく", "name": "董卓（とうたく：字は仲穎、隴西郡臨洮県出身・少帝を廃し献帝を擁立して朝政を壟断した暴雄）", "role": "後漢の相国・太師・郿侯（隴西郡臨洮県の人）"}, "鄧銅": {"wiki_title": "", "ai_desc": "蜀漢の将校（？〜228年頃）。四方から糾合された歴戦の精鋭将校の一人であったが、建興5年（227年）の諸葛亮の漢中進駐から翌建興6年（228年）11月までの1年間に、陽群・馬玉・閻芝・丁立・白寿・劉郃らとともに死去した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "とうどう", "name": "鄧銅（とうどう：蜀漢の歴戦の将校、諸葛亮の漢中進駐後の1年間に没した精鋭幹部の一人）", "role": "蜀漢の将校"}, "帝堯": {"wiki_title": "堯", "ai_desc": "帝嚳の子で、初め唐（陶唐）に封ぜられたことから「唐堯」と称される（『史記』巻1・五帝本紀、『尚書』堯典）。仁徳と聡明をもって九族を親睦させ百姓を感化し、羲氏・和氏に命じて暦象と四時を定め、晩年には実子の丹朱ではなく民間から孝徳の賢者・舜（虞舜）を見出して政務を摂行させ、天子の位を禅譲した。虞舜の代と合わせた「唐・虞」は、儒家において万世の模範たる黄金の聖代を意味する。", "yomi": "ていぎょう", "name": "帝堯・唐堯（ていぎょう／とうぎょう：姓は伊祁、名は放勲、号は陶唐氏、虞舜とともに理想の聖天子と仰がれた五帝の一）", "role": "中国古代の伝説的聖王（五帝の一、陶唐氏）"}, "諸葛恪": {"wiki_title": "諸葛恪", "ai_desc": "字は元遜、徐州琅邪郡陽都県の人（203年〜253年）。孫呉の大将軍・諸葛瑾の長男で、諸葛喬の兄、諸葛亮の甥。幼少より類まれな才気と弁舌で孫権に愛され、丹陽太守として険阻な山越を平定して威名を挙げ、陸遜の没後に大将軍となって荊州の軍事を継承した。太元2年（252年）に病床の孫権から筆頭輔政大臣（太傅）として幼主・孫亮を託され、同年の東興の戦いで曹魏の大軍を撃破したが、翌年の合肥新城包囲に惨敗して人望を失い、孫峻らの政変により誅殺され三族皆殺しとなった（『三國志』巻64・諸葛恪伝、巻35・諸葛亮伝）。", "yomi": "しょかつかく", "name": "諸葛恪（しょかつかく：字は元遜、諸葛瑾の長男・諸葛喬の兄、孫呉の大将軍・太傅、執政後に政変で誅殺される）", "role": "孫呉の大将軍・太傅・陽都侯（諸葛瑾の長男）"}, "湯王": {"wiki_title": "湯王", "ai_desc": "古代中国の殷（商）王朝の創始者、名は履（『史記』巻3・殷本紀）。毫（現在の河南省商丘市・偃師区などに比定説あり）を拠点として名宰相・伊尹を迎え、諸侯を率いて暴虐な夏の桀王を鳴条の戦いで打ち破り、殷王朝を開いた。周の武王（文王の都・豊鎬から興り牧野で殷の紂王を討った建国者）と並べて「湯・武」と称され、聖王による放伐・王業成就の模範とされる。曹操は、湯王と武王がそれぞれ異なる土地から興って王業を成したことを引き、特定の険阻な地形に固執せず機に応じて変化することの重要性を説いた（『三國志』巻1・武帝紀注引『傅子』）。", "yomi": "とうおう", "name": "湯王・成湯（とうおう／せいとう：名は履、殷王朝の初代天子、伊尹を登用して夏の桀王を討ち殷を開く）", "role": "殷（商）王朝の建国者（初代天子）"}, "伊尹": {"wiki_title": "伊尹", "ai_desc": "殷の湯王を補佐して夏の桀王を討ち、殷王朝を樹立した名宰相（『史記』巻3・殷本紀）。湯王の孫・太甲が即位後に暴虐で湯王の法に背いた際、伊尹は太甲を桐宮へ追放して3年間自ら国政を摂政し、太甲が過ちを悔いて善に立ち返ると再び迎えて政権を返上した。曹操は霍光とともに「君主の廃置・進退を成し遂げた古の例外的な成功例」として伊尹の名を挙げている。", "yomi": "いいん", "name": "伊尹（いいん：名は摯、殷の湯王を佐けて夏を滅ぼし、太甲を訓戒した伝説的名宰相）", "role": "殷王朝創業の名宰相・阿衡"}, "呉班": {"wiki_title": "呉班", "ai_desc": "字は元雄、兗州陳留郡の人（生没年不詳）。大将軍・何進の官属であった呉匡の子で、蜀漢の車騎将軍・呉壱（呉懿）の族弟。豪侠・寛大な気風で知られ、章武元年（221年）の夷陵遠征では先鋒を務めた。後主・劉禅の代に後将軍・安楽亭侯から驃騎将軍・綿竹侯に至り、建興9年（231年）5月の鹵城の戦いでは魏延・高翔とともに司馬懿軍を撃破した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、巻45・楊戯伝『季漢輔臣賛』）。", "yomi": "ごはん", "name": "呉班（ごはん：字は元雄、陳留出身の蜀漢の後将軍・驃騎将軍、呉壱の族弟）", "role": "蜀漢の後将軍・驃騎将軍・綿竹侯（陳留の人）"}, "劉弘": {"wiki_title": "劉弘 (西晋)", "ai_desc": "字は季和、豫州沛国相県の人（236年〜306年）。曹魏の揚州刺史・劉靖の子で、西晋の武帝・司馬炎と幼少期に同居して学んだ旧友。寧朔将軍・仮節・監幽州諸軍事として北辺を安定させたのち、太安・永興年間に使持節・侍中・鎮南将軍・都督荊州諸軍事・荊州刺史として襄陽に鎮し、張昌の乱を平定して流民の帰農と才幹本位の登用を進め、江漢を粛然と治めた。永興年間（304〜306年）に隆中の諸葛亮故宅を訪れて碑碣を立て、太傅掾の李興に命じて顕彰の銘文を作らせた。のち車騎将軍・開府儀同三司に進み在任中に没し、元公と諡された（『晋書』巻66・劉弘伝、『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "りゅうこう", "name": "劉弘（りゅうこう：字は季和、沛国相県出身の西晋の鎮南将軍・荊州刺史、隆中の諸葛亮故宅を訪れ碑碣を立てた名臣）", "role": "西晋の鎮南将軍・荊州刺史・車騎将軍・新城元公"}, "李密": {"wiki_title": "李密 (西晋)", "ai_desc": "字は令伯、一名は虔、益州犍為郡武陽県の人（224年〜287年）。蜀漢の朱提太守・李光（早世）の子で、祖母の劉氏に慈しみ育てられ至孝をもって聞こえた。蜀漢で尚書郎や大将軍主簿を務め、たびたび呉への使者に立って弁才を称えられた。蜀漢滅亡後、西晋の武帝・司馬炎から太子洗馬に徴召された際、高齢病弱の祖母への孝養を涙ながらに訴えた名文『陳情表』（『陳情事表』）を奉って武帝を深く感動させた。祖母の没後に出仕し、太子洗馬・温県令・漢中太守を歴任した。子の李興は隆中の諸葛亮故宅の碑文を撰した（『晋書』巻88・孝友・李密伝、『華陽国志』巻11、『三國志』巻35・諸葛亮伝注引王隠『晋書』）。", "yomi": "りみつ", "name": "李密（りみつ：字は令伯、犍為武陽出身の蜀漢尚書郎・西晋漢中太守、名文『陳情表』の作者・李興の父）", "role": "蜀漢の尚書郎・西晋の太子洗馬・漢中太守（『陳情表』撰者）"}, "劉璋": {"wiki_title": "劉璋", "ai_desc": "荊州江夏郡竟陵県の人（?〜220年頃）、字は季玉。前漢の魯恭王・劉余の末裔で、益州牧・劉焉の末子。興平元年（194年）に父・劉焉が病没すると、帳下司馬・趙韙らの推戴と朝廷の追認によって益州牧を継いだ。漢中の張魯と対立し、長らく巴蜀の険に拠って中原の朝廷への徴発・貢納を絶っていたが、建安13年（208年）秋に曹操が荊州へ南征して劉琮を降すと威勢に恐れを抱き、陰溥や別駕・張松らを相次いで使者として派遣し、初めて朝廷の徴役を受け入れて曹操の軍へ補充兵を送った。しかし張松が曹操に冷遇されたことに反発して劉備の引き入れを画策したことから、のち建安19年（214年）に劉備に成都を包囲されて降伏し、荊州の公安へ移されたのち呉の孫権に荊州牧とされ没した（『三國志』巻1・武帝紀、巻31・劉二牧伝）。", "yomi": "りゅうしょう", "name": "劉璋（りゅうしょう：字は季玉、江夏郡竟陵県出身の漢室宗親・益州牧、建安13年に初めて曹操へ遣使・送兵して帰順を示す）", "role": "後漢末の益州牧・振威将軍（荊州江夏郡竟陵県の人、魯恭王劉余の末裔・劉焉の末子）"}, "司馬懿": {"wiki_title": "司馬懿", "ai_desc": "河内郡温県の人（179年〜251年）、字は仲達、司馬防の次男で司馬朗の弟（『晋書』巻1・宣帝紀）。建安13年（208年）に丞相となった曹操に召されて文学掾となり、魏王国の太子中庶子として曹丕を補佐したのち、文帝・明帝・斉王芳の代に大将軍・太尉・太傅を歴任し、諸葛亮の北伐阻止や遼東の公孫淵討滅に大功を立て、正始10年（249年）の高平陵の変によって曹魏政権の実権を掌握した。没後に晋王に封ぜられた次男・司馬昭によって「晋の宣王」と追尊され、孫の司馬炎（武帝）による西晋建国後に高祖宣皇帝と追尊された。", "yomi": "しばい", "name": "司馬懿・司馬宣王（しばい／しばせんおう：字は仲達、司馬防の次男、曹魏の四代に仕えた重臣・西晋の宣帝）", "role": "曹魏の丞相・太尉・太傅→追尊晋宣王・高祖宣皇帝"}, "戴陵": {"wiki_title": "戴陵", "ai_desc": "曹魏の武将（生没年不詳、『晋書』宣帝紀等では「戴凌」とも表記）。征蜀護軍を務めて関中・隴右の対蜀防衛に従事した。太和5年（蜀の建興9年、231年）に諸葛亮が祁山を包囲した際、長安から西征した司馬懿の指揮下に入り、費曜とともに精兵四千を率いて要衝・上邽の守備にあたった（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、『晋書』巻1・宣帝紀）。", "yomi": "たいりょう", "name": "戴陵（たいりょう：曹魏の征蜀護軍、建興9年の祁山攻防戦で費曜とともに上邽を守備した部将）", "role": "曹魏の征蜀護軍・部将"}, "張郃": {"wiki_title": "張郃", "ai_desc": "冀州河間郡鄚県の人（?〜231年）、字は儁乂。黄巾の乱に際して韓馥に属し、韓馥の敗後は袁紹に仕えて公孫瓚討滅に功を立て寧国中郎将となった。建安5年（200年）10月の官渡の戦いでは、烏巣を急襲された袁紹に対し「まず淳于瓊を救援すべきだ」と進言したが郭図に阻まれ、高覧とともに曹洪の本営攻撃へ差し向けられた。しかし烏巣陥落の報が届き、さらに郭図が失敗の罪を張郃らに転嫁しようとしたため曹洪の陣へ投降し、曹操から「韓信が漢に帰したようなものだ」と大いに歓迎されて偏将軍・都亭侯に拝された（『三國志』巻1・武帝紀、巻17・張郃伝）。のち夏侯淵・曹真を輔佐して関中・街亭・陳倉などで蜀軍を幾度も破り、魏の五将軍の一人に数えられた。", "yomi": "ちょうこう", "name": "張郃（ちょうこう：字は儁乂、河間郡鄚県出身の名将、官渡の戦いで曹操に帰順しのち魏の征西車騎将軍・鄚壮侯）", "role": "後漢末〜三国魏の偏将軍・平狄将軍・左将軍・征西車騎将軍・鄚壮侯（冀州河間郡鄚県の人）"}, "劉表": {"wiki_title": "劉表", "ai_desc": "兗州山陽郡高平県の人（142年〜208年）。前漢の魯恭王・劉余の末裔で、党人「八俊」の一人に数えられた名士。初平元年（190年）に荊州刺史として単騎で宜城に入り、蒯越・蒯良・蔡瑁ら現地豪族の協力を得て宗賊を平定し、襄陽を州治として長江・漢水流域の荊州を掌握した。袁紹と同盟を結んで南陽にいた袁術と敵対し、初平3年（192年）に孫堅を敗死させ、翌初平4年（193年）春には袁術の糧道を遮断して袁術を陳留方面へ追い出した（『三國志』巻6・劉表伝、『後漢書』巻74下・劉表伝）。", "yomi": "りゅうひょう", "name": "劉表（りゅうひょう：字は景升、山陽郡高平県出身の漢室宗親・荊州牧・鎮南将軍・成武侯、「八俊」の一人）", "role": "後漢末の荊州刺史・荊州牧・鎮南将軍・成武侯（兗州山陽郡高平県の人、魯恭王劉余の末裔）"}, "陳崇": {"wiki_title": "", "ai_desc": "前漢末から新にかけての官僚（生没年不詳）。前漢平帝の元始年間、大司徒司直として安漢公・王莽の謙譲と功徳を周公になぞらえて絶賛する長大な上奏（張竦が起草したと伝えられる）を奉り、王莽政権下で統睦侯・南陽太守に至った。諸葛亮は『正議』において、曹魏の簒奪を粉飾する華歆・王朗らを陳崇・張竦になぞらえて糾弾した（『漢書』巻99上・王莽伝上、『三國志』巻35・諸葛亮伝注）。", "yomi": "ちんすう", "name": "陳崇（ちんすう：前漢末の大司徒司直・統睦侯、張竦とともに王莽の功徳を称える上奏を行った官僚）", "role": "前漢末・新の大司徒司直・統睦侯"}, "冉雍": {"wiki_title": "冉雍", "ai_desc": "字は仲弓、春秋時代末期の魯国の人（前522年〜？）。孔子の高弟で、「孔門十哲」の徳行科に顔回・閔子騫・冉伯牛と並び列せられた大賢。身分は低い父から生まれたが寛厚・簡重な徳器を備え、孔子から「雍や南面せしむべし（君主・為政者の座に就かせるに足る器である）」と最大級の称賛を受けた。袁準は『袁子』において諸葛亮の徳と統治の器量をこの仲弓への評言になぞらえている（『論語』雍也篇、『史記』巻67・仲尼弟子列伝、『三國志』巻35・諸葛亮伝注引『袁子』）。", "yomi": "ぜんよう", "name": "冉雍・仲弓（ぜんよう／ちゅうきゅう：孔門十哲の一人、孔子から「雍や南面せしむべし」と王者の器を称えられた高弟）", "role": "春秋時代・魯の学者（孔門十哲・徳行科）"}, "耿弇": {"wiki_title": "耿弇", "ai_desc": "司隸右扶風茂陵県の人（3年〜58年）。上谷太守・耿況の子。光武帝（劉秀）の河北平定から従軍し、群雄の張歩が割拠する青州・斉地の平定を任された。建武5年（29年）、劇県にいた張歩に対し、耿弇はまず臨菑の西にある精兵の拠点「西安城」を某日に攻めると宣言して西安城の守備を固めさせ、一方で無防備になっていた斉の首都「臨菑城」を電撃的に急襲して半日で陥落させ、西安の敵軍をも戦わずして撤退させた（『後漢書』巻19・耿弇伝）。曹操は孫臏と並べてこの耿弇の陽動・虚実戦術を引用した。", "yomi": "こうえん", "name": "耿弇（こうえん：字は伯昭、扶風茂陵県出身の後漢の建威大将軍・好畤侯、雲台二十八将の第4位）", "role": "後漢創業の功臣・建威大将軍・好畤侯（司隸右扶風茂陵県の人、雲台二十八将の第4位）"}, "張良": {"wiki_title": "張良", "ai_desc": "字は子房、韓の宰相家の出身で前漢創業の功臣・「漢の三傑」の一人（？〜前186年）。秦の始皇帝暗殺未遂（博浪沙）ののち下邳で黄石公より太公望の兵法を授かったと伝わり、劉邦に帰属して帷幄のなかで数々の奇策を献じ、鴻門の会での危機救出や項羽打倒に決定的な役割を果たして留侯に封じられた（『史記』巻55・留侯世家、『漢書』巻40・張良伝）。", "yomi": "ちょうりょう", "name": "張良（ちょうりょう：字は子房、前漢の高祖・劉邦を帷幄で補佐した「漢の三傑」の一人・留侯）", "role": "前漢創業の謀臣・留侯"}, "項羽": {"wiki_title": "項羽", "ai_desc": "下相県の人（前232年〜前202年）、名は籍、字は羽。楚の将軍・項燕の孫。叔父・項梁とともに秦末の反乱で挙兵し、鉅鹿の戦いで秦の主力軍を撃破して秦帝国を滅ぼし、「西楚の覇王」と称して諸侯を分封した。その後、漢王・劉邦（漢の高祖）と約5年間にわたる楚漢戦争を繰り広げた末、前202年に垓下で四面楚歌に陥り烏江のほとりで自刃した。死後、最後まで項羽に殉じようとした魯の地を開城させるため、劉邦は項羽の首を示した上で魯公の礼をもって項羽を穀城に葬り、自ら墓前で発喪・泣哭して去った（『史記』巻7・項羽本紀）。東晋の孫盛は、曹操が袁紹の墓前で哭泣した行為を、この漢の高祖（劉邦）による項氏（項羽）への哭泣と並べて政道上の失策と論評した。", "yomi": "こうう", "name": "項氏・項羽（こうう：名は籍、字は羽、秦末の西楚の覇王、高祖劉邦と天下を争い烏江に自刃）", "role": "秦末の西楚の覇王（下相県の人、楚の名将・項燕の孫）"}, "李服": {"wiki_title": "王子服", "ai_desc": "後漢末の偏将軍・侍中である王子服（『三國志』巻1・武帝紀や『後漢書』献帝紀等では「王子服」または「王服」と記され、『後出師表』では「李服」と表記される、？〜200年）。曹操に任用されていたが、建安4年（199年）頃に車騎将軍・董承や劉備らとともに献帝の密詔（衣帯詔）を受けて曹操誅殺を計画し、建安5年（200年）正月に計画が露見して董承らとともに処刑された（『三國志』巻1・武帝紀、巻32・先主伝、巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "りふく", "name": "李服・王子服（りふく：後漢末の偏将軍・侍中、曹操に任用されながら董承らと曹操誅殺を謀り処刑された人物）", "role": "後漢末の偏将軍・侍中（王子服の異記）"}, "王隠": {"wiki_title": "王隠", "ai_desc": "陳郡陳県の人（生没年不詳、4世紀前半に活動）、字は処叔（『晋書』巻82・王隠伝）。西晋の歴陽令であった父・王銓がひそかに西晋の歴史記録を収集していた遺業を受け継ぎ、永嘉の乱を避けて江南へ渡ったのち、東晋の元帝（司馬睿）の太興年間に著作郎として召されて晋史編纂を命じられ、鎮西将軍・庾亮の援助を受けて咸康6年（340年）に『晋書』九十三巻を奏上した。その『晋書』は散逸したが、裴松之『三國志』注や『世説新語』注などに多くの逸文が引かれ、一級史料として重んじられている。", "yomi": "おういん", "name": "王隠（おういん：字は処叔、陳郡陳県の人、父の遺志を継いで東晋初期に九十三巻の『晋書』を撰述した史家）", "role": "東晋の著作郎・歴史家（王隠『晋書』撰者）"}, "諸葛尚": {"wiki_title": "諸葛尚", "ai_desc": "徐州琅邪郡陽都県の人（245年頃〜263年）。蜀漢の衛将軍・諸葛瞻の長男で、諸葛亮の孫、諸葛京の兄。景耀6年（炎興元年、263年）冬、陰平から侵攻した魏の征西将軍・鄧艾の軍を父・諸葛瞻とともに綿竹で迎え撃った。蜀軍が大敗すると、「父子とも国から重恩を荷いながら、早くに黄皓を斬らなかったために傾敗を招いたのだ、生きて何になろうか！」と嘆息し、馬を駆って魏軍へ突撃し父とともに戦死した（『三國志』巻35・諸葛亮伝附諸葛瞻伝および注引『華陽国志』）。", "yomi": "しょかつしょう", "name": "諸葛尚（しょかつしょう：諸葛瞻の長男・諸葛亮の孫、綿竹の戦いで黄皓を斬らなかったことを嘆き父とともに戦死）", "role": "蜀漢の将士（諸葛瞻の長男・諸葛亮の孫）"}, "石韜": {"wiki_title": "石韜", "ai_desc": "字は広元、豫州潁川郡の人（生没年不詳）。建安初年、戦乱を避けて荊州に赴き、諸葛亮・徐庶・孟建らとともに遊学して経学の精熟に努め、諸葛亮から「仕官すれば刺史・郡守に至ろう」と評された。建安13年（208年）に徐庶とともに北へ帰して曹操に仕え、曹魏で典農校尉・郡守を歴任した（『三國志』巻35・諸葛亮伝注引『魏略』）。", "yomi": "せきとう", "name": "石韜（せきとう：字は広元、潁川出身の学者・官僚、荊州で諸葛亮・徐庶らと遊学し曹魏の郡守・典農校尉に至る）", "role": "曹魏の郡守・典農校尉（諸葛亮の学友）"}, "王朗": {"wiki_title": "王朗", "ai_desc": "東海郡郯県の人（？〜228年）。太尉・楊賜に師事して経学に通じ、徐州刺史・陶謙の治中を経て会稽太守となったが、孫策の江東進攻に抗戦して敗れ、曹操に召されて諫議大夫・参司空軍事・丞相軍師祭酒となった。建安18年（213年）5月の魏公勧進表に祭酒として連署し、魏国が建つと魏郡太守・少府・奉常・大理を務め、曹丕（文帝）・曹叡（明帝）の代には御史大夫・司空・司徒・蘭陵侯に昇り、『易』『春秋』『孝経』『周官』の伝注を著した（『三國志』巻1・武帝紀注引『魏書』、巻13・王朗伝）。", "display_name": "王朗（東海・会稽太守／司徒）", "homonyms": [{"key": "王朗_将軍", "label": "王朗（曹操軍の将軍・初平3年）"}], "yomi": "おうろう", "name": "王朗（おうろう：字は景興、本名は厳、東海郯県の人、元会稽太守、当時丞相軍師祭酒、のち魏の司空・司徒）", "role": "後漢末・曹魏の経学者・三公（会稽太守・諫議大夫・参司空軍事・軍師祭酒→魏の御史大夫・司空・司徒）"}, "王朗_将軍": {"wiki_title": "", "ai_desc": "後漢末、曹操配下の将軍。初平3年（192年）に曹操が兗州を領して済北相・鮑信の徒衆を併せた際、都伯となった于禁がこの将軍・王朗の配下に属した。王朗は于禁を並外れた器量と認めて「大将軍に任ずべき才である」と曹操に推薦し、これにより于禁は軍司馬に抜擢された。当時すでに会稽太守に任じられていた東海郡の王朗（字は景興、のち魏の司徒）とは同姓同名の別人物とする考証がある（『三國志』巻17・于禁伝、盧弼『三國志集解』引趙一清・何焯・銭大昭説）。", "display_name": "王朗（曹操軍の将軍）", "homonyms": [{"key": "王朗", "label": "王朗（東海・会稽太守／のち魏の司徒）"}], "yomi": "おうろう", "name": "王朗（曹操軍の将軍）（おうろう）"}, "王双": {"wiki_title": "王双", "ai_desc": "曹魏の将軍（？〜228年、字は子全と伝わる）。黄初3年（222年）の濡須口攻撃で曹仁配下の部将として参戦し、呉の朱桓に捕らえられたのち魏へ送還された経歴を持つ。太和2年（蜀の建興6年、228年）冬、陳倉の包囲を解いて退却する諸葛亮を騎兵を率いて追撃したが、諸葛亮の反撃を受けて撃破され戦死した（『三國志』巻3・明帝紀、巻35・諸葛亮伝、巻56・朱桓伝）。", "yomi": "おうそう", "name": "王双（おうそう：曹魏の将軍、建興6年冬に陳倉から退却する諸葛亮を追撃して討ち取られた武将）", "role": "曹魏の将軍"}, "楊儀": {"wiki_title": "楊儀", "ai_desc": "字は威公、荊州襄陽郡の人（？〜235年）。はじめ荊州刺史・傅群の主簿であったが関羽ついで劉備に帰属して尚書となり、建興3年（225年）より丞相参軍、建興8年（230年）に長史・綏軍将軍へ進んで北伐の軍務編成と兵糧差配を担った。建興12年（234年）8月に諸葛亮が五丈原で没すると、姜維らとともに整然と全軍を撤退させて司馬懿の追撃を退け、帰還後に魏延を討って中軍師となったが、処遇への不満から不遜の言を吐き、翌年廃されて自害した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、巻40・楊儀伝）。", "yomi": "ようぎ", "name": "楊儀（ようぎ：字は威公、襄陽出身の蜀漢の丞相長史・中軍師、諸葛亮没後の五丈原撤退を指揮）", "role": "蜀漢の丞相長史・綏軍将軍・中軍師（襄陽の人）"}, "蔣済": {"wiki_title": "蒋済", "ai_desc": "揚州楚国平阿県の人（?〜249年）、字は子通。郡の計吏・揚州治中・別駕を務め、建安13年（208年）冬の孫権による合肥包囲では偽書を用いて孫権軍を撤退させた。のち曹操に召されて丹楊太守・丞相主簿西曹属となり、建安24年（219年）秋に関羽が于禁の七軍を水没させて威を華夏に震わせ、曹操が許都からの遷都を議した際には、司馬懿（宣王）とともに「関羽が志を得るのは孫権の望むところではないゆえ、江南割譲を条件に孫権を動かして関羽の背後を衝かせるべきだ」と献策して樊城の包囲を解かせた。曹魏では文帝・明帝・斉王芳の三代に仕えて護軍将軍・領軍将軍・太尉・都郷侯に至り、高平陵の変の後に病没した（『三國志』巻14・蔣済伝、巻36・関羽伝）。", "yomi": "しょうさい", "name": "蔣済・蒋済（しょうさい：字は子通、楚国平阿出身の曹操の丞相主簿西曹属、司馬懿とともに孫権に背後を襲わせる対関羽策を進言、のち魏の太尉）", "role": "後漢末〜曹魏の重臣（揚州別駕・丞相主簿西曹属→散騎常侍・中護軍・領軍将軍・太尉・都郷景侯）"}, "召公奭": {"wiki_title": "召公奭", "ai_desc": "周王室と同姓（姫姓）の支族で、文王・武王・成王・康王に仕えた建国の元勲（諡は康公、『三國志』原文では「邵康公」「邵」と表記）。武王の克殷後に北方の燕に封じられ（長子を赴任させ自身は周都に留まった）、成王期には「三公」の太保となり、陝（弘農郡陝県）を境に周公旦と天下を東西に分掌する「二伯」として西方を統轄し、甘棠の樹の下で政務を聴いた善政が『詩経』召南「甘棠」に詠われた。また成王の命を奉じて斉の太公望に五侯九伯専征の命を伝えたとされる（『史記』巻34・燕召公世家、『春秋左氏伝』僖公四年）。", "yomi": "しょうこうせき", "name": "召公奭・邵康公（しょうこうせき／しょうこうこう：姓は姫、名は奭、諡は康公、周の太保・燕の始祖、周公旦と並び二伯として周室を輔佐）", "role": "西周初期の元老・太保・西伯（燕国の始祖、『三國志』原文は「邵」と表記）"}, "周術": {"wiki_title": "", "ai_desc": "後漢末の豫章太守（？〜195年頃）。興平年間頃に在任中に病没し、その死後に荊州牧・劉表が諸葛玄を後任の豫章太守に上表した一方、漢朝は朱皓を派遣したため豫章の帰属をめぐる抗争が生じた（『三國志』巻35・諸葛亮伝注引『献帝春秋』）。", "yomi": "しゅうじゅつ", "name": "周術（しゅうじゅつ：後漢末の豫章太守、病没後に諸葛玄と朱皓の後任抗争が生じる）", "role": "後漢末の豫章太守"}, "諸葛亮": {"wiki_title": "諸葛亮", "ai_desc": "諸葛亮（しょかつりょう）：字は孔明。蜀漢の丞相。", "yomi": "しょかつりょう", "name": "諸葛亮（しょかつりょう）"}, "司馬睿": {"wiki_title": "元帝 (東晋)", "ai_desc": "字は景文、河内郡温県の人（276年〜323年、東晋の初代皇帝・元帝、在位317年〔晋王〕／318年〔皇帝〕〜322年、廟号は中宗）。司馬懿の曾孫で琅邪王・司馬覲の子。永嘉の乱に際し王導の献策で建業（建康）へ移鎮し、西晋滅亡後に江南で即位して東晋王朝を開いた。敗軍した劉琨から奉られた箋に諸葛亮吐血の虚記が引用されていたことが裴松之注に言及される（『晋書』巻6・元帝紀、『三國志』巻35・諸葛亮伝注）。", "yomi": "しばえい", "name": "司馬睿・晋元帝（しばえい／しんげんてい：字は景文、司馬懿の曾孫、建康に東晋王朝を開いた初代皇帝）", "role": "東晋の初代皇帝（中宗元皇帝）"}, "徐庶": {"wiki_title": "徐庶", "ai_desc": "字は元直、初名は福（単家〔寒門〕出身のため単福とも誤伝される）、豫州潁川郡の人（？〜230年代頃）。若くして任侠・撃剣を好んだがのちに学問へ転じ、戦乱を避けて荊州へ赴き諸葛亮・石韜・孟建らと親交を結んだ。新野の劉備に仕えて器量を認められ「臥龍」諸葛亮を推挙したが、建安13年（208年）の長阪敗走時に母が曹操軍に捕らえられたため辞去して北へ帰し、曹魏では右中郎将・御史中丞に至った（『三國志』巻35・諸葛亮伝および注引『魏略』）。", "yomi": "じょしょ", "name": "徐庶（じょしょ：字は元直・初名は福、潁川出身の幕僚、劉備に諸葛亮を推挙し後に曹魏の御史中丞に至る）", "role": "劉備の幕僚・のち曹魏の右中郎将・御史中丞"}, "劉琮": {"wiki_title": "劉琮 (劉表の子)", "ai_desc": "兗州山陽郡高平県の人（生没年不詳）。荊州牧・劉表の次男で、長男・劉琦の弟。劉表の後妻・蔡氏の姪を妻としたことから蔡氏および蔡瑁・張允らの後ろ盾を得て寵愛され、建安13年（208年）8月に父・劉表が病没すると兄・劉琦を退けて後継者となり襄陽に駐屯した。同年9月、南征してきた曹操の軍が新野に到達すると、蒯越・韓嵩・傅巽らの進言を容れて曹操への降伏を決断した。このとき樊城に駐屯していた劉備には事前に降伏を知らせなかったため、気付いた劉備は夏口へと南走した。降伏後、曹操から青州刺史・列侯に拝され、のちに諫議大夫・参同軍事へと優遇された（『三國志』巻1・武帝紀、巻6・劉表伝）。", "yomi": "りゅうそう", "name": "劉琮（りゅうそう：荊州牧・劉表の次男、後妻蔡氏・蔡瑁らに擁立されて後を継ぎ、建安13年9月に曹操へ降伏）", "role": "後漢末の荊州牧・のち青州刺史・諫議大夫・参同軍事・列侯（兗州山陽郡高平県の人、劉表の次男・劉琦の弟）"}, "劉郃": {"wiki_title": "", "ai_desc": "蜀漢の将校（？〜228年頃）。四方から糾合された歴戦の精鋭将校の一人であったが、建興5年（227年）の諸葛亮の漢中進駐から翌建興6年（228年）11月までの1年間に、陽群・馬玉・閻芝・丁立・白寿・鄧銅らとともに死去した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "りゅうごう", "name": "劉郃（りゅうごう：蜀漢の歴戦の将校、諸葛亮の漢中進駐後の1年間に没した精鋭幹部の一人）", "role": "蜀漢の将校"}, "孫武": {"wiki_title": "孫武", "ai_desc": "春秋時代の斉の人で、呉王闔閭に仕えて楚を破った不世出の兵法家。その著書『孫子（孫武十三篇）』は兵学の最高古典とされ、曹操はこれに史上最初の体系的な注釈（『孫子略解』・魏武注孫子）を施して後世に伝えた。", "yomi": "そんぶ", "name": "孫武（そんぶ：春秋時代の斉出身の兵法家、『孫子』十三篇の著者）", "role": "春秋時代の呉の将軍・兵法家（『孫子』十三篇の撰者）"}, "趙雲": {"wiki_title": "趙雲", "ai_desc": "蜀漢の将軍（？〜229年）、字は子龍、常山真定の人。本郡の推挙を受けて義従の吏兵を率い公孫瓚に属したのち、平原相・劉備に随従して主騎となり、鄴での募兵を経て荊州へ従った。建安13年（208年）の当陽長阪では幼少の後主・劉禅と甘夫人を抱えて危難から救出し牙門将軍に昇進。江南平定後に偏将軍・領桂陽太守となり、劉備の入蜀時は留営司馬として荊州に留まり、孫夫人が劉禅を連れて呉へ帰ろうとした際には張飛とともに長江を遮断して奪還した。のち入蜀して翊軍将軍、漢中争奪戦での空営の計、建興年間の征南将軍・永昌亭侯・鎮東将軍を歴任し、建興7年（229年）に死去、景耀4年（261年）に順平侯と追諡された（『三國志』巻36・趙雲伝および注引『雲別伝』）。", "yomi": "ちょううん", "name": "趙雲（ちょううん：字は子龍、常山真定の人、長阪で劉禅を救出し鎮東将軍・順平侯に至る）", "role": "蜀漢の鎮東将軍・永昌亭侯（諡は順平侯）"}, "蘇秦": {"wiki_title": "蘇秦", "ai_desc": "東周の洛陽の人（?〜前284年頃）。鬼谷先生に縦横の術を学び、秦の恵王に退けられたのち困窮の中で『太公陰符』を熟読して揣摩の術を完成させた。北方の弱小国であった燕の文侯に説いて趙・韓・魏・斉・楚と結ぶ対秦同盟「六国合従」を成立させ、合従の長として六国の相印を兼ね佩び、十五年間にわたり秦兵を函谷関から出させなかったとされる。また文侯没後に斉の宣王が喪に乗じて燕の十城を奪うと、斉へ赴いて宣王を説き伏せ十城を返還させて弱小の燕を救った。燕で母と私通したとの誹りや尾生の信を守らぬとの批判に対しても「信義や廉直の名は自らのためのものにすぎず、進取の臣は国の尊栄を図る」と弁明し、のち燕の昭王（または易王・噲）のために斉で反間活動に従事し、斉で刺客に襲われ車裂の刑に処された（『戦国策』燕策一、『史記』巻69・蘇秦列伝）。", "yomi": "そしん", "name": "蘇秦（そしん：字は季子、東周の洛陽の人、戦国時代に燕の文侯・易王に仕え六国合従を成し遂げた縦横家）", "role": "戦国時代の縦横家・六国合従の盟長（武安君）"}, "馬玉": {"wiki_title": "", "ai_desc": "蜀漢の将校（？〜228年頃）。四方から糾合された歴戦の精鋭将校の一人であったが、建興5年（227年）の諸葛亮の漢中進駐から翌建興6年（228年）11月までの1年間に、陽群・閻芝・丁立・白寿・劉郃・鄧銅らとともに死去し、『後出師表』においてその喪失が惜しまれた（『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "ばぎょく", "name": "馬玉（ばぎょく：蜀漢の歴戦の将校、諸葛亮の漢中進駐後の1年間に没した精鋭幹部の一人）", "role": "蜀漢の将校"}, "裴松之": {"wiki_title": "裴松之", "ai_desc": "本貫は河東郡聞喜県の人（372年〜451年）、字は世期。南朝宋の文帝（劉義隆）から陳寿『三國志』が簡略に過ぎるとして注釈編纂の勅命を受け、元嘉6年（429年）に全六十五巻の『三國志注』（裴松之注）を完成させて上表した（自称の「臣松之」は皇帝への上表形式による）。現在では散逸してしまった王沈『魏書』・魚豢『魏略』・韋昭『呉書』・司馬彪『九州春秋』・郭頒『世語』など二百種以上の漢末・魏晋期の史書・家伝・記録を博捜して本文の欠落や異伝を補い、あわせて史料批判や人物論評を加えており、文帝から「不朽の業」と激賞された（『宋書』巻64・裴松之伝）。", "yomi": "はいしょうし", "name": "裴松之（はいしょうし：字は世期、河東郡聞喜県出身の南朝宋の歴史家・中書侍郎・太中大夫、『三國志注』の撰者）", "role": "東晋末〜南朝宋の歴史家・中書侍郎・司州主簿・永嘉太守・国子博士・太中大夫（本貫は司州河東郡聞喜県）"}, "袁紹": {"wiki_title": "袁紹", "ai_desc": "豫州汝南郡汝陽県の人（?〜202年）。四代にわたり三公を輩出した名門・汝南袁氏の出身で、若き日の曹操の盟友であり最大の宿敵。西園八校尉の中軍校尉・司隷校尉となり、大将軍・何進に宦官の皆殺しと董卓ら地方軍閥の召還を進言した。何進が暗殺されると宮中に突入して宦官二千余人を族滅したが、入京した董卓と対立して冀州へ奔り、反董卓連合軍の盟主となった。のち韓馥から冀州を譲り受け、公孫瓚を滅ぼして冀・青・幽・并の四州を制覇したが、建安5年（200年）の官渡の戦いと翌建安6年の倉亭の戦いで曹操に連敗し、建安7年（202年）5月に発病して血を吐き没した（『三國志』巻6・袁紹伝）。", "yomi": "えんしょう", "name": "袁紹（えんしょう：字は本初、四世三公の名門・のち冀州牧・大将軍として河北に覇を唱える）", "role": "後漢末の群雄・司隷校尉・冀州牧・大将軍・鄴侯（豫州汝南郡汝陽県の人）"}, "陽群": {"wiki_title": "", "ai_desc": "蜀漢の将校（？〜228年頃、「陽羣」とも表記）。先主・劉備の時代より数十年にわたり四方から糾合された歴戦の精鋭幹部の一人であり、建興5年（227年）に諸葛亮が漢中へ進駐してから翌建興6年（228年）11月に至る1年の間に、馬玉・閻芝・丁立・白寿・劉郃・鄧銅らとともに相次いで死去した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』所載『後出師表』）。", "yomi": "ようぐん", "name": "陽群（ようぐん：蜀漢の歴戦の将校、諸葛亮の漢中進駐後の1年間に没した精鋭幹部の一人）", "role": "蜀漢の将校"}, "驩兜": {"wiki_title": "驩兜", "ai_desc": "中国上古の神話・『書経』（堯典・舜典）に伝わる凶臣で「四凶」の一人。帝堯の時代に共工を治水官に推挙して帝堯に退けられ、のち舜によって南方の崇山へ追放された。諸葛亮は『正議』において、巧言をもって漢室の正統を誣いようとする魏臣の言説を「驩兜が天にはびこるの辞」として斥けた（『尚書』堯典、『史記』巻1・五帝本紀）。", "yomi": "かんとう", "name": "驩兜（かんとう：『書経』堯典に見える上古の「四凶」の一人、舜により崇山へ追放された凶臣）", "role": "中国上古神話の「四凶」の一人"}, "管仲": {"wiki_title": "管仲", "ai_desc": "春秋時代の斉の名宰相（?〜前645年）、名は夷吾、字は仲。親友・鮑叔牙の推挙により斉の桓公に抜擢され、内政・軍制改革と尊王攘夷によって桓公を春秋五覇の筆頭に導き、孔子からも「管仲なかりせば吾それ被髪左衽せん」と称えられた（『史記』巻62・管晏列伝、『論語』憲問篇）。曹操が建安8年（203年）の庚申令で引用した「賢者をして能に食ましむれば則ち上は尊ばれ、闘士をして功に食ましむれば則ち卒は死を軽んじ、二者国に設くれば則ち天下は治まる」という管仲の言葉は、前漢・劉向『説苑』巻8・尊賢篇に収録された一節に基づく。", "yomi": "かんちゅう", "name": "管仲（かんちゅう：名は夷吾、字は仲、春秋時代の斉の桓公を五覇の筆頭に押し上げた実力主義・富国強兵の名宰相）", "role": "春秋時代の斉の宰相（潁上県の人）"}, "范蠡": {"wiki_title": "范蠡", "ai_desc": "字は少伯、楚の宛県三戸の人（生没年不詳）。春秋時代末期に文種とともに越王・勾践に仕え、会稽山の敗戦後に二十余年にわたる富国強兵と謀略を主導して前473年に宿敵・呉を滅ぼし上将軍と称された。「高鳥尽きて良弓蔵せられ、狡兎死して走狗烹らる」と悟って越を去り、斉で鴟夷子皮、陶で陶朱公と称して巨万の富を築いた。越王・勾践はその功績を思慕し、黄金を鋳て范蠡の像を作らせた（『国語』越語下、『史記』巻41・越王勾践世家、巻129・貨殖列伝）。", "yomi": "はんれい", "name": "范蠡（はんれい：字は少伯、越王勾践を輔佐して呉を滅ぼし功成り身を引いた名臣、後世に陶朱公と称される）", "role": "春秋時代末期の越の上将軍・政治家"}, "孟達": {"wiki_title": "孟達", "ai_desc": "孟達（もうたつ）：字は子度（のち子敬）、右扶風の人。法正とともに兵数千を率いて劉備の援軍として派遣され、のち劉備に帰順した。", "yomi": "もうたつ", "name": "孟達（もうたつ）"}, "張儀": {"wiki_title": "張儀", "ai_desc": "戦国時代の縦横家・秦の相（？〜前309年）。魏の人。秦の恵文王に仕え、強国・秦と諸侯を個別に結ばせる「連衡」の策を唱えて蘇秦らの合従を切り崩し、巧みな弁舌で列国を動かした。蘇秦と並び「蘇張」と称される弁士の代表格（『史記』巻70・張儀列伝）。", "yomi": "ちょうぎ", "name": "張儀（ちょうぎ：戦国時代の縦横家・秦の宰相、連衡策を主導した大弁士）", "role": "戦国時代の縦横家・秦の相"}, "黄皓": {"wiki_title": "黄皓", "ai_desc": "蜀漢の宦官（生没年不詳）。後主・劉禅に仕えて巧言により気に入られたが、侍中・董允の生前は厳しく牽制されて黄門丞にとどまった。延熙9年（246年）に董允が没し陳祗が侍中・尚書令となると、陳祗と表裏一体となって政務に介入し、中常侍・奉車都尉に至った。景耀元年（258年）の陳祗死後は国政の機柄を完全に掌握し、姜維が外征に出て不在のなか、諸葛瞻・董厥らも互いに庇い合って匡正できず、蜀漢の政治腐敗と滅亡を招いた（『三國志』巻35・諸葛亮伝附董厥伝、巻39・董允伝、巻44・姜維伝）。", "yomi": "こうこう", "name": "黄皓（こうこう：後主劉禅の寵愛を受けて国政の機柄を壟断した蜀漢末期の中常侍・奉車都尉）", "role": "蜀漢の宦官・中常侍・奉車都尉"}, "劉邦": {"wiki_title": "劉邦", "ai_desc": "沛県豊邑の人（前256年または前247年〜前195年）。秦末に沛県で挙兵し、同郷の蕭何・曹参らを率いて秦を滅ぼし、楚漢戦争で項羽を破って前漢王朝を建国した。", "yomi": "こうそ", "name": "高祖・劉邦（こうそ／りゅうほう：前漢の初代皇帝）", "role": "前漢の初代皇帝（太祖高皇帝）"}, "劉備": {"wiki_title": "劉備", "ai_desc": "幽州涿郡涿県の人（161年〜223年）。前漢の中山靖王・劉勝の末裔。黄巾の乱で義勇兵を率いて従軍した後、同窓の公孫瓚のもとに身を寄せ、別部司馬として青州刺史・田楷とともに袁紹を防いだ功績により高唐尉・高唐令、ついで平原令・平原相に任じられた。その後、曹操の徐州侵攻に際して陶謙の救援に赴き、陶謙の没後に徐州を領して曹操・呂布・袁術らと中原の覇権を争い、のち荊州・益州を収めて蜀漢を建国した（『三國志』巻32・先主伝）。", "yomi": "りゅうび", "name": "劉備（りゅうび：字は玄徳、涿郡涿県出身の漢室宗親・のち蜀漢の初代皇帝〔昭烈帝〕）", "role": "後漢末の群雄・のち蜀漢の初代皇帝・昭烈帝（幽州涿郡涿県の人、中山靖王劉勝の末裔）"}, "劉焉": {"wiki_title": "劉焉", "ai_desc": "劉焉（りゅうえん）：字は君郎。江夏竟陵の人。前漢の魯恭王の末裔。中平5年（188年）に州牧の設置を建議し、自ら監軍使者・益州牧となって巴蜀に割拠した。", "yomi": "りゅうえん", "name": "劉焉（りゅうえん）"}, "向充": {"wiki_title": "向充", "ai_desc": "荊州襄陽郡宜城県の人（生没年不詳）。蜀漢の重臣・向朗の兄の子で、中領軍・向寵の弟。後主・劉禅の代に中書郎・射声校尉・尚書を歴任し、景耀6年（263年）春には歩兵校尉・習隆らと連名で上表して、漢中郡沔陽県における諸葛亮の立廟を実現させた。蜀漢滅亡後の咸熙元年（264年）、曹魏から梓潼太守に任じられた（『三國志』巻35・諸葛亮伝注引『襄陽記』、巻41・向朗伝附伝）。", "yomi": "しょうじゅう", "name": "向充（しょうじゅう：襄陽宜城出身の蜀漢の中書郎・尚書、向寵の弟、習隆とともに諸葛亮の立廟を上表）", "role": "蜀漢の中書郎・射声校尉・尚書（向朗の甥・向寵の弟）"}, "姜維": {"wiki_title": "姜維", "ai_desc": "蜀漢の大将軍（202年〜264年）、字は伯約、天水郡冀県の人。建興6年（228年）の第一次北伐で諸葛亮に帰順し、費禕の没後は大将軍として連年北伐を指揮、景耀4年（261年）には趙雲への順平侯追諡を議定した（『三國志』巻44・姜維伝、巻36・趙雲伝注引『雲別伝』）。", "yomi": "きょうい", "name": "姜維（きょうい：字は伯約、天水冀県の人、諸葛亮の遺志を継ぎ北伐を率いた蜀漢の大将軍）", "role": "蜀漢の大将軍・平襄侯"}, "朱皓": {"wiki_title": "朱皓", "ai_desc": "字は文明、会稽郡上虞県の人（？〜195年／197年頃）。後漢末の名将・朱儁の子。諸葛玄に代わる豫章太守として後漢朝廷から選任され、揚州刺史・劉繇の兵を借りて諸葛玄を西城へ退け南昌へ入ったが、のちに劉繇が派遣した笮融に欺かれて殺害された（『三國志』巻35・諸葛亮伝、巻49・劉繇伝）。", "yomi": "しゅこう", "name": "朱皓（しゅこう：字は文明、朱儁の子、後漢朝廷が諸葛玄に代えて派遣した豫章太守）", "role": "後漢末の豫章太守（朱儁の子）"}, "魏平": {"wiki_title": "", "ai_desc": "曹魏の部将（生没年不詳）。漢中・隴右方面の西方戦線に従軍し、太和5年（蜀の建興9年、231年）の祁山・鹵城の戦いでは司馬懿の麾下に属した。司馬懿が登山掘営して交戦を肯んじなかった際、賈栩とともに再三出戦を請い、「公は蜀を畏れること虎のごとし、天下の物笑いをどうなさるか」と迫って司馬懿を出撃させた（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、『晋書』巻1・宣帝紀）。", "yomi": "ぎへい", "name": "魏平（ぎへい：曹魏の部将、鹵城の戦いで賈栩とともに司馬懿へ出戦を請うた将校）", "role": "曹魏の部将"}, "諸葛京": {"wiki_title": "諸葛京", "ai_desc": "字は行宗、徐州琅邪郡陽都県の人（生没年不詳）。蜀漢の衛将軍・諸葛瞻の次男で、諸葛亮の孫、諸葛尚の弟。父・兄が綿竹で戦死した翌年の咸熙元年（264年）、諸葛攀の子・諸葛顕らとともに河東郡へ内移した。西晋の泰始年間、諸葛亮・諸葛瞻父子の忠義を称える武帝・司馬炎の詔によって才に応じて官吏に署され、のち郿県令となって治績を挙げた。尚書僕射・山濤の『啓事』により「人に仕える道理を明らかにし梁・益の民心に副うため東宮舎人に補すべきである」と推挙され、のちに位・江州刺史に至った（『三國志』巻35・諸葛亮伝附諸葛瞻伝および裴注）。", "yomi": "しょかつけい", "name": "諸葛京（しょかつけい：字は行宗、諸葛瞻の次男・諸葛亮の孫、西晋で郿令・東宮舎人を経て江州刺史に至る）", "role": "西晋の郿令・東宮舎人・江州刺史（諸葛瞻の次男）"}, "劉禅": {"wiki_title": "劉禅", "ai_desc": "蜀漢の第2代皇帝・後主（207年〜271年、在位223年〜263年）、字は公嗣、幼名は阿斗。劉備の長男で母は甘夫人。建安13年（208年）の当陽長阪の敗走時には趙雲に抱かれて難を免れ、建安17年（212年）頃に孫夫人が呉へ連れ帰ろうとした際も趙雲と張飛により奪還された。章武3年（223年）に成都で即位し、前半は丞相・諸葛亮、後半は蔣琬・費禕らに国政を委ねて41年間在位したが、炎興元年（263年）に魏の鄧艾が成都へ迫ると降伏し、洛陽へ移って安楽県公に封じられた（『三國志』巻33・後主伝、巻36・趙雲伝）。", "yomi": "りゅうぜん", "name": "劉禅・後主（りゅうぜん／こうしゅ：字は公嗣、劉備と甘夫人の子、蜀漢の第2代皇帝）", "role": "蜀漢の第2代皇帝（後主）・安楽公"}, "曹真": {"wiki_title": "曹真", "ai_desc": "後漢末から三国魏にかけての宗室・武将。沛国譙県の人、字は子丹。曹操の族子として養育され、虎豹騎を率いたのち漢中戦線や雍涼平定で活躍した。文帝・明帝期には上軍大将軍・中軍大将軍・大将軍・大司馬を歴任し、太和2年（228年）には関中・隴右の諸軍を統率して張郃らを街亭へ派遣し、諸葛亮の第一次北伐を退けた（『三國志』巻9・曹真伝、巻17・張郃伝・徐晃伝）。", "yomi": "そうしん", "name": "曹真（そうしん）"}, "桓隰": {"wiki_title": "", "ai_desc": "司隷滎陽郡の人（生没年不詳）。西晋初、関中を鎮守した扶風王・司馬駿の幕府で長史を務め、司馬の劉宝や属官たちとともに諸葛亮の事績を議論し、金城の郭沖が提示した「五事」に反論できなかったと伝えられる（『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "かんしつ", "name": "桓隰（かんしつ：滎陽出身の西晋の官僚、扶風王司馬駿の長史）", "role": "西晋・扶風王司馬駿の長史（滎陽の人）"}, "黄祖": {"wiki_title": "黄祖", "ai_desc": "黄祖（こうそ）：荊州牧・劉表の配下の将・江夏太守（？〜208年）。初平3年（192年）、樊・鄧の間で孫堅に敗れて襄陽へ退いたが、夜間に峴山で追撃してきた孫堅を配下の兵が射殺し、孫氏にとって不倶戴天の仇敵となった。", "yomi": "こうそ", "name": "黄祖（こうそ）"}, "黄承彦": {"wiki_title": "黄承彦", "ai_desc": "後漢末の荊州沔南（襄陽周辺）の名士（生没年不詳）。高邁かつ快活・闊達な人物として知られ、名族・蔡諷の娘（荊州牧・劉表の後妻蔡氏の姉）を妻とした。隆中に寓居して妻を探していた若き諸葛亮に対し、「髪が黄色く肌が浅黒いが、才能は君に釣り合う娘がいる」と自ら勧めて嫁がせ、郷里で諺に詠われて語り草となった（『三國志』巻35・諸葛亮伝注引『襄陽記』）。", "yomi": "こうしょうげん", "name": "黄承彦・阿承（こうしょうげん：荊州沔南の名士、才知ある娘を若き諸葛亮に嫁がせた岳父）", "role": "後漢末の荊州沔南の名士（諸葛亮の岳父）"}, "法正": {"wiki_title": "法正", "ai_desc": "法正（ほうせい）：字は孝直、右扶風郿の人。劉璋の使者として劉備のもとへ派遣され、張松とともに劉備の益州招請および入蜀作戦の主謀者となった（『三國志』巻37・法正伝）。", "yomi": "ほうせい", "name": "法正（ほうせい）"}, "張儼": {"wiki_title": "張儼", "ai_desc": "字は子節、揚州呉郡呉県の人（？〜266年）。若くして博学多才で知られ、孫呉で顕職を歴任し、宝鼎元年（266年）に大鴻臚として西晋への使者に立ち洛陽で病没した（子の張勃は『呉録』の撰者）。著書『黙記』には『諸葛亮集』に未収録であった諸葛亮の『後出師表』や諸葛亮・司馬懿優劣論などが収められ、習鑿歯『漢晋春秋』や裴松之注の重要な典拠となった（『三國志』巻35・諸葛亮伝注、巻53・張紘伝附注）。", "yomi": "ちょうげん", "name": "張儼（ちょうげん：字は子節、呉郡出身の孫呉の大鴻臚、『後出師表』を伝えた『黙記』の著者）", "role": "孫呉の大鴻臚・著述家（呉郡の人）"}, "諸葛玄": {"wiki_title": "諸葛玄", "ai_desc": "琅邪郡陽都県の人（？〜197年）。諸葛亮・諸葛均の従父（叔父）。本伝によれば袁術により豫章太守に署されて幼い亮と均を伴い赴任したが、漢朝が朱皓を後任に派遣したため旧交のあった荊州牧・劉表を頼ったという。一方、裴注所引『献帝春秋』では劉表の上奏で豫章太守となって南昌を治めたが、朱皓・劉繇に攻められ西城へ退き、建安2年（197年）正月に西城の民の反乱で殺害されたと伝える（『三國志』巻35・諸葛亮伝および裴注）。", "yomi": "しょかつげん", "name": "諸葛玄（しょかつげん：琅邪郡陽都県出身の豫章太守、諸葛亮・諸葛均の叔父）", "role": "後漢末の豫章太守（諸葛亮の従父）"}, "曹操": {"wiki_title": "曹操", "ai_desc": "沛国譙県の人（155年〜220年）。前漢の相国・曹参の末裔とされ、中常侍・大長秋・費亭侯となった曹騰の養子・曹嵩（太尉）の子として生まれた。後漢末の動乱期に兗州を拠点として献帝を許に迎え、官渡の戦いで袁紹を破って華北を統一、丞相・魏公・魏王に昇り、没後に子の曹丕（文帝）が魏を建国すると「太祖武皇帝」と追尊された。", "yomi": "そうそう", "name": "曹操（そうそう：字は孟徳、幼名は阿瞞・吉利、太祖武皇帝）", "role": "魏の基礎を築いた覇王（太祖武皇帝）・後漢の丞相・魏王"}, "孫盛": {"wiki_title": "孫盛", "ai_desc": "孫盛（そんせい）：字は安国、并州太原郡中都県の人（302年〜373年）。東晋を代表する歴史家・政治家で、秘書監・長沙太守などを歴任し『魏氏春秋』『晋陽秋』『異同雑語（異同評）』を著した。巻46末尾の注に引かれる『異同評』において、孫策が弟の孫権に後事を託したことを「未練を残した過ち」と評した陳寿に真っ向から反論し、乱世の創業期に弟へ大権を授けて国家を安泰に導いた孫策の決断を絶賛した。", "yomi": "そんせい", "name": "孫盛（そんせい：字は安国、『魏氏春秋』『異同雑語』の撰者）", "role": "東晋の歴史家・長沙太守・秘書監（太原郡中都県の人）"}, "夏侯淵": {"wiki_title": "夏侯淵", "ai_desc": "沛国譙県の人（?〜219年）。夏侯惇の族弟。曹操の挙兵以来、別部司馬・騎都尉・陳留太守・潁川太守・督軍校尉を歴任し、急襲・機動戦に長じて軍中で「典軍校尉の夏侯淵は三日で五百里、六日で一千里を駆ける」と語られた。建安16年（211年）には行征西護軍として徐晃とともに太原大陵の商曜を討滅し、潼関・渭南の戦いに従軍したのち、同年12月に長安へ留屯して安定の梁興や隴右の韓遂・宋建らを平定し、征西将軍に昇った。のち建安24年（219年）、漢中の定軍山で劉備軍と戦って戦死し、愍侯と諡された（『三國志』巻9・夏侯淵伝）。", "yomi": "かこうえん", "name": "夏侯淵（かこうえん：字は妙才、西方戦線を統括した曹操軍の重鎮・征西将軍）", "role": "曹操旗揚げ以来の宿将・征西将軍・博昌愍侯"}, "司馬徽": {"wiki_title": "司馬徽", "ai_desc": "字は徳操、豫州潁川郡陽翟県の人（？〜208年）。清雅で人物鑑識に優れ「水鏡」と号した。戦乱を避けて荊州襄陽に寓居し、世事を訪ねた劉備に対して「時務を知る者は俊傑に在り、この地には伏龍（諸葛亮）・鳳雛（龐統）がいる」と教示した。建安13年（208年）に曹操が荊州を平定した際に召し出されたが、まもなく病没した（『三國志』巻35・諸葛亮伝注引『襄陽記』、巻37・龐統伝および注、『世説新語』言語篇注引『司馬徽別伝』）。", "yomi": "しばき", "name": "司馬徽（しばき：字は徳操・「水鏡」、潁川陽翟出身の人物鑑識家、劉備に「伏龍・鳳雛」を教示）", "role": "後漢末の学者・人物鑑識家（号は水鏡）"}, "呉漢": {"wiki_title": "呉漢", "ai_desc": "字は子顔、荊州南陽郡宛県の人（？〜44年）。後漢創業の元勲「雲台二十八将」の第二位。漁陽で光武帝（劉秀）に帰属し、耿弇らとともに河北平定と光武帝の即位勧進を主導して大司馬に拝され、公孫述の成家（蜀）平定をはじめ各地の戦役を統帥した（『後漢書』巻18・呉漢伝）。", "yomi": "ごかん", "name": "呉漢（ごかん：字は子顔、南陽宛県出身の後漢の大司馬、「雲台二十八将」第二位の創業元勲）", "role": "後漢の大司馬・広平忠侯（雲台二十八将）"}, "李牧": {"wiki_title": "李牧", "ai_desc": "戦国時代末期の趙の名将（？〜前229年）。長く趙の北辺である代・雁門を守備し、徹底した堅壁清野で兵力を蓄えたのち精兵十余万をもって匈奴の単于軍十余万騎を撃滅し、十余年間匈奴を辺境に近づけなかった。悼襄王・幽繆王の代には対秦戦の総司令官として宜安・番吾で秦の桓齮らを連破し「武安君」に封じられたが、秦将・王翦の反間計を受けた寵臣・郭開の讒言により更迭・誅殺され、直後に趙は滅亡した。廉頗と並び「頗・牧」と称される（『史記』巻81・廉頗藺相如列伝）。", "yomi": "りぼく", "name": "李牧（りぼく：戦国時代末期・趙の大将軍・武安君、匈奴と秦軍を連破し廉頗と並び「頗・牧」と称された名将）", "role": "戦国時代・趙の大将軍・武安君"}, "干宝": {"wiki_title": "干宝", "ai_desc": "字は令升、豫州汝南郡新蔡県の人（？〜336年、原文表記「干寶」）。東晋の学者・歴史家。著作郎に領されて西晋の宣帝から愍帝に至る通史『晋紀』全二十巻を著し、簡要・直筆の良史と称えられたほか、古今の神怪説話を集めた志怪小説の代表作『捜神記』三十巻を撰し、官は散騎常侍に至った。裴松之は『晋紀』より、綿竹で殉国した諸葛瞻の忠孝を称える干宝の史論を引用している（『晋書』巻82・干宝伝、『三國志』巻35・諸葛亮伝注）。", "yomi": "かんぽう", "name": "干宝（かんぽう：字は令升、新蔡出身の東晋の歴史家・散騎常侍、『晋紀』『捜神記』の撰者）", "role": "東晋の著作郎・散騎常侍・史家（『晋紀』『捜神記』撰者）"}, "諸葛瑾": {"wiki_title": "諸葛瑾", "ai_desc": "後漢末から三国呉にかけての政治家・武将。琅邪国陽都県（山東省沂南県）の人、字は子瑜。蜀の丞相・諸葛亮の兄。戦乱を避けて江東へ移り、孫権に仕えて長史・南郡太守・左将軍・大将軍を歴任した。黄武元年（222年）の江陵攻防戦では魏の夏侯尚・張郃らと交戦した（『三國志』巻52・諸葛瑾伝、巻17・張郃伝）。", "yomi": "しょかつきん", "name": "諸葛瑾（しょかつきん）"}, "諸葛圭": {"wiki_title": "諸葛珪", "ai_desc": "字は君貢、琅邪郡陽都県の人（生没年不詳、他史料では「諸葛珪」とも表記）。後漢末に泰山郡丞を務めた。諸葛瑾・諸葛亮・諸葛均の父であり、諸葛亮が幼少の頃に早世したため、遺児の亮と均は従父（叔父）の諸葛玄に引き取られて養育された（『三國志』巻35・諸葛亮伝、巻52・諸葛瑾伝）。", "yomi": "しょかつけい", "name": "諸葛圭（しょかつけい：字は君貢、琅邪郡陽都県出身の後漢末の泰山郡丞、諸葛瑾・諸葛亮・諸葛均の父）", "role": "後漢末の泰山郡丞（諸葛亮の父）"}, "昌豨": {"wiki_title": "昌キ", "ai_desc": "後漢末の武将（?〜206年）。泰山方面で兵を集めて臧覇・孫観・呉敦・尹礼らと並び称され、呂布滅亡後に曹操に帰順した。しかし建安5年（200年）の官渡の戦いに際して劉備に呼応して東海郡で反乱を起こし、その後も張遼・夏侯淵・于禁らの討伐を受けて降伏と再反乱を繰り返した末、建安11年（206年）に旧友であった于禁に包囲されて降伏したが、于禁が涙を流して軍法を執行したことにより陣中で斬首された（『三國志』巻1・武帝紀、巻17・張遼伝・于禁伝、巻18・臧覇伝）。", "yomi": "しょうき", "name": "昌豨（しょうき）"}, "陳平": {"wiki_title": "陳平", "ai_desc": "陽武県戸牖郷の人（?〜前178年）。若い頃は家が貧しく読書と黄老の術を好み、魏王咎や項羽に仕えたのち魏無知の推挙によって漢王・劉邦に帰順した。その際、周勃・灌嬰らから「兄嫁と密通した（盗嫂）」「諸将から金を受け取っている（受金）」と品行を誹謗されたが、魏無知が「尾生・孝己の行いがあっても勝敗の数に無益であり、奇謀の士かどうかが重要である」と弁護したことで護軍中尉に抜擢された。以後、楚軍離間の策や滎陽脱出・韓信捕縛・白登山の囲み解囲など六たび奇計を出して漢王朝の帝業を定め、曲逆侯に封じられた。呂后没後には太尉・周勃と結んで呂氏一族を誅滅して文帝を擁立し、左丞相ついで単独の丞相に至った（『史記』巻56・陳丞相世家、『漢書』巻40・陳平伝）。", "yomi": "ちんぺい", "name": "陳平（ちんぺい：豫州陳留郡陽武県戸牖郷の人、前漢の高祖・劉邦を六奇計で輔佐した創業の功臣・曲逆献侯・丞相）", "role": "前漢創業の功臣・謀臣・丞相・曲逆献侯"}, "許芝": {"wiki_title": "許芝", "ai_desc": "曹魏の太史令（生没年不詳）。延康元年（220年）、図讖・緯書や天文の瑞兆を列挙して漢から魏への禅譲が天命に適う旨を上奏し、文帝・曹丕の即位儀礼を推進した。黄初4年（223年）には華歆・王朗・陳羣・諸葛璋らとともに諸葛亮へ書簡を送って魏への藩属を促したが、諸葛亮は返書せず『正議』を著してこれを論破した（『三國志』巻2・文帝紀、巻35・諸葛亮伝注引『諸葛亮集』）。", "yomi": "きょし", "name": "許芝（きょし：曹魏の太史令、図讖により魏への禅譲を上奏し後に諸葛亮へ帰順勧告書を送った官僚）", "role": "曹魏の太史令"}, "軻比能": {"wiki_title": "軻比能", "ai_desc": "鮮卑の有力大人（？〜235年）。小種鮮卑の出身ながら勇健かつ公正で略奪品を均分したため諸部族に推戴され、漢人の亡命者から武具製作・文字・中国戦術を学んで漠南一帯に十余万騎の強勢を築いた。延康元年（220年）に曹魏から附義王に封じられたが離反と服属を繰り返し、太和5年（蜀の建興9年、231年）には祁山を包囲した諸葛亮の招きに応じて故北地郡の石城まで進出し蜀軍に呼応した。青龍3年（235年）、幽州刺史・王雄が放った刺客・韓龍に暗殺された（『三國志』巻30・鮮卑伝、巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "かひのう", "name": "軻比能（かひのう：漠南を統率した鮮卑の大人・附義王、建興9年に故北地石城へ至り諸葛亮に呼応）", "role": "鮮卑の大人・曹魏の附義王"}, "馮唐": {"wiki_title": "馮唐", "ai_desc": "前漢の文帝・景帝・武帝期の官僚（生没年不詳、祖父は戦国趙の人）。孝行で知られて中郎署長として文帝に仕え、老齢の身で文帝から声をかけられた際、「陛下は古の廉頗や李牧を得られても用いることがおできになりますまい」と直言し、匈奴を撃退して大功を立てながら首級報告のわずかな誤差で削爵された雲中太守・魏尚の不当な処遇を訴えた。文帝は即日馮唐に節を持たせて魏尚を赦免・復職させ、馮唐を車騎都尉ついで楚国の相に抜擢した（『史記』巻102・張釈之馮唐列伝、『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "ふうとう", "name": "馮唐（ふうとう：前漢文帝期の中郎署長・楚国相、廉頗・李牧の故事を引いて雲中太守魏尚の冤罪を直言した硬骨漢）", "role": "前漢の中郎署長・車騎都尉・楚国相"}, "閎夭": {"wiki_title": "閎夭", "ai_desc": "殷末周初の賢臣（生没年不詳）。太顛・散宜生・南宮括とともに西伯昌（周の文王）を補佐した「文王の四友」の一人。文王が殷の紂王に羑里へ囚われた際、有莘氏の美女や驪戎の文馬などを集めて殷の嬖臣・費仲を通じて紂王に献上し文王を釈放させ、のち武王の殷討伐でも大功を立てた。李興は隆中故宅の碑文において、太顛・閎夭と並べて「顛・夭」と称し諸葛亮の遺策と比較している（『尚書』君奭篇、『史記』巻4・周本紀、『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "こうよう", "name": "閎夭（こうよう：周の文王・武王を補佐した「文王の四友」の一人、羑里の文王を救出した創業の功臣）", "role": "殷末周初の賢臣（文王の四友の一）"}, "于禁": {"wiki_title": "于禁", "ai_desc": "兗州泰山郡鉅平県の人（?〜221年）、字は文則。済北相・鮑信の募兵に応じたのち曹操に帰属し、軍規の厳正さと沈着堅固な指揮によって頭角を現した。宛城の敗戦時には略奪を行った青州兵を討って夏侯惇らから称賛され、曹操から「古の名将にも勝る」と激賞されて益寿亭侯に封じられた。建安4年（199年）秋8月、袁紹との決戦を前に黄河沿岸（延津付近の河上）の守備を託され、翌年にかけて延津・原武で袁紹軍の渡河攻撃を撃退し官渡本戦でも奮戦した。のち左将軍・仮節鉞に昇ったが、建安24年（219年）の樊城救援で漢水の暴漲により関羽に降伏し、呉から帰還後に死去した（『三國志』巻17・于禁伝）。", "yomi": "うきん", "name": "于禁（うきん：字は文則、泰山郡鉅平県出身の左将軍・仮節鉞・益寿亭侯、厳正な軍律と堅守で知られた曹魏五将軍の筆頭格）", "role": "後漢末〜三国魏の平虜校尉・虎威将軍・左将軍・仮節鉞・益寿亭侯（兗州泰山郡鉅平県の人）"}, "晋文公": {"wiki_title": "文公 (晋)", "ai_desc": "春秋時代の晋の君主・重耳（前697年〜前628年）。驪姫の乱によって国外へ逃れ、趙衰・狐偃・介子推ら賢臣とともに19年間にわたり諸国を流亡した末、秦の穆公の支援を受けて62歳で帰国・即位した。国内の政治・軍制を整えて周の襄王の危難を救い、前632年の城濮の戦いで強国・楚を撃破し、践土の会盟で周王から諸侯の覇者（侯伯）に冊命された。斉の桓公と並んで覇道の理想像「桓・文」と並称される（『史記』巻39・晋世家）。のち建安15年冬12月の『述志令』においても、曹操自身が「斉桓・晋文の所以で今日に至った」と自らを桓・文になぞらえている。", "yomi": "しんぶんこう", "name": "晋の文公・重耳（しんのぶんこう：春秋五覇の代表、十九年の亡命を経て帰国し城濮の戦いで楚を破り覇業を樹立）", "role": "春秋時代の晋の第22代君主（在位前636年〜前628年、姓は姫・名は重耳）"}, "費曜": {"wiki_title": "費曜", "ai_desc": "曹魏の武将（生没年不詳、史料により「費耀」「費瑶」とも表記）。建安25年（220年）の張進反乱討伐や黄初2年（221年）の盧水胡討伐で功を立てて後将軍に進み、西方戦線の主将の一人として重用された。太和2年（228年）冬に陳倉救援に赴き、太和4年（230年）には陽谿で蜀の魏延・呉壱に敗れた。太和5年（231年）、司馬懿の督率のもと戴陵とともに精兵四千で上邽を守り、さらに郭淮とともに諸葛亮を迎撃したが撃破された（『三國志』巻15・張既伝、巻35・諸葛亮伝注引『漢晋春秋』、巻40・魏延伝）。", "yomi": "ひよう", "name": "費曜（ひよう：曹魏の後将軍、西方戦線で諸葛亮・魏延らと交戦した部将）", "role": "曹魏の後将軍"}, "崔均": {"wiki_title": "崔鈞", "ai_desc": "字は元平（『後漢書』では「崔鈞」と表記）、冀州博陵郡安平県の人（生没年不詳）。太尉・崔烈の子で、崔州平の兄。少時より名声があり虎賁中郎将を経て西河太守となり、初平元年（190年）には袁紹らとともに山東で反董卓の義兵を起こした（『後漢書』巻52・崔駰伝附崔烈伝、『三國志』巻35・諸葛亮伝注引『崔氏譜』）。", "yomi": "さいきん", "name": "崔均（さいきん：字は元平、太尉崔烈の子・崔州平の兄、後漢末の西河太守）", "role": "後漢末の虎賁中郎将・西河太守（崔州平の兄）"}, "許由": {"wiki_title": "許由", "ai_desc": "中国上古の伝説的な高士・隠者（生没年不詳、字は武仲とも伝わる）。聖天子の帝堯がその賢徳を聞いて天下の位を譲ろうと申し出たところ、許由はこれを固辞して箕山へ隠棲し、さらに九州の長に召そうとされると「汚れた言葉を聞いた」として潁水のほとりで耳を洗ったと伝えられ、古来より無欲恬淡・高潔な謙譲の最高象徴とされた（『荘子』逍遥遊、『史記』巻61・伯夷列伝、皇甫謐『高士伝』、『三國志』巻35・諸葛亮伝注引『蜀記』）。", "yomi": "きょゆう", "name": "許由（きょゆう：帝堯からの天下禅譲を固辞して箕山に隠れ潁水で耳を洗ったと伝わる中国上古の伝説的隠士）", "role": "中国上古の伝説的高士・隠者"}, "曹丕": {"wiki_title": "曹丕", "ai_desc": "豫州沛国譙県の人（187年〜226年）、字は子桓。曹操と武宣卞皇后の間に生まれた長男（曹昂の異母弟、曹彰・曹植の同母兄）。幼少より騎射・剣術と学問・詩賦の双方に秀で、建安16年（211年）に五官中郎将・副丞相に任じられたことから世に「五官将」と称された。弟・曹植との後継争いを経て建安22年（217年）に魏太子となり、建安25年（220年）正月の曹操薨去により魏王を継ぎ、同年10月に後漢の献帝から禅譲を受けて魏王朝を創始した（黄初改元）。『典論』を著して「文章は経国の大業、不朽の盛事」と唱えた建安文学の中心人物でもある（『三國志』巻2・文帝紀）。", "yomi": "そうひ", "name": "曹丕・五官将・文帝（そうひ：字は子桓、曹操と卞夫人の長男、五官中郎将・魏王を経て魏王朝の初代皇帝）", "role": "五官中郎将・副丞相・魏太子・魏王・三国魏の初代皇帝〔高祖文皇帝〕（豫州沛国譙県の人、曹操の子）"}, "賈栩": {"wiki_title": "", "ai_desc": "曹魏の部将（生没年不詳。文帝期の太尉・賈詡〔223年没〕とは別人であり、『晋書』宣帝紀および『資治通鑑』では「賈嗣」に作る）。太和5年（蜀の建興9年、231年）、鹵城で諸葛亮と対峙しながら山上に陣営を築いて交戦を避け続ける司馬懿に対し、魏平とともにたびたび出戦を請い、「公は蜀を恐れること虎のごとし、天下の笑いをいかんせん」と直言して出撃を促した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』）。", "yomi": "かく", "name": "賈栩（かく：曹魏の部将、鹵城の戦いで魏平とともに司馬懿へ出戦を迫った将校）", "role": "曹魏の部将"}, "黄帝": {"wiki_title": "黄帝", "ai_desc": "『史記』五帝本紀の冒頭に記される古代中国の伝説上の聖王。王沈『魏書』によれば、曹氏の遠祖は黄帝から出て、その孫の顓頊（高陽氏）の代に陸終の子・安が曹姓を賜ったとされる。", "yomi": "こうてい", "name": "黄帝（こうてい：古代中国の伝説上の帝王・五帝の筆頭）", "role": "中国神話・五帝の筆頭（有熊氏・軒轅氏）"}, "閻芝": {"wiki_title": "", "ai_desc": "蜀漢の官僚・将校（？〜228年頃）。建興初年に巴西太守を務め、建興5年（227年）に諸葛亮が北伐のため漢中へ進駐した際には、巴西郡で兵五千人を徴発・編成して後任の馬忠に率いさせ漢中の本営へ送り届けた功績があるが、翌建興6年（228年）11月までの間に死去した（『三國志』巻35・諸葛亮伝注引『漢晋春秋』、巻43・馬忠伝）。", "yomi": "えんし", "name": "閻芝（えんし：蜀漢の巴西太守・将校、北伐に際し兵五千を徴発して送り出したのち没した人物）", "role": "蜀漢の巴西太守・将校"}, "陳寿": {"wiki_title": "陳寿", "ai_desc": "益州巴西郡安漢県の人（233年〜297年）、字は承祚（『晋書』巻82・陳寿伝、常璩『華陽国志』巻11・後賢志）。若くして同郡の碩学・譙周に師事して『尚書』『三伝』『史記』『漢書』を修め、蜀漢に仕えて観閣令史となったが、宦官・黄皓に屈しなかったため不遇であった。蜀漢滅亡後、張華にその才識を高く評価されて西晋の佐著作郎・著作郎・治書侍御史に抜擢され、諸葛亮の文集（『諸葛氏集』二十四篇）を編纂して武帝に献上したのち、魏書三十巻・蜀書十五巻・呉書二十巻からなる全六十五巻の紀伝体史書『三國志』を独力で撰述した。簡潔にして要を得た叙事と公正な人物評（「評曰」）は同時代の夏侯湛をも感嘆させ、「良史の才」として『史記』『漢書』『後漢書』と並ぶ「前四史」の一角に列せられる。", "yomi": "ちんじゅ", "name": "陳寿（ちんじゅ：字は承祚、巴西安漢出身の西晋の史家、譙周の門人にして正史『三國志』六十五巻の撰者）", "role": "蜀漢の観閣令史→西晋の著作郎・治書侍御史（益州巴西郡安漢県の人、『三國志』撰者）"}, "樊建": {"wiki_title": "樊建", "ai_desc": "字は長元、荊州義陽郡の人（生没年不詳）。蜀漢に仕え、延熙14年（251年）に校尉として呉へ使した際、重病の孫権が諸葛恪に宗預との優劣を尋ねると「才識は宗預に及ばないが、端正高雅な気質はそれに勝る」と評された。のち侍中・守中書令を経て董厥に代わり尚書令となり、宦官の黄皓が国政を壟断するなかでも、ひとり黄皓と親しく交わらなかった。蜀漢滅亡の翌咸熙元年（264年）に董厥とともに洛陽へ赴いて相国参軍・散騎常侍となり、西晋で給事中となった際には武帝・司馬炎に諸葛亮の治国を称え、あわせて馮唐の故事を引いて鄧艾の冤罪回復を進言した（『三國志』巻35・諸葛亮伝附董厥伝および注引『漢晋春秋』）。", "yomi": "はんけん", "name": "樊建（はんけん：字は長元、義陽出身の蜀漢の侍中・尚書令、黄皓に阿らず西晋の給事中として武帝に鄧艾の雪冤を進言）", "role": "蜀漢の侍中・中書令・尚書令、のち魏晋の相国参軍・散騎常侍・給事中"}, "王莽": {"wiki_title": "王莽", "ai_desc": "王莽（おうもう）：字は巨君（前45年〜後23年）。前漢末の外戚として権力を握り、符命（予言）を根拠に孺子嬰から禅譲を受けて「新」王朝を建てたが、復古的な改革と過酷な外征・労役で天下の反乱を招き、更始帝の軍に討たれた（『漢書』巻99・王莽伝）。", "yomi": "おうもう", "name": "王莽（おうもう）"}, "司馬炎": {"wiki_title": "司馬炎", "ai_desc": "字は安世、司隷河内郡温県の人（236年〜290年）。西晋の初代皇帝・世祖武皇帝（在位265年〜290年）。司馬昭（晋の文帝）の長男で、司馬懿（宣帝）の孫。咸熙2年（265年）12月に曹魏の元帝・曹奐から禅譲を受けて西晋王朝を創建し、泰始と改元した。寛大で度量の広い治世を敷き、泰始年間には諸葛亮・諸葛瞻父子の忠義を称えて孫の諸葛京を登用し、泰始10年（274年）に陳寿が編定した『諸葛氏集』二十四篇の献上を受け、また給事中・樊建の諫言を容れて鄧艾の名誉を回復した。太康元年（280年）に孫呉を平定して三国分立を終結させた（『晋書』巻3・武帝紀、『三國志』巻35・諸葛亮伝および裴注）。", "yomi": "しばえん", "name": "司馬炎・晋武帝（しばえん／しんぶてい：字は安世、司馬昭の長男、西晋の初代皇帝・世祖武皇帝、孫呉を滅ぼし天下を統一）", "role": "西晋の初代皇帝（世祖武皇帝、在位265〜290）"}, "霊帝": {"wiki_title": "霊帝", "ai_desc": "霊帝（れいてい）：劉宏（りゅうこう）。後漢の第12代皇帝（在位168年〜189年）。治世末期に黄巾の乱（184年）や各地の反乱が相次ぎ、中平5年（188年）に劉焉の建議を容れて主要州の刺史を「州牧」に改めた（『後漢書』巻8・霊帝紀）。", "yomi": "れいてい", "name": "霊帝（れいてい：後漢の第12代皇帝・劉宏）", "role": "後漢の第12代皇帝（在位168年〜189年）"}, "呉起": {"wiki_title": "呉起", "ai_desc": "衛の左氏の人（?〜前381年）。『孫子』の孫武と並び「孫呉」と称される兵学の巨頭（『史記』巻65・孫子呉起列伝）。若い頃は千金の家産を散じて官位を求め、それを笑った郷党三十余人を殺して出奔し、母が死去しても曽参のもとでの学業を優先して帰郷しなかったため曽参から破門され、さらに魯が斉と戦った際には斉出身の妻がいることで疑われるのを嫌って自ら妻を殺し魯の将軍となって斉を大破した。その後、魏の文侯に登用されると秦から西河の地を奪取して西河守となり、在任中は秦が東進を企てられないほどの威名を轟かせ、ついで魏の武侯のもとから楚の悼王に迎えられて令尹となると貴族の特権を削る強兵変法を断行し、北方の三晋（韓・趙・魏）にも南侵の謀略を抱かせなかった。曹操は「私徳に欠陥があっても国家を強盛にした人材」の極致として呉起を挙げた。", "yomi": "ごき", "name": "呉起（ごき：衛出身の戦国前期の大軍事家・政治改革者、『呉子』の祖、魏で西河を守り楚で変法を断行）", "role": "戦国時代の魯・魏・楚の名将・兵法家（魏の西河守→楚の令尹）"}, "諸葛璋": {"wiki_title": "", "ai_desc": "曹魏の謁者僕射（生没年不詳）。黄初4年（223年）、蜀漢の先主・劉備崩御の後、司徒・華歆、司空・王朗、尚書令・陳羣、太史令・許芝らとともにそれぞれ諸葛亮へ書簡を送り、天命と人事を説いて国を挙げて魏に藩属するよう勧告したが、諸葛亮に退けられ『正議』で批判された（『三國志』巻35・諸葛亮伝注引『諸葛亮集』）。", "yomi": "しょかつしょう", "name": "諸葛璋（しょかつしょう：曹魏の謁者僕射、華歆・王朗らとともに諸葛亮へ帰順勧告書を送った官僚）", "role": "曹魏の謁者僕射"}};
