必能裨補闕漏，有所廣益。將軍向寵，性行淑均，曉暢軍事，試用於昔日，先帝稱之曰能，是以眾議舉寵為督。愚以為營中之事，事無大小，悉以咨之，必能使行陣和睦，優劣得所。親賢臣，遠小人，此先漢所以興隆也；親小人，遠賢臣，此後漢所以傾頹也。先帝在時，每與臣論此事，未嘗不嘆息痛恨於桓、靈也。侍中、尚書、長史、參軍，此悉貞良死節之臣，願陛下親之信之，則漢室之隆，可計日而待也。", "kakikudashi": "先帝、業を創むること未だ半ばならずして、中道に崩殂せり。今、天下三分し、益州は疲弊す、此れ誠に危急存亡の秋なり。然れども侍衛の臣、内に懈らず、忠志の士、外に身を忘るる者は、蓋し先帝の殊遇を追いて、之を陛下に報ぜんと欲すればなり。誠に宜しく聖聴を開張し、以て先帝の遺徳を光いにし、志士の気を恢弘すべく、宜しく妄りに自ら菲薄し、喩えを引きて義を失い、以て忠諫の路を塞ぐべからざるなり。宮中・府中、倶に一体と為り、臧否を陟罰するに、宜しく異同あるべからず。若し姦を作し科を犯し、及び忠善を為す者有らば、宜しく有司に付して其の刑賞を論じ、以て陛下平明の理を昭らかにすべく、宜しく偏私して、内外をして法を異にせしむべからざるなり。侍中・侍郎の郭攸之・費禕・董允等は、此れ皆な良実にして、志慮忠純なり、是を以て先帝簡抜して以て陛下に遺せり。愚以為えらく、宮中の事は、事の大小と無く、悉く以て之に咨り、然る後に施行せば、必ず能く闕漏を裨補し、広益する所有らん。将軍の向寵は、性行淑均にして、軍事に暁暢し、昔日に試用せられて、先帝之を称して能と曰えり、是を以て衆議、寵を挙げて督と為せり。愚以為えらく、営中の事は、事の大小と無く、悉く以て之に咨らば、必ず能く行陣をして和睦し、優劣をして所を得しめん。賢臣に親しみ、小人を遠ざくるは、此れ先漢の興隆せし所以なり。小人に親しみ、賢臣を遠ざくるは、此れ後漢の傾頽せし所以なり。先帝在りし時、臣と此の事を論ずる毎に、未だ嘗て桓・霊に嘆息・痛恨せずんばあらざりき。侍中・尚書・長史・参軍は、此れ悉く貞良・死節の臣なれば、願わくは陛下、之に親しみ之を信ぜよ、則ち漢室の隆んならんこと、日を計えて待つべきなり。", "translation": "先帝には大業を創められながらいまだ道半ばにして、中途で崩御なさいました。いま天下は三分し、益州は疲弊しており、これぞまことに危急存亡の時にあります。されど侍衛の臣が宮中にあって職務を怠らず、忠義の志ある士が外にあって我が身を顧みないのは、思うに先帝より賜った格別の殊遇を追慕し、そのご恩に陛下のもとで報い奉ろうと願えばこそであります。まことにお耳を広く開かれて諫言を受け入れ、もって先帝の遺されたご威徳を発揚し、志ある士たちの気概を奮い立たせるべきであり、みだりにご自身を卑下し、不適切な喩えを引いて大義を損ない、もって忠言・諫言の路を塞がれるようなことがあってはなりません。宮中と府中とは、ともに一体たるべきものであり、善悪を昇進・処罰するにあたって、扱いに差異があってはなりません。もし悪事を働き法令を犯す者や、忠節・善行を尽くす者があれば、担当の有司に委ねてその刑罰と恩賞を論じさせ、もって陛下の公平かつ明察なるご政治を明らかに示すべきであり、私情に偏って、宮中の内と府中の外とで法を異にさせるようなことがあってはなりません。侍中・侍郎の郭攸之・費禕・董允らは、いずれもみな善良誠実であり、志と思慮は忠節純粋でありますから、それゆえ先帝が選び抜かれて陛下に遺されたのであります。私めが考えますに、宮中の事柄は、事の大小となく、ことごとく彼らに諮問され、そのうえで施行なさいますならば、必ずや手落ちや欠陥を補い、大いに裨益するところがございましょう。将軍の向寵は、気立てと行いが善良公正であり、軍事に精通しており、先年試みに登用された際、先帝は彼を称えて有能であると仰せになりました、それゆえ衆議によって向寵を推挙し督としたのであります。私めが考えますに、陣営のなかの事柄は、事の大小となく、ことごとく彼に諮問なさいますならば、必ずや軍陣を和睦させ、優れる者も劣る者もそれぞれに処を得させることができましょう。賢臣に親しみ、小人を遠ざけたこと、これこそ前漢が興隆した理由であります。小人に親しみ、賢臣を遠ざけたこと、これこそ後漢が傾き滅びた理由であります。先帝がご在世の折、臣とこの事を論じられるたびに、桓帝・霊帝の御代に対して嘆息し痛恨なさらぬことはありませんでした。侍中・尚書・長史・参軍は、いずれもみな貞節善良にして節義に殉じ得る臣でありますから、どうか陛下におかれては、彼らに親しみ彼らをご信任くださいますように、さすれば漢室の再興も、日を指折り数えて待つことができましょう。", "persons": "劉備, 劉禅, 郭攸之, 費禕, 董允, 向寵, 桓帝, 霊帝", "places": "益州", "era_year": "建興5年（227）春", "source_book": "", "keywords": "有司, 侍中, 侍郎, 尚書, 長史, 参軍", "raw_tagged": "{{person:劉備|先帝}}創業未半而中道崩殂，今天下三分，{{place:益州|益州}}疲弊，此誠危急存亡之秋也。然侍衛之臣不懈於內，忠志之士忘身於外者，蓋追{{person:劉備|先帝}}之殊遇，欲報之於{{person:劉禅|陛下}}也。誠宜開張聖聽，以光{{person:劉備|先帝}}遺德，恢弘志士之氣，不宜妄自菲薄，引喻失義，以塞忠諫之路也。宮中府中俱為一體，陟罰臧否，不宜異同。若有作奸犯科及為忠善者，宜付{{office:有司|有司}}論其刑賞，以昭{{person:劉禅|陛下}}平明之理，不宜偏私，使內外異法也。{{office:侍中|侍中}}、{{office:侍郎|侍郎}}{{person:郭攸之|郭攸之}}、{{person:費禕|費禕}}、{{person:董允|董允}}等，此皆良實，志慮忠純，是以{{person:劉備|先帝}}簡拔以遺{{person:劉禅|陛下}}。愚以為宮中之事，事無大小，悉以咨之，然後施行，必能裨補闕漏，有所廣益。將軍{{person:向寵|向寵}}，性行淑均，曉暢軍事，試用於昔日，{{person:劉備|先帝}}稱之曰能，是以眾議舉{{person:向寵|寵}}為督。愚以為營中之事，事無大小，悉以咨之，必能使行陣和睦，優劣得所。親賢臣，遠小人，此先漢所以興隆也；親小人，遠賢臣，此後漢所以傾頹也。{{person:劉備|先帝}}在時，每與臣論此事，未嘗不嘆息痛恨於{{person:桓帝|桓}}、{{person:霊帝|靈}}也。{{office:侍中|侍中}}、{{office:尚書|尚書}}、{{office:長史|長史}}、{{office:参軍|參軍}}，此悉貞良死節之臣，願{{person:劉禅|陛下}}親之信之，則漢室之隆，可計日而待也。", "kakikudashi_tagged": "{{person:劉備|先帝}}、業を創むること未だ半ばならずして、中道に崩殂せり。今、天下三分し、{{place:益州|益州}}は疲弊す、此れ誠に危急存亡の秋なり。然れども侍衛の臣、内に懈らず、忠志の士、外に身を忘るる者は、蓋し{{person:劉備|先帝}}の殊遇を追いて、之を{{person:劉禅|陛下}}に報ぜんと欲すればなり。誠に宜しく聖聴を開張し、以て{{person:劉備|先帝}}の遺徳を光いにし、志士の気を恢弘すべく、宜しく妄りに自ら菲薄し、喩えを引きて義を失い、以て忠諫の路を塞ぐべからざるなり。宮中・府中、倶に一体と為り、臧否を陟罰するに、宜しく異同あるべからず。若し姦を作し科を犯し、及び忠善を為す者有らば、宜しく{{office:有司|有司}}に付して其の刑賞を論じ、以て{{person:劉禅|陛下}}平明の理を昭らかにすべく、宜しく偏私して、内外をして法を異にせしむべからざるなり。{{office:侍中|侍中}}・{{office:侍郎|侍郎}}の{{person:郭攸之|郭攸之}}・{{person:費禕|費禕}}・{{person:董允|董允}}等は、此れ皆な良実にして、志慮忠純なり、是を以て{{person:劉備|先帝}}簡抜して以て{{person:劉禅|陛下}}に遺せり。愚以為えらく、宮中の事は、事の大小と無く、悉く以て之に咨り、然る後に施行せば、必ず能く闕漏を裨補し、広益する所有らん。将軍の{{person:向寵|向寵}}は、性行淑均にして、軍事に暁暢し、昔日に試用せられて、{{person:劉備|先帝}}之を称して能と曰えり、是を以て衆議、{{person:向寵|寵}}を挙げて督と為せり。愚以為えらく、営中の事は、事の大小と無く、悉く以て之に咨らば、必ず能く行陣をして和睦し、優劣をして所を得しめん。賢臣に親しみ、小人を遠ざくるは、此れ先漢の興隆せし所以なり。小人に親しみ、賢臣を遠ざくるは、此れ後漢の傾頽せし所以なり。{{person:劉備|先帝}}在りし時、臣と此の事を論ずる毎に、未だ嘗て{{person:桓帝|桓}}・{{person:霊帝|霊}}に嘆息・痛恨せずんばあらざりき。{{office:侍中|侍中}}・{{office:尚書|尚書}}・{{office:長史|長史}}・{{office:参軍|参軍}}は、此れ悉く貞良・死節の臣なれば、願わくは{{person:劉禅|陛下}}、之に親しみ之を信ぜよ、則ち漢室の隆んならんこと、日を計えて待つべきなり。", "translation_tagged": "{{person:劉備|先帝}}には大業を創められながらいまだ道半ばにして、中途で崩御なさいました。いま天下は三分し、{{place:益州|益州}}は疲弊しており、これぞまことに危急存亡の時にあります。されど侍衛の臣が宮中にあって職務を怠らず、忠義の志ある士が外にあって我が身を顧みないのは、思うに{{person:劉備|先帝}}より賜った格別の殊遇を追慕し、そのご恩に{{person:劉禅|陛下}}のもとで報い奉ろうと願えばこそであります。まことにお耳を広く開かれて諫言を受け入れ、もって{{person:劉備|先帝}}の遺されたご威徳を発揚し、志ある士たちの気概を奮い立たせるべきであり、みだりにご自身を卑下し、不適切な喩えを引いて大義を損ない、もって忠言・諫言の路を塞がれるようなことがあってはなりません。宮中と府中とは、ともに一体たるべきものであり、善悪を昇進・処罰するにあたって、扱いに差異があってはなりません。もし悪事を働き法令を犯す者や、忠節・善行を尽くす者があれば、担当の{{office:有司|有司}}に委ねてその刑罰と恩賞を論じさせ、もって{{person:劉禅|陛下}}の公平かつ明察なるご政治を明らかに示すべきであり、私情に偏って、宮中の内と府中の外とで法を異にさせるようなことがあってはなりません。{{office:侍中|侍中}}・{{office:侍郎|侍郎}}の{{person:郭攸之|郭攸之}}・{{person:費禕|費禕}}・{{person:董允|董允}}らは、いずれもみな善良誠実であり、志と思慮は忠節純粋でありますから、それゆえ{{person:劉備|先帝}}が選び抜かれて{{person:劉禅|陛下}}に遺されたのであります。私めが考えますに、宮中の事柄は、事の大小となく、ことごとく彼らに諮問され、そのうえで施行なさいますならば、必ずや手落ちや欠陥を補い、大いに裨益するところがございましょう。将軍の{{person:向寵|向寵}}は、気立てと行いが善良公正であり、軍事に精通しており、先年試みに登用された際、{{person:劉備|先帝}}は彼を称えて有能であると仰せになりました、それゆえ衆議によって{{person:向寵|向寵}}を推挙し督としたのであります。私めが考えますに、陣営のなかの事柄は、事の大小となく、ことごとく彼に諮問なさいますならば、必ずや軍陣を和睦させ、優れる者も劣る者もそれぞれに処を得させることができましょう。賢臣に親しみ、小人を遠ざけたこと、これこそ前漢が興隆した理由であります。小人に親しみ、賢臣を遠ざけたこと、これこそ後漢が傾き滅びた理由であります。{{person:劉備|先帝}}がご在世の折、臣とこの事を論じられるたびに、{{person:桓帝|桓帝}}・{{person:霊帝|霊帝}}の御代に対して嘆息し痛恨なさらぬことはありませんでした。{{office:侍中|侍中}}・{{office:尚書|尚書}}・{{office:長史|長史}}・{{office:参軍|参軍}}は、いずれもみな貞節善良にして節義に殉じ得る臣でありますから、どうか{{person:劉禅|陛下}}におかれては、彼らに親しみ彼らをご信任くださいますように、さすれば漢室の再興も、日を指折り数えて待つことができましょう。"}, {"id": "v35_p10_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 10, "type": "本文", "raw_text": "臣本布衣，躬耕於南陽，苟全性命於亂世，不求聞達於諸侯。先帝不以臣卑鄙，猥自枉屈，三顧臣於草廬之中，諮臣以當世之事，由是感激，遂許先帝以驅馳。後值傾覆，受任於敗軍之際，奉命於危難之間，爾來二十有一年矣。", "kakikudashi": "臣は本と布衣、南陽に躬耕し、苟くも性命を乱世に全うせんとし、聞達を諸侯に求めざりき。先帝は臣の卑鄙なるを以てせず、猥りに自ら枉屈し、三たび臣を草廬の中に顧み、臣に諮るに当世の事を以てす、是に由りて感激し、遂に先帝に許すに駆馳を以てせり。後に傾覆に値い、任を敗軍の際に受け、命を危難の間に奉じ、爾来二十有一年なり。", "translation": "臣はもと無位の庶民であり、南陽で自ら田畑を耕し、ただ乱世に命を全うすることだけを願い、諸侯の間で名声や栄達を求めようとはいたしませんでした。しかるに先帝は臣が卑賤であることも厭われず、みだりに自ら身を屈して、三たび臣を草廬のなかに訪ねられ、臣に当世の大事を諮問なさいました、これにより深く感激し、ついに先帝のために奔走し力を尽くすことをお誓い申し上げたのであります。のちに敗北の危機に際会し、敗軍のさなかに重任を受け、危難のただなかに使命を奉じましてより、それ以来二十一年になります。", "persons": "劉備", "places": "南陽", "era_year": "建興5年（227）春", "source_book": "", "keywords": "諸侯", "raw_tagged": "臣本布衣，躬耕於{{place:南陽|南陽}}，苟全性命於亂世，不求聞達於{{office:諸侯|諸侯}}。{{person:劉備|先帝}}不以臣卑鄙，猥自枉屈，三顧臣於草廬之中，諮臣以當世之事，由是感激，遂許{{person:劉備|先帝}}以驅馳。後值傾覆，受任於敗軍之際，奉命於危難之間，爾來二十有一年矣。", "kakikudashi_tagged": "臣は本と布衣、{{place:南陽|南陽}}に躬耕し、苟くも性命を乱世に全うせんとし、聞達を{{office:諸侯|諸侯}}に求めざりき。{{person:劉備|先帝}}は臣の卑鄙なるを以てせず、猥りに自ら枉屈し、三たび臣を草廬の中に顧み、臣に諮るに当世の事を以てす、是に由りて感激し、遂に{{person:劉備|先帝}}に許すに駆馳を以てせり。後に傾覆に値い、任を敗軍の際に受け、命を危難の間に奉じ、爾来二十有一年なり。", "translation_tagged": "臣はもと無位の庶民であり、{{place:南陽|南陽}}で自ら田畑を耕し、ただ乱世に命を全うすることだけを願い、{{office:諸侯|諸侯}}の間で名声や栄達を求めようとはいたしませんでした。しかるに{{person:劉備|先帝}}は臣が卑賤であることも厭われず、みだりに自ら身を屈して、三たび臣を草廬のなかに訪ねられ、臣に当世の大事を諮問なさいました、これにより深く感激し、ついに{{person:劉備|先帝}}のために奔走し力を尽くすことをお誓い申し上げたのであります。のちに敗北の危機に際会し、敗軍のさなかに重任を受け、危難のただなかに使命を奉じましてより、それ以来二十一年になります。"}, {"id": "v35_p10_2", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 10, "type": "裴注", "raw_text": "臣松之案：劉備以建安十三年敗，遣亮使吳，亮以建興五年抗表北伐，自傾覆至此整二十年。然則備始與亮相遇，在敗軍之前一年時也。", "kakikudashi": "臣松之案ずるに、劉備は建安十三年を以て敗れ、亮を遣わして呉に使せしめ、亮は建興五年を以て表を抗げて北伐す、傾覆より此に至るまで整に二十年なり。然らば則ち備が始めて亮と相い遇いしは、敗軍の前一年の時に在るなり。", "translation": "臣松之が考えるに、劉備は建安十三年に敗れて、諸葛亮を呉へ使者として遣わし、諸葛亮は建興五年に上表を奉って北伐に出陣したのであるから、敗北のときからここに至るまでちょうど二十年である。そうであれば劉備がはじめて諸葛亮とめぐり逢ったのは、敗軍の一年前の時のことになる。", "persons": "裴松之, 劉備, 諸葛亮", "places": "", "era_year": "建安12年（207）〜建興5年（227）", "source_book": "", "keywords": "建安, 建興", "raw_tagged": "{{person:裴松之|臣松之}}案：{{person:劉備|劉備}}以{{special:建安|建安}}十三年敗，遣{{person:諸葛亮|亮}}使吳，{{person:諸葛亮|亮}}以{{special:建興|建興}}五年抗表北伐，自傾覆至此整二十年。然則{{person:劉備|備}}始與亮相遇，在敗軍之前一年時也。", "kakikudashi_tagged": "{{person:裴松之|臣松之}}案ずるに、{{person:劉備|劉備}}は{{special:建安|建安}}十三年を以て敗れ、{{person:諸葛亮|亮}}を遣わして呉に使せしめ、{{person:諸葛亮|亮}}は{{special:建興|建興}}五年を以て表を抗げて北伐す、傾覆より此に至るまで整に二十年なり。然らば則ち{{person:劉備|備}}が始めて{{person:諸葛亮|亮}}と相い遇いしは、敗軍の前一年の時に在るなり。", "translation_tagged": "{{person:裴松之|臣松之}}が考えるに、{{person:劉備|劉備}}は{{special:建安|建安}}十三年に敗れて、{{person:諸葛亮|諸葛亮}}を呉へ使者として遣わし、{{person:諸葛亮|諸葛亮}}は{{special:建興|建興}}五年に上表を奉って北伐に出陣したのであるから、敗北のときからここに至るまでちょうど二十年である。そうであれば{{person:劉備|劉備}}がはじめて{{person:諸葛亮|諸葛亮}}とめぐり逢ったのは、敗軍の一年前の時のことになる。"}, {"id": "v35_p10_3", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 10, "type": "本文", "raw_text": "先帝知臣謹慎，故臨崩寄臣以大事也。受命以來，夙夜憂歎，恐託付不效，以傷先帝之明，故五月渡瀘，深入不毛。", "kakikudashi": "先帝は臣の謹慎なるを知る、故に崩ずるに臨みて臣に寄するに大事を以てせり。命を受けて以来、夙夜憂歎し、託付の効あらずして、以て先帝の明を傷つけんことを恐る、故に五月瀘を渡り、深く不毛に入れり。", "translation": "先帝は臣が謹み深く慎重であることをご存じであったからこそ、崩御に臨んで臣に国家の大事を託されたのであります。ご遺命を拝受して以来、朝夕に憂え嘆き、ご信託の成果を挙げられずに、先帝の明察を傷つけることになりはせぬかと恐れ、それゆえ五月に瀘水を渡り、深く不毛の地へと分け入りました。", "persons": "劉備", "places": "瀘水", "era_year": "建興5年（227）春", "source_book": "", "keywords": "", "raw_tagged": "{{person:劉備|先帝}}知臣謹慎，故臨崩寄臣以大事也。受命以來，夙夜憂歎，恐託付不效，以傷{{person:劉備|先帝}}之明，故五月渡{{place:瀘水|瀘}}，深入不毛。", "kakikudashi_tagged": "{{person:劉備|先帝}}は臣の謹慎なるを知る、故に崩ずるに臨みて臣に寄するに大事を以てせり。命を受けて以来、夙夜憂歎し、託付の効あらずして、以て{{person:劉備|先帝}}の明を傷つけんことを恐る、故に五月{{place:瀘水|瀘}}を渡り、深く不毛に入れり。", "translation_tagged": "{{person:劉備|先帝}}は臣が謹み深く慎重であることをご存じであったからこそ、崩御に臨んで臣に国家の大事を託されたのであります。ご遺命を拝受して以来、朝夕に憂え嘆き、ご信託の成果を挙げられずに、{{person:劉備|先帝}}の明察を傷つけることになりはせぬかと恐れ、それゆえ五月に{{place:瀘水|瀘水}}を渡り、深く不毛の地へと分け入りました。"}, {"id": "v35_p10_4", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 10, "type": "裴注", "raw_text": "漢書地理志曰：瀘惟水出牂牁郡句町縣。", "kakikudashi": "『漢書』地理志に曰く、瀘惟水は牂牁郡句町県より出ず、と。", "translation": "『漢書地理志』にいう、瀘惟水は牂牁郡句町県から流れ出る、と。", "persons": "", "places": "瀘水, 牂牁, 句町", "era_year": "", "source_book": "『漢書』地理志", "keywords": "漢書", "raw_tagged": "{{special:漢書|漢書地理志}}曰：{{place:瀘水|瀘惟水}}出{{place:牂牁|牂牁郡}}{{place:句町|句町縣}}。", "kakikudashi_tagged": "『{{special:漢書|漢書}}』地理志に曰く、{{place:瀘水|瀘惟水}}は{{place:牂牁|牂牁郡}}{{place:句町|句町県}}より出ず、と。", "translation_tagged": "『{{special:漢書|漢書地理志}}』にいう、{{place:瀘水|瀘惟水}}は{{place:牂牁|牂牁郡}}{{place:句町|句町県}}から流れ出る、と。"}, {"id": "v35_p10_5", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 10, "type": "本文", "raw_text": "今南方已定，兵甲已足，當獎率三軍，北定中原，庶竭駑鈍，攘除姦凶，興復漢室，還于舊都。此臣所以報先帝，而忠陛下之職分也。", "kakikudashi": "今、南方は已に定まり、兵甲は已に足る、当に三軍を奨率し、北のかた中原を定むべく、庶わくは駑鈍を竭くし、姦凶を攘除し、漢室を興復して、旧都に還さん。此れ臣が先帝に報じて、陛下に忠なる所以の職分なり。", "translation": "いま南方はすでに平定され、武具・甲冑もすでに充足いたしましたから、まさに三軍を励まし率いて、北のかた中原を平定すべき時であり、どうか駑馬のごとき鈍才の限りを尽くして、姦悪なる凶賊を掃討・駆除し、漢室を再興して、旧都へと帰還いたしたく存じます。これこそ臣が先帝のご恩に報い奉り、陛下に忠節を尽くすべき職分であります。", "persons": "劉備, 劉禅", "places": "中原, 洛陽", "era_year": "建興5年（227）春", "source_book": "", "keywords": "", "raw_tagged": "今南方已定，兵甲已足，當獎率{{special:三軍|三軍}}，北定{{place:中原|中原}}，庶竭駑鈍，攘除姦凶，興復漢室，還于{{place:洛陽|舊都}}。此臣所以報{{person:劉備|先帝}}，而忠{{person:劉禅|陛下}}之職分也。", "kakikudashi_tagged": "今、南方は已に定まり、兵甲は已に足る、当に{{special:三軍|三軍}}を奨率し、北のかた{{place:中原|中原}}を定むべく、庶わくは駑鈍を竭くし、姦凶を攘除し、漢室を興復して、{{place:洛陽|旧都}}に還さん。此れ臣が{{person:劉備|先帝}}に報じて、{{person:劉禅|陛下}}に忠なる所以の職分なり。", "translation_tagged": "いま南方はすでに平定され、武具・甲冑もすでに充足いたしましたから、まさに{{special:三軍|三軍}}を励まし率いて、北のかた{{place:中原|中原}}を平定すべき時であり、どうか駑馬のごとき鈍才の限りを尽くして、姦悪なる凶賊を掃討・駆除し、漢室を再興して、{{place:洛陽|旧都}}へと帰還いたしたく存じます。これこそ臣が{{person:劉備|先帝}}のご恩に報い奉り、{{person:劉禅|陛下}}に忠節を尽くすべき職分であります。"}, {"id": "v35_p11_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 11, "type": "本文", "raw_text": "至於斟酌損益，進盡忠言，則攸之、禕、允之任也。願陛下託臣以討賊興復之效；不效，則治臣之罪，以告先帝之靈。若無興德之言，則責攸之、禕、允等之慢，以彰其咎。陛下亦宜自謀，以諮諏善道，察納雅言，深追先帝遺詔。臣不勝受恩感激，今當遠離，臨表涕零，不知所言。", "kakikudashi": "損益を斟酌し、忠言を進め尽くすに至りては、則ち攸之・禕・允の任なり。願わくは陛下、臣に託するに討賊・興復の効を以てせよ。効あらずんば、則ち臣の罪を治め、以て先帝の霊に告げよ。若し徳を興すの言無くんば、則ち攸之・禕・允等の慢を責め、以て其の咎を彰らかにせよ。陛下も亦た宜しく自ら謀り、以て善道を諮諏し、雅言を察納し、深く先帝の遺詔を追うべし。臣、恩を受け感激するに勝えず、今当に遠く離るべし、表に臨みて涕零ち、言う所を知らず。", "translation": "政務の得失を斟酌し、忠言を残らず進言する務めに至っては、攸之・禕・允の任であります。どうか陛下におかれては、臣に賊徒討伐と漢室再興の任務をお委ねくださいますように。もし成果を挙げられませぬときは、臣の罪を処断して、先帝の御霊にご報告くださいませ。もし君徳を興隆させる諫言がなければ、攸之・禕・董允らの怠慢をお責めになって、その過失を明らかに示されますように。陛下ご自身におかれましてもどうか自らよく思慮を巡らされ、善き政道を問い諮り、正しき言葉を察して受け入れ、先帝の遺詔を深く追懐なさいますように。臣は受けたご恩への感激に堪えず、いま遠く離れゆくにあたり、上表に臨んで涙がこぼれ落ち、申し上げるべき言葉もわかりません。", "persons": "郭攸之, 費禕, 董允, 劉禅, 劉備", "places": "", "era_year": "建興5年（227）春", "source_book": "", "keywords": "", "raw_tagged": "至於斟酌損益，進盡忠言，則{{person:郭攸之|攸之}}、{{person:費禕|禕}}、{{person:董允|允}}之任也。願{{person:劉禅|陛下}}託臣以討賊興復之效；不效，則治臣之罪，以告{{person:劉備|先帝}}之靈。若無興德之言，則責{{person:郭攸之|攸之}}、{{person:費禕|禕}}、{{person:董允|允}}等之慢，以彰其咎。{{person:劉禅|陛下}}亦宜自謀，以諮諏善道，察納雅言，深追{{person:劉備|先帝}}遺詔。臣不勝受恩感激，今當遠離，臨表涕零，不知所言。", "kakikudashi_tagged": "損益を斟酌し、忠言を進め尽くすに至りては、則ち{{person:郭攸之|攸之}}・{{person:費禕|禕}}・{{person:董允|允}}の任なり。願わくは{{person:劉禅|陛下}}、臣に託するに討賊・興復の効を以てせよ。効あらずんば、則ち臣の罪を治め、以て{{person:劉備|先帝}}の霊に告げよ。若し徳を興すの言無くんば、則ち{{person:郭攸之|攸之}}・{{person:費禕|禕}}・{{person:董允|允}}等の慢を責め、以て其の咎を彰らかにせよ。{{person:劉禅|陛下}}も亦た宜しく自ら謀り、以て善道を諮諏し、雅言を察納し、深く{{person:劉備|先帝}}の遺詔を追うべし。臣、恩を受け感激するに勝えず、今当に遠く離るべし、表に臨みて涕零ち、言う所を知らず。", "translation_tagged": "政務の得失を斟酌し、忠言を残らず進言する務めに至っては、{{person:郭攸之|攸之}}・{{person:費禕|禕}}・{{person:董允|允}}の任であります。どうか{{person:劉禅|陛下}}におかれては、臣に賊徒討伐と漢室再興の任務をお委ねくださいますように。もし成果を挙げられませぬときは、臣の罪を処断して、{{person:劉備|先帝}}の御霊にご報告くださいませ。もし君徳を興隆させる諫言がなければ、{{person:郭攸之|攸之}}・{{person:費禕|禕}}・{{person:董允|董允}}らの怠慢をお責めになって、その過失を明らかに示されますように。{{person:劉禅|陛下}}ご自身におかれましてもどうか自らよく思慮を巡らされ、善き政道を問い諮り、正しき言葉を察して受け入れ、{{person:劉備|先帝}}の遺詔を深く追懐なさいますように。臣は受けたご恩への感激に堪えず、いま遠く離れゆくにあたり、上表に臨んで涙がこぼれ落ち、申し上げるべき言葉もわかりません。"}, {"id": "v35_p12_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 12, "type": "本文", "raw_text": "遂行，屯於沔陽。", "kakikudashi": "遂に行き、沔陽に屯す。", "translation": "こうして進発し、沔陽に駐屯した。", "persons": "", "places": "沔陽", "era_year": "建興5年（227）春", "source_book": "", "keywords": "", "raw_tagged": "遂行，屯於{{place:沔陽|沔陽}}。", "kakikudashi_tagged": "遂に行き、{{place:沔陽|沔陽}}に屯す。", "translation_tagged": "こうして進発し、{{place:沔陽|沔陽}}に駐屯した。"}, {"id": "v35_p12_2", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 12, "type": "裴注", "raw_text": "郭沖《三事》曰：亮屯于陽平，遣魏延諸軍並兵東下，亮惟留萬人守城。晉宣帝率二十萬眾拒亮，而與延軍錯道，徑至前，當亮六十里所，偵候白宣帝說亮在城中兵少力弱。亮亦知宣帝垂至，已與相偪，欲前赴延軍，相去又遠，回跡反追，勢不相及，將士失色，莫知其計。亮意氣自若，敕軍中皆臥旗息鼓，不得妄出菴幔，又令大開四城門，埽地卻灑。宣帝常謂亮持重，而猥見勢弱，疑其有伏兵，於是引軍北趣山。明日食時，亮謂參佐拊手大笑曰：「司馬懿必謂吾怯，將有彊伏，循山走矣。」候邏還白，如亮所言。宣帝後知，深以為恨。◇難曰：案陽平在漢中。亮初屯陽平，宣帝尚為荊州都督，鎮宛城，至曹真死後，始與亮於關中相抗禦耳。魏嘗遣宣帝自宛由西城伐蜀，值霖雨，不果。此之前後，無復有於陽平交兵事。就如沖言，宣帝既舉二十萬眾，已知亮兵少力弱，若疑其有伏兵，正可設防持重，何至便走乎？案《魏延傳》云：「延每隨亮出，輒欲請精兵萬人，與亮異道會于潼關，亮制而不許；延常謂亮為怯，歎己才用之不盡也。」亮尚不以延為萬人別統，豈得如沖言，頓使將重兵在前，而以輕弱自守乎？且沖與扶風王言，顯彰宣帝之短，對子毀父，理所不容，而云「扶風王慨然善沖之言」，故知此書舉引皆虛。", "kakikudashi": "郭沖の『三事』に曰く、亮は陽平に屯し、魏延の諸軍を遣わし兵を並せて東下せしめ、亮は惟だ万人を留めて城を守るのみ。晋の宣帝は二十万の衆を率いて亮を拒ぐに、延の軍と道を錯え、径ちに至りて前み、亮に当たること六十里の所にして、偵候は宣帝に白し、亮は城中に在りて兵少なく力弱しと説く。亮も亦た宣帝の垂んと至らんとし、已に与に相い偪るを知り、前みて延の軍に赴かんと欲するも、相い去ること又た遠く、跡を回らし反りて追わしむるも、勢い相い及ばず、将士色を失い、其の計を知ること莫し。亮は意気自若として、軍中に敕して皆な旗を臥せ鼓を息め、妄りに菴幔を出づるを得ざらしめ、又た四城門を大開し、地を埽き却き灑がしむ。宣帝は常に亮を持重なりと謂えるに、猥りに勢いの弱きを見、其の伏兵有らんことを疑い、是に於いて軍を引きて北のかた山に趣く。明日の食時、亮は参佐に謂いて手を拊ち大笑して曰く、「司馬懿は必ず吾を怯なりと謂い、将に強伏有らんとして、山に循いて走れるならん」と。候邏還り白すに、亮の言う所の如し。宣帝、後に知り、深く以て恨みと為す、と。◇難じて曰く、案ずるに陽平は漢中に在り。亮が初めて陽平に屯せしとき、宣帝は尚お荊州都督と為りて、宛城に鎮し、曹真の死して後に至り、始めて亮と関中に於いて相い抗禦せしのみ。魏は嘗て宣帝を遣わし宛より西城に由りて蜀を伐たしむるも、霖雨に値い、果たさず。此れの前後に、復た陽平に於いて兵を交うるの事有る無し。就い沖の言の如くするも、宣帝は既に二十万の衆を挙げ、已に亮の兵少なく力弱きを知りたれば、若し其の伏兵有らんことを疑わば、正に防を設け持重すべく、何ぞ便ち走るに至らんや？『魏延伝』を案ずるに云う、「延は亮に随いて出づる毎に、輒ち精兵万人を請い、亮と道を異にして潼関に会せんと欲すれども、亮は制して許さず。延は常に亮を謂いて怯と為し、己が才用の尽くされざるを歎ず」と。亮は尚お延を以て万人の別統と為さざるに、豈に沖の言の如く、頓かに重兵を将いて前に在らしめ、軽弱を以て自ら守るを得んや？且つ沖は扶風王と言りて、顕らかに宣帝の短を彰わす、子に対して父を毀るは、理の容れざる所なるに、「扶風王、慨然として沖の言を善しとす」と云う、故に此の書の挙引、皆な虚なるを知るなり。", "translation": "郭沖の『三事』にいう、諸葛亮は陽平に駐屯すると、魏延ら諸軍を派遣して兵力を合わせて東へ下らせ、諸葛亮はただ一万人だけを留めて城を守っていた。晋の宣帝は二十万の衆を率いて諸葛亮を防ごうとしたが、魏延の軍と道がすれ違い、そのまま真っすぐ前進して、諸葛亮から六十里の地点に迫ったところで、物見の兵が宣帝に報告し、諸葛亮は城中にいて兵も少なく戦力も手薄であると告げた。諸葛亮もまた宣帝が間近に迫り、すでに鼻先まで詰め寄られていることを知り、前進して魏延の軍に合流しようにも、距離があまりに遠く離れており、引き返させて呼び戻そうとしても、勢い間に合わず、将兵たちは顔色を失って、どう計らえばよいかわからなかった。ところが諸葛亮は意気自若として動じず、全軍に命じてみな軍旗を伏せ太鼓を鳴らすのをやめさせ、みだりに幕舎から出ることを禁じ、さらに四方の城門を大きく開け放って、地面を掃き清め打ち水を撒かせた。宣帝はつねづね諸葛亮を慎重・重厚な人物であると考えていたのに、にわかに弱小な態勢を見せつけられたため、伏兵があるのではないかと疑い、そこで軍を引いて北の山へと退いた。翌日の食事の時刻、諸葛亮は幕僚たちに向かって手を打ち大笑いして言った、「司馬懿はきっと私を臆病だと考え、手強い伏兵が潜んでいるに違いないとみて、山伝いに逃げて行ったのであろう」と。斥候が戻って報告すると、はたして諸葛亮の言った通りであった。宣帝はのちに真相を知り、深く悔しがった、と。◇反駁していう、考えてみるに陽平は漢中にある。諸葛亮がはじめて陽平に駐屯したとき、宣帝はまだ荊州都督として、宛城を鎮守しており、曹真が死去した後に至って、はじめて諸葛亮と関中において対峙・防戦したにすぎない。魏はかつて宣帝を派遣し、宛から西城を経由して蜀漢を討たせたことがあったが、長雨に遭い、果たせなかった。この前後を通じて、陽平において干戈を交えた事実などほかに一切ない。たとい郭沖の言葉の通りであったとしても、宣帝はすでに二十万の大軍を動員し、諸葛亮の兵が少なく戦力が手薄であるこ 違い、そのまま真っすぐ前進して、{{person:諸葛亮|諸葛亮}}から六十里の地点に迫ったところで、物見の兵が{{person:司馬懿|宣帝}}に報告し、{{person:諸葛亮|諸葛亮}}は城中にいて兵も少なく戦力も手薄であると告げた。{{person:諸葛亮|諸葛亮}}もまた{{person:司馬懿|宣帝}}が間近に迫り、すでに鼻先まで詰め寄られていることを知り、前進して{{person:魏延|魏延}}の軍に合流しようにも、距離があまりに遠く離れており、引き返させて呼び戻そうとしても、勢い間に合わず、将兵たちは顔色を失って、どう計らえばよいかわからなかった。ところが{{person:諸葛亮|諸葛亮}}は意気自若として動じず、全軍に命じてみな軍旗を伏せ太鼓を鳴らすのをやめさせ、みだりに幕舎から出ることを禁じ、さらに四方の城門を大きく開け放って、地面を掃き清め打ち水を撒かせた。{{person:司馬懿|宣帝}}はつねづね{{person:諸葛亮|諸葛亮}}を慎重・重厚な人物であると考えていたのに、にわかに弱小な態勢を見せつけられたため、伏兵があるのではないかと疑い、そこで軍を引いて北の山へと退いた。翌日の食事の時刻、{{person:諸葛亮|諸葛亮}}は幕僚たちに向かって手を打ち大笑いして言った、「{{person:司馬懿|司馬懿}}はきっと私を臆病だと考え、手強い伏兵が潜んでいるに違いないとみて、山伝いに逃げて行ったのであろう」と。斥候が戻って報告すると、はたして{{person:諸葛亮|諸葛亮}}の言った通りであった。{{person:司馬懿|宣帝}}はのちに真相を知り、深く悔しがった、と。◇反駁していう、考えてみるに{{place:陽平関|陽平}}は{{place:漢中|漢中}}にある。{{person:諸葛亮|諸葛亮}}がはじめて{{place:陽平関|陽平}}に駐屯したとき、{{person:司馬懿|宣帝}}はまだ{{place:荊州|荊州}}{{office:都督|都督}}として、{{place:宛|宛城}}を鎮守しており、{{person:曹真|曹真}}が死去した後に至って、はじめて{{person:諸葛亮|諸葛亮}}と{{place:関中|関中}}において対峙・防戦したにすぎない。魏はかつて{{person:司馬懿|宣帝}}を派遣し、{{place:宛|宛}}から{{place:西城|西城}}を経由して蜀漢を討たせたことがあったが、長雨に遭い、果たせなかった。この前後を通じて、{{place:陽平関|陽平}}において干戈を交えた事実などほかに一切ない。たとい{{person:郭沖|郭沖}}の言葉の通りであったとしても、{{person:司馬懿|宣帝}}はすでに二十万の大軍を動員し、{{person:諸葛亮|諸葛亮}}の兵が少なく戦力が手薄であることも知っていた以上、もし伏兵があるのではないかと疑ったのならば、当然防御を固めて慎重に構えればよいのであって、どうしてすぐさま逃げ出すに至ろうか？『{{special:魏延伝|魏延伝}}』を調べてみると、「{{person:魏延|魏延}}は{{person:諸葛亮|諸葛亮}}に従って出陣するたびに、いつも精兵一万人を請い受け、{{person:諸葛亮|諸葛亮}}とは別ルートを進んで{{place:潼関|潼関}}で合流したいと望んだが、{{person:諸葛亮|諸葛亮}}は制止して許さなかった。{{person:魏延|魏延}}はつねづね{{person:諸葛亮|諸葛亮}}を臆病であると評し、自分の才能が存分に用いられないことを嘆いていた」とある。{{person:諸葛亮|諸葛亮}}は{{person:魏延|魏延}}に一万人の別動隊すら委ねなかったというのに、どうして{{person:郭沖|郭沖}}の言葉のように、にわかに主力の大軍を率いて前方に先行させ、手薄で微弱な兵だけで自ら城を守ったりするはずがあろうか？しかも{{person:郭沖|郭沖}}は{{person:司馬駿|扶風王}}と語り合いながら、あからさまに{{person:司馬懿|宣帝}}の短所を暴き立てているが、息子に向かってその父親を貶めるなど、道理として許されるはずもないのに、「{{person:司馬駿|扶風王}}は深く感嘆して{{person:郭沖|郭沖}}の言葉を称賛した」と述べている、それゆえこの書が挙げている逸話は、すべて虚構であることがわかるのである。"}, {"id": "v35_p13_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 13, "type": "本文", "raw_text": "六年春，揚聲由斜谷道取郿，使趙雲、鄧芝為疑軍，據箕谷，魏大將軍曹真舉眾拒之。亮身率諸軍攻祁山，戎陳整齊，賞罰肅而號令明，南安、天水、安定三郡叛魏應亮，關中響震。", "kakikudashi": "六年春、斜谷道に由りて郿を取ると揚声し、趙雲・鄧芝をして疑軍と為りて箕谷に拠らしむれば、魏の大将軍・曹真、衆を挙げて之を拒ぐ。亮は身ら諸軍を率いて祁山を攻むるに、戎陳は整斉にして、賞罰は粛にして号令は明らかなれば、南安・天水・安定の三郡、魏に叛きて亮に応じ、関中響震す。", "translation": "六年春、斜谷道から郿を奪取すると声高に宣伝し、趙雲・鄧芝を陽動の疑軍として箕谷に拠らせたところ、魏の大将軍・曹真が兵衆を挙げてこれを防いだ。諸葛亮は自ら諸軍を率いて祁山を攻めたが、軍陣は整然と揃い、賞罰は厳粛で号令は明快であったため、南安・天水・安定の三郡が魏に背いて諸葛亮に呼応し、関中は大きく揺れ動いた。", "persons": "趙雲, 鄧芝, 曹真, 諸葛亮", "places": "斜谷, 郿, 箕谷, 祁山_涼州, 南安, 天水, 安定, 関中", "era_year": "建興6年（228）春", "source_book": "", "keywords": "大将軍", "raw_tagged": "六年春，揚聲由{{place:斜谷|斜谷道}}取{{place:郿|郿}}，使{{person:趙雲|趙雲}}、{{person:鄧芝|鄧芝}}為疑軍，據{{place:箕谷|箕谷}}，魏{{office:大将軍|大將軍}}{{person:曹真|曹真}}舉眾拒之。{{person:諸葛亮|亮}}身率諸軍攻{{place:祁山_涼州|祁山}}，戎陳整齊，賞罰肅而號令明，{{place:南安|南安}}、{{place:天水|天水}}、{{place:安定|安定}}三郡叛魏應{{person:諸葛亮|亮}}，{{place:関中|關中}}響震。", "kakikudashi_tagged": "六年春、{{place:斜谷|斜谷道}}に由りて{{place:郿|郿}}を取ると揚声し、{{person:趙雲|趙雲}}・{{person:鄧芝|鄧芝}}をして疑軍と為りて{{place:箕谷|箕谷}}に拠らしむれば、魏の{{office:大将軍|大将軍}}・{{person:曹真|曹真}}、衆を挙げて之を拒ぐ。{{person:諸葛亮|亮}}は身ら諸軍を率いて{{place:祁山_涼州|祁山}}を攻むるに、戎陳は整斉にして、賞罰は粛にして号令は明らかなれば、{{place:南安|南安}}・{{place:天水|天水}}・{{place:安定|安定}}の三郡、魏に叛きて{{person:諸葛亮|亮}}に応じ、{{place:関中|関中}}響震す。", "translation_tagged": "六年春、{{place:斜谷|斜谷道}}から{{place:郿|郿}}を奪取すると声高に宣伝し、{{person:趙雲|趙雲}}・{{person:鄧芝|鄧芝}}を陽動の疑軍として{{place:箕谷|箕谷}}に拠らせたところ、魏の{{office:大将軍|大将軍}}・{{person:曹真|曹真}}が兵衆を挙げてこれを防いだ。{{person:諸葛亮|諸葛亮}}は自ら諸軍を率いて{{place:祁山_涼州|祁山}}を攻めたが、軍陣は整然と揃い、賞罰は厳粛で号令は明快であったため、{{place:南安|南安}}・{{place:天水|天水}}・{{place:安定|安定}}の三郡が魏に背いて{{person:諸葛亮|諸葛亮}}に呼応し、{{place:関中|関中}}は大きく揺れ動いた。"}, {"id": "v35_p13_2", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 13, "type": "裴注", "raw_text": "《魏略》曰：始，國家以蜀中惟有劉備。備既死，數歲寂然無聲，是以略無備預；而卒聞亮出，朝野恐懼，隴右、祁山尤甚，故三郡同時應亮。", "kakikudashi": "『魏略』に曰く、始め、国家は蜀中には惟だ劉備有るのみと以えり。備の既に死するや、数歳寂然として声無く、是を以て略ぼ備預無く、而して卒かに亮の出づるを聞くや、朝野恐懼し、隴右・祁山は尤も甚だしく、故に三郡同時に亮に応ぜり、と。", "translation": "『魏略』にいう、はじめ、朝廷では蜀中にはただ劉備がいるだけだと考えていた。劉備がすでに死去すると、数年のあいだひっそりと静まり返って何の音沙汰もなかったため、ほとんど備えを設けていなかっ n:張郃|張郃}}の破る所と為る。{{person:諸葛亮|亮}}は{{place:西県|西県}}の千余家を抜きて、{{place:漢中|漢中}}に還り、", "translation_tagged": "{{person:曹叡|魏の明帝}}は西方の{{place:長安|長安}}に出向いて鎮撫し、{{person:張郃|張郃}}に命じて{{person:諸葛亮|諸葛亮}}を防がせ、{{person:諸葛亮|諸葛亮}}は{{person:馬謖|馬謖}}に諸軍を統督させて前線に立たせ、{{person:張郃|張郃}}と{{place:街亭|街亭}}で戦わせた。{{person:馬謖|馬謖}}は{{person:諸葛亮|諸葛亮}}の節度に背き、采配が適切さを欠いたため、{{person:張郃|張郃}}に大敗を喫した。{{person:諸葛亮|諸葛亮}}は{{place:西県|西県}}の千余家を移住させて、{{place:漢中|漢中}}へ帰還し、"}, {"id": "v35_p13_4", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 13, "type": "裴注", "raw_text": "郭沖《四事》曰：亮出祁山，隴西、南安二郡應時降，圍天水，拔冀城，虜姜維，驅略士女數千人還蜀。人皆賀亮，亮顏色愀然有戚容，謝曰：「普天之下，莫非漢民，國家威力未舉，使百姓困於豺狼之吻。一夫有死，皆亮之罪，以此相賀，能不為愧。」於是蜀人咸知亮有吞魏之志，非惟拓境而已。◇難曰：亮有吞魏之志久矣，不始於此眾人方知也，且於時師出無成，傷缺而反者眾，三郡歸降而不能有。姜維，天水之匹夫耳，獲之則於魏何損？拔西縣千家，不補街亭所喪，以何為功，而蜀人相賀乎？", "kakikudashi": "郭沖の『四事』に曰く、亮、祁山に出づるや、隴西・南安の二郡は時に応じて降り、天水を囲み、冀城を抜き、姜維を虜にし、士女数千人を駆略して蜀に還る。人皆な亮を賀するに、亮は顔色愀然として戚容有り、謝して曰く、「普天の下、漢民に非ざるは莫きに、国家の威力未だ挙がらず、百姓をして豺狼の吻に困しましむ。一夫も死する有らば、皆な亮の罪なり、此を以て相い賀するは、能く愧と為さざらんや」と。是に於いて蜀人は咸な亮に魏を呑むの志有りて、惟だ境を拓くのみに非ざるを知る、と。◇難じて曰く、亮に魏を呑むの志有るは久し、此に始めて衆人の方に知るにはあらざるなり、且つ時に於いて師出づれども成る無く、傷欠して反る者衆く、三郡帰降すれども有つ能わず。姜維は、天水の匹夫なるのみ、之を獲たりとて則ち魏に於いて何ぞ損ぜんや？西県の千家を抜くも、街亭に喪う所を補わず、何を以て功と為し、而して蜀人の相い賀せんや？", "translation": "郭沖の『四事』にいう、諸葛亮が祁山へ出兵すると、隴西・南安の二郡はたちまち降伏し、さらに天水を包囲して、冀城を陥落させ、姜維を捕虜とし、男女数千人を駆り立てて蜀へ連れ帰った。人々がみな諸葛亮に祝賀を述べると、諸葛亮は顔色を引き締めて憂いの表情を浮かべ、謝絶して言った、「あまねく天下のもと、漢の民でない者はないというのに、国家の威力がいまだ振るわず、万民を豺狼の顎に苦しませている。一人の民でも死ぬ者があれば、すべてこの諸葛亮の罪であるのに、このようなことで祝賀し合うなど、どうして恥じずにいられようか」と。ここにおいて蜀人はみな、諸葛亮に魏を呑み込む大志があり、ただ国境を広げるだけではないことを知ったのである、と。◇反駁していう、諸葛亮に魏を呑み込む志があったのは久しい昔からのことであり、この時はじめて人々が知ったわけではないうえ、この時は軍を出しても成果がなく、損害を被って引き返した者が多く、三郡が帰順しても保持することができなかった。姜維など、当時は天水の一匹夫にすぎず、これを捕らえたところで魏に何の損失があろうか？西県の千家を移住させたところで、街亭で失った損害を補うにも足りないのに、いったい何を功績として、蜀人が祝賀し合うというのか？", "persons": "郭沖, 諸葛亮, 姜維", "places": "祁山_涼州, 隴西, 南安, 天水, 冀城, 益州, 西県, 街亭", "era_year": "建興6年（228）春", "source_book": "『蜀記』・『郭沖五事』", "keywords": "郭沖五事", "raw_tagged": "{{person:郭沖|郭沖}}《{{special:郭沖五事|四事}}》曰：{{person:諸葛亮|亮}}出{{place:祁山_涼州|祁山}}，{{place:隴西|隴西}}、{{place:南安|南 e": "本文", "raw_text": "戮謖以謝眾。上疏曰：「臣以弱才，叨竊非據，親秉旄鉞以厲三軍，不能訓章明法，臨事而懼，至有街亭違命之闕，箕谷不戒之失，咎皆在臣授任無方。臣明不知人，恤事多闇，《春秋》責帥，臣職是當。請自貶三等，以督厥咎。」於是以亮為右將軍，行丞相事，所總統如前。", "kakikudashi": "謖を戮して以て衆に謝す。上疏して曰く、「臣、弱才を以て、非拠を叨窃し、親ら旄鉞を秉りて以て三軍を厲ますも、章を訓え法を明らかにし、事に臨みて懼るる能わず、街亭に命に違うの闕、箕谷に戒めざるの失有るに至りしは、咎は皆な臣が任を授くるに方無きに在り。臣は明の人を知らず、事を恤うるに闇きこと多く、『春秋』は帥を責むれば、臣が職は是れに当たる。請う自ら三等を貶し、以て厥の咎を督さん」と。是に於いて亮を以て右将軍と為し、丞相の事を行わしめ、総統する所は前の如し。", "translation": "馬謖を処刑して諸軍に謝罪した。上疏して言った、「臣は微弱な才でありながら、分不相応の高位をみだりに汚し、親しく旄鉞を執って三軍を督励しながらも、規律を教え法度を明らかにし、事に臨んで慎み恐れることができず、街亭における命令違反の過失や、箕谷における警戒不備の失態を招くに至りましたのは、その咎はすべて臣が適材に任を授ける術を欠いていたことにあります。臣には人を見抜く明察がなく、政務・軍務を慮るにあたって暗いところが多く、『春秋』では主帥の責任を責めておりますから、臣の職責はまさにその処罰に当たります。どうか自ら官位を三等降格し、もってその咎を正したく存じます」と。ここにおいて諸葛亮を右将軍とし、丞相の職務を代行させ、統括するところは従前の通りとした。", "persons": "馬謖, 諸葛亮", "places": "街亭, 箕谷", "era_year": "建興6年（228）春〜夏", "source_book": "", "keywords": "三軍, 春秋, 右将軍, 丞相", "raw_tagged": "戮{{person:馬謖|謖}}以謝眾。上疏曰：「臣以弱才，叨竊非據，親秉旄鉞以厲{{special:三軍|三軍}}，不能訓章明法，臨事而懼，至有{{place:街亭|街亭}}違命之闕，{{place:箕谷|箕谷}}不戒之失，咎皆在臣授任無方。臣明不知人，恤事多闇，《{{special:春秋|春秋}}》責帥，臣職是當。請自貶三等，以督厥咎。」於是以{{person:諸葛亮|亮}}為{{office:右将軍|右將軍}}，行{{office:丞相|丞相}}事，所總統如前。", "kakikudashi_tagged": "{{person:馬謖|謖}}を戮して以て衆に謝す。上疏して曰く、「臣、弱才を以て、非拠を叨窃し、親ら旄鉞を秉りて以て{{special:三軍|三軍}}を厲ますも、章を訓え法を明らかにし、事に臨みて懼るる能わず、{{place:街亭|街亭}}に命に違うの闕、{{place:箕谷|箕谷}}に戒めざるの失有るに至りしは、咎は皆な臣が任を授くるに方無きに在り。臣は明の人を知らず、事を恤うるに闇きこと多く、『{{special:春秋|春秋}}』は帥を責むれば、臣が職は是れに当たる。請う自ら三等を貶し、以て厥の咎を督さん」と。是に於いて{{person:諸葛亮|亮}}を以て{{office:右将軍|右将軍}}と為し、{{office:丞相|丞相}}の事を行わしめ、総統する所は前の如し。", "translation_tagged": "{{person:馬謖|馬謖}}を処刑して諸軍に謝罪した。上疏して言った、「臣は微弱な才でありながら、分不相応の高位をみだりに汚し、親しく旄鉞を執って{{special:三軍|三軍}}を督励しながらも、規律を教え法度を明らかにし、事に臨んで慎み恐れることができず、{{place:街亭|街亭}}における命令違反の過失や、{{place:箕谷|箕谷}}における警戒不備の失態を招くに至りましたのは、その咎はすべて臣が適材に任を授ける術を欠いていたことにあります。臣には人を見抜く明察がなく、政務・軍務を慮るにあたって暗いところが多く、『{{special:春秋|春秋}}』では主帥の責任を責めておりますから、臣の職責はまさにその処罰に当たります。どうか自ら官位を三等降格し、もってその咎を正したく存じます」と。ここにおいて{{person:諸葛亮|諸葛亮}}を{{office:右将軍|右将軍}}とし、{{office:丞相|丞相}}の職務を代行させ、統括するところは従前の通りとした。"}, {"id": "v35_p13_6", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 13, "type": "裴注", "raw_text": "《漢晉春秋》曰：或勸亮更發兵者，亮曰：「大軍在祁山、箕谷，皆多於賊，而不能破賊、為賊所破者，則此病不在兵少也，在一人耳。今欲減兵省將，明罰思過，校變通之道於將來；若不能然者，雖兵多何益！自今已後，諸有忠慮於國，但勤攻吾之闕，則事可定，賊可死，功可蹻足而待矣。」於是考微勞，甄烈壯，引咎責躬，布所失於天下，厲兵講武，以為後圖，戎士簡練，民忘其敗矣。亮聞孫權破曹休，魏兵東下，關中虛弱。十一月，上言曰：先帝慮漢、賊不兩立，王業不偏安，故託臣以討賊也。以先帝之明，量臣之才，故知臣伐賊才弱敵強也；然不伐賊，王業亦亡，惟坐待亡，孰與伐之？是故託臣而弗疑也。臣受命之日，寢不安席，食不甘味，思惟北征，宜先入南，故五月渡瀘，深入不毛，並日而食。臣非不自惜也，顧王業不得偏全於蜀都，故冒危難以奉先帝之遺意也，而議者謂為非計。今賊適疲於西，又務於東，兵法乘勞，此進趨之時也。謹陳其事如左：高帝明並日月，謀臣淵深，然涉險被創，危然後安。今陛下未及高帝，謀臣不如良、平，而欲以長計取勝，坐定天下，此臣之未解一也。劉繇、王朗各據州郡，論安言計，動引聖人，群疑滿腹，眾難塞胸，今歲不戰，明年不徵，使孫策坐大，遂並江東，此臣之未解二也。曹操智計殊絕於人，其用兵也，彷彿孫、吳，然困於南陽，險於烏巢，危於祁連，偪於黎陽，幾敗北山，殆死潼關，然後偽定一時耳，況臣才弱，而欲以不危而定之，此臣之未解三也。曹操五攻昌霸不下，四越巢湖不成，任用李服而李服圖之，委夏侯而夏侯敗亡，先帝每稱操為能，猶有此失，況臣駑下，何能必勝？此臣之未解四也。自臣到漢中，中間期年耳，然喪趙雲、陽群、馬玉、閻芝、丁立、白壽、劉郃、鄧銅等及曲長屯將七十餘人，突將無前。賨、叟、青羌散騎、武騎一千餘人，此皆數十年之內所糾合四方之精銳，非一州之所有，若復數年，則損三分之二也，當何以圖敵？此臣之未解五也。今民窮兵疲，而事不可息，事不可息，則住與行勞費正等，而不及今圖之，欲以一州之地與賊持久，此臣之未解六也。夫難平者，事也。昔先帝敗軍於楚，當此時，曹操拊手，謂天下以定。然後先帝東連吳、越，西取巴、蜀，舉兵北征，夏侯授首，此操之失計而漢事將成也。然後吳更違盟，關羽毀敗，秭歸蹉跌，曹丕稱帝。凡事如是，難可逆見。臣鞠躬盡力，死而後已，至於成敗利鈍，非臣之明所能逆睹也。於是有散關之役。此表，亮集所無，出張儼《默記》。", "kakikudashi": "『漢晋春秋』に曰く、或るひと亮に更に兵を発せんことを勧むる者有るに、亮曰く、「大軍の祁山・箕谷に在りしは、皆な賊より多かりしに、而も賊を破る能わず、賊の破る所と為りし者は、則ち此の病は兵の少なきに在らざるなり、一人に在るのみ。今は兵を減じ将を省き、罰を明らかにし過ちを思い、変通の道を将来に校えんと欲す、若し然る能わざれば、兵多しと雖も何ぞ益せん！今より已後、諸もろの国に忠慮有るもの、但だ勤めて吾が闕を攻めなば、則ち事は定むべく、賊は死すべく、功は足を蹻げて待つべし」と。是に於いて微労を考し、烈壮を甄わし、咎を引きて躬を責め、失う所を天下に布き、兵を厲まし武を講じて、以て後図を為せば、戎士は簡練せられ、民は其の敗を忘れたり。亮、孫権の曹休を破り、魏兵東下して、関中虚弱なりと聞く。十一月、上言して曰く、先帝は漢・賊の両立せず、王業の偏安せざるを慮る、故に臣に託するに討賊を以てせり。先帝の明を以て、臣の才を量れば、故より臣が賊を伐つに才弱く敵強きを知るなり、然れども賊を伐たずんば、王業も亦た亡びん、惟だ坐して亡ぶるを待つは、之を伐つに孰与ぞや？是の故に臣に託して疑わざりしなり。臣、命を受くるの日より、寝ぬるに席を安んぜず、食うに味を甘しとせず、惟うに北征せんには、宜しく先ず南に入るべしと思い、故に五月瀘を渡り、深く不毛に入り、日を並せて食せり。臣、自ら惜しまざるには非ざるなり、顧うに王業は蜀都に偏全するを得ず、故に危難を冒して以て先帝の遺意を奉ずるなり、而るに議者は謂いて非計と為す。今、賊は適ま西に疲れ、又た東に務む、兵法は労に乗ずれば、此れ進趨の時なり。謹みて其の事を陳ぶること左の如し、高帝は明日月に並び、謀臣は淵深なれども、然れども険を渉り創を被り、危うくして然る後に安かりき。今、陛下は未だ高帝に及ばず、謀臣は良・平に如かざるに、而も長計を以て勝ちを取り、坐して天下を定めんと欲す、此れ臣の未だ解せざるの一なり。劉繇・王朗は各おの州郡に拠り、安きを論じ計を言うに、動もすれば聖人を引き、群疑は腹に満ち、衆難は胸を塞ぎ、今歳は戦わず、明年は征せず、孫策をして坐ながらに大ならしめ、遂に江東を并せしめたり、此れ臣の未だ解せざるの二なり。曹操は智計人に殊絶し、其の兵を用うるや、孫・呉に彷彿たれども、然れども南陽に困しみ、烏巣に険しく、祁連に危うく、黎陽に偪られ、幾ど北山に敗れんとし、殆ど潼関に死せんとして、然る後に一時を偽定せしのみ、況んや臣は才弱きに、而も危うからざるを以て之を定めんと欲す、此れ臣の未だ解せざるの三なり。曹操は五たび昌覇を攻めて下さず、四たび巣湖を越えて成らず、李服を任用して李服之を図り、夏侯に委ねて夏侯敗亡せり、先帝は毎に操を称して能と為せしも、猶お此の失有り、況んや臣は駑下なるに、何ぞ能く必ず勝たんや？此れ臣の未だ解せざるの四なり。臣の漢中に到りてより、中間は期年なるのみ、然れども趙雲・陽群・馬玉・閻芝・丁立・白寿・劉郃・鄧銅等及び曲長・屯将七十余人、突将無前なるを喪えり。賨・叟・青羌の散騎・武騎一千余人も、此れ皆な数十年の内に糾合する所の四方の精鋭にして、一州の有する所に非ず、若し復た数年ならば、則ち三分の二を損ぜん、当に何を以て敵を図るべきや？此れ臣の未だ解せざるの五なり。今、民は窮し兵は疲るれども、而も事は息むべからず、事息むべからざれば、則ち住まると行くとは労費正に等しきに、而も今に及びて之を図らず、一州の地を以て賊と持久せんと欲す、此れ臣の未だ解せざるの六なり。夫れ平らげ難き者は、事なり。昔、先帝の軍を楚に敗るや、此の時に当たり、曹操は手を拊ち、天下以て定まれりと謂えり。然る後に先帝は東は呉・越に連なり、西のかた巴・蜀を取り、兵を挙げて北征し、夏侯は首を授けたれば、此れ操の失計にして漢の事将に成らんとせしなり。然る後に呉は更に盟に違い、関羽は毀敗し、秭帰に蹉跌して、曹丕は帝を称せり。凡そ事は是くの如く、逆め見るべからず。臣は鞠躬尽力し、死して後已まんのみ、成敗利鈍に至りては、臣の明の能く逆め睹る所に非ざるなり、と。是に於いて散関の役有り。此の表は、『亮集』に無き所にして、張儼の『黙記』に出づ。", "translation": "『漢晋春秋』にいう、ある人が諸葛亮に改めて増兵を発するよう勧めたところ、諸葛亮は言った、「祁山・箕谷にあった我が大軍は、いずれも賊より多かったにもかかわらず、賊を打ち破ることができず、かえって賊に打ち破られたからには、この欠陥は兵が少ないことにあるのではなく、私一人にあるのだ。いまは兵を減らし将を省き、処罰を厳明にして過ちを反省し、臨機変通の方策を将来に向けて練り直したいと考えているが、もしそうすることができなければ、たとえ兵が多くとも何の役に立とうか！これより以後、国を思う忠誠の思慮ある諸氏が、ただひたすら私の欠点を厳しく批判してくれるならば、大業は平定でき、賊は滅ぼすことができ、成功は爪先立って待つほど速やかに訪れるであろう」と。こうしてわずかな労苦をも考査して報い、壮烈な勇士を表彰し、咎を引き受けて我が身を責め、おのれの失敗を天下に公表し、兵を鍛え武芸を調練して、再挙の計を図ったため、将兵は精選・練磨され、民はその敗戦を忘れたのであった。諸葛亮は、孫権が曹休を打ち破り、魏の兵が東へ下って、関中が手薄になっていると聞いた。十一月、上表して言った、先帝は漢と賊とが両立せず、王業が辺地に偏安すべきでないことを深く憂慮なさり、それゆえ臣に賊徒討伐の大任を託されたのであります。先帝の明察をもって臣の才能を量られたのですから、もとより臣が賊を討つにあたり臣の才は弱く敵は強大であることをご存じでありましたが、されど賊を討たなければ、王業もまた滅びるのであり、ただ手をこまねいて滅亡を待つよりは、これを討つ方がどれほど勝っていることでしょうか？それゆえ臣に託して少しも疑われなかったのであります。臣はご遺命を拝受した日より、眠るにも席に安んぜず、食べるにも味を旨いと感じず、北征を行うにはまず南方へ入るべきであると考え、それゆえ五月に瀘水を渡り、深く不毛の地に分け入って、二日に一度の食事で耐え忍びました。臣とて我が身を惜しまないわけではありませんが、思うに王業は蜀都の一隅だけで偏って全うし得るものではなく、それゆえ危難を冒して先帝のご遺志を奉じているのでありますのに、議論する者たちはこれを無謀な失計であると申しております。いま賊はちょうど西で疲弊し、さらに東での戦いに追われておりますが、兵法は敵の疲労に乗ずるを要としますから、いまこそ進撃すべき好機であります。謹んでその事由を以下の通り開陳いたします、高帝は明智が日月に並び、謀臣たちの智略は淵のごとく深遠でありましたが、それでも険難を踏み越え傷を負い、危地をくぐり抜けてはじめて安泰を得られました。いま陛下はいまだ高帝に及ばれず、謀臣も張良・陳平に及ばないにもかかわらず、長期の計をもって勝利を収め、座したまま天下を平定しようとしておられます、これが臣の理解できぬ一つ目であり n:劉備|先帝}}慮漢、賊不兩立，王業不偏安，故託臣以討賊也。以{{person:劉備|先帝}}之明，量臣之才，故知臣伐賊才弱敵強也；然不伐賊，王業亦亡，惟坐待亡，孰與伐之？是故託臣而弗疑也。臣受命之日，寢不安席，食不甘味，思惟北征，宜先入南，故五月渡{{place:瀘水|瀘}}，深入不毛，並日而食。臣非不自惜也，顧王業不得偏全於{{place:成都|蜀都}}，故冒危難以奉{{person:劉備|先帝}}之遺意也，而議者謂為非計。今賊適疲於西，又務於東，兵法乘勞，此進趨之時也。謹陳其事如左：{{person:劉邦|高帝}}明並日月，謀臣淵深，然涉險被創，危然後安。今{{person:劉禅|陛下}}未及{{person:劉邦|高帝}}，謀臣不如{{person:張良|良}}、{{person:陳平|平}}，而欲以長計取勝，坐定天下，此臣之未解一也。{{person:劉繇|劉繇}}、{{person:王朗|王朗}}各據州郡，論安言計，動引聖人，群疑滿腹，眾難塞胸，今歲不戰，明年不徵，使{{person:孫策|孫策}}坐大，遂並{{place:江東|江東}}，此臣之未解二也。{{person:曹操|曹操}}智計殊絕於人，其用兵也，彷彿{{person:孫武|孫}}、{{person:呉起|吳}}，然困於{{place:南陽|南陽}}，險於{{place:烏巣|烏巢}}，危於{{place:祁連|祁連}}，偪於{{place:黎陽|黎陽}}，幾敗{{place:北山|北山}}，殆死{{place:潼関|潼關}}，然後偽定一時耳，況臣才弱，而欲以不危而定之，此臣之未解三也。{{person:曹操|曹操}}五攻{{person:昌豨|昌霸}}不下，四越{{place:巣湖|巢湖}}不成，任用{{person:李服|李服}}而{{person:李服|李服}}圖之，委{{person:夏侯淵|夏侯}}而{{person:夏侯淵|夏侯}}敗亡，{{person:劉備|先帝}}每稱{{person:曹操|操}}為能，猶有此失，況臣駑下，何能必勝？此臣之未解四也。自臣到{{place:漢中|漢中}}，中間期年耳，然喪{{person:趙雲|趙雲}}、{{person:陽群|陽群}}、{{person:馬玉|馬玉}}、{{person:閻芝|閻芝}}、{{person:丁立|丁立}}、{{person:白寿|白壽}}、{{person:劉郃|劉郃}}、{{person:鄧銅|鄧銅}}等及曲長屯將七十餘人，突將無前。賨、叟、{{special:青羌|青羌}}散騎、武騎一千餘人，此皆數十年之內所糾合四方之精銳，非一州之所有，若復數年，則損三分之二也，當何以圖敵？此臣之未解五也。今民窮兵疲，而事不可息，事不可息，則住與行勞費正等，而不及今圖之，欲以一州之地與賊持久，此臣之未解六也。夫難平者，事也。昔{{person:劉備|先帝}}敗軍於{{place:荊州|楚}}，當此時，{{person:曹操|曹操}}拊手，謂天下以定。然後{{person:劉備|先帝}}東連吳、越，西取{{place:巴|巴}}、{{place:益州|蜀}}，舉兵北征，{{person:夏侯淵|夏侯}}授首，此{{person:曹操|操}}之失計而漢事將成也。然後吳更違盟，{{person:関羽|關羽}}毀敗，{{place:秭帰|秭歸}}蹉跌，{{person:曹丕|曹丕}}稱帝。凡事如是，難可逆見。臣鞠躬盡力，死而後已，至於成敗利鈍，非臣之明所能逆睹也。於是有{{place:散関|散關}}之役。此表，{{special:諸葛亮集|亮集}}所無，出{{person:張儼|張儼}}《{{special:黙記|默記}}》。", "kakikudashi_tagged": "『{{special:漢晉春秋|漢晋春秋}}』に曰く、或るひと{{person:諸葛亮|亮}}に更に兵を発せんことを勧むる者有るに、{{person:諸葛亮|亮}}曰く、「大軍の{{place:祁山_涼州|祁山}}・{{place:箕谷|箕谷}}に在りしは、皆な賊より多かりしに、而も賊を破る能わず、賊の破る所と為りし者は、則ち此の病は兵の少なきに在らざるなり、一人に在るのみ。今は兵を減じ将を省き、罰を明らかにし過ちを思い、変通の道を将来に校えんと欲す、若し然る能わざれば、兵多しと雖も何ぞ益せん！今より已後、諸もろの国に忠慮有るもの、但だ勤めて吾が闕を攻めなば、則ち事は定むべく、賊は死すべく、功は足を蹻げて待つべし」と。是に於いて微労を考し、烈壮を甄わし、咎を引きて躬を責め、失う所を天下に布き、兵を厲まし武を講じて、以て後図を為せば、戎士は簡練せられ、民は其の敗を忘れたり。{{person:諸葛亮|亮}}、{{person:孫権|孫権}}の{{person:曹休|曹休}}を破り、魏兵東下して、{{place:関中|関中}}虚弱なりと聞く。十一月、上言して曰く、{{person:劉備|先帝}}は漢・賊の両立せず、王業の偏安せざるを慮る、故に臣に託するに討賊を以てせり。{{person:劉備|先帝}}の明を以て、臣の才を量れば、故より臣が賊を伐つに才弱く敵強きを知るなり、然れども賊を伐たずんば、王業も亦た亡びん、惟だ坐して亡ぶるを待つは、之を伐つに孰与ぞや？是の故に臣に託して疑わざりしなり。臣、命を受くるの日より、寝ぬるに席を安んぜず、食うに味を甘しとせず、惟うに北征せんには、宜しく先ず南に入るべしと思い、故に五月{{place:瀘水|瀘}}を渡り、深く不毛に入り、日を並せて食せり。臣、自ら惜しまざるには非ざるなり、顧うに王業は{{place:成都|蜀都}}に偏全するを得ず、故に危難を冒して以て{{person:劉備|先帝}}の遺意を奉ずるなり、而るに議者は謂いて非計と為す。今、賊は適ま西に疲れ、又た東に務む、兵法は労に乗ずれば、此れ進趨の時なり。謹みて其の事を陳ぶること左の如し、{{person:劉邦|高帝}}は明日月に並び、謀臣は淵深なれども、然れども険を渉り創を被り、危うくして然る後に安かりき。今、{{person:劉禅|陛下}}は未だ{{person:劉邦|高帝}}に及ばず、謀臣は{{person:張良|良}}・{{person:陳平|平}}に如かざるに、而も長計を以て勝ちを取り、坐して天下を定めんと欲す、此れ臣の未だ解せざるの一なり。{{person:劉繇|劉繇}}・{{person:王朗|王朗}}は各おの州郡に拠り、安きを論じ計を言うに、動もすれば聖人を引き、群疑は腹に満ち、衆難は胸を塞ぎ、今歳は戦わず、明年は征せず、{{person:孫策|孫策}}をして坐ながらに大ならしめ、遂に{{place:江東|江東}}を并せしめたり、此れ臣の未だ解せざるの二なり。{{person:曹操|曹操}}は智計人に殊絶し、其の兵を用うるや、{{person:孫武|孫}}・{{person:呉起|呉}}に彷彿たれども、然れども{{place:南陽|南陽}}に困しみ、{{place:烏巣|烏巣}}に険しく、{{place:祁連|祁連}}に危うく、{{place:黎陽|黎陽}}に偪られ、幾ど{{place:北山|北山}}に敗れんとし、殆ど{{place:潼関|潼関}}に死せんとして、然る後に一時を偽定せしのみ、況んや臣は才弱きに、而も危うからざるを以て之を定めんと欲す、此れ臣の未だ解せざるの三なり。{{person:曹操|曹操}}は五たび{{person:昌豨|昌覇}}を攻めて下さず、四たび{{place:巣湖|巣湖}}を越えて成らず、{{person:李服|李服}}を任用して{{person:李服|李服}}之を図り、{{person:夏侯淵|夏侯}}に委ねて{{person:夏侯淵|夏侯}}敗亡せり、{{person:劉備|先帝}}は毎に{{person:曹操|操}}を称して能と為せしも、猶お此の失有り、況んや臣は駑下なるに、何ぞ能く必ず勝たんや？此れ臣の未だ解せざるの四なり。臣の{{place:漢中|漢中}}に到りてより、中間は期年なるのみ、然れども{{person:趙雲|趙雲}}・{{person:陽群|陽群}}・{{person:馬玉|馬玉}}・{{person:閻芝|閻芝}}・{{person:丁立|丁立}}・{{person:白寿|白寿}}・{{person:劉郃|劉郃}}・{{person:鄧銅|鄧銅}}等及び曲長・屯将七十余人、突将無前なるを喪えり。賨・叟・{{special:青羌|青羌}}の散騎・武騎一千余人も、此れ皆な数十年の内に糾合する所の四方の精鋭にして、一州の有する所に非ず、若し復た数年ならば、則ち三分の二を損ぜん、当に何を以て敵を図るべきや？此れ臣の未だ解せざるの五なり。今、民は窮し兵は疲るれども、而も事は息むべからず、事息むべからざれば、則ち住まると行くとは労費正に等しきに、而も今に及びて之を図らず、一州の地を以て賊と持久せんと欲す、此れ臣の未だ解せざるの六なり。夫れ平らげ難き者は、事なり。昔、{{person:劉備|先帝}}の軍を{{place:荊州|楚}}に敗るや、此の時に当たり、{{person:曹操|曹操}}は手を拊ち、天下以て定まれりと謂えり。然る後に{{person:劉備|先帝}}は東は呉・越に連なり、西のかた{{place:巴|巴}}・{{place:益州|蜀}}を取り、兵を挙げて北征し、{{person:夏侯淵|夏侯}}は首を授けたれば、此れ{{person:曹操|操}}の失計にして漢の事将に成らんとせしなり。然る後に呉は更に盟に違い、{{person:関羽|関羽}}は毀敗し、{{place:秭帰|秭帰}}に蹉跌して、{{person:曹丕|曹丕}}は帝を称せり。凡そ事は是くの如く、逆め見るべからず。臣は鞠躬尽力し、死して後已まんのみ、成敗利鈍に至りては、臣の明の能く逆め睹る所に非ざるなり、と。是に於いて{{place:散関|散関}}の役有り。此の表は、『{{special:諸葛亮集|亮集}}』に無き所にして、{{person:張儼|張儼}}の『{{special:黙記|黙記}}』に出づ。", "translation_tagged": "『{{special:漢晉春秋|漢晋春秋}}』にいう、ある人が{{person:諸葛亮|諸葛亮}}に改めて増兵を発するよう勧めたところ、{{person:諸葛亮|諸葛亮}}は言った、「{{place:祁山_涼州|祁山}}・{{place:箕谷|箕谷}}にあった我が大軍は、いずれも賊より多かったにもかかわらず、賊を打ち破ることができず、かえって賊に打ち破られたからには、この欠陥は兵が少ないことにあるのではなく、私一人にあるのだ。いまは兵を減らし将を省き、処罰を厳明にして過ちを反省し、臨機変通の方策を将来に向けて練り直したいと考えているが、もしそうすることができなければ、たとえ兵が多くとも何の役に立とうか！これより以後、国を思う忠誠の思慮ある諸氏が、ただひたすら私の欠点を厳しく批判してくれるならば、大業は平定でき、賊は滅ぼすことができ、成功は爪先立って待つほど速やかに訪れるであろう」と。こうしてわずかな労苦をも考査して報い、壮烈な勇士を表彰し、咎を引き受けて我が身を責め、おのれの失敗を天下に公表し、兵を鍛え武芸を調練して、再挙の計を図ったため、将兵は精選・練磨され、民はその敗戦を忘れたのであった。{{person:諸葛亮|諸葛亮}}は、{{person:孫権|孫権}}が{{person:曹休|曹休}}を打ち破り、魏の兵が東へ下って、{{place:関中|関中}}が手薄になっていると聞いた。十一月、上表して言った、{{person:劉備|先帝}}は漢と賊とが両立せず、王業が辺地に偏安すべきでないことを深く憂慮なさり、それゆえ臣に賊徒討伐の大任を託されたのであります。{{person:劉備|先帝}}の明察をもって臣の才能を量られたのですから、もとより臣が賊を討つにあたり臣の才は弱く敵は強大であることをご存じでありましたが、されど賊を討たなければ、王業もまた滅びるのであり、ただ手をこまねいて滅亡を待つよりは、これを討つ方がどれほど勝っていることでしょうか？それゆえ臣に託して少しも疑われなかったのであります。臣はご遺命を拝受した日より、眠るにも席に安んぜず、食べるにも味を旨いと感じず、北征を行うにはまず南方へ入るべきであると考え、それゆえ五月に{{place:瀘水|瀘水}}を渡り、深く不毛の地に分け入って、二日に一度の食事で耐え忍びました。臣とて我が身を惜しまないわけではありませんが、思うに王業は{{place:成都|蜀都}}の一隅だけで偏って全うし得るものではなく、それゆえ危難を冒して{{person:劉備|先帝}}のご遺志を奉じているのでありますのに、議論する者たちはこれを無謀な失計であると申しております。いま賊はちょうど西で疲弊し、さらに東での戦いに追われておりますが、兵法は敵の疲労に乗ずるを要としますから、いまこそ進撃すべき好機であります。謹んでその事由を以下の通り開陳いたします、{{person:劉邦|高帝}}は明智が日月に並び、謀臣たちの智略は淵のごとく深遠でありましたが、それでも険難を踏み越え傷を負い、危地をくぐり抜けてはじめて安泰を得られました。いま{{person:劉禅|陛下}}はいまだ{{person:劉邦|高帝}}に及ばれず、謀臣も{{person:張良|張良}}・{{person:陳平|陳平}}に及ばないにもかかわらず、長期の計をもって勝利を収め、座したまま天下を平定しようとしておられます、これが臣の理解できぬ一つ目であります。{{person:劉繇|劉繇}}・{{person:王朗|王朗}}はそれぞれ州郡に拠りながら、安泰を論じ計略を語るにあたって、ややもすれば聖人の言葉を引き合いに出し、数々の疑念が腹に満ち、多くの難癖が胸を塞いで、今年は戦わず、来年も出征せぬまま、{{person:孫策|孫策}}を居ながらにして強大化させ、ついには{{place:江東|江東}}を併呑させてしまいました、これが臣の理解できぬ二つ目であります。{{person:曹操|曹操}}は智謀計略が並外れて人に優れ、その用兵は{{person:孫武|孫武}}・{{person:呉起|呉起}}にも彷彿たるものがありましたが、それでも{{place:南陽|南陽}}で苦境に陥り、{{place:烏巣|烏巣}}で危険な目に遭い、{{place:祁連|祁連}}で危難に瀕し、{{place:黎陽|黎陽}}で窮迫し、{{place:北山|北山}}ではあわや敗れかけ、{{place:潼関|潼関}}ではあやうく死にかけて、その後にようやく一時的な偽りの平定を成し遂げたにすぎません、まして臣は才能が微弱でありますのに、危険を冒さずに天下を平定しようとなさいます、これが臣の理解できぬ三つ目であります。{{person:曹操|曹操}}は五たび{{person:昌豨|昌覇}}を攻めても落とせず、四たび{{place:巣湖|巣湖}}を越えても功を成せず、{{person:李服|李服}}を任用すれば{{person:李服|李服}}が彼を謀殺しようとし、{{person:夏侯淵|夏侯淵}}に委ねれば{{person:夏侯淵|夏侯淵}}は敗死いたしました、{{person:劉備|先帝}}はつねづね{{person:曹操|曹操}}を有能であると称えておられましたが、それでもなおこのような失敗があったのですから、まして駑馬のごとく劣った臣が、どうして必ず勝つことができましょうか？これが臣の理解できぬ四つ目であります。臣が{{place:漢中|漢中}}に到着いたしましてより、その間はわずか丸一年にすぎませんが、それでも{{person:趙雲|趙雲}}・{{person:陽群|陽群}}・{{person:馬玉|馬玉}}・{{person:閻芝|閻芝}}・{{person:丁立|丁立}}・{{person:白寿|白寿}}・{{person:劉郃|劉郃}}・{{person:鄧銅|鄧銅}}らおよび曲長・屯将七十余人という、向かうところ敵なしの突撃の勇将たちを失いました。さらに賨・叟・{{special:青羌|青羌}}の散騎・武騎一千余人も失いましたが、これらはみな数十年のうちに四方から糾合した精鋭であって、一州だけで擁し得る戦力ではありませんから、もしこのままさらに数年を経れば、その三分の二を損なうことになりましょうに、そうなればいったい何をもって敵を図るというのでしょうか？これが臣の理解できぬ五つ目であります。いま民は困窮し兵は疲弊しておりますが、しかも戦事はやめるわけにはいかず、戦事をやめられない以上、駐留して守るのも進軍して戦うのも労力と費用はまったく同等であるにもかかわらず、いまのうちにこれを図ろうとせず、わずか一州の土地をもって賊と持久戦を行おうとなさいます、これが臣の理解できぬ六つ目であります。そもそも見通し難いものは、世の事変であります。むかし{{person:劉備|先帝}}が{{place:荊州|楚}}において軍を敗られた際、この時にあたり、{{person:曹操|曹操}}は手を打って喜び、天下はすでに平定されたと考えました。しかるのち{{person:劉備|先帝}}は東は呉・越と結び、西は{{place:巴|巴}}・{{place:益州|蜀}}を奪取し、兵を挙げて北征なさり、{{person:夏侯淵|夏侯淵}}が首を授けるに至りましたが、これぞ{{person:曹操|曹操}}の誤算であり、漢の大業がまさに成ろうとした瞬間でありました。しかるのち呉がまたも盟約に背き、{{person:関羽|関羽}}は敗れ滅び、{{place:秭帰|秭帰}}でつまずきを喫して、{{person:曹丕|曹丕}}は帝号を僭称いたしました。およそ物事とはこのようなものであり、あらかじめ見通すことは困難であります。臣はただ身をかがめて力の限りを尽くし、死してのちはじめてやむのみであり、成敗や利鈍がどうなるかに至っては、臣の明察をもってあらかじめ見通せるところではありません、と。こうして{{place:散関|散関}}の戦いが行われたのである。この上表は、『{{special:諸葛亮集|亮集}}』には載っていないもので、{{person:張儼|張儼}}の『{{special:黙記|黙記}}』に出ている。"}, {"id": "v35_p14_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 14, "type": "本文", "raw_text": "冬，亮復出散關，圍陳倉，曹真拒之，亮糧盡而還。魏將軍王雙率騎追亮，亮與戰，破之，斬雙。七年，亮遣陳式攻武都、陰平。魏雍州刺史郭淮率眾欲擊式，亮自出至建威，淮退還，遂平二郡。詔策亮曰：「街亭之役，咎由馬謖，而君引愆，深自貶抑，重違君意，聽順所守。前年耀師，馘斬王雙；今歲爰征，郭淮遁走；降集氐、羌，興復二郡，威鎮凶暴，功勳顯然。方今天下騷擾，元惡未梟，君受大任，幹國之重，而久自挹損，非所以光揚洪烈矣。今復君丞相，君其勿辭。」", "kakikudashi": "冬、亮は復た散関に出で、陳倉を囲むも、曹真之を拒ぎ、亮は糧尽きて還る。魏の将軍・王双、騎を率いて亮を追うや、亮は与に戦いて之を破り、双を斬る。七年、亮は陳式を遣わして武都・陰平を攻めしむ。魏の雍州刺史・郭淮、衆を率いて式を撃たんと欲するや、亮は自ら出でて建威に至り、淮は退き還り、遂に二郡を平らぐ。詔して亮に策して曰く、「街亭の役は、咎は馬謖に由るに、君は愆を引きて、深く自ら貶抑したれば、君の意に違うを重かり、守る所に聴順せり。前年は師を耀かして、王双を馘斬し、今歳は爰に征して、郭淮は遁走し、氐・羌を降集し、二郡を興復し、威は凶暴を鎮め、功勲は顕然たり。方今、天下騒擾し、元悪未だ梟せられず、君は大任を受け、国の重きを幹するに、久しく自ら挹損するは、洪烈を光揚する所以に非ず。今、君を丞相に復す、君其れ辞する勿かれ」と。", "translation": "冬、諸葛亮は再び散関へ出兵し、陳倉を包囲したが、曹真がこれを防ぎ、諸葛亮は兵糧が尽きて帰還した。魏の将軍・王双が騎兵を率いて諸葛亮を追撃すると、諸葛亮はこれと戦って撃破し、王双を斬った。七年、諸葛亮は陳式を派遣して武都・陰平を攻撃させた。魏の雍州刺史・郭淮が兵衆を率いて陳式を迎撃しようとしたため、諸葛亮が自ら出陣して建威に至ると、郭淮は退却し、ついに二郡を平定した。詔を下して諸葛亮に策命して言った、「街亭の戦いは、その咎は馬謖にあったにもかかわらず、君が過失を引き受けて、深く自ら身を貶めたため、君の意に背くのを憚り、その固い志に任せて従ったのであった。前年は軍威を輝かせて、王双の首を討ち取り、今年はここに出征して、郭淮は遁走し、氐・羌を降伏・帰服させ、二郡を回復して、武威は凶暴なる賊を鎮圧し、その功勲はまことに顕著である。いまや天下は騒然と乱れ、元凶はいまだ梟首されておらず、君は大任を受けて、国家の重責を担う身であるのに、久しく自ら謙抑して地位を下げたままにしているのは、大いなる功業を発揚するゆえんではない。いま君を丞相に復職させるから、君よどうか辞退してはならない」と。", "persons": "諸葛亮, 曹真, 王双, 陳式, 郭淮, 馬謖", "places": "散関, 陳倉, 武都, 陰平, 雍州, 建威, 街亭", "era_year": "建興6年（228）冬〜7年（229）春", "source_book": "", "keywords": "刺史, 丞相", "raw_tagged": "冬，{{person:諸葛亮|亮}}復出{{place:散関|散關}}，圍{{place:陳倉|陳倉}}，{{person:曹真|曹真}}拒之，{{person:諸葛亮|亮}}糧盡而還。魏將軍{{person:王双|王雙}}率騎追{{person:諸葛亮|亮}}，{{person:諸葛亮|亮}}與戰，破之，斬{{person:王双|雙}}。七年，{{person:諸葛亮|亮}}遣{{person:陳式|陳式}}攻{{place:武都|武都}}、{{place:陰平|陰平}}。魏{{place:雍州|雍州}}{{office:刺史|刺史}}{{person:郭淮|郭淮}}率眾欲擊{{person:陳式|式}}，{{person:諸葛亮|亮}}自出至{{place:建威|建威}}，{{person:郭淮|淮}}退還，遂平二郡。詔策{{person:諸葛亮|亮}}曰：「{{place:街亭|街亭}}之役，咎由{{person:馬謖|馬謖}}，而君引愆，深自貶抑，重違君意，聽順所守。前年耀師，馘斬{{person:王双|王雙}}；今歲爰征，{{person:郭淮|郭淮}}遁走；降集氐、羌，興復二郡，威鎮凶暴，功勳顯然。方今天下騷擾，元惡未梟，君受大任，幹國之重，而久自挹損，非所以光揚洪烈矣。今復君{{office:丞相|丞相}}，君其勿辭。」", "kakikudashi_tagged": "冬、{{person:諸葛亮|亮}}は復た{{place:散関|散関}}に出で、{{place:陳倉|陳倉}}を囲むも、{{person:曹真|曹真}}之を拒ぎ、{{person:諸葛亮|亮}}は糧尽きて還る。魏の将軍・{{person:王双|王双}}、騎を率いて{{person:諸葛亮|亮}}を追うや、{{person:諸葛亮|亮}}は与に戦いて之を破り、{{person:王双|双}}を斬る。七年、{{person:諸葛亮|亮}}は{{person:陳式|陳式}}を遣わして{{place:武都|武都}}・{{place:陰平|陰平}}を攻めしむ。魏の{{place:雍州|雍州}}{{ 兵を移して東に戍し、之と力を角べ、其の土を并するを須ちて、乃ち中原を議せざるべからず。彼には賢才尚お多く、将相は緝穆したれば、未だ一朝にして定むべからざるなり。兵を頓めて相い持し、坐して老ゆるを須ち、北賊をして計を得しむるは、算の上なる者に非ず。昔、孝文の匈奴に辞を卑しくし、先帝の優に呉と盟いしは、皆な応権通変し、弘く遠益を思えばにして、匹夫の為す所の者に非ざるなり。今、議者は咸な権は利の鼎足に在りて、力を並する能わず、且つ志望は以に満ち、岸に上るの情無しと以えども、此を推すに、皆な是に似て非なるなり。何となれば、其の智力侔しからず、故に江を限りて自ら保つのみ、権の江を越ゆる能わざるは、猶お魏賊の漢を渡る能わざるがごとく、力に余り有りて利を取らざるには非ざるなり。若し大軍討を致さば、彼は高きは当に其の地を分裂して以て後規を為すべく、下きは当に民を略し境を広めて、武を内に示すべく、端坐する者に非ざるなり。若し就い其れ動かずして我に睦まじくんば、我が北伐するに、東顧の憂い無く、河南の衆も尽く西するを得ざれば、此の利為るや、亦た已に深し。権が僭の罪は、未だ宜しく明らかにすべからざるなり」と。乃ち衛尉の陳震を遣わして権の正号を慶せしむ。", "translation": "『漢晋春秋』にいう、この年、孫権が帝号を称し、その群臣たちが二帝を並び尊ぶ旨を伝えてきた。議論する者たちはみな、彼と交誼を結んでも益がなく、しかも大義名分の体裁にも悖るから、正義を明らかに掲げて、その同盟のよしみと断絶すべきであると考えた。諸葛亮は言った、「孫権に僭称・反逆の野心があったのは久しい昔からのことであり、我が国がその不遜な実情をあえて不問に付してきた理由は、掎角の援けを求めてのことである。いまもし公然と断絶を通告すれば、必ずや我々を深く敵視するようになり、ただちに兵を移して東方を守備し、彼と力を競い合って、その領土を併合するのを待ってからでなければ、中原の平定を議することもできなくなる。かの国には賢才がいまだ数多くおり、将軍・宰相たちも和睦しているから、一朝一夕に平定できる相手ではない。兵を釘づけにして対峙し、座したまま軍勢が老い疲れるのを待ち、北方の賊に思う壺の利を得させるのは、上策とはいえない。むかし孝文が匈奴に対して言葉をへりくだり、先帝が礼を厚くして呉と同盟を結ばれたのは、いずれも臨機応変に対処して、広く遠大な利益を慮られたからであり、狭量な匹夫のなすところではないのである。いま議論する者たちはみな、孫権は鼎立にこそ利益があるから力を合わせることができず、しかも帝号の望みはすでに満たされて、北岸へ乗り出す気などないと考えているが、これを推し量ってみるに、みなもっともらしいようで実は誤りである。なぜかといえば、彼の智略と戦力が敵と対等でないため、長江を境として自らを保っているだけなのであり、孫権が長江を越えられないのは、ちょうど魏賊が漢水を渡れないのと同じであって、力に余裕がありながら利益を取らないわけではないからである。もし我が大軍が討伐に踏み出せば、彼は上首尾ならば敵地を分割占領して将来の足がかりとするであろうし、少なくとも敵の民を奪い国境を広げて、武威を国内に誇示しようとするはずであり、じっと座視しているような者ではない。たとい彼が兵を動かさずとも我々と和睦していれば、我々が北伐を行うにあたり、東方を顧みる憂いがなく、河南の敵軍もことごとく西へ向かうことはできないのであるから、これによる利益もまた、すでに甚だ大きいのである。孫権の僭称の罪は、いま公然と問いただすべきではない」と。そこで衛尉の陳震を派遣して孫権の即位を慶賀させた。", "persons": "孫権, 諸葛亮, 孝文帝, 劉備, 陳震", "places": "中原, 長江, 漢水, 河南", "era_year": "建興7年（229）夏", "source_book": "『漢晋春秋』", "keywords": "漢晉春秋, 掎角, 匈奴, 衛尉", "raw_tagged": "《{{special:漢晉春秋|漢晉春秋}}》曰：是歲，{{person:孫権|孫權}}稱尊號，其群臣以並尊二帝來告。議者咸以為交之無益，而名體弗順，宜顯明正義，絕其盟好。{{person:諸葛亮|亮}}曰：「{{person:孫権|權}}有僭逆之心久矣，國家所以略其釁情者，求{{special:掎角|掎角}}之援也。今若加顯絕，讎我必深，便當移兵東戍，與之角力，須並其土，乃議{{place:中原|中原}}。彼賢才尚多，將相緝穆，未可一朝定也。頓兵相持，坐而須老，使北賊得計，非算之上者。昔{{person:孝文帝|孝文}}卑辭{{special:匈奴|匈奴}}，{{person:劉備|先帝}}優與 。郃は兵を分かちて雍・郿に駐せんと欲するに、宣王曰く、「前軍の能く独り之に当たるを料らば、将軍の言は是なり、若し当たる能わずして分かちて前後と為さば、此れ楚の三軍の黥布に禽とせられし所以なり」と。遂に進む。亮は兵を分かちて留め攻めしめ、自ら宣王を上邽に逆う。郭淮・費曜等、亮を徼うるも、亮は之を破り、因りて大いに其の麦を芟刈し、宣王と上邽の東に遇うも、兵を斂めて険に依れば、軍交わるを得ず、亮は引きて還る。宣王、亮を尋ねて鹵城に至る。張郃曰く、「彼は遠来して我を逆え、戦いを請えども得ざれば、我が利は戦わざるに在りと謂い、長計を以て之を制せんと欲するなり。且つ祁山は大軍の以に近きに在るを知れば、人情自ら固し、此に止まり屯し、分かちて奇兵と為し、其の後に出づるを示すべく、宜しく前に進みて敢えて偪らず、坐ながらに民望を失うべからざるなり。今、亮は県軍にして食少なければ、亦た行くゆく去らん」と。宣王従わず、故に亮を尋ぬ。既に至るや、又た山に登りて営を掘り、戦うを肯んぜず。賈栩・魏平、数しば戦いを請い、因りて曰く、「公は蜀を畏るること虎の如し、天下の笑いを奈何せん！」と。宣王之を病む。諸将咸な戦いを請う。五月辛巳、乃ち張郃をして無当監の何平を南囲に攻めしめ、自ら中道を案じて亮に向かう。亮は魏延・高翔・呉班をして赴き拒がしめ、大いに之を破り、甲首三千級、玄鎧五千領、角弩三千一百張を獲れば、宣王は還りて営を保つ、と。", "translation": "『漢晋春秋』にいう、諸葛亮は祁山を包囲し、鮮卑の軻比能を招き寄せると、軻比能らは旧北地郡の石城まで至って諸葛亮に呼応した。ここにおいて魏の大司馬・曹真が病に伏し、司馬宣王が荊州から入朝すると、魏の明帝は「西方の軍事は重大であり、君でなければ託せる者はいない」と言った。そこで西方の長安に駐屯させ、張郃・費曜・戴陵・郭淮らを統督させた。司馬宣王は費曜・戴陵に精兵四千を留めて上邽を守らせ、残る全軍はことごとく出撃して、西方の祁山を救援に向かった。張郃が兵を分けて雍県・郿県に駐屯させようとすると、司馬宣王は言った、「前軍が単独で敵に当たり得ると見込めるならば、将軍の言葉はもっともである、しかしもし当たり得ないのに前後に兵を分けてしまえば、これぞ楚の三軍が黥布に生け捕りにされた原因である」と。こうして進軍した。諸葛亮は兵を分けて攻囲に留め、自らは司馬宣王を上邽に迎え撃った。郭淮・費曜らが諸葛亮を待ち伏せて遮ったが、諸葛亮はこれを打ち破り、その機に乗じて敵の麦を大いに刈り取り、司馬宣王と上邽の東で遭遇したが、兵を収めて険阻に拠ったため、両軍は交戦するに至らず、諸葛亮は軍を引いて帰還した。司馬宣王は諸葛亮の後を追って鹵城に至った。張郃は言った、「敵は遠方からやって来て我々を迎え撃ち、決戦を求めても叶わなかったため、我が軍の利は戦わぬことにあるとみなし、長期の計略で我々を制しようと図っているのです。しかも祁山の守兵は大軍がすでに近くまで来ていると知って、人心はおのずと固まっておりますから、ここに留まり駐屯し、兵を分けて奇兵とし、敵の背後へ出る姿勢を示すべきであり、前方へ進みながらあえて肉薄もせず、居ながらにして民の信望を失うようなことをすべきではありません。いま諸葛亮は孤立深入した軍で食糧も乏しいのですから、まもなく立ち去るでありましょう」と。司馬宣王はこれに従わず、なおも諸葛亮の後を追った。到着すると、また山に登って陣営の塹壕を掘り、戦おうとしなかった。賈栩・魏平がたびたび出戦を請い、そこで言った、「公は蜀を恐れること虎のごとくですが、天下の物笑いをどうなさいますか！」と。司馬宣王はこれを気に病んだ。諸将もみな出戦を請うた。五月辛巳、そこで張郃に命じて無当監の何平を南の包囲陣に攻めさせ、自らは中道を押さえて諸葛亮へ向かった。諸葛亮が魏延・高翔・呉班を遣わして赴き防がせると、これを大いに打ち破り、甲士の首級三千級、黒塗りの鎧五千領、角飾りの弩三千一百張を鹵獲し、司馬宣王は引き返して陣営を保った、と。", "persons": "諸葛亮, 軻比能, 曹真, 司馬懿, 曹叡, 張郃, 費曜, 戴陵, 郭淮, 英布, 賈栩, 魏平, 王平, 魏延, 高翔, 呉班", "places": "祁山_涼州, 北地, 石城_北地, 荊州, 長安, 上邽, 雍県, 郿, 鹵城", "era_year": "建興9年（231）春〜5月", "source_book": "『漢晋春秋』", "keywords": "漢晉春秋, 鮮卑, 大司馬, 三軍, 無当監", "raw_tagged": "《{{special:漢晉春秋|漢晉春秋}}》曰：{{person:諸葛亮|亮}}圍{{place:祁山_涼州|祁山}}，招{{speci に拠ったため、両軍は交戦するに至らず、{{person:諸葛亮|諸葛亮}}は軍を引いて帰還した。{{person:司馬懿|司馬宣王}}は{{person:諸葛亮|諸葛亮}}の後を追って{{place:鹵城|鹵城}}に至った。{{person:張郃|張郃}}は言った、「敵は遠方からやって来て我々を迎え撃ち、決戦を求めても叶わなかったため、我が軍の利は戦わぬことにあるとみなし、長期の計略で我々を制しようと図っているのです。しかも{{place:祁山_涼州|祁山}}の守兵は大軍がすでに近くまで来ていると知って、人心はおのずと固まっておりますから、ここに留まり駐屯し、兵を分けて奇兵とし、敵の背後へ出る姿勢を示すべきであり、前方へ進みながらあえて肉薄もせず、居ながらにして民の信望を失うようなことをすべきではありません。いま{{person:諸葛亮|諸葛亮}}は孤立深入した軍で食糧も乏しいのですから、まもなく立ち去るでありましょう」と。{{person:司馬懿|司馬宣王}}はこれに従わず、なおも{{person:諸葛亮|諸葛亮}}の後を追った。到着すると、また山に登って陣営の塹壕を掘り、戦おうとしなかった。{{person:賈栩|賈栩}}・{{person:魏平|魏平}}がたびたび出戦を請い、そこで言った、「公は蜀を恐れること虎のごとくですが、天下の物笑いをどうなさいますか！」と。{{person:司馬懿|司馬宣王}}はこれを気に病んだ。諸将もみな出戦を請うた。五月辛巳、そこで{{person:張郃|張郃}}に命じて{{office:無当監|無当監}}の{{person:王平|何平}}を南の包囲陣に攻めさせ、自らは中道を押さえて{{person:諸葛亮|諸葛亮}}へ向かった。{{person:諸葛亮|諸葛亮}}が{{person:魏延|魏延}}・{{person:高翔|高翔}}・{{person:呉班|呉班}}を遣わして赴き防がせると、これを大いに打ち破り、甲士の首級三千級、黒塗りの鎧五千領、角飾りの弩三千一百張を鹵獲し、{{person:司馬懿|司馬宣王}}は引き返して陣営を保った、と。"}, {"id": "v35_p15_3", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 15, "type": "本文", "raw_text": "糧盡退軍，與魏將張郃交戰，射殺郃。", "kakikudashi": "糧尽きて軍を退け、魏の将・張郃と交戦し、郃を射殺す。", "translation": "兵糧が尽きて軍を退け、魏の将・張郃と交戦して、張郃を射殺した。", "persons": "張郃", "places": "", "era_year": "建興9年（231）6月", "source_book": "", "keywords": "", "raw_tagged": "糧盡退軍，與魏將{{person:張郃|張郃}}交戰，射殺{{person:張郃|郃}}。", "kakikudashi_tagged": "糧尽きて軍を退け、魏の将・{{person:張郃|張郃}}と交戦し、{{person:張郃|郃}}を射殺す。", "translation_tagged": "兵糧が尽きて軍を退け、魏の将・{{person:張郃|張郃}}と交戦して、{{person:張郃|張郃}}を射殺した。"}, {"id": "v35_p15_4", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 15, "type": "裴注", "raw_text": "郭沖《五事》曰：魏明帝自征蜀，幸長安，遣宣王督張郃諸軍，雍、涼勁卒三十餘萬，潛軍密進，規向劍閣。亮時在祁山，旌旗利器，守在險要，十二更下，在者八萬。時魏軍始陳，幡兵適交，參佐咸以賊眾強盛，非力不制，宜權停下兵一月，以並聲勢。亮曰：「吾統武行師，以大信為本，得原失信，古人所惜；去者束裝以待期，妻子鶴望而計日，雖臨征難，義所不廢。」皆催遣令去。於是去者感悅，願留一戰，住者憤踴，思致死命。相謂曰：「諸葛公之恩，死猶不報也。」臨戰之日，莫不拔刃爭先，以一當十，殺張郃，卻宣王，一戰大剋，此信之由也。◇難曰：臣松之案：亮前出祁山，魏明帝身至長安耳，此年不復自來。且亮大軍在關、隴，魏人何由得越亮徑向劍閣？亮既在戰場，本無久住之規，而方休兵還蜀，皆非經通之言。孫盛、習鑿齒搜求異同，罔有所遺，而並不載沖言，知其乖剌多矣。", "kakikudashi": "郭沖の『五事』に曰く、魏の明帝、自ら蜀を征せんとし、長安に幸し、宣王を遣わして張郃の諸軍、雍・涼の勁卒三十余万を督せしめ、軍を潜めて密かに進み、剣閣に向かわんことを規る。亮は時に祁山に在り、旌旗・利器もて、守ること険要に在り、十二にて更ごも下り、在る者は八万なり。時に魏軍始めて陳し、幡兵適たま交わるに、参佐は咸な賊衆強盛にして、力に非ざれば制せざれば、宜しく権りに下兵を停むること一月にして、以て声勢を並すべしと以う。亮曰く、「吾は武を統べ師を行うに、大信を以て本と為す、原を得て信を失うは、古人の惜しむ所なり、去る者は装を束ねて以て期を待ち、妻子は鶴望して日を計うれば、征難に臨むと雖も、義の廃せざる所なり」と。皆な催し遣りて去らしむ。是に於いて去る者は感悦し、留まりて一戦せんことを願い、住まる者は憤踴し、死命を致さんことを思う。相い謂いて曰く、「諸葛公の恩、死すとも猶お報いざるなり」と。戦いに臨むの日、刃を抜きて先を争い、一を以て十に当たらざるは莫く、張郃を殺し、宣王を卻け、一戦して大いに剋ちしは、此れ信の由なり、と。◇難じて曰く、臣松之案ずるに、亮の前に祁山に出でしときは、魏の明帝、身ら長安に至りしのみ、此の年は復た自ら来たらず。且つ亮の大軍は関・隴に在るに、魏人は何に由りて亮を越えて径ちに剣閣に向かうを得んや？亮は既に戦場に在り、本と久住の規無きに、而も方に兵を休めて蜀に還すとは、皆な経通の言に非ず。孫盛・習鑿歯は異同を捜求し、遺す所有る罔きに、而も並びに沖の言を載せざれば、其の乖剌多きを知るなり。", "translation": "郭沖の『五事』にいう、魏の明帝は自ら蜀を征伐しようとして、長安に行幸し、司馬宣王を派遣して張郃の諸軍、雍州・涼州の精鋭三十余万を統督させ、軍を潜めてひそかに進撃し、剣閣へ向かおうと企図した。諸葛亮は当時祁山にあり、軍旗と鋭利な兵器を整えて、険阻な要害を守り、兵の十のうち二割が交代で帰休することになっていたため、陣中に残る者は八万であった。このとき魏軍が布陣を始め、前哨の兵がちょうど交錯したおりであったため、幕僚たちはみな、賊軍は強盛であって、兵力によらなければ制圧できないから、ひとまず帰休する兵を一か月引き留めて、威勢を合わせるべきであると考えた。諸葛亮は言った、「私が武を統べ軍を動かすにあたっては、大いなる信義を根本としている、原の邑を得ても信義を失うことは、古人が惜しみ戒めたところである、帰還する者は旅装を整えて期日を待ち、妻子も首を長くして日を指折り数えているのであるから、たとい征戦の危難に臨んでいようとも、信義は廃してはならぬものである」と。こうして全員を促して出発させ帰郷させた。すると帰還する者は感激して喜び、陣に留まって一戦したいと願い出、残留する者も奮い立って勇躍し、命を投げ出して戦おうと心に決めた。互いに語り合って、「諸葛公のご恩には、たとえ死んでも報い切れない」と言った。決戦に臨む日になると、刃を抜いて先陣を争い、一騎当千の働きをせぬ者はなく、張郃を討ち取り、司馬宣王を退却させ、一戦して大勝を収めたが、これこそ信義によるものである、と。◇反駁していう、臣松之が考えるに、諸葛亮がさきに祁山へ出兵した際には、魏の明帝自身が長安まで赴いたが、この年には再び親征して来てはいない。しかも諸葛亮の大軍が関中・隴右にいるというのに、魏軍はどうやって諸葛亮を飛び越えて直接剣閣へ向かうことなどできようか？諸葛亮はすでに戦場に出ており、もともと長期駐留の計画などなかったのに、ちょうどその戦場で兵を休ませて蜀へ帰還させるなどというのは、いずれも道理の通った言葉ではない。孫盛や習鑿歯は諸記録の異同を隈なく捜し求め、見落とすところがなかったにもかかわらず、そろって郭沖の言葉を載せていないのであるから、その記述に事実との食い違いや誤りが多いことがわかるのである。", "persons": "郭沖, 曹叡, 司馬懿, 張郃, 諸葛亮, 裴松之, 孫盛, 習鑿歯", "places": "益州, 長安, 雍州, 涼州, 剣閣, 祁山_涼州, 関中, 隴右", "era_year": "建興9年（231）夏", "source_book": "『蜀記』・『郭沖五事』", "keywords": "郭沖五事", "raw_tagged": "{{person:郭沖|郭沖}}《{{special:郭沖五事|五事}}》曰：{{person:曹叡|魏明帝}}自征{{place:益州|蜀}}，幸{{place:長安|長安}}，遣{{person:司馬懿|宣王}}督{{person:張郃|張郃}}諸軍，{{place:雍州|雍}}、{{place:涼州|涼}}勁卒三十餘萬，潛軍密進，規向{{place:剣閣|劍閣}}。{{person:諸葛亮|亮}}時在{{place:祁山_涼州|祁山} 。耕者雜於{{place:渭浜|渭濱}}居民之間，而百姓安堵，軍無私焉。", "kakikudashi_tagged": "十二年春、{{person:諸葛亮|亮}}は大衆を悉くして{{place:斜谷|斜谷}}より出で、{{special:木牛流馬|流馬}}を以て運び、{{place:武功|武功}}の{{place:五丈原|五丈原}}に拠り、{{person:司馬懿|司馬宣王}}と{{place:渭南|渭南}}に対す。{{person:諸葛亮|亮}}、毎に糧の継がずして、己が志をして申びざらしむるを患え、是を以て兵を分かちて{{special:屯田|屯田}}し、久駐の基と為す。耕す者は{{place:渭浜|渭浜}}の居民の間に雑われども、百姓は安堵し、軍に私無し。", "translation_tagged": "十二年春、{{person:諸葛亮|諸葛亮}}は全軍を挙げて{{place:斜谷|斜谷}}より出撃し、{{special:木牛流馬|流馬}}を用いて輸送を行い、{{place:武功|武功}}の{{place:五丈原|五丈原}}に布陣して、{{person:司馬懿|司馬宣王}}と{{place:渭南|渭南}}で対峙した。{{person:諸葛亮|諸葛亮}}はつねづね兵糧が続かないために、おのれの志を伸ばせないことを憂慮しており、それゆえ兵を分けて{{special:屯田|屯田}}を行い、長期駐留の基盤とした。耕作する兵士たちは{{place:渭浜|渭浜}}の住民たちの間に入り混じっていたが、民衆は安堵して生業に励み、軍には少しの私曲もなかった。"}, {"id": "v35_p16_2", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 16, "type": "裴注", "raw_text": "《漢晉春秋》曰：亮自至，數挑戰。宣王亦表固請戰。使衛尉辛毗持節以制之。姜維謂亮曰：「辛佐治仗節而到，賊不復出矣。」亮曰：「彼本無戰情，所以固請戰者，以示武於其眾耳。將在軍，君命有所不受，苟能制吾，豈千里而請戰邪！」《魏氏春秋》曰：亮使至，問其寢食及其事之煩簡，不問戎事。使對曰：「諸葛公夙興夜寐，罰二十以上，皆親攬焉；所啖食不至數升。」宣王曰：「亮將死矣。」", "kakikudashi": "『漢晋春秋』に曰く、亮、至りてより、数しば戦いを挑む。宣王も亦た表して固く戦いを請う。衛尉の辛毗をして節を持して以て之を制せしむ。姜維、亮に謂いて曰く、「辛佐治、節を仗きて到れば、賊は復た出でじ」と。亮曰く、「彼は本より戦情無し、固く戦いを請う所以の者は、以て武を其の衆に示すのみ。将の軍に在るや、君命も受けざる所有り、苟くも能く吾を制せば、豈に千里にして戦いを請わんや！」と。『魏氏春秋』に曰く、亮の使い至るや、其の寝食及び其の事の煩簡を問い、戎事を問わず。使い対えて曰く、「諸葛公は夙に興き夜に寐ね、罰二十以上は、皆な親ら攬る、啖食する所は数升に至らず」と。宣王曰く、「亮は将に死せんとす」と。", "translation": "『漢晋春秋』にいう、諸葛亮は到着して以来、たびたび戦いを挑んだ。司馬宣王もまた上表してしきりに交戦を請うた。そこで衛尉の辛毗に節を持たせてこれを制止させた。姜維が諸葛亮に語って言った、「辛佐治が節を携えて到着しましたからには、賊はもはや出て来ないでしょう」と。諸葛亮は言った、「彼はもともと戦う気などなく、しきりに交戦を請うている理由は、配下の兵衆に武威を示したいだけにすぎない。将軍が戦陣にあるときは、君命であっても受けぬことがあるというのに、もし本当に私を制圧できるのであれば、どうして千里の彼方へ交戦を請うたりしようか！」と。『魏氏春秋』にいう、諸葛亮の使者が至ると、その寝食や政務の繁閑について尋ね、軍事については一切尋ねなかった。使者は答えて言った、「諸葛公は朝早く起き夜遅く休まれ、杖罰二十以上の処罰は、すべて親しく決裁しておられますが、召し上がる食事は数升にも満たないほどです」と。司馬宣王は「諸葛亮はまもなく死ぬであろう」と言った、と。", "persons": "諸葛亮, 司馬懿, 辛毗, 姜維", "places": "", "era_year": "建興12年（234）夏", "source_book": "『漢晋春秋』・『魏氏春秋』", "keywords": "漢晉春秋, 衛尉, 魏氏春秋", "raw_tagged": "《{{special:漢晉春秋|漢晉春秋}}》曰：{{person:諸葛亮|亮}}自至，數挑戰。{{person:司馬懿|宣王}}亦表固請戰。使{{office:衛尉|衛尉}}{{person:辛毗|辛毗}}持節以制之。{{person:姜維|姜維}}謂{{person:諸葛亮|亮}}曰：「{{person:辛毗|辛佐治}}仗節而到，賊不復出矣。」{{person:諸葛亮|亮}}曰：「彼本無戰情，所以固請戰者，以示武於其眾耳。將在軍，君命有所不受，苟能制吾，豈千里而請戰邪！」《{{special:魏氏春秋|魏氏春秋}}》曰：{{person:諸葛亮|亮}}使至，問其寢食及其事之煩簡，不問戎事。使對曰：「{{person:諸葛亮|諸葛公}}夙興夜寐，罰二十以上，皆親攬焉；所啖食不至數升。」{{person:司馬懿|宣王}}曰：「{{person:諸葛亮|亮}}將死矣。」", "kakikudashi_tagged": "『{{special:漢晉春秋|漢晋春秋}}』に曰く、{{person:諸葛亮|亮}}、至りてより、数しば戦いを挑む。{{person:司馬懿|宣王}}も亦た表して固く戦いを請う。{{office:衛尉|衛尉}}の{{person:辛毗|辛毗}}をして節を持して以て之を制せしむ。{{person:姜維|姜維}}、{{person:諸葛亮|亮}}に謂いて曰く、「{{person:辛毗|辛佐治}}、節を仗きて到れば、賊は復た出でじ」と。{{person:諸葛亮|亮}}曰く、「彼は本より戦情無し、固く戦いを請う所以の者は、以て武を其の衆に示すのみ。将の軍に在るや、君命も受けざる所有り、苟くも能く吾を制せば、豈に千里にして戦いを請わんや！」と。『{{special:魏氏春秋|魏氏春秋}}』に曰く、{{person:諸葛亮|亮}}の使い至るや、其の寝食及び其の事の煩簡を問い、戎事を問わず。使い対えて曰く、「{{person:諸葛亮|諸葛公}}は夙に興き夜に寐ね、罰二十以上は、皆な親ら攬る、啖食する所は数升に至らず」と。{{person:司馬懿|宣王}}曰く、「{{person:諸葛亮|亮}}は将に死せんとす」と。", "translation_tagged": "『{{special:漢晉春秋|漢晋春秋}}』にいう、{{person:諸葛亮|諸葛亮}}は到着して以来、たびたび戦いを挑んだ。{{person:司馬懿|司馬宣王}}もまた上表してしきりに交戦を請うた。そこで{{office:衛尉|衛尉}}の{{person:辛毗|辛毗}}に節を持たせてこれを制止させた。{{person:姜維|姜維}}が{{person:諸葛亮|諸葛亮}}に語って言った、「{{person:辛毗|辛佐治}}が節を携えて到着しましたからには、賊はもはや出て来ないでしょう」と。{{person:諸葛亮|諸葛亮}}は言った、「彼はもともと戦う気などなく、しきりに交戦を請うている理由は、配下の兵衆に武威を示したいだけにすぎない。将軍が戦陣にあるときは、君命であっても受けぬことがあるというのに、もし本当に私を制圧できるのであれば、どうして千里の彼方へ交戦を請うたりしようか！」と。『{{special:魏氏春秋|魏氏春秋}}』にいう、{{person:諸葛亮|諸葛亮}}の使者が至ると、その寝食や政務の繁閑について尋ね、軍事については一切尋ねなかった。使者は答えて言った、「{{person:諸葛亮|諸葛公}}は朝早く起き夜遅く休まれ、杖罰二十以上の処罰は、すべて親しく決裁しておられますが、召し上がる食事は数升にも満たないほどです」と。{{person:司馬懿|司馬宣王}}は「{{person:諸葛亮|諸葛亮}}はまもなく死ぬであろう」と言った、と。"}, {"id": "v35_p16_3", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 16, "type": "本文", "raw_text": "相持百餘日。其年八月，亮疾病，卒于軍，時年五十四。", "kakikudashi": "相い持すること百余日なり。其の年八月、亮は疾病し、軍に卒す、時に年五十四なり。", "translation": "対峙すること百余日に及んだ。その年の八月、諸葛亮は病が重くなり、陣中において没した、享年五十四であった。", "persons": "諸葛亮", "places": "", "era_year": "建興12年（234）8月", "source_book": "", "keywords": "", "raw_tagged": "相持百餘日。其年八月，{{person:諸葛亮|亮}}疾病，卒于軍，時年五十四。", "kakikudashi_tagged": "相い持すること百余日なり。其の年八月、{{person:諸葛亮|亮}}は疾病し、軍に卒す、時に年五十四なり。", "translation_tagged": "対峙すること百余日に及んだ。その年の八月、{{person:諸葛亮|諸葛亮}}は病が重くなり、陣中において没した、享年五十四であった。"}, {"id": "v35_p16_4", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 16, "type": "裴注", "raw_text": "《魏書》曰：亮糧盡勢窮，憂恚歐血，一夕燒營遁走，入谷，道發病卒。漢晉春秋曰：亮卒于郭氏塢。《晉陽秋》曰：有星赤而芒角，自東北西南流，投于亮營，三投再還，往大還小。俄而亮卒。臣松之以為亮在渭濱，魏人躡跡，勝負之形，未可測量，而云歐血，蓋因亮自亡而自誇大也。夫以孔明之略，豈為仲達歐血乎？及至劉琨喪師，與晉元帝箋亦云「亮軍敗歐血」，此則引虛記以為言也。其云入谷而卒，緣蜀人入谷發喪故也。", "kakikudashi": "『魏書』に曰く、亮は糧尽き勢い窮まり、憂恚して血を欧き、一夕に営を焼きて遁走し、谷に入り、道に病を発して卒す、と。『漢晋春秋』に曰く、亮は郭氏塢に卒す、と。『晋陽秋』に曰く、星有り、赤くして芒角あり、東北より西南に流れ、亮の営に投じ、三たび投じて再び還り、往くときは大きく還るときは小なり。俄かにして亮卒す、と。臣松之以為えらく、亮は渭浜に在り、魏人は跡を躡むも、勝負の形は、未だ測量すべからざるに、而も血を欧くと云うは、蓋し亮の自ら亡せしに因りて自ら誇大せしなり。夫れ孔明の略を以てして、豈に仲達の為に血を欧かんや？劉琨の師を喪うに至るに及び、晋の元帝に与うる箋にも亦た「亮は軍敗れて血を欧く」と云えるは、此れ則ち虚記を引きて以て言を為せしなり。其の谷に入りて卒すと云うは、蜀人が谷に入りて喪を発せしに縁るが故なり。", "translation": "『魏書』にいう、諸葛亮は兵糧が尽き勢いも窮まって、憂い憤って血を吐き、ある夜に陣営を焼き払って逃走し、谷へ入ったが、その途上で発病して死去した、と。『漢晋春秋』にいう、諸葛亮は郭氏塢で没した、と。『晋陽秋』にいう、赤く鋭い光芒を放つ星が現れ、北東から南西へと流れて、諸葛亮の陣営に落ち、三たび落ちて二たび跳ね返り、向かうときは大きく返るときは小さかった。まもなく諸葛亮は没した、と。臣松之が思うに、諸葛亮が渭浜にあったとき、魏軍はその背後を追っていたとはいえ、勝負の形勢はいまだ測り知れなかったのであるから、血を吐いたというのは、思うに諸葛亮が病没したことに乗じて勝手に誇張したものにすぎない。そもそも孔明ほどの智略をもってして、どうして仲達ごときのために血を吐いたりしようか？のちに劉琨が軍を失うに及んで、晋の元帝に奉った箋のなかでも「諸葛亮は軍が敗れて血を吐いた」と述べているのは、これは虚妄の記録をそのまま引用して言葉を成したものにすぎない。また谷に入ってから死去したと述べているのは、蜀人が谷へ入ってから喪を発したことに由来するのである。", "persons": "諸葛亮, 裴松之, 司馬懿, 劉琨, 司馬睿", "places": "郭氏塢, 渭浜", "era_year": "建興12年（234）8月", "source_book": "『魏書』・『漢晋春秋』・『晋陽秋』", "keywords": "魏書, 漢晉春秋, 晋陽秋", "raw_tagged": "《{{special:魏書|魏書}}》曰：{{person:諸葛亮|亮}}糧盡勢窮，憂恚歐血，一夕燒營遁走，入谷，道發病卒。{{special:漢晉春秋|漢晉春秋}}曰：{{person:諸葛亮|亮}}卒于{{place:郭氏塢|郭氏塢}}。《{{special:晋陽秋|晉陽秋}}》曰：有星赤而芒角，自東北西南流，投于{{person:諸葛亮|亮}}營，三投再還，往大還小。俄而{{person:諸葛亮|亮}}卒。{{person:裴松之|臣松之}}以為{{person:諸葛亮|亮}}在{{place:渭浜|渭濱}}，魏人躡跡，勝負之形，未可測量，而云歐血，蓋因{{person:諸葛亮|亮}}自亡而自誇大也。夫以{{person:諸葛亮|孔明}}之略，豈為{{person:司馬懿|仲達}}歐血乎？及至{{person:劉琨|劉琨}}喪師，與{{person:司馬睿|晉元帝}}箋亦云「{{person:諸葛亮|亮}}軍敗歐血」，此則引虛記以為言也。其云入谷而卒，緣蜀人入谷發喪故也。", "kakikudashi_tagged": "『{{special:魏書|魏書}}』に曰く、{{person:諸葛亮|亮}}は糧尽き勢い窮まり、憂恚して血を欧き、一夕に営を焼きて遁走し、 raw_text": "《漢晉春秋》曰：楊儀等整軍而出，百姓奔告宣王，宣王追焉。姜維令儀反旗鳴鼓，若將向宣王者，宣王乃退，不敢偪。於是儀結陳而去，入谷然後發喪。宣王之退也，百姓為之諺曰：「死諸葛走生仲達。」或以告宣王，宣王曰：「吾能料生，不便料死也。」", "kakikudashi": "『漢晋春秋』に曰く、楊儀等、軍を整えて出づるや、百姓は奔りて宣王に告げ、宣王之を追う。姜維、儀をして旗を反し鼓を鳴らし、将に宣王に向かわんとする者の若くせしむれば、宣王は乃ち退き、敢えて偪らず。是に於いて儀は陳を結びて去り、谷に入りて然る後に喪を発す。宣王の退くや、百姓、之が諺を為りて曰く、「死せる諸葛、生ける仲達を走らす」と。或るひと以て宣王に告ぐれば、宣王曰く、「吾は能く生を料るも、死を料るに便ならざるなり」と。", "translation": "『漢晋春秋』にいう、楊儀らが軍を整えて出発すると、民衆が駆けつけて司馬宣王に知らせたため、司馬宣王はこれを追撃した。姜維が楊儀に命じて軍旗を返し太鼓を打ち鳴らし、いまにも司馬宣王へ立ち向かうかのように見せかけさせると、司馬宣王はそこで退却し、あえて迫ろうとしなかった。こうして楊儀は陣形を組んで引き揚げ、谷へ入ってからはじめて喪を発した。司馬宣王が退却すると、民衆はこれを諺にして、「死せる諸葛、生ける仲達を走らす」と囃した。ある人がこれを司馬宣王に告げると、司馬宣王は「私は生ける者を推し量ることはできても、死せる者を推し量るのは不得手なのだ」と言った、と。", "persons": "楊儀, 司馬懿, 姜維, 諸葛亮", "places": "", "era_year": "建興12年（234）8月", "source_book": "『漢晋春秋』", "keywords": "漢晉春秋", "raw_tagged": "《{{special:漢晉春秋|漢晉春秋}}》曰：{{person:楊儀|楊儀}}等整軍而出，百姓奔告{{person:司馬懿|宣王}}，{{person:司馬懿|宣王}}追焉。{{person:姜維|姜維}}令{{person:楊儀|儀}}反旗鳴鼓，若將向{{person:司馬懿|宣王}}者，{{person:司馬懿|宣王}}乃退，不敢偪。於是{{person:楊儀|儀}}結陳而去，入谷然後發喪。{{person:司馬懿|宣王}}之退也，百姓為之諺曰：「死{{person:諸葛亮|諸葛}}走生{{person:司馬懿|仲達}}。」或以告{{person:司馬懿|宣王}}，{{person:司馬懿|宣王}}曰：「吾能料生，不便料死也。」", "kakikudashi_tagged": "『{{special:漢晉春秋|漢晋春秋}}』に曰く、{{person:楊儀|楊儀}}等、軍を整えて出づるや、百姓は奔りて{{person:司馬懿|宣王}}に告げ、{{person:司馬懿|宣王}}之を追う。{{person:姜維|姜維}}、{{person:楊儀|儀}}をして旗を反し鼓を鳴らし、将に{{person:司馬懿|宣王}}に向かわんとする者の若くせしむれば、{{person:司馬懿|宣王}}は乃ち退き、敢えて偪らず。是に於いて{{person:楊儀|儀}}は陳を結びて去り、谷に入りて然る後に喪を発す。{{person:司馬懿|宣王}}の退くや、百姓、之が諺を為りて曰く、「死せる{{person:諸葛亮|諸葛}}、生ける{{person:司馬懿|仲達}}を走らす」と。或るひと以て{{person:司馬懿|宣王}}に告ぐれば、{{person:司馬懿|宣王}}曰く、「吾は能く生を料るも、死を料るに便ならざるなり」と。", "translation_tagged": "『{{special:漢晉春秋|漢晋春秋}}』にいう、{{person:楊儀|楊儀}}らが軍を整えて出発すると、民衆が駆けつけて{{person:司馬懿|司馬宣王}}に知らせたため、{{person:司馬懿|司馬宣王}}はこれを追撃した。{{person:姜維|姜維}}が{{person:楊儀|楊儀}}に命じて軍旗を返し太鼓を打ち鳴らし、いまにも{{person:司馬懿|司馬宣王}}へ立ち向かうかのように見せかけさせると、{{person:司馬懿|司馬宣王}}はそこで退却し、あえて迫ろうとしなかった。こうして{{person:楊儀|楊儀}}は陣形を組んで引き揚げ、谷へ入ってからはじめて喪を発した。{{person:司馬懿|司馬宣王}}が退却すると、民衆はこれを諺にして、「死せる{{person:諸葛亮|諸葛}}、生ける{{person:司馬懿|仲達}}を走らす」と囃した。ある人がこれを{{person:司馬懿|司馬宣王}}に告げると、{{person:司馬懿|司馬宣王}}は「私は生ける者を推し量ることはできても、死せる者を推し量るのは不得手なのだ」と言った、と。"}, {"id": "v35_p17_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 17, "type": "本文", "raw_text": "亮遺命葬漢中定軍山，因山為墳，塚足容棺，斂以時服，不須器物。詔策曰：", "kakikudashi": "亮、遺命して漢中の定軍山に葬らしめ、山に因りて墳を為り、塚は棺を容るるに足るのみとし、斂むるに時服を以てし、器物を須いしめず。詔策に曰く、", "translation": "諸葛亮は遺命して漢中の定軍山に葬らせ、自然の山に拠って墳墓を造り、墓穴は棺を収めるに足るだけの大きさとし、平素の衣服のまま納棺させて、副葬の器物は一切用いさせなかった。詔策にいう、", "persons": "諸葛亮", "places": "漢中, 定軍山", "era_year": "建興12年（234）8月〜秋", "source_book": "", "keywords": "", "raw_tagged": "{{person:諸葛亮|亮}}遺命葬{{place:漢中|漢中}}{{place:定軍山|定軍山}}，因山為墳，塚足容棺，斂以時服，不須器物。詔策曰：", "kakikudashi_tagged": "{{person:諸葛亮|亮}}、遺命して{{place:漢中|漢中}}の{{place:定軍山|定軍山}}に葬らしめ、山に因りて墳を為り、塚は棺を容るるに足るのみとし、斂むるに時服を以てし、器物を須いしめず。詔策に曰く、", "translation_tagged": "{{person:諸葛亮|諸葛亮}}は遺命して{{place:漢中|漢中}}の{{place:定軍山|定軍山}}に葬らせ、自然の山に拠って墳墓を造り、墓穴は棺を収めるに足るだけの大きさとし、平素の衣服のまま納棺させて、副葬の器物は一切用いさせなかった。詔策にいう、"}, {"id": "v35_p18_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 18, "type": "本文", "raw_text": "惟君體資文武，明叡篤誠，受遺託孤，匡輔朕躬，繼絕興微，志存靖亂；爰整六師，無歲不征，神武赫然，威震八荒，將建殊功於季漢，參伊、周之巨勳。如何不弔，事臨垂克，遘疾隕喪！朕用傷悼，肝心若裂。夫崇德序功，紀行命謚，所以光昭將來，刊載不朽。今使使持節左中郎將杜瓊，贈君丞相武鄉侯印綬，謚君為忠武侯。魂而有靈，嘉茲寵榮。嗚呼哀哉！嗚呼哀哉！", "kakikudashi": "惟うに君は体、文武を資け、明叡篤誠にして、遺を受けて孤を託せられ、朕が躬を匡輔し、絶を継ぎ微を興し、志は乱を靖んずるに存せり、爰に六師を整え、歳として征せざるは無く、神武は赫然として、威は八荒に震い、将に殊功を季漢に建て、伊・周の巨勲に参ぜんとせり。如何ぞ弔せられずして、事の垂んと克たんとするに臨み、疾に遘いて隕喪せるや！朕、用て傷悼し、肝心裂くるが若し。夫れ徳を崇び功を序で、行いを紀して謚を命ずるは、将来に光昭し、不朽に刊載する所以なり。今、使持節・左中郎将の杜瓊をして、君に丞相・武郷侯の印綬を贈り、君に謚して忠武侯と為さしむ。魂にして霊有らば、茲の寵栄を嘉せよ。嗚呼哀しいかな！嗚呼哀しいかな！", "translation": "思うに君はその身に文武の才を備え、聡明叡智にして篤実至誠であり、遺命を受けて孤児を託され、朕の身を正し補佐し、絶えたるを継ぎ微かなるを興して、その志はつねに戦乱の平定にあった、ここに六軍を整えて、出征せぬ年とてなく、神武は赫々と輝き、威勢は八方の果てまで震わせ、まさに季漢に比類なき殊勲を打ち立てて、伊尹・周公の大いなる勲功にも並び立とうとしていた。なんたることか天の憐れみを得られず、大業がいまにも成就しようとする矢先に、病にかかって世を去ってしまうとは！朕はこのために深く傷み悼み、肝も心も張り裂けんばかりである。そもそも徳を尊び功績を叙し、生前の行いを記録して諡号を定めるのは、後世まで輝きを明らかにし、不朽の歴史に刻み残すための道である。いま、使持節・左中郎将の杜瓊を遣わして、君に丞相・武郷侯の印綬を追贈し、君に諡して忠武侯とする。御霊に霊験があるならば、この栄誉ある恩寵を嘉納されよ。ああ哀しいかな！ああ哀しいかな！", "persons": "伊尹, 周公, 杜瓊", "places": "武郷", "era_year": "建興12年（234）8月", "source_book": "", "keywords": "使持節, 左中郎将, 丞相, 列侯, 印綬, 忠武侯", "raw_tagged": "惟君體資文武，明叡篤誠，受遺託孤，匡輔朕躬，繼絕興微，志存靖亂；爰整六師，無歲不征，神武赫然，威震八荒，將建殊功於季漢，參{{person:伊尹|伊}}{{person:周公|、周}}之巨勳。如何不弔，事臨垂克，遘疾隕喪！朕用傷悼，肝心若裂。夫崇德序功，紀行命謚，所以光昭將來，刊載不朽。今使{{office:使持節|使持節}}{{office:左中郎将|左中郎將}}{{person:杜瓊|杜瓊}}，贈君{{office:丞相|丞相}}{{place:武郷|武鄉}}{{office:列侯|侯}}{{special:印綬|印綬}}，謚君為{{special:忠武侯|忠武侯}}。魂而有靈，嘉茲寵榮。嗚呼哀哉！嗚呼哀哉！", "kakikudashi_tagged": "惟うに君は体、文武を資け、明叡篤誠にして、遺を受けて孤を託せられ、朕が躬を匡輔し、絶を継ぎ微を興し、志は乱を靖んずるに存せり、爰に六師を整え、歳として征せざるは無く、神武は赫然として、威は八荒に震い、将に殊功を季漢に建て、{{person:伊尹|伊}}{{person:周公|・周}}の巨勲に参ぜんとせり。如何ぞ弔せられずして、事の垂んと克たんとするに臨み、疾に遘いて隕喪せるや！朕、用て傷悼し、肝心裂くるが若し。夫れ徳を崇び功を序で、行いを紀して謚を命ずるは、将来に光昭し、不朽に刊載する所以なり。今、{{office:使持節|使持節}}・{{office:左中郎将|左中郎将}}の{{person:杜瓊|杜瓊}}をして、君に{{office:丞相|丞相}}・{{place:武郷|武郷}}{{office:列侯|侯}}の{{special:印綬|印綬}}を贈り、君に謚して{{special:忠武侯|忠武侯}}と為さしむ。魂にして霊有らば、茲の寵栄を嘉せよ。嗚呼哀しいかな！嗚呼哀しいかな！", "translation_tagged": "思うに君はその身に文武の才を備え、聡明叡智にして篤実至誠であり、遺命を受けて孤児を託され、朕の身を正し補佐し、絶えたるを継ぎ微かなるを興して、その志はつねに戦乱の平定にあった、ここに六軍を整えて、出征せぬ年とてなく、神武は赫々と輝き、威勢は八方の果てまで震わせ、まさに季漢に比類なき殊勲を打ち立てて、{{person:伊尹|伊尹}}・{{person:周公|周公}}の大いなる勲功にも並び立とうとしていた。なんたることか天の憐れみを得られず、大業がいまにも成就しようとする矢先に、病にかかって世を去ってしまうとは！朕はこのために深く傷み悼み、肝も心も張り裂けんばかりである。そもそも徳を尊び功績を叙し、生前の行いを記録して諡号を定めるのは、後世まで輝きを明らかにし、不朽の歴史に刻み残すための道である。いま、{{office:使持節|使持節}}・{{office:左中郎将|左中郎将}}の{{person:杜瓊|杜瓊}}を遣わして、君に{{office:丞相|丞相}}・{{place:武郷|武郷}}{{office:列侯|侯}}の{{special:印綬|印綬}}を追贈し、君に諡して{{special:忠武侯|忠武侯}}とする。御霊に霊験があるならば、この栄誉ある恩寵を嘉納されよ。ああ哀しいかな！ああ哀しいかな！"}, {"id": "v35_p19_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 19, "type": "本文", "raw_text": "初，亮自表後主曰：「成都有桑八百株，薄田十五頃，子弟衣食，自有餘饒。至於臣在外任，無別調度，隨身衣食，悉仰於官，不別治生，以長尺寸。若臣死之日，不使內有餘帛，外有贏財，以負陛下。」及卒，如其所言。", "kakikudashi": "初め、亮、自ら後主に表して曰く、「成都に桑八百株、薄田十五頃有り、子弟の衣食は、自ら余饒有り。臣が外任に在るに至りては、別の調度無く、随身の衣食は、悉く官に仰ぎ、別に生を治めて、以て尺寸を長ぜず。若し臣が死するの日には、内に余帛有り、外に贏財有りて、以て陛下に負かしめじ」と。卒するに及び、其の言う所の如し。", "translation": "はじめ、諸葛亮は自ら後主に上表して言った、「成都に桑が八百株、痩せた田が十五頃ありますので、子弟たちの衣食には、おのずとゆとりがございます。臣が外にあって任に就いている身といたしましては、格別の蓄えや用度もなく、身にまとう衣服や日々の食事は、ことごとく官からの支給に仰ぎ、別に生業を営んで、わずかな私財を増やすようなこともいたしておりません。もし臣が死ぬ日には、家に余分の絹を残し、外に余剰の財貨を残して、陛下のご恩に背くようなことは決していたしません」と。没するに及び、はたしてその言葉の通りであった。", "persons": "諸葛亮, 劉禅", "places": "成都", "era_year": "建興12年（234）8月", "source_book": "", "keywords": "", "raw_tagged": "初，{{person:諸葛亮|亮}}自表{{person:劉禅|後主}}曰：「{{place:成都|成都}}有桑八百株，薄田十五頃，子弟衣食，自有餘饒。至於臣在外任，無別調度，隨身衣食，悉仰於官，不別治生，以長尺寸。若臣死之日，不使內有餘帛，外有贏財，以負{{person:劉禅|陛下}}。」及卒，如其所言。", "kakikudashi_tagged": "初め、{{person:諸葛亮|亮}}、自ら{{person:劉禅|後主}}に表して曰く、「{{place:成都|成都}}に桑八百株、薄田十五頃有り、子弟の衣食は、自ら余饒有り。臣が外任に在るに至りては、別の調度無く、随身の衣食は、悉く官に仰ぎ、別に生を治めて、以て尺寸を長ぜず。若し臣が死するの日には、内に余帛有り、外に贏財有りて、以て{{person:劉禅|陛下}}に負かしめじ」と。卒するに及び、其の言う所の如し。", "translation_tagged": "はじめ、{{person:諸葛亮|諸葛亮}}は自ら{{person:劉禅|後主}}に上表して言った、「{{place:成都|成都}}に桑が八百株、痩せた田が十五頃ありますので、子弟たちの衣食には、おのずとゆとりがございます。臣が外にあって任に就いている身といたしましては、格別の蓄えや用度もなく、身にまとう衣服や日々の食事は、ことごとく官からの支給に仰ぎ、別に生業を営んで、わずかな私財を増やすようなこともいたしておりません。もし臣が死ぬ日には、家に余分の絹を残し、外に余剰の財貨を残して、{{person:劉禅|陛下}}のご恩に背くようなことは決していたしません」と。没するに及び、はたしてその言葉の通りであった。"}, {"id": "v35_p20_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 20, "type": "本文", "raw_text": "亮性長於巧思，損益連弩，木牛流馬，皆出其意；推演兵法，作八陣圖，咸得其要云。", "kakikudashi": "亮は性、巧思に長じ、連弩を損益し、木牛流馬は、皆な其の意より出づ。兵法を推演し、八陣図を作るに、咸な其の要を得たりと云う。", "translation": "諸葛亮は天性、精巧な工夫に長けており、連弩に改良を加え、木牛流馬も、みなその独創から出たものであった。また兵法を推し広めて研究し、八陣図を作ったが、いずれもその要諦を得ていたという。", "persons": "諸葛亮", "places": "", "era_year": "建興年間（223〜234）", "source_book": "", "keywords": "連弩, 木牛流馬, 八陣図", "raw_tagged": "{{person:諸葛亮|亮}}性長於巧思，損益{{special:連弩|連弩}}，{{special:木牛流馬|木牛流馬}}，皆出其意；推演兵法，作{{special:八陣図|八陣圖}}，咸得其要云。", "kakikudashi_tagged": "{{person:諸葛亮|亮}}は性、巧思に長じ、{{special:連弩|連弩}}を損益し、{{special:木牛流馬|木牛流馬}}は、皆な其の意より出づ。兵法を推演し、{{special:八陣図|八陣図}}を作るに、咸な其の要を得たりと云う。", "translation_tagged": "{{person:諸葛亮|諸葛亮}}は天性、精巧な工夫に長けており、{{special:連弩|連弩}}に改良を加え、{{special:木牛流馬|木牛流馬}}も、みなその独創から出たものであった。また兵法を推し広めて研究し、{{special:八陣図|八陣図}}を作ったが、いずれもその要諦を得ていたという。"}, {"id": "v35_p20_2", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 20, "type": "裴注", "raw_text": "《魏氏春秋》曰：亮作八務、七戒、六恐、五懼，皆有條章，以訓厲臣子。又損益連弩，謂之元戎，以鐵為矢，矢長八寸，一弩十矢俱發。《亮集》載作木牛流馬法曰：「木牛者，方腹曲頭，一腳四足，頭入領中，舌著於腹。載多而行少，宜可大用，不可小使；特行者數十里，群行者二十里也。曲者為牛頭，雙者為牛腳，橫者為牛領，轉者為牛足，覆者為牛背，方者為牛腹，垂者為牛舌，曲者為牛肋，刻者為牛齒，立者為牛角，細者為牛鞅，攝者為牛鞦軸。牛仰雙轅，人行六尺，牛行四步。載一歲糧，日行二十里，而人不大勞。流馬尺寸之數，肋長三尺五寸，廣三寸，厚二寸二分，左右同。前軸孔分墨去頭四寸，徑中二寸。前腳孔分墨二寸，去前軸孔四寸五分，廣一寸。前杠孔去前腳孔分墨二寸七分，孔長二寸，廣一寸。後軸孔去前杠分墨一尺五分，大小與前同。後腳孔分墨去後軸孔三寸五分，大小與前同。後杠孔去後腳孔分墨二寸七分，後載剋去後杠孔分墨四寸五分。前杠長一尺八寸，廣二寸，厚一寸五分。後杠與等版方囊二枚，厚八分，長二尺七寸，高一尺六寸五分，廣一尺六寸，每枚受米二斛三斗。從上杠孔去肋下七寸，前後同。上杠孔去下杠孔分墨一尺三寸，孔長一寸五分，廣七分，八孔同。前後四腳，廣二寸，厚一寸五分。形制如象，靬長四寸，徑面四寸三分。孔徑中三腳杠，長二尺一寸，廣一寸五分，厚一寸四分，同杠耳。」", "kakikudashi": "『魏氏春秋』に曰く、亮は「八務・七戒・六恐・五懼」を作り、皆な条章有りて、以て臣子を訓厲す。又た連弩を損益し、之を元戎と謂い、鉄を以て矢と為し、矢の長さ八寸、一弩にして十矢倶に発す。『亮集』に「木牛流馬を作るの法」を載せて曰く、「木牛なる者は、方腹曲頭、一脚四足にして、頭は領中に入り、舌は腹に著く。載すること多くして行くこと少なければ、宜しく大用すべく、小使すべからず。特行する者は数十里、群行する者は二十里なり。曲がれる者を牛頭と為し、双なる者を牛脚と為し、横たわる者を牛領と為し、転ずる者を牛足と為し、覆う者を牛背と為し、方なる者を牛腹と為し、垂るる者を牛舌と為し、曲がれる者を牛肋と為し、刻める者を牛歯と為し、立つ者を牛角と為し、細き者を牛鞅と為し、摂する者を牛鞦軸と為す。牛は双轅を仰ぎ、人行くこと六尺なれば、牛行くこと四歩なり。一歳の糧を載せ、日に二十里を行きて、人は大いに労せず。流馬の尺寸の数は、肋の長さ三尺五寸、広さ三寸、厚さ二寸二分、左右同じ。前軸孔は分墨の頭を去ること四寸、径中は二寸なり。前脚孔は分墨二寸、前軸孔を去ること四寸五分、広さ一寸なり。前杠孔は前脚孔を去ること分墨二寸七分、孔の長さ二寸、広さ一寸なり。後軸孔は前杠を去ること分墨一尺五分、大小は前と同じ。後脚孔は分墨の後軸孔を去ること三寸五分、大小は前と同じ。後杠孔は後脚孔を去ること分墨二寸七分、後載剋は後杠孔を去ること分墨四寸五分なり。前杠は長さ一尺八寸、広さ二寸、厚さ一寸五分なり。後杠と等版の方嚢二枚は、厚さ八分、長さ二尺七寸、高さ一尺六寸五分、広さ一尺六寸にして、毎枚に米二斛三斗を受く。上杠孔より肋下を去ること七寸、前後同じ。上杠孔は下杠孔を去ること分墨一尺三寸、孔の長さ一寸五分、広さ七分、八孔同じ。前後の四脚は、広さ二寸、厚さ一寸五分なり。形制は象の如く、靬は長さ四寸、径面は四寸三分なり。孔の径中の三脚杠は、長さ二尺一寸、広さ一寸五分、厚さ一寸四分にして、同じく杠なるのみ」と。", "translation": "『魏氏春秋』にいう、諸葛亮は「八務・七戒・六恐・五懼」を作り、いずれも整然たる条文と章立てを備えて、臣下たちを教え励ました。また連弩に改良を加え、これを元戎と呼び、鉄で矢を作り、矢の長さは八寸で、一丁の弩から十本の矢を同時に発射した。『亮集』に「木牛流馬を作る法」を載せていう、「木牛というものは、四角い腹に曲がった頭、一本の脚柱と四つの足を備え、頭は首木のなかに入り、舌は腹に着いている。多く積載できるが進みは緩やかであるから、大規模な輸送に用いるのには適しているが、小回りの用には向かない。単独で行く場合は日に数十里、隊列を組んで行く場合は日に二十里を進む。曲がった材を牛頭とし、対になった材を牛脚とし、横木を牛領とし、回転する部分を牛足とし、上を覆う板を牛背とし、四角い箱を牛腹とし、垂れ下がる材を牛舌とし、湾曲した枠木を牛肋とし、刻み目を入れた材を牛歯とし、立ち上がる材を牛角とし、細い材を牛鞅とし、引き締める軸木を牛鞦軸とする。牛は二本の轅を上向きに受け、人が六尺を行けば、牛は四歩を進む。一人あたり一年分の兵糧を載せ、一日に二十里を行きながら、人はさほど疲労しない。流馬の寸法の数値は、肋木の長さ三尺五寸、幅三寸、厚さ二寸二分で、左右同じである。前軸の 優れたものが多く、別に一巻の文集として編まれた。"}, {"id": "v35_p21_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 21, "type": "本文", "raw_text": "景耀六年春，詔為亮立廟於沔陽。", "kakikudashi": "景耀六年春、詔して亮の為に廟を沔陽に立つ。", "translation": "景耀六年春、詔を下して諸葛亮のために廟を沔陽に建立した。", "persons": "諸葛亮", "places": "沔陽", "era_year": "景耀6年（263）春", "source_book": "", "keywords": "景耀", "raw_tagged": "{{special:景耀|景耀}}六年春，詔為{{person:諸葛亮|亮}}立廟於{{place:沔陽|沔陽}}。", "kakikudashi_tagged": "{{special:景耀|景耀}}六年春、詔して{{person:諸葛亮|亮}}の為に廟を{{place:沔陽|沔陽}}に立つ。", "translation_tagged": "{{special:景耀|景耀}}六年春、詔を下して{{person:諸葛亮|諸葛亮}}のために廟を{{place:沔陽|沔陽}}に建立した。"}, {"id": "v35_p21_2", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 21, "type": "裴注", "raw_text": "《襄陽記》曰：亮初亡，所在各求為立廟，朝議以禮秩不聽，百姓遂因時節私祭之於道陌上。言事者或以為可聽立廟於成都者，後主不從。步兵校尉習隆、中書郎向充等共上表曰：「臣聞周人懷召伯之德，甘棠為之不伐；越王思范蠡之功，鑄金以存其像。自漢興以來，小善小德而圖形立廟者多矣。況亮德範遐邇，勛蓋季世，王室之不壞，實斯人是賴，而蒸嘗止於私門，廟像闕而莫立，使百姓巷祭，戎夷野祀，非所以存德念功，述追在昔者也。今若盡順民心，則瀆而無典，建之京師，又偪宗廟，此聖懷所以惟疑也。臣愚以為宜因近其墓，立之於沔陽，使所親屬以時賜祭，凡其臣故吏欲奉祠者，皆限至廟。斷其私祀，以崇正禮。」於是始從之。", "kakikudashi": "『襄陽記』に曰く、亮の初めて亡ずるや、所在各おの為に廟を立てんことを求むるも、朝議は礼秩を以て聴さず、百姓は遂に時節に因りて私かに之を道陌の上に祭る。事を言う者、或いは廟を成都に立つるを聴すべしと以為う者有るも、後主は従わず。歩兵校尉の習隆、中書郎の向充等、共に上表して曰く、「臣聞く、周人は召伯の徳を懐い、甘棠、之が為に伐らず、越王は范蠡の功を思い、金を鋳て以て其の像を存す、と。漢の興りてより以来、小善・小徳にして形を図し廟を立つる者多し。況んや亮は徳、遐邇に範たり、勲は季世を蓋い、王室の壊れざるは、実に斯の人に是れ頼るに、而も蒸嘗は私門に止まり、廟像は闕けて立つる莫く、百姓をして巷祭し、戎夷をして野祀せしむるは、徳を存し功を念い、在昔を述追する所以の者に非ざるなり。今若し尽く民心に順わば、則ち瀆れて典無く、之を京師に建てなば、又た宗廟に偪らん、此れ聖懐の惟だ疑う所以なり。臣、愚以為えらく、宜しく其の墓に近きに因りて、之を沔陽に立て、親属する所をして時を以て祭を賜わしめ、凡そ其の臣・故吏の奉祠せんと欲する者は、皆な廟に至るに限るべし。其の私祀を断ちて、以て正礼を崇ばん」と。是に於いて始めて之に従う。", "translation": "『襄陽記』にいう、諸葛亮が亡くなった当初、各地でそれぞれ彼のために廟を立てたいと請願したが、朝議では礼制の序列に照らして許さなかったため、民衆はついに季節の節目ごとに私的に道端や畦道の上で彼を祭るようになった。政務を論じる者のなかには、成都に廟を立てることを許すべきだと考える者もあったが、後主は従わなかった。歩兵校尉の習隆、中書郎の向充らがともに上表して言った、「臣が聞くところでは、周の人々は召伯の徳を慕い、甘棠の樹をそのために伐らずにおき、越王は范蠡の功績を思い、黄金を鋳てその像を残したといいます。漢が興って以来、小さな善行や小さな徳によって姿を描き廟を立てられた者は数多くおります。まして諸葛亮は徳が遠近の模範となり、勲功は末世を覆い、王室が傾き壊れなかったのも、まことにこの人に頼ってのことでありますのに、春秋の祭祀は私家の門内に限られ、廟も像も欠けたまま立てられず、民衆に街角で祭らせ、異民族に野辺で祀らせているのは、徳を留め功績を思い、往時を追慕して顕彰する道ではありません。いまもし民心のすべてに従うならば、乱雑になって礼典を失いますし、これを京師に建てるならば、今度は宗廟に近づき憚りがあります、これこそ聖慮がためらっておられる理由でありましょう。臣らが愚考いたしますに、その墓所に近いことにちなんで、これを沔陽に建立し、親族の者たちに季節ごとに祭祀を賜わらせ、およそ旧臣や故吏で祠に奉仕したいと願う者は、みなこの廟に赴くよう限定すべきかと存じます。こうして私的な祭祀を断ち、正しき礼制を尊ぶことといたしましょう」と。ここにおいて初めてこれに従った。", "persons": "諸葛亮, 劉禅, 習隆, 向充, 召公奭, 勾践, 范蠡", "places": "成都, 沔陽", "era_year": "景耀6年（263）春", "source_book": "『襄陽記』", "keywords": "襄陽記, 歩兵校尉, 中書郎", "raw_tagged": "《{{special:襄陽記|襄陽記}}》曰：{{person:諸葛亮|亮}}初亡，所在各求為立廟，朝議以禮秩不聽，百姓遂因時節私祭之於道陌上。言事者或以為可聽立廟於{{place:成都|成都}}者，{{person:劉禅|後主}}不從。{{office:歩兵校尉|步兵校尉}}{{person:習隆|習隆}}、{{office:中書郎|中書郎}}{{person:向充|向充}}等共上表曰：「臣聞周人懷{{person:召公奭|召伯}}之德，甘棠為之不伐；{{person:勾践|越王}}思{{person:范蠡|范蠡}}之功，鑄金以存其像。自漢興以來，小善小德而圖形立廟者多矣。況{{person:諸葛亮|亮}}德範遐邇，勛蓋季世，王室之不壞，實斯人是賴，而蒸嘗止於私門，廟像闕而莫立，使百姓巷祭，戎夷野祀，非所以存德念功，述追在昔者也。今若盡順民心，則瀆而無典，建之{{place:成都|京師}}，又偪宗廟，此聖懷所以惟疑也。臣愚以為宜因近其墓，立之於{{place:沔陽|沔陽}}，使所親屬以時賜祭，凡其臣故吏欲奉祠者，皆限至廟。斷其私祀，以崇正禮。」於是始從之。", "kakikudashi_tagged": "『{{special:襄陽記|襄陽記}}』に曰く、{{person:諸葛亮|亮}}の初めて亡ずるや、所在各おの為に廟を立てんことを求むるも、朝議は礼秩を以て聴さず、百姓は遂に時節に因りて私かに之を道陌の上に祭る。事を言う者、或いは廟を{{place:成都|成都}}に立つるを聴すべしと以為う者有るも、{{person:劉禅|後主}}は従わず。{{office:歩兵校尉|歩兵校尉}}の{{person:習隆|習隆}}、{{office:中書郎|中書郎}}の{{person:向充|向充}}等、共に上表して曰く、「臣聞く、周人は{{person:召公奭|召伯}}の徳を懐い、甘棠、之が為に伐らず、{{person:勾践|越王}}は{{person:范蠡|范蠡}}の功を思い、金を鋳て以て其の像を存す、と。漢の興りてより以来、小善・小徳にして形を図し廟を立つる者多し。況んや{{person:諸葛亮|亮}}は徳、遐邇に範たり、勲は季世を蓋い、王室の壊れざるは、実に斯の人に是れ頼るに、而も蒸嘗は私門に止まり、廟像は闕けて立つる莫く、百姓をして巷祭し、戎夷をして野祀せしむるは、徳を存し功を念い、在昔を述追する所以の者に非ざるなり。今若し尽く民心に順わば、則ち瀆れて典無く、之を{{place:成都|京師}}に建てなば、又た宗廟に偪らん、此れ聖懐の惟だ疑う所以なり。臣、愚以為えらく、宜しく其の墓に近きに因りて、之を{{place:沔陽|沔陽}}に立て、親属する所をして時を以て祭を賜わしめ、凡そ其の臣・故吏の奉祠せんと欲する者は、皆な廟に至るに限るべし。其の私祀を断ちて、以て正礼を崇ばん」と。是に於いて始めて之に従う。", "translation_tagged": "『{{special:襄陽記|襄陽記}}』にいう、{{person:諸葛亮|諸葛亮}}が亡くなった当初、各地でそれぞれ彼のために廟を立てたいと請願したが、朝議では礼制の序列に照らして許さなかったため、民衆はついに季節の節目ごとに私的に道端や畦道の上で彼を祭るようになった。政務を論じる者のなかには、{{place:成都|成都}}に廟を立てることを許すべきだと考える者もあったが、{{person:劉禅|後主}}は従わなかった。{{office:歩兵校尉|歩兵校尉}}の{{person:習隆|習隆}}、{{office:中書郎|中書郎}}の{{person:向充|向充}}らがともに上表して言った、「臣が聞くところでは、周の人々は{{person:召公奭|召伯}}の徳を慕い、甘棠の樹をそのために伐らずにおき、{{person:勾践|越王}}は{{person:范蠡|范蠡}}の功績を思い、黄金を鋳てその像を残したといいます。漢が興って以来、小さな善行や小さな徳によって姿を描き廟を立てられた者は数多くおります。まして{{person:諸葛亮|諸葛亮}}は徳が遠近の模範となり、勲功は末世を覆い、王室が傾き壊れなかったのも、まことにこの人に頼ってのことでありますのに、春秋の祭祀は私家の門内に限られ、廟も像も欠けたまま立てられず、民衆に街角で祭らせ、異民族に野辺で祀らせているのは、徳を留め功績を思い、往時を追慕して顕彰する道ではありません。いまもし民心のすべてに従うならば、乱雑になって礼典を失いますし、これを{{place:成都|京師}}に建てるならば、今度は宗廟に近づき憚りがあります、これこそ聖慮がためらっておられる理由でありましょう。臣らが愚考いたしますに、その墓所に近いことにちなんで、これを{{place:沔陽|沔陽}}に建立し、親族の者たちに季節ごとに祭祀を賜わらせ、およそ旧臣や故吏で祠に奉仕したいと願う者は、みなこの廟に赴くよう限定すべきかと存じます。こうして私的な祭祀を断ち、正しき礼制を尊ぶことといたしましょう」と。ここにおいて初めてこれに従った。"}, {"id": "v35_p21_3", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 21, "type": "本文", "raw_text": "秋，魏鎮西將軍鍾會征蜀，至漢川，祭亮之廟，令軍士不得於亮墓所左右芻牧樵採。亮弟均，官至長水校尉。亮子瞻，嗣爵。", "kakikudashi": "秋、魏の鎮西将軍・鍾会、蜀を征し、漢川に至り、亮の廟を祭り、軍士に令して亮の墓所の左右に於いて芻牧・樵採するを得ざらしむ。亮の弟の均は、官は長水校尉に至る。亮の子の瞻、爵を嗣ぐ。", "translation": "秋、魏の鎮西将軍・鍾会は蜀を征伐し、漢川に至ると、諸葛亮の廟を祭り、軍士に命じて諸葛亮の墓所の周辺で馬草を刈ったり牧畜や薪採りをしたりすることを禁じた。諸葛亮の弟の諸葛均は、官は長水校尉に至った。諸葛亮の子の諸葛瞻が、爵位を継いだ。", "persons": "鍾会, 諸葛亮, 諸葛均, 諸葛瞻", "places": "益州, 漢中", "era_year": "景耀6年（263）秋", "source_book": "", "keywords": "鎮西将軍, 長水校尉", "raw_tagged": "秋，魏{{office:鎮西将軍|鎮西將軍}}{{person:鍾会|鍾會}}征{{place:益州|蜀}}，至{{place:漢中|漢川}}，祭{{person:諸葛亮|亮}}之廟，令軍士不得於{{person:諸葛亮|亮}}墓所左右芻牧樵採。{{person:諸葛亮|亮}}弟{{person:諸葛均|均}}，官至{{office:長水校尉|長水校尉}}。{{person:諸葛亮|亮}}子{{person:諸葛瞻|瞻}}，嗣爵。", "kakikudashi_tagged": "秋、魏の{{office:鎮西将軍|鎮西将軍}}・{{person:鍾会|鍾会}}、{{place:益州|蜀}}を征し、{{place:漢中|漢川}}に至り、{{person:諸葛亮|亮}}の廟を祭り、軍士に令して{{person:諸葛亮|亮}}の墓所の左右に於いて芻牧・樵採するを得ざらしむ。{{person:諸葛亮|亮}}の弟の{{person:諸葛均|均}}は、官は{{office:長水校尉|長水校尉}}に至る。{{person:諸葛亮|亮}}の子の{{person:諸葛瞻|瞻}}、爵を嗣ぐ。", "translation_tagged": "秋、魏の{{office:鎮西将軍|鎮西将軍}}・{{person:鍾会|鍾会}}は{{place:益州|蜀}}を征伐し、{{place:漢中|漢川}}に至ると、{{person:諸葛亮|諸葛亮}}の廟を祭り、軍士に命じて{{person:諸葛亮|諸葛亮}}の墓所の周辺で馬草を刈ったり牧畜や薪採りをしたりすることを禁じた。{{person:諸葛亮|諸葛亮}}の弟の{{person:諸葛均|諸葛均}}は、官は{{office:長水校尉|長水校尉}}に至った。{{person:諸葛亮|諸葛亮}}の子の{{person:諸葛瞻|諸葛瞻}}が、爵位を継いだ。"}, {"id": "v35_p21_4", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 21, "type": "裴注", "raw_text": "《襄陽記》曰：黃承彥者，高爽開列，為沔南名士，謂諸葛孔明曰：「聞君擇婦；身有醜女，黃頭黑色，而才堪相配。」孔明許，即載送之。時人以為笑樂，鄉里為之諺曰：「莫作孔明擇婦，正得阿承醜女。」", "kakikudashi": "『襄陽記』に曰く、黄承彦なる者は、高爽開列にして、沔南の名士為り、諸葛孔明に謂いて曰く、「聞く、君は婦を択ぶと。身に醜女有り、黄頭黒色なれども、才は相い配するに堪えたり」と。孔明許せば、即ち載せて之を送る。時人は以て笑楽と為し、郷里、之が諺を為りて曰く、「孔明の婦を択ぶに作う莫かれ、正に阿承の醜女を得たり」と。", "translation": "『襄陽記』にいう、黄承彦という人は、気風が高邁で快活闊達であり、沔南の名士であったが、諸葛孔明に語って言った、「聞けば、君は妻を選んでおられるとのこと。私には醜い娘がおり、髪は黄色く肌は浅黒いが、才能は君に釣り合うだけのものがある」と。孔明が承諾すると、ただちに車に載せて送り届けた。当時の人々はこれを笑い草にして楽しみ、郷里ではこの事を諺にして、「孔明の嫁選びの真似をするな、まさに阿承の醜女をもらうことになるぞ」と言った、と。", "persons": "黄承彦, 諸葛亮", "places": "沔南", "era_year": "建安初年（197〜207頃）", "source_book": "『襄陽記』", "keywords": "襄陽記", "raw_tagged": "《{{special:襄陽記|襄陽記}}》曰：{{person:黄承彦|黃承彥}}者，高爽開列，為{{place:沔南|沔南}}名士，謂{{person:諸葛亮|諸葛孔明}}曰：「聞君擇婦；身有醜女，黃頭黑色，而才堪相配。」{{person:諸葛亮|孔明}}許，即載送之。時人以為笑樂，鄉里為之諺曰：「莫作{{person:諸葛亮|孔明}}擇婦，正得{{person:黄承彦|阿承}}醜女。」", "kakikudashi_tagged": "『{{special:襄陽記|襄陽記}}』に曰く、{{person:黄承彦|黄承彦}}なる者は、高爽開列にして、{{place:沔南|沔南}}の名士為り、{{person:諸葛亮|諸葛孔明}}に謂いて曰く、「聞く、君は婦を択ぶと。身に醜女有り、黄頭黒色なれども、才は相い配するに堪えたり」と。{{person:諸葛亮|孔明}}許せば、即ち載せて之を送る。時人は以て笑楽と為し、郷里、之が諺を為りて曰く、「{{person:諸葛亮|孔明}}の婦を択ぶに作う莫かれ、正に{{person:黄承彦|阿承}}の醜女を得たり」と。", "translation_tagged": "『{{special:襄陽記|襄陽記}}』にいう、{{person:黄承彦|黄承彦}}という人は、気風が高邁で快活闊達であり、{{place:沔南|沔南}}の名士であったが、{{person:諸葛亮|諸葛孔明}}に語って言った、「聞けば、君は妻を選んでおられるとのこと。私には醜い娘がおり、髪は黄色く肌は浅黒いが、才能は君に釣り合うだけのものがある」と。{{person:諸葛亮|孔明}}が承諾すると、ただちに車に載せて送り届けた。当時の人々はこれを笑い草にして楽しみ、郷里ではこの事を諺にして、「{{person:諸葛亮|孔明}}の嫁選びの真似をするな、まさに{{person:黄承彦|阿承}}の醜女をもらうことになるぞ」と言った、と。"}, {"id": "v35_p22_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 22, "type": "本文", "raw_text": "諸葛氏集目錄", "kakikudashi": "諸葛氏集目録", "translation": "『諸葛氏集』目録", "persons": "", "places": "", "era_year": "泰始10年（274）2月", "source_book": "", "keywords": "諸葛亮集", "raw_tagged": "{{special:諸葛亮集|諸葛氏集}}目錄", "kakikudashi_tagged": "{{special:諸葛亮集|諸葛氏集}}目録", "translation_tagged": "『{{special:諸葛亮集|諸葛氏集}}』目録"}, {"id": "v35_p23_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", ", "translation": "以上の二十四篇、すべて十万四千百十二字である。", "persons": "", "places": "", "era_year": "泰始10年（274）2月", "source_book": "", "keywords": "", "raw_tagged": "右二十四篇，凡十萬四千一百一十二字。", "kakikudashi_tagged": "右二十四篇、凡そ十万四千一百一十二字なり。", "translation_tagged": "以上の二十四篇、すべて十万四千百十二字である。"}, {"id": "v35_p32_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 32, "type": "本文", "raw_text": "臣壽等言：臣前在著作郎，侍中領中書監濟北侯臣荀勖、中書令關內侯臣和嶠奏：使臣定故蜀丞相諸葛亮故事。亮毗佐危國，負阻不賓，然猶存錄其言，恥善有遺，誠是大晉光明至德，澤被無疆，自古以來，未有之倫也。輒刪除複重，隨類相從，凡為二十四篇。篇名如右。", "kakikudashi": "臣寿ら言う、臣、前に著作郎に在りしとき、侍中・領中書監・済北侯の臣荀勗、中書令・関内侯の臣和嶠奏し、臣をして故の蜀の丞相・諸葛亮の故事を定めしむ。亮は危国を毗佐し、阻を負みて賓せざれども、然れども猶お其の言を存録し、善の遺るる有るを恥じたまうは、誠に是れ大晋の光明なる至徳にして、沢は無疆に被び、古より以来、未だ之れ有らざるの倫なり。輒ち複重を削除し、類に随いて相い従わしめ、凡そ二十四篇と為す。篇名は右の如し。", "translation": "臣・陳寿らが申し上げます、臣が以前に著作郎の職にありました折、侍中・領中書監・済北侯の臣・荀勗、中書令・関内侯の臣・和嶠が上奏し、臣に亡き蜀の丞相・諸葛亮の事績・遺文を整理編定させました。諸葛亮は危うい国を補佐し、険阻を頼んで帰服いたしませんでしたが、それでもなおその言論を保存記録し、善き言葉が埋もれ漏れるのを恥とされたことは、まことに大晋の公明なる至高の御徳であり、恩沢は果てしなく行き渡って、古よりこのかた、いまだ類例のないことでございます。そこで重複を削除し、部門ごとに分類整理して、すべて二十四篇といたしました。その篇名は以上の通りでございます。", "persons": "陳寿, 荀勗, 和嶠, 諸葛亮", "places": "済北, 益州", "era_year": "泰始10年（274）2月", "source_book": "", "keywords": "著作郎, 侍中, 中書監, 列侯, 中書令, 関内侯, 丞相", "raw_tagged": "臣壽等言：臣前在{{office:著作郎|著作郎}}，{{office:侍中|侍中}}領{{office:中書監|中書監}}{{place:済北|濟北}}{{office:列侯|侯}}臣{{person:荀勗|荀勖}}、{{office:中書令|中書令}}{{office:関内侯|關內侯}}臣{{person:和嶠|和嶠}}奏：使臣定故{{place:益州|蜀}}{{office:丞相|丞相}}{{person:諸葛亮|諸葛亮}}故事。{{person:諸葛亮|亮}}毗佐危國，負阻不賓，然猶存錄其言，恥善有遺，誠是大晉光明至德，澤被無疆，自古以來，未有之倫也。輒刪除複重，隨類相從，凡為二十四篇。篇名如右。", "kakikudashi_tagged": "臣寿ら言う、臣、前に{{office:著作郎|著作郎}}に在りしとき、{{office:侍中|侍中}}・領{{office:中書監|中書監}}・{{place:済北|済北}}{{office:列侯|侯}}の臣{{person:荀勗|荀勗}}、{{office:中書令|中書令}}・{{office:関内侯|関内侯}}の臣{{person:和嶠|和嶠}}奏し、臣をして故の{{place:益州|蜀}}の{{office:丞相|丞相}}・{{person:諸葛亮|諸葛亮}}の故事を定めしむ。{{person:諸葛亮|亮}}は危国を毗佐し、阻を負みて賓せざれども、然れども猶お其の言を存録し、善の遺るる有るを恥じたまうは、誠に是れ大晋の光明なる至徳にして、沢は無疆に被び、古より以来、未だ之れ有らざるの倫なり。輒ち複重を削除し、類に随いて相い従わしめ、凡そ二十四篇と為す。篇名は右の如し。", "translation_tagged": "臣・{{person:陳寿|陳寿}}らが申し上げます、臣が以前に{{office:著作郎|著作郎}}の職にありました折、{{office:侍中|侍中}}・領{{office:中書監|中書監}}・{{place:済北|済北}}{{office:列侯|侯}}の臣・{{person:荀勗|荀勗}}、{{office:中書令|中書令}}・{{office:関内侯|関内侯}}の臣・{{person:和嶠|和嶠}}が上奏し、臣に亡き{{place:益州|蜀}}の{{office:丞相|丞相}}・{{person:諸葛亮|諸葛亮}}の事績・遺文を整理編定させました。{{person:諸葛亮|諸葛亮}}は危うい国を補佐し、険阻を頼んで帰服いたしませんでしたが、それでもなおその言論を保存記録し、善き言葉が埋もれ漏れるのを恥とされたことは、まことに大晋の公明なる至高の御徳であり、恩沢は果てしなく行き渡って、古よりこのかた、いまだ類例のないことでございます。そこで重複を削除し、部門ごとに分類整理して、すべて二十四篇といたしました。その篇名は以上の通りでございます。"}, {"id": "v35_p33_1", "volume": 35, "book": "蜀書", "section_title": "諸葛亮傳（諸葛亮）", "para_index": 33, "type": "本文", "raw_text": "亮少有逸眾之才，英霸之器，身長八尺，容貌甚偉，時人異焉。造漢末亂，隨叔父玄避難荊州，躬耕于野，不求聞達。時左將軍劉備以亮有殊量，乃三顧亮於草廬之中；亮深謂備雄姿傑出，遂解帶寫誠，厚相結納。及魏武帝南征荊州，劉琮舉州委質，而備失勢眾寡，無立錐之地。亮時年二十七，乃建奇策，身使孫權，求援吳會。權既宿服仰備，又觀亮奇雅，甚敬重之，即遣兵三萬以助備。備得用與武帝交戰，大破其軍，乘勝克捷，江南悉平。後備又西取益州。益州既定，以亮為軍師將軍。備稱尊號，拜亮為丞相，錄尚書事。及備殂沒，嗣子幼弱，事無巨細，亮皆專之。於是外連東吳，內平南越，立法施度，整理戎旅，工械技巧，物究其極，科教嚴明，賞罰必信，無惡不懲，無善不顯，至於吏不容奸，人懷自厲，道不拾遺，彊不侵弱，風化肅然也。", "kakikudashi": "亮は少くして逸衆の才、英覇の器有り、身長八尺、容貌甚だ偉にして、時人焉を異とす。漢末の乱に造い、叔父の玄に随いて難を荊州に避け、野に躬耕して、聞達を求めず。時に左将軍・劉備、亮に殊量有るを以て、乃ち亮を草廬の中に三顧す、亮も深く備の雄姿傑出せるを謂い、遂に帯を解きて誠を写し、厚く相い結納す。魏の武帝、荊州に南征するに及び、劉琮は州を挙げて質を委ね、而して備は勢いを失い衆寡なく、立錐の地無し。亮は時に年二十七、乃ち奇策を建て、身ら孫権に使いし、援けを呉会に求む。権は既に宿より備に服仰し、又た亮の奇雅なるを観て、甚だ之を敬重し、即ち兵三万を遣わして以て備を助く。備は用て武帝と交戦するを得、大いに其の軍を破り、勝ちに乗じて克捷し、江南悉く平らぐ。後に備は又た西のかた益州を取る。益州既に定まり、亮を以て軍師将軍と為す。備、尊号を称するや、亮を拝して丞相と為し、尚書の事を録せしむ。備の殂没するに及び、嗣子は幼弱なれば、事の巨細と無く、亮皆な之を専らにす。是に於いて外は東呉に連なり、内は南越を平らげ、法を立て度を施し、戎旅を整理し、工械技巧、物ごとに其の極を究め、科教厳明にして、賞罰必ず信あり、悪として懲らさざるは無く、善として顕さざるは無ければ、吏は奸を容れず、人は自厲を懐き、道に遺ちたるを拾わず、強きは弱きを侵さざるに至り、風化粛然たり。", "translation": "諸葛亮は若い頃より衆に抜きん出た才能と、英傑覇王を輔ける器量を備え、身長は八尺、容貌はまことに堂々としており、当時の人々は彼を非凡な人物とみなしておりました。漢末の戦乱に遭うと、叔父の諸葛玄に従って荊州へ難を避け、野にあって自ら耕作し、世に名を知られて栄達することを求めませんでした。そのとき左将軍の劉備は、諸葛亮に並外れた器量があることから、草廬のなかに諸葛亮を三たび訪ねました、諸葛亮もまた劉備の雄々しい風姿が傑出していることを深く認め、ついに帯を解き胸襟を開いて誠意を傾け、厚く君臣の契りを結びました。魏の武帝が荊州へ南征するに及び、劉琮は州を挙げて臣従を誓い、劉備は勢力を失い手勢もわずかで、錐を立てるほどの土地さえなくなりました。諸葛亮は時に年二十七でありましたが、奇策を立てて、自ら孫権のもとへ使いし、呉会に救援を求めました。孫権はかねてより劉備に感服して敬慕していたうえ、さらに諸葛亮の類まれで高雅な風采を見て、大いにこれを敬い重んじ、ただちに兵三万を派遣して劉備を助けました。劉備はそのおかげで武帝と交戦することができ、その軍を大破し、勝ちに乗じて戦勝を重ね、江南はことごとく平定されました。のちに劉備はまた西に向かって益州を取りました。益州が平定されると、諸葛亮を軍師将軍といたしました。劉備が帝号を称すると、諸葛亮を拝して丞相とし、録尚書事といたしました。劉備が崩御するに及び、跡継ぎの子はまだ幼弱でありましたので、政務は大小となく、諸葛亮がすべてこれを専決いたしました。ここにおいて外は東呉とよしみを結び、内は南越を平定し、法令を立て制度を敷き、軍勢を整え治め、工作の器械や精巧な技術は、あらゆる物においてその極致を究め、法規と教令は厳正明快で、賞罰には必ず信義が貫かれ、いかなる悪も懲らしめぬはなく、いかなる善も顕彰せぬはなかったため、役人は不正を許さず、人々は自ら励む心を抱き、道に落ちている物を拾って私する者もなく、強者が弱者を侵すこともないまでに至り、教化と風紀は粛然と引き締まりました。", "persons": "諸葛亮, 諸葛玄, 劉備, 曹操, 劉琮, 孫権", "places": "荊州, 呉郡, 会稽, 益州, 江東, 南中", "era_year": "泰始10年（274）2月", "source_book": "", "keywords": "左将軍, 軍師将軍, 丞相, 録尚書事", "raw_tagged": "{{person:諸葛亮|亮}}少有逸眾之才，英霸之器，身長八尺，容貌甚偉，時人異焉。造漢末亂，隨叔父{{person:諸葛玄|玄}}避難{{place:荊州|荊州}}，躬耕于野，不求聞達。時{{office:左将軍|左將軍}}{{person:劉備|劉備}}以{{person:諸葛亮|亮}}有殊量，乃三顧{{person:諸葛亮|亮}}於草廬之中；{{person:諸葛亮|亮}}深謂{{person:劉備|備}}雄姿傑出，遂解帶寫誠，厚相結納。及{{person:曹操|魏武帝}}南征{{place:荊州|荊州}}，{{person:劉琮|劉琮}}舉州委質，而{{person:劉備|備}}失勢眾寡，無立錐之地。{{person:諸葛亮|亮}}時年二十七，乃建奇策，身使{{person:孫権|孫權}}，求援{{place:呉郡|吳}}{{place:会稽|會}}。{{person:孫権|權}}既宿服仰{{person:劉備|備}}，又觀{{person:諸葛亮|亮}}奇雅，甚敬重之，即遣兵三萬以助{{person:劉備|備}}。{{person:劉備|備}}得用與{{person:曹操|武帝}}交戰，大破其軍，乘勝克捷，{{place:荊州|江南}}悉平。後{{person:劉備|備}}又西取{{place:益州|益州}}。{{place:益州|益州}}既定，以{{person:諸葛亮|亮}}為{{office:軍師将軍|軍師將軍}}。{{person:劉備|備}}稱尊號，拜{{person:諸葛亮|亮}}為{{office:丞相|丞相}}，{{office:録尚書事|錄尚書事}}。及{{person:劉備|備}}殂沒，嗣子幼弱，事無巨細，{{person:諸葛亮|亮}}皆專之。於是外連{{place:江東|東吳}}，內平{{place:南中|南越}}，立法施度，整理戎旅，工械技巧，物究其極，科教嚴明，賞罰必信，無惡不懲，無善不顯，至於吏不容奸，人懷自厲，道不拾遺，彊不侵弱，風化肅然也。", "kakikudashi_tagged": "{{person:諸葛亮|亮}}は少くして逸衆の才、英覇の器有り、身長八尺、容貌甚だ偉にして、時人焉を異とす。漢末の乱に造い、叔父の{{person:諸葛玄|玄}}に随いて難を{{place:荊州|荊州}}に避け、野に躬耕して、聞達を求めず。時に{{office:左将軍|左将軍}}・{{person:劉備|劉備}}、{{person:諸葛亮|亮}}に殊量有るを以て、乃ち{{person:諸葛亮|亮}}を草廬の中に三顧す、{{person:諸葛亮|亮}}も深く{{person:劉備|備}}の雄姿傑出せるを謂い、遂に帯を解きて誠を写し、厚く相い結納す。{{person:曹操|魏の武帝}}、{{place:荊州|荊州}}に南征するに及び、{{person:劉琮|劉琮}}は州を挙げて質を委ね、而して{{person:劉備|備}}は勢いを失い衆寡なく、立錐の地無し。{{person:諸葛亮|亮}}は時に年二十七、乃ち奇策を建て、身ら{{person:孫権|孫権}}に使いし、援けを{{place:呉郡|呉}}{{place:会稽|会}}に求む。{{person:孫権|権}}は既に宿より{{person:劉備|備}}に服仰し、又た{{person:諸葛亮|亮}}の奇雅なるを観て、甚だ之を敬重し、即ち兵三万を遣わして以て{{person:劉備|備}}を助く。{{perso
