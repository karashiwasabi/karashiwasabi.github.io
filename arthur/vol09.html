  <meta name="apple-mobile-web-app-title" content="アーサー王物語">
  <meta name="theme-color" content="#2c241b">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png?v=3">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    /* =========================================================================
       CSSレイアウト・配色定数（『正史三國志』ブラウン／羊皮紙テーマ完全準拠）
       ========================================================================= */
    :root {
      --bg-header-dark: #2c241b;
      --bg-header-sub: #3d2f1d;
      --bg-parchment: #f4f1ea;
      --bg-card: #fffdf9;
      --border-warm: #dcd3c1;
      --accent-gold: #8c6d46;
      --accent-gold-light: #d4b483;
      --accent-red: #b3392b;
      --text-primary: #261f18;
      --text-muted: #6b5c4c;
      --place-green: #1e6b3b;
      --person-brown: #7c3f12;
      --office-blue: #1e4e79;
      --special-purple: #63317c;
      --desktop-pane-width-pct: 50%;
      --mobile-map-height-pct: 40%;
      --mobile-reader-height-pct: 60%;
      --reader-bottom-safe-px: 48px;
      --z-map-controls: 700;
      --z-map-toast: 720;
      --z-map-modal: 850;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-parchment);
      color: var(--text-primary);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      -webkit-text-size-adjust: 100%;
    }

    .app-shell {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }

    /* 左ペイン：地図＋上部ナビ＋解説モーダル */
    .left-pane {
      position: relative;
      display: flex;
      flex-direction: column;
      width: var(--desktop-pane-width-pct);
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      flex-shrink: 0;
      border-right: 2px solid #bda988;
      background: #dfd7c5;
    }

    #map {
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
    }

    /* 地図上の巻切り替えバー（本家『正史三國志』と同一のスリム1行構成） */
    .vol-nav-bar {
      height: 38px;
      min-height: 38px;
      background: #2c241b;
      color: #f7f1e5;
      border-bottom: 1.5px solid #8c6d46;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      z-index: 2000;
      user-select: none;
      position: relative;
      flex-shrink: 0;
    }
    .home-top-link {
      position: absolute;
      left: 10px;
      background: #3e2723;
      color: #ffe082;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: bold;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }
    .home-top-link:hover { background: #5d4037; color: #fff; }
    .slim-nav-btn {
      background: #4e342e;
      color: #ffd54f;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1.3;
      text-decoration: none;
    }
    .slim-nav-btn:hover:not(:disabled) { background: #6d4c41; color: #fff; }
    .slim-nav-btn:disabled {
      background: transparent;
      color: #6d5d4b;
      border-color: #4e342e;
      cursor: not-allowed;
    }
    .vol-nav-select {
      background: #3e2723;
      color: #f7f1e5;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-family: "Yu Mincho", "MS PMincho", serif;
      letter-spacing: 0.05em;
      min-width: 0;
      max-width: 240px;
    }
    @media (max-width: 520px) {
      .vol-nav-bar { gap: 6px; padding: 0 6px; }
      .home-top-link { position: static; margin-right: auto; padding: 2px 6px; font-size: 0.72rem; }
      .vol-nav-select { max-width: 150px; font-size: 0.8rem; }
    }

    /* 地図右上：[📌 地図固定] ボタン（レイヤーアイコンの左隣） */
    .map-lock-btn {
      position: absolute;
      top: 10px;
      right: 54px;
      z-index: var(--z-map-controls);
      background: rgba(255, 253, 249, 0.95);
      color: var(--text-primary);
      border: 1px solid #a38e6d;
      border-radius: 6px;
      padding: 5px 9px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
      white-space: nowrap;
    }

    .map-lock-btn.is-locked {
      background: var(--accent-red);
      color: #ffffff;
      border-color: #7c1f15;
    }

    /* 地図左下の1行トースト */
    .map-toast {
      position: absolute;
      left: 10px;
      bottom: 18px;
      max-width: calc(100% - 20px);
      z-index: var(--z-map-toast);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(44, 36, 27, 0.94);
      color: #fdf8ee;
      border-left: 3px solid var(--accent-gold-light);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .map-toast.is-visible {
      display: inline-flex;
    }

    .map-toast-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-toast-close {
      background: transparent;
      border: none;
      color: #dfd3be;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }

    /* 自然地形・地名ピンラベル */
    .nature-mtn-label {
      color: #5c4328;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .nature-river-label {
      color: #1f5a8a;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .place-pin-tooltip {
      background: rgba(44, 36, 27, 0.9);
      color: #fffdf8;
      border: 1px solid #d4b483;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .area-badge-label {
      background: rgba(179, 57, 43, 0.84);
      color: #ffffff;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 左ペイン上の解説モーダル（右ペインの読書画面を隠さない） */
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: var(--z-map-modal);
      background: rgba(28, 22, 16, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      max-height: 88%;
      background: var(--bg-card);
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.38);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .modal-header {
      background: var(--bg-header-dark);
      color: #f8f1e4;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .modal-close-btn {
      background: rgba(255,255,255,0.14);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.82rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .homonym-switch-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      padding: 7px 9px;
      background: #f5ede0;
      border: 1px solid #d7c4a3;
      border-radius: 6px;
    }

    .homonym-btn {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #a88d63;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .homonym-btn.is-current {
      background: var(--bg-header-sub);
      color: #ffffff;
      border-color: var(--bg-header-dark);
    }

    .modal-role-badge {
      display: inline-block;
      background: #efe6d5;
      color: #4d3922;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-mapping-note {
      background: #f8f2e7;
      border-left: 3px solid var(--accent-gold);
      padding: 6px 9px;
      font-size: 0.78rem;
      color: #5a4631;
      margin-bottom: 8px;
    }

    .modal-wiki-box {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f4f1ea;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .modal-occ-section {
      margin-top: 12px;
      border-top: 1px solid var(--border-warm);
      padding-top: 9px;
    }

    .modal-occ-heading {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .occ-jump-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .occ-jump-btn {
      background: #fffdf9;
      color: var(--office-blue);
      border: 1px solid #b8c7d9;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .occ-jump-btn:hover {
      background: #eaf2fa;
    }

    /* 右ペイン：ヘッダ＋段落バー＋本文カードスクロール */
    .right-pane {
      width: var(--desktop-pane-width-pct);
      height: 100%;
      min-height: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-parchment);
    }

    .reader-header {
      background: var(--bg-header-dark);
      color: #f6efe2;
      padding: 7px 12px;
      border-bottom: 1px solid #6e5536;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reader-title-group {
      min-width: 0;
    }

    .reader-app-name {
      font-size: 0.72rem;
      color: var(--accent-gold-light);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .reader-vol-title {
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 段落切替コントロールバー */
    .para-bar {
      background: var(--bg-header-sub);
      color: #f3eadb;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
      border-bottom: 1px solid #6e5536;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .para-btn {
      background: rgba(255,255,255,0.12);
      color: #f8f1e4;
      border: 1px solid rgba(212,180,131,0.45);
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .para-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .para-btn.is-active-mode {
      background: var(--accent-gold);
      color: #ffffff;
      border-color: var(--accent-gold-light);
    }

    .para-select {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #b8a382;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      flex: 1 1 130px;
      min-width: 0;
      max-width: 240px;
    }

    /* 手元校正モード専用パネル（本番Webでは非表示） */
    .dev-feedback-panel {
      display: none;
      background: #fdf6e9;
      border-bottom: 2px solid #c9a66b;
      padding: 7px 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    .dev-feedback-panel.is-dev {
      display: block;
    }

    .dev-panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-mini-btn {
      background: #fffdf9;
      border: 1px solid #9c7d4c;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 記事スクロール領域（スマホ下端見切れ防止） */
    .records-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(var(--reader-bottom-safe-px) + env(safe-area-inset-bottom, 0px));
    }

    .record-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      border-left: 4px solid #cbbba0;
      border-radius: 7px;
      padding: 13px 15px;
      margin-bottom: 13px;
      box-shadow: 0 1px 4px rgba(44, 36, 27, 0.06);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .record-card.active-card {
      border-left-color: var(--accent-red);
      box-shadow: 0 2px 10px rgba(179, 57, 43, 0.15);
    }

    .record-card.is-verse {
      background: #fcf8ef;
      border-left-color: var(--accent-gold);
    }

    .card-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .type-badge {
      background: #ebe3d3;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 1px 7px;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .type-badge.verse {
      background: #e9d8b8;
      color: #5b3d14;
    }

    .era-badge {
      color: #6b5c4c;
      font-weight: 600;
    }

    .trans-box {
      font-size: 0.98rem;
      line-height: 1.9;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .record-card.is-verse .trans-box {
      font-style: italic;
      padding-left: 8px;
      border-left: 2px solid #dfd0b4;
    }

    /* 4分類インラインクリックタグ（PROJECT_RULES 第3章1節準拠） */
    .inline-place {
      color: var(--place-green);
      border-bottom: 2px solid var(--place-green);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-person {
      color: var(--person-brown);
      border-bottom: 1.5px dotted var(--person-brown);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-office {
      color: var(--office-blue);
      border-bottom: 1.5px dashed var(--office-blue);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-special {
      color: var(--special-purple);
      border-bottom: 1.5px dotted var(--special-purple);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-place:hover, .inline-person:hover, .inline-office:hover, .inline-special:hover {
      background: rgba(212, 180, 131, 0.22);
    }

    /* 英語底本折りたたみ表示 */
    .source-details {
      margin-top: 10px;
      border-top: 1px dashed var(--border-warm);
      padding-top: 7px;
    }

    .source-details summary {
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
      user-select: none;
    }

    .source-text-body {
      margin-top: 7px;
      padding: 8px 10px;
      background: #f7f3eb;
      border-radius: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      line-height: 1.72;
      color: #33291e;
    }

    /* 手元校正用1クリック指摘ボタン列 */
    .card-dev-bar {
      display: none;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dotted #d7cbb8;
      gap: 5px;
      flex-wrap: wrap;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body.is-dev-mode .card-dev-bar {
      display: flex;
    }

    .dev-flag-btn {
      background: #faf4e8;
      color: #5c472c;
      border: 1px solid #cbb692;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.71rem;
      cursor: pointer;
    }

    .adsense-footer-box {
      margin-top: 18px;
      padding: 10px;
      background: #efeae0;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* スマホ・タブレット縦（横幅900px以下：上40%地図・下60%本文） */
    @media (max-width: 900px) {
      .app-shell {
        flex-direction: column;
      }
      .left-pane {
        width: 100%;
        height: var(--mobile-map-height-pct);
        border-right: none;
        border-bottom: 2px solid #bda988;
      }
      .right-pane {
        width: 100%;
        height: var(--mobile-reader-height-pct);
      }
      .map-lock-btn {
        top: 8px;
        right: 48px;
        padding: 4px 7px;
        font-size: 0.72rem;
      }
    }
    /* 手元校正トレイ：地図右下の折りたたみ式（本家 feedback-tray 準拠） */
    .dev-feedback-panel {
      position: absolute;
      right: 10px;
      bottom: 28px;
      z-index: 1500;
      width: 230px;
      padding: 0;
      border: 1px solid #c9a66b;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .dev-tray-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;

of thy castle, for five days, in the which time thou mayst frame thine answer, and so we may know whether we shall be friends or enemies.\"", "translation": "しかしながら、レオデグランス王のこの礼節ある申し出に対して、リエンス王は心地よい返答を与えようともしなかった。「いや」と彼は言い放った。「レオデグランス王よ、貴殿がわれらの友であるか敵であるかを見極めるまでは、貴殿とともにその城へ入るわけにはまいらぬ。なにしろ今のところ、われらは断じて貴殿と親しき友の間柄ではなく、貴殿の食卓に連なってその塩を口にしたいなどとは露ほども思っておらぬからな。それにまた、貴殿がまずわれらの要求を満たさぬ限り、われらは貴殿の敵以外の何者にもなり得ぬのだ。すなわち、わしが貴殿に要求しているかの所領の数々をわしに引き渡すこと、そしてわがいとこたるノース・アンバーのモーダント公爵に、グィネヴィア姫を妻として差し出すことである。これらの事柄において、われらを貴殿の友とするも敵とするも、すべては貴殿の胸先一つにかかっておる。それゆえ、われらはこれより五日の間、この城の外に留まることとしよう。その間に貴殿は返答を取りまとめるがよい。さすればわれらも、貴殿と友になるか敵になるかを知ることができようというものだ」", "raw_tagged": "But to this courtesy upon the part of {{office:王|King}} {{person:レオデグランス|Leodegrance}}, {{office:王|King}} {{person:リエンス|Ryence}} deigned no pleasing reply. \"Nay,\" quoth he, \"we go not with thee into thy castle, {{office:王|King}} {{person:レオデグランス|Leodegrance}}, until we learn whether thou art our friend or our enemy. For just now we are, certes, no such good friends with thee that we care to sit down at thy table and eat of thy salt. Nor may we be aught but enemies of thine until thou hast first satisfied our demands; to wit, that thou givest to me those lands which I demand of thee and that thou givest unto my cousin, {{office:公爵|Duke}} {{person:モーダント|Mordaunt}} of {{place:ノーサンバーランド|North Umber}}, the Lady {{person:グィネヴィア|Guinevere}} to be his wife. In these matters thou hast it in thy power to make us either thy friends or thine enemies. Wherefore we shall abide here, outside of thy castle, for five days, in the which time thou mayst frame thine answer, and so we may know whether we shall be friends or enemies.\"", "translation_tagged": "しかしながら、{{person:レオデグランス|レオデグランス}}{{office:王|王}}のこの礼節ある申し出に対して、{{person:リエンス|リエンス}}{{office:王|王}}は心地よい返答を与えようともしなかった。「いや」と彼は言い放った。「{{person:レオデグランス|レオデグランス}}{{office:王|王}}よ、貴殿がわれらの友であるか敵であるかを見極めるまでは、貴殿とともにその城へ入るわけにはまいらぬ。なにしろ今のところ、われらは断じて貴殿と親しき友の間柄ではなく、貴殿の食卓に連なってその塩を口にしたいなどとは露ほども思っておらぬからな。それにまた、貴殿がまずわれらの要求を満たさぬ限り、われらは貴殿の敵以外の何者にもなり得ぬのだ。すなわち、わしが貴殿に要求しているかの所領の数々をわしに引き渡すこと、そしてわがいとこたる{{place:ノーサンバーランド|ノース・アンバー}}の{{person:モーダント|モーダント}}{{office:公爵|公爵}}に、{{person:グィネヴィア|グィネヴィア}}姫を妻として差し出すことである。これらの事柄において、われらを貴殿の友とするも敵とするも、すべては貴殿の胸先一つにかかっておる。それゆえ、われらはこれより五日の間、この城の外に留まることとしよう。その間に貴殿は返答を取りまとめるがよい。さすればわれらも、貴殿と友になるか敵になるかを知ることができようというものだ」", "persons": "レオデグランス,リエンス,モーダント,グィネヴィア", "places": "ノーサンバーランド", "offices": "王,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "然而面對雷奧多格蘭王這番殷勤禮數，里恩斯王卻絲毫不屑給予和顏悅色的答覆。「不，」他沉聲道，「雷奧多格蘭王，在我們弄清你究竟是我們的朋友還是敵人之前，我們絕不隨你進入你的城堡。因為眼下我們與你確實算不上什麼莫逆之交，斷無心思坐上你的餐桌、受用你的飲食款待。況且在你先行滿足我們的要求之前，我們除了做你的敵人之外別無可能——那要求便是：將我向你索討的那些領地割讓予我，並將桂妮薇兒小姐嫁予我的表親北安伯的莫當特公爵為妻。在這些事情上，究竟要讓我們成為你的朋友還是敵人，全憑你一念決斷。因此我們將在你的城堡外駐留五日，在此期間你儘管斟酌定奪你的答覆，好叫我們知曉彼此究竟是友是敵。」", "zh_tw_tagged": "然而面對{{person:レオデグランス|雷奧多格蘭}}{{office:王|王}}這番殷勤禮數，{{person:リエンス|里恩斯}}{{office:王|王}}卻絲毫不屑給予和顏悅色的答覆。「不，」他沉聲道，「{{person:レオデグランス|雷奧多格蘭}}{{office:王|王}}，在我們弄清你究竟是我們的朋友還是敵人之前，我們絕不隨你進入你的城堡。因為眼下我們與你確實算不上什麼莫逆之交，斷無心思坐上你的餐桌、受用你的飲食款待。況且在你先行滿足我們的要求之前，我們除了做你的敵人之外別無可能——那要求便是：將我向你索討的那些領地割讓予我，並將{{person:グィネヴィア|桂妮薇兒}}小姐嫁予我的表親{{place:ノーサンバーランド|北安伯}}的{{person:モーダント|莫當特}}{{office:公爵|公爵}}為妻。在這些事情上，究竟要讓我們成為你的朋友還是敵人，全憑你一念決斷。因此我們將在你的城堡外駐留五日，在此期間你儘管斟酌定奪你的答覆，好叫我們知曉彼此究竟是友是敵。」", "zh_cn": "然而面对雷奥多格兰王这番殷勤礼数，里恩斯王却丝毫不屑给予和颜悦色的答复。“不，”他沉声道，“雷奥多格兰王，在我们弄清你究竟是我们的朋友还是敌人之前，我们绝不随你进入你的城堡。因为眼下我们与你确实算不上什么莫逆之交，断无心思坐上你的餐桌、受用你的饮食款待。况且在你先行满足我们的要求之前，我们除了做你的敌人之外别无可能——那要求便是：将我向你索讨的那些领地割让予我，并将桂妮薇儿小姐嫁予我的表亲北安伯的莫当特公爵为妻。在这些事情上，究竟要让我们成为你的朋友还是敌人，全凭你一念决断。因此我们将在你的城堡外驻留五日，在此期间你尽管斟酌定夺你的答复，好叫我们知晓彼此究竟是友是敌。”", "zh_cn_tagged": "然而面对{{person:レオデグランス|雷奥多格兰}}{{office:王|王}}这番殷勤礼数，{{person:リエンス|里恩斯}}{{office:王|王}}却丝毫不屑给予和颜悦色的答复。“不，”他沉声道，“{{person:レオデグランス|雷奥多格兰}}{{office:王|王}}，在我们弄清你究竟是我们的朋友还是敌人之前，我们绝不随你进入你的城堡。因为眼下我们与你确实算不上什么莫逆之交，断无心思坐上你的餐桌、受用你的饮食款待。况且在你先行满足我们的要求之前，我们除了做你的敌人之外别无可能——那要求便是：将我向你索讨的那些领地割让予我，并将{{person:グィネヴィア|桂妮薇儿}}小姐嫁予我的表亲{{place:ノーサンバーランド|北安伯}}的{{person:モーダント|莫当特}}{{office:公爵|公爵}}为妻。在这些事情上，究竟要让我们成为你的朋友还是敌人，全凭你一念决断。因此我们将在你的城堡外驻留五日，在此期间你尽管斟酌定夺你的答复，好叫我们知晓彼此究竟是友是敌。”", "ko": "그러나 레오데그란스 왕이 베푼 이러한 예우에 대하여 리엔스 왕은 조금도 달가운 대답을 내리지 않았다. “아니오,” 하고 그가 말하였다. “레오데그란스 왕이여, 그대가 우리의 벗인지 적인지를 알기 전까지는 그대와 함께 성 안으로 들어가지 않겠소. 지금 당장 우리는 분명 그대의 식탁에 마주 앉아 그대의 소금을 나누어 먹고 싶을 만큼 그대와 좋은 벗이 아니기 때문이오. 또한 그대가 먼저 우리의 요구를 들어주기 전까지는 우리는 그대의 적일 수밖에 없으니, 곧 내가 그대에게 요구하는 저 영지들을 내게 넘겨주고, 내 사촌인 노스엄버의 모던트 공작에게 기네비어 아가씨를 아내로 내어 주는 일이오. 이 문제들에 있어서 우리를 그대의 벗으로 만들지 적으로 만들지는 오롯이 그대의 손에 달려 있소. 그러므로 우리는 닷새 동안 그대의 성 밖 이곳에 머무를 터이니, 그사이에 그대는 대답을 마련하도록 하시오. 그리하면 우리가 서로 벗이 될지 적이 될지 알 수 있을 것이오.”", "ko_tagged": "그러나 {{person:レオデグランス|레오데그란스}} {{office:王|왕}}이 베푼 이러한 예우에 대하여 {{person:リエンス|리엔스}} {{office:王|왕}}은 조금도 달가운 대답을 내리지 않았다. “아니오,” 하고 그가 말하였다. “{{person:レオデグランス|레오데그란스}} {{office:王|왕}}이여, 그대가 우리의 벗인지 적인지를 알기 전까지는 그대와 함께 성 안으로 들어가지 않겠소. 지금 당장 우리는 분명 그대의 식탁에 마주 앉아 그대의 소금을 나누어 먹고 싶을 만큼 그대와 좋은 벗이 아니기 때문이오. 또한 그대가 먼저 우리의 요구를 들어주기 전까지는 우리는 그대의 적일 수밖에 없으니, 곧 내가 그대에게 요구하는 저 영지들을 내게 넘겨주고, 내 사촌인 {{place:ノーサンバーランド|노스엄버}}의 {{person:モーダント|모던트}} {{office:公爵|공작}}에게 {{person:グィネヴィア|기네비어}} 아가씨를 아내로 내어 주는 일이오. 이 문제들에 있어서 우리를 그대의 벗으로 만들지 적으로 만들지는 오롯이 그대의 손에 달려 있소. 그러므로 우리는 닷새 동안 그대의 성 밖 이곳에 머무를 터이니, 그사이에 그대는 대답을 마련하도록 하시오. 그리하면 우리가 서로 벗이 될지 적이 될지 알 수 있을 것이오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p4_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 4, "type": "本文", "raw_text": "\"And in the meantime,\" quoth Duke Mordaunt of North Umber, \"I do hold myself ready for to contest my right unto the hand of the Lady Guinevere with any knight of thy Court who hath a mind to deny my just title thereto; and if thou hast no knight in all thy Court who can successfully assay a bout of arms with me, thou thyself canst hardly hope to succeed in defending thyself against that great army of knights whom King Ryence hath gathered together to bring against thee in case thou denyest us that which we ask.\"", "translation": "「そしてその五日の間」とノース・アンバーのモーダント公爵が言葉をついだ。「それがしは、グィネヴィア姫の手を勝ち得るわが正当なる権利を否もうとする心づもりのある者が貴殿の宮廷の騎士のうちにおるならば、そのいかなる者とも武をもって己が権利を競い争う覚悟で控えておる。そしてもし、貴殿の宮廷の隅々を探しても、それがしと武芸の立ち合いを試みて見事打ち勝てるだけの騎士がただの一人もおらぬというのであれば、われらの求めるものを貴殿が拒んだ暁にリエンス王が貴殿を討つべく糾合して差し向けるであろうあの騎士たちの大軍を相手に、貴殿自身がわが身を守り抜くことなど到底望むべくもあるまいぞ」", "raw_tagged": "\"And in the meantime,\" quoth {{office:公爵|Duke}} {{person:モーダント|Mordaunt}} of {{place:ノーサンバーランド|North Umber}}, \"I do hold myself ready for to contest my right unto the hand of the Lady {{person:グィネヴィア|Guinevere}} with any {{office:騎士|knight}} of thy Court who hath a mind to deny my just title thereto; and if thou hast no {{office:騎士|knight}} in all thy Court who can successfully assay a bout of arms with me, thou thyself canst hardly hope to succeed in defending thyself against that great army of {{office:騎士|knights}} whom {{office:王|King}} {{person:リエンス|Ryence}} hath gathered together to bring against thee in case thou denyest us that which we ask.\"", "translation_tagged": "「そしてその五日の間」と{{place:ノーサンバーランド|ノース・アンバー}}の{{person:モーダント|モーダント}}{{office:公爵|公爵}}が言葉をついだ。「それがしは、{{person:グィネヴィア|グィネヴィア}}姫の手を勝ち得るわが正当なる権利を否もうとする心づもりのある者が貴殿の宮廷の{{office:騎士|騎士}}のうちにおるならば、そのいかなる者とも武をもって己が権利を競い争う覚悟で控えておる。そしてもし、貴殿の宮廷の隅々を探しても、それがしと武芸の立ち合いを試みて見事打ち勝てるだけの{{office:騎士|騎士}}がただの一人もおらぬというのであれば、われらの求めるものを貴殿が拒んだ暁に{{person:リエンス|リエンス}}{{office:王|王}}が貴殿を討つべく糾合して差し向けるであろうあの{{office:騎士|騎士}}たちの大軍を相手に、貴殿自身がわが身を守り抜くことなど到底望むべくもあるまいぞ」", "persons": "モーダント,グィネヴィア,リエンス", "places": "ノーサンバーランド", "offices": "公爵,騎士,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「而在此期間，」北安伯的莫當特公爵接口說道，「倘若你宮廷中有任何一名騎士有意否認我迎娶桂妮薇兒小姐的正當名分，我隨時準備好與他比武較量，以捍衛我的權利；倘若你滿朝上下竟找不出半個能夠與我交鋒而取勝的騎士，那麼一旦你拒絕我們所求之事，面對里恩斯王早已集結妥當、準備揮師討伐你的那支龐大騎士大軍，你自己也休想指望能夠守得住自身周全。」", "zh_tw_tagged": "「而在此期間，」{{place:ノーサンバーランド|北安伯}}的{{person:モーダント|莫當特}}{{office:公爵|公爵}}接口說道，「倘若你宮廷中有任何一名{{office:騎士|騎士}}有意否認我迎娶{{person:グィネヴィア|桂妮薇兒}}小姐的正當名分，我隨時準備好與他比武較量，以捍衛我的權利；倘若你滿朝上下竟找不出半個能夠與我交鋒而取勝的{{office:騎士|騎士}}，那麼一旦你拒絕我們所求之事，面對{{person:リエンス|里恩斯}}{{office:王|王}}早已集結妥當、準備揮師討伐你的那支龐大{{office:騎士|騎士}}大軍，你自己也休想指望能夠守得住自身周全。」", "zh_cn": "“而在此期间，”北安伯的莫当特公爵接口说道，“倘若你宫廷中有任何一名骑士有意否认我迎娶桂妮薇儿小姐的正当名分，我随时准备好与他比武较量，以捍卫我的权利；倘若你满朝上下竟找不出半个能够与我交锋而取胜的骑士，那么一旦你拒绝我们所求之事，面对里恩斯王早已集结妥当、准备挥师讨伐你的那支庞大骑士大军，你自己也休想指望能够守得住自身周全。”", "zh_cn_tagged": "“而在此期间，”{{place:ノーサンバーランド|北安伯}}的{{person:モーダント|莫当特}}{{office:公爵|公爵}}接口说道，“倘若你宫廷中有任何一名{{office:騎士|骑士}}有意否认我迎娶{{person:グィネヴィア|桂妮薇儿}}小姐的正当名分，我随时准备好与他比武较量，以捍卫我的权利；倘若你满朝上下竟找不出半个能够与我交锋而取胜的{{office:騎士|骑士}}，那么一旦你拒绝我们所求之事，面对{{person:リエンス|里恩斯}}{{office:王|王}}早已集结妥当、准备挥师讨伐你的那支庞大{{office:騎士|骑士}}大军，你自己也休想指望能够守得住自身周全。”", "ko": "“그리고 그 기간 동안,” 하고 노스엄버의 모던트 공작이 덧붙여 말하였다. “그대의 궁정에 속한 어떤 기사라도 기네비어 아가씨와 혼인할 나의 정당한 권리를 부정할 마음이 있다면, 나는 언제든지 그와 무예로 내 권리를 겨룰 준비를 갖추고 있겠소. 만일 그대의 온 궁정을 통틀어 나와 무예를 겨루어 승리를 거둘 만한 기사가 단 한 사람도 없다면, 그대가 우리의 요구를 거절할 경우 리엔스 왕께서 그대를 치기 위하여 이미 불러 모아 둔 저 거대한 기사들의 대군에 맞서 그대 스스로 몸을 지켜 내기란 도저히 바랄 수 없을 것이오.”", "ko_tagged": "“그리고 그 기간 동안,” 하고 {{place:ノーサンバーランド|노스엄버}}의 {{person:モーダント|모던트}} {{office:公爵|공작}}이 덧붙여 말하였다. “그대의 궁정에 속한 어떤 {{office:騎士|기사}}라도 {{person:グィネヴィア|기네비어}} 아가씨와 혼인할 나의 정당한 권리를 부정할 마음이 있다면, 나는 언제든지 그와 무예로 내 권리를 겨룰 준비를 갖추고 있겠소. 만일 그대의 온 궁정을 통틀어 나와 무예를 겨루어 승리를 거둘 만한 {{office:騎士|기사}}가 단 한 사람도 없다면, 그대가 우리의 요구를 거절할 경우 {{person:リエンス|리엔스}} {{office:王|왕}}께서 그대를 치기 위하여 이미 불러 모아 둔 저 거대한 {{office:騎士|기사}}들의 대군에 맞서 그대 스스로 몸을 지켜 내기란 도저히 바랄 수 없을 것이오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p5_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 5, "type": "本文", "raw_text": "Then was King Leodegrance exceedingly cast down in his spirits, for he feared those proud lords and he wist not what to say in answer to them. Wherefore he turned and walked back into his castle again, beset with great anxiety and sorrow of spirit. And King Ryence, and Duke Mordaunt and their Court of lords and knights pitched their pavilions in those meadows over against the castle, so that the plain was entirely covered with those pavilions. And there they took up their inn with great rejoicing and with the sound of feasting and singing and merry-making, for it was an exceeding noble Court King Ryence had gathered about him.", "translation": "これを聞いてレオデグランス王は甚だしく意気消沈してしまった。というのも、王はかの傲慢な諸侯らを恐れるあまり、彼らに対して何と答えてよいものか皆目わからなかったからである。それゆえ王は踵を返し、深き不安と心の悲しみに打ちひしがれながら、ふたたびおのれの城内へと歩み戻っていった。一方、リエンス王とモーダント公爵、ならびに諸侯や騎士たちからなるその宮廷の一行は、城の真正面に広がるかの牧草地に天幕を張り巡らせたので、平野はそれらの天幕によってすっかり埋め尽くされるほどであった。そして彼らはその場所に宿営を構えると、大いなる歓声を上げ、酒宴や歌声や陽気な騒ぎの音を響き渡らせた。まことリエンス王がおのれの周囲に集めていたのは、類まれなほど豪奢で名門揃いの宮廷であったからである。", "raw_tagged": "Then was {{office:王|King}} {{person:レオデグランス|Leodegrance}} exceedingly cast down in his spirits, for he feared those proud lords and he wist not what to say in answer to them. Wherefore he turned and walked back into his castle again, beset with great anxiety and sorrow of spirit. And {{office:王|King}} {{person:リエンス|Ryence}}, and {{office:公爵|Duke}} {{person:モーダント|Mordaunt}} and their Court of lords and {{office:騎士|knights}} pitched their pavilions in those meadows over against the castle, so that the plain was entirely covered with those pavilions. And there they took up their inn with great rejoicing and with the sound of feasting and singing and merry-making, for it was an exceeding noble Court {{office:王|King}} {{person:リエンス|Ryence}} had gathered about him.", "translation_tagged": "これを聞いて{{person:レオデグランス|レオデグランス}}{{office:王|王}}は甚だしく意気消沈してしまった。というのも、王はかの傲慢な諸侯らを恐れるあまり、彼らに対して何と答えてよいものか皆目わからなかったからである。それゆえ王は踵を返し、深き不安と心の悲しみに打ちひしがれながら、ふたたびおのれの城内へと歩み戻っていった。一方、{{person:リエンス|リエンス}}{{office:王|王}}と{{person:モーダント|モーダント}}{{office:公爵|公爵}}、ならびに諸侯や{{office:騎士|騎士}}たちからなるその宮廷の一行は、城の真正面に広がるかの牧草地に天幕を張り巡らせたので、平野はそれらの天幕によってすっかり埋め尽くされるほどであった。そして彼らはその場所に宿営を構えると、大いなる歓声を上げ、酒宴や歌声や陽気な騒ぎの音を響き渡らせた。まこと{{person:リエンス|リエンス}}{{office:王|王}}がおのれの周囲に集めていたのは、類まれなほど豪奢で名門揃いの宮廷であったからである。", "persons": "レオデグランス,リエンス,モーダント", "places": "", "offices": "王,公爵,騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "聽聞此言，雷奧多格蘭王心中萬分沮喪消沉，因為他畏懼那些驕橫傲慢的王侯，一時不知該如何出言作答。於是他只得轉過身去，懷著滿腔深重的憂慮與悲戚，黯然步回自己的城堡之中。而里恩斯王與莫當特公爵，連同他們麾下眾貴族與騎士所組成的宮廷隨從，便在正對著城堡的那片草地上支起座座營帳，整片平原頓時被連綿帳幕遮蓋得滿滿當當。他們就在那裡安營下榻，大肆歡慶，到處迴盪著設宴飲酒、引吭高歌與縱情取樂的喧鬧聲，蓋因里恩斯王聚攏在自己身邊的，著實是一支極為顯貴奢華的宮廷隊伍。", "zh_tw_tagged": "聽聞此言，{{person:レオデグランス|雷奧多格蘭}}{{office:王|王}}心中萬分沮喪消沉，因為他畏懼那些驕橫傲慢的王侯，一時不知該如何出言作答。於是他只得轉過身去，懷著滿腔深重的憂慮與悲戚，黯然步回自己的城堡之中。而{{person:リエンス|里恩斯}}{{office:王|王}}與{{person:モーダント|莫當特}}{{office:公爵|公爵}}，連同他們麾下眾貴族與{{office:騎士|騎士}}所組成的宮廷隨從，便在正對著城堡的那片草地上支起座座營帳，整片平原頓時被連綿帳幕遮蓋得滿滿當當。他們就在那裡安營下榻，大肆歡慶，到處迴盪著設宴飲酒、引吭高歌與縱情取樂的喧鬧聲，蓋因{{person:リエンス|里恩斯}}{{office:王|王}}聚攏在自己身邊的，著實是一支極為顯貴奢華的宮廷隊伍。", "zh_cn": "听闻此言，雷奥多格兰王心中万分沮丧消沉，因为他畏惧那些骄横傲慢的王侯，一时不知该如何出言作答。于是他只得转过身去，怀着满腔深重的忧虑与悲戚，黯然步回自己的城堡之中。而里恩斯王与莫当特公爵，连同他们麾下众贵族与骑士所组成的宫廷随从，便在正对着城堡的那片草地上支起座座营帐，整片平原顿时被连绵帐幕遮盖得满满当当。他们就在那里安营下榻，大肆欢庆，到处回荡着设宴饮酒、引吭高歌与纵情取乐的喧闹声，盖因里恩斯王聚拢在自己身边的，着实是一支极为显贵奢华的宫廷队伍。", "zh_cn_tagged": "听闻此言，{{person:レオデグランス|雷奥多格兰}}{{office:王|王}}心中万分沮丧消沉，因为他畏惧那些骄横傲慢的王侯，一时不知该如何出言作答。于是他只得转过身去，怀着满腔深重的忧虑与悲戚，黯然步回自己的城堡之中。而{{person:リエンス|里恩斯}}{{office:王|王}}与{{person:モーダント|莫当特}}{{office:公爵|公爵}}，连同他们麾下众贵族与{{office:騎士|骑士}}所组成的宫廷随从，便在正对着城堡的那片草地上支起座座营帐，整片平原顿时被连绵帐幕遮盖得满满当当。他们就在那里安营下榻，大肆欢庆，到处回荡着设宴饮酒、引吭高歌与纵情取乐的喧闹声，盖因{{person:リエンス|里恩斯}}{{office:王|王}}聚拢在自己身边的，着实是一支极为显贵奢华的宫廷队伍。", "ko": "이 말을 들은 레오데그란스 왕은 마음이 한없이 무너져 내렸는데, 저 오만한 군주들이 두려운 나머지 그들에게 무슨 말로 답해야 할지 도무지 알 수 없었기 때문이다. 그리하여 그는 깊은 불안과 마음의 슬픔에 사로잡힌 채 발길을 돌려 다시 자기 성 안으로 걸어 들어갔다. 한편 리엔스 왕과 모던트 공작 및 영주들과 기사들로 이루어진 그들의 궁정 일행은 성을 마주 보는 저 초원 위에 천막들을 쳐서, 드넓은 들판이 온통 그 천막들로 뒤덮일 지경이었다. 그리고 그들은 그곳에 숙소를 정하고 크게 기뻐하며 연회와 노랫소리와 흥겨운 잔치 소리를 드높였으니, 실로 리엔스 왕이 자기 주위에 불러 모은 궁정 무리는 비할 데 없이 화려하고도 귀족적인 집단이었기 때문이다.", "ko_tagged": "이 말을 들은 {{person:レオデグランス|레오데그란스}} {{office:王|왕}}은 마음이 한없이 무너져 내렸는데, 저 오만한 군주들이 두려운 나머지 그들에게 무슨 말로 답해야 할지 도무지 알 수 없었기 때문이다. 그리하여 그는 깊은 불안과 마음의 슬픔에 사로잡힌 채 발길을 돌려 다시 자기 성 안으로 걸어 들어갔다. 한편 {{person:リエンス|리엔스}} {{office:王|왕}}과 {{person:モーダント|모던트}} {{office:公爵|공작}} 및 영주들과 {{office:騎士|기사}}들로 이루어진 그들의 궁정 일행은 성을 마주 보는 저 초원 위에 천막들을 쳐서, 드넓은 들판이 온통 그 천막들로 뒤덮일 지경이었다. 그리고 그들은 그곳에 숙소를 정하고 크게 기뻐하며 연회와 노랫소리와 흥겨운 잔치 소리를 드높였으니, 실로 {{person:リエンス|리엔스}} {{office:王|왕}}이 자기 주위에 불러 모은 궁정 무리는 비할 데 없이 화려하고도 귀족적인 집단이었기 때문이다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p6_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 6, "type": "本文", "raw_text": "And when the next morning had come Duke Mordaunt of North Umber went forth clad all in armor of proof. And he rode up and down the field before the castle and gave great challenge to those within; daring any knight to come forth for to meet him in knightly encounter. \"Ho!\" he cried, \"how now, ye Knights of Cameliard! Is there no one to come forth to meet me? How then may ye hope to contend with the Knights of North Wales, an ye fear to meet with one single Knight from North Umber?\" So he scoffed at them in his pride, and none dared to come forth from Cameliard against him. For the Duke of North Umber was one of the most famous knights of his day, and one of exceeding strength and success at arms, and there was now, in these times of peace, no one of King Leodegrance's Court who was at all able to face a warrior of his approved skill and valor. Wherefore, no one took up that challenge which the Duke of North Umber gave to the Court of Cameliard. Meantime many people gathered upon the walls of Cameliard and gazed down therefrom upon that proud and haughty duke, all bedight in his splendid armor, and all were grieved and ashamed that there was no one in that peaceful town to go out against him. And all the lords and knights of King Ryence's Court came and stood in front of the King's pavilion and laughed and clapped their hands together, and cheered Duke Mordaunt, as he so rode up and down before them. And the greater they were expanded with mirth, the more abashed were the people of Cameliard. \"Ho! Ho!\" cried that proud Duke. \"How now! Will no one come forth to meet me? How then may ye of Cameliard hope to face the King of North Wales and all his knightly array of which I am but one man?\" And the people of Cameliard, gathered upon the walls, listened to him with shame and sorrow.", "translation": "そして翌朝を迎えると、ノース・アンバーのモーダント公爵は鍛え抜かれた堅牢な甲冑に全身を固めて陣頭へと乗り出した。彼は城前の野を行きつ戻りつ馬を駆けさせ、城内の者どもに向かって声高に挑戦を突きつけ、騎士としての正々堂々たる一騎打ちで自分と相まみえるべく出てこいと、いかなる騎士に対しても挑発したのである。「おうい！」と彼は大音声で呼ばわった。「どうしたのだ、カミリアードの騎士どもよ！　それがしと立ち合うために出てくる者は誰一人おらぬのか？　ノース・アンバーから来たただ一人の騎士と刃を交えることすら恐れるようでは、どうして北ウェールズの騎士たちと渡り合うことなど望めようぞ！」かくも彼は思い上がった高慢さのままに城内の者たちを嘲り笑ったが、カミリアードからは誰一人として彼に立ち向かうべく進み出る勇気のある者はいなかった。というのも、ノース・アンバーの公爵といえば当時もっとも名高い騎士の一人であり、並外れた膂力と武勲を誇る猛者であって、うち続く泰平の世にあった今、レオデグランス王の宮廷には、これほどまでに技量と武勇の折り紙付きの剛の者と真っ向から対峙し得る者は皆無だったからである。それゆえ、ノース・アンバーの公爵がカミリアードの宮廷に叩きつけたその挑戦を受けて立つ者は一人も現れなかった。その間にも、カミリアードの城壁の上にはおびただしい数の人々が集まり、見事な甲冑に身を装ったかの誇り高く傲岸不遜な公爵の姿を上からじっと見下ろしていたが、この平和な町に彼を迎え撃つべく打って出る者が誰一人いないことを、みな深く嘆き悲しみ、また恥じ入るのであった。一方で、リエンス王の宮廷の諸侯や騎士たちはことごとく王の天幕の前に出て立ち並び、彼らの眼前をそうして馬で往復するモーダント公爵に向かって高笑いし、手を打ち鳴らして盛んに歓声を送った。そして彼らが上機嫌に笑い興じれば興じるほど、カミリアードの人々はいよいよ肩身の狭い恥ずかしさに打ち沈むのであった。「ほう、ほう！」と、かの傲慢な公爵は叫んだ。「どうしたというのだ！　誰一人としてそれがしの相手をしに出てくる者はおらぬのか？　このわしとてその中の一人にすぎぬというのに、それでどうして貴様らカミリアードの者どもが、北ウェールズの王とその全軍の騎士団に立ち向かうことなど望めようか！」城壁の上に集まったカミリアードの民は、恥辱と悲しみに胸を締めつけられながらその言葉に耳を傾けていた。", "raw_tagged": "And when the next morning had come {{office:公爵|Duke}} {{person:モーダント|Mordaunt}} of {{place:ノーサンバーランド|North Umber}} went forth clad all in armor of proof. And he rode up and down the field before the castle and gave great challenge to those within; daring any {{office:騎士|knight}} to come forth for to meet him in knightly encounter. \"Ho!\" he cried, \"how now, ye {{office:騎士|Knights}} of {{special:カミリアード|Cameliard}}! Is there no one to come forth to meet me? How then may ye hope to contend with the {{office:騎士|Knights}} of {{place:ウェールズ|North Wales}}, an ye fear to meet with one single {{office:騎士|Knight}} from {{place:ノーサンバーランド|North Umber}}?\" So he scoffed at them in his pride, and none dared to come forth from {{special:カミリアード|Cameliard}} against him. For the {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}} was one of the most famous {{office:騎士|kni t the Duke of North Umber rode up and down so proudly before the castle walls. So, of a sudden, it came to him that he could not abide this any longer. Wherefore he laid aside his spade and went out secretly by a postern way, and so up into the town.", "translation": "さて、この間ずっとアーサー王は庭園で土を掘っていたが、それでもなお、外で起きている一部始終や、かのノース・アンバーの公爵が城壁の前でいかにも誇らしげに馬を乗り回している様子をしかと承知していた。するとにわかに、これ以上この有様を黙って見過ごすことは到底できぬという思いが王の胸中に湧き起こった。そこで王は手にしていた鋤を脇に置き、裏門の抜け道から人知れず外へ出ると、そのまま城下の町へと上っていったのである。", "raw_tagged": "Now all this while {{office:王|King}} {{person:アーサー|Arthur}} digged in the garden; but, nevertheless, he was well aware of everything that passed and of how that the {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}} rode up and down so proudly before the castle walls. So, of a sudden, it came to him that he could not abide this any longer. Wherefore he laid aside his spade and went out secretly by a postern way, and so up into the town.", "translation_tagged": "さて、この間ずっと{{person:アーサー|アーサー}}{{office:王|王}}は庭園で土を掘っていたが、それでもなお、外で起きている一部始終や、かの{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}が城壁の前でいかにも誇らしげに馬を乗り回している様子をしかと承知していた。するとにわかに、これ以上この有様を黙って見過ごすことは到底できぬという思いが王の胸中に湧き起こった。そこで王は手にしていた鋤を脇に置き、裏門の抜け道から人知れず外へ出ると、そのまま城下の町へと上っていったのである。", "persons": "アーサー", "places": "ノーサンバーランド", "offices": "王,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "話說在此期間，亞瑟王一直在花園裡掘土勞作；儘管如此，他對外面發生的一切，以及那位北安伯公爵如何在城牆前趾高氣揚地來回策馬挑釁的情形，全都瞭然於胸。陡然之間，他心頭湧起一股念頭，覺得自己再也無法容忍這般景象繼續下去。於是他放下手中的鐵鍬，悄悄從一道偏門小徑潛出城堡，徑直往城鎮裡走去。", "zh_tw_tagged": "話說在此期間，{{person:アーサー|亞瑟}}{{office:王|王}}一直在花園裡掘土勞作；儘管如此，他對外面發生的一切，以及那位{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}如何在城牆前趾高氣揚地來回策馬挑釁的情形，全都瞭然於胸。陡然之間，他心頭湧起一股念頭，覺得自己再也無法容忍這般景象繼續下去。於是他放下手中的鐵鍬，悄悄從一道偏門小徑潛出城堡，徑直往城鎮裡走去。", "zh_cn": "话说在此期间，亚瑟王一直在花园里掘土劳作；尽管如此，他对外面发生的一切，以及那位北安伯公爵如何在城墙前趾高气扬地来回策马挑衅的情形，全都了然于胸。陡然之间，他心头涌起一股念头，觉得自己再也无法容忍这般景象继续下去。于是他放下手中的铁锹，悄悄从一道偏门小径潜出城堡，径直往城镇里走去。", "zh_cn_tagged": "话说在此期间，{{person:アーサー|亚瑟}}{{office:王|王}}一直在花园里掘土劳作；尽管如此，他对外面发生的一切，以及那位{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}如何在城墙前趾高气扬地来回策马挑衅的情形，全都了然于胸。陡然之间，他心头涌起一股念头，觉得自己再也无法容忍这般景象继续下去。于是他放下手中的铁锹，悄悄从一道偏门小径潜出城堡，径直往城镇里走去。", "ko": "한편 이 모든 일이 벌어지는 동안 내내 아서 왕은 정원에서 땅을 파고 있었으나, 그럼에도 바깥에서 돌아가는 모든 사정과 저 노스엄버 공작이 성벽 앞을 얼마나 거만하게 말 타고 오가는지를 속속들이 잘 알고 있었다. 그러자 문득 더 이상은 이 꼴을 도저히 참아 넘길 수 없다는 생각이 그의 마음속에 치밀어 올랐다. 그리하여 그는 손에 들었던 삽을 한쪽에 내려놓고 쪽문 샛길을 통해 남몰래 빠져나가, 곧장 성하의 고을 안으로 올라갔다.", "ko_tagged": "한편 이 모든 일이 벌어지는 동안 내내 {{person:アーサー|아서}} {{office:王|왕}}은 정원에서 땅을 파고 있었으나, 그럼에도 바깥에서 돌아가는 모든 사정과 저 {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}이 성벽 앞을 얼마나 거만하게 말 타고 오가는지를 속속들이 잘 알고 있었다. 그러자 문득 더 이상은 이 꼴을 도저히 참아 넘길 수 없다는 생각이 그의 마음속에 치밀어 올랐다. 그리하여 그는 손에 들었던 삽을 한쪽에 내려놓고 쪽문 샛길을 통해 남몰래 빠져나가, 곧장 성하의 고을 안으로 올라갔다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p8_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 8, "type": "本文", "raw_text": "Now there was in Cameliard an exceedingly rich merchant, by name Ralph of Cardiff, and the renown of his possessions and his high estate had reached even unto King Arthur's ears at Carleon. Accordingly it was unto his house that King Arthur directed his steps.", "translation": "さて、ここカミリアードの町には、カーディフのラルフという名の大層裕福な商人が暮らしており、その莫大な財宝と格式高い暮らしぶりの評判は、遠くカーレオンにあったアーサー王の耳にまで届いていたほどであった。それゆえ、アーサー王が足を進めた先は、ほかならぬこの商人の屋敷であった。", "raw_tagged": "Now there was in {{special:カミリアード|Cameliard}} an exceedingly rich merchant, by name {{person:ラルフ|Ralph}} of {{place:カーディフ|Cardiff}}, and the renown of his possessions and his high estate had reached even unto {{office:王|King}} {{person:アーサー|Arthur}}'s ears at {{place:カーレオン|Carleon}}. Accordingly it was unto his house that {{office:王|King}} {{person:アーサー|Arthur}} directed his steps.", "translation_tagged": "さて、ここ{{special:カミリアード|カミリアード}}の町には、{{place:カーディフ|カーディフ}}の{{person:ラルフ|ラルフ}}という名の大層裕福な商人が暮らしており、その莫大な財宝と格式高い暮らしぶりの評判は、遠く{{place:カーレオン|カーレオン}}にあった{{person:アーサー|アーサー}}{{office:王|王}}の耳にまで届いていたほどであった。それゆえ、{{person:アーサー|アーサー}}{{office:王|王}}が足を進めた先は、ほかならぬこの商人の屋敷であった。", "persons": "ラルフ,アーサー", "places": "カーディフ,カーレオン", "offices": "王", "era_year": "伝説時代", "keywords": "カミリアード", "is_enriched": true, "zh_tw": "原來在卡米利亞德城裡住著一位極其富有的商人，名叫卡地夫的拉爾夫，他那萬貫家財與顯赫排場的盛名，甚至遠傳到了身在卡利恩的亞瑟王耳中。因此，亞瑟王邁步前往的正是這位富商的宅邸。", "zh_tw_tagged": "原來在{{special:カミリアード|卡米利亞德}}城裡住著一位極其富有的商人，名叫{{place:カーディフ|卡地夫}}的{{person:ラルフ|拉爾夫}}，他那萬貫家財與顯赫排場的盛名，甚至遠傳到了身在{{place:カーレオン|卡利恩}}的{{person:アーサー|亞瑟}}{{office:王|王}}耳中。因此，{{person:アーサー|亞瑟}}{{office:王|王}}邁步前往的正是這位富商的宅邸。", "zh_cn": "原来在卡米利亚德城里住着一位极其富有的商人，名叫卡迪夫的拉尔夫，他那万贯家财与显赫排场的盛名，甚至远传到了身在卡利恩的亚瑟王耳中。因此，亚瑟王迈步前往的正是这位富商的宅邸。", "zh_cn_tagged": "原来在{{special:カミリアード|卡米利亚德}}城里住着一位极其富有的商人，名叫{{place:カーディフ|卡迪夫}}的{{person:ラルフ|拉尔夫}}，他那万贯家财与显赫排场的盛名，甚至远传到了身在{{place:カーレオン|卡利恩}}的{{person:アーサー|亚瑟}}{{office:王|王}}耳中。因此，{{person:アーサー|亚瑟}}{{office:王|王}}迈步前往的正是这位富商的宅邸。", "ko": "그런데 카밀리아드에는 카디프의 랠프라 불리는 대단히 부유한 상인이 살고 있었는데, 그가 지닌 막대한 재산과 드높은 지위에 관한 명성은 멀리 칼리언에 있던 아서 왕의 귀에까지 들려올 정도였다. 그리하여 아서 왕이 발걸음을 향한 곳은 바로 그 상인의 저택이었다.", "ko_tagged": "그런데 {{special:カミリアード|카밀리아드}}에는 {{place:カーディフ|카디프}}의 {{person:ラルフ|랠프}}라 불리는 대단히 부유한 상인이 살고 있었는데, 그가 지닌 막대한 재산과 드높은 지위에 관한 명성은 멀리 {{place:カーレオン|칼리언}}에 있던 {{person:アーサー|아서}} {{office:王|왕}}의 귀에까지 들려올 정도였다. 그리하여 {{person:アーサー|아서}} {{office:王|왕}}이 발걸음을 향한 곳은 바로 그 상인의 저택이었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p9_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 9, "type": "本文", "raw_text": "And while he was in a narrow way, not far from the merchant's house, he took off his magic cap of disguise and assumed somewhat of his noble appearance once more, for he was now of a mind to show his knightliness unto those who looked upon him. Accordingly, when he stood before the rich merchant in his closet, and when the merchant looked up into his face, he wist not what to think to behold so noble a lord clad all in frieze. For though King Arthur was a stranger to the good man, so that he knew not his countenance, yet that merchant wist that he was no ordinary knight, but that he must assuredly be one of high degree and in authority, even though he was clad in frieze.", "translation": "そして商人の屋敷からほど近い狭い路地に入ったところで、王は変装のための魔法の帽子を脱ぎ取り、ふたたび本来のおのれの気高い風貌をいくばくか取り戻された。というのも、今や王には、自らを目にする者たちに対しておのれの騎士としての品格を示そうというお心があったからである。かくして、王が内室にてその裕福な商人の前に進み出て立ち、商人が顔を上げて王の顔を見つめたとき、商人は全身粗末な羅紗をまとったままこれほどまでに高貴な貴人が立っているのを目にして、いったいどう受け止めたものか見当もつかなかった。なぜなら、この善良な商人にとってアーサー王は見知らぬ人物であり、その面差しに見覚えこそなかったものの、それでも商人には、眼前の人物が並大抵の騎士などではなく、たとえ粗末な羅紗の服を着ていようとも、間違いなく高き身分と威権を備えた貴人に相違ないと一目で見て取れたからである。", "raw_tagged": "And while he was in a narrow way, not far from the merchant's house, he took off his {{special:魔法|magic}} cap of disguise and assumed somewhat of his noble appearance once more, for he was now of a mind to show his knightliness unto those who looked upon him. Accordingly, when he stood before the rich merchant in his closet, and when the merchant looked up into his face, he wist not what to think to behold so noble a lord clad all in frieze. For though {{office:王|King}} {{person:アーサー|Arthur}} was a stranger to the good man, so that he knew not his countenance, yet that merchant wist that he was no ordinary {{office:騎士|knight}}, but that he must assuredly be one of high degree and in authority, even though he was clad in frieze.", "translation_tagged": "そして商人の屋敷からほど近い狭い路地に入ったところで、王は変装のための{{special:魔法|魔法}}の帽子を脱ぎ取り、ふたたび本来のおのれの気高い風貌をいくばくか取り戻された。というのも、今や王には、自らを目にする者たちに対しておのれの騎士としての品格を示そうというお心があったからである。かくして、王が内室にてその裕福な商人の前に進み出て立ち、商人が顔を上げて王の顔を見つめたとき、商人は全身粗末な羅紗をまとったままこれほどまでに高貴な貴人が立っているのを目にして、いったいどう受け止めたものか見当もつかなかった。なぜなら、この善良な商人にとって{{person:アーサー|アーサー}}{{office:王|王}}は見知らぬ人物であり、その面差しに見覚えこそなかったものの、それでも商人には、眼前の人物が並大抵の{{office:騎士|騎士}}などではなく、たとえ粗末な羅紗の服を着ていようとも、間違いなく高き身分と威権を備えた貴人に相違ないと一目で見て取れたからである。", "persons": "アーサー", "places": "", "offices": "王,騎士", "era_year": "伝説時代", "keywords": "魔法", "is_enriched": true, "zh_tw": "當他走到離那富商宅邸不遠的一條窄巷時，便摘下了頭上那頂魔法喬裝帽，重新顯露出幾分原本尊貴威儀的容貌，因為此刻他已有心要在旁人面前展現自己堂堂的騎士氣度。因此，當他在內室裡站到那位富商面前，而富商抬頭望見他的面容時，眼見一位氣宇如此軒昂尊貴的大人物竟渾身穿著粗呢布衣，一時驚訝得不知該作何想。儘管亞瑟王對這位厚道商人而言是個素昧平生的外人，商人並不認得他的容貌，但那商人心中卻明白，眼前之人絕非尋常騎士可比——即便身穿粗陋毛呢，也必定是一位位高權重的顯貴人物。", "zh_tw_tagged": "當他走到離那富商宅邸不遠的一條窄巷時，便摘下了頭上那頂{{special:魔法|魔法}}喬裝帽，重新顯露出幾分原本尊貴威儀的容貌，因為此刻他已有心要在旁人面前展現自己堂堂的騎士氣度。因此，當他在內室裡站到那位富商面前，而富商抬頭望見他的面容時，眼見一位氣宇如此軒昂尊貴的大人物竟渾身穿著粗呢布衣，一時驚訝得不知該作何想。儘管{{person:アーサー|亞瑟}}{{office:王|王}}對這位厚道商人而言是個素昧平生的外人，商人並不認得他的容貌，但那商人心中卻明白，眼前之人絕非尋常{{office:騎士|騎士}}可比——即便身穿粗陋毛呢，也必定是一位位高權重的顯貴人物。", "zh_cn": "当他走到离那富商宅邸不远的一条窄巷时，便摘下了头上那顶魔法乔装帽，重新显露出几分原本尊贵威仪的容貌，因为此刻他已有心要在旁人面前展现自己堂堂的骑士气度。因此，当他在内室里站到那位富商面前，而富商抬头望见他的面容时，眼见一位气宇如此轩昂尊贵的大人物竟浑身穿着粗呢布衣，一时惊讶得不知该作何想。尽管亚瑟王对这位厚道商人而言是个素昧平生的外人，商人并不认得他的容貌，但那商人心中却明白，眼前之人绝非寻常骑士可比——即便身穿粗陋毛呢，也必定是一位位高权重的显贵人物。", "zh_cn_tagged": "当他走到离那富商宅邸不远的一条窄巷时，便摘下了头上那顶{{special:魔法|魔法}}乔装帽，重新显露出几分原本尊贵威仪的容貌，因为此刻他已有心要在旁人面前展现自己堂堂的骑士气度。因此，当他在内室里站到那位富商面前，而富商抬头望见他的面容时，眼见一位气宇如此轩昂尊贵的大人物竟浑身穿着粗呢布衣，一时惊讶得不知该作何想。尽管{{person:アーサー|亚瑟}}{{office:王|王}}对这位厚道商人而言是个素昧平生的外人，商人并不认得他的容貌，但那商人心中却明白，眼前之人绝非寻常{{office:騎士|骑士}}可比——即便身穿粗陋毛呢，也必定是一位位高权重的显贵人物。", "ko": "그리고 상인의 집에서 그리 멀지 않은 좁은 골목길에 접어들었을 때, 그는 변장용 마법 모자를 벗고 본래 지니고 있던 고귀한 풍모를 다시금 어느 정도 드러내었으니, 이제는 자신을 바라보는 이들에게 기사다운 기품을 보여 주고자 하는 마음이 있었기 때문이다. 그리하여 그가 내실에서 그 부유한 상인 앞에 마주 섰을 때, 고개를 들어 그의 얼굴을 올려다본 상인은 온통 거친 나사 옷차림을 하고서도 그토록 기품 있고 고귀한 귀인이 서 있는 모습을 보고는 도대체 어찌 생각해야 좋을지 알 수 없었다. 비록 이 선량한 상인에게 아서 왕은 낯선 이여서 그 얼굴을 알아보지는 못하였으나, 그럼에도 그 상인은 눈앞의 인물이 결코 평범한 기사가 아니며, 비록 거친 나사 옷을 걸치고 있을지언정 틀림없이 높은 신분과 권위를 지닌 분임을 단번에 알아차렸기 때문이다.", "ko_tagged": "그리고 상인의 집에서 그리 멀지 않은 좁은 골목길에 접어들었을 때, 그는 변장용 {{special:魔法|마법}} 모자를 벗고 본래 지니고 있던 고귀한 풍모를 다시금 어느 정도 드러내었으니, 이제는 자신을 바라보는 이들에게 기사다운 기품을 보여 주고자 하는 마음이 있었기 때문이다. 그리하여 그가 내실에서 그 부유한 상인 앞에 마주 섰을 때, 고개를 들어 그의 얼굴을 올려다본 상인은 온통 거친 나사 옷차림을 하고서도 그토록 기품 있고 고귀한 귀인이 서 있는 모습을 보고는 도대체 어찌 생각해야 좋을지 알 수 없었다. 비록 이 선량한 상인에게 {{person:アーサー|아서}} {{office:王|왕}}은 낯선 이여서 그 얼굴을 알아보지는 못하였으나, 그럼에도 그 상인은 눈앞의 인물이 결코 평범한 {{office:騎士|기사}}가 아니며, 비록 거친 나사 옷을 걸치고 있을지언정 틀림없이 높은 신분과 권위를 지닌 분임을 단번에 알아차렸기 때문이다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p10_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 10, "type": "本文", "raw_text": "Then King Arthur opened the breast of his jerkin and showed the merchant the gold collar that hung around his neck. And also he showed beneath the rough coat of frieze how that there was an undergarment of fine purple silk embroidered with gold. And then he showed to the good man his own signet ring, and when the merchant saw it, he knew it to be the ring of the King of Britain. Wherefore, beholding these tokens of high and lordly authority, the merchant arose and stood before the King and doffed his cap.", "translation": "そこでアーサー王は短い上着の胸元を押し開き、首に掛けられた黄金の首飾りを商人に見せた。さらにまた、粗末な羅紗の上着の下には、金糸の刺繍を施した上質な紫の絹の下着が身につけられているさまをも示された。そしてそののち、王がこの善良な商人に自らの印章指輪をお見せになると、それを目にした商人は、これこそブリテンの王の指輪にほかならぬことを悟ったのである。かくして、高貴にして君主たる威権を示すこれらの証を目の当たりにし、商人は席を立って王の御前に直立し、恭しくおのれの帽子を脱いだ。", "raw_tagged": "Then {{office:王|King}} {{person:アーサー|Arthur}} opened the breast of his jerkin and showed the merchant the gold collar that hung around his neck. And also he showed beneath the rough coat of frieze how that there was an undergarment of fine purple silk embroidered with gold. And then he showed to the good man his own signet ring, and when the merchant saw it, he knew it to be the ring of the {{office:王|King}} of {{place:ブリテン島|Britain}}. Wherefore, beholding these tokens of high and lordly authority, the merchant arose and stood before the {{office:王|King}} and doffed his cap.", "translation_tagged": "そこで{{person:アーサー|アーサー}}{{office:王|王}}は短い上着の胸元を押し開き、首に掛けられた黄金の首飾りを商人に見せた。さらにまた、粗末な羅紗の上着の下には、金糸の刺繍を施した上質な紫の絹の下着が身につけられているさまをも示された。そしてそののち、王がこの善良な商人に自らの印章指輪をお見せになると、それを目にした商人は、これこそ{{place:ブリテン島|ブリテン}}の{{office:王|王}}の指輪にほかならぬことを悟ったのである。かくして、高貴にして君主たる威権を示すこれらの証を目の当たりにし、商人は席を立って{{office:王|王}}の御前に直立し、恭しくおのれの帽子を脱いだ。", "persons": "アーサー", "places": "ブリテン島", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "隨後亞瑟王敞開短襖的前襟，向那商人露出懸於頸間的黃金領環；同時又讓他看見在那件粗陋毛呢外衣底下，內裡竟穿著一襲繡有金線的上等紫色絲綢內衫。接著他又向這位厚道人亮出自己的印章戒指；那商人一見，便認出那是不列顛之王的御戒。於是，親眼見到這些象徵崇高君王威權的信物後，商人當即起身，恭敬地侍立於國王面前並脫帽致敬。", "zh_tw_tagged": "隨後{{person:アーサー|亞瑟}}{{office:王|王}}敞開短襖的前襟，向那商人露出懸於頸間的黃金領環；同時又讓他看見在那件粗陋毛呢外衣底下，內裡竟穿著一襲繡有金線的上等紫色絲綢內衫。接著他又向這位厚道人亮出自己的印章戒指；那商人一見，便認出那是{{place:ブリテン島|不列顛}}之{{office:王|王}}的御戒。於是，親眼見到這些象徵崇高君王威權的信物後，商人當即起身，恭敬地侍立於{{office:王|國王}}面前並脫帽致敬。", "zh_cn": "随后亚瑟王敞开短袄的前襟，向那商人露出悬于颈间的黄金领环；同时又让他看见在那件粗陋毛呢外衣底下，内里竟穿着一袭绣有金线的上等紫色丝绸内衫。接着他又向这位厚道人亮出自己的印章戒指；那商人一见，便认出那是不列颠之王的御戒。于是，亲眼见到这些象征崇高君王威权的信物后，商人当即起身，恭敬地侍立于国王面前并脱帽致敬。", "zh_cn_tagged": "随后{{person:アーサー|亚瑟}}{{office:王|王}}敞开短袄的前襟，向那商人露出悬于颈间的黄金领环；同时又让他看见在那件粗陋毛呢外衣底下，内里竟穿着一袭绣有金线的上等紫色丝绸内衫。接着他又向这位厚道人亮出自己的印章戒指；那商人一见，便认出那是{{place:ブリテン島|不列颠}}之{{office:王|王}}的御戒。于是，亲眼见到这些象征崇高君王威权的信物后，商人当即起身，恭敬地侍立于{{office:王|国王}}面前并脱帽致敬。", "ko": "그러자 아서 왕은 짧은 윗옷의 앞섶을 열어 상인에게 목에 걸린 황금 목걸이를 보여 주었다. 또한 거친 나사 외투 아래로 금실 자수가 놓인 고운 자주색 비단 속옷을 받쳐 입고 있는 모습도 함께 내보였다. 그러고 나서 그 선량한 상인에게 자신의 인장 반지를 보여 주니, 상인은 그것을 보자마자 곧 브리튼 왕의 반지임을 알아보았다. 그리하여 이처럼 드높고도 군주다운 권위를 나타내는 증표들을 목격한 상인은 자리에서 일어나 왕 앞에 공손히 서서 모자를 벗어 예를 표하였다.", "ko_tagged": "그러자 {{person:アーサー|아서}} {{office:王|왕}}은 짧은 윗옷의 앞섶을 열어 상인에게 목에 걸린 황금 목걸이를 보여 주었다. 또한 거친 나사 외투 아래로 금실 자수가 놓인 고운 자주색 비단 속옷을 받쳐 입고 있는 모습도 함께 내보였다. 그러고 나서 그 선량한 상인에게 자신의 인장 반지를 보여 주니, 상인은 그것을 보자마자 곧 {{place:ブリテン島|브리튼}} {{office:王|왕}}의 반지임을 알아보았다. 그리하여 이처럼 드높고도 군주다운 권위를 나타내는 증표들을 목격한 상인은 자리에서 일어나 {{office:王|왕}} 앞에 공손히 서서 모자를 벗어 예를 표하였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p11_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 11, "type": "本文", "raw_text": "\"Sir Merchant,\" quoth the King, \"know that I am a stranger knight in disguise in this place. Ne'theless, I may tell thee that I am a very good friend to King Leodegrance and wish him exceeding well. Thou art surely aware of how the Duke of North Umber rides continually up and down before the King's castle, and challenges anyone within to come forth for to fight against him in behalf of the Lady Guinevere. Now I am of a mind to assay that combat mine own self, and I hope a very great deal that I shall succeed in upholding the honor of Cameliard and of bringing shame upon its enemies.", "translation": "「商人殿」と王は仰せられた。「知っておいてもらいたいのだが、余はこの地において身をやつしている他国の騎士である。されどそなたに打ち明けておくならば、余はレオデグランス王のまことに良き友であり、かの君の幸いを心より願っておるのだ。ノース・アンバーの公爵が絶えず王の城の前を馬で乗り回し、グィネヴィア姫のために城内の誰なりとも出てきて自分と戦えと挑みかかっておることは、そなたもむろんよく承知していよう。そこで今、余は自らその一騎打ちに挑んでみようと心を決めたのであり、首尾よくカミリアードの名誉を守り抜いて、その敵どもに恥辱を味わわせてやりたいと切に願っておる。", "raw_tagged": "\"Sir Merchant,\" quoth the {{office:王|King}}, \"know that I am a stranger {{office:騎士|knight}} in disguise in this place. Ne'theless, I may tell thee that I am a very good friend to {{office:王|King}} {{person:レオデグランス|Leodegrance}} and wish him exceeding well. Thou art surely aware of how the {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}} rides continually up and down before the {{office:王|King}}'s castle, and challenges anyone within to come forth for to fight against him in behalf of the Lady {{person:グィネヴィア|Guinevere}}. Now I am of a mind to assay that combat mine own self, and I hope a very great deal that I shall succeed in upholding the honor of {{special:カミリアード|Cameliard}} and of bringing shame upon its enemies.", "translation_tagged": "「商人殿」と{{office:王|王}}は仰せられた。「知っておいてもらいたいのだが、余はこの地において身をやつしている他国の{{office:騎士|騎士}}である。されどそなたに打ち明けておくならば、余は{{person:レオデグランス|レオデグランス}}{{office:王|王}}のまことに良き友であり、かの君の幸いを心より願っておるのだ。{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}が絶えず{{office:王|王}}の城の前を馬で乗り回し、{{person:グィネヴィア|グィネヴィア}}姫のために城内の誰なりとも出てきて自分と戦えと挑みかかっておることは、そなたもむろんよく承知していよう。そこで今、余は自らその一騎打ちに挑んでみようと心を決めたのであり、首尾よく{{special:カミリアード|カミリアード}}の名誉を守り抜いて、その敵どもに恥辱を味わわせてやりたいと切に願っておる。", "persons": "レオデグランス,グィネヴィア", "places": "ノーサンバーランド", "offices": "王,騎士,公爵", "era_year": "伝説時代", "keywords": "カミリアード", "is_enriched": true, "zh_tw": "「商人先生，」國王說道，「你要知道，我是個微服喬裝來到此地的異鄉騎士。不過我可以告訴你，我是雷奧多格蘭王極要好的摯友，對他懷有萬分善意與祝願。你定然已經知曉，那位北安伯公爵如何接連不斷地在國王的城堡前來回策馬，叫陣城內任何人出來為桂妮薇兒小姐與他決一死戰。如今我已決意親自出馬應下這場決鬥，並滿心期盼能夠成功捍衛卡米利亞德的榮譽，叫它的敵人蒙受羞辱。", "zh_tw_tagged": "「商人先生，」{{office:王|國王}}說道，「你要知道，我是個微服喬裝來到此地的異鄉{{office:騎士|騎士}}。不過我可以告訴你，我是{{person:レオデグランス|雷奧多格蘭}}{{office:王|王}}極要好的摯友，對他懷有萬分善意與祝願。你定然已經知曉，那位{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}如何接連不斷地在{{office:王|國王}}的城堡前來回策馬，叫陣城內任何人出來為{{person:グィネヴィア|桂妮薇兒}}小姐與他決一死戰。如今我已決意親自出馬應下這場決鬥，並滿心期盼能夠成功捍衛{{special:カミリアード|卡米利亞德}}的榮譽，叫它的敵人蒙受羞辱。", "zh_cn": "“商人先生，”国王说道，“你要知道，我是个微服乔装来到此地的异乡骑士。不过我可以告诉你，我是雷奥多格兰王极要好的挚友，对他怀有万分善意与祝愿。你定然已经知晓，那位北安伯公爵如何接连不断地在国王的城堡前来回策马，叫阵城内任何人出来为桂妮薇儿小姐与他决一死战。如今我已决意亲自出马应下这场决斗，并满心期盼能够成功捍卫卡米利亚德的荣誉，叫它的敌人蒙受羞辱。", "zh_cn_tagged": "“商人先生，”{{office:王|国王}}说道，“你要知道，我是个微服乔装来到此地的异乡{{office:騎士|骑士}}。不过我可以告诉你，我是{{person:レオデグランス|雷奥多格兰}}{{office:王|王}}极要好的挚友，对他怀有万分善意与祝愿。你定然已经知晓，那位{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}如何接连不断地在{{office:王|国王}}的城堡前来回策马，叫阵城内任何人出来为{{person:グィネヴィア|桂妮薇儿}}小姐与他决一死战。如今我已决意亲自出马应下这场决斗，并满心期盼能够成功捍卫{{special:カミリアード|卡米利亚德}}的荣誉，叫它的敌人蒙受羞辱。", "ko": "“상인 공,” 하고 왕이 말하였다. “나는 이곳에서 신분을 감추고 변장한 이방의 기사인 줄로 알라. 그렇지만 그대에게 일러 두거니와, 나는 레오데그란스 왕의 아주 좋은 벗이며 그가 잘되기를 진심으로 깊이 바라고 있노라. 저 노스엄버 공작이 끊임없이 왕의 성 앞을 말 타고 오가며, 기네비어 아가씨를 위하여 성안의 누구라도 나와 자기와 맞붙어 싸우라고 도전하고 있음을 그대도 분명 잘 알고 있을 것이다. 이제 나는 내 손으로 직접 그 대결을 치러 볼 작정이며, 기필코 카밀리아드의 명예를 지켜 내고 그 적들에게 수치를 안겨 줄 수 있기를 간절히 바라고 있노라.", "ko_tagged": "“상인 공,” 하고 {{office:王|왕}}이 말하였다. “나는 이곳에서 신분을 감추고 변장한 이방의 {{office:騎士|기사}}인 줄로 알라. 그렇지만 그대에게 일러 두거니와, 나는 {{person:レオデグランス|레오데그란스}} {{office:王|왕}}의 아주 좋은 벗이며 그가 잘되기를 진심으로 깊이 바라고 있노라. 저 {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}이 끊임없이 {{office:王|왕}}의 성 앞을 말 타고 오가며, {{person:グィネヴィア|기네비어}} 아가씨를 위하여 성안의 누구라도 나와 자기와 맞붙어 싸우라고 도전하고 있음을 그대도 분명 잘 알고 있을 것이다. 이제 나는 내 손으로 직접 그 대결을 치러 볼 작정이며, 기필코 {{special:カミリアード|카밀리아드}}의 명예를 지켜 내고 그 적들에게 수치를 안겨 줄 수 있기를 간절히 바라고 있노라.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p12_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 12, "type": "本文", "raw_text": "\"Sir Merchant, I know very well that thou hast several suits of noble armor in thy treasury, for the fame of them hath reached unto mine ears though I dwell a considerable distance from this place. Wherefore I desire that thou shalt provide me in the best manner that thou art able to do, so that I may straightway assay a bout of arms with that Duke of North Umber. Moreover, I do pledge thee my knightly word that thou shalt be fully recompensed for the best suit of armor that thou canst let me have, and that in a very little while.\"", "translation": "「商人殿、そなたが宝物庫の内に見事な甲冑を幾領も収蔵しておることは余もよく存じておる。余はこの地よりかなり遠く離れた所に住まってはおるが、その甲冑の誉れは余の耳にまで届いておるからな。されば、余がただちにかのノース・アンバーの公爵と武芸の勝負に臨めるよう、そなたにできる最上のやり方で武具一式を用立ててもらいたいのじゃ。なおまた、そなたが余に譲り渡してくれる最上の甲冑一領に対しては、ごく近いうちに必ずや十分な代価をもって報いると、余の騎士としての名誉にかけて堅く誓約しよう」", "raw_tagged": "\"Sir Merchant, I know very well that thou hast several suits of noble armor in thy treasury, for the fame of them hath reached unto mine ears though I dwell a considerable distance from this place. Wherefore I desire that thou shalt provide me in the best manner that thou art able to do, so that I may straightway assay a bout of arms with that {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}}. Moreover, I do pledge thee my knightly word that thou shalt be fully recompensed for the best suit of armor that thou canst let me have, and that in a very little while.\"", "translation_tagged": "「商人殿、そなたが宝物庫の内に見事な甲冑を幾領も収蔵しておることは余もよく存じておる。余はこの地よりかなり遠く離れた所に住まってはおるが、その甲冑の誉れは余の耳にまで届いておるからな。されば、余がただちにかの{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}と武芸の勝負に臨めるよう、そなたにできる最上のやり方で武具一式を用立ててもらいたいのじゃ。なおまた、そなたが余に譲り渡してくれる最上の甲冑一領に対しては、ごく近いうちに必ずや十分な代価をもって報いると、余の騎士としての名誉にかけて堅く誓約しよう」", "persons": "", "places": "ノーサンバーランド", "offices": "公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「商人先生，我深知你的寶庫裡珍藏著好幾副名貴精良的甲冑，儘管我居住在離此相當遙遠的地方，它們的盛名卻早已傳入我的耳中。因此我希望你能盡你所能，為我備齊最上乘的披掛裝備，好讓我即刻前往與那位北安伯公爵比武交鋒。此外，我以騎士的信義向你立誓保證，你所能提供給我的最精良甲冑，不消多時便必將獲得十足豐厚的酬償。」", "zh_tw_tagged": "「商人先生，我深知你的寶庫裡珍藏著好幾副名貴精良的甲冑，儘管我居住在離此相當遙遠的地方，它們的盛名卻早已傳入我的耳中。因此我希望你能盡你所能，為我備齊最上乘的披掛裝備，好讓我即刻前往與那位{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}比武交鋒。此外，我以騎士的信義向你立誓保證，你所能提供給我的最精良甲冑，不消多時便必將獲得十足豐厚的酬償。」", "zh_cn": "“商人先生，我深知你的宝库里珍藏着好几副名贵精良的甲胄，尽管我居住在离此相当遥远的地方，它们的盛名却早已传入我的耳中。因此我希望你能尽你所能，为我备齐最上乘的披挂装备，好让我即刻前往与那位北安伯公爵比武交锋。此外，我以骑士的信义向你立誓保证，你所能提供给我的最精良甲胄，不消多时便必将获得十足丰厚的酬偿。”", "zh_cn_tagged": "“商人先生，我深知你的宝库里珍藏着好几副名贵精良的甲胄，尽管我居住在离此相当遥远的地方，它们的盛名却早已传入我的耳中。因此我希望你能尽你所能，为我备齐最上乘的披挂装备，好让我即刻前往与那位{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}比武交锋。此外，我以骑士的信义向你立誓保证，你所能提供给我的最精良甲胄，不消多时便必将获得十足丰厚的酬偿。”", "ko": "“상인 공, 나는 그대가 보물 창고 안에 훌륭한 갑옷 여러 벌을 간직하고 있음을 아주 잘 알고 있노니, 비록 내가 이곳에서 상당히 떨어진 먼 곳에 거처하고 있으나 그 갑옷들의 명성이 내 귀에까지 들려왔기 때문이다. 그러므로 내가 당장 저 노스엄버 공작과 무예 대결을 벌일 수 있도록, 그대가 할 수 있는 최선의 방식으로 나를 무장시켜 주기를 바라노라. 아울러 그대가 내게 내어 줄 수 있는 가장 훌륭한 갑옷 한 벌에 대해서는 머지않아 반드시 충분한 보답을 치르겠다고 나의 기사다운 명예를 걸고 굳게 약조하노라.”", "ko_tagged": "“상인 공, 나는 그대가 보물 창고 안에 훌륭한 갑옷 여러 벌을 간직하고 있음을 아주 잘 알고 있노니, 비록 내가 이곳에서 상당히 떨어진 먼 곳에 거처하고 있으나 그 갑옷들의 명성이 내 귀에까지 들려왔기 때문이다. 그러므로 내가 당장 저 {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}과 무예 대결을 벌일 수 있도록, 그대가 할 수 있는 최선의 방식으로 나를 무장시켜 주기를 바라노라. 아울러 그대가 내게 내어 줄 수 있는 가장 훌륭한 갑옷 한 벌에 대해서는 머지않아 반드시 충분한 보답을 치르겠다고 나의 기사다운 명예를 걸고 굳게 약조하노라.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p13_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 13, "type": "本文", "raw_text": "\"My Lord,\" said Master Ralph, \"I perceive that thou art no ordinary errant knight, but rather someone of extraordinary estate; wherefore it is a very great pleasure to fulfil all thy behests. But even an thou wert other than thou art, I would be altogether willing to equip thee with armor, seeing that thou hast a mind to ride forth against yonder duke.\"", "translation": "「わが君よ」と主人ラルフは申し上げた。「貴方様が並の遍歴の騎士などではなく、並外れて尊き御身分の方であらせられることはしかとお見受けいたしました。それゆえ、貴方様の仰せをすべて叶えられますことは、私にとりましてこの上ない喜びでございます。しかしながら、たとえ貴方様が今のお姿とは異なる別のお方であったといたしましても、あちらにおりますかの公爵を相手に馬を乗り出そうというお心をお持ちであるからには、私は喜んで甲冑一式を調えて差し上げたことでございましょう」", "raw_tagged": "\"My Lord,\" said Master {{person:ラルフ|Ralph}}, \"I perceive that thou art no ordinary errant {{office:騎士|knight}}, but rather someone of extraordinary estate; wherefore it is a very great pleasure to fulfil all thy behests. But even an thou wert other than thou art, I would be altogether willing to equip thee with armor, seeing that thou hast a mind to ride forth against yonder {{office:公爵|duke}}.\"", "translation_tagged": "「わが君よ」と主人{{person:ラルフ|ラルフ}}は申し上げた。「貴方様が並の遍歴の{{office:騎士|騎士}}などではなく、並外れて尊き御身分の方であらせられることはしかとお見受けいたしました。それゆえ、貴方様の仰せをすべて叶えられますことは、私にとりましてこの上ない喜びでございます。しかしながら、たとえ貴方様が今のお姿とは異なる別のお方であったといたしましても、あちらにおりますかの{{office:公爵|公爵}}を相手に馬を乗り出そうというお心をお持ちであるからには、私は喜んで甲冑一式を調えて差し上げたことでございましょう」", "persons": "ラルフ", "places": "", "offices": "騎士,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「尊駕在上，」拉爾夫老爺恭敬答道，「我看得出您絕非尋常的遊俠騎士，而是身分非凡的尊貴人物；因此能夠奉行您的全部旨意，實乃在下的莫大榮幸。不過，縱使您並非如今這般尊貴身分，單憑您有意策馬出戰那邊那位公爵這份心志，我也定會心甘情願地為您備妥全副甲冑。」", "zh_tw_tagged": "「尊駕在上，」{{person:ラルフ|拉爾夫}}老爺恭敬答道，「我看得出您絕非尋常的遊俠{{office:騎士|騎士}}，而是身分非凡的尊貴人物；因此能夠奉行您的全部旨意，實乃在下的莫大榮幸。不過，縱使您並非如今這般尊貴身分，單憑您有意策馬出戰那邊那位{{office:公爵|公爵}}這份心志，我也定會心甘情願地為您備妥全副甲冑。」", "zh_cn": "“尊驾在上，”拉尔夫老爷恭敬答道，“我看得出您绝非寻常的游侠骑士，而是身份非凡的尊贵人物；因此能够奉行您的全部旨意，实乃在下的莫大荣幸。不过，纵使您并非如今这般尊贵身份，单凭您有意策马出战那边那位公爵这份心志，我也定会心甘情愿地为您备妥全副甲胄。”", "zh_cn_tagged": "“尊驾在上，”{{person:ラルフ|拉尔夫}}老爷恭敬答道，“我看得出您绝非寻常的游侠{{office:騎士|骑士}}，而是身份非凡的尊贵人物；因此能够奉行您的全部旨意，实乃在下的莫大荣幸。不过，纵使您并非如今这般尊贵身份，单凭您有意策马出战那边那位{{office:公爵|公爵}}这份心志，我也定会心甘情愿地为您备妥全副甲胄。”", "ko": "“나리,” 하고 주인 랠프가 아뢰었다. “제가 살피건대 나리께서는 결코 평범한 유랑 기사가 아니시라 비범하고도 높으신 지위를 지닌 분이시니, 나리의 모든 분부를 받들어 모시는 것은 제게 더할 나위 없는 기쁨이옵니다. 하오나 설령 나리께서 그러한 분이 아니셨다 할지라도, 저기 있는 저 공작에게 맞서 말을 몰고 나가실 뜻을 품고 계신 이상 저는 기꺼이 나리께 갑옷을 갖추어 드렸을 것이옵니다.”", "ko_tagged": "“나리,” 하고 주인 {{person:ラルフ|랠프}}가 아뢰었다. “제가 살피건대 나리께서는 결코 평범한 유랑 {{office:騎士|기사}}가 아니시라 비범하고도 높으신 지위를 지닌 분이시니, 나리의 모든 분부를 받들어 모시는 것은 제게 더할 나위 없는 기쁨이옵니다. 하오나 설령 나리께서 그러한 분이 아니셨다 할지라도, 저기 있는 저 {{office:公爵|공작}}에게 맞서 말을 몰고 나가실 뜻을 품고 계신 이상 저는 기꺼이 나리께 갑옷을 갖추어 드렸을 것이옵니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p14_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 14, "type": "本文", "raw_text": "Upon this he rang a little silver bell that stood nigh to him, and in answer to its sound several attendants immediately appeared. Into their hands he intrusted the person of the King, bidding them to do him extraordinary honor. Accordingly, certain of those attendants prepared for the King a bath of tepid water perfumed with ambergris, very grateful to the person. And after he was bathed in this bath and was wiped with soft linen towels, other attendants conducted him to a hall all hung with tapestries and 'broideries, and at this place a noble feast had been spread ready for his refreshment. Here that lordly merchant himself ministered to the King's wants, serving him with various meats—very dainty, and of several sorts—and likewise with fine white bread. And he poured him wine of various countries—some as red as ruby, others as yellow as gold; and indeed the King had hardly ever enjoyed a better feast than that which the merchant, Ralph of Cardiff, had thus spread for him.", "translation": "こう言うと彼は手元に置かれていた小さな銀の鈴を鳴らし、その音に応えてただちに数名の従僕たちが姿を現した。商人は彼らの手に王のお身をゆだね、格別の敬意をもってお仕えするよう命じた。そこで従僕たちのうちの幾人かは、王のために龍涎香の芳しい香りを漂わせた、肌にまことに心地よい微温湯の湯浴みを用意した。そして王がこの湯に浸かって身を清め、柔らかな亜麻布の手拭いで水気を拭われたのち、別の従僕たちが、壁一面に綴れ織りや刺繍の帷を張り巡らせた広間へと王を案内すると、そこには王の英気を養うための豪勢な饗宴がすでに整えられていた。この席では、かの貴族さながらの気品ある商人自身がじきじきに王の給仕を務め、とりどりの種類のきわめて美味なる肉料理の数々や、さらには上質な白パンを勧めた。また商人は、あるものはルビーのように紅く、あるものは黄金のように黄色く輝く諸国の美酒を王の杯に注いだのであって、じつに王といえども、商人たるカーディフのラルフがかくも設えてくれたこの宴に勝るほどの見事な饗宴を味わったことは、いまだかつてほとんどなかったほどであった。", "raw_tagged": "Upon this he rang a little silver bell that stood nigh to him, and in answer to its sound several attendants immediately appeared. Into their hands he intrusted the person of the {{office:王|King}}, bidding them to do him extraordinary honor. Accordingly, certain of those attendants prepared for the {{office:王|King}} a bath of tepid water perfumed with ambergris, very grateful to the person. And after he was bathed in this bath and was wiped with soft linen towels, other attendants conducted him to a hall all hung with tapestries and 'broideries, and at this place a noble feast had been spread ready for his refreshment. Here that lordly merchant himself ministered to the {{office:王|King}}'s wants, serving him with various meats—very dainty, and of several sorts—and likewise with fine white bread. And he poured him wine of various countries—some as red as ruby, others as yellow as gold; and indeed the {{office:王|King}} had hardly ever enjoyed a better feast than that which the merchant, {{person:ラルフ|Ralph}} of {{place:カーディフ|Cardiff}}, had thus spread for him.", "translation_tagged": "こう言うと彼は手元に置かれていた小さな銀の鈴を鳴らし、その音に応えてただちに数名の従僕たちが姿を現した。商人は彼らの手に{{office:王|王}}のお身をゆだね、格別の敬意をもってお仕えするよう命じた。そこで従僕たちのうちの幾人かは、{{office:王|王}}のために龍涎香の芳しい香りを漂わせた、肌にまことに心地よい微温湯の湯浴みを用意した。そして王がこの湯に浸かって身を清め、柔らかな亜麻布の手拭いで水気を拭われたのち、別の従僕たちが、壁一面に綴れ織りや刺繍の帷を張り巡らせた広間へと王を案内すると、そこには王の英気を養うための豪勢な饗宴がすでに整えられていた。この席では、かの貴族さながらの気品ある商人自身がじきじきに{{office:王|王}}の給仕を務め、とりどりの種類のきわめて美味なる肉料理の数々や、さらには上質な白パンを勧めた。また商人は、あるものはルビーのように紅く、あるものは黄金のように黄色く輝く諸国の美酒を王の杯に注いだのであって、じつに{{office:王|王}}といえども、商人たる{{place:カーディフ|カーディフ}}の{{person:ラルフ|ラルフ}}がかくも設えてくれたこの宴に勝るほどの見事な饗宴を味わったことは、いまだかつてほとんどなかったほどであった。", "persons": "ラルフ", "places": "カーディフ", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "說罷，他搖響了手邊的一隻小銀鈴，鈴聲甫落，數名侍從便應聲而入。他將國王託付給眾侍從照料，吩咐他們務必以最崇高的禮遇小心伺候。於是其中幾名侍從為國王備妥了一池調有龍涎香的溫水浴，沐浴起來令人通體舒暢。待他在浴池中洗淨身心、用柔軟的亞麻浴巾拭乾之後，另有幾名侍從引領他前往一座四壁掛滿錦繡掛毯與刺繡帷幔的廳堂，那裡早已擺開一席豐盛高雅的筵席，專供他進食休整。在這廳堂裡，那位氣派儼然王侯的富商親自侍奉國王用膳，為他呈上各色精緻鮮美的珍饈肉食，以及上好的白麵包；又為他斟滿產自各國的佳釀美酒——有的殷紅如紅寶石，有的澄黃似黃金。說真的，就連國王本人，平生也幾乎從未享用過比富商卡地夫的拉爾夫這般為他設下的更為美妙的盛宴。", "zh_tw_tagged": "說罷，他搖響了手邊的一隻小銀鈴，鈴聲甫落，數名侍從便應聲而入。他將{{office:王|國王}}託付給眾侍從照料，吩咐他們務必以最崇高的禮遇小心伺候。於是其中幾名侍從為{{office:王|國王}}備妥了一池調有龍涎香的溫水浴，沐浴起來令人通體舒暢。待他在浴池中洗淨身心、用柔軟的亞麻浴巾拭乾之後，另有幾名侍從引領他前往一座四壁掛滿錦繡掛毯與刺繡帷幔的廳堂，那裡早已擺開一席豐盛高雅的筵席，專供他進食休整。在這廳堂裡，那位氣派儼然王侯的富商親自侍奉{{office:王|國王}}用膳，為他呈上各色精緻鮮美的珍饈肉食，以及上好的白麵包；又為他斟滿產自各國的佳釀美酒——有的殷紅如紅寶石，有的澄黃似黃金。說真的，就連{{office:王|國王}}本人，平生也幾乎從未享用過比富商{{place:カーディフ|卡地夫}}的{{person:ラルフ|拉爾夫}}這般為他設下的更為美妙的盛宴。", "zh_cn": "说罢，他摇响了手边的一只小银铃，铃声甫落，数名侍从便应声而入。他将国王托付给众侍从照料，吩咐他们务必以最崇高的礼遇小心伺候。于是其中几名侍从为国王备妥了一池调有龙涎香的温水浴，沐浴起来令人通体舒畅。待他在浴池中洗净身心、用柔软的亚麻浴巾拭干之后，另有几名侍从引领他前往一座四壁挂满锦绣挂毯与刺绣帷幔的厅堂，那里早已摆开一席丰盛高雅的筵席，专供他进食休整。在这厅堂里，那位气派俨然王侯的富商亲自侍奉国王用膳，为他呈上各色精致鲜美的珍馐肉食，以及上好的白面包；又为他斟满产自各国的佳酿美酒——有的殷红如红宝石，有的澄黄似黄金。说真的，就连国王本人，平生也几乎从未享用过比富商卡迪夫的拉尔夫这般为他设下的更为美妙的盛宴。", "zh_cn_tagged": "说罢，他摇响了手边的一只小银铃，铃声甫落，数名侍从便应声而入。他将{{office:王|国王}}托付给众侍从照料，吩咐他们务必以最崇高的礼遇小心伺候。于是其中几名侍从为{{office:王|国王}}备妥了一池调有龙涎香的温水浴，沐浴起来令人通体舒畅。待他在浴池中洗净身心、用柔软的亚麻浴巾拭干之后，另有几名侍从引领他前往一座四壁挂满锦绣挂毯与刺绣帷幔的厅堂，那里早已摆开一席丰盛高雅的筵席，专供他进食休整。在这厅堂里，那位气派俨然王侯的富商亲自侍奉{{office:王|国王}}用膳，为他呈上各色精致鲜美的珍馐肉食，以及上好的白面包；又为他斟满产自各国的佳酿美酒——有的殷红如红宝石，有的澄黄似黄金。说真的，就连{{office:王|国王}}本人，平生也几乎从未享用过比富商{{place:カーディフ|卡迪夫}}的{{person:ラルフ|拉尔夫}}这般为他设下的更为美妙的盛宴。", "ko": "이 말을 마치고 그가 가까이 놓여 있던 작은 은방울을 울리자, 그 소리에 맞추어 여러 시종들이 즉시 모습을 드러내었다. 그는 시종들의 손에 왕의 시중을 맡기며 각별하고도 지극한 예우를 다해 모시라고 분부하였다. 이에 시종들 가운데 몇 사람이 왕을 위하여 몸에 참으로 기분 좋은 용연향 향기를 머금은 미지근한 목욕물을 준비하였다. 그가 이 목욕탕에서 몸을 씻고 부드러운 아마포 수건으로 물기를 닦아 낸 뒤, 다른 시종들이 온통 태피스트리와 자수 휘장이 드리워진 대청으로 그를 안내하였는데, 그곳에는 그의 원기를 북돋우기 위한 성대한 연회가 이미 차려져 있었다. 이곳에서는 저 귀족다운 풍모의 상인이 직접 왕의 시중을 들며 여러 종류의 매우 진미로운 고기 요리들과 고운 흰 빵을 대접하였다. 또한 그는 루비처럼 붉은 술과 황금처럼 노란 술 등 여러 나라에서 들여온 포도주를 잔에 따라 올렸으니, 참으로 왕조차도 상인 카디프의 랠프가 이처럼 베풀어 준 잔치보다 더 훌륭한 성찬을 누려 본 적이 거의 없었을 정도였다.", "ko_tagged": "이 말을 마치고 그가 가까이 놓여 있던 작은 은방울을 울리자, 그 소리에 맞추어 여러 시종들이 즉시 모습을 드러내었다. 그는 시종들의 손에 {{office:王|왕}}의 시중을 맡기며 각별하고도 지극한 예우를 다해 모시라고 분부하였다. 이에 시종들 가운데 몇 사람이 {{office:王|왕}}을 위하여 몸에 참으로 기분 좋은 용연향 향기를 머금은 미지근한 목욕물을 준비하였다. 그가 이 목욕탕에서 몸을 씻고 부드러운 아마포 수건으로 물기를 닦아 낸 뒤, 다른 시종들이 온통 태피스트리와 자수 휘장이 드리워진 대청으로 그를 안내하였는데, 그곳에는 그의 원기를 북돋우기 위한 성대한 연회가 이미 차려져 있었다. 이곳에서는 저 귀족다운 풍모의 상인이 직접 {{office:王|왕}}의 시중을 들며 여러 종류의 매우 진미로운 고기 요리들과 고운 흰 빵을 대접하였다. 또한 그는 루비처럼 붉은 술과 황금처럼 노란 술 등 여러 나라에서 들여온 포도주를 잔에 따라 올렸으니, 참으로 {{office:王|왕}}조차도 상인 {{place:カーディフ|카디프}}의 {{person:ラルフ|랠프}}가 이처럼 베풀어 준 잔치보다 더 훌륭한 성찬을 누려 본 적이 거의 없었을 정도였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p15_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 15, "type": "本文", "raw_text": "And after he had entirely refreshed himself with eating, there came six pages richly clad in sarsanet of azure, and these, taking the King to an apartment of great state, they there clad him in a suit of Spanish armor, verv cunningly wrought and all inlaid with gold. And the like of that armor was hardly to be found in all of the land. The juppon and the several trappings of the armor were all of satin and as white as milk. And the shield was white, and altogether without emblazonment or device of any sort. Then these attendants conducted the King into the courtyard, and there stood a noble war-horse, as white as milk, and all the trappings of the horse were of milk-white cloth without emblazonment or adornment of any sort; and the bridle and the bridle rein were all studded over with bosses of silver.", "translation": "そして王が食事によってすっかり生気を取り戻されたのち、空色の薄絹の衣装を華やかにまとった六人の小姓が参上し、王をきわめて格式高い一室へと案内すると、そこにおいて、まことに精巧に鍛え上げられ全面に黄金の象嵌を施したスペイン製の甲冑一領を王のお身にまとわせた。その甲冑に比肩し得るほどの逸品は、国中を隈なく探してもほとんど見出しがたいほどであった。陣羽織をはじめ甲冑に添えられた数々の装具はことごとく繻子で仕立てられ、乳のように真っ白であった。また盾も純白で、いかなる紋章も意匠も一切描かれていなかった。続いて従者たちが王を中庭へと導き出すと、そこには乳のように白い一頭の駿良な軍馬が控えており、その馬具や馬衣もすべていかなる紋章も飾りもない乳白色の布地で統一され、面繋と手綱には一面に銀の飾り鋲が打ち連ねられていた。", "raw_tagged": "And after he had entirely refreshed himself with eating, there came six {{office:小姓|pages}} richly clad in sarsanet of azure, and these, taking the {{office:王|King}} to an apartment of great state, they there clad him in a suit of Spanish armor, verv cunningly wrought and all inlaid with gold. And the like of that armor was hardly to be found in all of the land. The juppon and the several trappings of the armor were all of satin and as white as milk. And the shield was white, and altogether without emblazonment or device of any sort. Then these attendants conducted the {{office:王|King}} into the courtyard, and there stood a noble war-horse, as white as milk, and all the trappings of the horse were of milk-white cloth without emblazonment or adornment of any sort; and the bridle and the bridle rein were all studded over with bosses of silver.", "translation_tagged": "そして王が食事によってすっかり生気を取り戻されたのち、空色の薄絹の衣装を華やかにまとった六人の{{office:小姓|小姓}}が参上し、{{office:王|王}}をきわめて格式高い一室へと案内すると、そこにおいて、まことに精巧に鍛え上げられ全面に黄金の象嵌を施したスペイン製の甲冑一領を王のお身にまとわせた。その甲冑に比肩し得るほどの逸品は、国中を隈なく探してもほとんど見出しがたいほどであった。陣羽織をはじめ甲冑に添えられた数々の装具はことごとく繻子で仕立てられ、乳のように真っ白であった。また盾も純白で、いかなる紋章も意匠も一切描かれていなかった。続いて従者たちが{{office:王|王}}を中庭へと導き出すと、そこには乳のように白い一頭の駿良な軍馬が控えており、その馬具や馬衣もすべていかなる紋章も飾りもない乳白色の布地で統一され、面繋と手綱には一面に銀の飾り鋲が打ち連ねられていた。", "persons": "", "places": "", "offices": "小姓,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "待他用罷酒食、精神全然振作之後，走進來六名身著華美天藍色薄綢衣裳的侍童；他們引領國王進入一間極為氣派堂皇的內室，在那裡為他披掛上一副工藝極其精湛考究、通體鑲嵌黃金的西班牙甲冑。這般絕世名甲，縱使尋遍全國上下也難覓其匹。甲冑外罩的戰袍與各處披飾皆為緞子裁成，潔白如乳；盾牌亦是一片純白，全然沒有繪製任何紋章或圖案標記。隨後眾侍從引領國王步入庭院，只見院中立著一匹潔白如乳的駿偉戰馬，全副馬衣披掛皆是用毫無任何紋章與飾物的乳白色布料製成，而馬勒與韁繩上則密密鑲滿了白銀飾釘。", "zh_tw_tagged": "待他用罷酒食、精神全然振作之後，走進來六名身著華美天藍色薄綢衣裳的{{office:小姓|侍童}}；他們引領{{office:王|國王}}進入一間極為氣派堂皇的內室，在那裡為他披掛上一副工藝極其精湛考究、通體鑲嵌黃金的西班牙甲冑。這般絕世名甲，縱使尋遍全國上下也難覓其匹。甲冑外罩的戰袍與各處披飾皆為緞子裁成，潔白如乳；盾牌亦是一片純白，全然沒有繪製任何紋章或圖案標記。隨後眾侍從引領{{office:王|國王}}步入庭院，只見院中立著一匹潔白如乳的駿偉戰馬，全副馬衣披掛皆是用毫無任何紋章與飾物的乳白色布料製成，而馬勒與韁繩上則密密鑲滿了白銀飾釘。", "zh_cn": "待他用罢酒食、精神全然振作之后，走进来六名身着华美天蓝色薄绸衣裳的侍童；他们引领国王进入一间极为气派堂皇的内室，在那里为他披挂上一副工艺极其精湛考究、通体镶嵌黄金的西班牙甲胄。这般绝世名甲，纵使寻遍全国上下也难觅其匹。甲胄外罩的战袍与各处披饰皆为缎子裁成，洁白如乳；盾牌亦是一片纯白，全然没有绘制任何纹章或图案标记。随后众侍从引领国王步入庭院，只见院中立着一匹洁白如乳的骏伟战马，全副马衣披挂皆是用毫无任何纹章与饰物的乳白色布料制成，而马勒与缰绳上则密密镶满了白银饰钉。", "zh_cn_tagged": "待他用罢酒食、精神全然振作之后，走进来六名身着华美天蓝色薄绸衣裳的{{office:小姓|侍童}}；他们引领{{office:王|国王}}进入一间极为气派堂皇的内室，在那里为他披挂上一副工艺极其精湛考究、通体镶嵌黄金的西班牙甲胄。这般绝世名甲，纵使寻遍全国上下也难觅其匹。甲胄外罩的战袍与各处披饰皆为缎子裁成，洁白如乳；盾牌亦是一片纯白，全然没有绘制任何纹章或图案标记。随后众侍从引领{{office:王|国王}}步入庭院，只见院中立着一匹洁白如乳的骏伟战马，全副马衣披挂皆是用毫无任何纹章与饰物的乳白色布料制成，而马勒与缰绳上则密密镶满了白银饰钉。", "ko": "그가 식사를 마치고 원기를 완전히 되찾은 뒤, 하늘빛 얇은 비단옷을 화려하게 차려입은 여섯 명의 시동이 들어와 왕을 대단히 격조 높은 방으로 모시고 가서는, 더없이 정교하게 벼려지고 온통 황금이 상감된 스페인산 갑옷 한 벌을 입혀 드렸다. 그 갑옷에 견줄 만한 명품은 온 나라를 다 뒤져도 거의 찾아보기 어려울 정도였다. 갑옷 위에 걸치는 전포와 여러 장식구는 모두 공단으로 지어져 우유처럼 새하얬다. 방패 또한 순백색이었으며 어떠한 문장이나 도안도 전혀 그려져 있지 않았다. 그런 다음 시종들이 왕을 안뜰로 안내하니, 그곳에는 우유처럼 새하얀 준수한 군마 한 필이 서 있었고, 말의 모든 마구와 안장 덮개 역시 아무런 문장이나 장식도 없는 유백색 천으로 되어 있었으며, 굴레와 고삐에는 온통 은장식 징이 촘촘히 박혀 있었다.", "ko_tagged": "그가 식사를 마치고 원기를 완전히 되찾은 뒤, 하늘빛 얇은 비단옷을 화려하게 차려입은 여섯 명의 {{office:小姓|시동}}이 들어와 {{office:王|왕}}을 대단히 격조 높은 방으로 모시고 가서는, 더없이 정교하게 벼려지고 온통 황금이 상감된 스페인산 갑옷 한 벌을 입혀 드렸다. 그 갑옷에 견줄 만한 명품은 온 나라를 다 뒤져도 거의 찾아보기 어려울 정도였다. 갑옷 위에 걸치는 전포와 여러 장식구는 모두 공단으로 지어져 우유처럼 새하얬다. 방패 또한 순백색이었으며 어떠한 문장이나 도안도 전혀 그려져 있지 않았다. 그런 다음 시종들이 {{office:王|왕}}을 안뜰로 안내하니, 그곳에는 우유처럼 새하얀 준수한 군마 한 필이 서 있었고, 말의 모든 마구와 안장 덮개 역시 아무런 문장이나 장식도 없는 유백색 천으로 되어 있었으며, 굴레와 고삐에는 온통 은장식 징이 촘촘히 박혀 있었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p16_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 16, "type": "本文", "raw_text": "Then after the attendants had aided King Arthur to mount this steed, the lordly merchant came forward and gave him many words of good cheer, and so the king bade him adieu and rode away, all shining in white and glittering in fine armor, wherefore he resembled the full moon in harvest season.", "translation": "それから従者たちが手を貸してアーサー王をこの駿馬に跨がらせたのち、かの貴族さながらの商人が進み出て、王に数々の心強い激励の言葉を贈った。こうして王は商人に別れを告げて馬を駆け出させたが、純白に輝き見事な甲冑にきらめくそのお姿は、さながら実りの秋の季節に昇る満月のようであった。", "raw_tagged": "Then after the attendants had aided {{office:王|King}} {{person:アーサー|Arthur}} to mount this steed, the lordly merchant came forward and gave him many words of good cheer, and so the {{office:王|king}} bade him adieu and rode away, all shining in white and glittering in fine armor, wherefore he resembled the full moon in harvest season.", "translation_tagged": "それから従者たちが手を貸して{{person:アーサー|アーサー}}{{office:王|王}}をこの駿馬に跨がらせたのち、かの貴族さながらの商人が進み出て、王に数々の心強い激励の言葉を贈った。こうして{{office:王|王}}は商人に別れを告げて馬を駆け出させたが、純白に輝き見事な甲冑にきらめくそのお姿は、さながら実りの秋の季節に昇る満月のようであった。", "persons": "アーサー", "places": "", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "待眾侍從扶助亞瑟王跨上這匹駿馬之後，那位氣度儼然貴族的富商上前向他道了許多振奮人心的祝捷吉言；於是國王向他道別，策馬馳去，渾身白衣耀眼、精良甲冑熠熠生輝，望去恰似秋收時節的一輪皓月。", "zh_tw_tagged": "待眾侍從扶助{{person:アーサー|亞瑟}}{{office:王|王}}跨上這匹駿馬之後，那位氣度儼然貴族的富商上前向他道了許多振奮人心的祝捷吉言；於是{{office:王|國王}}向他道別，策馬馳去，渾身白衣耀眼、精良甲冑熠熠生輝，望去恰似秋收時節的一輪皓月。", "zh_cn": "待众侍从扶助亚瑟王跨上这匹骏马之后，那位气度俨然贵族的富商上前向他道了许多振奋人心的祝捷吉言；于是国王向他道别，策马驰去，浑身白衣耀眼、精良甲胄熠熠生辉，望去恰似秋收时节的一轮皓月。", "zh_cn_tagged": "待众侍从扶助{{person:アーサー|亚瑟}}{{office:王|王}}跨上这匹骏马之后，那位气度俨然贵族的富商上前向他道了许多振奋人心的祝捷吉言；于是{{office:王|国王}}向他道别，策马驰去，浑身白衣耀眼、精良甲胄熠熠生辉，望去恰似秋收时节的一轮皓月。", "ko": "그런 뒤 시종들이 아서 왕을 부축하여 이 준마에 오르게 하자, 저 귀족다운 풍모의 상인이 앞으로 나와 용기를 북돋우는 격려의 말을 수없이 건네었다. 그리하여 왕은 그에게 작별 인사를 고하고 말을 몰아 떠나갔는데, 온통 순백으로 빛나며 훌륭한 갑옷이 눈부시게 반짝이는 그 모습은 마치 수확철에 떠오른 보름달과도 같았다.", "ko_tagged": "그런 뒤 시종들이 {{person:アーサー|아서}} {{office:王|왕}}을 부축하여 이 준마에 오르게 하자, 저 귀족다운 풍모의 상인이 앞으로 나와 용기를 북돋우는 격려의 말을 수없이 건네었다. 그리하여 {{office:王|왕}}은 그에게 작별 인사를 고하고 말을 몰아 떠나갔는데, 온통 순백으로 빛나며 훌륭한 갑옷이 눈부시게 반짝이는 그 모습은 마치 수확철에 떠오른 보름달과도 같았다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p17_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 17, "type": "本文", "raw_text": "And as he drave down the stony streets of the town, the people turned and gazed after him, for he made a very noble appearance as he passed along the narrow way between the houses of the town.", "translation": "そして王が町の石畳の通りを馬を駆って下っていくと、町の人々はみな振り返ってその後ろ姿をじっと見送った。というのも、町の家並みのあいだを縫う狭い道を進みゆく王の姿が、まことに気高く凛々しいものであったからである。", "raw_tagged": "And as he drave down the stony streets of the town, the people turned and gazed after him, for he made a very noble appearance as he passed along the narrow way between the houses of the town.", "translation_tagged": "そして王が町の石畳の通りを馬を駆って下っていくと、町の人々はみな振り返ってその後ろ姿をじっと見送った。というのも、町の家並みのあいだを縫う狭い道を進みゆく王の姿が、まことに気高く凛々しいものであったからである。", "persons": "", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "當他策馬沿著城裡鋪石的街道疾馳而下時，沿途百姓紛紛轉過頭來目送他的背影，只因他穿行於城鎮屋舍間那條狹窄巷道時的模樣，著實威風凜凜、氣宇非凡。", "zh_tw_tagged": "當他策馬沿著城裡鋪石的街道疾馳而下時，沿途百姓紛紛轉過頭來目送他的背影，只因他穿行於城鎮屋舍間那條狹窄巷道時的模樣，著實威風凜凜、氣宇非凡。", "zh_cn": "当他策马沿着城里铺石的街道疾驰而下时，沿途百姓纷纷转过头来目送他的背影，只因他穿行于城镇屋舍间那条狭窄巷道时的模样，着实威风凛凛、气宇非凡。", "zh_cn_tagged": "当他策马沿着城里铺石的街道疾驰而下时，沿途百姓纷纷转过头来目送他的背影，只因他穿行于城镇屋舍间那条狭窄巷道时的模样，着实威风凛凛、气宇非凡。", "ko": "그가 고을의 돌 깔린 거리를 따라 말을 몰아 내려갈 때, 사람들은 모두 고개를 돌려 그의 뒷모습을 물끄러미 바라보았으니, 고을 집들 사이의 좁은 길을 지나가는 그의 풍채가 더없이 고귀하고도 당당하였기 때문이다.", "ko_tagged": "그가 고을의 돌 깔린 거리를 따라 말을 몰아 내려갈 때, 사람들은 모두 고개를 돌려 그의 뒷모습을 물끄러미 바라보았으니, 고을 집들 사이의 좁은 길을 지나가는 그의 풍채가 더없이 고귀하고도 당당하였기 때문이다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p18_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 18, "type": "本文", "raw_text": "So King Arthur directed his way to the postern gate of the castle, and, having reached that place, he dismounted and tied his horse. Then he straightway entered the garden, and there, finding an attendant, he made demand that he should have present speech with the Lady Guinevere. So the attendant, all amazed at his lordly presence, went and delivered the message, and by and by the Lady Guinevere came, much wondering, and passed along a gallery with several of her damsels, until she had come over above where King Arthur was. And when King Arthur looked up and saw her above him, he loved her exceeding well. And he said to her: \"Lady, I have great will to do thee such honor as I am able. For I go forth now to do combat with that Duke of North Umber who rides up and down before this castle. Moreover, I hope and verily believe that I shall encompass his downfall; accordingly, I do beseech of thee some token, such as a lady may give unto a knight for to wear when that knight rides forth to do her honor.\"", "translation": "かくしてアーサー王は城の裏門へと馬を進め、その場所に辿り着くと馬から降りて手綱を繋ぎ止めた。それからただちに庭園のなかへと足を踏み入れ、そこに一人の従者を見つけると、今すぐグィネヴィア姫と言葉を交わしたいと申し入れた。従者は王の威風堂々たる気品にすっかり驚き畏みつつ、奥へ赴いてその口上を取り次いだ。するとまもなく、グィネヴィア姫が大いに不思議に思われながら姿を現し、数名の侍女たちを引き連れて回廊を歩み進め、ちょうどアーサー王が立っている真上のところまでお出ましになった。アーサー王が顔を上げて頭上の姫のお姿を目にすると、胸の内に限りない愛おしさがこみ上げてきた。そして王は姫に向かってこう申し上げた。「姫君よ、私は自らの力の及ぶ限り、貴女様に誉れを捧げたいと強く願っております。というのも、私はこれより、この城の前を行き来しているかのノース・アンバーの公爵と一騎打ちを交えるべく出陣するところだからでございます。のみならず、私は必ずや彼を打ち倒してみせると願い、かつ堅く信じております。つきましては、一人の騎士が貴婦人の名誉のために馬を駆って出陣する折、貴婦人がその騎士に身につけさせるべく授けられるような何らかの印の品を、どうか私にお恵みくださいますよう伏してお願い申し上げます」", "raw_tagged": "So {{office:王|King}} {{person:アーサー|Arthur}} directed his way to the postern gate of the castle, and, having reached that place, he dismounted and tied his horse. Then he straightway entered the garden, and there, finding an attendant, he made demand that he should have present speech with the Lady {{person:グィネヴィア|Guinevere}}. So the attendant, all amazed at his lordly presence, went and delivered the message, and by and by the Lady {{person:グィネヴィア|Guinevere}} came, much wondering, and passed along a gallery with several of her damsels, until she had come over above where {{office:王|King}} {{person:アーサー|Arthur}} was. And when {{office:王|King}} {{person:アーサー|Arthur}} looked up and saw her above him, he loved her exceeding well. And he said to her: \"Lady, I have great will to do thee such honor as I am able. For I go forth now to do combat with that {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}} who rides up and down before this castle. Moreover, I hope and verily believe that I shall encompass his downfall; accordingly, I do beseech of thee some token, such as a lady may give unto a {{office:騎士|knight}} for to wear when that {{office:騎士|knight}} rides forth to do her honor.\"", "translation_tagged": "かくして{{person:アーサー|アーサー}}{{office:王|王}}は城の裏門へと馬を進め、その場所に辿り着くと馬から降りて手綱を繋ぎ止めた。それからただちに庭園のなかへと足を踏み入れ、そこに一人の従者を見つけると、今すぐ{{person:グィネヴィア|グィネヴィア}}姫と言葉を交わしたいと申し入れた。従者は王の威風堂々たる気品にすっかり驚き畏みつつ、奥へ赴いてその口上を取り次いだ。するとまもなく
