, "en": "Nephew of King Arthur, Knight of the Round Table", "zh_tw": "亞瑟王外甥、圓桌騎士", "zh_cn": "亚瑟王外甥、圆桌骑士", "ko": "아서 왕의 조카·원탁의 기사"}, "desc_i18n": {"ja": "ゴアのユリエンス王とマルゲーズ（アーサーの異父姉）の子で、アーサー王の甥にあたる名高い円卓の騎士。高潔さと優れた武勇で多くの冒険譚に語られる。", "en": "Son of King Urien of Gore and Margaise, and nephew to King Arthur. Renowned among the Knights of the Round Table for his nobility and chivalric prowess.", "zh_tw": "戈爾國王尤里安與瑪格絲（亞瑟同母異父之姊）之子，亞瑟王的外甥，著名的圓桌騎士，以高潔品格與卓越武勇留名諸多冒險傳奇。", "zh_cn": "戈尔国王尤里安与玛格丝（亚瑟同母异父之姊）之子，亚瑟王的外甥，著名的圆桌骑士，以高洁品格与卓越武勇留名诸多冒险传奇。", "ko": "고어의 유리엔 왕과 마게이즈(아서의 이부누이)의 아들로, 아서 왕의 조카에 해당하는 이름 높은 원탁의 기사. 고결한 성품과 뛰어난 무용으로 수많은 모험담에 전해진다."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "カラドック": {"name": "カラドック（からどっく：アーサー王の宮廷に列する剛勇・高潔の円卓の騎士）", "display_name": "カラドック（円卓の騎士）", "yomi": "からどっく", "wiki_title": "カラドック", "role": "円卓の騎士", "ai_desc": "ウェールズ伝承やアーサー王物語に広く名を知られる高潔な円卓の騎士。優れた武勇と誠実な人柄を備えた名騎士として宮廷に重きをなす。", "role_i18n": {"ja": "円卓の騎士", "en": "Knight of the Round Table", "zh_tw": "圓桌騎士", "zh_cn": "圆桌骑士", "ko": "원탁의 기사"}, "desc_i18n": {"ja": "ウェールズ伝承やアーサー王物語に広く名を知られる高潔な円卓の騎士。優れた武勇と誠実な人柄を備えた名騎士として宮廷に重きをなす。", "en": "A noble Knight of the Round Table widely celebrated in Welsh tradition and Arthurian romance for his great valor and steadfast honor.", "zh_tw": "在威爾斯傳承與亞瑟王傳奇中廣受讚譽的高潔圓桌騎士，兼具超群武勇與誠實品格，於宮廷中深孚眾望。", "zh_cn": "在威尔士传承与亚瑟王传奇中广受赞誉的高洁圆桌骑士，兼具超群武勇与诚实品格，于宫廷中深孚众望。", "ko": "웨일스 전승과 아서 왕 이야기에서 널리 이름난 고결한 원탁의 기사. 뛰어난 무용과 성실한 인품을 겸비한 명기사로 궁정에서 중히 여겨진다."}, "sort_key_i18n": {"zh_tw": "K", "zh_cn": "K"}}, "ゲライント": {"name": "ゲライント（げらいんと：ウェールズ伝承や騎士道物語で名高い円卓の騎士）", "display_name": "ゲライント（円卓の騎士）", "yomi": "げらいんと", "wiki_title": "ゲライント", "role": "円卓の騎士", "ai_desc": "ウェールズの古典物語『マビノギオン』や中世騎士道物語で広く称えられる円卓の騎士。比類なき武勇と騎士道精神を備えた英雄として知られる。", "role_i18n": {"ja": "円卓の騎士", "en": "Knight of the Round Table", "zh_tw": "圓桌騎士", "zh_cn": "圆桌骑士", "ko": "원탁의 기사"}, "desc_i18n": {"ja": "ウェールズの古典物語『マビノギオン』や中世騎士道物語で広く称えられる円卓の騎士。比類なき武勇と騎士道精神を備えた英雄として知られる。", "en": "A famed Knight of the Round Table celebrated in the Welsh Mabinogion and medieval chivalric romance as a hero of peerless courage and courtesy.", "zh_tw": "在威爾斯古典傳說《馬比諾吉昂》與中世紀騎士文學中備受推崇的圓桌騎士，以舉世無雙的勇武與騎士精神著稱。", "zh_cn": "在威尔士古典传说《马比诺吉昂》与中世纪骑士文学中备受推崇的圆桌骑士，以举世无双的勇武与骑士精神著称。", "ko": "웨일스 고전 이야기 『마비노기온』과 중세 기사도 문학에서 널리 칭송받는 원탁의 기사. 비길 데 없는 무용과 기사도 정신을 갖춘 영웅으로 알려져 있다."}, "sort_key_i18n": {"zh_tw": "J", "zh_cn": "J"}}, "ボドウィン": {"name": "ボドウィン（ぼどうぃん：ブリテンの高潔なる騎士）", "display_name": "ボドウィン（ブリテンの騎士）", "yomi": "ぼどうぃん", "wiki_title": "", "role": "ブリテンの騎士", "ai_desc": "アーサー王の宮廷に列するブリテンの高潔な騎士。マロリー『アーサー王の死』ではコーンウォールのマーク王の弟で信望厚い名将としても伝承される。", "role_i18n": {"ja": "ブリテンの騎士", "en": "Knight of Britain", "zh_tw": "不列顛騎士", "zh_cn": "不列颠骑士", "ko": "브리튼의 기사"}, "desc_i18n": {"ja": "アーサー王の宮廷に列するブリテンの高潔な騎士。マロリー『アーサー王の死』ではコーンウォールのマーク王の弟で信望厚い名将としても伝承される。", "en": "A noble knight of Britain attending King Arthur's court. In Malory's Le Morte d'Arthur he is also remembered as the honorable brother of King Mark of Cornwall.", "zh_tw": "列席亞瑟王宮廷的不列顛高潔騎士。在馬洛禮《亞瑟王之死》中，亦傳為康沃爾國王馬克德高望重的胞弟與名將。", "zh_cn": "列席亚瑟王宫廷的不列颠高洁骑士。在马洛礼《亚瑟王之死》中，亦传为康沃尔国王马克德高望重的胞弟与名将。", "ko": "아서 왕의 궁정에 자리한 브리튼의 고결한 기사. 맬러리의 『아서 왕의 죽음』에서는 콘월의 왕 마크의 아우이자 신망 두터운 명장으로도 전해진다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "コンスタンティン": {"name": "コンスタンティン（こんすたんてぃん：コーンウォール出身の円卓の騎士）", "display_name": "コンスタンティン（コーンウォールの騎士）", "yomi": "こんすたんてぃん", "wiki_title": "", "role": "コーンウォールの騎士・円卓の騎士", "ai_desc": "コーンウォールのカドール公の子とされる高潔な円卓の騎士。アーサー王伝説では、のちに王位を継ぐ人物としても知られる。", "role_i18n": {"ja": "コーンウォールの騎士・円卓の騎士", "en": "Knight of Cornwall, Knight of the Round Table", "zh_tw": "康沃爾騎士、圓桌騎士", "zh_cn": "康沃尔骑士、圆桌骑士", "ko": "콘월의 기사·원탁의 기사"}, "desc_i18n": {"ja": "コーンウォールのカドール公の子とされる高潔な円卓の騎士。アーサー王伝説では、のちに王位を継ぐ人物としても知られる。", "en": "A noble Knight of the Round Table from Cornwall, said to be the son of Cador. In Arthurian tradition he is also known as the successor to King Arthur's crown.", "zh_tw": "出身康沃爾的高潔圓桌騎士，傳為卡多爾之子。在亞瑟王傳說中，亦以日後繼承王位之人而聞名。", "zh_cn": "出身康沃尔的高洁圆桌骑士，传为卡多尔之子。在亚瑟王传说中，亦以日后继承王位之人而闻名。", "ko": "콘월 출신의 고결한 원탁의 기사로 카도르 공의 아들로 전해진다. 아서 왕 전설에서는 훗날 왕위를 잇는 인물로도 알려져 있다."}, "sort_key_i18n": {"zh_tw": "J", "zh_cn": "J"}}, "ブランディレス": {"name": "ブランディレス（ぶらんでぃれす：アーサー王の宮廷に仕える勇敢な円卓の騎士）", "display_name": "ブランディレス（円卓の騎士）", "yomi": "ぶらんでぃれす", "wiki_title": "", "role": "円卓の騎士", "ai_desc": "アーサー王伝説の諸篇にたびたび登場する勇敢な円卓の騎士。礼節と武勇を重んじる歴戦の騎士の一人として描かれる。", "role_i18n": {"ja": "円卓の騎士", "en": "Knight of the Round Table", "zh_tw": "圓桌騎士", "zh_cn": "圆桌骑士", "ko": "원탁의 기사"}, "desc_i18n": {"ja": "アーサー王伝説の諸篇にたびたび登場する勇敢な円卓の騎士。礼節と武勇を重んじる歴戦の騎士の一人として描かれる。", "en": "A gallant Knight of the Round Table who appears frequently across Arthurian tales as a seasoned warrior prizing chivalric courtesy and valor.", "zh_tw": "在亞瑟王傳說諸篇中屢屢登場的勇敢圓桌騎士，被描繪為崇尚禮節與武勇的百戰名將之一。", "zh_cn": "在亚瑟王传说诸篇中屡屡登场的勇敢圆桌骑士，被描绘为崇尚礼节与武勇的百战名将之一。", "ko": "아서 왕 전설의 여러 편에 자주 등장하는 용감한 원탁의 기사. 예절과 무용을 중시하는 역전의 기사 중 한 사람으로 그려진다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "マイルズ": {"name": "マイルズ（まいるず：「白泉の騎士」と称される北方の城主・遍歴の騎士）", "display_name": "マイルズ（白泉の騎士）", "yomi": "まいるず", "wiki_title": "", "role": "「白泉の騎士」と称される北方の領主・騎士", "ai_desc": "北方の地で七つの城と広大な領地を治める有力な騎士。「白泉の騎士（Sir Myles of the White Fountain）」と称され、春の訪れとともに武者修行の旅へ出る。", "role_i18n": {"ja": "「白泉の騎士」と称される北方の領主・騎士", "en": "Northern lord styled Knight of the White Fountain", "zh_tw": "號稱「白泉騎士」的北方領主與騎士", "zh_cn": "号称“白泉骑士”的北方领主与骑士", "ko": "‘하얀 샘의 기사’로 불리는 북방의 영주·기사"}, "desc_i18n": {"ja": "北方の地で七つの城と広大な領地を治める有力な騎士。「白泉の騎士（Sir Myles of the White Fountain）」と称され、春の訪れとともに武者修行の旅へ出る。", "en": "A powerful knight holding seven castles and wide estates in the northern lands. Styled Sir Myles of the White Fountain, he rides forth errant in the springtime in search of knightly adventure.", "zh_tw": "在北方坐擁七座城堡與廣闊領地的有力騎士，號稱「白泉騎士」，於春光明媚之際踏上尋求奇遇的遊俠征途。", "zh_cn": "在北方坐拥七座城堡与广阔领地的有力骑士，号称“白泉骑士”，于春光明媚之际踏上寻求奇遇的游侠征途。", "ko": "북방 땅에서 일곱 개의 성과 광대한 영지를 다스리는 유력한 기사. ‘하얀 샘의 기사’라 불리며, 봄이 찾아오자 무사수행과 모험을 찾아 편력의 길에 오른다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "グリフレット": {"name": "グリフレット（ぐりふれっと：アーサー王の宮廷に仕える若き従者・のちの円卓の騎士）", "display_name": "グリフレット（若き従者・のちの円卓の騎士）", "yomi": "ぐりふれっと", "wiki_title": "", "role": "宮廷の若き従者・のちの円卓の騎士", "ai_desc": "アーサー王の宮廷に仕える勇敢な若者。若くして騎士叙任を志願し、のちに円卓の騎士の一人として長く王に忠誠を尽くす。", "role_i18n": {"ja": "宮廷の若き従者・のちの円卓の騎士", "en": "Young esquire of the court, later Knight of the Round Table", "zh_tw": "宮廷年輕侍從、日後的圓桌騎士", "zh_cn": "宫廷年轻侍从、日后的圆桌骑士", "ko": "궁정의 젊은 종자·훗날의 원탁의 기사"}, "desc_i18n": {"ja": "アーサー王の宮廷に仕える勇敢な若者。若くして騎士叙任を志願し、のちに円卓の騎士の一人として長く王に忠誠を尽くす。", "en": "A brave youth serving at King Arthur's court who eagerly seeks knighthood at an early age and later becomes one of the steadfast Knights of the Round Table.", "zh_tw": "效力於亞瑟王宮廷的勇敢青年，年少時便慷慨請纓受封為騎士，日後成為忠心耿耿的圓桌騎士之一。", "zh_cn": "效力于亚瑟王宫廷的勇敢青年，年少时便慷慨请缨受封为骑士，日后成为忠心耿耿的圆桌骑士之一。", "ko": "아서 왕의 궁정을 섬기는 용감한 젊은이. 어린 나이에 기사 서임을 자원하며, 훗날 원탁의 기사 중 한 사람으로서 오랫동안 왕에게 충성을 바친다."}, "sort_key_i18n": {"zh_tw": "G", "zh_cn": "G"}}, "グィネヴィア": {"name": "グィネヴィア（ぐぃねゔぃあ：カミリアード王レオデグランスの美しき王女・アーサー王の心を捉える貴婦人）", "display_name": "グィネヴィア（カミリアードの美しき王女）", "yomi": "ぐぃねゔぃあ", "wiki_title": "グィネヴィア", "role": "カミリアード王レオデグランスの美しき王女", "ai_desc": "カミリアードの王レオデグランスの娘。騎士道の諸宮廷において並ぶ者なき絶世の美女と称えられ、若きアーサー王がひと目見て深く心を奪われ生涯の忠誠を誓う貴婦人として登場する。", "role_i18n": {"ja": "カミリアード王レオデグランスの美しき王女", "en": "Fair princess of King Leodegrance of Camiliard", "zh_tw": "卡米利亞德王雷奧多格蘭的美麗公主", "zh_cn": "卡米利亚德王雷奥多格兰的美丽公主", "ko": "카밀리아드 왕 레오데그란스의 아름다운 공주"}, "desc_i18n": {"ja": "カミリアードの王レオデグランスの娘。騎士道の諸宮廷において並ぶ者なき絶世の美女と称えられ、若きアーサー王がひと目見て深く心を奪われ生涯の忠誠を誓う貴婦人として登場する。", "en": "Daughter of King Leodegrance of Camiliard. Celebrated throughout all the Courts of Chivalry as the peerless beauty of the world, she captivates the young King Arthur at first sight and inspires his lifelong devotion.", "zh_tw": "卡米利亞德之王雷奧多格蘭的女兒。在各處騎士宮廷中被譽為舉世無雙的絕代佳人，年輕的亞瑟王初次相見便為其傾心不已，並立誓終生向她獻上騎士的赤誠。", "zh_cn": "卡米利亚德之王雷奥多格兰的女儿。在各处骑士宫廷中被誉为举世无双的绝代佳人，年轻的亚瑟王初次相见便为其倾心不已，并立誓终生向她献上骑士的赤诚。", "ko": "카밀리아드의 왕 레오데그란스의 딸. 모든 기사도 궁정에서 세상에 비길 데 없는 절세의 미인으로 칭송받으며, 젊은 아서 왕이 첫눈에 깊이 마음을 빼앗겨 평생의 충절을 맹세하는 귀부인으로 등장한다."}, "sort_key_i18n": {"zh_tw": "G", "zh_cn": "G"}}, "湖の乙女": {"name": "湖の乙女（みずうみのおとめ：魔法の湖に棲まいアーサー王に聖剣エクスカリバーを授ける妖精の貴婦人。原文の Lady of the Lake）", "display_name": "湖の乙女（魔法の湖の貴婦人）", "yomi": "みずうみのおとめ", "wiki_title": "湖の貴婦人", "role": "魔法の湖を治め聖剣を授ける妖精の貴婦人", "ai_desc": "アーサー王伝説に登場する異界・妖精郷の貴婦人（複数いる姉妹たちの総称としても語られる）。魔法の湖の奥深くに館を構え、アーサー王に聖剣エクスカリバーを授けるなど、王と円卓の騎士たちを幾度も導き守護する神秘の存在。", "role_i18n": {"ja": "魔法の湖を治め聖剣を授ける妖精の貴婦人", "en": "Fairy lady of the enchanted lake who bestows Excalibur", "zh_tw": "掌管魔法之湖並賜予聖劍的仙女貴婦人", "zh_cn": "掌管魔法之湖并赐予圣剑的仙女贵妇人", "ko": "마법의 호수를 다스리며 성검을 하사하는 요정 귀부인"}, "desc_i18n": {"ja": "アーサー王伝説に登場する異界・妖精郷の貴婦人（複数いる姉妹たちの総称としても語られる）。魔法の湖の奥深くに館を構え、アーサー王に聖剣エクスカリバーを授けるなど、王と円卓の騎士たちを幾度も導き守護する神秘の存在。", "en": "A supernatural lady of Faerie in Arthurian legend (also spoken of as a sisterhood of Ladies of the Lake) who dwells beneath the enchanted lake and bestows the sword Excalibur upon King Arthur, often aiding him and his knights.", "zh_tw": "亞瑟王傳說中居住於仙境魔法之湖深處的超自然貴婦人（亦泛指湖中眾仙女姊妹），將聖劍王者之劍賜予亞瑟王，並多次庇佑與指引國王及圓桌騎士。", "zh_cn": "亚瑟王传说中居住于仙境魔法之湖深处的超自然贵妇人（亦泛指湖中众仙女姐妹），将圣剑王者之剑赐予亚瑟王，并多次庇佑与指引国王及圆桌骑士。", "ko": "아서 왕 전설에 등장하는 이계와 요정향의 귀부인(여러 자매들을 아울러 일컫기도 한다). 마법의 호수 깊은 곳에 거처를 두고 아서 왕에게 성검 엑스칼리버를 하사하는 등 왕과 원탁의 기사들을 여러 차례 인도하고 수호하는 신비로운 존재이다."}, "sort_key_i18n": {"zh_tw": "H", "zh_cn": "H"}}, "ニムエ": {"name": "ニムエ（にむえ：『湖の乙女たち』の筆頭とされる妖精の貴婦人。原文の Nymue）", "display_name": "ニムエ（湖の乙女たちの筆頭）", "yomi": "にむえ", "wiki_title": "湖の貴婦人", "role": "「湖の乙女たち」の筆頭たる妖精の貴婦人", "ai_desc": "アーサー王伝説に登場する「湖の乙女」の固有名の一つ。ハワード・パイル版では魔法の湖に棲まう妖精の姉妹たちの筆頭として登場し、アーサー王と円卓の騎士たちに深い好意を寄せて聖剣エクスカリバーの獲得を助ける。", "role_i18n": {"ja": "「湖の乙女たち」の筆頭たる妖精の貴婦人", "en": "Chief of the Ladies of the Lake, fairy damsel", "zh_tw": "「湖中仙女」之首的妖精貴婦人", "zh_cn": "“湖中仙女”之首的妖精贵妇人", "ko": "‘호수의 처녀들’의 우두머리인 요정 귀부인"}, "desc_i18n": {"ja": "アーサー王伝説に登場する「湖の乙女」の固有名の一つ。ハワード・パイル版では魔法の湖に棲まう妖精の姉妹たちの筆頭として登場し、アーサー王と円卓の騎士たちに深い好意を寄せて聖剣エクスカリバーの獲得を助ける。", "en": "One of the personal names given in Arthurian romance to the Lady of the Lake. In Howard Pyle's version she appears as the chief of the fairy sisters dwelling in the enchanted lake, befriending King Arthur and aiding him in winning Excalibur.", "zh_tw": "亞瑟王傳奇中「湖中仙女」的專名之一。在霍華德·派爾版本中，她作為居住於魔法之湖的仙女姊妹之首登場，對亞瑟王與圓桌騎士懷有深厚好感，並助其取得王者之劍。", "zh_cn": "亚瑟王传奇中“湖中仙女”的专名之一。在霍华德·派尔版本中，她作为居住于魔法之湖的仙女姐妹之首登场，对亚瑟王与圆桌骑士怀有深厚好感，并助其取得王者之剑。", "ko": "아서 왕 전설에 등장하는 ‘호수의 처녀’의 고유 이름 중 하나. 하워드 파일 판본에서는 마법의 호수에 사는 요정 자매들의 우두머리로 등장하여, 아서 왕과 원탁의 기사들에게 깊은 호의를 품고 성검 엑스칼리버를 얻도록 돕는다."}, "sort_key_i18n": {"zh_tw": "N", "zh_cn": "N"}}, "アグラヴァル": {"name": "アグラヴァル（あぐらゔぁる：ペリノア王の長男・のちの円卓の騎士。原文の Sir Aglaval）", "display_name": "アグラヴァル（ペリノア王の長男・円卓の騎士）", "yomi": "あぐらゔぁる", "wiki_title": "", "role": "ペリノア王の長男・のちの円卓の騎士", "ai_desc": "ペリノア王の長男。アーサー王との和解の証として弟ラモラックとともに宮廷へ遣わされ、のちに誉れ高き円卓の騎士の一人となる。マロリー版などではアグロヴァルの名でも知られる。", "role_i18n": {"ja": "ペリノア王の長男・のちの円卓の騎士", "en": "Eldest son of King Pellinore, later Knight of the Round Table", "zh_tw": "佩利諾爾王的長子，日後的圓桌騎士", "zh_cn": "佩利诺尔王的长子，日后的圆桌骑士", "ko": "펠리노어 왕의 장남, 훗날의 원탁의 기사"}, "desc_i18n": {"ja": "ペリノア王の長男。アーサー王との和解の証として弟ラモラックとともに宮廷へ遣わされ、のちに誉れ高き円卓の騎士の一人となる。マロリー版などではアグロヴァルの名でも知られる。", "en": "Eldest son of King Pellinore. Sent with his brother Lamorack to King Arthur's court as a pledge of good faith, he later becomes an honored Knight of the Round Table, also known as Aglovale in Malory.", "zh_tw": "佩利諾爾王的長子。作為歸順守信的憑證，與弟弟拉莫拉克一同被送往亞瑟王宮廷，日後成為備受尊崇的圓桌騎士之一，在馬洛禮版本中亦稱阿格洛瓦爾。", "zh_cn": "佩利诺尔王的长子。作为归顺守信的凭证，与弟弟拉莫拉克一同被送往亚瑟王宫廷，日后成为备受尊崇的圆桌骑士之一，在马洛礼版本中亦称阿格洛瓦尔。", "ko": "펠리노어 왕의 장남. 화해와 신의의 증표로 아우 라모라크와 함께 아서 왕의 궁정에 보내졌으며, 훗날 영예로운 원탁의 기사 일원이 된다. 맬러리 판본 등에서는 아글로발이라는 이름으로도 알려져 있다."}, "sort_key_i18n": {"zh_tw": "A", "zh_cn": "A"}}, "ラモラック": {"name": "ラモラック（らもらっく：ペリノア王の次男・円卓屈指の武勇を誇る騎士。原文の Sir Lamorack）", "display_name": "ラモラック（ペリノア王の次男・円卓の騎士）", "yomi": "らもらっく", "wiki_title": "", "role": "ペリノア王の次男・のちの円卓の騎士", "ai_desc": "ペリノア王の次男。兄アグラヴァルとともにアーサー王の宮廷へ迎えられ、やがて円卓の騎士に列する。アーサー王伝説ではランスロットやトリスタンに並ぶ屈指の強者として名高い。", "role_i18n": {"ja": "ペリノア王の次男・のちの円卓の騎士", "en": "Second son of King Pellinore, renowned Knight of the Round Table", "zh_tw": "佩利諾爾王的次子，日後的圓桌名將", "zh_cn": "佩利诺尔王的次子，日后的圆桌名将", "ko": "펠리노어 왕의 차남, 훗날의 원탁의 기사"}, "desc_i18n": {"ja": "ペリノア王の次男。兄アグラヴァルとともにアーサー王の宮廷へ迎えられ、やがて円卓の騎士に列する。アーサー王伝説ではランスロットやトリスタンに並ぶ屈指の強者として名高い。", "en": "Second son of King Pellinore who enters King Arthur's court alongside his brother Aglaval and joins the Round Table, celebrated across Arthurian legend as one of the mightiest champions alongside Launcelot and Tristram.", "zh_tw": "佩利諾爾王的次子，與兄長阿格拉瓦爾一同進入亞瑟王宮廷並入列圓桌，在亞瑟王傳說中以堪與蘭斯洛特、崔斯坦並駕齊驅的絕世武勇而聞名。", "zh_cn": "佩利诺尔王的次子，与兄长阿格拉瓦尔一同进入亚瑟王宫廷并入列圆桌，在亚瑟王传说中以堪与兰斯洛特、崔斯坦并驾齐驱的绝世武勇而闻名。", "ko": "펠리노어 왕의 차남으로 형 아글라발과 함께 아서 왕의 궁정에 들어가 원탁의 기사가 된다. 아서 왕 전설에서는 란슬롯, 트리스탄과 어깨를 나란히 하는 굴지의 강자로 이름 높다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "ドーナー": {"name": "ドーナー（どーなー：ペリノア王の年少の息子・のちの円卓の騎士。原文の Dornar）", "display_name": "ドーナー（ペリノア王の年少の息子）", "yomi": "どーなー", "wiki_title": "", "role": "ペリノア王の年少の息子", "ai_desc": "ペリノア王の年少の息子。兄二人がアーサー王の宮廷へ遣わされた際、父王の慰めとして手元に残ることを許された。伝承では成長後に騎士ドーナー（ラ・ボー）として円卓に列する。", "role_i18n": {"ja": "ペリノア王の年少の息子", "en": "Young son of King Pellinore", "zh_tw": "佩利諾爾王的幼子", "zh_cn": "佩利诺尔王的幼子", "ko": "펠리노어 왕의 어린 아들"}, "desc_i18n": {"ja": "ペリノア王の年少の息子。兄二人がアーサー王の宮廷へ遣わされた際、父王の慰めとして手元に残ることを許された。伝承では成長後に騎士ドーナー（ラ・ボー）として円卓に列する。", "en": "Young son of King Pellinore, permitted to remain with his father for his comfort when his two elder brothers were sent to King Arthur's court; in romance he grows up to become a Knight of the Round Table.", "zh_tw": "佩利諾爾王年幼的兒子。在兩位兄長被送往亞瑟王宮廷時，獲准留在父親身邊以慰寂寥；在傳奇中成年後亦成為圓桌騎士。", "zh_cn": "佩利诺尔王年幼的儿子。在两位兄长被送往亚瑟王宫廷时，获准留在父亲身边以慰寂寥；在传奇中成年后亦成为圆桌骑士。", "ko": "펠리노어 왕의 어린 아들. 두 형이 아서 왕의 궁정으로 보내질 때 부왕의 위안이 되도록 곁에 남는 것을 허락받았으며, 전승에서는 장성한 뒤 원탁의 기사가 된다."}, "sort_key_i18n": {"zh_tw": "D", "zh_cn": "D"}}, "モーダント": {"name": "モーダント（もーだんと：ノーサンバーランドの公爵・リエンス王の縁者。原文の Duke Mordaunt of North Umber）", "display_name": "モーダント（ノーサンバーランド公）", "yomi": "もーだんと", "wiki_title": "", "role": "ノーサンバーランドの公爵・リエンス王の縁者", "ai_desc": "ハワード・パイル版に登場するノーサンバーランド（ノース・アンバー）の公爵で、北ウェールズのリエンス王の縁戚。剛勇の戦士ながら類を見ない醜貌と狂暴な気性で知られ、リエンス王の威を借りてグィネヴィア姫との婚姻を要求する。", "role_i18n": {"ja": "ノーサンバーランドの公爵・リエンス王の縁者", "en": "Duke of North Umber, kinsman to King Ryence", "zh_tw": "北安伯公爵，里恩斯王的親族", "zh_cn": "北安伯公爵，里恩斯王的亲族", "ko": "노스엄버의 공작, 리엔스 왕의 친족"}, "desc_i18n": {"ja": "ハワード・パイル版に登場するノーサンバーランド（ノース・アンバー）の公爵で、北ウェールズのリエンス王の縁戚。剛勇の戦士ながら類を見ない醜貌と狂暴な気性で知られ、リエンス王の威を借りてグィネヴィア姫との婚姻を要求する。", "en": "Duke of North Umber in Howard Pyle's tale and kinsman to King Ryence of North Wales. Though a mighty warrior, he is notorious for his hideous visage and violent temper, and seeks the hand of Lady Guinevere in marriage.", "zh_tw": "霍華德·派爾故事中登場的北安伯公爵，為北威爾斯之王里恩斯的親族。雖是勇猛強悍的戰士，卻以舉世罕見的醜陋容貌與暴戾性情惡名昭彰，仗勢強求迎娶桂妮薇兒公主。", "zh_cn": "霍华德·派尔故事中登场的北安伯公爵，为北威尔士之王里恩斯的亲族。虽是勇猛强悍的战士，却以举世罕见的丑陋容貌与暴戾性情恶名昭彰，仗势强求迎娶桂妮薇儿公主。", "ko": "하워드 파일의 이야기에 등장하는 노스엄버(노섬벌랜드)의 공작으로 북웨일스의 왕 리엔스의 친족이다. 강대한 전사이나 세상에 둘도 없을 만큼 추악한 용모와 광포한 성정으로 악명 높으며, 기네비어 공주와의 혼인을 요구한다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "メリセン": {"name": "メリセン（めりせん：「白い手のメリセン」と呼ばれるグィネヴィア姫の侍女。原文の Mellicene of the White Hand）", "display_name": "メリセン（グィネヴィア姫の侍女）", "yomi": "めりせん", "wiki_title": "", "role": "グィネヴィア姫に仕える侍女（「白い手のメリセン」）", "ai_desc": "ハワード・パイル版に登場する、カミリアードのグィネヴィア姫に仕える侍女の一人。「白い手のメリセン」と呼ばれ、早朝の薔薇園の泉で変装を解いていたアーサー王の真の姿を目撃する。", "role_i18n": {"ja": "グィネヴィア姫に仕える侍女（「白い手のメリセン」）", "en": "Damsel attending Lady Guinevere, styled of the White Hand", "zh_tw": "侍奉桂妮薇兒公主的侍女，號稱「白手梅莉森」", "zh_cn": "侍奉桂妮薇儿公主的侍女，号称“白手梅莉森”", "ko": "기네비어 공주를 모시는 시녀(‘하얀 손의 멜리센’)"}, "desc_i18n": {"ja": "ハワード・パイル版に登場する、カミリアードのグィネヴィア姫に仕える侍女の一人。「白い手のメリセン」と呼ばれ、早朝の薔薇園の泉で変装を解いていたアーサー王の真の姿を目撃する。", "en": "One of the damsels attending upon the Lady Guinevere at Cameliard in Howard Pyle's tale, styled Mellicene of the White Hand, who glimpses King Arthur's true knightly form beside the rose-garden fountain.", "zh_tw": "霍華德·派爾故事中於卡米利亞德侍奉桂妮薇兒公主的侍女之一，號稱「白手梅莉森」，曾在清晨的玫瑰園噴泉畔窺見卸下偽裝的亞瑟王真容。", "zh_cn": "霍华德·派尔故事中于卡米利亚德侍奉桂妮薇儿公主的侍女之一，号称“白手梅莉森”，曾在清晨的玫瑰园喷泉畔窥见卸下伪装的亚瑟王真容。", "ko": "하워드 파일의 이야기에서 카밀리아드의 기네비어 공주를 모시는 시녀 중 한 사람. ‘하얀 손의 멜리센’이라 불리며, 이른 아침 장미 정원의 샘가에서 변장을 풀고 있던 아서 왕의 본모습을 목격한다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "ラルフ": {"name": "ラルフ（らるふ：カミリアードの城下町に屋敷を構える豪商・カーディフのラルフ。原文の Ralph of Cardiff）", "display_name": "ラルフ（カーディフ出身の豪商）", "yomi": "らるふ", "wiki_title": "", "role": "カミリアードの城下町に暮らす豪商（「カーディフのラルフ」）", "ai_desc": "ハワード・パイル版に登場する、「カーディフのラルフ」と呼ばれる大商人。カミリアードの町に豪壮な屋敷と宝物庫を構え、その富と名声はカーレオンの宮廷にまで聞こえていた。素性を明かしたアーサー王を厚くもてなし、純白の甲冑と軍馬を用立てる。", "role_i18n": {"ja": "カミリアードの城下町に暮らす豪商（「カーディフのラルフ」）", "en": "Wealthy merchant of Cameliard, styled Ralph of Cardiff", "zh_tw": "居於卡米利亞德城鎮的富商，號稱「卡地夫的拉爾夫」", "zh_cn": "居于卡米利亚德城镇的富商，号称“卡迪夫的拉尔夫”", "ko": "카밀리아드 성하 마을의 거상(‘카디프의 랠프’)"}, "desc_i18n": {"ja": "ハワード・パイル版に登場する、「カーディフのラルフ」と呼ばれる大商人。カミリアードの町に豪壮な屋敷と宝物庫を構え、その富と名声はカーレオンの宮廷にまで聞こえていた。素性を明かしたアーサー王を厚くもてなし、純白の甲冑と軍馬を用立てる。", "en": "A wealthy merchant dwelling in the town of Cameliard in Howard Pyle's tale, styled Ralph of Cardiff, whose riches and splendid armory were famed as far as Carleon; he entertains King Arthur royally and furnishes him with milk-white armor and steed.", "zh_tw": "霍華德·派爾故事中居住於卡米利亞德城鎮的大富商，號稱「卡地夫的拉爾夫」，其萬貫家財與珍藏名甲之盛名遠播至卡利恩；他在識出亞瑟王的尊貴身分後盛情款待，並為其備妥純白甲冑與戰馬。", "zh_cn": "霍华德·派尔故事中居住于卡米利亚德城镇的大富商，号称“卡迪夫的拉尔夫”，其万贯家财与珍藏名甲之盛名远播至卡利恩；他在识出亚瑟王的尊贵身份后盛情款待，并为其备妥纯白甲胄与战马。", "ko": "하워드 파일의 이야기에서 카밀리아드 고을에 저택을 두고 사는 부유한 상인으로 ‘카디프의 랠프’라 불린다. 막대한 부와 훌륭한 갑주 창고의 명성이 칼리언에까지 알려졌으며, 신분을 밝힌 아서 왕을 극진히 대접하고 순백의 갑옷과 군마를 내어 준다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}};

의 궁정에 놓인 상하 구분 없는 큰 원탁, 그리고 그 둘레에 앉도록 선택받은 고결하고 용맹한 기사들의 기사단."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "聖杯": {"title": "聖杯（せいはい：キリストゆかりの聖なる杯。円卓の騎士たちが探究する至高の神秘。原文の Holy Grail）", "yomi": "せいはい", "wiki_title": "聖杯", "mapping_note": "底本の Holy Grail / holy cup を「聖杯」と紐づけて解説しています。", "ai_desc": "最後の晩餐でイエス・キリストが用いたと伝えられる聖なる杯。アーサー王伝説では、円卓の騎士たちがその探索に挑む至高の神秘として語られる。", "role_i18n": {"ja": "キリスト教・騎士道神秘伝承", "en": "Sacred cup of Christ sought by Arthur's knights", "zh_tw": "基督的聖爵，圓桌騎士追尋的至高神秘", "zh_cn": "基督的圣爵，圆桌骑士追寻的至高神秘", "ko": "그리스도의 성스러운 잔, 원탁의 기사들이 탐색하는 지고의 신비"}, "desc_i18n": {"ja": "最後の晩餐でイエス・キリストが用いたと伝えられる聖なる杯。アーサー王伝説では、円卓の騎士たちがその探索に挑む至高の神秘として語られる。", "en": "The sacred vessel associated with Jesus Christ at the Last Supper; in Arthurian legend, the quest for the Holy Grail is the supreme spiritual adventure of the Knights of the Round Table.", "zh_tw": "相傳為耶穌基督於最後的晚餐中所用的神聖杯爵。在亞瑟王傳說中，追尋聖杯是圓桌騎士們所投身的至高神聖冒險。", "zh_cn": "相传为耶稣基督于最后的晚餐中所用的神圣杯爵。在亚瑟王传说中，追寻圣杯是圆桌骑士们所投身的至高神圣冒险。", "ko": "최후의 만찬에서 예수 그리스도가 사용했다고 전해지는 성스러운 잔. 아서 왕 전설에서는 원탁의 기사들이 그 탐색에 나서는 지고한 신비의 모험으로 그려진다."}, "sort_key_i18n": {"zh_tw": "S", "zh_cn": "S"}}, "エクスカリバー": {"title": "エクスカリバー（えくすかりばー：アーサー王が帯びた不世出の聖剣・名剣。原文の Excalibur）", "yomi": "えくすかりばー", "wiki_title": "エクスカリバー", "mapping_note": "底本の Excalibur を「エクスカリバー」と紐づけて解説しています。", "ai_desc": "アーサー王伝説を象徴する伝説の名剣。比類なき輝きと切れ味を備え、王権と騎士道の栄光を体現する神秘の剣として語り継がれる。", "role_i18n": {"ja": "聖剣・騎士道伝承", "en": "Peerless legendary sword borne by King Arthur", "zh_tw": "亞瑟王所佩的曠世聖劍與名劍", "zh_cn": "亚瑟王所佩的旷世圣剑与名剑", "ko": "아서 왕이 패용한 불세출의 성검·명검"}, "desc_i18n": {"ja": "アーサー王伝説を象徴する伝説の名剣。比類なき輝きと切れ味を備え、王権と騎士道の栄光を体現する神秘の剣として語り継がれる。", "en": "The iconic sword of Arthurian legend, celebrated down the ages as a blade of matchless splendor and keenness embodying royal majesty and chivalric glory.", "zh_tw": "象徵亞瑟王傳說的傳奇名劍，兼具舉世無雙的光輝與鋒芒，作為體現王權威儀與騎士道榮耀的神祕寶劍而流芳百世。", "zh_cn": "象征亚瑟王传说的传奇名剑，兼具举世无双的光辉与锋芒，作为体现王权威仪与骑士道荣耀的神秘宝剑而流芳百世。", "ko": "아서 왕 전설을 상징하는 전설의 명검. 비길 데 없는 광채와 예리함을 지녔으며, 왕권과 기사도의 영광을 구현하는 신비로운 검으로 길이 전해진다."}, "sort_key_i18n": {"zh_tw": "A", "zh_cn": "A"}}, "妖精の国": {"title": "妖精の国（ようせいのくに：人間の世の境界の彼方に広がる神秘の異界。原文の Faerie / land of Faerie）", "yomi": "ようせいのくに", "wiki_title": "妖精郷", "mapping_note": "底本の land of Faerie / Faerie を「妖精の国」と紐づけて解説しています。", "ai_desc": "中世ロマンスやケルト伝承において、人間の世界と隣り合いながらも魔法の霧や森の奥に隔てられた神秘の異界。超自然の貴婦人や不可思議な奇跡が息づく領域として描かれる。", "role_i18n": {"ja": "異界・ケルト伝承", "en": "Mystical otherworld beyond the mortal realm", "zh_tw": "人世邊界彼端的神祕仙境與異界", "zh_cn": "人世边界彼端的神秘仙境与异界", "ko": "인간 세상의 경계 너머에 펼쳐진 신비로운 이계"}, "desc_i18n": {"ja": "中世ロマンスやケルト伝承において、人間の世界と隣り合いながらも魔法の霧や森の奥に隔てられた神秘の異界。超自然の貴婦人や不可思議な奇跡が息づく領域として描かれる。", "en": "In medieval romance and Celtic lore, an enchanted otherworld bordering mortal lands yet veiled behind magic mists and deep woods, inhabited by supernatural ladies and marvels.", "zh_tw": "在中世紀傳奇與凱爾特傳承中，與人間相鄰卻隱於魔法迷霧或幽深森林彼端的神祕異界，棲息著超自然的貴婦人與種種不可思議的奇蹟。", "zh_cn": "在中世纪传奇与凯尔特传承中，与人间相邻却隐于魔法迷雾或幽深森林彼端的神秘异界，栖息着超自然的贵妇人与种种不可思议的奇迹。", "ko": "중세 로맨스와 켈트 전승에서 인간 세계와 맞닿아 있으면서도 마법의 안개와 깊은 숲 너머로 가로막힌 신비의 이계. 초자연적인 귀부인과 불가사의한 경이가 깃든 영역으로 그려진다."}, "sort_key_i18n": {"zh_tw": "X", "zh_cn": "X"}}, "魔法の湖": {"title": "魔法の湖（まほうのみずうみ：妖精の国の奥深くにたたずむ神秘の湖。原文の Lake of Enchantment）", "yomi": "まほうのみずうみ", "wiki_title": "湖の貴婦人", "mapping_note": "底本の Lake of Enchantment を「魔法の湖」と紐づけて解説しています。", "ai_desc": "アーサー王伝説において、異界の貴婦人が住まい神秘の剣エクスカリバーが授けられる魔法の湖。人間の世とは異なる超自然の秩序に守られた聖域として描かれる。", "role_i18n": {"ja": "異界・騎士道神秘伝承", "en": "Mystical lake dwelling within the land of Faerie", "zh_tw": "隱於仙境深處的神祕湖泊", "zh_cn": "隐于仙境深处的神秘湖泊", "ko": "요정의 나라 깊은 곳에 자리한 신비의 호수"}, "desc_i18n": {"ja": "アーサー王伝説において、異界の貴婦人が住まい神秘の剣エクスカリバーが授けられる魔法の湖。人間の世とは異なる超自然の秩序に守られた聖域として描かれる。", "en": "In Arthurian legend, a sacred enchanted lake inhabited by a lady of the otherworld, from whose waters the wondrous sword Excalibur is bestowed.", "zh_tw": "亞瑟王傳說中由異界貴婦人所居、並賜予神劍艾克斯卡利伯的魔法湖泊，受超自然秩序守護的神聖水域。", "zh_cn": "亚瑟王传说中由异界贵妇人所居、并赐予神剑艾克斯卡利伯的魔法湖泊，受超自然秩序守护的神圣水域。", "ko": "아서 왕 전설에서 이계의 귀부인이 머물며 신검 엑스칼리버가 하사되는 마법의 호수. 인간 세상과는 다른 초자연적 질서에 수호되는 성역으로 그려진다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "歓喜の谷": {"title": "歓喜の谷（かんきのたに：森の奥に開けた花咲き乱れる美しい谷と城。原文の Valley of Delight）", "yomi": "かんきのたに", "wiki_title": "", "mapping_note": "底本の Valley of Delight を「歓喜の谷」と紐づけて解説しています。", "ai_desc": "アスクの森の奥深くに開けた、色とりどりの花が咲き乱れる明るく美しい谷間。赤い屋根の城が建ち、炎色の繻子をまとった三人の美しい乙女たちが住まい、旅の騎士をもてなす。", "role_i18n": {"ja": "物語上の地名・異郷", "en": "Flower-strewn valley in the forest", "zh_tw": "森林深處繁花盛開的美麗山谷", "zh_cn": "森林深处繁花盛开的美丽山谷", "ko": "숲 깊은 곳에 펼쳐진 꽃이 만발한 아름다운 골짜기"}, "desc_i18n": {"ja": "アスクの森の奥深くに開けた、色とりどりの花が咲き乱れる明るく美しい谷間。赤い屋根の城が建ち、炎色の繻子をまとった三人の美しい乙女たちが住まい、旅の騎士をもてなす。", "en": "A bright, flower-strewn valley deep within the Forest of Usk, where stands a red-roofed castle inhabited by three fair damsels clad in flame-colored satin who welcome passing knights.", "zh_tw": "位於烏斯克森林深處、遍地繁花盛開的明媚山谷，谷中矗立著紅頂城堡，住著三名身穿火焰色緞袍的美麗少女，常款待途經的遊俠騎士。", "zh_cn": "位于乌斯克森林深处、遍地繁花盛开的明媚山谷，谷中矗立着红顶城堡，住着三名身穿火焰色缎袍的美丽少女，常款待途经的游侠骑士。", "ko": "어스크 숲 깊은 곳에 자리하여 온갖 꽃이 만발한 밝고 아름다운 골짜기. 붉은 지붕의 성이 서 있으며 불꽃 빛깔 공단 옷을 입은 세 명의 아름다운 처녀가 머물며 지나가는 기사를 대접한다."}, "sort_key_i18n": {"zh_tw": "H", "zh_cn": "H"}}, "ミゼリコルディア": {"title": "ミゼリコルディア（みぜりこるでぃあ：組み討ちで相手の降伏を促すため騎士が帯びた細身の短剣。原文の misericordia）", "yomi": "みぜりこるでぃあ", "wiki_title": "", "mapping_note": "底本の misericordia を「ミゼリコルディア」と紐づけて解説しています。", "ai_desc": "中世ヨーロッパの騎士が腰に帯びた細身の短剣。ラテン語で「慈悲」を意味し、組み伏せた相手の甲冑の隙間や喉元に突きつけて降伏（慈悲の嘆願）を迫り、あるいは致命傷を与えるために用いられた。", "role_i18n": {"ja": "中世武具・騎士道用語", "en": "Slender medieval dagger of mercy", "zh_tw": "中世紀騎士所佩的慈悲短劍", "zh_cn": "中世纪骑士所佩的慈悲短剑", "ko": "중세 기사가 패용한 자비의 단검"}, "desc_i18n": {"ja": "中世ヨーロッパの騎士が腰に帯びた細身の短剣。ラテン語で「慈悲」を意味し、組み伏せた相手の甲冑の隙間や喉元に突きつけて降伏（慈悲の嘆願）を迫り、あるいは致命傷を与えるために用いられた。", "en": "A slender dagger worn by medieval knights. Named from the Latin for 'mercy,' it was held to a fallen foe's throat or armor joints in close combat to compel surrender or deal a final blow.", "zh_tw": "中世紀歐洲騎士佩於腰間的細長短劍，名稱源於拉丁語「慈悲」之意，用於在近身搏鬥中抵住倒地對手的喉嚨或甲冑縫隙，迫使其求饒投降或給予致命一擊。", "zh_cn": "中世纪欧洲骑士佩于腰间的细长短剑，名称源于拉丁语“慈悲”之意，用于在近身搏斗中抵住倒地对手的喉咙或甲胄缝隙，迫使其求饶投降或给予致命一击。", "ko": "중세 유럽의 기사가 허리에 차던 가늘고 긴 단검. 라틴어로 ‘자비’를 뜻하며, 맞붙어 제압한 상대의 갑옷 틈새나 목덜미에 겨누어 항복을 받아 내거나 최후의 일격을 가하는 데 쓰였다."}, "sort_key_i18n": {"zh_tw": "C", "zh_cn": "C"}}, "アロイ": {"title": "アロイ（あろい：別名「冒険の森」と呼ばれる神秘の森林地帯。原文の Arroy / Forest of Adventure）", "yomi": "あろい", "wiki_title": "", "mapping_note": "底本の Arroy（Forest of Adventure）を「アロイ」と紐づけて解説しています。", "ai_desc": "アーサー王伝説に登場する神秘の森林地帯で、別名「冒険の森」とも呼ばれる。足を踏み入れた騎士には必ず不思議な冒険が降りかかると伝えられ、その奥は妖精の国や魔法の湖へと通じている。", "role_i18n": {"ja": "物語上の地名・冒険の森", "en": "Mysterious woodland called the Forest of Adventure", "zh_tw": "又名「冒險之森」的神祕森林地帶", "zh_cn": "又名“冒险之森”的神秘森林地带", "ko": "‘모험의 숲’이라 불리는 신비로운 삼림 지대"}, "desc_i18n": {"ja": "アーサー王伝説に登場する神秘の森林地帯で、別名「冒険の森」とも呼ばれる。足を踏み入れた騎士には必ず不思議な冒険が降りかかると伝えられ、その奥は妖精の国や魔法の湖へと通じている。", "en": "A mysterious woodland in Arthurian legend also known as the Forest of Adventure, where no knight ever enters without encountering some strange adventure, bordering upon the enchanted realm of the Lake.", "zh_tw": "亞瑟王傳說中登場的神祕森林地帶，又稱「冒險之森」。相傳凡踏入其中的騎士必會遭遇奇特冒險，其深處緊鄰著妖精之國與魔法之湖。", "zh_cn": "亚瑟王传说中登场的神秘森林地带，又称“冒险之森”。相传凡踏入其中的骑士必会遭遇奇特冒险，其深处紧邻着妖精之国与魔法之湖。", "ko": "아서 왕 전설에 등장하는 신비로운 삼림 지대로 ‘모험의 숲’이라고도 불린다. 발을 들여놓은 기사는 반드시 기이한 모험을 겪게 된다고 전해지며, 그 깊은 곳은 요정의 나라 및 마법의 호수와 맞닿아 있다."}, "sort_key_i18n": {"zh_tw": "A", "zh_cn": "A"}}, "ティンタガロン": {"title": "ティンタガロン（てぃんたがろん：北ウェールズとカミリアードの国境近くを守る王城。原文の Tintagalon）", "yomi": "てぃんたがろん", "wiki_title": "", "mapping_note": "底本の Tintagalon を伝説上の城館名として解説しています（コーンウォールのティンタジェルとは別）。", "ai_desc": "ハワード・パイル版に登場する伝説上の王城。北ウェールズとカミリアード王国の国境地帯を守護する要衝の城館であり、コーンウォール北岸のティンタジェル城とは別の城として描かれる。", "role_i18n": {"ja": "物語上の城館名", "en": "Royal border castle near Cameliard and North Wales", "zh_tw": "鄰近卡米利亞德與北威爾斯邊境的王室城堡", "zh_cn": "邻近卡米利亚德与北威尔士边境的王室城堡", "ko": "카밀리아드와 북웨일스 국경 부근을 지키는 왕성"}, "desc_i18n": {"ja": "ハワード・パイル版に登場する伝説上の王城。北ウェールズとカミリアード王国の国境地帯を守護する要衝の城館であり、コーンウォール北岸のティンタジェル城とは別の城として描かれる。", "en": "A legendary royal castle in Howard Pyle's tale standing near the borders of North Wales and Cameliard, distinct from Tintagel Castle on the Cornish coast.", "zh_tw": "霍華德·派爾故事中登場的傳說王城，坐落於北威爾斯與卡米利亞德王國交界地帶，是守護邊境的重鎮（與康沃爾海岸的廷塔哲城不同）。", "zh_cn": "霍华德·派尔故事中登场的传说王城，坐落于北威尔士与卡米利亚德王国交界地带，是守护边境的重镇（与康沃尔海岸的廷塔哲城不同）。", "ko": "하워드 파일의 이야기에 등장하는 전설 속 왕성. 북웨일스와 카밀리아드 왕국의 국경 지대를 수호하는 요충지의 성채로, 콘월 해안의 틴타겔 성과는 다른 성으로 그려진다."}, "sort_key_i18n": {"zh_tw": "T", "zh_cn": "T"}}, "キャメロット": {"title": "キャメロット（きゃめろっと：アーサー王が最盛期の宮廷と円卓を置いた伝説上の王都。原文の Camelot）", "yomi": "きゃめろっと", "wiki_title": "キャメロット", "mapping_note": "底本の Camelot を伝説上の王都名として解説しています。", "ai_desc": "アーサー王伝説において、アーサー王が壮麗な王宮と円卓を構えたとされる伝説上の王都。クレティアン・ド・トロワ以来の騎士道物語で騎士たちの冒険の出発点かつ栄光の象徴として描かれるが、実在の所在地は定まっておらず諸説がある。", "role_i18n": {"ja": "伝説上の王都・宮廷", "en": "Legendary royal capital and seat of King Arthur's court", "zh_tw": "亞瑟王設置宮廷與圓桌的傳說王都", "zh_cn": "亚瑟王设置宫廷与圆桌的传说王都", "ko": "아서 왕이 궁정과 원탁을 둔 전설 속 왕도"}, "desc_i18n": {"ja": "アーサー王伝説において、アーサー王が壮麗な王宮と円卓を構えたとされる伝説上の王都。クレティアン・ド・トロワ以来の騎士道物語で騎士たちの冒険の出発点かつ栄光の象徴として描かれるが、実在の所在地は定まっておらず諸説がある。", "en": "The legendary royal capital and castle where King Arthur held his splendid court and Round Table. Celebrated in chivalric romance since Chrétien de Troyes as the emblem of Arthurian glory, though its real-world site remains unidentified.", "zh_tw": "亞瑟王傳說中亞瑟王建立宏偉王宮與圓桌的傳說王都。自克雷蒂安·德·特魯瓦以來的騎士文學中，一直被描繪為眾騎士踏上冒險的起點與榮耀象徵，惟其確切地理位置至今未有定論。", "zh_cn": "亚瑟王传说中亚瑟王建立宏伟王宫与圆桌的传说王都。自克雷蒂安·德·特鲁瓦以来的骑士文学中，一直被描绘为众骑士踏上冒险的起点与荣耀象征，惟其确切地理位置至今未有定论。", "ko": "아서 왕 전설에서 아서 왕이 장려한 왕궁과 원탁을 두었다고 전해지는 전설 속 왕도. 크레티앵 드 트루아 이래의 기사도 문학에서 기사들의 모험이 시작되는 출발점이자 영광의 상징으로 그려지나 실제 위치는 정설이 없다."}, "sort_key_i18n": {"zh_tw": "K", "zh_cn": "K"}}};
    const NATURE_MOUNTAINS = [];

    // 手元校正モード判定（file://, localhost, 127.0.0.1, または ?edit=1）
    const urlParams = new URLSearchParams(window.location.search);
    const IS_DEV_MODE = (

      urlParams.get("edit") === "1"
    );

      document.getElementById("devTrayHead").addEventListener("click", function() {

    }

    // 公開対象レコードのフィルタリング（本番Webでは公開上限段落以下のみ表示）
    const VISIBLE_RECORDS = ALL_RECORDS.filter(function(r) {
      if (IS_DEV_MODE) return Boolean(r.is_enriched);
      return Boolean(r.is_enriched) && Number(r.para_index) <= PUBLISHED_MAX_PARAGRAPH_INDEX;
    });

    const AVAILABLE_PARAS = Array.from(new Set(VISIBLE_RECORDS.map(function(r) {
      return Number(r.para_index);
    }))).sort(function(a, b) { return a - b; });

    let currentParaIndex = AVAILABLE_PARAS.length > 0 ? AVAILABLE_PARAS[0] : 1;
    let isAllParasMode = true;

    // =========================================================================
    // HTMLエスケープおよびインライン4色タグ変換
    // =========================================================================
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const TAG_REGEX = /\{\{(place|person|office|special):([^|}]+)\|([^}]+)\}\}/g;

    function convertTaggedTextToHtml(taggedStr) {
      const src = String(taggedStr || "");
      let result = "";
      let lastIdx = 0;
      let match;
      TAG_REGEX.lastIndex = 0;
      while ((match = TAG_REGEX.exec(src)) !== null) {
        result += escapeHtml(src.slice(lastIdx, match.index));
        const kind = match[1];
        const key = match[2];
        const surface = match[3];
        result += (
          '<span class="inline-' + escapeHtml(kind) + '" ' +
          'data-tag-kind="' + escapeHtml(kind) + '" ' +
          'data-tag-key="' + escapeHtml(key) + '">' +
          escapeHtml(surface) +
          '</span>'
        );
        lastIdx = TAG_REGEX.lastIndex;
      }
      result += escapeHtml(src.slice(lastIdx));
      return result;
    }

    function collectPlaceKeysFromRecords(recordsList) {
      const keys = [];
      const seen = new Set();
      recordsList.forEach(function(rec) {
        if (rec.places) {
          rec.places.split(",").forEach(function(k) {
            const trimmed = k.trim();
            if (trimmed && PLACES_MASTER[trimmed] && !seen.has(trimmed)) {
              seen.add(trimmed);
              keys.push(trimmed);
            }
          });
        }
      });
      return keys;
    }

    const PLACE_NAMES_I18N = {"ブリテン島": {"en": "Britain", "ja": "ブリテン", "zh_tw": "不列顛", "zh_cn": "不列颠", "ko": "브리튼"}, "ティンタジェル": {"en": "Tintegal", "ja": "ティンタジェル", "zh_tw": "廷塔哲", "zh_cn": "廷塔哲", "ko": "틴타겔"}, "オークニー": {"en": "Orkney", "ja": "オークニー", "zh_tw": "奧克尼", "zh_cn": "奥克尼", "ko": "오크니"}, "カンタベリー": {"en": "Canterbury", "ja": "カンタベリー", "zh_tw": "坎特伯里", "zh_cn": "坎特伯雷", "ko": "캔터베리"}, "ロンドン": {"en": "London", "ja": "ロンドン", "zh_tw": "倫敦", "zh_cn": "伦敦", "ko": "런던"}, "ウェールズ": {"en": "Wales", "ja": "ウェールズ", "zh_tw": "威爾斯", "zh_cn": "威尔士", "ko": "웨일스"}, "スコットランド": {"en": "Scotland", "ja": "スコットランド", "zh_tw": "蘇格蘭", "zh_cn": "苏格兰", "ko": "스코틀랜드"}, "コーンウォール": {"en": "Cornwall", "ja": "コーンウォール", "zh_tw": "康沃爾", "zh_cn": "康沃尔", "ko": "콘월"}, "ノーサンバーランド": {"en": "Northumberland", "ja": "ノーサンバーランド", "zh_tw": "諾森伯蘭", "zh_cn": "诺森伯兰", "ko": "노섬벌랜드"}, "イングランド": {"en": "England", "ja": "イングランド", "zh_tw": "英格蘭", "zh_cn": "英格兰", "ko": "잉글랜드"}, "アスクの森": {"en": "Forests of the Usk", "ja": "アスクの森", "zh_tw": "烏斯克森林", "zh_cn": "乌斯克森林", "ko": "어스크의 숲"}, "カーレオン": {"en": "Carleon", "ja": "カーレオン", "zh_tw": "卡利恩", "zh_cn": "卡利恩", "ko": "칼리언"}, "カーディフ": {"en": "Cardiff", "ja": "カーディフ", "zh_tw": "卡地夫", "zh_cn": "卡迪夫", "ko": "카디프"}};
    function localPlaceName(key) {

    function openGlossaryModal(kind, key) {
      let entry = null;
      if (kind === "person") entry = PERSON_GLOSSARY[key];
      else if (kind === "office") entry = OFFICE_GLOSSARY[key];
      else if (kind === "special") entry = SPECIAL_GLOSSARY[key];
      if (!entry) return;

      const titleStr = entry.name || entry.title || key;
      modalTitleEl.textContent = titleStr;

      const htmlParts = [];

      if (kind === "person" && Array.isArray(entry.homonyms) && entry.homonyms.length > 0) {
        const allKeys = [key].concat(entry.homonyms);
        htmlParts.push('<div class="homonym-switch-bar">');
        htmlParts.push('<span style="font-size:0.74rem;font-weight:700;color:#5a4631;width:100%;">👥 同名異人の切り替え：</span>');
        allKeys.forEach(function(hKey) {
          const hEntry = PERSON_GLOSSARY[hKey];
          if (!hEntry) return;
          const curCls = hKey === key ? " is-current" : "";
          const btnLabel = hEntry.display_name || hKey;
          htmlParts.push(

        htmlParts.push('</div>');

      if (entry.mapping_note) {
        htmlParts.push('<div class="modal-mapping-note">' + escapeHtml(entry.mapping_note) + '</div>');
      }

      htmlParts.push('<div>' + escapeHtml(entry.ai_desc || "") + '</div>');

      if (entry.wiki_title) {
        const wikiUrl = "https://ja.wikipedia.org/wiki/" + encodeURIComponent(entry.wiki_title);
        htmlParts.push(
          '<div id="modalWikiBox" class="modal-wiki-box">' +
          '<strong>🌐 Wikipedia（' + escapeHtml(entry.wiki_title) + '）</strong>' +
          '<div id="modalWikiExtract" style="margin-top:4px;color:#4a3f33;">読み込み中…</div>' +
          '<div style="margin-top:4px;"><a href="' + escapeHtml(wikiUrl) + '" target="_blank" rel="noopener noreferrer">Wikipedia記事を開く ↗</a></div>' +
          '</div>'
        );
      }

      const crossIdx = window.SHARED_CROSS_INDEX;
      if (crossIdx && crossIdx.occurrences && crossIdx.occurrences[kind] && crossIdx.occurrences[kind][key]) {
        const occRecIds = crossIdx.occurrences[kind][key];
        if (occRecIds.length > 0) {
          htmlParts.push('<div class="modal-occ-section">');
          htmlParts.push('<div class="modal-occ-heading">📖 登場箇所へジャンプ</div>');
          htmlParts.push('<div class="occ-jump-list">');
          occRecIds.forEach(function(rid) {
            const recMeta = crossIdx.records[rid];
            if (!recMeta) return;
            const volFile = "vol" + String(recMeta.vol_id).padStart(2, "0") + ".html";
            const label = "第" + recMeta.vol_id + "章 第" + recMeta.para + "段";
            if (Number(recMeta.vol_id) === CURRENT_VOL_ID) {
              htmlParts.push(
                '<button type="button" class="occ-jump-btn" data-jump-para="' + recMeta.para + '" data-jump-rec="' + escapeHtml(rid) + '">' +
                escapeHtml(label) + '</button>'
              );
            } else {
              htmlParts.push(
                '<a class="occ-jump-btn" href="' + escapeHtml(volFile) + '?para=' + recMeta.para + '&rec=' + encodeURIComponent(rid) + '">' +
                escapeHtml(label) + '</a>'
              );
            }
          });
          htmlParts.push('</div></div>');
        }
      }

      modalBodyEl.innerHTML = htmlParts.join("");
      modalEl.classList.add("is-open");

      if (entry.wiki_title) {
        const wTitle = entry.wiki_title;
        const targetDiv = document.getElementById("modalWikiExtract");
        if (wikiCache[wTitle]) {
          if (targetDiv) targetDiv.textContent = wikiCache[wTitle];
        } else {
          fetch("https://ja.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(wTitle))
            .then(function(res) { return res.ok ? res.json() : null; })
            .then(function(data) {
              const txt = (data && data.extract) ? data.extract : "Wikipedia要約を取得できませんでした。リンクから直接ご覧ください。";
              wikiCache[wTitle] = txt;
              const currentDiv = document.getElementById("modalWikiExtract");
              if (currentDiv) currentDiv.textContent = txt;
            })
            .catch(function() {
              const currentDiv = document.getElementById("modalWikiExtract");
              if (currentDiv) currentDiv.textContent = "オフラインまたは接続制限のためWikipedia要約を表示できません。";
            });
        }
      }
    }

    modalBodyEl.addEventListener("click", function(ev) {
      const switchBtn = ev.target.closest("[data-switch-key]");
      if (switchBtn) {
        openGlossaryModal(switchBtn.getAttribute("data-switch-kind"), switchBtn.getAttribute("data-switch-key"));
        return;
      }
      const jumpBtn = ev.target.closest("[data-jump-rec]");
      if (jumpBtn) {
        const targetPara = Number(jumpBtn.getAttribute("data-jump-para"));
        const targetRecId = jumpBtn.getAttribute("data-jump-rec");
        modalEl.classList.remove("is-open");
        jumpToRecordInPage(targetPara, targetRecId);
      }
    });

    // =========================================================================
    // 手元校正フィードバック保存機能
    // =========================================================================
    function loadDevFeedbackList() {
      try {
        return JSON.parse(localStorage.getItem(DEV_STORAGE_KEY) || "[]");
      } catch (_e) {
        return [];
      }
    }

    function updateDevCounter() {
      const cntEl = document.getElementById("devIssueCount");
      if (cntEl) cntEl.textContent = String(loadDevFeedbackList().length);
    }

    function addDevFeedbackItem(item) {
      const arr = loadDevFeedbackList();
      arr.push(item);
      localStorage.setItem(DEV_STORAGE_KEY, JSON.stringify(arr));
      updateDevCounter();
    }

    document.getElementById("copyIssuesBtn").addEventListener("click", function() {
      const jsonStr = JSON.stringify(loadDevFeedbackList(), null, 2);
      navigator.clipboard.writeText(jsonStr).then(function() {
        window.alert("指摘リストJSONをクリップボードにコピーしました。");
      });
    });

    document.getElementById("clearIssuesBtn").addEventListener("click", function() {
      localStorage.removeItem(DEV_STORAGE_KEY);
      updateDevCounter();
    });

    // =========================================================================
    // 4言語切替UI・段落制御・カード描画（スクロール連動なし・明示クリック時のみ地図移動）
    // =========================================================================
    const paraSelectEl = document.getElementById("paraSelect");
    const prevParaBtn = document.getElementById("prevParaBtn");
    const nextParaBtn = document.getElementById("nextParaBtn");
    const toggleAllParasBtn = document.getElementById("toggleAllParasBtn");
    const recordsContainerEl = document.getElementById("recordsContainer");
    const recordsScrollEl = document.getElementById("recordsScroll");

    const UI_I18N = {
      ja: {
        appName: "アーサー王物語",
        volTitle: "Prologue",
        prevPara: "←",
        nextPara: "→",
        allParas: "全段一覧",
        paraOptionPrefix: "第 ",
        paraOptionSuffix: "",
        paraBadgePrefix: "第",
        paraBadgeMid: "段・",
        typeProse: "本文",
        typeVerse: "詩篇",
        sourceSummary: "📜 原典（英語底本：Howard Pyle 1903）を表示",
        refJaSummary: "📜 日本語訳を表示",
        untranslatedNote: "（この段落の日本語訳は準備中です）"
      },
      en: {
        appName: "King Arthur",
        volTitle: "Prologue",
        prevPara: "←",
        nextPara: "→",
        allParas: "All Paras",
        paraOptionPrefix: "Para ",
        paraOptionSuffix: "",
        paraBadgePrefix: "Para ",
        paraBadgeMid: " · ",
        typeProse: "Prose",
        typeVerse: "Verse",
        sourceSummary: "📜 Show Japanese Translation",
        refJaSummary: "📜 Show Japanese Translation",
        untranslatedNote: "(English text pending)"
      },
      zh_tw: {
        appName: "亞瑟王物語",
        volTitle: "Prologue",
        prevPara: "←",
        nextPara: "→",
        allParas: "全段一覽",
        paraOptionPrefix: "第 ",
        paraOptionSuffix: "",
        paraBadgePrefix: "第",
        paraBadgeMid: "段・",
        typeProse: "正文",
        typeVerse: "詩篇",
        sourceSummary: "📜 顯示英文底本（Howard Pyle 1903）",
        refJaSummary: "📜 顯示日文譯文",
        untranslatedNote: "（本段繁體中文譯文準備中，以下暫顯示日文譯文）"
      },
      zh_cn: {
        appName: "亚瑟王物语",
        volTitle: "Prologue",
        prevPara: "←",
        nextPara: "→",
        allParas: "全段一览",
        paraOptionPrefix: "第 ",
        paraOptionSuffix: "",
        paraBadgePrefix: "第",
        paraBadgeMid: "段・",
        typeProse: "正文",
        typeVerse: "诗篇",
        sourceSummary: "📜 显示英文底本（Howard Pyle 1903）",
        refJaSummary: "📜 显示日文译文",
        untranslatedNote: "（本段简体中文译文准备中，以下暂显示日文译文）"
      },
      ko: {
        appName: "아서왕 이야기",
        volTitle: "Prologue",
        prevPara: "←",
        nextPara: "→",
        allParas: "전체 단락",
        paraOptionPrefix: "제 ",
        paraOptionSuffix: "",
        paraBadgePrefix: "제",
        paraBadgeMid: "단락 · ",
        typeProse: "본문",
        typeVerse: "시편",
        sourceSummary: "📜 영문 저본(Howard Pyle 1903) 보기",
        refJaSummary: "📜 일본어 번역 보기",
        untranslatedNote: "(이 단락의 한국어 번역은 준비 중입니다. 아래는 일본어 번역입니다.)"
      }
    };

    const qLang = urlParams.get("lang");
    let currentLang = (qLang && SUPPORTED_LANGS.includes(qLang))
      ? qLang
      : (localStorage.getItem(LANG_STORAGE_KEY) || "ja");
    if (!SUPPORTED_LANGS.includes(currentLang)) currentLang = "ja";

    const langStyleEl = document.createElement("style");
    langStyleEl.textContent = [
      ".lang-switch-bar { display:inline-flex; gap:3px; flex-shrink:0; }",
      ".lang-btn { background:rgba(255,255,255,0.1); color:#f6efe2; border:1px solid rgba(212,180,131,0.45); border-radius:4px; padding:3px 7px; font-size:0.74rem; font-weight:700; cursor:pointer; white-space:nowrap; }",
      ".lang-btn.is-active { background:var(--accent-gold); color:#ffffff; border-color:var(--accent-gold-light); }",
      ".untranslated-banner { font-size:0.78rem; color:var(--text-muted); margin-bottom:6px; font-family:system-ui,-apple-system,sans-serif; }"
    ].join("\n");
    document.head.appendChild(langStyleEl);

    const readerHeaderEl = document.querySelector(".para-bar");
    if (readerHeaderEl) {
      const langBar = document.createElement("div");
      langBar.className = "lang-switch-bar";
      langBar.setAttribute("role", "group");
      langBar.setAttribute("aria-label", "Language");
      [
        { code: "en", label: "EN" },
        { code: "ja", label: "日" },
        { code: "zh_tw", label: "繁" },
        { code: "zh_cn", label: "簡" },
        { code: "ko", label: "韓" }
      ].forEach(function(item) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lang-btn" + (item.code === currentLang ? " is-active" : "");
        btn.setAttribute("data-lang-code", item.code);
        btn.textContent = item.label;
        btn.addEventListener("click", function() {
          currentLang = item.code;
          try { localStorage.setItem(LANG_STORAGE_KEY, currentLang); } catch (_e) {}
          langBar.querySelectorAll(".lang-btn").forEach(function(b) {
            b.classList.toggle("is-active", b.getAttribute("data-lang-code") === currentLang);
          });
          applyLanguageToStaticUi();
          renderRecords(true);
        });
        langBar.appendChild(btn);
      });
      readerHeaderEl.appendChild(langBar);
    }

    function applyLanguageToStaticUi() {
      const dict = UI_I18N[currentLang] || UI_I18N.ja;
      if (window.applyNavLang) window.applyNavLang(currentLang);
      const appNameEl = document.querySelector(".reader-app-name");
      const volTitleEl = document.querySelector(".reader-vol-title");
      if (appNameEl) appNameEl.textContent = dict.appName;
      if (volTitleEl) volTitleEl.textContent = dict.volTitle;
      prevParaBtn.textContent = dict.prevPara;
      nextParaBtn.textContent = dict.nextPara;
      toggleAllParasBtn.textContent = dict.allParas;
      paraSelectEl.innerHTML = AVAILABLE_PARAS.map(function(p) {
        return '<option value="' + p + '">' + escapeHtml(dict.paraOptionPrefix + p + " / " + AVAILABLE_PARAS.length + dict.paraOptionSuffix) + '</option>';
      }).join("");
      paraSelectEl.value = String(currentParaIndex);
    }

    function updateParaControlsState() {
      paraSelectEl.value = String(currentParaIndex);
      const idx = AVAILABLE_PARAS.indexOf(currentParaIndex);
      prevParaBtn.disabled = idx <= 0;
      nextParaBtn.disabled = idx < 0 || idx >= AVAILABLE_PARAS.length - 1;
      toggleAllParasBtn.classList.toggle("is-active-mode", isAllParasMode);
    }

    // 段落切替・初期表示時は地点丸ピンの入れ替えのみを行い、勝手な地図移動・先頭カード強調は行わない
    function renderRecords(refreshPins) {
      const dict = UI_I18N[currentLang] || UI_I18N.ja;
      const targetList = isAllParasMode
        ? VISIBLE_RECORDS
        : VISIBLE_RECORDS.filter(function(r) { return Number(r.para_index) === currentParaIndex; });

      const cardsHtml = targetList.map(function(rec) {
        const isVerse = rec.type === "詩篇";
        const cardCls = "record-card" + (isVerse ? " is-verse" : "");
        const badgeCls = "type-badge" + (isVerse ? " verse" : "");
        const typeLabel = isVerse ? dict.typeVerse : dict.typeProse;
        const eraText = (rec.era_year_i18n && rec.era_year_i18n[currentLang])
          ? rec.era_year_i18n[currentLang]
          : (rec.era_year || "");
        const eraHtml = eraText ? '<span class="era-badge">⏳ ' + escapeHtml(eraText) + '</span>' : "";

        let mainTagged = rec.translation_tagged || "";
        let subSummary = dict.sourceSummary;
        let subTagged = rec.raw_tagged || "";
        let fallbackBanner = "";

        if (currentLang === "en") {
          mainTagged = rec.raw_tagged || "";
          subSummary = dict.refJaSummary;
          subTagged = rec.translation_tagged || "";
        } else if (currentLang === "zh_tw") {
          if (rec.zh_tw_tagged) {
            mainTagged = rec.zh_tw_tagged;
          } else {
            fallbackBanner = '<div class="untranslated-banner">' + escapeHtml(dict.untranslatedNote) + '</div>';
          }
        } else if (currentLang === "zh_cn") {
          if (rec.zh_cn_tagged) {
            mainTagged = rec.zh_cn_tagged;
          } else {
            fallbackBanner = '<div class="untranslated-banner">' + escapeHtml(dict.untranslatedNote) + '</div>';
          }
        } else if (currentLang === "ko") {
          if (rec.ko_tagged) {
            mainTagged = rec.ko_tagged;
          } else {
            fallbackBanner = '<div class="untranslated-banner">' + escapeHtml(dict.untranslatedNote) + '</div>';
          }
        }

        return (
          '<article class="' + cardCls + '" id="card-' + escapeHtml(rec.id) + '" data-rec-id="' + escapeHtml(rec.id) + '" data-para-index="' + rec.para_index + '">' +
            '<div class="card-meta-bar">' +
              '<div class="card-badges">' +
                '<span class="' + badgeCls + '">' + escapeHtml(dict.paraBadgePrefix + rec.para_index + dict.paraBadgeMid + typeLabel) + '</span>' +
                eraHtml +
              '</div>' +
              '<span>' + escapeHtml(rec.id) + '</span>' +
            '</div>' +
            fallbackBanner +
            '<div class="trans-box">' + convertTaggedTextToHtml(mainTagged) + '</div>' +
            (currentLang === "en" ? "" : (
              '<details class="source-details" open>' +
                '<summary>' + escapeHtml(subSummary) + '</summary>' +
                '<div class="source-text-body">' + convertTaggedTextToHtml(subTagged) + '</div>' +
              '</details>'
            )) +
            '<div class="card-dev-bar">' +
              '<button type="button" class="dev-flag-btn" data-dev-rec="' + escapeHtml(rec.id) + '" data-dev-type="座標・地名">📍 座標・地名</button>' +
              '<button type="button" class="dev-flag-btn" data-dev-rec="' + escapeHtml(rec.id) + '" data-dev-type="翻訳表現">✏️ 翻訳表現</button>' +
              '<button type="button" class="dev-flag-btn" data-dev-rec="' + escapeHtml(rec.id) + '" data-dev-type="人物・用語タグ">🏷️ タグ・辞書</button>' +
            '</div>' +
          '</article>'
        );
      }).join("");

      recordsContainerEl.innerHTML = cardsHtml;
      updateParaControlsState();

      if (refreshPins !== false) {
        const placeKeys = collectPlaceKeysFromRecords(targetList);
        mapCtrl.renderPlaceKeys(placeKeys, false);
      }
    }

    function jumpToRecordInPage(paraNum, recId) {
      if (!AVAILABLE_PARAS.includes(paraNum)) return;
      currentParaIndex = paraNum;
      if (!isAllParasMode) {
        renderRecords(true);
      } else {
        updateParaControlsState();
      }
      const cardEl = document.getElementById("card-" + recId) ||
        recordsContainerEl.querySelector('[data-para-index="' + paraNum + '"]');
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    // 本文クリック委譲（緑地名をクリックした時のみ focusPlace で地図移動・強調）
    recordsContainerEl.addEventListener("click", function(ev) {
      const baseTarget = (ev.target && ev.target.nodeType === 1) ? ev.target : (ev.target ? ev.target.parentElement : null);
      if (!baseTarget) return;

      const tagEl = baseTarget.closest("[data-tag-kind]");
      if (tagEl) {
        const kind = tagEl.getAttribute("data-tag-kind");
        const key = tagEl.getAttribute("data-tag-key");
        if (kind === "place") {
          mapCtrl.focusPlace(key, tagEl.textContent || key, true);
        } else {
          openGlossaryModal(kind, key);
        }
        return;
      }

      const devBtn = baseTarget.closest("[data-dev-rec]");
      if (devBtn) {
        const rid = devBtn.getAttribute("data-dev-rec");
        const dtype = devBtn.getAttribute("data-dev-type");
        const memo = window.prompt("[" + rid + " / " + dtype + "] 指摘メモを入力してください:", "");
        if (memo !== null) {
          addDevFeedbackItem({ rec_id: rid, category: dtype, note: memo, ts: new Date().toISOString() });
        }
      }
    });

    // 段落コントロール操作（ピン入れ替えのみ・地図中心は維持）
    paraSelectEl.addEventListener("change", function() {
      const chosen = Number(paraSelectEl.value);
      currentParaIndex = chosen;
      if (isAllParasMode) {
        const paraRecs = VISIBLE_RECORDS.filter(function(r) { return Number(r.para_index) === chosen; });
        mapCtrl.renderPlaceKeys(collectPlaceKeysFromRecords(paraRecs), false);
        const targetEl = recordsContainerEl.querySelector('[data-para-index="' + chosen + '"]');
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        updateParaControlsState();
      } else {
        recordsScrollEl.scrollTop = 0;
        renderRecords(true);
      }
    });

    prevParaBtn.addEventListener("click", function() {
      const idx = AVAILABLE_PARAS.indexOf(currentParaIndex);
      if (idx > 0) {
        paraSelectEl.value = String(AVAILABLE_PARAS[idx - 1]);
        paraSelectEl.dispatchEvent(new Event("change"));
      }
    });

    nextParaBtn.addEventListener("click", function() {
      const idx = AVAILABLE_PARAS.indexOf(currentParaIndex);
      if (idx >= 0 && idx < AVAILABLE_PARAS.length - 1) {
        paraSelectEl.value = String(AVAILABLE_PARAS[idx + 1]);
        paraSelectEl.dispatchEvent(new Event("change"));
      }
    });

    toggleAllParasBtn.addEventListener("click", function() {
      isAllParasMode = !isAllParasMode;
      recordsScrollEl.scrollTop = 0;
      renderRecords(true);
    });

    // 初期描画＆URLクエリ (?para=X&rec=Y&place=Z) 対応
    applyLanguageToStaticUi();
    updateDevCounter();
    renderRecords(true);

    const qPara = Number(urlParams.get("para"));
    const qRec = urlParams.get("rec");
    const qPlace = urlParams.get("place");
    if (qPara && AVAILABLE_PARAS.includes(qPara)) {
      setTimeout(function() {
        jumpToRecordInPage(qPara, qRec || ("v" + CURRENT_VOL_ID + "_p" + qPara + "_1"));
        if (qPlace) {
          mapCtrl.focusPlace(qPlace, qPlace, true);
        }
      }, QUERY_JUMP_DELAY_MS);
    } else if (qPlace) {
      setTimeout(function() {
        mapCtrl.focusPlace(qPlace, qPlace, true);
      }, QUERY_JUMP_DELAY_MS);
    }
  })();
  </script>
</body>
</html>
