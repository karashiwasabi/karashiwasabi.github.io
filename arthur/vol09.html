、{{person:グィネヴィア|グィネヴィア}}姫が大いに不思議に思われながら姿を現し、数名の侍女たちを引き連れて回廊を歩み進め、ちょうど{{person:アーサー|アーサー}}{{office:王|王}}が立っている真上のところまでお出ましになった。{{person:アーサー|アーサー}}{{office:王|王}}が顔を上げて頭上の姫のお姿を目にすると、胸の内に限りない愛おしさがこみ上げてきた。そして王は姫に向かってこう申し上げた。「姫君よ、私は自らの力の及ぶ限り、貴女様に誉れを捧げたいと強く願っております。というのも、私はこれより、この城の前を行き来しているかの{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}と一騎打ちを交えるべく出陣するところだからでございます。のみならず、私は必ずや彼を打ち倒してみせると願い、かつ堅く信じております。つきましては、一人の{{office:騎士|騎士}}が貴婦人の名誉のために馬を駆って出陣する折、貴婦人がその{{office:騎士|騎士}}に身につけさせるべく授けられるような何らかの印の品を、どうか私にお恵みくださいますよう伏してお願い申し上げます」", "persons": "アーサー,グィネヴィア", "places": "ノーサンバーランド", "offices": "王,公爵,騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "就這樣，亞瑟王策馬前往城堡的偏門，抵達該處後便翻身下馬，將戰馬拴好。隨後他徑直步入花園，在那裡尋見一名侍從，當即要求立刻面見桂妮薇兒小姐進言。那侍從見他氣宇軒昂、威儀不凡，心中大為驚嘆敬畏，連忙前去通傳口信；不多時，桂妮薇兒小姐滿心好奇地走出內室，率領幾名侍女沿著長廊款款行來，一直走到亞瑟王所立之處的正上方。亞瑟王抬起頭來，望見上方她的倩影，心中頓時湧起無比深切的愛慕之情。於是他向她說道：「小姐，我滿心渴望竭己所能為您爭光獻譽。因為我此刻正要出城，去與那位在城堡前來回策馬叫陣的北安伯公爵決一勝負。況且我深切期盼並篤信自己定能將他擊敗；因此，我懇求您賜予我一件信物——正如一位騎士為貴婦人爭取榮耀而策馬出征時，貴婦人所賜予那名騎士佩帶在身的信物一樣。」", "zh_tw_tagged": "就這樣，{{person:アーサー|亞瑟}}{{office:王|王}}策馬前往城堡的偏門，抵達該處後便翻身下馬，將戰馬拴好。隨後他徑直步入花園，在那裡尋見一名侍從，當即要求立刻面見{{person:グィネヴィア|桂妮薇兒}}小姐進言。那侍從見他氣宇軒昂、威儀不凡，心中大為驚嘆敬畏，連忙前去通傳口信；不多時，{{person:グィネヴィア|桂妮薇兒}}小姐滿心好奇地走出內室，率領幾名侍女沿著長廊款款行來，一直走到{{person:アーサー|亞瑟}}{{office:王|王}}所立之處的正上方。{{person:アーサー|亞瑟}}{{office:王|王}}抬起頭來，望見上方她的倩影，心中頓時湧起無比深切的愛慕之情。於是他向她說道：「小姐，我滿心渴望竭己所能為您爭光獻譽。因為我此刻正要出城，去與那位在城堡前來回策馬叫陣的{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}決一勝負。況且我深切期盼並篤信自己定能將他擊敗；因此，我懇求您賜予我一件信物——正如一位{{office:騎士|騎士}}為貴婦人爭取榮耀而策馬出征時，貴婦人所賜予那名{{office:騎士|騎士}}佩帶在身的信物一樣。」", "zh_cn": "就这样，亚瑟王策马前往城堡的偏门，抵达该处后便翻身下马，将战马拴好。随后他径直步入花园，在那里寻见一名侍从，当即要求立刻面见桂妮薇儿小姐进言。那侍从见他气宇轩昂、威仪不凡，心中大为惊叹敬畏，连忙前去通传口信；不多时，桂妮薇儿小姐满心好奇地走出内室，率领几名侍女沿着长廊款款行来，一直走到亚瑟王所立之处的正上方。亚瑟王抬起头来，望见上方她的倩影，心中顿时涌起无比深切的爱慕之情。于是他向她说道：“小姐，我满心渴望竭己所能为您争光献誉。因为我此刻正要出城，去与那位在城堡前来回策马叫阵的北安伯公爵决一胜负。况且我深切期盼并笃信自己定能将他击败；因此，我恳求您赐予我一件信物——正如一位骑士为贵妇人争取荣耀而策马出征时，贵妇人所赐予那名骑士佩带在身的信物一样。”", "zh_cn_tagged": "就这样，{{person:アーサー|亚瑟}}{{office:王|王}}策马前往城堡的偏门，抵达该处后便翻身下马，将战马拴好。随后他径直步入花园，在那里寻见一名侍从，当即要求立刻面见{{person:グィネヴィア|桂妮薇儿}}小姐进言。那侍从见他气宇轩昂、威仪不凡，心中大为惊叹敬畏，连忙前去通传口信；不多时，{{person:グィネヴィア|桂妮薇儿}}小姐满心好奇地走出内室，率领几名侍女沿着长廊款款行来，一直走到{{person:アーサー|亚瑟}}{{office:王|王}}所立之处的正上方。{{person:アーサー|亚瑟}}{{office:王|王}}抬起头来，望见上方她的倩影，心中顿时涌起无比深切的爱慕之情。于是他向她说道：“小姐，我满心渴望竭己所能为您争光献誉。因为我此刻正要出城，去与那位在城堡前来回策马叫阵的{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}决一胜负。况且我深切期盼并笃信自己定能将他击败；因此，我恳求您赐予我一件信物——正如一位{{office:騎士|骑士}}为贵妇人争取荣耀而策马出征时，贵妇人所赐予那名{{office:騎士|骑士}}佩带在身的信物一样。”", "ko": "그리하여 아서 왕은 성의 쪽문으로 발길을 돌려 그곳에 이르자 말에서 내려 말을 매어 두었다. 그런 다음 곧장 정원으로 들어가 그곳에서 시종 하나를 찾아내고는, 지금 당장 기네비어 아가씨를 뵙고 말씀을 나누고자 한다고 청하였다. 시종은 그의 군주다운 위엄 있는 풍모에 몹시 놀라며 들어가 전갈을 올렸고, 이윽고 기네비어 아가씨가 크게 의아해하며 여러 시녀들을 거느리고 회랑을 따라 걸어 나와 마침내 아서 왕이 서 있는 곳 바로 위쪽에 이르렀다. 아서 왕은 고개를 들어 머리 위에 서 있는 그녀를 바라보자 마음속으로 그녀를 더없이 깊이 사랑하게 되었다. 그가 그녀에게 말하였다. “아가씨, 저는 제 힘이 닿는 한 그대에게 영예를 바치고자 하는 큰 뜻을 품고 있소. 이제 저는 이 성 앞을 말 타고 오가는 저 노스엄버 공작과 맞붙어 싸우러 나가는 길이오. 더욱이 저는 반드시 그를 쓰러뜨려 패배시키리라 바라며 또한 굳게 믿고 있소. 그러하오니 한 기사가 귀부인의 명예를 드높이기 위하여 말을 몰고 출전할 때 귀부인이 그 기사에게 몸에 지니도록 하사하는 그러한 정표를 제게도 하나 내려 주시기를 간절히 청하는 바이오.”", "ko_tagged": "그리하여 {{person:アーサー|아서}} {{office:王|왕}}은 성의 쪽문으로 발길을 돌려 그곳에 이르자 말에서 내려 말을 매어 두었다. 그런 다음 곧장 정원으로 들어가 그곳에서 시종 하나를 찾아내고는, 지금 당장 {{person:グィネヴィア|기네비어}} 아가씨를 뵙고 말씀을 나누고자 한다고 청하였다. 시종은 그의 군주다운 위엄 있는 풍모에 몹시 놀라며 들어가 전갈을 올렸고, 이윽고 {{person:グィネヴィア|기네비어}} 아가씨가 크게 의아해하며 여러 시녀들을 거느리고 회랑을 따라 걸어 나와 마침내 {{person:アーサー|아서}} {{office:王|왕}}이 서 있는 곳 바로 위쪽에 이르렀다. {{person:アーサー|아서}} {{office:王|왕}}은 고개를 들어 머리 위에 서 있는 그녀를 바라보자 마음속으로 그녀를 더없이 깊이 사랑하게 되었다. 그가 그녀에게 말하였다. “아가씨, 저는 제 힘이 닿는 한 그대에게 영예를 바치고자 하는 큰 뜻을 품고 있소. 이제 저는 이 성 앞을 말 타고 오가는 저 {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}과 맞붙어 싸우러 나가는 길이오. 더욱이 저는 반드시 그를 쓰러뜨려 패배시키리라 바라며 또한 굳게 믿고 있소. 그러하오니 한 {{office:騎士|기사}}가 귀부인의 명예를 드높이기 위하여 말을 몰고 출전할 때 귀부인이 그 {{office:騎士|기사}}에게 몸에 지니도록 하사하는 그러한 정표를 제게도 하나 내려 주시기를 간절히 청하는 바이오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p19_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 19, "type": "本文", "raw_text": "Then the Lady Guinevere said: \"Certes, Sir Knight, I would that I knew who thou art. Yet, though I know not, nevertheless I am altogether willing for to take thee for my champion as thou offerest. So, touching that token thou speakest of, if thou wilt tell me what thing it is that thou desirest, I will gladly give it to thee.\"", "translation": "するとグィネヴィア姫はこう仰せられた。「まことに、騎士殿よ、私は貴殿がいかなるお方であるかを知ることができたならと願わずにはいられませぬ。さりながら、たとえお名前を存じ上げずとも、貴殿が申し出てくださる通り、貴殿を私の代理の闘士としてお迎えすることにいささかの異存もございませぬ。それゆえ、今お話しになられたその印の品につきましても、貴殿が何を望まれるのかをおっしゃってくださるならば、喜んでそれを貴殿に授けましょう」", "raw_tagged": "Then the Lady {{person:グィネヴィア|Guinevere}} said: \"Certes, Sir {{office:騎士|Knight}}, I would that I knew who thou art. Yet, though I know not, nevertheless I am altogether willing for to take thee for my champion as thou offerest. So, touching that token thou speakest of, if thou wilt tell me what thing it is that thou desirest, I will gladly give it to thee.\"", "translation_tagged": "すると{{person:グィネヴィア|グィネヴィア}}姫はこう仰せられた。「まことに、{{office:騎士|騎士}}殿よ、私は貴殿がいかなるお方であるかを知ることができたならと願わずにはいられませぬ。さりながら、たとえお名前を存じ上げずとも、貴殿が申し出てくださる通り、貴殿を私の代理の闘士としてお迎えすることにいささかの異存もございませぬ。それゆえ、今お話しになられたその印の品につきましても、貴殿が何を望まれるのかをおっしゃってくださるならば、喜んでそれを貴殿に授けましょう」", "persons": "グィネヴィア", "places": "", "offices": "騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是桂妮薇兒小姐開口答道：「誠然，騎士閣下，我真希望能知曉您究竟是何方高人。然而，縱使我不知您的名姓，既然您如此慷慨自薦，我依然滿心願意奉您為替我出戰的護衛勇士。至於您方才所提的那件信物，只要您告訴我您心中所求的是哪一樣東西，我定當欣然將它贈予您。」", "zh_tw_tagged": "於是{{person:グィネヴィア|桂妮薇兒}}小姐開口答道：「誠然，{{office:騎士|騎士}}閣下，我真希望能知曉您究竟是何方高人。然而，縱使我不知您的名姓，既然您如此慷慨自薦，我依然滿心願意奉您為替我出戰的護衛勇士。至於您方才所提的那件信物，只要您告訴我您心中所求的是哪一樣東西，我定當欣然將它贈予您。」", "zh_cn": "于是桂妮薇儿小姐开口答道：“诚然，骑士阁下，我真希望能知晓您究竟是何方高人。然而，纵使我不知您的名姓，既然您如此慷慨自荐，我依然满心愿意奉您为替我出战的护卫勇士。至于您方才所提的那件信物，只要您告诉我您心中所求的是哪一样东西，我定当欣然将它赠予您。”", "zh_cn_tagged": "于是{{person:グィネヴィア|桂妮薇儿}}小姐开口答道：“诚然，{{office:騎士|骑士}}阁下，我真希望能知晓您究竟是何方高人。然而，纵使我不知您的名姓，既然您如此慷慨自荐，我依然满心愿意奉您为替我出战的护卫勇士。至于您方才所提的那件信物，只要您告诉我您心中所求的是哪一样东西，我定当欣然将它赠予您。”", "ko": "그러자 기네비어 아가씨가 말하였다. “참으로, 기사 경이여, 나는 그대가 누구인지 알 수 있다면 좋겠소. 하나 비록 내가 그대가 누구인지 알지 못할지라도, 그대가 자청한 대로 그대를 나의 대리 용사로 삼기를 진심으로 기꺼이 원하오. 그러니 그대가 말한 그 정표에 관하여서도, 그대가 바라는 물건이 무엇인지 내게 말해 주기만 한다면 기쁜 마음으로 그것을 그대에게 내어 주겠소.”", "ko_tagged": "그러자 {{person:グィネヴィア|기네비어}} 아가씨가 말하였다. “참으로, {{office:騎士|기사}} 경이여, 나는 그대가 누구인지 알 수 있다면 좋겠소. 하나 비록 내가 그대가 누구인지 알지 못할지라도, 그대가 자청한 대로 그대를 나의 대리 용사로 삼기를 진심으로 기꺼이 원하오. 그러니 그대가 말한 그 정표에 관하여서도, 그대가 바라는 물건이 무엇인지 내게 말해 주기만 한다면 기쁜 마음으로 그것을 그대에게 내어 주겠소.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p20_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 20, "type": "本文", "raw_text": "\"An that be so, Lady,\" said King Arthur, \"I would fain have that necklace that thou wearest about thy throat. For, meseems that if I had that tied about my arm, I would find my valor greatly increased thereby.\"", "translation": "「さようでございますならば、姫君よ」とアーサー王は申し上げた。「貴女様がそのお首にかけておられるその首飾りを、ぜひとも賜りたく存じます。と申しますのも、もしそれをわが腕に結びつけて戦いに臨みましたなら、それによって私の武勇はいや増しに奮い立つように思われるからでございます」", "raw_tagged": "\"An that be so, Lady,\" said {{office:王|King}} {{person:アーサー|Arthur}}, \"I would fain have that necklace that thou wearest about thy throat. For, meseems that if I had that tied about my arm, I would find my valor greatly increased thereby.\"", "translation_tagged": "「さようでございますならば、姫君よ」と{{person:アーサー|アーサー}}{{office:王|王}}は申し上げた。「貴女様がそのお首にかけておられるその首飾りを、ぜひとも賜りたく存じます。と申しますのも、もしそれをわが腕に結びつけて戦いに臨みましたなら、それによって私の武勇はいや増しに奮い立つように思われるからでございます」", "persons": "アーサー", "places": "", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「既然如此，小姐，」亞瑟王說道，「我極盼能求得您佩戴在頸間的那串項鍊。因為在我看來，倘若我能將它繫在自己的手臂上出戰，我的勇氣必會因此而倍增無疑。」", "zh_tw_tagged": "「既然如此，小姐，」{{person:アーサー|亞瑟}}{{office:王|王}}說道，「我極盼能求得您佩戴在頸間的那串項鍊。因為在我看來，倘若我能將它繫在自己的手臂上出戰，我的勇氣必會因此而倍增無疑。」", "zh_cn": "“既然如此，小姐，”亚瑟王说道，“我极盼能求得您佩戴在颈间的那串项链。因为在我看来，倘若我能将它系在自己的手臂上出战，我的勇气必会因此而倍增无疑。”", "zh_cn_tagged": "“既然如此，小姐，”{{person:アーサー|亚瑟}}{{office:王|王}}说道，“我极盼能求得您佩戴在颈间的那串项链。因为在我看来，倘若我能将它系在自己的手臂上出战，我的勇气必会因此而倍增无疑。”", "ko": "“진정 그러하다면, 아가씨,” 하고 아서 왕이 말하였다. “그대가 목에 걸고 계신 저 목걸이를 기꺼이 하사받고 싶소. 내 생각에 만일 저 목걸이를 내 팔에 동여매고 나간다면, 그로 말미암아 나의 용맹이 한층 더 크게 북돋워질 것만 같기 때문이오.”", "ko_tagged": "“진정 그러하다면, 아가씨,” 하고 {{person:アーサー|아서}} {{office:王|왕}}이 말하였다. “그대가 목에 걸고 계신 저 목걸이를 기꺼이 하사받고 싶소. 내 생각에 만일 저 목걸이를 내 팔에 동여매고 나간다면, 그로 말미암아 나의 용맹이 한층 더 크게 북돋워질 것만 같기 때문이오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p21_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 21, "type": "本文", "raw_text": "\"Pardee, Sir Knight,\" said the Lady, \"what thou desirest of me thou shalt assuredly have.\" Thereupon speaking, she took from her long, smooth neck the necklace of pearls which she wore, and dropped the same down to King Arthur where he stood.", "translation": "「誓って、騎士殿よ」と姫は仰せられた。「貴殿が私にお望みになるものは、必ずや貴殿の手に授けましょう」そう言葉を継ぐが早いか、姫はすらりと伸びた滑らかなお首から身につけておられた真珠の首飾りを外されると、アーサー王が佇んでいる足もとへとそれを落としてお与えになった。", "raw_tagged": "\"Pardee, Sir {{office:騎士|Knight}},\" said the Lady, \"what thou desirest of me thou shalt assuredly have.\" Thereupon speaking, she took from her long, smooth neck the necklace of pearls which she wore, and dropped the same down to {{office:王|King}} {{person:アーサー|Arthur}} where he stood.", "translation_tagged": "「誓って、{{office:騎士|騎士}}殿よ」と姫は仰せられた。「貴殿が私にお望みになるものは、必ずや貴殿の手に授けましょう」そう言葉を継ぐが早いか、姫はすらりと伸びた滑らかなお首から身につけておられた真珠の首飾りを外されると、{{person:アーサー|アーサー}}{{office:王|王}}が佇んでいる足もとへとそれを落としてお与えになった。", "persons": "アーサー", "places": "", "offices": "騎士,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「憑神起誓，騎士閣下，」小姐答道，「凡是您向我所求之物，您必定能夠如願得償。」話音方落，她便從自己修長柔滑的玉頸上取下所戴的那串珍珠項鍊，朝著亞瑟王站立的地方垂落擲下。", "zh_tw_tagged": "「憑神起誓，{{office:騎士|騎士}}閣下，」小姐答道，「凡是您向我所求之物，您必定能夠如願得償。」話音方落，她便從自己修長柔滑的玉頸上取下所戴的那串珍珠項鍊，朝著{{person:アーサー|亞瑟}}{{office:王|王}}站立的地方垂落擲下。", "zh_cn": "“凭神起誓，骑士阁下，”小姐答道，“凡是您向我所求之物，您必定能够如愿得偿。”话音方落，她便从自己修长柔滑的玉颈上取下所戴的那串珍珠项链，朝着亚瑟王站立的地方垂落掷下。", "zh_cn_tagged": "“凭神起誓，{{office:騎士|骑士}}阁下，”小姐答道，“凡是您向我所求之物，您必定能够如愿得偿。”话音方落，她便从自己修长柔滑的玉颈上取下所戴的那串珍珠项链，朝着{{person:アーサー|亚瑟}}{{office:王|王}}站立的地方垂落掷下。", "ko": "“맹세코, 기사 경이여,” 하고 아가씨가 말하였다. “그대가 내게서 바라는 것이라면 틀림없이 얻게 될 것이오.” 그렇게 말하면서 그녀는 길고 매끄러운 목에서 자신이 걸고 있던 진주 목걸이를 풀어 내어, 아래쪽에 서 있는 아서 왕에게로 그것을 떨어뜨려 주었다.", "ko_tagged": "“맹세코, {{office:騎士|기사}} 경이여,” 하고 아가씨가 말하였다. “그대가 내게서 바라는 것이라면 틀림없이 얻게 될 것이오.” 그렇게 말하면서 그녀는 길고 매끄러운 목에서 자신이 걸고 있던 진주 목걸이를 풀어 내어, 아래쪽에 서 있는 {{person:アーサー|아서}} {{office:王|왕}}에게로 그것을 떨어뜨려 주었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p22_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 22, "type": "本文", "raw_text": "And King Arthur took the necklace and tied it about his arm, and he gave great thanks for it. Then he saluted the Lady Guinevere with very knightly grace, and she saluted him, and then, straightway, he went forth from that place, greatly expanded with joy that the Lady Guinevere had shown him such favor.", "translation": "アーサー王はその首飾りを手に取って自らの腕にしっかりと結びつけ、姫に深甚なる感謝の言葉を捧げた。それから王はまことに騎士らしい優雅な礼節をもってグィネヴィア姫に一礼し、姫もまた王に答礼された。かくして王は、グィネヴィア姫がこれほどまでの厚意を示してくださったことに胸いっぱいの歓喜を溢れさせながら、ただちにその場を立ち去って出陣へと向かったのであった。", "raw_tagged": "And {{office:王|King}} {{person:アーサー|Arthur}} took the necklace and tied it about his arm, and he gave great thanks for it. Then he saluted the Lady {{person:グィネヴィア|Guinevere}} with very knightly grace, and she saluted him, and then, straightway, he went forth from that place, greatly expanded with joy that the Lady {{person:グィネヴィア|Guinevere}} had shown him such favor.", "translation_tagged": "{{person:アーサー|アーサー}}{{office:王|王}}はその首飾りを手に取って自らの腕にしっかりと結びつけ、姫に深甚なる感謝の言葉を捧げた。それから王はまことに騎士らしい優雅な礼節をもって{{person:グィネヴィア|グィネヴィア}}姫に一礼し、姫もまた王に答礼された。かくして王は、{{person:グィネヴィア|グィネヴィア}}姫がこれほどまでの厚意を示してくださったことに胸いっぱいの歓喜を溢れさせながら、ただちにその場を立ち去って出陣へと向かったのであった。", "persons": "アーサー,グィネヴィア", "places": "", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "亞瑟王接過那串項鍊，將它牢牢繫在自己的手臂上，並向她致以萬分誠摯的謝意。隨後他以極具騎士風範的優雅儀態向桂妮薇兒小姐行禮致敬，她也向他回禮；緊接著，他便因桂妮薇兒小姐對自己展現這般青睞與厚意而滿懷歡欣鼓舞，當即大步離開了那個地方。", "zh_tw_tagged": "{{person:アーサー|亞瑟}}{{office:王|王}}接過那串項鍊，將它牢牢繫在自己的手臂上，並向她致以萬分誠摯的謝意。隨後他以極具騎士風範的優雅儀態向{{person:グィネヴィア|桂妮薇兒}}小姐行禮致敬，她也向他回禮；緊接著，他便因{{person:グィネヴィア|桂妮薇兒}}小姐對自己展現這般青睞與厚意而滿懷歡欣鼓舞，當即大步離開了那個地方。", "zh_cn": "亚瑟王接过那串项链，将它牢牢系在自己的手臂上，并向她致以万分诚挚的谢意。随后他以极具骑士风范的优雅仪态向桂妮薇儿小姐行礼致敬，她也向他回礼；紧接着，他便因桂妮薇儿小姐对自己展现这般青睐与厚意而满怀欢欣鼓舞，当即大步离开了那个地方。", "zh_cn_tagged": "{{person:アーサー|亚瑟}}{{office:王|王}}接过那串项链，将它牢牢系在自己的手臂上，并向她致以万分诚挚的谢意。随后他以极具骑士风范的优雅仪态向{{person:グィネヴィア|桂妮薇儿}}小姐行礼致敬，她也向他回礼；紧接着，他便因{{person:グィネヴィア|桂妮薇儿}}小姐对自己展现这般青睐与厚意而满怀欢欣鼓舞，当即大步离开了那个地方。", "ko": "아서 왕은 그 목걸이를 받아 자기 팔에 단단히 동여매고는 깊이 감사를 올렸다. 그런 다음 그는 더없이 기사다운 우아한 예법으로 기네비어 아가씨에게 예를 표하였고, 그녀 또한 그에게 답례하였다. 그리고 그는 기네비어 아가씨가 자기에게 그토록 각별한 호의를 베풀어 준 것에 가슴 벅찬 기쁨을 안고 곧장 그곳을 떠나 앞으로 나아갔다.", "ko_tagged": "{{person:アーサー|아서}} {{office:王|왕}}은 그 목걸이를 받아 자기 팔에 단단히 동여매고는 깊이 감사를 올렸다. 그런 다음 그는 더없이 기사다운 우아한 예법으로 {{person:グィネヴィア|기네비어}} 아가씨에게 예를 표하였고, 그녀 또한 그에게 답례하였다. 그리고 그는 {{person:グィネヴィア|기네비어}} 아가씨가 자기에게 그토록 각별한 호의를 베풀어 준 것에 가슴 벅찬 기쁨을 안고 곧장 그곳을 떠나 앞으로 나아갔다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p23_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 23, "type": "本文", "raw_text": "Now the report had gone about Cameliard that a knight was to go forth to fight the Duke of North Umber. Wherefore great crowds gathered upon the walls, and King Leodegrance and the Lady Guinevere and all the Court of the King came to that part of the castle walls overlooking the meadow where the Duke of North Umber defended. Wherefore, so great a concourse was presently assembled, that any knight might be encouraged to do his utmost before such a multitude as that which looked down upon the field.", "translation": "さて、カミリアードの町じゅうには、一人の騎士がいよいよノース・アンバーの公爵と戦うべく打って出るのだという噂がたちまち広まっていた。そのため城壁の上にはおびただしい群衆が詰めかけ、レオデグランス王とグィネヴィア姫、ならびに王の宮廷の面々もことごとく、ノース・アンバーの公爵が陣取って待ち構える牧草地を見渡す城壁の一角へと姿を現した。かくしてたちまちのうちに実に夥しい観衆が一堂に会したため、戦場を見下ろすこれほどの大群衆を前にしては、いかなる騎士といえども渾身の力を尽くして戦おうと大いに奮い立たずにはいられないほどであった。", "raw_tagged": "Now the report had gone about {{special:カミリアード|Cameliard}} that a {{office:騎士|knight}} was to go forth to fight the {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}}. Wherefore great crowds gathered upon the walls, and {{office:王|King}} {{person:レオデグランス|Leodegrance}} and the Lady {{person:グィネヴィア|Guinevere}} and all the Court of the {{office:王|King}} came to that part of the castle walls overlooking the meadow where the {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}} defended. Wherefore, so great a concourse was presently assembled, that any {{office:騎士|knight}} might be encouraged to do his utmost before such a multitude as that which looked down upon the field.", "translation_tagged": "さて、{{special:カミリアード|カミリアード}}の町じゅうには、一人の{{office:騎士|騎士}}がいよいよ{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}と戦うべく打って出るのだという噂がたちまち広まっていた。そのため城壁の上にはおびただしい群衆が詰めかけ、{{person:レオデグランス|レオデグランス}}{{office:王|王}}と{{person:グィネヴィア|グィネヴィア}}姫、ならびに{{office:王|王}}の宮廷の面々もことごとく、{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}が陣取って待ち構える牧草地を見渡す城壁の一角へと姿を現した。かくしてたちまちのうちに実に夥しい観衆が一堂に会したため、戦場を見下ろすこれほどの大群衆を前にしては、いかなる{{office:騎士|騎士}}といえども渾身の力を尽くして戦おうと大いに奮い立たずにはいられないほどであった。", "persons": "レオデグランス,グィネヴィア", "places": "ノーサンバーランド", "offices": "騎士,公爵,王", "era_year": "伝説時代", "keywords": "カミリアード", "is_enriched": true, "zh_tw": "此時，卡米利亞德城內外已然傳遍消息，說有一名騎士即將出城迎戰北安伯公爵。因此城牆上湧聚了黑壓壓的大批人潮，而雷奧多格蘭王、桂妮薇兒小姐以及國王的滿朝宮廷臣屬，也全都來到俯瞰著北安伯公爵守陣草地的那段城牆之上。轉眼之間便匯聚起如此浩大壯觀的人群，面對城頭俯視戰場的這般萬眾矚目，無論哪一位騎士定都會備受鼓舞而竭盡全力奮戰到底。", "zh_tw_tagged": "此時，{{special:カミリアード|卡米利亞德}}城內外已然傳遍消息，說有一名{{office:騎士|騎士}}即將出城迎戰{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}。因此城牆上湧聚了黑壓壓的大批人潮，而{{person:レオデグランス|雷奧多格蘭}}{{office:王|王}}、{{person:グィネヴィア|桂妮薇兒}}小姐以及{{office:王|國王}}的滿朝宮廷臣屬，也全都來到俯瞰著{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}守陣草地的那段城牆之上。轉眼之間便匯聚起如此浩大壯觀的人群，面對城頭俯視戰場的這般萬眾矚目，無論哪一位{{office:騎士|騎士}}定都會備受鼓舞而竭盡全力奮戰到底。", "zh_cn": "此时，卡米利亚德城内外已然传遍消息，说有一名骑士即将出城迎战北安伯公爵。因此城墙上涌聚了黑压压的大批人潮，而雷奥多格兰王、桂妮薇儿小姐以及国王的满朝宫廷臣属，也全都来到俯瞰着北安伯公爵守阵草地的那段城墙之上。转眼之间便汇聚起如此浩大壮观的人群，面对城头俯视战场的这般万众瞩目，无论哪一位骑士定都会备受鼓舞而竭尽全力奋战到底。", "zh_cn_tagged": "此时，{{special:カミリアード|卡米利亚德}}城内外已然传遍消息，说有一名{{office:騎士|骑士}}即将出城迎战{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}。因此城墙上涌聚了黑压压的大批人潮，而{{person:レオデグランス|雷奥多格兰}}{{office:王|王}}、{{person:グィネヴィア|桂妮薇儿}}小姐以及{{office:王|国王}}的满朝宫廷臣属，也全都来到俯瞰着{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}守阵草地的那段城墙之上。转眼之间便汇聚起如此浩大壮观的人群，面对城头俯视战场的这般万众瞩目，无论哪一位{{office:騎士|骑士}}定都会备受鼓舞而竭尽全力奋战到底。", "ko": "한편 한 기사가 노스엄버 공작과 싸우기 위하여 밖으로 나선다는 소문이 온 카밀리아드에 퍼져 나갔다. 그리하여 성벽 위에는 엄청난 구름 인파가 몰려들었고, 레오데그란스 왕과 기네비어 아가씨를 비롯하여 왕의 온 궁정 사람들도 노스엄버 공작이 진을 치고 버티는 초원이 내려다보이는 성벽 자리로 나왔다. 이리하여 순식간에 실로 어마어마한 군중이 모여들었으니, 들판을 내려다보는 이토록 수많은 인파 앞에서는 그 어떤 기사라도 온 힘을 다해 싸울 용기를 북돋우지 않을 수 없을 정도였다.", "ko_tagged": "한편 한 {{office:騎士|기사}}가 {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}과 싸우기 위하여 밖으로 나선다는 소문이 온 {{special:カミリアード|카밀리아드}}에 퍼져 나갔다. 그리하여 성벽 위에는 엄청난 구름 인파가 몰려들었고, {{person:レオデグランス|레오데그란스}} {{office:王|왕}}과 {{person:グィネヴィア|기네비어}} 아가씨를 비롯하여 {{office:王|왕}}의 온 궁정 사람들도 {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}이 진을 치고 버티는 초원이 내려다보이는 성벽 자리로 나왔다. 이리하여 순식간에 실로 어마어마한 군중이 모여들었으니, 들판을 내려다보는 이토록 수많은 인파 앞에서는 그 어떤 {{office:騎士|기사}}라도 온 힘을 다해 싸울 용기를 북돋우지 않을 수 없을 정도였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p24_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 24, "type": "本文", "raw_text": "Then of a sudden the portcullis of the castle was lifted, and the bridge let fall, and the White Champion rode forth to that encounter which he had undertaken. And, as he drave across that narrow bridge, the hoofs of his war-horse smote the boards with a noise like to thunder, and when he came out into the sunlight, lo! his armor flamed of a sudden like unto lightning, and when the people saw him they shouted aloud.", "translation": "すると突如として城の落とし格子が高く引き上げられ、跳ね橋が下ろされて、かの白衣の闘士が自ら引き受けた一騎打ちの場へと馬を躍らせて打って出た。彼が狭い橋の上を疾駆して渡るにつれ、その軍馬の蹄は雷鳴のごとき轟音を立てて橋板を打ち鳴らし、やがて燦々たる陽光の下へと躍り出た瞬間、見よ、その甲冑はにわかに稲妻さながらの眩い光を放って燃え立ったので、その雄姿を目にした人々は一斉に大歓声を上げた。", "raw_tagged": "Then of a sudden the portcullis of the castle was lifted, and the bridge let fall, and the White Champion rode forth to that encounter which he had undertaken. And, as he drave across that narrow bridge, the hoofs of his war-horse smote the boards with a noise like to thunder, and when he came out into the sunlight, lo! his armor flamed of a sudden like unto lightning, and when the people saw him they shouted aloud.", "translation_tagged": "すると突如として城の落とし格子が高く引き上げられ、跳ね橋が下ろされて、かの白衣の闘士が自ら引き受けた一騎打ちの場へと馬を躍らせて打って出た。彼が狭い橋の上を疾駆して渡るにつれ、その軍馬の蹄は雷鳴のごとき轟音を立てて橋板を打ち鳴らし、やがて燦々たる陽光の下へと躍り出た瞬間、見よ、その甲冑はにわかに稲妻さながらの眩い光を放って燃え立ったので、その雄姿を目にした人々は一斉に大歓声を上げた。", "persons": "", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "陡然之間，城堡的千斤閘高高拉起，吊橋轟然放下，那位白衣勇士策馬衝出城門，奔赴他親自應承下來的這場對決。當他縱馬疾馳過那座狹窄的吊橋時，戰馬的鐵蹄踏擊橋板，發出宛如滾滾驚雷般的巨響；待他馳出城門、沐浴在燦爛陽光之下時，但見他身上的甲冑霎時間如閃電般迸發出奪目光芒，城頭百姓一見他的雄姿，無不齊聲放聲高呼。", "zh_tw_tagged": "陡然之間，城堡的千斤閘高高拉起，吊橋轟然放下，那位白衣勇士策馬衝出城門，奔赴他親自應承下來的這場對決。當他縱馬疾馳過那座狹窄的吊橋時，戰馬的鐵蹄踏擊橋板，發出宛如滾滾驚雷般的巨響；待他馳出城門、沐浴在燦爛陽光之下時，但見他身上的甲冑霎時間如閃電般迸發出奪目光芒，城頭百姓一見他的雄姿，無不齊聲放聲高呼。", "zh_cn": "陡然之间，城堡的千斤闸高高拉起，吊桥轰然放下，那位白衣勇士策马冲出城门，奔赴他亲自应承下来的这场对决。当他纵马疾驰过那座狭窄的吊桥时，战马的铁蹄踏击桥板，发出宛如滚滚惊雷般的巨响；待他驰出城门、沐浴在灿烂阳光之下时，但见他身上的甲胄霎时间如闪电般迸发出夺目光芒，城头百姓一见他的雄姿，无不齐声放声高呼。", "zh_cn_tagged": "陡然之间，城堡的千斤闸高高拉起，吊桥轰然放下，那位白衣勇士策马冲出城门，奔赴他亲自应承下来的这场对决。当他纵马疾驰过那座狭窄的吊桥时，战马的铁蹄踏击桥板，发出宛如滚滚惊雷般的巨响；待他驰出城门、沐浴在灿烂阳光之下时，但见他身上的甲胄霎时间如闪电般迸发出夺目光芒，城头百姓一见他的雄姿，无不齐声放声高呼。", "ko": "그러다 갑자기 성문의 쇠살문이 높이 들어 올려지고 도개교가 내려지더니, 저 순백의 용사가 자신이 맡아 나선 대결을 치르기 위하여 말을 몰아 밖으로 달려 나왔다. 그가 그 좁은 다리를 가로질러 질주할 때 군마의 말굽이 다리 널빤지를 내리치는 소리는 마치 우레와도 같았으며, 마침내 눈부신 햇빛 속으로 나서는 순간, 보라! 그의 갑옷이 문득 번갯불처럼 찬란히 타올랐으므로 그 모습을 본 사람들은 모두 큰 소리로 함성을 질렀다.", "ko_tagged": "그러다 갑자기 성문의 쇠살문이 높이 들어 올려지고 도개교가 내려지더니, 저 순백의 용사가 자신이 맡아 나선 대결을 치르기 위하여 말을 몰아 밖으로 달려 나왔다. 그가 그 좁은 다리를 가로질러 질주할 때 군마의 말굽이 다리 널빤지를 내리치는 소리는 마치 우레와도 같았으며, 마침내 눈부신 햇빛 속으로 나서는 순간, 보라! 그의 갑옷이 문득 번갯불처럼 찬란히 타올랐으므로 그 모습을 본 사람들은 모두 큰 소리로 함성을 질렀다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p25_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 25, "type": "本文", "raw_text": "Then when the Duke of North Umber beheld a knight all clad in white, he rode straightway to him and spoke to him with words of knightly greeting. \"Messire,\" he said, \"I perceive that thou bearest no crest upon thy helm, nor hast thou a device of any sort upon thy shield, wherefore I know not who thou art. Ne'theless, I do believe that thou art a knight of good quality and of approved courage, or else thou wouldst not have thus come to this place.\"", "translation": "さて、ノース・アンバーの公爵は全身を純白に装った一人の騎士の姿を認めると、ただちにそのもとへ馬を寄せて、騎士の礼に適った挨拶の言葉をかけた。「貴公よ」と彼は言った。「見受けたところ、貴殿は兜の上に前立ても掲げておらず、盾の上にもいかなる家紋や標章も描いてはおらぬゆえ、それがしには貴殿が何者であるかわからぬ。さりながら、貴殿が立派な身分と折り紙付きの武勇を備えた騎士であることだけは確かであろうと信ずる。さもなければ、かようにこの場へ乗り出してくるはずもないからな」", "raw_tagged": "Then when the {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}} beheld a {{office:騎士|knight}} all clad in white, he rode straightway to him and spoke to him with words of knightly greeting. \"Messire,\" he said, \"I perceive that thou bearest no crest upon thy helm, nor hast thou a device of any sort upon thy shield, wherefore I know not who thou art. Ne'theless, I do believe that thou art a {{office:騎士|knight}} of good quality and of approved courage, or else thou wouldst not have thus come to this place.\"", "translation_tagged": "さて、{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}は全身を純白に装った一人の{{office:騎士|騎士}}の姿を認めると、ただちにそのもとへ馬を寄せて、騎士の礼に適った挨拶の言葉をかけた。「貴公よ」と彼は言った。「見受けたところ、貴殿は兜の上に前立ても掲げておらず、盾の上にもいかなる家紋や標章も描いてはおらぬゆえ、それがしには貴殿が何者であるかわからぬ。さりながら、貴殿が立派な身分と折り紙付きの武勇を備えた{{office:騎士|騎士}}であることだけは確かであろうと信ずる。さもなければ、かようにこの場へ乗り出してくるはずもないからな」", "persons": "", "places": "ノーサンバーランド", "offices": "公爵,騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "當北安伯公爵看見一名全身披掛純白甲衣的騎士出陣，便當即策馬上前，以合乎騎士風度的禮貌言辭向他致意。「尊駕，」他說道，「我看您的頭盔上既未飾有任何盔冠徽記，盾牌上也沒有繪製任何圖案紋章，因此我不知您究竟是何人。儘管如此，我深信您必定是一位出身高貴且勇武過人的騎士，否則您斷不會這般單騎來到此地應戰。」", "zh_tw_tagged": "當{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}看見一名全身披掛純白甲衣的{{office:騎士|騎士}}出陣，便當即策馬上前，以合乎騎士風度的禮貌言辭向他致意。「尊駕，」他說道，「我看您的頭盔上既未飾有任何盔冠徽記，盾牌上也沒有繪製任何圖案紋章，因此我不知您究竟是何人。儘管如此，我深信您必定是一位出身高貴且勇武過人的{{office:騎士|騎士}}，否則您斷不會這般單騎來到此地應戰。」", "zh_cn": "当北安伯公爵看见一名全身披挂纯白甲衣的骑士出阵，便当即策马上前，以合乎骑士风度的礼貌言辞向他致意。“尊驾，”他说道，“我看您的头盔上既未饰有任何盔冠徽记，盾牌上也没有绘制任何图案纹章，因此我不知您究竟是何人。尽管如此，我深信您必定是一位出身高贵且勇武过人的骑士，否则您断不会这般单骑来到此地应战。”", "zh_cn_tagged": "当{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}看见一名全身披挂纯白甲衣的{{office:騎士|骑士}}出阵，便当即策马上前，以合乎骑士风度的礼貌言辞向他致意。“尊驾，”他说道，“我看您的头盔上既未饰有任何盔冠徽记，盾牌上也没有绘制任何图案纹章，因此我不知您究竟是何人。尽管如此，我深信您必定是一位出身高贵且勇武过人的{{office:騎士|骑士}}，否则您断不会这般单骑来到此地应战。”", "ko": "그때 노스엄버 공작은 온몸을 순백으로 감싼 한 기사를 보고는 곧장 그에게로 말을 몰아 다가가 기사다운 인사말을 건네었다. “경이여,” 하고 그가 말하였다. “보건대 그대는 투구 위에 아무런 장식 문장도 달지 않았고 방패 위에도 그 어떤 표식이나 도안도 지니지 않았으니, 나는 그대가 누구인지 알지 못하오. 그렇기는 하나 그대가 훌륭한 품격과 검증된 용맹을 지닌 기사임은 분명하다고 믿소. 그렇지 않다면 이처럼 이 자리에 나서지 않았을 것이기 때문이오.”", "ko_tagged": "그때 {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}은 온몸을 순백으로 감싼 한 {{office:騎士|기사}}를 보고는 곧장 그에게로 말을 몰아 다가가 기사다운 인사말을 건네었다. “경이여,” 하고 그가 말하였다. “보건대 그대는 투구 위에 아무런 장식 문장도 달지 않았고 방패 위에도 그 어떤 표식이나 도안도 지니지 않았으니, 나는 그대가 누구인지 알지 못하오. 그렇기는 하나 그대가 훌륭한 품격과 검증된 용맹을 지닌 {{office:騎士|기사}}임은 분명하다고 믿소. 그렇지 않다면 이처럼 이 자리에 나서지 않았을 것이기 때문이오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p26_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 26, "type": "本文", "raw_text": "\"Certes, Sir Knight,\" said King Arthur, \"I am of a quality equal to thine own. And as for my courage, I do believe that it hath been approved in as many encounters as even thine own hath been.\"", "translation": "「いかにも、騎士殿」とアーサー王は答えた。「わが身分は貴殿のそれに勝るとも劣らぬ対等のものである。そしてわが武勇について言うならば、たとえ貴殿自身の武勇と比べてみても、それに劣らぬほど数多の真剣勝負の場においてすでに証し立てられてきたものと信じておる」", "raw_tagged": "\"Certes, Sir {{office:騎士|Knight}},\" said {{office:王|King}} {{person:アーサー|Arthur}}, \"I am of a quality equal to thine own. And as for my courage, I do believe that it hath been approved in as many encounters as even thine own hath been.\"", "translation_tagged": "「いかにも、{{office:騎士|騎士}}殿」と{{person:アーサー|アーサー}}{{office:王|王}}は答えた。「わが身分は貴殿のそれに勝るとも劣らぬ対等のものである。そしてわが武勇について言うならば、たとえ貴殿自身の武勇と比べてみても、それに劣らぬほど数多の真剣勝負の場においてすでに証し立てられてきたものと信じておる」", "persons": "アーサー", "places": "", "offices": "騎士,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「誠然，騎士閣下，」亞瑟王答道，「論身分地位，我與你實屬平起平坐、毫不遜色；至於我的勇氣，我深信它也早已在無數次交鋒對決中得到了充分的印證，所歷戰陣絕不亞於你本人。」", "zh_tw_tagged": "「誠然，{{office:騎士|騎士}}閣下，」{{person:アーサー|亞瑟}}{{office:王|王}}答道，「論身分地位，我與你實屬平起平坐、毫不遜色；至於我的勇氣，我深信它也早已在無數次交鋒對決中得到了充分的印證，所歷戰陣絕不亞於你本人。」", "zh_cn": "“诚然，骑士阁下，”亚瑟王答道，“论身份地位，我与你实属平起平坐、毫不逊色；至于我的勇气，我深信它也早已在无数次交锋对决中得到了充分的印证，所历战阵绝不亚于你本人。”", "zh_cn_tagged": "“诚然，{{office:騎士|骑士}}阁下，”{{person:アーサー|亚瑟}}{{office:王|王}}答道，“论身份地位，我与你实属平起平坐、毫不逊色；至于我的勇气，我深信它也早已在无数次交锋对决中得到了充分的印证，所历战阵绝不亚于你本人。”", "ko": "“참으로 그러하오, 기사 경이여,” 하고 아서 왕이 대답하였다. “나는 그대와 대등한 신분과 품격을 지닌 사람이오. 그리고 나의 용맹에 관하여 말하자면, 그대 자신의 용맹이 증명되어 온 것 못지않게 수많은 대결의 자리에서 이미 충분히 입증되었다고 믿고 있소.”", "ko_tagged": "“참으로 그러하오, {{office:騎士|기사}} 경이여,” 하고 {{person:アーサー|아서}} {{office:王|왕}}이 대답하였다. “나는 그대와 대등한 신분과 품격을 지닌 사람이오. 그리고 나의 용맹에 관하여 말하자면, 그대 자신의 용맹이 증명되어 온 것 못지않게 수많은 대결의 자리에서 이미 충분히 입증되었다고 믿고 있소.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p27_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 27, "type": "本文", "raw_text": "\"Sir Knight,\" quoth the Duke of Umber, \"thou speakest with a very large spirit. Ne'theless, thou mayst make such prayers as thou art able, for I shall now presently so cast thee down from thy seat, so that thou shalt never rise again; for so have I served better men than ever thou mayst hope to be.\"", "translation": "「騎士殿よ」とアンバーの公爵は言い放った。「ずいぶんと大口を叩くではないか。だが、今のうちにせいぜい神に祈りを捧げておくがよいぞ。というのも、それがしはこれよりただちに貴殿を鞍上から大地へと叩き落とし、二度と再び立ち上がれぬ身にしてくれるからな。貴殿ごときがどれほど望んでも到底及ばぬほどの優れた剛の者たちをも、それがしはこれまで幾人となくそのように葬ってきたのだ」", "raw_tagged": "\"Sir {{office:騎士|Knight}},\" quoth the {{office:公爵|Duke}} of {{place:ノーサンバーランド|Umber}}, \"thou speakest with a very large spirit. Ne'theless, thou mayst make such prayers as thou art able, for I shall now presently so cast thee down from thy seat, so that thou shalt never rise again; for so have I served better men than ever thou mayst hope to be.\"", "translation_tagged": "「{{office:騎士|騎士}}殿よ」と{{place:ノーサンバーランド|アンバー}}の{{office:公爵|公爵}}は言い放った。「ずいぶんと大口を叩くではないか。だが、今のうちにせいぜい神に祈りを捧げておくがよいぞ。というのも、それがしはこれよりただちに貴殿を鞍上から大地へと叩き落とし、二度と再び立ち上がれぬ身にしてくれるからな。貴殿ごときがどれほど望んでも到底及ばぬほどの優れた剛の者たちをも、それがしはこれまで幾人となくそのように葬ってきたのだ」", "persons": "", "places": "ノーサンバーランド", "offices": "騎士,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「騎士閣下，」安伯公爵沉聲說道，「你的口氣倒真是狂妄不小。不過，你現在最好盡你所能向神明禱告吧，因為我馬上就要將你從馬鞍上狠狠掀翻在地，叫你再也爬不起來；畢竟比你所能企及的境界高強得多的好漢，我也曾這般料理過不知凡幾了。」", "zh_tw_tagged": "「{{office:騎士|騎士}}閣下，」{{place:ノーサンバーランド|安伯}}{{office:公爵|公爵}}沉聲說道，「你的口氣倒真是狂妄不小。不過，你現在最好盡你所能向神明禱告吧，因為我馬上就要將你從馬鞍上狠狠掀翻在地，叫你再也爬不起來；畢竟比你所能企及的境界高強得多的好漢，我也曾這般料理過不知凡幾了。」", "zh_cn": "“骑士阁下，”安伯公爵沉声说道，“你的口气倒真是狂妄不小。不过，你现在最好尽你所能向神明祷告吧，因为我马上就要将你从马鞍上狠狠掀翻在地，叫你再也爬不起来；毕竟比你所能企及的境界高强得多的好汉，我也曾这般料理过不知凡几了。”", "zh_cn_tagged": "“{{office:騎士|骑士}}阁下，”{{place:ノーサンバーランド|安伯}}{{office:公爵|公爵}}沉声说道，“你的口气倒真是狂妄不小。不过，你现在最好尽你所能向神明祷告吧，因为我马上就要将你从马鞍上狠狠掀翻在地，叫你再也爬不起来；毕竟比你所能企及的境界高强得多的好汉，我也曾这般料理过不知凡几了。”", "ko": "“기사 경이여,” 하고 엄버 공작이 말하였다. “그대는 참으로 기세등등하게 큰소리를 치는구려. 허나 지금 할 수 있는 대로 기도를 올려 두는 것이 좋을 것이오. 내가 이제 곧 그대를 안장에서 땅바닥으로 내동댕이쳐 두 번 다시 일어나지 못하게 만들 터이니 말이오. 그대가 아무리 바라도 결코 따라잡지 못할 만큼 뛰어난 장수들도 내가 이제껏 다 그렇게 처치해 왔소.”", "ko_tagged": "“{{office:騎士|기사}} 경이여,” 하고 {{place:ノーサンバーランド|엄버}} {{office:公爵|공작}}이 말하였다. “그대는 참으로 기세등등하게 큰소리를 치는구려. 허나 지금 할 수 있는 대로 기도를 올려 두는 것이 좋을 것이오. 내가 이제 곧 그대를 안장에서 땅바닥으로 내동댕이쳐 두 번 다시 일어나지 못하게 만들 터이니 말이오. 그대가 아무리 바라도 결코 따라잡지 못할 만큼 뛰어난 장수들도 내가 이제껏 다 그렇게 처치해 왔소.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p28_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 28, "type": "本文", "raw_text": "To this King Arthur made answer with great calmness of demeanor: \"That shall be according to the will of Heaven, Sir Knight, and not according to thy will.\"", "translation": "これに対してアーサー王は、きわめて沈着冷静な物腰のままこう答えられた。「騎士殿よ、その帰趨は天の御心に委ねられるべきものであって、貴殿の思い通りになるものではあるまい」", "raw_tagged": "To this {{office:王|King}} {{person:アーサー|Arthur}} made answer with great calmness of demeanor: \"That shall be according to the will of Heaven, Sir {{office:騎士|Knight}}, and not according to thy will.\"", "translation_tagged": "これに対して{{person:アーサー|アーサー}}{{office:王|王}}は、きわめて沈着冷静な物腰のままこう答えられた。「{{office:騎士|騎士}}殿よ、その帰趨は天の御心に委ねられるべきものであって、貴殿の思い通りになるものではあるまい」", "persons": "アーサー", "places": "", "offices": "王,騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "對此，亞瑟王神態極為從容鎮定地回答道：「騎士閣下，此事自當取決於上天的旨意，而絕非取決於你的意願。」", "zh_tw_tagged": "對此，{{person:アーサー|亞瑟}}{{office:王|王}}神態極為從容鎮定地回答道：「{{office:騎士|騎士}}閣下，此事自當取決於上天的旨意，而絕非取決於你的意願。」", "zh_cn": "对此，亚瑟王神态极为从容镇定地回答道：“骑士阁下，此事自当取决于上天的旨意，而绝非取决于你的意愿。”", "zh_cn_tagged": "对此，{{person:アーサー|亚瑟}}{{office:王|王}}神态极为从容镇定地回答道：“{{office:騎士|骑士}}阁下，此事自当取决于上天的旨意，而绝非取决于你的意愿。”", "ko": "이 말에 아서 왕은 더없이 침착하고도 의연한 태도로 이렇게 대답하였다. “그 일은 하늘의 뜻에 따라 결정될 일이지, 그대의 뜻대로 될 일이 아니오, 기사 경이여.”", "ko_tagged": "이 말에 {{person:アーサー|아서}} {{office:王|왕}}은 더없이 침착하고도 의연한 태도로 이렇게 대답하였다. “그 일은 하늘의 뜻에 따라 결정될 일이지, 그대의 뜻대로 될 일이 아니오, {{office:騎士|기사}} 경이여.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p29_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 29, "type": "本文", "raw_text": "So each knight saluted the other and rode to his assigned station, and there each dressed his spear and his shield, and made him ready for the encounter. Then a silence fell upon all so great that a man might hear his own heart beat in the stillness. So, for a small space, each knight sat like a statue made of iron. Then, of a sudden, each shouted to his war-horse, and drave spurs into his flank, and launched forth from his station. And so they met in the midst of the course with a noise like unto a violent thunder-clap. And lo! the spear of the Duke of North Umber burst into splinters unto the very truncheon thereof; but the spear of King Arthur broke not, but held, so that the Duke was cast out of his saddle like a windmill—whirling in the air and smiting the earth so that the ground shuddered beneath him. And indeed he rolled full three times over and over ere he ceased to fall.", "translation": "かくして両名の騎士は互いに礼を交わすと、それぞれ定められた持ち場へと馬を進め、その場で槍と盾を構え直して激突への備えを整えた。するとあたり一面には、その静寂のなかで自分の心臓の鼓動さえ聞こえそうなほど深い沈黙が降りた。しばしの間、二人の騎士はさながら鋼鉄で鋳造された彫像のように微動だにせず鞍上に座していた。と、次の瞬間、両者は一斉に軍馬に向かって裂帛の気合を発し、馬の脇腹に拍車を強く蹴り込んで、それぞれの持ち場から矢のように飛び出した。そして二人は馬場のただ中において、凄まじい落雷の轟音にも似た激響とともに正面から激突した。見よ！　ノース・アンバーの公爵の槍は手元の柄の根元に至るまで木っ端微塵に砕け散ったが、アーサー王の槍は折れることなく強靭に持ちこたえたため、公爵はまるで風車のように鞍から宙へと弾き飛ばされ、空中でぐるぐると回転しながら大地が身震いするほどの勢いで地面へと叩きつけられた。まこと彼は、ようやく転がり止まるまでに、優に三度も地面の上をでんぐり返しに転げ回ったのである。", "raw_tagged": "So each {{office:騎士|knight}} saluted the other and rode to his assigned station, and there each dressed his spear and his shield, and made him ready for the encounter. Then a silence fell upon all so great that a man might hear his own heart beat in the stillness. So, for a small space, each {{office:騎士|knight}} sat like a statue made of iron. Then, of a sudden, each shouted to his war-horse, and drave spurs into his flank, and launched forth from his station. And so they met in the midst of the course with a noise like unto a violent thunder-clap. And lo! the spear of the {{office:公爵|Duke}} of {{place:ノーサンバーランド|North Umber}} burst into splinters unto the very truncheon thereof; but the spear of {{office:王|King}} {{person:アーサー|Arthur}} broke not, but held, so that the {{office:公爵|Duke}} was cast out of his saddle like a windmill—whirling in the air and smiting the earth so that the ground shuddered beneath him. And indeed he rolled full three times over and over ere he ceased to fall.", "translation_tagged": "かくして両名の{{office:騎士|騎士}}は互いに礼を交わすと、それぞれ定められた持ち場へと馬を進め、その場で槍と盾を構え直して激突への備えを整えた。するとあたり一面には、その静寂のなかで自分の心臓の鼓動さえ聞こえそうなほど深い沈黙が降りた。しばしの間、二人の{{office:騎士|騎士}}はさながら鋼鉄で鋳造された彫像のように微動だにせず鞍上に座していた。と、次の瞬間、両者は一斉に軍馬に向かって裂帛の気合を発し、馬の脇腹に拍車を強く蹴り込んで、それぞれの持ち場から矢のように飛び出した。そして二人は馬場のただ中において、凄まじい落雷の轟音にも似た激響とともに正面から激突した。見よ！　{{place:ノーサンバーランド|ノース・アンバー}}の{{office:公爵|公爵}}の槍は手元の柄の根元に至るまで木っ端微塵に砕け散ったが、{{person:アーサー|アーサー}}{{office:王|王}}の槍は折れることなく強靭に持ちこたえたため、{{office:公爵|公爵}}はまるで風車のように鞍から宙へと弾き飛ばされ、空中でぐるぐると回転しながら大地が身震いするほどの勢いで地面へと叩きつけられた。まこと彼は、ようやく転がり止まるまでに、優に三度も地面の上をでんぐり返しに転げ回ったのである。", "persons": "アーサー", "places": "ノーサンバーランド", "offices": "騎士,公爵,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是兩名騎士彼此行禮致意，各自策馬退至指定的起跑位置，在那裡端正長矛、架好盾牌，為即將展開的交鋒做好萬全準備。頃刻間，全場陷入一片極度的沉寂，靜得幾乎能讓人聽見自己胸膛裡的心跳聲。在短短片刻之間，兩位騎士皆如鐵鑄的雕像般端坐鞍上紋絲不動。陡然間，雙方同時對各自的戰馬發出一聲暴喝，猛夾馬腹催動馬刺，如離弦之箭般從陣位上疾衝而出。轉瞬間兩人便在賽場正中央轟然相撞，爆出一聲宛如驚天霹靂般的巨響。但見北安伯公爵的長矛一直碎裂到握柄根部，化作漫天木屑；然而亞瑟王的長矛卻絲毫未斷、穩穩撐住，直將那位公爵如風車一般從馬鞍上猛然挑飛出去——他在半空中翻轉盤旋，重重摔落地面，震得腳下大地都為之顫抖不已。說真的，他在地上接連翻滾了足足三圈，方才停下身來。", "zh_tw_tagged": "於是兩名{{office:騎士|騎士}}彼此行禮致意，各自策馬退至指定的起跑位置，在那裡端正長矛、架好盾牌，為即將展開的交鋒做好萬全準備。頃刻間，全場陷入一片極度的沉寂，靜得幾乎能讓人聽見自己胸膛裡的心跳聲。在短短片刻之間，兩位{{office:騎士|騎士}}皆如鐵鑄的雕像般端坐鞍上紋絲不動。陡然間，雙方同時對各自的戰馬發出一聲暴喝，猛夾馬腹催動馬刺，如離弦之箭般從陣位上疾衝而出。轉瞬間兩人便在賽場正中央轟然相撞，爆出一聲宛如驚天霹靂般的巨響。但見{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}的長矛一直碎裂到握柄根部，化作漫天木屑；然而{{person:アーサー|亞瑟}}{{office:王|王}}的長矛卻絲毫未斷、穩穩撐住，直將那位{{office:公爵|公爵}}如風車一般從馬鞍上猛然挑飛出去——他在半空中翻轉盤旋，重重摔落地面，震得腳下大地都為之顫抖不已。說真的，他在地上接連翻滾了足足三圈，方才停下身來。", "zh_cn": "于是两名骑士彼此行礼致意，各自策马退至指定的起跑位置，在那里端正长矛、架好盾牌，为即将展开的交锋做好万全准备。顷刻间，全场陷入一片极度的沉寂，静得几乎能让人听见自己胸膛里的心跳声。在短短片刻之间，两位骑士皆如铁铸的雕像般端坐鞍上纹丝不动。陡然间，双方同时对各自的战马发出一声暴喝，猛夹马腹催动马刺，如离弦之箭般从阵位上疾冲而出。转瞬间两人便在赛场正中央轰然相撞，爆出一声宛如惊天霹雳般的巨响。但见北安伯公爵的长矛一直碎裂到握柄根部，化作漫天木屑；然而亚瑟王的长矛却丝毫未断、稳稳撑住，直将那位公爵如风车一般从马鞍上猛然挑飞出去——他在半空中翻转盘旋，重重摔落地面，震得脚下大地都为之颤抖不已。说真的，他在地上接连翻滚了足足三圈，方才停下身来。", "zh_cn_tagged": "于是两名{{office:騎士|骑士}}彼此行礼致意，各自策马退至指定的起跑位置，在那里端正长矛、架好盾牌，为即将展开的交锋做好万全准备。顷刻间，全场陷入一片极度的沉寂，静得几乎能让人听见自己胸膛里的心跳声。在短短片刻之间，两位{{office:騎士|骑士}}皆如铁铸的雕像般端坐鞍上纹丝不动。陡然间，双方同时对各自的战马发出一声暴喝，猛夹马腹催动马刺，如离弦之箭般从阵位上疾冲而出。转瞬间两人便在赛场正中央轰然相撞，爆出一声宛如惊天霹雳般的巨响。但见{{place:ノーサンバーランド|北安伯}}{{office:公爵|公爵}}的长矛一直碎裂到握柄根部，化作漫天木屑；然而{{person:アーサー|亚瑟}}{{office:王|王}}的长矛却丝毫未断、稳稳撑住，直将那位{{office:公爵|公爵}}如风车一般从马鞍上猛然挑飞出去——他在半空中翻转盘旋，重重摔落地面，震得脚下大地都为之颤抖不已。说真的，他在地上接连翻滚了足足三圈，方才停下身来。", "ko": "그리하여 두 기사는 서로 예를 표하고 각자 지정된 위치로 말을 몰아 나아간 뒤, 그곳에서 창과 방패를 바로잡고 대결에 임할 채비를 갖추었다. 그러자 사방에 너무나도 깊은 침묵이 내려앉아, 그 고요함 속에서 사람이 자기 심장 뛰는 소리를 들을 수 있을 정도였다. 잠시 동안 두 기사는 마치 무쇠로 빚어 놓은 조각상처럼 미동도 없이 앉아 있었다. 그러다 갑자기 두 사람은 동시에 각자의 군마에게 고함을 지르며 말 옆구리에 박차를 깊이 박아 넣고 자기 자리에서 세차게 돌진해 나갔다. 그리하여 그들은 마상 시합장 한가운데서 맹렬한 벼락이 치는 듯한 굉음과 함께 정면으로 부딪쳤다. 보라! 노스엄버 공작의 창은 손잡이 밑동까지 산산조각이 나 부서져 버렸으나, 아서 왕의 창은 부러지지 않고 꿋꿋이 버텨 내었으므로, 공작은 마치 풍차처럼 안장 밖으로 내던져져 허공에서 빙글빙글 돌다가 땅바닥이 진동할 만큼 세차게 대지에 처박혔다. 실로 그는 완전히 멈추기까지 땅 위를 무려 세 바퀴나 데구루루 굴렀다.", "ko_tagged": "그리하여 두 {{office:騎士|기사}}는 서로 예를 표하고 각자 지정된 위치로 말을 몰아 나아간 뒤, 그곳에서 창과 방패를 바로잡고 대결에 임할 채비를 갖추었다. 그러자 사방에 너무나도 깊은 침묵이 내려앉아, 그 고요함 속에서 사람이 자기 심장 뛰는 소리를 들을 수 있을 정도였다. 잠시 동안 두 {{office:騎士|기사}}는 마치 무쇠로 빚어 놓은 조각상처럼 미동도 없이 앉아 있었다. 그러다 갑자기 두 사람은 동시에 각자의 군마에게 고함을 지르며 말 옆구리에 박차를 깊이 박아 넣고 자기 자리에서 세차게 돌진해 나갔다. 그리하여 그들은 마상 시합장 한가운데서 맹렬한 벼락이 치는 듯한 굉음과 함께 정면으로 부딪쳤다. 보라! {{place:ノーサンバーランド|노스엄버}} {{office:公爵|공작}}의 창은 손잡이 밑동까지 산산조각이 나 부서져 버렸으나, {{person:アーサー|아서}} {{office:王|왕}}의 창은 부러지지 않고 꿋꿋이 버텨 내었으므로, {{office:公爵|공작}}은 마치 풍차처럼 안장 밖으로 내던져져 허공에서 빙글빙글 돌다가 땅바닥이 진동할 만큼 세차게 대지에 처박혔다. 실로 그는 완전히 멈추기까지 땅 위를 무려 세 바퀴나 데구루루 굴렀다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p30_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 30, "type": "本文", "raw_text": "Then all the people upon the wall shouted with might and main, so that the noise thereof was altogether astonishing; for they had hardly hoped that their champion should have proved so extraordinarily strong and skilful.", "translation": "すると城壁の上にいた人々は全員、ありったけの声と力を振り絞って歓呼の叫びを上げたので、そのどよめきの凄まじさはまことに驚くばかりであった。というのも、味方の闘士がこれほどまでに並外れた剛力と絶妙の技量の持ち主であろうとは、彼ら自身ほとんど夢にも思っていなかったからである。", "raw_tagged": "Then all the people upon the wall shouted with might and main, so that the noise thereof was altogether astonishing; for they had hardly hoped that their champion should have proved so extraordinarily strong and skilful.", "translation_tagged": "すると城壁の上にいた人々は全員、ありったけの声と力を振り絞って歓呼の叫びを上げたので、そのどよめきの凄まじさはまことに驚くばかりであった。というのも、味方の闘士がこれほどまでに並外れた剛力と絶妙の技量の持ち主であろうとは、彼ら自身ほとんど夢にも思っていなかったからである。", "persons": "", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "剎那間，城牆上所有的百姓無不竭盡全力放聲歡呼，那震天動地的聲浪簡直令人嘆為觀止；因為他們原本幾乎不敢奢望，自己一方的這位護衛勇士竟然會展現出如此超凡絕倫的神力與精湛武藝。", "zh_tw_tagged": "剎那間，城牆上所有的百姓無不竭盡全力放聲歡呼，那震天動地的聲浪簡直令人嘆為觀止；因為他們原本幾乎不敢奢望，自己一方的這位護衛勇士竟然會展現出如此超凡絕倫的神力與精湛武藝。", "zh_cn": "刹那间，城墙上所有的百姓无不竭尽全力放声欢呼，那震天动地的声浪简直令人叹为观止；因为他们原本几乎不敢奢望，自己一方的这位护卫勇士竟然会展现出如此超凡绝伦的神力与精湛武艺。", "zh_cn_tagged": "刹那间，城墙上所有的百姓无不竭尽全力放声欢呼，那震天动地的声浪简直令人叹为观止；因为他们原本几乎不敢奢望，自己一方的这位护卫勇士竟然会展现出如此超凡绝伦的神力与精湛武艺。", "ko": "그러자 성벽 위에 모여 있던 모든 백성들이 온 힘을 다하여 함성을 터뜨렸으니, 그 울려 퍼지는 소리가 실로 놀라울 지경이었다. 자기네 대리 용사가 이토록 비범하리만치 강인하고도 뛰어난 무예 실력을 보여 주리라고는 그들로서도 미처 기대하지 못하였기 때문이다.", "ko_tagged": "그러자 성벽 위에 모여 있던 모든 백성들이 온 힘을 다하여 함성을 터뜨렸으니, 그 울려 퍼지는 소리가 실로 놀라울 지경이었다. 자기네 대리 용사가 이토록 비범하리만치 강인하고도 뛰어난 무예 실력을 보여 주리라고는 그들로서도 미처 기대하지 못하였기 때문이다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p31_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 31, "type": "本文", "raw_text": "Meanwhile, those of King Ryence's Court ran immediately to the Duke of Umber where he lay upon the earth, and they straightway unlaced his helm for to give him air. And first they thought that he was dead, and then they thought that he was like to die; for, behold! he lay without any life or motion. Nor did he recover from that swoon wherein he lay for the space of full two hours and more.", "translation": "その間にも、リエンス王の宮廷の者たちは、地面に倒れ伏しているアンバーの公爵のもとへただちに駆け寄り、息を継がせようと急いでその兜の緒を解き放った。最初、彼らは公爵がすでに息絶えたものと思い、次いで今にも死に瀕しているのではないかと思った。というのも、見よ、彼は生気も身動きもまったくないまま横たわっていたからである。そして彼は、優に二時間あまりもの間、その深い気絶状態から意識を取り戻すことができなかった。", "raw_tagged": "Meanwhile, those of {{office:王|King}} {{person:リエンス|Ryence}}'s Court ran immediately to the {{office:公爵|Duke}} of {{place:ノーサンバーランド|Umber}} where he lay upon the earth, and they straightway unlaced his helm for to give him air. And first they thought that he was dead, and then they thought that he was like to die; for, behold! he lay without any life or motion. Nor did he recover from that swoon wherein he lay for the space of full two hours and more.", "translation_tagged": "その間にも、{{person:リエンス|リエンス}}{{office:王|王}}の宮廷の者たちは、地面に倒れ伏している{{place:ノーサンバーランド|アンバー}}の{{office:公爵|公爵}}のもとへただちに駆け寄り、息を継がせようと急いでその兜の緒を解き放った。最初、彼らは公爵がすでに息絶えたものと思い、次いで今にも死に瀕しているのではないかと思った。というのも、見よ、彼は生気も身動きもまったくないまま横たわっていたからである。そして彼は、優に二時間あまりもの間、その深い気絶状態から意識を取り戻すことができなかった。", "persons": "リエンス", "places": "ノーサンバーランド", "offices": "王,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "與此同時，里恩斯王宮廷中的隨從立刻飛奔到倒臥在地的安伯公爵身旁，當即解開他的頭盔繫帶好讓他透氣呼吸。起初眾人以為他已經氣絕身亡，繼而又覺得他性命垂危、奄奄一息；只見他倒在地上毫無半點生機與動靜。他在那場昏厥之中人事不省，足足過了兩個多時辰方才甦醒過來。", "zh_tw_tagged": "與此同時，{{person:リエンス|里恩斯}}{{office:王|王}}宮廷中的隨從立刻飛奔到倒臥在地的{{place:ノーサンバーランド|安伯}}{{office:公爵|公爵}}身旁，當即解開他的頭盔繫帶好讓他透氣呼吸。起初眾人以為他已經氣絕身亡，繼而又覺得他性命垂危、奄奄一息；只見他倒在地上毫無半點生機與動靜。他在那場昏厥之中人事不省，足足過了兩個多時辰方才甦醒過來。", "zh_cn": "与此同时，里恩斯王宫廷中的随从立刻飞奔到倒卧在地的安伯公爵身旁，当即解开他的头盔系带好让他透气呼吸。起初众人以为他已经气绝身亡，继而又觉得他性命垂危、奄奄一息；只见他倒在地上毫无半点生机与动静。他在那场昏厥之中人事不省，足足过了两个多时辰方才苏醒过来。", "zh_cn_tagged": "与此同时，{{person:リエンス|里恩斯}}{{office:王|王}}宫廷中的随从立刻飞奔到倒卧在地的{{place:ノーサンバーランド|安伯}}{{office:公爵|公爵}}身旁，当即解开他的头盔系带好让他透气呼吸。起初众人以为他已经气绝身亡，继而又觉得他性命垂危、奄奄一息；只见他倒在地上毫无半点生机与动静。他在那场昏厥之中人事不省，足足过了两个多时辰方才苏醒过来。", "ko": "그사이 리엔스 왕의 궁정 사람들은 땅바닥에 쓰러져 있는 엄버 공작에게 즉시 달려가 숨을 쉴 수 있도록 곧바로 투구 끈을 풀어 주었다. 처음에 그들은 그가 이미 죽은 줄 알았고, 그다음에는 곧 숨이 끊어질 것만 같다고 여겼으니, 보라! 그가 아무런 생기나 움직임도 없이 축 늘어져 누워 있었기 때문이다. 그는 그 기절 상태에서 깨어나기까지 꼬박 두 시간 남짓이나 더 걸렸다.", "ko_tagged": "그사이 {{person:リエンス|리엔스}} {{office:王|왕}}의 궁정 사람들은 땅바닥에 쓰러져 있는 {{place:ノーサンバーランド|엄버}} {{office:公爵|공작}}에게 즉시 달려가 숨을 쉴 수 있도록 곧바로 투구 끈을 풀어 주었다. 처음에 그들은 그가 이미 죽은 줄 알았고, 그다음에는 곧 숨이 끊어질 것만 같다고 여겼으니, 보라! 그가 아무런 생기나 움직임도 없이 축 늘어져 누워 있었기 때문이다. 그는 그 기절 상태에서 깨어나기까지 꼬박 두 시간 남짓이나 더 걸렸다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p32_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 32, "type": "本文", "raw_text": "Now whilst the attendants were thus busied about Duke Mordaunt of North Umber, King Arthur sat his horse, very quietly, observing all that they did. Then, perceiving that his enemy was not dead, he turned him about and rode away from that place.", "translation": "さて、従者たちがこうしてノース・アンバーのモーダント公爵の介抱に慌ただしく立ち働いている間、アーサー王はいと静かに馬上に座したまま、彼らのなす一部始終を見守っておられた。やがて敵が命を落としてはいないことを見届けると、王は馬首を巡らし、その場から悠然と馬を駆って立ち去っていかれた。", "raw_tagged": "Now whilst the attendants were thus busied about {{office:公爵|Duke}} {{person:モーダント|Mordaunt}} of {{place:ノーサンバーランド|North Umber}}, {{office:王|King}} {{person:アーサー|Arthur}} sat his horse, very quietly, observing all that they did. Then, perceiving that his enemy was not dead, he turned him about and rode away from that place.", "translation_tagged": "さて、従者たちがこうして{{place:ノーサンバーランド|ノース・アンバー}}の{{person:モーダント|モーダント}}{{office:公爵|公爵}}の介抱に慌ただしく立ち働いている間、{{person:アーサー|アーサー}}{{office:王|王}}はいと静かに馬上に座したまま、彼らのなす一部始終を見守っておられた。やがて敵が命を落としてはいないことを見届けると、王は馬首を巡らし、その場から悠然と馬を駆って立ち去っていかれた。", "persons": "モーダント,アーサー", "places": "ノーサンバーランド", "offices": "公爵,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "當眾侍從正這般圍著北安伯的莫當特公爵手忙腳亂地救治時，亞瑟王卻極為平靜地端坐馬背之上，默默注視著他們的一舉一動。待他看清自己的對手並未喪命，便撥轉馬頭，策馬從容離開了那個地方。", "zh_tw_tagged": "當眾侍從正這般圍著{{place:ノーサンバーランド|北安伯}}的{{person:モーダント|莫當特}}{{office:公爵|公爵}}手忙腳亂地救治時，{{person:アーサー|亞瑟}}{{office:王|王}}卻極為平靜地端坐馬背之上，默默注視著他們的一舉一動。待他看清自己的對手並未喪命，便撥轉馬頭，策馬從容離開了那個地方。", "zh_cn": "当众侍从正这般围着北安伯的莫当特公爵手忙脚乱地救治时，亚瑟王却极为平静地端坐马背之上，默默注视着他们的一举一动。待他看清自己的对手并未丧命，便拨转马头，策马从容离开了那个地方。", "zh_cn_tagged": "当众侍从正这般围着{{place:ノーサンバーランド|北安伯}}的{{person:モーダント|莫当特}}{{office:公爵|公爵}}手忙脚乱地救治时，{{person:アーサー|亚瑟}}{{office:王|王}}却极为平静地端坐马背之上，默默注视着他们的一举一动。待他看清自己的对手并未丧命，便拨转马头，策马从容离开了那个地方。", "ko": "한편 시종들이 이처럼 노스엄버의 모던트 공작 주위에서 분주히 구호하는 동안, 아서 왕은 말 위에 아주 조용히 앉아 그들이 하는 모든 양상을 지켜보고 있었다. 이윽고 적이 죽지 않았음을 확인한 그는 말머리를 돌려 그 자리에서 유유히 말을 몰아 떠나갔다.", "ko_tagged": "한편 시종들이 이처럼 {{place:ノーサンバーランド|노스엄버}}의 {{person:モーダント|모던트}} {{office:公爵|공작}} 주위에서 분주히 구호하는 동안, {{person:アーサー|아서}} {{office:王|왕}}은 말 위에 아주 조용히 앉아 그들이 하는 모든 양상을 지켜보고 있었다. 이윽고 적이 죽지 않았음을 확인한 그는 말머리를 돌려 그 자리에서 유유히 말을 몰아 떠나갔다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p33_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 33, "type": "本文", "raw_text": "Nor did he return unto Cameliard at that time, for he deemed that he had not yet entirely done with these enemies to the peace of his realm, wherefore he was minded not yet to return the horse and the armor to the merchant, but to keep them for a while for another occasion.", "translation": "しかもその時、王はそのままカミリアードへ引き返すことはなさらなかった。というのも、自らの王国の平和を脅かすこれらの敵どもとの決着がいまだ完全についたわけではないとお考えになったからであり、それゆえ馬と甲冑を今はまだかの商人へ返却せず、いずれ訪れるであろう次の機会に備えて、今しばらく手元に留めておこうと心に決められたのである。", "raw_tagged": "Nor did he return unto {{special:カミリアード|Cameliard}} at that time, for he deemed that he had not yet entirely done with these enemies to the peace of his realm, wherefore he was minded not yet to return the horse and the armor to the merchant, but to keep them for a while for another occasion.", "translation_tagged": "しかもその時、王はそのまま{{special:カミリアード|カミリアード}}へ引き返すことはなさらなかった。というのも、自らの王国の平和を脅かすこれらの敵どもとの決着がいまだ完全についたわけではないとお考えになったからであり、それゆえ馬と甲冑を今はまだかの商人へ返却せず、いずれ訪れるであろう次の機会に備えて、今しばらく手元に留めておこうと心に決められたのである。", "persons": "", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "カミリアード", "is_enriched": true, "zh_tw": "那時他也並未就此折返卡米利亞德，因為他料定自己與這幫危害王國安寧的敵人尚未徹底了結恩怨；因此他打定主意，暫且先不將這匹戰馬與這副甲冑歸還給那位富商，而是將它們留在身邊一段時日，以備日後再度派上用場。", "zh_tw_tagged": "那時他也並未就此折返{{special:カミリアード|卡米利亞德}}，因為他料定自己與這幫危害王國安寧的敵人尚未徹底了結恩怨；因此他打定主意，暫且先不將這匹戰馬與這副甲冑歸還給那位富商，而是將它們留在身邊一段時日，以備日後再度派上用場。", "zh_cn": "那时他也并未就此折返卡米利亚德，因为他料定自己与这帮危害王国安宁的敌人尚未彻底了结恩怨；因此他打定主意，暂且先不将这匹战马与这副甲胄归还给那位富商，而是将它们留在身边一段时日，以备日后再度派上用场。", "zh_cn_tagged": "那时他也并未就此折返{{special:カミリアード|卡米利亚德}}，因为他料定自己与这帮危害王国安宁的敌人尚未彻底了结恩怨；因此他打定主意，暂且先不将这匹战马与这副甲胄归还给那位富商，而是将它们留在身边一段时日，以备日后再度派上用场。", "ko": "또한 그는 그때 곧장 카밀리아드로 돌아가지도 않았는데, 자기 왕국의 평화를 위협하는 이 적들과의 일이 아직 완전히 끝난 것이 아니라고 여겼기 때문이다. 그러므로 그는 말과 갑옷을 아직 상인에게 돌려주지 않고, 다음번 기회에 다시 쓰기 위하여 당분간 그대로 간직해 두기로 마음먹었다.", "ko_tagged": "또한 그는 그때 곧장 {{special:カミリアード|카밀리아드}}로 돌아가지도 않았는데, 자기 왕국의 평화를 위협하는 이 적들과의 일이 아직 완전히 끝난 것이 아니라고 여겼기 때문이다. 그러므로 그는 말과 갑옷을 아직 상인에게 돌려주지 않고, 다음번 기회에 다시 쓰기 위하여 당분간 그대로 간직해 두기로 마음먹었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p34_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 34, "type": "本文", "raw_text": "So he bethought him of how, coming to Cameliard, he had passed through an arm of the forest where certain wood-choppers were at work felling the trees. Wherefore, remembering that place, he thought that he would betake him thither and leave his horse and armor in the care of those rude folk until he would need those things once more. So now he rode away into the country-side, leaving behind him the town and the castle and all the noise of shouting and rejoicing; nor did he once so much as turn his head to look back toward that place where he had so violently overthrown his enemy.", "translation": "そこで王は、かつてカミリアードへやって来た折、幾人かの木こりたちが精を出して木々を伐り倒していた森の枝道を通ったことを思い起こされた。それゆえ、かの場所を思い出した王は、そこへ足を運んで、ふたたびそれらの武具が必要になる時まで、あの素朴な森の民に自分の馬と甲冑を預けて世話を頼もうとお考えになった。かくして今や王は、町も城も、また歓呼と喜びに沸き返るあらゆる喧騒をも後ろに残して田園の彼方へと馬を走らせていったが、自らがかくも激しく敵を打ち倒したあの決闘の場を振り返って見ようと、ただの一度も首を巡らすことさえなさらなかった。", "raw_tagged": "So he bethought him of how, coming to {{special:カミリアード|Cameliard}}, he had passed through an arm of the forest where certain wood-choppers were 그 장소를 뒤돌아보려고 단 한 번도 고개를 돌리지조차 않았다.", "ko_tagged": "그리하여 그는 전에 {{special:カミリアード|카밀리아드}}로 오던 길에 몇몇 나무꾼들이 나무를 베며 일하고 있던 숲자락 한쪽을 지나왔던 일을 떠올렸다. 그곳을 기억해 낸 그는 거기로 찾아가서 다시금 말과 갑옷이 필요해질 때까지 저 소박한 시골 사람들에게 그것들을 맡겨 돌보게 해야겠다고 생각하였다. 이리하여 이제 그는 고을과 성채와 온갖 외침과 환희의 함성 소리를 등 뒤에 남겨 둔 채 시골길로 말을 몰아 멀리 떠나갔으며, 자신이 그토록 맹렬한 기세로 적을 쓰러뜨렸던 그 장소를 뒤돌아보려고 단 한 번도 고개를 돌리지조차 않았다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p35_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 35, "type": "本文", "raw_text": "And now you shall presently hear of certain pleasant adventures of a very joyous sort that befell him ere he had accomplished all his purposes. For when a man is a king among men, as was King Arthur, then is he of such a calm and equal temper that neither victory nor defeat may cause him to become either unduly exalted in his own opinion or so troubled in spirit as to be altogether cast down into despair. So if you would become like to King Arthur, then you shall take all your triumphs as he took this victory, for you will not be turned aside from your final purposes by the great applause that many men may give you, but you will first finish your work that you have set yourself to perform, ere you give yourself ease to sit you down and to enjoy the fruits of your victory.", "translation": "さてこれから読者諸君は、王がおのれのすべての目的を成し遂げられるまでの間にその身に降りかかった、まことに陽気で愉快な幾つかの冒険について、まもなく耳にすることであろう。けだし、アーサー王がそうであられたように、人が真に人々の中の王たる器であるならば、その心ばえはかくも穏やかで偏りなく落ち着いているものであるから、たとえ勝利を得ようと敗北を喫しようと、それによって不当に思い上がって自惚れることもなければ、心を乱してすっかり絶望の淵に打ち沈んでしまうこともないのである。されば、もし諸君がアーサー王のような人物になりたいと願うならば、王がこのたびの勝利を受け止められたのと同じように、自らのあらゆる栄冠を受け止めねばならない。すなわち、多くの人々から贈られる盛んな喝采に惑わされて本来の最終目的から脇道へ逸れることなく、腰を下ろして安逸に身をゆだね勝利の果実を味わうよりも先に、まず自ら成し遂げると心に定めた務めを最後まで完遂するようになるであろうからである。", "raw_tagged": "And now you shall presently hear of certain pleasant adventures of a very joyous sort that befell him ere he had accomplished all his purposes. For when a man is a {{office:王|king}} among men, as was {{office:王|King}} {{person:アーサー|Arthur}}, then is he of such a calm and equal temper that neither victory nor defeat may cause him to become either unduly exalted in his own opinion or so troubled in spirit as to be altogether cast down into despair. So if you would become like to {{office:王|King}} {{person:アーサー|Arthur}}, then you shall take all your triumphs as he took this victory, for you will not be turned aside from your final purposes by the great applause that many men may give you, but you will first finish your work that you have set yourself to perform, ere you give yourself ease to sit you down and to enjoy the fruits of your victory.", "translation_tagged": "さてこれから読者諸君は、王がおのれのすべての目的を成し遂げられるまでの間にその身に降りかかった、まことに陽気で愉快な幾つかの冒険について、まもなく耳にすることであろう。けだし、{{person:アーサー|アーサー}}{{office:王|王}}がそうであられたように、人が真に人々の中の{{office:王|王}}たる器であるならば、その心ばえはかくも穏やかで偏りなく落ち着いているものであるから、たとえ勝利を得ようと敗北を喫しようと、それによって不当に思い上がって自惚れることもなければ、心を乱してすっかり絶望の淵に打ち沈んでしまうこともないのである。されば、もし諸君が{{person:アーサー|アーサー}}{{office:王|王}}のような人物になりたいと願うならば、王がこのたびの勝利を受け止められたのと同じように、自らのあらゆる栄冠を受け止めねばならない。すなわち、多くの人々から贈られる盛んな喝采に惑わされて本来の最終目的から脇道へ逸れることなく、腰を下ろして安逸に身をゆだね勝利の果実を味わうよりも先に、まず自ら成し遂げると心に定めた務めを最後まで完遂するようになるであろうからである。", "persons": "アーサー", "places": "", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "接下來，諸位馬上就要聽到他在徹底完成自己全部志業之前，所親身經歷的幾樁極其歡快有趣的奇遇故事。蓋因一個人倘若真如亞瑟王那般堪稱人中之王，便必然具備這等沉靜平和、寵辱不驚的胸襟氣度——無論是勝是敗，都不會使他妄自尊大、沾沾自喜，亦不會令他心神大亂而徹底陷入絕望深淵。因此，倘若諸位也想成為像亞瑟王那樣的人物，便當像他看待這場勝利一般去對待自己的一切凱旋榮耀：絕不因眾人獻上的熱烈喝采而偏離自己最終的目標，而是在安然坐下、舒心享用勝利果實之前，必先將自己立志要履行的使命徹頭徹尾地完成。", "zh_tw_tagged": "接下來，諸位馬上就要聽到他在徹底完成自己全部志業之前，所親身經歷的幾樁極其歡快有趣的奇遇故事。蓋因一個人倘若真如{{person:アーサー|亞瑟}}{{office:王|王}}那般堪稱人中之{{office:王|王}}，便必然具備這等沉靜平和、寵辱不驚的胸襟氣度——無論是勝是敗，都不會使他妄自尊大、沾沾自喜，亦不會令他心神大亂而徹底陷入絕望深淵。因此，倘若諸位也想成為像{{person:アーサー|亞瑟}}{{office:王|王}}那樣的人物，便當像他看待這場勝利一般去對待自己的一切凱旋榮耀：絕不因眾人獻上的熱烈喝采而偏離自己最終的目標，而是在安然坐下、舒心享用勝利果實之前，必先將自己立志要履行的使命徹頭徹尾地完成。", "zh_cn": "接下来，诸位马上就要听到他在彻底完成自己全部志业之前，所亲身经历的几桩极其欢快有趣的奇遇故事。盖因一个人倘若真如亚瑟王那般堪称人中之王，便必然具备这等沉静平和、宠辱不惊的胸襟气度——无论是胜是败，都不会使他妄自尊大、沾沾自喜，亦不会令他心神大乱而彻底陷入绝望深渊。因此，倘若诸位也想成为像亚瑟王那样的人物，便当像他看待这场胜利一般去对待自己的一切凯旋荣耀：绝不因众人献上的热烈喝彩而偏离自己最终的目标，而是在安然坐下、舒心享用胜利果实之前，必先将自己立志要履行的使命彻头彻尾地完成。", "zh_cn_tagged": "接下来，诸位马上就要听到他在彻底完成自己全部志业之前，所亲身经历的几桩极其欢快有趣的奇遇故事。盖因一个人倘若真如{{person:アーサー|亚瑟}}{{office:王|王}}那般堪称人中之{{office:王|王}}，便必然具备这等沉静平和、宠辱不惊的胸襟气度——无论是胜是败，都不会使他妄自尊大、沾沾自喜，亦不会令他心神大乱而彻底陷入绝望深渊。因此，倘若诸位也想成为像{{person:アーサー|亚瑟}}{{office:王|王}}那样的人物，便当像他看待这场胜利一般去对待自己的一切凯旋荣耀：绝不因众人献上的热烈喝彩而偏离自己最终的目标，而是在安然坐下、舒心享用胜利果实之前，必先将自己立志要履行的使命彻头彻尾地完成。", "ko": "이제 여러분은 곧 그가 자신이 뜻한 모든 목적을 다 이루기 전에 겪게 된, 참으로 유쾌하고도 즐거운 몇 가지 모험 이야기를 듣게 될 것이다. 왜냐하면 아서 왕이 그러하였듯이 한 사람이 참으로 사람들 가운데 왕다운 인물일진대, 그는 너무나도 침착하고 한결같은 성품을 지니고 있어서 승리나 패배 그 어느 것에도 휘둘려 스스로 지나치게 우쭐해지거나 마음이 흔들려 완전히 절망의 구렁텅이에 빠지는 법이 없기 때문이다. 그러므로 만일 여러분이 아서 왕과 같은 사람이 되고자 한다면, 그가 이번 승리를 받아들였던 것처럼 여러분의 모든 승리를 받아들여야 할 것이다. 수많은 사람들이 보내는 열렬한 갈채에 이끌려 본래의 궁극적인 목표에서 벗어나는 일 없이, 편안히 자리에 앉아 승리의 열매를 누리기 전에 먼저 스스로 이루기로 마음먹은 과업을 끝까지 완수해 낼 것이기 때문이다.", "ko_tagged": "이제 여러분은 곧 그가 자신이 뜻한 모든 목적을 다 이루기 전에 겪게 된, 참으로 유쾌하고도 즐거운 몇 가지 모험 이야기를 듣게 될 것이다. 왜냐하면 {{person:アーサー|아서}} {{office:王|왕}}이 그러하였듯이 한 사람이 참으로 사람들 가운데 {{office:王|왕}}다운 인물일진대, 그는 너무나도 침착하고 한결같은 성품을 지니고 있어서 승리나 패배 그 어느 것에도 휘둘려 스스로 지나치게 우쭐해지거나 마음이 흔들려 완전히 절망의 구렁텅이에 빠지는 법이 없기 때문이다. 그러므로 만일 여러분이 {{person:アーサー|아서}} {{office:王|왕}}과 같은 사람이 되고자 한다면, 그가 이번 승리를 받아들였던 것처럼 여러분의 모든 승리를 받아들여야 할 것이다. 수많은 사람들이 보내는 열렬한 갈채에 이끌려 본래의 궁극적인 목표에서 벗어나는 일 없이, 편안히 자리에 앉아 승리의 열매를 누리기 전에 먼저 스스로 이루기로 마음먹은 과업을 끝까지 완수해 낼 것이기 때문이다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v9_p36_1", "volume": 9, "book": "第一巻 第三部", "section_title": "第二章　ノーサンバー公との決闘", "para_index": 36, "type": "本文", "raw_text": "Yea, he who is a true king of men, will not say to himself, \"Lo! I am worthy to be crowned with laurels;\" but rather will he say to himself, \"What more is there that I may do to make the world the better because of my endeavors?\"", "translation": "まことに、真に人の王たる者は、おのれの心のうちで「見よ、われこそは月桂冠を戴くにふさわしき者なり」などと言うことはない。むしろおのれ自身に向かってこう問いかけるのである――「わが不断の尽力によってこの世をより善きものとするために、私になし得ることは他にまだ何があるだろうか」と。", "raw_tagged": "Yea, he who is a true {{office:王|king}} of men, will not say to himself, \"Lo! I am worthy to be crowned with laurels;\" but rather will he say to himself, \"What more is there that I may do to make the world the better because of my endeavors?\"", "translation_tagged": "まことに、真に人の{{office:王|王}}たる者は、おのれの心のうちで「見よ、われこそは月桂冠を戴くにふさわしき者なり」などと言うことはない。むしろおのれ自身に向かってこう問いかけるのである――「わが不断の尽力によってこの世をより善きものとするために、私になし得ることは他にまだ何があるだろうか」と。", "persons": "", "places": "", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "誠然，一位真正堪稱人中之王的豪傑，絕不會在心裡對自己說：「看哪！我配得上頭戴桂冠的殊榮；」相反地，他只會在心底如此自問：「為了憑藉我的努力讓這世間變得更加美好，還有什麼更多的事是我能夠去做的呢？」", "zh_tw_tagged": "誠然，一位真正堪稱人中之{{office:王|王}}的豪傑，絕不會在心裡對自己說：「看哪！我配得上頭戴桂冠的殊榮；」相反地，他只會在心底如此自問：「為了憑藉我的努力讓這世間變得更加美好，還有什麼更多的事是我能夠去做的呢？」", "zh_cn": "诚然，一位真正堪称人中之王的豪杰，绝不会在心里对自己说：“看哪！我配得上头戴桂冠的殊荣；”相反地，他只会在心底如此自问：“为了凭借我的努力让这世间变得更加美好，还有什么更多的事是我能够去做的呢？”", "zh_cn_tagged": "诚然，一位真正堪称人中之{{office:王|王}}的豪杰，绝不会在心里对自己说：“看哪！我配得上头戴桂冠的殊荣；”相反地，他只会在心底如此自问：“为了凭借我的努力让这世间变得更加美好，还有什么更多的事是我能够去做的呢？”", "ko": "참으로 그러하니, 진정한 사람들의 왕인 자는 마음속으로 스스로에게 “보라! 나는 월계관을 쓰기에 합당한 사람이로다”라고 말하지 않을 것이며, 오히려 스스로에게 이렇게 되물을 것이다. “나의 노력을 통하여 이 세상을 더욱더 훌륭하고 좋은 곳으로 만들기 위해 내가 더 할 수 있는 일이 무엇이 있겠는가?”", "ko_tagged": "참으로 그러하니, 진정한 사람들의 {{office:王|왕}}인 자는 마음속으로 스스로에게 “보라! 나는 월계관을 쓰기에 합당한 사람이로다”라고 말하지 않을 것이며, 오히려 스스로에게 이렇게 되물을 것이다. “나의 노력을 통하여 이 세상을 더욱더 훌륭하고 좋은 곳으로 만들기 위해 내가 더 할 수 있는 일이 무엇이 있겠는가?”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}];

i18n": {"ja": "ユーサーに仕える騎士", "en": "Knight in Uther's service", "zh_tw": "烏瑟麾下的騎士", "zh_cn": "乌瑟麾下的骑士", "ko": "우서를 섬기는 기사"}, "desc_i18n": {"ja": "ユーサー王に仕える騎士。マロリー『アーサー王の死』ではサー・ウルフィウスとして、王の側近の助言者・騎士として登場する。", "en": "A knight in the service of King Uther. In Malory's Le Morte d'Arthur he appears as Sir Ulfius, a close adviser and knight of the king.", "zh_tw": "效力於烏瑟王的騎士。在馬洛禮《亞瑟王之死》中，他以Ulfius爵士之名登場，是國王身邊的謀士與騎士。", "zh_cn": "效力于乌瑟王的骑士。在马洛礼《亚瑟王之死》中，他以Ulfius爵士之名登场，是国王身边的谋士与骑士。", "ko": "우서 왕을 섬기는 기사. 맬러리의 『아서 왕의 죽음』에는 울피우스 경(Sir Ulfius)으로 나와 왕의 측근 조언자이자 기사로 등장한다."}, "sort_key_i18n": {"zh_tw": "W", "zh_cn": "W"}}, "イグレーヌ": {"name": "イグレーヌ（いぐれーぬ：アーサーの母とされる貴婦人）", "display_name": "イグレーヌ（アーサーの母とされる貴婦人）", "yomi": "いぐれーぬ", "wiki_title": "イグレーヌ", "role": "アーサーの母とされる貴婦人", "ai_desc": "アーサー王伝説でアーサーの母とされる女性。ティンタジェル公ゲルロイスの妻で、のちにユーサーの妃となる。", "role_i18n": {"ja": "アーサーの母とされる貴婦人", "en": "Noblewoman, mother of Arthur", "zh_tw": "貴婦人，亞瑟之母", "zh_cn": "贵妇人，亚瑟之母", "ko": "귀부인, 아서의 어머니"}, "desc_i18n": {"ja": "アーサー王伝説でアーサーの母とされる女性。ティンタジェル公ゲルロイスの妻で、のちにユーサーの妃となる。", "en": "In Arthurian legend, the woman said to be Arthur's mother. She is the wife of Gerlois, Duke of Tintagel, and later becomes Uther's queen.", "zh_tw": "亞瑟王傳說中被視為亞瑟之母的女性。她是廷塔哲公爵格洛伊斯之妻，後來成為烏瑟的王后。", "zh_cn": "亚瑟王传说中被视为亚瑟之母的女性。她是廷塔哲公爵格洛伊斯之妻，后来成为乌瑟的王后。", "ko": "아서 왕 전설에서 아서의 어머니로 여겨지는 여성. 틴타겔 공작 게를루아의 아내였으며 훗날 우서의 왕비가 된다."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "ゲルロイス": {"name": "ゲルロイス（げるろいす：ティンタジェル公・イグレーヌの先夫）", "display_name": "ゲルロイス（ティンタジェル公・イグレーヌの先夫）", "yomi": "げるろいす", "wiki_title": "ゴルロイス", "role": "ティンタジェル公・イグレーヌの先夫", "ai_desc": "ティンタジェルの公爵で、イグレーヌの最初の夫。マロリー『アーサー王の死』ではゴルロイスの名で登場する。", "role_i18n": {"ja": "ティンタジェル公・イグレーヌの先夫", "en": "Duke of Tintagel, Igraine's first husband", "zh_tw": "廷塔哲公爵，伊格蕾茵的前夫", "zh_cn": "廷塔哲公爵，伊格蕾茵的前夫", "ko": "틴타겔 공작, 이그레인의 전남편"}, "desc_i18n": {"ja": "ティンタジェルの公爵で、イグレーヌの最初の夫。マロリー『アーサー王の死』ではゴルロイスの名で登場する。", "en": "Duke of Tintagel and the first husband of Igraine. In Malory's Le Morte d'Arthur he appears under the name Gorlois.", "zh_tw": "廷塔哲公爵，伊格蕾茵的第一任丈夫。在馬洛禮《亞瑟王之死》中以戈洛伊斯（Gorlois）之名登場。", "zh_cn": "廷塔哲公爵，伊格蕾茵的第一任丈夫。在马洛礼《亚瑟王之死》中以戈洛伊斯（Gorlois）之名登场。", "ko": "틴타겔의 공작으로 이그레인의 첫 남편. 맬러리의 『아서 왕의 죽음』에서는 고를루아(Gorlois)라는 이름으로 등장한다."}, "sort_key_i18n": {"zh_tw": "G", "zh_cn": "G"}}, "マルゲーズ": {"name": "マルゲーズ（まるげーず：イグレーヌとゲルロイスの娘）", "display_name": "マルゲーズ（イグレーヌとゲルロイスの娘）", "yomi": "まるげーず", "wiki_title": "", "role": "イグレーヌとゲルロイスの娘", "ai_desc": "イグレーヌとゲルロイスの間に生まれた娘の一人。パイル版ではゴアのユリエンス王に嫁ぐ。", "role_i18n": {"ja": "イグレーヌとゲルロイスの娘", "en": "Daughter of Igraine and Gerlois", "zh_tw": "伊格蕾茵與格洛伊斯之女", "zh_cn": "伊格蕾茵与格洛伊斯之女", "ko": "이그레인과 게를루아의 딸"}, "desc_i18n": {"ja": "イグレーヌとゲルロイスの間に生まれた娘の一人。パイル版ではゴアのユリエンス王に嫁ぐ。", "en": "One of the daughters born to Igraine and Gerlois. In Pyle's version she marries King Urien of Gore.", "zh_tw": "伊格蕾茵與格洛伊斯所生的女兒之一。在派爾的版本中，她嫁給戈爾的尤里安國王。", "zh_cn": "伊格蕾茵与格洛伊斯所生的女儿之一。在派尔的版本中，她嫁给戈尔的尤里安国王。", "ko": "이그레인과 게를루아 사이에서 태어난 딸 중 한 명. 파일 판본에서는 고어의 유리엔 왕에게 시집간다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "モルガン・ル・フェイ": {"name": "モルガン・ル・フェイ（もるがん・る・ふぇい：イグレーヌの娘・名高い魔女）", "display_name": "モルガン・ル・フェイ（イグレーヌの娘・名高い魔女）", "yomi": "もるがん・る・ふぇい", "wiki_title": "モルガン・ル・フェイ", "role": "イグレーヌの娘・名高い魔女", "ai_desc": "アーサー王伝説に登場する著名な魔女で、イグレーヌとゲルロイスの娘。アーサーの異父姉にあたる。", "role_i18n": {"ja": "イグレーヌの娘・名高い魔女", "en": "Daughter of Igraine, famed sorceress", "zh_tw": "伊格蕾茵之女，著名女巫", "zh_cn": "伊格蕾茵之女，著名女巫", "ko": "이그레인의 딸, 이름난 마녀"}, "desc_i18n": {"ja": "アーサー王伝説に登場する著名な魔女で、イグレーヌとゲルロイスの娘。アーサーの異父姉にあたる。", "en": "A famous sorceress of Arthurian legend, daughter of Igraine and Gerlois, and so Arthur's half-sister on his mother's side.", "zh_tw": "亞瑟王傳說中的著名女巫，伊格蕾茵與格洛伊斯之女，也是亞瑟同母異父的姊姊。", "zh_cn": "亚瑟王传说中的著名女巫，伊格蕾茵与格洛伊斯之女，也是亚瑟同母异父的姐姐。", "ko": "아서 왕 전설에 등장하는 이름난 마녀로, 이그레인과 게를루아의 딸이며 아서의 어머니가 같은 이부(異父) 누나이다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "ユリエンス": {"name": "ユリエンス（ゆりえんす：ゴアの王）", "display_name": "ユリエンス（ゴアの王）", "yomi": "ゆりえんす", "wiki_title": "", "role": "ゴアの王", "ai_desc": "ゴアの王。パイル版ではマルゲーズの夫として登場する。", "role_i18n": {"ja": "ゴアの王", "en": "King of Gore", "zh_tw": "戈爾的國王", "zh_cn": "戈尔的国王", "ko": "고어의 왕"}, "desc_i18n": {"ja": "ゴアの王。パイル版ではマルゲーズの夫として登場する。", "en": "King of Gore. In Pyle's version he appears as the husband of Margaise.", "zh_tw": "戈爾的國王。在派爾的版本中，他是瑪嘉絲的丈夫。", "zh_cn": "戈尔的国王。在派尔的版本中，他是玛嘉丝的丈夫。", "ko": "고어의 왕. 파일 판본에서는 마르게즈의 남편으로 등장한다."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "ロット": {"name": "ロット（ろっと：オークニーの王）", "display_name": "ロット（オークニーの王）", "yomi": "ろっと", "wiki_title": "", "role": "オークニーの王", "ai_desc": "オークニーの王。パイル版ではモルガン・ル・フェイの夫として登場する。", "role_i18n": {"ja": "オークニーの王", "en": "King of Orkney", "zh_tw": "奧克尼的國王", "zh_cn": "奥克尼的国王", "ko": "오크니의 왕"}, "desc_i18n": {"ja": "オークニーの王。パイル版ではモルガン・ル・フェイの夫として登場する。", "en": "King of Orkney. In Pyle's version he appears as the husband of Morgana le Fay.", "zh_tw": "奧克尼的國王。在派爾的版本中，他是摩根勒菲的丈夫。", "zh_cn": "奥克尼的国王。在派尔的版本中，他是摩根勒菲的丈夫。", "ko": "오크니의 왕. 파일 판본에서는 모르가나 르 페이의 남편으로 등장한다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "レオデグランス": {"name": "レオデグランス（れおでぐらんす：カミリアードの王）", "display_name": "レオデグランス（カミリアードの王）", "yomi": "れおでぐらんす", "wiki_title": "レオデグランス", "role": "カミリアードの王", "ai_desc": "カミリアードの王。アーサー王伝説では王妃グィネヴィアの父であり、アーサーに円卓を贈った君主として知られる。", "role_i18n": {"ja": "カミリアードの王", "en": "King of Camiliard, father of Guinevere", "zh_tw": "卡米利亞德之王，桂妮薇兒之父", "zh_cn": "卡米利亚德之王，桂妮薇儿之父", "ko": "카밀리아드의 왕, 기네비어의 아버지"}, "desc_i18n": {"ja": "カミリアードの王。アーサー王伝説では王妃グィネヴィアの父であり、アーサーに円卓を贈った君主として知られる。", "en": "King of Camiliard. In Arthurian legend he is best known as the father of Queen Guinevere and the monarch who gave the Round Table to Arthur.", "zh_tw": "卡米利亞德的國王。在亞瑟王傳說中，他最著名的事蹟是身為桂妮薇兒王后的父親，並將圓桌贈予亞瑟王。", "zh_cn": "卡米利亚德的国王。在亚瑟王传说中，他最著名的事迹是身为桂妮薇儿王后的父亲，并将圆桌赠予亚瑟王。", "ko": "카밀리아드의 왕. 아서 왕 전설에서는 기네비어 왕비의 아버지이자 아서에게 원탁을 선사한 군주로 널리 알려져 있다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "リエンス": {"name": "リエンス（りえんす：北ウェールズの王）", "display_name": "リエンス（北ウェールズの王）", "yomi": "りえんす", "wiki_title": "リエンス", "role": "北ウェールズの王", "ai_desc": "北ウェールズの王。アーサー王伝説では若いアーサー王に臣従を迫り敵対する強力な君主の一人。", "role_i18n": {"ja": "北ウェールズの王", "en": "King of North Wales", "zh_tw": "北威爾斯之王", "zh_cn": "北威尔士之王", "ko": "북웨일스의 왕"}, "desc_i18n": {"ja": "北ウェールズの王。アーサー王伝説では若いアーサー王に臣従を迫り敵対する強力な君主の一人。", "en": "King of North Wales. In Arthurian legend he is a powerful monarch who challenges the young King Arthur and demands his submission.", "zh_tw": "北威爾斯之王。在亞瑟王傳說中，他是一位向年輕的亞瑟王發起挑戰並要求其臣服的強大君主。", "zh_cn": "北威尔士之王。在亚瑟王传说中，他是一位向年轻的亚瑟王发起挑战并要求其臣服的强大君主。", "ko": "북웨일스의 왕. 아서 왕 전설에서는 젊은 아서 왕에게 복속을 요구하며 맞서는 강력한 군주 중 한 명이다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "ロベール・ド・ボロン": {"name": "ロベール・ド・ボロン（ろべーる・ど・ぼろん：中世フランスの詩人）", "display_name": "ロベール・ド・ボロン（中世フランスの詩人）", "yomi": "ろべーる・ど・ぼろん", "wiki_title": "ロベール・ド・ボロン", "role": "中世フランスの詩人", "ai_desc": "12世紀末から13世紀初頭の中世フランスの詩人。『メルラン物語』などを著し、アーサー王伝説の発展に大きな影響を与えた。", "role_i18n": {"ja": "中世フランスの詩人", "en": "Medieval French poet, author of Merlin", "zh_tw": "中世紀法國詩人，《梅林》作者", "zh_cn": "中世纪法国诗人，《梅林》作者", "ko": "중세 프랑스 시인, 『멀린』 저자"}, "desc_i18n": {"ja": "12世紀末から13世紀初頭の中世フランスの詩人。『メルラン物語』などを著し、アーサー王伝説の発展に大きな影響を与えた。", "en": "A French poet of the late 12th and early 13th centuries who authored verse romances such as Merlin, greatly shaping the Arthurian legend.", "zh_tw": "十二世紀末至十三世紀初的法國詩人，著有《梅林》等騎士文學詩篇，對亞瑟王傳說的發展產生了深遠影響。", "zh_cn": "十二世纪末至十三世纪初的法国诗人，著有《梅林》等骑士文学诗篇，对亚瑟王传说的发展产生了深远影响。", "ko": "12세기 말부터 13세기 초에 활동한 프랑스 시인으로, 『멀린』 등의 운문 기사도 문학을 지어 아서 왕 전설의 발전에 지대한 영향을 미쳤다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "アーサー": {"name": "アーサー（あーさー：物語の主人公・のちのブリテン王）", "display_name": "アーサー（物語の主人公・のちのブリテン王）", "yomi": "あーさー", "wiki_title": "アーサー王", "role": "物語の主人公・のちのブリテン王", "ai_desc": "アーサー王伝説の中心人物。エクター卿のもとでケイの従者として育ち、やがてブリテンを統べる王となる。", "role_i18n": {"ja": "物語の主人公・のちのブリテン王", "en": "Hero of the tale, future King of Britain", "zh_tw": "故事主人公，後來的不列顛之王", "zh_cn": "故事主人公，后来的不列颠之王", "ko": "이야기의 주인공, 훗날의 브리튼 왕"}, "desc_i18n": {"ja": "アーサー王伝説の中心人物。エクター卿のもとでケイの従者として育ち、やがてブリテンを統べる王となる。", "en": "The central hero of Arthurian legend. Raised in the household of Sir Ector as squire to Sir Kay, he later becomes the king who unites Britain.", "zh_tw": "亞瑟王傳說的核心人物。在艾克托爵士家中作為凱的侍從長大，後來成為統御不列顛的國王。", "zh_cn": "亚瑟王传说的核心人物。在艾克托爵士家中作为凯的侍从长大，后来成为统御不列颠的国王。", "ko": "아서 왕 전설의 중심인물. 엑터 경의 가문에서 케이의 종자로 자라나 훗날 브리튼을 다스리는 왕이 된다."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "エクター": {"name": "エクター（えくたー：ボンメゾンの高潔な騎士・ケイの父でアーサーの養父）", "display_name": "エクター（ボンメゾンの騎士・アーサーの養父）", "yomi": "えくたー", "wiki_title": "エクター", "role": "ボンメゾンの騎士・アーサーの養父", "ai_desc": "「誠実の騎士」と称される高潔な大領主。実子ケイとともに幼いアーサーを養育した騎士として伝承に描かれる。", "role_i18n": {"ja": "ボンメゾンの騎士・アーサーの養父", "en": "Knight of Bonmaison, foster-father of Arthur", "zh_tw": "邦梅宗的騎士，亞瑟的養父", "zh_cn": "邦梅宗的骑士，亚瑟的养父", "ko": "봉메종의 기사, 아서의 양아버지"}, "desc_i18n": {"ja": "「誠実の騎士」と称される高潔な大領主。実子ケイとともに幼いアーサーを養育した騎士として伝承に描かれる。", "en": "A noble lord renowned as the Trustworthy Knight. In Arthurian tradition he raises the young Arthur alongside his own son Kay.", "zh_tw": "被譽為「誠信騎士」的高潔大領主。在傳說中，他將年幼的亞瑟與親生兒子凱一同撫養長大。", "zh_cn": "被誉为“诚信骑士”的高洁大领主。在传说中，他将年幼的亚瑟与亲生儿子凯一同抚养长大。", "ko": "‘신실한 기사’라 불린 고결한 대영주. 전승에서는 친아들 케이와 함께 어린 아서를 거두어 길렀다."}, "sort_key_i18n": {"zh_tw": "A", "zh_cn": "A"}}, "ケイ": {"name": "ケイ（けい：エクター卿の長男・アーサーの義兄にあたる若き騎士）", "display_name": "ケイ（エクター卿の長男・若き騎士）", "yomi": "けい", "wiki_title": "ケイ (アーサー王伝説)", "role": "エクター卿の長男・若き騎士", "ai_desc": "エクター卿の長男で、アーサーの義兄としてともに育った騎士。アーサー王伝説では王家の執事長（セネシャル）としても知られる。", "role_i18n": {"ja": "エクター卿の長男・若き騎士", "en": "Eldest son of Sir Ector, young knight", "zh_tw": "艾克托爵士的長子，年輕騎士", "zh_cn": "艾克托爵士的长子，年轻骑士", "ko": "엑터 경의 장남, 젊은 기사"}, "desc_i18n": {"ja": "エクター卿の長男で、アーサーの義兄としてともに育った騎士。アーサー王伝説では王家の執事長（セネシャル）としても知られる。", "en": "The eldest son of Sir Ector and foster-brother of Arthur. In Arthurian legend he is also well known as the royal seneschal.", "zh_tw": "艾克托爵士的長子，與亞瑟一同長大的義兄。在亞瑟王傳說中也以王室總管（Seneschal）聞名。", "zh_cn": "艾克托爵士的长子，与亚瑟一同长大的义兄。在亚瑟王传说中也以王室总管（Seneschal）闻名。", "ko": "엑터 경의 장남으로 아서와 함께 자란 의형. 아서 왕 전설에서는 왕실의 집사장(세네샬)으로도 널리 알려져 있다."}, "sort_key_i18n": {"zh_tw": "K", "zh_cn": "K"}}, "バン": {"name": "バン（ばん：ベンウィックの王・ボールス王の兄）", "display_name": "バン（ベンウィックの王）", "yomi": "ばん", "wiki_title": "バン (アーサー王伝説)", "role": "ベンウィックの王", "ai_desc": "大陸のベンウィックを治める王で、ボールス王の兄。アーサー王伝説では円卓の騎士ランスロットの父として知られる。", "role_i18n": {"ja": "ベンウィックの王", "en": "King of Benwick, brother of King Bors", "zh_tw": "本威克之王，博爾斯王之兄", "zh_cn": "本威克之王，博尔斯王之兄", "ko": "벤윅의 왕, 보어스 왕의 형"}, "desc_i18n": {"ja": "大陸のベンウィックを治める王で、ボールス王の兄。アーサー王伝説では円卓の騎士ランスロットの父として知られる。", "en": "King of Benwick across the sea and elder brother of King Bors. In Arthurian legend he is celebrated as the father of Sir Launcelot.", "zh_tw": "統治海外本威克的國王，博爾斯王的兄長。在亞瑟王傳說中以圓桌騎士蘭斯洛特之父聞名。", "zh_cn": "统治海外本威克的国王，博尔斯王的兄长。在亚瑟王传说中以圆桌骑士兰斯洛特之父闻名。", "ko": "바다 건너 벤윅을 다스리는 왕이자 보어스 왕의 형. 아서 왕 전설에서는 원탁의 기사 란슬롯의 아버지로 유명하다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "ボールス": {"name": "ボールス（ぼーるす：ガリアの王・バン王の弟）", "display_name": "ボールス（ガリアの王・バン王の弟）", "yomi": "ぼーるす", "wiki_title": "ボールス", "role": "ガリアの王・バン王の弟", "ai_desc": "大陸のガリア（ゴーヌ）を治める王で、バン王の弟。兄バンとともにアーサー王伝説の初期の戦いで重要な役割を担う。", "role_i18n": {"ja": "ガリアの王・バン王の弟", "en": "King of Gaul, younger brother of King Ban", "zh_tw": "高盧之王，班王之弟", "zh_cn": "高卢之王，班王之弟", "ko": "골의 왕, 반 왕의 아우"}, "desc_i18n": {"ja": "大陸のガリア（ゴーヌ）を治める王で、バン王の弟。兄バンとともにアーサー王伝説の初期の戦いで重要な役割を担う。", "en": "King of Gaul (Gaunes) across the sea and younger brother of King Ban, who plays a major part alongside his brother in the early wars of Arthurian legend.", "zh_tw": "統治海外高盧（戈訥）的國王，班王的弟弟，在亞瑟王傳說早期的戰事中與兄長並肩扮演重要角色。", "zh_cn": "统治海外高卢（戈讷）的国王，班王的弟弟，在亚瑟王传说早期的战事中与兄长并肩扮演重要角色。", "ko": "바다 건너 골(곤)을 다스리는 왕이자 반 왕의 아우로, 형 반과 함께 아서 왕 전설 초기의 전장에서 중요한 역할을 맡는다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "マドール・ド・ラ・ポルト": {"name": "マドール・ド・ラ・ポルト（まどーる・ど・ら・ぽると：のちに円卓に列する剛勇の騎士）", "display_name": "マドール・ド・ラ・ポルト（円卓の騎士）", "yomi": "まどーる・ど・ら・ぽると", "wiki_title": "", "role": "のちに円卓に列する騎士", "ai_desc": "アーサー王伝説に登場する名高い武勇の騎士。のちに円卓の騎士の一人として宮廷で重きをなす。", "role_i18n": {"ja": "のちに円卓に列する騎士", "en": "Valiant knight, later of the Round Table", "zh_tw": "勇猛的騎士，後入列圓桌", "zh_cn": "勇猛的骑士，后入列圆桌", "ko": "훗날 원탁에 합류하는 용맹한 기사"}, "desc_i18n": {"ja": "アーサー王伝説に登場する名高い武勇の騎士。のちに円卓の騎士の一人として宮廷で重きをなす。", "en": "A renowned knight of great prowess in Arthurian romance who later holds an honored place among the Knights of the Round Table.", "zh_tw": "亞瑟王傳說中以武勇聞名的騎士，後來成為圓桌騎士的一員，在宮廷中享有崇高聲望。", "zh_cn": "亚瑟王传说中以武勇闻名的骑士，后来成为圆桌骑士的一员，在宫廷中享有崇高声望。", "ko": "아서 왕 전설에 등장하는 이름난 무용의 기사로, 훗날 원탁의 기사 일원이 되어 궁정에서 높은 신망을 얻는다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "ベディヴィア": {"name": "ベディヴィア（べでぃゔぃあ：アーサー王の最古参の忠臣・円卓の騎士）", "display_name": "ベディヴィア（円卓の騎士・アーサー王の忠臣）", "yomi": "べでぃゔぃあ", "wiki_title": "ベディヴィア", "role": "円卓の騎士・アーサー王の忠臣", "ai_desc": "アーサー王伝説の最初期から語られる忠実な騎士で、円卓の騎士の一人。王の最期に最後まで付き従った騎士として知られる。", "role_i18n": {"ja": "円卓の騎士・アーサー王の忠臣", "en": "Knight of the Round Table, loyal retainer of Arthur", "zh_tw": "圓桌騎士，亞瑟王的忠臣", "zh_cn": "圆桌骑士，亚瑟王的忠臣", "ko": "원탁의 기사, 아서 왕의 충신"}, "desc_i18n": {"ja": "アーサー王伝説の最初期から語られる忠実な騎士で、円卓の騎士の一人。王の最期に最後まで付き従った騎士として知られる。", "en": "One of the earliest and most faithful companions of King Arthur and a Knight of the Round Table, famed as the last to attend the king at the end of his life.", "zh_tw": "亞瑟王傳說最早期的忠誠騎士之一，亦為圓桌騎士，以陪伴亞瑟王走完人生最後一刻而聞名。", "zh_cn": "亚瑟王传说最早期的忠诚骑士之一，亦为圆桌骑士，以陪伴亚瑟王走完人生最后一刻而闻名。", "ko": "아서 왕 전설 초기부터 전해지는 충실한 기사이자 원탁의 일원으로, 왕의 마지막 순간까지 곁을 지킨 기사로 널리 알려져 있다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "バラモルギネアス": {"name": "バラモルギネアス（ばらもるぎねあす：並外れた巨躯と怪力を誇る剛勇の騎士）", "display_name": "バラモルギネアス（巨躯の剛勇騎士）", "yomi": "ばらもるぎねあす", "wiki_title": "", "role": "巨躯と怪力を誇る騎士", "ai_desc": "パイル版に登場する巨漢の騎士。常人の三人を相手に渡り合えるほどの怪力の持ち主として描かれる。", "role_i18n": {"ja": "巨躯と怪力を誇る騎士", "en": "Knight of immense stature and strength", "zh_tw": "身軀魁梧、力大無窮的騎士", "zh_cn": "身躯魁梧、力大无穷的骑士", "ko": "거대한 체구와 괴력을 지닌 기사"}, "desc_i18n": {"ja": "パイル版に登場する巨漢の騎士。常人の三人を相手に渡り合えるほどの怪力の持ち主として描かれる。", "en": "A giant-framed knight in Pyle's tale, portrayed as possessing such extraordinary strength that he could withstand three ordinary knights at once.", "zh_tw": "派爾故事中
