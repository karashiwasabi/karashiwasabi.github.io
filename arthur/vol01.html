  <meta name="apple-mobile-web-app-title" content="アーサー王物語">
  <meta name="theme-color" content="#2c241b">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png?v=3">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    /* =========================================================================
       CSSレイアウト・配色定数（『正史三國志』ブラウン／羊皮紙テーマ完全準拠）
       ========================================================================= */
    :root {
      --bg-header-dark: #2c241b;
      --bg-header-sub: #3d2f1d;
      --bg-parchment: #f4f1ea;
      --bg-card: #fffdf9;
      --border-warm: #dcd3c1;
      --accent-gold: #8c6d46;
      --accent-gold-light: #d4b483;
      --accent-red: #b3392b;
      --text-primary: #261f18;
      --text-muted: #6b5c4c;
      --place-green: #1e6b3b;
      --person-brown: #7c3f12;
      --office-blue: #1e4e79;
      --special-purple: #63317c;
      --desktop-pane-width-pct: 50%;
      --mobile-map-height-pct: 40%;
      --mobile-reader-height-pct: 60%;
      --reader-bottom-safe-px: 48px;
      --z-map-controls: 700;
      --z-map-toast: 720;
      --z-map-modal: 850;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-parchment);
      color: var(--text-primary);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      -webkit-text-size-adjust: 100%;
    }

    .app-shell {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }

    /* 左ペイン：地図＋上部ナビ＋解説モーダル */
    .left-pane {
      position: relative;
      display: flex;
      flex-direction: column;
      width: var(--desktop-pane-width-pct);
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      flex-shrink: 0;
      border-right: 2px solid #bda988;
      background: #dfd7c5;
    }

    #map {
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
    }

    /* 地図上の巻切り替えバー（本家『正史三國志』と同一のスリム1行構成） */
    .vol-nav-bar {
      height: 38px;
      min-height: 38px;
      background: #2c241b;
      color: #f7f1e5;
      border-bottom: 1.5px solid #8c6d46;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      z-index: 2000;
      user-select: none;
      position: relative;
      flex-shrink: 0;
    }
    .home-top-link {
      position: absolute;
      left: 10px;
      background: #3e2723;
      color: #ffe082;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: bold;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }
    .home-top-link:hover { background: #5d4037; color: #fff; }
    .slim-nav-btn {
      background: #4e342e;
      color: #ffd54f;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1.3;
      text-decoration: none;
    }
    .slim-nav-btn:hover:not(:disabled) { background: #6d4c41; color: #fff; }
    .slim-nav-btn:disabled {
      background: transparent;
      color: #6d5d4b;
      border-color: #4e342e;
      cursor: not-allowed;
    }
    .vol-nav-select {
      background: #3e2723;
      color: #f7f1e5;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-family: "Yu Mincho", "MS PMincho", serif;
      letter-spacing: 0.05em;
      min-width: 0;
      max-width: 240px;
    }
    @media (max-width: 520px) {
      .vol-nav-bar { gap: 6px; padding: 0 6px; }
      .home-top-link { position: static; margin-right: auto; padding: 2px 6px; font-size: 0.72rem; }
      .vol-nav-select { max-width: 150px; font-size: 0.8rem; }
    }

    /* 地図右上：[📌 地図固定] ボタン（レイヤーアイコンの左隣） */
    .map-lock-btn {
      position: absolute;
      top: 10px;
      right: 54px;
      z-index: var(--z-map-controls);
      background: rgba(255, 253, 249, 0.95);
      color: var(--text-primary);
      border: 1px solid #a38e6d;
      border-radius: 6px;
      padding: 5px 9px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
      white-space: nowrap;
    }

    .map-lock-btn.is-locked {
      background: var(--accent-red);
      color: #ffffff;
      border-color: #7c1f15;
    }

    /* 地図左下の1行トースト */
    .map-toast {
      position: absolute;
      left: 10px;
      bottom: 18px;
      max-width: calc(100% - 20px);
      z-index: var(--z-map-toast);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(44, 36, 27, 0.94);
      color: #fdf8ee;
      border-left: 3px solid var(--accent-gold-light);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .map-toast.is-visible {
      display: inline-flex;
    }

    .map-toast-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-toast-close {
      background: transparent;
      border: none;
      color: #dfd3be;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }

    /* 自然地形・地名ピンラベル */
    .nature-mtn-label {
      color: #5c4328;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .nature-river-label {
      color: #1f5a8a;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .place-pin-tooltip {
      background: rgba(44, 36, 27, 0.9);
      color: #fffdf8;
      border: 1px solid #d4b483;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .area-badge-label {
      background: rgba(179, 57, 43, 0.84);
      color: #ffffff;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 左ペイン上の解説モーダル（右ペインの読書画面を隠さない） */
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: var(--z-map-modal);
      background: rgba(28, 22, 16, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      max-height: 88%;
      background: var(--bg-card);
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.38);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .modal-header {
      background: var(--bg-header-dark);
      color: #f8f1e4;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .modal-close-btn {
      background: rgba(255,255,255,0.14);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.82rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .homonym-switch-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      padding: 7px 9px;
      background: #f5ede0;
      border: 1px solid #d7c4a3;
      border-radius: 6px;
    }

    .homonym-btn {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #a88d63;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .homonym-btn.is-current {
      background: var(--bg-header-sub);
      color: #ffffff;
      border-color: var(--bg-header-dark);
    }

    .modal-role-badge {
      display: inline-block;
      background: #efe6d5;
      color: #4d3922;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-mapping-note {
      background: #f8f2e7;
      border-left: 3px solid var(--accent-gold);
      padding: 6px 9px;
      font-size: 0.78rem;
      color: #5a4631;
      margin-bottom: 8px;
    }

    .modal-wiki-box {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f4f1ea;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .modal-occ-section {
      margin-top: 12px;
      border-top: 1px solid var(--border-warm);
      padding-top: 9px;
    }

    .modal-occ-heading {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .occ-jump-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .occ-jump-btn {
      background: #fffdf9;
      color: var(--office-blue);
      border: 1px solid #b8c7d9;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .occ-jump-btn:hover {
      background: #eaf2fa;
    }

    /* 右ペイン：ヘッダ＋段落バー＋本文カードスクロール */
    .right-pane {
      width: var(--desktop-pane-width-pct);
      height: 100%;
      min-height: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-parchment);
    }

    .reader-header {
      background: var(--bg-header-dark);
      color: #f6efe2;
      padding: 7px 12px;
      border-bottom: 1px solid #6e5536;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reader-title-group {
      min-width: 0;
    }

    .reader-app-name {
      font-size: 0.72rem;
      color: var(--accent-gold-light);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .reader-vol-title {
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 段落切替コントロールバー */
    .para-bar {
      background: var(--bg-header-sub);
      color: #f3eadb;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
      border-bottom: 1px solid #6e5536;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .para-btn {
      background: rgba(255,255,255,0.12);
      color: #f8f1e4;
      border: 1px solid rgba(212,180,131,0.45);
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .para-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .para-btn.is-active-mode {
      background: var(--accent-gold);
      color: #ffffff;
      border-color: var(--accent-gold-light);
    }

    .para-select {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #b8a382;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      flex: 1 1 130px;
      min-width: 0;
      max-width: 240px;
    }

    /* 手元校正モード専用パネル（本番Webでは非表示） */
    .dev-feedback-panel {
      display: none;
      background: #fdf6e9;
      border-bottom: 2px solid #c9a66b;
      padding: 7px 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    .dev-feedback-panel.is-dev {
      display: block;
    }

    .dev-panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-mini-btn {
      background: #fffdf9;
      border: 1px solid #9c7d4c;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 記事スクロール領域（スマホ下端見切れ防止） */
    .records-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(var(--reader-bottom-safe-px) + env(safe-area-inset-bottom, 0px));
    }

    .record-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      border-left: 4px solid #cbbba0;
      border-radius: 7px;
      padding: 13px 15px;
      margin-bottom: 13px;
      box-shadow: 0 1px 4px rgba(44, 36, 27, 0.06);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .record-card.active-card {
      border-left-color: var(--accent-red);
      box-shadow: 0 2px 10px rgba(179, 57, 43, 0.15);
    }

    .record-card.is-verse {
      background: #fcf8ef;
      border-left-color: var(--accent-gold);
    }

    .card-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .type-badge {
      background: #ebe3d3;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 1px 7px;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .type-badge.verse {
      background: #e9d8b8;
      color: #5b3d14;
    }

    .era-badge {
      color: #6b5c4c;
      font-weight: 600;
    }

    .trans-box {
      font-size: 0.98rem;
      line-height: 1.9;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .record-card.is-verse .trans-box {
      font-style: italic;
      padding-left: 8px;
      border-left: 2px solid #dfd0b4;
    }

    /* 4分類インラインクリックタグ（PROJECT_RULES 第3章1節準拠） */
    .inline-place {
      color: var(--place-green);
      border-bottom: 2px solid var(--place-green);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-person {
      color: var(--person-brown);
      border-bottom: 1.5px dotted var(--person-brown);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-office {
      color: var(--office-blue);
      border-bottom: 1.5px dashed var(--office-blue);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-special {
      color: var(--special-purple);
      border-bottom: 1.5px dotted var(--special-purple);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-place:hover, .inline-person:hover, .inline-office:hover, .inline-special:hover {
      background: rgba(212, 180, 131, 0.22);
    }

    /* 英語底本折りたたみ表示 */
    .source-details {
      margin-top: 10px;
      border-top: 1px dashed var(--border-warm);
      padding-top: 7px;
    }

    .source-details summary {
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
      user-select: none;
    }

    .source-text-body {
      margin-top: 7px;
      padding: 8px 10px;
      background: #f7f3eb;
      border-radius: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      line-height: 1.72;
      color: #33291e;
    }

    /* 手元校正用1クリック指摘ボタン列 */
    .card-dev-bar {
      display: none;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dotted #d7cbb8;
      gap: 5px;
      flex-wrap: wrap;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body.is-dev-mode .card-dev-bar {
      display: flex;
    }

    .dev-flag-btn {
      background: #faf4e8;
      color: #5c472c;
      border: 1px solid #cbb692;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.71rem;
      cursor: pointer;
    }

    .adsense-footer-box {
      margin-top: 18px;
      padding: 10px;
      background: #efeae0;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* スマホ・タブレット縦（横幅900px以下：上40%地図・下60%本文） */
    @media (max-width: 900px) {
      .app-shell {
        flex-direction: column;
      }
      .left-pane {
        width: 100%;
        height: var(--mobile-map-height-pct);
        border-right: none;
        border-bottom: 2px solid #bda988;
      }
      .right-pane {
        width: 100%;
        height: var(--mobile-reader-height-pct);
      }
      .map-lock-btn {
        top: 8px;
        right: 48px;
        padding: 4px 7px;
        font-size: 0.72rem;
      }
    }
    /* 手元校正トレイ：地図右下の折りたたみ式（本家 feedback-tray 準拠） */
    .dev-feedback-panel {
      position: absolute;
      right: 10px;
      bottom: 28px;
      z-index: 1500;
      width: 230px;
      padding: 0;
      border: 1px solid #c9a66b;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .dev-tray-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
