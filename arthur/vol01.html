 to be the greatest leader in war of any man then alive); and he gave {{person:ユーサー|Uther-Pendragon}} aid and advice in battle. So, with the help of {{person:マーリン|Merlin}} and Sir {{person:ウルフィアス|Ulfius}}, {{person:ユーサー|Uther-Pendragon}} was able to overcome all of his enemies and to become {{office:王|King}} of the entire realm.", "translation_tagged": "その昔、{{person:ユーサー|ユーサー・ペンドラゴン}}という非常に高貴な{{office:王|王}}がおり、{{place:ブリテン島|ブリテン}}全土の覇王となった。この{{office:王|王}}が王国の{{office:ペンドラゴン|ペンドラゴン位}}を成し遂げるにあたっては、二人の人物が大いに力を貸し、あらゆる事柄で多大な助けを与えた。その一人は、人々に賢者{{person:マーリン|マーリン}}として知られる非常に強力な{{special:魔術師|魔術師}}にして一時は預言者でもあった者で、{{person:ユーサー|ユーサー・ペンドラゴン}}に極めて良き助言を与えた。もう一人は、{{person:ウルフィアス|ウルフィアス}}と呼ばれる優れた貴族にして名高い{{office:騎士|騎士}}（当時存命のいかなる者よりも偉大な戦の指揮官であると多くの人に思われていた）で、戦において{{person:ユーサー|ユーサー・ペンドラゴン}}に助力と助言を与えた。こうして、{{person:マーリン|マーリン}}と{{person:ウルフィアス|ウルフィアス}}卿の助けにより、{{person:ユーサー|ユーサー・ペンドラゴン}}はすべての敵を打ち破り、全土の{{office:王|王}}となることができた。", "persons": "ユーサー,マーリン,ウルフィアス", "places": "ブリテン島", "offices": "王,ペンドラゴン,騎士", "era_year": "伝説時代", "keywords": "魔術師", "is_enriched": true, "zh_tw": "很久以前，有一位十分高貴的國王，名叫烏瑟·潘德拉剛，他成為整個不列顛的霸主。這位國王之所以能達成王國的潘德拉剛之位，全賴兩個人鼎力相助，他們在他所做的一切事情上都給予極大的幫助。其中一人是一位法力極其強大、一度也是先知的魔法師，世人稱他為智者梅林；他給烏瑟·潘德拉剛提供了非常好的建言。另一人是一位出色的貴族、聲名卓著的騎士，名叫烏爾菲亞斯（許多人認為他是當時在世的最偉大的戰爭統帥），他在戰鬥中給予烏瑟·潘德拉剛協助與建議。就這樣，憑藉梅林與烏爾菲亞斯爵士的幫助，烏瑟·潘德拉剛得以擊敗他所有的敵人，成為整個王國的國王。", "zh_tw_tagged": "很久以前，有一位十分高貴的{{office:王|國王}}，名叫{{person:ユーサー|烏瑟·潘德拉剛}}，他成為整個{{place:ブリテン島|不列顛}}的霸主。這位{{office:王|國王}}之所以能達成王國的{{office:ペンドラゴン|潘德拉剛之位}}，全賴兩個人鼎力相助，他們在他所做的一切事情上都給予極大的幫助。其中一人是一位法力極其強大、一度也是先知的{{special:魔術師|魔法師}}，世人稱他為智者{{person:マーリン|梅林}}；他給{{person:ユーサー|烏瑟·潘德拉剛}}提供了非常好的建言。另一人是一位出色的貴族、聲名卓著的{{office:騎士|騎士}}，名叫{{person:ウルフィアス|烏爾菲亞斯}}（許多人認為他是當時在世的最偉大的戰爭統帥），他在戰鬥中給予{{person:ユーサー|烏瑟·潘德拉剛}}協助與建議。就這樣，憑藉{{person:マーリン|梅林}}與{{person:ウルフィアス|烏爾菲亞斯}}爵士的幫助，{{person:ユーサー|烏瑟·潘德拉剛}}得以擊敗他所有的敵人，成為整個王國的{{office:王|國王}}。", "zh_cn": "很久以前，有一位十分高贵的国王，名叫乌瑟·潘德拉刚，他成为整个不列颠的霸主。这位国王之所以能达成王国的潘德拉刚之位，全赖两个人鼎力相助，他们在他所做的一切事情上都给予极大的帮助。其中一人是一位法力极其强大、一度也是先知的魔法师，世人称他为智者梅林；他给乌瑟·潘德拉刚提供了非常好的建言。另一人是一位出色的贵族、声名卓著的骑士，名叫乌尔菲亚斯（许多人认为他是当时在世的最伟大的战争统帅），他在战斗中给予乌瑟·潘德拉刚协助与建议。就这样，凭借梅林与乌尔菲亚斯爵士的帮助，乌瑟·潘德拉刚得以击败他所有的敌人，成为整个王国的国王。", "zh_cn_tagged": "很久以前，有一位十分高贵的{{office:王|国王}}，名叫{{person:ユーサー|乌瑟·潘德拉刚}}，他成为整个{{place:ブリテン島|不列颠}}的霸主。这位{{office:王|国王}}之所以能达成王国的{{office:ペンドラゴン|潘德拉刚之位}}，全赖两个人鼎力相助，他们在他所做的一切事情上都给予极大的帮助。其中一人是一位法力极其强大、一度也是先知的{{special:魔術師|魔法师}}，世人称他为智者{{person:マーリン|梅林}}；他给{{person:ユーサー|乌瑟·潘德拉刚}}提供了非常好的建言。另一人是一位出色的贵族、声名卓著的{{office:騎士|骑士}}，名叫{{person:ウルフィアス|乌尔菲亚斯}}（许多人认为他是当时在世的最伟大的战争统帅），他在战斗中给予{{person:ユーサー|乌瑟·潘德拉刚}}协助与建议。就这样，凭借{{person:マーリン|梅林}}与{{person:ウルフィアス|乌尔菲亚斯}}爵士的帮助，{{person:ユーサー|乌瑟·潘德拉刚}}得以击败他所有的敌人，成为整个王国的{{office:王|国王}}。", "ko": "옛날에 매우 고귀한 왕이 살았으니, 그의 이름은 우서 펜드래건이었고 그는 브리튼 전역의 패왕이 되었다. 이 왕이 왕국의 펜드래건 지위를 이루는 데에는 두 사람의 도움이 매우 컸으며, 그들은 그가 하는 모든 일에서 큰 조력을 베풀었다. 그중 한 사람은 매우 강력한 마법사이자 한때 예언자이기도 했던 인물로, 사람들에게 현자 멀린으로 알려져 있었으며, 우서 펜드래건에게 매우 좋은 조언을 주었다. 다른 한 사람은 뛰어난 귀족이자 이름난 기사로 울피우스라 불렸는데 (당시 살아 있는 누구보다도 위대한 전쟁 지휘관이라고 많은 이들이 생각했다), 전투에서 우서 펜드래건에게 도움과 조언을 주었다. 그리하여 멀린과 울피우스 경의 도움으로 우서 펜드래건은 모든 적을 이기고 온 왕국의 왕이 될 수 있었다.", "ko_tagged": "옛날에 매우 고귀한 {{office:王|왕}}이 살았으니, 그의 이름은 {{person:ユーサー|우서 펜드래건}}이었고 그는 {{place:ブリテン島|브리튼}} 전역의 패왕이 되었다. 이 {{office:王|왕}}이 왕국의 {{office:ペンドラゴン|펜드래건 지위}}를 이루는 데에는 두 사람의 도움이 매우 컸으며, 그들은 그가 하는 모든 일에서 큰 조력을 베풀었다. 그중 한 사람은 매우 강력한 {{special:魔術師|마법사}}이자 한때 예언자이기도 했던 인물로, 사람들에게 현자 {{person:マーリン|멀린}}으로 알려져 있었으며, {{person:ユーサー|우서 펜드래건}}에게 매우 좋은 조언을 주었다. 다른 한 사람은 뛰어난 귀족이자 이름난 {{office:騎士|기사}}로 {{person:ウルフィアス|울피우스}}라 불렸는데 (당시 살아 있는 누구보다도 위대한 전쟁 지휘관이라고 많은 이들이 생각했다), 전투에서 {{person:ユーサー|우서 펜드래건}}에게 도움과 조언을 주었다. 그리하여 {{person:マーリン|멀린}}과 {{person:ウルフィアス|울피우스}} 경의 도움으로 {{person:ユーサー|우서 펜드래건}}은 모든 적을 이기고 온 왕국의 {{office:王|왕}}이 될 수 있었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p2_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 2, "type": "本文", "raw_text": "After Uther-Pendragon had ruled his kingdom for a number of years he took to wife a certain beautiful and gentle lady, hight Igraine. This noble dame was the widow of Gerlois, the Duke of Tintegal; -by which prince she had two daughters-one of whom was named Margaise and the other Morgana le Fay. And Morgana le Fay was a famous sorceress. These daughters the Queen brought with her to the Court of Uther-Pendragon after she had married that puissant King, and there Margaise was wedded to King Urien of Gore, and Morgana le Fay was wedded to King Lot of Orkney.", "translation": "ユーサー・ペンドラゴンは数年にわたり王国を治めたのち、イグレーヌという美しく心優しい貴婦人を妃に迎えた。この高貴な婦人はティンタジェル公ゲルロイスの未亡人で、この公との間に二人の娘があり、一人はマルゲーズ、もう一人はモルガン・ル・フェイといった。モルガン・ル・フェイは名高い魔女であった。王妃はこの強大な王と結婚したのち、娘たちをユーサー・ペンドラゴンの宮廷に伴い、そこでマルゲーズはゴアのユリエンス王に、モルガン・ル・フェイはオークニーのロット王に嫁いだ。", "raw_tagged": "After {{person:ユーサー|Uther-Pendragon}} had ruled his kingdom for a number of years he took to wife a certain beautiful and gentle lady, hight {{person:イグレーヌ|Igraine}}. This noble dame was the widow of {{person:ゲルロイス|Gerlois}}, the {{office:公爵|Duke}} of {{place:ティンタジェル|Tintegal}}; -by which prince she had two daughters-one of whom was named {{person:マルゲーズ|Margaise}} and the other {{person:モルガン・ル・フェイ|Morgana le Fay}}. And {{person:モルガン・ル・フェイ|Morgana le Fay}} was a famous {{special:魔女|sorceress}}. These daughters the {{office:王妃|Queen}} brought with her to the Court of {{person:ユーサー|Uther-Pendragon}} after she had married that puissant {{office:王|King}}, and there {{person:マルゲーズ|Margaise}} was wedded to {{office:王|King}} {{person:ユリエンス|Urien}} of {{special:ゴア|Gore}}, and {{person:モルガン・ル・フェイ|Morgana le Fay}} was wedded to {{office:王|King}} {{person:ロット|Lot}} of {{place:オークニー|Orkney}}.", "translation_tagged": "{{person:ユーサー|ユーサー・ペンドラゴン}}は数年にわたり王国を治めたのち、{{person:イグレーヌ|イグレーヌ}}という美しく心優しい貴婦人を妃に迎えた。この高貴な婦人は{{place:ティンタジェル|ティンタジェル}}{{office:公爵|公}}{{person:ゲルロイス|ゲルロイス}}の未亡人で、この公との間に二人の娘があり、一人は{{person:マルゲーズ|マルゲーズ}}、もう一人は{{person:モルガン・ル・フェイ|モルガン・ル・フェイ}}といった。{{person:モルガン・ル・フェイ|モルガン・ル・フェイ}}は名高い{{special:魔女|魔女}}であった。{{office:王妃|王妃}}はこの強大な{{office:王|王}}と結婚したのち、娘たちを{{person:ユーサー|ユーサー・ペンドラゴン}}の宮廷に伴い、そこで{{person:マルゲーズ|マルゲーズ}}は{{special:ゴア|ゴア}}の{{person:ユリエンス|ユリエンス}}王に、{{person:モルガン・ル・フェイ|モルガン・ル・フェイ}}は{{place:オークニー|オークニー}}の{{person:ロット|ロット}}王に嫁いだ。", "persons": "ユーサー,イグレーヌ,ゲルロイス,マルゲーズ,モルガン・ル・フェイ,ユリエンス,ロット", "places": "ティンタジェル,オークニー", "offices": "公爵,王妃,王", "era_year": "伝説時代", "keywords": "魔女,ゴア", "is_enriched": true, "zh_tw": "烏瑟·潘德拉剛治理王國數年後，娶了一位美麗而溫柔的貴婦，名叫伊格蕾茵。這位高貴的夫人是廷塔哲公爵格洛伊斯的遺孀，與這位公爵生有兩個女兒，一個名叫瑪嘉絲，另一個名叫摩根勒菲。摩根勒菲是一位著名的女巫。王后嫁給這位強大的國王之後，把女兒們帶到烏瑟·潘德拉剛的宮廷，瑪嘉絲在那裡嫁給了戈爾的尤里安國王，摩根勒菲則嫁給了奧克尼的洛特國王。", "zh_tw_tagged": "{{person:ユーサー|烏瑟·潘德拉剛}}治理王國數年後，娶了一位美麗而溫柔的貴婦，名叫{{person:イグレーヌ|伊格蕾茵}}。這位高貴的夫人是{{place:ティンタジェル|廷塔哲}}{{office:公爵|公爵}}{{person:ゲルロイス|格洛伊斯}}的遺孀，與這位公爵生有兩個女兒，一個名叫{{person:マルゲーズ|瑪嘉絲}}，另一個名叫{{person:モルガン・ル・フェイ|摩根勒菲}}。{{person:モルガン・ル・フェイ|摩根勒菲}}是一位著名的{{special:魔女|女巫}}。{{office:王妃|王后}}嫁給這位強大的{{office:王|國王}}之後，把女兒們帶到{{person:ユーサー|烏瑟·潘德拉剛}}的宮廷，{{person:マルゲーズ|瑪嘉絲}}在那裡嫁給了{{special:ゴア|戈爾}}的{{person:ユリエンス|尤里安}}國王，{{person:モルガン・ル・フェイ|摩根勒菲}}則嫁給了{{place:オークニー|奧克尼}}的{{person:ロット|洛特}}國王。", "zh_cn": "乌瑟·潘德拉刚治理王国数年后，娶了一位美丽而温柔的贵妇，名叫伊格蕾茵。这位高贵的夫人是廷塔哲公爵格洛伊斯的遗孀，与这位公爵生有两个女儿，一个名叫玛嘉丝，另一个名叫摩根勒菲。摩根勒菲是一位著名的女巫。王后嫁给这位强大的国王之后，把女儿们带到乌瑟·潘德拉刚的宫廷，玛嘉丝在那里嫁给了戈尔的尤里安国王，摩根勒菲则嫁给了奥克尼的洛特国王。", "zh_cn_tagged": "{{person:ユーサー|乌瑟·潘德拉刚}}治理王国数年后，娶了一位美丽而温柔的贵妇，名叫{{person:イグレーヌ|伊格蕾茵}}。这位高贵的夫人是{{place:ティンタジェル|廷塔哲}}{{office:公爵|公爵}}{{person:ゲルロイス|格洛伊斯}}的遗孀，与这位公爵生有两个女儿，一个名叫{{person:マルゲーズ|玛嘉丝}}，另一个名叫{{person:モルガン・ル・フェイ|摩根勒菲}}。{{person:モルガン・ル・フェイ|摩根勒菲}}是一位著名的{{special:魔女|女巫}}。{{office:王妃|王后}}嫁给这位强大的{{office:王|国王}}之后，把女儿们带到{{person:ユーサー|乌瑟·潘德拉刚}}的宫廷，{{person:マルゲーズ|玛嘉丝}}在那里嫁给了{{special:ゴア|戈尔}}的{{person:ユリエンス|尤里安}}国王，{{person:モルガン・ル・フェイ|摩根勒菲}}则嫁给了{{place:オークニー|奥克尼}}的{{person:ロット|洛特}}国王。", "ko": "우서 펜드래건은 몇 해 동안 왕국을 다스린 뒤, 이그레인이라는 아름답고 온화한 귀부인을 아내로 맞았다. 이 고귀한 부인은 틴타겔 공작 게를루아의 미망인으로, 이 공작과의 사이에 두 딸을 두었으니 한 명은 마르게즈, 다른 한 명은 모르가나 르 페이라 했다. 모르가나 르 페이는 이름난 마녀였다. 왕비는 이 강대한 왕과 혼인한 뒤 딸들을 우서 펜드래건의 궁정으로 데려왔고, 그곳에서 마르게즈는 고어의 유리엔 왕에게, 모르가나 르 페이는 오크니의 로트 왕에게 시집갔다.", "ko_tagged": "{{person:ユーサー|우서 펜드래건}}은 몇 해 동안 왕국을 다스린 뒤, {{person:イグレーヌ|이그레인}}이라는 아름답고 온화한 귀부인을 아내로 맞았다. 이 고귀한 부인은 {{place:ティンタジェル|틴타겔}} {{office:公爵|공작}} {{person:ゲルロイス|게를루아}}의 미망인으로, 이 공작과의 사이에 두 딸을 두었으니 한 명은 {{person:マルゲーズ|마르게즈}}, 다른 한 명은 {{person:モルガン・ル・フェイ|모르가나 르 페이}}라 했다. {{person:モルガン・ル・フェイ|모르가나 르 페이}}는 이름난 {{special:魔女|마녀}}였다. {{office:王妃|왕비}}는 이 강대한 {{office:王|왕}}과 혼인한 뒤 딸들을 {{person:ユーサー|우서 펜드래건}}의 궁정으로 데려왔고, 그곳에서 {{person:マルゲーズ|마르게즈}}는 {{special:ゴア|고어}}의 {{person:ユリエンス|유리엔}} 왕에게, {{person:モルガン・ル・フェイ|모르가나 르 페이}}는 {{place:オークニー|오크니}}의 {{person:ロット|로트}} 왕에게 시집갔다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p3_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 3, "type": "本文", "raw_text": "Now after awhile Uther-Pendragon and Queen Igraine had a son born unto them, and he was very beautiful and of great size and strength of bone. And whilst the child still lay wrapped in his swaddling clothes and lying in a cradle of gold and ultramarine, Merlin came to Uther-Pendragon with a spirit of prophecy strong upon him (for such was often the case with him), and, speaking in that spirit of prophecy, he said, “Lord, it is given unto me to foresee that thou shalt shortly fall sick of a fever and that thou shalt maybe die of a violent sweat that will follow thereon. Now, should such a dolorous thing befall us all, this young child (who is, certes, the hope of all this realm) will be in very great danger of his life; for many enemies will assuredly rise up with design to seize upon him for the sake of his inheritance, and either he will be slain or else he will be held in captivity from which he shall hardly hope to escape. Wherefore, I do beseech thee, Lord, that thou wilt permit Sir Ulfius and myself to presently convey the child away unto some place of safe refuge, where he may be hidden in secret until he groweth to manhood and is able to guard himself from such dangers as may threaten him.”", "translation": "しばらくして、ユーサー・ペンドラゴンと王妃イグレーヌの間に男の子が生まれた。その子は非常に美しく、体格も骨格も大きく頑健であった。その子がまだ産着にくるまれ、金と群青で飾られた揺りかごに横たわっていたころ、マーリンが予言の霊感に強く促されてユーサー・ペンドラゴンのもとへやって来た（彼にはよくあることであった）。そしてその予言の霊感のうちに語って言った。「主君よ、私には見えております。あなたはほどなく熱病に倒れ、それに続く激しい発汗によって命を落とされるやもしれません。もしそのような悲しむべき事態が我らすべてに降りかかれば、この幼子は（まことにこの全王国の希望であります）命の危険に大いにさらされましょう。多くの敵が、相続のためにこの子を奪おうと企てて必ずや立ち上がり、この子は殺されるか、あるいは脱出の望みもほとんどない囚われの身となるでしょう。ゆえに、主君よ、お願い申し上げます。ウルフィアス卿と私に、いま直ちにこの子を安全な避難先へ連れ去ることをお許しください。そこで、この子が成人し、身に迫る危険から自らを守れるようになるまで、ひそかに隠しておくのです。」", "raw_tagged": "Now after awhile {{person:ユーサー|Uther-Pendragon}} and {{office:王妃|Queen}} {{person:イグレーヌ|Igraine}} had a son born unto them, and he was very beautiful and of great size and strength of bone. And whilst the child still lay wrapped in his swaddling clothes and lying in a cradle of gold and ultramarine, {{person:マーリン|Merlin}} came to {{person:ユーサー|Uther-Pendragon}} with a spirit of {{special:予言|prophecy}} strong upon him (for such was often the case with him), and, speaking in that spirit of {{special:予言|prophecy}}, he said, “Lord, it is given unto me to foresee that thou shalt shortly fall sick of a fever and that thou shalt maybe die of a violent sweat that will follow thereon. Now, should such a dolorous thing befall us all, this young child (who is, certes, the hope of all this realm) will be in very great danger of his life; for many enemies will assuredly rise up with design to seize upon him for the sake of his inheritance, and either he will be slain or else he will be held in captivity from which he shall hardly hope to escape. Wherefore, I do beseech thee, Lord, that thou wilt permit Sir {{person:ウルフィアス|Ulfius}} and myself to presently convey the child away unto some place of safe refuge, where he may be hidden in secret until he groweth to manhood and is able to guard himself from such dangers as may threaten him.”", "translation_tagged": "しばらくして、{{person:ユーサー|ユーサー・ペンドラゴン}}と{{office:王妃|王妃}}{{person:イグレーヌ|イグレーヌ}}の間に男の子が生まれた。その子は非常に美しく、体格も骨格も大きく頑健であった。その子がまだ産着にくるまれ、金と群青で飾られた揺りかごに横たわっていたころ、{{person:マーリン|マーリン}}が{{special:予言|予言}}の霊感に強く促されて{{person:ユーサー|ユーサー・ペンドラゴン}}のもとへやって来た（彼にはよくあることであった）。そしてその{{special:予言|予言}}の霊感のうちに語って言った。「主君よ、私には見えております。あなたはほどなく熱病に倒れ、それに続く激しい発汗によって命を落とされるやもしれません。もしそのような悲しむべき事態が我らすべてに降りかかれば、この幼子は（まことにこの全王国の希望であります）命の危険に大いにさらされましょう。多くの敵が、相続のためにこの子を奪おうと企てて必ずや立ち上がり、この子は殺されるか、あるいは脱出の望みもほとんどない囚われの身となるでしょう。ゆえに、主君よ、お願い申し上げます。{{person:ウルフィアス|ウルフィアス}}卿と私に、いま直ちにこの子を安全な避難先へ連れ去ることをお許しください。そこで、この子が成人し、身に迫る危険から自らを守れるようになるまで、ひそかに隠しておくのです。」", "persons": "ユーサー,イグレーヌ,マーリン,ウルフィアス", "places": "", "offices": "王妃", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "過了一段時間，烏瑟·潘德拉剛與王后伊格蕾茵生下一個兒子，這孩子十分俊美，身材高大，骨骼強健。當這孩子還裹在襁褓中，躺在以黃金與群青裝飾的搖籃裡時，梅林懷著強烈的預言之靈來到烏瑟·潘德拉剛面前（他常有這樣的情形），並在這預言之靈中說道：「主公，我得以預見，您不久將罹患熱病，隨後因劇烈發汗而可能喪命。若這樣悲慘的事降臨我們所有人，這位幼子（他確實是整個王國的希望）將面臨極大的性命危險；因為許多敵人必定會為了他的繼承權而起身謀奪他，他不是被殺，就是被囚禁，幾乎無望逃脫。因此，主公，我懇求您，允許烏爾菲亞斯爵士與我立即把孩子帶到某個安全的避難之處，把他祕密藏起來，直到他長大成人，能夠保護自己免受威脅他的危險。」", "zh_tw_tagged": "過了一段時間，{{person:ユーサー|烏瑟·潘德拉剛}}與{{office:王妃|王后}}{{person:イグレーヌ|伊格蕾茵}}生下一個兒子，這孩子十分俊美，身材高大，骨骼強健。當這孩子還裹在襁褓中，躺在以黃金與群青裝飾的搖籃裡時，{{person:マーリン|梅林}}懷著強烈的{{special:予言|預言}}之靈來到{{person:ユーサー|烏瑟·潘德拉剛}}面前（他常有這樣的情形），並在這{{special:予言|預言}}之靈中說道：「主公，我得以預見，您不久將罹患熱病，隨後因劇烈發汗而可能喪命。若這樣悲慘的事降臨我們所有人，這位幼子（他確實是整個王國的希望）將面臨極大的性命危險；因為許多敵人必定會為了他的繼承權而起身謀奪他，他不是被殺，就是被囚禁，幾乎無望逃脫。因此，主公，我懇求您，允許{{person:ウルフィアス|烏爾菲亞斯}}爵士與我立即把孩子帶到某個安全的避難之處，把他祕密藏起來，直到他長大成人，能夠保護自己免受威脅他的危險。」", "zh_cn": "过了一段时间，乌瑟·潘德拉刚与王后伊格蕾茵生下一个儿子，这孩子十分俊美，身材高大，骨骼强健。当这孩子还裹在襁褓中，躺在以黄金与群青装饰的摇篮里时，梅林怀着强烈的预言之灵来到乌瑟·潘德拉刚面前（他常有这样的情形），并在这预言之灵中说道：“主公，我得以预见，您不久将罹患热病，随后因剧烈发汗而可能丧命。若这样悲惨的事降临我们所有人，这位幼子（他确实是整个王国的希望）将面临极大的性命危险；因为许多敌人必定会为了他的继承权而起身谋夺他，他不是被杀，就是被囚禁，几乎无望逃脱。因此，主公，我恳求您，允许乌尔菲亚斯爵士与我立即把孩子带到某个安全的避难之处，把他秘密藏起来，直到他长大成人，能够保护自己免受威胁他的危险。”", "zh_cn_tagged": "过了一段时间，{{person:ユーサー|乌瑟·潘德拉刚}}与{{office:王妃|王后}}{{person:イグレーヌ|伊格蕾茵}}生下一个儿子，这孩子十分俊美，身材高大，骨骼强健。当这孩子还裹在襁褓中，躺在以黄金与群青装饰的摇篮里时，{{person:マーリン|梅林}}怀着强烈的{{special:予言|预言}}之灵来到{{person:ユーサー|乌瑟·潘德拉刚}}面前（他常有这样的情形），并在这{{special:予言|预言}}之灵中说道：“主公，我得以预见，您不久将罹患热病，随后因剧烈发汗而可能丧命。若这样悲惨的事降临我们所有人，这位幼子（他确实是整个王国的希望）将面临极大的性命危险；因为许多敌人必定会为了他的继承权而起身谋夺他，他不是被杀，就是被囚禁，几乎无望逃脱。因此，主公，我恳求您，允许{{person:ウルフィアス|乌尔菲亚斯}}爵士与我立即把孩子带到某个安全的避难之处，把他秘密藏起来，直到他长大成人，能够保护自己免受威胁他的危险。”", "ko": "얼마 후 우서 펜드래건과 왕비 이그레인 사이에 아들이 태어났는데, 그 아이는 매우 아름다웠고 체격과 골격이 크고 튼튼했다. 아이가 아직 포대기에 싸여 금과 군청색으로 꾸민 요람에 누워 있을 때, 멀린이 강한 예언의 영감에 사로잡혀 우서 펜드래건을 찾아왔다(그에게는 흔한 일이었다). 그리고 그 예언의 영감 속에서 말했다. “주군이시여, 저는 이렇게 내다보게 되었습니다. 주군께서는 머지않아 열병에 걸리시고, 이어지는 심한 발한으로 목숨을 잃으실 수도 있습니다. 만일 그런 비통한 일이 우리 모두에게 닥친다면, 이 어린아이(참으로 이 온 왕국의 희망입니다)는 목숨이 크게 위태로워질 것입니다. 많은 적들이 상속을 노려 그를 붙잡으려고 반드시 일어설 것이며, 그는 살해되거나 탈출할 희망이 거의 없는 감금 상태에 놓일 것입니다. 그러므로 주군이시여, 청하오니 울피우스 경과 제가 지금 곧 아이를 안전한 피난처로 데려가, 장성하여 자신을 위협하는 위험으로부터 스스로를 지킬 수 있을 때까지 은밀히 숨겨 두도록 허락해 주십시오.”", "ko_tagged": "얼마 후 {{person:ユーサー|우서 펜드래건}}과 {{office:王妃|왕비}} {{person:イグレーヌ|이그레인}} 사이에 아들이 태어났는데, 그 아이는 매우 아름다웠고 체격과 골격이 크고 튼튼했다. 아이가 아직 포대기에 싸여 금과 군청색으로 꾸민 요람에 누워 있을 때, {{person:マーリン|멀린}}이 강한 {{special:予言|예언}}의 영감에 사로잡혀 {{person:ユーサー|우서 펜드래건}}을 찾아왔다(그에게는 흔한 일이었다). 그리고 그 {{special:予言|예언}}의 영감 속에서 말했다. “주군이시여, 저는 이렇게 내다보게 되었습니다. 주군께서는 머지않아 열병에 걸리시고, 이어지는 심한 발한으로 목숨을 잃으실 수도 있습니다. 만일 그런 비통한 일이 우리 모두에게 닥친다면, 이 어린아이(참으로 이 온 왕국의 희망입니다)는 목숨이 크게 위태로워질 것입니다. 많은 적들이 상속을 노려 그를 붙잡으려고 반드시 일어설 것이며, 그는 살해되거나 탈출할 희망이 거의 없는 감금 상태에 놓일 것입니다. 그러므로 주군이시여, 청하오니 {{person:ウルフィアス|울피우스}} 경과 제가 지금 곧 아이를 안전한 피난처로 데려가, 장성하여 자신을 위협하는 위험으로부터 스스로를 지킬 수 있을 때까지 은밀히 숨겨 두도록 허락해 주십시오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p4_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 4, "type": "本文", "raw_text": "When Merlin had made an end of speaking thus, Uther-Pendragon made reply with a very steadfast countenance in this wise: “Merlin, so far as my death is concerned-when my time cometh to die I believe God will give me grace to meet my end with entire cheerfulness; for, certes, my lot is in that wise no different from that of any other man who hath been born of woman. But touching the matter of this young child, if thy prophecy be true, then his danger is very great, and it would be well that he should be conveyed hence to some place of safe harborage as thou dost advise. Wherefore, I pray thee to perform thy will in this affair, bearing in thy heart the consideration that the child is the most precious inheritance which I shall leave unto this land.”", "translation": "マーリンがこう語り終えると、ユーサー・ペンドラゴンは実に毅然とした面持ちでこう答えた。「マーリンよ、私自身の死について言えば――死ぬべき時が来たなら、神は私に、この終わりを晴れやかな心で迎える恵みを与えてくださると信じている。まことに、この点で私の運命は、女から生まれた他のいかなる人間とも変わりはしない。だが、この幼子のことについては、もしそなたの予言が真実ならば、その危険は極めて大きく、そなたの勧めるとおり、安全な避難の地へ連れ去るのが良かろう。ゆえに、この件はそなたの思うままに行ってくれ。ただし、この子こそが、私がこの国に遺す最も貴い遺産であることを、心に留めておくように。」", "raw_tagged": "When {{person:マーリン|Merlin}} had made an end of speaking thus, {{person:ユーサー|Uther-Pendragon}} made reply with a very steadfast countenance in this wise: “{{person:マーリン|Merlin}}, so far as my death is concerned-when my time cometh to die I believe God will give me grace to meet my end with entire cheerfulness; for, certes, my lot is in that wise no different from that of any other man who hath been born of woman. But touching the matter of this young child, if thy {{special:予言|prophecy}} be true, then his danger is very great, and it would be well that he should be conveyed hence to some place of safe harborage as thou dost advise. Wherefore, I pray thee to perform thy will in this affair, bearing in thy heart the consideration that the child is the most precious inheritance which I shall leave unto this land.”", "translation_tagged": "{{person:マーリン|マーリン}}がこう語り終えると、{{person:ユーサー|ユーサー・ペンドラゴン}}は実に毅然とした面持ちでこう答えた。「{{person:マーリン|マーリン}}よ、私自身の死について言えば――死ぬべき時が来たなら、神は私に、この終わりを晴れやかな心で迎える恵みを与えてくださると信じている。まことに、この点で私の運命は、女から生まれた他のいかなる人間とも変わりはしない。だが、この幼子のことについては、もしそなたの{{special:予言|予言}}が真実ならば、その危険は極めて大きく、そなたの勧めるとおり、安全な避難の地へ連れ去るのが良かろう。ゆえに、この件はそなたの思うままに行ってくれ。ただし、この子こそが、私がこの国に遺す最も貴い遺産であることを、心に留めておくように。」", "persons": "ユーサー,マーリン", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "梅林說完這番話後，烏瑟·潘德拉剛神情十分堅定地回答：「梅林，就我自己的死而言——當我死期來臨時，我相信上帝會賜我恩典，讓我以全然歡喜的心迎接終點；因為，我的命運在這一點上，確實與任何其他由女人所生的人並無不同。但關於這位幼子的事，若你的預言屬實，那麼他的危險便非常大，依你所勸，把他帶到某個安全的避難之處是明智之舉。因此，我請你依你的意思辦理此事，並請謹記在心：這孩子是我留給這片土地最珍貴的遺產。」", "zh_tw_tagged": "{{person:マーリン|梅林}}說完這番話後，{{person:ユーサー|烏瑟·潘德拉剛}}神情十分堅定地回答：「{{person:マーリン|梅林}}，就我自己的死而言——當我死期來臨時，我相信上帝會賜我恩典，讓我以全然歡喜的心迎接終點；因為，我的命運在這一點上，確實與任何其他由女人所生的人並無不同。但關於這位幼子的事，若你的{{special:予言|預言}}屬實，那麼他的危險便非常大，依你所勸，把他帶到某個安全的避難之處是明智之舉。因此，我請你依你的意思辦理此事，並請謹記在心：這孩子是我留給這片土地最珍貴的遺產。」", "zh_cn": "梅林说完这番话后，乌瑟·潘德拉刚神情十分坚定地回答：“梅林，就我自己的死而言——当我死期来临时，我相信上帝会赐我恩典，让我以全然欢喜的心迎接终点；因为，我的命运在这一点上，确实与任何其他由女人所生的人并无不同。但关于这位幼子的事，若你的预言属实，那么他的危险便非常大，依你所劝，把他带到某个安全的避难之处是明智之举。因此，我请你依你的意思办理此事，并请谨记在心：这孩子是我留给这片土地最珍贵的遗产。”", "zh_cn_tagged": "{{person:マーリン|梅林}}说完这番话后，{{person:ユーサー|乌瑟·潘德拉刚}}神情十分坚定地回答：“{{person:マーリン|梅林}}，就我自己的死而言——当我死期来临时，我相信上帝会赐我恩典，让我以全然欢喜的心迎接终点；因为，我的命运在这一点上，确实与任何其他由女人所生的人并无不同。但关于这位幼子的事，若你的{{special:予言|预言}}属实，那么他的危险便非常大，依你所劝，把他带到某个安全的避难之处是明智之举。因此，我请你依你的意思办理此事，并请谨记在心：这孩子是我留给这片土地最珍贵的遗产。”", "ko": "멀린이 이렇게 말을 마치자, 우서 펜드래건은 매우 굳건한 얼굴로 이렇게 대답했다. “멀린, 내 죽음에 관해서라면—죽을 때가 오면 하느님께서 내게 온전히 즐거운 마음으로 끝을 맞을 은총을 주시리라 믿는다. 참으로 이 점에서 내 운명은 여자에게서 태어난 다른 어떤 사람과도 다르지 않으니까. 그러나 이 어린아이에 관해서라면, 그대의 예언이 참이라면 그 위험은 매우 크고, 그대가 권하는 대로 안전한 피난처로 데려가는 것이 좋겠다. 그러니 이 일은 그대의 뜻대로 행하라. 다만 이 아이가 내가 이 땅에 남길 가장 귀중한 유산임을 마음에 새기도록 하라.”", "ko_tagged": "{{person:マーリン|멀린}}이 이렇게 말을 마치자, {{person:ユーサー|우서 펜드래건}}은 매우 굳건한 얼굴로 이렇게 대답했다. “{{person:マーリン|멀린}}, 내 죽음에 관해서라면—죽을 때가 오면 하느님께서 내게 온전히 즐거운 마음으로 끝을 맞을 은총을 주시리라 믿는다. 참으로 이 점에서 내 운명은 여자에게서 태어난 다른 어떤 사람과도 다르지 않으니까. 그러나 이 어린아이에 관해서라면, 그대의 {{special:予言|예언}}이 참이라면 그 위험은 매우 크고, 그대가 권하는 대로 안전한 피난처로 데려가는 것이 좋겠다. 그러니 이 일은 그대의 뜻대로 행하라. 다만 이 아이가 내가 이 땅에 남길 가장 귀중한 유산임을 마음에 새기도록 하라.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p5_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 5, "type": "本文", "raw_text": "All this, as was said, Uther-Pendragon spake with great calmness and equanimity of spirit. And Merlin did as he had advised, and he and Sir Ulfius conveyed the child away by night, and no one but they wist whither the babe had been taken. And shortly afterward Uther-Pendragon was seized with the sickness as Merlin had foretold, and he died exactly as Merlin had feared that he would die; wherefore it was very well that the child had been taken to a place of safety.", "translation": "これらすべてを、先に述べたとおり、ユーサー・ペンドラゴンは大いなる平静と心の落ち着きをもって語った。マーリンは自らの勧めたとおりに事を運び、ウルフィアス卿とともに夜陰に乗じて幼子を連れ去った。赤子がどこへ連れて行かれたのかを知る者は、二人のほかには誰もいなかった。それからまもなく、ユーサー・ペンドラゴンはマーリンの予告したとおり病に倒れ、マーリンが恐れていたとおりの死に方で世を去った。それゆえ、子が安全な場所へ移されていたのは実に幸いであった。", "raw_tagged": "All this, as was said, {{person:ユーサー|Uther-Pendragon}} spake with great calmness and equanimity of spirit. And {{person:マーリン|Merlin}} did as he had advised, and he and Sir {{person:ウルフィアス|Ulfius}} conveyed the child away by night, and no one but they wist whither the babe had been taken. And shortly afterward {{person:ユーサー|Uther-Pendragon}} was seized with the sickness as {{person:マーリン|Merlin}} had foretold, and he died exactly as {{person:マーリン|Merlin}} had feared that he would die; wherefore it was very well that the child had been taken to a place of safety.", "translation_tagged": "これらすべてを、先に述べたとおり、{{person:ユーサー|ユーサー・ペンドラゴン}}は大いなる平静と心の落ち着きをもって語った。{{person:マーリン|マーリン}}は自らの勧めたとおりに事を運び、{{person:ウルフィアス|ウルフィアス}}卿とともに夜陰に乗じて幼子を連れ去った。赤子がどこへ連れて行かれたのかを知る者は、二人のほかには誰もいなかった。それからまもなく、{{person:ユーサー|ユーサー・ペンドラゴン}}は{{person:マーリン|マーリン}}の予告したとおり病に倒れ、{{person:マーリン|マーリン}}が恐れていたとおりの死に方で世を去った。それゆえ、子が安全な場所へ移されていたのは実に幸いであった。", "persons": "ユーサー,マーリン,ウルフィアス", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "如前所述，烏瑟·潘德拉剛說這一切時，態度十分平靜，心境安然。梅林依照自己的建議行事，與烏爾菲亞斯爵士趁夜把孩子帶走，除了他們兩人之外，沒有人知道嬰孩被帶到了哪裡。不久之後，烏瑟·潘德拉剛果然如梅林所預言的那樣染上了疾病，並且恰如梅林所擔憂的那樣死去；因此，孩子已被送往安全之處，實在是萬幸。", "zh_tw_tagged": "如前所述，{{person:ユーサー|烏瑟·潘德拉剛}}說這一切時，態度十分平靜，心境安然。{{person:マーリン|梅林}}依照自己的建議行事，與{{person:ウルフィアス|烏爾菲亞斯}}爵士趁夜把孩子帶走，除了他們兩人之外，沒有人知道嬰孩被帶到了哪裡。不久之後，{{person:ユーサー|烏瑟·潘德拉剛}}果然如{{person:マーリン|梅林}}所預言的那樣染上了疾病，並且恰如{{person:マーリン|梅林}}所擔憂的那樣死去；因此，孩子已被送往安全之處，實在是萬幸。", "zh_cn": "如前所述，乌瑟·潘德拉刚说这一切时，态度十分平静，心境安然。梅林依照自己的建议行事，与乌尔菲亚斯爵士趁夜把孩子带走，除了他们两人之外，没有人知道婴孩被带到了哪里。不久之后，乌瑟·潘德拉刚果然如梅林所预言的那样染上了疾病，并且恰如梅林所担忧的那样死去；因此，孩子已被送往安全之处，实在是万幸。", "zh_cn_tagged": "如前所述，{{person:ユーサー|乌瑟·潘德拉刚}}说这一切时，态度十分平静，心境安然。{{person:マーリン|梅林}}依照自己的建议行事，与{{person:ウルフィアス|乌尔菲亚斯}}爵士趁夜把孩子带走，除了他们两人之外，没有人知道婴孩被带到了哪里。不久之后，{{person:ユーサー|乌瑟·潘德拉刚}}果然如{{person:マーリン|梅林}}所预言的那样染上了疾病，并且恰如{{person:マーリン|梅林}}所担忧的那样死去；因此，孩子已被送往安全之处，实在是万幸。", "ko": "앞서 말한 대로, 우서 펜드래건은 이 모든 말을 대단히 차분하고 평온한 마음으로 했다. 멀린은 자신이 권한 대로 일을 처리하여 울피우스 경과 함께 밤중에 아이를 데리고 떠났고, 아기가 어디로 옮겨졌는지는 그 둘 말고는 아무도 알지 못했다. 얼마 지나지 않아 우서 펜드래건은 멀린이 예고한 대로 병에 걸렸고, 멀린이 걱정한 바로 그대로 세상을 떠났다. 그러므로 아이를 안전한 곳으로 옮겨 둔 것은 참으로 다행한 일이었다.", "ko_tagged": "앞서 말한 대로, {{person:ユーサー|우서 펜드래건}}은 이 모든 말을 대단히 차분하고 평온한 마음으로 했다. {{person:マーリン|멀린}}은 자신이 권한 대로 일을 처리하여 {{person:ウルフィアス|울피우스}} 경과 함께 밤중에 아이를 데리고 떠났고, 아기가 어디로 옮겨졌는지는 그 둘 말고는 아무도 알지 못했다. 얼마 지나지 않아 {{person:ユーサー|우서 펜드래건}}은 {{person:マーリン|멀린}}이 예고한 대로 병에 걸렸고, {{person:マーリン|멀린}}이 걱정한 바로 그대로 세상을 떠났다. 그러므로 아이를 안전한 곳으로 옮겨 둔 것은 참으로 다행한 일이었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p6_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 6, "type": "本文", "raw_text": "And after Uther-Pendragon had departed from this life, it was like-wise as Merlin had feared, for all the realm fell into great disorder. For each lesser king contended against his fellow for overlordship, and wicked knights and barons harried the highways as they listed and there levied toll with great cruelty upon helpless wayfarers. For some such travellers they took prisoners and held for ransom, whiles others they slew because they had no ransom to pay. So it was a very common sight to see a dead man lying by the roadside, if you should venture to make a journey upon some business or other. Thus it befell that, after awhile, all that dolorous land groaned with the trouble that lay upon it.", "translation": "ユーサー・ペンドラゴンがこの世を去ると、これもまたマーリンの恐れたとおり、全土が大いなる混乱に陥った。小王たちはそれぞれ互いに覇権を争い、邪悪な騎士や男爵たちは思うがままに街道を荒らし回り、そこで無力な旅人から容赦なく通行料を取り立てた。そうした旅人の中には、捕らえて身代金目当てに拘束する者もあれば、払う身代金のない者は殺してしまう場合もあった。ゆえに、何らかの用向きで旅に出ようものなら、道端に倒れた死体を見かけるのはごくありふれた光景であった。こうして、しばらくののち、その悲しむべき国土はのしかかる苦難にうめいた。", "raw_tagged": "And after {{person:ユーサー|Uther-Pendragon}} had departed from this life, it was like-wise as {{person:マーリン|Merlin}} had feared, for all the realm fell into great disorder. For each lesser {{office:王|king}} contended against his fellow for overlordship, and wicked {{office:騎士|knights}} and {{office:男爵|barons}} harried the highways as they listed and there levied toll with great cruelty upon helpless wayfarers. For some such travellers they took prisoners and held for ransom, whiles others they slew because they had no ransom to pay. So it was a very common sight to see a dead man lying by the roadside, if you should venture to make a journey upon some business or other. Thus it befell that, after awhile, all that dolorous land groaned with the trouble that lay upon it.", "translation_tagged": "{{person:ユーサー|ユーサー・ペンドラゴン}}がこの世を去ると、これもまた{{person:マーリン|マーリン}}の恐れたとおり、全土が大いなる混乱に陥った。{{office:王|小王}}たちはそれぞれ互いに覇権を争い、邪悪な{{office:騎士|騎士}}や{{office:男爵|男爵}}たちは思うがままに街道を荒らし回り、そこで無力な旅人から容赦なく通行料を取り立てた。そうした旅人の中には、捕らえて身代金目当てに拘束する者もあれば、払う身代金のない者は殺してしまう場合もあった。ゆえに、何らかの用向きで旅に出ようものなら、道端に倒れた死体を見かけるのはごくありふれた光景であった。こうして、しばらくののち、その悲しむべき国土はのしかかる苦難にうめいた。", "persons": "ユーサー,マーリン", "places": "", "offices": "王,騎士,男爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "烏瑟·潘德拉剛離世之後，一如梅林所擔憂的，整個王國陷入極大的混亂。各個小國王彼此爭奪霸權，邪惡的騎士與男爵隨心所欲地劫掠道路，並在那裡殘酷地向無助的旅人強收通行稅。有些旅人被他們抓去囚禁勒索贖金，另一些人因付不出贖金而被殺害。因此，若你為了某件事冒險出門旅行，路邊躺著死者是十分常見的景象。就這樣，過了一段時間，整片悲慘的土地都在重壓之下呻吟。", "zh_tw_tagged": "{{person:ユーサー|烏瑟·潘德拉剛}}離世之後，一如{{person:マーリン|梅林}}所擔憂的，整個王國陷入極大的混亂。各個{{office:王|小國王}}彼此爭奪霸權，邪惡的{{office:騎士|騎士}}與{{office:男爵|男爵}}隨心所欲地劫掠道路，並在那裡殘酷地向無助的旅人強收通行稅。有些旅人被他們抓去囚禁勒索贖金，另一些人因付不出贖金而被殺害。因此，若你為了某件事冒險出門旅行，路邊躺著死者是十分常見的景象。就這樣，過了一段時間，整片悲慘的土地都在重壓之下呻吟。", "zh_cn": "乌瑟·潘德拉刚离世之后，一如梅林所担忧的，整个王国陷入极大的混乱。各个小国王彼此争夺霸权，邪恶的骑士与男爵随心所欲地劫掠道路，并在那里残酷地向无助的旅人强收通行税。有些旅人被他们抓去囚禁勒索赎金，另一些人因付不出赎金而被杀害。因此，若你为了某件事冒险出门旅行，路边躺着死者是十分常见的景象。就这样，过了一段时间，整片悲惨的土地都在重压之下呻吟。", "zh_cn_tagged": "{{person:ユーサー|乌瑟·潘德拉刚}}离世之后，一如{{person:マーリン|梅林}}所担忧的，整个王国陷入极大的混乱。各个{{office:王|小国王}}彼此争夺霸权，邪恶的{{office:騎士|骑士}}与{{office:男爵|男爵}}随心所欲地劫掠道路，并在那里残酷地向无助的旅人强收通行税。有些旅人被他们抓去囚禁勒索赎金，另一些人因付不出赎金而被杀害。因此，若你为了某件事冒险出门旅行，路边躺着死者是十分常见的景象。就这样，过了一段时间，整片悲惨的土地都在重压之下呻吟。", "ko": "우서 펜드래건이 세상을 떠난 뒤, 이 역시 멀린이 걱정한 대로 온 왕국이 크나큰 혼란에 빠졌다. 작은 왕들은 저마다 서로 패권을 다투었고, 사악한 기사들과 남작들은 제멋대로 길목을 약탈하며 힘없는 나그네들에게 잔혹하게 통행세를 거두었다. 어떤 나그네는 붙잡아 몸값을 받으려고 가두었고, 몸값을 낼 길이 없는 다른 이들은 죽여 버렸다. 그래서 무슨 볼일로든 길을 나서 보면 길가에 죽은 사람이 누워 있는 광경은 아주 흔했다. 그리하여 얼마 지나지 않아 그 비통한 땅은 짓누르는 환난으로 신음하게 되었다.", "ko_tagged": "{{person:ユーサー|우서 펜드래건}}이 세상을 떠난 뒤, 이 역시 {{person:マーリン|멀린}}이 걱정한 대로 온 왕국이 크나큰 혼란에 빠졌다. {{office:王|작은 왕}}들은 저마다 서로 패권을 다투었고, 사악한 {{office:騎士|기사}}들과 {{office:男爵|남작}}들은 제멋대로 길목을 약탈하며 힘없는 나그네들에게 잔혹하게 통행세를 거두었다. 어떤 나그네는 붙잡아 몸값을 받으려고 가두었고, 몸값을 낼 길이 없는 다른 이들은 죽여 버렸다. 그래서 무슨 볼일로든 길을 나서 보면 길가에 죽은 사람이 누워 있는 광경은 아주 흔했다. 그리하여 얼마 지나지 않아 그 비통한 땅은 짓누르는 환난으로 신음하게 되었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p7_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 7, "type": "本文", "raw_text": "Thus there passed nearly eighteen years in such great affliction, and then one day the Archbishop of Canterbury summoned Merlin to him and bespake him in this wise: “Merlin, men say that thou art the wisest man in all the world. Canst thou not find some means to heal the distractions of this woeful realm? Bend thou thy wisdom to this matter and choose thou a king who shall be a fit overlord for us, so that we may enjoy happiness of life once more as we did in the days of Uther-Pendragon.”", "translation": "こうして十八年近くもの間、大いなる苦難のうちに歳月が過ぎ、ある日、カンタベリー大司教がマーリンを呼び寄せて、こう語りかけた。「マーリンよ、人々はそなたを世界一の賢者と言っている。この嘆かわしい王国の混乱を癒す手立てを、何か見つけられないだろうか。そなたの知恵をこの件に傾け、我らにふさわしい覇王となる王を選んでくれ。そうすれば我らは、ユーサー・ペンドラゴンの時代のように、再び幸福な暮らしを享受できよう。」", "raw_tagged": "Thus there passed nearly eighteen years in such great affliction, and then one day the {{office:大司教|Archbishop}} of {{place:カンタベリー|Canterbury}} summoned {{person:マーリン|Merlin}} to him and bespake him in this wise: “{{person:マーリン|Merlin}}, men say that thou art the wisest man in all the world. Canst thou not find some means to heal the distractions of this woeful realm? Bend thou thy wisdom to this matter and choose thou a {{office:王|king}} who shall be a fit overlord for us, so that we may enjoy happiness of life once more as we did in the days of {{person:ユーサー|Uther-Pendragon}}.”", "translation_tagged": "こうして十八年近くもの間、大いなる苦難のうちに歳月が過ぎ、ある日、{{place:カンタベリー|カンタベリー}}{{office:大司教|大司教}}が{{person:マーリン|マーリン}}を呼び寄せて、こう語りかけた。「{{person:マーリン|マーリン}}よ、人々はそなたを世界一の賢者と言っている。この嘆かわしい王国の混乱を癒す手立てを、何か見つけられないだろうか。そなたの知恵をこの件に傾け、我らにふさわしい覇王となる{{office:王|王}}を選んでくれ。そうすれば我らは、{{person:ユーサー|ユーサー・ペンドラゴン}}の時代のように、再び幸福な暮らしを享受できよう。」", "persons": "ユーサー,マーリン", "places": "カンタベリー", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "就這樣，近十八年在極大的苦難中過去，然後有一天，坎特伯里大主教把梅林召到面前，對他說：「梅林，世人說你是天下最有智慧的人。你能否想出辦法，治癒這個悲慘王國的紛亂？請把你的智慧用在這件事上，為我們選出一位適合作為我們霸主的國王，使我們能像烏瑟·潘德拉剛的時代那樣，再次享有幸福的生活。」", "zh_tw_tagged": "就這樣，近十八年在極大的苦難中過去，然後有一天，{{place:カンタベリー|坎特伯里}}{{office:大司教|大主教}}把{{person:マーリン|梅林}}召到面前，對他說：「{{person:マーリン|梅林}}，世人說你是天下最有智慧的人。你能否想出辦法，治癒這個悲慘王國的紛亂？請把你的智慧用在這件事上，為我們選出一位適合作為我們霸主的{{office:王|國王}}，使我們能像{{person:ユーサー|烏瑟·潘德拉剛}}的時代那樣，再次享有幸福的生活。」", "zh_cn": "就这样，近十八年在极大的苦难中过去，然后有一天，坎特伯雷大主教把梅林召到面前，对他说：“梅林，世人说你是天下最有智慧的人。你能否想出办法，治愈这个悲惨王国的纷乱？请把你的智慧用在这件事上，为我们选出一位适合作为我们霸主的国王，使我们能像乌瑟·潘德拉刚的时代那样，再次享有幸福的生活。”", "zh_cn_tagged": "就这样，近十八年在极大的苦难中过去，然后有一天，{{place:カンタベリー|坎特伯雷}}{{office:大司教|大主教}}把{{person:マーリン|梅林}}召到面前，对他说：“{{person:マーリン|梅林}}，世人说你是天下最有智慧的人。你能否想出办法，治愈这个悲惨王国的纷乱？请把你的智慧用在这件事上，为我们选出一位适合作为我们霸主的{{office:王|国王}}，使我们能像{{person:ユーサー|乌瑟·潘德拉刚}}的时代那样，再次享有幸福的生活。”", "ko": "이렇게 거의 십팔 년이 크나큰 고난 속에 흘러갔고, 어느 날 캔터베리 대주교가 멀린을 불러 이렇게 말했다. “멀린, 사람들은 그대가 온 세상에서 가장 지혜로운 사람이라고 하오. 이 비통한 왕국의 혼란을 치유할 방도를 찾을 수 없겠소? 그대의 지혜를 이 일에 기울여, 우리에게 걸맞은 패왕이 될 왕을 골라 주시오. 그리하여 우리가 우서 펜드래건의 시대처럼 다시 행복한 삶을 누릴 수 있게 해 주시오.”", "ko_tagged": "이렇게 거의 십팔 년이 크나큰 고난 속에 흘러갔고, 어느 날 {{place:カンタベリー|캔터베리}} {{office:大司教|대주교}}가 {{person:マーリン|멀린}}을 불러 이렇게 말했다. “{{person:マーリン|멀린}}, 사람들은 그대가 온 세상에서 가장 지혜로운 사람이라고 하오. 이 비통한 왕국의 혼란을 치유할 방도를 찾을 수 없겠소? 그대의 지혜를 이 일에 기울여, 우리에게 걸맞은 패왕이 될 {{office:王|왕}}을 골라 주시오. 그리하여 우리가 {{person:ユーサー|우서 펜드래건}}의 시대처럼 다시 행복한 삶을 누릴 수 있게 해 주시오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p8_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 8, "type": "本文", "raw_text": "Then Merlin lifted up his countenance upon the Archbishop, and spake in this wise: “My lord, the spirit of prophecy that lieth upon me sometimes moveth me now to say that I do perceive that this country is soon to have a king who shall be wiser and greater and more worthy of praise than was even Uther-Pendragon. And he shall bring order and peace where is now disorder and war. Moreover, I may tell you that this King shall be of Uther-Pendragon's own full blood-royal.”", "translation": "するとマーリンは大司教に顔を向け、こう語った。「我が主よ、時折私に宿る予言の霊が、今こう告げるのです。この国はまもなく、ユーサー・ペンドラゴンその人よりもなお賢く、偉大で、称賛に値する王を戴くことになると。その王は、今は無秩序と戦のあるところに、秩序と平和をもたらすでしょう。さらに申し上げておきますが、この王はユーサー・ペンドラゴン自身の、まじりけのない王家の血を引く者です。」", "raw_tagged": "Then {{person:マーリン|Merlin}} lifted up his countenance upon the {{office:大司教|Archbishop}}, and spake in this wise: “My lord, the spirit of {{special:予言|prophecy}} that lieth upon me sometimes moveth me now to say that I do perceive that this country is soon to have a {{office:王|king}} who shall be wiser and greater and more worthy of praise than was even {{person:ユーサー|Uther-Pendragon}}. And he shall bring order and peace where is now disorder and war. Moreover, I may tell you that this {{office:王|King}} shall be of {{person:ユーサー|Uther-Pendragon}}'s own full blood-royal.”", "translation_tagged": "するとマーリンは大司教に顔を向け、こう語った。「我が主よ、時折私に宿る{{special:予言|予言}}の霊が、今こう告げるのです。この国はまもなく、{{person:ユーサー|ユーサー・ペンドラゴン}}その人よりもなお賢く、偉大で、称賛に値する{{office:王|王}}を戴くことになると。その王は、今は無秩序と戦のあるところに、秩序と平和をもたらすでしょう。さらに申し上げておきますが、この{{office:王|王}}は{{person:ユーサー|ユーサー・ペンドラゴン}}自身の、まじりけのない王家の血を引く者です。」", "persons": "ユーサー,マーリン", "places": "", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "於是梅林抬起臉看著大主教，這樣說道：「我的大人，有時降臨在我身上的預言之靈，此刻促使我說：我看到這個國家不久將迎來一位國王，他比烏瑟·潘德拉剛本人更有智慧、更偉大、更值得稱頌。他將在如今混亂與戰爭之處帶來秩序與和平。此外我可以告訴您，這位國王將是烏瑟·潘德拉剛自己純正的王室血脈。」", "zh_tw_tagged": "於是{{person:マーリン|梅林}}抬起臉看著{{office:大司教|大主教}}，這樣說道：「我的大人，有時降臨在我身上的{{special:予言|預言}}之靈，此刻促使我說：我看到這個國家不久將迎來一位{{office:王|國王}}，他比{{person:ユーサー|烏瑟·潘德拉剛}}本人更有智慧、更偉大、更值得稱頌。他將在如今混亂與戰爭之處帶來秩序與和平。此外我可以告訴您，這位{{office:王|國王}}將是{{person:ユーサー|烏瑟·潘德拉剛}}自己純正的王室血脈。」", "zh_cn": "于是梅林抬起脸看着大主教，这样说道：“我的大人，有时降临在我身上的预言之灵，此刻促使我说：我看到这个国家不久将迎来一位国王，他比乌瑟·潘德拉刚本人更有智慧、更伟大、更值得称颂。他将在如今混乱与战争之处带来秩序与和平。此外我可以告诉您，这位国王将是乌瑟·潘德拉刚自己纯正的王室血脉。”", "zh_cn_tagged": "于是{{person:マーリン|梅林}}抬起脸看着{{office:大司教|大主教}}，这样说道：“我的大人，有时降临在我身上的{{special:予言|预言}}之灵，此刻促使我说：我看到这个国家不久将迎来一位{{office:王|国王}}，他比{{person:ユーサー|乌瑟·潘德拉刚}}本人更有智慧、更伟大、更值得称颂。他将在如今混乱与战争之处带来秩序与和平。此外我可以告诉您，这位{{office:王|国王}}将是{{person:ユーサー|乌瑟·潘德拉刚}}自己纯正的王室血脉。”", "ko": "그러자 멀린은 대주교에게 얼굴을 들어 이렇게 말했다. “나의 주교님, 이따금 제게 내리는 예언의 영이 지금 이렇게 말하라고 재촉합니다. 이 나라는 머지않아 우서 펜드래건보다도 더 지혜롭고 위대하며 칭송받을 만한 왕을 맞이하게 될 것이라고요. 그는 지금 무질서와 전쟁이 있는 곳에 질서와 평화를 가져올 것입니다. 또한 말씀드리자면, 이 왕은 우서 펜드래건 자신의 순수한 왕가의 혈통을 이은 자입니다.”", "ko_tagged": "그러자 {{person:マーリン|멀린}}은 {{office:大司教|대주교}}에게 얼굴을 들어 이렇게 말했다. “나의 주교님, 이따금 제게 내리는 {{special:予言|예언}}의 영이 지금 이렇게 말하라고 재촉합니다. 이 나라는 머지않아 {{person:ユーサー|우서 펜드래건}}보다도 더 지혜롭고 위대하며 칭송받을 만한 {{office:王|왕}}을 맞이하게 될 것이라고요. 그는 지금 무질서와 전쟁이 있는 곳에 질서와 평화를 가져올 것입니다. 또한 말씀드리자면, 이 {{office:王|왕}}은 {{person:ユーサー|우서 펜드래건}} 자신의 순수한 왕가의 혈통을 이은 자입니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p9_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 9, "type": "本文", "raw_text": "To this the Archbishop said: “What thou tellest me, Merlin, is a wonderfully strange thing. But in this spirit of prophecy canst thou not foretell when this King is to come? And canst thou tell how we shall know him when he appeareth amongst us? For many lesser kings there are who would fain be overlord of this land, and many such there are who deem themselves fit to rule over all the others. How then shall we know the real King from those who may proclaim themselves to be the rightful king?”", "translation": "これに大司教は言った。「そなたが語ることは、マーリンよ、まことに奇異なことだ。だが、その予言の霊によって、この王がいつ現れるかを予言することはできぬのか？ そしてその者が我らの前に姿を現したとき、どのようにしてその者と見分ければよいか教えてくれぬか？ この国には、みずから覇王たらんと欲する小王たちが数多くおり、他のすべての者を支配するにふさわしいと自惚れる者もまた数多いのだ。ならば、正当な王を自称する者たちの中から、真の王をどうやって見分ければよいというのか？」", "raw_tagged": "To this the {{office:大司教|Archbishop}} said: “What thou tellest me, {{person:マーリン|Merlin}}, is a wonderfully strange thing. But in this spirit of {{special:予言|prophecy}} canst thou not foretell when this {{office:王|King}} is to come? And canst thou tell how we shall know him when he appeareth amongst us? For many lesser {{office:王|kings}} there are who would fain be overlord of this land, and many such there are who deem themselves fit to rule over all the others. How then shall we know the real {{office:王|King}} from those who may proclaim themselves to be the rightful {{office:王|king}}?”", "translation_tagged": "これに{{office:大司教|大司教}}は言った。「そなたが語ることは、{{person:マーリン|マーリン}}よ、まことに奇異なことだ。だが、その{{special:予言|予言}}の霊によって、この{{office:王|王}}がいつ現れるかを予言することはできぬのか？ そしてその者が我らの前に姿を現したとき、どのようにしてその者と見分ければよいか教えてくれぬか？ この国には、みずから覇王たらんと欲する{{office:王|小王}}たちが数多くおり、他のすべての者を支配するにふさわしいと自惚れる者もまた数多いのだ。ならば、正当な{{office:王|王}}を自称する者たちの中から、真の{{office:王|王}}をどうやって見分ければよいというのか？」", "persons": "マーリン", "places": "", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "對此大主教說道：「你告訴我的事，梅林，實在是一件極其奇異的事。但在這預言之靈中，你難道無法預言這位國王何時到來嗎？你能否告訴我們，當他出現在我們之中時，我們該如何認出他？因為有許多小國王都渴望成為這片土地的霸主，也有許多人自認為有資格統治所有人。那麼，我們該如何從那些自稱是合法國王的人之中，辨認出真正的國王呢？」", "zh_tw_tagged": "對此{{office:大司教|大主教}}說道：「你告訴我的事，{{person:マーリン|梅林}}，實在是一件極其奇異的事。但在這{{special:予言|預言}}之靈中，你難道無法預言這位{{office:王|國王}}何時到來嗎？你能否告訴我們，當他出現在我們之中時，我們該如何認出他？因為有許多{{office:王|小國王}}都渴望成為這片土地的霸主，也有許多人自認為有資格統治所有人。那麼，我們該如何從那些自稱是合法{{office:王|國王}}的人之中，辨認出真正的{{office:王|國王}}呢？」", "zh_cn": "对此大主教说道：“你告诉我的事，梅林，实在是一件极其奇异的事。但在这预言之灵中，你难道无法预言这位国王何时到来吗？你能否告诉我们，当他出现在我们之中时，我们该如何认出他？因为有许多小国王都渴望成为这片土地的霸主，也有许多人自认为有资格统治所有人。那么，我们该如何从那些自称是合法国王的人之中，辨认出真正的国王呢？”", "zh_cn_tagged": "对此{{office:大司教|大主教}}说道：“你告诉我的事，{{person:マーリン|梅林}}，实在是一件极其奇异的事。但在这{{special:予言|预言}}之灵中，你难道无法预言这位{{office:王|国王}}何时到来吗？你能否告诉我们，当他出现在我们之中时，我们该如何认出他？因为有许多{{office:王|小国王}}都渴望成为这片土地的霸主，也有许多人自认为有资格统治所有人。那么，我们该如何从那些自称是合法{{office:王|国王}}的人之中，辨认出真正的{{office:王|国王}}呢？”", "ko": "이에 대주교가 말했다. “그대가 내게 들려준 말은, 멀린, 참으로 기이한 일이오. 하지만 그 예언의 영으로 이 왕이 언제 오실지 예언할 수는 없겠소? 그리고 그분이 우리 가운데 나타나셨을 때 어떻게 알아볼 수 있는지 알려 줄 수 없겠소? 이 땅에는 스스로 패왕이 되고자 갈망하는 작은 왕들이 많고, 다른 모든 이를 다스릴 자격이 있다고 자처하는 자들도 많소. 그렇다면 스스로 정당한 왕이라 칭하는 자들 가운데서 어떻게 진짜 왕을 알아볼 수 있겠소?”", "ko_tagged": "이에 {{office:大司教|대주교}}가 말했다. “그대가 내게 들려준 말은, {{person:マーリン|멀린}}, 참으로 기이한 일이오. 하지만 그 {{special:予言|예언}}의 영으로 이 {{office:王|왕}}이 언제 오실지 예언할 수는 없겠소? 그리고 그분이 우리 가운데 나타나셨을 때 어떻게 알아볼 수 있는지 알려 줄 수 없겠소? 이 땅에는 스스로 패왕이 되고자 갈망하는 {{office:王|작은 왕}}들이 많고, 다른 모든 이를 다스릴 자격이 있다고 자처하는 자들도 많소. 그렇다면 스스로 정당한 {{office:王|왕}}이라 칭하는 자들 가운데서 어떻게 진짜 {{office:王|왕}}을 알아볼 수 있겠소?”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p10_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 10, "type": "本文", "raw_text": "“My lord Archbishop,” quoth Merlin, “if I have thy leave for to exert my magic I shall set an adventure which, if any man achieve it, all the world shall straightway know that he is the rightful King and overlord of this realm.” And to this the Archbishop said, “Merlin, I bid thee do whatsoever may seem to thee to be right in this affair.” And Merlin said, “I will do so.”", "translation": "「我が主大司教よ」とマーリンは言った。「我が魔法を振るうお許しをいただけるならば、ある試練を設けましょう。もし誰かがそれを成し遂げたなら、その者こそがこの国の正当な王にして覇王であることを、全世界がただちに知ることになりましょう。」そしてこれに対し大司教は言った。「マーリンよ、この件においてそなたが正しいと思うことを何でも行うがよい。」そしてマーリンは言った。「そういたしましょう。」", "raw_tagged": "“My lord {{office:大司教|Archbishop}},” quoth {{person:マーリン|Merlin}}, “if I have thy leave for to exert my {{special:魔法|magic}} I shall set an adventure which, if any man achieve it, all the world shall straightway know that he is the rightful {{office:王|King}} and overlord of this realm.” And to this the {{office:大司教|Archbishop}} said, “{{person:マーリン|Merlin}}, I bid thee do whatsoever may seem to thee to be right in this affair.” And {{person:マーリン|Merlin}} said, “I will do so.”", "translation_tagged": "「我が主{{office:大司教|大司教}}よ」と{{person:マーリン|マーリン}}は言った。「我が{{special:魔法|魔法}}を振るうお許しをいただけるならば、ある試練を設けましょう。もし誰かがそれを成し遂げたなら、その者こそがこの国の正当な{{office:王|王}}にして覇王であることを、全世界がただちに知ることになりましょう。」そしてこれに対し{{office:大司教|大司教}}は言った。「{{person:マーリン|マーリン}}よ、この件においてそなたが正しいと思うことを何でも行うがよい。」そして{{person:マーリン|マーリン}}は言った。「そういたしましょう。」", "persons": "マーリン", "places": "", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "魔法", "is_enriched": true, "zh_tw": "「我的大人大主教，」梅林說道，「若承蒙您的允許讓我施展魔法，我將設下一個考驗。若有人能達成它，舉世都將立刻知曉他便是這個王國合法的國王與霸主。」對此大主教說道：「梅林，在這件事上，凡你認為合宜的，我都准許你放手去做。」梅林說：「我必遵命而行。」", "zh_tw_tagged": "「我的大人{{office:大司教|大主教}}，」{{person:マーリン|梅林}}說道，「若承蒙您的允許讓我施展{{special:魔法|魔法}}，我將設下一個考驗。若有人能達成它，舉世都將立刻知曉他便是這個王國合法的{{office:王|國王}}與霸主。」對此{{office:大司教|大主教}}說道：「{{person:マーリン|梅林}}，在這件事上，凡你認為合宜的，我都准許你放手去做。」{{person:マーリン|梅林}}說：「我必遵命而行。」", "zh_cn": "“我的大人大主教，”梅林说道，“若承蒙您的允许让我施展魔法，我将设下一个考验。若有人能达成它，举世都将立刻知晓他便是这个王国合法的国王与霸主。”对此大主教说道：“梅林，在这件事上，凡你认为合宜的，我都准许你放手去做。”梅林说：“我必遵命而行。”", "zh_cn_tagged": "“我的大人{{office:大司教|大主教}}，”{{person:マーリン|梅林}}说道，“若承蒙您的允许让我施展{{special:魔法|魔法}}，我将设下一个考验。若有人能达成它，举世都将立刻知晓他便是这个王国合法的{{office:王|国王}}与霸主。”对此{{office:大司教|大主教}}说道：“{{person:マーリン|梅林}}，在这件事上，凡你认为合宜的，我都准许你放手去做。”{{person:マーリン|梅林}}说：“我必遵命而行。”", "ko": "“나의 대주교 어른,” 멀린이 말했다. “제게 마법을 쓸 수 있도록 허락해 주신다면 한 가지 시험을 마련하겠습니다. 만일 어떤 이가 그것을 이루어 낸다면, 온 세상은 그가 곧 이 나라의 정당한 왕이자 패왕임을 즉시 알게 될 것입니다.” 그러자 대주교가 말했다. “멀린, 이 일에서 그대가 옳다고 여기는 바는 무엇이든 행하도록 하시오.” 그러자 멀린이 말했다. “그리하도록 하겠습니다.”", "ko_tagged": "“나의 {{office:大司教|대주교}} 어른,” {{person:マーリン|멀린}}이 말했다. “제게 {{special:魔法|마법}}을 쓸 수 있도록 허락해 주신다면 한 가지 시험을 마련하겠습니다. 만일 어떤 이가 그것을 이루어 낸다면, 온 세상은 그가 곧 이 나라의 정당한 {{office:王|왕}}이자 패왕임을 즉시 알게 될 것입니다.” 그러자 {{office:大司教|대주교}}가 말했다. “{{person:マーリン|멀린}}, 이 일에서 그대가 옳다고 여기는 바는 무엇이든 행하도록 하시오.” 그러자 {{person:マーリン|멀린}}이 말했다. “그리하도록 하겠습니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p11_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 11, "type": "本文", "raw_text": "So Merlin caused by magic that a huge marble stone, four square, should suddenly appear in an open place before the cathedral door. And upon this block of marble he caused it to be that there should stand an anvil and into the anvil he caused it that there should be thrust a great naked sword midway deep of the blade. And this sword was the most wonderful that any man had ever seen, for the blade was of blue steel and extraordinarily bright and glistering. And the hilt was of gold, chased and carved with marvellous cunning, and inlaid with a great number of precious stones, so that it shone with wonderful brightness in the sunlight. And about the sword were written these words in letters of gold:-", "translation": "こうしてマーリンは魔法によって、大聖堂の扉の前の広場に、四角く巨大な大理石の石塊を突如として出現させた。そしてこの大理石の上に金床を据え、その金床の中ほど深くへ、鞘のない一振りの大剣を突き立てさせた。その剣はかつて人が目にしたこともないほど見事なもので、刃は青い鋼で作られ、この上なく輝かしく煌めいていた。柄は黄金でできており、驚くべき妙技で彫刻が施され、無数の宝石が象嵌されていて、日の光を浴びて目も綾に輝いていた。そして剣の周りには、黄金の文字で次のように刻まれていた。――", "raw_tagged": "So {{person:マーリン|Merlin}} caused by {{special:魔法|magic}} that a huge marble stone, four square, should suddenly appear in an open place before the cathedral door. And upon this block of marble he caused it to be that there should stand an anvil and into the anvil he caused it that there should be thrust a great naked sword midway deep of the blade. And this sword was the most wonderful that any man had ever seen, for the blade was of blue steel and extraordinarily bright and glistering. And the hilt was of gold, chased and carved with marvellous cunning, and inlaid with a great number of precious stones, so that it shone with wonderful brightness in the sunlight. And about the sword were written these words in letters of gold:-", "translation_tagged": "こうして{{person:マーリン|マーリン}}は{{special:魔法|魔法}}によって、大聖堂の扉の前の広場に、四角く巨大な大理石の石塊を突如として出現させた。そしてこの大理石の上に金床を据え、その金床の中ほど深くへ、鞘のない一振りの大剣を突き立てさせた。その剣はかつて人が目にしたこともないほど見事なもので、刃は青い鋼で作られ、この上なく輝かしく煌めいていた。柄は黄金でできており、驚くべき妙技で彫刻が施され、無数の宝石が象嵌されていて、日の光を浴びて目も綾に輝いていた。そして剣の周りには、黄金の文字で次のように刻まれていた。――", "persons": "マーリン", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "魔法", "is_enriched": true, "zh_tw": "於是梅林施展魔法，讓一塊巨大的四方大理石突然出現在大教堂門前的空地上。在這塊大理石之上，他又立起一座鐵砧，並將一把出鞘的巨劍深深刺入鐵砧中達劍刃的一半。這把劍是世人所見過最奇妙的寶劍，劍刃為藍鋼所鑄，光彩奪目、極其晶亮。劍柄則是黃金製成，以不可思議的精湛技藝雕飾，並鑲嵌了無數珍貴的寶石，在陽光下閃耀著璀璨的光芒。劍身周圍還用金字寫著這樣一行話：——", "zh_tw_tagged": "於是{{person:マーリン|梅林}}施展{{special:魔法|魔法}}，讓一塊巨大的四方大理石突然出現在大教堂門前的空地上。在這塊大理石之上，他又立起一座鐵砧，並將一把出鞘的巨劍深深刺入鐵砧中達劍刃的一半。這把劍是世人所見過最奇妙的寶劍，劍刃為藍鋼所鑄，光彩奪目、極其晶亮。劍柄則是黃金製成，以不可思議的精湛技藝雕飾，並鑲嵌了無數珍貴的寶石，在陽光下閃耀著璀璨的光芒。劍身周圍還用金字寫著這樣一行話：——", "zh_cn": "于是梅林施展魔法，让一块巨大的四方大理石突然出现在大教堂门前的空地上。在这块大理石之上，他又立起一座铁砧，并将一把出鞘的巨剑深深刺入铁砧中达剑刃的一半。这把剑是世人所见过最奇妙的宝剑，剑刃为蓝钢所铸，光彩夺目、极其晶亮。剑柄则是黄金制成，以不可思议的精湛技艺雕饰，并镶嵌了无数珍贵的宝石，在阳光下闪耀着璀璨的光芒。剑身周围还用金字写着这样一行话：——", "zh_cn_tagged": "于是{{person:マーリン|梅林}}施展{{special:魔法|魔法}}，让一块巨大的四方大理石突然出现在大教堂门前的空地上。在这块大理石之上，他又立起一座铁砧，并将一把出鞘的巨剑深深刺入铁砧中达剑刃的一半。这把剑是世人所见过最奇妙的宝剑，剑刃为蓝钢所铸，光彩夺目、极其晶亮。剑柄则是黄金制成，以不可思议的精湛技艺雕饰，并镶嵌了无数珍贵的宝石，在阳光下闪耀着璀璨的光芒。剑身周围还用金字写着这样一行话：——", "ko": "그리하여 멀린은 마법을 부려 대성당 문 앞 광장에 거대하고 반듯한 사각형 대리석 바위를 홀연히 나타나게 했다. 그리고 그 대리석 위에 모루를 올려놓고, 그 모루 속에 칼집 없는 큰 검 한 자루를 칼날의 반쯤 깊이로 꽂아 넣었다. 그 검은 일찍이 사람이 본 적이 없을 만큼 경이로운 것으로, 칼날은 푸른 강철로 벼려져 눈부시게 번쩍였다. 자루는 황금으로 만들어져 놀라운 솜씨의 조각이 새겨져 있었고 수많은 보석이 촘촘히 박혀 있어 햇빛을 받으면 찬란한 빛을 발했다. 그리고 검 둘레에는 금빛 글씨로 다음과 같은 말이 적혀 있었다. ――", "ko_tagged": "그리하여 {{person:マーリン|멀린}}은 {{special:魔法|마법}}을 부려 대성당 문 앞 광장에 거대하고 반듯한 사각형 대리석 바위를 홀연히 나타나게 했다. 그리고 그 대리석 위에 모루를 올려놓고, 그 모루 속에 칼집 없는 큰 검 한 자루를 칼날의 반쯤 깊이로 꽂아 넣었다. 그 검은 일찍이 사람이 본 적이 없을 만큼 경이로운 것으로, 칼날은 푸른 강철로 벼려져 눈부시게 번쩍였다. 자루는 황금으로 만들어져 놀라운 솜씨의 조각이 새겨져 있었고 수많은 보석이 촘촘히 박혀 있어 햇빛을 받으면 찬란한 빛을 발했다. 그리고 검 둘레에는 금빛 글씨로 다음과 같은 말이 적혀 있었다. ――", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p12_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 12, "type": "本文", "raw_text": "“Whoso Pulleth Out this Sword from the AnvilThat same is Rightwise King- Born of England.”", "translation": "「この金床よりこの剣を引き抜く者、その者こそ生まれながらの正当なるイングランドの王なり。」", "raw_tagged": "“Whoso Pulleth Out this Sword from the Anvil That same is Rightwise {{office:王|King}}-Born of {{place:ブリテン島|England}}.”", "translation_tagged": "「この金床よりこの剣を引き抜く者、その者こそ生まれながらの正当なる{{place:ブリテン島|イングランド}}の{{office:王|王}}なり。」", "persons": "", "places": "ブリテン島", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「凡能自此鐵砧拔出此劍者，即為天生正統之英格蘭國王。」", "zh_tw_tagged": "「凡能自此鐵砧拔出此劍者，即為天生正統之{{place:ブリテン島|英格蘭}}{{office:王|國王}}。」", "zh_cn": "“凡能自此铁砧拔出此剑者，即为天生正统之英格兰国王。”", "zh_cn_tagged": "“凡能自此铁砧拔出此剑者，即为天生正统之{{place:ブリテン島|英格兰}}{{office:王|国王}}。”", "ko": "“이 모루에서 이 검을 뽑아내는 자, 그가 곧 태어나면서부터 정당한 잉글랜드의 왕이니라.”", "ko_tagged": "“이 모루에서 이 검을 뽑아내는 자, 그가 곧 태어나면서부터 정당한 {{place:ブリテン島|잉글랜드}}의 {{office:王|왕}}이니라.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p13_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 13, "type": "本文", "raw_text": "So a great many people came and gazed upon that sword and marvelled at it exceedingly, for its like had never before been beheld upon the earth.", "translation": "こうして大勢の人々が訪れてはその剣を見つめ、かつて地上で見たこともないその姿に、大いに驚嘆した。", "raw_tagged": "So a great many people came and gazed upon that sword and marvelled at it exceedingly, for its like had never before been beheld upon the earth.", "translation_tagged": "こうして大勢の人々が訪れてはその剣を見つめ、かつて地上で見たこともないその姿に、大いに驚嘆した。", "persons": "", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是許多人前來凝視那把劍，無不驚嘆萬分，因為世上從未有人見過如此奇觀。", "zh_tw_tagged": "於是許多人前來凝視那把劍，無不驚嘆萬分，因為世上從未有人見過如此奇觀。", "zh_cn": "于是许多人前来凝视那把剑，无不惊叹万分，因为世上从未有人见过如此奇观。", "zh_cn_tagged": "于是许多人前来凝视那把剑，无不惊叹万分，因为世上从未有人见过如此奇观。", "ko": "그리하여 수많은 사람들이 찾아와 그 검을 바라보았고, 일찍이 땅 위에서 본 적 없는 그 모습에 몹시 감탄했다.", "ko_tagged": "그리하여 수많은 사람들이 찾아와 그 검을 바라보았고, 일찍이 땅 위에서 본 적 없는 그 모습에 몹시 감탄했다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p14_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 14, "type": "本文", "raw_text": "Then, when Merlin had accomplished this miracle, he bade the Arch-bishop to call together all the chief people of that land upon Christmastide; and he bade the Archbishop to command that every man should make assay to draw out the sword, for that he who should succeed in drawing it forth out of the anvil should be rightwise King of Britain.", "translation": "こうしてマーリンがこの奇跡を成し遂げると、彼は大司教に、降誕祭の折に国の主だった人々をすべて招集するよう求めた。そして、金床から剣を引き抜くことに成功した者こそが正当なるブリテンの王となるがゆえに、すべての者に剣を引き抜く試みに挑ませよと大司教に命じさせた。", "raw_tagged": "Then, when {{person:マーリン|Merlin}} had accomplished this miracle, he bade the {{office:大司教|Archbishop}} to call together all the chief people of that land upon Christmastide; and he bade the {{office:大司教|Archbishop}} to command that every man should make assay to draw out the sword, for that he who should succeed in drawing it forth out of the anvil should be rightwise {{office:王|King}} of {{place:ブリテン島|Britain}}.", "translation_tagged": "こうして{{person:マーリン|マーリン}}がこの奇跡を成し遂げると、{{person:マーリン|彼}}は{{office:大司教|大司教}}に、降誕祭の折に国の主だった人々をすべて招集するよう求めた。そして、金床から剣を引き抜くことに成功した者こそが正当なる{{place:ブリテン島|ブリテン}}の{{office:王|王}}となるがゆえに、すべての者に剣を引き抜く試みに挑ませよと{{office:大司教|大司教}}に命じさせた。", "persons": "マーリン", "places": "ブリテン島", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "當梅林完成了這項奇蹟後，他便請大主教在聖誕節期召集該國的所有要人；並請大主教下令讓每個人都來嘗試拔出寶劍，因為凡能成功將其從鐵砧中拔出之人，便是正統的不列顛國王。", "zh_tw_tagged": "當{{person:マーリン|梅林}}完成了這項奇蹟後，{{person:マーリン|他}}便請{{office:大司教|大主教}}在聖誕節期召集該國的所有要人；並請{{office:大司教|大主教}}下令讓每個人都來嘗試拔出寶劍，因為凡能成功將其從鐵砧中拔出之人，便是正統的{{place:ブリテン島|不列顛}}{{office:王|國王}}。", "zh_cn": "当梅林完成了这项奇迹后，他便请大主教在圣诞节期召集该国的所有要人；并请大主教下令让每个人都来尝试拔出宝剑，因为凡能成功将其从铁砧中拔出之人，便是正统的不列颠国王。", "zh_cn_tagged": "当{{person:マーリン|梅林}}完成了这项奇迹后，{{person:マーリン|他}}便请{{office:大司教|大主教}}在圣诞节期召集该国的所有要人；并请{{office:大司教|大主教}}下令让每个人都来尝试拔出宝剑，因为凡能成功将其从铁砧中拔出之人，便是正统的{{place:ブリテン島|不列颠}}{{office:王|国王}}。", "ko": "멀린이 이 기적을 이룬 뒤, 그는 대주교에게 성탄절에 그 나라의 지도층 인사들을 모두 불러 모으라고 청했다. 그리고 모루에서 검을 뽑아내는 데 성공하는 자가 곧 정당한 브리튼의 왕이 될 것이므로, 모든 사람에게 검을 뽑는 시험에 도전하도록 명하라고 대주교에게 요청했다.", "ko_tagged": "{{person:マーリン|멀린}}이 이 기적을 이룬 뒤, {{person:マーリン|그}}는 {{office:大司教|대주교}}에게 성탄절에 그 나라의 지도층 인사들을 모두 불러 모으라고 청했다. 그리고 모루에서 검을 뽑아내는 데 성공하는 자가 곧 정당한 {{place:ブリテン島|브리튼}}의 {{office:王|왕}}이 될 것이므로, 모든 사람에게 검을 뽑는 시험에 도전하도록 명하라고 {{office:大司教|대주교}}에게 요청했다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p15_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 15, "type": "本文", "raw_text": "So the Archbishop did according as Merlin said; and this was the marvel of the marble stone and the anvil, of which same anyone may easily read for himself in that book written a very long while ago by Robert de Boron, which is called Le Roman de Merlin.", "translation": "そこで大司教はマーリンの言ったとおりに取り計らった。これこそが大理石と金床の奇跡であり、はるか昔にロベール・ド・ボロンによって著された『メルラン物語』と呼ばれる書物の中で、誰でも容易にその詳細を読むことができる。", "raw_tagged": "So the {{office:大司教|Archbishop}} did according as {{person:マーリン|Merlin}} said; and this was the marvel of the marble stone and the anvil, of which same anyone may easily read for himself in that book written a very long while ago by {{person:ロベール・ド・ボロン|Robert de Boron}}, which is called Le Roman de Merlin.", "translation_tagged": "そこで{{office:大司教|大司教}}は{{person:マーリン|マーリン}}の言ったとおりに取り計らった。これこそが大理石と金床の奇跡であり、はるか昔に{{person:ロベール・ド・ボロン|ロベール・ド・ボロン}}によって著された『メルラン物語』と呼ばれる書物の中で、誰でも容易にその詳細を読むことができる。", "persons": "マーリン,ロベール・ド・ボロン", "places": "", "offices": "大司教", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是大主教便照著梅林所說的去辦。這便是大理石與鐵砧的奇蹟，任何人都可以從很久以前由羅伯特·德·波隆所著、名為《梅林傳奇》的書中輕易讀到這件事。", "zh_tw_tagged": "於是{{office:大司教|大主教}}便照著{{person:マーリン|梅林}}所說的去辦。這便是大理石與鐵砧的奇蹟，任何人都可以從很久以前由{{person:ロベール・ド・ボロン|羅伯特·德·波隆}}所著、名為《梅林傳奇》的書中輕易讀到這件事。", "zh_cn": "于是大主教便照着梅林所说的去办。这便是大理石与铁砧的奇迹，任何人都可以从很久以前由罗伯特·德·波隆所著、名为《梅林传奇》的书中国轻易读到这件事。", "zh_cn_tagged": "于是{{office:大司教|大主教}}便照着{{person:マーリン|梅林}}所说的去办。这便是大理石与铁砧的奇迹，任何人都可以从很久以前由{{person:ロベール・ド・ボロン|罗伯特·德·波隆}}所著、名为《梅林传奇》的书中国轻易读到这件事。", "ko": "이에 대주교는 멀린의 말대로 행했다. 이것이 바로 대리석과 모루의 기적이며, 오래전 로베르 드 보롱이 쓴 『멀린 이야기』라는 책에서 누구나 손쉽게 읽어볼 수 있는 이야기이다.", "ko_tagged": "이에 {{office:大司教|대주교}}는 {{person:マーリン|멀린}}의 말대로 행했다. 이것이 바로 대리석과 모루의 기적이며, 오래전 {{person:ロベール・ド・ボロン|로베르 드 보롱}}이 쓴 『멀린 이야기』라는 책에서 누구나 손쉽게 읽어볼 수 있는 이야기이다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p16_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 16, "type": "本文", "raw_text": "Now when the mandate of the Lord Archbishop went forth, summoning all the chief people of the land to the assay of that miracle (for, indeed, it was a miracle to draw forth a sword-blade out of an anvil of solid iron), all the realm became immediately cast into a great ferment, so that each man asked his fellow, “Who shall draw forth that sword, and who shall be our King?” Some thought it would be King Lot and others thought it would be King Urien of Gore (these being the sons-in-law unto Uther-Pendragon); some thought that it would be King Leodegrance of Camiliard, and others that it would be King Ryence of North Wales; some thought it would be this king and others that it would be that king; for all the world was divided into different parties who thought according to their liking.", "translation": "主なる大司教の命が下り、その奇跡の試練（堅い鉄の金床から剣身を引き抜くなど、まさに奇跡であった）に国の主だった人々が召集されると、全土はたちまち大いなる騒然たる熱狂に包まれ、誰もが互いに問い合った。「いったい誰があの剣を抜き、誰が我らの王となるのか？」ある者はロット王だろうと考え、ある者はゴアのユリエンス王だろうと考えた（この二人はユーサー・ペンドラゴンの娘婿たちであった）。またある者はカミリアードのレオデグランス王だろうと考え、別の者は北ウェールズのリエンス王だろうと考えた。ある者はこの王、ある者はあの王と思い思いに推し量り、世を挙げてそれぞれの好みに応じた派閥に分かれたのである。", "raw_tagged": "Now when the mandate of the Lord {{office:大司教|Archbishop}} went forth, summoning all the chief people of the land to the assay of that miracle (for, indeed, it was a miracle to draw forth a sword-blade out of an anvil of solid iron), all the realm became immediately cast into a great ferment, so that each man asked his fellow, “Who shall draw forth that sword, and who shall be our {{office:王|King}}?” Some thought it would be {{office:王|King}} {{person:ロット|Lot}} and others thought it would be {{office:王|King}} {{person:ユリエンス|Urien}} of {{special:ゴア|Gore}} (these being the sons-in-law unto {{person:ユーサー|Uther-Pendragon}}); some thought that it would be {{office:王|King}} {{person:レオデグランス|Leodegrance}} of {{special:カミリアード|Camiliard}}, and others that it would be {{office:王|King}} {{person:リエンス|Ryence}} of North {{place:ブリテン島|Wales}}; some thought it would be this {{office:王|king}} and others that it would be that {{office:王|king}}; for all the world was divided into different parties who thought according to their liking.", "translation_tagged": "主なる{{office:大司教|大司教}}の命が下り、その奇跡の試練（堅い鉄の金床から剣身を引き抜くなど、まさに奇跡であった）に国の主だった人々が召集されると、全土はたちまち大いなる騒然たる熱狂に包まれ、誰もが互いに問い合った。「いったい誰があの剣を抜き、誰が我らの{{office:王|王}}となるのか？」ある者は{{person:ロット|ロット}}{{office:王|王}}だろうと考え、ある者は{{special:ゴア|ゴア}}の{{person:ユリエンス|ユリエンス}}{{office:王|王}}だろうと考えた（この二人は{{person:ユーサー|ユーサー・ペンドラゴン}}の娘婿たちであった）。またある者は{{special:カミリアード|カミリアード}}の{{person:レオデグランス|レオデグランス}}{{office:王|王}}だろうと考え、別の者は北{{place:ブリテン島|ウェールズ}}の{{person:リエンス|リエンス}}{{office:王|王}}だろうと考えた。ある者はこの{{office:王|王}}、ある者はあの{{office:王|王}}と思い思いに推し量り、世を挙げてそれぞれの好みに応じた派閥に分かれたのである。", "persons": "ユーサー,ロット,ユリエンス,レオデグランス,リエンス", "places": "ブリテン島", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "ゴア,カミリアード", "is_enriched": true, "zh_tw": "當主大主教的命令發布、召集該國全體要人前來接受奇蹟的考驗時（畢竟從堅硬的鐵砧中拔出劍刃確實是一項奇蹟），整個王國立刻陷入巨大的騷動之中，每個人都在互相詢問：「誰能拔出那把劍？誰將成為我們的國王？」有人認為會是洛特王，有人認為會是戈爾的尤里安斯王（這兩位都是烏瑟·潘德拉剛的女婿）；有人認為會是卡米利亞德的雷奧多格蘭王，另有人認為會是北威爾斯的雷恩斯王；有人猜是這位國王，有人猜是那位國王；舉世各按己意分成了不同的派別。", "zh_tw_tagged": "當主{{office:大司教|大主教}}的命令發布、召集該國全體要人前來接受奇蹟的考驗時（畢竟從堅硬的鐵砧中拔出劍刃確實是一項奇蹟），整個王國立刻陷入巨大的騷動之中，每個人都在互相詢問：「誰能拔出那把劍？誰將成為我們的{{office:王|國王}}？」有人認為會是{{person:ロット|洛特}}{{office:王|王}}，有人認為會是{{special:ゴア|戈爾}}的{{person:ユリエンス|尤里安斯}}{{office:王|王}}（這兩位都是{{person:ユーサー|烏瑟·潘德拉剛}}的女婿）；有人認為會是{{special:カミリアード|卡米利亞德}}的{{person:レオデグランス|雷奧多格蘭}}{{office:王|王}}，另有人認為會是北{{place:ブリテン島|威爾斯}}的{{person:リエンス|雷恩斯}}{{office:王|王}}；有人猜是這位{{office:王|國王}}，有人猜是那位{{office:王|國王}}；舉世各按己意分成了不同的派別。", "zh_cn": "当主大主教的命令发布、召集该国全体要人前来接受奇迹的考验时（毕竟从坚硬的铁砧中拔出剑刃确实是一项奇迹），整个王国立刻陷入巨大的骚动之中，每个人都在互相询问：“谁能拔出那把剑？谁将成为我们的国王？”有人认为会是洛特王，有人认为会是戈尔的尤里安斯王（这两位都是乌瑟·潘德拉刚的女婿）；有人认为会是卡米利亚德的雷奥多格兰王，另有人认为会是北威尔士的雷恩斯王；有人猜是这位国王，有人猜是那位国王；举世各按己意分成了不同的派别。", "zh_cn_tagged": "当主{{office:大司教|大主教}}的命令发布、召集该国全体要人前来接受奇迹的考验时（毕竟从坚硬的铁砧中拔出剑刃确实是一项奇迹），整个王国立刻陷入巨大的骚动之中，每个人都在互相询问：“谁能拔出那把剑？谁将成为我们的{{office:王|国王}}？”有人认为会是{{person:ロット|洛特}}{{office:王|王}}，有人认为会是{{special:ゴア|戈尔}}的{{person:ユリエンス|尤里安斯}}{{office:王|王}}（这两位都是{{person:ユーサー|乌瑟·潘德拉刚}}的女婿）；有人认为会是{{special:カミリアード|卡米利亚德}}的{{person:レオデグランス|雷奥多格兰}}{{office:王|王}}，另有人认为会是北{{place:ブリテン島|威尔士}}的{{person:リエンス|雷恩斯}}{{office:王|王}}；有人猜是这位{{office:王|国王}}，有人猜是那位{{office:王|国王}}；举世各按己意分成了不同的派别。", "ko": "주교이신 대주교의 명령이 내려져 그 기적의 시험(단단한 쇠로 된 모루에서 칼날을 뽑아내는 것은 참으로 기적이었기에)에 온 나라의 지도층 인사들이 소집되자, 온 왕국은 즉시 크나큰 소동에 휩싸였다. 사람마다 서로 묻기를 “누가 저 검을 뽑을 것인가, 그리고 누가 우리의 왕이 될 것인가?”라고 했다. 어떤 이는 로트 왕일 것이라 여겼고, 어떤 이는 고어의 유리엔스 왕일 것이라 여겼다(이들은 우서 펜드래건의 사위들이었다). 어떤 이는 카밀리아드의 레오데그란스 왕일 것이라 여겼고, 또 다른 이들은 북웨일스의 리엔스 왕일 것이라 여겼다. 어떤 이는 이 왕을, 어떤 이는 저 왕을 지목하며, 온 세상이 저마다 뜻에 따라 여러 파벌로 갈라졌다.", "ko_tagged": "주교이신 {{office:大司教|대주교}}의 명령이 내려져 그 기적의 시험(단단한 쇠로 된 모루에서 칼날을 뽑아내는 것은 참으로 기적이었기에)에 온 나라의 지도층 인사들이 소집되자, 온 왕국은 즉시 크나큰 소동에 휩싸였다. 사람마다 서로 묻기를 “누가 저 검을 뽑을 것인가, 그리고 누가 우리의 {{office:王|왕}}이 될 것인가?”라고 했다. 어떤 이는 {{person:ロット|로트}} {{office:王|왕}}일 것이라 여겼고, 어떤 이는 {{special:ゴア|고어}}의 {{person:ユリエンス|유리엔스}} {{office:王|왕}}일 것이라 여겼다(이들은 {{person:ユーサー|우서 펜드래건}}의 사위들이었다). 어떤 이는 {{special:カミリアード|카밀리아드}}의 {{person:レオデグランス|레오데그란스}} {{office:王|왕}}일 것이라 여겼고, 또 다른 이들은 북{{place:ブリテン島|웨일스}}의 {{person:リエンス|리엔스}} {{office:王|왕}}일 것이라 여겼다. 어떤 이는 이 {{office:王|왕}}을, 어떤 이는 저 {{office:王|왕}}을 지목하며, 온 세상이 저마다 뜻에 따라 여러 파벌로 갈라졌다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p17_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 17, "type": "本文", "raw_text": "Then, as Christmastide drew nigh, it presently appeared as though the entire world was wending its way to London Town, for the highways and the by-ways became filled with wayfarers - kings and lords and knights and ladies and esquires and pages and men-at-arms - all betaking their way whither the assay was to be made of that adventure of the sword and the anvil. Every inn and castle was filled so full of travellers that it was a marvel how so many folk could be contained within their compass, and everywhere were tents and pavilions pitched along the wayside for the accommodation of those who could not find shelter within doors.", "translation": "やがて降誕祭が近づくと、まるで全世界がロンドンの町へと向かっているかのようであった。大路も小路も旅人たち――王たちや領主たち、騎士たちや貴婦人たち、従者や小姓や兵士たち――で溢れかえり、誰もが剣と金床の試練に挑むべく足を運んでいた。どの宿屋も城も旅人で満員となり、よくぞこれほど多くの人々が収まるものだと驚かれるほどで、屋内に宿を見つけられぬ者たちのために、街道沿いのいたるところに天幕や天蓋が張られていた。", "raw_tagged": "Then, as Christmastide drew nigh, it presently appeared as though the entire world was wending its way to {{place:ロンドン|London}} Town, for the highways and the by-ways became filled with wayfarers - {{office:王|kings}} and lords and {{office:騎士|knights}} and ladies and esquires and pages and men-at-arms - all betaking their way whither the assay was to be made of that adventure of the sword and the anvil. Every inn and castle was filled so full of travellers that it was a marvel how so many folk could be contained within their compass, and everywhere were tents and pavilions pitched along the wayside for the accommodation of those who could not find shelter within doors.", "translation_tagged": "やがて降誕祭が近づくと、まるで全世界が{{place:ロンドン|ロンドン}}の町へと向かっているかのようであった。大路も小路も旅人たち――{{office:王|王}}たちや領主たち、{{office:騎士|騎士}}たちや貴婦人たち、従者や小姓や兵士たち――で溢れかえり、誰もが剣と金床の試練に挑むべく足を運んでいた。どの宿屋も城も旅人で満員となり、よくぞこれほど多くの人々が収まるものだと驚かれるほどで、屋内に宿を見つけられぬ者たちのために、街道沿いのいたるところに天幕や天蓋が張られていた。", "persons": "", "places": "ロンドン", "offices": "王,騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "隨後，隨著聖誕節期臨近，整個世界彷彿都在湧向倫敦城。大路與小徑上擠滿了行旅——國王、領主、騎士、貴婦、隨從、侍童與武士——所有人都在趕往那場劍與鐵砧試煉的舉行之地。每間客棧與城堡都住滿了旅人，令人驚異竟能容納下如此眾多的人，在道路兩旁也隨處搭滿了帳篷與營幕，供那些無法在屋內覓得棲身之處的人容身。", "zh_tw_tagged": "隨後，隨著聖誕節期臨近，整個世界彷彿都在湧向{{place:ロンドン|倫敦}}城。大路與小徑上擠滿了行旅——{{office:王|國王}}、領主、{{office:騎士|騎士}}、貴婦、隨從、侍童與武士——所有人都在趕往那場劍與鐵砧試煉的舉行之地。每間客棧與城堡都住滿了旅人，令人驚異竟能容納下如此眾多的人，在道路兩旁也隨處搭滿了帳篷與營幕，供那些無法在屋內覓得棲身之處的人容身。", "zh_cn": "随后，随着圣诞节期临近，整个世界仿佛都在涌向伦敦城。大路与小径上挤满了行旅——国王、领主、骑士、贵妇、随从、侍童与武士——所有人都在赶往那场剑与铁砧试炼的举行之地。每间客栈与城堡都住满了旅人，令人惊异竟能容纳下如此众多的人，在道路两旁也随处搭满了帐篷与营幕，供那些无法在屋内觅得栖身之处的人容身。", "zh_cn_tagged": "随后，随着圣诞节期临近，整个世界仿佛都在涌向{{place:ロンドン|伦敦}}城。大路与小径上挤满了行旅——{{office:王|国王}}、领主、{{office:騎士|骑士}}、贵妇、随从、侍童与武士——所有人都在赶往那场剑与铁砧试炼的举行之地。每间客栈与城堡都住满了旅人，令人惊异竟能容纳下如此众多的人，在道路两旁也随处搭满了帐篷与营幕，供那些无法在屋内觅得栖身之处的人容身。", "ko": "성탄절이 다가오자, 온 세상이 런던을 향해 나아가고 있는 듯 보였다. 큰길과 샛길은 길손들――왕들과 영주들, 기사들과 귀부인들, 종자와 시동들과 병사들――로 가득 차, 모두가 검과 모루의 시험이 치러질 곳으로 발걸음을 옮겼다. 모든 여관과 성채는 나그네들로 발 디딜 틈 없이 들어차 그 많은 인원을 어떻게 다 수용하는지 놀라울 지경이었고, 방을 구하지 못한 이들을 위해 길가 곳곳에 천막과 장막이 쳐졌다.", "ko_tagged": "성탄절이 다가오자, 온 세상이 {{place:ロンドン|런던}}을 향해 나아가고 있는 듯 보였다. 큰길과 샛길은 길손들――{{office:王|왕}}들과 영주들, {{office:騎士|기사}}들과 귀부인들, 종자와 시동들과 병사들――로 가득 차, 모두가 검과 모루의 시험이 치러질 곳으로 발걸음을 옮겼다. 모든 여관과 성채는 나그네들로 발 디딜 틈 없이 들어차 그 많은 인원을 어떻게 다 수용하는지 놀라울 지경이었고, 방을 구하지 못한 이들을 위해 길가 곳곳에 천막과 장막이 쳐졌다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p18_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 18, "type": "本文", "raw_text": "But when the Archbishop beheld the multitudes that were assembling, he said to Merlin, “Indeed, Merlin, it would be a very singular thing if among all these great kings and noble, honorable lords we should not find some one worthy of being the King of this realm.”", "translation": "しかし大司教は集まり来る群衆を目にすると、マーリンに言った。「まことに、マーリンよ、これほど多くの偉大な王たちや高貴で誉れある領主たちの中から、この国の王となるにふさわしい者が一人も見つからないとしたら、それこそ実に奇妙なことではないか。」", "raw_tagged": "But when the {{office:大司教|Archbishop}} beheld the multitudes that were assembling, he said to {{person:マーリン|Merlin}}, “Indeed, {{person:マーリン|Merlin}}, it would be a very singular thing if among all these great {{office:王|kings}} and noble, honorable lords we should not find some one worthy of being the {{office:王|King}} of this realm.”", "translation_tagged": "しかし{{office:大司教|大司教}}は集まり来る群衆を目にすると、{{person:マーリン|マーリン}}に言った。「まことに、{{person:マーリン|マーリン}}よ、これほど多くの偉大な{{office:王|王}}たちや高貴で誉れある領主たちの中から、この国の{{office:王|王}}となるにふさわしい者が一人も見つからないとしたら、それこそ実に奇妙なことではないか。」", "persons": "マーリン", "places": "", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "然而當大主教看見聚集而來的芸芸大眾時，他對梅林說道：「說實在的，梅林，如果在這些偉大的國王與高貴可敬的領主當中，我們竟找不到一個配得上成為這個王國之王的人，那可真是件不可思議的奇事了。」", "zh_tw_tagged": "然而當{{office:大司教|大主教}}看見聚集而來的芸芸大眾時，他對{{person:マーリン|梅林}}說道：「說實在的，{{person:マーリン|梅林}}，如果在這些偉大的{{office:王|國王}}與高貴可敬的領主當中，我們竟找不到一個配得上成為這個王國之{{office:王|王}}的人，那可真是件不可思議的奇事了。」", "zh_cn": "然而当大主教看见聚集而来的芸芸大众时，他对梅林说道：“说实在的，梅林，如果在这些伟大的国王与高贵可敬的领主当中，我们竟找不到一个配得上成为这个王国之王的人，那可真是件不可思议的奇事了。”", "zh_cn_tagged": "然而当{{office:大司教|大主教}}看见聚集而来的芸芸大众时，他对{{person:マーリン|梅林}}说道：“说实在的，{{person:マーリン|梅林}}，如果在这些伟大的{{office:王|国王}}与高贵可敬的领主当中，我们竟找不到一个配得上成为这个王国之{{office:王|王}}的人，那可真是件不可思议的奇事了。”", "ko": "그러나 대주교는 모여드는 수많은 인파를 보고 멀린에게 말했다. “정말로, 멀린, 이토록 많은 위대한 왕들과 고귀하고 영예로운 영주들 가운데서 이 나라의 왕이 되기에 걸맞은 사람을 한 명도 찾지 못한다면 참으로 기이한 일이 아니겠소.”", "ko_tagged": "그러나 {{office:大司教|대주교}}는 모여드는 수많은 인파를 보고 {{person:マーリン|멀린}}에게 말했다. “정말로, {{person:マーリン|멀린}}, 이토록 많은 위대한 {{office:王|왕}}들과 고귀하고 영예로운 영주들 가운데서 이 나라의 {{office:王|왕}}이 되기에 걸맞은 사람을 한 명도 찾지 못한다면 참으로 기이한 일이 아니겠소.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p19_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 19, "type": "本文", "raw_text": "Unto which the Merlin smiled and said, “Marvel not, my lord, if among all those who appear to be so extraordinarily worthy there shall not be found one who is worthy; and marvel not if, among all those who are unknown, there shall arise one who shall approve himself to be entirely worthy.”", "translation": "これに対してマーリンは微笑んで言った。「我が主よ、これほど並外れてふさわしく見える者たちの中に、ふさわしい者が一人もいないとしても驚かれますな。そして、何の名もない者たちの中から、完全にふさわしい者としてみずからを証し立てる者が現れたとしても、驚かれますな。」", "raw_tagged": "Unto which the {{person:マーリン|Merlin}} smiled and said, “Marvel not, my lord, if among all those who appear to be so extraordinarily worthy there shall not be found one who is worthy; and marvel not if, among all those who are unknown, there shall arise one who shall approve himself to be entirely worthy.”", "translation_tagged": "これに対して{{person:マーリン|マーリン}}は微笑んで言った。「我が主よ、これほど並外れてふさわしく見える者たちの中に、ふさわしい者が一人もいないとしても驚かれますな。そして、何の名もない者たちの中から、完全にふさわしい者としてみずからを証し立てる者が現れたとしても、驚かれますな。」", "persons": "マーリン", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "對此梅林微笑道：「我的大人，即便在那些看似無比相稱的人當中找不到一個相稱之人，也請切勿驚異；而若在所有默默無名之輩當中，竟然挺身出現一位完全證明自己配當此任的人，也請切勿驚異。」", "zh_tw_tagged": "對此{{person:マーリン|梅林}}微笑道：「我的大人，即便在那些看似無比相稱的人當中找不到一個相稱之人，也請切勿驚異；而若在所有默默無名之輩當中，竟然挺身出現一位完全證明自己配當此任的人，也請切勿驚異。」", "zh_cn": "对此梅林微笑道：“我的大人，即便在那些看似无比相称的人当中找不到一个相称之人，也请切勿惊异；而若在所有默默无名之辈当中，竟然挺身出现一位完全证明自己配当此任的人，也请切勿惊异。”", "zh_cn_tagged": "对此{{person:マーリン|梅林}}微笑道：“我的大人，即便在那些看似无比相称的人当中找不到一个相称之人，也请切勿惊异；而若在所有默默无名之辈当中，竟然挺身出现一位完全证明自己配当此任的人，也请切勿惊异。”", "ko": "이에     const NATURE_MOUNTAINS = [];

    // 手元校正モード判定（file://, localhost, 127.0.0.1, または ?edit=1）
    const urlParams = new URLSearchParams(window.location.search);
    const IS_DEV_MODE = (
      window.location.protocol === "file:" ||
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1" ||
      urlParams.get("edit") === "1"
    );

    if (IS_DEV_MODE) {
      document.body.classList.add("is-dev-mode");

      document.getElementById("devTrayHead").addEventListener("click", function() {
        const panel = document.getElementById("devFeedbackPanel");
        panel.classList.toggle("is-collapsed");

      });
    }

    // 公開対象レコードのフィルタリング（本番Webでは公開上限段落以下のみ表示）
    const VISIBLE_RECORDS = ALL_RECORDS.filter(function(r) {
      if (IS_DEV_MODE) return Boolean(r.is_enriched);
      return Boolean(r.is_enriched) && Number(r.para_index) <= PUBLISHED_MAX_PARAGRAPH_INDEX;
    });

    const AVAILABLE_PARAS = Array.from(new Set(VISIBLE_RECORDS.map(function(r) {
      return Number(r.para_index);
    }))).sort(function(a, b) { return a - b; });

    let currentParaIndex = AVAILABLE_PARAS.length > 0 ? AVAILABLE_PARAS[0] : 1;
    let isAllParasMode = true;

    // =========================================================================
    // HTMLエスケープおよびインライン4色タグ変換
    // =========================================================================
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const TAG_REGEX = /\{\{(place|person|office|special):([^|}]+)\|([^}]+)\}\}/g;

    function convertTaggedTextToHtml(taggedStr) {
      const src = String(taggedStr || "");
      let result = "";
      let lastIdx = 0;
      let match;
      TAG_REGEX.lastIndex = 0;
      while ((match = TAG_REGEX.exec(src)) !== null) {
        result += escapeHtml(src.slice(lastIdx, match.index));
        const kind = match[1];
        const key = match[2];
        const surface = match[3];
        result += (
          '<span class="inline-' + escapeHtml(kind) + '" ' +
          'data-tag-kind="' + escapeHtml(kind) + '" ' +
          'data-tag-key="' + escapeHtml(key) + '">' +
          escapeHtml(surface) +
          '</span>'
        );
        lastIdx = TAG_REGEX.lastIndex;
      }
      result += escapeHtml(src.slice(lastIdx));
      return result;
    }

    function collectPlaceKeysFromRecords(recordsList) {
      const keys = [];
      const seen = new Set();
      recordsList.forEach(function(rec) {
        if (rec.places) {
          rec.places.split(",").forEach(function(k) {
            const trimmed = k.trim();
            if (trimmed && PLACES_MASTER[trimmed] && !seen.has(trimmed)) {
              seen.add(trimmed);
              keys.push(trimmed);
            }
          });
        }
      });
      return keys;
    }

    document.getElementById("paraSelect").addEventListener("change", closeGlossaryModal);

    modalEl.addEventListener("click", function(ev) {

        closeGlossaryModal();
