  <meta name="apple-mobile-web-app-title" content="アーサー王物語">
  <meta name="theme-color" content="#2c241b">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png?v=3">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    /* =========================================================================
       CSSレイアウト・配色定数（『正史三國志』ブラウン／羊皮紙テーマ完全準拠）
       ========================================================================= */
    :root {
      --bg-header-dark: #2c241b;
      --bg-header-sub: #3d2f1d;
      --bg-parchment: #f4f1ea;
      --bg-card: #fffdf9;
      --border-warm: #dcd3c1;
      --accent-gold: #8c6d46;
      --accent-gold-light: #d4b483;
      --accent-red: #b3392b;
      --text-primary: #261f18;
      --text-muted: #6b5c4c;
      --place-green: #1e6b3b;
      --person-brown: #7c3f12;
      --office-blue: #1e4e79;
      --special-purple: #63317c;
      --desktop-pane-width-pct: 50%;
      --mobile-map-height-pct: 40%;
      --mobile-reader-height-pct: 60%;
      --reader-bottom-safe-px: 48px;
      --z-map-controls: 700;
      --z-map-toast: 720;
      --z-map-modal: 850;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-parchment);
      color: var(--text-primary);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      -webkit-text-size-adjust: 100%;
    }

    .app-shell {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }

    /* 左ペイン：地図＋上部ナビ＋解説モーダル */
    .left-pane {
      position: relative;
      display: flex;
      flex-direction: column;
      width: var(--desktop-pane-width-pct);
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      flex-shrink: 0;
      border-right: 2px solid #bda988;
      background: #dfd7c5;
    }

    #map {
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
    }

    /* 地図上の巻切り替えバー（本家『正史三國志』と同一のスリム1行構成） */
    .vol-nav-bar {
      height: 38px;
      min-height: 38px;
      background: #2c241b;
      color: #f7f1e5;
      border-bottom: 1.5px solid #8c6d46;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      z-index: 2000;
      user-select: none;
      position: relative;
      flex-shrink: 0;
    }
    .home-top-link {
      position: absolute;
      left: 10px;
      background: #3e2723;
      color: #ffe082;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: bold;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }
    .home-top-link:hover { background: #5d4037; color: #fff; }
    .slim-nav-btn {
      background: #4e342e;
      color: #ffd54f;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1.3;
      text-decoration: none;
    }
    .slim-nav-btn:hover:not(:disabled) { background: #6d4c41; color: #fff; }
    .slim-nav-btn:disabled {
      background: transparent;
      color: #6d5d4b;
      border-color: #4e342e;
      cursor: not-allowed;
    }
    .vol-nav-select {
      background: #3e2723;
      color: #f7f1e5;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-family: "Yu Mincho", "MS PMincho", serif;
      letter-spacing: 0.05em;
      min-width: 0;
      max-width: 240px;
    }
    @media (max-width: 520px) {
      .vol-nav-bar { gap: 6px; padding: 0 6px; }
      .home-top-link { position: static; margin-right: auto; padding: 2px 6px; font-size: 0.72rem; }
      .vol-nav-select { max-width: 150px; font-size: 0.8rem; }
    }

    /* 地図右上：[📌 地図固定] ボタン（レイヤーアイコンの左隣） */
    .map-lock-btn {
      position: absolute;
      top: 10px;
      right: 54px;
      z-index: var(--z-map-controls);
      background: rgba(255, 253, 249, 0.95);
      color: var(--text-primary);
      border: 1px solid #a38e6d;
      border-radius: 6px;
      padding: 5px 9px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
      white-space: nowrap;
    }

    .map-lock-btn.is-locked {
      background: var(--accent-red);
      color: #ffffff;
      border-color: #7c1f15;
    }

    /* 地図左下の1行トースト */
    .map-toast {
      position: absolute;
      left: 10px;
      bottom: 18px;
      max-width: calc(100% - 20px);
      z-index: var(--z-map-toast);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(44, 36, 27, 0.94);
      color: #fdf8ee;
      border-left: 3px solid var(--accent-gold-light);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .map-toast.is-visible {
      display: inline-flex;
    }

    .map-toast-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-toast-close {
      background: transparent;
      border: none;
      color: #dfd3be;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }

    /* 自然地形・地名ピンラベル */
    .nature-mtn-label {
      color: #5c4328;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .nature-river-label {
      color: #1f5a8a;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .place-pin-tooltip {
      background: rgba(44, 36, 27, 0.9);
      color: #fffdf8;
      border: 1px solid #d4b483;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .area-badge-label {
      background: rgba(179, 57, 43, 0.84);
      color: #ffffff;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 左ペイン上の解説モーダル（右ペインの読書画面を隠さない） */
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: var(--z-map-modal);
      background: rgba(28, 22, 16, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      max-height: 88%;
      background: var(--bg-card);
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.38);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .modal-header {
      background: var(--bg-header-dark);
      color: #f8f1e4;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .modal-close-btn {
      background: rgba(255,255,255,0.14);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.82rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .homonym-switch-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      padding: 7px 9px;
      background: #f5ede0;
      border: 1px solid #d7c4a3;
      border-radius: 6px;
    }

    .homonym-btn {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #a88d63;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .homonym-btn.is-current {
      background: var(--bg-header-sub);
      color: #ffffff;
      border-color: var(--bg-header-dark);
    }

    .modal-role-badge {
      display: inline-block;
      background: #efe6d5;
      color: #4d3922;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-mapping-note {
      background: #f8f2e7;
      border-left: 3px solid var(--accent-gold);
      padding: 6px 9px;
      font-size: 0.78rem;
      color: #5a4631;
      margin-bottom: 8px;
    }

    .modal-wiki-box {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f4f1ea;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .modal-occ-section {
      margin-top: 12px;
      border-top: 1px solid var(--border-warm);
      padding-top: 9px;
    }

    .modal-occ-heading {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .occ-jump-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .occ-jump-btn {
      background: #fffdf9;
      color: var(--office-blue);
      border: 1px solid #b8c7d9;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .occ-jump-btn:hover {
      background: #eaf2fa;
    }

    /* 右ペイン：ヘッダ＋段落バー＋本文カードスクロール */
    .right-pane {
      width: var(--desktop-pane-width-pct);
      height: 100%;
      min-height: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-parchment);
    }

    .reader-header {
      background: var(--bg-header-dark);
      color: #f6efe2;
      padding: 7px 12px;
      border-bottom: 1px solid #6e5536;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reader-title-group {
      min-width: 0;
    }

    .reader-app-name {
      font-size: 0.72rem;
      color: var(--accent-gold-light);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .reader-vol-title {
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 段落切替コントロールバー */
    .para-bar {
      background: var(--bg-header-sub);
      color: #f3eadb;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
      border-bottom: 1px solid #6e5536;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .para-btn {
      background: rgba(255,255,255,0.12);
      color: #f8f1e4;
      border: 1px solid rgba(212,180,131,0.45);
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .para-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .para-btn.is-active-mode {
      background: var(--accent-gold);
      color: #ffffff;
      border-color: var(--accent-gold-light);
    }

    .para-select {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #b8a382;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      flex: 1 1 130px;
      min-width: 0;
      max-width: 240px;
    }

    /* 手元校正モード専用パネル（本番Webでは非表示） */
    .dev-feedback-panel {
      display: none;
      background: #fdf6e9;
      border-bottom: 2px solid #c9a66b;
      padding: 7px 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    .dev-feedback-panel.is-dev {
      display: block;
    }

    .dev-panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-mini-btn {
      background: #fffdf9;
      border: 1px solid #9c7d4c;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 記事スクロール領域（スマホ下端見切れ防止） */
    .records-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(var(--reader-bottom-safe-px) + env(safe-area-inset-bottom, 0px));
    }

    .record-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      border-left: 4px solid #cbbba0;
      border-radius: 7px;
      padding: 13px 15px;
      margin-bottom: 13px;
      box-shadow: 0 1px 4px rgba(44, 36, 27, 0.06);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .record-card.active-card {
      border-left-color: var(--accent-red);
      box-shadow: 0 2px 10px rgba(179, 57, 43, 0.15);
    }

    .record-card.is-verse {
      background: #fcf8ef;
      border-left-color: var(--accent-gold);
    }

    .card-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .type-badge {
      background: #ebe3d3;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 1px 7px;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .type-badge.verse {
      background: #e9d8b8;
      color: #5b3d14;
    }

    .era-badge {
      color: #6b5c4c;
      font-weight: 600;
    }

    .trans-box {
      font-size: 0.98rem;
      line-height: 1.9;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .record-card.is-verse .trans-box {
      font-style: italic;
      padding-left: 8px;
      border-left: 2px solid #dfd0b4;
    }

    /* 4分類インラインクリックタグ（PROJECT_RULES 第3章1節準拠） */
    .inline-place {
      color: var(--place-green);
      border-bottom: 2px solid var(--place-green);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-person {
      color: var(--person-brown);
      border-bottom: 1.5px dotted var(--person-brown);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-office {
      color: var(--office-blue);
      border-bottom: 1.5px dashed var(--office-blue);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-special {
      color: var(--special-purple);
      border-bottom: 1.5px dotted var(--special-purple);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-place:hover, .inline-person:hover, .inline-office:hover, .inline-special:hover {
      background: rgba(212, 180, 131, 0.22);
    }

    /* 英語底本折りたたみ表示 */
    .source-details {
      margin-top: 10px;
      border-top: 1px dashed var(--border-warm);
      padding-top: 7px;
    }

    .source-details summary {
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
      user-select: none;
    }

    .source-text-body {
      margin-top: 7px;
      padding: 8px 10px;
      background: #f7f3eb;
      border-radius: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      line-height: 1.72;
      color: #33291e;
    }

    /* 手元校正用1クリック指摘ボタン列 */
    .card-dev-bar {
      display: none;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dotted #d7cbb8;
      gap: 5px;
      flex-wrap: wrap;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body.is-dev-mode .card-dev-bar {
      display: flex;
    }

    .dev-flag-btn {
      background: #faf4e8;
      color: #5c472c;
      border: 1px solid #cbb692;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.71rem;
      cursor: pointer;
    }

    .adsense-footer-box {
      margin-top: 18px;
      padding: 10px;
      background: #efeae0;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* スマホ・タブレット縦（横幅900px以下：上40%地図・下60%本文） */
    @media (max-width: 900px) {
      .app-shell {
        flex-direction: column;
      }
      .left-pane {
        width: 100%;
        height: var(--mobile-map-height-pct);
        border-right: none;
        border-bottom: 2px solid #bda988;
      }
      .right-pane {
        width: 100%;
        height: var(--mobile-reader-height-pct);
      }
      .map-lock-btn {
        top: 8px;
        right: 48px;
        padding: 4px 7px;
        font-size: 0.72rem;
      }
    }
    /* 手元校正トレイ：地図右下の折りたたみ式（本家 feedback-tray 準拠） */
    .dev-feedback-panel {
      position: absolute;
      right: 10px;
      bottom: 28px;
      z-index: 1500;
      width: 230px;
      padding: 0;
      border: 1px solid #c9a66b;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .dev-tray-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;

 to be the greatest leader in war of any man then alive); and he gave {{person:ユーサー|Uther-Pendragon}} aid and advice in battle. So, with the help of {{person:マーリン|Merlin}} and Sir {{person:ウルフィアス|Ulfius}}, {{person:ユーサー|Uther-Pendragon}} was able to overcome all of his enemies and to become {{office:王|King}} of the entire realm.", "translation_tagged": "その昔、{{person:ユーサー|ユーサー・ペンドラゴン}}という非常に高貴な{{office:王|王}}がおり、{{place:ブリテン島|ブリテン}}全土の覇王となった。この{{office:王|王}}が王国の{{office:ペンドラゴン|ペンドラゴン位}}を成し遂げるにあたっては、二人の人物が大いに力を貸し、あらゆる事柄で多大な助けを与えた。その一人は、人々に賢者{{person:マーリン|マーリン}}として知られる非常に強力な{{special:魔術師|魔術師}}にして一時は預言者でもあった者で、{{person:ユーサー|ユーサー・ペンドラゴン}}に極めて良き助言を与えた。もう一人は、{{person:ウルフィアス|ウルフィアス}}と呼ばれる優れた貴族にして名高い{{office:騎士|騎士}}（当時存命のいかなる者よりも偉大な戦の指揮官であると多くの人に思われていた）で、戦において{{person:ユーサー|ユーサー・ペンドラゴン}}に助力と助言を与えた。こうして、{{person:マーリン|マーリン}}と{{person:ウルフィアス|ウルフィアス}}卿の助けにより、{{person:ユーサー|ユーサー・ペンドラゴン}}はすべての敵を打ち破り、全土の{{office:王|王}}となることができた。", "persons": "ユーサー,マーリン,ウルフィアス", "places": "ブリテン島", "offices": "王,ペンドラゴン,騎士", "era_year": "伝説時代", "keywords": "魔術師", "is_enriched": true, "zh_tw": "很久以前，有一位十分高貴的國王，名叫烏瑟·潘德拉剛，他成為整個不列顛的霸主。這位國王之所以能達成王國的潘德拉剛之位，全賴兩個人鼎力相助，他們在他所做的一切事情上都給予極大的幫助。其中一人是一位法力極其強大、一度也是先知的魔法師，世人稱他為智者梅林；他給烏瑟·潘德拉剛提供了非常好的建言。另一人是一位出色的貴族、聲名卓著的騎士，名叫烏爾菲亞斯（許多人認為他是當時在世的最偉大的戰爭統帥），他在戰鬥中給予烏瑟·潘德拉剛協助與建議。就這樣，憑藉梅林與烏爾菲亞斯爵士的幫助，烏瑟·潘德拉剛得以擊敗他所有的敵人，成為整個王國的國王。", "zh_tw_tagged": "很久以前，有一位十分高貴的{{office:王|國王}}，名叫{{person:ユーサー|烏瑟·潘德拉剛}}，他成為整個{{place:ブリテン島|不列顛}}的霸主。這位{{office:王|國王}}之所以能達成王國的{{office:ペンドラゴン|潘德拉剛之位}}，全賴兩個人鼎力相助，他們在他所做的一切事情上都給予極大的幫助。其中一人是一位法力極其強大、一度也是先知的{{special:魔術師|魔法師}}，世人稱他為智者{{person:マーリン|梅林}}；他給{{person:ユーサー|烏瑟·潘德拉剛}}提供了非常好的建言。另一人是一位出色的貴族、聲名卓著的{{office:騎士|騎士}}，名叫{{person:ウルフィアス|烏爾菲亞斯}}（許多人認為他是當時在世的最偉大的戰爭統帥），他在戰鬥中給予{{person:ユーサー|烏瑟·潘德拉剛}}協助與建議。就這樣，憑藉{{person:マーリン|梅林}}與{{person:ウルフィアス|烏爾菲亞斯}}爵士的幫助，{{person:ユーサー|烏瑟·潘德拉剛}}得以擊敗他所有的敵人，成為整個王國的{{office:王|國王}}。", "zh_cn": "很久以前，有一位十分高贵的国王，名叫乌瑟·潘德拉刚，他成为整个不列颠的霸主。这位国王之所以能达成王国的潘德拉刚之位，全赖两个人鼎力相助，他们在他所做的一切事情上都给予极大的帮助。其中一人是一位法力极其强大、一度也是先知的魔法师，世人称他为智者梅林；他给乌瑟·潘德拉刚提供了非常好的建言。另一人是一位出色的贵族、声名卓著的骑士，名叫乌尔菲亚斯（许多人认为他是当时在世的最伟大的战争统帅），他在战斗中给予乌瑟·潘德拉刚协助与建议。就这样，凭借梅林与乌尔菲亚斯爵士的帮助，乌瑟·潘德拉刚得以击败他所有的敌人，成为整个王国的国王。", "zh_cn_tagged": "很久以前，有一位十分高贵的{{office:王|国王}}，名叫{{person:ユーサー|乌瑟·潘德拉刚}}，他成为整个{{place:ブリテン島|不列颠}}的霸主。这位{{office:王|国王}}之所以能达成王国的{{office:ペンドラゴン|潘德拉刚之位}}，全赖两个人鼎力相助，他们在他所做的一切事情上都给予极大的帮助。其中一人是一位法力极其强大、一度也是先知的{{special:魔術師|魔法师}}，世人称他为智者{{person:マーリン|梅林}}；他给{{person:ユーサー|乌瑟·潘德拉刚}}提供了非常好的建言。另一人是一位出色的贵族、声名卓著的{{office:騎士|骑士}}，名叫{{person:ウルフィアス|乌尔菲亚斯}}（许多人认为他是当时在世的最伟大的战争统帅），他在战斗中给予{{person:ユーサー|乌瑟·潘德拉刚}}协助与建议。就这样，凭借{{person:マーリン|梅林}}与{{person:ウルフィアス|乌尔菲亚斯}}爵士的帮助，{{person:ユーサー|乌瑟·潘德拉刚}}得以击败他所有的敌人，成为整个王国的{{office:王|国王}}。", "ko": "옛날에 매우 고귀한 왕이 살았으니, 그의 이름은 우서 펜드래건이었고 그는 브리튼 전역의 패왕이 되었다. 이 왕이 왕국의 펜드래건 지위를 이루는 데에는 두 사람의 도움이 매우 컸으며, 그들은 그가 하는 모든 일에서 큰 조력을 베풀었다. 그중 한 사람은 매우 강력한 마법사이자 한때 예언자이기도 했던 인물로, 사람들에게 현자 멀린으로 알려져 있었으며, 우서 펜드래건에게 매우 좋은 조언을 주었다. 다른 한 사람은 뛰어난 귀족이자 이름난 기사로 울피우스라 불렸는데 (당시 살아 있는 누구보다도 위대한 전쟁 지휘관이라고 많은 이들이 생각했다), 전투에서 우서 펜드래건에게 도움과 조언을 주었다. 그리하여 멀린과 울피우스 경의 도움으로 우서 펜드래건은 모든 적을 이기고 온 왕국의 왕이 될 수 있었다.", "ko_tagged": "옛날에 매우 고귀한 {{office:王|왕}}이 살았으니, 그의 이름은 {{person:ユーサー|우서 펜드래건}}이었고 그는 {{place:ブリテン島|브리튼}} 전역의 패왕이 되었다. 이 {{office:王|왕}}이 왕국의 {{office:ペンドラゴン|펜드래건 지위}}를 이루는 데에는 두 사람의 도움이 매우 컸으며, 그들은 그가 하는 모든 일에서 큰 조력을 베풀었다. 그중 한 사람은 매우 강력한 {{special:魔術師|마법사}}이자 한때 예언자이기도 했던 인물로, 사람들에게 현자 {{person:マーリン|멀린}}으로 알려져 있었으며, {{person:ユーサー|우서 펜드래건}}에게 매우 좋은 조언을 주었다. 다른 한 사람은 뛰어난 귀족이자 이름난 {{office:騎士|기사}}로 {{person:ウルフィアス|울피우스}}라 불렸는데 (당시 살아 있는 누구보다도 위대한 전쟁 지휘관이라고 많은 이들이 생각했다), 전투에서 {{person:ユーサー|우서 펜드래건}}에게 도움과 조언을 주었다. 그리하여 {{person:マーリン|멀린}}과 {{person:ウルフィアス|울피우스}} 경의 도움으로 {{person:ユーサー|우서 펜드래건}}은 모든 적을 이기고 온 왕국의 {{office:王|왕}}이 될 수 있었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p2_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 2, "type": "本文", "raw_text": "After Uther-Pendragon had ruled his kingdom for a number of years he took to wife a certain beautiful and gentle lady, hight Igraine. This noble dame was the widow of Gerlois, the Duke of Tintegal; -by which prince she had two daughters-one of whom was named Margaise and the other Morgana le Fay. And Morgana le Fay was a famous sorceress. These daughters the Queen brought with her to the Court of Uther-Pendragon after she had married that puissant King, and there Margaise was wedded to King Urien of Gore, and Morgana le Fay was wedded to King Lot of Orkney.", "translation": "ユーサー・ペンドラゴンは数年にわたり王国を治めたのち、イグレーヌという美しく心優しい貴婦人を妃に迎えた。この高貴な婦人はティンタジェル公ゲルロイスの未亡人で、この公との間に二人の娘があり、一人はマルゲーズ、もう一人はモルガン・ル・フェイといった。モルガン・ル・フェイは名高い魔女であった。王妃はこの強大な王と結婚したのち、娘たちをユーサー・ペンドラゴンの宮廷に伴い、そこでマルゲーズはゴアのユリエンス王に、モルガン・ル・フェイはオークニーのロット王に嫁いだ。", "raw_tagged": "After {{person:ユーサー|Uther-Pendragon}} had ruled his kingdom for a number of years he took to wife a certain beautiful and gentle lady, hight {{person:イグレーヌ|Igraine}}. This noble dame was the widow of {{person:ゲルロイス|Gerlois}}, the {{office:公爵|Duke}} of {{place:ティンタジェル|Tintegal}}; -by which prince she had two daughters-one of whom was named {{person:マルゲーズ|Margaise}} and the other {{person:モルガン・ル・フェイ|Morgana le Fay}}. And {{person:モルガン・ル・フェイ|Morgana le Fay}} was a famous {{special:魔女|sorceress}}. These daughters the {{office:王妃|Queen}} brought with her to the Court of {{person:ユーサー|Uther-Pendragon}} after she had married that puissant {{office:王|King}}, and there {{person:マルゲーズ|Margaise}} was wedded to {{office:王|King}} {{person:ユリエンス|Urien}} of {{special:ゴア|Gore}}, and {{person:モルガン・ル・フェイ|Morgana le Fay}} was wedded to {{office:王|King}} {{person:ロット|Lot}} of {{place:オークニー|Orkney}}.", "translation_tagged": "{{person:ユーサー|ユーサー・ペンドラゴン}}は数年にわたり王国を治めたのち、{{person:イグレーヌ|イグレーヌ}}という美しく心優しい貴婦人を妃に迎えた。この高貴な婦人は{{place:ティンタジェル|ティンタジェル}}{{office:公爵|公}}{{person:ゲルロイス|ゲルロイス}}の未亡人で、この公との間に二人の娘があり、一人は{{person:マルゲーズ|マルゲーズ}}、もう一人は{{person:モルガン・ル・フェイ|モルガン・ル・フェイ}}といった。{{person:モルガン・ル・フェイ|モルガン・ル・フェイ}}は名高い{{special:魔女|魔女}}であった。{{office:王妃|王妃}}はこの強大な{{office:王|王}}と結婚したのち、娘たちを{{person:ユーサー|ユーサー・ペンドラゴン}}の宮廷に伴い、そこで{{person:マルゲーズ|マルゲーズ}}は{{special:ゴア|ゴア}}の{{person:ユリエンス|ユリエンス}}王に、{{person:モルガン・ル・フェイ|モルガン・ル・フェイ}}は{{place:オークニー|オークニー}}の{{person:ロット|ロット}}王に嫁いだ。", "persons": "ユーサー,イグレーヌ,ゲルロイス,マルゲーズ,モルガン・ル・フェイ,ユリエンス,ロット", "places": "ティンタジェル,オークニー", "offices": "公爵,王妃,王", "era_year": "伝説時代", "keywords": "魔女,ゴア", "is_enriched": true, "zh_tw": "烏瑟·潘德拉剛治理王國數年後，娶了一位美麗而溫柔的貴婦，名叫伊格蕾茵。這位高貴的夫人是廷塔哲公爵格洛伊斯的遺孀，與這位公爵生有兩個女兒，一個名叫瑪嘉絲，另一個名叫摩根勒菲。摩根勒菲是一位著名的女巫。王后嫁給這位強大的國王之後，把女兒們帶到烏瑟·潘德拉剛的宮廷，瑪嘉絲在那裡嫁給了戈爾的尤里安國王，摩根勒菲則嫁給了奧克尼的洛特國王。", "zh_tw_tagged": "{{person:ユーサー|烏瑟·潘德拉剛}}治理王國數年後，娶了一位美麗而溫柔的貴婦，名叫{{person:イグレーヌ|伊格蕾茵}}。這位高貴的夫人是{{place:ティンタジェル|廷塔哲}}{{office:公爵|公爵}}{{person:ゲルロイス|格洛伊斯}}的遺孀，與這位公爵生有兩個女兒，一個名叫{{person:マルゲーズ|瑪嘉絲}}，另一個名叫{{person:モルガン・ル・フェイ|摩根勒菲}}。{{person:モルガン・ル・フェイ|摩根勒菲}}是一位著名的{{special:魔女|女巫}}。{{office:王妃|王后}}嫁給這位強大的{{office:王|國王}}之後，把女兒們帶到{{person:ユーサー|烏瑟·潘德拉剛}}的宮廷，{{person:マルゲーズ|瑪嘉絲}}在那裡嫁給了{{special:ゴア|戈爾}}的{{person:ユリエンス|尤里安}}國王，{{person:モルガン・ル・フェイ|摩根勒菲}}則嫁給了{{place:オークニー|奧克尼}}的{{person:ロット|洛特}}國王。", "zh_cn": "乌瑟·潘德拉刚治理王国数年后，娶了一位美丽而温柔的贵妇，名叫伊格蕾茵。这位高贵的夫人是廷塔哲公爵格洛伊斯的遗孀，与这位公爵生有两个女儿，一个名叫玛嘉丝，另一个名叫摩根勒菲。摩根勒菲是一位著名的女巫。王后嫁给这位强大的国王之后，把女儿们带到乌瑟·潘德拉刚的宫廷，玛嘉丝在那里嫁给了戈尔的尤里安国王，摩根勒菲则嫁给了奥克尼的洛特国王。", "zh_cn_tagged": "{{person:ユーサー|乌瑟·潘德拉刚}}治理王国数年后，娶了一位美丽而温柔的贵妇，名叫{{person:イグレーヌ|伊格蕾茵}}。这位高贵的夫人是{{place:ティンタジェル|廷塔哲}}{{office:公爵|公爵}}{{person:ゲルロイス|格洛伊斯}}的遗孀，与这位公爵生有两个女儿，一个名叫{{person:マルゲーズ|玛嘉丝}}，另一个名叫{{person:モルガン・ル・フェイ|摩根勒菲}}。{{person:モルガン・ル・フェイ|摩根勒菲}}是一位著名的{{special:魔女|女巫}}。{{office:王妃|王后}}嫁给这位强大的{{office:王|国王}}之后，把女儿们带到{{person:ユーサー|乌瑟·潘德拉刚}}的宫廷，{{person:マルゲーズ|玛嘉丝}}在那里嫁给了{{special:ゴア|戈尔}}的{{person:ユリエンス|尤里安}}国王，{{person:モルガン・ル・フェイ|摩根勒菲}}则嫁给了{{place:オークニー|奥克尼}}的{{person:ロット|洛特}}国王。", "ko": "우서 펜드래건은 몇 해 동안 왕국을 다스린 뒤, 이그레인이라는 아름답고 온화한 귀부인을 아내로 맞았다. 이 고귀한 부인은 틴타겔 공작 게를루아의 미망인으로, 이 공작과의 사이에 두 딸을 두었으니 한 명은 마르게즈, 다른 한 명은 모르가나 르 페이라 했다. 모르가나 르 페이는 이름난 마녀였다. 왕비는 이 강대한 왕과 혼인한 뒤 딸들을 우서 펜드래건의 궁정으로 데려왔고, 그곳에서 마르게즈는 고어의 유리엔 왕에게, 모르가나 르 페이는 오크니의 로트 왕에게 시집갔다.", "ko_tagged": "{{person:ユーサー|우서 펜드래건}}은 몇 해 동안 왕국을 다스린 뒤, {{person:イグレーヌ|이그레인}}이라는 아름답고 온화한 귀부인을 아내로 맞았다. 이 고귀한 부인은 {{place:ティンタジェル|틴타겔}} {{office:公爵|공작}} {{person:ゲルロイス|게를루아}}의 미망인으로, 이 공작과의 사이에 두 딸을 두었으니 한 명은 {{person:マルゲーズ|마르게즈}}, 다른 한 명은 {{person:モルガン・ル・フェイ|모르가나 르 페이}}라 했다. {{person:モルガン・ル・フェイ|모르가나 르 페이}}는 이름난 {{special:魔女|마녀}}였다. {{office:王妃|왕비}}는 이 강대한 {{office:王|왕}}과 혼인한 뒤 딸들을 {{person:ユーサー|우서 펜드래건}}의 궁정으로 데려왔고, 그곳에서 {{person:マルゲーズ|마르게즈}}는 {{special:ゴア|고어}}의 {{person:ユリエンス|유리엔}} 왕에게, {{person:モルガン・ル・フェイ|모르가나 르 페이}}는 {{place:オークニー|오크니}}의 {{person:ロット|로트}} 왕에게 시집갔다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p3_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 3, "type": "本文", "raw_text": "Now after awhile Uther-Pendragon and Queen Igraine had a son born unto them, and he was very beautiful and of great size and strength of bone. And whilst the child still lay wrapped in his swaddling clothes and lying in a cradle of gold and ultramarine, Merlin came to Uther-Pendragon with a spirit of prophecy strong upon him (for such was often the case with him), and, speaking in that spirit of prophecy, he said, “Lord, it is given unto me to foresee that thou shalt shortly fall sick of a fever and that thou shalt maybe die of a violent sweat that will follow thereon. Now, should such a dolorous thing befall us all, this young child (who is, certes, the hope of all this realm) will be in very great danger of his life; for many enemies will assuredly rise up with design to seize upon him for the sake of his inheritance, and either he will be slain or else he will be held in captivity from which he shall hardly hope to escape. Wherefore, I do beseech thee, Lord, that thou wilt permit Sir Ulfius and myself to presently convey the child away unto some place of safe refuge, where he may be hidden in secret until he groweth to manhood and is able to guard himself from such dangers as may threaten him.”", "translation": "しばらくして、ユーサー・ペンドラゴンと王妃イグレーヌの間に男の子が生まれた。その子は非常に美しく、体格も骨格も大きく頑健であった。その子がまだ産着にくるまれ、金と群青で飾られた揺りかごに横たわっていたころ、マーリンが予言の霊感に強く促されてユーサー・ペンドラゴンのもとへやって来た（彼にはよくあることであった）。そしてその予言の霊感のうちに語って言った。「主君よ、私には見えております。あなたはほどなく熱病に倒れ、それに続く激しい発汗によって命を落とされるやもしれません。もしそのような悲しむべき事態が我らすべてに降りかかれば、この幼子は（まことにこの全王国の希望であります）命の危険に大いにさらされましょう。多くの敵が、相続のためにこの子を奪おうと企てて必ずや立ち上がり、この子は殺されるか、あるいは脱出の望みもほとんどない囚われの身となるでしょう。ゆえに、主君よ、お願い申し上げます。ウルフィアス卿と私に、いま直ちにこの子を安全な避難先へ連れ去ることをお許しください。そこで、この子が成人し、身に迫る危険から自らを守れるようになるまで、ひそかに隠しておくのです。」", "raw_tagged": "Now after awhile {{person:ユーサー|Uther-Pendragon}} and {{office:王妃|Queen}} {{person:イグレーヌ|Igraine}} had a son born unto them, and he was very beautiful and of great size and strength of bone. And whilst the child still lay wrapped in his swaddling clothes and lying in a cradle of gold and ultramarine, {{person:マーリン|Merlin}} came to {{person:ユーサー|Uther-Pendragon}} with a spirit of {{special:予言|prophecy}} strong upon him (for such was often the case with him), and, speaking in that spirit of {{special:予言|prophecy}}, he said, “Lord, it is given unto me to foresee that thou shalt shortly fall sick of a fever and that thou shalt maybe die of a violent sweat that will follow thereon. Now, should such a dolorous thing befall us all, this young child (who is, certes, the hope of all this realm) will be in very great danger of his life; for many enemies will assuredly rise up with design to seize upon him for the sake of his inheritance, and either he will be slain or else he will be held in captivity from which he shall hardly hope to escape. Wherefore, I do beseech thee, Lord, that thou wilt permit Sir {{person:ウルフィアス|Ulfius}} and myself to presently convey the child away unto some place of safe refuge, where he may be hidden in secret until he groweth to manhood and is able to guard himself from such dangers as may threaten him.”", "translation_tagged": "しばらくして、{{person:ユーサー|ユーサー・ペンドラゴン}}と{{office:王妃|王妃}}{{person:イグレーヌ|イグレーヌ}}の間に男の子が生まれた。その子は非常に美しく、体格も骨格も大きく頑健であった。その子がまだ産着にくるまれ、金と群青で飾られた揺りかごに横たわっていたころ、{{person:マーリン|マーリン}}が{{special:予言|予言}}の霊感に強く促されて{{person:ユーサー|ユーサー・ペンドラゴン}}のもとへやって来た（彼にはよくあることであった）。そしてその{{special:予言|予言}}の霊感のうちに語って言った。「主君よ、私には見えております。あなたはほどなく熱病に倒れ、それに続く激しい発汗によって命を落とされるやもしれません。もしそのような悲しむべき事態が我らすべてに降りかかれば、この幼子は（まことにこの全王国の希望であります）命の危険に大いにさらされましょう。多くの敵が、相続のためにこの子を奪おうと企てて必ずや立ち上がり、この子は殺されるか、あるいは脱出の望みもほとんどない囚われの身となるでしょう。ゆえに、主君よ、お願い申し上げます。{{person:ウルフィアス|ウルフィアス}}卿と私に、いま直ちにこの子を安全な避難先へ連れ去ることをお許しください。そこで、この子が成人し、身に迫る危険から自らを守れるようになるまで、ひそかに隠しておくのです。」", "persons": "ユーサー,イグレーヌ,マーリン,ウルフィアス", "places": "", "offices": "王妃", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "過了一段時間，烏瑟·潘德拉剛與王后伊格蕾茵生下一個兒子，這孩子十分俊美，身材高大，骨骼強健。當這孩子還裹在襁褓中，躺在以黃金與群青裝飾的搖籃裡時，梅林懷著強烈的預言之靈來到烏瑟·潘德拉剛面前（他常有這樣的情形），並在這預言之靈中說道：「主公，我得以預見，您不久將罹患熱病，隨後因劇烈發汗而可能喪命。若這樣悲慘的事降臨我們所有人，這位幼子（他確實是整個王國的希望）將面臨極大的性命危險；因為許多敵人必定會為了他的繼承權而起身謀奪他，他不是被殺，就是被囚禁，幾乎無望逃脫。因此，主公，我懇求您，允許烏爾菲亞斯爵士與我立即把孩子帶到某個安全的避難之處，把他祕密藏起來，直到他長大成人，能夠保護自己免受威脅他的危險。」", "zh_tw_tagged": "過了一段時間，{{person:ユーサー|烏瑟·潘德拉剛}}與{{office:王妃|王后}}{{person:イグレーヌ|伊格蕾茵}}生下一個兒子，這孩子十分俊美，身材高大，骨骼強健。當這孩子還裹在襁褓中，躺在以黃金與群青裝飾的搖籃裡時，{{person:マーリン|梅林}}懷著強烈的{{special:予言|預言}}之靈來到{{person:ユーサー|烏瑟·潘德拉剛}}面前（他常有這樣的情形），並在這{{special:予言|預言}}之靈中說道：「主公，我得以預見，您不久將罹患熱病，隨後因劇烈發汗而可能喪命。若這樣悲慘的事降臨我們所有人，這位幼子（他確實是整個王國的希望）將面臨極大的性命危險；因為許多敵人必定會為了他的繼承權而起身謀奪他，他不是被殺，就是被囚禁，幾乎無望逃脫。因此，主公，我懇求您，允許{{person:ウルフィアス|烏爾菲亞斯}}爵士與我立即把孩子帶到某個安全的避難之處，把他祕密藏起來，直到他長大成人，能夠保護自己免受威脅他的危險。」", "zh_cn": "过了一段时间，乌瑟·潘德拉刚与王后伊格蕾茵生下一个儿子，这孩子十分俊美，身材高大，骨骼强健。当这孩子还裹在襁褓中，躺在以黄金与群青装饰的摇篮里时，梅林怀着强烈的预言之灵来到乌瑟·潘德拉刚面前（他常有这样的情形），并在这预言之灵中说道：“主公，我得以预见，您不久将罹患热病，随后因剧烈发汗而可能丧命。若这样悲惨的事降临我们所有人，这位幼子（他确实是整个王国的希望）将面临极大的性命危险；因为许多敌人必定会为了他的继承权而起身谋夺他，他不是被杀，就是被囚禁，几乎无望逃脱。因此，主公，我恳求您，允许乌尔菲亚斯爵士与我立即把孩子带到某个安全的避难之处，把他秘密藏起来，直到他长大成人，能够保护自己免受威胁他的危险。”", "zh_cn_tagged": "过了一段时间，{{person:ユーサー|乌瑟·潘德拉刚}}与{{office:王妃|王后}}{{person:イグレーヌ|伊格蕾茵}}生下一个儿子，这孩子十分俊美，身材高大，骨骼强健。当这孩子还裹在襁褓中，躺在以黄金与群青装饰的摇篮里时，{{person:マーリン|梅林}}怀着强烈的{{special:予言|预言}}之灵来到{{person:ユーサー|乌瑟·潘德拉刚}}面前（他常有这样的情形），并在这{{special:予言|预言}}之灵中说道：“主公，我得以预见，您不久将罹患热病，随后因剧烈发汗而可能丧命。若这样悲惨的事降临我们所有人，这位幼子（他确实是整个王国的希望）将面临极大的性命危险；因为许多敌人必定会为了他的继承权而起身谋夺他，他不是被杀，就是被囚禁，几乎无望逃脱。因此，主公，我恳求您，允许{{person:ウルフィアス|乌尔菲亚斯}}爵士与我立即把孩子带到某个安全的避难之处，把他秘密藏起来，直到他长大成人，能够保护自己免受威胁他的危险。”", "ko": "얼마 후 우서 펜드래건과 왕비 이그레인 사이에 아들이 태어났는데, 그 아이는 매우 아름다웠고 체격과 골격이 크고 튼튼했다. 아이가 아직 포대기에 싸여 금과 군청색으로 꾸민 요람에 누워 있을 때, 멀린이 강한 예언의 영감에 사로잡혀 우서 펜드래건을 찾아왔다(그에게는 흔한 일이었다). 그리고 그 예언의 영감 속에서 말했다. “주군이시여, 저는 이렇게 내다보게 되었습니다. 주군께서는 머지않아 열병에 걸리시고, 이어지는 심한 발한으로 목숨을 잃으실 수도 있습니다. 만일 그런 비통한 일이 우리 모두에게 닥친다면, 이 어린아이(참으로 이 온 왕국의 희망입니다)는 목숨이 크게 위태로워질 것입니다. 많은 적들이 상속을 노려 그를 붙잡으려고 반드시 일어설 것이며, 그는 살해되거나 탈출할 희망이 거의 없는 감금 상태에 놓일 것입니다. 그러므로 주군이시여, 청하오니 울피우스 경과 제가 지금 곧 아이를 안전한 피난처로 데려가, 장성하여 자신을 위협하는 위험으로부터 스스로를 지킬 수 있을 때까지 은밀히 숨겨 두도록 허락해 주십시오.”", "ko_tagged": "얼마 후 {{person:ユーサー|우서 펜드래건}}과 {{office:王妃|왕비}} {{person:イグレーヌ|이그레인}} 사이에 아들이 태어났는데, 그 아이는 매우 아름다웠고 체격과 골격이 크고 튼튼했다. 아이가 아직 포대기에 싸여 금과 군청색으로 꾸민 요람에 누워 있을 때, {{person:マーリン|멀린}}이 강한 {{special:予言|예언}}의 영감에 사로잡혀 {{person:ユーサー|우서 펜드래건}}을 찾아왔다(그에게는 흔한 일이었다). 그리고 그 {{special:予言|예언}}의 영감 속에서 말했다. “주군이시여, 저는 이렇게 내다보게 되었습니다. 주군께서는 머지않아 열병에 걸리시고, 이어지는 심한 발한으로 목숨을 잃으실 수도 있습니다. 만일 그런 비통한 일이 우리 모두에게 닥친다면, 이 어린아이(참으로 이 온 왕국의 희망입니다)는 목숨이 크게 위태로워질 것입니다. 많은 적들이 상속을 노려 그를 붙잡으려고 반드시 일어설 것이며, 그는 살해되거나 탈출할 희망이 거의 없는 감금 상태에 놓일 것입니다. 그러므로 주군이시여, 청하오니 {{person:ウルフィアス|울피우스}} 경과 제가 지금 곧 아이를 안전한 피난처로 데려가, 장성하여 자신을 위협하는 위험으로부터 스스로를 지킬 수 있을 때까지 은밀히 숨겨 두도록 허락해 주십시오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p4_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 4, "type": "本文", "raw_text": "When Merlin had made an end of speaking thus, Uther-Pendragon made reply with a very steadfast countenance in this wise: “Merlin, so far as my death is concerned-when my time cometh to die I believe God will give me grace to meet my end with entire cheerfulness; for, certes, my lot is in that wise no different from that of any other man who hath been born of woman. But touching the matter of this young child, if thy prophecy be true, then his danger is very great, and it would be well that he should be conveyed hence to some place of safe harborage as thou dost advise. Wherefore, I pray thee to perform thy will in this affair, bearing in thy heart the consideration that the child is the most precious inheritance which I shall leave unto this land.”", "translation": "マーリンがこう語り終えると、ユーサー・ペンドラゴンは実に毅然とした面持ちでこう答えた。「マーリンよ、私自身の死について言えば――死ぬべき時が来たなら、神は私に、この終わりを晴れやかな心で迎える恵みを与えてくださると信じている。まことに、この点で私の運命は、女から生まれた他のいかなる人間とも変わりはしない。だが、この幼子のことについては、もしそなたの予言が真実ならば、その危険は極めて大きく、そなたの勧めるとおり、安全な避難の地へ連れ去るのが良かろう。ゆえに、この件はそなたの思うままに行ってくれ。ただし、この子こそが、私がこの国に遺す最も貴い遺産であることを、心に留めておくように。」", "raw_tagged": "When {{person:マーリン|Merlin}} had made an end of speaking thus, {{person:ユーサー|Uther-Pendragon}} made reply with a very steadfast countenance in this wise: “{{person:マーリン|Merlin}}, so far as my death is concerned-when my time cometh to die I believe God will give me grace to meet my end with entire cheerfulness; for, certes, my lot is in that wise no different from that of any other man who hath been born of woman. But touching the matter of this young child, if thy {{special:予言|prophecy}} be true, then his danger is very great, and it would be well that he should be conveyed hence to some place of safe harborage as thou dost advise. Wherefore, I pray thee to perform thy will in this affair, bearing in thy heart the consideration that the child is the most precious inheritance which I shall leave unto this land.”", "translation_tagged": "{{person:マーリン|マーリン}}がこう語り終えると、{{person:ユーサー|ユーサー・ペンドラゴン}}は実に毅然とした面持ちでこう答えた。「{{person:マーリン|マーリン}}よ、私自身の死について言えば――死ぬべき時が来たなら、神は私に、この終わりを晴れやかな心で迎える恵みを与えてくださると信じている。まことに、この点で私の運命は、女から生まれた他のいかなる人間とも変わりはしない。だが、この幼子のことについては、もしそなたの{{special:予言|予言}}が真実ならば、その危険は極めて大きく、そなたの勧めるとおり、安全な避難の地へ連れ去るのが良かろう。ゆえに、この件はそなたの思うままに行ってくれ。ただし、この子こそが、私がこの国に遺す最も貴い遺産であることを、心に留めておくように。」", "persons": "ユーサー,マーリン", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "梅林說完這番話後，烏瑟·潘德拉剛神情十分堅定地回答：「梅林，就我自己的死而言——當我死期來臨時，我相信上帝會賜我恩典，讓我以全然歡喜的心迎接終點；因為，我的命運在這一點上，確實與任何其他由女人所生的人並無不同。但關於這位幼子的事，若你的預言屬實，那麼他的危險便非常大，依你所勸，把他帶到某個安全的避難之處是明智之舉。因此，我請你依你的意思辦理此事，並請謹記在心：這孩子是我留給這片土地最珍貴的遺產。」", "zh_tw_tagged": "{{person:マーリン|梅林}}說完這番話後，{{person:ユーサー|烏瑟·潘德拉剛}}神情十分堅定地回答：「{{person:マーリン|梅林}}，就我自己的死而言——當我死期來臨時，我相信上帝會賜我恩典，讓我以全然歡喜的心迎接終點；因為，我的命運在這一點上，確實與任何其他由女人所生的人並無不同。但關於這位幼子的事，若你的{{special:予言|預言}}屬實，那麼他的危險便非常大，依你所勸，把他帶到某個安全的避難之處是明智之舉。因此，我請你依你的意思辦理此事，並請謹記在心：這孩子是我留給這片土地最珍貴的遺產。」", "zh_cn": "梅林说完这番话后，乌瑟·潘德拉刚神情十分坚定地回答：“梅林，就我自己的死而言——当我死期来临时，我相信上帝会赐我恩典，让我以全然欢喜的心迎接终点；因为，我的命运在这一点上，确实与任何其他由女人所生的人并无不同。但关于这位幼子的事，若你的预言属实，那么他的危险便非常大，依你所劝，把他带到某个安全的避难之处是明智之举。因此，我请你依你的意思办理此事，并请谨记在心：这孩子是我留给这片土地最珍贵的遗产。”", "zh_cn_tagged": "{{person:マーリン|梅林}}说完这番话后，{{person:ユーサー|乌瑟·潘德拉刚}}神情十分坚定地回答：“{{person:マーリン|梅林}}，就我自己的死而言——当我死期来临时，我相信上帝会赐我恩典，让我以全然欢喜的心迎接终点；因为，我的命运在这一点上，确实与任何其他由女人所生的人并无不同。但关于这位幼子的事，若你的{{special:予言|预言}}属实，那么他的危险便非常大，依你所劝，把他带到某个安全的避难之处是明智之举。因此，我请你依你的意思办理此事，并请谨记在心：这孩子是我留给这片土地最珍贵的遗产。”", "ko": "멀린이 이렇게 말을 마치자, 우서 펜드래건은 매우 굳건한 얼굴로 이렇게 대답했다. “멀린, 내 죽음에 관해서라면—죽을 때가 오면 하느님께서 내게 온전히 즐거운 마음으로 끝을 맞을 은총을 주시리라 믿는다. 참으로 이 점에서 내 운명은 여자에게서 태어난 다른 어떤 사람과도 다르지 않으니까. 그러나 이 어린아이에 관해서라면, 그대의 예언이 참이라면 그 위험은 매우 크고, 그대가 권하는 대로 안전한 피난처로 데려가는 것이 좋겠다. 그러니 이 일은 그대의 뜻대로 행하라. 다만 이 아이가 내가 이 땅에 남길 가장 귀중한 유산임을 마음에 새기도록 하라.”", "ko_tagged": "{{person:マーリン|멀린}}이 이렇게 말을 마치자, {{person:ユーサー|우서 펜드래건}}은 매우 굳건한 얼굴로 이렇게 대답했다. “{{person:マーリン|멀린}}, 내 죽음에 관해서라면—죽을 때가 오면 하느님께서 내게 온전히 즐거운 마음으로 끝을 맞을 은총을 주시리라 믿는다. 참으로 이 점에서 내 운명은 여자에게서 태어난 다른 어떤 사람과도 다르지 않으니까. 그러나 이 어린아이에 관해서라면, 그대의 {{special:予言|예언}}이 참이라면 그 위험은 매우 크고, 그대가 권하는 대로 안전한 피난처로 데려가는 것이 좋겠다. 그러니 이 일은 그대의 뜻대로 행하라. 다만 이 아이가 내가 이 땅에 남길 가장 귀중한 유산임을 마음에 새기도록 하라.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p5_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 5, "type": "本文", "raw_text": "All this, as was said, Uther-Pendragon spake with great calmness and equanimity of spirit. And Merlin did as he had advised, and he and Sir Ulfius conveyed the child away by night, and no one but they wist whither the babe had been taken. And shortly afterward Uther-Pendragon was seized with the sickness as Merlin had foretold, and he died exactly as Merlin had feared that he would die; wherefore it was very well that the child had been taken to a place of safety.", "translation": "これらすべてを、先に述べたとおり、ユーサー・ペンドラゴンは大いなる平静と心の落ち着きをもって語った。マーリンは自らの勧めたとおりに事を運び、ウルフィアス卿とともに夜陰に乗じて幼子を連れ去った。赤子がどこへ連れて行かれたのかを知る者は、二人のほかには誰もいなかった。それからまもなく、ユーサー・ペンドラゴンはマーリンの予告したとおり病に倒れ、マーリンが恐れていたとおりの死に方で世を去った。それゆえ、子が安全な場所へ移されていたのは実に幸いであった。", "raw_tagged": "All this, as was said, {{person:ユーサー|Uther-Pendragon}} spake with great calmness and equanimity of spirit. And {{person:マーリン|Merlin}} did as he had advised, and he and Sir {{person:ウルフィアス|Ulfius}} conveyed the child away by night, and no one but they wist whither the babe had been taken. And shortly afterward {{person:ユーサー|Uther-Pendragon}} was seized with the sickness as {{person:マーリン|Merlin}} had foretold, and he died exactly as {{person:マーリン|Merlin}} had feared that he would die; wherefore it was very well that the child had been taken to a place of safety.", "translation_tagged": "これらすべてを、先に述べたとおり、{{person:ユーサー|ユーサー・ペンドラゴン}}は大いなる平静と心の落ち着きをもって語った。{{person:マーリン|マーリン}}は自らの勧めたとおりに事を運び、{{person:ウルフィアス|ウルフィアス}}卿とともに夜陰に乗じて幼子を連れ去った。赤子がどこへ連れて行かれたのかを知る者は、二人のほかには誰もいなかった。それからまもなく、{{person:ユーサー|ユーサー・ペンドラゴン}}は{{person:マーリン|マーリン}}の予告したとおり病に倒れ、{{person:マーリン|マーリン}}が恐れていたとおりの死に方で世を去った。それゆえ、子が安全な場所へ移されていたのは実に幸いであった。", "persons": "ユーサー,マーリン,ウルフィアス", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "如前所述，烏瑟·潘德拉剛說這一切時，態度十分平靜，心境安然。梅林依照自己的建議行事，與烏爾菲亞斯爵士趁夜把孩子帶走，除了他們兩人之外，沒有人知道嬰孩被帶到了哪裡。不久之後，烏瑟·潘德拉剛果然如梅林所預言的那樣染上了疾病，並且恰如梅林所擔憂的那樣死去；因此，孩子已被送往安全之處，實在是萬幸。", "zh_tw_tagged": "如前所述，{{person:ユーサー|烏瑟·潘德拉剛}}說這一切時，態度十分平靜，心境安然。{{person:マーリン|梅林}}依照自己的建議行事，與{{person:ウルフィアス|烏爾菲亞斯}}爵士趁夜把孩子帶走，除了他們兩人之外，沒有人知道嬰孩被帶到了哪裡。不久之後，{{person:ユーサー|烏瑟·潘德拉剛}}果然如{{person:マーリン|梅林}}所預言的那樣染上了疾病，並且恰如{{person:マーリン|梅林}}所擔憂的那樣死去；因此，孩子已被送往安全之處，實在是萬幸。", "zh_cn": "如前所述，乌瑟·潘德拉刚说这一切时，态度十分平静，心境安然。梅林依照自己的建议行事，与乌尔菲亚斯爵士趁夜把孩子带走，除了他们两人之外，没有人知道婴孩被带到了哪里。不久之后，乌瑟·潘德拉刚果然如梅林所预言的那样染上了疾病，并且恰如梅林所担忧的那样死去；因此，孩子已被送往安全之处，实在是万幸。", "zh_cn_tagged": "如前所述，{{person:ユーサー|乌瑟·潘德拉刚}}说这一切时，态度十分平静，心境安然。{{person:マーリン|梅林}}依照自己的建议行事，与{{person:ウルフィアス|乌尔菲亚斯}}爵士趁夜把孩子带走，除了他们两人之外，没有人知道婴孩被带到了哪里。不久之后，{{person:ユーサー|乌瑟·潘德拉刚}}果然如{{person:マーリン|梅林}}所预言的那样染上了疾病，并且恰如{{person:マーリン|梅林}}所担忧的那样死去；因此，孩子已被送往安全之处，实在是万幸。", "ko": "앞서 말한 대로, 우서 펜드래건은 이 모든 말을 대단히 차분하고 평온한 마음으로 했다. 멀린은 자신이 권한 대로 일을 처리하여 울피우스 경과 함께 밤중에 아이를 데리고 떠났고, 아기가 어디로 옮겨졌는지는 그 둘 말고는 아무도 알지 못했다. 얼마 지나지 않아 우서 펜드래건은 멀린이 예고한 대로 병에 걸렸고, 멀린이 걱정한 바로 그대로 세상을 떠났다. 그러므로 아이를 안전한 곳으로 옮겨 둔 것은 참으로 다행한 일이었다.", "ko_tagged": "앞서 말한 대로, {{person:ユーサー|우서 펜드래건}}은 이 모든 말을 대단히 차분하고 평온한 마음으로 했다. {{person:マーリン|멀린}}은 자신이 권한 대로 일을 처리하여 {{person:ウルフィアス|울피우스}} 경과 함께 밤중에 아이를 데리고 떠났고, 아기가 어디로 옮겨졌는지는 그 둘 말고는 아무도 알지 못했다. 얼마 지나지 않아 {{person:ユーサー|우서 펜드래건}}은 {{person:マーリン|멀린}}이 예고한 대로 병에 걸렸고, {{person:マーリン|멀린}}이 걱정한 바로 그대로 세상을 떠났다. 그러므로 아이를 안전한 곳으로 옮겨 둔 것은 참으로 다행한 일이었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p6_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 6, "type": "本文", "raw_text": "And after Uther-Pendragon had departed from this life, it was like-wise as Merlin had feared, for all the realm fell into great disorder. For each lesser king contended against his fellow for overlordship, and wicked knights and barons harried the highways as they listed and there levied toll with great cruelty upon helpless wayfarers. For some such travellers they took prisoners and held for ransom, whiles others they slew because they had no ransom to pay. So it was a very common sight to see a dead man lying by the roadside, if you should venture to make a journey upon some business or other. Thus it befell that, after awhile, all that dolorous land groaned with the trouble that lay upon it.", "translation": "ユーサー・ペンドラゴンがこの世を去ると、これもまたマーリンの恐れたとおり、全土が大いなる混乱に陥った。小王たちはそれぞれ互いに覇権を争い、邪悪な騎士や男爵たちは思うがままに街道を荒らし回り、そこで無力な旅人から容赦なく通行料を取り立てた。そうした旅人の中には、捕らえて身代金目当てに拘束する者もあれば、払う身代金のない者は殺してしまう場合もあった。ゆえに、何らかの用向きで旅に出ようものなら、道端に倒れた死体を見かけるのはごくありふれた光景であった。こうして、しばらくののち、その悲しむべき国土はのしかかる苦難にうめいた。", "raw_tagged": "And after {{person:ユーサー|Uther-Pendragon}} had departed from this life, it was like-wise as {{person:マーリン|Merlin}} had feared, for all the realm fell into great disorder. For each lesser {{office:王|king}} contended against his fellow for overlordship, and wicked {{office:騎士|knights}} and {{office:男爵|barons}} harried the highways as they listed and there levied toll with great cruelty upon helpless wayfarers. For some such travellers they took prisoners and held for ransom, whiles others they slew because they had no ransom to pay. So it was a very common sight to see a dead man lying by the roadside, if you should venture to make a journey upon some business or other. Thus it befell that, after awhile, all that dolorous land groaned with the trouble that lay upon it.", "translation_tagged": "{{person:ユーサー|ユーサー・ペンドラゴン}}がこの世を去ると、これもまた{{person:マーリン|マーリン}}の恐れたとおり、全土が大いなる混乱に陥った。{{office:王|小王}}たちはそれぞれ互いに覇権を争い、邪悪な{{office:騎士|騎士}}や{{office:男爵|男爵}}たちは思うがままに街道を荒らし回り、そこで無力な旅人から容赦なく通行料を取り立てた。そうした旅人の中には、捕らえて身代金目当てに拘束する者もあれば、払う身代金のない者は殺してしまう場合もあった。ゆえに、何らかの用向きで旅に出ようものなら、道端に倒れた死体を見かけるのはごくありふれた光景であった。こうして、しばらくののち、その悲しむべき国土はのしかかる苦難にうめいた。", "persons": "ユーサー,マーリン", "places": "", "offices": "王,騎士,男爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "烏瑟·潘德拉剛離世之後，一如梅林所擔憂的，整個王國陷入極大的混亂。各個小國王彼此爭奪霸權，邪惡的騎士與男爵隨心所欲地劫掠道路，並在那裡殘酷地向無助的旅人強收通行稅。有些旅人被他們抓去囚禁勒索贖金，另一些人因付不出贖金而被殺害。因此，若你為了某件事冒險出門旅行，路邊躺著死者是十分常見的景象。就這樣，過了一段時間，整片悲慘的土地都在重壓之下呻吟。", "zh_tw_tagged": "{{person:ユーサー|烏瑟·潘德拉剛}}離世之後，一如{{person:マーリン|梅林}}所擔憂的，整個王國陷入極大的混亂。各個{{office:王|小國王}}彼此爭奪霸權，邪惡的{{office:騎士|騎士}}與{{office:男爵|男爵}}隨心所欲地劫掠道路，並在那裡殘酷地向無助的旅人強收通行稅。有些旅人被他們抓去囚禁勒索贖金，另一些人因付不出贖金而被殺害。因此，若你為了某件事冒險出門旅行，路邊躺著死者是十分常見的景象。就這樣，過了一段時間，整片悲慘的土地都在重壓之下呻吟。", "zh_cn": "乌瑟·潘德拉刚离世之后，一如梅林所担忧的，整个王国陷入极大的混乱。各个小国王彼此争夺霸权，邪恶的骑士与男爵随心所欲地劫掠道路，并在那里残酷地向无助的旅人强收通行税。有些旅人被他们抓去囚禁勒索赎金，另一些人因付不出赎金而被杀害。因此，若你为了某件事冒险出门旅行，路边躺着死者是十分常见的景象。就这样，过了一段时间，整片悲惨的土地都在重压之下呻吟。", "zh_cn_tagged": "{{person:ユーサー|乌瑟·潘德拉刚}}离世之后，一如{{person:マーリン|梅林}}所担忧的，整个王国陷入极大的混乱。各个{{office:王|小国王}}彼此争夺霸权，邪恶的{{office:騎士|骑士}}与{{office:男爵|男爵}}随心所欲地劫掠道路，并在那里残酷地向无助的旅人强收通行税。有些旅人被他们抓去囚禁勒索赎金，另一些人因付不出赎金而被杀害。因此，若你为了某件事冒险出门旅行，路边躺着死者是十分常见的景象。就这样，过了一段时间，整片悲惨的土地都在重压之下呻吟。", "ko": "우서 펜드래건이 세상을 떠난 뒤, 이 역시 멀린이 걱정한 대로 온 왕국이 크나큰 혼란에 빠졌다. 작은 왕들은 저마다 서로 패권을 다투었고, 사악한 기사들과 남작들은 제멋대로 길목을 약탈하며 힘없는 나그네들에게 잔혹하게 통행세를 거두었다. 어떤 나그네는 붙잡아 몸값을 받으려고 가두었고, 몸값을 낼 길이 없는 다른 이들은 죽여 버렸다. 그래서 무슨 볼일로든 길을 나서 보면 길가에 죽은 사람이 누워 있는 광경은 아주 흔했다. 그리하여 얼마 지나지 않아 그 비통한 땅은 짓누르는 환난으로 신음하게 되었다.", "ko_tagged": "{{person:ユーサー|우서 펜드래건}}이 세상을 떠난 뒤, 이 역시 {{person:マーリン|멀린}}이 걱정한 대로 온 왕국이 크나큰 혼란에 빠졌다. {{office:王|작은 왕}}들은 저마다 서로 패권을 다투었고, 사악한 {{office:騎士|기사}}들과 {{office:男爵|남작}}들은 제멋대로 길목을 약탈하며 힘없는 나그네들에게 잔혹하게 통행세를 거두었다. 어떤 나그네는 붙잡아 몸값을 받으려고 가두었고, 몸값을 낼 길이 없는 다른 이들은 죽여 버렸다. 그래서 무슨 볼일로든 길을 나서 보면 길가에 죽은 사람이 누워 있는 광경은 아주 흔했다. 그리하여 얼마 지나지 않아 그 비통한 땅은 짓누르는 환난으로 신음하게 되었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p7_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 7, "type": "本文", "raw_text": "Thus there passed nearly eighteen years in such great affliction, and then one day the Archbishop of Canterbury summoned Merlin to him and bespake him in this wise: “Merlin, men say that thou art the wisest man in all the world. Canst thou not find some means to heal the distractions of this woeful realm? Bend thou thy wisdom to this matter and choose thou a king who shall be a fit overlord for us, so that we may enjoy happiness of life once more as we did in the days of Uther-Pendragon.”", "translation": "こうして十八年近くもの間、大いなる苦難のうちに歳月が過ぎ、ある日、カンタベリー大司教がマーリンを呼び寄せて、こう語りかけた。「マーリンよ、人々はそなたを世界一の賢者と言っている。この嘆かわしい王国の混乱を癒す手立てを、何か見つけられないだろうか。そなたの知恵をこの件に傾け、我らにふさわしい覇王となる王を選んでくれ。そうすれば我らは、ユーサー・ペンドラゴンの時代のように、再び幸福な暮らしを享受できよう。」", "raw_tagged": "Thus there passed nearly eighteen years in such great affliction, and then one day the {{office:大司教|Archbishop}} of {{place:カンタベリー|Canterbury}} summoned {{person:マーリン|Merlin}} to him and bespake him in this wise: “{{person:マーリン|Merlin}}, men say that thou art the wisest man in all the world. Canst thou not find some means to heal the distractions of this woeful realm? Bend thou thy wisdom to this matter and choose thou a {{office:王|king}} who shall be a fit overlord for us, so that we may enjoy happiness of life once more as we did in the days of {{person:ユーサー|Uther-Pendragon}}.”", "translation_tagged": "こうして十八年近くもの間、大いなる苦難のうちに歳月が過ぎ、ある日、{{place:カンタベリー|カンタベリー}}{{office:大司教|大司教}}が{{person:マーリン|マーリン}}を呼び寄せて、こう語りかけた。「{{person:マーリン|マーリン}}よ、人々はそなたを世界一の賢者と言っている。この嘆かわしい王国の混乱を癒す手立てを、何か見つけられないだろうか。そなたの知恵をこの件に傾け、我らにふさわしい覇王となる{{office:王|王}}を選んでくれ。そうすれば我らは、{{person:ユーサー|ユーサー・ペンドラゴン}}の時代のように、再び幸福な暮らしを享受できよう。」", "persons": "ユーサー,マーリン", "places": "カンタベリー", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "就這樣，近十八年在極大的苦難中過去，然後有一天，坎特伯里大主教把梅林召到面前，對他說：「梅林，世人說你是天下最有智慧的人。你能否想出辦法，治癒這個悲慘王國的紛亂？請把你的智慧用在這件事上，為我們選出一位適合作為我們霸主的國王，使我們能像烏瑟·潘德拉剛的時代那樣，再次享有幸福的生活。」", "zh_tw_tagged": "就這樣，近十八年在極大的苦難中過去，然後有一天，{{place:カンタベリー|坎特伯里}}{{office:大司教|大主教}}把{{person:マーリン|梅林}}召到面前，對他說：「{{person:マーリン|梅林}}，世人說你是天下最有智慧的人。你能否想出辦法，治癒這個悲慘王國的紛亂？請把你的智慧用在這件事上，為我們選出一位適合作為我們霸主的{{office:王|國王}}，使我們能像{{person:ユーサー|烏瑟·潘德拉剛}}的時代那樣，再次享有幸福的生活。」", "zh_cn": "就这样，近十八年在极大的苦难中过去，然后有一天，坎特伯雷大主教把梅林召到面前，对他说：“梅林，世人说你是天下最有智慧的人。你能否想出办法，治愈这个悲惨王国的纷乱？请把你的智慧用在这件事上，为我们选出一位适合作为我们霸主的国王，使我们能像乌瑟·潘德拉刚的时代那样，再次享有幸福的生活。”", "zh_cn_tagged": "就这样，近十八年在极大的苦难中过去，然后有一天，{{place:カンタベリー|坎特伯雷}}{{office:大司教|大主教}}把{{person:マーリン|梅林}}召到面前，对他说：“{{person:マーリン|梅林}}，世人说你是天下最有智慧的人。你能否想出办法，治愈这个悲惨王国的纷乱？请把你的智慧用在这件事上，为我们选出一位适合作为我们霸主的{{office:王|国王}}，使我们能像{{person:ユーサー|乌瑟·潘德拉刚}}的时代那样，再次享有幸福的生活。”", "ko": "이렇게 거의 십팔 년이 크나큰 고난 속에 흘러갔고, 어느 날 캔터베리 대주교가 멀린을 불러 이렇게 말했다. “멀린, 사람들은 그대가 온 세상에서 가장 지혜로운 사람이라고 하오. 이 비통한 왕국의 혼란을 치유할 방도를 찾을 수 없겠소? 그대의 지혜를 이 일에 기울여, 우리에게 걸맞은 패왕이 될 왕을 골라 주시오. 그리하여 우리가 우서 펜드래건의 시대처럼 다시 행복한 삶을 누릴 수 있게 해 주시오.”", "ko_tagged": "이렇게 거의 십팔 년이 크나큰 고난 속에 흘러갔고, 어느 날 {{place:カンタベリー|캔터베리}} {{office:大司教|대주교}}가 {{person:マーリン|멀린}}을 불러 이렇게 말했다. “{{person:マーリン|멀린}}, 사람들은 그대가 온 세상에서 가장 지혜로운 사람이라고 하오. 이 비통한 왕국의 혼란을 치유할 방도를 찾을 수 없겠소? 그대의 지혜를 이 일에 기울여, 우리에게 걸맞은 패왕이 될 {{office:王|왕}}을 골라 주시오. 그리하여 우리가 {{person:ユーサー|우서 펜드래건}}의 시대처럼 다시 행복한 삶을 누릴 수 있게 해 주시오.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p8_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 8, "type": "本文", "raw_text": "Then Merlin lifted up his countenance upon the Archbishop, and spake in this wise: “My lord, the spirit of prophecy that lieth upon me sometimes moveth me now to say that I do perceive that this country is soon to have a king who shall be wiser and greater and more worthy of praise than was even Uther-Pendragon. And he shall bring order and peace where is now disorder and war. Moreover, I may tell you that this King shall be of Uther-Pendragon's own full blood-royal.”", "translation": "するとマーリンは大司教に顔を向け、こう語った。「我が主よ、時折私に宿る予言の霊が、今こう告げるのです。この国はまもなく、ユーサー・ペンドラゴンその人よりもなお賢く、偉大で、称賛に値する王を戴くことになると。その王は、今は無秩序と戦のあるところに、秩序と平和をもたらすでしょう。さらに申し上げておきますが、この王はユーサー・ペンドラゴン自身の、まじりけのない王家の血を引く者です。」", "raw_tagged": "Then {{person:マーリン|Merlin}} lifted up his countenance upon the {{office:大司教|Archbishop}}, and spake in this wise: “My lord, the spirit of {{special:予言|prophecy}} that lieth upon me sometimes moveth me now to say that I do perceive that this country is soon to have a {{office:王|king}} who shall be wiser and greater and more worthy of praise than was even {{person:ユーサー|Uther-Pendragon}}. And he shall bring order and peace where is now disorder and war. Moreover, I may tell you that this {{office:王|King}} shall be of {{person:ユーサー|Uther-Pendragon}}'s own full blood-royal.”", "translation_tagged": "するとマーリンは大司教に顔を向け、こう語った。「我が主よ、時折私に宿る{{special:予言|予言}}の霊が、今こう告げるのです。この国はまもなく、{{person:ユーサー|ユーサー・ペンドラゴン}}その人よりもなお賢く、偉大で、称賛に値する{{office:王|王}}を戴くことになると。その王は、今は無秩序と戦のあるところに、秩序と平和をもたらすでしょう。さらに申し上げておきますが、この{{office:王|王}}は{{person:ユーサー|ユーサー・ペンドラゴン}}自身の、まじりけのない王家の血を引く者です。」", "persons": "ユーサー,マーリン", "places": "", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "於是梅林抬起臉看著大主教，這樣說道：「我的大人，有時降臨在我身上的預言之靈，此刻促使我說：我看到這個國家不久將迎來一位國王，他比烏瑟·潘德拉剛本人更有智慧、更偉大、更值得稱頌。他將在如今混亂與戰爭之處帶來秩序與和平。此外我可以告訴您，這位國王將是烏瑟·潘德拉剛自己純正的王室血脈。」", "zh_tw_tagged": "於是{{person:マーリン|梅林}}抬起臉看著{{office:大司教|大主教}}，這樣說道：「我的大人，有時降臨在我身上的{{special:予言|預言}}之靈，此刻促使我說：我看到這個國家不久將迎來一位{{office:王|國王}}，他比{{person:ユーサー|烏瑟·潘德拉剛}}本人更有智慧、更偉大、更值得稱頌。他將在如今混亂與戰爭之處帶來秩序與和平。此外我可以告訴您，這位{{office:王|國王}}將是{{person:ユーサー|烏瑟·潘德拉剛}}自己純正的王室血脈。」", "zh_cn": "于是梅林抬起脸看着大主教，这样说道：“我的大人，有时降临在我身上的预言之灵，此刻促使我说：我看到这个国家不久将迎来一位国王，他比乌瑟·潘德拉刚本人更有智慧、更伟大、更值得称颂。他将在如今混乱与战争之处带来秩序与和平。此外我可以告诉您，这位国王将是乌瑟·潘德拉刚自己纯正的王室血脉。”", "zh_cn_tagged": "于是{{person:マーリン|梅林}}抬起脸看着{{office:大司教|大主教}}，这样说道：“我的大人，有时降临在我身上的{{special:予言|预言}}之灵，此刻促使我说：我看到这个国家不久将迎来一位{{office:王|国王}}，他比{{person:ユーサー|乌瑟·潘德拉刚}}本人更有智慧、更伟大、更值得称颂。他将在如今混乱与战争之处带来秩序与和平。此外我可以告诉您，这位{{office:王|国王}}将是{{person:ユーサー|乌瑟·潘德拉刚}}自己纯正的王室血脉。”", "ko": "그러자 멀린은 대주교에게 얼굴을 들어 이렇게 말했다. “나의 주교님, 이따금 제게 내리는 예언의 영이 지금 이렇게 말하라고 재촉합니다. 이 나라는 머지않아 우서 펜드래건보다도 더 지혜롭고 위대하며 칭송받을 만한 왕을 맞이하게 될 것이라고요. 그는 지금 무질서와 전쟁이 있는 곳에 질서와 평화를 가져올 것입니다. 또한 말씀드리자면, 이 왕은 우서 펜드래건 자신의 순수한 왕가의 혈통을 이은 자입니다.”", "ko_tagged": "그러자 {{person:マーリン|멀린}}은 {{office:大司教|대주교}}에게 얼굴을 들어 이렇게 말했다. “나의 주교님, 이따금 제게 내리는 {{special:予言|예언}}의 영이 지금 이렇게 말하라고 재촉합니다. 이 나라는 머지않아 {{person:ユーサー|우서 펜드래건}}보다도 더 지혜롭고 위대하며 칭송받을 만한 {{office:王|왕}}을 맞이하게 될 것이라고요. 그는 지금 무질서와 전쟁이 있는 곳에 질서와 평화를 가져올 것입니다. 또한 말씀드리자면, 이 {{office:王|왕}}은 {{person:ユーサー|우서 펜드래건}} 자신의 순수한 왕가의 혈통을 이은 자입니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v1_p9_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 9, "type": "本文", "raw_text": "To this the Archbishop said: “What thou tellest me, Merlin, is a wonderfully strange thing. But in this spirit of prophecy canst thou not foretell when this King is to come? And canst thou tell how we shall know him when he appeareth amongst us? For many lesser kings there are who would fain be overlord of this land, and many such there are who deem themselves fit to rule over all the others. How then shall we know the real King from those who may proclaim themselves to be the rightful king?”", "translation": "（順次翻訳・公開予定）", "raw_tagged": "To this the Archbishop said: “What thou tellest me, Merlin, is a wonderfully strange thing. But in this spirit of prophecy canst thou not foretell when this King is to come? And canst thou tell how we shall know him when he appeareth amongst us? For many lesser kings there are who would fain be overlord of this land, and many such there are who deem themselves fit to rule over all the others. How then shall we know the real King from those who may proclaim themselves to be the rightful king?”", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p10_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 10, "type": "本文", "raw_text": "“My lord Archbishop,” quoth Merlin, “if I have thy leave for to exert my magic I shall set an adventure which, if any man achieve it, all the world shall straightway know that he is the rightful King and overlord of this realm.” And to this the Archbishop said, “Merlin, I bid thee do whatsoever may seem to thee to be right in this affair.” And Merlin said, “I will do so.”", "translation": "（順次翻訳・公開予定）", "raw_tagged": "“My lord Archbishop,” quoth Merlin, “if I have thy leave for to exert my magic I shall set an adventure which, if any man achieve it, all the world shall straightway know that he is the rightful King and overlord of this realm.” And to this the Archbishop said, “Merlin, I bid thee do whatsoever may seem to thee to be right in this affair.” And Merlin said, “I will do so.”", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p11_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 11, "type": "本文", "raw_text": "So Merlin caused by magic that a huge marble stone, four square, should suddenly appear in an open place before the cathedral door. And upon this block of marble he caused it to be that there should stand an anvil and into the anvil he caused it that there should be thrust a great naked sword midway deep of the blade. And this sword was the most wonderful that any man had ever seen, for the blade was of blue steel and extraordinarily bright and glistering. And the hilt was of gold, chased and carved with marvellous cunning, and inlaid with a great number of precious stones, so that it shone with wonderful brightness in the sunlight. And about the sword were written these words in letters of gold:-", "translation": "（順次翻訳・公開予定）", "raw_tagged": "So Merlin caused by magic that a huge marble stone, four square, should suddenly appear in an open place before the cathedral door. And upon this block of marble he caused it to be that there should stand an anvil and into the anvil he caused it that there should be thrust a great naked sword midway deep of the blade. And this sword was the most wonderful that any man had ever seen, for the blade was of blue steel and extraordinarily bright and glistering. And the hilt was of gold, chased and carved with marvellous cunning, and inlaid with a great number of precious stones, so that it shone with wonderful brightness in the sunlight. And about the sword were written these words in letters of gold:-", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p12_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 12, "type": "本文", "raw_text": "“Whoso Pulleth Out this Sword from the AnvilThat same is Rightwise King- Born of England.”", "translation": "（順次翻訳・公開予定）", "raw_tagged": "“Whoso Pulleth Out this Sword from the AnvilThat same is Rightwise King- Born of England.”", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p13_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 13, "type": "本文", "raw_text": "So a great many people came and gazed upon that sword and marvelled at it exceedingly, for its like had never before been beheld upon the earth.", "translation": "（順次翻訳・公開予定）", "raw_tagged": "So a great many people came and gazed upon that sword and marvelled at it exceedingly, for its like had never before been beheld upon the earth.", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p14_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 14, "type": "本文", "raw_text": "Then, when Merlin had accomplished this miracle, he bade the Arch-bishop to call together all the chief people of that land upon Christmastide; and he bade the Archbishop to command that every man should make assay to draw out the sword, for that he who should succeed in drawing it forth out of the anvil should be rightwise King of Britain.", "translation": "（順次翻訳・公開予定）", "raw_tagged": "Then, when Merlin had accomplished this miracle, he bade the Arch-bishop to call together all the chief people of that land upon Christmastide; and he bade the Archbishop to command that every man should make assay to draw out the sword, for that he who should succeed in drawing it forth out of the anvil should be rightwise King of Britain.", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p15_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 15, "type": "本文", "raw_text": "So the Archbishop did according as Merlin said; and this was the marvel of the marble stone and the anvil, of which same anyone may easily read for himself in that book written a very long while ago by Robert de Boron, which is called Le Roman de Merlin.", "translation": "（順次翻訳・公開予定）", "raw_tagged": "So the Archbishop did according as Merlin said; and this was the marvel of the marble stone and the anvil, of which same anyone may easily read for himself in that book written a very long while ago by Robert de Boron, which is called Le Roman de Merlin.", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p16_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 16, "type": "本文", "raw_text": "Now when the mandate of the Lord Archbishop went forth, summoning all the chief people of the land to the assay of that miracle (for, indeed, it was a miracle to draw forth a sword-blade out of an anvil of solid iron), all the realm became immediately cast into a great ferment, so that each man asked his fellow, “Who shall draw forth that sword, and who shall be our King?” Some thought it would be King Lot and others thought it would be King Urien of Gore (these being the sons-in-law unto Uther-Pendragon); some thought that it would be King Leodegrance of Camiliard, and others that it would be King Ryence of North Wales; some thought it would be this king and others that it would be that king; for all the world was divided into different parties who thought according to their liking.", "translation": "（順次翻訳・公開予定）", "raw_tagged": "Now when the mandate of the Lord Archbishop went forth, summoning all the chief people of the land to the assay of that miracle (for, indeed, it was a miracle to draw forth a sword-blade out of an anvil of solid iron), all the realm became immediately cast into a great ferment, so that each man asked his fellow, “Who shall draw forth that sword, and who shall be our King?” Some thought it would be King Lot and others thought it would be King Urien of Gore (these being the sons-in-law unto Uther-Pendragon); some thought that it would be King Leodegrance of Camiliard, and others that it would be King Ryence of North Wales; some thought it would be this king and others that it would be that king; for all the world was divided into different parties who thought according to their liking.", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p17_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 17, "type": "本文", "raw_text": "Then, as Christmastide drew nigh, it presently appeared as though the entire world was wending its way to London Town, for the highways and the by-ways became filled with wayfarers - kings and lords and knights and ladies and esquires and pages and men-at-arms - all betaking their way whither the assay was to be made of that adventure of the sword and the anvil. Every inn and castle was filled so full of travellers that it was a marvel how so many folk could be contained within their compass, and everywhere were tents and pavilions pitched along the wayside for the accommodation of those who could not find shelter within doors.", "translation": "（順次翻訳・公開予定）", "raw_tagged": "Then, as Christmastide drew nigh, it presently appeared as though the entire world was wending its way to London Town, for the highways and the by-ways became filled with wayfarers - kings and lords and knights and ladies and esquires and pages and men-at-arms - all betaking their way whither the assay was to be made of that adventure of the sword and the anvil. Every inn and castle was filled so full of travellers that it was a marvel how so many folk could be contained within their compass, and everywhere were tents and pavilions pitched along the wayside for the accommodation of those who could not find shelter within doors.", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p18_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 18, "type": "本文", "raw_text": "But when the Archbishop beheld the multitudes that were assembling, he said to Merlin, “Indeed, Merlin, it would be a very singular thing if among all these great kings and noble, honorable lords we should not find some one worthy of being the King of this realm.”", "translation": "（順次翻訳・公開予定）", "raw_tagged": "But when the Archbishop beheld the multitudes that were assembling, he said to Merlin, “Indeed, Merlin, it would be a very singular thing if among all these great kings and noble, honorable lords we should not find some one worthy of being the King of this realm.”", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p19_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 19, "type": "本文", "raw_text": "Unto which the Merlin smiled and said, “Marvel not, my lord, if among all those who appear to be so extraordinarily worthy there shall not be found one who is worthy; and marvel not if, among all those who are unknown, there shall arise one who shall approve himself to be entirely worthy.”", "translation": "（順次翻訳・公開予定）", "raw_tagged": "Unto which the Merlin smiled and said, “Marvel not, my lord, if among all those who appear to be so extraordinarily worthy there shall not be found one who is worthy; and marvel not if, among all those who are unknown, there shall arise one who shall approve himself to be entirely worthy.”", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}, {"id": "v1_p20_1", "volume": 1, "book": "第一巻", "section_title": "序章　ユーサー王とマーリン", "para_index": 20, "type": "本文", "raw_text": "And the Archbishop pondered Merlin's words, and so beginneth this story.", "translation": "（順次翻訳・公開予定）", "raw_tagged": "And the Archbishop pondered Merlin's words, and so beginneth this story.", "translation_tagged": "（順次翻訳・公開予定）", "persons": "", "places": "", "offices": "", "era_year": "", "keywords": "", "is_enriched": false}];
