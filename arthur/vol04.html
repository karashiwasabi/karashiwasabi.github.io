e. So, at the King's behest, I and another took the young child from his mother and gave him unto a third, and that man received the kingly child and maintained him ever since as his own son. And as to the truth of these things there are others here who may attest the verity of them-for he who was with me when the young child was taken from his mother was Sir Ulfius, and he to whom he was entrusted was Sir Ector of Bonmaison-and those two witnesses, who are without any reproach, will avouch to the verity of that which I have asserted, for here they stand before thee to certify unto what I have said.\"", "translation": "これに対してマーリンはこう答えた。「今日この時に至るまで、ごくわずかな少数の者を除いては、誰一人としてそのような事の次第を知る者はおりませんでした。と申しますのも、事の経緯はかようでございました――この子がこの世に生まれ落ちた折、私の上に予言の霊が降り、ユーサー・ペンドラゴンがさほど遠からぬうちに崩御されるであろうことを予見したのでございます。それゆえ私は、王の敵どもがその世継ぎの権利を狙って幼子に乱暴な手をかけるのではないかと危惧いたしました。そこで王の御命により、私ともう一人の者とがその幼子を母君の御許から引き取って第三の人物へと託し、その人物は王統の幼子を受け入れて以来、今日までずっと己の実の息子として養育して参ったのでございます。そしてこれらの事柄の真偽につきましては、その真実なることを証言し得る者たちがこの場におりまする――すなわち、幼子が母君の御許から引き取られた折に私とともにおりましたのがウルフィアス卿であり、その幼子を託されましたのがボンメゾンのエクター卿にございます。一点の非の打ちどころもなきこの二人の証人が、私の申し立てました事柄の真実なることを保証いたしましょう。ほかならぬその二人が今ここにあなたの御前に立ち、私の申したことを確かに証し立てようとしておりまする。」", "raw_tagged": "Unto this {{person:マーリン|Merlin}} made reply: \"No one hath ever known of such a thing until now, only a very few. For it was in this wise: When this child was born the {{special:予言|spirit of prophecy}} lay upon me and I foresaw that {{person:ユーサー|Uther-Pendragon}} would die before a very great while. Wherefore I feared that the enemies of the {{office:王|King}} would lay violent hands upon the young child for the sake of his inheritance. So, at the {{office:王|King}}'s behest, I and another took the young child from his mother and gave him unto a third, and that man received the kingly child and maintained him ever since as his own son. And as to the truth of these things there are others here who may attest the verity of them-for he who was with me when the young child was taken from his mother was {{person:ウルフィアス|Sir Ulfius}}, and he to whom he was entrusted was {{person:エクター|Sir Ector}} of Bonmaison-and those two witnesses, who are without any reproach, will avouch to the verity of that which I have asserted, for here they stand before thee to certify unto what I have said.\"", "translation_tagged": "これに対して{{person:マーリン|マーリン}}はこう答えた。「今日この時に至るまで、ごくわずかな少数の者を除いては、誰一人としてそのような事の次第を知る者はおりませんでした。と申しますのも、事の経緯はかようでございました――この子がこの世に生まれ落ちた折、私の上に{{special:予言|予言の霊}}が降り、{{person:ユーサー|ユーサー・ペンドラゴン}}がさほど遠からぬうちに崩御されるであろうことを予見したのでございます。それゆえ私は、{{office:王|王}}の敵どもがその世継ぎの権利を狙って幼子に乱暴な手をかけるのではないかと危惧いたしました。そこで{{office:王|王}}の御命により、私ともう一人の者とがその幼子を母君の御許から引き取って第三の人物へと託し、その人物は王統の幼子を受け入れて以来、今日までずっと己の実の息子として養育して参ったのでございます。そしてこれらの事柄の真偽につきましては、その真実なることを証言し得る者たちがこの場におりまする――すなわち、幼子が母君の御許から引き取られた折に私とともにおりましたのが{{person:ウルフィアス|ウルフィアス卿}}であり、その幼子を託されましたのがボンメゾンの{{person:エクター|エクター卿}}にございます。一点の非の打ちどころもなきこの二人の証人が、私の申し立てました事柄の真実なることを保証いたしましょう。ほかならぬその二人が今ここにあなたの御前に立ち、私の申したことを確かに証し立てようとしておりまする。」", "persons": "マーリン,ユーサー,ウルフィアス,エクター", "places": "", "offices": "王", "era_year": "伝説時代", "keywords": "予言", "is_enriched": true, "zh_tw": "對此，梅林回答道：「直到今日之前，除了極少數幾個人之外，從無任何人知曉此事。因為事情的原委是這樣的：當這孩子降生之時，預言之靈降臨在我身上，使我預見到烏瑟·潘德拉剛不久於人世。因此我深恐國王的仇敵會為了他的繼承權而對這幼童痛下毒手。於是奉國王之命，我與另一人將這幼童從他母親身邊抱走，交託給第三個人；那人接過這位王室幼子，自那以後便一直將他視如己出地撫養至今。至於這些事情的真偽，在場另有他人可以證明其確鑿無疑——因為當這幼童從母親身邊被抱走時，與我同在的正是烏爾菲烏斯爵士，而受託撫養他的則是邦梅宗的艾克托爵士——這兩位無可指摘的見證人，必將擔保我所陳述之事千真萬確，因為他們此刻就站在您的面前，親自印證我方才所說的話。」", "zh_tw_tagged": "對此，{{person:マーリン|梅林}}回答道：「直到今日之前，除了極少數幾個人之外，從無任何人知曉此事。因為事情的原委是這樣的：當這孩子降生之時，{{special:予言|預言之靈}}降臨在我身上，使我預見到{{person:ユーサー|烏瑟·潘德拉剛}}不久於人世。因此我深恐{{office:王|國王}}的仇敵會為了他的繼承權而對這幼童痛下毒手。於是奉{{office:王|國王}}之命，我與另一人將這幼童從他母親身邊抱走，交託給第三個人；那人接過這位王室幼子，自那以後便一直將他視如己出地撫養至今。至於這些事情的真偽，在場另有他人可以證明其確鑿無疑——因為當這幼童從母親身邊被抱走時，與我同在的正是{{person:ウルフィアス|烏爾菲烏斯爵士}}，而受託撫養他的則是邦梅宗的{{person:エクター|艾克托爵士}}——這兩位無可指摘的見證人，必將擔保我所陳述之事千真萬確，因為他們此刻就站在您的面前，親自印證我方才所說的話。」", "zh_cn": "对此，梅林回答道：“直到今日之前，除了极少数几个人之外，从无任何人知晓此事。因为事情的原委是这样的：当这孩子降生之时，预言之灵降临在我身上，使我预见到乌瑟·潘德拉刚不久于人世。因此我深恐国王的仇敌会为了他的继承权而对这幼童痛下毒手。于是奉国王之命，我与另一人将这幼童从他母亲身边抱走，交托给第三个人；那人接过这位王室幼子，自那以后便一直将他视如己出地抚养至今。至于这些事情的真伪，在场另有他人可以证明其确凿无疑——因为当这幼童从母亲身边被抱走时，与我同在的正是乌尔菲乌斯爵士，而受托抚养他的则是邦梅宗的艾克托爵士——这两位无可指摘的见证人，必将担保我所陈述之事千真万确，因为他们此刻就站在您的面前，亲自印证我方才所说的话。”", "zh_cn_tagged": "对此，{{person:マーリン|梅林}}回答道：“直到今日之前，除了极少数几个人之外，从无任何人知晓此事。因为事情的原委是这样的：当这孩子降生之时，{{special:予言|预言之灵}}降临在我身上，使我预见到{{person:ユーサー|乌瑟·潘德拉刚}}不久于人世。因此我深恐{{office:王|国王}}的仇敌会为了他的继承权而对这幼童痛下毒手。于是奉{{office:王|国王}}之命，我与另一人将这幼童从他母亲身边抱走，交托给第三个人；那人接过这位王室幼子，自那以后便一直将他视如己出地抚养至今。至于这些事情的真伪，在场另有他人可以证明其确凿无疑——因为当这幼童从母亲身边被抱走时，与我同在的正是{{person:ウルフィアス|乌尔菲乌斯爵士}}，而受托抚养他的则是邦梅宗的{{person:エクター|艾克托爵士}}——这两位无可指摘的见证人，必将担保我所陈述之事千真万确，因为他们此刻就站在您的面前，亲自印证我方才所说的话。”", "ko": "이에 멀린이 대답하였다. “지금까지는 극소수의 몇 사람을 빼고는 아무도 그러한 일을 알지 못했습니다. 사연인즉 이러하였습니다. 이 아이가 태어났을 때 내게 예언의 영이 임하여, 나는 우서 펜드래건께서 그리 머지않아 세상을 떠나시리라는 것을 미리 내다보았습니다. 그러므로 나는 왕의 원수들이 그 계승권을 노리고 어린아이에게 모진 손을 댈까 두려워했습니다. 그리하여 왕의 명을 받들어 나와 또 한 사람이 그 어린아이를 어머니 품에서 데려다가 제삼자에게 맡겼고, 그 사람이 왕가의 어린아이를 받아들여 그때부터 지금까지 줄곧 친아들처럼 길러 왔습니다. 그리고 이 일들의 진실함에 관해서는 그것이 참됨을 증언해 줄 다른 이들이 이 자리에 있습니다. 어린아이를 어머니에게서 데려올 때 나와 함께 있었던 이가 바로 울피우스 경이요, 그 아이를 위탁받은 이가 바로 봉메종의 엑터 경이니, 한 점 나무랄 데 없는 이 두 증인이 내가 단언한 바가 진실임을 보증할 것입니다. 지금 그들이 내가 한 말을 확증하고자 바로 그대 앞에 서 있습니다.”", "ko_tagged": "이에 {{person:マーリン|멀린}}이 대답하였다. “지금까지는 극소수의 몇 사람을 빼고는 아무도 그러한 일을 알지 못했습니다. 사연인즉 이러하였습니다. 이 아이가 태어났을 때 내게 {{special:予言|예언의 영}}이 임하여, 나는 {{person:ユーサー|우서 펜드래건}}께서 그리 머지않아 세상을 떠나시리라는 것을 미리 내다보았습니다. 그러므로 나는 {{office:王|왕}}의 원수들이 그 계승권을 노리고 어린아이에게 모진 손을 댈까 두려워했습니다. 그리하여 {{office:王|왕}}의 명을 받들어 나와 또 한 사람이 그 어린아이를 어머니 품에서 데려다가 제삼자에게 맡겼고, 그 사람이 왕가의 어린아이를 받아들여 그때부터 지금까지 줄곧 친아들처럼 길러 왔습니다. 그리고 이 일들의 진실함에 관해서는 그것이 참됨을 증언해 줄 다른 이들이 이 자리에 있습니다. 어린아이를 어머니에게서 데려올 때 나와 함께 있었던 이가 바로 {{person:ウルフィアス|울피우스 경}}이요, 그 아이를 위탁받은 이가 바로 봉메종의 {{person:エクター|엑터 경}}이니, 한 점 나무랄 데 없는 이 두 증인이 내가 단언한 바가 진실임을 보증할 것입니다. 지금 그들이 내가 한 말을 확증하고자 바로 그대 앞에 서 있습니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p17_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 17, "type": "本文", "raw_text": "And Sir Ulfius and Sir Ector said, \"All that Merlin hath spoken is true, and thereunto we do pledge our most faithful and sacred word of honor.\"", "translation": "するとウルフィアス卿とエクター卿も進み出て言った。「マーリンが語ったことはすべて真実であり、そのことに対して我らは最も忠実にして神聖なる名誉の誓言を懸けてお請け合いいたします。」", "raw_tagged": "And {{person:ウルフィアス|Sir Ulfius}} and {{person:エクター|Sir Ector}} said, \"All that {{person:マーリン|Merlin}} hath spoken is true, and thereunto we do pledge our most faithful and sacred word of honor.\"", "translation_tagged": "すると{{person:ウルフィアス|ウルフィアス卿}}と{{person:エクター|エクター卿}}も進み出て言った。「{{person:マーリン|マーリン}}が語ったことはすべて真実であり、そのことに対して我らは最も忠実にして神聖なる名誉の誓言を懸けてお請け合いいたします。」", "persons": "ウルフィアス,エクター,マーリン", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "烏爾菲烏斯爵士與艾克托爵士隨即說道：「梅林所言句句屬實，我們謹以最忠誠而神聖的名譽立誓為證。」", "zh_tw_tagged": "{{person:ウルフィアス|烏爾菲烏斯爵士}}與{{person:エクター|艾克托爵士}}隨即說道：「{{person:マーリン|梅林}}所言句句屬實，我們謹以最忠誠而神聖的名譽立誓為證。」", "zh_cn": "乌尔菲乌斯爵士与艾克托爵士随即说道：“梅林所言句句属实，我们谨以最忠诚而神圣的名誉立誓为证。”", "zh_cn_tagged": "{{person:ウルフィアス|乌尔菲乌斯爵士}}与{{person:エクター|艾克托爵士}}随即说道：“{{person:マーリン|梅林}}所言句句属实，我们谨以最忠诚而神圣的名誉立誓为证。”", "ko": "그러자 울피우스 경과 엑터 경이 말했다. “멀린이 말한 모든 것은 진실이며, 이에 우리는 가장 충실하고도 신성한 명예의 말씀을 걸고 맹세합니다.”", "ko_tagged": "그러자 {{person:ウルフィアス|울피우스 경}}과 {{person:エクター|엑터 경}}이 말했다. “{{person:マーリン|멀린}}이 말한 모든 것은 진실이며, 이에 우리는 가장 충실하고도 신성한 명예의 말씀을 걸고 맹세합니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p18_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 18, "type": "本文", "raw_text": "Then the Archbishop said, \"Who is there may doubt the word of such honorable witnesses?\" And he looked upon Arthur and smiled upon him.", "translation": "そこで大司教は言った。「これほどまでに誉れ高き証人たちの言葉を、いったい誰が疑い得ようか？」そう言って彼はアーサーを見つめ、穏やかに微笑みかけた。", "raw_tagged": "Then the {{office:大司教|Archbishop}} said, \"Who is there may doubt the word of such honorable witnesses?\" And he looked upon {{person:アーサー|Arthur}} and smiled upon him.", "translation_tagged": "そこで{{office:大司教|大司教}}は言った。「これほどまでに誉れ高き証人たちの言葉を、いったい誰が疑い得ようか？」そう言って彼は{{person:アーサー|アーサー}}を見つめ、穏やかに微笑みかけた。", "persons": "アーサー", "places": "", "offices": "大司教", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是大主教說道：「面對如此尊貴可信的見證人，又有誰能懷疑他們的話呢？」說罷，他注視著亞瑟，向他露出了微笑。", "zh_tw_tagged": "於是{{office:大司教|大主教}}說道：「面對如此尊貴可信的見證人，又有誰能懷疑他們的話呢？」說罷，他注視著{{person:アーサー|亞瑟}}，向他露出了微笑。", "zh_cn": "于是大主教说道：“面对如此尊贵可信的见证人，又有谁能怀疑他们的话呢？”说罢，他注视着亚瑟，向他露出了微笑。", "zh_cn_tagged": "于是{{office:大司教|大主教}}说道：“面对如此尊贵可信的见证人，又有谁能怀疑他们的话呢？”说罢，他注视着{{person:アーサー|亚瑟}}，向他露出了微笑。", "ko": "그러자 대주교가 말했다. “이토록 명예로운 증인들의 말을 감히 의심할 자가 어디에 있겠는가?” 그리고 그는 아서를 바라보며 온화하게 미소를 지어 보였다.", "ko_tagged": "그러자 {{office:大司教|대주교}}가 말했다. “이토록 명예로운 증인들의 말을 감히 의심할 자가 어디에 있겠는가?” 그리고 그는 {{person:アーサー|아서}}를 바라보며 온화하게 미소를 지어 보였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p19_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 19, "type": "本文", "raw_text": "Then Arthur said, \"Have I then thy leave, Lord, to handle yonder sword?\" And the Archbishop said, \"Thou hast my leave, and may the grace of God go with thee to do thy endeavor.\"", "translation": "するとアーサーは言った。「それでは尊師よ、あそこなる剣に手を触れるお許しをいただけますでしょうか？」大司教は言った。「許しを与えよう。そなたがその試みを成し遂げるにあたり、神の御恵みがそなたとともにあらんことを。」", "raw_tagged": "Then {{person:アーサー|Arthur}} said, \"Have I then thy leave, Lord, to handle yonder sword?\" And the {{office:大司教|Archbishop}} said, \"Thou hast my leave, and may the grace of God go with thee to do thy endeavor.\"", "translation_tagged": "すると{{person:アーサー|アーサー}}は言った。「それでは尊師よ、あそこなる剣に手を触れるお許しをいただけますでしょうか？」{{office:大司教|大司教}}は言った。「許しを与えよう。そなたがその試みを成し遂げるにあたり、神の御恵みがそなたとともにあらんことを。」", "persons": "アーサー", "places": "", "offices": "大司教", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "接著亞瑟問道：「尊座，那麼我是否獲您准許，去握試那把寶劍呢？」大主教說道：「我准許你，願上帝的恩典與你同在，助你完成這番嘗試。」", "zh_tw_tagged": "接著{{person:アーサー|亞瑟}}問道：「尊座，那麼我是否獲您准許，去握試那把寶劍呢？」{{office:大司教|大主教}}說道：「我准許你，願上帝的恩典與你同在，助你完成這番嘗試。」", "zh_cn": "接着亚瑟问道：“尊座，那么我是否获您准许，去握试那把宝剑呢？”大主教说道：“我准许你，愿上帝的恩典与你同在，助你完成这番尝试。”", "zh_cn_tagged": "接着{{person:アーサー|亚瑟}}问道：“尊座，那么我是否获您准许，去握试那把宝剑呢？”{{office:大司教|大主教}}说道：“我准许你，愿上帝的恩典与你同在，助你完成这番尝试。”", "ko": "이에 아서가 물었다. “그렇다면 존귀하신 분이여, 제가 저 검에 손을 대어도 좋다는 허락을 주시는 것입니까?” 대주교가 대답했다. “내 허락을 주노라. 그대가 그 과업을 이루는 데에 하느님의 은총이 함께하기를 축원하노라.”", "ko_tagged": "이에 {{person:アーサー|아서}}가 물었다. “그렇다면 존귀하신 분이여, 제가 저 검에 손을 대어도 좋다는 허락을 주시는 것입니까?” {{office:大司教|대주교}}가 대답했다. “내 허락을 주노라. 그대가 그 과업을 이루는 데에 하느님의 은총이 함께하기를 축원하노라.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p20_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 20, "type": "本文", "raw_text": "Thereupon Arthur went to the cube of marble stone and he laid his hands upon the haft of the sword that was thrust into the anvil. And he bent his body and drew very strongly and, to! the sword came forth with great ease and very smoothly. And when he had got the sword into his hands, he swung it about his head so that it flashed like lightning. And after he had swung it thus thrice about his head, he set the point thereof against the face of the anvil and bore upon it very strongly, and, behold! the sword slid very smoothly back again into that place where it had aforetime stood; and when it was there, midway deep, it stood fast where it was. And thus did Arthur successfully accomplish that marvellous miracle of the sword in the eyes of all the world.", "translation": "そこでアーサーは四角い大理石の台石へと歩み寄り、金床に突き立てられていた剣の柄に両手をかけた。そして身をかがめて力強く引き抜くと、見よ！ 剣はいともたやすく、まことになめらかに抜け出たのである。その剣を両手に握りしめるや、彼は頭上でぐるりと打ち振ったので、刃は稲妻のごとくきらめき光った。こうして頭上で三たび剣を打ち振ったのち、彼はその切っ先を金床の表面に当てがい、渾身の力を込めて押し込んだ。すると見よ！ 剣は以前立っていたその場所へと、再びまことになめらかに滑り入っていき、半ばの深さまで達したところで、元のとおりぴたりと堅固に突き立った。かくしてアーサーは、全世界の目の前でかの驚くべき剣の奇跡を見事に成し遂げたのである。", "raw_tagged": "Thereupon {{person:アーサー|Arthur}} went to the cube of marble stone and he laid his hands upon the haft of the sword that was thrust into the anvil. And he bent his body and drew very strongly and, to! the sword came forth with great ease and very smoothly. And when he had got the sword into his hands, he swung it about his head so that it flashed like lightning. And after he had swung it thus thrice about his head, he set the point thereof against the face of the anvil and bore upon it very strongly, and, behold! the sword slid very smoothly back again into that place where it had aforetime stood; and when it was there, midway deep, it stood fast where it was. And thus did {{person:アーサー|Arthur}} successfully accomplish that marvellous miracle of the sword in the eyes of all the world.", "translation_tagged": "そこで{{person:アーサー|アーサー}}は四角い大理石の台石へと歩み寄り、金床に突き立てられていた剣の柄に両手をかけた。そして身をかがめて力強く引き抜くと、見よ！ 剣はいともたやすく、まことになめらかに抜け出たのである。その剣を両手に握りしめるや、彼は頭上でぐるりと打ち振ったので、刃は稲妻のごとくきらめき光った。こうして頭上で三たび剣を打ち振ったのち、彼はその切っ先を金床の表面に当てがい、渾身の力を込めて押し込んだ。すると見よ！ 剣は以前立っていたその場所へと、再びまことになめらかに滑り入っていき、半ばの深さまで達したところで、元のとおりぴたりと堅固に突き立った。かくして{{person:アーサー|アーサー}}は、全世界の目の前でかの驚くべき剣の奇跡を見事に成し遂げたのである。", "persons": "アーサー", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是亞瑟走到立方大理石座前，將雙手握在插於鐵砧中的寶劍劍柄上。他俯下身軀，奮力往上一拔，看哪！那把寶劍竟極其輕鬆而又無比順滑地應手而出。當他將寶劍握在手中後，便在頭頂揮舞起來，劍光頓時如閃電般耀眼奪目。就這樣在頭頂揮舞了三圈之後，他將劍尖抵住鐵砧表面，使出渾身力氣往下猛壓；看哪！那把寶劍又無比順滑地重新滑回它先前矗立的原處，待深入到一半時，便在原位穩穩立定、紋絲不動。就這樣，亞瑟在舉世眾人的注視下，圓滿完成了那場不可思議的寶劍奇蹟。", "zh_tw_tagged": "於是{{person:アーサー|亞瑟}}走到立方大理石座前，將雙手握在插於鐵砧中的寶劍劍柄上。他俯下身軀，奮力往上一拔，看哪！那把寶劍竟極其輕鬆而又無比順滑地應手而出。當他將寶劍握在手中後，便在頭頂揮舞起來，劍光頓時如閃電般耀眼奪目。就這樣在頭頂揮舞了三圈之後，他將劍尖抵住鐵砧表面，使出渾身力氣往下猛壓；看哪！那把寶劍又無比順滑地重新滑回它先前矗立的原處，待深入到一半時，便在原位穩穩立定、紋絲不動。就這樣，{{person:アーサー|亞瑟}}在舉世眾人的注視下，圓滿完成了那場不可思議的寶劍奇蹟。", "zh_cn": "于是亚瑟走到立方大理石座前，将双手握在插于铁砧中的宝剑剑柄上。他俯下身躯，奋力往上一拔，看哪！那把宝剑竟极其轻松而又无比顺滑地应手而出。当他将宝剑握在手中后，便在头顶挥舞起来，剑光顿时如闪电般耀眼夺目。就这样在头顶挥舞了三圈之后，他将剑尖抵住铁砧表面，使出浑身力气往下猛压；看哪！那把宝剑又无比顺滑地重新滑回它先前矗立的原处，待深入到一半时，便在原位稳稳立定、纹丝不动。就这样，亚瑟在举世众人的注视下，圆满完成了那场不可思议的宝剑奇迹。", "zh_cn_tagged": "于是{{person:アーサー|亚瑟}}走到立方大理石座前，将双手握在插于铁砧中的宝剑剑柄上。他俯下身躯，奋力往上一拔，看哪！那把宝剑竟极其轻松而又无比顺滑地应手而出。当他将宝剑握在手中后，便在头顶挥舞起来，剑光顿时如闪电般耀眼夺目。就这样在头顶挥舞了三圈之后，他将剑尖抵住铁砧表面，使出浑身力气往下猛压；看哪！那把宝剑又无比顺滑地重新滑回它先前矗立的原处，待深入到一半时，便在原位稳稳立定、纹丝不动。就这样，{{person:アーサー|亚瑟}}在举世众人的注视下，圆满完成了那场不可思议的宝剑奇迹。", "ko": "그리하여 아서는 네모난 대리석 돌 앞으로 나아가 모루에 꽂혀 있던 검의 자루에 두 손을 얹었다. 그리고 몸을 굽혀 매우 힘차게 잡아당기자, 보라! 검이 지극히 쉽사리, 그리고 더없이 매끄럽게 빠져나왔다. 검을 두 손에 거머쥔 그는 머리 위로 그것을 휘둘렀는데, 칼날이 번개처럼 번쩍이며 빛을 발하였다. 그렇게 머리 위로 세 번 검을 휘두른 뒤, 그는 칼끝을 모루의 윗면에 대고 매우 힘껏 내리눌렀다. 그러자 보라! 검이 이전에 서 있던 바로 그 자리로 다시금 더없이 매끄럽게 미끄러져 들어가더니, 절반쯤 깊이 들어간 곳에서 본래 있던 그대로 단단히 멈추어 섰다. 이리하여 아서는 온 세상이 지켜보는 눈앞에서 저 놀라운 검의 기적을 훌륭히 성취해 내었다.", "ko_tagged": "그리하여 {{person:アーサー|아서}}는 네모난 대리석 돌 앞으로 나아가 모루에 꽂혀 있던 검의 자루에 두 손을 얹었다. 그리고 몸을 굽혀 매우 힘차게 잡아당기자, 보라! 검이 지극히 쉽사리, 그리고 더없이 매끄럽게 빠져나왔다. 검을 두 손에 거머쥔 그는 머리 위로 그것을 휘둘렀는데, 칼날이 번개처럼 번쩍이며 빛을 발하였다. 그렇게 머리 위로 세 번 검을 휘두른 뒤, 그는 칼끝을 모루의 윗면에 대고 매우 힘껏 내리눌렀다. 그러자 보라! 검이 이전에 서 있던 바로 그 자리로 다시금 더없이 매끄럽게 미끄러져 들어가더니, 절반쯤 깊이 들어간 곳에서 본래 있던 그대로 단단히 멈추어 섰다. 이리하여 {{person:アーサー|아서}}는 온 세상이 지켜보는 눈앞에서 저 놀라운 검의 기적을 훌륭히 성취해 내었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p21_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 21, "type": "本文", "raw_text": "Now when the people who were congregated at that place beheld this miracle performed before their faces, they lifted up their voices all together, and shouted so vehemently and with so huge a tumult of outcry that it was as though the whole earth rocked and trembled with the sound of their shouting.", "translation": "さて、その場に集まっていた群衆は、目の前でこの奇跡が成し遂げられるのを目の当たりにするや、一斉に声を張り上げ、あまりにも激しく、また途方もない大歓声のどよめきをもって叫び立てたので、さながら大地全体がその歓呼の響きによって揺れ動き震えるかと思われるほどであった。", "raw_tagged": "Now when the people who were congregated at that place beheld this miracle performed before their faces, they lifted up their voices all together, and shouted so vehemently and with so huge a tumult of outcry that it was as though the whole earth rocked and trembled with the sound of their shouting.", "translation_tagged": "さて、その場に集まっていた群衆は、目の前でこの奇跡が成し遂げられるのを目の当たりにするや、一斉に声を張り上げ、あまりにも激しく、また途方もない大歓声のどよめきをもって叫び立てたので、さながら大地全体がその歓呼の響きによって揺れ動き震えるかと思われるほどであった。", "persons": "", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "聚集在那裡的百姓親眼目睹這場奇蹟在自己面前實現，頓時齊聲高呼，吶喊得如此激昂熱烈，歡呼喧騰之聲如此震天動地，彷彿整個大地都在他們的呼喊聲中搖晃震顫一般。", "zh_tw_tagged": "聚集在那裡的百姓親眼目睹這場奇蹟在自己面前實現，頓時齊聲高呼，吶喊得如此激昂熱烈，歡呼喧騰之聲如此震天動地，彷彿整個大地都在他們的呼喊聲中搖晃震顫一般。", "zh_cn": "聚集在那里的百姓亲眼目睹这场奇迹在自己面前实现，顿时齐声高呼，呐喊得如此激昂热烈，欢呼喧腾之声如此震天动地，仿佛整个大地都在他们的呼喊声中摇晃震颤一般。", "zh_cn_tagged": "聚集在那里的百姓亲眼目睹这场奇迹在自己面前实现，顿时齐声高呼，呐喊得如此激昂热烈，欢呼喧腾之声如此震天动地，仿佛整个大地都在他们的呼喊声中摇晃震颤一般。", "ko": "그곳에 모여 있던 백성들은 바로 자기들 눈앞에서 이 기적이 이루어지는 광경을 목격하자 일제히 목청을 높여 외쳤는데, 어찌나 격렬하고도 엄청난 함성의 소용돌이로 소리쳐 부르짖었던지 마치 온 대지가 그들의 외침 소리에 뒤흔들리고 떨리는 듯하였다.", "ko_tagged": "그곳에 모여 있던 백성들은 바로 자기들 눈앞에서 이 기적이 이루어지는 광경을 목격하자 일제히 목청을 높여 외쳤는데, 어찌나 격렬하고도 엄청난 함성의 소용돌이로 소리쳐 부르짖었던지 마치 온 대지가 그들의 외침 소리에 뒤흔들리고 떨리는 듯하였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p22_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 22, "type": "本文", "raw_text": "And whiles they so shouted Arthur took hold of the sword again and drew it forth and swung it again, and again drave it back into the anvil. And when he had done that he drew it forth a third time and did the same thing as before. Thus it was that all those who were there beheld that miracle performed three times over.", "translation": "人々がそのように歓声を上げ続けるさなか、アーサーは再び剣の柄を握って引き抜き、再び頭上に打ち振っては、またしても金床の中へと突き戻した。そしてそれを終えると、三たび剣を引き抜き、前とまったく同じことをやってのけた。かくしてその場に居合わせたすべての人々が、かの奇跡が三度までも繰り返されるのをその目で確かに見届けたのである。", "raw_tagged": "And whiles they so shouted {{person:アーサー|Arthur}} took hold of the sword again and drew it forth and swung it again, and again drave it back into the anvil. And when he had done that he drew it forth a third time and did the same thing as before. Thus it was that all those who were there beheld that miracle performed three times over.", "translation_tagged": "人々がそのように歓声を上げ続けるさなか、{{person:アーサー|アーサー}}は再び剣の柄を握って引き抜き、再び頭上に打ち振っては、またしても金床の中へと突き戻した。そしてそれを終えると、三たび剣を引き抜き、前とまったく同じことをやってのけた。かくしてその場に居合わせたすべての人々が、かの奇跡が三度までも繰り返されるのをその目で確かに見届けたのである。", "persons": "アーサー", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "正當眾人如此高聲歡呼之際，亞瑟再度握住寶劍將它拔出，再次揮舞一番，又再度將它刺回鐵砧之中。做完之後，他第三次拔出寶劍，照著先前的樣子重做了一遍。就這樣，在場的所有人都親眼目睹那場奇蹟接連展現了整整三次。", "zh_tw_tagged": "正當眾人如此高聲歡呼之際，{{person:アーサー|亞瑟}}再度握住寶劍將它拔出，再次揮舞一番，又再度將它刺回鐵砧之中。做完之後，他第三次拔出寶劍，照著先前的樣子重做了一遍。就這樣，在場的所有人都親眼目睹那場奇蹟接連展現了整整三次。", "zh_cn": "正当众人如此高声欢呼之际，亚瑟再度握住宝剑将它拔出，再次挥舞一番，又再度将它刺回铁砧之中。做完之后，他第三次拔出宝剑，照着先前的样子重做了一遍。就这样，在场的所有人都亲眼目睹那场奇迹接连展现了整整三次。", "zh_cn_tagged": "正当众人如此高声欢呼之际，{{person:アーサー|亚瑟}}再度握住宝剑将它拔出，再次挥舞一番，又再度将它刺回铁砧之中。做完之后，他第三次拔出宝剑，照着先前的样子重做了一遍。就这样，在场的所有人都亲眼目睹那场奇迹接连展现了整整三次。", "ko": "백성들이 그처럼 함성을 지르는 동안에도 아서는 다시 검을 붙잡아 뽑아 들고 또 한 번 휘두른 뒤, 다시 모루 속으로 깊숙이 꽂아 넣었다. 그리고 그렇게 한 뒤에 세 번째로 검을 뽑아 들어 앞서와 똑같은 일을 거듭 행하였다. 그리하여 그 자리에 있던 모든 사람이 그 기적이 세 번이나 되풀이하여 이루어지는 것을 똑똑히 지켜보았다.", "ko_tagged": "백성들이 그처럼 함성을 지르는 동안에도 {{person:アーサー|아서}}는 다시 검을 붙잡아 뽑아 들고 또 한 번 휘두른 뒤, 다시 모루 속으로 깊숙이 꽂아 넣었다. 그리고 그렇게 한 뒤에 세 번째로 검을 뽑아 들어 앞서와 똑같은 일을 거듭 행하였다. 그리하여 그 자리에 있던 모든 사람이 그 기적이 세 번이나 되풀이하여 이루어지는 것을 똑똑히 지켜보았다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p23_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 23, "type": "本文", "raw_text": "And all the kings and dukes who were there were filled with great amazement, and they wist not what to think or to say when they beheld one who was little more than a boy perform that undertaking in which the best of them had failed. And some of them, seeing that miracle, were willing to acknowledge Arthur because of it, but others would not acknowledge him. These withdrew themselves and stood aloof; and as they stood thus apart, they said among themselves: \"What is this and who can accredit such a thing that a beardless boy should be set before us all and should be made King and overlord of this great realm for to govern us. Nay! Nay! we will have none of him for our King.\" And others said, \"Is it not apparent that Merlin and Sir Ulfius are thus exalting this unknown boy so that they may elevate themselves along with him?\" Thus these discontented kings spake among themselves, and of all of them the most bitter were King Lot and King Urien, who were brothers by marriage with Arthur.", "translation": "その場に居並んでいたすべての王たちと公爵たちとは激しい驚愕に打たれ、彼らの中でも最も優れた者たちですら敗れ去ったあの難業を、ほんの少年と変わらぬ一人の若者が成し遂げるのを目の当たりにして、何を考え何を言えばよいのかもわからなかった。彼らのうちの幾人かは、その奇跡を見て、それゆえにアーサーを認めようという気になったが、他の者たちは彼を認めようとはしなかった。この者たちは身を引いて離れた場所に立ち、そのように距離を置いたまま互いにこう言い合った。「いったいこれは何事だ、髭も生えぬ小僧が我ら全員の上に据えられ、この大いなる王国の王にして最高君主となって我らを統治するなどということを、誰が信じ受け入れられようか。否、断じて否だ！ あのような者を我らの王として戴くことなど決してあるものか。」また他の者たちは言った。「マーリンとウルフィアス卿がこのように素性も知れぬ少年を祭り上げているのは、その少年とともに己自身の地位をも引き上げようと企んでいるからであることは明白ではないか？」不満を抱く王たちは互いにそのように語り合ったが、その全員の中でもとりわけ苦々しく反発していたのは、婚姻によってアーサーの義兄にあたるロット王とユリエンス王の二人であった。", "raw_tagged": "And all the {{office:王|kings}} and {{office:公爵|dukes}} who were there were filled with great amazement, and they wist not what to think or to say when they beheld one who was little more than a boy perform that undertaking in which the best of them had failed. And some of them, seeing that miracle, were willing to acknowledge {{person:アーサー|Arthur}} because of it, but others would not acknowledge him. These withdrew themselves and stood aloof; and as they stood thus apart, they said among themselves: \"What is this and who can accredit such a thing that a beardless boy should be set before us all and should be made {{office:王|King}} and overlord of this great realm for to govern us. Nay! Nay! we will have none of him for our {{office:王|King}}.\" And others said, \"Is it not apparent that {{person:マーリン|Merlin}} and {{person:ウルフィアス|Sir Ulfius}} are thus exalting this unknown boy so that they may elevate themselves along with him?\" Thus these discontented {{office:王|kings}} spake among themselves, and of all of them the most bitter were {{office:王|King}} {{person:ロット|Lot}} and {{office:王|King}} {{person:ユリエンス|Urien}}, who were brothers by marriage with {{person:アーサー|Arthur}}.", "translation_tagged": "その場に居並んでいたすべての{{office:王|王}}たちと{{office:公爵|公爵}}たちとは激しい驚愕に打たれ、彼らの中でも最も優れた者たちですら敗れ去ったあの難業を、ほんの少年と変わらぬ一人の若者が成し遂げるのを目の当たりにして、何を考え何を言えばよいのかもわからなかった。彼らのうちの幾人かは、その奇跡を見て、それゆえに{{person:アーサー|アーサー}}を認めようという気になったが、他の者たちは彼を認めようとはしなかった。この者たちは身を引いて離れた場所に立ち、そのように距離を置いたまま互いにこう言い合った。「いったいこれは何事だ、髭も生えぬ小僧が我ら全員の上に据えられ、この大いなる王国の{{office:王|王}}にして最高君主となって我らを統治するなどということを、誰が信じ受け入れられようか。否、断じて否だ！ あのような者を我らの{{office:王|王}}として戴くことなど決してあるものか。」また他の者たちは言った。「{{person:マーリン|マーリン}}と{{person:ウルフィアス|ウルフィアス卿}}がこのように素性も知れぬ少年を祭り上げているのは、その少年とともに己自身の地位をも引き上げようと企んでいるからであることは明白ではないか？」不満を抱く{{office:王|王}}たちは互いにそのように語り合ったが、その全員の中でもとりわけ苦々しく反発していたのは、婚姻によって{{person:アーサー|アーサー}}の義兄にあたる{{person:ロット|ロット}}{{office:王|王}}と{{person:ユリエンス|ユリエンス}}{{office:王|王}}の二人であった。", "persons": "アーサー,マーリン,ウルフィアス,ロット,ユリエンス", "places": "", "offices": "王,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "在場所有的國王與公爵無不大為震驚，眼見一個幾乎還只是孩子的少年竟完成了他們當中最傑出的人物都失敗了的壯舉，一時之間都不知該作何感想、說什麼才好。他們之中有些人見了這場奇蹟，便願意因此承認亞瑟，但另一些人卻不肯承認他。這些人退到一旁，冷眼旁觀；他們就這樣遠遠站開，彼此私下議論道：「這是怎麼回事？誰能信服這樣的事——竟讓一個嘴上無毛的小子凌駕於我們眾人之上，立他為這偉大王國的國王與最高君主來統治我們？不！絕不！我們絕不奉他為我們的國王。」又有人說道：「這豈不明擺著是梅林與烏爾菲烏斯爵士故意如此抬舉這個來歷不明的少年，好讓他們自己也隨他一道飛黃騰達嗎？」這些心懷不滿的國王就這樣私下議論紛紛，而在他們所有人當中，最為憤恨不平的便是洛特王與尤里安王——這兩人因聯姻之故，還是亞瑟的姊夫。", "zh_tw_tagged": "在場所有的{{office:王|國王}}與{{office:公爵|公爵}}無不大為震驚，眼見一個幾乎還只是孩子的少年竟完成了他們當中最傑出的人物都失敗了的壯舉，一時之間都不知該作何感想、說什麼才好。他們之中有些人見了這場奇蹟，便願意因此承認{{person:アーサー|亞瑟}}，但另一些人卻不肯承認他。這些人退到一旁，冷眼旁觀；他們就這樣遠遠站開，彼此私下議論道：「這是怎麼回事？誰能信服這樣的事——竟讓一個嘴上無毛的小子凌駕於我們眾人之上，立他為這偉大王國的{{office:王|國王}}與最高君主來統治我們？不！絕不！我們絕不奉他為我們的{{office:王|國王}}。」又有人說道：「這豈不明擺著是{{person:マーリン|梅林}}與{{person:ウルフィアス|烏爾菲烏斯爵士}}故意如此抬舉這個來歷不明的少年，好讓他們自己也隨他一道飛黃騰達嗎？」這些心懷不滿的{{office:王|國王}}就這樣私下議論紛紛，而在他們所有人當中，最為憤恨不平的便是{{person:ロット|洛特}}{{office:王|王}}與{{person:ユリエンス|尤里安}}{{office:王|王}}——這兩人因聯姻之故，還是{{person:アーサー|亞瑟}}的姊夫。", "zh_cn": "在场所有的国王与公爵无不大为震惊，眼见一个几乎还只是孩子的少年竟完成了他们当中最杰出的人物都失败了的壮举，一时之间都不知该作何感想、说什么才好。他们之中有些人见了这场奇迹，便愿意因此承认亚瑟，但另一些人却不肯承认他。这些人退到一旁，冷眼旁观；他们就这样远远站开，彼此私下议论道：“这是怎么回事？谁能信服这样的事——竟让一个嘴上无毛的小子凌驾于我们众人之上，立他为这伟大王国的国王与最高君主来统治我们？不！绝不！我们绝不奉他为我们的国王。”又有人说道：“这岂不明摆着是梅林与乌尔菲乌斯爵士故意如此抬举这个来历不明的少年，好让他们自己也随他一道飞黄腾达吗？”这些心怀不满的国王就这样私下议论纷纷，而在他们所有人当中，最为愤恨不平的便是洛特王与尤里安王——这两人因联姻之故，还是亚瑟的姐夫。", "zh_cn_tagged": "在场所有的{{office:王|国王}}与{{office:公爵|公爵}}无不大为震惊，眼见一个几乎还只是孩子的少年竟完成了他们当中最杰出的人物都失败了的壮举，一时之间都不知该作何感想、说什么才好。他们之中有些人见了这场奇迹，便愿意因此承认{{person:アーサー|亚瑟}}，但另一些人却不肯承认他。这些人退到一旁，冷眼旁观；他们就这样远远站开，彼此私下议论道：“这是怎么回事？谁能信服这样的事——竟让一个嘴上无毛的小子凌驾于我们众人之上，立他为这伟大王国的{{office:王|国王}}与最高君主来统治我们？不！绝不！我们绝不奉他为我们的{{office:王|国王}}。”又有人说道：“这岂不明摆着是{{person:マーリン|梅林}}与{{person:ウルフィアス|乌尔菲乌斯爵士}}故意如此抬举这个来历不明的少年，好让他们自己也随他一道飞黄腾达吗？”这些心怀不满的{{office:王|国王}}就这样私下议论纷纷，而在他们所有人当中，最为愤恨不平的便是{{person:ロット|洛特}}{{office:王|王}}与{{person:ユリエンス|尤里安}}{{office:王|王}}——这两人因联姻之故，还是{{person:アーサー|亚瑟}}的姐夫。", "ko": "그 자리에 있던 모든 왕들과 공작들은 크나큰 경악에 휩싸였으니, 그들 가운데 가장 뛰어난 자들조차 실패했던 그 과업을 한낱 소년에 지나지 않는 자가 이루는 광경을 보고는 무슨 생각을 해야 할지, 무슨 말을 해야 할지 알지 못했다. 그들 중 어떤 이들은 그 기적을 보고 그로 인하여 기꺼이 아서를 인정하려 했으나, 다른 이들은 그를 인정하려 하지 않았다. 이 자들은 뒤로 물러나 동떨어져 서서 서로끼리 이렇게 수군거렸다. “이게 대체 무슨 일이며, 수염도 나지 않은 애송이를 우리 모두의 위에 세워 이 거대한 왕국의 왕이자 최고 군주로 삼아 우리를 다스리게 한다니 누가 그런 일을 믿고 받아들일 수 있단 말인가. 아니다! 결코 안 될 말이다! 우리는 결단코 저자를 우리의 왕으로 모시지 않을 것이다.” 또 다른 이들은 말했다. “멀린과 울피우스 경이 저 이름 모를 소년과 더불어 자기들의 지위까지 함께 끌어올리려고 저렇듯 그를 치켜세우고 있는 것이 명백하지 않은가?” 불만을 품은 이 왕들은 자기들끼리 이처럼 말하였는데, 그들 모두 가운데서도 가장 격렬하게 반감을 품은 자들은 혼인으로 아서의 매형이 되는 로트 왕과 유리엔 왕이었다.", "ko_tagged": "그 자리에 있던 모든 {{office:王|왕}}들과 {{office:公爵|공작}}들은 크나큰 경악에 휩싸였으니, 그들 가운데 가장 뛰어난 자들조차 실패했던 그 과업을 한낱 소년에 지나지 않는 자가 이루는 광경을 보고는 무슨 생각을 해야 할지, 무슨 말을 해야 할지 알지 못했다. 그들 중 어떤 이들은 그 기적을 보고 그로 인하여 기꺼이 {{person:アーサー|아서}}를 인정하려 했으나, 다른 이들은 그를 인정하려 하지 않았다. 이 자들은 뒤로 물러나 동떨어져 서서 서로끼리 이렇게 수군거렸다. “이게 대체 무슨 일이며, 수염도 나지 않은 애송이를 우리 모두의 위에 세워 이 거대한 왕국의 {{office:王|왕}}이자 최고 군주로 삼아 우리를 다스리게 한다니 누가 그런 일을 믿고 받아들일 수 있단 말인가. 아니다! 결코 안 될 말이다! 우리는 결단코 저자를 우리의 {{office:王|왕}}으로 모시지 않을 것이다.” 또 다른 이들은 말했다. “{{person:マーリン|멀린}}과 {{person:ウルフィアス|울피우스 경}}이 저 이름 모를 소년과 더불어 자기들의 지위까지 함께 끌어올리려고 저렇듯 그를 치켜세우고 있는 것이 명백하지 않은가?” 불만을 품은 이 {{office:王|왕}}들은 자기들끼리 이처럼 말하였는데, 그들 모두 가운데서도 가장 격렬하게 반감을 품은 자들은 혼인으로 {{person:アーサー|아서}}의 매형이 되는 {{person:ロット|로트}} {{office:王|왕}}과 {{person:ユリエンス|유리엔}} {{office:王|왕}}이었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p24_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 24, "type": "本文", "raw_text": "Now when the Archbishop perceived the discontent of these kings and dukes, he said to them, \"How now, Messires! Are ye not satisfied?\" And they said, \"We are not satisfied.\" And the Archbishop said, \"What would ye have?\" And they said, \"We would have another sort of king for Britain than a beardless boy of whom no one knoweth and of whose birthright there are only three men to attest.\" And the Archbishop said, \"What of that? Hath he not performed the miracle that ye yourselves assayed and failed to perform?\"", "translation": "さて、大司教はこれらの王たちや公爵たちの不満を見て取ると、彼らに向かって言った。「これはいかなることか、諸卿よ！ 皆様はご納得なさらぬのか？」彼らは答えた。「我らは納得いたしませぬ。」大司教が「では、何を望まれるのか？」と問うと、彼らは言った。「我らはブリテンのために、誰一人知る者もなく、その生得の王位継承権を証言する者がわずか三人しかおらぬような髭も生えぬ小僧などではなく、別種の王を戴きたいのです。」すると大司教は言った。「それがどうしたというのか？ 彼は、皆様ご自身が挑んで成し遂げられなかったあの奇跡を、見事に成し遂げたではないか？」", "raw_tagged": "Now when the {{office:大司教|Archbishop}} perceived the discontent of these {{office:王|kings}} and {{office:公爵|dukes}}, he said to them, \"How now, Messires! Are ye not satisfied?\" And they said, \"We are not satisfied.\" And the {{office:大司教|Archbishop}} said, \"What would ye have?\" And they said, \"We would have another sort of {{office:王|king}} for {{place:ブリテン島|Britain}} than a beardless boy of whom no one knoweth and of whose birthright there are only three men to attest.\" And the {{office:大司教|Archbishop}} said, \"What of that? Hath he not performed the miracle that ye yourselves assayed and failed to perform?\"", "translation_tagged": "さて、{{office:大司教|大司教}}はこれらの{{office:王|王}}たちや{{office:公爵|公爵}}たちの不満を見て取ると、彼らに向かって言った。「これはいかなることか、諸卿よ！ 皆様はご納得なさらぬのか？」彼らは答えた。「我らは納得いたしませぬ。」{{office:大司教|大司教}}が「では、何を望まれるのか？」と問うと、彼らは言った。「我らは{{place:ブリテン島|ブリテン}}のために、誰一人知る者もなく、その生得の王位継承権を証言する者がわずか三人しかおらぬような髭も生えぬ小僧などではなく、別種の{{office:王|王}}を戴きたいのです。」すると{{office:大司教|大司教}}は言った。「それがどうしたというのか？ 彼は、皆様ご自身が挑んで成し遂げられなかったあの奇跡を、見事に成し遂げたではないか？」", "persons": "", "places": "ブリテン島", "offices": "大司教,王,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "這時大主教察覺到這些國王與公爵的不滿，便對他們說道：「諸位大人，這是怎麼了！你們還不心服嗎？」他們回答道：「我們不服。」大主教問道：「那麼你們意欲如何？」他們說：「我們要為不列顛另立一位不同樣的國王，而不是一個無人知曉來歷、其生身繼承權僅有三個人作證的無鬚小子。」大主教說道：「那又如何？難道他不是已經完成了你們親自嘗試卻未能完成的那場奇蹟嗎？」", "zh_tw_tagged": "這時{{office:大司教|大主教}}察覺到這些{{office:王|國王}}與{{office:公爵|公爵}}的不滿，便對他們說道：「諸位大人，這是怎麼了！你們還不心服嗎？」他們回答道：「我們不服。」{{office:大司教|大主教}}問道：「那麼你們意欲如何？」他們說：「我們要為{{place:ブリテン島|不列顛}}另立一位不同樣的{{office:王|國王}}，而不是一個無人知曉來歷、其生身繼承權僅有三個人作證的無鬚小子。」{{office:大司教|大主教}}說道：「那又如何？難道他不是已經完成了你們親自嘗試卻未能完成的那場奇蹟嗎？」", "zh_cn": "这时大主教察觉到这些国王与公爵的不满，便对他们说道：“诸位大人，这是怎么了！你们还不心服吗？”他们回答道：“我们不服。”大主教问道：“那么你们意欲如何？”他们说：“我们要为不列颠另立一位不同样的国王，而不是一个无人知晓来历、其生身继承权仅有三个人作证的无须小子。”大主教说道：“那又如何？难道他不是已经完成了你们亲自尝试却未能完成的那场奇迹吗？”", "zh_cn_tagged": "这时{{office:大司教|大主教}}察觉到这些{{office:王|国王}}与{{office:公爵|公爵}}的不满，便对他们说道：“诸位大人，这是怎么了！你们还不心服吗？”他们回答道：“我们不服。”{{office:大司教|大主教}}问道：“那么你们意欲如何？”他们说：“我们要为{{place:ブリテン島|不列颠}}另立一位不同样的{{office:王|国王}}，而不是一个无人知晓来历、其生身继承权仅有三个人作证的无须小子。”{{office:大司教|大主教}}说道：“那又如何？难道他不是已经完成了你们亲自尝试却未能完成的那场奇迹吗？”", "ko": "그때 대주교가 이 왕들과 공작들의 불만을 알아채고 그들에게 물었다. “어찌 된 일이오, 제경들이여! 그대들은 만족하지 못하시오?” 그들이 대답했다. “우리는 만족하지 못하오.” 대주교가 “그렇다면 무엇을 원하시오?” 하고 묻자, 그들이 말했다. “우리는 아무도 아는 이가 없고 그 타고난 계승권을 증언할 자가 고작 세 사람뿐인 수염도 안 난 애송이 말고, 브리튼을 위해 다른 부류의 왕을 모시고자 하오.” 그러자 대주교가 말했다. “그것이 어떻단 말이오? 그대들 자신이 직접 시험하였다가 이루지 못한 그 기적을 그가 이루어 내지 않았소?”", "ko_tagged": "그때 {{office:大司教|대주교}}가 이 {{office:王|왕}}들과 {{office:公爵|공작}}들의 불만을 알아채고 그들에게 물었다. “어찌 된 일이오, 제경들이여! 그대들은 만족하지 못하시오?” 그들이 대답했다. “우리는 만족하지 못하오.” {{office:大司教|대주교}}가 “그렇다면 무엇을 원하시오?” 하고 묻자, 그들이 말했다. “우리는 아무도 아는 이가 없고 그 타고난 계승권을 증언할 자가 고작 세 사람뿐인 수염도 안 난 애송이 말고, {{place:ブリテン島|브리튼}}을 위해 다른 부류의 {{office:王|왕}}을 모시고자 하오.” 그러자 {{office:大司教|대주교}}가 말했다. “그것이 어떻단 말이오? 그대들 자신이 직접 시험하였다가 이루지 못한 그 기적을 그가 이루어 내지 않았소?”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p25_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 25, "type": "本文", "raw_text": "But these high and mighty lords would not be satisfied, but with angry and averted faces they went away from that place, filled with wrath and indignation.", "translation": "けれどもこれら高貴にして強大なる大諸侯たちはどうしても納得しようとはせず、怒りに顔を背けたまま、激しい憤怒と憤懣とに胸を満たしてその場から立ち去っていった。", "raw_tagged": "But these high and mighty lords would not be satisfied, but with angry and averted faces they went away from that place, filled with wrath and indignation.", "translation_tagged": "けれどもこれら高貴にして強大なる大諸侯たちはどうしても納得しようとはせず、怒りに顔を背けたまま、激しい憤怒と憤懣とに胸を満たしてその場から立ち去っていった。", "persons": "", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "然而這些位高權重的大領主仍不肯心服，個個怒容滿面地別過頭去，懷著滿腔盛怒與憤懣離開了那裡。", "zh_tw_tagged": "然而這些位高權重的大領主仍不肯心服，個個怒容滿面地別過頭去，懷著滿腔盛怒與憤懣離開了那裡。", "zh_cn": "然而这些位高权重的大领主仍不肯心服，个个怒容满面地别过头去，怀着满腔盛怒与愤懑离开了那里。", "zh_cn_tagged": "然而这些位高权重的大领主仍不肯心服，个个怒容满面地别过头去，怀着满腔盛怒与愤懑离开了那里。", "ko": "그러나 이 높고도 막강한 대영주들은 끝내 만족하려 하지 않았으며, 성난 기색으로 얼굴을 돌린 채 격분과 분노에 가득 차서 그 자리를 떠나 버렸다.", "ko_tagged": "그러나 이 높고도 막강한 대영주들은 끝내 만족하려 하지 않았으며, 성난 기색으로 얼굴을 돌린 채 격분과 분노에 가득 차서 그 자리를 떠나 버렸다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p26_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 26, "type": "本文", "raw_text": "But others of these kings and dukes came and saluted Arthur and paid him court, giving him joy of that which he had achieved; and the chiefest of those who came thus unto him in friendliness was King Leodegrance of Cameliard. And all the multitude acknowledged him and crowded around that place shouting so that it sounded like to the noise of thunder.", "translation": "だが、それら王たちや公爵たちのうちの他の者たちは歩み寄ってアーサーに敬礼を捧げ、恭しく伺候して、その成し遂げた偉業に祝いの言葉を述べた。そのように好意をもって彼のもとへ進み出た人々の中で最も重きをなしていたのが、カミリアードのレオデグランス王であった。そして居合わせた大群衆も皆こぞって彼を認め、その場の周囲に押し寄せて歓声を上げたので、その響きはさながら雷鳴のとどろく音のようであった。", "raw_tagged": "But others of these {{office:王|kings}} and {{office:公爵|dukes}} came and saluted {{person:アーサー|Arthur}} and paid him court, giving him joy of that which he had achieved; and the chiefest of those who came thus unto him in friendliness was {{office:王|King}} {{person:レオデグランス|Leodegrance}} of {{special:カミリアード|Cameliard}}. And all the multitude acknowledged him and crowded around that place shouting so that it sounded like to the noise of thunder.", "translation_tagged": "だが、それら{{office:王|王}}たちや{{office:公爵|公爵}}たちのうちの他の者たちは歩み寄って{{person:アーサー|アーサー}}に敬礼を捧げ、恭しく伺候して、その成し遂げた偉業に祝いの言葉を述べた。そのように好意をもって彼のもとへ進み出た人々の中で最も重きをなしていたのが、{{special:カミリアード|カミリアード}}の{{person:レオデグランス|レオデグランス}}{{office:王|王}}であった。そして居合わせた大群衆も皆こぞって彼を認め、その場の周囲に押し寄せて歓声を上げたので、その響きはさながら雷鳴のとどろく音のようであった。", "persons": "アーサー,レオデグランス", "places": "", "offices": "王,公爵", "era_year": "伝説時代", "keywords": "カミリアード", "is_enriched": true, "zh_tw": "不過，這些國王與公爵之中的另一些人則走上前來向亞瑟行禮致敬、殷勤朝拜，祝賀他所成就的功業；在如此懷著善意前來歸附他的人當中，為首的便是卡米利亞德的里奧德格蘭斯王。在場的全體群眾也都一致擁戴他，紛紛簇擁到那處四周高聲歡呼，聲浪震天，聽來宛如雷鳴轟響。", "zh_tw_tagged": "不過，這些{{office:王|國王}}與{{office:公爵|公爵}}之中的另一些人則走上前來向{{person:アーサー|亞瑟}}行禮致敬、殷勤朝拜，祝賀他所成就的功業；在如此懷著善意前來歸附他的人當中，為首的便是{{special:カミリアード|卡米利亞德}}的{{person:レオデグランス|里奧德格蘭斯}}{{office:王|王}}。在場的全體群眾也都一致擁戴他，紛紛簇擁到那處四周高聲歡呼，聲浪震天，聽來宛如雷鳴轟響。", "zh_cn": "不过，这些国王与公爵之中的另一些人则走上前来向亚瑟行礼致敬、殷勤朝拜，祝贺他所成就的功业；在如此怀着善意前来归附他的人当中，为首的便是卡米利亚德的里奥德格兰斯王。在场的全体群众也都一致拥戴他，纷纷簇拥到那处四周高声欢呼，声浪震天，听来宛如雷鸣轰响。", "zh_cn_tagged": "不过，这些{{office:王|国王}}与{{office:公爵|公爵}}之中的另一些人则走上前来向{{person:アーサー|亚瑟}}行礼致敬、殷勤朝拜，祝贺他所成就的功业；在如此怀着善意前来归附他的人当中，为首的便是{{special:カミリアード|卡米利亚德}}的{{person:レオデグランス|里奥德格兰斯}}{{office:王|王}}。在场的全体群众也都一致拥戴他，纷纷簇拥到那处四周高声欢呼，声浪震天，听来宛如雷鸣轰响。", "ko": "하지만 이 왕들과 공작들 가운데 다른 이들은 다가와 아서에게 경의를 표하고 공손히 알현하며, 그가 이룩한 위업을 진심으로 축하해 주었다. 이처럼 호의를 품고 그에게 나아온 이들 가운데 가장 으뜸가는 인물은 카밀리아드의 레오데그란스 왕이었다. 그리고 거기 모인 온 군중도 그를 인정하고 그 자리 둘레로 구름처럼 몰려들어 함성을 질렀으니, 그 소리가 마치 천둥이 울리는 듯하였다.", "ko_tagged": "하지만 이 {{office:王|왕}}들과 {{office:公爵|공작}}들 가운데 다른 이들은 다가와 {{person:アーサー|아서}}에게 경의를 표하고 공손히 알현하며, 그가 이룩한 위업을 진심으로 축하해 주었다. 이처럼 호의를 품고 그에게 나아온 이들 가운데 가장 으뜸가는 인물은 {{special:カミリアード|카밀리아드}}의 {{person:レオデグランス|레오데그란스}} {{office:王|왕}}이었다. 그리고 거기 모인 온 군중도 그를 인정하고 그 자리 둘레로 구름처럼 몰려들어 함성을 질렀으니, 그 소리가 마치 천둥이 울리는 듯하였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p27_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 27, "type": "本文", "raw_text": "Now all this while Sir Ector and Sir Kay had stood upon one side. And they were greatly weighed down by sorrow; for it appeared to them that Arthur had, of a sudden, been uplifted so far from their estate that they might never hope to approach him more. For now he was of kingly consequence and they but common knights. And, after awhile, Arthur beheld them where they stood with downcast looks, whereupon he straight-way went to them and took first one and then the other by the hand and kissed each upon the cheek. Thereupon they were again very glad at being thus uplifted unto him.", "translation": "さて、この間ずっと、エクター卿とケイ卿とは傍らに控えて立っていた。二人は深い悲しみに胸を押し潰されるような思いでいた。というのも、アーサーが突如として自分たちの身分からあまりにも遠い高みへと引き上げられたため、もはや二度と彼に近づくことすら望めぬように思われたからである。今や彼は王統の尊貴なる重みを帯びる身となり、自分たちはただの並の騎士にすぎなかったからである。やがてしばらくして、アーサーは二人がうつむきがちな面持ちで佇んでいるのを目にとめると、ただちにそのもとへと歩み寄り、まず一人、次いでまたもう一人の手を取って、それぞれの頬に口づけを交わした。すると二人は、このように彼のそば近くへと引き上げられたことを思って、再び心から歓喜したのであった。", "raw_tagged": "Now all this while {{person:エクター|Sir Ector}} and {{person:ケイ|Sir Kay}} had stood upon one side. And they were greatly weighed down by sorrow; for it appeared to them that {{person:アーサー|Arthur}} had, of a sudden, been uplifted so far from their estate that they might never hope to approach him more. For now he was of kingly consequence and they but common {{office:騎士|knights}}. And, after awhile, {{person:アーサー|Arthur}} beheld them where they stood with downcast looks, whereupon he straight-way went to them and took first one and then the other by the hand and kissed each upon the cheek. Thereupon they were again very glad at being thus uplifted unto him.", "translation_tagged": "さて、この間ずっと、{{person:エクター|エクター卿}}と{{person:ケイ|ケイ卿}}とは傍らに控えて立っていた。二人は深い悲しみに胸を押し潰されるような思いでいた。というのも、{{person:アーサー|アーサー}}が突如として自分たちの身分からあまりにも遠い高みへと引き上げられたため、もはや二度と彼に近づくことすら望めぬように思われたからである。今や彼は王統の尊貴なる重みを帯びる身となり、自分たちはただの並の{{office:騎士|騎士}}にすぎなかったからである。やがてしばらくして、{{person:アーサー|アーサー}}は二人がうつむきがちな面持ちで佇んでいるのを目にとめると、ただちにそのもとへと歩み寄り、まず一人、次いでまたもう一人の手を取って、それぞれの頬に口づけを交わした。すると二人は、このように彼のそば近くへと引き上げられたことを思って、再び心から歓喜したのであった。", "persons": "エクター,ケイ,アーサー", "places": "", "offices": "騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "在這整段時間裡，艾克托爵士與凱爵士一直站在一旁。他們心中沉甸甸地壓著深切的憂傷；因為在他們看來，亞瑟驟然間被擢升到遠遠高出他們門第的尊位，使他們今後再也不敢奢望能親近他了。畢竟如今他已是至尊的王室貴冑，而他們不過是尋常的騎士罷了。過了一會兒，亞瑟看見他們神情黯然低垂地站在那裡，便立刻走到他們跟前，先握住一人的手，接著又握住另一人的手，並分別親吻了他們兩人的臉頰。於是他們因自己如此被他親近抬舉，心中再度充滿了莫大的欣喜。", "zh_tw_tagged": "在這整段時間裡，{{person:エクター|艾克托爵士}}與{{person:ケイ|凱爵士}}一直站在一旁。他們心中沉甸甸地壓著深切的憂傷；因為在他們看來，{{person:アーサー|亞瑟}}驟然間被擢升到遠遠高出他們門第的尊位，使他們今後再也不敢奢望能親近他了。畢竟如今他已是至尊的王室貴冑，而他們不過是尋常的{{office:騎士|騎士}}罷了。過了一會兒，{{person:アーサー|亞瑟}}看見他們神情黯然低垂地站在那裡，便立刻走到他們跟前，先握住一人的手，接著又握住另一人的手，並分別親吻了他們兩人的臉頰。於是他們因自己如此被他親近抬舉，心中再度充滿了莫大的欣喜。", "zh_cn": "在这整段时间里，艾克托爵士与凯爵士一直站在一旁。他们心中沉甸甸地压着深切的忧伤；因为在他们看来，亚瑟骤然间被擢升到远远高出他们门第的尊位，使他们今后再也不敢奢望能亲近他了。毕竟如今他已是至尊的王室贵胄，而他们不过是寻常的骑士罢了。过了一会儿，亚瑟看见他们神情黯然低垂地站在那里，便立刻走到他们跟前，先握住一人的手，接着又握住另一人的手，并分别亲吻了他们两人的脸颊。于是他们因自己如此被他亲近抬举，心中再度充满了莫大的欣喜。", "zh_cn_tagged": "在这整段时间里，{{person:エクター|艾克托爵士}}与{{person:ケイ|凯爵士}}一直站在一旁。他们心中沉甸甸地压着深切的忧伤；因为在他们看来，{{person:アーサー|亚瑟}}骤然间被擢升到远远高出他们门第的尊位，使他们今后再也不敢奢望能亲近他了。毕竟如今他已是至尊的王室贵胄，而他们不过是寻常的{{office:騎士|骑士}}罢了。过了一会儿，{{person:アーサー|亚瑟}}看见他们神情黯然低垂地站在那里，便立刻走到他们跟前，先握住一人的手，接着又握住另一人的手，并分别亲吻了他们两人的脸颊。于是他们因自己如此被他亲近抬举，心中再度充满了莫大的欣喜。", "ko": "한편 이 모든 일이 벌어지는 동안 엑터 경과 케이 경은 줄곧 한쪽에 비켜서 있었다. 두 사람은 깊은 슬픔에 짓눌려 있었으니, 아서가 하루아침에 자기들의 신분과는 비교도 할 수 없을 만큼 아득히 높은 자리로 올라가 버려 이제 다시는 그에게 가까이 다가갈 수조차 없으리라 여겨졌기 때문이다. 이제 그는 왕가의 존귀한 위상을 지닌 몸이 되었고, 자기들은 한낱 평범한 기사에 지나지 않았기 때문이었다. 얼마 뒤, 아서는 두 사람이 풀이 죽은 기색으로 고개를 떨군 채 서 있는 모습을 보고는 곧바로 그들에게로 걸어가 먼저 한 사람의 손을 잡고 이어 다른 한 사람의 손을 잡은 다음, 저마다의 뺨에 입을 맞추었다. 그러자 두 사람은 그처럼 그와 가까워지도록 높여진 것에 다시금 큰 기쁨을 느꼈다.", "ko_tagged": "한편 이 모든 일이 벌어지는 동안 {{person:エクター|엑터 경}}과 {{person:ケイ|케이 경}}은 줄곧 한쪽에 비켜서 있었다. 두 사람은 깊은 슬픔에 짓눌려 있었으니, {{person:アーサー|아서}}가 하루아침에 자기들의 신분과는 비교도 할 수 없을 만큼 아득히 높은 자리로 올라가 버려 이제 다시는 그에게 가까이 다가갈 수조차 없으리라 여겨졌기 때문이다. 이제 그는 왕가의 존귀한 위상을 지닌 몸이 되었고, 자기들은 한낱 평범한 {{office:騎士|기사}}에 지나지 않았기 때문이었다. 얼마 뒤, {{person:アーサー|아서}}는 두 사람이 풀이 죽은 기색으로 고개를 떨군 채 서 있는 모습을 보고는 곧바로 그들에게로 걸어가 먼저 한 사람의 손을 잡고 이어 다른 한 사람의 손을 잡은 다음, 저마다의 뺨에 입을 맞추었다. 그러자 두 사람은 그처럼 그와 가까워지도록 높여진 것에 다시금 큰 기쁨을 느꼈다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p28_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 28, "type": "本文", "raw_text": "And when Arthur departed from that place, great crowds of people followed after him so that the streets were altogether filled with the press of people. And the multitude continually gave him loud acclaim as the chosen King of England, and those who were nearest to him sought to touch the hem of his garments; wherefore the heart of Arthur was exceedingly uplifted with great joy and gladness, so that his soul took wing and flew like a bird into the sky.", "translation": "やがてアーサーがその場から立ち去ると、幾重もの大群衆が彼のあとにつき従ったので、街路という街路はひしめき合う人々の波で残らず埋め尽くされた。群衆は神に選ばれしイングランドの王として彼に絶え間なく高らかな歓呼の声を浴びせかけ、最も近くにいた者たちは彼の衣の裾に触れようと競い合った。それゆえアーサーの心は大いなる喜びと歓喜とによって限りなく高揚し、その魂は翼を得て、一羽の鳥のごとく大空へと羽ばたき昇るかのようであった。", "raw_tagged": "And when {{person:アーサー|Arthur}} departed from that place, great crowds of people followed after him so that the streets were altogether filled with the press of people. And the multitude continually gave him loud acclaim as the chosen {{office:王|King}} of {{place:イングランド|England}}, and those who were nearest to him sought to touch the hem of his garments; wherefore the heart of {{person:アーサー|Arthur}} was exceedingly uplifted with great joy and gladness, so that his soul took wing and flew like a bird into the sky.", "translation_tagged": "やがて{{person:アーサー|アーサー}}がその場から立ち去ると、幾重もの大群衆が彼のあとにつき従ったので、街路という街路はひしめき合う人々の波で残らず埋め尽くされた。群衆は神に選ばれし{{place:イングランド|イングランド}}の{{office:王|王}}として彼に絶え間なく高らかな歓呼の声を浴びせかけ、最も近くにいた者たちは彼の衣の裾に触れようと競い合った。それゆえ{{person:アーサー|アーサー}}の心は大いなる喜びと歓喜とによって限りなく高揚し、その魂は翼を得て、一羽の鳥のごとく大空へと羽ばたき昇るかのようであった。", "persons": "アーサー", "places": "イングランド", "offices": "王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "當亞瑟離開那處時，成群結隊的百姓緊隨在他身後，使得整條街道完全被擁擠的人潮塞滿。群眾不斷向這位天選的英格蘭之王報以響亮的歡呼喝采，靠他最近的人們紛紛爭著去觸摸他的衣襟下襬；因此亞瑟的心中充滿了無比的喜悅與歡欣，心神激盪昂揚，恍若靈魂生出雙翼、如飛鳥般直衝雲霄。", "zh_tw_tagged": "當{{person:アーサー|亞瑟}}離開那處時，成群結隊的百姓緊隨在他身後，使得整條街道完全被擁擠的人潮塞滿。群眾不斷向這位天選的{{place:イングランド|英格蘭}}之{{office:王|王}}報以響亮的歡呼喝采，靠他最近的人們紛紛爭著去觸摸他的衣襟下襬；因此{{person:アーサー|亞瑟}}的心中充滿了無比的喜悅與歡欣，心神激盪昂揚，恍若靈魂生出雙翼、如飛鳥般直衝雲霄。", "zh_cn": "当亚瑟离开那处时，成群结队的百姓紧随在他身后，使得整条街道完全被拥挤的人潮塞满。群众不断向这位天选的英格兰之王报以响亮的欢呼喝彩，靠他最近的人们纷纷争着去触摸他的衣襟下摆；因此亚瑟的心中充满了无比的喜悦与欢欣，心神激荡昂扬，恍若灵魂生出双翼、如飞鸟般直冲云霄。", "zh_cn_tagged": "当{{person:アーサー|亚瑟}}离开那处时，成群结队的百姓紧随在他身后，使得整条街道完全被拥挤的人潮塞满。群众不断向这位天选的{{place:イングランド|英格兰}}之{{office:王|王}}报以响亮的欢呼喝彩，靠他最近的人们纷纷争着去触摸他的衣襟下摆；因此{{person:アーサー|亚瑟}}的心中充满了无比的喜悦与欢欣，心神激荡昂扬，恍若灵魂生出双翼、如飞鸟般直冲云霄。", "ko": "이윽고 아서가 그 자리를 떠나자 수많은 인파가 그의 뒤를 따랐으므로, 거리는 밀려드는 사람들의 물결로 온통 가득 메워졌다. 군중은 선택받은 잉글랜드의 왕으로서 그에게 끊임없이 우렁찬 환호와 갈채를 보냈고, 그에게 가장 가까이 있던 이들은 그의 옷자락 끝이라도 만져 보려고 애썼다. 그리하여 아서의 마음은 크나큰 기쁨과 환희로 한없이 드높아졌으니, 그의 영혼은 마치 날개를 달고 하늘 높이 날아오르는 한 마리 새와도 같았다.", "ko_tagged": "이윽고 {{person:アーサー|아서}}가 그 자리를 떠나자 수많은 인파가 그의 뒤를 따랐으므로, 거리는 밀려드는 사람들의 물결로 온통 가득 메워졌다. 군중은 선택받은 {{place:イングランド|잉글랜드}}의 {{office:王|왕}}으로서 그에게 끊임없이 우렁찬 환호와 갈채를 보냈고, 그에게 가장 가까이 있던 이들은 그의 옷자락 끝이라도 만져 보려고 애썼다. 그리하여 {{person:アーサー|아서}}의 마음은 크나큰 기쁨과 환희로 한없이 드높아졌으니, 그의 영혼은 마치 날개를 달고 하늘 높이 날아오르는 한 마리 새와도 같았다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p29_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 29, "type": "本文", "raw_text": "Thus Arthur achieved the adventure of the sword that day and entered into his birthright of royalty. Wherefore, may God grant His Grace unto you all that ye too may likewise succeed in your undertakings. For any man may be a king in that life in which he is placed if so be he may draw forth the sword of success from out of the iron of circumstance. Wherefore when your time of assay cometh, I do hope it may be with you as it was with Arthur that day, and that ye too may achieve success with entire satisfaction unto yourself and to your great glory and perfect happiness. Amen.", "translation": "かくしてその日、アーサーは剣の冒険を成し遂げ、生まれながらに有していた王位の権利へと踏み入ったのである。されば、皆様もまたこれと同じようにそれぞれの企てにおいて成功を収められますよう、神が皆様すべての上に御恵みを垂れたまわんことを。なぜなら、人は誰であれ、自らが置かれたその人生において、境遇という鉄塊の中から成功という名の剣を引き抜くことさえできるならば、その生における一人の王となり得るからである。それゆえ、皆様にとっての試練の時が訪れた折には、あの日アーサーの上に起こったのと同じことが皆様の上にも訪れ、皆様ご自身の十全なる満足のうちに、また大いなる栄光と完全なる幸福とをもたらす成功を勝ち得られますよう、私は心から願ってやまないのである。アーメン。", "raw_tagged": "Thus {{person:アーサー|Arthur}} achieved the adventure of the sword that day and entered into his birthright of royalty. Wherefore, may God grant His Grace unto you all that ye too may likewise succeed in your undertakings. For any man may be a {{office:王|king}} in that life in which he is placed if so be he may draw forth the sword of success from out of the iron of circumstance. Wherefore when your time of assay cometh, I do hope it may be with you as it was with {{person:アーサー|Arthur}} that day, and that ye too may achieve success with entire satisfaction unto yourself and to your great glory and perfect happiness. Amen.", "translation_tagged": "かくしてその日、{{person:アーサー|アーサー}}は剣の冒険を成し遂げ、生まれながらに有していた王位の権利へと踏み入ったのである。されば、皆様もまたこれと同じようにそれぞれの企てにおいて成功を収められますよう、神が皆様すべての上に御恵みを垂れたまわんことを。なぜなら、人は誰であれ、自らが置かれたその人生において、境遇という鉄塊の中から成功という名の剣を引き抜くことさえできるならば、その生における一人の{{office:王|王}}となり得るからである。それゆえ、皆様にとっての試練の時が訪れた折には、あの日{{person:アーサー|アーサー}}の上に起こったのと同じことが皆様の上にも訪れ、皆様ご自身の十全なる満足のうちに、また大いな i18n": {"ja": "ユーサーに仕える騎士", "en": "Knight in Uther's service", "zh_tw": "烏瑟麾下的騎士", "zh_cn": "乌瑟麾下的骑士", "ko": "우서를 섬기는 기사"}, "desc_i18n": {"ja": "ユーサー王に仕える騎士。マロリー『アーサー王の死』ではサー・ウルフィウスとして、王の側近の助言者・騎士として登場する。", "en": "A knight in the service of King Uther. In Malory's Le Morte d'Arthur he appears as Sir Ulfius, a close adviser and knight of the king.", "zh_tw": "效力於烏瑟王的騎士。在馬洛禮《亞瑟王之死》中，他以Ulfius爵士之名登場，是國王身邊的謀士與騎士。", "zh_cn": "效力于乌瑟王的骑士。在马洛礼《亚瑟王之死》中，他以Ulfius爵士之名登场，是国王身边的谋士与骑士。", "ko": "우서 왕을 섬기는 기사. 맬러리의 『아서 왕의 죽음』에는 울피우스 경(Sir Ulfius)으로 나와 왕의 측근 조언자이자 기사로 등장한다."}, "sort_key_i18n": {"zh_tw": "W", "zh_cn": "W"}}, "イグレーヌ": {"name": "イグレーヌ（いぐれーぬ：アーサーの母とされる貴婦人）", "display_name": "イグレーヌ（アーサーの母とされる貴婦人）", "yomi": "いぐれーぬ", "wiki_title": "イグレーヌ", "role": "アーサーの母とされる貴婦人", "ai_desc": "アーサー王伝説でアーサーの母とされる女性。ティンタジェル公ゲルロイスの妻で、のちにユーサーの妃となる。", "role_i18n": {"ja": "アーサーの母とされる貴婦人", "en": "Noblewoman, mother of Arthur", "zh_tw": "貴婦人，亞瑟之母", "zh_cn": "贵妇人，亚瑟之母", "ko": "귀부인, 아서의 어머니"}, "desc_i18n": {"ja": "アーサー王伝説でアーサーの母とされる女性。ティンタジェル公ゲルロイスの妻で、のちにユーサーの妃となる。", "en": "In Arthurian legend, the woman said to be Arthur's mother. She is the wife of Gerlois, Duke of Tintagel, and later becomes Uther's queen.", "zh_tw": "亞瑟王傳說中被視為亞瑟之母的女性。她是廷塔哲公爵格洛伊斯之妻，後來成為烏瑟的王后。", "zh_cn": "亚瑟王传说中被视为亚瑟之母的女性。她是廷塔哲公爵格洛伊斯之妻，后来成为乌瑟的王后。", "ko": "아서 왕 전설에서 아서의 어머니로 여겨지는 여성. 틴타겔 공작 게를루아의 아내였으며 훗날 우서의 왕비가 된다."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "ゲルロイス": {"name": "ゲルロイス（げるろいす：ティンタジェル公・イグレーヌの先夫）", "display_name": "ゲルロイス（ティンタジェル公・イグレーヌの先夫）", "yomi": "げるろいす", "wiki_title": "ゴルロイス", "role": "ティンタジェル公・イグレーヌの先夫", "ai_desc": "ティンタジェルの公爵で、イグレーヌの最初の夫。マロリー『アーサー王の死』ではゴルロイスの名で登場する。", "role_i18n": {"ja": "ティンタジェル公・イグレーヌの先夫", "en": "Duke of Tintagel, Igraine's first husband", "zh_tw": "廷塔哲公爵，伊格蕾茵的前夫", "zh_cn": "廷塔哲公爵，伊格蕾茵的前夫", "ko": "틴타겔 공작, 이그레인의 전남편"}, "desc_i18n": {"ja": "ティンタジェルの公爵で、イグレーヌの最初の夫。マロリー『アーサー王の死』ではゴルロイスの名で登場する。", "en": "Duke of Tintagel and the first husband of Igraine. In Malory's Le Morte d'Arthur he appears under the name Gorlois.", "zh_tw": "廷塔哲公爵，伊格蕾茵的第一任丈夫。在馬洛禮《亞瑟王之死》中以戈洛伊斯（Gorlois）之名登場。", "zh_cn": "廷塔哲公爵，伊格蕾茵的第一任丈夫。在马洛礼《亚瑟王之死》中以戈洛伊斯（Gorlois）之名登场。", "ko": "틴타겔의 공작으로 이그레인의 첫 남편. 맬러리의 『아서 왕의 죽음』에서는 고를루아(Gorlois)라는 이름으로 등장한다."}, "sort_key_i18n": {"zh_tw": "G", "zh_cn": "G"}}, "マルゲーズ": {"name": "マルゲーズ（まるげーず：イグレーヌとゲルロイスの娘）", "display_name": "マルゲーズ（イグレーヌとゲルロイスの娘）", "yomi": "まるげーず", "wiki_title": "", "role": "イグレーヌとゲルロイスの娘", "ai_desc": "イグレーヌとゲルロイスの間に生まれた娘の一人。パイル版ではゴアのユリエンス王に嫁ぐ。", "role_i18n": {"ja": "イグレーヌとゲルロイスの娘", "en": "Daughter of Igraine and Gerlois", "zh_tw": "伊格蕾茵與格洛伊斯之女", "zh_cn": "伊格蕾茵与格洛伊斯之女", "ko": "이그레인과 게를루아의 딸"}, "desc_i18n": {"ja": "イグレーヌとゲルロイスの間に生まれた娘の一人。パイル版ではゴアのユリエンス王に嫁ぐ。", "en": "One of the daughters born to Igraine and Gerlois. In Pyle's version she marries King Urien of Gore.", "zh_tw": "伊格蕾茵與格洛伊斯所生的女兒之一。在派爾的版本中，她嫁給戈爾的尤里安國王。", "zh_cn": "伊格蕾茵与格洛伊斯所生的女儿之一。在派尔的版本中，她嫁给戈尔的尤里安国王。", "ko": "이그레인과 게를루아 사이에서 태어난 딸 중 한 명. 파일 판본에서는 고어의 유리엔 왕에게 시집간다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "モルガン・ル・フェイ": {"name": "モルガン・ル・フェイ（もるがん・る・ふぇい：イグレーヌの娘・名高い魔女）", "display_name": "モルガン・ル・フェイ（イグレーヌの娘・名高い魔女）", "yomi": "もるがん・る・ふぇい", "wiki_title": "モルガン・ル・フェイ", "role": "イグレーヌの娘・名高い魔女", "ai_desc": "アーサー王伝説に登場する著名な魔女で、イグレーヌとゲルロイスの娘。アーサーの異父姉にあたる。", "role_i18n": {"ja": "イグレーヌの娘・名高い魔女", "en": "Daughter of Igraine, famed sorceress", "zh_tw": "伊格蕾茵之女，著名女巫", "zh_cn": "伊格蕾茵之女，著名女巫", "ko": "이그레인의 딸, 이름난 마녀"}, "desc_i18n": {"ja": "アーサー王伝説に登場する著名な魔女で、イグレーヌとゲルロイスの娘。アーサーの異父姉にあたる。", "en": "A famous sorceress of Arthurian legend, daughter of Igraine and Gerlois, and so Arthur's half-sister on his mother's side.", "zh_tw": "亞瑟王傳說中的著名女巫，伊格蕾茵與格洛伊斯之女，也是亞瑟同母異父的姊姊。", "zh_cn": "亚瑟王传说中的著名女巫，伊格蕾茵与格洛伊斯之女，也是亚瑟同母异父的姐姐。", "ko": "아서 왕 전설에 등장하는 이름난 마녀로, 이그레인과 게를루아의 딸이며 아서의 어머니가 같은 이부(異父) 누나이다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "ユリエンス": {"name": "ユリエンス（ゆりえんす：ゴアの王）", "display_name": "ユリエンス（ゴアの王）", "yomi": "ゆりえんす", "wiki_title": "", "role": "ゴアの王", "ai_desc": "ゴアの王。パイル版ではマルゲーズの夫として登場する。", "role_i18n": {"ja": "ゴアの王", "en": "King of Gore", "zh_tw": "戈爾的國王", "zh_cn": "戈尔的国王", "ko": "고어의 왕"}, "desc_i18n": {"ja": "ゴアの王。パイル版ではマルゲーズの夫として登場する。", "en": "King of Gore. In Pyle's version he appears as the husband of Margaise.", "zh_tw": "戈爾的國王。在派爾的版本中，他是瑪嘉絲的丈夫。", "zh_cn": "戈尔的国王。在派尔的版本中，他是玛嘉丝的丈夫。", "ko": "고어의 왕. 파일 판본에서는 마르게즈의 남편으로 등장한다."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "ロット": {"name": "ロット（ろっと：オークニーの王）", "display_name": "ロット（オークニーの王）", "yomi": "ろっと", "wiki_title": "", "role": "オークニーの王", "ai_desc": "オークニーの王。パイル版ではモルガン・ル・フェイの夫として登場する。", "role_i18n": {"ja": "オークニーの王", "en": "King of Orkney", "zh_tw": "奧克尼的國王", "zh_cn": "奥克尼的国王", "ko": "오크니의 왕"}, "desc_i18n": {"ja": "オークニーの王。パイル版ではモルガン・ル・フェイの夫として登場する。", "en": "King of Orkney. In Pyle's version he appears as the husband of Morgana le Fay.", "zh_tw": "奧克尼的國王。在派爾的版本中，他是摩根勒菲的丈夫。", "zh_cn": "奥克尼的国王。在派尔的版本中，他是摩根勒菲的丈夫。", "ko": "오크니의 왕. 파일 판본에서는 모르가나 르 페이의 남편으로 등장한다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "レオデグランス": {"name": "レオデグランス（れおでぐらんす：カミリアードの王）", "display_name": "レオデグランス（カミリアードの王）", "yomi": "れおでぐらんす", "wiki_title": "レオデグランス", "role": "カミリアードの王", "ai_desc": "カミリアードの王。アーサー王伝説では王妃グィネヴィアの父であり、アーサーに円卓を贈った君主として知られる。", "role_i18n": {"ja": "カミリアードの王", "en": "King of Camiliard, father of Guinevere", "zh_tw": "卡米利亞德之王，桂妮薇兒之父", "zh_cn": "卡米利亚德之王，桂妮薇儿之父", "ko": "카밀리아드의 왕, 기네비어의 아버지"}, "desc_i18n": {"ja": "カミリアードの王。アーサー王伝説では王妃グィネヴィアの父であり、アーサーに円卓を贈った君主として知られる。", "en": "King of Camiliard. In Arthurian legend he is best known as the father of Queen Guinevere and the monarch who gave the Round Table to Arthur.", "zh_tw": "卡米利亞德的國王。在亞瑟王傳說中，他最著名的事蹟是身為桂妮薇兒王后的父親，並將圓桌贈予亞瑟王。", "zh_cn": "卡米利亚德的国王。在亚瑟王传说中，他最著名的事迹是身为桂妮薇儿王后的父亲，并将圆桌赠予亚瑟王。", "ko": "카밀리아드의 왕. 아서 왕 전설에서는 기네비어 왕비의 아버지이자 아서에게 원탁을 선사한 군주로 널리 알려져 있다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "リエンス": {"name": "リエンス（りえんす：北ウェールズの王）", "display_name": "リエンス（北ウェールズの王）", "yomi": "りえんす", "wiki_title": "リエンス", "role": "北ウェールズの王", "ai_desc": "北ウェールズの王。アーサー王伝説では若いアーサー王に臣従を迫り敵対する強力な君主の一人。", "role_i18n": {"ja": "北ウェールズの王", "en": "King of North Wales", "zh_tw": "北威爾斯之王", "zh_cn": "北威尔士之王", "ko": "북웨일스의 왕"}, "desc_i18n": {"ja": "北ウェールズの王。アーサー王伝説では若いアーサー王に臣従を迫り敵対する強力な君主の一人。", "en": "King of North Wales. In Arthurian legend he is a powerful monarch who challenges the young King Arthur and demands his submission.", "zh_tw": "北威爾斯之王。在亞瑟王傳說中，他是一位向年輕的亞瑟王發起挑戰並要求其臣服的強大君主。", "zh_cn": "北威尔士之王。在亚瑟王传说中，他是一位向年轻的亚瑟王发起挑战并要求其臣服的强大君主。", "ko": "북웨일스의 왕. 아서 왕 전설에서는 젊은 아서 왕에게 복속을 요구하며 맞서는 강력한 군주 중 한 명이다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "ロベール・ド・ボロン": {"name": "ロベール・ド・ボロン（ろべーる・ど・ぼろん：中世フランスの詩人）", "display_name": "ロベール・ド・ボロン（中世フランスの詩人）", "yomi": "ろべーる・ど・ぼろん", "wiki_title": "ロベール・ド・ボロン", "role": "中世フランスの詩人", "ai_desc": "12世紀末から13世紀初頭の中世フランスの詩人。『メルラン物語』などを著し、アーサー王伝説の発展に大きな影響を与えた。", "role_i18n": {"ja": "中世フランスの詩人", "en": "Medieval French poet, author of Merlin", "zh_tw": "中世紀法國詩人，《梅林》作者", "zh_cn": "中世纪法国诗人，《梅林》作者", "ko": "중세 프랑스 시인, 『멀린』 저자"}, "desc_i18n": {"ja": "12世紀末から13世紀初頭の中世フランスの詩人。『メルラン物語』などを著し、アーサー王伝説の発展に大きな影響を与えた。", "en": "A French poet of the late 12th and early 13th centuries who authored verse romances such as Merlin, greatly shaping the Arthurian legend.", "zh_tw": "十二世紀末至十三世紀初的法國詩人，著有《梅林》等騎士文學詩篇，對亞瑟王傳說的發展產生了深遠影響。", "zh_cn": "十二世纪末至十三世纪初的法国诗人，著有《梅林》等骑士文学诗篇，对亚瑟王传说的发展产生了深远影响。", "ko": "12세기 말부터 13세기 초에 활동한 프랑스 시인으로, 『멀린』 등의 운문 기사도 문학을 지어 아서 왕 전설의 발전에 지대한 영향을 미쳤다."}, "sort_key_i18n": {"zh_tw": "L", "zh_cn": "L"}}, "アーサー": {"name": "アーサー（あーさー：物語の主人公・のちのブリテン王）", "display_name": "アーサー（物語の主人公・のちのブリテン王）", "yomi": "あーさー", "wiki_title": "アーサー王", "role": "物語の主人公・のちのブリテン王", "ai_desc": "アーサー王伝説の中心人物。エクター卿のもとでケイの従者として育ち、やがてブリテンを統べる王となる。", "role_i18n": {"ja": "物語の主人公・のちのブリテン王", "en": "Hero of the tale, future King of Britain", "zh_tw": "故事主人公，後來的不列顛之王", "zh_cn": "故事主人公，后来的不列颠之王", "ko": "이야기의 주인공, 훗날의 브리튼 왕"}, "desc_i18n": {"ja": "アーサー王伝説の中心人物。エクター卿のもとでケイの従者として育ち、やがてブリテンを統べる王となる。", "en": "The central hero of Arthurian legend. Raised in the household of Sir Ector as squire to Sir Kay, he later becomes the king who unites Britain.", "zh_tw": "亞瑟王傳說的核心人物。在艾克托爵士家中作為凱的侍從長大，後來成為統御不列顛的國王。", "zh_cn": "亚瑟王传说的核心人物。在艾克托爵士家中作为凯的侍从长大，后来成为统御不列颠的国王。", "ko": "아서 왕 전설의 중심인물. 엑터 경의 가문에서 케이의 종자로 자라나 훗날 브리튼을 다스리는 왕이 된다."}, "sort_key_i18n": {"zh_tw": "Y", "zh_cn": "Y"}}, "エクター": {"name": "エクター（えくたー：ボンメゾンの高潔な騎士・ケイの父でアーサーの養父）", "display_name": "エクター（ボンメゾンの騎士・アーサーの養父）", "yomi": "えくたー", "wiki_title": "エクター", "role": "ボンメゾンの騎士・アーサーの養父", "ai_desc": "「誠実の騎士」と称される高潔な大領主。実子ケイとともに幼いアーサーを養育した騎士として伝承に描かれる。", "role_i18n": {"ja": "ボンメゾンの騎士・アーサーの養父", "en": "Knight of Bonmaison, foster-father of Arthur", "zh_tw": "邦梅宗的騎士，亞瑟的養父", "zh_cn": "邦梅宗的骑士，亚瑟的养父", "ko": "봉메종의 기사, 아서의 양아버지"}, "desc_i18n": {"ja": "「誠実の騎士」と称される高潔な大領主。実子ケイとともに幼いアーサーを養育した騎士として伝承に描かれる。", "en": "A noble lord renowned as the Trustworthy Knight. In Arthurian tradition he raises the young Arthur alongside his own son Kay.", "zh_tw": "被譽為「誠信騎士」的高潔大領主。在傳說中，他將年幼的亞瑟與親生兒子凱一同撫養長大。", "zh_cn": "被誉为“诚信骑士”的高洁大领主。在传说中，他将年幼的亚瑟与亲生儿子凯一同抚养长大。", "ko": "‘신실한 기사’라 불린 고결한 대영주. 전승에서는 친아들 케이와 함께 어린 아서를 거두어 길렀다."}, "sort_key_i18n": {"zh_tw": "A", "zh_cn": "A"}}, "ケイ": {"name": "ケイ（けい：エクター卿の長男・アーサーの義兄にあたる若き騎士）", "display_name": "ケイ（エクター卿の長男・若き騎士）", "yomi": "けい", "wiki_title": "ケイ (アーサー王伝説)", "role": "エクター卿の長男・若き騎士", "ai_desc": "エクター卿の長男で、アーサーの義兄としてともに育った騎士。アーサー王伝説では王家の執事長（セネシャル）としても知られる。", "role_i18n": {"ja": "エクター卿の長男・若き騎士", "en": "Eldest son of Sir Ector, young knight", "zh_tw": "艾克托爵士的長子，年輕騎士", "zh_cn": "艾克托爵士的长子，年轻骑士", "ko": "엑터 경의 장남, 젊은 기사"}, "desc_i18n": {"ja": "エクター卿の長男で、アーサーの義兄としてともに育った騎士。アーサー王伝説では王家の執事長（セネシャル）としても知られる。", "en": "The eldest son of Sir Ector and foster-brother of Arthur. In Arthurian legend he is also well known as the royal seneschal.", "zh_tw": "艾克托爵士的長子，與亞瑟一同長大的義兄。在亞瑟王傳說中也以王室總管（Seneschal）聞名。", "zh_cn": "艾克托爵士的长子，与亚瑟一同长大的义兄。在亚瑟王传说中也以王室总管（Seneschal）闻名。", "ko": "엑터 경의 장남으로 아서와 함께 자란 의형. 아서 왕 전설에서는 왕실의 집사장(세네샬)으로도 널리 알려져 있다."}, "sort_key_i18n": {"zh_tw": "K", "zh_cn": "K"}}, "バン": {"name": "バン（ばん：ベンウィックの王・ボールス王の兄）", "display_name": "バン（ベンウィックの王）", "yomi": "ばん", "wiki_title": "バン (アーサー王伝説)", "role": "ベンウィックの王", "ai_desc": "大陸のベンウィックを治める王で、ボールス王の兄。アーサー王伝説では円卓の騎士ランスロットの父として知られる。", "role_i18n": {"ja": "ベンウィックの王", "en": "King of Benwick, brother of King Bors", "zh_tw": "本威克之王，博爾斯王之兄", "zh_cn": "本威克之王，博尔斯王之兄", "ko": "벤윅의 왕, 보어스 왕의 형"}, "desc_i18n": {"ja": "大陸のベンウィックを治める王で、ボールス王の兄。アーサー王伝説では円卓の騎士ランスロットの父として知られる。", "en": "King of Benwick across the sea and elder brother of King Bors. In Arthurian legend he is celebrated as the father of Sir Launcelot.", "zh_tw": "統治海外本威克的國王，博爾斯王的兄長。在亞瑟王傳說中以圓桌騎士蘭斯洛特之父聞名。", "zh_cn": "统治海外本威克的国王，博尔斯王的兄长。在亚瑟王传说中以圆桌骑士兰斯洛特之父闻名。", "ko": "바다 건너 벤윅을 다스리는 왕이자 보어스 왕의 형. 아서 왕 전설에서는 원탁의 기사 란슬롯의 아버지로 유명하다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "ボールス": {"name": "ボールス（ぼーるす：ガリアの王・バン王の弟）", "display_name": "ボールス（ガリアの王・バン王の弟）", "yomi": "ぼーるす", "wiki_title": "ボールス", "role": "ガリアの王・バン王の弟", "ai_desc": "大陸のガリア（ゴーヌ）を治める王で、バン王の弟。兄バンとともにアーサー王伝説の初期の戦いで重要な役割を担う。", "role_i18n": {"ja": "ガリアの王・バン王の弟", "en": "King of Gaul, younger brother of King Ban", "zh_tw": "高盧之王，班王之弟", "zh_cn": "高卢之王，班王之弟", "ko": "골의 왕, 반 왕의 아우"}, "desc_i18n": {"ja": "大陸のガリア（ゴーヌ）を治める王で、バン王の弟。兄バンとともにアーサー王伝説の初期の戦いで重要な役割を担う。", "en": "King of Gaul (Gaunes) across the sea and younger brother of King Ban, who plays a major part alongside his brother in the early wars of Arthurian legend.", "zh_tw": "統治海外高盧（戈訥）的國王，班王的弟弟，在亞瑟王傳說早期的戰事中與兄長並肩扮演重要角色。", "zh_cn": "统治海外高卢（戈讷）的国王，班王的弟弟，在亚瑟王传说早期的战事中与兄长并肩扮演重要角色。", "ko": "바다 건너 골(곤)을 다스리는 왕이자 반 왕의 아우로, 형 반과 함께 아서 왕 전설 초기의 전장에서 중요한 역할을 맡는다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "マドール・ド・ラ・ポルト": {"name": "マドール・ド・ラ・ポルト（まどーる・ど・ら・ぽると：のちに円卓に列する剛勇の騎士）", "display_name": "マドール・ド・ラ・ポルト（円卓の騎士）", "yomi": "まどーる・ど・ら・ぽると", "wiki_title": "", "role": "のちに円卓に列する騎士", "ai_desc": "アーサー王伝説に登場する名高い武勇の騎士。のちに円卓の騎士の一人として宮廷で重きをなす。", "role_i18n": {"ja": "のちに円卓に列する騎士", "en": "Valiant knight, later of the Round Table", "zh_tw": "勇猛的騎士，後入列圓桌", "zh_cn": "勇猛的骑士，后入列圆桌", "ko": "훗날 원탁에 합류하는 용맹한 기사"}, "desc_i18n": {"ja": "アーサー王伝説に登場する名高い武勇の騎士。のちに円卓の騎士の一人として宮廷で重きをなす。", "en": "A renowned knight of great prowess in Arthurian romance who later holds an honored place among the Knights of the Round Table.", "zh_tw": "亞瑟王傳說中以武勇聞名的騎士，後來成為圓桌騎士的一員，在宮廷中享有崇高聲望。", "zh_cn": "亚瑟王传说中以武勇闻名的骑士，后来成为圆桌骑士的一员，在宫廷中享有崇高声望。", "ko": "아서 왕 전설에 등장하는 이름난 무용의 기사로, 훗날 원탁의 기사 일원이 되어 궁정에서 높은 신망을 얻는다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "ベディヴィア": {"name": "ベディヴィア（べでぃゔぃあ：アーサー王の最古参の忠臣・円卓の騎士）", "display_name": "ベディヴィア（円卓の騎士・アーサー王の忠臣）", "yomi": "べでぃゔぃあ", "wiki_title": "ベディヴィア", "role": "円卓の騎士・アーサー王の忠臣", "ai_desc": "アーサー王伝説の最初期から語られる忠実な騎士で、円卓の騎士の一人。王の最期に最後まで付き従った騎士として知られる。", "role_i18n": {"ja": "円卓の騎士・アーサー王の忠臣", "en": "Knight of the Round Table, loyal retainer of Arthur", "zh_tw": "圓桌騎士，亞瑟王的忠臣", "zh_cn": "圆桌骑士，亚瑟王的忠臣", "ko": "원탁의 기사, 아서 왕의 충신"}, "desc_i18n": {"ja": "アーサー王伝説の最初期から語られる忠実な騎士で、円卓の騎士の一人。王の最期に最後まで付き従った騎士として知られる。", "en": "One of the earliest and most faithful companions of King Arthur and a Knight of the Round Table, famed as the last to attend the king at the end of his life.", "zh_tw": "亞瑟王傳說最早期的忠誠騎士之一，亦為圓桌騎士，以陪伴亞瑟王走完人生最後一刻而聞名。", "zh_cn": "亚瑟王传说最早期的忠诚骑士之一，亦为圆桌骑士，以陪伴亚瑟王走完人生最后一刻而闻名。", "ko": "아서 왕 전설 초기부터 전해지는 충실한 기사이자 원탁의 일원으로, 왕의 마지막 순간까지 곁을 지킨 기사로 널리 알려져 있다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "バラモルギネアス": {"name": "バラモルギネアス（ばらもるぎねあす：並外れた巨躯と怪力を誇る剛勇の騎士）", "display_name": "バラモルギネアス（巨躯の剛勇騎士）", "yomi": "ばらもるぎねあす", "wiki_title": "", "role": "巨躯と怪力を誇る騎士", "ai_desc": "パイル版に登場する巨漢の騎士。常人の三人を相手に渡り合えるほどの怪力の持ち主として描かれる。", "role_i18n": {"ja": "巨躯と怪力を誇る騎士", "en": "Knight of immense stature and strength", "zh_tw": "身軀魁梧、力大無窮的騎士", "zh_cn": "身躯魁梧、力大无穷的骑士", "ko": "거대한 체구와 괴력을 지닌 기사"}, "desc_i18n": {"ja": "パイル版に登場する巨漢の騎士。常人の三人を相手に渡り合えるほどの怪力の持ち主として描かれる。", "en": "A giant-framed knight in Pyle's tale, portrayed as possessing such extraordinary strength that he could withstand three ordinary knights at once.", "zh_tw": "派爾故事中 h Mabinogion and medieval chivalric romance as a hero of peerless courage and courtesy.", "zh_tw": "在威爾斯古典傳說《馬比諾吉昂》與中世紀騎士文學中備受推崇的圓桌騎士，以舉世無雙的勇武與騎士精神著稱。", "zh_cn": "在威尔士古典传说《马比诺吉昂》与中世纪骑士文学中备受推崇的圆桌骑士，以举世无双的勇武与骑士精神著称。", "ko": "웨일스 고전 이야기 『마비노기온』과 중세 기사도 문학에서 널리 칭송받는 원탁의 기사. 비길 데 없는 무용과 기사도 정신을 갖춘 영웅으로 알려져 있다."}, "sort_key_i18n": {"zh_tw": "J", "zh_cn": "J"}}, "ボドウィン": {"name": "ボドウィン（ぼどうぃん：ブリテンの高潔なる騎士）", "display_name": "ボドウィン（ブリテンの騎士）", "yomi": "ぼどうぃん", "wiki_title": "", "role": "ブリテンの騎士", "ai_desc": "アーサー王の宮廷に列するブリテンの高潔な騎士。マロリー『アーサー王の死』ではコーンウォールのマーク王の弟で信望厚い名将としても伝承される。", "role_i18n": {"ja": "ブリテンの騎士", "en": "Knight of Britain", "zh_tw": "不列顛騎士", "zh_cn": "不列颠骑士", "ko": "브리튼의 기사"}, "desc_i18n": {"ja": "アーサー王の宮廷に列するブリテンの高潔な騎士。マロリー『アーサー王の死』ではコーンウォールのマーク王の弟で信望厚い名将としても伝承される。", "en": "A noble knight of Britain attending King Arthur's court. In Malory's Le Morte d'Arthur he is also remembered as the honorable brother of King Mark of Cornwall.", "zh_tw": "列席亞瑟王宮廷的不列顛高潔騎士。在馬洛禮《亞瑟王之死》中，亦傳為康沃爾國王馬克德高望重的胞弟與名將。", "zh_cn": "列席亚瑟王宫廷的不列颠高洁骑士。在马洛礼《亚瑟王之死》中，亦传为康沃尔国王马克德高望重的胞弟与名将。", "ko": "아서 왕의 궁정에 자리한 브리튼의 고결한 기사. 맬러리의 『아서 왕의 죽음』에서는 콘월의 왕 마크의 아우이자 신망 두터운 명장으로도 전해진다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "コンスタンティン": {"name": "コンスタンティン（こんすたんてぃん：コーンウォール出身の円卓の騎士）", "display_name": "コンスタンティン（コーンウォールの騎士）", "yomi": "こんすたんてぃん", "wiki_title": "", "role": "コーンウォールの騎士・円卓の騎士", "ai_desc": "コーンウォールのカドール公の子とされる高潔な円卓の騎士。アーサー王伝説では、のちに王位を継ぐ人物としても知られる。", "role_i18n": {"ja": "コーンウォールの騎士・円卓の騎士", "en": "Knight of Cornwall, Knight of the Round Table", "zh_tw": "康沃爾騎士、圓桌騎士", "zh_cn": "康沃尔骑士、圆桌骑士", "ko": "콘월의 기사·원탁의 기사"}, "desc_i18n": {"ja": "コーンウォールのカドール公の子とされる高潔な円卓の騎士。アーサー王伝説では、のちに王位を継ぐ人物としても知られる。", "en": "A noble Knight of the Round Table from Cornwall, said to be the son of Cador. In Arthurian tradition he is also known as the successor to King Arthur's crown.", "zh_tw": "出身康沃爾的高潔圓桌騎士，傳為卡多爾之子。在亞瑟王傳說中，亦以日後繼承王位之人而聞名。", "zh_cn": "出身康沃尔的高洁圆桌骑士，传为卡多尔之子。在亚瑟王传说中，亦以日后继承王位之人而闻名。", "ko": "콘월 출신의 고결한 원탁의 기사로 카도르 공의 아들로 전해진다. 아서 왕 전설에서는 훗날 왕위를 잇는 인물로도 알려져 있다."}, "sort_key_i18n": {"zh_tw": "J", "zh_cn": "J"}}, "ブランディレス": {"name": "ブランディレス（ぶらんでぃれす：アーサー王の宮廷に仕える勇敢な円卓の騎士）", "display_name": "ブランディレス（円卓の騎士）", "yomi": "ぶらんでぃれす", "wiki_title": "", "role": "円卓の騎士", "ai_desc": "アーサー王伝説の諸篇にたびたび登場する勇敢な円卓の騎士。礼節と武勇を重んじる歴戦の騎士の一人として描かれる。", "role_i18n": {"ja": "円卓の騎士", "en": "Knight of the Round Table", "zh_tw": "圓桌騎士", "zh_cn": "圆桌骑士", "ko": "원탁의 기사"}, "desc_i18n": {"ja": "アーサー王伝説の諸篇にたびたび登場する勇敢な円卓の騎士。礼節と武勇を重んじる歴戦の騎士の一人として描かれる。", "en": "A gallant Knight of the Round Table who appears frequently across Arthurian tales as a seasoned warrior prizing chivalric courtesy and valor.", "zh_tw": "在亞瑟王傳說諸篇中屢屢登場的勇敢圓桌騎士，被描繪為崇尚禮節與武勇的百戰名將之一。", "zh_cn": "在亚瑟王传说诸篇中屡屡登场的勇敢圆桌骑士，被描绘为崇尚礼节与武勇的百战名将之一。", "ko": "아서 왕 전설의 여러 편에 자주 등장하는 용감한 원탁의 기사. 예절과 무용을 중시하는 역전의 기사 중 한 사람으로 그려진다."}, "sort_key_i18n": {"zh_tw": "B", "zh_cn": "B"}}, "マイルズ": {"name": "マイルズ（まいるず：「白泉の騎士」と称される北方の城主・遍歴の騎士）", "display_name": "マイルズ（白泉の騎士）", "yomi": "まいるず", "wiki_title": "", "role": "「白泉の騎士」と称される北方の領主・騎士", "ai_desc": "北方の地で七つの城と広大な領地を治める有力な騎士。「白泉の騎士（Sir Myles of the White Fountain）」と称され、春の訪れとともに武者修行の旅へ出る。", "role_i18n": {"ja": "「白泉の騎士」と称される北方の領主・騎士", "en": "Northern lord styled Knight of the White Fountain", "zh_tw": "號稱「白泉騎士」的北方領主與騎士", "zh_cn": "号称“白泉骑士”的北方领主与骑士", "ko": "‘하얀 샘의 기사’로 불리는 북방의 영주·기사"}, "desc_i18n": {"ja": "北方の地で七つの城と広大な領地を治める有力な騎士。「白泉の騎士（Sir Myles of the White Fountain）」と称され、春の訪れとともに武者修行の旅へ出る。", "en": "A powerful knight holding seven castles and wide estates in the northern lands. Styled Sir Myles of the White Fountain, he rides forth errant in the springtime in search of knightly adventure.", "zh_tw": "在北方坐擁七座城堡與廣闊領地的有力騎士，號稱「白泉騎士」，於春光明媚之際踏上尋求奇遇的遊俠征途。", "zh_cn": "在北方坐拥七座城堡与广阔领地的有力骑士，号称“白泉骑士”，于春光明媚之际踏上寻求奇遇的游侠征途。", "ko": "북방 땅에서 일곱 개의 성과 광대한 영지를 다스리는 유력한 기사. ‘하얀 샘의 기사’라 불리며, 봄이 찾아오자 무사수행과 모험을 찾아 편력의 길에 오른다."}, "sort_key_i18n": {"zh_tw": "M", "zh_cn": "M"}}, "グリフレット": {"name": "グリフレット（ぐりふれっと：アーサー王の宮廷に仕える若き従者・のちの円卓の騎士）", "di n": "G"}}};

搏斗中抵住倒地对手的喉咙或甲胄缝隙，迫使其求饶投降或给予致命一击。", "ko": "중세 유럽의 기사가 허리에 차던 가늘고 긴 단검. 라틴어로 ‘자비’를 뜻하며, 맞붙어 제압한 상대의 갑옷 틈새나 목덜미에 겨누어 항복을 받아 내거나 최후의 일격을 가하는 데 쓰였다."}, "sort_key_i18n": {"zh_tw": "C", "zh_cn": "C"}}};

          'data-tag-kind="' + escapeHtml(kind) + '" ' +
          'data-tag-key="' + escapeHtml(key) + '">' +
          escapeHtml(surface) +
          '</span>'
        );
        lastIdx = TAG_REGEX.lastIndex;
      }
      result += escapeHtml(src.slice(lastIdx));
      return result;
    }

    function collectPlaceKeysFromRecords(recordsList) {
      const keys = [];
      const seen = new Set();
      recordsList.forEach(function(rec) {
        if (rec.places) {
          rec.places.split(",").forEach(function(k) {
            const trimmed = k.trim();
            if (trimmed && PLACES_MASTER[trimmed] && !seen.has(trimmed)) {
              seen.add(trimmed);
              keys.push(trimmed);
            }
          });
        }
      });
      return keys;
    }

    function openGlossaryModal(kind, key) {
      let entry = null;
      if (kind === "person") entry = PERSON_GLOSSARY[key];
      else if (kind === "office") entry = OFFICE_GLOSSARY[key];
      else if (kind === "special") entry = SPECIAL_GLOSSARY[key];
      if (!entry) return;

      const titleStr = entry.name || entry.title || key;
      modalTitleEl.textContent = titleStr;

      const htmlParts = [];

      if (kind === "person" && Array.isArray(entry.homonyms) && entry.homonyms.length > 0) {
        const allKeys = [key].concat(entry.homonyms);
        htmlParts.push('<div class="homonym-switch-bar">');
        htmlParts.push('<span style="font-size:0.74rem;font-weight:700;color:#5a4631;width:100%;">👥 同名異人の切り替え：</span>');
        allKeys.forEach(function(hKey) {
          const hEntry = PERSON_GLOSSARY[hKey];
          if (!hEntry) return;
          const curCls = hKey === key ? " is-current" : "";
          const btnLabel = hEntry.display_name || hKey;
          htmlParts.push(
            '<button type="button" class="homonym-btn' + curCls + '" ' +
            'data-switch-kind="person" data-switch-key="' + escapeHtml(hKey) + '">' +
            escapeHtml(btnLabel) + '</button>'
          );
        });
        htmlParts.push('</div>');
      }

      if (entry.role || entry.rank) {
        htmlParts.push('<div class="modal-role-badge">' + escapeHtml(entry.role || entry.rank) + '</div>');
      }

      if (entry.mapping_note) {
        htmlParts.push('<div class="modal-mapping-note">' + escapeHtml(entry.mapping_note) + '</div>');
      }

      htmlParts.push('<div>' + escapeHtml(entry.ai_desc || "") + '</div>');

      if (entry.wiki_title) {
        const wikiUrl = "https://ja.wikipedia.org/wiki/" + encodeURIComponent(entry.wiki_title);
        htmlParts.push(
          '<div id="modalWikiBox" class="modal-wiki-box">' +
          '<strong>🌐 Wikipedia（' + escapeHtml(entry.wiki_title) + '）</strong>' +
          '<div id="modalWikiExtract" style="margin-top:4px;color:#4a3f33;">読み込み中…</div>' +
          '<div style="margin-top:4px;"><a href="' + escapeHtml(wikiUrl) + '" target="_blank" rel="noopener noreferrer">Wikipedia記事を開く ↗</a></div>' +
          '</div>'
        );
      }

      const crossIdx = window.SHARED_CROSS_INDEX;
      if (crossIdx && crossIdx.occurrences && crossIdx.occurrences[kind] && crossIdx.occurrences[kind][key]) {
        const occRecIds = crossIdx.occurrences[kind][key];
        if (occRecIds.length > 0) {
          htmlParts.push('<div class="modal-occ-section">');
          htmlParts.push('<div class="modal-occ-heading">📖 登場箇所へジャンプ</div>');
          htmlParts.push('<div class="occ-jump-list">');
          occRecIds.forEach(function(rid) {
            const recMeta = crossIdx.records[rid];
            if (!recMeta) return;
            const volFile = "vol" + String(recMeta.vol_id).padStart(2, "0") + ".html";
            const label = "第" + recMeta.vol_id + "章 第" + recMeta.para + "段";
            if (Number(recMeta.vol_id) === CURRENT_VOL_ID) {
              htmlParts.push(
                '<button type="button" class="occ-jump-btn" data-jump-para="' + recMeta.para + '" data-jump-rec="' + escapeHtml(rid) + '">' +
                escapeHtml(label) + '</button>'
              );
            } else {
              htmlParts.push(
                '<a class="occ-jump-btn" href="' + escapeHtml(volFile) + '?para=' + recMeta.para + '&rec=' + encodeURIComponent(rid) + '">' +
                escapeHtml(label) + '</a>'
              );
            }
          });
          htmlParts.push('</div></div>');
        }
      }

      modalBodyEl.innerHTML = htmlParts.join("");
      modalEl.classList.add("is-open");

      if (entry.wiki_title) {
        const wTitle = entry.wiki_title;
        const targetDiv = document.getElementById("modalWikiExtract");
        if (wikiCache[wTitle]) {
          if (targetDiv) targetDiv.textContent = wikiCache[wTitle];
        } else {
          fetch("https://ja.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(wTitle))
            .then(function(res) { return res.ok ? res.json() : null; })
            .then(function(data) {
              const txt = (data && data.extract) ? data.extract : "Wikipedia要約を取得できませんでした。リンクから直接ご覧ください。";
              wikiCache[wTitle] = txt;
              const currentDiv = document.getElementById("modalWikiExtract");
              if (currentDiv) currentDiv.textContent = txt;
            })

              const currentDiv = document.getElementById("modalWikiExtract");
              if (currentDiv) currentDiv.textContent = "オフラインまたは接続制限のためWikipedia要約を表示できません。";
            });
        }
      }
    }

      const dict = UI_I18N[currentLang] || UI_I18N.ja;
      const targetList = isAllParasMode
        ? VISIBLE_RECORDS
        : VISIBLE_RECORDS.filter(function(r) { return Number(r.para_index) === currentParaIndex; });

        const badgeCls = "type-badge" + (isVerse ? " verse" : "");
        const typeLabel = isVerse ? dict.typeVerse : dict.typeProse;
        const eraText = (rec.era_year_i18n && rec.era_year_i18n[currentLang])
          ? rec.era_year_i18n[currentLang]
          : (rec.era_year || "");
        const eraHtml = eraText ? '<span class="era-badge">⏳ ' + escapeHtml(eraText) + '</span>' : "";

        let mainTagged = rec.translation_tagged || "";
        let subSummary = dict.sourceSummary;
        let subTagged = rec.raw_tagged || "";
        let fallbackBanner = "";

        if (currentLang === "en") {
          mainTagged = rec.raw_tagged || "";
          subSummary = dict.refJaSummary;
          subTagged = rec.translation_tagged || "";
        } else if (currentLang === "zh_tw") {
          if (rec.zh_tw_tagged) {
            mainTagged = rec.zh_tw_tagged;
          } else {
            fallbackBanner = '<div class="untranslated-banner">' + escapeHtml(dict.untranslatedNote) + '</div>';
          }
        } else if (currentLang === "zh_cn") {
          if (rec.zh_cn_tagged) {
            mainTagged = rec.zh_cn_tagged;
          } else {
            fallbackBanner = '<div class="untranslated-banner">' + escapeHtml(dict.untranslatedNote) + '</div>';
          }
        } else if (currentLang === "ko") {
          if (rec.ko_tagged) {
            mainTagged = rec.ko_tagged;
          } else {
            fallbackBanner = '<div class="untranslated-banner">' + escapeHtml(dict.untranslatedNote) + '</div>';
          }

        return (
          '<article class="' + cardCls + '" id="card-' + escapeHtml(rec.id) + '" data-rec-id="' + escapeHtml(rec.id) + '" data-para-index="' + rec.para_index + '">' +
            '<div class="card-meta-bar">' +
              '<div class="card-badges">' +
                '<span class="' + badgeCls + '">' + escapeHtml(dict.paraBadgePrefix + rec.para_index + dict.paraBadgeMid + typeLabel) + '</span>' +
                eraHtml +
              '</div>' +
              '<span>' + escapeHtml(rec.id) + '</span>' +
            '</div>' +
            fallbackBanner +
            '<div class="trans-box">' + convertTaggedTextToHtml(mainTagged) + '</div>' +
            (currentLang === "en" ? "" : (
              '<details class="source-details" open>' +
                '<summary>' + escapeHtml(subSummary) + '</summary>' +
                '<div class="source-text-body">' + convertTaggedTextToHtml(subTagged) + '</div>' +

        updateParaControlsState();

      const cardEl = document.getElementById("card-" + recId) ||
        recordsContainerEl.querySelector('[data-para-index="' + paraNum + '"]');
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: "smooth", block: "start" });

    recordsContainerEl.addEventListener("click", function(ev) {
      const baseTarget = (ev.target && ev.target.nodeType === 1) ? ev.target : (ev.target ? ev.target.parentElement : null);
      if (!baseTarget) return;

      const tagEl = baseTarget.closest("[data-tag-kind]");
      if (tagEl) {
        const kind = tagEl.getAttribute("data-tag-kind");
        const key = tagEl.getAttribute("data-tag-key");
        if (kind === "place") {
          mapCtrl.focusPlace(key, tagEl.textContent || key, true);
        } else {
          openGlossaryModal(kind, key);
        }
        return;
      }

      const devBtn = baseTarget.closest("[data-dev-rec]");
      if (devBtn) {
        const rid = devBtn.getAttribute("data-dev-rec");
        const dtype = devBtn.getAttribute("data-dev-type");
        const memo = window.prompt("[" + rid + " / " + dtype + "] 指摘メモを入力してください:", "");
        if (memo !== null) {
          addDevFeedbackItem({ rec_id: rid, category: dtype, note: memo, ts: new Date().toISOString() });
        }
      }
    });

    // 段落コントロール操作（ピン入れ替えのみ・地図中心は維持）
    paraSelectEl.addEventListener("change", function() {
      const chosen = Number(paraSelectEl.value);
      currentParaIndex = chosen;
      if (isAllParasMode) {
        const paraRecs = VISIBLE_RECORDS.filter(function(r) { return Number(r.para_index) === chosen; });
        mapCtrl.renderPlaceKeys(collectPlaceKeysFromRecords(paraRecs), false);
        const targetEl = recordsContainerEl.querySelector('[data-para-index="' + chosen + '"]');
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        updateParaControlsState();
      } else {
        recordsScrollEl.scrollTop = 0;
        renderRecords(true);
      }
    });

    prevParaBtn.addEventListener("click", function() {
      const idx = AVAILABLE_PARAS.indexOf(currentParaIndex);
      if (idx > 0) {
        paraSelectEl.value = String(AVAILABLE_PARAS[idx - 1]);
        paraSelectEl.dispatchEvent(new Event("change"));
      }
    });

    nextParaBtn.addEventListener("click", function() {
      const idx = AVAILABLE_PARAS.indexOf(currentParaIndex);
      if (idx >= 0 && idx < AVAILABLE_PARAS.length - 1) {
        paraSelectEl.value = String(AVAILABLE_PARAS[idx + 1]);
        paraSelectEl.dispatchEvent(new Event("change"));
      }
    });

    toggleAllParasBtn.addEventListener("click", function() {
      isAllParasMode = !isAllParasMode;
      recordsScrollEl.scrollTop = 0;
      renderRecords(true);
    });

    // 初期描画＆URLクエリ (?para=X&rec=Y&place=Z) 対応
    applyLanguageToStaticUi();
    updateDevCounter();
    renderRecords(true);

    const qPara = Number(urlParams.get("para"));
    const qRec = urlParams.get("rec");
    const qPlace = urlParams.get("place");
    if (qPara && AVAILABLE_PARAS.includes(qPara)) {
      setTimeout(function() {
        jumpToRecordInPage(qPara, qRec || ("v" + CURRENT_VOL_ID + "_p" + qPara + "_1"));
        if (qPlace) {
          mapCtrl.focusPlace(qPlace, qPlace, true);
        }
      }, QUERY_JUMP_DELAY_MS);
    } else if (qPlace) {
      setTimeout(function() {
        mapCtrl.focusPlace(qPlace, qPlace, true);
      }, QUERY_JUMP_DELAY_MS);
    }
  })();
  </script>
</body>
</html>
