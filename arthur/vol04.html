  <meta name="apple-mobile-web-app-title" content="アーサー王物語">
  <meta name="theme-color" content="#2c241b">
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png?v=3">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    /* =========================================================================
       CSSレイアウト・配色定数（『正史三國志』ブラウン／羊皮紙テーマ完全準拠）
       ========================================================================= */
    :root {
      --bg-header-dark: #2c241b;
      --bg-header-sub: #3d2f1d;
      --bg-parchment: #f4f1ea;
      --bg-card: #fffdf9;
      --border-warm: #dcd3c1;
      --accent-gold: #8c6d46;
      --accent-gold-light: #d4b483;
      --accent-red: #b3392b;
      --text-primary: #261f18;
      --text-muted: #6b5c4c;
      --place-green: #1e6b3b;
      --person-brown: #7c3f12;
      --office-blue: #1e4e79;
      --special-purple: #63317c;
      --desktop-pane-width-pct: 50%;
      --mobile-map-height-pct: 40%;
      --mobile-reader-height-pct: 60%;
      --reader-bottom-safe-px: 48px;
      --z-map-controls: 700;
      --z-map-toast: 720;
      --z-map-modal: 850;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-parchment);
      color: var(--text-primary);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      -webkit-text-size-adjust: 100%;
    }

    .app-shell {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }

    /* 左ペイン：地図＋上部ナビ＋解説モーダル */
    .left-pane {
      position: relative;
      display: flex;
      flex-direction: column;
      width: var(--desktop-pane-width-pct);
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      flex-shrink: 0;
      border-right: 2px solid #bda988;
      background: #dfd7c5;
    }

    #map {
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
    }

    /* 地図上の巻切り替えバー（本家『正史三國志』と同一のスリム1行構成） */
    .vol-nav-bar {
      height: 38px;
      min-height: 38px;
      background: #2c241b;
      color: #f7f1e5;
      border-bottom: 1.5px solid #8c6d46;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      z-index: 2000;
      user-select: none;
      position: relative;
      flex-shrink: 0;
    }
    .home-top-link {
      position: absolute;
      left: 10px;
      background: #3e2723;
      color: #ffe082;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: bold;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }
    .home-top-link:hover { background: #5d4037; color: #fff; }
    .slim-nav-btn {
      background: #4e342e;
      color: #ffd54f;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1.3;
      text-decoration: none;
    }
    .slim-nav-btn:hover:not(:disabled) { background: #6d4c41; color: #fff; }
    .slim-nav-btn:disabled {
      background: transparent;
      color: #6d5d4b;
      border-color: #4e342e;
      cursor: not-allowed;
    }
    .vol-nav-select {
      background: #3e2723;
      color: #f7f1e5;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-family: "Yu Mincho", "MS PMincho", serif;
      letter-spacing: 0.05em;
      min-width: 0;
      max-width: 240px;
    }
    @media (max-width: 520px) {
      .vol-nav-bar { gap: 6px; padding: 0 6px; }
      .home-top-link { position: static; margin-right: auto; padding: 2px 6px; font-size: 0.72rem; }
      .vol-nav-select { max-width: 150px; font-size: 0.8rem; }
    }

    /* 地図右上：[📌 地図固定] ボタン（レイヤーアイコンの左隣） */
    .map-lock-btn {
      position: absolute;
      top: 10px;
      right: 54px;
      z-index: var(--z-map-controls);
      background: rgba(255, 253, 249, 0.95);
      color: var(--text-primary);
      border: 1px solid #a38e6d;
      border-radius: 6px;
      padding: 5px 9px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
      white-space: nowrap;
    }

    .map-lock-btn.is-locked {
      background: var(--accent-red);
      color: #ffffff;
      border-color: #7c1f15;
    }

    /* 地図左下の1行トースト */
    .map-toast {
      position: absolute;
      left: 10px;
      bottom: 18px;
      max-width: calc(100% - 20px);
      z-index: var(--z-map-toast);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(44, 36, 27, 0.94);
      color: #fdf8ee;
      border-left: 3px solid var(--accent-gold-light);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .map-toast.is-visible {
      display: inline-flex;
    }

    .map-toast-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-toast-close {
      background: transparent;
      border: none;
      color: #dfd3be;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }

    /* 自然地形・地名ピンラベル */
    .nature-mtn-label {
      color: #5c4328;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .nature-river-label {
      color: #1f5a8a;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .place-pin-tooltip {
      background: rgba(44, 36, 27, 0.9);
      color: #fffdf8;
      border: 1px solid #d4b483;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .area-badge-label {
      background: rgba(179, 57, 43, 0.84);
      color: #ffffff;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 左ペイン上の解説モーダル（右ペインの読書画面を隠さない） */
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: var(--z-map-modal);
      background: rgba(28, 22, 16, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      max-height: 88%;
      background: var(--bg-card);
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.38);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .modal-header {
      background: var(--bg-header-dark);
      color: #f8f1e4;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .modal-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .modal-close-btn {
      background: rgba(255,255,255,0.14);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.82rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .homonym-switch-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      padding: 7px 9px;
      background: #f5ede0;
      border: 1px solid #d7c4a3;
      border-radius: 6px;
    }

    .homonym-btn {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #a88d63;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .homonym-btn.is-current {
      background: var(--bg-header-sub);
      color: #ffffff;
      border-color: var(--bg-header-dark);
    }

    .modal-role-badge {
      display: inline-block;
      background: #efe6d5;
      color: #4d3922;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-mapping-note {
      background: #f8f2e7;
      border-left: 3px solid var(--accent-gold);
      padding: 6px 9px;
      font-size: 0.78rem;
      color: #5a4631;
      margin-bottom: 8px;
    }

    .modal-wiki-box {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f4f1ea;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .modal-occ-section {
      margin-top: 12px;
      border-top: 1px solid var(--border-warm);
      padding-top: 9px;
    }

    .modal-occ-heading {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .occ-jump-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .occ-jump-btn {
      background: #fffdf9;
      color: var(--office-blue);
      border: 1px solid #b8c7d9;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .occ-jump-btn:hover {
      background: #eaf2fa;
    }

    /* 右ペイン：ヘッダ＋段落バー＋本文カードスクロール */
    .right-pane {
      width: var(--desktop-pane-width-pct);
      height: 100%;
      min-height: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-parchment);
    }

    .reader-header {
      background: var(--bg-header-dark);
      color: #f6efe2;
      padding: 7px 12px;
      border-bottom: 1px solid #6e5536;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reader-title-group {
      min-width: 0;
    }

    .reader-app-name {
      font-size: 0.72rem;
      color: var(--accent-gold-light);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .reader-vol-title {
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 段落切替コントロールバー */
    .para-bar {
      background: var(--bg-header-sub);
      color: #f3eadb;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
      border-bottom: 1px solid #6e5536;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .para-btn {
      background: rgba(255,255,255,0.12);
      color: #f8f1e4;
      border: 1px solid rgba(212,180,131,0.45);
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .para-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .para-btn.is-active-mode {
      background: var(--accent-gold);
      color: #ffffff;
      border-color: var(--accent-gold-light);
    }

    .para-select {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #b8a382;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      flex: 1 1 130px;
      min-width: 0;
      max-width: 240px;
    }

    /* 手元校正モード専用パネル（本番Webでは非表示） */
    .dev-feedback-panel {
      display: none;
      background: #fdf6e9;
      border-bottom: 2px solid #c9a66b;
      padding: 7px 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    .dev-feedback-panel.is-dev {
      display: block;
    }

    .dev-panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-mini-btn {
      background: #fffdf9;
      border: 1px solid #9c7d4c;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 記事スクロール領域（スマホ下端見切れ防止） */
    .records-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(var(--reader-bottom-safe-px) + env(safe-area-inset-bottom, 0px));
    }

    .record-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      border-left: 4px solid #cbbba0;
      border-radius: 7px;
      padding: 13px 15px;
      margin-bottom: 13px;
      box-shadow: 0 1px 4px rgba(44, 36, 27, 0.06);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .record-card.active-card {
      border-left-color: var(--accent-red);
      box-shadow: 0 2px 10px rgba(179, 57, 43, 0.15);
    }

    .record-card.is-verse {
      background: #fcf8ef;
      border-left-color: var(--accent-gold);
    }

    .card-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .type-badge {
      background: #ebe3d3;
      color: #3d2f1d;
      border-radius: 4px;
      padding: 1px 7px;
      font-weight: 700;
      font-size: 0.72rem;
    }

    .type-badge.verse {
      background: #e9d8b8;
      color: #5b3d14;
    }

    .era-badge {
      color: #6b5c4c;
      font-weight: 600;
    }

    .trans-box {
      font-size: 0.98rem;
      line-height: 1.9;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .record-card.is-verse .trans-box {
      font-style: italic;
      padding-left: 8px;
      border-left: 2px solid #dfd0b4;
    }

    /* 4分類インラインクリックタグ（PROJECT_RULES 第3章1節準拠） */
    .inline-place {
      color: var(--place-green);
      border-bottom: 2px solid var(--place-green);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-person {
      color: var(--person-brown);
      border-bottom: 1.5px dotted var(--person-brown);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-office {
      color: var(--office-blue);
      border-bottom: 1.5px dashed var(--office-blue);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-special {
      color: var(--special-purple);
      border-bottom: 1.5px dotted var(--special-purple);
      cursor: pointer;
      font-weight: 600;
      padding: 0 1px;
    }

    .inline-place:hover, .inline-person:hover, .inline-office:hover, .inline-special:hover {
      background: rgba(212, 180, 131, 0.22);
    }

    /* 英語底本折りたたみ表示 */
    .source-details {
      margin-top: 10px;
      border-top: 1px dashed var(--border-warm);
      padding-top: 7px;
    }

    .source-details summary {
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
      user-select: none;
    }

    .source-text-body {
      margin-top: 7px;
      padding: 8px 10px;
      background: #f7f3eb;
      border-radius: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      line-height: 1.72;
      color: #33291e;
    }

    /* 手元校正用1クリック指摘ボタン列 */
    .card-dev-bar {
      display: none;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dotted #d7cbb8;
      gap: 5px;
      flex-wrap: wrap;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body.is-dev-mode .card-dev-bar {
      display: flex;
    }

    .dev-flag-btn {
      background: #faf4e8;
      color: #5c472c;
      border: 1px solid #cbb692;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.71rem;
      cursor: pointer;
    }

    .adsense-footer-box {
      margin-top: 18px;
      padding: 10px;
      background: #efeae0;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* スマホ・タブレット縦（横幅900px以下：上40%地図・下60%本文） */
    @media (max-width: 900px) {
      .app-shell {
        flex-direction: column;
      }
      .left-pane {
        width: 100%;
        height: var(--mobile-map-height-pct);
        border-right: none;
        border-bottom: 2px solid #bda988;
      }
      .right-pane {
        width: 100%;
        height: var(--mobile-reader-height-pct);
      }
      .map-lock-btn {
        top: 8px;
        right: 48px;
        padding: 4px 7px;
        font-size: 0.72rem;
      }
    }
    /* 手元校正トレイ：地図右下の折りたたみ式（本家 feedback-tray 準拠） */
    .dev-feedback-panel {
      position: absolute;
      right: 10px;
      bottom: 28px;
      z-index: 1500;
      width: 230px;
      padding: 0;
      border: 1px solid #c9a66b;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .dev-tray-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;

": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p3_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 3, "type": "本文", "raw_text": "So, when the morning was half gone by, the Archbishop himself came with great pomp of estate and took his seat upon the high throne that had been placed for him, and all his court of clerks and knights gathered about him, so that he presented a very proud and excellent appearance of courtliness.", "translation": "かくして午前の半ばが過ぎたころ、大司教その人が威風堂々たる格式の行列を従えて姿を現し、自らのために据えられた高い玉座に着席した。そして聖職者や騎士たちからなる随員一同がその周囲に居並んだので、まことに誇り高く見事な宮廷風の威容を呈していた。", "raw_tagged": "So, when the morning was half gone by, the {{office:大司教|Archbishop}} himself came with great pomp of estate and took his seat upon the high throne that had been placed for him, and all his court of clerks and {{office:騎士|knights}} gathered about him, so that he presented a very proud and excellent appearance of courtliness.", "translation_tagged": "かくして午前の半ばが過ぎたころ、{{office:大司教|大司教}}その人が威風堂々たる格式の行列を従えて姿を現し、自らのために据えられた高い玉座に着席した。そして聖職者や{{office:騎士|騎士}}たちからなる随員一同がその周囲に居並んだので、まことに誇り高く見事な宮廷風の威容を呈していた。", "persons": "", "places": "", "offices": "大司教,騎士", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是，當上午過了一半時，大主教本人帶著極盡隆重的排場親臨現場，登上為他安置的高聳寶座就座；他麾下全體教士與騎士隨扈簇擁在側，展現出一派無比威嚴而尊貴非凡的宮廷氣度。", "zh_tw_tagged": "於是，當上午過了一半時，{{office:大司教|大主教}}本人帶著極盡隆重的排場親臨現場，登上為他安置的高聳寶座就座；他麾下全體教士與{{office:騎士|騎士}}隨扈簇擁在側，展現出一派無比威嚴而尊貴非凡的宮廷氣度。", "zh_cn": "于是，当上午过了一半时，大主教本人带着极尽隆重的排场亲临现场，登上为他安置的高耸宝座就座；他麾下全体教士与骑士随扈簇拥在侧，展现出一派无比威严而尊贵非凡的宫廷气度。", "zh_cn_tagged": "于是，当上午过了一半时，{{office:大司教|大主教}}本人带着极尽隆重的排场亲临现场，登上为他安置的高耸宝座就座；他麾下全体教士与{{office:騎士|骑士}}随扈簇拥在侧，展现出一派无比威严而尊贵非凡的宫廷气度。", "ko": "이윽고 오전 시간이 절반쯤 지났을 무렵, 대주교가 친히 지극히 성대하고도 위엄 있는 행차를 거느리고 나타나 자신을 위해 마련된 높은 좌석에 올랐다. 그리고 그를 따르는 성직자들과 기사들이 모두 그 주위에 둘러서니, 참으로 당당하고도 기품 넘치는 궁정의 위용을 드러내었다.", "ko_tagged": "이윽고 오전 시간이 절반쯤 지났을 무렵, {{office:大司教|대주교}}가 친히 지극히 성대하고도 위엄 있는 행차를 거느리고 나타나 자신을 위해 마련된 높은 좌석에 올랐다. 그리고 그를 따르는 성직자들과 {{office:騎士|기사}}들이 모두 그 주위에 둘러서니, 참으로 당당하고도 기품 넘치는 궁정의 위용을 드러내었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p4_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 4, "type": "本文", "raw_text": "Now unto that assay there had gathered nineteen kings and sixteen dukes, and each of these was of such noble and exalted estate that he entertained high hopes that he would that day be approved before the world to be the right king and overlord of all Britain. Wherefore after the Archbishop had established himself upon his throne, there came several of these and made demand that he should straightway put that matter to the test. So the Archbishop commanded his herald for to sound a trumpet, and to bid all who had the right to make assay of the sword to come unto that adventure, and the herald did according as the Archbishop ordered.", "translation": "さて、この剣の試しには十九人の王と十六人の公爵とが参集していたが、その一人ひとりはいずれ劣らぬ高貴にして尊崇すべき身分であったため、誰しもこの日こそ自分が世の人々の御前で全ブリテンの正統なる王にして最高君主として認められるであろうと大いなる期待を胸に抱いていた。それゆえ大司教が玉座に威儀を正して着くと、彼らのうちの幾人かが進み出て、ただちにその件を試しにかけるよう要求した。そこで大司教はお抱えの紋章官に命じてラッパを吹き鳴らさせ、その剣の試しに挑む資格を有するすべての者に対し、この冒険へ進み出るよう布告させた。紋章官は大司教の命じたとおりに執り行った。", "raw_tagged": "Now unto that assay there had gathered nineteen {{office:王|kings}} and sixteen {{office:公爵|dukes}}, and each of these was of such noble and exalted estate that he entertained high hopes that he would that day be approved before the world to be the right {{office:王|king}} and overlord of all {{place:ブリテン島|Britain}}. Wherefore after the {{office:大司教|Archbishop}} had established himself upon his throne, there came several of these and made demand that he should straightway put that matter to the test. So the {{office:大司教|Archbishop}} commanded his {{office:紋章官|herald}} for to sound a trumpet, and to bid all who had the right to make assay of the sword to come unto that adventure, and the {{office:紋章官|herald}} did according as the {{office:大司教|Archbishop}} ordered.", "translation_tagged": "さて、この剣の試しには十九人の{{office:王|王}}と十六人の{{office:公爵|公爵}}とが参集していたが、その一人ひとりはいずれ劣らぬ高貴にして尊崇すべき身分であったため、誰しもこの日こそ自分が世の人々の御前で全{{place:ブリテン島|ブリテン}}の正統なる{{office:王|王}}にして最高君主として認められるであろうと大いなる期待を胸に抱いていた。それゆえ{{office:大司教|大司教}}が玉座に威儀を正して着くと、彼らのうちの幾人かが進み出て、ただちにその件を試しにかけるよう要求した。そこで{{office:大司教|大司教}}はお抱えの{{office:紋章官|紋章官}}に命じてラッパを吹き鳴らさせ、その剣の試しに挑む資格を有するすべての者に対し、この冒険へ進み出るよう布告させた。{{office:紋章官|紋章官}}は{{office:大司教|大司教}}の命じたとおりに執り行った。", "persons": "", "places": "ブリテン島", "offices": "王,公爵,大司教,紋章官", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "前來參加這場試煉的共有十九位國王與十六位公爵，他們每一位都出身極為尊貴顯赫，各自滿懷厚望，期盼自己能於當日在世人面前獲證為全不列顛的正統國王與最高君主。因此，待大主教在寶座上坐定之後，他們之中便有數人上前，要求立刻展開這場試煉。於是大主教吩咐麾下的紋章官吹響號角，傳令凡有資格試拔此劍之人皆上前參與這場奇遇；紋章官便遵照大主教之命行事。", "zh_tw_tagged": "前來參加這場試煉的共有十九位{{office:王|國王}}與十六位{{office:公爵|公爵}}，他們每一位都出身極為尊貴顯赫，各自滿懷厚望，期盼自己能於當日在世人面前獲證為全{{place:ブリテン島|不列顛}}的正統{{office:王|國王}}與最高君主。因此，待{{office:大司教|大主教}}在寶座上坐定之後，他們之中便有數人上前，要求立刻展開這場試煉。於是{{office:大司教|大主教}}吩咐麾下的{{office:紋章官|紋章官}}吹響號角，傳令凡有資格試拔此劍之人皆上前參與這場奇遇；{{office:紋章官|紋章官}}便遵照{{office:大司教|大主教}}之命行事。", "zh_cn": "前来参加这场试炼的共有十九位国王与十六位公爵，他们每一位都出身极为尊贵显赫，各自满怀厚望，期盼自己能于当日在世人面前获证为全不列颠的正统国王与最高君主。因此，待大主教在宝座上坐定之后，他们之中便有数人上前，要求立刻展开这场试炼。于是大主教吩咐麾下的纹章官吹响号角，传令凡有资格试拔此剑之人皆上前参与这场奇遇；纹章官便遵照大主教之命行事。", "zh_cn_tagged": "前来参加这场试炼的共有十九位{{office:王|国王}}与十六位{{office:公爵|公爵}}，他们每一位都出身极为尊贵显赫，各自满怀厚望，期盼自己能于当日在世人面前获证为全{{place:ブリテン島|不列颠}}的正统{{office:王|国王}}与最高君主。因此，待{{office:大司教|大主教}}在宝座上坐定之后，他们之中便有数人上前，要求立刻展开这场试炼。于是{{office:大司教|大主教}}吩咐麾下的{{office:紋章官|纹章官}}吹响号角，传令凡有资格试拔此剑之人皆上前参与这场奇遇；{{office:紋章官|纹章官}}便遵照{{office:大司教|大主教}}之命行事。", "ko": "이제 그 시험 자리에는 열아홉 명의 왕과 열여섯 명의 공작이 모여 있었는데, 그들 한 사람 한 사람이 모두 지극히 고귀하고도 드높은 신분이었기에 저마다 바로 오늘 온 세상 앞에서 자신이 전 브리튼의 정당한 왕이자 최고 군주로 인정받게 되리라는 부푼 희망을 품고 있었다. 그리하여 대주교가 좌석에 자리 잡고 앉자, 그들 가운데 몇몇이 앞으로 나아와 당장 그 일을 시험에 부쳐 달라고 요구했다. 이에 대주교는 자신의 문장관에게 명하여 나팔을 불게 하고, 검을 시험할 자격을 지닌 모든 이에게 앞으로 나와 이 모험에 임하라고 포고하게 하니, 문장관은 대주교가 명한 대로 행하였다.", "ko_tagged": "이제 그 시험 자리에는 열아홉 명의 {{office:王|왕}}과 열여섯 명의 {{office:公爵|공작}}이 모여 있었는데, 그들 한 사람 한 사람이 모두 지극히 고귀하고도 드높은 신분이었기에 저마다 바로 오늘 온 세상 앞에서 자신이 전 {{place:ブリテン島|브리튼}}의 정당한 {{office:王|왕}}이자 최고 군주로 인정받게 되리라는 부푼 희망을 품고 있었다. 그리하여 {{office:大司教|대주교}}가 좌석에 자리 잡고 앉자, 그들 가운데 몇몇이 앞으로 나아와 당장 그 일을 시험에 부쳐 달라고 요구했다. 이에 {{office:大司教|대주교}}는 자신의 {{office:紋章官|문장관}}에게 명하여 나팔을 불게 하고, 검을 시험할 자격을 지닌 모든 이에게 앞으로 나와 이 모험에 임하라고 포고하게 하니, {{office:紋章官|문장관}}은 {{office:大司教|대주교}}가 명한 대로 행하였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p5_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 5, "type": "本文", "raw_text": "And when the herald had sounded his trumpet there immediately appeared the first of those kings to make trial of the sword, and he who came was King Lot of Orkney and the Isles. With King Lot there came eleven knights and five esquires, so that he appeared in very noble estate before the eyes of all. And when King Lot had arrived at that place, he mounted the platform. And first he saluted the Archbishop, and then he laid his hands to the pommel of the sword in the sight of all. And he bent his body and drew upon the sword with great strength, but he could not move the blade in the anvil even so much as the breadth of a hair, for it stood as fast as the iron in which it was planted. And after that first assay he tried three times more, but still he was altogether unable to move the blade in the iron. Then, after that he had thus four times made assay, he ceased his endeavor and came down from that place. And he was filled with great anger and indignation that he had not succeeded in his endeavor.", "translation": "紋章官がラッパを吹き鳴らすやいなや、かの剣の試しに挑む最初の王がただちに姿を現した。進み出たその人こそ、オークニーと諸島を治めるロット王であった。ロット王は十一人の騎士と五人の従者とを従えていたので、居並ぶ万人の目にまことに貴く堂々たる威容を映し出した。ロット王はその場に至ると演壇へと登った。そしてまず大司教に礼を捧げてから、衆人環視の中で剣の柄頭に両手をかけた。彼は身をかがめ、渾身の力を込めて剣を引き抜こうとしたが、金床の中の刃を髪の毛一本ほどの幅さえ動かすことができなかった。剣はそれが突き立てられている鉄塊そのものと同じほど堅固に食い込んでいたからである。その最初の試みののち、彼はさらに三度挑みかかったが、それでもなお鉄の中の刃を動かすことはまったく叶わなかった。かくして四たび試しを行ったのち、彼はついに試みを断念してその場から降りてきた。自らの試みが成らなかったことで、彼の胸中は激しい怒りと憤懣とに満たされていた。", "raw_tagged": "And when the {{office:紋章官|herald}} had sounded his trumpet there immediately appeared the first of those {{office:王|kings}} to make trial of the sword, and he who came was {{office:王|King}} {{person:ロット|Lot}} of {{place:オークニー|Orkney}} and the Isles. With {{office:王|King}} {{person:ロット|Lot}} there came eleven {{office:騎士|knights}} and five {{office:従者|esquires}}, so that he appeared in very noble estate before the eyes of all. And when {{office:王|King}} {{person:ロット|Lot}} had arrived at that place, he mounted the platform. And first he saluted the {{office:大司教|Archbishop}}, and then he laid his hands to the pommel of the sword in the sight of all. And he bent his body and drew upon the sword with great strength, but he could not move the blade in the anvil even so much as the breadth of a hair, for it stood as fast as the iron in which it was planted. And after that first assay he tried three times more, but still he was altogether unable to move the blade in the iron. Then, after that he had thus four times made assay, he ceased his endeavor and came down from that place. And he was filled with great anger and indignation that he had not succeeded in his endeavor.", "translation_tagged": "{{office:紋章官|紋章官}}がラッパを吹き鳴らすやいなや、かの剣の試しに挑む最初の{{office:王|王}}がただちに姿を現した。進み出たその人こそ、{{place:オークニー|オークニー}}と諸島を治める{{person:ロット|ロット}}{{office:王|王}}であった。{{person:ロット|ロット}}{{office:王|王}}は十一人の{{office:騎士|騎士}}と五人の{{office:従者|従者}}とを従えていたので、居並ぶ万人の目にまことに貴く堂々たる威容を映し出した。{{person:ロット|ロット}}{{office:王|王}}はその場に至ると演壇へと登った。そしてまず{{office:大司教|大司教}}に礼を捧げてから、衆人環視の中で剣の柄頭に両手をかけた。彼は身をかがめ、渾身の力を込めて剣を引き抜こうとしたが、金床の中の刃を髪の毛一本ほどの幅さえ動かすことができなかった。剣はそれが突き立てられている鉄塊そのものと同じほど堅固に食い込んでいたからである。その最初の試みののち、彼はさらに三度挑みかかったが、それでもなお鉄の中の刃を動かすことはまったく叶わなかった。かくして四たび試しを行ったのち、彼はついに試みを断念してその場から降りてきた。自らの試みが成らなかったことで、彼の胸中は激しい怒りと憤懣とに満たされていた。", "persons": "ロット", "places": "オークニー", "offices": "紋章官,王,騎士,従者,大司教", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "當紋章官吹響號角後，那些國王之中第一位上前試劍的人隨即現身，來者正是統治奧克尼與群島的洛特王。隨同洛特王前來的有十一名騎士與五名侍從，使他在眾人眼前展現出極為尊貴顯赫的氣派。洛特王來到那處之後，便登上高台。他先向大主教行禮致意，接著在眾目睽睽之下將雙手握上劍柄圓頭。他俯下身軀，使出渾身巨力往上拔劍，卻連一絲毫髮的寬度也無法撼動鐵砧中的劍刃，因為那劍刃就如同嵌住它的生鐵一般穩固不動。在第一次試拔之後，他又接連試了三次，卻依然完全無法撼動鐵塊裡的劍刃。就這樣四度試煉未果之後，他只得放棄努力，走下高台；因未能如願成功，他心中充滿了極大的憤怒與不甘。", "zh_tw_tagged": "當{{office:紋章官|紋章官}}吹響號角後，那些{{office:王|國王}}之中第一位上前試劍的人隨即現身，來者正是統治{{place:オークニー|奧克尼}}與群島的{{person:ロット|洛特}}{{office:王|王}}。隨同{{person:ロット|洛特}}{{office:王|王}}前來的有十一名{{office:騎士|騎士}}與五名{{office:従者|侍從}}，使他在眾人眼前展現出極為尊貴顯赫的氣派。{{person:ロット|洛特}}{{office:王|王}}來到那處之後，便登上高台。他先向{{office:大司教|大主教}}行禮致意，接著在眾目睽睽之下將雙手握上劍柄圓頭。他俯下身軀，使出渾身巨力往上拔劍，卻連一絲毫髮的寬度也無法撼動鐵砧中的劍刃，因為那劍刃就如同嵌住它的生鐵一般穩固不動。在第一次試拔之後，他又接連試了三次，卻依然完全無法撼動鐵塊裡的劍刃。就這樣四度試煉未果之後，他只得放棄努力，走下高台；因未能如願成功，他心中充滿了極大的憤怒與不甘。", "zh_cn": "当纹章官吹响号角后，那些国王之中第一位上前试剑的人随即现身，来者正是统治奥克尼与群岛的洛特王。随同洛特王前来的有十一名骑士与五名侍从，使他在众人眼前展现出极为尊贵显赫的气派。洛特王来到那处之后，便登上高台。他先向大主教行礼致意，接着在众目睽睽之下将双手握上剑柄圆头。他俯下身躯，使出浑身巨力往上拔剑，却连一丝毫发的宽度也无法撼动铁砧中的剑刃，因为那剑刃就如同嵌住它的生铁一般稳固不动。在第一次试拔之后，他又接连试了三次，却依然完全无法撼动铁块里的剑刃。就这样四度试炼未果之后，他只得放弃努力，走下高台；因未能如愿成功，他心中充满了极大的愤怒与不甘。", "zh_cn_tagged": "当{{office:紋章官|纹章官}}吹响号角后，那些{{office:王|国王}}之中第一位上前试剑的人随即现身，来者正是统治{{place:オークニー|奥克尼}}与群岛的{{person:ロット|洛特}}{{office:王|王}}。随同{{person:ロット|洛特}}{{office:王|王}}前来的有十一名{{office:騎士|骑士}}与五名{{office:従者|侍从}}，使他在众人眼前展现出极为尊贵显赫的气派。{{person:ロット|洛特}}{{office:王|王}}来到那处之后，便登上高台。他先向{{office:大司教|大主教}}行礼致意，接着在众目睽睽之下将双手握上剑柄圆头。他俯下身躯，使出浑身巨力往上拔剑，却连一丝毫发的宽度也无法撼动铁砧中的剑刃，因为那剑刃就如同嵌住它的生铁一般稳固不动。在第一次试拔之后，他又接连试了三次，却依然完全无法撼动铁块里的剑刃。就这样四度试炼未果之后，他只得放弃努力，走下高台；因未能如愿成功，他心中充满了极大的愤怒与不甘。", "ko": "문장관이 나팔을 불자마자 검을 시험하려는 왕들 가운데 첫 번째 인물이 즉시 모습을 드러냈으니, 앞으로 나온 이는 바로 오크니와 제도의 군주인 로트 왕이었다. 로트 왕은 열한 명의 기사와 다섯 명의 종자를 거느리고 나와 모든 이의 눈앞에 지극히 고귀하고도 당당한 위용을 보였다. 로트 왕은 그 자리에 이르자 단상 위로 올라갔다. 그리고 먼저 대주교에게 예를 올린 다음, 만인이 지켜보는 가운데 검자루 끝의 둥근 장식에 두 손을 얹었다. 그는 몸을 굽히고 온 힘을 다해 검을 잡아당겼으나, 모루에 박힌 칼날을 머리카락 한 올 너비만큼도 움직일 수 없었다. 검이 박혀 있는 쇠덩이만큼이나 단단히 고정되어 있었기 때문이다. 그 첫 번째 시험 뒤에 그는 세 번이나 더 시도했으나, 여전히 쇠 속의 칼날을 조금도 움직이지 못했다. 이렇듯 네 번에 걸쳐 시험한 끝에 그는 마침내 시도를 단념하고 그 자리에서 내려왔으며, 뜻한 바를 이루지 못한 까닭에 크나큰 분노와 분격에 휩싸였다.", "ko_tagged": "{{office:紋章官|문장관}}이 나팔을 불자마자 검을 시험하려는 {{office:王|왕}}들 가운데 첫 번째 인물이 즉시 모습을 드러냈으니, 앞으로 나온 이는 바로 {{place:オークニー|오크니}}와 제도의 군주인 {{person:ロット|로트}} {{office:王|왕}}이었다. {{person:ロット|로트}} {{office:王|왕}}은 열한 명의 {{office:騎士|기사}}와 다섯 명의 {{office:従者|종자}}를 거느리고 나와 모든 이의 눈앞에 지극히 고귀하고도 당당한 위용을 보였다. {{person:ロット|로트}} {{office:王|왕}}은 그 자리에 이르자 단상 위로 올라갔다. 그리고 먼저 {{office:大司教|대주교}}에게 예를 올린 다음, 만인이 지켜보는 가운데 검자루 끝의 둥근 장식에 두 손을 얹었다. 그는 몸을 굽히고 온 힘을 다해 검을 잡아당겼으나, 모루에 박힌 칼날을 머리카락 한 올 너비만큼도 움직일 수 없었다. 검이 박혀 있는 쇠덩이만큼이나 단단히 고정되어 있었기 때문이다. 그 첫 번째 시험 뒤에 그는 세 번이나 더 시도했으나, 여전히 쇠 속의 칼날을 조금도 움직이지 못했다. 이렇듯 네 번에 걸쳐 시험한 끝에 그는 마침내 시도를 단념하고 그 자리에서 내려왔으며, 뜻한 바를 이루지 못한 까닭에 크나큰 분노와 분격에 휩싸였다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p6_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 6, "type": "本文", "raw_text": "And after King Lot there came his brother-in-law, King Urien of Gore and he also made assay in the same wise as King Lot had done. But neither did he succeed any better than that other king. And after King Urien there came King Fion of Scotland, and after King Fion there came King Mark of Cornwall, and after King Mark there came King Ryence of North Wales, and after King Ryence there came King Leodegrance of Cameliard, and after him came all those other kings and dukes before numerated, and not one of all these was able to move the blade. And some of these high and mighty lords were filled with anger and indignation that they had not succeeded, and others were ashamed that they had failed in that undertaking before the eyes of all those who looked upon them. But whether they were angry or whether they were ashamed it in no wise helped their case.", "translation": "ロット王に続いて、その義兄弟にあたるゴアのユリエンス王が進み出て、彼もまたロット王がしたのと同じように試しに挑んだ。だが彼もまた、先の王以上にうまく成し遂げることはできなかった。ユリエンス王のあとにはスコットランドのフィオン王が進み出、フィオン王のあとにはコーンウォールのマーク王が進み出、マーク王のあとには北ウェールズのリエンス王が進み出、リエンス王のあとにはカミリアードのレオデグランス王が進み出、さらにそのあとには先に挙げたその他すべての王たちと公爵たちとが次々に進み出たが、これらすべての者のうち誰一人としてその刃を動かすことはできなかった。これら高貴にして強大なる大諸侯の中には、成功しなかったことに怒りと憤懣を募らせる者もいれば、見守るすべての人々の目の前でその企てに敗れたことを恥じ入る者もいた。だが彼らがどれほど怒ろうとも、どれほど恥じ入ろうとも、事態の助けには少しもならなかった。", "raw_tagged": "And after {{office:王|King}} {{person:ロット|Lot}} there came his brother-in-law, {{office:王|King}} {{person:ユリエンス|Urien}} of {{special:ゴア|Gore}} and he also made assay in the same wise as {{office:王|King}} {{person:ロット|Lot}} had done. But neither did he succeed any better than that other {{office:王|king}}. And after {{office:王|King}} {{person:ユリエンス|Urien}} there came {{office:王|King}} {{person:フィオン|Fion}} of {{place:スコットランド|Scotland}}, and after {{office:王|King}} {{person:フィオン|Fion}} there came {{office:王|King}} {{person:マーク|Mark}} of {{place:コーンウォール|Cornwall}}, and after {{office:王|King}} {{person:マーク|Mark}} there came {{office:王|King}} {{person:リエンス|Ryence}} of North {{place:ウェールズ|Wales}}, and after {{office:王|King}} {{person:リエンス|Ryence}} there came {{office:王|King}} {{person:レオデグランス|Leodegrance}} of {{special:カミリアード|Cameliard}}, and after him came all those other {{office:王|kings}} and {{office:公爵|dukes}} before numerated, and not one of all these was able to move the blade. And some of these high and mighty lords were filled with anger and indignation that they had not succeeded, and others were ashamed that they had failed in that undertaking before the eyes of all those who looked upon them. But whether they were angry or whether they were ashamed it in no wise helped their case.", "translation_tagged": "{{person:ロット|ロット}}{{office:王|王}}に続いて、その義兄弟にあたる{{special:ゴア|ゴア}}の{{person:ユリエンス|ユリエンス}}{{office:王|王}}が進み出て、彼もまた{{person:ロット|ロット}}{{office:王|王}}がしたのと同じように試しに挑んだ。だが彼もまた、先の{{office:王|王}}以上にうまく成し遂げることはできなかった。{{person:ユリエンス|ユリエンス}}{{office:王|王}}のあとには{{place:スコットランド|スコットランド}}の{{person:フィオン|フィオン}}{{office:王|王}}が進み出、{{person:フィオン|フィオン}}{{office:王|王}}のあとには{{place:コーンウォール|コーンウォール}}の{{person:マーク|マーク}}{{office:王|王}}が進み出、{{person:マーク|マーク}}{{office:王|王}}のあとには北{{place:ウェールズ|ウェールズ}}の{{person:リエンス|リエンス}}{{office:王|王}}が進み出、{{person:リエンス|リエンス}}{{office:王|王}}のあとには{{special:カミリアード|カミリアード}}の{{person:レオデグランス|レオデグランス}}{{office:王|王}}が進み出、さらにそのあとには先に挙げたその他すべての{{office:王|王}}たちと{{office:公爵|公爵}}たちとが次々に進み出たが、これらすべての者のうち誰一人としてその刃を動かすことはできなかった。これら高貴にして強大なる大諸侯の中には、成功しなかったことに怒りと憤懣を募らせる者もいれば、見守るすべての人々の目の前でその企てに敗れたことを恥じ入る者もいた。だが彼らがどれほど怒ろうとも、どれほど恥じ入ろうとも、事態の助けには少しもならなかった。", "persons": "ロット,ユリエンス,フィオン,マーク,リエンス,レオデグランス", "places": "スコットランド,コーンウォール,ウェールズ", "offices": "王,公爵", "era_year": "伝説時代", "keywords": "ゴア,カミリアード", "is_enriched": true, "zh_tw": "繼洛特王之後上前的是他的連襟、戈爾的尤里安王，他也照著洛特王先前的方式上前試拔，卻同樣未能比前一位國王表現得更好。繼尤里安王之後上前的是蘇格蘭的菲昂王，繼菲昂王之後是康沃爾的馬克王，繼馬克王之後是北威爾斯的里恩斯王，繼里恩斯王之後是卡米利亞德的里奧德格蘭斯王，而在他之後，先前列舉的其餘所有國王與公爵也逐一上前，然而這些人當中竟無一人能夠撼動劍刃分毫。這些位高權重的大領主之中，有人因未能成功而滿腔憤怒與不甘，也有人因在全場旁觀者的注視下挑戰失敗而羞愧難當；但無論他們是憤怒還是羞愧，對他們的處境都毫無助益。", "zh_tw_tagged": "繼{{person:ロット|洛特}}{{office:王|王}}之後上前的是他的連襟、{{special:ゴア|戈爾}}的{{person:ユリエンス|尤里安}}{{office:王|王}}，他也照著{{person:ロット|洛特}}{{office:王|王}}先前的方式上前試拔，卻同樣未能比前一位{{office:王|國王}}表現得更好。繼{{person:ユリエンス|尤里安}}{{office:王|王}}之後上前的是{{place:スコットランド|蘇格蘭}}的{{person:フィオン|菲昂}}{{office:王|王}}，繼{{person:フィオン|菲昂}}{{office:王|王}}之後是{{place:コーンウォール|康沃爾}}的{{person:マーク|馬克}}{{office:王|王}}，繼{{person:マーク|馬克}}{{office:王|王}}之後是北{{place:ウェールズ|威爾斯}}的{{person:リエンス|里恩斯}}{{office:王|王}}，繼{{person:リエンス|里恩斯}}{{office:王|王}}之後是{{special:カミリアード|卡米利亞德}}的{{person:レオデグランス|里奧德格蘭斯}}{{office:王|王}}，而在他之後，先前列舉的其餘所有{{office:王|國王}}與{{office:公爵|公爵}}也逐一上前，然而這些人當中竟無一人能夠撼動劍刃分毫。這些位高權重的大領主之中，有人因未能成功而滿腔憤怒與不甘，也有人因在全場旁觀者的注視下挑戰失敗而羞愧難當；但無論他們是憤怒還是羞愧，對他們的處境都毫無助益。", "zh_cn": "继洛特王之后上前的是他的连襟、戈尔的尤里安王，他也照着洛特王先前的方式上前试拔，却同样未能比前一位国王表现得更好。继尤里安王之后上前的是苏格兰的菲昂王，继菲昂王之后是康沃尔的马克王，继马克王之后是北威尔士的里恩斯王，继里恩斯王之后是卡米利亚德的里奥德格兰斯王，而在他之后，先前列举的其余所有国王与公爵也逐一上前，然而这些人当中竟无一人能够撼动剑刃分毫。这些位高权重的大领主之中，有人因未能成功而满腔愤怒与不甘，也有人因在全场旁观者的注视下挑战失败而羞愧难当；但无论他们是愤怒还是羞愧，对他们的处境都毫无助益。", "zh_cn_tagged": "继{{person:ロット|洛特}}{{office:王|王}}之后上前的是他的连襟、{{special:ゴア|戈尔}}的{{person:ユリエンス|尤里安}}{{office:王|王}}，他也照着{{person:ロット|洛特}}{{office:王|王}}先前的方式上前试拔，却同样未能比前一位{{office:王|国王}}表现得更好。继{{person:ユリエンス|尤里安}}{{office:王|王}}之后上前的是{{place:スコットランド|苏格兰}}的{{person:フィオン|菲昂}}{{office:王|王}}，继{{person:フィオン|菲昂}}{{office:王|王}}之后是{{place:コーンウォール|康沃尔}}的{{person:マーク|马克}}{{office:王|王}}，继{{person:マーク|马克}}{{office:王|王}}之后是北{{place:ウェールズ|威尔士}}的{{person:リエンス|里恩斯}}{{office:王|王}}，继{{person:リエンス|里恩斯}}{{office:王|王}}之后是{{special:カミリアード|卡米利亚德}}的{{person:レオデグランス|里奥德格兰斯}}{{office:王|王}}，而在他之后，先前列举的其余所有{{office:王|国王}}与{{office:公爵|公爵}}也逐一上前，然而这些人当中竟无一人能够撼动剑刃分毫。这些位高权重的大领主之中，有人因未能成功而满腔愤怒与不甘，也有人因在全场旁观者的注视下挑战失败而羞愧难当；但无论他们是愤怒还是羞愧，对他们的处境都毫无助益。", "ko": "로트 왕의 뒤를 이어 그의 동서인 고어의 유리엔 왕이 나아와 로트 왕이 했던 것과 똑같은 방식으로 시험에 임하였다. 그러나 그 역시 앞선 왕보다 조금도 더 나은 결과를 거두지 못했다. 유리엔 왕 다음으로는 스코틀랜드의 피온 왕이 나왔고, 피온 왕 다음으로는 콘월의 마크 왕이 나왔으며, 마크 왕 다음으로는 북웨일스의 리엔스 왕이 나왔고, 리엔스 왕 다음으로는 카밀리아드의 레오데그란스 왕이 나왔으며, 그 뒤를 이어 앞서 헤아린 나머지 모든 왕들과 공작들이 차례로 나아왔으나 그들 가운데 단 한 사람도 칼날을 움직이지 못했다. 이 높고도 막강한 대영주들 중 어떤 이들은 성공하지 못한 것에 분노와 격분을 터뜨렸고, 또 어떤 이들은 지켜보는 모든 사람의 눈앞에서 그 일에 실패한 것을 부끄러워했다. 하지만 그들이 화를 내든 부끄러워하든 그들의 처지에는 아무런 도움도 되지 않았다.", "ko_tagged": "{{person:ロット|로트}} {{office:王|왕}}의 뒤를 이어 그의 동서인 {{special:ゴア|고어}}의 {{person:ユリエンス|유리엔}} {{office:王|왕}}이 나아와 {{person:ロット|로트}} {{office:王|왕}}이 했던 것과 똑같은 방식으로 시험에 임하였다. 그러나 그 역시 앞선 {{office:王|왕}}보다 조금도 더 나은 결과를 거두지 못했다. {{person:ユリエンス|유리엔}} {{office:王|왕}} 다음으로는 {{place:スコットランド|스코틀랜드}}의 {{person:フィオン|피온}} {{office:王|왕}}이 나왔고, {{person:フィオン|피온}} {{office:王|왕}} 다음으로는 {{place:コーンウォール|콘월}}의 {{person:マーク|마크}} {{office:王|왕}}이 나왔으며, {{person:マーク|마크}} {{office:王|왕}} 다음으로는 북{{place:ウェールズ|웨일스}}의 {{person:リエンス|리엔스}} {{office:王|왕}}이 나왔고, {{person:リエンス|리엔스}} {{office:王|왕}} 다음으로는 {{special:カミリアード|카밀리아드}}의 {{person:レオデグランス|레오데그란스}} {{office:王|왕}}이 나왔으며, 그 뒤를 이어 앞서 헤아린 나머지 모든 {{office:王|왕}}들과 {{office:公爵|공작}}들이 차례로 나아왔으나 그들 가운데 단 한 사람도 칼날을 움직이지 못했다. 이 높고도 막강한 대영주들 중 어떤 이들은 성공하지 못한 것에 분노와 격분을 터뜨렸고, 또 어떤 이들은 지켜보는 모든 사람의 눈앞에서 그 일에 실패한 것을 부끄러워했다. 하지만 그들이 화를 내든 부끄러워하든 그들의 처지에는 아무런 도움도 되지 않았다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p7_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 7, "type": "本文", "raw_text": "Now when all the kings and dukes had thus failed in that adventure, the people who were there were very much astonished, and they said to one another, \"How is this? If all those kings and dukes of very exalted estate have failed to achieve that adventure, who then may hope to succeed? For here have been all those who were most worthy of that high honor, and all have tried to draw that sword and all have failed. Who then is there now to come after these who may hope to succeed?\"", "translation": "さて、すべての王たちと公爵たちとがこのようにその冒険に敗れ去ると、その場に居合わせた民衆は大いに驚き呆れ、互いにこう語り合った。「いったいこれはどうしたことであろうか？ これほどまでに尊貴な身分にあるすべての王や公爵たちがこの冒険を成し遂げられなかったとすれば、いったい誰が成功を望み得るというのか？ あの至高の栄誉を受けるに最もふさわしい方々がここに残らず揃い、その全員があの剣を抜こうと挑んで全員が敗れたのだ。この方々のあとに進み出て成功を望み得る者など、今やどこにいるというのか？」", "raw_tagged": "Now when all the {{office:王|kings}} and {{office:公爵|dukes}} had thus failed in that adventure, the people who were there were very much astonished, and they said to one another, \"How is this? If all those {{office:王|kings}} and {{office:公爵|dukes}} of very exalted estate have failed to achieve that adventure, who then may hope to succeed? For here have been all those who were most worthy of that high honor, and all have tried to draw that sword and all have failed. Who then is there now to come after these who may hope to succeed?\"", "translation_tagged": "さて、すべての{{office:王|王}}たちと{{office:公爵|公爵}}たちとがこのようにその冒険に敗れ去ると、その場に居合わせた民衆は大いに驚き呆れ、互いにこう語り合った。「いったいこれはどうしたことであろうか？ これほどまでに尊貴な身分にあるすべての{{office:王|王}}や{{office:公爵|公爵}}たちがこの冒険を成し遂げられなかったとすれば、いったい誰が成功を望み得るというのか？ あの至高の栄誉を受けるに最もふさわしい方々がここに残らず揃い、その全員があの剣を抜こうと挑んで全員が敗れたのだ。この方々のあとに進み出て成功を望み得る者など、今やどこにいるというのか？」", "persons": "", "places": "", "offices": "王,公爵", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "當所有國王與公爵就這樣在這場奇遇中盡數失敗後，在場的百姓無不驚訝萬分，紛紛彼此議論道：「這是怎麼回事？倘若所有這些地位極其崇高的國王與公爵都無法完成這場奇遇，那麼還有誰能指望成功呢？畢竟最配得上那份至高榮耀的人全都已經在這裡了，他們全都試著拔過那把劍，卻全都失敗了。如今在他們之後，還會有誰能上前並指望成功呢？」", "zh_tw_tagged": "當所有{{office:王|國王}}與{{office:公爵|公爵}}就這樣在這場奇遇中盡數失敗後，在場的百姓無不驚訝萬分，紛紛彼此議論道：「這是怎麼回事？倘若所有這些地位極其崇高的{{office:王|國王}}與{{office:公爵|公爵}}都無法完成這場奇遇，那麼還有誰能指望成功呢？畢竟最配得上那份至高榮耀的人全都已經在這裡了，他們全都試著拔過那把劍，卻全都失敗了。如今在他們之後，還會有誰能上前並指望成功呢？」", "zh_cn": "当所有国王与公爵就这样在这场奇遇中尽数失败后，在场的百姓无不惊讶万分，纷纷彼此议论道：“这是怎么回事？倘若所有这些地位极其崇高的国王与公爵都无法完成这场奇遇，那么还有谁能指望成功呢？毕竟最配得上那份至高荣耀的人全都已经在这里了，他们全都试着拔过那把剑，却全都失败了。如今在他们之后，还会有谁能上前并指望成功呢？”", "zh_cn_tagged": "当所有{{office:王|国王}}与{{office:公爵|公爵}}就这样在这场奇遇中尽数失败后，在场的百姓无不惊讶万分，纷纷彼此议论道：“这是怎么回事？倘若所有这些地位极其崇高的{{office:王|国王}}与{{office:公爵|公爵}}都无法完成这场奇遇，那么还有谁能指望成功呢？毕竟最配得上那份至高荣耀的人全都已经在这里了，他们全都试着拔过那把剑，却全都失败了。如今在他们之后，还会有谁能上前并指望成功呢？”", "ko": "이제 모든 왕과 공작들이 이처럼 그 모험에서 실패하자, 그곳에 모인 백성들은 크게 놀라며 서로에게 이렇게 말했다. “이 어인 일인가? 저토록 지체 높은 모든 왕과 공작들이 그 모험을 이루지 못했다면, 대체 누가 성공하기를 바랄 수 있겠는가? 저 드높은 영예를 누릴 자격이 가장 충분한 이들이 모두 이 자리에 나와 저마다 검을 뽑으려 애썼으나 하나같이 실패하고 말았다. 그렇다면 이제 이분들 뒤에 나서서 성공을 바랄 만한 사람이 대체 누구란 말인가?”", "ko_tagged": "이제 모든 {{office:王|왕}}과 {{office:公爵|공작}}들이 이처럼 그 모험에서 실패하자, 그곳에 모인 백성들은 크게 놀라며 서로에게 이렇게 말했다. “이 어인 일인가? 저토록 지체 높은 모든 {{office:王|왕}}과 {{office:公爵|공작}}들이 그 모험을 이루지 못했다면, 대체 누가 성공하기를 바랄 수 있겠는가? 저 드높은 영예를 누릴 자격이 가장 충분한 이들이 모두 이 자리에 나와 저마다 검을 뽑으려 애썼으나 하나같이 실패하고 말았다. 그렇다면 이제 이분들 뒤에 나서서 성공을 바랄 만한 사람이 대체 누구란 말인가?”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p8_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 8, "type": "本文", "raw_text": "And, likewise, those kings and dukes spoke together in the same manner. And by and by there came six of the most worthy - to wit, King Lot, King Urien, King Pellinore, King Ban, King Ryence, and Duke Clarence of Northumberland - and these stood before the throne of the Archbishop and spake to him in this wise: \"Sir, here have all the kings and dukes of this realm striven before you for to draw forth that sword, and lo! not one of all those who have undertaken that thing hath succeeded in his undertaking. What, then, may we understand but that the enchanter Merlin hath set this adventure for to bring shame and discredit upon all of us who are here, and upon you, who are the head of the church in this realm? For who in all the world may hope to draw forth a sword-blade out from a bed of solid iron? Behold! it is beyond the power of any man. Is it not then plain to be seen that Merlin hath made a mock of us all? Now, therefore, lest all this great congregation should have been called here in vain, we do beseech you of your wisdom that you presently choose the one from among the kings here gathered, who may be best fitted to be overlord of this realm. And when ye shall have chosen him, we will promise to obey him in all things whatsoever he may ordain. Verily, such a choice as that will be better worth while than to spend time in this foolish task of striving to draw forth a sword out of an anvil which no man in all the world may draw forth.\"", "translation": "そして同じように、かの王たちや公爵たちも互いに同様の言葉を交わし合った。やがてその中でも最も重きをなす六人――すなわちロット王、ユリエンス王、ペリノア王、バン王、リエンス王、ならびにノーサンバーランドのクラレンス公爵――が進み出て、大司教の玉座の前に立ち、このように申し述べた。「尊師よ、この王国のすべての王と公爵とがあなたの御前でかの剣を引き抜こうと力を尽くしましたが、ご覧のとおり、その試みに挑んだ者のうち誰一人として成し遂げた者はおりませぬ。してみれば、魔術師マーリンがこの場に集う我ら全員と、この王国の教会の首座におわすあなた様とに恥辱と不名誉とをもたらすためにこの冒険を仕組んだのだと解するほか、いったい何と考えられましょうか？ この広い世のいったい誰が、無垢の鉄の台座から剣の刃を引き抜くことなど望み得ましょうか？ ご覧なされよ、それはいかなる人間の力をも超えた業でございます。ならばマーリンが我ら全員を愚弄したことは火を見るよりも明らかではございませぬか？ それゆえ今、これほどの大群衆が空しくここへ呼び集められたことにならぬよう、我らはあなたの御賢慮に伏してお願い申し上げます――ここに参集した王たちの中から、この王国の最高君主となるに最もふさわしき者一人を、今すぐお選びいただきたいのです。あなたがその者をお選びになった暁には、その者が命ずるいかなる事柄に対しても、我らはすべて従うことを誓いましょう。まことに、世界中の誰一人として引き抜けぬ金床から剣を抜こうと努めるこのような愚かしい業に時を費やすよりは、そのような選出こそはるかに意義あることでございましょう。」", "raw_tagged": "And, likewise, those {{office:王|kings}} and {{office:公爵|dukes}} spoke together in the same manner. And by and by there came six of the most worthy - to wit, {{office:王|King}} {{person:ロット|Lot}}, {{office:王|King}} {{person:ユリエンス|Urien}}, {{office:王|King}} {{person:ペリノア|Pellinore}}, {{office:王|King}} {{person:バン|Ban}}, {{office:王|King}} {{person:リエンス|Ryence}}, and {{office:公爵|Duke}} {{person:クラレンス|Clarence}} of {{place:ノーサンバーランド|Northumberland}} - and these stood before the throne of the {{office:大司教|Archbishop}} and spake to him in this wise: \"Sir, here have all the {{office:王|kings}} and {{office:公爵|dukes}} of this realm striven before you for to draw forth that sword, and lo! not one of all those who have undertaken that thing hath succeeded in his undertaking. What, then, may we understand but that the {{special:魔術師|enchanter}} {{person:マーリン|Merlin}} hath set this adventure for to bring shame and discredit upon all of us who are here, and upon you, who are the head of the church in this realm? For who in all the world may hope to draw forth a sword-blade out from a bed of solid iron? Behold! it is beyond the power of any man. Is it not then plain to be seen that {{person:マーリン|Merlin}} hath made a mock of us all? Now, therefore, lest all this great congregation should have been called here in vain, we do beseech you of your wisdom that you presently choose the one from among the {{office:王|kings}} here gathered, who may be best fitted to be overlord of this realm. And when ye shall have chosen him, we will promise to obey him in all things whatsoever he may ordain. Verily, such a choice as that will be better worth while than to spend time in this foolish task of striving to draw forth a sword out of an anvil which no man in all the world may draw forth.\"", "translation_tagged": "そして同じように、かの{{office:王|王}}たちや{{office:公爵|公爵}}たちも互いに同様の言葉を交わし合った。やがてその中でも最も重きをなす六人――すなわち{{person:ロット|ロット}}{{office:王|王}}、{{person:ユリエンス|ユリエンス}}{{office:王|王}}、{{person:ペリノア|ペリノア}}{{office:王|王}}、{{person:バン|バン}}{{office:王|王}}、{{person:リエンス|リエンス}}{{office:王|王}}、ならびに{{place:ノーサンバーランド|ノーサンバーランド}}の{{person:クラレンス|クラレンス}}{{office:公爵|公爵}}――が進み出て、{{office:大司教|大司教}}の玉座の前に立ち、このように申し述べた。「尊師よ、この王国のすべての{{office:王|王}}と{{office:公爵|公爵}}とがあなたの御前でかの剣を引き抜こうと力を尽くしましたが、ご覧のとおり、その試みに挑んだ者のうち誰一人として成し遂げた者はおりませぬ。してみれば、{{special:魔術師|魔術師}}{{person:マーリン|マーリン}}がこの場に集う我ら全員と、この王国の教会の首座におわすあなた様とに恥辱と不名誉とをもたらすためにこの冒険を仕組んだのだと解するほか、いったい何と考えられましょうか？ この広い世のいったい誰が、無垢の鉄の台座から剣の刃を引き抜くことなど望み得ましょうか？ ご覧なされよ、それはいかなる人間の力をも超えた業でございます。ならば{{person:マーリン|マーリン}}が我ら全員を愚弄したことは火を見るよりも明らかではございませぬか？ それゆえ今、これほどの大群衆が空しくここへ呼び集められたことにならぬよう、我らはあなたの御賢慮に伏してお願い申し上げます――ここに参集した{{office:王|王}}たちの中から、この王国の最高君主となるに最もふさわしき者一人を、今すぐお選びいただきたいのです。あなたがその者をお選びになった暁には、その者が命ずるいかなる事柄に対しても、我らはすべて従うことを誓いましょう。まことに、世界中の誰一人として引き抜けぬ金床から剣を抜こうと努めるこのような愚かしい業に時を費やすよりは、そのような選出こそはるかに意義あることでございましょう。」", "persons": "ロット,ユリエンス,ペリノア,バン,リエンス,クラレンス,マーリン", "places": "ノーサンバーランド", "offices": "王,公爵,大司教", "era_year": "伝説時代", "keywords": "魔術師", "is_enriched": true, "zh_tw": "與此同時，那些國王與公爵也彼此作著同樣的議論。不一會兒，其中最德高望重的六位——即洛特王、尤里安王、佩利諾爾王、班王、里恩斯王，以及諾森伯蘭的克拉倫斯公爵——走上前來，站在大主教的寶座前，如此向他進言道：「尊座，本王國所有的國王與公爵皆已在您面前竭力試圖拔出那把寶劍，然而看哪！凡參與此事者竟無一人得以成功。那麼除了認定魔法師梅林設下這場奇遇，是為了給在場的我等眾人以及身為本王國教會之首的您帶來羞辱與失信之外，我們還能作何理解呢？普天之下有誰能指望從一塊實心生鐵座中拔出一截劍刃來？看哪！這根本超越了任何凡人的力量。由此豈不顯而易見，梅林是在戲弄我們所有人嗎？因此，為免這場盛大的集會徒勞無功，我們懇請您憑藉您的睿智，當場從聚集於此的諸王之中推選出最配作本王國最高君主的一位。待您選出此人後，無論他頒布何種號令，我們都承諾凡事遵從。誠然，比起耗費光陰去從事這樁試圖從鐵砧中拔出舉世無人能拔之劍的愚蠢差事，這樣的推選要有意義得多了。」", "zh_tw_tagged": "與此同時，那些{{office:王|國王}}與{{office:公爵|公爵}}也彼此作著同樣的議論。不一會兒，其中最德高望重的六位——即{{person:ロット|洛特}}{{office:王|王}}、{{person:ユリエンス|尤里安}}{{office:王|王}}、{{person:ペリノア|佩利諾爾}}{{office:王|王}}、{{person:バン|班}}{{office:王|王}}、{{person:リエンス|里恩斯}}{{office:王|王}}，以及{{place:ノーサンバーランド|諾森伯蘭}}的{{person:クラレンス|克拉倫斯}}{{office:公爵|公爵}}——走上前來，站在{{office:大司教|大主教}}的寶座前，如此向他進言道：「尊座，本王國所有的{{office:王|國王}}與{{office:公爵|公爵}}皆已在您面前竭力試圖拔出那把寶劍，然而看哪！凡參與此事者竟無一人得以成功。那麼除了認定{{special:魔術師|魔法師}}{{person:マーリン|梅林}}設下這場奇遇，是為了給在場的我等眾人以及身為本王國教會之首的您帶來羞辱與失信之外，我們還能作何理解呢？普天之下有誰能指望從一塊實心生鐵座中拔出一截劍刃來？看哪！這根本超越了任何凡人的力量。由此豈不顯而易見，{{person:マーリン|梅林}}是在戲弄我們所有人嗎？因此，為免這場盛大的集會徒勞無功，我們懇請您憑藉您的睿智，當場從聚集於此的諸{{office:王|王}}之中推選出最配作本王國最高君主的一位。待您選出此人後，無論他頒布何種號令，我們都承諾凡事遵從。誠然，比起耗費光陰去從事這樁試圖從鐵砧中拔出舉世無人能拔之劍的愚蠢差事，這樣的推選要有意義得多了。」", "zh_cn": "与此同时，那些国王与公爵也彼此作着同样的议论。不一会儿，其中最德高望重的六位——即洛特王、尤里安王、佩利诺尔王、班王、里恩斯王，以及诺森伯兰的克拉伦斯公爵——走上前来，站在大主教的宝座前，如此向他进言道：“尊座，本王国所有的国王与公爵皆已在您面前竭力试图拔出那把宝剑，然而看哪！凡参与此事者竟无一人得以成功。那么除了认定魔法师梅林设下这场奇遇，是为了给在场的我等众人以及身为本王国教会之首的您带来羞辱与失信之外，我们还能作何理解呢？普天之下有谁能指望从一块实心生铁座中拔出一截剑刃来？看哪！这根本超越了任何凡人的力量。由此岂不显而易见，梅林是在戏弄我们所有人吗？因此，为免这场盛大的集会徒劳无功，我们恳请您凭借您的睿智，当场从聚集于此的诸王之中推选出最配作本王国最高君主的一位。待您选出此人后，无论他颁布何种号令，我们都承诺凡事遵从。诚然，比起耗费光阴去从事这桩试图从铁砧中拔出举世无人能拔之剑的愚蠢差事，这样的推选要有意义得多了。”", "zh_cn_tagged": "与此同时，那些{{office:王|国王}}与{{office:公爵|公爵}}也彼此作着同样的议论。不一会儿，其中最德高望重的六位——即{{person:ロット|洛特}}{{office:王|王}}、{{person:ユリエンス|尤里安}}{{office:王|王}}、{{person:ペリノア|佩利诺尔}}{{office:王|王}}、{{person:バン|班}}{{office:王|王}}、{{person:リエンス|里恩斯}}{{office:王|王}}，以及{{place:ノーサンバーランド|诺森伯兰}}的{{person:クラレンス|克拉伦斯}}{{office:公爵|公爵}}——走上前来，站在{{office:大司教|大主教}}的宝座前，如此向他进言道：“尊座，本王国所有的{{office:王|国王}}与{{office:公爵|公爵}}皆已在您面前竭力试图拔出那把宝剑，然而看哪！凡参与此事者竟无一人得以成功。那么除了认定{{special:魔術師|魔法师}}{{person:マーリン|梅林}}设下这场奇遇，是为了给在场的我等众人以及身为本王国教会之首的您带来羞辱与失信之外，我们还能作何理解呢？普天之下有谁能指望从一块实心生铁座中拔出一截剑刃来？看哪！这根本超越了任何凡人的力量。由此岂不显而易见，{{person:マーリン|梅林}}是在戏弄我们所有人吗？因此，为免这场盛大的集会徒劳无功，我们恳请您凭借您的睿智，当场从聚集于此的诸{{office:王|王}}之中推选出最配作本王国最高君主的一位。待您选出此人后，无论他颁布何种号令，我们都承诺凡事遵从。诚然，比起耗费光阴去从事这桩试图从铁砧中拔出举世无人能拔之剑的愚蠢差事，这样的推选要有意义得多了。”", "ko": "마찬가지로 그 왕들과 공작들도 서로 똑같은 말들을 주고받았다. 이윽고 그들 가운데 가장 명망 높은 여섯 사람――곧 로트 왕, 유리엔 왕, 펠리노어 왕, 반 왕, 리엔스 왕, 그리고 노섬벌랜드의 클래런스 공작――이 앞으로 나아와 대주교의 좌석 앞에 서서 이렇게 아뢰었다. “존귀하신 분이여, 이 왕국의 모든 왕과 공작이 그대 앞에서 저 검을 뽑아내려고 온 힘을 다해 애썼으나, 보십시오! 그 일에 나선 이들 가운데 성공한 사람은 단 한 명도 없습니다. 그렇다면 마법사 멀린이 이 자리에 모인 우리 모두와 이 왕국 교회의 수장이신 그대에게 수모와 불명예를 안겨 주려고 이 모험을 꾸며 낸 것이라고밖에 달리 무엇이라 이해할 수 있겠습니까? 온 세상 그 누가 단단한 통쇠 받침 속에서 칼날을 뽑아내기를 바랄 수 있겠습니까? 보십시오! 그것은 어떤 인간의 힘으로도 미치지 못할 일입니다. 그러니 멀린이 우리 모두를 우롱한 것이 명백하지 않습니까? 그러므로 이제 이토록 거대한 군중이 헛되이 이곳에 불려 온 셈이 되지 않도록, 우리는 그대의 지혜에 간청하오니 지금 이곳에 모인 왕들 가운데 이 왕국의 최고 군주가 되기에 가장 합당한 한 사람을 즉시 택하여 주십시오. 그대께서 그를 택하시면, 그가 무엇을 명하든 우리는 모든 일에서 그에게 복종할 것을 약속하겠습니다. 참으로 온 세상 누구도 뽑아낼 수 없는 모루에서 검을 뽑으려 애쓰는 이 어리석은 일에 시간을 허비하는 것보다, 그러한 선택을 내리는 편이 훨씬 더 값진 일일 것입니다.”", "ko_tagged": "마찬가지로 그 {{office:王|왕}}들과 {{office:公爵|공작}}들도 서로 똑같은 말들을 주고받았다. 이윽고 그들 가운데 가장 명망 높은 여섯 사람――곧 {{person:ロット|로트}} {{office:王|왕}}, {{person:ユリエンス|유리엔}} {{office:王|왕}}, {{person:ペリノア|펠리노어}} {{office:王|왕}}, {{person:バン|반}} {{office:王|왕}}, {{person:リエンス|리엔스}} {{office:王|왕}}, 그리고 {{place:ノーサンバーランド|노섬벌랜드}}의 {{person:クラレンス|클래런스}} {{office:公爵|공작}}――이 앞으로 나아와 {{office:大司教|대주교}}의 좌석 앞에 서서 이렇게 아뢰었다. “존귀하신 분이여, 이 왕국의 모든 {{office:王|왕}}과 {{office:公爵|공작}}이 그대 앞에서 저 검을 뽑아내려고 온 힘을 다해 애썼으나, 보십시오! 그 일에 나선 이들 가운데 성공한 사람은 단 한 명도 없습니다. 그렇다면 {{special:魔術師|마법사}} {{person:マーリン|멀린}}이 이 자리에 모인 우리 모두와 이 왕국 교회의 수장이신 그대에게 수모와 불명예를 안겨 주려고 이 모험을 꾸며 낸 것이라고밖에 달리 무엇이라 이해할 수 있겠습니까? 온 세상 그 누가 단단한 통쇠 받침 속에서 칼날을 뽑아내기를 바랄 수 있겠습니까? 보십시오! 그것은 어떤 인간의 힘으로도 미치지 못할 일입니다. 그러니 {{person:マーリン|멀린}}이 우리 모두를 우롱한 것이 명백하지 않습니까? 그러므로 이제 이토록 거대한 군중이 헛되이 이곳에 불려 온 셈이 되지 않도록, 우리는 그대의 지혜에 간청하오니 지금 이곳에 모인 {{office:王|왕}}들 가운데 이 왕국의 최고 군주가 되기에 가장 합당한 한 사람을 즉시 택하여 주십시오. 그대께서 그를 택하시면, 그가 무엇을 명하든 우리는 모든 일에서 그에게 복종할 것을 약속하겠습니다. 참으로 온 세상 누구도 뽑아낼 수 없는 모루에서 검을 뽑으려 애쓰는 이 어리석은 일에 시간을 허비하는 것보다, 그러한 선택을 내리는 편이 훨씬 더 값진 일일 것입니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p9_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 9, "type": "本文", "raw_text": "Then was the Archbishop much troubled in spirit, for he said to himself, \"Can it be sooth that Merlin hath deceived me, and hath made a mock of me and of all these kings and lordly folk? Surely this cannot be. For Merlin is passing wise, and he would not make a mock of all the realm for the sake of so sorry a jest as this would be. Certes he hath some intent in this of which we know naught, being of less wisdom than he - wherefore I will be patient for a while longer.\" Accordingly, having communed thus within himself, he spake aloud in this wise to those seven high lords:", "translation": "すると大司教は心のうちに深く思い悩んだ。というのも、彼は胸の中でこう自問したからである。「マーリンが私を欺き、私とこれらすべての王たちや貴顕の人々を愚弄したということが、まことであり得ようか？ いや、決してそのようなはずはない。なぜならマーリンは並外れて賢明な人物であり、かほどにつまらぬ悪戯のために王国全体を愚弄するようなことはするはずがないからだ。きっと彼には、彼より知恵の及ばぬ我らには窺い知れぬ何らかの深意があるに違いない――それゆえ、私はもうしばらくの間だけ辛抱して待つことにしよう。」かくして胸中でそのように思案を巡らせたのち、彼はかの七人の大諸侯に向かって声高にこう語りかけた。", "raw_tagged": "Then was the {{office:大司教|Archbishop}} much troubled in spirit, for he said to himself, \"Can it be sooth that {{person:マーリン|Merlin}} hath deceived me, and hath made a mock of me and of all these {{office:王|kings}} and lordly folk? Surely this cannot be. For {{person:マーリン|Merlin}} is passing wise, and he would not make a mock of all the realm for the sake of so sorry a jest as this would be. Certes he hath some intent in this of which we know naught, being of less wisdom than he - wherefore I will be patient for a while longer.\" Accordingly, having communed thus within himself, he spake aloud in this wise to those seven high lords:", "translation_tagged": "すると{{office:大司教|大司教}}は心のうちに深く思い悩んだ。というのも、彼は胸の中でこう自問したからである。「{{person:マーリン|マーリン}}が私を欺き、私とこれらすべての{{office:王|王}}たちや貴顕の人々を愚弄したということが、まことであり得ようか？ いや、決してそのようなはずはない。なぜなら{{person:マーリン|マーリン}}は並外れて賢明な人物であり、かほどにつまらぬ悪戯のために王国全体を愚弄するようなことはするはずがないからだ。きっと彼には、彼より知恵の及ばぬ我らには窺い知れぬ何らかの深意があるに違いない――それゆえ、私はもうしばらくの間だけ辛抱して待つことにしよう。」かくして胸中でそのように思案を巡らせたのち、彼はかの七人の大諸侯に向かって声高にこう語りかけた。", "persons": "マーリン", "places": "", "offices": "大司教,王", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "這時大主教心中大為煩憂，暗自思忖道：「難道梅林當真欺騙了我，把我和這所有的國王與顯貴之士全都戲弄了一番嗎？這絕無可能。因為梅林才智超群，絕不會為了這等拙劣無聊的玩笑而戲弄整個王國。想必他在此事之中另有深意，只是我們智慧不及他而無從知曉罷了——因此我且再耐心等候片刻。」他在心中如此反覆思量妥當後，便向那七位大領主高聲說道：", "zh_tw_tagged": "這時{{office:大司教|大主教}}心中大為煩憂，暗自思忖道：「難道{{person:マーリン|梅林}}當真欺騙了我，把我和這所有的{{office:王|國王}}與顯貴之士全都戲弄了一番嗎？這絕無可能。因為{{person:マーリン|梅林}}才智超群，絕不會為了這等拙劣無聊的玩笑而戲弄整個王國。想必他在此事之中另有深意，只是我們智慧不及他而無從知曉罷了——因此我且再耐心等候片刻。」他在心中如此反覆思量妥當後，便向那七位大領主高聲說道：", "zh_cn": "这时大主教心中大为烦忧，暗自思忖道：“难道梅林当真欺骗了我，把我和这所有的国王与显贵之士全都戏弄了一番吗？这绝无可能。因为梅林才智超群，绝不会为了这等拙劣无聊的玩笑而戏弄整个王国。想必他在此事之中另有深意，只是我们智慧不及他而无从知晓罢了——因此我且再耐心等候片刻。”他在心中如此反复思量妥当后，便向那七位大领主高声说道：", "zh_cn_tagged": "这时{{office:大司教|大主教}}心中大为烦忧，暗自思忖道：“难道{{person:マーリン|梅林}}当真欺骗了我，把我和这所有的{{office:王|国王}}与显贵之士全都戏弄了一番吗？这绝无可能。因为{{person:マーリン|梅林}}才智超群，绝不会为了这等拙劣无聊的玩笑而戏弄整个王国。想必他在此事之中另有深意，只是我们智慧不及他而无从知晓罢了——因此我且再耐心等候片刻。”他在心中如此反复思量妥当后，便向那七位大领主高声说道：", "ko": "그러자 대주교는 마음속으로 깊이 고뇌하며 스스로에게 이렇게 되물었다. ‘멀린이 나를 속이고 나와 이 모든 왕들과 귀한 이들을 우롱했다는 것이 참말일 수 있을까? 결코 그럴 리 없다. 멀린은 비할 데 없이 지혜로운 사람이니, 이토록 보잘것없는 농담 따위를 하자고 온 왕국을 조롱할 리가 없지 않은가. 분명 그에게는 그보다 지혜가 모자란 우리로서는 알지 못하는 어떤 깊은 뜻이 있을 것이다――그러니 내가 조금만 더 인내하며 기다려 보리라.’ 이렇듯 속으로 곰곰이 헤아린 뒤, 그는 저 일곱 명의 대영주들에게 소리 높여 이와 같이 말했다.", "ko_tagged": "그러자 {{office:大司教|대주교}}는 마음속으로 깊이 고뇌하며 스스로에게 이렇게 되물었다. ‘{{person:マーリン|멀린}}이 나를 속이고 나와 이 모든 {{office:王|왕}}들과 귀한 이들을 우롱했다는 것이 참말일 수 있을까? 결코 그럴 리 없다. {{person:マーリン|멀린}}은 비할 데 없이 지혜로운 사람이니, 이토록 보잘것없는 농담 따위를 하자고 온 왕국을 조롱할 리가 없지 않은가. 분명 그에게는 그보다 지혜가 모자란 우리로서는 알지 못하는 어떤 깊은 뜻이 있을 것이다――그러니 내가 조금만 더 인내하며 기다려 보리라.’ 이렇듯 속으로 곰곰이 헤아린 뒤, 그는 저 일곱 명의 대영주들에게 소리 높여 이와 같이 말했다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p10_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 10, "type": "本文", "raw_text": "\"Messires,\" he said, \"I have yet faith that Merlin hath not deceived us, wherefore I pray your patience for one little while longer. For if, in the time a man may count five hundred twice over, no one cometh forward to perform this task, then will I, at your behest, proceed to choose one from amongst you and will proclaim him King and Overlord of all.\" For the Archbishop had faith that Merlin was about to immediately declare a king before them all.", "translation": "「諸卿よ」と彼は言った。「私はなお、マーリンが我らを欺いたのではあるまいと信じております。それゆえ、ほんの今しばらくだけご辛抱くださるようお願い申し上げます。もし人が五百を二度数えるほどの間に、この務めを果たそうと進み出る者が誰一人現れぬならば、その時には皆様のお求めに従い、皆様の中からお一人を選んで、その方を万人の王にして最高君主であると布告いたしましょう。」というのも大司教は、マーリンが今にも一同の御前で一人の王を明らかにしようとしているのだと信じていたからである。", "raw_tagged": "\"Messires,\" he said, \"I have yet faith that {{person:マーリン|Merlin}} hath not deceived us, wherefore I pray your patience for one little while longer. For if, in the time a man may count five hundred twice over, no one cometh forward to perform this task, then will I, at your behest, proceed to choose one from amongst you and will proclaim him {{office:王|King}} and Overlord of all.\" For the {{office:大司教|Archbishop}} had faith that {{person:マーリン|Merlin}} was about to immediately declare a {{office:王|king}} before them all.", "translation_tagged": "「諸卿よ」と彼は言った。「私はなお、{{person:マーリン|マーリン}}が我らを欺いたのではあるまいと信じております。それゆえ、ほんの今しばらくだけご辛抱くださるようお願い申し上げます。もし人が五百を二度数えるほどの間に、この務めを果たそうと進み出る者が誰一人現れぬならば、その時には皆様のお求めに従い、皆様の中からお一人を選んで、その方を万人の{{office:王|王}}にして最高君主であると布告いたしましょう。」というのも{{office:大司教|大司教}}は、{{person:マーリン|マーリン}}が今にも一同の御前で一人の{{office:王|王}}を明らかにしようとしているのだと信じていたからである。", "persons": "マーリン", "places": "", "offices": "王,大司教", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "「諸位大人，」他說道，「我依然深信梅林並未欺騙我們，因此懇請諸位再稍加忍耐片刻。倘若在一個人數完兩遍五百的時間之內，仍無人上前完成這項使命，那麼我便依諸位所請，著手從你們當中推選一人，宣告他為統御眾人的國王與最高君主。」因為大主教深信，梅林馬上就要在眾人面前昭告一位國王了。", "zh_tw_tagged": "「諸位大人，」他說道，「我依然深信{{person:マーリン|梅林}}並未欺騙我們，因此懇請諸位再稍加忍耐片刻。倘若在一個人數完兩遍五百的時間之內，仍無人上前完成這項使命，那麼我便依諸位所請，著手從你們當中推選一人，宣告他為統御眾人的{{office:王|國王}}與最高君主。」因為{{office:大司教|大主教}}深信，{{person:マーリン|梅林}}馬上就要在眾人面前昭告一位{{office:王|國王}}了。", "zh_cn": "“诸位大人，”他说道，“我依然深信梅林并未欺骗我们，因此恳请诸位再稍加忍耐片刻。倘若在一个人数完两遍五百的时间之内，仍无人上前完成这项使命，那么我便依诸位所请，着手从你们当中推选一人，宣告他为统御众人的国王与最高君主。”因为大主教深信，梅林马上就要在众人面前昭告一位国王了。", "zh_cn_tagged": "“诸位大人，”他说道，“我依然深信{{person:マーリン|梅林}}并未欺骗我们，因此恳请诸位再稍加忍耐片刻。倘若在一个人数完两遍五百的时间之内，仍无人上前完成这项使命，那么我便依诸位所请，着手从你们当中推选一人，宣告他为统御众人的{{office:王|国王}}与最高君主。”因为{{office:大司教|大主教}}深信，{{person:マーリン|梅林}}马上就要在众人面前昭告一位{{office:王|国王}}了。", "ko": "“제경들이여,” 하고 그가 말했다. “나는 아직도 멀린이 우리를 속이지 않았다고 믿고 있소. 그러니 아주 잠시만 더 참아 주시기를 청하오. 만일 사람이 오백을 두 번 헤아릴 만한 시간 안에도 이 과업을 수행하러 나서는 이가 아무도 없다면, 그때는 그대들의 요청에 따라 그대들 가운데 한 사람을 택하여 만인의 왕이자 최고 군주로 선포하겠소.” 이는 대주교가 멀린이 곧 모든 사람 앞에서 한 왕을 드러내 밝히려 한다고 굳게 믿었기 때문이었다.", "ko_tagged": "“제경들이여,” 하고 그가 말했다. “나는 아직도 {{person:マーリン|멀린}}이 우리를 속이지 않았다고 믿고 있소. 그러니 아주 잠시만 더 참아 주시기를 청하오. 만일 사람이 오백을 두 번 헤아릴 만한 시간 안에도 이 과업을 수행하러 나서는 이가 아무도 없다면, 그때는 그대들의 요청에 따라 그대들 가운데 한 사람을 택하여 만인의 {{office:王|왕}}이자 최고 군주로 선포하겠소.” 이는 {{office:大司教|대주교}}가 {{person:マーリン|멀린}}이 곧 모든 사람 앞에서 한 {{office:王|왕}}을 드러내 밝히려 한다고 굳게 믿었기 때문이었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p11_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 11, "type": "本文", "raw_text": "Now leave we these and turn we unto Arthur and his father and brother.", "translation": "さて、こちらの方々のことはひとまず措き、アーサーとその父、そして兄のもとへと目を転ずることにしよう。", "raw_tagged": "Now leave we these and turn we unto {{person:アーサー|Arthur}} and his father and brother.", "translation_tagged": "さて、こちらの方々のことはひとまず措き、{{person:アーサー|アーサー}}とその父、そして兄のもとへと目を転ずることにしよう。", "persons": "アーサー", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "現在且讓我們暫且放下這邊的眾人，轉而敘說亞瑟與他的父親及兄長。", "zh_tw_tagged": "現在且讓我們暫且放下這邊的眾人，轉而敘說{{person:アーサー|亞瑟}}與他的父親及兄長。", "zh_cn": "现在且让我们暂且放下这边的众人，转而叙说亚瑟与他的父亲及兄长。", "zh_cn_tagged": "现在且让我们暂且放下这边的众人，转而叙说{{person:アーサー|亚瑟}}与他的父亲及兄长。", "ko": "이제 이쪽 사람들의 이야기는 잠시 접어 두고, 아서와 그의 아버지와 형에게로 눈을 돌려 보자.", "ko_tagged": "이제 이쪽 사람들의 이야기는 잠시 접어 두고, {{person:アーサー|아서}}와 그의 아버지와 형에게로 눈을 돌려 보자.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p12_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 12, "type": "本文", "raw_text": "For Merlin had bidden those three to abide in their pavilion until such time as he thought would be fit for them to come out thence. And that time being now come, Merlin and Sir Ulfius went to the pavilion of Sir Ector, and Merlin said, \"Arthur, arise and come forth, for now the hour is come for thee to assay before the whole world that miracle which thou didst of late execute in privacy.\" So Arthur did as Merlin bade him to do, and he came forth from the pavilion with his father and his brother, and, lo! he was like one who walked in a dream. So they five went down from thence toward the cathedral and unto that place of assay. And when they had come to the congregation there assembled, the people made way for them, greatly marvelling and saying to one another, \"Who are these with the Enchanter Merlin and Sir Ulfius, and whence come they? For all the world knew Merlin and Sir Ulfius, and they wist that here was something very extraordinary about to happen. And Arthur was clad all in flame-colored raiment embroidered with threads of silver, so that others of the people said, \"Certes, that youth is very fair for to look upon; now who may he be?\"", "translation": "というのもマーリンはかの三人に対し、彼らが外へ出るのにふさわしいと自分が判断する時が来るまで、天幕のうちに留まっているよう命じておいたからである。そして今やその時が訪れたので、マーリンとウルフィアス卿はエクター卿の天幕へと赴き、マーリンが言った。「アーサーよ、立ち上がって外へ出るがよい。そなたが先ごろ人知れず成し遂げたあの奇跡を、今こそ全世界の御前で試しに示すべき時が来たのじゃ。」そこでアーサーはマーリンに命じられたとおりにし、父と兄とを伴って天幕から歩み出たが、見よ、彼はさながら夢の中を歩む人のようであった。かくして彼ら五人はそこから大聖堂の方角、かの試しの場へと降りていった。彼らがそこに参集していた大群衆のもとへ至ると、人々は道を開けて彼らを通し、大いに驚嘆して互いにこう語り合った。「魔術師マーリンとウルフィアス卿とともに歩むこの方々は誰であろう、またどこから来られたのであろうか？」というのも、世の人々は皆マーリンとウルフィアス卿のことをよく知っており、今まさに何か並々ならぬ一大事が起こりつつあることを悟ったからである。しかもアーサーは銀糸の刺繍を施した炎の色の衣を全身にまとっていたので、他の人々は口々に言った。「まことに、あの若者はなんと見目麗しい姿であろうか。いったいどこのどなたなのであろう？」", "raw_tagged": "For {{person:マーリン|Merlin}} had bidden those three to abide in their pavilion until such time as he thought would be fit for them to come out thence. And that time being now come, {{person:マーリン|Merlin}} and {{person:ウルフィアス|Sir Ulfius}} went to the pavilion of {{person:エクター|Sir Ector}}, and {{person:マーリン|Merlin}} said, \"{{person:アーサー|Arthur}}, arise and come forth, for now the hour is come for thee to assay before the whole world that miracle which thou didst of late execute in privacy.\" So {{person:アーサー|Arthur}} did as {{person:マーリン|Merlin}} bade him to do, and he came forth from the pavilion with his father and his brother, and, lo! he was like one who walked in a dream. So they five went down from thence toward the cathedral and unto that place of assay. And when they had come to the congregation there assembled, the people made way for them, greatly marvelling and saying to one another, \"Who are these with the {{special:魔術師|Enchanter}} {{person:マーリン|Merlin}} and {{person:ウルフィアス|Sir Ulfius}}, and whence come they? For all the world knew {{person:マーリン|Merlin}} and {{person:ウルフィアス|Sir Ulfius}}, and they wist that here was something very extraordinary about to happen. And {{person:アーサー|Arthur}} was clad all in flame-colored raiment embroidered with threads of silver, so that others of the people said, \"Certes, that youth is very fair for to look upon; now who may he be?\"", "translation_tagged": "というのも{{person:マーリン|マーリン}}はかの三人に対し、彼らが外へ出るのにふさわしいと自分が判断する時が来るまで、天幕のうちに留まっているよう命じておいたからである。そして今やその時が訪れたので、{{person:マーリン|マーリン}}と{{person:ウルフィアス|ウルフィアス卿}}は{{person:エクター|エクター卿}}の天幕へと赴き、{{person:マーリン|マーリン}}が言った。「{{person:アーサー|アーサー}}よ、立ち上がって外へ出るがよい。そなたが先ごろ人知れず成し遂げたあの奇跡を、今こそ全世界の御前で試しに示すべき時が来たのじゃ。」そこで{{person:アーサー|アーサー}}は{{person:マーリン|マーリン}}に命じられたとおりにし、父と兄とを伴って天幕から歩み出たが、見よ、彼はさながら夢の中を歩む人のようであった。かくして彼ら五人はそこから大聖堂の方角、かの試しの場へと降りていった。彼らがそこに参集していた大群衆のもとへ至ると、人々は道を開けて彼らを通し、大いに驚嘆して互いにこう語り合った。「{{special:魔術師|魔術師}}{{person:マーリン|マーリン}}と{{person:ウルフィアス|ウルフィアス卿}}とともに歩むこの方々は誰であろう、またどこから来られたのであろうか？」というのも、世の人々は皆{{person:マーリン|マーリン}}と{{person:ウルフィアス|ウルフィアス卿}}のことをよく知っており、今まさに何か並々ならぬ一大事が起こりつつあることを悟ったからである。しかも{{person:アーサー|アーサー}}は銀糸の刺繍を施した炎の色の衣を全身にまとっていたので、他の人々は口々に言った。「まことに、あの若者はなんと見目麗しい姿であろうか。いったいどこのどなたなのであろう？」", "persons": "マーリン,ウルフィアス,エクター,アーサー", "places": "", "offices": "", "era_year": "伝説時代", "keywords": "魔術師", "is_enriched": true, "zh_tw": "原來梅林先前曾吩咐那三人留在他們的帳幕裡，直到他認為適合他們現身的時刻到來為止。如今時刻已到，梅林與烏爾菲烏斯爵士便前往艾克托爵士的帳幕，梅林說道：「亞瑟，起身出來吧，因為時刻已經到了，你當在舉世面前公開重現你不久前私下完成的那場奇蹟。」於是亞瑟遵照梅林的吩咐行事，與父親和兄長一同走出帳幕；看哪！他恍若在夢中行走一般。就這樣，他們五人從那裡朝大教堂及那處試煉場地走去。當他們來到聚集於彼處的群眾跟前時，百姓紛紛讓開道路，萬分驚奇地彼此議論道：「與魔法師梅林及烏爾菲烏斯爵士同行的這些是什麼人？他們又是從何處來的？」因為普天之下無人不識梅林與烏爾菲烏斯爵士，眾人都明白眼下必有某件非同尋常的大事即將發生。而亞瑟渾身穿著一襲繡有銀線的火焰色華服，因此百姓中又有人說道：「誠然，那位少年容貌真是俊美非凡；他究竟會是什麼人呢？」", "zh_tw_tagged": "原來{{person:マーリン|梅林}}先前曾吩咐那三人留在他們的帳幕裡，直到他認為適合他們現身的時刻到來為止。如今時刻已到，{{person:マーリン|梅林}}與{{person:ウルフィアス|烏爾菲烏斯爵士}}便前往{{person:エクター|艾克托爵士}}的帳幕，{{person:マーリン|梅林}}說道：「{{person:アーサー|亞瑟}}，起身出來吧，因為時刻已經到了，你當在舉世面前公開重現你不久前私下完成的那場奇蹟。」於是{{person:アーサー|亞瑟}}遵照{{person:マーリン|梅林}}的吩咐行事，與父親和兄長一同走出帳幕；看哪！他恍若在夢中行走一般。就這樣，他們五人從那裡朝大教堂及那處試煉場地走去。當他們來到聚集於彼處的群眾跟前時，百姓紛紛讓開道路，萬分驚奇地彼此議論道：「與{{special:魔術師|魔法師}}{{person:マーリン|梅林}}及{{person:ウルフィアス|烏爾菲烏斯爵士}}同行的這些是什麼人？他們又是從何處來的？」因為普天之下無人不識{{person:マーリン|梅林}}與{{person:ウルフィアス|烏爾菲烏斯爵士}}，眾人都明白眼下必有某件非同尋常的大事即將發生。而{{person:アーサー|亞瑟}}渾身穿著一襲繡有銀線的火焰色華服，因此百姓中又有人說道：「誠然，那位少年容貌真是俊美非凡；他究竟會是什麼人呢？」", "zh_cn": "原来梅林先前曾吩咐那三人留在他们的帐幕里，直到他认为适合他们现身的时刻到来为止。如今时刻已到，梅林与乌尔菲乌斯爵士便前往艾克托爵士的帐幕，梅林说道：“亚瑟，起身出来吧，因为时刻已经到了，你当在举世面前公开重现你不久前私下完成的那场奇迹。”于是亚瑟遵照梅林的吩咐行事，与父亲和兄长一同走出帐幕；看哪！他恍若在梦中行走一般。就这样，他们五人从那里朝大教堂及那处试炼场地走去。当他们来到聚集于彼处的群众跟前时，百姓纷纷让开道路，万分惊奇地彼此议论道：“与魔法师梅林及乌尔菲乌斯爵士同行的这些是什么人？他们又是从何处来的？”因为普天之下无人不识梅林与乌尔菲乌斯爵士，众人都明白眼下必有某件非同寻常的大事即将发生。而亚瑟浑身穿着一袭绣有银线的火焰色华服，因此百姓中又有人说道：“诚然，那位少年容貌真是俊美非凡；他究竟会是什么人呢？”", "zh_cn_tagged": "原来{{person:マーリン|梅林}}先前曾吩咐那三人留在他们的帐幕里，直到他认为适合他们现身的时刻到来为止。如今时刻已到，{{person:マーリン|梅林}}与{{person:ウルフィアス|乌尔菲乌斯爵士}}便前往{{person:エクター|艾克托爵士}}的帐幕，{{person:マーリン|梅林}}说道：“{{person:アーサー|亚瑟}}，起身出来吧，因为时刻已经到了，你当在举世面前公开重现你不久前私下完成的那场奇迹。”于是{{person:アーサー|亚瑟}}遵照{{person:マーリン|梅林}}的吩咐行事，与父亲和兄长一同走出帐幕；看哪！他恍若在梦中行走一般。就这样，他们五人从那里朝大教堂及那处试炼场地走去。当他们来到聚集于彼处的群众跟前时，百姓纷纷让开道路，万分惊奇地彼此议论道：“与{{special:魔術師|魔法师}}{{person:マーリン|梅林}}及{{person:ウルフィアス|乌尔菲乌斯爵士}}同行的这些是什么人？他们又是从何处来的？”因为普天之下无人不识{{person:マーリン|梅林}}与{{person:ウルフィアス|乌尔菲乌斯爵士}}，众人都明白眼下必有某件非同寻常的大事即将发生。而{{person:アーサー|亚瑟}}浑身穿着一袭绣有银线的火焰色华服，因此百姓中又有人说道：“诚然，那位少年容貌真是俊美非凡；他究竟会是什么人呢？”", "ko": "이는 멀린이 그 세 사람에게, 그들이 밖으로 나오기에 알맞다고 자신이 여기는 때가 오기 전까지는 천막 안에 머물러 있으라고 일러 두었기 때문이었다. 이제 마침내 그때가 이르자 멀린과 울피우스 경이 엑터 경의 천막으로 찾아갔고, 멀린이 말했다. “아서여, 일어나 밖으로 나오너라. 네가 얼마 전 남몰래 이루었던 그 기적을 이제 온 세상 앞에서 시험하여 보일 시각이 왔느니라.” 그리하여 아서는 멀린이 명한 대로 아버지와 형과 함께 천막 밖으로 걸어 나왔는데, 보라! 그는 마치 꿈속을 걷는 사람과도 같았다. 그렇게 다섯 사람은 그곳에서부터 대성당과 검을 시험하는 장소가 있는 쪽으로 내려갔다. 그들이 그곳에 모여 있던 큰 무리 앞에 이르자, 백성들은 길을 비켜 주며 크게 경탄하여 서로에게 말했다. “마법사 멀린과 울피우스 경과 함께 오는 저들은 누구이며, 어디에서 온 사람들인가?” 온 세상 사람이 멀린과 울피우스 경을 잘 알고 있었으므로, 그들은 지금 무언가 지극히 비범한 일이 벌어지려 하고 있음을 직감했던 것이다. 게다가 아서는 은실로 수를 놓은 불꽃빛 의복을 온몸에 걸치고 있었기에, 다른 백성들은 또 이렇게 말했다. “참으로 저 젊은이는 보기에도 매우 곱고 준수하구나. 대체 누구일까?”", "ko_tagged": "이는 {{person:マーリン|멀린}}이 그 세 사람에게, 그들이 밖으로 나오기에 알맞다고 자신이 여기는 때가 오기 전까지는 천막 안에 머물러 있으라고 일러 두었기 때문이었다. 이제 마침내 그때가 이르자 {{person:マーリン|멀린}}과 {{person:ウルフィアス|울피우스 경}}이 {{person:エクター|엑터 경}}의 천막으로 찾아갔고, {{person:マーリン|멀린}}이 말했다. “{{person:アーサー|아서}}여, 일어나 밖으로 나오너라. 네가 얼마 전 남몰래 이루었던 그 기적을 이제 온 세상 앞에서 시험하여 보일 시각이 왔느니라.” 그리하여 {{person:アーサー|아서}}는 {{person:マーリン|멀린}}이 명한 대로 아버지와 형과 함께 천막 밖으로 걸어 나왔는데, 보라! 그는 마치 꿈속을 걷는 사람과도 같았다. 그렇게 다섯 사람은 그곳에서부터 대성당과 검을 시험하는 장소가 있는 쪽으로 내려갔다. 그들이 그곳에 모여 있던 큰 무리 앞에 이르자, 백성들은 길을 비켜 주며 크게 경탄하여 서로에게 말했다. “{{special:魔術師|마법사}} {{person:マーリン|멀린}}과 {{person:ウルフィアス|울피우스 경}}과 함께 오는 저들은 누구이며, 어디에서 온 사람들인가?” 온 세상 사람이 {{person:マーリン|멀린}}과 {{person:ウルフィアス|울피우스 경}}을 잘 알고 있었으므로, 그들은 지금 무언가 지극히 비범한 일이 벌어지려 하고 있음을 직감했던 것이다. 게다가 {{person:アーサー|아서}}는 은실로 수를 놓은 불꽃빛 의복을 온몸에 걸치고 있었기에, 다른 백성들은 또 이렇게 말했다. “참으로 저 젊은이는 보기에도 매우 곱고 준수하구나. 대체 누구일까?”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p13_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 13, "type": "本文", "raw_text": "But Merlin said no word to any man, but he brought Arthur through the press unto that place where the Archbishop sat; and the press made way for him so that he was not stayed in his going. And when the Archbishop beheld Merlin come thus with those others, he arose and said, \"Merlin, who are these whom thou bringest unto us, and what is their business here?\" And Merlin said, \"Lord, here is one come to make the assay of yonder sword.\" And the Archbishop said, \"Which one is he?\" and Merlin said, \"This is he,\" and he laid his hand upon Arthur.", "translation": "しかしマーリンは誰にも一言も言葉をかけず、人垣を押し分けて大司教が座しているその場所までアーサーを導いていった。群衆も彼のために道を開けたので、その歩みが遮られることはなかった。大司教はマーリンがそのように他の者たちを伴って近づいてくるのを見ると、席を立って言った。「マーリンよ、そなたが我らのもとへ連れてきたこの者たちは誰であり、ここに何の用があって参ったのか？」するとマーリンは言った。「尊師よ、あそこなる剣の試しに挑まんがために参った者がここにおりまする。」大司教が「その者とはどの一人か？」と尋ねると、マーリンは「この者でございます」と言い、アーサーの身に手を置いた。", "raw_tagged": "But {{person:マーリン|Merlin}} said no word to any man, but he brought {{person:アーサー|Arthur}} through the press unto that place where the {{office:大司教|Archbishop}} sat; and the press made way for him so that he was not stayed in his going. And when the {{office:大司教|Archbishop}} beheld {{person:マーリン|Merlin}} come thus with those others, he arose and said, \"{{person:マーリン|Merlin}}, who are these whom thou bringest unto us, and what is their business here?\" And {{person:マーリン|Merlin}} said, \"Lord, here is one come to make the assay of yonder sword.\" And the {{office:大司教|Archbishop}} said, \"Which one is he?\" and {{person:マーリン|Merlin}} said, \"This is he,\" and he laid his hand upon {{person:アーサー|Arthur}}.", "translation_tagged": "しかし{{person:マーリン|マーリン}}は誰にも一言も言葉をかけず、人垣を押し分けて{{office:大司教|大司教}}が座しているその場所まで{{person:アーサー|アーサー}}を導いていった。群衆も彼のために道を開けたので、その歩みが遮られることはなかった。{{office:大司教|大司教}}は{{person:マーリン|マーリン}}がそのように他の者たちを伴って近づいてくるのを見ると、席を立って言った。「{{person:マーリン|マーリン}}よ、そなたが我らのもとへ連れてきたこの者たちは誰であり、ここに何の用があって参ったのか？」すると{{person:マーリン|マーリン}}は言った。「尊師よ、あそこなる剣の試しに挑まんがために参った者がここにおりまする。」{{office:大司教|大司教}}が「その者とはどの一人か？」と尋ねると、{{person:マーリン|マーリン}}は「この者でございます」と言い、{{person:アーサー|アーサー}}の身に手を置いた。", "persons": "マーリン,アーサー", "places": "", "offices": "大司教", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "然而梅林對任何人都一言不發，只領著亞瑟穿過擁擠的人群，徑直走到大主教就座之處；人群紛紛為他讓路，使他一路通行無阻。當大主教看見梅林如此帶著那幾人前來時，便起身問道：「梅林，你帶到我們面前來的這些是什麼人？他們來此有何貴幹？」梅林說道：「尊座，這裡有一人前來試拔那把寶劍。」大主教問道：「是哪一位？」梅林說：「就是他。」隨即把手按在亞瑟身上。", "zh_tw_tagged": "然而{{person:マーリン|梅林}}對任何人都一言不發，只領著{{person:アーサー|亞瑟}}穿過擁擠的人群，徑直走到{{office:大司教|大主教}}就座之處；人群紛紛為他讓路，使他一路通行無阻。當{{office:大司教|大主教}}看見{{person:マーリン|梅林}}如此帶著那幾人前來時，便起身問道：「{{person:マーリン|梅林}}，你帶到我們面前來的這些是什麼人？他們來此有何貴幹？」{{person:マーリン|梅林}}說道：「尊座，這裡有一人前來試拔那把寶劍。」{{office:大司教|大主教}}問道：「是哪一位？」{{person:マーリン|梅林}}說：「就是他。」隨即把手按在{{person:アーサー|亞瑟}}身上。", "zh_cn": "然而梅林对任何人都一言不发，只领着亚瑟穿过拥挤的人群，径直走到大主教就座之处；人群纷纷为他让路，使他一路通行无阻。当大主教看见梅林如此带着那几人前来时，便起身问道：“梅林，你带到我们面前来的这些是什么人？他们来此有何贵干？”梅林说道：“尊座，这里有一人前来试拔那把宝剑。”大主教问道：“是哪一位？”梅林说：“就是他。”随即把手按在亚瑟身上。", "zh_cn_tagged": "然而{{person:マーリン|梅林}}对任何人都一言不发，只领着{{person:アーサー|亚瑟}}穿过拥挤的人群，径直走到{{office:大司教|大主教}}就座之处；人群纷纷为他让路，使他一路通行无阻。当{{office:大司教|大主教}}看见{{person:マーリン|梅林}}如此带着那几人前来时，便起身问道：“{{person:マーリン|梅林}}，你带到我们面前来的这些是什么人？他们来此有何贵干？”{{person:マーリン|梅林}}说道：“尊座，这里有一人前来试拔那把宝剑。”{{office:大司教|大主教}}问道：“是哪一位？”{{person:マーリン|梅林}}说：“就是他。”随即把手按在{{person:アーサー|亚瑟}}身上。", "ko": "그러나 멀린은 아무에게도 한마디 말도 건네지 않은 채 인파를 헤치고 대주교가 앉아 있는 곳까지 아서를 데리고 나아갔으며, 군중이 그에게 길을 비켜 주었으므로 그의 걸음은 조금도 지체되지 않았다. 대주교는 멀린이 그처럼 다른 이들을 거느리고 오는 것을 보고 자리에서 일어나 물었다. “멀린이여, 그대가 우리에게 데려온 이들은 누구이며 무슨 볼일로 이곳에 왔는가?” 이에 멀린이 아뢰었다. “존귀하신 분이여, 저기 있는 검을 시험하러 온 이가 여기에 있습니다.” 대주교가 “그가 어느 사람인가?” 하고 묻자, 멀린은 “바로 이 사람이오”라고 말하며 아서에게 손을 얹었다.", "ko_tagged": "그러나 {{person:マーリン|멀린}}은 아무에게도 한마디 말도 건네지 않은 채 인파를 헤치고 {{office:大司教|대주교}}가 앉아 있는 곳까지 {{person:アーサー|아서}}를 데리고 나아갔으며, 군중이 그에게 길을 비켜 주었으므로 그의 걸음은 조금도 지체되지 않았다. {{office:大司教|대주교}}는 {{person:マーリン|멀린}}이 그처럼 다른 이들을 거느리고 오는 것을 보고 자리에서 일어나 물었다. “{{person:マーリン|멀린}}이여, 그대가 우리에게 데려온 이들은 누구이며 무슨 볼일로 이곳에 왔는가?” 이에 {{person:マーリン|멀린}}이 아뢰었다. “존귀하신 분이여, 저기 있는 검을 시험하러 온 이가 여기에 있습니다.” {{office:大司教|대주교}}가 “그가 어느 사람인가?” 하고 묻자, {{person:マーリン|멀린}}은 “바로 이 사람이오”라고 말하며 {{person:アーサー|아서}}에게 손을 얹었다.", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p14_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 14, "type": "本文", "raw_text": "Then the Archbishop looked upon Arthur and he beheld that the youth was very comely of face, wherefore his heart went out unto Arthur and he loved him a very great deal. And the Archbishop said, \"Merlin, by what right doth this young man come hither?\" And Merlin made reply, \"Lord, he cometh hither by the best right that there is in the world; for he who standeth before thee clad in red is the true son of Uther-Pendragon and of his lawful wife, Queen Igraine.\"", "translation": "そこで大司教がアーサーを見つめると、その若者がまことに端麗な顔立ちをしているのが目に入ったので、心は深くアーサーへと惹きつけられ、限りない慈愛の情を覚えた。そして大司教は言った。「マーリンよ、この若者はいかなる資格によってここへ参ったのか？」するとマーリンは答えた。「尊師よ、彼はこの世に存在する最も正当なる資格によってここへ参ったのでございます。なぜなら、紅の衣をまとってあなたの御前に立つこの者こそ、ユーサー・ペンドラゴンとその正統なる妻イグレーヌ王妃との間に生まれた、紛れもない実の息子だからでございます。」", "raw_tagged": "Then the {{office:大司教|Archbishop}} looked upon {{person:アーサー|Arthur}} and he beheld that the youth was very comely of face, wherefore his heart went out unto {{person:アーサー|Arthur}} and he loved him a very great deal. And the {{office:大司教|Archbishop}} said, \"{{person:マーリン|Merlin}}, by what right doth this young man come hither?\" And {{person:マーリン|Merlin}} made reply, \"Lord, he cometh hither by the best right that there is in the world; for he who standeth before thee clad in red is the true son of {{person:ユーサー|Uther-Pendragon}} and of his lawful wife, {{office:王妃|Queen}} {{person:イグレーヌ|Igraine}}.\"", "translation_tagged": "そこで{{office:大司教|大司教}}が{{person:アーサー|アーサー}}を見つめると、その若者がまことに端麗な顔立ちをしているのが目に入ったので、心は深く{{person:アーサー|アーサー}}へと惹きつけられ、限りない慈愛の情を覚えた。そして{{office:大司教|大司教}}は言った。「{{person:マーリン|マーリン}}よ、この若者はいかなる資格によってここへ参ったのか？」すると{{person:マーリン|マーリン}}は答えた。「尊師よ、彼はこの世に存在する最も正当なる資格によってここへ参ったのでございます。なぜなら、紅の衣をまとってあなたの御前に立つこの者こそ、{{person:ユーサー|ユーサー・ペンドラゴン}}とその正統なる妻{{person:イグレーヌ|イグレーヌ}}{{office:王妃|王妃}}との間に生まれた、紛れもない実の息子だからでございます。」", "persons": "アーサー,マーリン,ユーサー,イグレーヌ", "places": "", "offices": "大司教,王妃", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "於是大主教端詳著亞瑟，見這少年面容極為俊秀端莊，心中不禁對亞瑟生出深切的憐愛，十分喜愛他。接著大主教問道：「梅林，這位年輕人憑何種資格來到此處？」梅林回答道：「尊座，他是憑著普天之下最正當不過的資格來到此處的；因為身穿紅衣站在您面前的這位青年，正是烏瑟·潘德拉剛與他的合法妻子伊格蕾茵王后所生的親生兒子。」", "zh_tw_tagged": "於是{{office:大司教|大主教}}端詳著{{person:アーサー|亞瑟}}，見這少年面容極為俊秀端莊，心中不禁對{{person:アーサー|亞瑟}}生出深切的憐愛，十分喜愛他。接著{{office:大司教|大主教}}問道：「{{person:マーリン|梅林}}，這位年輕人憑何種資格來到此處？」{{person:マーリン|梅林}}回答道：「尊座，他是憑著普天之下最正當不過的資格來到此處的；因為身穿紅衣站在您面前的這位青年，正是{{person:ユーサー|烏瑟·潘德拉剛}}與他的合法妻子{{person:イグレーヌ|伊格蕾茵}}{{office:王妃|王后}}所生的親生兒子。」", "zh_cn": "于是大主教端详着亚瑟，见这少年面容极为俊秀端庄，心中不禁对亚瑟生出深切的怜爱，十分喜爱他。接着大主教问道：“梅林，这位年轻人凭何种资格来到此处？”梅林回答道：“尊座，他是凭着普天之下最正当不过的资格来到此处的；因为身穿红衣站在您面前的这位青年，正是乌瑟·潘德拉刚与他的合法妻子伊格蕾茵王后所生的亲生儿子。”", "zh_cn_tagged": "于是{{office:大司教|大主教}}端详着{{person:アーサー|亚瑟}}，见这少年面容极为俊秀端庄，心中不禁对{{person:アーサー|亚瑟}}生出深切的怜爱，十分喜爱他。接着{{office:大司教|大主教}}问道：“{{person:マーリン|梅林}}，这位年轻人凭何种资格来到此处？”{{person:マーリン|梅林}}回答道：“尊座，他是凭着普天之下最正当不过的资格来到此处的；因为身穿红衣站在您面前的这位青年，正是{{person:ユーサー|乌瑟·潘德拉刚}}与他的合法妻子{{person:イグレーヌ|伊格蕾茵}}{{office:王妃|王后}}所生的亲生儿子。”", "ko": "이에 대주교가 아서를 바라보니 그 젊은이의 용모가 매우 단정하고 준수하였으므로, 마음이 깊이 아서에게로 기울어 그를 지극히 사랑스럽게 여겼다. 그리고 대주교가 물었다. “멀린이여, 이 젊은이는 무슨 자격으로 이곳에 왔는가?” 그러자 멀린이 대답했다. “존귀하신 분이여, 그는 이 세상에 있는 가장 정당한 자격으로 이곳에 왔습니다. 붉은 옷을 입고 그대 앞에 서 있는 이 사람이야말로 우서 펜드래건과 그의 정실부인인 이그레인 왕비 사이에서 태어난 참된 친아들이기 때문입니다.”", "ko_tagged": "이에 {{office:大司教|대주교}}가 {{person:アーサー|아서}}를 바라보니 그 젊은이의 용모가 매우 단정하고 준수하였으므로, 마음이 깊이 {{person:アーサー|아서}}에게로 기울어 그를 지극히 사랑스럽게 여겼다. 그리고 {{office:大司教|대주교}}가 물었다. “{{person:マーリン|멀린}}이여, 이 젊은이는 무슨 자격으로 이곳에 왔는가?” 그러자 {{person:マーリン|멀린}}이 대답했다. “존귀하신 분이여, 그는 이 세상에 있는 가장 정당한 자격으로 이곳에 왔습니다. 붉은 옷을 입고 그대 앞에 서 있는 이 사람이야말로 {{person:ユーサー|우서 펜드래건}}과 그의 정실부인인 {{person:イグレーヌ|이그레인}} {{office:王妃|왕비}} 사이에서 태어난 참된 친아들이기 때문입니다.”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p15_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 15, "type": "本文", "raw_text": "Then the Archbishop cried out aloud in great amazement and those who stood nigh and who heard what Merlin said were so astonished that they wist not what to think. And the Archbishop said, \"Merlin, what is this that thou tellest me? For who, until now, in all the world hath ever heard that Uther-Pendragon had a son?\"", "translation": "すると大司教はあまりの驚愕に思わず大声を上げ、近くに立っていてマーリンの言葉を耳にした者たちもまた、どう考えてよいかわからぬほど激しく仰天した。そして大司教は言った。「マーリンよ、そなたが私に告げているその話は、いったい何事か？ 今日この時に至るまで、この広い世のいったい誰が、ユーサー・ペンドラゴンに息子があったなどという話を聞いたことがあろうか？」", "raw_tagged": "Then the {{office:大司教|Archbishop}} cried out aloud in great amazement and those who stood nigh and who heard what {{person:マーリン|Merlin}} said were so astonished that they wist not what to think. And the {{office:大司教|Archbishop}} said, \"{{person:マーリン|Merlin}}, what is this that thou tellest me? For who, until now, in all the world hath ever heard that {{person:ユーサー|Uther-Pendragon}} had a son?\"", "translation_tagged": "すると{{office:大司教|大司教}}はあまりの驚愕に思わず大声を上げ、近くに立っていて{{person:マーリン|マーリン}}の言葉を耳にした者たちもまた、どう考えてよいかわからぬほど激しく仰天した。そして{{office:大司教|大司教}}は言った。「{{person:マーリン|マーリン}}よ、そなたが私に告げているその話は、いったい何事か？ 今日この時に至るまで、この広い世のいったい誰が、{{person:ユーサー|ユーサー・ペンドラゴン}}に息子があったなどという話を聞いたことがあろうか？」", "persons": "マーリン,ユーサー", "places": "", "offices": "大司教", "era_year": "伝説時代", "keywords": "", "is_enriched": true, "zh_tw": "大主教聽罷大吃一驚，不由得失聲驚呼，站在近旁聽見梅林這番話的人們也震驚得不知該作何想。大主教說道：「梅林，你告訴我的這是什麼話？直到今日之前，普天之下有誰曾聽說過烏瑟·潘德拉剛有一個兒子？」", "zh_tw_tagged": "{{office:大司教|大主教}}聽罷大吃一驚，不由得失聲驚呼，站在近旁聽見{{person:マーリン|梅林}}這番話的人們也震驚得不知該作何想。{{office:大司教|大主教}}說道：「{{person:マーリン|梅林}}，你告訴我的這是什麼話？直到今日之前，普天之下有誰曾聽說過{{person:ユーサー|烏瑟·潘德拉剛}}有一個兒子？」", "zh_cn": "大主教听罢大吃一惊，不由得失声惊呼，站在近旁听见梅林这番话的人们也震惊得不知该作何想。大主教说道：“梅林，你告诉我的这是什么话？直到今日之前，普天之下有谁曾听说过乌瑟·潘德拉刚有一个儿子？”", "zh_cn_tagged": "{{office:大司教|大主教}}听罢大吃一惊，不由得失声惊呼，站在近旁听见{{person:マーリン|梅林}}这番话的人们也震惊得不知该作何想。{{office:大司教|大主教}}说道：“{{person:マーリン|梅林}}，你告诉我的这是什么话？直到今日之前，普天之下有谁曾听说过{{person:ユーサー|乌瑟·潘德拉刚}}有一个儿子？”", "ko": "그러자 대주교는 크나큰 경악에 휩싸여 큰 소리로 외쳤고, 가까이에 서서 멀린이 한 말을 들은 이들도 너무나 놀란 나머지 어찌 생각해야 좋을지조차 알지 못했다. 대주교가 말했다. “멀린이여, 그대가 내게 들려주는 이 말이 대체 무슨 소리인가? 지금까지 온 세상에서 우서 펜드래건에게 아들이 있었다는 말을 들어 본 사람이 대체 어디에 있단 말인가?”", "ko_tagged": "그러자 {{office:大司教|대주교}}는 크나큰 경악에 휩싸여 큰 소리로 외쳤고, 가까이에 서서 {{person:マーリン|멀린}}이 한 말을 들은 이들도 너무나 놀란 나머지 어찌 생각해야 좋을지조차 알지 못했다. {{office:大司教|대주교}}가 말했다. “{{person:マーリン|멀린}}이여, 그대가 내게 들려주는 이 말이 대체 무슨 소리인가? 지금까지 온 세상에서 {{person:ユーサー|우서 펜드래건}}에게 아들이 있었다는 말을 들어 본 사람이 대체 어디에 있단 말인가?”", "era_year_i18n": {"ja": "伝説時代", "en": "Legendary Age", "zh_tw": "傳說時代", "zh_cn": "传说时代", "ko": "전설 시대"}}, {"id": "v4_p16_1", "volume": 4, "book": "第一巻", "section_title": "第三章　王権の確立", "para_index": 16, "type": "本文", "raw_text": "Unto this Merlin made reply: \"No one hath ever known of such a thing until now, only a very few. For it was in this wise: When this child was born the spirit of prophecy lay upon me and I foresaw that Uther-Pendragon would die before a very great while. Wherefore I feared that the enemies of the King would lay violent hands upon the young child for the sake of his inheritanc
