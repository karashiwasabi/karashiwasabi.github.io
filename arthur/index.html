  <style>
    /* =========================================================================
       『正史三國志』総合索引（glossary.html / index.html）ブラウン／羊皮紙テーマ
       ========================================================================= */
    :root {
      --bg-header-dark: #2c241b;
      --bg-header-sub: #3d2f1d;
      --bg-parchment: #f4f1ea;
      --bg-card: #fffdf9;
      --border-warm: #dcd3c1;
      --accent-gold: #8c6d46;
      --accent-gold-light: #d4b483;
      --accent-red: #b3392b;
      --text-primary: #261f18;
      --text-muted: #6b5c4c;
      --place-green: #1e6b3b;
      --person-brown: #7c3f12;
      --office-blue: #1e4e79;
      --special-purple: #63317c;
      --desktop-pane-width-pct: 50%;
      --mobile-map-height-pct: 42%;
      --mobile-reader-height-pct: 58%;
      --reader-bottom-safe-px: 48px;
      --z-map-controls: 700;
      --z-map-toast: 720;
      --z-index-overlay: 760;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-parchment);
      color: var(--text-primary);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      -webkit-text-size-adjust: 100%;
    }

    .app-shell {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }

    .left-pane {
      position: relative;
      display: flex;
      flex-direction: column;
      width: var(--desktop-pane-width-pct);
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      flex-shrink: 0;
      border-right: 2px solid #bda988;
      background: #dfd7c5;
    }

    #map {
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
    }

    /* 地図上の巻切り替えバー（本家『正史三國志』と同一のスリム1行構成） */
    .vol-nav-bar {
      height: 38px;
      min-height: 38px;
      background: #2c241b;
      color: #f7f1e5;
      border-bottom: 1.5px solid #8c6d46;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      z-index: 2000;
      user-select: none;
      position: relative;
      flex-shrink: 0;
    }
    .home-top-link {
      position: absolute;
      left: 10px;
      background: #3e2723;
      color: #ffe082;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.76rem;
      font-weight: bold;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }
    .home-top-link:hover { background: #5d4037; color: #fff; }
    .slim-nav-btn {
      background: #4e342e;
      color: #ffd54f;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1.3;
      text-decoration: none;
    }
    .slim-nav-btn:hover:not(:disabled) { background: #6d4c41; color: #fff; }
    .slim-nav-btn:disabled {
      background: transparent;
      color: #6d5d4b;
      border-color: #4e342e;
      cursor: not-allowed;
    }
    .vol-nav-select {
      background: #3e2723;
      color: #f7f1e5;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-family: "Yu Mincho", "MS PMincho", serif;
      letter-spacing: 0.05em;
      min-width: 0;
      max-width: 240px;
    }
    @media (max-width: 520px) {
      .vol-nav-bar { gap: 6px; padding: 0 6px; }
      .home-top-link { position: static; margin-right: auto; padding: 2px 6px; font-size: 0.72rem; }
      .vol-nav-select { max-width: 150px; font-size: 0.8rem; }
    }

    /* 地図右上：[📌 地図固定] ボタン */
    .map-lock-btn {
      position: absolute;
      top: 10px;
      right: 54px;
      z-index: var(--z-map-controls);
      background: rgba(255, 253, 249, 0.95);
      color: var(--text-primary);
      border: 1px solid #a38e6d;
      border-radius: 6px;
      padding: 5px 9px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
      white-space: nowrap;
    }

    .map-lock-btn.is-locked {
      background: var(--accent-red);
      color: #ffffff;
      border-color: #7c1f15;
    }

    /* 左下1行トースト */
    .map-toast {
      position: absolute;
      left: 10px;
      bottom: 18px;
      max-width: calc(100% - 20px);
      z-index: var(--z-map-toast);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(44, 36, 27, 0.94);
      color: #fdf8ee;
      border-left: 3px solid var(--accent-gold-light);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .map-toast.is-visible {
      display: inline-flex;
    }

    .map-toast-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .map-toast-close {
      background: transparent;
      border: none;
      color: #dfd3be;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .nature-mtn-label {
      color: #5c4328;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .nature-river-label {
      color: #1f5a8a;
      font-size: 0.72rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.92), -1px -1px 2px rgba(255,255,255,0.92);
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .place-pin-tooltip {
      background: rgba(44, 36, 27, 0.9);
      color: #fffdf8;
      border: 1px solid #d4b483;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .area-badge-label {
      background: rgba(179, 57, 43, 0.84);
      color: #ffffff;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 左ペイン上の五十音順 総合索引オーバーレイ（省スペース：件数表記なし・行ボタン列なし） */
    .index-overlay {
      position: absolute;
      top: 50px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: var(--z-index-overlay);
      background: rgba(255, 253, 249, 0.97);
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      box-shadow: 0 6px 22px rgba(28, 22, 16, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .index-overlay.is-hidden {
      display: none;
    }

    .index-top-controls {
      background: var(--bg-header-dark);
      padding: 7px 9px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .index-search-input {
      flex: 1 1 auto;
      min-width: 0;
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #bda682;
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 0.82rem;
    }

    .view-map-btn {
      background: var(--bg-header-sub);
      color: #f6efe2;
      border: 1px solid var(--accent-gold-light);
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .index-cat-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--bg-header-sub);
      border-bottom: 1px solid #6e5536;
      flex-shrink: 0;
    }

    .cat-tab-btn {
      background: transparent;
      color: #e2d7c3;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 7px 4px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-tab-btn.is-active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-bottom-color: var(--accent-gold-light);
    }

    .index-chips-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 18px;
    }

    .gojuon-group-heading {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--bg-header-sub);
      border-bottom: 1px solid var(--border-warm);
      padding-bottom: 2px;
      margin: 10px 0 6px;
    }

    .gojuon-group-heading:first-child {
      margin-top: 0;
    }

    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .index-chip {
      background: #fbf7ef;
      color: var(--text-primary);
      border: 1px solid #d3c5ad;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      line-height: 1.3;
    }

    .index-chip:hover {
      background: #f1e7d4;
      border-color: var(--accent-gold);
    }

    .index-chip.is-selected {
      background: var(--bg-header-dark);
      color: #ffffff;
      border-color: var(--bg-header-dark);
    }

    .chip-yomi {
      display: block;
      font-size: 0.66rem;
      font-weight: 400;
      opacity: 0.78;
    }

    /* 右ペイン：選択項目の解説サマリー＋該当本文カード一覧 */
    .right-pane {
      width: var(--desktop-pane-width-pct);
      height: 100%;
      min-height: 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-parchment);
    }

    .reader-header {
      background: var(--bg-header-dark);
      color: #f6efe2;
      padding: 8px 12px;
      border-bottom: 1px solid #6e5536;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .reader-app-name {
      font-size: 0.72rem;
      color: var(--accent-gold-light);
      font-weight: 700;
    }

    .reader-vol-title {
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .start-vol-link {
      background: var(--accent-gold);
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .records-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px calc(var(--reader-bottom-safe-px) + env(safe-area-inset-bottom, 0px));
    }

    /* 選択項目の先頭解説カード */
    .head-summary-card {
      background: #fcf7ec;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      padding: 13px 15px;
      margin-bottom: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      box-shadow: 0 2px 8px rgba(44, 36, 27, 0.08);
    }

    .summary-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--bg-header-dark);
      margin-bottom: 6px;
    }

    .summary-role-badge {
      display: inline-block;
      background: #ebe0cc;
      color: #4a3720;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .summary-desc {
      font-size: 0.86rem;
      line-height: 1.7;
      color: var(--text-primary);
    }

    .homonym-switch-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
      padding: 6px 8px;
      background: #f3e8d6;
      border-radius: 5px;
    }

    .homonym-btn {
      background: #fffdf9;
      color: var(--text-primary);
      border: 1px solid #a88d63;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .homonym-btn.is-current {
      background: var(--bg-header-sub);
      color: #ffffff;
    }

    .summary-wiki-box {
      margin-top: 9px;
      padding: 8px 10px;
      background: #f4f1ea;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      font-size: 0.79rem;
      line-height: 1.55;
    }

    /* 該当本文カード */
    .record-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      border-left: 4px solid #cbbba0;
      border-radius: 7px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .record-card.active-card {
      border-left-color: var(--accent-red);
      box-shadow: 0 2px 10px rgba(179, 57, 43, 0.14);
    }

    .card-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .open-in-vol-link {
      background: #efe6d5;
      color: #3d2f1d;
      text-decoration: none;
      border: 1px solid #c5b190;
      border-radius: 4px;
      padding: 2px 8px;
      font-weight: 700;
      font-size: 0.73rem;
    }

    .trans-box {
      font-size: 0.95rem;
      line-height: 1.88;
      color: var(--text-primary);
    }

    .inline-place {
      color: var(--place-green);
      border-bottom: 2px solid var(--place-green);
      cursor: pointer;
      font-weight: 600;
    }

    .inline-person {
      color: var(--person-brown);
      border-bottom: 1.5px dotted var(--person-brown);
      cursor: pointer;
      font-weight: 600;
    }

    .inline-office {
      color: var(--office-blue);
      border-bottom: 1.5px dashed var(--office-blue);
      cursor: pointer;
      font-weight: 600;
    }

    .inline-special {
      color: var(--special-purple);
      border-bottom: 1.5px dotted var(--special-purple);
      cursor: pointer;
      font-weight: 600;
    }

    .matched-target-term {
      background: #ffe58f;
      border-radius: 3px;
      padding: 0 2px;
    }

    .source-details {
      margin-top: 9px;
      border-top: 1px dashed var(--border-warm);
      padding-top: 6px;
    }

    .source-details summary {
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .source-text-body {
      margin-top: 6px;
      padding: 8px 10px;
      background: #f7f3eb;
      border-radius: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.88rem;
      line-height: 1.7;
    }

    .adsense-footer-box {
      margin-top: 18px;
      padding: 10px;
      background: #efeae0;
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    @media (max-width: 900px) {
      .app-shell {
        flex-direction: column;
      }
      .left-pane {
        width: 100%;
        height: var(--mobile-map-height-pct);
        border-right: none;
        border-bottom: 2px solid #bda988;
      }
      .right-pane {
        width: 100%;
        height: var(--mobile-reader-height-pct);
      }
      .map-lock-btn {
        top: 6px;
        right: 48px;
        padding: 4px 7px;
        font-size: 0.72rem;
      }
      .index-overlay {
        top: 42px;
        left: 6px;
        right: 6px;
        bottom: 6px;
      }
    }
    /* 右ペイン上部：vol01.html と同一のスリム1行バー（左：本編リンク／右端：言語切替） */
    .gloss-bar {
      height: 38px;
      min-height: 38px;
      background: #2c241b;
      border-bottom: 1.5px solid #8c6d46;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      flex-shrink: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .gloss-bar-link {
      color: #ffe082;
      background: #3e2723;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
    }
    .lang-switch-bar { margin-left: auto; display: inline-flex; gap: 3px; flex-shrink: 0; }
    .lang-btn {
      background: #4e342e;
      color: #ffd54f;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .lang-btn.is-active { background: #c9a66b; color: #ffffff; border-color: #e8d3a8; }
    .back-to-index-btn {
      background: #3e2723;
      color: #ffe082;
      border: 1px solid #8c6d46;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .back-to-index-btn:hover { background: #5d4037; color: #ffffff; }
    /* 地図内部（Leaflet の [+][-]・レイヤーボタン等 z-index 最大1000）を独立スタッキングに閉じ込め、
       索引オーバーレイ（z-index 1500）の上に突き抜けて検索欄へ重なるのを防ぐ */
    #map {
      position: relative;
      z-index: 0;
      isolation: isolate;
    }
    .index-overlay {
      z-index: 1500;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 左ペイン：地図 ＋ 五十音順総合索引オーバーレイ -->
    <section class="left-pane" aria-label="歴史地図と総合索引ペイン">
    <div class="vol-nav-bar">
      <a href="https://wasabikarashi.com/" class="home-top-link" title="Portal" data-i18n="{&quot;ja&quot;: &quot;🏠 トップ&quot;, &quot;en&quot;: &quot;🏠 Top&quot;, &quot;zh_tw&quot;: &quot;🏠 首頁&quot;, &quot;zh_cn&quot;: &quot;🏠 首页&quot;, &quot;ko&quot;: &quot;🏠 홈&quot;}">🏠 トップ</a>

    // 清音化マップ（濁音・半濁音・小書き仮名を五十音見出しに合流）
    const VOICED_TO_SEION_MAP = {
      "ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","ゔ":"う",
      "が":"か","ぎ":"き","ぐ":"く","げ":"け","ご":"こ",
      "ざ":"さ","じ":"し","ず":"す","ぜ":"せ","ぞ":"そ",

    };

    function normalizeYomiForSort(yomiStr) {
      const kataToHira = String(yomiStr || "").replace(/[ァ-ヶ]/g, function(ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0x60);
      });
      let out = "";
      for (let i = 0; i < kataToHira.length; i++) {
        const c = kataToHira[i];
        out += VOICED_TO_SEION_MAP[c] || c;
      }
      return out;
    }

    function getGojuonRowHeading(yomiStr) {
      const norm = normalizeYomiForSort(yomiStr);
      const first = norm.charAt(0);
      if ("あいうえお".includes(first)) return "あ行";
      if ("かきくけこ".includes(first)) return "か行";
      if ("さしすせそ".includes(first)) return "さ行";
      if ("たちつてと".includes(first)) return "た行";
      if ("なにぬねの".includes(first)) return "な行";
      if ("はひふへほ".includes(first)) return "は行";
      if ("まみむめも".includes(first)) return "ま行";
      if ("やゆよ".includes(first)) return "や行";
      if ("らりるれろ".includes(first)) return "ら行";
      if ("わをん".includes(first)) return "わ行";
      return "その他";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 索引オーバーレイ開閉＆共通地図コントローラ（shared_map_controller.js）初期化
    // =========================================================================
    const indexOverlayEl = document.getElementById("indexOverlay");
    const reopenIndexBtn = document.getElementById("reopenIndexBtn");
    const hideIndexViewMapBtn = document.getElementById("hideIndexViewMapBtn");
    const searchInputEl = document.getElementById("indexSearchInput");
    const chipsScrollEl = document.getElementById("indexChipsScroll");

    function setIndexOverlayVisible(visible) {
      indexOverlayEl.classList.toggle("is-hidden", !visible);
      if (reopenIndexBtn) {
        reopenIndexBtn.style.display = visible ? "none" : "inline-flex";
      }
    }

    hideIndexViewMapBtn.addEventListener("click", function() {
      setIndexOverlayVisible(false);
    });
    if (reopenIndexBtn) {
      reopenIndexBtn.addEventListener("click", function() {
        setIndexOverlayVisible(true);
      });
    }

    function syncCatTabButtons() {
      document.querySelectorAll(".cat-tab-btn").forEach(function(b) {
        b.classList.toggle("is-active", b.getAttribute("data-cat") === currentCategory);
      });
    }

    const mapCtrl = window.AntaraMapController.create({
      containerId: "map",
      toastId: "mapToast",
      initialCenter: [INITIAL_MAP_LAT, INITIAL_MAP_LNG],
      initialZoom: INITIAL_MAP_ZOOM,
      places: PLACES_MASTER,
      naturalFeatures: NATURE_MOUNTAINS,
      riverLines: NATURE_RIVERS,
      singlePinOnlyOnFocus: true,
      displayNameOf: function(k) { return localName("place", k); },
      natureLabelMode: "glossary",
      protectedControlIds: ["mapToast", "indexOverlay"],
      beforeFocusPlace: function() {
        setIndexOverlayVisible(false);
      },
      onPlaceShapeClick: function(placeKey) {
        currentCategory = "place";
        syncCatTabButtons();
        selectGlossaryEntry("place", placeKey, true);
      },
      onRiverClick: function(riverKey) {
        if (PLACES_MASTER[riverKey]) {
          currentCategory = "place";
          syncCatTabButtons();
          selectGlossaryEntry("place", riverKey, true);
        }
      }
    });

    mapCtrl.renderOverviewProvinces();

    function collectPlaceKeysFromCorpusRecords(recList) {
      const keys = [];
      const seen = new Set();
      recList.forEach(function(rec) {
        if (!rec.places) return;
        rec.places.split(",").forEach(function(rawK) {
          const k = rawK.trim();
          if (k && PLACES_MASTER[k] && !seen.has(k)) {
            seen.add(k);
            keys.push(k);
          }
        });
      });
      return keys;
    }

    // =========================================================================
    // 4分類索引データ構築
    // =========================================================================
    // =========================================================================
    // 多言語（en / ja / zh_tw / zh_cn / ko）。本編 vol01.html と保存キー arthur_selected_lang を共有
    // =========================================================================
    const LANG_STORAGE_KEY = "arthur_selected_lang";
    const SUPPORTED_LANGS = ["en", "ja", "zh_tw", "zh_cn", "ko"];
    const LANG_BUTTONS = [
      { code: "en", label: "EN" }, { code: "ja", label: "日" }, { code: "zh_tw", label: "繁" },
      { code: "zh_cn", label: "簡" }, { code: "ko", label: "韓" }
    ];
    const LANG_TAGGED_FIELD = { en: "raw_tagged", ja: "translation_tagged", zh_tw: "zh_tw_tagged", zh_cn: "zh_cn_tagged", ko: "ko_tagged" };
    const LANG_SORT_LOCALE = { en: "en", ja: "ja", zh_tw: "zh-Hant", zh_cn: "zh-Hans", ko: "ko" };
    const GLOSS_I18N = {
      ja: {
        tabPerson: "👤 人物", tabPlace: "🗺️ 地名", tabOffice: "👑 称号", tabSpecial: "🔖 用語",
        searchPh: "人物・地名・称号・用語を検索…", viewMap: "🗺️ 地図を見る", back: "← 索引一覧に戻る",
        open: "📖 本編で開く", source: "📜 原典（英語底本）を表示", noMatch: "該当する項目がありません。",
        noRec: "現在の公開範囲には該当する本文カードがまだありません。", startVol: "📖 本編へ",
        typeProse: "本文", typeVerse: "詩篇",

      },
      en: {
        tabPerson: "👤 People", tabPlace: "🗺️ Places", tabOffice: "👑 Titles", tabSpecial: "🔖 Terms",
        searchPh: "Search people, places, titles, terms…", viewMap: "🗺️ View map", back: "← Back to index list",
        open: "📖 Open in story", source: "📜 Show English source", noMatch: "No matching entries.",
        noRec: "No story card in the published range yet.", startVol: "📖 Read",
        typeProse: "Prose", typeVerse: "Verse",
        paraFmt: function(v, n, t) { return v + " · Para " + n + " (" + t + ")"; },
        onMap: function(name) { return "Showing the location of " + name + " on the map."; }
      },
      zh_tw: {
        tabPerson: "👤 人物", tabPlace: "🗺️ 地名", tabOffice: "👑 稱號", tabSpecial: "🔖 用語",
        searchPh: "搜尋人物、地名、稱號、用語…", viewMap: "🗺️ 查看地圖", back: "← 返回索引列表",
        open: "📖 在本篇開啟", source: "📜 顯示英文底本", noMatch: "沒有符合的項目。",
        noRec: "目前公開範圍內尚無相關正文卡片。", startVol: "📖 閱讀本篇",
        typeProse: "正文", typeVerse: "詩篇",
        paraFmt: function(v, n, t) { return v + "・第" + n + "段（" + t + "）"; },
        onMap: function(name) { return "地圖上顯示「" + name + "」的位置。"; }
      },
      zh_cn: {
        tabPerson: "👤 人物", tabPlace: "🗺️ 地名", tabOffice: "👑 称号", tabSpecial: "🔖 用语",
        searchPh: "搜索人物、地名、称号、用语…", viewMap: "🗺️ 查看地图", back: "← 返回索引列表",
        open: "📖 在本篇打开", source: "📜 显示英文底本", noMatch: "没有符合的项目。",
        noRec: "目前公开范围内尚无相关正文卡片。", startVol: "📖 阅读本篇",
        typeProse: "正文", typeVerse: "诗篇",
        paraFmt: function(v, n, t) { return v + "・第" + n + "段（" + t + "）"; },
        onMap: function(name) { return "地图上显示「" + name + "」的位置。"; }
      },
      ko: {
        tabPerson: "👤 인물", tabPlace: "🗺️ 지명", tabOffice: "👑 칭호", tabSpecial: "🔖 용어",
        searchPh: "인물·지명·칭호·용어 검색…", viewMap: "🗺️ 지도 보기", back: "← 색인 목록으로 돌아가기",
        open: "📖 본편에서 열기", source: "📜 영문 저본 보기", noMatch: "해당하는 항목이 없습니다.",
        noRec: "현재 공개 범위에는 해당하는 본문 카드가 아직 없습니다.", startVol: "📖 본편 읽기",
        typeProse: "본문", typeVerse: "시편",
        paraFmt: function(v, n, t) { return v + "・제" + n + "단락(" + t + ")"; },
        onMap: function(name) { return "지도에 「" + name + "」의 위치를 표시하고 있습니다."; }
      }
    };

    const glossQueryParams = new URLSearchParams(window.location.search);
    const glossQueryLang = glossQueryParams.get("lang");
    let currentLang = "ja";
    if (glossQueryLang && SUPPORTED_LANGS.indexOf(glossQueryLang) >= 0) {
      currentLang = glossQueryLang;
    } else {
      try {
        const savedLang = localStorage.getItem(LANG_STORAGE_KEY);
        if (savedLang && SUPPORTED_LANGS.indexOf(savedLang) >= 0) currentLang = savedLang;
      } catch (e) {}
    }

    // 言語別の項目表示名：本文タグ {{kind:キー|表示語}} の表示語（各言語の最初の出現）から構築する
    const LOCAL_NAMES = {};
    function buildLocalNames() {
      CORPUS_RECORDS.forEach(function(rec) {
        SUPPORTED_LANGS.forEach(function(lg) {
          const src = String(rec[LANG_TAGGED_FIELD[lg]] || "");
          let m;
          TAG_REGEX.lastIndex = 0;
          while ((m = TAG_REGEX.exec(src)) !== null) {
            const id = m[1] + ":" + m[2];
            if (!LOCAL_NAMES[id]) LOCAL_NAMES[id] = {};
            if (!LOCAL_NAMES[id][lg]) LOCAL_NAMES[id][lg] = m[3];
          }
        });
      });
    }

    // 表示名：日本語は従来表記、他言語は本文タグの表示語（未登録時のみ日本語へ安全にフォールバック）
    function localName(kind, key) {
      const byLang = LOCAL_NAMES[kind + ":" + key];
      if (currentLang !== "ja" && byLang && byLang[currentLang]) return byLang[currentLang];
      if (kind === "person" && PERSON_GLOSSARY[key]) return PERSON_GLOSSARY[key].display_name || key;
      return key;
    }

    // 言語別の肩書き（role_i18n）・解説（desc_i18n）：未登録時のみ日本語へ安全にフォールバック
    function masterOf(kind, key) {
      return kind === "person" ? PERSON_GLOSSARY[key]
        : (kind === "place" ? PLACES_MASTER[key] : (kind === "office" ? OFFICE_GLOSSARY[key] : SPECIAL_GLOSSARY[key]));
    }
    function roleOf(kind, key) {
      const d = masterOf(kind, key);
      if (!d || !d.role_i18n) return "";
      return d.role_i18n[currentLang] || d.role_i18n.ja || "";
    }
    function descOf(kind, key) {
      const d = masterOf(kind, key);
      if (!d || !d.desc_i18n) return "";
      return d.desc_i18n[currentLang] || d.desc_i18n.ja || "";
    }
    // チップ副表示用の短い属性（「／」または「 / 」より前だけ）
    function shortRoleOf(kind, key) {
      return roleOf(kind, key).split("／")[0].split(" / ")[0].trim();
    }

    // ハングル音節 → 初声グループ（Unicode: 0xAC00 起点、初声1文字あたり588音節、全11172音節）
    const HANGUL_SYLLABLE_BASE = 0xAC00;
    const HANGUL_SYLLABLES_PER_INITIAL = 588;
    const HANGUL_SYLLABLE_COUNT = 11172;
    const KO_INITIAL_GROUP = ["ㄱ","ㄱ","ㄴ","ㄷ","ㄷ","ㄹ","ㅁ","ㅂ","ㅂ","ㅅ","ㅅ","ㅇ","ㅈ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    const KO_GROUP_ORDER = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","#"];
    const KO_INITIAL_FALLBACK = "#";

    function buildCategoryEntries(cat) {
      const items = [];
      const master = cat === "person" ? PERSON_GLOSSARY
        : (cat === "place" ? PLACES_MASTER : (cat === "office" ? OFFICE_GLOSSARY : SPECIAL_GLOSSARY));
      Object.keys(master).forEach(function(k) {
        const d = master[k];
        const baseName = localName(cat, k);
        const role = roleOf(cat, k);
        // 人物は日本語と同じく「名前（肩書き）」のリッチ表示（他言語も同一情報量）
        let label = baseName;
        if (cat === "person" && currentLang !== "ja" && role) {
          label = currentLang === "en" ? baseName + " (" + role + ")" : baseName + "（" + role + "）";
        }
        const names = LOCAL_NAMES[cat + ":" + k] || {};
        const allNames = Object.keys(names).map(function(lg) { return names[lg]; }).join(" ");
        const allRoles = d.role_i18n ? Object.keys(d.role_i18n).map(function(lg) { return d.role_i18n[lg]; }).join(" ") : "";
        const allDescs = d.desc_i18n ? Object.keys(d.desc_i18n).map(function(lg) { return d.desc_i18n[lg]; }).join(" ") : "";
        items.push({
          kind: cat,
          key: k,
          label: label,
          sortName: baseName,
          sortKey: (d.sort_key_i18n && d.sort_key_i18n[currentLang]) || "",
          subText: shortRoleOf(cat, k),
          yomi: d.yomi || k,
          searchBlob: (k + " " + label + " " + allNames + " " + allRoles + " " + allDescs + " " + (d.display_name || "") + " " +
            (d.name || "") + " " + (d.title || "") + " " + (d.yomi || "") + " " + (d.ai_desc || "") + " " + (d.label || "") + " " + (d.modern || "")).toLowerCase()
        });
      });

      items.sort(function(a, b) {
        if (currentLang === "ja") {
          return normalizeYomiForSort(a.yomi).localeCompare(normalizeYomiForSort(b.yomi), "ja");
        }
        if (currentLang === "zh_tw" || currentLang === "zh_cn") {
          if (a.sortKey !== b.sortKey) return a.sortKey.localeCompare(b.sortKey);
        }
        return String(a.sortName).toLowerCase().localeCompare(String(b.sortName).toLowerCase(), LANG_SORT_LOCALE[currentLang]);
      });
      return items;
    }

    let currentCategory = "person";
    let selectedKind = "";
    let selectedKey = "";

    function getGroupHeading(it) {
      if (currentLang === "ja") return getGojuonRowHeading(it.yomi);
      if (currentLang === "en") {
        const c = String(it.sortName).charAt(0).toUpperCase();
        return (c >= "A" && c <= "Z") ? c : "#";
      }
      if (currentLang === "zh_tw" || currentLang === "zh_cn") {
        // 辞書側 sort_key_i18n（ピンイン頭文字）でグループ化
        const c = String(it.sortKey).charAt(0).toUpperCase();
        return (c >= "A" && c <= "Z") ? c : "#";
      }
      if (currentLang === "ko") {
        const idx = String(it.sortName).charCodeAt(0) - HANGUL_SYLLABLE_BASE;
        if (idx >= 0 && idx < HANGUL_SYLLABLE_COUNT) {
          return KO_INITIAL_GROUP[Math.floor(idx / HANGUL_SYLLABLES_PER_INITIAL)];
        }
        return KO_INITIAL_FALLBACK;
      }
      return "";
    }

    function renderIndexChips() {
      const dict = GLOSS_I18N[currentLang] || GLOSS_I18N.ja;
      const q = searchInputEl.value.trim().toLowerCase();
      const entries = buildCategoryEntries(currentCategory).filter(function(item) {
        return !q || item.searchBlob.includes(q);
      });

      const grouped = {};
      const order = [];
      entries.forEach(function(it) {
        const g = getGroupHeading(it);
        if (!grouped[g]) { grouped[g] = []; order.push(g); }
        grouped[g].push(it);
      });
      let rowOrder = order;
      if (currentLang === "ja") {
        rowOrder = ["あ行","か行","さ行","た行","な行","は行","ま行","や行","ら行","わ行","その他"];
      } else if (currentLang === "ko") {
        rowOrder = KO_GROUP_ORDER;
      } else {
        rowOrder = order.slice().sort(function(a, b) {
          if (a === "#") return 1;
          if (b === "#") return -1;
          return a.localeCompare(b);
        });
      }

      const htmlParts = [];
      rowOrder.forEach(function(rowName) {
        const arr = grouped[rowName];
        if (!arr || arr.length === 0) return;
        htmlParts.push('<div class="gojuon-group-heading">' + escapeHtml(rowName) + '</div>');
        htmlParts.push('<div class="chips-grid">');
        arr.forEach(function(it) {
          const selCls = (it.kind === selectedKind && it.key === selectedKey) ? " is-selected" : "";
          // 日本語は読み仮名、他言語は短い肩書き（人物は名前と肩書きを併記済みのため副表示なし）
          let subHtml = "";
          if (currentLang === "ja") {
            subHtml = '<span class="chip-yomi">' + escapeHtml(it.yomi) + '</span>';
          } else if (it.kind !== "person" && it.subText) {
            subHtml = '<span class="chip-yomi">' + escapeHtml(it.subText) + '</span>';
          }
          htmlParts.push(
            '<button type="button" class="index-chip' + selCls + '" ' +
            'data-chip-kind="' + escapeHtml(it.kind) + '" data-chip-key="' + escapeHtml(it.key) + '">' +
            escapeHtml(it.label) + subHtml + '</button>'
          );
        });
        htmlParts.push('</div>');
      });

      chipsScrollEl.innerHTML = htmlParts.length > 0
        ? htmlParts.join("")
        : '<div style="padding:14px;color:#6b5c4c;font-size:0.84rem;">' + escapeHtml(dict.noMatch) + '</div>';
    }

    document.querySelectorAll(".cat-tab-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        currentCategory = btn.getAttribute("data-cat");
        syncCatTabButtons();
        renderIndexChips();
      });
    });

    searchInputEl.addEventListener("input", function() {
      renderIndexChips();
    });

    chipsScrollEl.addEventListener("click", function(ev) {
      const baseTarget = (ev.target && ev.target.nodeType === 1) ? ev.target : (ev.target ? ev.target.parentElement : null);
      if (!baseTarget) return;
      const chip = baseTarget.closest("[data-chip-key]");
      if (!chip) return;
      const kind = chip.getAttribute("data-chip-kind");
      const key = chip.getAttribute("data-chip-key");
      selectGlossaryEntry(kind, key, true);
    });

    // =========================================================================
    // 右ペイン：解説サマリー＋該当本文カードレンダリング（スクロール連動なし）
    // =========================================================================
    const TAG_REGEX = /\{\{(place|person|office|special):([^|}]+)\|([^}]+)\}\}/g;
    const headSummaryContainerEl = document.getElementById("headSummaryContainer");
    const matchingRecordsContainerEl = document.getElementById("matchingRecordsContainer");
    const recordsScrollEl = document.getElementById("recordsScroll");

    function recordContainsTag(rec, targetKind, targetKey) {
      const text = SUPPORTED_LANGS.map(function(lg) { return rec[LANG_TAGGED_FIELD[lg]] || ""; }).join(" ");
      let m;
      TAG_REGEX.lastIndex = 0;
      while ((m = TAG_REGEX.exec(text)) !== null) {
        if (m[1] === targetKind && m[2] === targetKey) return true;
      }
      return false;
    }

    function convertTaggedTextWithHighlight(taggedStr, targetKind, targetKey) {
      const src = String(taggedStr || "");
      let result = "";
      let lastIdx = 0;
      let match;
      TAG_REGEX.lastIndex = 0;
      while ((match = TAG_REGEX.exec(src)) !== null) {
        result += escapeHtml(src.slice(lastIdx, match.index));
        const kind = match[1];
        const key = match[2];
        const surface = match[3];
        const hitCls = (kind === targetKind && key === targetKey) ? " matched-target-term" : "";
        result += (
          '<span class="inline-' + escapeHtml(kind) + hitCls + '" ' +
          'data-tag-kind="' + escapeHtml(kind) + '" data-tag-key="' + escapeHtml(key) + '">' +
          escapeHtml(surface) + '</span>'
        );
        lastIdx = TAG_REGEX.lastIndex;
      }
      result += escapeHtml(src.slice(lastIdx));
      return result;
    }

    function selectGlossaryEntry(kind, key, hideOverlayFlag, refreshOnly) {
      const dict = GLOSS_I18N[currentLang] || GLOSS_I18N.ja;
      selectedKind = kind;
      selectedKey = key;
      renderIndexChips();

      if (hideOverlayFlag) {
        setIndexOverlayVisible(false);
      }

      let titleStr = localName(kind, key);
      let badgeStr = "";
      let descStr = "";
      let homonyms = [];

      if (kind === "place" && PLACES_MASTER[key]) {
        const p = PLACES_MASTER[key];
        if (currentLang === "ja") titleStr = p.label || key;
        badgeStr = p.category + (p.modern ? " ／ " + p.modern : "");
        descStr = dict.onMap(localName("place", key));
        if (!refreshOnly) mapCtrl.focusPlace(key, key, true);
      } else if (kind === "person" && PERSON_GLOSSARY[key]) {
        const d = PERSON_GLOSSARY[key];
        if (currentLang === "ja") titleStr = d.name || key;
        badgeStr = d.role || "";
        descStr = d.ai_desc || "";
        homonyms = Array.isArray(d.homonyms) ? d.homonyms : [];
      } else if (kind === "office" && OFFICE_GLOSSARY[key]) {
        const d = OFFICE_GLOSSARY[key];
        if (currentLang === "ja") titleStr = d.title || key;
        badgeStr = d.rank || "";
        descStr = d.ai_desc || "";
      } else if (kind === "special" && SPECIAL_GLOSSARY[key]) {
        const d = SPECIAL_GLOSSARY[key];
        if (currentLang === "ja") titleStr = d.title || key;
        badgeStr = d.mapping_note || "";
        descStr = d.ai_desc || "";
      }

      // 肩書きバッジ・解説文は選択言語の role_i18n / desc_i18n を優先（未登録時のみ従来の日本語）
      const i18nRole = roleOf(kind, key);
      const i18nDesc = descOf(kind, key);
      if (i18nRole) badgeStr = i18nRole;
      if (i18nDesc) descStr = i18nDesc;

      // 詳細ビュー：必ず最上部に [← 索引一覧に戻る] を表示（解説はマスター辞書のみ・外部API取得枠なし）
      const summaryParts = ['<div class="head-summary-card">'];
      summaryParts.push('<button type="button" class="back-to-index-btn" id="backToIndexBtn">' + escapeHtml(dict.back) + '</button>');
      if (kind === "person" && homonyms.length > 0) {
        const allH = [key].concat(homonyms);
        summaryParts.push('<div class="homonym-switch-bar">');
        summaryParts.push('<span style="font-size:0.74rem;font-weight:700;width:100%;">👥 </span>');
        allH.forEach(function(hk) {
          const hd = PERSON_GLOSSARY[hk];
          if (!hd) return;
          const cur = hk === key ? " is-current" : "";
          summaryParts.push(
            '<button type="button" class="homonym-btn' + cur + '" data-homonym-key="' + escapeHtml(hk) + '">' +
            escapeHtml(localName("person", hk)) + '</button>'
          );
        });
        summaryParts.push('</div>');
      }

      summaryParts.push('<div class="summary-title">' + escapeHtml(titleStr) + '</div>');
      if (badgeStr) {
        summaryParts.push('<div class="summary-role-badge">' + escapeHtml(badgeStr) + '</div>');
      }
      summaryParts.push('<div class="summary-desc">' + escapeHtml(descStr) + '</div>');
      summaryParts.push('</div>');
      headSummaryContainerEl.innerHTML = summaryParts.join("");

      const matchedRecs = CORPUS_RECORDS.filter(function(rec) {
        return recordContainsTag(rec, kind, key);
      });

      if (matchedRecs.length === 0) {
        matchingRecordsContainerEl.innerHTML = '<div class="record-card">' + escapeHtml(dict.noRec) + '</div>';
        if (kind !== "place" && !refreshOnly) {
          mapCtrl.renderOverviewProvinces();
        }
      } else {
        matchingRecordsContainerEl.innerHTML = matchedRecs.map(function(rec) {
          const jumpHref = rec.vol_file + "?para=" + rec.para_index + "&rec=" + encodeURIComponent(rec.id) + "&lang=" + currentLang;
          const volLabel = (rec.vol_short_label_i18n && rec.vol_short_label_i18n[currentLang]) || rec.vol_short_label;
          const typeLabel = rec.type === "詩篇" ? dict.typeVerse : dict.typeProse;
          const mainTagged = rec[LANG_TAGGED_FIELD[currentLang]] || rec.translation_tagged;
          const sourceHtml = currentLang === "en" ? "" : (
            '<details class="source-details" open>' +
              '<summary>' + escapeHtml(dict.source) + '</summary>' +
              '<div class="source-text-body">' + convertTaggedTextWithHighlight(rec.raw_tagged, kind, key) + '</div>' +
            '</details>'
          );
          return (
            '<article class="record-card" data-rec-id="' + escapeHtml(rec.id) + '">' +
              '<div class="card-meta-bar">' +
                '<strong>' + escapeHtml(dict.paraFmt(volLabel, rec.para_index, typeLabel)) + '</strong>' +
                '<a class="open-in-vol-link" href="' + escapeHtml(jumpHref) + '">' + escapeHtml(dict.open) + '</a>' +
              '</div>' +
              '<div class="trans-box">' + convertTaggedTextWithHighlight(mainTagged, kind, key) + '</div>' +
              sourceHtml +
            '</article>'
          );
        }).join("");

        // 人物・称号・用語選択時は関連カードの地点丸ピンのみを描画（勝手な地図中心移動は行わない）
        if (kind !== "place" && !refreshOnly) {
          mapCtrl.renderPlaceKeys(collectPlaceKeysFromCorpusRecords(matchedRecs), false);
        }
      }

      recordsScrollEl.scrollTop = 0;
    }

    // 詳細ビューから索引一覧へ戻る（検索をクリアして一覧オーバーレイを再表示）
    function returnToIndexList() {
      searchInputEl.value = "";
      setIndexOverlayVisible(true);
      renderIndexChips();
      chipsScrollEl.scrollTop = 0;
    }

    // 言語切替：UI文言・ナビバー・索引・詳細・地図ピン表示名を一括更新
    function applyGlossaryLang() {
      const dict = GLOSS_I18N[currentLang] || GLOSS_I18N.ja;
      document.documentElement.lang = currentLang === "zh_tw" ? "zh-Hant" : (currentLang === "zh_cn" ? "zh-Hans" : currentLang);
      searchInputEl.placeholder = dict.searchPh;
      hideIndexViewMapBtn.textContent = dict.viewMap;
      const tabText = { person: dict.tabPerson, place: dict.tabPlace, office: dict.tabOffice, special: dict.tabSpecial };
      document.querySelectorAll(".cat-tab-btn").forEach(function(b) {
        b.textContent = tabText[b.getAttribute("data-cat")];
      });
      const startLinkEl = document.getElementById("startVolLink");
      if (startLinkEl) startLinkEl.textContent = dict.startVol;
      document.querySelectorAll("#langSwitchBar .lang-btn").forEach(function(b) {
        b.classList.toggle("is-active", b.getAttribute("data-lang-code") === currentLang);
      });
      if (window.applyNavLang) window.applyNavLang(currentLang);
    }

    function setGlossaryLang(code) {
      currentLang = code;
      try { localStorage.setItem(LANG_STORAGE_KEY, code); } catch (e) {}
      applyGlossaryLang();
      renderIndexChips();
      if (selectedKey) selectGlossaryEntry(selectedKind, selectedKey, false, true);
    }

    headSummaryContainerEl.addEventListener("click", function(ev) {
      if (ev.target.closest("#backToIndexBtn")) {
        returnToIndexList();
        return;
      }
      const hBtn = ev.target.closest("[data-homonym-key]");
      if (hBtn) {
        selectGlossaryEntry("person", hBtn.getAttribute("data-homonym-key"), false);
      }
    });

    // 本文内タグクリック（緑地名は記事一覧を切り替えず読書位置を維持したまま地図だけ移動）
    matchingRecordsContainerEl.addEventListener("click", function(ev) {
      const baseTarget = (ev.target && ev.target.nodeType === 1) ? ev.target : (ev.target ? ev.target.parentElement : null);
      if (!baseTarget) return;
      const tagEl = baseTarget.closest("[data-tag-kind]");
      if (!tagEl) return;
      const kind = tagEl.getAttribute("data-tag-kind");
      const key = tagEl.getAttribute("data-tag-key");
      if (kind === "place") {
        mapCtrl.focusPlace(key, tagEl.textContent || key, true);
      } else {
        currentCategory = kind;
        syncCatTabButtons();
        selectGlossaryEntry(kind, key, true);
      }
    });

    // ナビバー <select> で「索引」を再選択した場合も一覧画面へリセット復帰（同一値でも change が発火するよう開く時に未選択化）
    const volNavSelectEl = document.getElementById("volNavSelect");
    window.arthurNavChange = function(sel) {
      if (sel.value === "glossary.html") {
        returnToIndexList();
        sel.blur();
        return;
      }
      if (sel.value) window.location.href = sel.value;
    };
    if (volNavSelectEl) {
      volNavSelectEl.addEventListener("focus", function() { volNavSelectEl.selectedIndex = -1; });
      volNavSelectEl.addEventListener("blur", function() {
        if (volNavSelectEl.selectedIndex < 0) volNavSelectEl.selectedIndex = 0;
      });
    }

    // 言語ボタン（EN / 日 / 繁 / 簡 / 韓）
    const langSwitchBarEl = document.getElementById("langSwitchBar");
    LANG_BUTTONS.forEach(function(item) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang-btn";
      btn.setAttribute("data-lang-code", item.code);
      btn.textContent = item.label;
      btn.addEventListener("click", function() { setGlossaryLang(item.code); });
      langSwitchBarEl.appendChild(btn);
    });

    // 初期表示：索引パネルは開いたまま、最初の代表人物（ユーサー）を詳細表示
    buildLocalNames();
    applyGlossaryLang();
    renderIndexChips();
    const initialKey = PERSON_GLOSSARY["ユーサー"] ? "ユーサー" : Object.keys(PERSON_GLOSSARY)[0];
    if (initialKey) {
      selectGlossaryEntry("person", initialKey, false);
    }
  })();
  </script>
</body>
</html>
